    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/persons/">人物</a> › 公劉</nav></header><main><article><h1>公劉</h1><p>c.1100 BCE · 周先祖，卜宅於京，依之以立朝廷序宗族</p><h2>所見（6 條）</h2><ul><li><a href="/wiki/%E5%85%AC%E5%8A%89%E5%BE%A9%E4%BF%AE%E5%90%8E%E7%A8%B7/">公劉復修后稷</a> — 公劉在戎狄之間，復修后稷之業，周道自此興焉。</li><li><a href="/wiki/%E4%BA%AC%E5%B8%AB%E4%BE%9D/">京師依</a> — 公劉卜宅於京，依之以立朝廷、序宗族也。</li><li><a href="/wiki/%E6%AD%A2%E6%97%85%E4%B9%83%E5%AF%86/">止旅乃密</a> — 公劉理其基址，定民止居，使疆理廣密也。</li><li><a href="/wiki/%E8%BB%8D%E4%B8%89%E5%96%AE/">軍三單</a> — 公劉度地居民，行三單迭攻之法，以治軍旅也。</li><li><a href="/wiki/%E5%8F%A4%E5%85%AC%E4%BA%B6%E7%88%B6%E5%8E%BB%E8%B1%B3/">古公亶父去豳</a> — 戎狄攻古公，古公以民為重，不忍以戰故殺人，遂去豳，逾梁山，止岐下。</li><li><a href="/wiki/%E5%A4%A9%E5%91%BD%E8%BD%89%E7%A7%BB/">天命轉移</a> — 天命不於常，夏、商淫逸失德，周則受天命以有天下。</li></ul><h2>相關人物</h2><p><a href="/person/%E7%A8%B7/">稷</a>、<a href="/person/%E7%90%86/">理</a>、<a href="/person/%E7%99%BB/">登</a>、<a href="/person/%E5%8F%A4%E5%85%AC%E4%BA%B6%E7%88%B6/">古公亶父</a>、<a href="/person/%E5%91%A8%E5%85%AC/">周公</a>、<a href="/person/%E5%BB%A3/">廣</a></p></article></main></div></div>
