    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/persons/">人物</a> › 向壽</nav></header><main><article><h1>向壽</h1><p>秦臣，與公孫奭挾韓議以讒甘茂</p><h2>所見（4 條）</h2><ul><li><a href="/wiki/%E7%94%98%E8%8C%82/">甘茂</a> — 下蔡人也，事秦惠王、武王、昭王，為左丞相，後奔齊、楚，卒於魏。</li><li><a href="/wiki/%E4%B8%8D%E8%B2%B4%E5%85%B6%E5%B8%AB/">不貴其師</a> — 甘茂為羈旅之臣，得秦重用，而向壽、公孫奭挾韓議之，終為所讒而亡。言不知敬賢，足以召禍。</li><li><a href="/wiki/%E7%A6%BD%E5%9B%B0%E8%A6%86%E8%BB%8A/">禽困覆車</a> — 困獸猶鬪，覆車可傷。言迫之已甚，必圖倖免。</li><li><a href="/wiki/%E7%A9%B0%E4%BE%AF/">穰侯</a> — 秦昭王母弟魏冉，四登相位，封穰益陶，權傾王室，終以專擅見黜。</li></ul><h2>相關人物</h2><p><a href="/person/%E5%A3%BD/">壽</a>、<a href="/person/%E7%94%98%E8%8C%82/">甘茂</a>、<a href="/person/%E5%85%AC%E5%AD%AB%E5%A5%AD/">公孫奭</a>、<a href="/person/%E6%AD%A6%E7%8E%8B/">武王</a>、<a href="/person/%E7%A7%A6%E6%98%AD%E7%8E%8B/">秦昭王</a>、<a href="/person/%E9%99%B6/">陶</a></p></article></main></div></div>
