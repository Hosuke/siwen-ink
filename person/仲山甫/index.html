    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/persons/">人物</a> › 仲山甫</nav></header><main><article><h1>仲山甫</h1><p>8th century BCE · 周宣王之賢臣，尹吉甫詩中所美者也</p><p><a href="/wiki/%E4%BB%B2%E5%B1%B1%E7%94%AB/">觀正傳 →</a></p><h2>所見（7 條）</h2><ul><li><a href="/wiki/%E4%BB%B2%E5%B1%B1%E7%94%AB/">仲山甫</a> — 周宣王之賢臣，尹吉甫詩中所美者也。</li><li><a href="/wiki/%E6%95%AC%E6%85%8E%E7%BF%BC%E7%BF%BC/">敬慎翼翼</a> — 恭敬而慎察，內外兼修之貌。</li><li><a href="/wiki/%E8%A2%9E%E8%81%B7/">袞職</a> — 天子之位有闕，賢臣補之。</li><li><a href="/wiki/%E5%8C%AA%E8%A7%A3/">匪解</a> — 不懈於位，夙夜盡職。</li><li><a href="/wiki/%E5%A4%A9%E7%94%9F%E7%83%9D%E6%B0%91/">天生烝民</a> — 天生眾民，各具彝性，厥德本善。</li><li><a href="/wiki/%E5%BD%8A%E7%A6%A6/">彊禦</a> — 恃強凌弱之徒，仁者不畏。</li><li><a href="/wiki/%E7%9F%9C%E5%AF%A1/">矜寡</a> — 憐孤弱而不侵，仁者之政。</li></ul><h2>相關人物</h2><p><a href="/person/%E5%AE%A3%E7%8E%8B/">宣王</a>、<a href="/person/%E5%B0%B9%E5%90%89%E7%94%AB/">尹吉甫</a>、<a href="/person/%E7%90%86/">理</a></p></article></main></div></div>
