    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/persons/">人物</a> › 公孫奭</nav></header><main><article><h1>公孫奭</h1><p>秦臣，挾韓以讒甘茂</p><h2>所見（3 條）</h2><ul><li><a href="/wiki/%E4%B8%8D%E8%B2%B4%E5%85%B6%E5%B8%AB/">不貴其師</a> — 甘茂為羈旅之臣，得秦重用，而向壽、公孫奭挾韓議之，終為所讒而亡。言不知敬賢，足以召禍。</li><li><a href="/wiki/%E7%94%98%E8%8C%82/">甘茂</a> — 下蔡人也，事秦惠王、武王、昭王，為左丞相，後奔齊、楚，卒於魏。</li><li><a href="/wiki/%E6%81%AF%E5%A3%A4%E5%9C%A8%E5%BD%BC/">息壤在彼</a> — 王與甘茂盟於息壤，茂引以為信，終遂拔宜陽。言約誓既定，不可自渝。</li></ul><h2>相關人物</h2><p><a href="/person/%E7%94%98%E8%8C%82/">甘茂</a>、<a href="/person/%E6%AD%A6%E7%8E%8B/">武王</a>、<a href="/person/%E5%90%91%E5%A3%BD/">向壽</a>、<a href="/person/%E5%A3%BD/">壽</a>、<a href="/person/%E7%A7%A6%E6%98%AD%E7%8E%8B/">秦昭王</a></p></article></main></div></div>
