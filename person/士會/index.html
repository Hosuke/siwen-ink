    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/persons/">人物</a> › 士會</nav></header><main><article><h1>士會</h1><p>c.6th century BCE · 晉大夫，三進及溜以諫</p><h2>所見（4 條）</h2><ul><li><a href="/wiki/%E4%B8%89%E9%80%B2%E5%8F%8A%E6%BA%9C/">三進及溜</a> — 士會進諫，退而待命，三至簷下乃蒙見察。</li><li><a href="/wiki/%E7%82%BA%E5%90%8C%E5%AF%AE%E6%95%85%E4%B9%9F/">為同寮故也</a> — 荀林父送先蔑之帑於秦，曰「為同寮故也」，士會在秦三年不見。</li><li><a href="/wiki/%E6%99%89%E4%BA%BA%E5%8F%8A%E7%A7%A6%E4%BA%BA%E6%88%B0%E4%BA%8E%E4%BB%A4%E7%8B%90/">晉人及秦人戰于令狐</a> — 秦送公子雍，晉背之迎戰，先蔑奔秦，士會從之。</li><li><a href="/wiki/%E5%B0%BA%E7%89%98%E6%9B%B8%E7%BF%B0%E4%B9%8B%E8%B5%B7/">尺牘書翰之起</a> — 書記之文，昉於春秋，盛於兩漢。</li></ul><h2>相關人物</h2><p><a href="/person/%E6%96%87%E5%85%AC/">文公</a></p></article></main></div></div>
