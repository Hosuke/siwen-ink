    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/persons/">人物</a> › 侯嬴</nav></header><main><article><h1>侯嬴</h1><p>4th century BCE · 魏隱士，說公子以肉投餒虎</p><h2>所見（6 條）</h2><ul><li><a href="/wiki/%E4%BB%A5%E8%82%89%E6%8A%95%E9%A4%92%E8%99%8E/">以肉投餒虎</a> — 侯嬴以此喻公子欲以空手赴秦軍，必無功。</li><li><a href="/wiki/%E5%8C%97%E9%84%89%E8%87%AA%E5%89%84/">北鄉自剄</a> — 侯嬴與信陵君約，至軍之日，北向自剄以送公子。</li><li><a href="/wiki/%E5%A4%B7%E9%96%80%E6%8A%B1%E9%97%9C/">夷門抱關</a> — 侯嬴自稱其為大梁夷門守門之人，以喻微賤。</li><li><a href="/wiki/%E7%AB%8A%E7%AC%A6%E6%95%91%E8%B6%99/">竊符救趙</a> — 侯嬴獻計，如姬盜取晉鄙兵符，使信陵君奪兵救趙。</li><li><a href="/wiki/%E4%BF%A1%E9%99%B5%E4%B8%8B%E5%A3%AB/">信陵下士</a> — 索隱述贊言信陵君下士接賢，故諸侯不敢加兵。</li><li><a href="/wiki/%E4%BF%A1%E9%99%B5%E5%90%9B/">信陵君</a></li></ul></article></main></div></div>
