    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/persons/">人物</a> › 尹吉甫</nav></header><main><article><h1>尹吉甫</h1><p>8th century BCE · 周宣王賢臣，詩美仲山甫</p><h2>所見（5 條）</h2><ul><li><a href="/wiki/%E4%BB%B2%E5%B1%B1%E7%94%AB/">仲山甫</a> — 周宣王之賢臣，尹吉甫詩中所美者也。</li><li><a href="/wiki/%E8%83%BD%E8%88%88%E8%A1%B0%E6%92%A5%E4%BA%82/">能興衰撥亂</a> — 尹吉甫美宣王之辭，謂能興起衰微、扭轉危亂。</li><li><a href="/wiki/%E6%96%87%E6%AD%A6%E5%90%89%E7%94%AB/">文武吉甫</a> — 吉甫兼備文德武功，為萬邦之則。</li><li><a href="/wiki/%E5%90%89%E7%94%AB%E7%87%95%E5%96%9C/">吉甫燕喜</a> — 凱旋燕飲，慶功之樂。</li><li><a href="/wiki/%E7%9F%A2%E8%A9%A9%E4%B8%8D%E5%A4%9A/">矢詩不多</a> — 詩辭不多，誠意則盛。</li></ul><h2>相關人物</h2><p><a href="/person/%E5%AE%A3%E7%8E%8B/">宣王</a>、<a href="/person/%E4%BB%B2%E5%B1%B1%E7%94%AB/">仲山甫</a>、<a href="/person/%E5%91%A8%E5%85%AC/">周公</a>、<a href="/person/%E7%90%86/">理</a></p></article></main></div></div>
