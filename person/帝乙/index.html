    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/persons/">人物</a> › 帝乙</nav></header><main><article><h1>帝乙</h1><p>c.1101-1100 BCE · 商代天子，歸妹於周</p><h2>所見（6 條）</h2><ul><li><a href="/wiki/%E5%B8%9D%E4%B9%99%E6%AD%B8%E5%A6%B9/">帝乙歸妹，其君之袂，不如其娣之袂良，月幾望，吉</a> — 帝乙嫁女與諸侯，諸侯夫人衣飾不及娣，然居中履正，以貴行之，吉。</li><li><a href="/wiki/%E4%BB%A5%E8%B2%B4%E8%A1%8C/">以貴行</a> — 帝乙歸妹，居中履正，以尊貴之德行之。</li><li><a href="/wiki/%E5%8A%89%E6%A0%B9/">劉根</a> — 令見鬼，-{授}-棗核中仁，後-{為}-大洞帝乙之道。</li><li><a href="/wiki/%E5%BE%AE%E5%AD%90/">微子</a></li><li><a href="/wiki/%E6%9C%88%E5%B9%BE%E6%9C%9B/">月幾望</a> — 月近滿盈則陰犯陽之象。</li><li><a href="/wiki/%E6%A5%8A%E7%BE%B2/">楊羲</a> — 晉真人，受上清經籙，佐東華為上佐</li></ul><h2>相關人物</h2><p><a href="/person/%E7%B4%82/">紂</a>、<a href="/person/%E6%96%87%E7%8E%8B/">文王</a></p></article></main></div></div>
