    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/persons/">人物</a> › 伯嚭</nav></header><main><article><h1>伯嚭</h1><p>吳太宰，越滅吳後受誅，以為不忠</p><h2>所見（6 條）</h2><ul><li><a href="/wiki/%E4%BC%AF%E5%9A%AD%E5%8F%97%E8%AA%85/">伯嚭受誅</a> — 越王滅吳，誅太宰伯嚭，以為不忠</li><li><a href="/wiki/%E5%8F%A5%E8%B8%90%E6%BB%85%E5%90%B3/">句踐滅吳</a> — 越王句踐圍吳三年，吳王夫差自剄死，越王滅吳誅伯嚭</li><li><a href="/wiki/%E9%97%94%E5%BB%AC%E4%BC%90%E6%A5%9A%E5%85%A5%E9%83%A2/">闔廬伐楚入郢</a> — 吳王闔廬與伍子胥、孫武伐楚，五戰而楚敗，吳兵入郢</li><li><a href="/wiki/%E5%90%B3%E7%8E%8B%E9%97%94%E5%BB%AC/">吳王闔廬</a> — 任伍員孫武，破楚入郢，霸諸侯，後敗於越傷指而亡。</li><li><a href="/wiki/%E5%90%B3%E5%A4%AA%E4%BC%AF%E4%B8%96%E5%AE%B6/">吳太伯世家</a> — 總述吳國自太伯至夫差之世系與興亡</li><li><a href="/wiki/%E5%90%B3%E7%8E%8B%E5%A4%AB%E5%B7%AE/">吳王夫差</a> — 報越仇而霸諸侯，誅忠臣而信佞讒，卒亡於越。</li></ul><h2>相關人物</h2><p><a href="/person/%E4%BC%8D%E5%AD%90%E8%83%A5/">伍子胥</a>、<a href="/person/%E6%96%87%E7%8E%8B/">文王</a>、<a href="/person/%E6%B9%AF/">湯</a></p></article></main></div></div>
