    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/persons/">人物</a> › 昊猛</nav></header><main><article><h1>昊猛</h1><p>c.3rd-5th century CE · 六朝時人，與了然子友善</p><h2>所見（4 條）</h2><ul><li><a href="/wiki/%E4%BA%86%E7%84%B6%E5%AD%90/">了然子</a> — 遼東人，出入虎豹，周遊三楚百餘年，友善昊猛、陸修靜、郭璞、謝靈運之屬。</li><li><a href="/wiki/%E6%98%8A%E5%90%9B/">昊君</a> — 昊猛從許遜學道，共誅蟒斬蛟，位玄都御史。</li><li><a href="/wiki/%E5%90%B3%E7%8C%9B%E5%B8%AB%E8%A8%B1%E9%81%9C/">吳猛師許遜</a> — 昊猛先為許遜師，後傳孝道明王法，乃返師許遜。</li><li><a href="/wiki/%E8%A8%B1%E5%A4%AA%E5%8F%B2/">許太史</a> — 記晉旌陽令許遜得道事跡。</li></ul><h2>相關人物</h2><p><a href="/person/%E9%83%AD%E7%92%9E/">郭璞</a>、<a href="/person/%E4%BA%86%E7%84%B6%E5%AD%90/">了然子</a>、<a href="/person/%E9%99%B8%E4%BF%AE%E9%9D%9C/">陸修靜</a>、<a href="/person/%E8%AC%9D%E9%9D%88%E9%81%8B/">謝靈運</a>、<a href="/person/%E7%90%86/">理</a></p></article></main></div></div>
