    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/persons/">人物</a> › 孟孫陽</nav></header><main><article><h1>孟孫陽</h1><p>辯士，以一毛、肌膚、肢節之喻反駁禽子</p><h2>所見（3 條）</h2><ul><li><a href="/wiki/%E5%AD%9F%E5%AD%AB%E9%99%BD%E5%95%8F%E6%A5%8A%E6%9C%B1/">孟孫陽問楊朱</a> — 孟孫陽問貴生愛身以蘄不死可乎，楊朱答以理無不死、無久生，既生則任之俟死，死則任之俟盡，無不廢無不任。</li><li><a href="/wiki/%E4%B8%80%E6%AF%9B%E5%BE%AE%E6%96%BC%E8%82%8C%E8%86%9A/">一毛微於肌膚</a> — 孟孫陽以一毛積為肌膚、肌膚積為一節之喻，反駁禽子「去一毛以濟世」之說。</li><li><a href="/wiki/%E5%A4%9A%E6%AD%A7%E4%BA%A1%E7%BE%8A/">多歧亡羊</a></li></ul><h2>相關人物</h2><p><a href="/person/%E6%A5%8A%E6%9C%B1/">楊朱</a>、<a href="/person/%E7%90%86/">理</a></p></article></main></div></div>
