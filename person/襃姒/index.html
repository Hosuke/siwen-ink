    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/persons/">人物</a> › 襃姒</nav></header><main><article><h1>襃姒</h1><p>8th century BCE · 襃國女子，幽王寵妃</p><h2>所見（3 條）</h2><ul><li><a href="/wiki/%E4%BB%A5%E5%A6%BE%E7%82%BA%E5%A6%BB%E4%BB%A5%E5%AD%BD%E4%BB%A3%E5%AE%97/">以妾為妻以孽代宗</a> — 幽王黜申后、立襃姒，壞嫡庶之序，亂宗法之正也。</li><li><a href="/wiki/%E5%91%A8%E4%BA%BA%E5%88%BA%E5%B9%BD%E5%90%8E/">周人刺幽后</a> — 周人刺幽王黜后之詩，傷嫡妾失序，以寓諷諫也。</li><li><a href="/wiki/%E7%99%BD%E8%8F%AF/">白華</a> — 白茅為禮，菅草為詩，言后妃被黜、貞操自守也。</li></ul><h2>相關人物</h2><p><a href="/person/%E7%94%B3%E5%90%8E/">申后</a></p></article></main></div></div>
