    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/persons/">人物</a> › 宋萬</nav></header><main><article><h1>宋萬</h1><p>宋國大夫，弒閔公</p><h2>所見（3 條）</h2><ul><li><a href="/wiki/%E4%BB%87%E7%89%A7%E6%89%B9%E6%AE%BA%E5%AE%8B%E8%90%AC/">仇牧批殺宋萬</a> — 宋萬弒閔公，仇牧遇之於門，批而殺之，忠臣不避死亡以衛其君。</li><li><a href="/wiki/%E4%BB%87%E7%89%A7%E4%B8%8D%E7%95%8F%E5%BC%B7%E7%A6%A6/">仇牧不畏強禦</a> — 宋萬弒君，仇牧聞難而至，手劍叱之，遂遇害，君子賢之。</li><li><a href="/wiki/%E5%A4%A7%E5%A4%AB%E5%BC%92%E5%90%9B%E4%BB%A5%E5%9C%8B%E6%B0%8F/">大夫弒君以國氏</a> — 大夫弒君而以國氏者，嫌也。弒而代之，其心不可測。</li></ul><h2>相關人物</h2><p><a href="/person/%E4%BB%87%E7%89%A7/">仇牧</a>、<a href="/person/%E8%8E%8A%E5%85%AC/">莊公</a>、<a href="/person/%E8%8D%80%E6%81%AF/">荀息</a>、<a href="/person/%E9%96%94%E5%85%AC/">閔公</a></p></article></main></div></div>
