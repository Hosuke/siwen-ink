    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/classics/">Classics</a> › 尹文子</nav></header><main><article><h1>尹文子</h1><p>4 fascicles</p><ul><li><a href="/en/classics/wikisource-%E5%B0%B9%E6%96%87%E5%AD%90-%E5%A4%A7%E9%81%93%E4%B8%8A/">大道上</a></li><li><a href="/en/classics/wikisource-%E5%B0%B9%E6%96%87%E5%AD%90-%E5%A4%A7%E9%81%93%E4%B8%8B/">大道下</a></li><li><a href="/en/classics/wikisource-%E5%B0%B9%E6%96%87%E5%AD%90-%E4%BD%9A%E6%96%87/">佚文</a></li><li><a href="/en/classics/wikisource-%E5%B0%B9%E6%96%87%E5%AD%90-%E5%BA%8F/">序</a></li></ul><p>尹文子者，蓋出於周之尹氏；齊宣王時居稷下，與宋鈃彭蒙田駢，同學於公孫龍；公孫龍稱之。著書一篇，多所彌綸。莊子曰︰「不累於俗，不飾於物，不苛於人，不忮於眾；願天下之安寧，以活民命，人我之養，畢足而止，以此白心，見侮不辱，」此其道也。而劉向亦以其學本於黃老，大較刑名家也；近為誣矣。余黃初本始到京師，繆熙伯以此書見示，意甚玩之。而多說誤，聊試條次，撰定為上下篇，亦未能究其詳也。</p><p>山陽仲長氏撰定。</p></article></main></div></div>
