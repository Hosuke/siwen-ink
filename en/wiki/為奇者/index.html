    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 為奇者</nav></header><main><article><h1>為奇者</h1><p>為邪者殺之，以制惑亂。</p><p>「而為奇者，吾得執而殺之」者，言人有為邪僻奇詭之行，亂法敗紀者，則有司執而誅之。此代司殺者之職也。</p><p>夫奇者，不正之名。民不畏死而猶有為奇者，則天網恢恢，疏而不漏，是以執而殺之，孰敢不服哉？</p><p><strong>所出</strong>：《老子河上公章句 · 制惑》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
