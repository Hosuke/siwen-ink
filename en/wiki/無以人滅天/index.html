    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 無以人滅天</nav></header><main><article><h1>無以人滅天</h1><p>人為之事不可毀天然之性，當順物之自然而返其真。</p><p>北海若論天人之別曰：「牛馬四足，是謂天；落馬首，穿牛鼻，是謂人。」又云：「無以人滅天，無以故滅命，無以得殉名。謹守而勿失，是謂反其真。」</p><p><strong>所出</strong>：《莊子 · 秋水》 — https://zh.wikisource.org/wiki/莊子/秋水</p></article></main></div></div>
