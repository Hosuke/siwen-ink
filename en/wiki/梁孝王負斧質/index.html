    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 梁孝王負斧質</nav></header><main><article><h1>梁孝王負斧質</h1><p>梁王匿不得見，太后泣，以為帝殺其子，王乃負斧質謝罪。</p><p>梁王匿於長公主園，車騎盡居外，太后泣曰：「帝殺吾子！」景帝憂恐。</p><p>於是梁王伏斧質於闕下，謝罪，然後太后、景帝大喜，相泣，復如故。悉召王從官入關。然景帝益疏王，不同車輦矣。</p><p><strong>所出</strong>：《史記 · 卷058》 — https://zh.wikisource.org/wiki/史記/卷058</p></article></main></div></div>
