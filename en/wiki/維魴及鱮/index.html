    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 維魴及鱮</nav></header><main><article><h1>維魴及鱮</h1><p>魴與鱮，水族之美，以起興夫婦相得之樂。</p><p>維魴及鱮，薄言觀者。魴，白魚也；鱮，鰱也。皆水中之美味者。詩人於想像中陪君子垂釣，因言所釣者維魴與鱮耳，非有他也。而欣然以觀之為樂，蓋得與君子同樂，即魚之美亦不足道矣。觀者，視之也。共觀其獲，此閨房伉儷之樂也。</p><p><strong>所出</strong>：《詩經 · 采綠》 — https://zh.wikisource.org/wiki/詩經/采綠</p></article></main></div></div>
