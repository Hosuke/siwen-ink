    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 荐车直东荣北辀</nav></header><main><article><h1>荐车直东荣北辀</h1><p>質明，陳荐馬匹于廟門之外。</p><p>質明，滅燭。彻者升自阼階，降自西階。荐車直東榮，北輈。荐馬，纓三就，入門，北面，交轡，圉人夾牽之。御者執策立于馬後。哭成踊，右還，出。</p><p><strong>所出</strong>：《儀禮 · 既夕禮》 — https://zh.wikisource.org/wiki/儀禮/既夕禮</p></article></main></div></div>
