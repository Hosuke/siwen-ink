    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 苞栩</nav></header><main><article><h1>苞栩</h1><p>叢生之栩，鴇所集止，以興征人之不得其所。</p><p>「集于苞栩」，出自〈[[鴇羽]]〉首章。栩，櫟也，一名柞木。苞栩者，叢生之栩也。</p><p>鴇為水鳥，而集於陸木之上，此失其所之象。征人亦如鴇之失所止，不得安居，不得歸耕，以興王事靡盬之苦。苞栩、苞棘、苞桑遞言之，以見征役之無定所。</p><p><strong>所出</strong>：《詩經 · 鴇羽》 — https://zh.wikisource.org/wiki/詩經/鴇羽</p></article></main></div></div>
