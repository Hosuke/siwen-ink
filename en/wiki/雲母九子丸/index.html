    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 雲母九子丸</nav></header><main><article><h1>雲母九子丸</h1><p>交接之道二方，色理日少</p><p>劉京以[[雲母九子丸]]及交接之道二方教皇甫隆。隆按合行服之，色理日少，發不白，齒不落，年三百餘歲，不知能度世否。京語之以此自戒。交接之道至難，非上士不能行之，乘奔牛驚馬未足喻其險。</p><p><strong>所出</strong>：《神仙傳 · 卷七》 — https://zh.wikisource.org/wiki神仙傳/卷七</p></article></main></div></div>
