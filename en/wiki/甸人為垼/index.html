    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 甸人為垼</nav></header><main><article><h1>甸人為垼</h1><p>為死者沐浴之時，甸人於西牆下造竈，取廟中西北隅之薪以供熱水。</p><p>管人汲，授御者，御者差沐於堂上──君沐粱，大夫沐稷，士沐粱。甸人為垼於西牆下，陶人出重鬲，管人受沐，乃煮之，甸人取所徹廟之西北厞薪，用爨之。管人授御者沐，乃沐；沐用瓦盤，挋用巾，如它日，小臣爪手翦須，濡濯棄于坎。</p><p><strong>所出</strong>：《禮記 · 喪大記》 — https://zh.wikisource.org/wiki/禮記/喪大記</p></article></main></div></div>
