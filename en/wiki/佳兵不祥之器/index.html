    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 佳兵不祥之器</nav></header><main><article><h1>佳兵不祥之器</h1><p>兵器為不祥之物，君子不以為常。</p><p>兵者凶器，君子不尚。河上公云：「兵者，非君子之器，不得已有而用之。」所謂佳兵者，謂以兵為美，善於用兵之謂也。物或惡之，萬物尚知避之，況有道之君子乎？故有道者不處，以其為不祥之器也。</p><p><strong>所出</strong>：《老子河上公章句 · 偃武》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
