    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 秦坑趙人</nav></header><main><article><h1>秦坑趙人</h1><p>秦始皇至邯鄲，坑其母家仇怨之人。</p><p>十九年，王翦、羌瘣盡定取趙地東陽，得趙王。引兵欲攻燕，屯中山。秦王之邯鄲，諸嘗與王生趙時母家有仇怨，皆阬之。秦王還，從太原、上郡歸。</p><p><strong>所出</strong>：《史記 · 卷006》 — https://zh.wikisource.org/wiki/史記/卷006</p></article></main></div></div>
