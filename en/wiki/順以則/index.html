    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 順以則</nav></header><main><article><h1>順以則</h1><p>六二爻辭，以柔順為法，不失其則。</p><p>「六二之吉，順以則也。」六二以柔居中，得位履正，陰爻也，坤之正體也。當明夷之時，六二能用其柔順，以順承天而不失其法則，故獲吉也。象辭言「順以則」，明六二之所以吉者，以其柔而能中，中而有法，非徒柔媚之謂也。</p><p><strong>所出</strong>：《周易 · 明夷》 — https://zh.wikisource.org/wiki/周易/明夷</p></article></main></div></div>
