    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 光亨</nav></header><main><article><h1>光亨</h1><p>懷孚守正，光明通達。</p><p>需卦以有孚為本，而其效則光亨。光者，明也；亨者，通也。言人懷孚而居，貞正不渝，則其德輝煌，其道通達，光被四表，無往不利也。聖人觀此，知君子修身俟命，守正待時，光明之德自然發越，通亨之運隨之而至。</p><p><strong>所出</strong>：《周易 · 需》 — https://zh.wikisource.org/wiki/周易/需</p></article></main></div></div>
