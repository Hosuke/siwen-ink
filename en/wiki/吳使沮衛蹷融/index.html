    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 吳使沮衛蹷融</nav></header><main><article><h1>吳使沮衛蹷融</h1><p>吳人勞師越已破吳，必有輕晉之心；示我不病，因而起師。</p><p>越已勝吳，又索卒於荆而攻晉。左史倚相謂荆王曰：「夫越破吳，豪士死，銳卒盡，大甲傷。今又索卒以攻晉，示我不病也。不如起師與分吳，」荆王曰：「善。」因起師而從越。越王怒，將擊之。大夫種曰：「不可。吾豪士盡，大甲傷。我與戰，必不尅，不如賂之。」乃割露山之陰五百里以賂之。</p><p><strong>所出</strong>：《韓非子 · 說林下》 — https://zh.wikisource.org/wiki/韓非子/說林下</p></article></main></div></div>
