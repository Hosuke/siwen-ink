    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 胎神</nav></header><main><article><h1>胎神</h1><p>居神室，誦黃庭可令安寧。</p><p>此文羅列一形之神室處，[[胎神]]之所在耳。恒誦詠之者，則神室明正，胎真安寧，靈液流通，血髓充溢，腸胃虛盈，五藏結華，耳目聰明。</p><p><strong>所出</strong>：《黃庭內景經 · 序》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/序</p></article></main></div></div>
