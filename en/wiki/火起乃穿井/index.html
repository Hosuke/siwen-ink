    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 火起乃穿井</nav></header><main><article><h1>火起乃穿井</h1><p>臨渴掘井，火起穿井，喻事至乃圖，悔之無及。</p><p>二豎之疾既據而募良醫，棟橈之禍已集而思謀夫，何乎火起乃穿井，覺饑而占田哉！</p><p>天下之患，每起於將然之前；天下之功，必成於未兆之際。善為國者，見微而知著，蹈霜而戒冰；昧於治體者，視焰而驚，逢焚而求井。夫火未燃而備水，則民不被其災；患未形而圖之，則君享其安。若乃疾病已入膏肓而後求醫，棟宇已傾而後謀柱，猶灼肌而問艾，焦眉而索書，難矣。</p><p><strong>所出</strong>：《抱朴子 · 卷11》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷11</p></article></main></div></div>
