    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 止念為本</nav></header><main><article><h1>止念為本</h1><p>妄念息則真元現，止念乃修真之根本。</p><p>瓔珞經云：「世人不能成道而脫生死者，良由妄念為輪回種子耳。」</p><p>玄門以止念為本，釋教以無念為宗。妄念起處即生災，妄念息處即真元。</p><p>然止念非壓念，乃不起諸念。李清庵云：「丹從不煉煉中煉，道向無為為處為。息念息緣調祖炁，忘聞忘見養嬰兒。」</p><p>設使觸景情動，如回應聲，既應即止，則煩惱塵勞不待斷而自滅，胎真赤子弗假修而自靈。</p><p><strong>所出</strong>：《性命圭旨 · 貞集》 — https://zh.wikisource.org/wiki/性命圭旨/貞集</p></article></main></div></div>
