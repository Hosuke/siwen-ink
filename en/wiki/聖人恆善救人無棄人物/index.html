    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 聖人恆善救人無棄人物</nav></header><main><article><h1>聖人恆善救人無棄人物</h1><p>聖人救人無棄，兼物與財，無一可棄。</p><p>聖人恆善救人而无棄人物、無棄財。言聖人救人於世，常以善道救護之，無有遺棄。又推其善以及萬物，不獨救人而已，兼物與財皆無所棄。帛書本「物無棄財」義與 [[常善救人故無棄人]] 相足，總言聖人善救之心普及天下，無一物一財見棄於聖人之治也。此與《老子》「聖人無棄人」之旨同，而帛書本兼言無棄物、無棄財，義尤擴充焉。</p><p><strong>所出</strong>：《老子 (帛書本) · 章二十七》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
