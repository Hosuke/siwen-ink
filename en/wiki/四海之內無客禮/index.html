    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 四海之內無客禮</nav></header><main><article><h1>四海之內無客禮</h1><p>天子於四海之內，無敵體，無迎送之儀，此天下獨尊之義。</p><p>天子無妻，告人無匹也；四海之內無客禮，告無適也。妻者匹也，天子之匹無與敵者；客禮者，迎送致敬之儀，天子之出無所往而非主，亦無所待之客。故天下萬物，莫非王土；率土之濱，莫非王臣。天子之尊，於此可見。</p><p><strong>所出</strong>：《荀子 · 君子篇》 — https://zh.wikisource.org/wiki/荀子/君子篇</p></article></main></div></div>
