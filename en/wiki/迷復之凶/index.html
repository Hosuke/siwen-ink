    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 迷復之凶</nav></header><main><article><h1>迷復之凶</h1><p>迷於復道，不知返歸，必有災咎，行師亦敗。</p><p>上六：迷復，凶，有災眚。用行師，終有大敗，以其國君，凶；至於十年，不克征。</p><p>象曰：迷復之凶，反君道也。</p><p>迷於復道而不知返，則凶。有天災人眚，行師必有大敗，雖國君亦凶。十年者，數之極，終不能征。蓋反君道則無以率人，必至於敗亡。</p><p><strong>所出</strong>：《周易 · 復》 — https://zh.wikisource.org/wiki/周易/復</p></article></main></div></div>
