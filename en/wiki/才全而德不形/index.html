    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 才全而德不形</nav></header><main><article><h1>才全而德不形</h1><p>才全則 raw natural endowment 充實，德不形則物自親附。</p><p>仲尼語哀公曰：「今哀駘它未言而信，無功而親，使人授己國，唯恐其不受也，是必才全而德不形者也。」</p><p><strong>所出</strong>：《莊子 · 德充符》 — https://zh.wikisource.org/wiki/莊子/德充符</p></article></main></div></div>
