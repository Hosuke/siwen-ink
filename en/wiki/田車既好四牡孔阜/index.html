    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 田車既好，四牡孔阜</nav></header><main><article><h1>田車既好，四牡孔阜</h1><p>車備馬健，田事之資已具。</p><p>田車者，用於田獵之車。四牡，四匹雄馬。孔，甚也。阜，肥壯之意。言車乘完好，牡馬極其肥壯，此田獵之基本條件備矣。</p><p>《詩經》田獵之詩，多言車馬之盛，如「駟騵孔阜」之類。此句特言車好馬阜，為下文馳逐禽獸張本。</p><p><strong>所出</strong>：《詩經 · 吉日》 — https://zh.wikisource.org/wiki/詩經/吉日</p></article></main></div></div>
