    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 去十者</nav></header><main><article><h1>去十者</h1><p>詩書禮樂等十者不去，國必削亡</p><p>國有禮有樂，有詩有書，有善有修，有孝有弟，有廉有辯，國有十者，上無使守戰，必削至亡。國無十者，上有使守戰，必興至王。不用八者治，敵不敢至，雖至必卻；興兵而伐，必取；按兵而不伐，必富。詩書禮樂，非治國之具，乃削弱之根。</p><p><strong>所出</strong>：《商君書 · 卷一》 — https://zh.wikisource.org/wiki/商君書/卷一</p></article></main></div></div>
