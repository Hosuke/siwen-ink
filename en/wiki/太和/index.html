    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 太和</nav></header><main><article><h1>太和</h1><p>盜賊叛亂皆由己召，當無親疏愛惡乃合太和。</p><p>非兔狡，獵狡也；非民詐，吏詐也。慎勿怨盜賊，盜賊惟我召；慎勿怨叛亂，叛亂稟我教。不有和睦，焉得仇讎；不有賞動，焉得鬥爭。是以大人無親無疏，無愛無惡，是謂太和。</p><p><strong>所出</strong>：《化書 · 卷四》 — https://zh.wikisource.org/wiki/化書/卷四</p></article></main></div></div>
