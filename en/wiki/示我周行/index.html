    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 示我周行</nav></header><main><article><h1>示我周行</h1><p>嘉賓示我以至道，周邦所當行者。</p><p>周行，鄭玄解為周之至道，王先謙則以為周邦所當行之善道。《鹿鳴》首章云：「人之好我，示我周行。」言嘉賓愛我，指我以先王至道，使知所趨也。蓋嘉賓既來，忠言日至，足以匡輔在位者之闕遺焉。</p><p><strong>所出</strong>：《詩經 · 鹿鳴》 — https://zh.wikisource.org/wiki/詩經/鹿鳴</p></article></main></div></div>
