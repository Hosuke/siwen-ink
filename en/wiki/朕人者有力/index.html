    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 朕人者有力</nav></header><main><article><h1>朕人者有力</h1><p>克人之用力，不如克己之為有力。</p><p>朕人者有力也。朕，勝也。力能勝人，不若力能自勝之為貴。匹夫之勇，攘臂聞於閭巷；烈士之強，暴虎馮河，死不旋踵。皆是用力以勝人，而非用力以勝己者也。唯自勝者之用力也深，故其力也大；恃強力以陵人者，外壯而中枯，非真正之有力也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章三十三》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
