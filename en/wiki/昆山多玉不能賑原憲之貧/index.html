    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 昆山之多玉不能賑原憲之貧</nav></header><main><article><h1>昆山之多玉不能賑原憲之貧</h1><p>喻遠物不可以救急</p><p>抱朴子言華藻之無益，喻之以「昆山多玉不能賑[[原憲窶與子貢殖|原憲]]之貧」。「[[藥藏之簿領]]不能治危急之疾」。言道理雖高，終不若[[五兵]]實用之效也。</p><p><strong>所出</strong>：《抱朴子 · 卷42》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷42</p></article></main></div></div>
