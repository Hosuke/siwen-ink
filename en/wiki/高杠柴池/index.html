    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 高杠柴池</nav></header><main><article><h1>高杠柴池</h1><p>增高橋梁深掘池澤以困牛馬之術</p><p>齊之皮幹筋角之徵甚重。管子請以令高杠柴池，使東西不相睹，南北不相見。天酸然雨，十人之力不能上；廣澤遇雨，十人之力不可得而恃。舍牛馬之力所無因，牛馬絕罗而相繼死其所者相望，皮幹筋角徒予人而莫之取，牛馬之賈必坐長而百倍。天下聞之，必離其牛馬而歸齊若流。</p><p>高杠柴池以阻交通，困牛馬以致物貴，此以地理之勢制物價之術也。《道若祕》云：「物之所生，不若其所聚。」</p><p><strong>所出</strong>：《管子 · 第80篇輕重甲》 — https://zh.wikisource.org/wiki/管子/第80篇輕重甲</p></article></main></div></div>
