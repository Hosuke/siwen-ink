    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 馬維駱</nav></header><main><article><h1>馬維駱</h1><p>駱，白馬黑鬣之良馬，以喻使臣威儀。</p><p>「我馬維駱」，見於《詩·小雅·皇皇者華》第四章。</p><p>「駱」者，白馬黑鬣者也；《爾雅》「白馬黑鬣，駱」。詩言使臣以駱為馬，六轡沃若，沃若者，光澤下垂之貌，言其華美盛壯，以比使臣出使之威儀。</p><p><strong>所出</strong>：《詩經 · 皇皇者華》 — https://zh.wikisource.org/wiki/詩經/皇皇者華</p></article></main></div></div>
