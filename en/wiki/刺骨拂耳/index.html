    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 刺骨拂耳</nav></header><main><article><h1>刺骨拂耳</h1><p>治病以刀刺骨，救國以忠拂耳，皆小痛小逆而致久福。</p><p>古扁鵲之治疾，以刀刺骨，疼在體而利在身；聖人之救危國，以忠拂耳，逆在心而福在國。此[[安術有七]]之一也。小痛不忍，則扁鵲之巧無以施；危而不受拂耳之言，則[[明主之道|聖人之意]]失之矣。[[賞罰隨是非]]者，正言拂耳之義也；[[死生隨法度]]者，刺骨之喻也。</p><p><strong>所出</strong>：《韓非子 · 安危》 — https://zh.wikisource.org/wiki/韓非子/安危</p></article></main></div></div>
