    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 稻蟹不遺種</nav></header><main><article><h1>稻蟹不遺種</h1><p>吳地稻蟹絕種，天災示警，越師可待</p><p>越王與范蠡謀吳數年，其間吳中天象屢變。范蠡言：「今其稻蟹不遺種。」蓋吳地水患或旱蝗，稻與蟹盡死不遺其種，此天災示警，吳之國力已竭。</p><p>范蠡對越王詰問時，答以「天應至矣，人事未盡」，正是指此天災既現，而吳人困窘已甚，上下同力，猶能致死者尚在，故仍須待之。及吳師自潰，越遂滅之。</p><p><strong>所出</strong>：《國語 · 卷21》 — https://zh.wikisource.org/wiki/國語/卷21</p></article></main></div></div>
