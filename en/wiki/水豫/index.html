    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 水豫</nav></header><main><article><h1>水豫</h1><p>預治水以為國防之術</p><p>桓公欲北舉事孤竹、離枝，恐越人之至。管子請遏原流，立沼池，令以矩游為樂。又立大舟之都，深淵壘十仞，令曰：「能游者賜千金。」未能用金千，齊民之游水不避吳越。越人果至，隱曲薔以水齊。管子有扶身之士五萬人以待戰，大敗越人。此之謂水豫。</p><p>水豫者，預修水利，平時可通舟楫，戰時可為阻截，一舉而兩得也。</p><p><strong>所出</strong>：《管子 · 第80篇輕重甲》 — https://zh.wikisource.org/wiki/管子/第80篇輕重甲</p></article></main></div></div>
