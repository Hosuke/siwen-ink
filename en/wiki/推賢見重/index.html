    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 推賢見重</nav></header><main><article><h1>推賢見重</h1><p>推薦賢才以見重於世，己不如人而能用之。</p><p>安國多大略，智足以當世取合，而出於忠厚。貪嗜於財。所推舉皆廉士，賢於己者也。-{於}-梁舉壺遂、臧固、郅他，皆天下名士，士亦以此稱慕之，唯天子以爲國器。</p><p><strong>所出</strong>：《史記 · 卷108》 — https://zh.wikisource.org/wiki/史記/卷108</p></article></main></div></div>
