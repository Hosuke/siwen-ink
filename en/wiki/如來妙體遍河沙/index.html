    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 如來妙體遍河沙</nav></header><main><article><h1>如來妙體遍河沙</h1><p>如來真空妙體，遍虛空而無礙，三界即是一家。</p><p>如來真空之妙體，遍河沙世界，萬象森羅，無礙無遮。因其妙而不空、光輝朗照，故能遍一切處而無所不通。會得此圓通法眼，則非色非空，即色即空，天堂地獄，一概掃去，三界即是一家，十方即是全身。苟執色則礙，執空亦礙；惟妙而不空、空而不空，方為如來真性。</p><p><strong>所出</strong>：《悟真直指 · 卷四》 — https://zh.wikisource.org/wiki/悟真直指/卷四</p></article></main></div></div>
