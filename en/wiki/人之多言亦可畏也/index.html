    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 人之多言亦可畏也</nav></header><main><article><h1>人之多言亦可畏也</h1><p>眾口之毀，雖情所甚欲，不敢忽也。</p><p>詩人言：仲子固可懷也，然人之多言，亦可畏也。</p><p>夫情欲之動，人皆所有；苟無所畏，則逾牆穿園，不復有止。此詩三章，迭言「亦可畏也」：一章畏父母，再章畏諸兄，三章畏國人。可畏之範圍愈廣，自制之念愈切。</p><p>人言可畏，非徒懼譏毀也，實以禮義為防範，使人不敢徑情直遂耳。</p><p><strong>所出</strong>：《詩經 · 將仲子》 — https://zh.wikisource.org/wiki/詩經/將仲子</p></article></main></div></div>
