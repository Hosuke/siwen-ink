    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 以容取人</nav></header><main><article><h1>以容取人</h1><p>觀容取人，往往失之；試之官職，方驗智愚。</p><p>澹臺子羽，君子之容也，仲尼幾而取之，與處久而行不稱其貌。宰予之辭，雅而文也，仲尼幾而取之，與處久而智不充其辯。故孔子曰：「以容取人乎，失之子羽；以言取人乎，失之宰予。」今之新辯濫乎宰予，而世主之聽眩乎仲尼。觀容服，聽辭言，仲尼不能以必士；試之官職，課其功伐，則庸人不疑於愚智。</p><p><strong>所出</strong>：《韓非子 · 顯學》 — https://zh.wikisource.org/wiki/韓非子/顯學</p></article></main></div></div>
