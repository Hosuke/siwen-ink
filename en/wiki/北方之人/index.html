    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 北方之人</nav></header><main><article><h1>北方之人</h1><p>北方之人形性與地宜</p><p>北方幽晦不明，天之所閉也，寒水之所積也，蟄蟲之所伏也。其人翕形短頸，大肩下尻，竅通于陰，骨幹屬焉，黑色主腎，其人蠢愚，禽獸而壽。其地宜菽，多犬馬。</p><p><strong>所出</strong>：《淮南子 · 墜形訓》 — https://zh.wikisource.org/wiki/淮南子/墜形訓</p></article></main></div></div>
