    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 剛健文明</nav></header><main><article><h1>剛健文明</h1><p>德兼剛強與文雅，應天時而行。</p><p>《彖傳》以剛健文明言《大有》之德。剛健者，乾之德也，天道不息，健以自強；文明者，離之德也，火之照臨，明以普被。剛而不暴，健而不息，文而不飾，明而不苛。此四者備，乃能應乎天之道，而與時偕行，是以大通而元亨也。</p><p><strong>所出</strong>：《周易 · 大有》 — https://zh.wikisource.org/wiki/周易/大有</p></article></main></div></div>
