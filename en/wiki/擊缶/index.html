    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 擊缶</nav></header><main><article><h1>擊缶</h1><p>祭禮之中擊瓦器以為節，詩刺陳侯荒於祭祀。</p><p>缶，瓦器也，可擊之以為節。《說文》云「盎，盆也」，缶之屬。祭禮之時，或擊鼓以動眾，或擊缶以節舞，此祭之末節也。</p><p>《宛丘》三章，末章言「坎其擊缶，宛丘之道」。坎坎者，擊缶之聲也。夫擊鼓於丘下，擊缶於道旁，羽翿交互而無冬無夏，陳侯之於祭，可謂勤矣。然淫荒昏亂，政事不理，徒以區區之祀自媚於神，詩人刺之，良有以夫。</p><p><strong>所出</strong>：《詩經 · 宛丘》 — https://zh.wikisource.org/wiki/詩經/宛丘</p></article></main></div></div>
