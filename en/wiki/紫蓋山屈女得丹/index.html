    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 紫蓋山屈女得丹</nav></header><main><article><h1>紫蓋山屈女得丹</h1><p>屈家二女為仙公煉丹成雙履，因得丹而仙去也。</p><p>仙公嘗在荊門軍紫蓋山修煉，值天寒大凍，仙公跣足，衣衫藍縷。</p><p>時有屈家二女窺見，憐其忍冷，夤夜促成雙履，次日欲獻之。往煉丹之所，仙公已去，但存爐灰尚溫。二女撥灰而得丹一粒，姊妹分而服之。</p><p>自後神氣衝衝，不飢不渴，惟慕清靜。後隱去，時人謂得仙矣。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 23》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/23</p></article></main></div></div>
