    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 賞不用而民勸</nav></header><main><article><h1>賞不用而民勸</h1><p>上好禮義，則賞罰不用而民化</p><p>故上好禮義，尚賢使能，無貪利之心，則下亦將綦辭讓，致忠信，而謹於臣子矣。如是則雖在小民，不待合符節，別契券而信，不待探籌投鉤而公，不待衡石稱縣而平，不待斗斛敦概而嘖。故賞不用而民勸，罰不用而民服，有司不勞而事治，政令不煩而俗美。百姓莫敢不順上之法，象上之志，而勸上之事，而安樂之矣。</p><p><strong>所出</strong>：《荀子 · 君道篇》 — https://zh.wikisource.org/wiki/荀子/君道篇</p></article></main></div></div>
