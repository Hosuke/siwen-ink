    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 明主不親觀聽而制斷在下</nav></header><main><article><h1>明主不親觀聽而制斷在下</h1><p>制斷若不在君，則臣下輕君而重於人，國如寄食。</p><p>酸甘鹹淡不以口斷而決於宰尹，則厨人輕君而重於宰尹；上下清濁不以耳斷而決於樂正，則瞽工輕君而重於樂正；治國是非不以術斷而決於寵人，則臣下輕君而重於寵人。人主不親觀聽，而制斷在下，[[託食於國]]者也。</p><p><strong>所出</strong>：《韓非子 · 八說》 — https://zh.wikisource.org/wiki/韓非子/八說</p></article></main></div></div>
