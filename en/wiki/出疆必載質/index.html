    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 出疆必載質</nav></header><main><article><h1>出疆必載質</h1><p>士之仕也，無故而去，則載質以行，猶農夫不輕舍耒耜。</p><p>孔子三月無君，則皇皇如也。出疆必載質。士之失位也，猶諸侯之失國家也。士之仕也，猶農夫之耕也，農夫豈為出疆舍其耒耜哉？</p><p><strong>所出</strong>：《孟子 · 滕文公下》 — https://zh.wikisource.org/wiki/孟子/滕文公下</p></article></main></div></div>
