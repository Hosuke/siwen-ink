    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 地道光也</nav></header><main><article><h1>地道光也</h1><p>坤六二動直以方，大地之道發見光明。</p><p>坤六二之動，直以方也。地道光也。</p><p>地道者，坤之德也。六二居中得位，其動也直，其行也方，光明通達，無有私曲。王弼註云「六二之動直以方」，言其德之光大也。地道至柔，而其光昭昭，此坤承天以時行、含弘光大之義也。地道之光，非自照也，乃順承天陽之明，以成萬物之功爾。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷01》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷01</p></article></main></div></div>
