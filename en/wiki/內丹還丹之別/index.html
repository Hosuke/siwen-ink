    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 內丹還丹之別</nav></header><main><article><h1>內丹還丹之別</h1><p>外丹乃還丹之別名，已去而複來、已失而複得</p><p>外丹者，還丹之別名也。因其已去而複來，已失而仍得，從外而還於內，故謂外丹，又謂還丹。若已還後，即是內丹，此內外之分別也。先天純陽未破，修真空山，漸漸凝結，聖胎成象，是名內丹；後天已失，取坎填離，返本還原，凝結一粒，是名外丹，亦名還丹。還丹到手，複加以溫養十月，脫去法身，功成名遂，是名天仙。</p><p><strong>所出</strong>：《悟真直指 · 卷一》 — https://zh.wikisource.org/wiki/悟真直指/卷一</p></article></main></div></div>
