    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 理有典刑，辭有風軌</nav></header><main><article><h1>理有典刑，辭有風軌</h1><p>立範之要，理法與文辭兼備。</p><p>立範運衡，宜明體要。必使理有典刑，辭有風軌，總法家之式，秉儒家之文，不畏彊禦，氣流墨中，無縱詭隨，聲動簡外，乃稱絕席之雄、直方之舉。此言奏體之範，當以法家之式總其體，以儒家之文澤其辭，理法兼具，文武並濟。</p><p><strong>所出</strong>：《文心雕龍 · 奏啟》 — https://zh.wikisource.org/wiki/文心雕龍/奏啟</p></article></main></div></div>
