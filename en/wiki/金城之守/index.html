    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 金城之守</nav></header><main><article><h1>金城之守</h1><p>金城之守，在用財貨、設耳目，嚴為防守之備。</p><p>金城者，城郭堅固如金。守之之法，非徒恃城池之固，必也財貨以養士，耳目以通情。</p><p>其文曰：「金城之守者，用貨財，設耳目也。」「有金城之守，故能定宗廟，育男女矣。」</p><p>城非不堅不利，而守之要在賞信罰明，耳目周遍，使敵無隙可乘。如此，則宗廟可定，男女可育，而國基永固。</p><p><strong>所出</strong>：《管子 · 選陳》 — https://zh.wikisource.org/wiki/管子/七法/選陳</p></article></main></div></div>
