    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 昭明有融</nav></header><main><article><h1>昭明有融</h1><p>光耀昭著，其明融遍。</p><p>君子之德，光耀昭著，充周浹洽，無所不被。《詩》曰「昭明有融」，言其明盛融遍，光被八方也。昭者，光之顯；融者，通之至。昭而能融，則德輝所照，遠邇同仁。《左氏傳》有「照臨四方」之語，義與此近。蓋君子成德既昭，自有以沾溉後人，非徒一己之光已也。</p><p><strong>所出</strong>：《詩經 · 既醉》 — https://zh.wikisource.org/wiki/詩經/既醉</p></article></main></div></div>
