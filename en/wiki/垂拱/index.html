    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 垂拱</nav></header><main><article><h1>垂拱</h1><p>君臣俱欲休息乎無為，故惠帝垂拱，高后女主稱制。</p><p>太史公曰：孝惠皇帝、高后之時，黎民得離戰國之苦，君臣俱欲休息乎無為，故惠帝垂拱，高后女主稱制，政不出房戶，天下晏然。刑罰罕用，罪人是希。民務稼穡，衣食滋殖。</p><p><strong>所出</strong>：《史記 · 卷009》 — https://zh.wikisource.org/wiki/史記/卷009</p></article></main></div></div>
