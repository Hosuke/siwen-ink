    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 明德慎罰</nav></header><main><article><h1>明德慎罰</h1><p>德行為本，刑罰為末，用刑務在審慎。</p><p>《康誥》記周公誥康叔，以為治國之要，在乎「明德慎罰」。文王能明其德，慎其罰，不敢侮慢鰥寡。此四字者，為周初建國之大經。慎罰非不用罰，乃用罰之時，必本於明德；德為主，罰為輔；德之所不及，乃以罰補之。若專任刑罰而不本於德，則民無所措手足，而國亦隨之以亡。後世論治者，莫不祖此以為準繩。</p><p><strong>所出</strong>：《尚書 · 康誥》 — https://zh.wikisource.org/wiki/尚書/康誥</p></article></main></div></div>
