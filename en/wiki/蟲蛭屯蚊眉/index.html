  <body>
    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 蟲蛭屯蚊眉</nav></header><main><article><h1>蟲蛭屯蚊眉</h1><p>小蟲居蚊眉之中而笑大鵬，以喻道業不相及，聰明不相逮。</p><p>夫非漢濱之人，不能料明珠於泥淪之蟲奉；非泣血之民，不能識夜光於重崖之裏。蟲蛭之屯蚊眉之中，而笑彌天之大鵬；寸鮒遊牛跡之水，不貴橫海之巨鱗。故道業不足以相涉，聰明不足以相逮。理自不合，無所多怪。所以疾之而不能默者，願夫在位君子，無以貌取人，勉勖謙損，以永天秩耳。</p><p><strong>所出</strong>：《抱朴子 · 卷27》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷27</p></article></main></div></div>
