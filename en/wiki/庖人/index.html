    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 庖人</nav></header><main><article><h1>庖人</h1><p>中士四人，掌共六畜六獸六禽以共王膳</p><p>庖人，中士四人，下士八人；府二人，史四人，賈八人，胥四人，徒四十人。</p><p>掌共六畜、六獸、六禽，辨其名物。凡其死生鮮槁之物，以共王之膳，與其薦羞之物，及後、世子之膳羞。</p><p>共祭祀之好羞，共喪紀之庶羞、賓客之禽獻。</p><p>歲終則會，唯王及後之膳禽不會。</p><p><strong>所出</strong>：《周禮 · 天官冢宰》 — https://zh.wikisource.org/wiki/周禮/天官冢宰</p></article></main></div></div>
