    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 伊尹自夏徂亳</nav></header><main><article><h1>伊尹自夏徂亳</h1><p>伊尹自夏適湯，述夏民之困苦、國之將亡。</p><p>伊尹者，有莘之媵臣也。聞夏德既衰，乃自夏適湯，致其消息。湯問所以來，尹具言夏之所以亡者：民厭其政，奢侈無度，寵二玉而忽四境；百姓相率而歌曰：「餘及汝偕亡。」言雖死不與暴君共存也。湯遂與尹盟誓，共謀伐夏。</p><p><strong>所出</strong>：《尚書 · 尹至》 — https://zh.wikisource.org/wiki/尚書/尹至</p></article></main></div></div>
