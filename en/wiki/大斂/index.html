    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 大斂</nav></header><main><article><h1>大斂</h1><p></p><p>大斂之禮，於阼階行之，布絞廣狹、衣稱多寡，皆視爵命以為隆殺。又云：</p><p>  大斂：布絞，縮者三，橫者五，布紟二衾。君大夫士一也。君陳衣于庭，百稱，北領西上；大夫陳衣于序東，五十稱，西領南上；士陳衣于序東，三十稱，西領南上。絞紟如朝服，絞一幅為三、不辟，紟五幅、無紞。君大夫士祭服無算，君褶衣褶衾，大夫士猶小斂也。袍必有表，不禪，衣必有裳，謂之一稱。</p><p>  <strong>所出</strong>：《禮記 · 喪大記》 — https://zh.wikisource.org/wiki/禮記/喪大記</p></article></main></div></div>
