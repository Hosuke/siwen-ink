    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 滋味時動靜</nav></header><main><article><h1>滋味時動靜</h1><p>聖人齊滋味而時動靜，乃能全生之德。</p><p>滋味動靜，生之養也。好惡喜怒哀樂，生之變也。聰明當物，生之德也。是故聖人齊滋味而時動靜，御正六氣之變，禁止聲色之淫。邪行亡乎體，違言不存口，靜然定生，聖也。</p><p><strong>所出</strong>：《管子 · 第26篇戒》 — https://zh.wikisource.org/wiki/管子/第26篇戒</p></article></main></div></div>
