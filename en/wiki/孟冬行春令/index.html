    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 孟冬行春令</nav></header><main><article><h1>孟冬行春令</h1><p>孟冬行春令則凍閉不密地氣上泄，行夏令則國多暴風，行秋令則雪霜不時。</p><p>孟冬行春令，則凍閉不密，地氣上泄，民多流亡。行夏令，則國多暴風，方冬不寒，蟄蟲復出。行秋令，則雪霜不時，小兵時起，土地侵削。</p><p><strong>所出</strong>：《禮記 · 月令》 — https://zh.wikisource.org/wiki/禮記/月令</p></article></main></div></div>
