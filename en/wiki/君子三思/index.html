    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 君子三思</nav></header><main><article><h1>君子三思</h1><p>少學、長教、富施，皆及時而行之。</p><p>孔子曰：「君子有三思，而不可不思也。」</p><p>少而不學，長無能也；老而不教，死無思也；有而不施，窮無與也。是故君子少思長則學，老思死則教，有思窮則施也。</p><p>蓋聖人謹於時，戒於蹉跎，務使學無遺時、教無虛日、施無吝財也。</p><p><strong>所出</strong>：《荀子 · 法行篇》 — https://zh.wikisource.org/wiki/荀子/法行篇</p></article></main></div></div>
