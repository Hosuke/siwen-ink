    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 有權衡之稱</nav></header><main><article><h1>有權衡之稱</h1><p>有權衡之稱者，不可欺以輕重</p><p>權衡者，所以起輕重之數也。明主在上位，則官不得枉法，吏不得為私，民知事吏之無益，故財貨不行於吏。權衡平正而待物，故姦詐之人不得行其私。
<strong>所出</strong>：《管子 · 第67篇明法解》 — https://zh.wikisource.org/wiki/管子/第67篇明法解</p></article></main></div></div>
