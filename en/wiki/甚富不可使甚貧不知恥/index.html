    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 甚富不可使，甚貧不知恥</nav></header><main><article><h1>甚富不可使，甚貧不知恥</h1><p>貧富過極則民不可治</p><p>「用貧與富，何如而可？」管仲對曰：「甚富不可使，甚貧不知恥。」水平而不流，無源則遬竭；雲平而雨不甚，無委雲，雨則遬已。甚富者驕佚自恣，不可驅使；甚貧者無恥辱之心，不畏刑賞。政平而無威則不行，愛而無親則流。必使富者有以散，貧者有以養，輕重相制，然後民可得而用。</p><p><strong>所出</strong>：《管子 · 第35篇侈靡》 — https://zh.wikisource.org/wiki/管子/第35篇侈靡</p></article></main></div></div>
