    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 夫人薨不地</nav></header><main><article><h1>夫人薨不地</h1><p>夫人薨於夷，不地者，為變故之地故也。</p><p>秋，七月戊辰，夫人姜氏薨于夷。夫人薨不地。地，故也。</p><p>《穀梁》明書法之意：夫人薨於夷，不書其地之詳，以其死於非其所也。書「于夷」者，以明其地；不更書地故者，以其死非正，故變之而書，不與其常也。</p><p><strong>所出</strong>：《春秋穀梁傳 · 僖公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/僖公</p></article></main></div></div>
