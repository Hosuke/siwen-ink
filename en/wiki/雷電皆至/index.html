    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 雷電皆至</nav></header><main><article><h1>雷電皆至</h1><p>雷電並興，威明並行，君子觀此以折獄致刑也。</p><p>象傳曰：「雷電皆至，豐；君子以折獄致刑。」</p><p>雷之震動，電之光明，並至而為豐。君子觀此象，則明以察事，斷以果決，致刑罰於當罪，如雷電之無私也。</p><p><strong>所出</strong>：《周易 · 豐》 — https://zh.wikisource.org/wiki/周易/豐</p></article></main></div></div>
