    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 彌天之災</nav></header><main><article><h1>彌天之災</h1><p>不仁之於人，禍莫大焉，彌天之災由不仁而生。</p><p>孔子問漁父所以離於道，漁父示以去八疵行四患之要。漁父又歎曰：「不仁之於人也，禍莫大焉，而由獨擅之。」由是觀之，彌天之災生於一人之不仁，君子可不戒哉。</p><p><strong>所出</strong>：《莊子 · 漁父》 — https://zh.wikisource.org/wiki/莊子/漁父</p></article></main></div></div>
