    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 大化至一</nav></header><main><article><h1>大化至一</h1><p>教化之極，使暴悍勇力之屬皆化而為善。</p><p>孫卿子云：雕雕焉縣貴爵重賞於其前，縣明刑大辱於其後，百姓曉然皆知循上之法，像上之志。於是有能化善、脩身、正行、積禮義、尊道德者，夫是之謂大化至一。</p><p><strong>所出</strong>：《荀子 · 議兵篇》 — https://zh.wikisource.org/wiki/荀子/議兵篇</p></article></main></div></div>
