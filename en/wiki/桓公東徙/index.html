    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 桓公東徙</nav></header><main><article><h1>桓公東徙</h1><p>鄭桓公從太史伯之謀東徙民於雒東</p><p>桓公從太史伯之謀，卒言王，東徙其民於雒東，而虢、鄶果獻十邑，竟國之。二歳，犬戎殺幽王於驪山下，并殺桓公。鄭人共立其子掘突，是為武公。</p><p><strong>所出</strong>：《史記 · 卷042》 — https://zh.wikisource.org/wiki/史記/卷042</p></article></main></div></div>
