    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 水土演而民用</nav></header><main><article><h1>水土演而民用</h1><p>水土流演則民用足，源塞則民乏財用</p><p>伯陽父曰：「水土演而民用也。水土無所演，民乏財用，不亡何待？」言水土之所以流演者，陰陽和暢之功也；其竭者，陰陽失序之驗也。民之財用衣食，皆本於水土之功，水土竭則民用困，國隨之亡。此以天地之氣釋民本之理者也。</p><p><strong>所出</strong>：《國語 · 卷01》 — https://zh.wikisource.org/wiki/國語/卷01</p></article></main></div></div>
