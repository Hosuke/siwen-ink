    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 激雷不能追既往之失辭</nav></header><main><article><h1>激雷不能追既往之失辭</h1><p>言辭一出，難以收回，當慎之於始。</p><p>激雷不能追既往之失辭，班輪不能磨斯言之既玷。雖不能三思而吐清談，猶可息謔調以防禍萌也。尊其辭令，敬其威儀，使言無口過，體無倨容，可法可觀，可畏可愛，蓋遠辱之良術，全交之要道也。</p><p>[[言有召禍也]]，而行亦有招辱。此言一出，如水之決，不可復塞。是以君子貴乎慎言，而小人不戒於始，及其追悔，則無及矣。</p><p><strong>所出</strong>：《抱朴子 · 卷25》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷25</p></article></main></div></div>
