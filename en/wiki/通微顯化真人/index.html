    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 通微顯化真人</nav></header><main><article><h1>通微顯化真人</h1><p>明天順皇帝誥封張三丰之號。</p><p>朕惟仙風道骨，得天地之眞元；祕典靈文，集陰陽之正氣。顧長生久視之術，成超凡入聖之功；曠世一逢，奇蹤罕見。</p><p>爾眞人張三丰，芳姿穎異，雅志孤高，得仙籙之祕诀，餌金鼎之靈膏；去來倏忽，實得造化之機；隱顯微芒，脗合乾坤之妙。</p><p>茲特贈爾爲[[通微顯化真人]]，錫之誥命，以示褒崇。尙期指教，式惠來英。</p><p><strong>所出</strong>：《張三丰先生全集 · 卷1》 — https://zh.wikisource.org/wiki/張三丰先生全集/卷1</p></article></main></div></div>
