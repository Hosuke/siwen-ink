    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 封事</nav></header><main><article><h1>封事</h1><p>皁囊封板，密奏陰陽之事。</p><p>自漢置八儀，密奏陰陽；皁囊封板，故曰封事。皁飾司直，肅清風禁。後代便宜，多附封事，慎機密也。</p><p><strong>所出</strong>：《文心雕龍 · 奏啟》 — https://zh.wikisource.org/wiki/文心雕龍/奏啟</p></article></main></div></div>
