    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 惙惙</nav></header><main><article><h1>惙惙</h1><p>憂心之貌，言其憂之深切也。</p><p>惙惙，疊音詞，狀憂心之詞。[[毛詩]]：「忡忡，猶惙惙也。」言未見君子，中心憂懼，不能自釋。[[魯詩]]引此詩，孔子論「好善道不能甚」，以明治道之要在於緩而不迫，急則民不能親。詩人取惙惙之義，以見思婦之情深而無已也。</p><p><strong>所出</strong>：《詩經 · 草蟲》 — https://zh.wikisource.org/wiki/詩經/草蟲</p></article></main></div></div>
