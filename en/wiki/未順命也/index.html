    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 未順命也</nav></header><main><article><h1>未順命也</h1><p>咸臨吉而无不利，以其未順命也。</p><p>九二以剛居中，[[剛中]]而應六五之君，咸臨而吉无不利。《象》曰「未順命也」，明九二之吉，非由順命而得，乃由[[剛中]]相應而致。</p><p>夫順命者，聽命而已；[[未順命]]者，以道相正也。九二之咸臨，非阿諛逢迎，乃以剛中之道正君之德，故能吉无不利。</p><p>[[行權合變度時施宜]]，權道之用也。</p><p><strong>所出</strong>：《周易 · 臨》 — https://zh.wikisource.org/wiki/周易/臨</p></article></main></div></div>
