    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 顯容之頌</nav></header><main><article><h1>顯容之頌</h1><p>頌以褒德顯容為宗，雖淺深詳略各異，其典章一也</p><p>若夫子雲之表充國，孟堅之序戴侯，武仲之美顯宗，史岑之述熹后，或擬《清廟》，或範《駉》《那》，雖淺深不同，詳略各異，其褒德顯容，典章一也。</p><p><strong>所出</strong>：《文心雕龍 · 頌讚》 — https://zh.wikisource.org/wiki/文心雕龍/頌讚</p></article></main></div></div>
