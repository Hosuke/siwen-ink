    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 辟雍</nav></header><main><article><h1>辟雍</h1><p>天子禮樂之學，鍾鼓既設，王道之盛寓焉。</p><p>辟雍者，周之大學，天子所立以教國子，行禮樂、習射御之地也。</p><p>詩言「於論鼓鍾，於樂辟雍」，言辟雍之中，鍾鼓既設，樂聲既諧，洋洋盈耳也。論者，理也；樂者，和也。鼓鍾之聲布於辟雍，宮商有序，[[和實生物|和之至]]者焉。</p><p>古者[[明堂]]與辟雍同義，皆王教之宮，[[六藝軌民|詩書禮樂]]之所從出也。聖王興則[[禮樂不可斯須去身|禮樂修明]]，辟雍之設，[[文王之德之純|王道之盛]]不可以已也。</p><p><strong>所出</strong>：《詩經 · 靈臺》 — https://zh.wikisource.org/wiki/詩經/靈臺</p></article></main></div></div>
