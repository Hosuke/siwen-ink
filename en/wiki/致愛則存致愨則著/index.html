    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 致愛則存，致愨則著</nav></header><main><article><h1>致愛則存，致愨則著</h1><p></p><p>「致愛則存，致愨則著」一節，載於《禮記·祭義》，論祭祀時孝子之心志。</p><p>夫子言：「齊之日，思其居處，思其笑語，思其志意，思其所樂，思其所嗜。」祭之日，「入室，僾然必有見乎其位；周還出戶，肅然必有聞其容聲；出戶而聽，愾然必有聞其歎息之聲。」是故，先王之孝也，色不忘乎目，聲不絕乎耳，心志耆欲不忘乎心。</p><p>夫致愛則存者，竭其誠愛，則死者之心常在於吾心；致愨則著者，極其恭敬，則死者之靈赫然有所象見。著存不忘乎心，夫安得不敬乎？</p><p>此與[[誠-儒學]]之義相通，亦為[[明善誠身]]之要義。</p></article></main></div></div>
