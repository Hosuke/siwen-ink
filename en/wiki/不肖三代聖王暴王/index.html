    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 不肖三代聖王暴王</nav></header><main><article><h1>不肖三代聖王暴王</h1><p>今人不能肖似古代聖王，反類於暴王。</p><p>夫桀傾紂覆，周滅陳亡，鹹由無禮，況匹庶乎！以如此者為高遠，以不爾者為騃野。嗚呼，惜乎，豈不哀哉！</p><p>夫三代聖王之所以為聖王，以其行禮義、修德教也。暴王之所以亡，以其縱欲肆志、棄禮法也。今之輕薄者，既不能法聖王之行，反效暴王之為，不亦悲乎！</p><p><strong>所出</strong>：《抱朴子 · 卷25》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷25</p></article></main></div></div>
