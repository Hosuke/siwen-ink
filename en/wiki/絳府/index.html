    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 絳府</nav></header><main><article><h1>絳府</h1><p>血凝所歸之府，在肺腑之間</p><p>夫人論和君賢之傷曰：「汝所傷，乃重刃關於肺，五臟泄漏，血凝絳府，氣激腸外，此將死之急也。」絳府者，血液凝結之處也。</p><p><strong>所出</strong>：《墉城集仙錄 · 卷04》 — https://zh.wikisource.org/wiki/墉城集仙錄/卷04</p></article></main></div></div>
