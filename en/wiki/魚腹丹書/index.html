    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 魚腹丹書</nav></header><main><article><h1>魚腹丹書</h1><p>陳涉假鬼神之說，以丹書置魚腹中，威服眾心之術也。</p><p>陳涉、吳廣以卜者之言，念鬼以威眾。乃丹書帛曰「陳勝王」，置人所罾魚腹中。卒買魚烹食，得魚腹中書，固以怪之矣。</p><p>魚腹丹書，與 [[篝火狐鳴]] 皆陳涉所以威服眾心之術。以神道設教，使愚闇之人震驚，而歸心於上也。</p><p><strong>所出</strong>：《史記 · 卷048》 — https://zh.wikisource.org/wiki/史記/卷048</p></article></main></div></div>
