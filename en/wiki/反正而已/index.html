    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 反正而已</nav></header><main><article><h1>反正而已</h1><p>詭巧之文，反正為乏，皆非正道。</p><p>自近代辭人，率好詭巧，原其為體，訛勢所變，厭黷舊式，故穿鑿取新，察其訛意，似難而實無他術也，反正而已。故文反正為乏，辭反正為奇。</p><p>近世之文，好為詭巧究其本原，乃訛勢之變爾，非有新術，不過反正而已。反於正則為乏，奇於常則為失其自然者也。</p><p><strong>所出</strong>：《文心雕龍 · 定勢》 — https://zh.wikisource.org/wiki/文心雕龍/定勢</p></article></main></div></div>
