    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 歲二月東巡守</nav></header><main><article><h1>歲二月東巡守</h1><p>天子巡省四方，諸侯述職。</p><p>歲二月，東巡守，至于岱宗，柴。望秩于山川，肆覲東后。協時月正日，同律度量衡。修五禮、五玉、三帛、二生、一死，贄。天子非惰也，以民事為急；諸侯非畏也，以述職為恭。</p><p><strong>所出</strong>：《尚書 · 舜典》 — https://zh.wikisource.org/wiki/尚書/舜典</p></article></main></div></div>
