    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 度量雖正未必聽</nav></header><main><article><h1>度量雖正未必聽</h1><p>度量法度雖正，人主不必聽納；義理辭說雖全，人主不必採用。言與行之間，有至難者在也。</p><p>故度量雖正，未必聽也；義理雖全，未必用也。</p><p><strong>所出</strong>：《韓非子 · 難言》 — https://zh.wikisource.org/wiki/韓非子/難言</p></article></main></div></div>
