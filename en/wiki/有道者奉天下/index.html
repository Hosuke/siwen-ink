    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 有道者奉天下</nav></header><main><article><h1>有道者奉天下</h1><p>居有餘以奉天下</p><p>孰能居有餘以奉天下不足者？[[有道之君]]能之。夫有道者，[[為而不恃]]，功成弗居，不以賢[[見賢]]自見，不以[[名與身孰親]]者為累，[[希言自然]]而天下化。[[上德無為而無以為]]，取天下之餘以給天下之闕，[[損有餘]]以奉不足，此[[無為之治]]之旨也。[[聖人四反]]，莫要於此。</p><p><strong>所出</strong>：《老子河上公章句 · 天道》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
