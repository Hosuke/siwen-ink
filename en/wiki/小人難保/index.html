    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 小人難保</nav></header><main><article><h1>小人難保</h1><p>民情易動難安，治之者當盡心體恤，不可安逸。</p><p>《康誥》誥康叔以為治民之道，曰「小人難保」。「小人」者，指匹夫匹婦而言也。小人之心，易動難安，乍寒乍暖，朝喜夕怨；為之上者，若但知安逸逸豫，不恤其情，則民散而畔矣。故治小人者，必盡其心，無康好逸豫，乃其乂民。觀民情之大可見者，正此意也。上以敬慎存心，則小人有所恃而不恐；上以安逸自縱，則小人無所依而思叛。</p><p><strong>所出</strong>：《尚書 · 康誥》 — https://zh.wikisource.org/wiki/尚書/康誥</p></article></main></div></div>
