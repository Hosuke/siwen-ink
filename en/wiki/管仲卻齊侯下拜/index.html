    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 管仲卻齊侯下拜</nav></header><main><article><h1>管仲卻齊侯下拜</h1><p>齊侯受胙將下拜，管仲以天威咫尺正之。</p><p>王使宰孔賜齊侯胙，曰：「天子有事于文武，使孔賜伯舅胙。」齊侯將下拜。孔曰：「且有後命，天子使孔曰：『以伯舅耋老，加勞賜一級，無下拜。』」對曰：「天威不違顏咫尺，小白，余敢貪天子之命無下拜？恐隕越于下，以遺天子羞，敢不下拜？」下拜登受。夫桓公之霸，挾天子以令諸侯，而不敢廢人臣之禮；管仲之功，正君臣之分，而不失霸王之義。此所以九合諸侯，一匡天下，而後世莫能及也。</p><p><strong>所出</strong>：《春秋左氏傳 · 僖公》 — https://zh.wikisource.org/wiki/春秋左氏傳/僖公</p></article></main></div></div>
