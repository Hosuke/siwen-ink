    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 維以告哀</nav></header><main><article><h1>維以告哀</h1><p>作詩以抒哀情之謂。</p><p>君子作歌，維以告哀。</p><p>「維」，語詞也。詩至卒章，君子作歌，非為風規，非為頌美，唯以抒寫一己之哀而已。詩人疊歷四時之苦、骨鯁之情，而無可告訴，唯形之歌詠以告哀於後世。此[[詩經]]「以詩言志」之正例，亦後世「詩可以怨」之濫觴。</p><p><strong>所出</strong>：《詩經 · 四月》 — https://zh.wikisource.org/wiki/詩經/四月</p></article></main></div></div>
