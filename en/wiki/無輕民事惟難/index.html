    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 無輕民事惟難</nav></header><main><article><h1>無輕民事惟難</h1><p>民之事不易為之，不可輕忽。</p><p>尹誥以民事之艱誡王。民之疾苦、力役、饑寒，皆不易措置，故明主治天下者，必不敢輕易視之。一輕之，則民困而邦危矣。</p><p><strong>所出</strong>：《尚書 · 太甲下》 — https://zh.wikisource.org/wiki/尚書/太甲下</p></article></main></div></div>
