    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 人無能不享祿</nav></header><main><article><h1>人無能不享祿</h1><p>無才能者不當受爵祿，此賞罰之公也。</p><p>周公誥殷士，明言殷之所以亡者，由於後嗣之王淫泆厥泆，不聽念先王勤家之誨。夫能者在位，有功者受賞，理所固然；無能而在位，無功而受祿，理之所不然。周之用人，一惟德與能，不問其世系與門地。故明示以賞勸，以罰禁，使人知取祿之塗，惟在盡所能以事上。此與「賞罰必信」義相成，而尤重在無能不享一事。</p><p><strong>所出</strong>：《尚書 · 多士》 — https://zh.wikisource.org/wiki/尚書/多士</p></article></main></div></div>
