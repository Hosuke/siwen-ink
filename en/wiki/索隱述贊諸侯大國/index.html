    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 索隱述贊諸侯大國</nav></header><main><article><h1>索隱述贊諸侯大國</h1><p>司馬貞述贊，論齊悼惠王封國之始末。</p><p>【索隱述贊】漢矯秦制，樹屏自彊。表海大國，悉封齊王。呂後肆怒，乃獻城陽。哀王嗣立，其力不量。硃虛仕漢，功大策長。東牟受賞，稱亂貽殃。膠東、濟北，雄渠、辟光。齊雖七國，忠孝者昌。</p><p><strong>所出</strong>：《史記 · 卷052》 — https://zh.wikisource.org/wiki/史記/卷052</p></article></main></div></div>
