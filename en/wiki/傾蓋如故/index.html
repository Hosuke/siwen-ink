    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 傾蓋如故</nav></header><main><article><h1>傾蓋如故</h1><p>偶然相遇傾蓋如故，知之無間也。</p><p>鄒陽獄中上書，引諺曰：「有白頭如新，傾蓋如故。」蓋言人之相知，不以交接之久暫為準。或白首往來而不相知，終同陌路；或偶然相遇、傾蓋共語，已如舊識。傾蓋者，車蓋相倚，言道塗相遇，片刻之頃，意氣相投，契合如故人也。此喻知交貴相知之心，不貴相見之日也。</p><p><strong>所出</strong>：《史記 · 卷083》 — https://zh.wikisource.org/wiki/史記/卷083</p></article></main></div></div>
