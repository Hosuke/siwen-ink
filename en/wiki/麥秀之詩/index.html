    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 麥秀之詩</nav></header><main><article><h1>麥秀之詩</h1><p>箕子過故殷墟，傷宮室毀壞，作詩以歌麥秀。</p><p>箕子朝周還國，過故殷墟。見宮室毀壞，生彼禾黍，心傷之。欲哭則不可，欲泣為其近妇人，乃作[[麥秀之詩]]以歌詠之。其辭曰：「麥秀漸漸兮，禾黍油油。彼狡童兮，不與我好兮！」狡童，指紂也。殷民聞之，皆為流涕。後人稱之為「麥秀之詩」。</p><p><strong>所出</strong>：《史記·卷038》 — https://zh.wikisource.org/wiki/史記/卷038</p></article></main></div></div>
