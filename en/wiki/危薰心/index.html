    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 危薰心</nav></header><main><article><h1>危薰心</h1><p>止限過中，心危如火</p><p>艮其限，列其夤，厲薰心：九三之爻辭也。限者，要限也。夤者，脊肉也。止於腰要，而至於分裂脊肉，危厲薰灼其心。<strong>象曰</strong>「艮其限，危薰心也」。止得其處則無咎，失其中則危。</p><p><strong>所出</strong>：《周易 · 艮》 — https://zh.wikisource.org/wiki/周易/艮</p></article></main></div></div>
