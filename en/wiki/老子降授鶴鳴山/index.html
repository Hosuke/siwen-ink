    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 老子降授鶴鳴山</nav></header><main><article><h1>老子降授鶴鳴山</h1><p>太上老君親降鶴鳴山，授張天師正一盟威秘錄。</p><p>老子乘雲降鶴鳴，授張道陵以秘錄符章凡一千二百官章。是道家天師立教之始。
