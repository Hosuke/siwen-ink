    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 更名官制</nav></header><main><article><h1>更名官制</h1><p>景帝更易官名，改廷尉為大理等，以正名實。</p><p>中六年，梁分為五，封四侯。更命廷尉為大理，將作少府為將作大匠，主爵中尉為都尉，長信詹事為長信少府，將行為大長秋，大行為行人，奉常為太常，典客為大行，治粟內史為大農。以大內為二千石，置左右內官，屬大內。</p><p><strong>所出</strong>：《史記 · 卷011》 — https://zh.wikisource.org/wiki/史記/卷011</p></article></main></div></div>
