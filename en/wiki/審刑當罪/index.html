    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 審刑當罪</nav></header><main><article><h1>審刑當罪</h1><p>刑罰與罪行相當，則人不敢爭讼，治道明矣。</p><p>審刑當罪，則人不易讼。刑罰者，國之利器也，用之不可以不慎。罪輕而刑重，則民怨；罪重而刑輕，則姦肆。唯裁之以法、斷之以義，使刑與罪相當、罰與功相稱，然後姦宄懼而善良安，此霸王之術所以行也。</p><p><strong>所出</strong>：《管子 · 第24篇問》 — https://zh.wikisource.org/wiki/管子/第24篇問</p></article></main></div></div>
