    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 一死一生乃知交情</nav></header><main><article><h1>一死一生乃知交情</h1><p>交情之真假，於生死、貴賤、贫富之際乃見。</p><p>翟公為廷尉，賓客填門；及廢，門外可設雀羅。翟公復為廷尉，賓客欲往，翟公乃人署其門曰：「一死一生，乃知交情。一貧一富，乃知交態。一貴一賤，交情乃見。」</p><p><strong>所出</strong>：《史記 · 卷120》 — https://zh.wikisource.org/wiki/史記/卷120</p></article></main></div></div>
