    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 昔育恐育鞠，及爾顛覆</nav></header><main><article><h1>昔育恐育鞠，及爾顛覆</h1><p>昔共艱難，今則不然。喻人事易變，恩義易忘。</p><p>「昔育恐育鞠，及爾顛覆」，言昔者共處艱難，畏懼困匱，相與顛覆而過之也。育，生也；鞠，窮也；顛覆，危難也。昔在艱虞之時，互相養育，共濟顛覆，可謂同舟而渡。及其既生既育，家道小康，乃以予為毒蟲而欲去之。是故言之美不如行之厚，恩之深不如分之永也。<strong>所出</strong>：《詩經 · 谷風》 — https://zh.wikisource.org/wiki/詩經/谷風</p></article></main></div></div>
