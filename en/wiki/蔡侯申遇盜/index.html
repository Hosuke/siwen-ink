    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 蔡侯申遇盜</nav></header><main><article><h1>蔡侯申遇盜</h1><p>蔡昭侯如吳，大夫公孫翩射殺之於家人。</p><p>蔡昭侯將如吳，諸大夫恐其又遷也。承、公孫翩逐而射之，入於家人而卒。以兩矢門之，眾莫敢進。文之鍇後至，曰：「如牆而進，多而殺二人。」鍇執弓而先，翩射之，中肘，鍇遂殺之。故逐公孫辰，而殺公孫姓、公孫盱。</p><p><strong>所出</strong>：《春秋左氏傳 · 哀公四年》 — https://zh.wikisource.org/wiki/春秋左氏傳/哀公</p></article></main></div></div>
