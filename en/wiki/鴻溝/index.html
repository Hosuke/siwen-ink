    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 鴻溝</nav></header><main><article><h1>鴻溝</h1><p>戰國魏所鑿渠，首通宋、鄭、陳、蔡、曹、衛與濟、汝、淮泗之水道。</p><p>鴻溝者，戰國魏孝文王時所開之渠也。《史記》載：「自是之後，滎陽下引河東南為鴻溝，以通宋、鄭、陳、蔡、曹、衛，與濟、汝、淮、泗會。」蓋引河水東南流，貫通中原水系，使列國得以漕運相通。楚國西方則通渠漢水、雲夢之野；吳國通渠三江、五湖；齊國通菑、濟之閒。鴻溝既成，交通便捷，實為戰國水利之樞紐。後世亦稱鴻溝為楚漢分界之所。</p><p><strong>所出</strong>：《史記 · 卷029》 — https://zh.wikisource.org/wiki/史記/卷029</p></article></main></div></div>
