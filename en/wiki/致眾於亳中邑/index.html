    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 致眾於亳中邑</nav></header><main><article><h1>致眾於亳中邑</h1><p>湯致夏民於亳中邑，以示天下歸往之志。</p><p>湯翦滅夏，致眾於亳中邑。致者，招徠也；中邑者，天下之中也。湯既得夏之金玉，舍之以賞民；又致夏之眾民，歸之以實亳。示天下曰：吾之所以王，非獨以兵強，取其土而已，實欲得民心、致賢士、為天下之歸也。</p><p><strong>所出</strong>：《尚書 · 尹誥》 — https://zh.wikisource.org/wiki/尚書/尹誥</p></article></main></div></div>
