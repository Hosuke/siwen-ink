    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 輕取於民重致於君</nav></header><main><article><h1>輕取於民重致於君</h1><p>聖王禁削上以附下、枉法以求民之私行。</p><p>交於利通而獲於貧窮，輕取於其民而重致於其君，削上以附下，枉法以求於民者，聖王之禁也。</p><p><strong>所出</strong>：《管子 · 第14篇法禁》 — https://zh.wikisource.org/wiki/管子/第14篇法禁</p><hr><p>夫民有餘則輕之，故人君斂之以輕；民不足則重之，故人君散之以重。斂積之以輕，散行之以重，故君必有什倍之利，而財之櫎可得而平也。</p><p><strong>所出</strong>：《管子 · 第73篇國蓄》 — https://zh.wikisource.org/wiki/管子/第73篇國蓄</p></article></main></div></div>
