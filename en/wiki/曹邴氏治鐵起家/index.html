    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 曹邴氏治鐵起家</nav></header><main><article><h1>曹邴氏治鐵起家</h1><p>魯人曹邴氏以鐵冶起，富至巨萬，約俛有拾，仰有取。</p><p>魯人俗儉嗇，而曹邴氏尤甚，以鐵冶起，富至巨萬。然家自父兄子孫孫約，俛有拾，仰有取，貰貸行賈遍郡國。鄒、魯以其故多去文學而趨利者，以曹邴氏也。</p><p><strong>所出</strong>：《史記 · 卷129》 — https://zh.wikisource.org/wiki/史記/卷129</p></article></main></div></div>
