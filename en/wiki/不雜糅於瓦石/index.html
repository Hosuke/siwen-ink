    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 不雜糅於瓦石</nav></header><main><article><h1>不雜糅於瓦石</h1><p>大賢不遇時，則不屑與瓦石混雜，以見守身之志。</p><p>抱朴子言大賢不遇之節：「夫其不遇，亦得不雜糅於瓦石，鈞賤於朽木，列鑣於下乘，等望於凡瑣哉！」</p><p><strong>所出</strong>：《抱朴子 · 卷20》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷20</p></article></main></div></div>
