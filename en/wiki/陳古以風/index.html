    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 陳古以風</nav></header><main><article><h1>陳古以風</h1><p>陳述古之善政，以諷今之闕失也。</p><p>序云「襄公好田獵，畢弋，而不脩民事。百姓苦之，故陳古以風焉」。[[陳古刺今|陳古]]者，引先王之善政、古君子之美德以諷當世也。襄公以田獵為樂，荒廢民事，詩人假古之賢者為比，使襄公聞之而自悟，其旨深婉而不直斥焉。</p><p><strong>所出</strong>：《詩經 · 盧令》 — https://zh.wikisource.org/wiki/詩經/盧令</p></article></main></div></div>
