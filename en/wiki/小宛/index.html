    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 小宛</nav></header><main><article><h1>小宛</h1><p>詩人戒慎恐懼，勉子孫守道以承先業。</p><p>《小宛》，《詩經·小雅》之什也。舊說以為大夫遭時之亂、憂懼而作，以戒慎戒其子弟。詩以鳴鳩起興，念先人而能不寐；次言齊聖之人溫克以禮，昏醉則失儀而違天命；繼以採菽教子之喻，明善導之義；復借脊令之飛鳴，勉人夙興夜寐、無辱所生；又以桑扈啄粟興己之困乏，握粟問卜以占吉凶；終以恭人惴惴、履冰之戒，極言戒懼之旨。詩分六章，章六句，凡三十六句。</p><p><strong>所出</strong>：《詩經 · 小宛》 — https://zh.wikisource.org/wiki/詩經/小宛</p></article></main></div></div>
