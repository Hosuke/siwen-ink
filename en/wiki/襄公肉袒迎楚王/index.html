    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 襄公肉袒迎楚王</nav></header><main><article><h1>襄公肉袒迎楚王</h1><p>鄭降楚，襄公肉袒牽羊以迎，言不敢有事邊邑</p><p>楚圍鄭三月，鄭以城降楚。楚王入自皇門，鄭襄公肉袒掔羊以迎，曰：「孤不能事邊邑，使君王懷怒以及獘邑，孤之罪也。敢不惟命是聽。君王遷之江南，及以賜諸侯，亦惟命是聽。若君王不忘厲、宣王，桓、武公，哀不忍絶其社稷，錫不毛之地，使復得改事君王，孤之願也，然非所敢望也。敢布腹心，惟命是聽。」莊王為卻三十里而後舍。</p><p><strong>所出</strong>：《史記 · 卷042》 — https://zh.wikisource.org/wiki/史記/卷042</p></article></main></div></div>
