    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 非助我者</nav></header><main><article><h1>非助我者</h1><p>顏淵於夫子之言無所不悅，非助於教者也。</p><p>子曰：「回也，非助我者也！於吾言，無所不說。」</p><p>顏淵師事夫子，聞言即悟，無所疑問。夫子云「非助我」，非責之也，乃歎其穎悟過人，無可增益耳。</p><p><strong>所出</strong>：《論語 · 先進第十一》 — https://zh.wikisource.org/wiki/論語/先進第十一</p></article></main></div></div>
