    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 周公之過</nav></header><main><article><h1>周公之過</h1><p>周公之過，不亦宜乎？弟恭事兄，理固然也。</p><p>周公，弟也；管叔，兄也。周公之過，不亦宜乎？</p><p>孟子答陳賈之問，以周公使管叔監殷而管叔畔之事。周公知而使之，是不仁也；不知而使之，是不智也。雖然，周公之過，實情有可原焉。管叔，周公之兄也；周公，弟也。以弟而使兄任事，兄既有畔，弟之失察，其過輕矣。夫兄弟之義，弟恭於兄，理之常也；豈可逆料兄之畔而預絕之哉？故曰：周公之過，不亦宜乎。言其情可恕，其理可通也。</p><p><strong>所出</strong>：《孟子 · 公孫丑下》 — https://zh.wikisource.org/wiki/孟子/公孫丑下</p></article></main></div></div>
