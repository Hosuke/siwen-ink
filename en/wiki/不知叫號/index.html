    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 不知叫號</nav></header><main><article><h1>不知叫號</h1><p>言安逸之人不知民間疾苦。</p><p>「或不知叫號」，[[詩經·北山]]之句。言在上者安逸而不知民之疾苦，無所呼號。與「慘慘劬勞」者相對，以見賢者之辛勤與不肖者之逸豫也。</p><p><strong>所出</strong>：《詩經 · 北山》 — https://zh.wikisource.org/wiki/詩經/北山</p></article></main></div></div>
