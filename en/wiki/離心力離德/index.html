    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 離心力離德</nav></header><main><article><h1>離心力離德</h1><p>人心離散、道德敗壞，雖眾必亡。</p><p>受有億兆夷人，離心離德。言紂有億兆之眾，然人心各懷異志、道德相背乖也。離心者，群而不群，貌合而神離；離德者，背義而行，相害而不相利。一人之力不足以敵天下，一心之力方能動萬民。[[離群犯上]]言其跡，此言其本。離心則無以成師，離德則無以服人，雖兵多地廣，終必亡也。</p><p><strong>所出</strong>：《尚書 · 泰誓中》 — https://zh.wikisource.org/wiki/尚書/泰誓中</p></article></main></div></div>
