    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 逝不古處</nav></header><main><article><h1>逝不古處</h1><p>責其不循舊日之情，恩義乖離</p><p>「逝」者，往也，語詞之轉。「古處」者，以古道相處也。言往日之時，匹偶之間尚能以恩義相接；今則不然，往而不返，莫肯以古道相處矣。《毛詩序》以為莊姜傷己「不見荅於先君」，正此之謂。蓋遇人不淑，往恩莫繼，故詩人追述昔時、相比如今，益以見其情之已渝也。</p><p><strong>所出</strong>：《詩經 · 日月》 — https://zh.wikisource.org/wiki/詩經/日月</p></article></main></div></div>
