    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 聽言不可不察</nav></header><main><article><h1>聽言不可不察</h1><p>聽言必慎，否則善惡不分，亂莫大焉。</p><p>聽言不可不察。不察則善不善不分。善不善不分，亂莫大焉。三代分善不善，故王。今天下彌衰，聖王之道廢絕。</p><p>聽言不可不察。聽言必以法察之，以量揆之，以數驗之。若此則是非無所失，而舉措無所過矣。</p><p>功先名，事先功，言先事。不知事惡能聽言？不知情惡能當言？其與人穀言也，其有辯乎？其無辯乎？</p><p><strong>所出</strong>：《呂氏春秋 · 卷十三》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十三</p></article></main></div></div>
