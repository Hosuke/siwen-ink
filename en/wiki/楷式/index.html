    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 知此兩者亦楷式</nav></header><main><article><h1>知此兩者亦楷式</h1><p>以智、不以智治國，二者皆可為法式。</p><p>知此兩者亦楷式。</p><p>[[楷式]]者，[[以智治國]]與[[不以智治國]]二者，皆可為治國之法式。善為道者知其利害，是非皎然，可以為模範。</p><p>河上公注云：两者，智治國、不智治國也。兩者皆可為法式，常知法式，是所以為玄德。</p><p><strong>所出</strong>：《老子河上公章句 · 淳德》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
