    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 碩果不食</nav></header><main><article><h1>碩果不食</h1><p>一陽獨存如碩果未食，君子之象，剝盡而復幾也。</p><p>《剝》上九：「碩果不食。」</p><p>上九為剝卦唯一陽爻，在五陰之上，如碩大之果高懸枝頭，未嘗食之也。果碩大而不可食，是果已熟而人未取，以其猶在樹上也。</p><p>夫陽者，君子之道也。五陰剝陽，陽止存其一，是小人盛而君子猶未盡去也。象曰：「君子得輿，民所載也。」此陽爻尚存，君子得行其道，猶民之得輿以載也。</p><p>然剝之終，陽終有盡時，則「小人剝廬」，無以庇蔭矣。故「碩果不食」，亦寓剝極必復之幾也。</p><p><strong>所出</strong>：《周易 · 剝》 — https://zh.wikisource.org/wiki/周易/剝</p></article></main></div></div>
