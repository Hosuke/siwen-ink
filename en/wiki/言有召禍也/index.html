    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 言有召禍也，行有招辱也</nav></header><main><article><h1>言有召禍也，行有招辱也</h1><p>言之不慎，足以招殃；行之不檢，足以致辱。君子謹其所立。</p><p>物類之起，必有所始。榮辱之來，必象其德。肉腐出蟲，魚枯生蠹。怠慢忘身，禍災乃作。强自取柱，柔自取束。邪穢在身，怨之所構。施薪若一，火就燥也；平地若一，水就濕也。草木疇生，禽獸群焉，物各從其類也。是故質的張而弓矢至焉，林木茂而斧斤至焉，樹成蔭而眾鳥息焉，醯酸而蚋聚焉。故言有召禍也，行有招辱也，君子慎其所立乎！</p><p><strong>所出</strong>：《荀子 · 勸學篇》 — https://zh.wikisource.org/wiki/荀子/勸學篇</p></article></main></div></div>
