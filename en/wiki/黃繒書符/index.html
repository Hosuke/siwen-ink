    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 黃繒書符</nav></header><main><article><h1>黃繒書符</h1><p>朱書玉符於黃繒以佩，存呼神名以鎮五藏。</p><p>黃繒書符，大洞三十章所示用符之法也。當以朱書玉符於黃繒之上，佩之於身。存呼白炁君內諱名字，鎮兆五藏之上，則七祖解釋，消結滅罪。乃叩齒二通，咽液二過以終其儀。</p><p><strong>所出</strong>：《上清大洞真經 · 30章》 — https://zh.wikisource.org/wiki/上清大洞真經/30章</p></article></main></div></div>
