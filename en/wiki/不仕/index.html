    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 不仕</nav></header><main><article><h1>不仕</h1><p>取人以人者，其去人亦用人，不仕以全志也。</p><p>客欲見桓公，請仕上官授祿千鍾，既得公許，反辭不仕。曰：「臣聞取人以人者，其去人也亦用人。吾不仕矣。」以道不合，故決然辭去。</p><p><strong>所出</strong>：《管子 · 第51篇小問》 — https://zh.wikisource.org/wiki/管子/第51篇小問</p></article></main></div></div>
