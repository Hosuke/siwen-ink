    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 四維</nav></header><main><article><h1>四維</h1><p>禮、義、廉、恥，國之四維，闕一則傾。</p><p>國有四維。一維絶則傾，二維絶則危，三維絶則覆，四維絶則滅。傾可正也，危可安也，覆可起也，滅不可復錯也。何謂四維？一曰禮，二曰義，三曰廉，四曰恥。禮不踰節，義不自進，廉不蔽惡，恥不從枉。故不躐節則上位安，不自進則民無巧詐，不蔽惡則行自全，不從枉則邪事不生。四維不張，國乃滅亡。</p><p><strong>所出</strong>：《管子 · 第01篇牧民》 — https://zh.wikisource.org/wiki/管子/第01篇牧民</p></article></main></div></div>
