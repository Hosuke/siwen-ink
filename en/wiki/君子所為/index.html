    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 君子所為</nav></header><main><article><h1>君子所為</h1><p>君子之行，非眾人所能識；務在其志，不在其跡。</p><p>君子之所為，眾人固不識也。</p><p>孟子引[[孔子]]去魯之事為例：孔子為魯司寇，不用，從而祭，燔肉不至，不稅冕而行。不知者以為為肉也，其知者以為為無禮也，乃孔子則欲以微罪行，不欲為茍去。</p><p>是故君子之出處進退，非以利害為衡，乃以義理為準。為無禮而去，固非也；為無肉而去，亦淺之窺也。聖人之用心，微妙難測，唯君子與君子乃能相喻，眾人固未足以語此也。</p><p><strong>所出</strong>：《孟子 · 告子下》 — https://zh.wikisource.org/wiki/孟子/告子下</p></article></main></div></div>
