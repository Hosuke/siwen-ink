    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 且懷且威</nav></header><main><article><h1>且懷且威</h1><p>兼施恩威，則民親之畏之，此為君道之大全。</p><p>人主者，溫良寬厚則民愛之，整齊嚴莊則民畏之。故民愛之則親，畏之則用。夫民親而為用，主之所急也。故曰：「且懷且威，則君道備矣。」</p><p>愛之而無威，則民玩；畏之而無恩，則民離。管子以為，明主馭民，必兼恩威二者：寬厚以懷之，使民樂其上；整齊以威之，使民畏其令。恩威相濟，親畏並施，則民為主用而君道成矣。</p><p><strong>所出</strong>：《管子 · 第64篇形勢解》 — https://zh.wikisource.org/wiki/管子/第64篇形勢解</p></article></main></div></div>
