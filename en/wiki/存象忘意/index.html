    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 存象忘意</nav></header><main><article><h1>存象忘意</h1><p>存象忘意之由，在互體不足遂及卦變，變又不足推致五行；忘象以求其義，斯見矣。</p><p>案文責卦有馬无乾則僞說滋漫，互體不足遂及卦變，變又不足推致五行，一失其原巧愈彌甚。蓋存象忘意之由也，忘象以求其義，義斯見矣。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷10》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷10</p></article></main></div></div>
