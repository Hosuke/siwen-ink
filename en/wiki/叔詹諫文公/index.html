    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 叔詹諫文公</nav></header><main><article><h1>叔詹諫文公</h1><p>叔詹言重耳賢且同姓，不可無禮；殺之則為鄭憂</p><p>晉公子重耳過鄭，文公弗禮。文公弟叔詹曰：「重耳賢，且又同姓，窮而過君，不可無禮。」文公曰：「諸侯亡公子過者多矣，安能盡禮之！」詹曰：「君如弗禮，遂殺之；弗殺，使即反國，為鄭憂矣。」文公弗聽。</p><p><strong>所出</strong>：《史記 · 卷042》 — https://zh.wikisource.org/wiki/史記/卷042</p></article></main></div></div>
