    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 信立而霸</nav></header><main><article><h1>信立而霸</h1><p>守信則諸侯信服，可以成霸業。</p><p>德雖未至，義雖未濟，然天下之理略奏，刑賞已諾信乎天下矣。政令已陳，雖睹利敗，不欺其民；約結已定，雖睹利敗，不欺其與。如是，則兵勁城固，敵國畏之；國一綦明，與國信之。齊桓、晉文、楚莊、吳闔閭、越句踐，皆僻陋之國，威動天下，彊殆中國，略信也。</p><p><strong>所出</strong>：《荀子 · 王霸篇》 — https://zh.wikisource.org/wiki/荀子/王霸篇</p></article></main></div></div>
