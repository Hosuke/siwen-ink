    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 化柄</nav></header><main><article><h1>化柄</h1><p>儉為萬化之柄，守儉則仁不蕩、義不亂、禮不奢、智不變、信不惑。</p><p>儉於聽可以養虛，儉於視可以養神，儉於言可以養氣，儉於私可以護富，儉於公可以保貴，儉於門闥可以無盜賊，儉於環衞可以無叛亂，儉於職官可以無姦佞，儉於嬪嬙可以保壽命，儉於心可以出生死。是知儉可以為萬化之柄。</p><p><strong>所出</strong>：《化書 · 卷六》 — https://zh.wikisource.org/wiki/化書/卷六</p></article></main></div></div>
