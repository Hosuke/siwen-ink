    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 頍弁</nav></header><main><article><h1>頍弁</h1><p>《小雅》篇名，刺幽王不能親睦宗族、孤危將亡之詩。</p><p>《頍弁》，《小雅》之什也。詩序云：「幽王也。暴戾無親，不能宴樂同姓，親睦九族，孤危將亡，故作是詩。」三章，章十二句。首章以[[有頍者弁]]起興，言[[爾酒既旨爾殽既嘉]]，而兄弟[[蔦與女蘿]]之喻以相依。卒章以[[如彼雨雪先集維霰]]起興，言[[死喪無日]]，[[樂酒今夕君子維宴]]，蓋知[[孤危將亡]]而無可如何之辭也。</p><p><strong>所出</strong>：《詩經 · 頍弁》 — https://zh.wikisource.org/wiki/詩經/頍弁</p></article></main></div></div>
