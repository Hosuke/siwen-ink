    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 始文終武</nav></header><main><article><h1>始文終武</h1><p>煉丹之功，初始以文火溫養，終竟以武火結丹。</p><p>始文使可休，終竟武乃成。候視加謹密，審察調寒溫。</p><p><strong>所出</strong>：《周易參同契 · 14章》 — https://zh.wikisource.org/wiki/周易參同契/14章</p></article></main></div></div>
