    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 聖事有剖判</nav></header><main><article><h1>聖事有剖判</h1><p>聖道可分，非必總而兼之。</p><p>或曰：「聖人之道，不得枝分葉散，必總而兼之，然後為聖。」</p><p>抱朴子答曰：「孔子門徒達者七十二，而各得聖人之一體，是聖事有剖判也。顏淵具體而微，是聖事有厚薄也。」又《易》曰「有聖人之道四焉」：以言者尚其辭，以動者尚其變，以制器者尚其象，以卜筮者尚其占。此聖道可分之明證也。</p><p><strong>所出</strong>：《抱朴子 · 卷12》 — https://zh.wikisource.org/wiki/抱朴子/卷12</p></article></main></div></div>
