    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 武王伐紂吹律聽聲</nav></header><main><article><h1>武王伐紂吹律聽聲</h1><p>武王伐紂，吹律審聲，以定吉凶。</p><p>武王伐紂，吹律聽聲，推孟春以至於季冬，殺氣相並，而音尚宮。同聲相從，物之自然，何足怪哉？</p><p>師行之際，律管候氣，聲與殺氣相應。孟春至季冬，陰陽之氣迭轉，而聲尚宮，以黃鐘為本。殺氣與宮音相並，乃知師出之吉凶也。</p><p><strong>所出</strong>：《史記 · 卷025》 — https://zh.wikisource.org/wiki/史記/卷025</p></article></main></div></div>
