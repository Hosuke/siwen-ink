    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 無胥遠矣</nav></header><main><article><h1>無胥遠矣</h1><p>兄弟姻婭，不可相疏。</p><p>兄弟昏姻之道，莫貴於相親相保。骨肉之親，以情誼聯絡為本，不可相棄而遠之也。詩人見幽王疏遠九族，使骨肉乖離，故戒以「無胥遠」。</p><p><strong>所出</strong>：《詩經 · 角弓》 — https://zh.wikisource.org/wiki/詩經/角弓</p></article></main></div></div>
