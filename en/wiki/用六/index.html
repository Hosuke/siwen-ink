    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 用六</nav></header><main><article><h1>用六</h1><p>坤卦用六，利永貞，以大終。</p><p>坤曰「用六：利永貞」。坤象曰：「用六永貞，以大終也。」</p><p>用六者，坤卦特有之占。坤純陰，柔而能貞，以長久正固為利。以大終者，陽大陰小，陰從陽而成事，坤道至此而終，則陽得代成萬物也。</p><p><strong>所出</strong>：《周易 · 坤》 — https://zh.wikisource.org/wiki/周易/坤</p></article></main></div></div>
