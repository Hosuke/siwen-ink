    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 吳王射狙</nav></header><main><article><h1>吳王射狙</h1><p>吳王射狙，狙死；顏不疑師董梧以助其色，去樂辭顯，三年而國人稱之。</p><p>吳王浮於江，登乎狙之山。衆狙見之，恂然棄而走，逃於深蓁。有一狙焉，委蛇攫，見巧乎王。王射之，敏給搏捷矢。王命相者趨射之，狙執死。王顧謂其友顏不疑曰：「之狙也，伐其巧恃其便以敖予，以至此殛也！戒之哉！嗟乎，無以汝色驕人哉！」顏不疑歸而師董梧以助其色，去樂辭顯，三年而國人稱之。</p><p><strong>所出</strong>：《莊子 · 徐無鬼》 — https://zh.wikisource.org/wiki/莊子/徐無鬼</p></article></main></div></div>
