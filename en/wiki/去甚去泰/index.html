    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 去甚去泰</nav></header><main><article><h1>去甚去泰</h1><p>聖人制事，當去過分之嗜，使身無害。</p><p>香美脆味，厚酒肥肉，甘口而疾形；曼理皓齒，說情而捐精。故去甚去泰，身乃無害。夫人之情，欲利而惡害。嗜慾無涯，終傷其躬。聖人觀此，知物盛則衰、理極必反之勢，故去彼過甚、防其過泰，使嗜欲有節，身心無損。此聖人所以全生而遠害也。</p><p><strong>所出</strong>：《韓非子 · 揚權》 — https://zh.wikisource.org/wiki/韓非子/揚權</p></article></main></div></div>
