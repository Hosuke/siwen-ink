    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 帝王之術</nav></header><main><article><h1>帝王之術</h1><p>成就帝業之治道，李斯師事荀卿所學也。</p><p>帝王之術，所以明大聖之德，通維初之道，治衰世之變，褒隆盛而貶末政也。</p><p>《要略》曰：「《本經》者，所以明大聖之德，通維初之道，埒略衰世古今之變，以褒先世之隆盛，而貶末世之曲政也。所以使人黜耳目之聰明，精神之感動，樽流遁之觀，節養性之和，分帝王之操，列小大之差者也。」</p><p>[[帝王之道]]與帝王之術，體用一源。明其道則通，達其術則用，此[[霸王之兵]]所以異於黷武也。</p><p><strong>所出</strong>：《淮南子 · 要略》 — https://zh.wikisource.org/wiki/淮南子/要略</p></article></main></div></div>
