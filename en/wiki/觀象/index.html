    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 觀象</nav></header><main><article><h1>觀象</h1><p>觀察卦象以明義，順止之要務也。</p><p>《剝》之彖曰：「順而止之，觀象也。」</p><p>象者，卦象也。坤在下而艮在上，山附於地，剝落之象。君子觀此象，乃知時當退止，不可躁進。</p><p>《繫辭》云：「易者，象也。象也者，像也。」聖人設卦觀象，繫辭焉以明吉凶。觀象者，觀一卦之象、六爻之象，以會通其義，而知趨避也。</p><p>《剝》之象，山體崩剝，止於地上；觀之，則知厚下以安宅。此觀象之效也。</p><p><strong>所出</strong>：《周易 · 剝》 — https://zh.wikisource.org/wiki/周易/剝</p></article></main></div></div>
