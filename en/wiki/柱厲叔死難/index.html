    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 柱厲叔死難</nav></header><main><article><h1>柱厲叔死難</h1><p>知而不死者爲忤，不知而死亦死者，柱厲叔以醜後世。</p><p>[[柱厲叔]]事[[莒敖公]]，自爲不知己，去，居海上，夏日則食菱芰，冬日則食橡栗。[[莒敖公]]有難，柱厲叔辭其友而往死之。其友曰：「子自以爲不知己，故去。今往死之，是知與不知無辨也。」柱厲叔曰：「不然。自以爲不知，故去。今死，是果不知我也。吾將死之，以醜後世之人主不知其臣者也。」凡知則死之，不知則弗死，此直道而行者也。柱厲叔可謂懟以忘其身者也。</p><p><strong>所出</strong>：《列子 · 說符篇》 — https://zh.wikisource.org/wiki/列子/說符篇</p></article></main></div></div>
