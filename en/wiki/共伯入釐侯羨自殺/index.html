    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 共伯入釐侯羨自殺</nav></header><main><article><h1>共伯入釐侯羨自殺</h1><p>共伯弟和賂士，襲攻共伯，共伯入羨自殺，諡曰共伯而立和為武公。</p><p>共伯弟和有寵於釐侯，多予之賂；和以其賂賂士，以襲攻共伯於墓上，共伯入釐侯羨自殺。衞人因葬之釐侯旁，諡曰共伯，而立和為衞侯，是為武公。</p><p><strong>所出</strong>：《史記 · 卷037》 — https://zh.wikisource.org/wiki/史記/卷037</p></article></main></div></div>
