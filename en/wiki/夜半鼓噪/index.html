    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 夜半鼓噪</nav></header><main><article><h1>夜半鼓噪</h1><p>夜半四面鼓譟以破敵之法。</p><p>因素出兵施伏，夜半城上四面鼓噪，適人必或，有此必破軍殺將。</p><p>令死士左右出穴門擊遺師，令賁士、主將皆聽城鼓之音而出，又聽城鼓之音而入。鼓音出則出，鼓音入則入，紀律分明，敵無所測。</p><p>以白衣為服，以號相得，號令闇合，敵不知所向，此奇正相生之道、破軍殺將之術也。</p><p><strong>所出</strong>：《墨子 · 備梯》 — https://zh.wikisource.org/wiki/墨子/備梯</p></article></main></div></div>
