    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 太帝晨炁</nav></header><main><article><h1>太帝晨炁</h1><p>太帝之炁，朝發於喉，入於三宮。</p><p>太帝晨炁者，太上道君晨朝之炁。脾中五真養光君守喉根死門，使此炁往來三宮之中。[[存思]]太帝晨炁者，須先固塞死門，使生炁常存，死炁不入，[[長生久視]]之道也。</p><p><strong>所出</strong>：《上清大洞真經 · 15章》 — https://zh.wikisource.org/wiki/上清大洞真經/15章</p></article></main></div></div>
