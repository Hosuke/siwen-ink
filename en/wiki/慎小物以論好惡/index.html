    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 慎小物以論好惡</nav></header><main><article><h1>慎小物以論好惡</h1><p>小物不慎則亂生，聖主謹小物以論好惡，上下乃不相失。</p><p>上尊下卑。卑則不得以小觀上。尊則恣，恣則輕小物，輕小物則上無道知下。下無道知上。上下不相知，則上非下，下怨上矣。人臣之情，不能為所怨；人主之情，不能愛所非；此上下大相失道也。故賢主謹小物以論好惡。</p><p>巨防容螻，而漂邑殺人；突洩一熛，而焚宮燒積；將失一令，而軍破身死；主過一言，而國殘名辱，為後世笑。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十五》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十五</p></article></main></div></div>
