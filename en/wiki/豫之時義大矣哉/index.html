    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 豫之時義大矣哉</nav></header><main><article><h1>豫之時義大矣哉</h1><p>豫之時節與其義理，關係至大，不可不察。</p><p>豫之時義，非小事也。「天地以順動，故日月不過，而四時不忒；聖人以順動，則刑罰清而民服。」夫能順天理、合時宜，則賞罰分明而天下治；悖於是，則逸豫生奸，凶咎隨之。故「豫之時義大矣哉」，聖人反覆致意於此，非徒贊豫之美，實以戒後世之溺於豫者也。</p><p><strong>所出</strong>：《周易 · 豫》 — https://zh.wikisource.org/wiki/周易/豫</p></article></main></div></div>
