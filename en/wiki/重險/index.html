    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 重險</nav></header><main><article><h1>重險</h1><p>坎之為義，重疊之險也。</p><p>彖傳曰：「習坎，重險也。」</p><p>坎之象為水，水之流就下，陷溺為險。上坎下坎，是為重險。言天地之間，險莫大於水難，而處險者以心懷誠信為尚也。</p><p><strong>所出</strong>：《周易 · 坎》 — https://zh.wikisource.org/wiki/周易/坎</p></article></main></div></div>
