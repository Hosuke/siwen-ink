    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 夔擊石拊石</nav></header><main><article><h1>夔擊石拊石</h1><p>樂和而百獸率舞，鳳皇來儀。</p><p>夔掌樂，以石磬為眾音之宗。戛擊鳴球，搏拊琴瑟，堂上之樂與堂下之樂迭奏，上管鼗鼓，下笙鏞以間，樂以和人神。鳥獸聞《[[蕭韶]]》九成之音，亦蹌蹌然而舞。及於百獸率舞，則鳳皇亦儀於庭。樂之和也，通於天地，感於鳥獸，協於神人，非聖人孰能興此？</p><p><strong>所出</strong>：《尚書 · 益稷》 — https://zh.wikisource.org/wiki/尚書/益稷</p></article></main></div></div>
