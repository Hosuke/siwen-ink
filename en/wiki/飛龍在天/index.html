    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 飛龍在天</nav></header><main><article><h1>飛龍在天</h1><p>聖人作而萬物覩，位乎天德，天下治也。</p><p>九五：飛龍在天，利見大人。</p><p>象曰：飛龍在天，大人造也。
文言曰：「飛龍在天」，上治也。又曰：乃位乎天德。</p><p>夫大人者，與天地合其德，與日月合其明，與四時合其序，與鬼神合其吉凶；先天而天弗違，後天而奉天時，天且弗違，而況於人乎？況於鬼神乎？同聲相應，同氣相求；水流濕，火就燥，雲從龍，風從虎；聖人作而萬物覩；本乎天者親上，本乎地者親下，則各從其類也。本乎天者親上，聖人得天位也。</p><p><strong>所出</strong>：《周易 · 乾》 — https://zh.wikisource.org/wiki/周易/乾</p></article></main></div></div>
