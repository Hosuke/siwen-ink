    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 蜾蠃負螟蛉之子</nav></header><main><article><h1>蜾蠃負螟蛉之子</h1><p>蠢動無定情，萬物無定形，馬可飛、魚可馳、土木偶可有知</p><p>夫蠮蠶之蟲，孕螟蛉之子，傳其情，交其精，混其氣，和其神。隨物大小，俱得其真。蠢動無定情，萬物無定形。小人由是知馬可使之飛，魚可使之馳，土木偶可使之有知，嬰兒似乳母，斯道不遠矣。</p><p><strong>所出</strong>：《化書 · 卷二》 — https://zh.wikisource.org/wiki/化書/卷二</p></article></main></div></div>
