    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 載見辟王</nav></header><main><article><h1>載見辟王</h1><p>諸侯率從，朝見天王，以求典章法度。</p><p>諸侯來朝，謁見天子，曰求典章。《詩》首章言：「載見辟王，曰求厥章。」載，發語辭。辟王，謂天王也。諸侯率是以見王，而先之以求章者，蓋欲明上下之分，定尊卑之序也。</p><p>《載見》之詩，蓋寫成王帥諸侯朝于武王之廟，奉饗以祭，頌禱以祈眉壽多福。首揭「載見辟王」四字，見天下諸侯所以尊奉王室者，無他，以其能出典章、正名分耳。</p><p><strong>所出</strong>：《詩經 · 載見》 — https://zh.wikisource.org/wiki/詩經/載見</p></article></main></div></div>
