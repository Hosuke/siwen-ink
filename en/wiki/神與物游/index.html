    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 神與物游</nav></header><main><article><h1>神與物游</h1><p>心神與外物交感，往來無礙，為文思之要也。</p><p>劉勰明言「思理為妙，神與物游」。神者，心神也；物者，外境也。神與物游者，心神超乎形骸之上，往來馳騁，與萬物相交感也。故志氣為之統關，辭令為之管機，關鍵通則神遊無礙，機括塞則神有遁心。遊於物者，非滯於物也，乃心與物化，意與象融，方能寫出風雲之態、珠玉之聲。</p><p><strong>所出</strong>：《文心雕龍 · 神思》 — https://zh.wikisource.org/wiki/文心雕龍/神思</p></article></main></div></div>
