    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 陽虎以解眾</nav></header><main><article><h1>陽虎以解眾</h1><p>陽虎竊寶玉大弓，既得之而忽以解眾，還之於官。</p><p>定公八年，盜竊寶玉、大弓。九年乃得之。寶玉者，封圭也；大弓者，武王之戎弓也。周公受賜，藏之魯。</p><p>其不地，何也？蓋陽虎得之於堤下，旋即以解眾還之。既非取之於己，故不書所得之地也。</p><p><strong>所出</strong>：《春秋穀梁傳 · 定公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/定公</p></article></main></div></div>
