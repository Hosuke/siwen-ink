    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 不自視故明</nav></header><main><article><h1>不自視故明</h1><p>聖人內視無為，故能洞察萬物。</p><p>不自視故明，不自見故彰，不自伐故有功，弗矜故能長。自視者蔽，自見者執，自伐者驕，矜者夸，皆失道之患也。聖人內觀以虛，外不自炫，故明；不自彰而物顯，不自有功而功歸，不矜能而眾服。弗矜者，不自賢也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第六十七章 執一》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
