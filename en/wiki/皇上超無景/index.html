    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 皇上超無景</nav></header><main><article><h1>皇上超無景</h1><p>上帝超越形影之表，輪轉九曜之大德。</p><p>[[皇上超無景]]者，上帝之德號也。經云：「皇上超無景音影，輪轉九曜日生。」言上帝超越形影之外，輪轉九曜之光，令日月循轉，五帝敷日精，液逸元中膜，血凝五華平。</p><p>[[皇上超無景]]之德，廣被天地，幽顯兼濟，與八炁運常寧相應，為大洞七真玄陽君章所稱述之上德。</p><p><strong>所出</strong>：《上清大洞真經 · 13章》 — https://zh.wikisource.org/wiki/上清大洞真經/13章</p></article></main></div></div>
