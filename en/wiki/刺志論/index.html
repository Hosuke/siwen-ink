    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 刺志論</nav></header><main><article><h1>刺志論</h1><p>氣實形實、氣虛形虛乃常，反此者病，虛實之要，在知氣入氣出。</p><p>氣實形實，氣虛形虛，此其常也，反此者病。穀盛氣盛，穀虛氣虛，此其常也，反此者病。脈實血實，脈虛血虛，此其常也，反此者病。</p><p>氣虛身熱，此謂反也；穀入多而氣少，此謂反也；穀不入而氣多，此謂反也；脈盛血少，此謂反也；脈少血多，此謂反也。</p><p>夫實者，氣入也；虛者，氣出也。氣實者，熱也；氣虛者，寒也。入實者，左手開針空也；入虛者，左手閉針空也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第十四卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十四卷</p></article></main></div></div>
