    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 見細過掩匿</nav></header><main><article><h1>見細過掩匿</h1><p>參見人之細過，專掩匿覆蓋，不欲人之難堪。</p><p>參見人之有細過，專掩匿覆蓋之，府中无事。夫水至清則無魚，人至察則無徒。參之於人，匿其小過，成其大德，使各安其位而不自知。此亦清靜之治所及也。</p><p><strong>所出</strong>：《史記 · 卷054》 — https://zh.wikisource.org/wiki/史記/卷054</p></article></main></div></div>
