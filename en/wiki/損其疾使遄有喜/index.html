    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 損其疾使遄有喜</nav></header><main><article><h1>損其疾使遄有喜</h1><p>速去己過，則有喜慶。</p><p>六四曰：「損其疾，使遄有喜，无咎。」《象》曰：「損其疾，亦可喜也。」疾者，過失之謂。言人能速改其疾，則喜慶隨之而无咎。《易》之取象，以疾況過，欲人知所警愓，及時而去其病痛，乃獲无咎之吉。</p><p><strong>所出</strong>：《周易 · 損》 — https://zh.wikisource.org/wiki/周易/損</p></article></main></div></div>
