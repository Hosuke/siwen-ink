    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 梓材</nav></header><main><article><h1>梓材</h1><p>治國如匠治材，既勤樸斲，乃以丹雘。</p><p>《周書》論士，方之梓材，蓋貴器用而兼文采也。是以樸斵成而丹施，垣墉立而雕附。梓者，木之良材，可用於器，亦可施丹，喻君子既有經世之才，又有文德之美。</p><p>《文心雕龍·程器》本此以論士，云：「若此文人，應梓材之士矣。」言當世文人，宜兼備文武之器用與文藻，如梓材之合美，方為國家楨榦之選。</p><p><strong>所出</strong>：《文心雕龍 · 程器》 — https://zh.wikisource.org/wiki/文心雕龍/程器</p></article></main></div></div>
