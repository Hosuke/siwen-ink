    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 大禮</nav></header><main><article><h1>大禮</h1><p>君臨下以天之道，臣事上以地之德，目貴明則無不見，耳貴聰則無不聞。</p><p>文王問太公君臣之禮。太公曰：「為上惟臨，為下惟沉。臨而無遠，沉而無隱。為上惟周，為下惟定。周，則天也。定，則地也。」</p><p>又言主位、主聽、主明之道，曰：「目貴明，耳貴聰，心貴智。以天下之目視，則無不見也。以天下之耳聽，則無不聞也。以天下之心慮，則無不知也。輻輳並進，則明不蔽矣。」</p><p>此[[耳目心智股肱助]]之旨，而[[聽天下之外治]]之意也。</p><p><strong>所出</strong>：《六韜》 — https://zh.wikisource.org/wiki/六韜</p></article></main></div></div>
