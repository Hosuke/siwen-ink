    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 不以其所養害其養</nav></header><main><article><h1>不以其所養害其養</h1><p>聖王不以養人者害人</p><p>大王亶父居邠，翟人欲得地，曰：「與人之兄居而殺其弟，與人之父處而殺其子，吾弗為。」杖策而去，民相連而從之，成國於岐山之下。不以其先人之爵祿重失之，此[[貴以身為天下]]之本也。</p><p><strong>所出</strong>：《淮南子 · 道應訓》 — https://zh.wikisource.org/wiki/淮南子/道應訓</p></article></main></div></div>
