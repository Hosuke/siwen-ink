    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 烈士為天下</nav></header><main><article><h1>烈士為天下</h1><p>烈士見善於天下，而不足以活身；善與否，未可定也。</p><p>[[桓公]]問為天下，[[管仲]]對曰：「法行而不苛，刑廉而不赦，有司寬而不凌，菀濁困滯，皆法度不亡，往行不來，而民游世矣，此為天下也。」言[[為天下]]之道，在於法度清肅而恩威兼施。</p><p><strong>所出</strong>：《管子 · 第19篇中匡》 — https://zh.wikisource.org/wiki/管子/第19篇中匡</p></article></main></div></div>
