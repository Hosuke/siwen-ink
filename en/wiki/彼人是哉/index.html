    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 彼人是哉</nav></header><main><article><h1>彼人是哉</h1><p>詩人詰問彼人是非莫辨</p><p>「彼人是哉？謂我未可知。」</p><p>賢者歌謠以遣憂，而世俗不察，反以為驕。詩人乃詰之曰：彼人之言，果是也耶？果非也耶？「彼人是哉」者，疑而未定之辭也。「謂我未可知」者，言世俗之所以知我者淺，終莫能測我之心事耳。見上下相知之難，賢者之不遇於時也。</p><p><strong>所出</strong>：《詩經 · 園有桃》 — https://zh.wikisource.org/wiki/詩經/園有桃</p></article></main></div></div>
