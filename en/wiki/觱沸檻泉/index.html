    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 觱沸檻泉</nav></header><main><article><h1>觱沸檻泉</h1><p>泉水沸涌，深則不息</p><p>觱沸檻泉，維其深矣。毛傳云：「觱沸，泉出貌。檻泉，泉正出者也。」觱沸言泉水涌出之貌，檻泉言泉流之盛。詩人以泉水沸涌興起其心之憂嘆，言己之憂思，猶泉水之深，無有已時也。</p><p><strong>所出</strong>：《詩經 · 瞻卬》 — https://zh.wikisource.org/wiki/詩經/瞻卬</p></article></main></div></div>
