    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 小人比人，左道用之，足以敗家奪國</nav></header><main><article><h1>小人比人，左道用之，足以敗家奪國</h1><p>小人用左道足以敗家奪國</p><p>小人比人，則左道而用之，至能敗家奪國。非賢智不能守家以義，不能守國以道。</p><p>聖人所貴道微妙者，誠以其可以轉危為安，救亡使存也。</p><p><strong>所出</strong>：《鬼谷子 · 卷03》 — https://zh.wikisource.org/wiki/鬼谷子/卷03</p></article></main></div></div>
