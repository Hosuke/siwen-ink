    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 成連先生</nav></header><main><article><h1>成連先生</h1><p>仙人，化伯牙之情，援琴蓬萊之外，遂為天妙操。</p><p>伯牙學琴於成連先生，乃與遊蓬萊山。留伯牙曰：君習之，我將迎。師刺船而去，伯牙凝望，但見海水頑洞，山林冥杳，鳥獸悲號，歎曰：吾師將移我情。乃援琴而歌，曲終，成連至，遂為天妙操。成連乃仙也。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 4》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/4</p></article></main></div></div>
