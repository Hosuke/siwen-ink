    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 孤寡不穀</nav></header><main><article><h1>孤寡不穀</h1><p>侯王以孤、寡、不穀自稱，明貴以賤為本、高以下為基之旨。</p><p>夫是以侯王自謂孤、寡、不穀。</p><p>孤，無父之人；寡，無夫之人；不穀，不善之民。此皆下賤之名，而侯王以之自稱。明知[[貴以賤為本]]之義——居萬乘之尊，稱匹夫之號；守九五之位，寓溝壑之辭。是故孤者所以全其親，寡者所以全其配，不穀者所以全其善。稱賤者反得保其貴，此[[老子]]「柔弱勝剛強」之旨也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章三十九》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
