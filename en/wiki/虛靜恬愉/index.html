    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 虛靜恬愉</nav></header><main><article><h1>虛靜恬愉</h1><p>守虛明靜則自得正氣</p><p>內惟省以端操兮，求正氣之所由。漠虛靜以恬愉兮，澹無為而自得。言當內自反省，端其操守，以求正氣。虛靜而恬愉，無為而自得，此養生之要道也。</p><p><strong>所出</strong>：《楚辭 · 遠遊》 — https://zh.wikisource.org/wiki/楚辭/遠遊</p></article></main></div></div>
