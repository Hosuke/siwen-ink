    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 以歸要成</nav></header><main><article><h1>以歸要成</h1><p>歸而質之，以要晉國之成</p><p>公孫枝曰：「不若以歸，以要晉國之成，復其君而質其適子，使子父代處秦，國可以無害。」秦君從之。</p><p><strong>所出</strong>：《國語 · 卷09》 — https://zh.wikisource.org/wiki/國語/卷09</p></article></main></div></div>
