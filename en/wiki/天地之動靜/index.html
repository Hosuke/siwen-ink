    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 天地之動靜</nav></header><main><article><h1>天地之動靜</h1><p>天地之動靜，以神明為綱紀；陰陽之往復，由寒暑彰其兆。</p><p>天地之動靜，神明為之紀；陰陽之往復，寒暑彰其兆。</p><p>善言天者，必應於人；善言古者，必驗於今；善言氣者，必彰於物；善言應者，同天地之化；善言化言變者，通神明之理。</p><p><strong>所出</strong>：《黃帝內經 · 素問第二十卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第二十卷</p></article></main></div></div>
