    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 天道無親恆與善人</nav></header><main><article><h1>天道無親恆與善人</h1><p>天道無私，常佑善人。</p><p>天之道，無偏無黨，恆與善人而不奪。</p><p>天道之行，無親疏之分，唯善人是與。《老子》曰「天道無親，恆與善人」，言天道至公，不阿其所愛；而其實「與」者，亦未嘗私也。善人法道，道亦相應，是之謂「恆與」。若夫暴人，天將以刑罰待之，非天之怒也，自然之數爾。故聖人修德以配天，而不敢恃天之見佑。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第四十四章 右介》 — https://zh.wikisource.org/wiki/老子_(帛書校勘版)</p></article></main></div></div>
