    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 茅固茅衷受書</nav></header><main><article><h1>茅固茅衷受書</h1><p>小茅君受紫素錫命為定錄、保命二君，授四部真經。</p><p>茅固字季偉，茅衷字思和，並王母、王君之弟子也。</p><p>王母、王君既宴茅盈，夫人憫其勤志，命侍女宋辟妃出紫錦之囊，開綠金之笈，以《三元流珠經》、《丹景道精經》、《隱地八術經》、《太極錄景經》四部授二君。王母又命侍女李方明出《玉珮金璫經》、《太霄隱書經》、《洞飛二景內書》以傳司命君。</p><p>二君既受書，亦侍真會，與兄茅盈同列仙籍。</p><p><strong>所出</strong>：《墉城集仙錄 · 卷02》 — https://zh.wikisource.org/wiki/墉城集仙錄/卷02</p></article></main></div></div>
