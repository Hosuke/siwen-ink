    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 易與天地準</nav></header><main><article><h1>易與天地準</h1><p>易道與天地同道，彌綸萬物，幽明死生鬼神皆可知。</p><p>易與天地準，故能彌綸天地之道。仰以觀於天文，俯以察於地理，是故知幽明之故。原始反終，故知死生之說。精氣為物，遊魂為變，是故知鬼神之情狀。與天地相似，故不違；知周乎萬物而道濟天下，故不過；旁行而不流，樂天知命，故不憂；安土敦乎仁，故能愛。範圍天地之化而不過，曲成萬物而不遺，通乎晝夜之道而知，故神無方而易無體。</p><p><strong>所出</strong>：《周易 · 繫辭上》 — https://zh.wikisource.org/wiki/易傳/繫辭上</p></article></main></div></div>
