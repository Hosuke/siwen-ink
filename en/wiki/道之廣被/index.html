    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 道之廣被</nav></header><main><article><h1>道之廣被</h1><p>道普遍周遍，無所不在</p><p>大道氾兮，其可左右。言道之普遍，如水之氾濫，無遠弗屆，東西左右無所不施。</p><p>萬物恃之而生，而不辭。恃，賴也。萬物皆賴道而生，道未嘗辭謝，亦未嘗有畔岸也。</p><p>功成不名有，愛養萬物而不為主。道生萬物而不有，成遂萬物而不居功，長養萬物而不以為主宰。是以無名無功，柔道不宰之德也。</p><p>愛養萬物而不為主，正明不主之意也。</p><p><strong>所出</strong>：《老子河上公章句 · 任成》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
