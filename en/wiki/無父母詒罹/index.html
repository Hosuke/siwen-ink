    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 無父母詒罹</nav></header><main><article><h1>無父母詒罹</h1><p>女無貽父母以憂患。</p><p>[[無父母詒罹]]者，言女子柔順，不遺父母以憂患也。詒，遺也；罹，憂也。女子在家孝親，出嫁宜家，不以非義之事貽累父母，使其憂慮。此為女子之孝，亦古禮所期望之德行。</p><p><strong>所出</strong>：《詩經 · 斯干》 — https://zh.wikisource.org/wiki/詩經/斯干</p></article></main></div></div>
