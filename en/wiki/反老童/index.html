    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 反老童</nav></header><main><article><h1>反老童</h1><p>地上外音，長生之祝。</p><p>反老童，上清大洞章之地上外音也。與[[彌劫連]]相對，彌劫連為天上內音，反老童為地上外音。內音彌劫以延年，外音反老童以受祿，二音合誦，是為大生章之全象。</p><p><strong>所出</strong>：《上清大洞真經 · 18章》 — https://zh.wikisource.org/wiki/上清大洞真經/18章</p></article></main></div></div>
