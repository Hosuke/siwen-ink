    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 麗詞雅義</nav></header><main><article><h1>麗詞雅義</h1><p>立賦之大體與當世之弊</p><p>立賦之大體，在乎「麗詞雅義」。登高之旨，蓋覩物興情。情以物興，故義必明雅；物以情觀，故詞必巧麗。麗詞雅義，符采相勝，如組織之品朱紫，畫繪之著玄黃。文雖新而有質，色雖糅而有本，此立賦之大體也。然逐末之儔，蔑棄其本，雖讀千賦，愈惑體要，遂使繁華損枝，膏腴害骨，無貴風軌，莫益勸戒。揚子所以追悔於雕蟲，貽誚於霧縠者也。</p><p><strong>所出</strong>：《文心雕龍 · 詮賦》 — https://zh.wikisource.org/wiki/文心雕龍/詮賦</p></article></main></div></div>
