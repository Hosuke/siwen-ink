    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 天地初生元氣施行</nav></header><main><article><h1>天地初生元氣施行</h1><p>述天地開闢之時，元氣布施，萬神受令，寰宇清寧之象。</p><p>天地初生之始，元氣施行，萬神布氣，無有醜逆祆邪不正之鬼，男孝女貞，君禮臣忠，六合如一，元無患害。此述太古之世，天地渾沌，元氣周流，神人合一，無有妖厲之氣。</p><p><strong>所出</strong>：《女青鬼律 · 卷1》 — https://zh.wikisource.org/wiki/女青鬼律/卷1</p></article></main></div></div>
