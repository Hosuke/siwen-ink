    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 食之分</nav></header><main><article><h1>食之分</h1><p>食異物者性亦異，食之不同為人異之由</p><p>堅土人剛，弱土人肥，壚土人大，沙土人細，息土人美，毛土人醜。</p><p>食水者善遊能寒，食土者無心而慧，食木者多力而𡚤，食草者善走而愚，食葉者有絲而蛾，食肉者勇敢而悍，食氣者神明而壽，食穀者知慧而夭。不食者不死而神。</p><p><strong>所出</strong>：《淮南子 · 墜形訓》 — https://zh.wikisource.org/wiki/淮南子/墜形訓</p></article></main></div></div>
