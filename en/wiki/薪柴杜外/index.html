    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 薪柴杜外</nav></header><main><article><h1>薪柴杜外</h1><p>城外薪木柴搏，廣厚足以任城，以堵禦敵人之攻城器械。</p><p>疏束樹木令足以為柴搏，毋前面樹，長丈七尺一，以為外面。以柴搏從橫施之，外面以強塗，毋令土漏。令其廣厚能任三丈五尺之城以上，以柴木土稍杜之，以急為故。</p><p>薪柴排列城外，厚塗泥土，使敵火不能焚，亦足以阻敵攻城之路。此城外之備也。</p><p><strong>所出</strong>：《墨子 · 備城門》 — https://zh.wikisource.org/wiki/墨子/備城門</p></article></main></div></div>
