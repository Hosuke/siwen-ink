    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 我豈好辯哉予不得已也</nav></header><main><article><h1>我豈好辯哉予不得已也</h1><p>孟子自明辯論之由，非好辯也，懼聖道之不行耳。</p><p>天下之生久矣，一治一亂。當堯之時，水逆行，蛇龍居之，民無所定。及紂之身，天下又大亂。周公相武王，誅紂、伐奄，驅虎豹犀象。聖王不作，諸侯放恣，楊朱、墨翟之言盈天下。孔子懼，作《春秋》。聖人復起，不易吾言矣。吾為此懼，閒先聖之道，距楊墨、放淫辭。能言距楊墨者，聖人之徒也。</p><p><strong>所出</strong>：《孟子 · 滕文公下》 — https://zh.wikisource.org/wiki/孟子/滕文公下</p></article></main></div></div>
