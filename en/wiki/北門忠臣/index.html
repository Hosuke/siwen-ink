    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 北門忠臣</nav></header><main><article><h1>北門忠臣</h1><p>衛之忠臣不得遂其志，蓋賢者在位而困者也。</p><p>《詩經·北門》之序曰：「衛之忠臣不得其志爾。」言衛國有忠直之臣，欲以正道事君，而時君不能用，使其志不得遂。夫忠臣者，盡心竭誠以奉其上，而國政不理，君主不悟，是非不知也，乃不能用也。是以其人憂心殷殷，自外入內，莫不悲嘆。賢而在下，奸而在朝，忠臣之志，抑而不伸，此《北門》之所以作也。</p><p><strong>所出</strong>：《詩經 · 北門》 — https://zh.wikisource.org/wiki/詩經/北門</p></article></main></div></div>
