    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 卜人不載</nav></header><main><article><h1>卜人不載</h1><p>太史公自言卜人少見於篇，季主則志而著之</p><p>太史公曰：「古者卜人所以不載者，多不見于篇。及至司馬季主，余志而著之。」</p><p>言古之卜筮之士，其傳記多闕，故載之者寡。獨司馬季主有言行可紀，故太史公特意而著之，以見卜筮之道非淺術，其人亦有足稱者焉。</p><p><strong>所出</strong>：《史記 · 卷127》 — https://zh.wikisource.org/wiki/史記/卷127</p></article></main></div></div>
