    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 多仁則法不立，威寡則下侵上</nav></header><main><article><h1>多仁則法不立，威寡則下侵上</h1><p>仁多則法度不立，威不足則下陵於上</p><p>多仁則法不立，威寡則下侵上。夫法不立，則庶事汩矣；下侵上，則逆節明矣。至醇既澆於三代，大樸又散於秦漢，道衰於疇昔，俗薄乎當今，而欲結繩以整奸欺，不言以化狡猾，委轡策而乘奔馬於險途，舍柁櫓而泛虛舟以淩波，未見其可也！</p><p><strong>所出</strong>：《抱朴子 · 卷14》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷14</p></article></main></div></div>
