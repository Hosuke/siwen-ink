    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 壹於道</nav></header><main><article><h1>壹於道</h1><p>君子壹於道，以贊稽物，萬物官矣。</p><p>故君子壹於道，而以贊稽物。壹於道則正，以贊稽物則察；以正志行察論，則萬物官矣。</p><p>昔者舜之治天下也，不以事詔而萬物成。處一危之，其榮滿側；養一之微，榮矣而未知。故道經曰：「人心之危，道心之微。」危微之幾，惟明君子而後能知之。</p><p><strong>所出</strong>：《荀子 · 解蔽篇》 — https://zh.wikisource.org/wiki/荀子/解蔽篇</p></article></main></div></div>
