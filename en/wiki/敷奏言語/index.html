    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 敷奏言語</nav></header><main><article><h1>敷奏言語</h1><p>廣納善言以敷陳於上。</p><p>「予欲聞六律五聲八音，在治始，忽以出納五言，汝聽」，言帝舜欲聞天下之言，而使臣聽之也。六律五聲八音，樂之和也；五言，詩之言也。臣工納言於下，天子敷奏於上，出納五言，乃治道之始也。</p><p><strong>所出</strong>：《尚書 · 皐陶謨》 — https://zh.wikisource.org/wiki/尚書/皐陶謨</p></article></main></div></div>
