    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 喜賞惡罰離公道</nav></header><main><article><h1>喜賞惡罰離公道</h1><p>喜賞惡罰之人，必離公道而行私術</p><p>平吏之治官也，行法而無私，則姦臣不得其利。姦臣務傷平吏，以求推譽避刑受賞。喜賞惡罰之人，離公道而行私術。
