    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 不宿戒</nav></header><main><article><h1>不宿戒</h1><p>食禮之戒，不前宿、不速召，異於常禮也</p><p>記文云「不宿戒，戒不速」，言公食大夫之禮，其戒告也，不前宿而行之；既戒之後，亦不速召以催客。蓋食禮之設，本以宴享嘉好，異於聘問之肅敬，故其戒也簡，其召也舒。又云「不授几」者，食禮無几筵之設，尊卑之等視饗禮殺也。</p><p><strong>所出</strong>：《儀禮 · 公食大夫禮》 — https://zh.wikisource.org/wiki/儀禮/公食大夫禮</p></article></main></div></div>
