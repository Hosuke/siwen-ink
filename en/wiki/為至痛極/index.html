    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 為至痛極</nav></header><main><article><h1>為至痛極</h1><p>創深痛甚者日彌久，三年之制，乃為至痛而設。</p><p>原文云「三年之喪，稱情而立文，所以為至痛極也」，又云「齊衰、苴杖、居廬、食粥、席薪、枕塊，所以為至痛飾也」。創巨者其日久，痛甚者其愈遲，三年之喪，正以至痛之飾，表至痛之情。</p><p>  <strong>所出</strong>：《荀子 · 禮論篇》 — https://zh.wikisource.org/wiki/荀子/禮論篇</p></article></main></div></div>
