    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 顏如渥丹</nav></header><main><article><h1>顏如渥丹</h1><p>形容君子顏色之美，誠而且澤。</p><p>顏如渥丹，其君也哉。渥丹者，厚重之赤色也。言君子顏色之美，如以丹渥飾其面，誠而且澤也。「其君也哉」，美之之辭，殆若曰此真可以為君乎。詩以此形容君子德盛儀美，容色赫然，見者莫不心服。</p><p><strong>所出</strong>：《詩經 · 終南》 — https://zh.wikisource.org/wiki/詩經/終南</p></article></main></div></div>
