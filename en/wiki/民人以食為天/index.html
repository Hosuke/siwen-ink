    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 民人以食為天</nav></header><main><article><h1>民人以食為天</h1><p>酈生以民食喻天，言治國當知根本所在。</p><p>酈生說漢王守敖倉，曰：「臣聞知天之天者，王事可成；不知天之天者，王事不可成。王者以民人為天，而民人以食為天。」言天之天，在於民食；民食之本，在於敖倉之粟。</p><p><strong>所出</strong>：《史記 · 卷097》 — https://zh.wikisource.org/wiki/史記/卷097</p></article></main></div></div>
