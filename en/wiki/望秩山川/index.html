    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 望秩山川</nav></header><main><article><h1>望秩山川</h1><p>望祭山川，按秩序以祀之。</p><p>望于山川，徧于群神。望者，遙望而祭之也；秩者，第其大小以次祭之也。東巡至于岱宗，柴而望秩之；南至于南岳，如岱禮；西至于西岳，如初；北至于北岳，如西禮。五岳四瀆，秩祀不瀆，敬之至也。</p><p><strong>所出</strong>：《尚書 · 舜典》 — https://zh.wikisource.org/wiki/尚書/舜典</p></article></main></div></div>
