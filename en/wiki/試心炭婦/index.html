    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 試心炭婦</nav></header><main><article><h1>試心炭婦</h1><p>許遜化炭為美妇人以試弟子，道心堅固者十人而已。</p><p>真君道術高妙，著聞遠邇，求為弟子者數百人。乃化炭為美妇人，夜散群弟子處以試之。明旦閱之，其不為所染汙者，惟十人耳，即異時上昇諸高弟也。其餘多自愧而去。</p><p>今建昌縣西津名炭婦市，立觀日妙明。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 26》 — https://zh.wikisource.org/wiki/歷世真仙體道通Kinseyi/26</p></article></main></div></div>
