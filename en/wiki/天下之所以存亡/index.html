    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 天下之所以存亡</nav></header><main><article><h1>天下之所以存亡</h1><p>晏子言觀天下存亡有六說，揭示危亡之由。</p><p>晏子言：「縵密不能，蔍苴不學者詘；身無以用人，而又不為人用者卑；善人不能戚，惡人不能疏者危；交遊朋友，無以說於人，又可能說人者窮；事君要利，大者不得，小者不為者餧；修道立義，大不能專，小不能附者滅，此足以觀存亡矣。」</p><p><strong>所出</strong>：《晏子春秋 · 卷三》 — https://zh.wikisource.org/wiki/晏子春秋/卷三</p></article></main></div></div>
