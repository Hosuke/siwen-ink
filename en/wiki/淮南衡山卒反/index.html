    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 淮南衡山卒反</nav></header><main><article><h1>淮南衡山卒反</h1><p>淮南衡山卒反，如賈誼所言，驗先見之明。</p><p>初，淮南衡山卒反，如賈誼言。太傅賈誼諫曰：「怨讎之人，不可貴也。」後淮南衡山卒反如賈誼言。</p><p><strong>所出</strong>：《淮南子 · 敘目》 — https://zh.wikisource.org/wiki/淮南子/敘目</p></article></main></div></div>
