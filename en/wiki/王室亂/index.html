    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 王室亂</nav></header><main><article><h1>王室亂</h1><p>景王崩後，王子猛與王子朝迭起，天子之位再亂。</p><p>昭公二十二年夏四月乙丑，天王崩。六月叔鞅如京師葬景王。王室亂，劉子、單子以王猛居于皇，秋入于王城。冬十月王子猛卒。二十三年，天王居于狄泉，尹氏立王子朝。八月乙未，地震。二十六年冬十月，天王入于成周，尹氏、召伯、毛伯以王子朝奔楚。</p><p><strong>所出</strong>：《春秋公羊傳 · 昭公》 — https://zh.wikisource.org/wiki/春秋公羊傳/昭公</p></article></main></div></div>
