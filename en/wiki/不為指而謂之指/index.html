    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 不為指而謂之指</nav></header><main><article><h1>不為指而謂之指</h1><p>物本自有其名，乃世人不察，強名之為指。</p><p>天下無指者，生于物之各有名，不為指也。不為指而謂之指，是兼不為指。以有不為指之無不為指，未可。</p><p>此段申說[[天下無指物無可以謂物]]之意。公孫龍以為，物各有其實、各有其用，不必皆可指而名之。耳目之用，廢一不可，然皆不相為是非，此[[物莫非指]]之別解也。</p><p><strong>所出</strong>：《公孫龍子 · 3》 — https://zh.wikisource.org/wiki/公孫龍子/3</p></article></main></div></div>
