    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 簡選精良</nav></header><main><article><h1>簡選精良</h1><p>利劍須良匠，精兵須簡選；驅市人而戰，則不可以勝。</p><p>世有言曰：「驅市人而戰之，可以勝人之厚祿教卒；老弱罷民，可以勝人之精士練材。」此不通乎兵者之論。</p><p>今有利劍於此，以刺則不中，以擊則不及，與惡劍無擇，為是鬭因用惡劍則不可。簡選精良，兵械銛利，發之則不時，縱之則不當，與惡卒無擇。</p><p>王子慶忌、陳年猶欲劍之利也。簡選精良，兵械銛利，令能將將之，古者有以王者、有以霸者矣。</p><p><strong>所出</strong>：《呂氏春秋 · 卷八》 — https://zh.wikisource.org/wiki/呂氏春秋/卷八</p></article></main></div></div>
