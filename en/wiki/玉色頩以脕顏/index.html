    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 玉色頩以脕顏</nav></header><main><article><h1>玉色頩以脕顏</h1><p>仙人容色之美</p><p>玉色頩以脕顏兮，精醇粹而始壯。質銷鑠以汋約兮，神要眇以淫放。言仙人玉色美盛，精神純粹，形質柔美，神采超逸。此[[仙人目瞳皆方]]之類，狀仙人異於凡人之容色也。</p><p><strong>所出</strong>：《楚辭 · 遠遊》 — https://zh.wikisource.org/wiki/楚辭/遠遊</p></article></main></div></div>
