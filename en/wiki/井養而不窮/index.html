    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 井養而不窮</nav></header><main><article><h1>井養而不窮</h1><p>井以水養人，終無乏竭之時。</p><p>《彖》曰：「井養而不窮也。」水在井中，民汲而食之，晝夜相繼，無有竭時。井之為德，養人也。泉源混混[[源泉混混]]，不舍晝夜，盈科而後進，此水之性也。君子法井之象，以德養人，利之而不伐其功，給之而不矜其有，使民有所資而不匱，有所恃而不竭，此[[井之常道]]也。[[木上有水]]者，井之象也；井養而不窮者，井之德也。</p><p><strong>所出</strong>：《周易 · 井》 — https://zh.wikisource.org/wiki/周易/井</p></article></main></div></div>
