    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 矜寡</nav></header><main><article><h1>矜寡</h1><p>憐孤弱而不侵，仁者之政。</p><p>不侮矜寡，不畏彊禦。</p><p>矜，憐也。寡，無夫者也。矜寡之人，最易陵犯。仲山甫性柔而不茹剛，而不侮慢孤弱之民。</p><p><strong>所出</strong>：《詩經 · 烝民》 — https://zh.wikisource.org/wiki/詩經/烝民</p><hr><p>至于敬寡，以及敬寡之寡，至於屬婦，合由以容。言矜恤寡獨之民，恩澤下逮，使皆蒙覆蓋之恩。</p><p><strong>所出</strong>：《尚書 · 梓材》 — https://zh.wikisource.org/wiki/尚書/梓材</p></article></main></div></div>
