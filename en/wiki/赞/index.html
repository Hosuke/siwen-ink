    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 赞者将命</nav></header><main><article><h1>赞者将命</h1><p>贊者為賓傳達致送之命。</p><p>賓賵者將命，槟者出請，入告，出告須。馬入設，賓奉幣。槟者先入，賓從，致命如初。主人拜于位，不踊。賓奠幣如初，舉幣受馬如例。贊者，主傳話之官，所以通賓主之情。</p><p><strong>所出</strong>：《儀禮 · 既夕禮》 — https://zh.wikisource.org/wiki/儀禮/既夕禮</p></article></main></div></div>
