    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 精神</nav></header><main><article><h1>精神</h1><p>人身之精與神不可散失，守之則長生可期也。</p><p>精神者，[[精]]與[[神]]合而言之，人身之至寶也。[[精]]者，生之根；[[神]]者，[[生]]之守。能存之則生，失之則死。[[魂]][[魄]][[意志]]皆本於此，故[[黃庭]]之學，以守精神為首務。一身之精神不可失，守之則[[玄真]]長存，[[長生久視]]之道得矣。</p><p><strong>所出</strong>：《黃庭內景經 · 五行章第二十五》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/五行章第二十五</p></article></main></div></div>
