    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 敷陳羽翮</nav></header><main><article><h1>敷陳羽翮</h1><p>神仙化形之後，羽翼敷陳，東西南傾。</p><p>經云：「敷陳羽翮，東西南傾。」</p><p>言神仙化形之後，敷布羽翼，橫絕四海，東西南傾，無所不至。《大易》以龍為象，此以羽翮為言，皆狀神遊之妙。</p><p>神仙既能化形而仙，淪寂無聲，則其神出入天地，往來宇宙，敷陳羽翮如鳥之飛。東西南傾，極言其所之廣。伯陽以此形容長生之極功——形神俱化，倏忽往來，超越塵世之限。</p><p><strong>所出</strong>：《周易參同契 · 35章》 — https://zh.wikisource/wiki/周易參同契/35章</p></article></main></div></div>
