    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 天生德於予，桓魋其如予何</nav></header><main><article><h1>天生德於予，桓魋其如予何</h1><p>聖人恃道自安。</p><p>[[孔子]]厄於[[桓魋]]，言天生德於予，桓魋其奈我何。[[聖人]]恃[[天德]]以自安，不以威武動其心。此[[聖人]][[信道]]之實，亦[[君子坦蕩蕩]]之象也。</p><p><strong>所出</strong>：《論語 · 述而第七》 — https://zh.wikisource.org/wiki/論語/述而第七</p></article></main></div></div>
