    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 宋督弒其君與夷</nav></header><main><article><h1>宋督弒其君與夷</h1><p>宋督弒殺殤公，公羊傳以其惡及大夫孔父。</p><p>殤公元年，衛公子州吁弒其君完自立，欲得諸侯，使告於宋曰：「馮在鄭，必為亂，可與我伐之。」宋許之，與伐鄭。九年，大司馬孔父嘉妻好，出，道遇太宰華督。督說，目而觀之。督利孔父妻，乃使人宣言國中曰：「殤公即位十年耳，而十一戰，民苦不堪，皆孔父為之，我且殺孔父以寧民。」是歲，魯弒其君隱公。十年，華督攻殺孔父，取其妻。殤公怒，遂弒殤公，而迎穆公子馮於鄭而立之，是為莊公。</p><p>  <strong>所出</strong>：《史記·卷038》 — https://zh.wikisource.org/wiki/史記/卷038</p></article></main></div></div>
