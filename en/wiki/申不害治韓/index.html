    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 申不害治韓</nav></header><main><article><h1>申不害治韓</h1><p>申不害以黃老刑名之學相韓昭侯，內脩政教，外應諸侯，國治兵彊。</p><p>申不害者，京人也，故鄭之賤臣。學術以干韓昭侯，昭侯用為相。內脩政教，外應諸侯，十五年。終申子之身，國治兵彊，無侵韓者。申子之學本於黃老而主刑名。寫作二篇，號曰[[申子]]。</p><p><strong>所出</strong>：《史記 · 卷063》 — https://zh.wikisource.org/wiki/史記/卷063</p></article></main></div></div>
