    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 烈士乃亂世絶嗣之術</nav></header><main><article><h1>烈士乃亂世絶嗣之術</h1><p>所謂烈士，進不臣君，退不為家，非治世之所貴。</p><p>古之烈士，進不臣君，退不為家，是進則非其君，退則非其親。離眾獨行，取異於人，此亂世絶嗣之道也。天下徧死而願夭，皆此輩之流毒也。夫孝子事父，非競取父之家；忠臣事君，非競取君之國。為人臣者，常譽先王之德厚而願之，是誹謗其君者也。非其親者知謂之不孝，而非其君者天下皆賢之，此所以亂也。故臣毋稱堯舜之賢，毋譽湯武之伐，毋言烈士之高，盡力守法，專心事主者為忠臣。</p><p><strong>所出</strong>：《韓非子 · 忠孝》 — https://zh.wikisource.org/wiki/韓非子/忠孝</p></article></main></div></div>
