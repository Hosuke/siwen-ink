    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 來獻其琛，元龜象齒，大賂南金</nav></header><main><article><h1>來獻其琛，元龜象齒，大賂南金</h1><p>淮夷貢物之美，見德化被於江海。</p><p>[[來獻其琛元龜象齒大賂南金]]，皆淮夷所貢之物。琛，寶也。元龜，大龜，可以卜吉；象齒，牙骨，可為器用；南金，荊揚之金，最為珍貴。詩末三物並言，以見[[來獻其琛]]之豐，美魯侯德化之盛，遠至江海之夷，莫不來庭也。</p><p><strong>所出</strong>：《詩經 · 泮水》 — https://zh.wikisource.org/wiki/詩經/泮水</p></article></main></div></div>
