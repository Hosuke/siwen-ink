    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 格物致知</nav></header><main><article><h1>格物致知</h1><p>窮究事物之理，以臻吾心之知</p><p>欲誠其意者，先致其知；致知在格物。</p><p>朱熹注云：「人心之靈莫不有知，天下之物莫不有理。惟於理未有所窮遺，故其知亦有不盡。」格物者，即凡天下之物，莫不因其已知之理而益窮之，以求至乎其極。用力既久，一旦豁然貫通，則眾物之表裏精粗無不到，而吾心之全體大用無不明矣。</p><p>此為《大學》脩身之始基，八條目之根本功夫也。格物而後知至，知至而後意誠，由內而外，功夫自有次第。</p><p><strong>所出</strong>：《大學》 — https://zh.wikisource.org/wiki/大學</p></article></main></div></div>
