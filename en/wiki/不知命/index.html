    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 不知命</nav></header><main><article><h1>不知命</h1><p>淫奔之由，在乎不明天命之正。</p><p>不知命也。命者，天之所賦，人之所以正己者也。男女之配合，必待父母之命、媒妁之言，此天命之正、人道之常也。今乃不稟於命，不俟於天，專由己意，故云不知命。[[大無信]]而[[懷昏姻]]，皆由於不知命也。《毛詩序》以為此詩刺衛文公能以道化其民，而淫奔之恥，國人不齒，正見知命之可貴。</p><p><strong>所出</strong>：《詩經 · 蝃蝀》 — https://zh.wikisource.org/wiki/詩經/蝃蝀</p></article></main></div></div>
