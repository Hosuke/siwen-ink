    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 知所貴知所利</nav></header><main><article><h1>知所貴知所利</h1><p>聖王之臣，知所貴者能用賢，知所利者能用事。</p><p>成王之於周公，無所往而不聽，此知所貴也；桓公之於管仲，國事無所往而不用，此知所利也。吳有伍子胥而不能用，至於國亡，是失賢之驗也。故尊聖者王，貴賢者霸，敬賢者存，慢賢者亡，古今一也。知所貴則得賢而國昌，知所利則用賢而事舉，二者是非之本，得失之原，不可不察也。</p><p><strong>所出</strong>：《荀子 · 君子篇》 — https://zh.wikisource.org/wiki/荀子/君子篇</p></article></main></div></div>
