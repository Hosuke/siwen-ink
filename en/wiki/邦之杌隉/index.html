    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 邦之杌隉</nav></header><main><article><h1>邦之杌隉</h1><p>邦之杌隉由一人，邦之榮懷亦尚一人之慶。</p><p>邦之杌隉，曰由一人；邦之榮懷，亦尚一人之慶。</p><p>杌隉者，不安之貌也。國家之所以搖動不安者，由於所用非人；國家之所以光榮安定者，亦惟在所用之人得其慶也。一人之賢否，繫邦之安危，可不慎與。</p><p>用人當，則朝有善政，野無姦民，百姓樂業，外鄰慕義，此邦之榮懷也。用人乖，則法度日紊，賢智日遠，小人日親，兆民日困，此邦之杌隉也。治亂之分，在是用不用之間耳。</p><p><strong>所出</strong>：《尚書 · 秦誓》 — https://zh.wikisource.org/wiki/尚書/秦誓</p></article></main></div></div>
