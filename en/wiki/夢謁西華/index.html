    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 夢謁西華</nav></header><main><article><h1>夢謁西華</h1><p>西華真金產處，真知陽光發現，與靈知合煉至純陽。</p><p>西華者，真金所產之處。華者真金精明之光。九天者，純陽無陰之境。真金者，真知之法象。陰暗之中，忽來真知陽光發現，揀此真知歸於我家，與靈知相合，以火煆煉，至於純陽無陰之地，號曰七返九還，金液大丹。金丹大道至簡至易，不過煉道心中真知、人心中靈知耳。剛柔相當，真靈合一，凝結聖胎，凡夫俗子得之立躋聖位。</p><p><strong>所出</strong>：《悟真直指 · 卷二》 — https://zh.wikisource.org/wiki/悟真直指/卷二</p></article></main></div></div>
