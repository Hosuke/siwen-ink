    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 弩機差以米而不發</nav></header><main><article><h1>弩機差以米而不發</h1><p>機失於微，事敗於忽。</p><p>鄭公子歸生率師伐宋。宋華元率師應之大棘，羊斟御。明日將戰，華元殺羊饗士，羊斟不與焉。明日戰，恕謂華元曰：「昨日之事，子為制；今日之事，我為制。」遂驅入於鄭師。宋師敗績，華元虜。夫弩機差以米則不發。戰，大機也。饗士而忘其御也，將以此敗而為虜，豈不宜哉？</p><p><strong>所出</strong>：《呂氏春秋 · 卷十六》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十六</p></article></main></div></div>
