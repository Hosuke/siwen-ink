    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 父子之兵</nav></header><main><article><h1>父子之兵</h1><p>治軍之道，使眾如一室，則所向無敵。</p><p>吳子論治兵之要，以為「居則有禮，動則有威，進不可當，退不可追，前卻有節，左右應麾，雖絕成陳，雖散成行」。又言：「與之安，與之危，其眾可合而不可離，可用而不可疲，投之所往，天下莫當。」</p><p>此所謂「父子之兵」也。夫上下一心，死生同欲，則無往而不勝。</p><p><strong>所出</strong>：《吳子》 — https://zh.wikisource.org/wiki/吳子</p></article></main></div></div>
