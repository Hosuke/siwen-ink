    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 色難</nav></header><main><article><h1>色難</h1><p>孝道之難，在於容色之和悅，非徒供役使而已。</p><p>《論語》載子夏問孝，孔子答曰：「色難。」又曰：「有事，弟子服其勞；有酒食，先生饌。曾是以爲孝乎？」言孝道之難，不在於供役使、遺酒食，而在於容色之和悅也。和顏悅色以事父母，方是眞孝。若徒有其事而無其敬，則非孝矣。</p><p><strong>所出</strong>：《論語 · 爲政第二》 — https://zh.wikisource.org/wiki/論語/爲政第二</p></article></main></div></div>
