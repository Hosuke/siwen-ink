    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 一夫不獲</nav></header><main><article><h1>一夫不獲</h1><p>為政者以天下萬民為己任，一夫失所，即其罪愆。</p><p>王述伊尹之志曰：「一夫不獲，則曰：『時予之辜！』」言聖賢之臣，以天下為心，苟有一夫不得其所，必以為己之罪責。[[視民如傷]]言愛民之深，此則兼君臣而言之，著治天下者不可一日忘民之義。</p><p><strong>所出</strong>：《尚書 · 說命下》 — https://zh.wikisource.org/wiki/尚書/說命下</p></article></main></div></div>
