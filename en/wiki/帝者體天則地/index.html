    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 帝者體天則地</nav></header><main><article><h1>帝者體天則地</h1><p>帝者體天則地而天下太平，王者制人以道，霸者制士以權。</p><p>夫三皇無言而化流四海，故天下無所歸功。</p><p>帝者，體天則地，有言有令，而天下太平；群臣讓功，四海化行，百姓不知其所以然。故使臣不待禮賞，有功，美而無害。</p><p>王者，制人以道，降心服志，設矩備衰，四海會同，王職不廢。雖有甲兵之備，而無鬥戰之患。</p><p>霸者，制士以權，結士以信，使士以賞；信衰則士疏，賞虧則士不用命。</p><p><strong>所出</strong>：《三略》 — https://zh.wikisource.org/wiki/三略</p></article></main></div></div>
