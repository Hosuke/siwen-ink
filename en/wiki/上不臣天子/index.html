    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 上不臣天子下不事諸侯</nav></header><main><article><h1>上不臣天子下不事諸侯</h1><p>儒者有超然於世功名利祿之外者，雖分國如錙銖，不臣不仕。</p><p>儒有上不臣天子，下不事諸侯。慎靜而尚寬。強毅以與人，博學以知服。近文章，砥厲廉隅。雖分國如錙銖，不臣不仕。</p><p>此述儒之最高者。行道於天下而不屈於諸侯，非傲也，道之尊也。《孟子》稱[[不召之臣]]，其意相近</p></article></main></div></div>
