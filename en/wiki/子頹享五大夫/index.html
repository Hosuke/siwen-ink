    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 子頹享五大夫</nav></header><main><article><h1>子頹享五大夫</h1><p>王子頹以叛得立，享五大夫，樂及遍舞，以樂致禍，不知憂悔。</p><p>冬，王子頹享五大夫，樂及遍舞。鄭伯聞之，見虢叔，曰：「寡人聞之，哀樂失時，殃咎必至。今王子頹歌舞不倦，樂禍也。夫司寇行戮，君爲之不舉，而況敢樂禍乎？！奸王之位，禍孰大焉？臨禍忘憂，憂必及之。盍納王乎？」虢公曰：「寡人之願也。」</p><p><strong>所出</strong>：《春秋左氏傳 · 莊公》 — https://zh.wikisource.org/wiki/春秋左氏傳/莊公</p></article></main></div></div>
