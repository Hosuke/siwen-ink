    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 天地</nav></header><main><article><h1>天地</h1><p>天地盜太虛生，人蟲盜天地生，虰盜我精氣魂魄，大人錄精氣藏魂魄則天地老而我不傾。</p><p>天地盜太虛生，人蟲盜天地生，虰者，腸中之蟲也，我精氣，鑠我魂魄，盜我滋味，而有其生。有以見我之必死，所以知天之必頹。天其頹乎，我將安有；我其死乎，虰將安守？所謂奸臣盜國，國破則家亡；蠹蟲蝕木，木盡則蟲死。是以大人錄精氣，藏魂魄，薄滋味，禁嗜欲，外富貴。雖天地老而我不傾，虰死而我長生，奸臣去而國太平。</p><p><strong>所出</strong>：《化書 · 卷一》 — https://zh.wikisource.org/wiki/化書/卷一</p></article></main></div></div>
