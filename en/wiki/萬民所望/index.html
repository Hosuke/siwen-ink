    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 萬民所望</nav></header><main><article><h1>萬民所望</h1><p>天下之人仰望而歸心</p><p>萬民之望人君，亦如貧賤之望富貴。其所望者，蓋欲料長幼，平賦斂，時其飢寒，省其疾痛，賞罰不濫，使役以時，如此而已，則於人君弗損也。然而弗酬、弗與，同苦樂故也。故為人君，不可弗與民同勞逸焉。富貴者可不酬貧賤者，人君不可不酬萬民。不酬萬民，則萬民之所不願戴；所不願戴，則君位替矣！危莫甚焉！禍莫大焉！</p><p><strong>所出</strong>：《尹文子 · 大道下》 — https://zh.wikisource.org/wiki/尹文子/大道下</p></article></main></div></div>
