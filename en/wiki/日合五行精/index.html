    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 日合五行精</nav></header><main><article><h1>日合五行精</h1><p>日月合度，五行不失其精，度竟三十日而更始。</p><p>日合五行精，月受六律紀。五六三十度，度竟復更始。</p><p>日循天而行，合五行之精；月受六律以紀時令。[[弦望盈縮]]之度，以三十日為一周；度竟則[[四七乖戾]]不作，[[五緯錯順]]如常。[[五緯錯順]]者，天度之常也。</p><p><strong>所出</strong>：《周易參同契 · 05章》 — https://zh.wikisource.org/wiki/周易參同契/05章</p></article></main></div></div>
