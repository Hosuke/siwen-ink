    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 造化賦形，支體必雙</nav></header><main><article><h1>造化賦形，支體必雙</h1><p>天化萬物，形體必成雙對，自然之理也。</p><p>造化賦形，支體必雙，神理為用，事不孤立。夫心生文辭，運裁百慮，高下相須，自然成對。此麗辭之理本於造化，與[[萬物負陰而抱陽]]之義相通。</p><p><strong>所出</strong>：《文心雕龍 · 麗辭》 — https://zh.wikisource.org/wiki/文心雕龍/麗辭</p></article></main></div></div>
