    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 見竈者為見公</nav></header><main><article><h1>見竈者為見公</h1><p>君專寵則蔽，猶一人煬竈而後人無從見也。</p><p>侏儒見衛靈公，以夢言進諫，曰：「夢見竈者，爲見公也。」公怒曰：「吾聞見人主者夢見日，奚爲見寡人而夢見竈乎？」侏儒對曰：「夫日兼照天下，一物不能當也；人君兼照一國，一人不能壅也，故將見人主而夢日也。夫竈，一人煬焉，則後人無從見矣。或者一人煬君邪？則臣雖夢竈，不亦可乎？」公用其言，逐彌子瑕而用司空狗。</p><p>[[見微知萌]]</p><p><strong>所出</strong>：《韓非子 · 難四》 — https://zh.wikisource.org/wiki/韓非子/難四</p></article></main></div></div>
