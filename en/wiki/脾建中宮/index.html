    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 脾建中宮</nav></header><main><article><h1>脾建中宮</h1><p>脾居中宮乃五臟之主。</p><p>隱藏章云「脾建中宮」兼「五臟六腑神明主」。脾居中央，其位高於諸臟，建中宮者，脾主四旁之意也。五臟六腑皆稟氣於脾，脾健則諸神安位，各守其職。</p><p>《黃庭內景經》以脾為黃庭之根，號曰「中池」「太倉」，其神常在，故修煉者當先固脾土，以養四旁。</p><p><strong>所出</strong>：《黃庭內景經 · 隱藏章第三十五》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/隱藏章第三十五</p></article></main></div></div>
