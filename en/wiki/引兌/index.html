    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 引兌</nav></header><main><article><h1>引兌</h1><p>援引他人以相悅，邪道引長，其德未光。</p><p>上六「引兌」。象曰：「上六引兌，未光也。」上六陰居極位，無陽剛之德，徒能援引下陽以相悅悅，其道至狹，其德未光。引者，以私意鉤引之謂，非以正道相親也。</p><p><strong>所出</strong>：《周易 · 兌》 — https://zh.wikisource.org/wiki/周易/兌</p></article></main></div></div>
