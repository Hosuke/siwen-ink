    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 南榮疇恥聖道之獨亡</nav></header><main><article><h1>南榮疇恥聖道之獨亡</h1><p>聖道失傳，恥而力學，遂成名顯世。</p><p>南榮疇恥聖道之獨亡於己，身淬霜露，敕蹻趹，跋涉山川，冒蒙荊棘，百舍重跰，不敢休息，南見老聃。受教一言，精神曉泠，純聞條達，欣然七日不食，如饗太牢，是以明照四海，名施後世，達略天地，察分秋毫，稱譽葉語，至今不休。</p><p>此所謂[[名可強立]]者。[[名可強立]]，功可強成，故君子積志委正，以趣明師，勵節亢高，以絕世俗。</p><p><strong>所出</strong>：《淮南子 · 脩務訓》 — https://zh.wikisource.org/wiki/淮南子/脩務訓</p></article></main></div></div>
