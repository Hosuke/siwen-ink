    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 四勇之分</nav></header><main><article><h1>四勇之分</h1><p>勇有四等：狗彘之勇、賈盜之勇、小人之勇、士君子之勇。</p><p>有狗彘之勇者，有賈盜之勇者，有小人之勇者，有士君子之勇者：爭飲食，無廉恥，不知是非，不辟死傷，不畏衆彊，恈恈然唯利飲食之見，是狗彘之勇也。為事利，爭貨財，無辭讓，果敢而振，猛貪而戾，恈恈然唯利之見，是賈盜之勇也。輕死而暴，是小人之勇也。義之所在，不傾於權，不顧其利，舉國而與之不為改視，重死持義而不橈，是士君子之勇也。</p><p><strong>所出</strong>：《荀子 · 榮辱篇》 — https://zh.wikisource.org/wiki/荀子/榮辱篇</p></article></main></div></div>
