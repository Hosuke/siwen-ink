    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 欽恤</nav></header><main><article><h1>欽恤</h1><p>刑罰之時，敬慎而不濫。</p><p>帝舜戒[[士師]]曰：「欽哉，欽哉，惟刑之恤哉！」恤者，惻隱之心也。刑罰之用，非以厲民，乃以止暴；非以快意，乃以安人。恤刑之要，在審慎；在得情；在罰當其罪；在罪疑惟輕。</p><p><strong>所出</strong>：《尚書 · 舜典》 — https://zh.wikisource.org/wiki/尚書/舜典</p></article></main></div></div>
