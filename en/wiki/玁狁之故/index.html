    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 玁狁之故</nav></header><main><article><h1>玁狁之故</h1><p>征人離家，皆因玁狁之患，以是為辭，再三言之。</p><p>「[[不遑啟居]]，玁狁之故」，征人自述其辭。一章言之，二章又言之，見其迫於外患者深而無以寧處也。玁狁，周時北方獫狁之族，文王以來屢為邊患。[[采薇]]之作，即因玁狁而遣戍役以守衞中國，故詩人反覆道之，以見出戍之由、思歸之故，皆本乎玁狁之難。</p><p><strong>所出</strong>：《詩經 · 采薇》 — https://zh.wikisource.org/wiki/詩經/采薇</p></article></main></div></div>
