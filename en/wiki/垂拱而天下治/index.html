    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 垂拱而天下治</nav></header><main><article><h1>垂拱而天下治</h1><p>惇信明義，崇德報功，垂拱而天下治，-{zh:言;}-無為之效。</p><p>惇信明義，崇德報功，垂拱而天下治。-{zh:言;}-聖人-{zh:修;}-德-{zh:行政，}-{zh:不待智力}，-{zh:拱手而天下}-{zh:自治}。蓋列爵惟五、分土惟三、建官惟賢、位事惟能、重民五教、惟食喪祭，治法畢備，而-{zh:聖人}躬行德化，以-{zh:致}天下-{zh:之治}，-{zh:所}以-{zh:垂拱}而無為-{zh:也}。</p><p><strong>所出</strong>：《尚書 · 武成》 — https://zh.wikisource.org/wiki/尚書/武成</p></article></main></div></div>
