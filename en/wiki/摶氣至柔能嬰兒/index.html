    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 摶氣至柔能嬰兒</nav></header><main><article><h1>摶氣至柔能嬰兒</h1><p>摶煉精氣以臻柔弱，若嬰兒之無知。</p><p>摶氣至柔，言煉精氣以歸於柔弱也。氣本剛健，務摶而斂之，以漸臻於至柔之境。柔則和，和則久。及其至也，若嬰兒之未孩，無知無欲，純白不染，此脩身之要道也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第五十四章 无不為》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)
