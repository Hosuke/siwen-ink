    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 梓慶削木為鐻</nav></header><main><article><h1>梓慶削木為鐻</h1><p>匠人齋心靜觀，合以天機，故器成若神。</p><p>梓慶削木為鐻，鐻成，見者驚猶鬼神。魯侯問焉，曰：「子何術以為焉？」對曰：「臣將為鐻，未嘗敢以耗氣也，必齊以靜心。齊三日，而不敢懷慶賞爵祿；齊五日，不敢懷非譽巧拙；齊七日，輒然忘吾有四枝形體也。當是時也，无公朝，其巧專而外骨消；然後入山林，觀天性，形軀至矣，然後成見鐻，然後加手焉，不然則已。則以天合天，器之所以疑神者，其是與！」</p><p><strong>所出</strong>：《莊子 · 達生》 — https://zh.wikisource.org/wiki/莊子/達生</p></article></main></div></div>
