    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 赤血化為赤光</nav></header><main><article><h1>赤血化為赤光</h1><p>上清煉血之法，以存思引赤炁化為光輪，神居光內，以去死根。</p><p>此為上清大洞經精血三真章之要行。修煉者以口吸神雲、咽津三過，結作三神，下布兩膀胱，運下元精血纏繞神身，入尾閭穴，穿骨髓，上入泥丸；下布鼻凹，出赤血化為一輪赤光，神居光內，前去身五丈。煉此赤光，可以驅逐死根、斷絕胞原、上昇玉階，超逸十界。</p><p>是法以血化光為要驗，故章末附大洞精血三真元生君消魔玉符，鎮鼻孔之下，通太真之戶，固死炁於九門。</p><p><strong>所出</strong>：《上清大洞真經 · 17章》 — https://zh.wikisource.org/wiki/上清大洞真經/17章</p></article></main></div></div>
