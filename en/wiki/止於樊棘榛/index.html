    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 止於樊棘榛</nav></header><main><article><h1>止於樊棘榛</h1><p>蠅止樊籬漸入棘榛，以喻讒言由遠及近，由疏入親。</p><p>「止於樊」「止于棘」「止于榛」，《青蠅》三章之漸也。</p><p>樊，籬也，在外而近；棘，荊也，稍入而危；榛，林也，益深而逼。三者層遞，以喻讒言之來也。先自外而至樊籬，漸及庭宇之近；繼而荊棘蒙其中；終則林薄幽深，無所不至。言讒人之言，其害由遠及近，日浸月潤，至於構我二人而後已。詩人假物象以見義，其旨深矣。</p><p><strong>所出</strong>：《詩經 · 青蠅》 — https://zh.wikisource.org/wiki/詩經/青蠅</p></article></main></div></div>
