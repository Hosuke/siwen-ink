    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 帝禹明度數聲樂</nav></header><main><article><h1>帝禹明度數聲樂</h1><p>記禹定山川神主明度數聲樂之事</p><p>帝禹既禪，，天下宗之，選明脩聲樂。於是天下皆宗明度數聲樂，爲山川神主。帝禹於是命臯陶之時，帝拜美言。帝錫禹玄圭，告其成功。禹行山表木，定高山大川。令天子之國以外五百里甸服，咸有定制。</p><p><strong>所出</strong>：《史記 · 卷002》 — https://zh.wikisource.org/wiki/史記/卷002</p></article></main></div></div>
