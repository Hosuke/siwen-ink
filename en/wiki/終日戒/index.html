    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 終日戒</nav></header><main><article><h1>終日戒</h1><p>六四爻辭，言終日戒懼不懈，以況處既濟之時當常存戒懼之心。</p><p>六四：「繻有衣袽，終日戒。」[[象曰]]：「終日戒，有所疑也。」繻，細密之布；衣袽，弊衣也。舟行水上，當預備敗絮以塞漏。功成之後，危伏於安，故君子終日戒懼，不敢懈怠。[[思患豫防]]之義，於此爻備見之。</p><p><strong>所出</strong>：《周易 · 既濟》 — https://zh.wikisource.org/wiki/周易/既濟</p></article></main></div></div>
