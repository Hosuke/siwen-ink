    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 陳師鞠旅</nav></header><main><article><h1>陳師鞠旅</h1><p>列陣教戒士卒，誓師之大典。</p><p>陳師鞠旅，謂整列師衆，告戒大衆也。[[師干之試]] 言其素備，陳師鞠旅言其臨事告戒。《采芑》三章云：「鉦人伐鼓，陳師鞠旅。」言方叔涖止，陳列其師，誓戒大衆，聲明紀律也。《毛傳》曰：「鞠，告也。」古者出師，必有誓師之禮，鳴鼓而進，鳴金而退，故鉦人伐鼓，所以示衆也。</p><p><strong>所出</strong>：《詩經 · 采芑》 — https://zh.wikisource.org/wiki/詩經/采芑</p></article></main></div></div>
