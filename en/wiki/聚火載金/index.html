    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 聚火載金</nav></header><main><article><h1>聚火載金</h1><p>以猛火聚而載金上行，凝神入乾頂而成丹之法。</p><p>聚火載金者，烹煉之要法也。起先運南方離宮之火，以煉北方水中之金，是為以紅投黑，凝神入坤臍而生藥；既得藥後，則運北方水中之金，以制南方火中之木，是為以黑見紅，凝神入乾頂而成丹。紫陽悟真篇云：「依他坤位生成體，種在乾家交感宮。」崔公入藥鏡云：「產在坤，種在乾。」非猛烹極煆則藥不能出爐，非倒行逆旋則藥不能升鼎。火熾則水沸，水沸則駕動河車，載金上升，泥丸與真汞配合，丹道成矣。</p><p><strong>所出</strong>：《性命圭旨 · 利集》 — https://zh.wikisource.org/wiki/性命圭旨/利集</p></article></main></div></div>
