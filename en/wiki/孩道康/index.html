    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 孩道康</nav></header><main><article><h1>孩道康</h1><p>命門桃君之字，大洞玉經所言守命之真也。</p><p>孩道康，命門桃君之字也，出上清大洞真經第八章大洞玉經。</p><p>經云：「玉賓表玄籍，守命孩道康。」孩道康居命門，主守護年命，使不失度。與泥丸天帝君上一赤子同為身中要神。</p><p>誦是經者，存思三元之炁，和合內外，令孩道康常在，而年命延長。</p><p><strong>所出</strong>：《上清大洞真經 · 8章》 — https://zh.wikisource.org/wiki/上清大洞真經/8章</p></article></main></div></div>
