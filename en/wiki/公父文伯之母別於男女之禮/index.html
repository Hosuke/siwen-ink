    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 公父文伯之母別於男女之禮</nav></header><main><article><h1>公父文伯之母別於男女之禮</h1><p>公父文伯之母祭悼子時不與康子同宴，以為別於男女之禮，仲尼善之。</p><p>公父文伯之母，季康子之從祖叔母也。康子往焉，䦱門與之言，皆不踰閾。祭悼子，康子與焉，酢不受，徹俎不宴，宗不具不繹，繹不盡飫則退。仲尼聞之，以為別於男女之禮矣。</p><p><strong>所出</strong>：《國語 · 卷05》 — https://zh.wikisource.org/wiki/國語/卷05</p></article></main></div></div>
