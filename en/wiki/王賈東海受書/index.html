    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 王賈東海受書</nav></header><main><article><h1>王賈東海受書</h1><p>詣神仙胡毋丘力君，受太極上元年紀，服朱草神芝。</p><p>王賈在東海山中，詣神仙胡毋丘力君，受太極上元年紀之衛，服朱草神芝得仙。其山在海中，望之甚近而不可到。山上多木芝靈木神草，蒼靈龍龜，天地奇物，不可名字。洞中有河洛元命曆等書。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 35》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/35</p></article></main></div></div>
