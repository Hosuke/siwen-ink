    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 郢書燕說</nav></header><main><article><h1>郢書燕說</h1><p>喻文字傳寫失誤，誤解本意而附會之</p><p>郢人有遺燕相國書者，夜書，火不明，因謂持燭者曰「舉燭」。云而過書「舉燭」。舉燭非書意也，燕相受書而說之，曰「舉燭者，尚明也；尚明也者，舉賢而任之。」燕相白王，王大說，國以治。治則治矣，非書意也。此喻後世學者多似此類，泥文字而失本意，妄為附會，以文害用。</p><p><strong>所出</strong>：《韓非子 · 外儲說左上》 — https://zh.wikisource.org/wiki/韓非子/外儲說左上</p></article></main></div></div>
