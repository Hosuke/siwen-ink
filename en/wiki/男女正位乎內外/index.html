    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 男女正位乎內外</nav></header><main><article><h1>男女正位乎內外</h1><p>女正位乎內，男正位乎外，是天地之大義。</p><p>男女正位乎內外，[[周易 · 家人]]彖傳之言也。</p><p>「女正位乎內，男正位乎外」，言陰陽之定位剛柔之攸分也。女子以中正居內，主餙遺體、奉祭祀；男子以中正居外，主承家業、事君長。各正厥位，不相侵越，是為天地之大義焉。</p><p>蓋家者風化之原，而男女者家政之本也。女正則內治有序，男正則外事無愆。內外交正，則上下定、尊卑序，猶天地之正焉。後世或執此以定禮防，亦緣其義之正也。</p><p><strong>所出</strong>：《周易 · 家人》 — https://zh.wikisource.org/wiki/周易/家人</p></article></main></div></div>
