    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 廣陵茶姥</nav></header><main><article><h1>廣陵茶姥</h1><p>廣陵賣茶媼，形如七十，晉元南渡後猶存百餘年，器中茶常若新熟，未嘗減少。</p><p>廣陵茶姥者，不知姓氏鄉里，常如七十歲人，而輕健有力，耳聰目明，頭髮鬢黑。晉元南渡之後，耆舊相傳見之百餘年，顏狀不改。每持一器茗往市鬻之，市人爭買，自旦至暮，所賣極多，而器中茶常如新熟，而未嘗減少，人多異之。州吏以冒法系之於獄，姥乃持所賣茗器，自牖中飛去。</p><p><strong>所出</strong>：《墉城集仙錄 · 卷07》 — https://zh.wikisource.org/wiki/墉城集仙錄/卷07</p></article></main></div></div>
