    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 四民交能易作</nav></header><main><article><h1>四民交能易作</h1><p>農士工商各盡其能，終歲之利相均。</p><p>是先王使農士商工四民交能易作，終歲之利，無道相過也，是以民作一而得均。民作一則田墾，姦巧不生。田墾則粟多，粟多則國富。姦巧不生則民治。富而治，此王之道也。</p><p><strong>所出</strong>：《管子 · 第48篇治國》 — https://zh.wikisource.org/wiki/管子/第48篇治國</p></article></main></div></div>
