    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 反巡故鄉</nav></header><main><article><h1>反巡故鄉</h1><p>鳥獸失群，猶過故鄉而翔回鳴號，況人於父母之親。</p><p>今是大鳥獸，則失喪其群匹，越月逾時焉，則必反巡，過其故鄉，翔回焉，鳴號焉，蹢躅焉，踟躕焉，然後乃能去之。小者至於燕雀，猶有啁噍之頃焉。然後乃能去之。故有血氣之屬者，莫知於人，故人於其親也，至死不窮。</p><p><strong>所出</strong>：《禮記 · 三年問》 — https://zh.wikisource.org/wiki/禮記/三年問</p></article></main></div></div>
