    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 七診</nav></header><main><article><h1>七診</h1><p>九候之中，獨見一候之變者為病；七診見而九候皆從者不死。</p><p>察九候，獨小者病，獨大者病，獨疾者病，獨遲者病，獨熱者病，獨寒者病，獨陷下者病，是為七診。</p><p>七診雖見，九候皆從者不死。所言不死者，風氣之病及經月之病，似七診之病而非也。
若有七診之病，其脈候亦敗者，死矣。</p><p><strong>所出</strong>：《黃帝內經 · 素問第六卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第六卷</p></article></main></div></div>
