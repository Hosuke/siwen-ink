    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 城上火備</nav></header><main><article><h1>城上火備</h1><p>城上置火之具，蓄水、薪、突火，以防火攻並拒敵人。</p><p>城門上所鑿以救門火者，各一垂水，容三石以上，小大相襍。</p><p>門扇薄植皆鑿半寸，一寸一涿弋，厚塗之以備火。</p><p>城上九尺一弩、一戟、一椎、一斧、一艾，皆積絫石、蒺蔾。</p><p>城上為攢火，夫長以城高下為度，置火其末。</p><p>救闉池者，以火與爭，鼓橐，馮填外內，以柴為燔。</p><p>又置水器：麻斗、革盆，十步一；水缻容三石以上，置之城上。此皆火備之具，以防敵火攻，並備我方縱火以拒敵。</p><p><strong>所出</strong>：《墨子 · 備城門》 — https://zh.wikisource.org/wiki/墨子/備城門</p></article></main></div></div>
