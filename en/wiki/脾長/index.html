    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 脾長</nav></header><main><article><h1>脾長</h1><p>脾為中官，主消榖納食，長精益命，與龍虎相制。</p><p>脾居中土，長尺以許，覆蔽太倉，位居中央之官。《黃庭經》以脾為中部老君所治，居明堂之位，主消化五穀、消除百病。修煉之人持黃衣紫帶、龍虎之章以為符信，長養精華、補益性命，而其效驗則賴乎人主之心念誠篤也。脾之德能總統土德、運化四臟，故道家以之為三元之樞要焉。</p><p><strong>所出</strong>：《黃庭內景經 · 脾長章第十五》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/脾長章第十五</p></article></main></div></div>
