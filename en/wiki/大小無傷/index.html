    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 大小無傷</nav></header><main><article><h1>大小無傷</h1><p>陽大陰小，不可偏傷，兩國全乃結丹。</p><p>金丹乃道心真知之真鉛、人心靈知之真汞而成。欲修金丹，先調鉛汞。道心剛屬陽為大，人心柔屬陰為小。人心借靈生妄能敗道，若以道心制之，則靈明不昧，能以助道。古人教人死者，死人心之假靈，非死人心之真靈。若一概死盡，則入頑空寂滅之學。傷其小即害其大，陰陽偏孤，生機氣息不成金丹乎？故曰大小無傷兩國全。</p><p><strong>所出</strong>：《悟真直指 · 卷二》 — https://zh.wikisource.org/wiki/悟真直指/卷二</p></article></main></div></div>
