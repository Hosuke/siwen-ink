    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 白珪之玷</nav></header><main><article><h1>白珪之玷</h1><p>白珪有瑕猶可磨，言語一失難挽回。喻失言之禍，深於物玷。</p><p>裏克既殺奚齊、悼子，荀息死之。君子曰：「詩所謂『白珪之玷，猶可磨也，斯言之玷，不可為也』，其荀息之謂乎！不負其言。」</p><p>初，獻公問荀息：「吾以奚齊為後，年少，諸大臣不服，恐亂起，子能立之乎？」荀息曰：「能。」獻公曰：「何以為驗？」對曰：「使死者復生，生者不慚，為之驗。」及獻公卒，奚齊、悼子皆死，荀息果然以身殉之。</p><p><strong>所出</strong>：《史記 · 卷039》 — https://zh.wikisource.org/wiki/史記/卷039</p></article></main></div></div>
