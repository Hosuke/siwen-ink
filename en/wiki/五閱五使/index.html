    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 五閱五使</nav></header><main><article><h1>五閱五使</h1><p>五官為五藏之閱，五色見於明堂，可觀藏氣。</p><p>五官者，五藏之閱也。鼻者肺之官，目者肝之官，口脣者脾之官，舌者心之官，耳者腎之官。五色更出以應五時，經氣入藏，必當治裏。</p><p>以五官候五藏：肺病者喘息鼻張，肝病者眥青，脾病者脣黃，心病者舌卷短顴赤，腎病者顴與顏黑。明堂廣大者壽，闕庭不張者夭。五藏之在中，各以次舍左右上下，各如其度。</p><p><strong>所出</strong>：《黃帝內經 · 靈樞第六卷》 — https://zh.wikisource.org/wiki/黃帝內經/靈樞第六卷</p></article></main></div></div>
