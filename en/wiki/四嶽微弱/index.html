    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 四嶽微弱</nav></header><main><article><h1>四嶽微弱</h1><p>周末齊晉秦楚在成周之際，封疆甚微，後乃迭興為伯主。</p><p>齊、晉、秦、楚其在成周微甚，封或百里或五十里。晉阻三河，齊負東海，楚介江淮，秦因雍州之固，四海迭興，更為伯主，文武所襃大封，皆威而服焉。</p><p><strong>所出</strong>：《史記 · 卷014》 — https://zh.wikisource.org/wiki/史記/卷014</p></article></main></div></div>
