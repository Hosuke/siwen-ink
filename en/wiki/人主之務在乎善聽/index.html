    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 人主之務在乎善聽</nav></header><main><article><h1>人主之務在乎善聽</h1><p>人主之務，在乎善聽而已。</p><p>若使中山之王與齊王，聞五盡而更之，則必不亡矣。其患不聞，雖聞之又不信。然則[[人主之務在乎善聽]]而已矣。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十六》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十六</p></article></main></div></div>
