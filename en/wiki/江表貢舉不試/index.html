    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 江表貢舉不試</nav></header><main><article><h1>江表貢舉不試</h1><p>江表千里，儒業衰頹，由貢士不試經傳也。</p><p>[[抱朴子]]嘗論江表貢舉之事曰：「吳土初附，其貢士見偃以不試。今太平已近四十年矣，猶復不試，所以使東南儒業衰於在昔也。」又曰：「今貢士無復試者，則必皆脩飾馳逐，以競虛名，誰肯復開卷受書哉？」其弊至於斯也。夫江表之人，非盡下於中州，特以制度不及，遂使人才湮沒，學風日頹。是誠為政者之失，不可不察也。</p><p><strong>所出</strong>：《抱朴子 · 卷15》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷15</p></article></main></div></div>
