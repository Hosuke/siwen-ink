    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 斗為帝車</nav></header><main><article><h1>斗為帝車</h1><p>北斗為天帝之車，運於中央，臨制四方，分陰陽，建四時。</p><p>斗為帝車，運於中央，臨制四鄉。分陰陽，建四時，均五行，移節度，定諸紀，皆繫於斗。</p><p>斗魁戴匡六星曰文昌宮，魁下六星兩兩相比者名曰三能。杓端有矛曰招搖、盾曰天鋒。有句圜十五星屬杓，曰賤人之牢。</p><p><strong>所出</strong>：《史記 · 卷027》 — https://zh.wikisource.org/wiki/史記/卷027</p></article></main></div></div>
