    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 無敢越逐</nav></header><main><article><h1>無敢越逐</h1><p>戒擅自追攘，財物各歸其主</p><p>「馬牛其風，臣妾逋逃，無敢越逐，祗復之，我商賚汝。乃越逐不復，汝則有常刑。無敢寇攘，逾垣牆，竊馬牛，誘臣妾，汝則有常刑。」</p><p>「風」者，走逸也。言馬牛走逸、臣妾逃遁，皆不得越職追逐；見之者當敬謹還之於主，吾則商賚於汝。若既越逐而不歸還，則有常刑。又嚴寇攘之禁：逾垣牆、竊馬牛、誘臣妾，皆在罰例。財物各有主，戒貪利攘奪也。</p><p><strong>所出</strong>：《尚書 · 費誓》 — https://zh.wikisource.org/wiki/尚書/費誓</p></article></main></div></div>
