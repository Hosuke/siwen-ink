    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 天下隨時</nav></header><main><article><h1>天下隨時</h1><p>天下之物，各隨其時，時之義大矣。</p><p>彖傳曰：「大亨貞，无咎，而天下隨時，隨之時義大矣哉。」</p><p>天下之事物，莫不各隨其時以成。雷蟄於澤，震動以悅，物之隨也；君子嚮晦宴息，人之隨也。時之行也，無往而不適；時之止也，無為而不利。聖人觀象以知時，乘時以動順，故能無往而不亨也。隨之時義，貫乎天地，豈不大哉。</p><p><strong>所出</strong>：《周易 · 隨》 — https://zh.wikisource.org/wiki/周易/隨</p></article></main></div></div>
