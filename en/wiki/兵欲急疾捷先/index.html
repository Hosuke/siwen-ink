    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 兵欲急疾捷先</nav></header><main><article><h1>兵欲急疾捷先</h1><p>兵之道，在乎急疾捷先；持久則危，當速決乃勝。</p><p>凡兵欲急疾捷先。欲急疾捷先，之道在於知緩徐遲後而急疾捷先之分也。急疾捷先，此所以決義兵之勝也。而不可久處，知其不可久處，則知所兔起鳧舉死殙之地矣。</p><p>雖有江河之險則凌之，雖有大山之塞則陷之，并氣專精，心無有慮，目無有視，耳無有聞，一諸武而已矣。</p><p><strong>所出</strong>：《呂氏春秋 · 卷八》 — https://zh.wikisource.org/wiki/呂氏春秋/卷八</p></article></main></div></div>
