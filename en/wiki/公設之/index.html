    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 公設之</nav></header><main><article><h1>公設之</h1><p>君親為賓設饌，臣辭而不敢當也</p><p>公食大夫禮，宰夫授醯醬于公，公親設之于席前，曰「公設之」。賓辭，不敢當君之設也；乃北面坐，遷而東遷所。公設之者，隆主人之敬也；賓辭之者，明臣禮之恭也。黍稷、粱稻、羹湆之屬，皆公親設之；賓必辭，辭必遷，所以全君臣之義也。</p><p><strong>所出</strong>：《儀禮 · 公食大夫禮》 — https://zh.wikisource.org/wiki/儀禮/公食大夫禮</p></article></main></div></div>
