    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 土遊四季</nav></header><main><article><h1>土遊四季</h1><p>土德恆存，遍行四時，为還丹之要功。</p><p>土游于四季，守界定規矩。金砂入五內，霧散若風雨。熏蒸達四肢，顏色悅澤好。髪白皆變黑，齒落生舊所。老翁復丁壯，耆嫗成吒女。</p><p>土寄旺於辰戌丑未四庫，遍行四時，無時不然、無處不在，故曰「遊于四季」。守界者，戊己之土立於中宮，定水火之界限，規矩由是而生。修煉者以意守中，則四象五行自然歸土，而金砂凝結，丹道成矣。</p><p><strong>所出</strong>：《周易參同契 · 11章》 — https://zh.wikisource.org/wiki/周易參同契/11章</p></article></main></div></div>
