    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 龍首渠</nav></header><main><article><h1>龍首渠</h1><p>臨晉民穿渠引洛，崖善崩乃為井渠，因得龍骨而名焉。</p><p>龍首渠者，莊熊羆所言穿之渠也。臨晉民願穿洛以溉重泉以東萬餘頃故鹵地，誠得水，可令畝十石。朝廷發卒萬餘人穿渠，自徵引洛水至商顏山下。岸善崩，乃鑿井，深者四十餘丈。往往為井，井下相通行水。水穨以絕商顏，東至山嶺十餘里閒。井渠之生自此始。穿渠得龍骨，故名曰龍首渠。作之十餘歲，渠頗通，猶未得其饒。此為我國古代井渠法之濫觴，後世西北引水多效此法。</p><p><strong>所出</strong>：《史記 · 卷029》 — https://zh.wikisource.org/wiki/史記/卷029</p></article></main></div></div>
