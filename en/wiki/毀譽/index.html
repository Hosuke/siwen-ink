    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 毀譽</nav></header><main><article><h1>毀譽</h1><p>毁譽由人招，望譽而功不至者必毁。</p><p>毁譽之來，皆有漸也。望人譽而功不至，斯毁之；防人毁而過能悛，斯譽之。故毁譽我者無其漸，而招毁譽者有漸也。吾愛天下人，不求譽而行可譽之事；吾惡天下人，不畏毁而行可毁之端；吾恥天下人不知毁譽而湮没以終。生前以有過自毁者，人必譽之；生平以有功自譽者，人必毁之。毀人太過標榜起，求人太過求全者可誅。</p><p><strong>所出</strong>：《張三丰先生全集 · 卷6》 — https://zh.wikisource.org/wiki/張三丰先生全集/卷6</p></article></main></div></div>
