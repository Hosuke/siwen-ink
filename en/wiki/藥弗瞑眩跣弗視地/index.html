    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 藥弗瞑眩，厥疾弗瘳；跣弗視地，厥足用傷</nav></header><main><article><h1>藥弗瞑眩，厥疾弗瘳；跣弗視地，厥足用傷</h1><p>良藥苦口，諫辭逆耳，皆所以愈病也。</p><p>王命傅說以藥喻諫，云：「若藥弗瞑眩，厥疾弗瘳。」藥之治病，必有毒性能令人瞑眩者，乃可以去沉痼。復以跣喻云：「若跣弗視地，厥足用傷。」赤足而行，不視地之夷險，則荊棘傷之。此皆喻人臣之於其君，忠告[[善道之不可則止|善道]]而不可承意從諫者也。逆耳之辭非不快也，其效乃在于起沉疴；威怒之象非不厲也，其要在於防顚蹶。</p><p><strong>所出</strong>：《尚書 · 說命上》 — https://zh.wikisource.org/wiki/尚書/說命上</p></article></main></div></div>
