    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 子產稱詩止晉</nav></header><main><article><h1>子產稱詩止晉</h1><p>賢人在國，敵國不敢加兵；一詩之微，可以免戰。</p><p>晉人欲攻鄭，令叔嚮聘焉，視其有人與無人。子產為之詩曰：「子惠思我，褰裳涉洧；子不我思，豈無他士？」叔嚮歸曰：「鄭有人，子產在焉，不可攻也。秦、荊近，其詩有異心，不可攻也。」晉人乃輟攻鄭。孔子曰：「《詩》云：『無競惟人。』子產一稱而鄭國免。」</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十二》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十二</p></article></main></div></div>
