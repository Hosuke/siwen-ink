    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 不肯堂弗肯構</nav></header><main><article><h1>不肯堂弗肯構</h1><p>父定法而子不為基，況肯成之？以喻臣當竟先王之功。</p><p>父已定法，而子不肯為之基，況肯構乎？</p><p>「若考作室，既厎法，厥子乃弗肯堂，矧肯構？厥父菑，厥子乃弗肯播，矧肯獲？」</p><p>言父既畫定規模，而子不肯為基，猶父已播種而子不肯收刈。以喻朕已承文王之命，定厥規模，爾臣可不助朕竟其功乎？</p><p><strong>所出</strong>：《尚書 · 大誥》 — https://zh.wikisource.org/wiki/尚書/大誥</p></article></main></div></div>
