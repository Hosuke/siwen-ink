    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 小國寡民</nav></header><main><article><h1>小國寡民</h1><p>理想之世，國小民寡，各安其俗。</p><p>小國寡民者，治道之極也。國以小為善，民以寡為懷。小則上下相安，寡則供需自足。什伯之眾可以不用，重死而不遠徙，舟輿無所乘，甲兵無所陳，使民復古而用結繩。食甘、服美、居安、俗樂，鄰國相望，雞犬之聲相聞，而民至老死不相往來。此無為之世，民性自足，不假外求，雖小且寡，莫之能加也。</p><p>  <strong>所出</strong>：《老子河上公章句 · 獨立》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
