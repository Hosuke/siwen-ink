    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 揣而梲之</nav></header><main><article><h1>揣而梲之</h1><p>揣摩精礪，梲厲太過，則易折而不能長保。</p><p>揣而梲之，不可長保。</p><p>揣，治也；梲，削也。揣摩精礪，梲厲太過，則其物易折。器用然，身世亦然。《道德經》第四章云：「挫其銳，解其忿。」第十二章云：「五色令人目盲，五音令人耳聾。」皆戒太過之意。揣之精而梲之厲，是銳之挫者而又銳之也。銳而益銳，勢必至折；揣而益揣，終以自賊。是以不可長保，非物之不能久，在人之不知止耳。</p><p><strong>所出</strong>：《道德經 (王弼本) · 九章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
