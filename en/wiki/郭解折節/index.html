    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 郭解折節</nav></header><main><article><h1>郭解折節</h1><p>郭解年長折節為儉，以德報怨，厚施而薄望，而自喜為俠益甚。</p><p>解年長，更折節為儉，以德報怨，厚施而薄望。然其自喜為俠益甚。既已振人之命，不矜其功，其陰賊著於心，卒發於睚眦如故云。</p><p><strong>所出</strong>：《史記 · 卷124》 — https://zh.wikisource.org/wiki/史記/卷124</p></article></main></div></div>
