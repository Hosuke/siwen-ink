    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 君子豹變</nav></header><main><article><h1>君子豹變</h1><p>君子之變如豹，文蔚而美，漸而成德。</p><p>上六象曰「君子豹變，其文蔚也」，言君子之德，浸假而成，如豹文之蔚然，其變也有漸，其美也有章。豹變者，非一朝之功，乃隨時增益，浸以光華，此聖人取象以明君子修德之序，必待積累而後成也。</p><p><strong>所出</strong>：《周易 · 革》 — https://zh.wikisource.org/wiki/周易/革</p></article></main></div></div>
