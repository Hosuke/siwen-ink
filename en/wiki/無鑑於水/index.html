    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 無鑑於水</nav></header><main><article><h1>無鑑於水</h1><p>徒佩其言而無水之為鑑，終不足以自警。</p><p>贊曰：「有佩於言，無鑑於水。」劉勰此語，深戒世人之徒知言說之重，而闕躬行之實。水可以照形，言可以喻理；然有言而無行，如無水以自照，終何益焉。此箴之所以貴確切，銘之所以尚弘潤，皆所以使人有所監戒，不徒為空言也。</p><p><strong>所出</strong>：《文心雕龍 · 銘箴》 — https://zh.wikis</p></article></main></div></div>
