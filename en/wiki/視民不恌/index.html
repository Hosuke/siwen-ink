    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 視民不恌</nav></header><main><article><h1>視民不恌</h1><p>為人準則，不以輕薄示民。</p><p>視，通示；恌，通佻，輕薄之意。視民不恌，言行端正，不以輕薄示人也。《鹿鳴》次章承德音而言：「視民不恌，君子是則是傚。」言嘉賓之德音昭明，其儀容足以為民之準則，故君子取法之。毛亨云：「德音孔昭，視民不恌。」是則在上者以正示人，民乃從化也。</p><p><strong>所出</strong>：《詩經 · 鹿鳴》 — https://zh.wikisource.org/wiki/詩經/鹿鳴</p></article></main></div></div>
