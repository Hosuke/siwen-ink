    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 先國家之急而後私讎</nav></header><main><article><h1>先國家之急而後私讎</h1><p>藺相如以國為重，不與廉頗爭列。</p><p>再廉頗言，既罷，相如引車避匿。舍人皆欲辭去，相如止之，曰：「公之視廉將軍孰與秦王？」曰：「不若也。」相如曰：「夫以秦王之威，而相如廷叱之，辱其群臣，相如雖駑，獨畏廉將軍哉？顧吾念之，彊秦之所以不敢加兵於趙者，徒以吾兩人在也。今兩虎共闘，其勢不俱生。吾所以為此者，以先國家之急而後私讎也。」</p><p><strong>所出</strong>：《史記 · 卷081》 — https://zh.wikisource.org/wiki/史記/卷081</p></article></main></div></div>
