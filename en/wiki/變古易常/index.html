    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 變古易常</nav></header><main><article><h1>變古易常</h1><p>聖人治世，不泥古法，因時之宜以為變革。</p><p>不知治者必曰「無變古，毋易常」。然聖人不聽，正治而已。變與不變，在常古之可與不可。伊尹毋變殷，太公毋變周，則湯、武不王；管仲毋易齊，郭偃毋更晉，則桓、文不霸。凡人難變古者，憚易民之安也。韓非以為，不變古者，襲亂之迹；適民心者，恣姦之行也。</p><p><strong>所出</strong>：《韓非子 · 南面》 — https://zh.wikisource.org/wiki/韓非子/南面</p></article></main></div></div>
