    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 孝子事親三道</nav></header><main><article><h1>孝子事親三道</h1><p>孝子事親，養、喪、祭，三道備焉。</p><p>孝子之事親也，有三道焉：生則養，沒則喪，喪畢則祭。養則觀其順也，喪則觀其哀也，祭則觀其敬而時也。盡此三道者，孝子之行也。</p><p>夫祭者，所以追養繼孝也。孝者，畜也。順於道不逆於倫，是之謂畜。</p><p><strong>所出</strong>：《禮記 · 祭統》 — https://zh.wikisource.org/wiki/禮記/祭統</p></article></main></div></div>
