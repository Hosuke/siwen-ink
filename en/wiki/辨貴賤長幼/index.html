    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 辨貴賤長幼</nav></header><main><article><h1>辨貴賤長幼</h1><p>昔聖帝明王辨貴賤長幼遠近男女內外，皆由此途出。</p><p>昔聖帝明王諸侯，辨貴賤長幼、遠近男女外內，莫敢相逾越，皆由此途出也。三子者既得聞此言也於夫子，昭然若發蒙矣。</p><p>目巧之室，則有奧阼，席則有上下，車則有左右，行則有隨，立則有序，古之義也。室而無奧阼，則亂於堂室也；席而無上下，則亂於席上也；車而無左右，則亂於車也；行而無隨，則亂於塗也；立而無序，則亂於位也。</p><p><strong>所出</strong>：《禮記 · 仲尼燕居》 — https://zh.wikisource.org/wiki/禮記/仲尼燕居</p></article></main></div></div>
