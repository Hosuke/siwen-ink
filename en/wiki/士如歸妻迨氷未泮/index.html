    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 士如歸妻迨氷未泮</nav></header><main><article><h1>士如歸妻迨氷未泮</h1><p>士若娶妻，宜及氷泮之前，俟時而行，不可失禮。</p><p>「士如歸妻，迨氷未泮」，《匏有苦葉》第三章句也。言士之娶妻，宜及氷泮之前行之。氷泮者，氷解之時，仲春之月也。古代嫁娶有常期，仲春氷泮，則禮限已屆，故云「迨氷未泮」，言宜及其時也。詩刺宣公淫亂，失男女之別，故借此正言以諷。</p><p><strong>所出</strong>：《詩經 · 匏有苦葉》 — https://zh.wikisource.org/wiki/詩經/匏有苦葉</p></article></main></div></div>
