    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 五運之政</nav></header><main><article><h1>五運之政</h1><p>五運迭運，若權衡之平，高者抑之，下者舉之，化者應之，變者復之。</p><p>五運之政，猶權衡也，高者抑之，下者舉之，化者應之，變者復之，此生長化成收藏之理，氣之常也；失常，則天地四塞矣。夫道者，上知天文，下知地理，中知人事，可以長久。</p><p><strong>所出</strong>：《黃帝內經 · 素問第二十卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第二十卷</p></article></main></div></div>
