    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 五瑞</nav></header><main><article><h1>五瑞</h1><p>諸侯朝聘之玉，五等之瑞。</p><p>輯五瑞。既月乃日，覲四岳群牧，班瑞于群后。瑞者，玉也，天子所以命諸侯也。班者，分之也。五瑞即五玉，公、侯、伯、子、男各執其一。班瑞者，天子與諸侯重申相信之禮也。</p><p><strong>所出</strong>：《尚書 · 舜典》 — https://zh.wikisource.org/wiki/尚書/舜典</p></article></main></div></div>
