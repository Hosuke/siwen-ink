    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 城粟軍糧</nav></header><main><article><h1>城粟軍糧</h1><p>城池之守與軍旅之食，國家安危所繫，不可不察。</p><p>城粟軍糧，其可以行幾何年也？此[[問者]]所以察守備之虛實也。城池者，國家之扞蔽；軍糧者，三軍之命脈。守備不設，則敵國窺伺；軍食不足，則師旅瓦解。故為人上者，必先計蓄積之多寡，次察城守之完固，然後可以言戰。今[[管子]]之意，以為城郭溝渠不足以固守，而城粟軍糧之積，乃邦本所在也。有備則無患，無備則自取滅亡，可不慎哉。</p><p><strong>所出</strong>：《管子 · 第24篇問》 — https://zh.wikisource.org/wiki/管子/第24篇問</p></article></main></div></div>
