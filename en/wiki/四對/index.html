    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 四對</nav></header><main><article><h1>四對</h1><p>言對、事對、反對、正對，四者麗辭之體也。</p><p>故麗辭之體，凡有四對：言對為易，事對為難，反對為優，正對為劣。又以事對，各有反正，指類而求，萬條自昭然矣。</p><p><strong>所出</strong>：《文心雕龍 · 麗辭》 — https://zh.wikisource.org/wiki/文心雕龍/麗辭</p></article></main></div></div>
