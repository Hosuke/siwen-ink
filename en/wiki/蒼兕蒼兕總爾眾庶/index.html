    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 蒼兕蒼兕總爾眾庶</nav></header><main><article><h1>蒼兕蒼兕總爾眾庶</h1><p>師尚父誓師之辭，喻帥眾當嚴</p><p>師尚父左杖黃鉞，右把白旄以誓，曰：「蒼兕蒼兕，總爾眾庶，與爾舟楫，後至者斬！」遂至盟津，諸侯不期而會者八百。此言帥師誓眾，號令嚴明，遲者必誅，以成軍威也。</p><p><strong>所出</strong>：《史記 · 卷032》 — https://zh.wikisource.org/wiki/史記/卷032</p></article></main></div></div>
