    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 歌謠遣憂</nav></header><main><article><h1>歌謠遣憂</h1><p>賢者不得志以歌謠宣洩其憂</p><p>「心之憂矣，我歌且謠。」</p><p>賢者之憂，無可告語，無可解免，乃發而為歌謠。歌者，言之長者也；謠者，徒歌之謂也。《尚書》曰「詩言志」，此詩人所以宣其幽愁結愫也。園有桃而實可食，猶賢者在位而可用；然而不知我者多，知我者少，不得已而歌以寫之。歌謠者，非以為樂，乃所以遣憂也。</p><p><strong>所出</strong>：《詩經 · 園有桃》 — https://zh.wikisource.org/wiki/詩經/園有桃</p></article></main></div></div>
