    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 君射則臣決</nav></header><main><article><h1>君射則臣決</h1><p>上行而下效，居上者當正己</p><p>君者儀也，民者景也，儀正而景正。君者槃也，民者水也，槃圓而水圓。君者盂也，盂方而水方。君射則臣決。楚莊王好細腰，故朝有餓人。故曰：聞修身，未嘗聞為國也。</p><p><strong>所出</strong>：《荀子 · 君道篇》 — https://zh.wikisource.org/wiki/荀子/君道篇</p></article></main></div></div>
