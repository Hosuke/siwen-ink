    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 易而无備</nav></header><main><article><h1>易而无備</h1><p>平易近人，不設防範而自威。</p><p>六五「威如」，《象》傳以「易而无備」釋之。言六五以柔德居尊，孚信動物，人自敬之，非以威刑臨之也。平易近人，情實相通，故不待戒備而威自行焉。夫威德之至者，不見其威而人自畏之，此聖人所以為盛也。</p><p><strong>所出</strong>：《周易 · 大有》 — https://zh.wikisource.org/wiki/周易/大有</p></article></main></div></div>
