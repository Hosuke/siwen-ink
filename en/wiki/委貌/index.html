    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 委貌</nav></header><main><article><h1>委貌</h1><p>周道之冠，委貌是也，士行冠禮所服。</p><p>委貌，周道之冠也。《記》曰「委貌，周道也」，言周之大夫士行冠禮，所加之冠以委貌為正。委貌以玄色為之，溫柔而端正，委者，垂順之義，貌者，容儀也。周人尚文，故以委貌配皮弁素積，表其德容之盛。[[皮弁素積]]為三王共服，而委貌則周道所獨用，以別夏殷之制也。</p><p><strong>所出</strong>：《儀禮 · 士冠禮》 — https://zh.wikisource.org/wiki/儀禮/士冠禮</p></article></main></div></div>
