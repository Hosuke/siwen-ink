    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 外存亡國</nav></header><main><article><h1>外存亡國</h1><p>存亡國、繼絕世，為國之禮。</p><p>[[管仲]]言[[為國]]之道：「外存亡國，繼絕世，起諸孤。」蓋存亡國以彰義，繼絕世以明倫，起孤弱以廣仁，此[[外存亡國]]之義。</p><p><strong>所出</strong>：《管子 · 第19篇中匡》 — https://zh.wikisource.org/wiki/管子/第19篇中匡</p></article></main></div></div>
