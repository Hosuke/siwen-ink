    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 我聞有命不敢以告人</nav></header><main><article><h1>我聞有命不敢以告人</h1><p>聞密命而不敢泄，以見事機之危、慎密之至。</p><p>「我聞有命，不敢以告人」。唐風《揚之水》末章之卒章也。言既聞密命，唯恐泄致禍，故不敢以告人。辭甚簡而意甚深：知其機密而守口如瓶，是全身遠害之道，亦見人心之測、國事之危也。</p><p><strong>所出</strong>：《詩經 · 揚之水》 — https://zh.wikisource.org/wiki/詩經/揚之水</p></article></main></div></div>
