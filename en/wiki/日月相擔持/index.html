    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 日月相擔持</nav></header><main><article><h1>日月相擔持</h1><p>日月迭運，互為終始，以成宇宙之明。</p><p>日月者，天地之精華也。晦至朔旦，日月相擔持。擔者，任也；持者，援也。迭往迭來，互成終始，合抱之象，此之謂與。</p><p><strong>所出</strong>：《周易參同契 · 03章》 — https://zh.wikisource.org/wiki/周易參同契/03章</p></article></main></div></div>
