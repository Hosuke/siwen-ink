    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 夬履</nav></header><main><article><h1>夬履</h1><p>果決前行，循正以行，守危之戒。</p><p>九五：夬履，貞厲。</p><p>夬者，決也，果斷之謂。[[夬履]]者，毅然決行，勇於有為。居天子之位，以剛健果決治世。然正當之位而行果斷，若失之躁急，則有厲。貞者，守正以防其失也。</p><p><strong>所出</strong>：《周易 · 履》 — https://zh.wikisource.org/wiki/周易/履</p></article></main></div></div>
