    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 蜉蝣之翼</nav></header><main><article><h1>蜉蝣之翼</h1><p>喻外在之美不過一時。</p><p>「蜉蝣之翼，采采衣服」，次章複-{云}-蜉蝣翼羽之美，以興人之衣服粲然。與首章「衣裳楚楚」義近而辭異，蓋《詩》之反覆詠歎，猶 [[葛覃]] 之「黃鳥于飛」，同一筆法。「采采」者，華盛之貌，見其美矣，而亦不能久留，反覆言之者，愈見詩人深憂。</p><p><strong>所出</strong>：《詩經 · 蜉蝣》 — https://zh.wikisource.org/wiki/詩經/蜉蝣</p></article></main></div></div>
