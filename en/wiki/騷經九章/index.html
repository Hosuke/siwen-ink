    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 騷經九章</nav></header><main><article><h1>騷經九章</h1><p>《離騷》之文朗麗以哀志，《九章》諸篇亦朗麗哀志。</p><p>故《騷》經九章，朗麗以哀志；《九歌》、《九辯》，綺靡以傷情；《遠游》、《天問》，瓌詭而惠巧；《招魂》、《招隱》，耀豔而深華；《卜居》標放言之致；《漁父》寄獨往之才。故能氣往轢古，辭來切今，驚采絕豔，難與並能矣。</p><p><strong>所出</strong>：《文心雕龍 · 辨騷》 — https://zh.wikisource.org/wiki/文心雕龍/辨騷</p></article></main></div></div>
