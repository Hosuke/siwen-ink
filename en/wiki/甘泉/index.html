    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 甘泉</nav></header><main><article><h1>甘泉</h1><p>揚雄所作甘泉賦，夸飾過甚，劉勰譏其語瓌奇而失實</p><p>[[揚雄]]《甘泉賦》，述宮室之美，夸飾至極。劉勰云：「語瓌奇，則假珍於玉樹；言峻極，則顛墜於鬼神。」又云：「酌其餘波，語瓌奇，則假珍於玉樹。」是言其夸飾無度，虛而不實也。[[羽獵]]亦有此失。</p><p><strong>所出</strong>：《文心雕龍 · 夸飾》 — https://zh.wikisource.org/wiki/文心雕龍/夸飾</p></article></main></div></div>
