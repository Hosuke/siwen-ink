    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 五刑之屬三千</nav></header><main><article><h1>五刑之屬三千</h1><p>五刑各有千屬，總三千之數。</p><p>墨千、劓千、剕五百、宮三百、大辟二百，合成三千之數。罪各有條，刑各有等。</p><p><strong>所出</strong>：《尚書 · 呂刑》 — https://zh.wikisource.org/wiki/尚書/呂刑</p></article></main></div></div>
