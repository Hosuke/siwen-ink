    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 其後也悔</nav></header><main><article><h1>其後也悔</h1><p>預言薄情者終必悔恨。</p><p>《江有汜》首章末句云「其後也悔」。</p><p>詩中女子三被遣歸，而言「其後也悔」「其後也處」「其嘯也歌」。彼男子者，今也不我以、不我與、不我過；然他日必悔，此自然之理也。</p><p>「悔」字一篇三見，而意各有進：不我以者，其後悔也；不我與者，其後居處無依而悔也；不我過者，其後聞其嘯歌而悔也。情辭怨而不怒，預後而不迫，斯詩之厚也。</p><p><strong>所出</strong>：《詩經 · 江有汜》 — https://zh.wikisource.org/wiki/詩經/江有汜</p></article></main></div></div>
