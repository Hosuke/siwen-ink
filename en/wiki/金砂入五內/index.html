    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 金砂入五內</nav></header><main><article><h1>金砂入五內</h1><p>金砂入於五臟，霧散風雨，喻還丹成就遍達周身。</p><p>金砂入五內，霧散若風雨。熏蒸達四肢，顏色悅澤好。</p><p>「金砂」者，戊土之真氣凝結而成，象徵還丹之精華。修煉既成，金砂入於五內，分布臟腑，如霧之散、若雨之濡，無微不入。「熏蒸達四肢」者，精氣周流肌骨之間，榮衛通暢，顔色自然悅澤。丹道已成，神變之用遍及形骸，故能令白髮返黑、齒落重生。</p><p><strong>所出</strong>：《周易參同契 · 11章》 — https://zh.wikisource.org/wiki/周易參同契/11章</p></article></main></div></div>
