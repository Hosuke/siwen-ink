    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 賢智之士奚時得用</nav></header><main><article><h1>賢智之士奚時得用</h1><p>賢智之士無由進用，以其說不被信納。</p><p>昔關龍逄說桀而傷其四肢，王子比干諫紂而剖其心，子胥忠直夫差而誅於屬鏤。此三子者，爲人臣非不忠，而說非不當也，然不免於死亡之患者，主不察賢智之言，而蔽於不肖之患也。今人主非肯用法術之士，聽愚不肖之臣，則賢智之士孰敢當三子之危而進其智能者乎？此世之所以亂也。</p><p><strong>所出</strong>：《韓非子 · 人主》 — https://zh.wikisource.org/wiki/韓非子/人主</p></article></main></div></div>
