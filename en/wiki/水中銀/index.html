    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 水中銀</nav></header><main><article><h1>水中銀</h1><p>坎宮真知陷溺欲海，如銀在水中，絕無僅有，必待真知攝之</p><p>水中銀者，水中所藏之金也。銀為金類，即坎宮天一之水所藏之真知。在先天為本性之良知，在後天為道心之真知。因其真知至剛至健，喻之曰真鉛，又曰真種。因落後天，客氣用事，正氣退位，陽陷陰中，真為假蔽，沉溺欲海，良知有昧，如水中之銀，絕無而僅有矣。必得道心真知制之，方能凝結。</p><p><strong>所出</strong>：《悟真直指 · 卷一》 — https://zh.wikisource.org/wiki/悟真直指/卷一</p></article></main></div></div>
