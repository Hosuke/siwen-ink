    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 吳敗於囿</nav></header><main><article><h1>吳敗於囿</h1><p>越敗吳師於囿也。</p><p>句踐既誓其眾，國人皆勸，果行而敗吳。越師連三敗吳：先敗於囿，再敗於沒，又郊敗之。吳師屢北，國勢遂傾，終至於亡。</p><p><strong>所出</strong>：《國語 · 卷20》 — https://zh.wikisource.org/wiki/國語/卷20</p></article></main></div></div>
