    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 不言而化</nav></header><main><article><h1>不言而化</h1><p>聖人脩德天下，不言不教而民自化。</p><p>人主脩德於天下，不言而化，不教而治，下之應上，信如影響。夫以身率物，則四方風動；不言而令行，則德溥而無私。</p><p><strong>所出</strong>：《老子河上公章句 · 修觀》 — https://zh.wikisource.org/wiki/老子河上公章句/德觀</p></article></main></div></div>
