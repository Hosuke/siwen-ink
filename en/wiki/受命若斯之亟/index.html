    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 受命若斯之亟</nav></header><main><article><h1>受命若斯之亟</h1><p>天命之改，五年而成，前古未有。</p><p>太史公讀秦楚之際，嘆曰：「自生民以來，未始有受命若斯之亟也。」比較虞夏之興，積善累功數十年；湯、武之王，修仁行義十餘世；秦並六國，百有餘載。皆累世而後成。獨秦楚之際，五年而天下易主，其速蓋前所未有。</p><p><strong>所出</strong>：《史記 · 卷016》 — https://zh.wikisource.org/wiki/史記/卷016</p></article></main></div></div>
