    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 羊牛下括</nav></header><main><article><h1>羊牛下括</h1><p>暮時羊牛群下而合，以比君子之未得合。</p><p>「日之夕矣，羊牛下括。」括，會聚也。羊牛下括，猶言下山而群聚也。物之會合有時，而君子役久不返，是不如羊牛之有群聚之樂也。是以大夫望其速歸，而歎佸之無期。</p><p><strong>所出</strong>：《詩經 · 君子于役》 — https://zh.wikisource.org/wiki/詩經/君子于役</p></article></main></div></div>
