    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 歸妹愆期，遲歸有時</nav></header><main><article><h1>歸妹愆期，遲歸有時</h1><p>婚期愆誤，遲久而歸，待時而行，志有所待也。</p><p>九四：「歸妹愆期，遲歸有時。」愆，過也。婚期既愆，遲遲有待，非失時也。愆期之志，有待而行也。蓋賢女待禮而行，不苟合耳。</p><p><strong>所出</strong>：《周易 · 歸妹》 — https://zh.wikisource.org/wiki/周易/歸妹</p></article></main></div></div>
