    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 授受之盟</nav></header><main><article><h1>授受之盟</h1><p>授者為師，受者立盟，以雲錦鳳羅金鈕代割髮肌膚之誓。</p><p>授受之盟者，師徒授受秘道之盟誓也。經云「授者曰師受者盟，雲錦鳳羅金鈕纏，以代割髮肌膚全」，言古之傳道，必以盟誓為信，斷髮流血，以見至誠；今之傳授，則以雲錦鳳羅金鈕為信物代替之，表師弟相承，秘道不失也。其法先謁太帝，誦黃庭內經玉書，然後盟誓定矣。</p><p><strong>所出</strong>：《黃庭內景經 · 沐浴章第三十六》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/沐浴章第三十六</p></article></main></div></div>
