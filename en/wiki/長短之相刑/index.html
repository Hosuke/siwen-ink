    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 長短之相形</nav></header><main><article><h1>長短之相形</h1><p>明長短相形、高下相盈、聲音相和、先後相隨，皆對待而立。</p><p>長短之相刑也，高下之相盈也，意聲之相和也，先後之相隋恆也。</p><p>長以短為準，無短則長不成；高以下為基，無下則高不見；意以聲達，聲以意和；先以後為繼，後以先為導。凡此皆相待而立、相須而成，不可偏廢也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章二》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
