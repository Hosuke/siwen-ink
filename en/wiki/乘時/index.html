    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 乘時</nav></header><main><article><h1>乘時</h1><p>萬乘之國不可以無萬金之蓄，以此與令進退。</p><p>管子以為，物有豫則君失筴而民失生，故善為天下者操於二豫之外。萬乘之國不可以無萬金之蓄飾，千乘之國不可以無千金之蓄飾，百乘之國不可以無百金之蓄飾。以此與令進退，此之謂乘時。蓄之者非苟藏也，待時而發，輕重迭用，霸王之術在焉。</p><p><strong>所出</strong>：《管子 · 第75篇山權數》 — https://zh.wikisource.org/wiki/管子/第75篇山權數</p></article></main></div></div>
