    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 棘心夭夭</nav></header><main><article><h1>棘心夭夭</h1><p>棘木初生，嫩弱夭夭，以喻人子幼稚之年。</p><p>「凱風自南，吹彼棘心，棘心夭夭，母氏劬勞。」</p><p>棘心者，酸棗樹之幼苗也。夭夭者，嫩壯之貌。棘心初萌，需和風吹拂乃得滋長，以喻人子幼稚之時，全賴慈母鞠育之功。母氏劬勞，言其勤苦不懈也。</p><p>「棘心」與「棘薪」相對，初為嫩苗，終為可薪，見歲月推移、子漸長成，而母之劬勞始終不替。</p><p><strong>所出</strong>：《詩經 · 凱風》 — https://zh.wikisource.org/wiki/詩經/凱風</p></article></main></div></div>
