    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 師術有四</nav></header><main><article><h1>師術有四</h1><p>尊嚴、耆艾、誦說、知微，此四者為師之術，博習不與焉。</p><p>師術有四，而博習不與焉：尊嚴而憚，可以為師；耆艾而信，可以為師；誦說而不陵不犯，可以為師；知微而論，可以為師。故師術有四，而博習不與焉。水深而回，樹落則糞本，弟子通利則思師。[[學莫便乎近其人]]、 [[尊師]]，此之謂也。</p><p><strong>所出</strong>：《荀子 · 致士篇》 — https://zh.wikisource.org/wiki/荀子/致士篇</p></article></main></div></div>
