    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 李元基</nav></header><main><article><h1>李元基</h1><p>唐初隱葛山，符藥救人，後跨鹿仙去。</p><p>李元基，唐高祖武德初人。隱葛山中，有道術，能坐在立亡，人莫測之。時時經行，以符藥救人。探虎骨、針鵲影、活魚鼈甚众。每晝出，逢夜則止，露宿草野中。</p><p>代宗末，在建昌縣中插松柏滿身，飛去。</p><p>後有人採藥葛山，見元基跨青鹿行若飛，問之不應，莫知所在焉。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 31》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/31</p></article></main></div></div>
