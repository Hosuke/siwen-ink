    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 宴盻劫年</nav></header><main><article><h1>宴盻劫年</h1><p>天庭宴樂，歷劫而存</p><p>宴盻劫年，大洞祝詞所言天真宴會之象也。</p><p>高上玉清王祝云「九天之中，宴盻劫年」，言兆存思天真，九天之上，天真相聚宴樂，億劫不移，歷劫而存。</p><p><strong>所出</strong>：《上清大洞真經 · 22章》 — https://zh.wikisource.org/wiki/上清大洞真經/22章</p></article></main></div></div>
