    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 伯樂教所憎者相千里馬</nav></header><main><article><h1>伯樂教所憎者相千里馬</h1><p>利緩者人忽，利急者人爭；遠利難見，近利易惑。</p><p>伯樂教其所憎者相千里之馬，教其所愛者相駑馬。千里之馬時一，其利緩；駑馬日售，其利急。此《周書》所謂「下言而上用者，惑也。」</p><p><strong>所出</strong>：《韓非子 · 說林下》 — https://zh.wikisource.org/wiki/韓非子/說林下</p></article></main></div></div>
