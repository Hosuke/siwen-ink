    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 高祖過沛詩三侯之章</nav></header><main><article><h1>高祖過沛詩三侯之章</h1><p>高祖過沛作三侯之章，令小兒歌之，崩後令沛得四時歌舞宗廟。</p><p>高祖過沛詩三侯之章，令小兒歌之。高祖崩，令沛得以四時歌舞宗廟。孝惠、孝文、孝景無所增更，於樂府習常肄舊而已。</p><p><strong>所出</strong>：《史記 · 卷024》 — https://zh.wikisource.org/wiki/史記/卷024</p></article></main></div></div>
