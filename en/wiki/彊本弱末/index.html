    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 彊本弱末</nav></header><main><article><h1>彊本弱末</h1><p>強固根本，削弱枝葉。徙民實京師，以防諸侯之變。</p><p>婁敬自匈奴來，因言徙民之事，曰：「山東雖亂，秦之故地可全而有。」「今陛下雖都關中，實少人。北近胡寇，東有六國之族，宗彊，一日有變，陛下亦未得高枕而臥也。臣願陛下徙齊諸田，楚昭、屈、景，燕、趙、韓、魏後，及豪桀名家居關中。無事，可以備胡；諸侯有變，亦足率以東伐。此彊本弱末之術也。」本者，京師也；末者，諸侯也。言京師人多則勢強，諸侯族散則易制，此漢初制馭諸侯之要術也。</p><p><strong>所出</strong>：《史記 · 卷099》 — https://zh.wikisource.org/wiki/史記/卷099</p></article></main></div></div>
