    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 微妙玄通</nav></header><main><article><h1>微妙玄通</h1><p>王弼稱古之善為士者「微妙玄通，深不可識」，言其與道為一，智巧莫測。</p><p>王弼注《老子》十五章，解「古之善為士者」曰：「善為士者，微妙玄通。」又云：「夫唯不可識，故強為之容。」蓋古之體道者，其德行微妙，其玄鑒通達，深不可測，智巧莫及。唯其不可識，故聖人強為之形容，曰「豫焉」「猶兮」「儼兮」「渙兮」「敦兮」「曠兮」「混兮」，以見其動容周旋之妙、存養省察之功。然此皆不得已而強名，實則與道為一，不可得而名言也。</p><p><strong>所出</strong>：《道德經 (王弼本)》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
