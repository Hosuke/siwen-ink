    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 水俞五十七穴</nav></header><main><article><h1>水俞五十七穴</h1><p>水俞五十七穴，積陰之所聚，水所從出入，分尻上、伏菟、踝上三部。</p><p>水俞五十七穴者，治水之腧穴凡五十七處也。</p><p>歧伯云：「腎俞五十七穴，積陰之所聚也，水所從出入也。」其分布有三：尻上五行行五者，此腎俞；伏菟上各二行行五者，此腎之街也，三陰之所交結於腳也；踝上各一行行六者，此腎脈之下行也，名曰大衝。凡五十七穴者，皆藏之陰絡，水之所客也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第十六卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十六卷</p></article></main></div></div>
