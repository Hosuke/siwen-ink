    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 毀譽置之不聞</nav></header><main><article><h1>毀譽置之不聞</h1><p></p><p>洪言：「世人多慕豫親之好，推暗室之密，洪以為知人甚未易，上聖之所難。浮雜之交，口合神離，無益有損。」又言：「馳逐苟達側立勢門者，共疾洪之異於己，而見疵毀。洪之為人，信心而行，毀譽皆置於不聞。」</p><p>  <strong>所出</strong>：《抱朴子 · 卷52》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷52</p></article></main></div></div>
