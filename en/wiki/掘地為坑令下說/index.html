    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 掘地為坑，令下說</nav></header><main><article><h1>掘地為坑，令下說</h1><p>《論衡》載鬼谷先生以坑穴試蘇秦、張儀之說術。</p><p>《論衡》引蘇秦、張儀從橫習之鬼谷先生，「掘地為坑，曰：『下說令我泣出，則耐分人君之地。』蘇秦下說，鬼谷先生泣下沾襟。」又《明雩篇》亦云「蘇秦、張儀悲說坑中，鬼谷先生泣下沾襟」。此事見載於《[[論衡]]》，言鬼谷先生以坑穴試二子之說，能否動人之心、感人以泣為斷也。</p><p><strong>所出</strong>：《鬼谷子 · 鬼谷子附録》 — https://zh.wikisource.org/wiki/鬼谷子/鬼谷子附録</p></article></main></div></div>
