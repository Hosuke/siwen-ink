    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 孝、敬、忠、貞</nav></header><main><article><h1>孝、敬、忠、貞</h1><p>孝敬忠貞，乃君父所安，為人臣子之本。</p><p>太子申生曰：「吾聞之羊舌大夫，曰：『事君以敬，事父以孝。』受命不遷為敬，敬順所安為孝。棄命不敬，作令不孝，又何圖焉？且夫間父之愛而嘉其貺，有不忠焉；廢人以自成，有不貞焉。孝、敬、忠、貞，君父之所安也。棄安而圖，遠於孝矣，吾其止也。」</p><p><strong>所出</strong>：《國語 · 卷07》 — https://zh.wikisource.org/wiki/國語/卷07</p></article></main></div></div>
