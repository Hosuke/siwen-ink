    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 士無賢不肖皆謙而禮交之</nav></header><main><article><h1>士無賢不肖皆謙而禮交之</h1><p>信陵君待士不分賢愚，皆謙遜以禮相交。</p><p>公子為人仁而下士，士無賢不肖皆謙而禮交之，不敢以其富貴驕士。士以此方數千里爭往歸之，致食客三千人。當是時，諸侯以公子賢，多客，不敢加兵謀魏十餘年。</p><p><strong>所出</strong>：《史記 · 卷077》 — https://zh.wikisource.org/wiki/史記/卷077</p></article></main></div></div>
