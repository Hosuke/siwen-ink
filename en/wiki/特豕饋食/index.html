    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 特豕饋食</nav></header><main><article><h1>特豕饋食</h1><p>以一豕為饋食之主牲，行士虞祭也。</p><p>特豕饋食者，以一特之豕為牲主，以饋死者之食也。士虞禮開篇云：「特豕饋食，側亨於廟門外之右，東面。」側亨者，別煮於廟門外，不與常烹同也。魚臘爨亞之，饎爨在西壁，設洗於西階西南，水在洗西，尊於室中北墉下。陳牲行祭，皆以特豕為饋食之主。</p><p><strong>所出</strong>：《儀禮 · 士虞禮》 — https://zh.wikisource.org/wiki/儀禮/士虞禮</p></article></main></div></div>
