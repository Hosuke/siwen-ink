    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 角枕粲兮</nav></header><main><article><h1>角枕粲兮</h1><p>斂時之枕，色澤粲然，而人已亡。</p><p>角枕粲兮，錦衾爛兮。</p><p>角枕，以獸角飾枕，或以為方角之制；粲，燦也。錦衾，錦繡之被；爛，光盛也。皆斂時所用之具。詩人見物色之美如是，而所用之人已亡，言念及此，倍增悲感。此詩之所以能不怨不怒而自深者也。</p><p><strong>所出</strong>：《詩經 · 葛生》 — https://zh.wikisource.org/wiki/詩經/葛生</p></article></main></div></div>
