    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 遊刃有餘</nav></header><main><article><h1>遊刃有餘</h1><p>刀刃薄而入有間，喻辦事從容裕如也</p><p>庖丁之刀十九年，解牛數千，而刀刃若新發於硎。彼節者有間，而刀刃者无厚，以无厚入有間，恢恢乎其於遊刃必有餘地矣。夫以有涯之生，隨无涯之知，殆已；唯順其自然之理，如庖丁之遊刃於骨節之間，乃得保身全生，不傷於物。蓋虛實相待，則无厚之刃可入有間；虛己順理，則无為之功自有餘地。此「遊刃有餘」之旨，所以為養生之要也。</p><p><strong>所出</strong>：《莊子 · 養生主》 — https://zh.wikisource.org/wiki/莊子/養生主</p></article></main></div></div>
