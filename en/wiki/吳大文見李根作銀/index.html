    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 吳大文見李根作銀</nav></header><main><article><h1>吳大文見李根作銀</h1><p>成都內史吳大文親見道士李根煎鉛錫成銀，雖得其方，終未能成。</p><p>成都內史吳大文，博達多知，亦自說昔事道士李根。見根煎鉛錫，以少許藥如大豆者投鼎中，以鐵匙攪之，冷即成銀。</p><p>大文得其秘方，但欲自作，百日齋便為之，而留連在官，竟不能得。恒歎息言，人閒不足處也。</p><p><strong>所出</strong>：《抱朴子 · 卷16》 — https://zh.wikisource.org/wiki/抱朴子/卷16</p></article></main></div></div>
