    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 致天之罰</nav></header><main><article><h1>致天之罰</h1><p>湯以伐夏為奉行天命之罰，非私怨也。</p><p>王曰：「爾尚輔予一人，致天之罰，予其大賚汝。」</p><p>湯之伐夏，非逞一己之私怒也。天命殛夏，予畏上帝，不敢不正。致天之罰者，奉天道以誅有罪，類後世所謂「奉天討罪」者也。夫王者之師，以有道伐無道，必稱天命以臨之，示其師出有名，非暴虐嗜殺之比也。</p><p><strong>所出</strong>：《尚書 · 湯誓》 — https://zh.wikisource.org/wiki/尚書/湯誓</p></article></main></div></div>
