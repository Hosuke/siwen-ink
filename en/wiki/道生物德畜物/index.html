    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 道生物德畜物</nav></header><main><article><h1>道生物德畜物</h1><p>道生之，德畜之，物形之，勢成之，萬物莫不尊道而貴德。</p><p>道之所以生物，德之所以畜物。物之所以形，勢之所以成。形者，質之著；成者，用之畢也。是以萬物之生，莫不尊道而貴德。</p><p>道之尊，德之貴，非有待於命令也。萬物自從其性，莫之使然而然，故曰「常自然」。</p><p>生而不有者，道之玄德也。為而不恃者，功成而不居也。長而不宰者，引萬物而不為主也。合而言之，是謂玄德。</p><p><strong>所出</strong>：《老子河上公章句 · 養德》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
