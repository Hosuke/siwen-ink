    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 百花橋</nav></header><main><article><h1>百花橋</h1><p>南溟夫人所居之虹橋，龍虯交結，橫亙海面，通於孤島。</p><p>南溟夫人所居海島，有紫雲湧於海面，彌漫三四里，中有大蓮華高百餘尺，葉葉旋舒，內有帳幄綺麗。虹橋闊數十尺，直抵島上，欄干上皆異花。二子登橋而行，見千虯萬龍互相繳結而為橋矣。夫人在橋上帳幄中接引二客，命侍女示以歸路，曰：「從百花橋去。」遂辭夫人，登橋而去。橋長且廣，欄干上皆異花，二子花間窺之，見千虯萬龍互相繳結而為橋。</p><p><strong>所出</strong>：《墉城集仙錄 · 卷08》 — https://zh.wikisource.org/wiki/墉城集仙錄/卷08</p></article></main></div></div>
