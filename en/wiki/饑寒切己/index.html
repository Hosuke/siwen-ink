    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 饑寒切己</nav></header><main><article><h1>饑寒切己</h1><p>饑寒者雖有向學之心，然出無從師之資，家有暮旦之急，學業闕如，情有可恕。</p><p>亦有饑寒切己，藜藿不給，膚困風霜，口乏糟糠，出無從師之資，家有暮旦之急，釋耒則農事廢，執卷則供奉虧者，雖闕學業，可怒者也。</p><p><strong>所出</strong>：《抱朴子 · 卷04》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷04</p></article></main></div></div>
