    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 運籌帷幄</nav></header><main><article><h1>運籌帷幄</h1><p>高帝稱張良運籌帷幄之中，決勝千里之外。</p><p>漢六年上已封大功臣二十餘人，高帝論功曰：「運籌策帷帳中，決意詳盡，朕不如子房。」乃封良為留侯，與蕭何等俱封。</p><p>[[運籌帷幄]]四字，遂為千古論將相智謀之典。人但知沙場之上奪城池者為功臣，不知帷帳之中運籌策者，其功尤不可忽也。</p><p><strong>所出</strong>：《史記 · 卷055》 — https://zh.wikisource.org/wiki/史記/卷055</p></article></main></div></div>
