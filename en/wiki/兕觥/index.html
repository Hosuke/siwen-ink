    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 兕觥</nav></header><main><article><h1>兕觥</h1><p>犀角所制之酒器。</p><p>兕觥，酒器也，以犀牛之角為之，故名。兕，犀也，音四；觥，角杯，音公。《卷耳》云「我姑酌彼兕觥」，與上文酌金罍相應，酒器漸小，而愁思益深，故下文云「維以永傷」也。</p><p><strong>所出</strong>：《詩經 · 卷耳》 — https://zh.wikisource.org/wiki/詩經/卷耳</p></article></main></div></div>
