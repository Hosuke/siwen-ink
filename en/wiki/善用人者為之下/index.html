    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 善用人者為之下</nav></header><main><article><h1>善用人者為之下</h1><p>善用賢者必自居人下。</p><p>善用人者為之下。用賢而先下之，此[[用人如用草木]]之意而益進之。下之者，謙以待之，降己以接之也。河上公云：能用人者，是乃謙下。不自矜伐，故人樂為之用。觀[[士無賢不肖皆謙而禮交之]]，正與此相發。明主居尊位而能用卑詞，人臣是以竭忠効力而不懈。</p><p><strong>所出</strong>：《老子河上公章句 · 配天》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
