    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 神思</nav></header><main><article><h1>神思</h1><p>為文之先，心遊萬仞，神接物象，乃創作之樞機。</p><p>古人云「形在江海之上，心存魏闕之下」，此之謂也。劉勰假古語以明神思之義：形骸滯於江海，心神則馳於魏闕之朝，二者判然分途，而文人得以超然遠舉。故為文之時，思接千載，視通萬里，吟詠而珠玉之聲自出，眉睫而風雲之色斯在。神思者，馭文之首術，謀篇之大端也。</p><p><strong>所出</strong>：《文心雕龍 · 神思》 — https://zh.wikisource.org/wiki/文心雕龍/神思</p></article></main></div></div>
