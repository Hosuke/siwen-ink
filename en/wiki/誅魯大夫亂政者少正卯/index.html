    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 誅少正卯</nav></header><main><article><h1>誅少正卯</h1><p>孔子為魯司寇時誅殺少正卯。</p><p>於是誅魯大夫亂政者少正卯。與聞國政三月，粥羔豚者弗飾賈；男女行者別於塗；塗不拾遺；四方之客至乎邑者不求有司，皆予之以歸。此孔子為魯司寇行攝相事時誅少正卯之事也。</p><p><strong>所出</strong>：《史記 · 卷047》 — https://zh.wikisource.org/wiki/史記/卷047</p></article></main></div></div>
