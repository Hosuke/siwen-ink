    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 宿對之殃</nav></header><main><article><h1>宿對之殃</h1><p>前世冤親債主之殃咎，解之則魂神脫苦者也。</p><p>宿對之殃者，前世冤親債主之殃咎也。《上清大洞真經》三十三章云「宿對之殃魂解結」，修真者奉胞中黃炁君，則七世祖靈反胎，宿對之殃皆得解脫，而魂神無累矣。</p><p>此以存思黃炁君守護二孔、伐滅胞根為法，則殃咎散而魂魄清，九玄之祖皆得超昇也。</p><p><strong>所出</strong>：《上清大洞真經 · 33章》 — https://zh.wikisource.org/wiki/上清大洞真經/33章</p></article></main></div></div>
