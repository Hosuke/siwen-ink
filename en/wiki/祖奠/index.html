    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 祖奠</nav></header><main><article><h1>祖奠</h1><p>柩車將行，先設奠于祖廟。</p><p>祖奠者，行道之奠也。車東面北上，設祖奠。奠者升自阼階，執俎西面。祝與執事俎從。祝受巾，巾之，降自西階。祝闔牖。先由楹西，降自阼階，巾俎。如有事。</p><p>若大夫以上，奠於庭；若士，奠於戶外。奠者北面。祝受巾，巾之，由足降自阼階，主人拜送。</p><p><strong>所出</strong>：《儀禮 · 士喪禮》 — https://zh.wikisource.org/wiki/儀禮/士喪禮</p></article></main></div></div>
