    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 啓亓兌濟亓事</nav></header><main><article><h1>啓亓兌濟亓事</h1><p>開塞有時，終事無害</p><p>「啓亓兌，濟亓事，終身不逎。」言聖人之心，[塞亓兌閉亓門]者常也，及乎應物之時，則開其兌以納善言，濟其事以成萬務，而終身不入於困躓。此與[[塞亓兌閉亓門]]對言：塞閉以守其內，開濟以應其外；外內兼備，終身不殆不逎。帛書「逎」字義同「災」，言無災害也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第十五章 守母》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
