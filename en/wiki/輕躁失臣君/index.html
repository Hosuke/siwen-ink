    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 輕躁失臣君</nav></header><main><article><h1>輕躁失臣君</h1><p>輕則失臣，躁則失君；輕躁之害，為身國之大患。</p><p>輕則失臣，躁則失君。輕者不以身任天下，則臣無所稟而散去；躁者不以靜制心，則君無所守而傾覆。輕與躁，一事而二患也。輕則形馳，躁則神散；形馳則下慢，神散則上忽。此[[重為輕根]][[靜為躁君]]之反也。聖人戒此二患者，欲人君以重自持，以靜自守，則臣安其位，君保其尊，而天下定矣。</p><p><strong>所出</strong>：《老子河上公章句 · 重德》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
