    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 柔得中而上行</nav></header><main><article><h1>柔得中而上行</h1><p>柔者得中道以進，雖位未盡當，猶利於施刑</p><p>噬嗑之彖辭，論柔之德曰「柔得中而上行，雖不當位，利用獄也」。</p><p>柔者，陰柔之德，於刑罰為寬、為慎、為仁。然柔而能得中，不偏於縱、不偏於酷，則雖其位或有不當，猶足以行刑罰之事故能利用者也。蓋刑罰之道，剛猛固不可廢，而寬仁亦不可闕，柔得中則寬而不縱、慎而不懈，故利用獄以成治功。位不當者，柔者本非剛，然以得中故能用刑，亦聖人之微旨也。</p><p><strong>所出</strong>：《周易 · 噬嗑》 — https://zh.wikisource.org/wiki/周易/噬嗑</p></article></main></div></div>
