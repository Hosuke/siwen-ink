    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 安則智廉生，危則爭鄙起</nav></header><main><article><h1>安則智廉生，危則爭鄙起</h1><p>國家安定則廉恥生，危亂則爭奪起。</p><p>治世使人樂生於為是，愛身於為非，小人少而君子多；及其危也，則爭鄙起而廉恥亡。[[號令者國之舟車]]，承之則安，覆之則危。[[先王寄理於竹帛]]，以法度正之，則[[賞罰隨是非]]而民俗正，[[死生隨法度]]而姦邪息。此[[安術有七]]所以為治，而[[危道有六]]所以速亡也。</p><p><strong>所出</strong>：《韓非子 · 安危》 — https://zh.wikisource.org/wiki/韓非子/安危</p></article></main></div></div>
