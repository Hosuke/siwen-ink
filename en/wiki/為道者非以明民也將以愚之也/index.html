    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 為道者非以明民也將以愚之也</nav></header><main><article><h1>為道者非以明民也將以愚之也</h1><p>治者不以智巧明示於民，而以質樸渾厚化之。</p><p>治國者不可以智巧明示於民，當以質樸渾厚化之。民之難治，以其智多也。故為道者去甚、去奢、去泰，不以聰明機變啟民，而返其天真，使民復於素樸。此聖人無為之治，所以成大順之功也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第二十八章 玄德》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
