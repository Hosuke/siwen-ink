    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 遯之時義大矣哉</nav></header><main><article><h1>遯之時義大矣哉</h1><p>退避之時機義理至為重大</p><p>《彖》曰：「遯亨，遯而亨也。剛當位而應，與時行也。小利貞，浸而長也。遯之時義大矣哉！」</p><p>夫遯者，見幾而作、知時而退之謂也。時當小人浸長、君子不可得位，則退藏以守正，乃其自然之理。其義不在消極避世，乃所以全其道、蓄其德，待時而動也。《易》以「時義」許之，見聖人貴時之學。</p><p><strong>所出</strong>：《周易 · 遯》 — https://zh.wikisource.org/wiki/周易/遯</p></article></main></div></div>
