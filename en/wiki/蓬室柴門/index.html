    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 蓬室柴門</nav></header><main><article><h1>蓬室柴門</h1><p>居室之陋，以比賢者之在下位。</p><p>《緜蠻》卒章云「蓬室柴門」。蓬室，以蓬草覆之室；柴門，以木枝編之門。言賢者所居之陋也。《[[山有榛]]》云「其室則邇，其人甚遠」，皆以居室言賢者之高蹈。然此詩以蓬柴比臣下之棲遲，非自嘲也，乃見君子不以居陋而廢事上之義。</p><p><strong>所出</strong>：《詩經 · 緜蠻》 — https://zh.wikisource.org/wiki/詩經/緜蠻</p></article></main></div></div>
