    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 雕琢其章彬彬君子</nav></header><main><article><h1>雕琢其章彬彬君子</h1><p>文能雕琢其章而情采兼備，乃為彬彬君子。彬彬者，文質相半之謂也。</p><p>能使文不滅質，博不溺心，正采耀乎朱藍，間色屏於紅紫，乃可謂雕琢其章，彬彬君子矣。彬彬者，文質相半，華實相稱之謂也。設以位理，擬地置心，心定而後結音，理正而後摛藻，五采搭配，各得其宜，則文章之美，粲然可觀，而無浮濫繁冗之失。斯非徒事雕琢之功，亦性情端正之所成也。</p><p><strong>所出</strong>：《文心雕龍 · 情采》 — https://zh.wikisource.org/wiki/文心雕龍/情采</p></article></main></div></div>
