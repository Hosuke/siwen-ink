    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 華藻張磔迂闊無益之辭</nav></header><main><article><h1>華藻張磔迂闊無益之辭</h1><p>言著述若徒飾華藻而無益於事，終與空言同</p><p>抱朴子言立言之弊曰：今之作者，好設[[雕虎畫龍]]之文，馳騁[[堅白無厚]]之辯，雖[[立解連環]]、離同合異，然皆無益之事。其言若「鳥影不動」「雞卵有足」「犬可為羊」，徒以誑俗而已。譬如[[畫敖倉以救饑]]，仰天漢以解渴，終不能飽人而止渴也。</p><p><strong>所出</strong>：《抱朴子 · 卷42》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷42</p></article></main></div></div>
