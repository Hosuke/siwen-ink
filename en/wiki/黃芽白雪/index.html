    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 黃芽白雪</nav></header><main><article><h1>黃芽白雪</h1><p>黃芽白雪，乃丹成之象，非世間之藥草。</p><p>[[悟真篇]]云：「黃芽白雪不難尋，達者須憑德行深。四象五行全藉土，三元八卦豈離壬。鍊成靈質人難識，消盡陰魔鬼莫侵。」黃芽白雪，乃丹道隱語，以喻藥物變化之象，非外物也。達者修德以合天心，陰魔消滅，丹成自然。</p><p><strong>所出</strong>：《悟真篇》 — https://zh.wikisource.org/wiki/悟真篇</p></article></main></div></div>
