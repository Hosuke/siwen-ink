    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 葛無遜</nav></header><main><article><h1>葛無遜</h1><p>斥郭林宗隱不修遁、出不益時，欲揚名養譽，與遊俠原涉相類。</p><p>葛無遜，字無遜，太傅之胄也。論郭林宗之失曰：「林宗隱不修遁，出不益時，實欲揚名養譽而已。街談巷議以為辯，訕上謗政以為高，時俗貴之，歙然猶郭解、原涉，見趨於曩時也。」又云後進慕聲者，未能考之聖王之典，論之於先賢之行，徒惑華名，鹹競準的，皆是類也。其言切中林宗之病，以為虛名過實，非真隱君子明矣。</p><p><strong>所出</strong>：《抱朴子 · 卷46》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷46</p></article></main></div></div>
