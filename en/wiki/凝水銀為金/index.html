    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 凝水銀為金</nav></header><main><article><h1>凝水銀為金</h1><p>丹沙可為金，河車可作銀，立則可成，成則為真。</p><p>銅柱經曰：「丹沙可為金，河車可作銀，立則可成，成則為真，子得其道，可以仙身。」</p><p>黃山子曰：「天地有金，我能作之，二黃一赤，立成不疑。」</p><p>龜甲文曰：「我命在我不在天，還丹成金億萬年。」</p><p>古人豈欺我哉？但患知此道者多貧，而藥或至賤而生遠方，非亂世所得也。</p><p><strong>所出</strong>：《抱朴子 · 卷16》 — https://zh.wikisource.org/wiki/抱朴子/卷16</p></article></main></div></div>
