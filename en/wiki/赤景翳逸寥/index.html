    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 赤景翳逸寥</nav></header><main><article><h1>赤景翳逸寥</h1><p>月中夫人之名，赤景所覆，神光所宅也。</p><p>赤景翳逸寥，月中有夫人名也。經云「赤景翳逸寥月中夫人」，居月宮而司光明。行道者存思之，可招玉光、上昇南仙焉。</p><p><strong>所出</strong>：《上清大洞真經 · 19章》 — https://zh.wikisource.org/wiki/上清大洞真經/19章</p></article></main></div></div>
