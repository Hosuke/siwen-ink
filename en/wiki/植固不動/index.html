    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 植固不動</nav></header><main><article><h1>植固不動</h1><p>心正意誠，則奇邪自息。</p><p>明君不爲六者變更號令，不爲六者疑錯斧鉞，不爲六者益損祿賞。故曰：「植固而不動，奇邪乃恐。奇革邪化，令往民移。」</p><p>植者，心也。天植正，則不私近親，不孽疏遠。不私近親，不孽疏遠，則無遺利，無隱治。</p><p>欲見天心，明以風雨。風雨無違，遠近高下各得其嗣。夫數困難成之事，而時失不可及之功，衰耗之道也。</p><p>明君審察事理，慎觀終始，爲必知其所成，成必知其所用，用必知其所利害。</p><p><strong>所出</strong>：《管子 · 第66篇版法解》 — https://zh.wikisource.org/wiki/管子/第66篇版法解</p></article></main></div></div>
