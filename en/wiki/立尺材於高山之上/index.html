    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 立尺材於高山之上</nav></header><main><article><h1>立尺材於高山之上</h1><p>材不高，位高則能臨深。</p><p>夫有材而無勢，雖賢不能制不肖。故立尺材於高山之上，則臨千仞之谿，材非長也，位高也。桀為天子，能制天下，非賢也，勢重也；堯為匹夫，不能正三家，非不肖也，位卑也。</p><p><strong>所出</strong>：《韓非子 · 功名》 — https://zh.wikisource.org/wiki/韓非子/功名</p></article></main></div></div>
