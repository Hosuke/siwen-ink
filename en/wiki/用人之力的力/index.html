    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 用人之力</nav></header><main><article><h1>用人之力</h1><p>能下人者，斯能用人之力。</p><p>是謂用人之力。河上公注：能謙下人者，人亦報以盡力。[[善用人者為之下]]，斯不爭之德所臻也。用人之力，非用力迫人而制之，乃以德感之、以禮接之，使賢才樂為己用。聖人無為而天下治，以其善用人之力，不獨任智也。與[[上士無爭]]義相足。</p><p><strong>所出</strong>：《老子河上公章句 · 配天》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
