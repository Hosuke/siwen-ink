    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 威強</nav></header><main><article><h1>威強</h1><p>姦臣聚俠客死士，示威以劫制羣臣百姓，挾主以行私。</p><p>君人者，以羣臣百姓爲威強者。羣臣百姓之所善，則君善之；非其所善，則君不善之。姦臣聚帶劒之客，養必死之士，以彰其威，明爲己者必利，不爲己者必死，以恐其羣臣百姓而行其私，此之謂「威強」。</p><p><strong>所出</strong>：《韓非子 · 八姦》 — https://zh.wikisource.org/wiki/韓非子/八姦</p></article></main></div></div>
