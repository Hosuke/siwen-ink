    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 如履薄冰</nav></header><main><article><h1>如履薄冰</h1><p>本文說明《詩經·小宛》中「如履薄冰」的由來，強調此喻警示人在危險環境中必須保持高度</p><p>戰戰兢兢、如履薄冰，皆戒懼之至也。《小宛》以溫溫恭人起興，而極言之為「如集于木」「如臨于谷」「如履薄冰」，喻人身處危境，當戰栗以對，不敢有毫髮之忽。此三者皆以危象設喻，而履冰之戒尤切。蓋冰薄則陷，人處危疑之地尤當戒慎也。</p><p>  <strong>所出</strong>：《詩經 · 小宛》 — https://zh.wikisource.org/wiki/詩經/小宛</p></article></main></div></div>
