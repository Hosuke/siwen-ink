    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 聞善相告見善相示</nav></header><main><article><h1>聞善相告見善相示</h1><p>儒者聞善必相告，見善必相示，患難相死，久相待也。</p><p>儒皆聞善以相告也，見善以相示也；爵位相先也，患難相死也；久相待也，遠相致也。</p><p>此述儒者朋友之道。善者，己之所貴也，告之示之，不敢私有；爵位之利，讓之先之，不相攘奪；患難之際，死之守之，不相背棄；久而未見，則相待以須；遠而相隔，則相致以同。此皆以義合，非以利交者也。</p><p><strong>所出</strong>：《禮記 · 儒行》 — https://zh.wikisource.org/wiki/禮記/儒行</p></article></main></div></div>
