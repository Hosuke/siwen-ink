    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 呂種坐呂氏事誅</nav></header><main><article><h1>呂種坐呂氏事誅</h1><p>呂后昆弟子封侯者，皆以呂氏事敗而誅。</p><p>高后時封呂氏昆弟子為侯者，有[[呂成]]侯呂忿、[[贅其侯]]呂勝、[[東平侯]]呂莊之屬，皆以呂后昆弟子得封。及呂后崩，諸呂用事敗，[[呂種]]坐呂氏事誅，[[沛侯]]呂種亦坐誅，[[俞侯]]呂它、[[滕侯]]呂更始皆坐呂氏事誅。[[錘侯]]呂通為燕王，坐呂氏事國除。蓋宗族連坐，一時盡滅云。</p><p><strong>所出</strong>：《史記 · 惠景閒矦者年表》 — https://zh.wikisource.org/wiki/史記/惠景閒矦者年表</p></article></main></div></div>
