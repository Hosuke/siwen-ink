    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 聖人託可好</nav></header><main><article><h1>聖人託可好</h1><p>聖人託可好以來美名，託可惡以却譽；愛且不能爲我能，況於外物乎。</p><p>管子言：「聖人得利而託焉，故民重而名遂，我亦託焉。聖人託可好，我託可惡。我託可惡以來美名，又可得乎？愛且不能爲我能也。」聖人與凡人同理，而能審其名實。毛嬙、西施，美也，然盛怨氣於面，則不可爲可好。己之不善，雖託美名，終不可得也。</p><p><strong>所出</strong>：《管子 · 第32篇小稱》 — https://zh.wikisource.org/wiki/管子/第32篇小稱</p></article></main></div></div>
