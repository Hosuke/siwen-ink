    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 委時去害</nav></header><main><article><h1>委時去害</h1><p>依託邱山，委時以去病害，乃長生之初階。</p><p>經云：「委時去害，依托邱山。」</p><p>委時者，委身於時、順時而行也。去害者，去病害、絕物累也。依託邱山者，隱居山林、遠離囂塵也。</p><p>伯陽自稱「會稽鄙夫，幽谷朽生，棲遲僻陋」，正委時去害之實。世人所以有病害者，以其逐物喪己、累於利名。委時去害，則物累既遣，病害自除，依托邱山則囂塵不染。此長生之初階，與抱一毋舍相終始。</p><p><strong>所出</strong>：《周易參同契 · 35章》 — https://zh.wikisource.org/wiki/周易參同契/35章</p></article></main></div></div>
