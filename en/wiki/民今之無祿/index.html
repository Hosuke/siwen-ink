    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 民今之無祿</nav></header><main><article><h1>民今之無祿</h1><p>民今失其所恃也。</p><p>《正月》云：「佌佌彼有屋，蔌蔌方有穀。民今之無祿，天夭是椓。」祿者，福也，亦俸也。民之所以為民，以有土地以居，有粟帛以食，今皆無之，是無祿也。詩人以此見百姓之困悴，而歸咎於天之椓之。言天之夭民也如是，是民之所以無祿也。實則幽王暴虐，斂稅繁興，小人充斥，賢者沉淪，有以致之。詩人不敢斥言王之失德，故以「天夭是椓」婉言之，其意深矣。</p><p><strong>所出</strong>：《詩經 · 正月》 — https://zh.wikisource.org/wiki/詩經/正月</p></article></main></div></div>
