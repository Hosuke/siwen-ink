    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 食象</nav></header><main><article><h1>食象</h1><p>上有所好，下必從之；王好奢則臣士民天下皆不足。</p><p>觀食象者食牛不足，觀戴冕者戴冠不足。不足有所自，不廉有所始。是知王好奢則臣不足，臣好奢則士不足，士好奢則民不足，民好奢則天下不足。夫天下之物十之，王好一，民亦一；王好五，民亦五；王好十，民亦十。以十論之，則是十家為一家，十國為一國，十天下為一天下，何不弊之有！</p><p><strong>所出</strong>：《化書 · 卷六》 — https://zh.wikisource.org/wiki/化書/卷六</p></article></main></div></div>
