    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 勞風</nav></header><main><article><h1>勞風</h1><p>風水舍肺，強上冥視，唾出若涕。</p><p>勞風法在肺下，其為病也，使人強上冥視，唾出若涕，惡風而振寒，此為勞風之病。治之奈何？以救俛仰。巨陽引精者三日，中年者五日，不精者七日，欬出青黃涕，其狀如膿，大如彈丸，從口中若鼻中出，不出則傷肺，傷肺則死也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第九卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第九卷</p></article></main></div></div>
