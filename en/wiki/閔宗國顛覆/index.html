    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 閔宗國顛覆</nav></header><main><article><h1>閔宗國顛覆</h1><p>許穆夫人閔念宗國覆亡，欲救而不能之情。</p><p>「閔其宗國顛覆」，毛詩序述許穆夫人作詩之本意也。</p><p>狄人滅衞，懿公死難，宗邦覆亡。許穆夫人身在異國，閔念宗國之顛覆，自傷力小不能救拔，欲歸以唁兄，而義不得遂行。詩中「視爾不臧，我思不遠」「視爾不臧，我思不閟」，皆言己志之不可已，雖許人尤之而終不能回也。</p><p>後世以「閔」字為詞，言念亂傷亡之辭，蓋本乎此。</p><p><strong>所出</strong>：《詩經 · 載馳》 — https://zh.wikisource.org/wiki/詩經/載馳</p></article></main></div></div>
