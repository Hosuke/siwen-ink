    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 物固相累二類相召</nav></header><main><article><h1>物固相累二類相召</h1><p>萬物相制相因，利與害迭相承轉，實一理也。</p><p>莊周遊於雕陵之樊，覩異鵲自南方來，翼廣七尺，目大運寸，感周之顙而集於栗林。周欲執彈而取之，忽見蟬方得美蔭而忘其身，螳螂執翳而搏之，見得而忘其形；異鵲從而利之，見利而忘其真。周怵然曰：「噫！物固相累，二類相召也。」</p><p>莊周由是捐彈反走，悟身為利所累之理。入其俗，從其令，遊於物之初而不為物所羈，此之謂與化為一。</p><p><strong>所出</strong>：《莊子 · 山木》 — https://zh.wikisource.org/wiki/莊子/山木</p></article></main></div></div>
