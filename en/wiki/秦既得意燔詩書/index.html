    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 秦焚詩書</nav></header><main><article><h1>秦焚詩書</h1><p>言秦既一天下，乃焚燒詩書，諸侯史記尤甚。</p><p>秦既得意，燒天下詩書，諸侯史記尤甚。考其所以然者，諸侯史記多有刺譏秦政之語，故秦人痛絕之。詩書所以復見者，多藏人家；而史記獨藏周室，周室既亡，於是並滅。惜哉！獨有秦記，然其文略不具，又不載日月。雖然，戰國之權變亦有可頗采者，何必上古？蓋秦取天下多暴，然世異變，成功大，不可專以得失論也。</p><p><strong>所出</strong>：《史記 · 卷015》 — https://zh.wikisource.org/wiki/史記/卷015</p></article></main></div></div>
