    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 孝景皇帝十三王</nav></header><main><article><h1>孝景皇帝十三王</h1><p>孝景皇帝十三子分封五母，各王治國，其後多以罪除。</p><p>孝景皇帝有子十三人，皆封為王。其母有五：栗姬、程姬、賈夫人、唐姬、王夫人兒姁。同母所生者為宗親。</p><p>栗姬子三人：曰榮、曰德、曰閼于。程姬子三人：曰餘、曰非、曰端。賈夫人子二人：曰彭祖、曰勝。唐姬子一人：曰發。王夫人兒姁子四人：曰越、曰寄、曰乘、曰舜。</p><p>凡十三王，國土分佈四方。後多以罪削奪，或絕嗣除國，土地歸於漢廷。</p><p><strong>所出</strong>：《史記 · 卷059》 — https://zh.wikisource.org/wiki/史記/卷059</p></article></main></div></div>
