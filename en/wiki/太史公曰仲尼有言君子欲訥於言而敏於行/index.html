    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 太史公曰仲尼有言君子欲訥於言而敏於行</nav></header><main><article><h1>太史公曰仲尼有言君子欲訥於言而敏於行</h1><p></p><p>太史公論[[萬石君]]及[[建陵侯]][[衞綰]]諸人曰：「仲尼有言『君子欲訥於言而敏於行』，其[[萬石君]]、[[建陵侯]]、張叔之謂邪？是以其教不肅而成，不嚴而治。」</p><p>  [[塞侯]][[直不疑]]「微巧」，[[周文]]「處讇」，君子譏之。然[[萬石君]]諸人可謂篤行君子矣。</p><p>  <strong>所出</strong>：《史記 · 卷103》 — https://zh.wikisource.org/wiki/史記/卷103</p></article></main></div></div>
