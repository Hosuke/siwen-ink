    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 賞暴罰賢</nav></header><main><article><h1>賞暴罰賢</h1><p></p><p><strong>賞暴罰賢</strong>，墨家政治哲學中正道傾頹之象徵。[[墨子]]·尚賢下篇揭示：當君王不以賢能選拔官吏，而專任骨肉之親、無故富貴者，賞罰之道遂逆。</p><p>墨子明言：「以賞不當賢，罰不當暴，其所賞者已無故矣，其所罰者亦無罪。」賞無功而罰無辜，百姓心散，皆解體沮喪，不復用力相助；財物腐朽而不相分資；良道隱慝而不相教誨。於是飢者不得食，寒者不得衣，亂者不得治。</p><p>此與[[賞賢罰暴]]相對。賞賢罰暴，國之興也；賞暴罰賢，國之亡也。墨子以此警戒當世之君，欲求國家之治、天下之和，舍尚賢而不可。</p></article></main></div></div>
