    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 王用命說為公</nav></header><main><article><h1>王用命說為公</h1><p>傅說有功於殷，殷王用之以為公，賢者起於圜土而位至公卿。</p><p>傅說既掃平失仲，其舊邑在北海之州，是為圜土。說來歸殷，王用之以為公。</p><p>[[赦過宥罪]]，聖王之政也。傅說起於圜土之中，升至公位，古今以為美談。[[伊尹百里奚]]皆起於賤，而[[傅說]]之顯庸，亦其一也。</p><p><strong>所出</strong>：《尚書 · 傅說之命上》 — https://zh.wikisource.org/wiki/尚書/傅說之命上</p></article></main></div></div>
