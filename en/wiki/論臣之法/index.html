    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 論臣之法</nav></header><main><article><h1>論臣之法</h1><p>論臣之道，觀其所舉、所施、所受、所為，以知人情之善惡。</p><p>今人君之論臣也，不計其大功，總其略行，而求其小善，即失賢之道也。故人有厚德，無間其小節；人有大譽，無疵其小故。夫人情莫不有所短，成其大略是也，雖有小過，不以為累也。論人之道，貴即觀其所舉，富即觀其所施，窮即觀其所受，賤即觀其所為；視其所患難以智勇，動以喜樂以觀其守，委以貨財以觀其仁，振以恐懼以觀其節，如此則人情可知矣。</p><p><strong>所出</strong>：《文子 · 卷十一》 — https://zh.wikisource.org/wiki/文子/卷十一</p></article></main></div></div>
