    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 苦海</nav></header><main><article><h1>苦海</h1><p>流浪生死，常沉苦海</p><p>[[妄心驚神|妄心]]既生，[[遣慾澄心|欲]]既牽之，則煩惱妄想，憂苦身心，便遭濁辱，流浪生死，常沉苦海，永失真道。</p><p>苦海者，生死輪轉之喻也。沉溺其中，無有已時。唯[[遣慾澄心|遣慾澄心]]，常保[[真靜應物|真靜]]，方能脫離。</p><p><strong>所出</strong>：《太上老君說常清靜經》 — https://zh.wikisource.org/wiki/太上老君說常清靜經</p></article></main></div></div>
