    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 加隆倍之</nav></header><main><article><h1>加隆倍之</h1><p>父母之恩加隆，故服再期而倍之。</p><p>然則何以三年也？曰：加隆焉爾也，焉使倍之，故再期也。</p><p><strong>所出</strong>：《禮記 · 三年問》 — https://zh.wikisource.org/wiki/禮記/三年問</p></article></main></div></div>
