    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 六耦恆相比</nav></header><main><article><h1>六耦恆相比</h1><p>有無、難易、長短、高下、音聲、先後，六者對待相成，永恆不易。</p><p>有无之相生也，難易之相成也，長短之相形也，高下之相盈也，音聲之相和也，先後之相隨，恆也。此六耦者，皆相對而立，相待而成。有因无而生，无因有而顯；難因易而成，易因難而見；長因短而形，短因長而較；高因下而盈，下因高而傾；音因聲而和，聲因音而別；先因後而隨，後因先而序。恆也者，謂其理之不易，非一時偶然而已。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第四十六章 觀徼》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
