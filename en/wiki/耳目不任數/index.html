    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 耳目不任數</nav></header><main><article><h1>耳目不任數</h1><p>人主不可恃目以為明、恃耳以為聰，必任術數乃能周知。</p><p>人主者，非目若离婁乃為明也，非耳若師曠乃為聰也。目必不任其數，而待目以為明，所見者少矣，非不弊之術也。耳必不因其勢，而待耳以為聰，所聞者寡矣，非不欺之道也。</p><p>是故明主必任[[任數不任人|術數]]，不恃[[以盲為明以聾為聰|耳目之明聰]]，然後能周知姦偽，無所遁形。</p><p><strong>所出</strong>：《韓非子 · 奸劫弑臣》 — https://zh.wikisource.org/wiki/韓非子/奸劫弑臣</p></article></main></div></div>
