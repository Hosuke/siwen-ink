    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 四方為則</nav></header><main><article><h1>四方為則</h1><p>君子之德，為天下法。</p><p>有馮有翼，有孝有德，以引以翼，豈弟君子，四方為則。言君子之德行充實，足以為四方之準則也。</p><p><strong>所出</strong>：《詩經 · 卷阿》 — https://zh.wikisource.org/wiki/詩經/卷阿</p></article></main></div></div>
