    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 名世之士，王者之師</nav></header><main><article><h1>名世之士，王者之師</h1><p>稱荀卿之才德，可為名傳於世者之師，足以輔佐王者。</p><p>觀其立言指事，根極理要，敷陳往古，掎挈當世，撥亂興理，易於反掌，真名世之士，王者之師。</p><p><strong>所出</strong>：《荀子 · 荀子序》 — https://zh.wikisource.org/wiki/荀子/荀子序</p></article></main></div></div>
