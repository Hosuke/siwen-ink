    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 孤危將亡</nav></header><main><article><h1>孤危將亡</h1><p>孤立危殆，滅亡將至。</p><p>詩序云幽王[[暴虐無親]]，不能[[宴樂同姓]]，[[孤危將亡]]，故作是詩。此言其孤立無援、危機四伏之勢。九族離心，賢者不附，[[死喪無日]]，所以刺之深也。</p><p><strong>所出</strong>：《詩經 · 頍弁》 — https://zh.wikisource.org/wiki/詩經/頍弁</p></article></main></div></div>
