    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 善言古者必有節於今</nav></header><main><article><h1>善言古者必有節於今</h1><p>論古之說，必有驗於今，方為可用。</p><p>善言古者必有節於今，善言天者必有徵於人。凡論者，貴其有辨合，有符驗，故坐而言之，起而可設，張而可施行。今孟子曰「人之性善」，無辨合符驗，坐而言之，起而不可設，張而不可施行，豈不過甚矣哉！[[言必立儀]]，[[言足以遷行者]]，皆論說之要，而[[為性惡之故|性惡之說]]正合此法。</p><p><strong>所出</strong>：《荀子 · 性惡篇》 — https://zh.wikisource.org/wiki/荀子/性惡篇</p></article></main></div></div>
