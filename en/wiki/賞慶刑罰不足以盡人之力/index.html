    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 賞慶刑罰不足以盡人之力</nav></header><main><article><h1>賞慶刑罰不足以盡人之力</h1><p>賞罰刑詐不足以使人效死，必以德義化之。</p><p>孫卿子云：「凡人之動也，為賞慶為之則見害傷焉止矣。故賞慶、刑罰、埶詐，不足以盡人之力，致人之死。」古之人羞而不道也。必厚德音以先之，明禮義以道之，致忠信以愛之，尚賢使能以次之，爵服慶賞以申之。</p><p><strong>所出</strong>：《荀子 · 議兵篇》 — https://zh.wikisource.org/wiki/荀子/議兵篇</p></article></main></div></div>
