    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 上不與義之使獨為之</nav></header><main><article><h1>上不與義之使獨為之</h1><p>君上不與臣下共事義理，使臣專任其責。</p><p>虛心以為道舍。上不與共之，民乃寵之；上不與義之，使獨為之。上與民共之，則民不知所從；上與義之，則臣無所任責。惟上不與共、不與義，虛心以待，使民自化，使臣自任，如此則民受寵而不敢慢，臣任事而不敢推。明主知道在無為，事在專任，故使臣各盡其能，而君坐於無過之地也。</p><p><strong>所出</strong>：《韓非子 · 揚權》 — https://zh.wikisource.org/wiki/韓非子/揚權</p></article></main></div></div>
