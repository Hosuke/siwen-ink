    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 智法之士與當塗之人不相容</nav></header><main><article><h1>智法之士與當塗之人不相容</h1><p>智法之士欲燭-{矫}-當塗之人，終不可兩存。</p><p>智術之士明察，聽用，且燭重人之陰情；能法之士勁直，聽用，且-{矫}-重人之姦行。故智術能法之士用，則貴重之臣必在繩之外矣。是智法之士與當塗之人，不可兩存之仇也。</p><p>其可以罪過誣者，以公法而誅之；其不可被以罪過者，以私劒而窮之。是明法術而逆主上者，不僇於吏誅，必死於私劒矣。</p><p><strong>所出</strong>：《韓非子 · 孤憤》 — https://zh.wikisource.org/wiki/韓非子/孤憤</p></article></main></div></div>
