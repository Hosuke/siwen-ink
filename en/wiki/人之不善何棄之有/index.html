    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 人之不善何棄之有</nav></header><main><article><h1>人之不善何棄之有</h1><p>人有不善，道不廢之，聖人不輕棄人也。</p><p>人之不善，何棄之有。言[[不善人]]雖有不善，道猶[[不善不棄|不弃]]之。聖人之心，視不善之人猶可[[化而欲作|化]]而為善，[[常善救人故無棄人|不肯輕弃]]一人。[[和大怨必有餘怨|怨不在大]]，[[不教而民從其化|化之在先]]，此[[聖人之心]]也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 六十二章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
