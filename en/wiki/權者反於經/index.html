    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 權者反於經</nav></header><main><article><h1>權者反於經</h1><p>權道反乎常經，乃所以成善也。</p><p>公羊傳論[[祭仲知權]]之義，云：「權者何？權者反於經，然後有善者也。」</p><p>蓋常經者，正道也；權者，變通也。當生死存亡之際，守經而不知權，則玉石俱焚。故聖賢之權，反乎常經，而卒歸於善。此[[祭仲知權]]之謂也。</p><p>然行權有道：「自貶損以行權，不害人以行權。」若[[殺人以自生亡人以自存]]，則非君子之所為矣。</p><p><strong>所出</strong>：《春秋公羊傳 · 桓公》 — https://zh.wikisource.org/wiki/春秋公羊傳/桓公</p></article></main></div></div>
