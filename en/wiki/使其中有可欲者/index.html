    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 使其中有可欲者</nav></header><main><article><h1>使其中有可欲者</h1><p>張釋之謂厚葬之塚若有可欲之物，雖錮以南山猶有隙；苟無可欲，雖無石槨亦無所戚。</p><p>慎夫人從上登霸陵，上指新豐道曰：「此走邯鄲道也。」使慎夫人鼓瑟，上自倚瑟而歌，意慘悽悲懷，顧謂群臣曰：「以北山石為槨，用紵絮斮陳，蕠漆其閒，豈可動哉！」左右皆曰善。釋之前進曰：「使其中有可欲者，雖錮南山猶有郄；使其中無可欲者，雖無石槨，又何戚焉！」文帝稱善。</p><p><strong>所出</strong>：《史記 · 卷102》 — https://zh.wikisource.org/wiki/史記/卷102</p></article></main></div></div>
