    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 萬民無籍</nav></header><main><article><h1>萬民無籍</h1><p>善治者不籍於民，而國利自歸。</p><p>人君御穀物之秩相勝，而操事於其不平之閒，故萬民無籍，而國利歸於君也。</p><p>是故人君非能散積聚，鈞羨不足，分并財利，而調民事也，則君雖彊本趣耕，而自為鑄幣而無已，乃今使民下相役耳，惡能以為治乎！</p><p><strong>所出</strong>：《管子 · 第73篇國蓄》 — https://zh.wikisource.org/wiki/管子/第73篇國蓄</p></article></main></div></div>
