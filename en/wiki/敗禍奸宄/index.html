    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 敗禍奸宄</nav></header><main><article><h1>敗禍奸宄</h1><p>奸宄敗亂，自貽厥殃。</p><p>乃敗禍奸宄，以自災于厥身。</p><p>[[敗禍奸宄]]者，言奸邪之人，敗亂國家，袽及民庶，自貽[[厥身]]之災也。[[汝不和吉言于百姓]]，[[惟汝自生毒]]，茲非虛語。[[尚書]]此義，以戒奸宄之害。</p><p><strong>所出</strong>：《尚書 · 盤庚上》 — https://zh.wikisource.org/wiki/尚書/盤庚上</p></article></main></div></div>
