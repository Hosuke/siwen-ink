    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 其政悶悶</nav></header><main><article><h1>其政悶悶</h1><p>政令寬簡，民俗醇厚。</p><p>老子言治世之道，以渾厚為尚。政令渾淪不察，則民德自淳，無所企慕亦無所缺失，其心廣寬，其俗敦樸。反是，政令峻急，法令章明，則民亦生巧智以應之，取巧飾詐，缺缺然有不足之態。此「悶悶」之治，非昏昧之謂，乃順其自然、不加雕鏤之意也。</p><p>  <strong>所出</strong>：《道德經 (王弼本) · 五十八章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
