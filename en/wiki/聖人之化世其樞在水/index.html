    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 聖人之化世其樞在水</nav></header><main><article><h1>聖人之化世其樞在水</h1><p>聖人治世，其樞紐在水，水一則人心正，水清則民心易。</p><p>是以聖人之化世也，其解在水。故水一則人心正，水清則民心易。一則欲不汚，民心易則行無邪。是以聖人之治於世也，不人告也，不戶說也，其樞在水。</p><p>水者萬物之準也，諸生之淡也，違非得失之質也，是以無不滿、無不居也。</p><p>水之就下，人之情也。聖人知水之所以為道，是故治世得其樞要。</p><p><strong>所出</strong>：《管子 · 第39篇水地》 — https://zh.wikisource.org/wiki/管子/第39篇水地</p></article></main></div></div>
