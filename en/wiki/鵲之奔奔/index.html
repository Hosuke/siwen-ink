    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 詩經·鵲之奔奔</nav></header><main><article><h1>詩經·鵲之奔奔</h1><p>刺詩。以喜鵲配對有常，反興宣姜之淫。</p><p>《鵲之奔奔》，或作《鵲之奔奔》，與《鵲之奔奔》實同一篇。《詩經·衞風》有目錄作《鵲之奔奔》者，蓋後世傳本之異文。</p><p>篇章甚短，二章四句，而刺意深切。詩以喜鵲配對有常，反興宣姜之無良，以鵲之貞況人之醜。後世論詩者多引此以證衛室之亂，亦以「鵲之奔奔」喻人情之失其常匹。</p><p><strong>所出</strong>：《詩經 · 鵲之奔奔》 — https://zh.wikisource.org/wiki/詩經/鵲之奔奔</p></article></main></div></div>
