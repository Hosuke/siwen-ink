    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 食醫</nav></header><main><article><h1>食醫</h1><p>中士二人，掌和王六食六飲六膳百羞百醬八珍</p><p>食醫，中士二人。</p><p>掌和王之六食、六飲、六膳、百羞、百醬、八珍之齊。</p><p>凡食齊視春時，羹齊視夏時，醬齊視秋時，飲齊視冬時。凡和，春多酸，夏多苦，秋多辛，冬多咸，調以滑甘。</p><p>凡會膳食之宜，牛宜稌，羊宜黍，豕宜稷，犬宜粱，雁宜麥，魚宜菰。凡君子之食，恒放焉。</p><p><strong>所出</strong>：《周禮 · 天官冢宰》 — https://zh.wikisource.org/wiki/周禮/天官冢宰</p></article></main></div></div>
