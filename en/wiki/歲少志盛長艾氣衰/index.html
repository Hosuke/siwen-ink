    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 歲少志盛長艾氣衰</nav></header><main><article><h1>歲少志盛長艾氣衰</h1><p>人之初少志鋭思盛，及長則氣衰而慮密，各有所宜。</p><p>凡童少鑒淺而志盛，長艾識堅而氣衰。志盛者思銳以勝勞，氣衰者慮密以傷神。蓋稟賦有時，勢不可強。少壯之時，志氣方盛，可以銳意精進；及其衰也，若强思苦索，反以傷神。此中人之常資，歲時之大較，不可不知。是以善養氣者，必因時制宜，不以其衰而强其所不能，亦不以其盛而忽其所當守。</p><p><strong>所出</strong>：《文心雕龍 · 養氣》 — https://zh.wikisource.org/wiki/文心雕龍/養氣</p></article></main></div></div>
