    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 心使氣日強</nav></header><main><article><h1>心使氣日強</h1><p>以心志之力驅使精氣，是為太過，反速其亡。</p><p>益生日祥，心使氣曰強。河上公以心使氣為不知常、不合道。益生之厚，反生妖祥；心使精氣以為強者，是壯而不道。物壯則老，不道早已。</p><p><strong>所出</strong>：《老子河上公章句 · 玄符》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
