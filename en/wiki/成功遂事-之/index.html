    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 成功遂事-之</nav></header><main><article><h1>成功遂事-之</h1><p>帛书《老子》乙本与通行本在“成功遂事而弗名有”上略有文字差别，阐释道成万物而顺其本性、不居其功的哲学意涵。</p><p>帛書乙本別作「成功遂事而弗名有也」，其義與通行本「成功遂事而弗名有」相發。言道之成功萬物，莫不遂其性而不居其功。此節文義可與[[成功遂事而弗名有]]互補。</p><p>  <strong>所出</strong>：《老子 (帛書本) · 章三十四》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
