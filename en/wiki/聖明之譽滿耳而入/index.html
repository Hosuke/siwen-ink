    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 聖明之譽滿耳而入</nav></header><main><article><h1>聖明之譽滿耳而入</h1><p>人臣面聖而譽盈於耳，諛悅之辭異口同辭，鮮有不迷者。</p><p>抱樸子述當世富貴之樂，既極耳目之娛，乃喟然歎曰：「聖明之譽，滿耳而入；諂悅之言，異口同辭。於時眇然，意蔑古人，謂伊呂管晏，不足算也。」夫居於盛麗之地，遊於聲色之中，左右承迎，爭相稱美，聞善言而不入，遭逆耳而則違，日引月長，鮮有不移其心而喪其德者。是以古之聖主，側耳以聽芻蕘之賤，屈尊以求芻牧之諫，防民之口甚於防川，懼夫諛言之積成，而善政之浸亡也。</p><p><strong>所出</strong>：《抱朴子 · 卷49》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷49</p></article></main></div></div>
