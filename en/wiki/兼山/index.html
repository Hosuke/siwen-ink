    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 兼山</nav></header><main><article><h1>兼山</h1><p>山重疊止，君子法之以止其所</p><p>兼山，艮之象也。<strong>象曰</strong>「兼山，艮」，疊二艮成卦，山重山，止而又止也。君子觀此象，當思不出其位，止諸躬而止其所焉。</p><p><strong>所出</strong>：《周易 · 艮》 — https://zh.wikisource.org/wiki/周易/艮</p></article></main></div></div>
