    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 惄如調飢</nav></header><main><article><h1>惄如調飢</h1><p>思慕之切，如朝饑而不可解。</p><p>「惄如調飢」，惄，飢意也；調，朝也。調飢者，謂早晨之饑甚難忍也。詩言「未見君子，惄如調飢」，正以早晨饑餓之苦，比況思夫之切。蓋别離之人，朝夕企望，其情迫切，有不可以須臾解者焉。夫饑得食則解，而思而不見，其苦彌甚。此詩人取喻之深意也。</p><p><strong>所出</strong>：《詩經 · 汝坟》 — https://zh.wikisource.org/wiki/詩經/汝坟</p></article></main></div></div>
