    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 文王之事紂</nav></header><main><article><h1>文王之事紂</h1><p>文王以臣事君不敢不事，紂雖無道而文王以為父雖無道子不敢不事父。</p><p>昔者紂為無道，殺梅伯而醢之，殺鬼侯而脯之，以禮諸侯於廟。文王流涕而咨之。紂恐其畔，欲殺文王而滅周。文王曰：「父雖無道，子敢不事父乎？君雖不惠，臣敢不事君乎？孰王而可畔也？」紂乃赦之。天下聞之，以文王為畏上而哀下也。《詩》曰：「惟此文王，小心翼翼，昭事上帝，聿懷多福。」</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十</p></article></main></div></div>
