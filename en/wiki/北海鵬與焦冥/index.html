    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 北海鵬與焦冥</nav></header><main><article><h1>北海鵬與焦冥</h1><p>晏子言天下有極大之物曰鵬，有極細之物曰焦冥，以喻大小之辨。</p><p>景公問晏子曰：「天下有極大物乎？」晏子對曰：「有。北溟有鵬，足遊浮雲，背淩蒼天，尾偃天間，躍啄北海，頸尾咳於天地，然而漻漻乎不知六翮之所在。」公曰：「天下有極細者乎？」晏子對曰：「有。東海有蟲，巢於蚊睫，再乳再飛，而蚊不為驚。臣嬰不知其名，而東海漁者，命曰焦冥。」</p><p><strong>所出</strong>：《晏子春秋 · 卷八》 — https://zh.wikisource.org/wiki/晏子春秋/卷八</p></article></main></div></div>
