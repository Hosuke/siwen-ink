    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 生而不有為而不恃長而不宰</nav></header><main><article><h1>生而不有為而不恃長而不宰</h1><p>玄德之義，生養萬物而不有其功。</p><p>生之，畜之。生而不有，為而不恃，長而不宰，是謂玄德。天地生萬物而不以為己有，為萬物而不恃其功，長養萬物而不為之主，此聖人玄遠之德也。侯王守此，則天下將自賓。</p><p><strong>所出</strong>：《道德經 (王弼本) · 十章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
