    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 伯夷叔齊</nav></header><main><article><h1>伯夷叔齊</h1><p>伯夷叔齊餓死首陽，不畏重誅不利重賞，是無益之臣。</p><p>若此臣，不畏重誅，不利重賞，不可以罰禁也，不可以賞使也，此之謂無益之臣也。吾所少而去也，而世主之所多而求也。</p><p>古有伯夷、叔齊者，武王讓以天下而弗受，二人餓死首陽之陵。此[[楊朱言伯夷展季]]所稱，而[[聖人與仙人分途]]者非邪？</p><p><strong>所出</strong>：《韓非子 · 奸劫弑臣》 — https://zh.wikisource.org/wiki/韓非子/奸劫弑臣</p></article></main></div></div>
