    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 伐戴之師</nav></header><main><article><h1>伐戴之師</h1><p>宋衛入鄭，蔡人怒而不和</p><p>秋七月庚寅，鄭師入郊。猶在郊，宋人、衛人入鄭。蔡人從之伐戴。八月壬戌，鄭伯圍戴。癸亥，克之，取三師焉。</p><p>宋、衛既入鄭，而以伐戴召蔡人，蔡人怒，故不和而敗。</p><p><strong>所出</strong>：《春秋左氏傳 · 隱公》 — https://zh.wikisource.org/wiki/春秋左氏傳/隱公</p></article></main></div></div>
