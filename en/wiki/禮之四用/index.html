    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 禮之四用</nav></header><main><article><h1>禮之四用</h1><p>禮行於宗廟則敬，於朝廷則貴賤有位，於室家則父子親兄弟和，於鄉里則長幼有序。</p><p>以奉宗廟則敬，以入朝廷則貴賤有位，以處室家則父子親兄弟和，以處鄉里則長幼有序。</p><p><strong>所出</strong>：《禮記 · 經解》 — https://zh.wikisource.org/wiki/禮記/經解</p></article></main></div></div>
