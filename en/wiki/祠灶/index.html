    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 祠灶</nav></header><main><article><h1>祠灶</h1><p>祠灶致物，化沙為金，以求神仙不死之術。</p><p>祠灶者，以祭祀灶神為徑，冀致物化沙為黃金也。[[少君]]言於上曰：「祠灶則致物，致物而丹沙可化為黃金，黃金成以為飲食器則益壽，益壽而海中蓬萊僊者可見，見之以封禪則不死，黃帝是也。」於是天子始親祠灶，而遣方士入海求蓬萊安期生之屬。</p><p><strong>所出</strong>：《史記 · 卷012》 — https://zh.wikisource.org/wiki/史記/卷012</p></article></main></div></div>
