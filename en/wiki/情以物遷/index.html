    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 情以物遷</nav></header><main><article><h1>情以物遷</h1><p>情隨物變，辭自情生。</p><p>情與物相感，隨其流轉而遷變。[[春秋代序]]，物色之動，心亦搖焉。陽氣萌而蟲蟻作，陰律凝而鳥雀羞，四時代謝，萬物榮悴，人之感觸遂生。是以獻歲發春，情暢而悅豫；滔滔孟夏，心凝而鬱陶；天高氣清，志遠而意沉；霰雪無垠，慮深而矜肅。情既動矣，辭乃發焉，所謂「情以物遷，辭以情發」也。一葉落而意迎，蟲聲鳴而心引，況乎清風明月之夜、白日春林之晨乎？此詩道之初也。</p><p><strong>所出</strong>：《文心雕龍 · 物色》 — https://zh.wikisource.org/wiki/文心雕龍/物色</p></article></main></div></div>
