    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 拱璧以先駟馬，不如坐進此道</nav></header><main><article><h1>拱璧以先駟馬，不如坐進此道</h1><p>財物之奉不如道之進</p><p>[[拱璧]]以先[[駟馬]]，言以[[厚幣]][[先財|先]]重物相遺。然而[[千金之裘非一狐之腋|物重]]而道輕，[[不如坐進此道]]。[[坐進此道|坐進]]者，[[道不可以合|道]]之謂也。以財物奉上，不若以道化[[聖王求賢|賢君]]。[[以其私憾敗國殄民|私物]]不可以[[為治]]，[[道者古今之正權|道]]乃萬全之[[帝王之道]]也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 六十二章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
