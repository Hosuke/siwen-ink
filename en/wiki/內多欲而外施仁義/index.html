    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 內多欲而外施仁義</nav></header><main><article><h1>內多欲而外施仁義</h1><p>表面行仁義而心存私欲，不能效唐虞之治。</p><p>天子方招文學儒者，上曰吾欲云云，黯對曰：「陛下內多欲而外施仁義，柰何欲效唐虞之治乎！」上默然，怒，變色而罷朝。</p><p><strong>所出</strong>：《史記 · 卷120》 — https://zh.wikisource.org/wiki/史記/卷120</p></article></main></div></div>
