    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 有德司契無德司徹</nav></header><main><article><h1>有德司契無德司徹</h1><p>有德者掌券而民自歸附，無德者專尚征督而民離散</p><p>河上公章句：「有德司契，無德司徹。」</p><p>  有德之君，司察契信而已；無德之君，背契信，司人所失。與[[聖人執左契]]相發，[[任契]]之義，治世者所當知。</p><p>  <strong>所出</strong>：《老子河上公章句 · 任契》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
