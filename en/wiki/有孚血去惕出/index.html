    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 有孚血去惕出</nav></header><main><article><h1>有孚血去惕出</h1><p>孚誠相應則憂懼去而無咎。</p><p>有孚，血去惕出，无咎，小畜六四爻辭也。言六四以柔承九五，孚誠相應，則傷害去而憂懼出，自然無咎。象曰「上合志也」，言上下志同，心孚意合也。</p><p><strong>所出</strong>：《周易 · 小畜》 — https://zh.wikisource.org/wiki/周易/小畜</p></article></main></div></div>
