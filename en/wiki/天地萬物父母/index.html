    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 天地萬物父母，人萬物之靈</nav></header><main><article><h1>天地萬物父母，人萬物之靈</h1><p>天生地養，故為萬物之父；人稟靈秀，故為萬物之靈。</p><p>惟天地，萬物父母；惟人，萬物之靈。</p><p>言天地生養萬物，若父母之於子也。人稟天地之氣以為性，具耳目心思以為靈，故超萬物之上，為萬物之靈長也。</p><p><strong>所出</strong>：《尚書 · 泰誓上》 — https://zh.wikisource.org/wiki/尚書/泰誓上</p></article></main></div></div>
