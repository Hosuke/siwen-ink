    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 明夷</nav></header><main><article><h1>明夷</h1><p>離下坤上，光入地中，君子用晦而明之卦。</p><p>明夷，卦三十有六，離下坤上。離為火為日，坤為地為順。日沒入地，光明受傷，故曰明夷。象曰：「明入地中，明夷。」內文明而外柔順，以蒙大難，文王以之。利艱貞，晦其明也。內難而能正其志，箕子以之。</p><p>君子以蒞眾，用晦而明。夫明者，智之所出也；晦者，德之所以藏也。唯能用晦，乃能全明；唯明不息，乃可利貞。</p><p><strong>所出</strong>：《周易 · 明夷》 — https://zh.wikisource.org/wiki/周易/明夷</p></article></main></div></div>
