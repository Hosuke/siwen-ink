    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 見予不見奪</nav></header><main><article><h1>見予不見奪</h1><p>先王予之形可見，奪之理不可見。</p><p>桓公問：「歲罔，寡人不得籍斗升焉。」管子言：「租籍，君之所宜得也；正籍者，君之所强求也。亡君廢其所宜得，而斂其所强求，故下怨上而令不行。」</p><p>管子又曰：「民，奪之則怒，予之則喜。民情固然。先王知其然，故見予之所，不見奪之理。」</p><p>又曰：「五穀粟米者，民之司命也；黃金刀布者，民之通貨也。先王善制其通貨，以御其司命，故民力可盡也。」</p><p><strong>所出</strong>：《管子 · 第81篇輕重乙》 — https://zh.wikisource.org/wiki/管子/第81篇輕重乙</p></article></main></div></div>
