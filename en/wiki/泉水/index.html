    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 泉水</nav></header><main><article><h1>泉水</h1><p>诗中以泉水与淇水分列左右象征故土恩情，女子远行离乡、思归不得，深切表达了思乡之情。</p><p>又見於《詩經·竹竿》：「泉源在左，淇水在右，女子有行，遠兄弟父母。」</p><p>  泉源出於[[衞]]地，淇水亦行於衞境。詩人以「泉源」「淇水」分列左右，言己所生地土之恩情，左右縈帶，無時忘也。然[[女子有行]]，遂遠兄弟父母，不得復返泉源之側矣。是以序《竹竿》者以為「思歸」之詩，誠矣。</p><p>  <strong>所出</strong>：《詩經 · 竹竿》 — https://zh.wikisource.org/wiki/詩經/竹竿</p></article></main></div></div>
