    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 馳騁田臘使人心發狂-之</nav></header><main><article><h1>馳騁田臘使人心發狂-之</h1><p></p><p>是說亦見《道德經》十二章，云：「馳騁畋獵令人心發狂。」馳騁者，放縱不返；田獵者，逐外物也。心既發狂，則神明外馳，嗜欲熾而天理滅。是以聖人戒之。</p><p>  <strong>所出</strong>：《道德經 (王弼本) · 十二章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
