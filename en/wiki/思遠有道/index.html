    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 思遠有道</nav></header><main><article><h1>思遠有道</h1><p>念人務近，躁進則無功</p><p>「思遠有道」本乎《甫田》「無思遠人，勞心忉忉」之義。蓋念遠人者，苟不脩近事，則心勞而無功；苟能脩其在近，則遠人自至。《甫田》首章以荒田起興，戒躁求也。二章、三章申言其義，終以童子總角不見、忽而弁冠為喻，見事物之成各有其候，不可躁切而迫之。此聖人寡尤之旨，而詩人刺襄公之無禮義而求大功者，正以其不務近而務遠也。</p><p><strong>所出</strong>：《詩經 · 甫田》 — https://zh.wikisource.org/wiki/詩經/甫田</p></article></main></div></div>
