    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 中心悼</nav></header><main><article><h1>中心悼</h1><p>內心深痛而悼</p><p>中心悼者，內心深痛而悼也。</p><p>《終風》首章云「中心是悼」，直言其痛達於心中，無可申訴。詩人遭州吁之暴，見侮慢而不能正，唯有中心哀痛，不能自止。</p><p>{{後人援引「中心悼矣」以述哀毀之深}}，與此「中心是悼」義相近，蓋皆述內心之哀悼也。</p><p><strong>所出</strong>：《詩經 · 終風》 — https://zh.wikisource.org/wiki/詩經/終風</p></article></main></div></div>
