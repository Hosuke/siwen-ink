    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 惠不惠，懋不懋</nav></header><main><article><h1>惠不惠，懋不懋</h1><p>賞罰之柄在於上，善者賞之，不善者罰之，乃治道之要。</p><p>《康誥》有云：「怨不在大，亦不在小；惠不惠，懋不懋。」蓋怨之生也，不在大之與小，而在乎上之賞罰有以召之。惠者，賞也；懋者，罰也。當賞者賞之，是為惠之惠；當罰者罰之，是為懋之懋。上不行賞罰之柄，則人心不服，而怨由此起。是故治道之要，莫先於賞罰之公。賞其所當賞，罰其所當罰，則民無怨矣。</p><p><strong>所出</strong>：《尚書 · 康誥》 — https://zh.wikisource.org/wiki/尚書/康誥</p></article></main></div></div>
