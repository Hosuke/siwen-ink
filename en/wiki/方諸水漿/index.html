    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 方諸水漿</nav></header><main><article><h1>方諸水漿</h1><p>方諸承接月露，非星月則無以得水，以喻真陰之炁必資柔下而後成。</p><p>方諸，承接月露之器也；對月而立，可以得水漿。非星月，安能得水漿？月為陰精，其光清冷，凝露為水。在內修之道，以喻身中真陰之水，必待柔下虛受，方可凝結而成。方諸無月則不能得水，修真者無溫柔之德，亦不能成丹道之陰炁。與[[陽燧取火]]相對，一剛一柔，一陽一陰，共為丹道之基。</p><p><strong>所出</strong>：《周易參同契 · 21章》 — https://zh.wikisource.org/wiki/周易參同契/21章</p></article></main></div></div>
