    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 聖人貴一</nav></header><main><article><h1>聖人貴一</h1><p>萬物本一，聖人貴之，不別妍醜。</p><p>黃帝曰：「通天下一氣耳。聖人故貴一。」所美為神奇，所惡為臭腐，不知其皆氣之化也。聖人知萬物一體，故不以美惡易其心，貴乎渾沌之初也。</p><p><strong>所出</strong>：《莊子 · 知北遊》 — https://zh.wikisource.org/wiki/莊子/知北遊</p></article></main></div></div>
