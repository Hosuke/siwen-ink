    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 需于酒食</nav></header><main><article><h1>需于酒食</h1><p>宴享以樂，居安思危，待時而動。</p><p>九五「需于酒食，貞吉」，象曰「酒食，貞吉，以中正也」。酒食者，宴享之物也。九五居天位，剛健中正，以下居坎險之中，安然需待，無所作為，但以酒食自樂而已。此非耽於逸樂，乃聖人寬裕之心、胸次坦然之象。需待之時，養德修為，以待天命，時未可進，則從容宴樂，以養其生；時既可動，則酒食之享亦所以安眾心、待賓客也。貞而吉者，以其居中守正，不失君子之度焉。</p><p><strong>所出</strong>：《周易 · 需》 — https://zh.wikisource.org/wiki/周易/需</p></article></main></div></div>
