    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 揆度奇恆</nav></header><main><article><h1>揆度奇恆</h1><p>揆度病之淺深，奇恆言異常之病，道在於一，神轉不回。</p><p>揆度奇恆之義，出[[玉板論要]]。</p><p>岐伯曰：「揆度者，度病之淺深也。奇恆者，言奇病也。」</p><p>五色脈變，揆度奇恆，道在於一。神轉不回，回則不轉，乃失其機。行奇恆之法，以太陰始。行所不勝曰逆，逆則死；行所勝曰從，從則活。</p><p><strong>所出</strong>：《黃帝內經 · 素問第四卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第四卷</p></article></main></div></div>
