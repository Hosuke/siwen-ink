    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 舜有盡而賞罰無已</nav></header><main><article><h1>舜有盡而賞罰無已</h1><p>舜有盡而天下之過無已，以有盡逐無已，所止者寡矣；賞罰令行，則十日而海內畢。</p><p>「或曰」難舜之躬化曰：舜救敗，期年已一過，三年已三過。舜有盡，壽有盡，天下過無已者；以有盡逐無已，所止者寡矣。賞罰使天下必行之，令曰「中程者賞，弗中程者誅」，令朝至暮變，十日而海內畢矣，奚待期年？舜猶不以此說堯令從己，乃躬親，不亦無術乎？</p><p><strong>所出</strong>：《韓非子 · 難一》 — https://zh.wikisource.org/wiki/韓非子/難一</p></article></main></div></div>
