    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 切磋琢磨</nav></header><main><article><h1>切磋琢磨</h1><p>君子修德，如治玉石，精益求精。</p><p>君子之所以為君子，非生而有之，乃切磋琢磨以成之。</p><p>《淇奧》之詩曰：「有匪君子，如切如磋，如琢如磨。」切者，切之使方；磋者，磋之使圓；琢者，琢之使文；磨者，磨之使精。凡骨角玉石，必此數者而後成器，君子之德亦然。</p><p>切之與磋，所以治其粗；琢之與磨，所以致其妙。切磋以明義理，琢磨以盡精微。非切磋無以知所當然，非琢磨無以臻於至善。是故聖賢之學，由博返約，由粗而至精，所謂「如切如磋」者，師友之益也；「如琢如磨」者，省察之功也。</p><p>《論語》亦有「如切如磋，如琢如磨」之語，蓋出於此，以明為學之序，莫先於此。</p></article></main></div></div>
