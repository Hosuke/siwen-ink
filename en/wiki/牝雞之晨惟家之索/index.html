    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 牝雞之晨惟家之索</nav></header><main><article><h1>牝雞之晨惟家之索</h1><p>婦言是用則家道敗壞。</p><p>古人有言曰：「牝雞無晨。牝雞之晨，惟家之索。」言雌代雄鳴，陰干陽政，家道廢而族散矣。[[惟婦言是用]]專用[[妲己]]之言而[[商罪貫盈]]，此[[牝雞無晨]]之驗也。后妃不出閫閾，則內政肅而家道昌；若柄移閫外，則[[暴虐無親]]而國隨覆。</p><p><strong>所出</strong>：《尚書 · 牧誓》 — https://zh.wikisource.org/wiki/尚書/牧誓</p></article></main></div></div>
