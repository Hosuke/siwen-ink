    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 四者有一至敗</nav></header><main><article><h1>四者有一至敗</h1><p>亂、虐、北至其一則國敗，姦人必乘而謀之</p><p>亂至則虐，騰至則北。四者有一至，敗，敵人謀之。施舍優猶以濟亂，百姓悅；選賢遂材而禮孝弟，姦偽止；要淫佚別男女，通亂隔；貴賤有義倫等不踰，有功者勸；國有常式，法不隱，下無怨心。此五者，興德匡過，存國定民之道也。</p><p><strong>所出</strong>：《管子 · 第31篇君臣下》 — https://zh.wikisource.org/wiki/管子/第31篇君臣下</p></article></main></div></div>
