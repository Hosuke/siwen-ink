    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 文武吉甫</nav></header><main><article><h1>文武吉甫</h1><p>吉甫兼備文德武功，為萬邦之則。</p><p>《江漢》之詩，毛序云「尹吉甫美宣王」，與《大雅·崧高》[[吉甫燕喜]]同出尹吉甫之手。吉甫既能美宣王[[能興衰撥亂命召公平淮夷]]之功，又能賦[[六月興師]]以美[[六月]]北伐之師，可謂文武兼備，[[文武吉甫]]之實也。</p><p>  <strong>所出</strong>：《詩經 · 江漢》 — https://zh.wikisource.org/wiki/詩經/江漢</p></article></main></div></div>
