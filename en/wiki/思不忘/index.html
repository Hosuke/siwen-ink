    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 思不忘</nav></header><main><article><h1>思不忘</h1><p>念及前烈，銘之心而不敢忘也。</p><p>「思不忘」者，[[詩經]]《周頌·閔予小子》之言也。[[皇王]][[繼序]]，念之而不敢忘。</p><p>[[思]]者，語助辭，所以足句而加語勢。[[不忘]]者，終食之間、造次之頃，皆不敢忘之謂也。嗣王念及[[文王]][[武王]]艱難締構之恩緒，存之於心，勿使失墜。引而伸之，[[臣]]之事[[君]]，[[子]]之事[[父]]，[[慎終追遠]]之義，皆在其中。</p><p><strong>所出</strong>：《詩經 · 閔予小子》 — https://zh.wikisource.org/wiki/詩經/閔予小子</p></article></main></div></div>
