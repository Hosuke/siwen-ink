    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 郭解讓邑</nav></header><main><article><h1>郭解讓邑</h1><p>郭解夜解仇家，不欲奪人邑中賢大夫權，乃夜去而不使人知。</p><p>雒陽人有相仇者，邑中賢豪居間者以十數，終不聽。客乃見郭解。解夜見仇家，仇家曲聽解。解乃謂仇家曰：「吾聞雒陽諸公在此間，多不聽者。今子幸而聽解，解奈何乃從他縣奪人邑中賢大夫權乎！」乃夜去，不使人知，曰：「且無用，待我去，令雒陽豪居其間，乃聽之。」</p><p><strong>所出</strong>：《史記 · 卷124》 — https://zh.wikisource.org/wiki/史記/卷124</p></article></main></div></div>
