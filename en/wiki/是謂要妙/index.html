    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 是謂要妙</nav></header><main><article><h1>是謂要妙</h1><p>要妙者，道之至要至妙，不可言傳。</p><p>是謂要妙者，要，要約也；妙，精微也。此聖人之道，無以加諸此，師資之辨，其道之要妙，聖人之所以為聖人者也。要妙不可以智索，不可以言傳，唯默契神會，與道合真，斯得要妙之旨也已。</p><p><strong>所出</strong>：《道德經 (王弼本) · 二十七章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
