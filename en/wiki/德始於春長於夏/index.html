    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 德始於春，長於夏</nav></header><main><article><h1>德始於春，長於夏</h1><p>德澤始於春，盛於夏；刑罰始於秋，流於冬。</p><p>德始於春，長於夏；刑始於秋，流於冬。刑德不失，四時如一。刑德離鄉，時乃逆行。</p><p><strong>所出</strong>：《管子 · 第40篇四時》 — https://zh.wikisource.org/wiki/管子/第40篇四時</p></article></main></div></div>
