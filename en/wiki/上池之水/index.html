    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 上池之水</nav></header><main><article><h1>上池之水</h1><p>長桑君所予禁方，以之上池（即露水）服藥，三十日後乃能透視。</p><p>長桑君乃呼扁鵲私坐，閒與語曰：「我有禁方，年老，欲傳與公，公毋泄。」扁鵲曰：「敬諾。」乃出其懷中藥予扁鵲：「飲是以上池之水，三十日當知物矣。」扁鵲以其言飲藥三十日，視見垣一方人。</p><p><strong>所出</strong>：《史記 · 卷105》 — https://zh.wikisource.org/wiki/史記/卷105</p></article></main></div></div>
