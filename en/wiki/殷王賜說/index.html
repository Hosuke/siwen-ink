    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 殷王賜說</nav></header><main><article><h1>殷王賜說</h1><p>武丁求賢，於傅巖得傅說，天畀之臣，遂任以政。</p><p>惟殷王武丁，夢兆得說，乃使百工徧求之邑。弼人於傅巖得其人，時說方築城，庸降之力，腕肩如椎。王訊之曰：「帝爾以畀余，抑非？」說對曰：「惟帝以余畀爾。」遂命之伐失仲。說遂掃平叛亂，殷之王業以定。</p><p>古之聖王，無間遠邇。夢兆可以得人，輿皁可以升公。[[敷求哲人]]之旨，於斯驗矣。</p><p><strong>所出</strong>：《尚書 · 傅說之命上》 — https://zh.wikisource.org/wiki/尚書/傅說之命上</p></article></main></div></div>
