    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 世喪道，道喪世</nav></header><main><article><h1>世喪道，道喪世</h1><p>世與道交相喪，離道之世無以興道，離世之道無以見用</p><p>由是觀之，世喪道矣，道喪世矣，世與道交相喪也，道之人何由興乎世，世亦何由興乎道哉！道无以興乎世，世无以興乎道，雖聖人不在山林之中，其德隱矣。[[世與道交相喪]]之嘆，乃此篇之主旨。</p><p><strong>所出</strong>：《莊子 · 繕性》 — https://zh.wikisource.org/wiki/莊子/缮性</p></article></main></div></div>
