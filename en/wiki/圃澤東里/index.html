    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 圃澤東里</nav></header><main><article><h1>圃澤東里</h1><p>圃澤多賢，東里多才</p><p>鄭之圃澤多賢，東里多才。圃澤之役有伯豐子者，行過東里，遇鄧析。鄧析譏之，伯豐子不應。其從者越次而進曰：「大夫不聞齊魯之多機乎？有善治土木者，有善治金革者，有善治聲樂者，有善治書數者，有善治軍旅者，有善治宗廟者，羣才備也。而無相位者，無能相使者。而位之者無知，使之者無能，而知之與能爲之使焉。執政者，迺吾之所使，子奚矜焉？」鄧析無以應。</p><p><strong>所出</strong>：《列子 · 仲尼篇》 — https://zh.wikisource.org/wiki/列子/仲尼篇</p></article></main></div></div>
