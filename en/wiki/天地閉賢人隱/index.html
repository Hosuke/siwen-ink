    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 天地閉，賢人隱</nav></header><main><article><h1>天地閉，賢人隱</h1><p>天地變化則草木蕃，天地閉塞則賢人隱。</p><p>坤文言解六四「括囊」曰：「天地變化，草木蕃；天地閉，賢人隱。易曰：『括囊，无咎，无譽。』蓋言謹也。」</p><p>言時運通泰，則天地變化，草木繁茂；時運閉塞，則賢人當隱晦自守。括囊无咎者，非隱默也，乃慎謹以全身遠害也。</p><p><strong>所出</strong>：《周易 · 坤》 — https://zh.wikisource.org/wiki/周易/坤</p></article></main></div></div>
