    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 張宇初</nav></header><main><article><h1>張宇初</h1><p>正一嗣教道合無為闡祖光範真人，四十三代天師，書大洞後序。</p><p>正一嗣教道合無為闡祖光範真人，領道教事，四十三代天師張宇初，謹書大洞真經後序。序稱大洞經發乎天真之音、三炁之文，由上帝真仙宣演而傳下世；又稱修煉之道必本乎養炁存神、逐物去虑，而後氣凝神化、物絕虑融，復乎溟涬混沌之始。宇初此序，與程公端《後序》並為大洞經之重要文獻。</p><p><strong>所出</strong>：《上清大洞真經 · 結尾》 — https://zh.wikisource.org/wiki/上清大洞真經/結尾</p></article></main></div></div>
