    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 登廣寒</nav></header><main><article><h1>登廣寒</h1><p>修煉功成登於廣寒之境。</p><p>廣寒者，月宮之名，《[[淮南子]]》嘗及之。[[黃庭]]家以廣寒喻虛無清淨之境，修真者由漱咽靈液而[[體生光華]]，由光華而邪疾不干，由是煉顏成真，則登廣寒可期。廣寒非實有月闕，乃[[道]]之清涼無染之境，故[[成真]]而後，晝夜不寐，[[煉己待陽生]]之義在其中矣。</p><p><strong>所出</strong>：《黃庭內景經 · 口為章第三》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/口為章第三</p></article></main></div></div>
