    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 明主好要闇主好詳</nav></header><main><article><h1>明主好要闇主好詳</h1><p>明主抓大要，闇主事必躬親，功效天壤。</p><p>明主好要，而闇主好詳。主好要則百事詳，主好詳則百事荒。主能治近則遠者理，主能治明則幽者化，主能當一則百事正。兼聽天下，日有餘而治不足者，是治之極也。既能治近又務治遠，既能治明又務見幽，是過者也，過猶不及也。</p><p><strong>所出</strong>：《荀子 · 王霸篇》 — https://zh.wikisource.org/wiki/荀子/王霸篇</p></article></main></div></div>
