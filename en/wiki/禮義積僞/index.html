    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 禮義積僞</nav></header><main><article><h1>禮義積僞</h1><p>禮義法度生於聖人之僞，非故生於人之性。</p><p>夫陶人埏埴而生瓦，然則瓦埴豈陶人之性也哉？工人斲木而生器，然則器木豈工人之性也哉？夫聖人之於禮義也，辟則陶埏而生之也，然則禮義積僞者，豈人之本性也哉？[[天行有常]]，性者天就；[[人為]]，僞者功積。聖人之所生禮義法度，乃積思慮、習人為之功，非性中本有也。</p><p><strong>所出</strong>：《荀子 · 性惡篇》 — https://zh.wikisource.org/wiki/荀子/性惡篇</p></article></main></div></div>
