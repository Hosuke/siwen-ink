    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 無彝酒</nav></header><main><article><h1>無彝酒</h1><p>不可常常酣飲，常酒非德，必至於乱。</p><p>無彝酒者，禁民常常酣飲之誡命也。原文云：「文王誥教小子：有正、有事，無彝酒。」言文王教誨小子及有官守者，彝，常也；不可常常饮酒。夫常酒則亂德，亂德則喪亡隨之。此誡也，非徒禁民，實治國之要道、化民之切務也。</p><p><strong>所出</strong>：《尚書 · 酒誥》 — https://zh.wikisource.org/wiki/尚書/酒誥</p></article></main></div></div>
