    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 萬物皆一</nav></header><main><article><h1>萬物皆一</h1><p>自同者視之，肝膽如楚越，亦若一也。</p><p>仲尼語常季曰：「自其異者視之，肝膽楚越也；自其同者視之，萬物皆一也。」言觀物之異，則肝膽相去若楚越之遠；觀物之同，則萬物本無不同，皆一而已。</p><p><strong>所出</strong>：《莊子 · 德充符》 — https://zh.wikisource.org/wiki/莊子/德充符</p></article></main></div></div>
