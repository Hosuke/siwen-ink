    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 王在在鎬</nav></header><main><article><h1>王在在鎬</h1><p>鎬京為武王故居，君子思古以刺今</p><p>「王在在鎬」，《魚藻》言王居鎬京也。鎬京，武王所都，在今西安。幽王都鎬，君子思武王之盛，而傷幽王之衰，故云「思古之武王」。</p><p>魚樂於藻，則無往而不樂；王居於鎬，則無時而不安。然幽王不能師法武王，[[幽王之失德|失德以自敗]]，雖居鎬京，無異於夷狄。是以君子[[思古君子|思古之君子]]，欲其以武王為法也。</p><p><strong>所出</strong>：《詩經 · 魚藻》 — https://zh.wikisource.org/wiki/詩經/魚藻</p></article></main></div></div>
