    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 見形為容，象體為貌</nav></header><main><article><h1>見形為容，象體為貌</h1><p>觀人之形貌以知其情</p><p>見形為容，象體為貌者，謂爻為之生也。可以影響形容象貌而得之也。</p><p>有守之人，目不視非，耳不聽邪，言必詩書，行不僻淫，以道為形、以德為容，貌莊色溫，不可象貌而得也。如是，隱情塞郄而去之。</p><p><strong>所出</strong>：《鬼谷子 · 卷03》 — https://zh.wikisource.org/wiki/鬼谷子/卷03</p></article></main></div></div>
