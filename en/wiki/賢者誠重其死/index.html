    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 賢者誠重其死</nav></header><main><article><h1>賢者誠重其死</h1><p>賢人重死，非畏生，乃不失其志也。</p><p>太史公論季布、欒布曰：「賢者誠重其死。」夫婢妾賤人，感慨自裁，非能勇也，計畫無復之耳。賢者則不然：不死於非義，不辱於渠魁；死則死爾，守義不回。故季布不死於奴隸，終爲名將；欒布不辭於鼎鑊，直言以悟主。皆知死之不可輕擲，亦不可苟免，是以身隕而名揚，千載之下，凜凜如生。</p><p><strong>所出</strong>：《史記 · 卷100》 — https://zh.wikisource.org/wiki/史記/卷100</p></article></main></div></div>
