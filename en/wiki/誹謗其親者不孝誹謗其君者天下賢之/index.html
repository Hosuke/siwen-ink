    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 誹謗其親者不孝，誹謗其君者天下賢之</nav></header><main><article><h1>誹謗其親者不孝，誹謗其君者天下賢之</h1><p>世俗毀其親者為不孝，而譽堯舜湯武者反被天下賢之，是非顛倒。</p><p>夫為人子而常譽他人之親曰「某子之親，夜寢早起，強力生財以養子孫臣妾」，是誹謗其親者也。為人臣常譽先王之德厚而願之，是誹謗其君者也。</p><p>非其親者知謂之不孝，而非其君者天下皆賢之，此所以亂也。[[孝弟忠順]]之說旣行，而[[堯舜湯武反君臣之義]]之實乃蔽，人臣旣挾此說以為名，則篡弒之禍無以禁之矣。</p><p><strong>所出</strong>：《韓非子 · 忠考》 — https://zh.wikisource.org/wiki/韓非子/忠考</p></article></main></div></div>
