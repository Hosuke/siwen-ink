    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 齊人選女樂遺魯</nav></header><main><article><h1>齊人選女樂遺魯</h1><p>齊國選美女樂人送給魯國以亂政。</p><p>齊人聞而懼，曰：「孔子為政必霸，霸則吾地近焉，我之為先并矣。盍致地焉？」黎鉏曰：「請先嘗沮之；沮之而不可則致地，庸遲乎！」於是選齊國中女子好者八十人，皆衣文衣而舞康樂，文馬三十駟，遺魯君。此齊人欲以女樂亂魯政也。</p><p><strong>所出</strong>：《史記 · 卷047》 — https://zh.wikisource.org/wiki/史記/卷047</p></article></main></div></div>
