    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 制人者握權，制於人者失命</nav></header><main><article><h1>制人者握權，制於人者失命</h1><p>能制人者握權，被制者失命</p><p>道貴制人，不貴制於人也。制人者握權，制於人者失命。</p><p>是以見形為容、象體為貌，聞聲知音，解仇鬥郄，綴去卻語，攝心守義，皆所以制人之術也。</p><p><strong>所出</strong>：《鬼谷子 · 卷03》 — https://zh.wikisource.org/wiki/鬼谷子/卷03</p></article></main></div></div>
