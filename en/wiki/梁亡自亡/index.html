    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 梁亡，自亡也</nav></header><main><article><h1>梁亡，自亡也</h1><p>梁亡乃自取滅亡，非有外力加之。</p><p>梁亡。自亡也。湎於酒，淫於色，心昏，耳目塞；上無正長之治，大臣背叛，民為寇盜。梁亡，自亡也。如加力役焉，湎不足道也。梁亡，鄭棄其師，我無加損焉，正名而已矣！</p><p>《穀梁》明言梁之亡，非外力所致，乃其君沉湎酒色、朝政昏昧所致。經文但記「梁亡」二字，不加以貶辭，正所以見其自取滅亡之實也。又言「正名」者，辨其責在己身耳。</p><p><strong>所出</strong>：《春秋穀梁傳 · 僖公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/僖公</p></article></main></div></div>
