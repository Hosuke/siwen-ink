    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 孔子遂行</nav></header><main><article><h1>孔子遂行</h1><p>孔子因魯國怠政而去魯周遊。</p><p>孔子遂行，宿乎屯。而師己送，曰：「夫子則非罪。」孔子曰：「吾歌可夫？」歌曰：「彼婦之口，可以出走；彼婦之謁，可以死敗。蓋優哉游哉，維以卒歲！」師己反，桓子曰：「孔子亦何言？」師己以實告。桓子喟然嘆曰：「夫子罪我以群婢故也夫！」此孔子去魯之事也。</p><p><strong>所出</strong>：《史記 · 卷047》 — https://zh.wikisource.org/wiki/史記/卷047</p></article></main></div></div>
