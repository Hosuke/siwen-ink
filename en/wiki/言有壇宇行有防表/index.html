    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 言有壇宇行有防表</nav></header><main><article><h1>言有壇宇行有防表</h1><p>君子言有疆界，行有防限，道守一隆而不移。</p><p>言有壇宇行有防表，出《荀子 · 儒效篇》。篇末云：「君子言有壇宇，行有防表，道有一隆。」</p><p>言道德之求，不下於安存；言志意之求，不下於上；言道德之求，不二後王。道過三代謂之蕩，法二後王謂之不雅。高之下之，小之臣之，不外是矣，是君子之所以騁志意於壇宇宮廷也。</p><p>故諸侯問政不及安存，則不告也；匹夫問學不及為士，則不教也；百家之說不及後王，則不聽也。</p><p><strong>所出</strong>：《荀子 · 儒效篇》 — https://zh.wikisource.org/wiki/荀子/儒效篇</p></article></main></div></div>
