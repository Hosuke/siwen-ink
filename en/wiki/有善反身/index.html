    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 有善反身</nav></header><main><article><h1>有善反身</h1><p>有過反之於身，有善歸之於民；往怒民，來驕身，此桀紂所以失身。</p><p>管子言：「今夫桀、紂不然，有善則反之於身，有過則歸之於民。歸之於民則民怒，反之於身則身驕。往怒民，來驕身，此其所以失身也。」與[[善罪身]]之義相對。[[稱身之過]]者昌，反之者亡，其理昭然。</p><p><strong>所出</strong>：《管子 · 第32篇小稱》 — https://zh.wikisource.org/wiki/管子/第32篇小稱</p></article></main></div></div>
