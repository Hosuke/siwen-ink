    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 陶復陶宂</nav></header><main><article><h1>陶復陶宂</h1><p>古公亶父居於地穴土竇之中也。</p><p>古公亶父，陶復陶宂，未有家室。</p><p>復者，覆也。宂，竇也。陶穴而居，以避燥濕，尚未有堂室之制也。</p><p><strong>所出</strong>：《詩經 · 緜》 — https://zh.wikisource.org/wiki/詩經/緜</p></article></main></div></div>
