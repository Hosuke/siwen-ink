    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 永以為好</nav></header><main><article><h1>永以為好</h1><p>投報之旨，在結永久之好呢</p><p>《木瓜》三章，反覆致意於「永以為好」。</p><p>投我以木瓜，報之以瓊琚，匪報也，永以為好也。</p><p>永者，長久也；好者，親善也。詩人受人之物雖微，而所以還之者厚，非不知玉石之值，蓋欲借是以表區區之誠，而求情誼之長也。匪報之報，報在何處？報在「永以為好」四字而已。施者出於一時之惠，而報者欲結百年之好，其情深，其義遠矣。</p><p>此 [[匪報也]] 之旨，而詩人所以丁寧反覆而不厭者也。</p><p><strong>所出</strong>：《詩經 · 木瓜》 — https://zh.wikisource.org/wiki/詩經/木瓜</p></article></main></div></div>
