    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 樂者治人之盛者</nav></header><main><article><h1>樂者治人之盛者</h1><p>音樂為治民之盛器，故墨子非之而君子明之。</p><p>樂者，治人之盛者也，而墨子非之。且樂也者，和之不可變者也；禮也者，理之不可易者也。樂合同，禮別異。禮樂之統，管乎人心矣。窮本極變，樂之情也；著誠去偽，禮之經也。墨子非之，幾遇刑也。明王已没，莫之正也。愚者學之，危其身也。君子明樂，乃其德也。</p><p><strong>所出</strong>：《荀子 · 樂論篇》 — https://zh.wikisource.org/wiki/荀子/樂論篇</p></article></main></div></div>
