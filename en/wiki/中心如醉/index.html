    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 中心如醉</nav></header><main><article><h1>中心如醉</h1><p>中心昏沉如醉，悲不能言。</p><p>次章云「中心如醉」。醉者，神志昏沉，不能自主之貌。較之首章「中心搖搖」，悲痛加劇。詩人往來徘徊，觸目皆是亡國之景，心神恍惚，如醉酒之人，無復清明。以見家國之亡，其痛入人深也。</p><p><strong>所出</strong>：《詩經 · 黍離》 — https://zh.wikisource.org/wiki/詩經/黍離</p></article></main></div></div>
