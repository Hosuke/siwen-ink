    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 復文武之境土</nav></header><main><article><h1>復文武之境土</h1><p>宣王收復文王武王舊有之疆域。</p><p>厲王之世，諸侯背叛，疆土日蹙。宣王起而振之，內修政事，外攘夷狄，復會諸侯于東都，因田獵而選車徒。積年之力，遂復文武之境土。《車攻》詩序明言「復文武之境土」，是宣王一代之大功也。</p><p><strong>所出</strong>：《詩經 · 車攻》 — https://zh.wikisource.org/wiki/詩經/車攻</p></article></main></div></div>
