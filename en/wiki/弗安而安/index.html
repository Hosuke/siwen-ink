    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 弗安而安</nav></header><main><article><h1>弗安而安</h1><p>不言可安則周自安</p><p>杜赫以安天下說周昭文君，文君曰：「願學所以安周。」赫對曰：「臣之所言不可，則不能安周；臣之所言可，則周自安矣。」不言安而天下自安，此[[大制無割]]之道也。</p><p><strong>所出</strong>：《淮南子 · 道應訓》 — https://zh.wikisource.org/wiki/淮南子/道應訓</p></article></main></div></div>
