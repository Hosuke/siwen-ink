    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 通天下一氣</nav></header><main><article><h1>通天下一氣</h1><p>生死一氣之聚散，聖人貴一。</p><p>黃帝曰：「生也死之徙，死也生之始，孰知其紀！人之生，氣之聚也；聚則為生，散則為死。若死生為徙，吾又何患！故萬物一也。是其所美者為神奇，其所惡者為臭腐。臭腐復化為神奇，神奇復化為臭腐。」</p><p>故通天下一氣耳。聖人故貴一。生死之化，特氣之往來爾。</p><p><strong>所出</strong>：《莊子 · 知北遊》 — https://zh.wikisource.org/wiki/莊子/知北遊</p></article></main></div></div>
