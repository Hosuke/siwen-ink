    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 孝行大小</nav></header><main><article><h1>孝行大小</h1><p>孝有三等，入孝出弟為小行，上順下篤為中行，從道從義為大行。</p><p>入孝出弟，人之小行也；上順下篤，人之中行也；從道不從君，從義不從父，人之大行也。若夫志以禮安，言以類使，則儒道畢矣，雖舜，不能加毫末於是矣。</p><p>孝道之等，以心志高下為準。徒盡灑掃應對之節，不過小節；能事上接下，不過中材；唯本道義而行，不以區區從命為孝，斯為大孝。孔子之言，視孝非盲從父母之命，而在乎義理之從違。此與[[從道不從君]]之義相發也。</p><p><strong>所出</strong>：《荀子 · 子道篇》 — https://zh.wikisource.org/wiki/荀子/子道篇</p></article></main></div></div>
