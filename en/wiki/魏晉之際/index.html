    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 魏晉之際</nav></header><main><article><h1>魏晉之際</h1><p></p><p>洪生於吳晉之際，遭逢世亂。會稽陷後，博簡秉文經武之才，朝野僉然推之。時年十五、六所作詩賦雜文，自謂可行於代；至弱冠更省之，殊多不稱意。</p><p>  <strong>所出</strong>：《抱朴子 · 卷52》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷52</p></article></main></div></div>
