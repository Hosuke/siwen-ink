    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 君子治治，非治亂也</nav></header><main><article><h1>君子治治，非治亂也</h1><p>君子治禮義之治，非治非禮義之亂。</p><p>君子治治，非治亂也。禮義之謂治，非禮義之謂亂也。故君子者，治禮義者也，非治非禮義者也。</p><p>然則國亂將弗治與？曰：國亂而治之者，非案亂而治之之謂也，去亂而被之以治；人汙而修之者，非案汙而修之之謂也，去汙而易之以修。故去亂而非治亂也，去汙而非修汙也。治之爲名，猶曰君子爲治而不爲亂，爲修而不爲汙也。</p><p><strong>所出</strong>：《荀子 · 不苟篇》 — https://zh.wikisource.org/wiki/荀子/不苟篇</p></article></main></div></div>
