    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 辯之三等</nav></header><main><article><h1>辯之三等</h1><p>聖人、士君子、小人，辯有三等，判然有別。</p><p>有小人之辯者，有士君子之辯者，有聖人之辯者：不先慮，不早謀，發之而當，成文而類，居錯遷徙，應變不窮，是聖人之辯者也；先慮之，早謀之，斯須之言而足聽，文而致實，博而黨正，是士君子之辯者也；聽其言則辭辯而無統，用其身則多詐而無功，上不足以順明王，下不足以和齊百姓，然而口舌之均，噡唯則節，足以為奇偉偃卻之屬，是小人之辯也。</p><p><strong>所出</strong>：《荀子 · 非相篇》 — https://zh.wikisource.org/wiki/荀子/非相篇</p></article></main></div></div>
