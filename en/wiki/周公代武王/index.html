    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 周公代武王</nav></header><main><article><h1>周公代武王</h1><p>周公欲以身代武王受疾，而祈于先王。</p><p>周武王克商二年有疾，周公欲以身代。乃自以為功，設三壇同墠，植璧秉珪，北面而立，告于太王、王季、文王。史乃冊祝曰：「爾元孫某，遘厲虐疾。若爾三王，是有丕子之責于天，以旦代某之身。予仁若考，能多材多藝，能事鬼神。乃元孫不若旦多材多藝，不能事鬼神。乃命于帝庭，敷佑四方，用能定爾子孫于下地。」祝既已，納冊于金縢之匱中。明日，王瘳。</p><p><strong>所出</strong>：《尚書 · 金縢》 — https://zh.wikisource.org/wiki/尚書/金縢</p></article></main></div></div>
