    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 流連之遊荒亡之行</nav></header><main><article><h1>流連之遊荒亡之行</h1><p>流連者，從下歷時而不反；荒亡者，從樂而不歸。聖王無此二者。</p><p>晏子別遊豫於流連、荒亡。從下歷時而不反，謂之流；從高歷時而不反，謂之連；從獸而不歸，謂之荒；從樂而不歸，謂之亡。古者聖王無流連之遊、荒亡之行。流連荒亡，非遊也，乃遊之失也。</p><p>流連與荒亡，皆失先王之義。為人君者，不可不察。</p><p><strong>所出</strong>：《晏子春秋 · 卷四》 — https://zh.wikisource.org/wiki/晏子春秋/卷四</p></article></main></div></div>
