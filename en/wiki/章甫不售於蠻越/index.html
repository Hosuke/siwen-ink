    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 章甫不售於蠻越</nav></header><main><article><h1>章甫不售於蠻越</h1><p></p><p>抱朴子云：「章甫不售於蠻越，赤舄不用於跣夷，何可強哉？」章甫者，儒者祭冠之名；赤舄者，天子諸侯之履。蠻越之人跣足無履，章甫無所用之。抱朴子借此以喻：道意遠而難識，達之者寡，雖有至道，弗能強俗人使信之也。</p><p>又云：「彼誠以天下之必無仙，而我獨以實有而與之諍，諍之彌久，而彼執之彌固，是虛長此紛紜，而無救於不解，果當從連環之義乎？」言與不信者辯，徒增紛擾，無益於事。此抱朴子深慨信道之難，知者寡而惑者眾，雖有金玉之論，終不能曉固蔽之人也。</p></article></main></div></div>
