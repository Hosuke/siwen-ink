    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 民無信不立</nav></header><main><article><h1>民無信不立</h1><p>為政之本在於信，民不信則國不立。</p><p>子貢問政。子曰：「足食，足兵，民信之矣。」子貢必不得已而去，於斯三者何先？曰：「去兵。」去兵矣，於斯二者何先？曰：「去食。自古皆有死，民無信不立。」</p><p>信之於民，重於食兵。民有信，雖危可持；民無信，雖富必亡。[[足食足兵民信]]之三者，信居其末而為本。</p><p><strong>所出</strong>：《論語 · 顏淵第十二》 — https://zh.wikisource.org/wiki/論語/顏淵第十二</p></article></main></div></div>
