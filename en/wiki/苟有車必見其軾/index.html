    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 苟有車必見其軾</nav></header><main><article><h1>苟有車必見其軾</h1><p></p><p>《禮記·緇衣》載：「苟有車，必見其軾；苟有衣，必見其敝；人苟或言之，必聞其聲；苟或行之，必見其成。」又引《葛覃》云：「服之無射。」</p><p>此節以車輿衣裳為喻，闡明言行相須之理。車有則有軾，衣穿則有敝，言發則有聲，行施則有成：四者相因，不可分離。聖賢論學，必貴言行相符；修己治人，首重表裏如一。</p><p>苟有車而無軾，車不成其為車；苟有言而無行，言不成其為言。是以君子言之於口，行之於身，終始一貫，表裏相副。《詩》云「服之無射」，言苟能言行相應，則其德之盛，有非朝夕可盡者矣。</p></article></main></div></div>
