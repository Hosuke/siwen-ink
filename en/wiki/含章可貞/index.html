    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 含章可貞</nav></header><main><article><h1>含章可貞</h1><p></p><p>坤六三曰：「含章，可貞。或從王事，无成有終。」</p><p>  坤象曰：「含章可貞，以時發也。或從王事，知光大也。」</p><p>  坤文言曰：「陰雖有美，含之。以從王事，弗敢成也。地道也，妻道也，臣道也。地道无成，而代有終也。」</p><p>  言陰含文明之美，時而後發。從事於王，不敢居成功，但求善終。此地道、臣道之義，柔順而無成，以終為貴也。</p><p>  <strong>所出</strong>：《周易 · 坤》 — https://zh.wikisource.org/wiki/周易/坤</p></article></main></div></div>
