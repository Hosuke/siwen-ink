    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 季夏行春令</nav></header><main><article><h1>季夏行春令</h1><p>季夏行春令則穀實鮮落，行秋令則丘隰水潦禾稼不熟，行冬令則風寒不時。</p><p>季夏行春令，則穀實鮮落，國多風欬，民乃遷徙。行秋令，則丘隰水潦，禾稼不熟，乃多女災。行冬令，則風寒不時，鷹隼蚤鷙，四鄙入保。</p><p><strong>所出</strong>：《禮記 · 月令》 — https://zh.wikisource.org/wiki/禮記/月令</p></article></main></div></div>
