    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 天道之序</nav></header><main><article><h1>天道之序</h1><p>曆法本天道，聖人因而正之。</p><p>昔自在古，曆建正作於孟春。於時冰泮發蟄，百草奮興，秭鳺先滜。物廼歲具，生於東，次順四時，卒于冬分，時雞三號，卒明。撫十二節，卒于丑。日月成，故明也。明者孟也，幽者幼也，幽明者雌雄也。雌雄代興，而順至正之統也。日歸于西，起明於東；月歸於東，起明于西。正不率天，又不由人，則凡事易壞而難成矣。</p><p>王者易姓受命，必慎始初，改正朔，易服色，推本天元，順承厥意。</p><p><strong>所出</strong>：《史記 · 卷026》 — https://zh.wikisource.org/wiki/史記/卷026</p></article></main></div></div>
