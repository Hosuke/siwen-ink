    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 數戰數勝亡</nav></header><main><article><h1>數戰數勝亡</h1><p>數戰民疲，數勝主驕，驕主疲民必亡</p><p>李克答魏武侯曰：「吳數戰而數勝，然而亡者，何也？數戰則民疲，數勝則主驕。以驕主使疲民，而國不亡者，天下鮮矣。」此[[功成名遂]]之反義。</p><p><strong>所出</strong>：《淮南子 · 道應訓》 — https://zh.wikisource.org/wiki/淮南子/道應訓</p></article></main></div></div>
