    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 俾侯于魯</nav></header><main><article><h1>俾侯于魯</h1><p>周成王命周公長子伯禽為魯侯，俾魯為周室輔翼。</p><p>詩云「王曰叔父，建爾元子，俾侯于魯。大啟爾宇，為周室輔」，又云「乃命魯公，俾侯于東。錫之山川，土田附庸」。蓋武王崩，成王幼，周公攝政，遣其元子伯禽就封於魯。周公為成王叔父，故詩稱成王為王，而稱周公為叔父焉。</p><p>魯既受封，兼有泰山以南之地，土田廣遠，附庸殷民，為周室東藩之重鎮。周公封魯，兼用天子禮樂，於諸侯中禮制最崇，故詩頌之。</p><p><strong>所出</strong>：《詩經 · 閟宮》 — https://zh.wikisource.org/wiki/詩經/閟宮</p></article></main></div></div>
