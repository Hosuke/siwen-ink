    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 生之徒十有三</nav></header><main><article><h1>生之徒十有三</h1><p>人之生死，稟分有定，夭壽莫非自然。</p><p>天生萬物，人受其一氣。民之稟命，長短各有定分，猶物之有成毀也。世人不明此理，徒知厚養以祈永年，不知稟分既定，不可強延。養生之道，在乎守其分、順其自然，不以嗜欲敗本、不以巧智傷真。若是者，雖不刻意求生，而生可全；彼求生太厚者，動之死地，雖欲不死，不可得矣。</p><p><strong>所出</strong>：《老子河上公章句 · 貴生》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
