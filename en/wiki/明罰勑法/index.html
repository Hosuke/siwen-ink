    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 明罰勑法</nav></header><main><article><h1>明罰勑法</h1><p>雷電之象，明示賞罰，昭勑法度。</p><p>噬嗑之象，雷電交作，先王觀之以明罰勑法。雷電者，威而明也；罰與法相須以行，故威以懾人，明以示人，動而萬物咸睹焉。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷03》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷03</p></article></main></div></div>
