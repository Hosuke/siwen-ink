    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 勢治勢亂</nav></header><main><article><h1>勢治勢亂</h1><p>堯舜在上十桀紂不能亂者，勢治也；桀紂在上十堯舜不能治者，勢亂也。</p><p>堯舜生而在上位，雖有十桀紂不能亂者，是勢治也。桀紂亦生而在上位，雖有十堯舜而亦不能治者，是勢亂也。故曰：「勢治者則不可亂，而勢亂者則不可治也。」此自然之勢也，非人之所得設也。</p><p>若吾所言，乃人之所得設者，則賢者亦有事焉耳。[[威勢人主之筋力]]，善用之則治，不善用之則亂，要在[[因可勢求易道]]而已。</p><p><strong>所出</strong>：《韓非子 · 難勢》 — https://zh.wikisource.org/wiki/韓非子/難勢</p></article></main></div></div>
