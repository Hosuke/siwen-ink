    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 名號大顯必繇其道</nav></header><main><article><h1>名號大顯必繇其道</h1><p>名號不可以彊求，必由其道而得。</p><p>名號大顯，不可彊求，必繇其道。</p><p>治物者不於物於人，治人者不於事於君，治君者不於君於天子，治天子者不於天子於欲，治欲者不於欲於性。性者萬物之本也，不可長，不可短，因其固然而然之，此天地之數也。</p><p>[[名正而法順]]，[[循名責實]]，皆由此出。名不可以偽致，功不可以幸成，必也循道而為之。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十四》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十四</p></article></main></div></div>
