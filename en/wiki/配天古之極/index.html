    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 配天古之極</nav></header><main><article><h1>配天古之極</h1><p>不爭用人，合於天道古聖之至。</p><p>是謂配天古之極。配天者，配天之道而行之；古之極者，上古聖人之極則也。河上公注：聖人德配天地，道古今極，言此四善乃至德之原，上與天道相配，下合古聖之則。[[不爭之德]]合天，[[用人之力]]由於[[善用人者為之下]]。不武、不怒、不與、不自居尊，是皆[[天道無親]]之驗。聖人以此治世，則天下國家可得也。</p><p><strong>所出</strong>：《老子河上公章句 · 配天》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
