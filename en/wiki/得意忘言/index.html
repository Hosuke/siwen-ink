    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 得意忘言</nav></header><main><article><h1>得意忘言</h1><p>荃以得魚，蹄以得兔，言以得意，既得之則言可忘。</p><p>荃者所以在魚，得魚而忘荃；蹄者所以在兔，得兔而忘蹄；言者所以在意，得意而忘言。吾安得夫忘言之人而與之言哉！</p><p>夫言者所以傳意也，意既得而言可以忘。[[莊子]]之意，在乎得意而忘言。此[[大宗師]] 所謂「得者，時也；失者，順也」之旨，亦[[虛室生白]] 之義。蓋言如荃蹄，特渡河之具；意乃所至之彼岸。登岸則荃蹄俱忘，得意則言論皆遣。</p><p><strong>所出</strong>：《莊子 · 外物》 — https://zh.wikisource.org/wiki/莊子/外物</p></article></main></div></div>
