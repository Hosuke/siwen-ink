    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 毀訾誹謗</nav></header><main><article><h1>毀訾誹謗</h1><p>臣有善言而見疑，則小者以為毁謗，大者致祸死亡及其身。言之為患，烈於戈矛也。</p><p>大王若以此不信，則小者以為毁訾誹謗，大者患禍災害死亡及其身。</p><p><strong>所出</strong>：《韓非子 · 難言》 — https://zh.wikisource.org/wiki/韓非子/難言</p></article></main></div></div>
