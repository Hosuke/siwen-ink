    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 譜籍簿錄</nav></header><main><article><h1>譜籍簿錄</h1><p>譜籍簿錄，書記之一體，掌世系戶籍之書。</p><p>書記廣大，總領黎庶，則有[[譜籍簿錄]]。</p><p>故謂譜者，普也。注序世統，事資周普，鄭氏譜《詩》，蓋取乎此。籍者，借也。歲借民力，條之於版，[[春秋司籍]]，即其事也。簿者，圃也。草木區別，文書類聚，[[張湯]][[李廣]]，為吏所簿，別情偽也。錄者，領也。古史世本，編以簡策，領其名數，故曰錄也。</p><p><strong>所出</strong>：《文心雕龍 · 書記》 — https://zh.wikisource.org/wiki/文心雕龍/書記</p></article></main></div></div>
