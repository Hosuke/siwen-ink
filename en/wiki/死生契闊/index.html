    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 死生契闊</nav></header><main><article><h1>死生契闊</h1><p>生死不離，合約已成，執手偕老，室家之誓。</p><p>「死生契闊，與子成說，執子之手，與子偕老。」</p><p>契闊，離合也。言生死離合，吾與子已成約說，執子之手，與子偕老。[[毛傳]]云：「契闊，勤苦也。」[[三家詩]]則以為軍中將帥之約。[[鄭箋]]以為室家之誓。[[朱熹]][[詩集傳]]云：「言死生离合，皆與子相成說。」</p><p>此八句為千古伉儷之情辭，後世言伉儷生死之約者，皆祖此詩。</p><p><strong>所出</strong>：《詩經 · 擊鼓》 — https://zh.wikisource.org/wiki/詩經/擊鼓</p></article></main></div></div>
