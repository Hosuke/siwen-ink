    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 知彌精取彌精</nav></header><main><article><h1>知彌精取彌精</h1><p>智越精則所取越精，器識各以其類相應。</p><p>今以百金與摶黍以示兒子，兒子必取摶黍矣；以龢氏之璧與百金以示鄙人，鄙人必取百金矣；以龢氏之璧、道德之至言以示賢者，賢者必取至言矣。</p><p>其知彌精，其所取彌精；其知彌觕，其所取彌觕。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十</p></article></main></div></div>
