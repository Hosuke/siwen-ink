    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 貽我握椒</nav></header><main><article><h1>貽我握椒</h1><p>女子以椒貽男子以致情</p><p>貽我握椒，女子以椒遺男子也。椒者，香木也，古人用以辟邪致祥，又為多子之象。握椒者，懷持數椒以為貽遺。</p><p>《詩》云「視爾如荍，貽我握椒」，上句是男子視女子之美如荍華，下句是女子以椒遺男子以致情。蓋相悅者互以致意，椒香且多子，女子以此為貽，正合情好之意也。《陳風》此章，正言男女相悅之情，而序所謂「歌舞於市井」者，實本於此。</p><p><strong>所出</strong>：《詩經 · 東門之枌》 — https://zh.wikisource.org/wiki/詩經/東門之枌</p></article></main></div></div>
