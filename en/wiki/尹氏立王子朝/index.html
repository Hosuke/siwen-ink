    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 尹氏立王子朝</nav></header><main><article><h1>尹氏立王子朝</h1><p>尹氏立王子朝，不宜立而立，穀梁以為嫌，故不名以別之。</p><p>尹氏立王子朝。</p><p>傳曰：「立者，不宜立者也。朝之不名，何也？別嫌乎尹氏之朝也。」王子朝以庶篡嫡，不當立，尹氏擅立之，皆非正。穀梁氏書而不名，以別於正嗣，示其不宜也。</p><p><strong>所出</strong>：《春秋穀梁傳 · 昭公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/昭公</p></article></main></div></div>
