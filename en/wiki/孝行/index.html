    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 孝行</nav></header><main><article><h1>孝行</h1><p>孝為百行原，孝於心者，愛慕見天眞。</p><p>百行孝為先，文祖能行孝，馨香萬萬年。成道即成仙，成仙即成聖，成聖即兼賢。孝為百行原，虞舜孝在明揚前，周文孝居令聞先，曾子事親獨大，閔子事母獨殷。古來孝子各有所長，皆賢哲之流。孝分行與心：中孝孝在身，奉養殷勤；至孝孝在心，愛慕天眞。口中雖孝不能行，面上妝孝欺人欺親，皆非眞孝。孝德無窮，一念一分，[[孝子敬父母]]，[[孝始於事親]]之道也。</p><p><strong>所出</strong>：《張三丰先生全集 · 卷6》 — https://zh.wikisource.org/wiki/張三丰先生全集/卷6</p></article></main></div></div>
