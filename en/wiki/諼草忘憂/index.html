    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 諼草忘憂</nav></header><main><article><h1>諼草忘憂</h1><p>諼草一名萱草，植之可以忘憂也。</p><p>「焉得諼草？言樹之背」，語出《伯兮》。諼草，即萱草也，又名忘憂草。言欲得此草，樹之北堂，庶幾忘思伯之苦也。古者北堂為母之所居，植萱於北堂，亦古人貽母忘憂之意。</p><p>《說文》：「諼，忘也。」蓋此草可使人忘憂，故名諼草。</p><p>後世以「萱堂」「萱椿」稱父母居處，以「忘憂」為解愁之代稱，皆本此詩。</p><p><strong>所出</strong>：《詩經 · 伯兮》 — https://zh.wikisource.org/wiki/詩經/伯兮</p></article></main></div></div>
