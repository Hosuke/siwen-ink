    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 湯以寬亡</nav></header><main><article><h1>湯以寬亡</h1><p>夏以嚴急亡，湯以敬德恤民興；後王當以湯為法。</p><p>惟夏之恭多士，大不克明保享于民，乃胥惟虐于民；至於百為，大不克開。天乃大降顯休命于成湯，刑殄有夏。湯之興也，非以兵強也，寬以得民，敬以事神，慎厥麗于勸，厥民刑，用勸。是以明德慎罰，要囚殄戮亦克用勸，開釋無辜亦克用勸，上下明焉。厥後王惟耽逸，乃不克承之。戒之哉：以湯為法，則興；以夏為戒，則亡。</p><p><strong>所出</strong>：《尚書 · 多方》 — https://zh.wikisource.org/wiki/尚書/多方</p></article></main></div></div>
