    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 班相恤也</nav></header><main><article><h1>班相恤也</h1><p>諸侯之患，諸侯當相恤恤，此所以訓民也。</p><p>晉人執衛成公，臧文仲言於僖公曰：「夫衛君殆無罪矣。刑五而已，無有隱者。今晉人鴆衛侯不死，亦不討其使者，諱而惡殺之也。有諸侯之請，必免之。臣聞之：班相恤也，故能有親。夫諸侯之患，諸侯恤之，所以訓民也。君盍請衛君以示親於諸侯，且以動晉？」公說，行玉二十瑴，乃免衛侯。自是晉聘於魯，加於諸侯一等。</p><p><strong>所出</strong>：《國語 · 卷04》 — https://zh.wikisource.org/wiki/國語/卷04</p></article></main></div></div>
