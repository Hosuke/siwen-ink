    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 趙簡子論厥與鐸</nav></header><main><article><h1>趙簡子論厥與鐸</h1><p>尹鐸以愛君之過不自愛，趙簡子以之為賢。</p><p>趙簡子曰：「厥也愛我，鐸也不愛我。厥之諫我也，必於無人之所；鐸之諫我也，喜質我於人中，必使我醜。」尹鐸對曰：「厥也愛君之醜也，而不愛君之過也；鐸也愛君之過也，而不愛君之醜也。臣嘗聞相人於師，敦顏而土色者忍醜。不質君於人中，恐君之不變也。」此簡子之賢也。人主賢則人臣之言刻。簡子不賢，鐸也卒不居趙地，有況乎在簡子之側哉？</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十</p></article></main></div></div>
