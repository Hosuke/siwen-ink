    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 亢龍有悔</nav></header><main><article><h1>亢龍有悔</h1><p>貴而无位，高而无民，盈不可久，知進而不知退則有悔。</p><p>上九：亢龍，有悔。</p><p>亢之為言也，知進而不知退，知存而不知亡，知得而不知喪；其唯聖人乎？知進退存亡而不失其正者，其唯聖人乎！</p><p>象曰：亢龍有悔，盈不可久也。
文言曰：「亢龍有悔」，窮之災也。又曰：與時偕極。</p><p>貴而无位，高而无民，賢人在下位而无輔，是以動而有悔也。盈者必虧，極者必反，物理之常也。知進退存亡而不失其正者，其唯聖人乎？聖人知止，故无悔焉。</p><p><strong>所出</strong>：《周易 · 乾》 — https://zh.wikisource.org/wiki/周易/乾</p></article></main></div></div>
