    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 伐其條枚</nav></header><main><article><h1>伐其條枚</h1><p>伐木於堤，以喻婦之勤事其夫。</p><p>汝坟之詩，首章言「遵彼汝坟，伐其條枚」，蓋妇人循汝水之堤，伐取树枝者也。條，枝上也；枚，榦也。二章易言「伐其條肄」，肄者，伐後再生之枝也。伐條以待再萌，喻妇人辛勤無已，以待君子之歸。毛傳云「未見君子，惄如調飢」者，以伐木之勤，配思君子之切焉。</p><p><strong>所出</strong>：《詩經 · 汝坟》 — https://zh.wikisource.org/wiki/詩經/汝坟</p></article></main></div></div>
