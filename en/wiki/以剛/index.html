    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 以剛</nav></header><main><article><h1>以剛</h1><p>晉陽處父聘衛反過甯，寧嬴以剛釋《商書》之義，懼其不沒，卒從之。</p><p>晉陽處父聘于衛，反過甯，甯嬴從之，及溫而還。其妻問之，嬴曰：「以剛。《商書》曰：『沈漸剛克，高明柔克。』夫子壹之，其不沒乎！天為剛德，猶不于時，況在人乎！且華而不實，怨之所聚也。犯而聚怨，不可以定身。余懼不獲其利，而離其難，是以去之。」</p><p><strong>所出</strong>：《春秋左氏傳 · 文公》 — https://zh.wikisource.org/wiki/春秋左氏傳/文公</p></article></main></div></div>
