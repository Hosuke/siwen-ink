    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 主少母壯</nav></header><main><article><h1>主少母壯</h1><p>往古所以亂，由主少母壯；女主獨居驕蹇，莫能禁也。</p><p>武帝以其子昭帝年幼，其母鉤弋夫人方盛，恐後世女主挾外戚專恣，乃先遣死鉤弋夫人。帝嘗言於左右曰：「往古國家所以亂也，由主少母壯也。女主獨居驕蹇，淫亂自恣，莫能禁也。女不聞呂后邪？」故諸為武帝生子者，無男女，其母無不譴死。昭然遠見，為後世計慮，固非淺聞愚儒之所及也。</p><p><strong>所出</strong>：《史記 · 卷049》 — https://zh.wikisource.org/wiki/史記/卷049</p></article></main></div></div>
