    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 川竭山崩</nav></header><main><article><h1>川竭山崩</h1><p>國之將亡，必先川竭而山崩</p><p>伯陽父以陰陽之氣釋地震，以為「陽伏而不能出，陰迫而不能烝」，遂有三川之震。又言「陽失其所而鎮陰」，川源必塞，源塞則國亡。又推本曰：「昔伊、洛竭而夏亡，河竭而商亡。今周德若二代之季，其川源又塞，塞必竭。夫國必依山川，山崩川竭，亡之徵也。川竭，山必崩。」又斷之曰：「若國亡，不過十年，數之紀也。」是歲三川竭，岐山崩；十一年幽王滅，周東遷。</p><p><strong>所出</strong>：《國語 · 卷01》 — https://zh.wikisource.org/wiki/國語/卷01</p></article></main></div></div>
