    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 靡</nav></header><main><article><h1>靡</h1><p>靡者，漸染薰陶之功，化人之要術也。</p><p>身日進於仁義而不自知也者，靡使然也。今與不善人處，則所聞者欺誣詐僞，所見者汙漫淫邪貪利之行，身且加於刑戮而不自知者，靡使然也。傳曰：「不知其子視其友，不知其君視其左右。」靡而已矣，靡而已矣。[[靡]]者，漸染之功，[[師法之化]]之所以成，而[[為性惡之故|化性]]之所由著也。</p><p><strong>所出</strong>：《荀子 · 性惡篇》 — https://zh.wikisource.org/wiki/荀子/性惡篇</p></article></main></div></div>
