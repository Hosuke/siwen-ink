    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 商韓六蝨五蠹</nav></header><main><article><h1>商韓六蝨五蠹</h1><p>商鞅、韓非之學，猶六蝨五蠹。</p><p>至如商韓六蝨五蠹，棄孝廢仁，轘藥之禍，非虛至也。公孫之白馬孤犢，辭巧理拙，魏牟比之鴟鳥，非妄貶也。</p><p><strong>所出</strong>：《文心雕龍 · 諸子》 — https://zh.wikisource.org/wiki/文心雕龍/諸子</p></article></main></div></div>
