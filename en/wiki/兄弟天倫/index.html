    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 兄弟天倫</nav></header><main><article><h1>兄弟天倫</h1><p>兄弟之序，乃天定之倫，不可廢也。</p><p>隱公欲讓國於桓，《穀梁子》駁之曰：兄弟，天倫也。為子受之父，為諸侯受之君。己廢天倫而忘君父，以行小惠，曰小道也。兄弟之序，出於天倫，父子、君臣之義皆由此生。廢天倫而務讓，是亂上下之分，非道也。</p><p><strong>所出</strong>：《春秋穀梁傳 · 隱公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/隱公</p></article></main></div></div>
