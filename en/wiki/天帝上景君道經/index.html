    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 天帝上景君道經</nav></header><main><article><h1>天帝上景君道經</h1><p>大洞三十章以天帝上景君為宗，修之可與帝合靈。</p><p>大洞第三十章，題曰「金闕後聖太平李真人天帝上景君道經」。以太上消魔玉清王祝及天帝上景君為樞機。呪曰：「天生八炁，迴合帝鄉，五神奉符，司命扶將，拔斷死籍，盪穢幽冥，七世解結，延福玉庭。」修之者血積化清，昇登天堂，與帝合靈，生與天同壽。</p><p><strong>所出</strong>：《上清大洞真經 · 30章》 — https://zh.wikisource.org/wiki/上清大洞真經/30章</p></article></main></div></div>
