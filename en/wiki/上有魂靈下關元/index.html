    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 上有魂靈下關元</nav></header><main><article><h1>上有魂靈下關元</h1><p>述人身精魂與關元之位，兼及陰陽左右之配。</p><p>上有魂靈下關元，左為少陽右太陰，後有密戶前生門，出日入月呼吸存。</p><p>魂魄居上以主神，關元居下以凝炁。左側配少陽，右側配太陰，陰陽相對而為一身之樞。密戶在後以藏精，生門在前以通氣。日月出人，呼吸往來於其間。此脩真者存思之法，先辨方位，後守虛空，以成內觀之基也。</p><p><strong>所出</strong>：《黃庭內景經 · 上有章第二》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/上有章第二</p></article></main></div></div>
