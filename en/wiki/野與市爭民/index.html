    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 野與市爭民</nav></header><main><article><h1>野與市爭民</h1><p>治國當明分工，農事為本。</p><p>野與市爭民，家與府爭貨，金與粟爭貴，鄉與朝爭治。</p><p>故野不積草，農事先也；府不積貨，藏於民也；市不成肆，家用足也；朝不合衆，鄉分治也。</p><p>故野不積草，府不積貨，市不成肆，朝不合衆，治之至也。</p><p><strong>所出</strong>：《管子 · 第03篇權修》 — https://zh.wikisource.org/wiki/管子/第03篇權修</p></article></main></div></div>
