    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 獸逼彈琴</nav></header><main><article><h1>獸逼彈琴</h1><p>亂世用寬政，猶虎口彈琴，危亡立至。</p><p>[[抱朴子]]-{云}-：「夫骨填肉補之藥，長於養體益壽，而不可以救日曷溺之急也。務寬含垢之政，可以蒞敦御樸，而不可以拯衰弊之變也。虎狼見逼，不揮戈奮劍，而彈琴詠詩，吾未見其身可保也。燎火及室，不奔走灌註，而揖讓盤旋，吾未見其焚之自息也。」夫[[治世不一道]]，然[[事異則備變]]，時非清平，則峻法乃所以救弊，非可以常理論也。</p><p><strong>所出</strong>：《抱朴子 · 卷15》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷15
===終::</p></article></main></div></div>
