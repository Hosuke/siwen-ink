    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 大祥</nav></header><main><article><h1>大祥</h1><p>再期之祭，祥祭之成，逾月而禫者也。</p><p>大祥者，喪後再期之大祭也。士虞禮《記》云：「期而小祥，又期而大祥，曰：『薦此祥事。』中月而禫。」大祥之祭，比小祥為重，然亦未即吉，必待逾月中月而禫祭，然後為吉祭。是禮也，自虞至祥，自祥至禫，循月漸加，哀心漸殺，而人道之終始備矣。</p><p><strong>所出</strong>：《儀禮 · 士虞禮》 — https://zh.wikisource.org/wiki/儀禮/士虞禮</p></article></main></div></div>
