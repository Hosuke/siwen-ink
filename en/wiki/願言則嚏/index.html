    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 願言則嚏</nav></header><main><article><h1>願言則嚏</h1><p></p><p>「願言則嚏」，言思念之甚，古人以為人念己則令己嚏也。</p><p>  《終風》三章云「寤言不寐，願言則嚏」，詩人長夜不寐，念彼之人，若其念我，則我當嚏。{{後人援引「願言則嚏」以述相思之驗}}</p><p>  此俗說自古有之，云聞嚏者有人念之。《終風》以此述詩人徹夜不寐、苦苦相思之情。</p><p>  <strong>所出</strong>：《詩經 · 終風》 — https://zh.wikisource.org/wiki/詩經/終風</p></article></main></div></div>
