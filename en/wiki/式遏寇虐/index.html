    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 式遏寇虐</nav></header><main><article><h1>式遏寇虐</h1><p>以威制止寇賊暴虐之人。</p><p>「式」者，用也；「遏」者，止也。寇虐之人害於民、亂於政，不可不去。去之之道，在乎威刑并用，非徒柔撫所能止也。《民勞》各章皆以「式遏寇虐」與「無縱詭隨」並言，是知姦宄與盜賊，皆為治之大害。去姦宄以明察，去盜賊以威刑，二者不可偏廢。</p><p><strong>所出</strong>：《詩經 · 民勞》 — https://zh.wikisource.org/wiki/詩經/民勞</p></article></main></div></div>
