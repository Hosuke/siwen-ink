    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 朝聞道夕死可矣</nav></header><main><article><h1>朝聞道夕死可矣</h1><p>道之得聞，死無憾也。</p><p>朝聞道，夕死可矣。聞道之旨，死且無憾，況生之時乎？道者天下之正理，得聞於斯世之幸，苟能聞之，夕死無悔。此聖人望道之切，見學之亟也。</p><p><strong>所出</strong>：《論語 · 里仁第四》 — https://zh.wikisource.org/wiki/論語/里仁第四</p></article></main></div></div>
