    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 栗太子為臨江王</nav></header><main><article><h1>栗太子為臨江王</h1><p>景帝廢栗太子劉榮為臨江王，以膠東王徹為太子。</p><p>七年冬，廢栗太子為臨江王。二月乙巳，以太尉條侯周亞夫為丞相。四月乙巳，立膠東王太后為皇后。丁巳，立膠東王為太子，名徹。</p><p>後三年十月，日月皆赤五日。十二月晦，雷。日如紫。五星逆行守太微。月貫天廷中。正月甲寅，皇太子冠。甲子，孝景皇帝崩。</p><p><strong>所出</strong>：《史記 · 卷011》 — https://zh.wikisource.org/wiki/史記/卷011</p></article></main></div></div>
