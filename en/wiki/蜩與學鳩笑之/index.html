    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 蜩與學鳩笑之</nav></header><main><article><h1>蜩與學鳩笑之</h1><p>小智笑大智，小年笑大年，不知自身之隘。</p><p>蜩與學鳩笑之曰：「我決起而飛，榆枋，時則不至，而控於地而已矣，奚以之九萬里而南為！」適莽蒼者，三餐而反，腹猶果然；適百里者，宿舂糧；適千里者，三月聚糧。之二蟲又何知！</p><p>小知不及大知，小年不及大年。奚以知其然也？朝菌不知晦朔，蟪蛄不知春秋，此小年也。楚之南有冥靈者，以五百歲為春，五百歲為秋；上古有大椿者，以八千歲為春，八千歲為秋。而彭祖乃今以久特聞，眾人匹之，不亦悲乎！</p><p><strong>所出</strong>：《莊子 · 逍遙遊》 — https://zh.wikisource.org/wiki/莊子/逍遙遊</p></article></main></div></div>
