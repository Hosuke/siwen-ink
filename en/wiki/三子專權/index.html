    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 三子專權</nav></header><main><article><h1>三子專權</h1><p>桓公不能用管仲之言，卒近用易牙豎刀開方，致禍</p><p>管仲病，桓公問：「群臣誰可相者？」管仲對曰：「易牙如何？」曰：「殺子以適君，非人情，不可。」「開方如何？」曰：「倍親以適君，非人情，難近。」「豎刀如何？」曰：「自宮以適君，非人情，難親。」管仲死，桓公不用其言，卒近用三子，三子專權。桓公卒，五公子爭立，屍蟲出戶，宮中空，竟以亂亡。此戒親小人遠賢臣之禍也。</p><p><strong>所出</strong>：《史記 · 卷032》 — https://zh.wikisource.org/wiki/史記/卷032</p></article></main></div></div>
