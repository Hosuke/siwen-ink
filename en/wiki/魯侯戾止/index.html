    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 魯侯戾止</nav></header><main><article><h1>魯侯戾止</h1><p>諸侯至止，車馬赫弈，學宮生色。</p><p>[[魯侯戾止]]，言魯侯之至也。「戾止」與「蒞止」義同，諸侯來至之謂。詩言「魯侯戾止，言觀其旂」，又言「其馬蹻蹻」，言其馬強健，其旗熾盛，鸞鈴和鳴，聲噦噦然。魯侯脩泮宮，臨泮水，諸侯觀禮，車馬之盛若此。後世遂以「戾止」為貴客來訪之典。</p><p><strong>所出</strong>：《詩經 · 泮水》 — https://zh.wikisource.org/wiki/詩經/泮水</p></article></main></div></div>
