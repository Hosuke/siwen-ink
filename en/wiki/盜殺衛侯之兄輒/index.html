    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 盜殺衛侯之兄輒</nav></header><main><article><h1>盜殺衛侯之兄輒</h1><p>盜殺衛侯之兄，記弒兄之變。</p><p>盜殺衛侯之兄輒。</p><p>傳曰：「盜賤也。其曰兄，母兄也。目衛侯，衛侯累也。然則何為不為君也？曰：有天疾者，不得入乎宗廟。輒者，何也？曰：兩足不能相過，齊謂之綦，楚謂之踂，衛謂之輒。」兄而見殺，盜賤而書之，所以重親親，又以見衛侯之累也。</p><p><strong>所出</strong>：《春秋穀梁傳 · 昭公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/昭公</p></article></main></div></div>
