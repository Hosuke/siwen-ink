    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 紂之同母三人</nav></header><main><article><h1>紂之同母三人</h1><p>太史據法力爭，以妾子不可置妻子，終使紂嗣位，法縛賢路。</p><p>紂之同母三人，長曰微子啟，其次曰中衍，其次曰受德。受德乃紂也，甚少矣。紂母之生微子啟與中衍也，尚為妾；已而為妻而生紂。紂之父、紂之母欲置微子啟以為太子，太史據法而爭之曰：「有妻之子，而不可置妾之子。」紂故為後。</p><p>用法若此，不若無法。太史泥於名分，不達立嗣當以賢不以嫡，卒使不肖嗣位，殷室以傾。立法之本，在於窒姦，不在於窒賢；窒賢之法則適以資姦也已。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十一》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十一</p></article></main></div></div>
