    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 帝堯之崩</nav></header><main><article><h1>帝堯之崩</h1><p>記堯禪天下于舜之事</p><p>堯崩，問四嶽曰：「有能成美之事者使居官？」皆曰：「伯禹司空，可成美之功。」堯曰：「嗟，然！」命禹曰：「女平水土，維是勉之。」拜稽首，讓于稷、契、皋陶。堯曰：「汝其往視爾事矣。」禹攝行天子之政，巡狩。行視鯀之治水無狀，乃殛鯀于羽山以死。天下皆以舜之誅爲是。</p><p><strong>所出</strong>：《史記 · 卷002》 — https://zh.wikisource.org/wiki/史記/卷002</p></article></main></div></div>
