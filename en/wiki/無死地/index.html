    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 無死地</nav></header><main><article><h1>無死地</h1><p>善攝生者與道為一，則物不能害。</p><p>聞道者善攝生，其行也不循軌跡，其藏也深居杳冥，與造化者遊。路行不遇猛獸，入軍不披甲兵，兕不得投其角，虎不得措其爪，兵刃無所容其鋒。何也？以其超出死地，無隙可乘也。夫達道之人，忘形去智，與物無忤，物亦莫能傷之。譬如嬰兒在懷，蜂蠆不螫，猛獸不搏，以其不知所畏也。聖人體道如是，則天下無死地矣。</p><p><strong>所出</strong>：《老子河上公章句 · 貴生》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
