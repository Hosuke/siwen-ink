    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 緣木求魚</nav></header><main><article><h1>緣木求魚</h1><p>孟子以緣木求魚喻齊宣王欲闢土地朝秦楚之妄，謂以若所為求若所欲必有災。</p><p>齊宣王有大欲，欲闢土地、朝秦楚、蒞中國而撫四夷。孟子以為此猶緣木求魚，雖不得魚，無後災；以若所為求若所欲，盡心力為之，後必有災。蓋小固不可以敵大，寡不可以敵眾，弱不可以敵強，欲以一服八，終歸無功。不如反本行仁，發政施仁，使天下仕者願立於王之朝，耕者願耕於王之野，商賈行旅皆悅而歸之，孰能禦之？</p><p><strong>所出</strong>：《孟子 · 梁惠王上》 — https://zh.wikisource.org/wiki/孟子/梁惠王上</p></article></main></div></div>
