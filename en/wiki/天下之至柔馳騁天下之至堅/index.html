    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 天下之至柔馳騁天下之至堅</nav></header><main><article><h1>天下之至柔馳騁天下之至堅</h1><p>至柔馳堅、無有入妙，乃道之要用。</p><p>天下之至柔，馳騁天下之至堅。
無有入無間。
吾是以知無為之有益。
不言之教，無為之益，天下希及之。</p><p>河上公以此數語終一篇之義。言至柔之物馳騁於至堅之中，以柔克剛、以弱勝強也。虛無之氣可以入於無間之隙，以無有破無形也。由是以知無為之有益，不言之教自然成化，無為之益廣大，世人鮮能及之。</p><p><strong>所出</strong>：《老子河上公章句 · 徧用》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
