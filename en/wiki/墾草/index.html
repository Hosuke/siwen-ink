    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 墾草</nav></header><main><article><h1>墾草</h1><p>為國之數，務在墾草</p><p>為國之數，務在墾草。用兵之道，務在一賞。私利塞於外，則民務屬於農；屬於農則樸，樸則畏令。私賞禁於下，則民力摶於敵，摶於敵則勝。</p><p>夫民之情，樸則生勞而易力，窮則生知而權利。易力則輕死而樂用，權利則畏罰而易苦。易苦則地力盡，樂用則兵力盡。</p><p><strong>所出</strong>：《商君書 · 卷二》 — https://zh.wikisource.org/wiki/商君書/卷二</p></article></main></div></div>
