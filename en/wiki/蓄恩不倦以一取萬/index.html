    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 蓄恩不倦以一取萬</nav></header><main><article><h1>蓄恩不倦以一取萬</h1><p>將帥蓄恩於平日，則士卒感恩以死報效，可以一當萬。</p><p>昔者，良將之用，有饋簞醪者，使投諸河，與士卒同流而飲。夫一簞之醪，不能味一河之水，而三軍之士，思為致死者，以滋味之及己也。</p><p>《軍讖》又云：「將之所以為威者，號令也。戰之所以全勝者，軍政也。士之所以輕死者，用命也。」將帥與士卒同滋味、共安危，則恩素蓄而謀素合，眾可合而不可離，可用而不可疲。蓄恩不倦，以一取萬，此之謂也。</p><p><strong>所出</strong>：《三略》 — https://zh.wikisource.org/wiki/三略</p></article></main></div></div>
