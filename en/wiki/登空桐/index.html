    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 登空桐</nav></header><main><article><h1>登空桐</h1><p>黃帝西至于空桐，登雞頭。</p><p>上遂郊雍，至隴西，西登空桐，幸甘泉。令祠官寬舒等具[[泰一]]祠壇，壇放薄忌泰一壇，壇三垓。十一月辛已朔旦冬至，昧爽，天子始郊拜泰一。朝朝日，夕夕月，則揖。其贊饗曰：「天始以寶鼎神筴授皇帝，朔而又朔，終而復始，皇帝敬拜見焉。」</p><p><strong>所出</strong>：《史記 · 卷012》 — https://zh.wikisource.org/wiki/史記/卷012</p></article></main></div></div>
