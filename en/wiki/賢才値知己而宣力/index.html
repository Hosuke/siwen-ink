    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 賢才値知己而宣力</nav></header><main><article><h1>賢才値知己而宣力</h1><p>賢才待知己者而後能展布才能，以見知遇之重要。</p><p>抱朴子以器用為喻曰：「瓊瑤俟荊和而顯連城之價，烏號須逢門而著陷堅之功，飛菟待子豫而飈騰，俊民値知己而宣力。若夫美玉不出重岫，良弓不鑿百劄，驥騄不服朱軒，命世不履爵勢，則孰知其能攄符彩之耀曄，頓雲禽於千仞，騁逸跡以追風，康庶績於百揆乎？」</p><p><strong>所出</strong>：《抱朴子 · 卷20》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷20</p></article></main></div></div>
