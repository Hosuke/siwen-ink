    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 言采其蕨</nav></header><main><article><h1>言采其蕨</h1><p>登山望歸，采蕨以寓思。</p><p>言采其蕨，詩第二章之首句。言，語詞，猶「往」也。登山南望，采蕨而歸。蕨，俗名拳菜，春日生發。詩人登山非為采蔬，實以眺望丈夫歸途，想像相見之樂，故下文云「亦既見止，亦既覯止，我心則說」。以植物之春生，映服役之日久，故以為興。</p><p><strong>所出</strong>：《詩經 · 草蟲》 — https://zh.wikisource.org/wiki/詩經/草蟲</p></article></main></div></div>
