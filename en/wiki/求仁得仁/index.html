    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 求仁而得仁，又何怨</nav></header><main><article><h1>求仁而得仁，又何怨</h1><p>君子求其在我者。</p><p>[[冉有]]問[[孔子]]為[[衛君]]乎，[[子貢]]入問[[伯夷叔齊]]何人也。孔子曰古之賢人，又問怨乎，曰[[求仁而得仁，又何怨]]。[[伯夷叔齊]]讓國而去，餓死首陽，求仁得仁，無怨於人。此[[聖人]]以義制命，非以成敗論人也。</p><p><strong>所出</strong>：《論語 · 述而第七》 — https://zh.wikisource.org/wiki/論語/述而第七</p></article></main></div></div>
