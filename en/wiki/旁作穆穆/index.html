    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 旁作穆穆</nav></header><main><article><h1>旁作穆穆</h1><p>周公施德遠被，敬而廣也。</p><p>成王稱周公之德曰「旁作穆穆」。旁，廣也；穆穆，敬也。言周公之德，光被上下，遠及四方，其施也博，其敬也恭。成王所以能居師惇宗、稱秩元祀者，實賴周公旁作之功。此四字者，狀聖德之周普，後世言王化之廣，必本諸此。</p><p><strong>所出</strong>：《尚書 · 洛誥》 — https://zh.wikisource.org/wiki/尚書/洛誥</p></article></main></div></div>
