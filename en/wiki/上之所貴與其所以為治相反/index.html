    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 上之所貴與其所以為治相反</nav></header><main><article><h1>上之所貴與其所以為治相反</h1><p>居上者所崇尚者，往往與治道相違。</p><p>聖人之所以為治道者三：一曰「利」，二曰「威」，三曰「名」。夫利者，所以得民也；威者，所以行令也；名者，上下之所同道也。非此三者，雖有不急矣。</p><p>今利非無有也，而民不化上；威非不存也，而下不聽從；官非無法也，而治不當名。三者非不存也，而世一治一亂者，何也？夫上之所貴與其所以為治相反也。</p><p><strong>所出</strong>：《韓非子 · 詭使》 — https://zh.wikisource.org/wiki/韓非子/詭使</p></article></main></div></div>
