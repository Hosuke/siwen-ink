    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 朋友講習</nav></header><main><article><h1>朋友講習</h1><p>君子觀麗澤之象，以朋友之道相與講學習禮。</p><p>朋友講習，出《象傳》「君子以朋友講習」。朱熹《本義》云：「麗澤，兌。朋友互相滋潤。」夫學不可以獨成，必資友朋之助；友不可以無誼，必以講習相長。講者，開說其所疑；習者，復習其所聞。《禮記·學記》曰：「獨學而無友，則孤陋而寡聞。」此之謂也。君子觀兌之象，取麗澤相益之義，故與朋友共學焉。</p><p><strong>所出</strong>：《周易 · 兌》 — https://zh.wikisource.org/wiki/周易/兌</p></article></main></div></div>
