    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 舜誅四辠</nav></header><main><article><h1>舜誅四辠</h1><p>舜流共工于幽陵，放驩兜於崇山，遷三苗於三危，殛鯀於羽山。</p><p>驩兜進言共工不可用，堯試之工師，果淫辟。四嶽舉治鴻水，以爲不可，嶽彊請試之，試之而無功，故百姓不便。堯以爲莫若其言，四嶽毀之。於是堯歸而言於帝，請流共工於幽陵，以變北狄；放驩兜於崇山，以變南蠻；遷三苗於三危，以變西戎；殛鯀於羽山，以變東夷：四辠而天下咸服。</p><p><strong>所出</strong>：《史記 · 卷001》 — https://zh.wikisource.org/wiki/史記/卷001</p></article></main></div></div>
