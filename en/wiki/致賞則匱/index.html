    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 致賞則匱</nav></header><main><article><h1>致賞則匱</h1><p>賞過則匱，罰虐則下不信；賞重則上不給，罰虐則威失</p><p>致賞則匱，致罰則虐。財匱而令虐，所以失其民也。是故明君審居處之教，而民可使，居治戰勝守固者也。夫賞重則上不給也，罰虐則下不信也。</p><p><strong>所出</strong>：《管子 · 第31篇君臣下》 — https://zh.wikisource.org/wiki/管子/第31篇君臣下</p></article></main></div></div>
