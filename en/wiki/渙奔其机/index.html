    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 渙奔其机</nav></header><main><article><h1>渙奔其机</h1><p>渙散之時速奔机杼，得願无悔</p><p>「九二：渙奔其机，悔亡」。</p><p>机者，几席之屬，安身之所也。九二陽剛居中，下與初六相親，然時當渙散，苟守故常則悔。奔其机者，速離其所而就新安，渙而能變，故悔亡。九二得中，其志可行也。</p><p><strong>所出</strong>：《周易 · 渙》 — https://zh.wikisource.org/wiki/周易/渙</p></article></main></div></div>
