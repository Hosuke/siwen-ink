    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 既見君子</nav></header><main><article><h1>既見君子</h1><p>賢者在位，君子相遇，歡樂之情無以言之。</p><p>「既見君子，其樂如何」，「云何不樂」。桑之有阿，其葉或沃或幽，既見君子，則樂不可以言盡。以「阿」「沃」「幽」狀桑之盛，以「其樂如何」「云何不樂」寫見君子之喜，反覆詠歎，情致纏綿。此《小雅》之正音，賢者得見其君之歡也。</p><p><strong>所出</strong>：《詩經 · 隰桑》 — https://zh.wikisource.org/wiki/詩經/隰桑</p></article></main></div></div>
