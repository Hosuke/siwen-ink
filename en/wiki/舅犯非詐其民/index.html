    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 舅犯非詐其民</nav></header><main><article><h1>舅犯非詐其民</h1><p>舅犯所謂不厭詐僞，謂詐其敵，非以欺其民也。</p><p>或難雍季之對不當文公之問，韓非因而伸舅犯之說曰：「舅犯所謂『不厭詐僞』者，不謂詐其民，謂詐其敵也。敵者，所伐之國也，後雖無復，何傷哉？」</p><p>夫戰陳之間，敵我相抗，以奇謀誤敵，所以全我也。及夫天下已定，法令既行，則賞罰信而姦不起，又何必憂民之「無復」哉？故舅犯之言，非悖德義，乃兵家之常耳。</p><p><strong>所出</strong>：《韓非子 · 難一》 — https://zh.wikisource.org/wiki/韓非子/難一</p></article></main></div></div>
