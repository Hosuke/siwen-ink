    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 張騫言身毒</nav></header><main><article><h1>張騫言身毒</h1><p>述張騫使大夏還，言通蜀身毒國便近之事</p><p>及元狩元年，博望侯張騫使大夏來，言居大夏時見蜀布、邛竹、杖，使問所從來，曰「從東南身毒國，可數千里，得蜀賈人市」。或聞邛西可二千里有身毒國。騫因盛言大夏在漢西南，慕中國，患匈奴隔其道，誠通蜀，身毒國道便近，有利無害。</p><p>於是天子乃令王然于、柏始昌、呂越人等，使閒出西夷西，指求身毒國。至滇，滇王嘗羌乃留，為求道西十餘輩。歲餘，皆閉昆明，莫能通身毒國。</p><p><strong>所出</strong>：《史記 · 卷116》 — https://zh.wikisource.org/wiki/史記/卷116</p></article></main></div></div>
