    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 自見之謂明</nav></header><main><article><h1>自見之謂明</h1><p>知人之難不在見人，在自見；智如目見百步而不能自見其睫。</p><p>楚莊王欲伐越，杜子諫曰：「王之伐越，何也？」曰：「政亂兵弱。」杜子曰：「臣愚患之。智如目也，能見百步之外而不能自見其睫。王之兵自敗於秦、晉，喪地數百里，此兵之弱也；莊蹊蹻為盜於境內而吏不能禁，此政之亂也。王之弱亂，非越之下也，而欲伐越，此智之如目也。」王乃止。故知之難，不在見人，在自見。故曰：「自見之謂明。」</p><p><strong>所出</strong>：《韓非子 · 喻老》 — https://zh.wikisource.org/wiki/韓非子/喻老</p></article></main></div></div>
