    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 桓桓如虎如貔如熊如羆</nav></header><main><article><h1>桓桓如虎如貔如熊如羆</h1><p>師旅威武，奔赴商郊，如猛獸之搏噬。</p><p>「尚桓桓，如虎、如貔、如熊、如羆，于商郊。」言師旅之雄，威如虎貔熊羆，奔赴[[商人郊迎武王]]之郊，[[恭行天罰]]而無前也。桓桓者，威武貌；四獸皆猛摯之屬，以況將士之勇。</p><p><strong>所出</strong>：《尚書 · 牧誓》 — https://zh.wikisource.org/wiki/尚書/牧誓</p></article></main></div></div>
