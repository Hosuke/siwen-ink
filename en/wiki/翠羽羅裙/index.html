    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 翠羽羅裙</nav></header><main><article><h1>翠羽羅裙</h1><p>道士修為羽衣羅裙之飾，俾神飛上玉京。</p><p>翠羽羅裙者，道士之華飾也。《上清大洞真經》第二十七章默呪云「翠羽羅裙，飛上玉京」，是道士修為此服以超昇之象。羽以翠飾，裙以羅織，光耀翠羽，輕若鴻毛，修者佩之，神思飛靈真炁日華之色，則神氣交通，飛上玉京矣。翠羽羅裙者，仙服之表，通天之路也。</p><p><strong>所出</strong>：《上清大洞真經 · 27章》 — https://zh.wikisource.org/wiki/上清大洞真經/27章</p></article></main></div></div>
