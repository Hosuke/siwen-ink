    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 文之為德</nav></header><main><article><h1>文之為德</h1><p>文與天地並生，為道之顯現，其德至大。</p><p>文之為德，與天地並生，實道之功用也。夫玄黃雜色，方圓異形，日月如璧以象天之美，山川煥綺以呈地之理，皆道之文也。人參天地之秀，鍾性靈以為心，心生而言立，言立而文明——此文也，非人之所能強作，乃道之所自然賦予。故曰：文之德大矣！其在於能寫天地之輝光，曉生民之耳目，使道之奧義流布於世而不匱也。</p><p><strong>所出</strong>：《文心雕龍 · 原道》 — https://zh.wikisource.org/wiki/文心雕龍/原道</p></article></main></div></div>
