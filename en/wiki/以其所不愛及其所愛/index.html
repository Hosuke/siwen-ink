    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 以其所不愛及其所愛</nav></header><main><article><h1>以其所不愛及其所愛</h1><p>斥梁惠王驅民殉地、以子弟殉敵之不仁。</p><p>孟子斥梁惠王之不仁。其論仁與不仁之辨曰：仁者，以其所愛及其所不愛；不仁者，以其所不愛及其所愛。蓋仁者推愛心以及疏遠，不仁者以暴虐加之於所親愛焉。</p><p>梁惠王以土地之故，糜爛其民而驅之戰，大敗；將復之，恐不能勝，故驅其所愛子弟以殉之。此正以其所不愛及其所愛之謂，實為自戕之道也。</p><p><strong>所出</strong>：《孟子 · 盡心下》 — https://zh.wikisource.org/wiki/孟子/盡心下</p></article></main></div></div>
