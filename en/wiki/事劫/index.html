    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 事劫</nav></header><main><article><h1>事劫</h1><p>姦臣借阿諛以惑主，敗則共責、成則獨功之姦。</p><p>事劫者，姦臣竊國之第二途。其術奈何？假言險語，揣測禍福得失之形，以投主之所好惡。</p><p>姦臣揣摩上意，巧言令色，使主聽之；及其事敗，則曰：「臣與主共為之。」遂與主分其咎責。及其事成，則曰：「臣一人之力也。」遂獨受賞。</p><p>更有甚者：姦臣壹心同辭，迭相掩覆，共稱其美，主欲不信而不可得。[[三劫]]之一。</p><p><strong>所出</strong>：《韓非子 · 三守》 — https://zh.wikisource.org/wiki/韓非子/三守</p></article></main></div></div>
