    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 五帝之炁</nav></header><main><article><h1>五帝之炁</h1><p>五臟之帝各稟其炁，充於極陰之宮者也。</p><p>五帝之炁者，五臟之帝君所稟之炁也。《上清大洞真經》三十三章云「日月之根生於二戶之下，五帝之炁充於極陰之宮」，蓋五帝分治五臟，各稟其炁，充盈於小腹二孔之處，則精華盈滿，玉液填溢，胞胎之根自此堅固矣。</p><p>修真者奉胞中黃炁君，則五帝之炁來集，極陰之宮充盈，而上昇南宮之位可期也。</p><p><strong>所出</strong>：《上清大洞真經 · 33章》 — https://zh.wikisource.org/wiki/上清大洞真經/33章</p></article></main></div></div>
