    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 黷于祭祀時謂弗欽</nav></header><main><article><h1>黷于祭祀時謂弗欽</h1><p>祭祀過奢，反失敬心。</p><p>黷于祭祀，時謂弗欽。祭之為禮，貴在敬誠。黷於其事，禮繁則慢生。慢生則弗欽。弗欽之祭，反得罪於神明矣。</p><p><strong>所出</strong>：《尚書 · 說命中》 — https://zh.wikisource.org/wiki/尚書/說命中</p></article></main></div></div>
