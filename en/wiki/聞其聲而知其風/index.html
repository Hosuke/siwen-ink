    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 聞其聲而知其風</nav></header><main><article><h1>聞其聲而知其風</h1><p>音發於外，可驗人心之風志。</p><p>音樂之道，生乎人心。感於心則蕩乎音，音成於外而化乎內。是故聞其聲而知其風，察其風而知其志，觀其志而知其德。盛衰、賢不肖、君子、小人，皆形於樂，不可隱匿。</p><p><strong>所出</strong>：《呂氏春秋 · 卷六》 — https://zh.wikisource.org/wiki/呂氏春秋/卷六</p></article></main></div></div>
