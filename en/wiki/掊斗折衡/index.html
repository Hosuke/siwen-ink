    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 掊斗折衡</nav></header><main><article><h1>掊斗折衡</h1><p>毀量器折秤桿，則民無所爭；絕聖智法度，乃可弭盜。</p><p>斗斛所以量物，權衡所以稱輕重，皆聖人之所以為天下制也。然而大盜至，則並與斗斛而竊之，與權衡而竊之。聖人之法度愈備，盜取之物愈多。是故欲止天下之爭，莫若掊斗折衡；欲止大盜，莫若殫殘聖法。民無所施其智，則巧偽不作；國無所用其法，則盜賊不起。</p><p>[[魚不可脫於深淵]]</p><p><strong>所出</strong>：《莊子 · 胠篋》 — https://zh.wikisource.org/wiki/莊子/胠篋</p></article></main></div></div>
