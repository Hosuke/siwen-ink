    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 魂魄自相拘</nav></header><main><article><h1>魂魄自相拘</h1><p>魂魄相須相制，方成丹道之和。</p><p>魂屬陽而主升，魄屬陰而主降，二者相須為用，亦相拘而不可離。[[青龍]]之魂拘[[白虎熬樞]]之魄，使金氣不散；白虎之魄斂[[汞日流珠]]之汞，使遊走者定。</p><p>丹道最貴[[魂魄]]之和，若魂強而魄弱，則火發而藥散；若魄強而魂弱，則金凝而無光。必也魂魄相拘，恰如[[龍虎兩弦]]之相合，乃得[[乾坤體乃成]]之效。此[[性命雙修]]之要義也。</p><p><strong>所出</strong>：《周易參同契 · 09章》 — https://zh.wikisource.org/wiki/周易參同契/09章</p></article></main></div></div>
