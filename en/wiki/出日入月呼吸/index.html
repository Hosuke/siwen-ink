    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 出日入月呼吸</nav></header><main><article><h1>出日入月呼吸</h1><p>日月出入於人身，呼吸為之往還，脩真者以呼吸法象日月之運。</p><p>出日入月者，以左目象日，右目象月；一出一入，迭迭相循。呼吸者，人身之日月也；吸則炁入，若日之出；呼則炁出，若月之入。呼吸存而日月運，日月運而元炁周於一身，此《上清黃庭內景經》之本義，所以取象天地以制人身之氣機焉。</p><p><strong>所出</strong>：《黃庭內景經 · 上有章第二》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/上有章第二</p></article></main></div></div>
