    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 鬼蜮</nav></header><main><article><h1>鬼蜮</h1><p>鬼無形而可畏，蜮伏水而傷人，比喻姦邪陰巧之人。</p><p>鬼無形質，蜮伏沙中伺人而射。詩言「為鬼為蜮，則不可得」，正斥暴公之姦。鬼不可以形求，蜮不可以跡索，皆言其陰巧之甚也。夫譖人者不露其面，而被害之人莫知其所從來；害人者潛行伏匿，而受害者不得其蹤。是以聖人觀人必於心行之微，不可以不常情信之也。鬼蜮之戒，誠千古識別小人之準的矣。</p><p><strong>所出</strong>：《詩經 · 何人斯》 — https://zh.wikisource.org/wiki/詩經/何人斯</p></article></main></div></div>
