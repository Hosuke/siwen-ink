    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 春登臺</nav></header><main><article><h1>春登臺</h1><p>俗情搖盪，若春陽之動志。</p><p>春，陰陽交通，萬物感動，登臺觀之，意志淫淫然。</p><p>春，陽氣發泄之時。登臺而望，萬物咸暢，意亦隨之淫淫然動而不能制。俗人之情若是，見外物而志移，觸時境而欲熾。聖人志在神域，不以外物搖其中。</p><p><strong>所出</strong>：《老子河上公章句 · 異俗》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
