    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 厚德音以先之</nav></header><main><article><h1>厚德音以先之</h1><p>治民先用德義感化，賞罰為輔。</p><p>孫卿子云：「為人主上者，其所以接下之百姓者，無禮義忠信，焉慮率用賞慶、刑罰、埶詐，除阨其下，獲其功用而已矣。」故厚德音以先之，明禮義以道之，致忠信以愛之，尚賢使能以次之，爵服慶賞以申之，時其事，輕其任，以調齊之，長養之，如[[保赤子]]。</p><p><strong>所出</strong>：《荀子 · 議兵篇》 — https://zh.wikisource.org/wiki/荀子/議兵篇</p></article></main></div></div>
