    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 遊夏之資抑頓九泉</nav></header><main><article><h1>遊夏之資抑頓九泉</h1><p>世道多難，精六藝者沉淪，依風附鳳者騰達。</p><p>《抱朴子》傷時之不公：「世道多難，儒教淪喪，文武之軌，將遂雕墜。或沈溺於聲色之中，或驅馳於競逐之路。孤貧而精六藝者，以遊夏之資，而抑頓乎九泉之下；因風而附鳳翼者，以駑庸之質，猶迴遑乎霞霄之表。」</p><p>是以舍本逐末者謂之勤修，[[持盈定傾節事|擁經求己]]者謂之[[陸沈迂闊]]。莫不蒙塵觸雨，戴霜履冰，以赴邪徑之近易，規朝種而暮獲矣。</p><p><strong>所出</strong>：《抱朴子 · 卷03》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷03</p></article></main></div></div>
