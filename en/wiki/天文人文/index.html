    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 天文人文</nav></header><main><article><h1>天文人文</h1><p>天道剛柔，人道文明，聖人觀之而成天下之治。</p><p>《易》傳揭其義曰：「剛柔交錯，天文也；文明以止，人文也。」天文者，天之道，剛柔迭運，歲功自成，聖人觀之以察時變；人文者，人之道，禮以坊德，樂以和民，聖人觀之以化成天下。是故觀天之道以應人事，修人之道以配天德，二者相須而化道成焉。</p><p><strong>所出</strong>：《周易 · 賁》 — https://zh.wikisource.org/wiki/周易/賁</p></article></main></div></div>
