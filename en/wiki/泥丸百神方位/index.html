    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 泥丸百神方位</nav></header><main><article><h1>泥丸百神方位</h1><p>上丹田百神定位之所在</p><p>泥丸者，上丹田之異名，[[心神丹元字守靈|心神]]所都之境也。經云「泥丸堅明百神方位」，是知[[存神]]之首務，在乎凝神於上丹田，使百神各有其位而不散亂。[[黃庭]]之說，實與此相通。泥丸明則神安，神安則[[守一]]可久，而死根永斷矣。修煉者於誦經之前，必先思此境，乃為的要。</p><p><strong>所出</strong>：《上清大洞真經 · 1章》 — https://zh.wikisource.org/wiki/上清大洞真經/1章</p></article></main></div></div>
