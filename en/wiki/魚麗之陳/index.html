    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 魚麗之陳</nav></header><main><article><h1>魚麗之陳</h1><p>步卒魚貫以承闕隙，師之完也。</p><p>陳，列陳也。魚麗之陳，先偏後伍，伍承彌縫。言步卒比附鱗次，若魚之麗焉。先以精卒居前以當敵，後伍之卒承接其隙，所以完也。</p><p>鄭子元之計也。戰于繻葛，祝聃為左拒，祭仲足為右拒，原繁、高渠彌以中軍奉公，結是陳以待王師。</p><p><strong>所出</strong>：《春秋左氏傳 · 桓公》 — https://zh.wikisource.org/wiki/春秋左氏傳/桓公</p></article></main></div></div>
