    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 管仲三歸</nav></header><main><article><h1>管仲三歸</h1><p>臣貴則當制其祿</p><p>管仲相齊，曰：「臣貴矣，然而臣貧。」桓公曰：「使子有三歸之家。」曰：「臣富矣，然而臣卑。」桓公使立於高、國之上。曰：「臣尊矣，然而臣踈。」乃立爲仲父。孔子聞而非之曰：「泰侈偪上。」</p><p>一曰：管仲父出，朱蓋青衣，置鼓而歸，庭有陳鼎，家有三歸。孔子曰：「良大夫也，其侈偪上。」</p><p>管仲相齊，富貴已極，孔子非之以泰侈偪上。蓋臣不可以太富太尊，恐逼於君也。</p><p><strong>所出</strong>：《韓非子 · 外儲說左下》 — https://zh.wikisource.org/wiki/韓非子/外儲說左下
===孫叔敖===</p></article></main></div></div>
