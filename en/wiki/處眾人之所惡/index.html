    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 處眾人之所惡</nav></header><main><article><h1>處眾人之所惡</h1><p>聖人如水，居下不爭，人所厭惡之處</p><p>處眾人之所惡。</p><p>水之性趨下，眾人好高而惡卑，聖人如水，反眾人之所好，就下而不爭，是以近道。[[水善利萬物而不爭]]，[[故幾於道]]。</p><p><strong>所出</strong>：《道德經 (王弼本) · 八章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
