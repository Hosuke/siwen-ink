    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 使心不亂</nav></header><main><article><h1>使心不亂</h1><p>不見可慾則民心不亂</p><p>不見可慾，則使心不亂。</p><p>可慾者，美物玩好之屬也。聖人不以美物示人，不以玩好悅人，則民之欲不得而動，心之念不得而擾，自然安定矣。河上公章句云：「『見』，示也。『可』，稱也。言人在上位，不稱己之可欲，使天下之人不妄求之，心不專固，無所分別也。」蓋可慾之物在前，則欲心必動；欲心動，則心之靜者亂矣。聖人藏美物，絕外界之誘，故民心自然安定，此亦治道之要也。</p><p><strong>所出</strong>：《老子河上公章句 · 安民》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
