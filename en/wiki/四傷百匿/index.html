    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 四傷百匿</nav></header><main><article><h1>四傷百匿</h1><p>言四者傷國之根，百匿為害之根也。</p><p>百匿傷上威。姦吏傷官法。姦民傷俗教。賊盜傷國眾。威傷則重在下；法傷則貨上流；教傷則從令者不輯；眾傷則百姓不安其居。重在下則令不行；貨上流則官徒毀；從令者不輯則百事無功；百姓不安其居則輕民處而重民散。輕民處、重民散，則地不辟；地不辟，則六畜不育；六畜不育，則國貧而用不足；國貧而用不足，則兵弱而士不厲；兵弱而士不厲，則戰不勝而守不固；戰不勝而守不固，則國不安矣。</p><p><strong>所出</strong>：《管子 · 四傷百匿》 — https://zh.wikisource.org/wiki/管子/七法/四傷百匿</p></article></main></div></div>
