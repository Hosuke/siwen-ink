    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 豐狐玄豹之皮</nav></header><main><article><h1>豐狐玄豹之皮</h1><p>美物足以致患，人君受之即為有罪。</p><p>翟人獻豐狐、玄豹之皮於晉文公。文公受客皮而歎曰：「此以皮之美自為罪。」韓非論之曰：夫治國者以名號為罪，徐偃王是也；以城與地為罪，虞、虢是也。故曰：「罪莫大於可欲。」美物在前，實為罪端，人主不可以不戒。</p><p><strong>所出</strong>：《韓非子 · 喻老》 — https://zh.wikisource.org/wiki/韓非子/喻老</p></article></main></div></div>
