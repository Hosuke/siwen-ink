    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 迷陽迷陽</nav></header><main><article><h1>迷陽迷陽</h1><p>芒刺在道，戒人勿傷吾行</p><p>楚狂接輿歌曰：「福輕乎羽，莫之知載；禍重乎地，莫之知避。已乎已乎，臨人以德；殆乎殆乎，畫地而趨！迷陽迷陽，无傷吾行。吾行郤曲，无傷吾足。」</p><p><strong>所出</strong>：《莊子 · 人間世》 — https://zh.wikisource.org/wiki/莊子/人間世</p></article></main></div></div>
