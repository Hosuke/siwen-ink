    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 節以制度</nav></header><main><article><h1>節以制度</h1><p>制度節制，則不傷財害民。</p><p>《節》之[[彖]]曰：「節以制度，不傷財，不害民。」</p><p>[[節]]之道，非僅恃[[苦節]]以自律，必資[[制度]]以為準則。以制度節制財用，則開支有度而不妄耗；以制度節制民行，則賞罰有據而不侵擾。《大學》曰「制度在禮」，[[禮]]者，所以定分止爭、節文人情者也。有制度以為節，則下知所遵守，上知所裁制，財用不匱而民氣大和。《書》曰「啟迪[[惟應利用厚生的善政，而非過度的剝奪。</p><p><strong>所出</strong>：《周易 · 節》 — https://zh.wikisource.org/wiki/周易/節</p></article></main></div></div>
