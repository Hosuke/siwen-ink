    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 大邦以下小邦則取小邦</nav></header><main><article><h1>大邦以下小邦則取小邦</h1><p>大邦謙下，小邦歸附。</p><p>大邦者下流，天下之牝也。天下之郊，牝恆以靜勝牡。宜為下。</p><p>大邦以下小邦，則取小邦；小邦以下大邦，則取於大邦。取者，兼而有之也。大邦謙下，則小邦自附；小邦歸下，則大邦兼之。故或下以取，或下而取。彼此皆以謙下相待，則大邦兼畜，小邦入事，各遂其欲矣。皆得其欲，恆以為下。夫惟謙下，是以大邦不過欲兼畜人，小邦不過欲入事人，兩得其所欲，而天下安矣。</p><p><strong>所出</strong>：《老子 (帛書本) · 章六十一》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
