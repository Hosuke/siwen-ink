    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 牋記</nav></header><main><article><h1>牋記</h1><p>牋記者，上窺乎表、下睨乎書之文也。</p><p>牋記之體，[[書記]]之分也。原牋記之為式，既上窺乎表，亦下睨乎書，使敬而不懾，簡而無傲，清美以惠其才，彪蔚以文其響。</p><p>[[公幹牋記]]，麗而規益。[[劉廙謝恩]]，喻切以至。[[陸機自理]]，情周而巧，牋之為美者也。</p><p>至若[[黃香奏牋]]於江夏，亦肅恭之遺式矣。[[崔實奏記]]於公府，則崇讓之德音矣。</p><p><strong>所出</strong>：《文心雕龍 · 書記》 — https://zh.wikisource.org/wiki/文心雕龍/書記</p></article></main></div></div>
