    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 不往何災</nav></header><main><article><h1>不往何災</h1><p>不往則無災，明知危而不行之義</p><p>《象》曰：「遯尾之厲，不往何災也。」</p><p>初六以陰居下，在遯之時，尾隨人之後，危厲切矣。然《象》以為，但不往以犯時之難，則何災之有？蓋災之來也，每自取之。時既不可往而強往，是謂致寇；若知幾不往，則寇亦無所施其災。是以「不往」非懦怯，乃審時度勢、全身遠害之智也。</p><p><strong>所出</strong>：《周易 · 遯》 — https://zh.wikisource.org/wiki/周易/遯</p></article></main></div></div>
