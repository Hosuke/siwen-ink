    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 哀之發於飲食</nav></header><main><article><h1>哀之發於飲食</h1><p>居喪飲食，視喪服之差而別以不食、再不食之節。</p><p>居喪之飲食，視服之輕重以為節。斬衰三日不食，齊衰二日不食，大功三不食，小功緦麻再不食。士與斂焉，則一不食。及父母之喪，既殯食粥，朝一溢米，莫一溢米。齊衰之喪，疏食水飲，不食菜果。大功之喪，不食醢醬。小功緦麻，不飲醴酒。此哀之發於飲食者也。</p><p><strong>所出</strong>：《禮記 · 間傳》 — https://zh.wikisource.org/wiki/禮記/間傳</p></article></main></div></div>
