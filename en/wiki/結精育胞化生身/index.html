    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 結精育胞化生身</nav></header><main><article><h1>結精育胞化生身</h1><p>凝結精氣以育胞胎，轉化肉身超乎凡胎。</p><p>結精育胞化生身者，精胞相結、漸化成形之義也。[[太微小童]]章言誦經行道之效，在乎化生血液、上凝[[泥丸百神方位|泥丸]]，[[三神]]凝立，百神方位，則身之生始得其正，非徒血肉之身而已。此與[[抱神以靜]]之旨相通，而尤重精胞之漸化。行者循此，則[[返本歸根]]可期焉。</p><p><strong>所出</strong>：《上清大洞真經 · 1章》 — https://zh.wikisource.org/wiki/上清大洞真經/1章</p></article></main></div></div>
