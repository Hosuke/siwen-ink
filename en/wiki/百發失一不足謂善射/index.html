    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 百發失一，不足謂善射</nav></header><main><article><h1>百發失一，不足謂善射</h1><p>學不可以不通倫類、不一仁義；苟有闕遺，不足以言善學。</p><p>百發失一，不足謂善射；千里蹞步不至，不足謂善御；倫類不通，仁義不一，不足謂善學。學也者，固學一之也。一出焉，一入焉，涂巷之人也。其善者少，不善者多，桀、紂、盜跖也。全之盡之，然後學者也。</p><p><strong>所出</strong>：《荀子 · 勸學篇》 — https://zh.wikisource.org/wiki/荀子/勸學篇</p></article></main></div></div>
