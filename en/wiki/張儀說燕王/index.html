    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 張儀說燕王</nav></header><main><article><h1>張儀說燕王</h1><p>張儀以秦楚嫁娶為昆弟之國，勸燕王質子事秦，以息兵革。</p><p>張儀之燕，說燕王曰：「秦之與楚接境壤界，固形親之國也。大王誠能聽臣，臣請使秦太子入質於楚，楚太子入質於秦，以秦女為大王箕帚之妾，效萬室之都以為湯沐之邑，長為昆弟之國，終身無相攻伐。」燕王聽儀。</p><p><strong>所出</strong>：《史記 · 卷070》 — https://zh.wikisource.org/wiki/史記/卷070</p></article></main></div></div>
