    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 胥及逸勤</nav></header><main><article><h1>胥及逸勤</h1><p>君臣同休，賞罰一體。</p><p>古我先王，暨乃祖乃父，胥及逸勤；予敢動用非罰？世選（纂）爾勞，予不掩爾善。</p><p>盤庚言先王與臣祖、父，休戚與共，[[胥及逸勤]]。言今之賞罰，不敢有所私也。選用爾之功勞，不掩爾之善行，賞罰一循乎公道，[[世選爾勞]]者此也。上下相維，君臣一體，此[[尚書]]所述共政之義也。</p><p><strong>所出</strong>：《尚書 · 盤庚上》 — https://zh.wikisource.org/wiki/尚書/盤庚上</p></article></main></div></div>
