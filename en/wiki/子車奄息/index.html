    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 子車奄息</nav></header><main><article><h1>子車奄息</h1><p>秦之賢臣，為穆公殉死之首。</p><p>黃鳥交交，止于棘。誰從穆公？子車奄息。維此奄息，百夫之特。</p><p>子車奄息，秦之賢臣也。穆公薨，從死於墓穴之中。詩人見黃鳥止於棘木，傷賢臣之枉死，乃言奄息一人之才，實可當百夫之特。臨穴惴惴，彼蒼者天，竟殲我良人！如可贖命，願以百人之身易之。</p><p>奄息與仲行、針虎，並稱「子車三良」，皆秦之良士也。</p><p><strong>所出</strong>：《詩經·黃鳥》 — https://zh.wikisource.org/wiki/詩經/黃鳥</p></article></main></div></div>
