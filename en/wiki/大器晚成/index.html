    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 大器晚成</nav></header><main><article><h1>大器晚成</h1><p>大器之人成不可卒就</p><p>大器晚成，[[河上公章句]]以九鼎瑚璉為喻，不可卒成。[[不欲盈]]者不求速，[[為道日損]]者不貴近功。修煉以漸，積累以久，大器晚成，聖人久於其道而天下化成。</p><p><strong>所出</strong>：《老子河上公章句 · 同異》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
