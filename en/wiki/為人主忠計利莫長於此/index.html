    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 為人主忠計，為天下結德者，利莫長於此</nav></header><main><article><h1>為人主忠計，為天下結德者，利莫長於此</h1><p>立法為公，其利最久，此忠臣之至計也。</p><p>不獨恃比干之死節，不幸亂臣之無詐也；恃怯之所能服，握庸主之所易守。當今之世，為人主忠計、為天下結德者，利莫長於此。故君人者無亡國之圖，而忠臣無失身之畫。</p><p><strong>所出</strong>：《韓非子 · 守道》 — https://zh.wikisource.org/wiki/韓非子/守道</p></article></main></div></div>
