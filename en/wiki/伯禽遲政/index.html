    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 伯禽遲政</nav></header><main><article><h1>伯禽遲政</h1><p>伯禽革魯俗、革魯禮，三年而後報政，故遲於太公。</p><p>伯禽受封魯，三年而後報政周公。周公曰：「何遲也？」伯禽曰：「變其俗，革其禮，喪三年然後除之，故遲。」太公亦封於齊，五月而報政周公。周公曰：「何疾也？」曰：「吾簡其君臣禮，從其俗爲也。」及後聞伯禽報政遲，乃嘆曰：「嗚呼，魯後世其北面事齊矣！夫政不簡不易，民不有近；平易近民，民必歸之。」</p><p><strong>所出</strong>：《史記 · 魯周公世家》 — https://zh.wikisource.org/wiki/史記/魯周公世家</p></article></main></div></div>
