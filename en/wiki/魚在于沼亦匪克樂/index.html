    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 魚在于沼，亦匪克樂</nav></header><main><article><h1>魚在于沼，亦匪克樂</h1><p>魚困於沼不得遂其性，以喻賢者困於亂世也。</p><p>《正月》云：「魚在于沼，亦匪克樂。潛雖伏矣，亦孔之炤。」沼，池也。匪，非也。克，能也。言魚之在沼也，非能樂也；潛伏雖深，而人猶炤炤然窺之，無所逃也。詩人以魚自況，見其困於亂世，無以自全。欲隱而不得，欲逃而無路，如魚之在沼，雖有水而不深，雖欲伏而猶見也。孔，甚也。炤，昭也，猶言明白暴露。此詩人自傷之辭，以見亂世之無可容身，而賢者之不遇時也。</p><p><strong>所出</strong>：《詩經 · 正月》 — https://zh.wikisource.org/wiki/詩經/正月</p></article></main></div></div>
