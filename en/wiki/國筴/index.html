    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 國筴</nav></header><main><article><h1>國筴</h1><p>教數五官，謹聽藏官，使師旅無與，此國筴之要。</p><p>管子設教數以取民能，七事皆賞黃金一斤直食八石：明農事者、育六畜者、樹藝者、樹瓜瓠蔬果者、已民疾病者、知歲時預言豐歉者、通蠶桑使蠶不疾者。謹聽其言而藏之官，使師旅之事無所與。國用相靡而足，相因揲而𠸆，置四限高下，令之徐疾，敺屏萬物，守之以筴，此國筴之者也。</p><p><strong>所出</strong>：《管子 · 第75篇山權數》 — https://zh.wikisource.org/wiki/管子/第75篇山權數</p></article></main></div></div>
