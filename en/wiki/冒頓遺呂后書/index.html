    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 冒頓遺呂后書</nav></header><main><article><h1>冒頓遺呂后書</h1><p>冒頓遣書戲辱高后，高后欲擊之，諸將以平城之困止之。</p><p>高祖崩，孝惠、呂太后時，漢初定，故匈奴以驕。冒頓乃為書遺高后，妄言。</p><p>高后欲擊之，諸將曰：「以高帝賢武，然尚困於平城。」於是高后乃止，復與匈奴和親。</p><p><strong>所出</strong>：《史記 · 卷110》 — https://zh.wikisource.org/wiki/史記/卷110</p></article></main></div></div>
