    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 郭泰知人</nav></header><main><article><h1>郭泰知人</h1><p>郭泰善觀人之邪正高下，一無差錯。</p><p>郭泰，漢末之名士也。其知人之術，散見於《抱朴子》所引：</p><p>泰入潁川，友李元禮；至陳留，結符偉明；入外黃，親韓子助；至蒲亨，師仇季知；止學舍，收魏德公；觀耕者，拔茅季偉。</p><p>又有奇孟敏於擔負之間，戒元艾之必敗。</p><p>凡此種種，終如其言，一無差錯。</p><p>蓋知人之道，非止於觀其貌，貴在察其心計、審其始終也。</p><p><strong>所出</strong>：《抱朴子 · 卷21》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷21</p></article></main></div></div>
