    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 千里之隄</nav></header><main><article><h1>千里之隄</h1><p>小隙不補，終成大患；防微杜漸之道也。</p><p>千里之隄，以螻螘之穴漏；百尋之屋，以突隙之煙焚。堯戒曰：「戰戰慄慄，日慎一日。人莫蹪於山，而蹪於蛭。」是故人皆輕小害，易微事，以多悔。患至而後憂之，是猶病者已惓而索良醫也，雖有扁鵲、俞跗之巧，猶不能生也。</p><p>夫禍之來也，人自生之；福之來也，人自成之。禍與福同門，利與害為鄰，非神聖人，莫之能分。</p><p><strong>所出</strong>：《淮南子 · 人間訓》 — https://zh.wikisource.org/wiki/淮南子/人間訓</p></article></main></div></div>
