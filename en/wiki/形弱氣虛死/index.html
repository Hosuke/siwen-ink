    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 形弱氣虛死</nav></header><main><article><h1>形弱氣虛死</h1><p>形弱氣虛者死，形氣有餘而脈氣不足者亦死，唯脈氣有餘、形氣不足者可以生。</p><p>帝曰：</p><p>起所有餘，知所不足，度事上下，脈事因格。</p><p>是以形弱氣虛死，形氣有餘，脈氣不足死；脈氣有餘，形氣不足生。</p><p>此以形、氣、脈三者相參，以決生死之要則也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第二十四卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第二十四卷</p></article></main></div></div>
