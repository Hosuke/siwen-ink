    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 善戲謔，不為虐</nav></header><main><article><h1>善戲謔，不為虐</h1><p>君子善言談而不失分寸，戲而有節，謔而不傷。</p><p>言語之妙，在乎有節。過於莊嚴則失之和，過於放誕則失之肆。</p><p>《淇奧》之詩美武公之德，末章言其寬綽風度：「善戲謔兮，不為虐兮。」戲者，戲笑也；謔者，戲謔也。君子不以戲謔為諱，而能在戲謔之中不失其度。不為虐者，言雖笑樂譸弄，而皆有節制，不至於過甚也。</p><p>《論語》記孔子「悶悶」，又記其「燕居」時「不言而笑」，亦此意也。善戲謔者，非木訥之謂，乃和而不流、幽默而有禮者也。惟寬綽者能之，故下文曰「寬兮綽兮」，寬則不迫，綽則有餘，善戲謔之事胥此而出焉。</p></article></main></div></div>
