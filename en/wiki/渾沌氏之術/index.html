    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 渾沌氏之術</nav></header><main><article><h1>渾沌氏之術</h1><p>渾沌氏治內不治外，明白入素，無爲復朴，體性抱神。</p><p>子貢返於魯，以告孔子。孔子曰：「彼假脩渾沌氏之術者也。識其一，不知其二；治其內，而不治其外。夫明白入素，无爲復朴，體性抱神，以遊世俗之間者，汝將固驚邪？且渾沌氏之術，予與汝何足以識之哉！」</p><p><strong>所出</strong>：《莊子 · 天地》 — https://zh.wikisource.org/wiki/莊子/天地</p></article></main></div></div>
