    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 納公孫寧儀行父于陳</nav></header><main><article><h1>納公孫寧儀行父于陳</h1><p>納者內弗受也，制人之上下使不得其君臣之道，不可</p><p>納公孫寧、儀行父于陳。</p><p>穀梁氏曰：「入者，內弗受也。日入，惡入者也。何用弗受也？不使夷狄為中國也。」又曰：「輔人之不能民而討，猶可；<strong>入人之國，制人之上下，使不得其君臣之道，不可。</strong>」</p><p>楚入陳而納其二臣，是以外力強置人於其國，使人失其君臣之序。穀梁氏以為，此非討有罪，乃亂人之國，其罪甚於不入。</p><p><strong>所出</strong>：《春秋穀梁傳 · 宣公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/宣公</p></article></main></div></div>
