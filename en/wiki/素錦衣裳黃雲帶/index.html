    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 素錦衣裳黃雲帶</nav></header><main><article><h1>素錦衣裳黃雲帶</h1><p>肺神服素錦之衣，束黃雲之帶，象金氣之精白。</p><p>肺神所服曰素錦衣裳，束黃雲帶。素錦者，肺象西方之金，其色白而純；黃雲者，土金相生之象。衣裳以象服飾，帶以象束斂，喻肺神端正其服，以保精粹。經云「素錦衣裳黃雲帶」，言肺神衣冠端肅，稟金氣之精華，黃雲相附，以成肺象之全。</p><p><strong>所出</strong>：《黃庭內景經 · 肺部章第九》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/肺部章第九</p></article></main></div></div>
