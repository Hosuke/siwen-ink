    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 桓公不用管仲言</nav></header><main><article><h1>桓公不用管仲言</h1><p>桓公不用管仲之言，卒召亂亡。</p><p>管仲死，桓公悉逐之。居三年，公曰：「仲父不亦過乎？」於是皆復召而反。明年，公有病，常之巫從中出曰：「公將以某日薨。」易牙、堅刀、常之巫相與作亂，塞宮門，築高牆，不通人。有一妇人逾垣入，至公所。公欲食，欲飲，皆無所得。公歎曰：「嗟乎！聖人之所見，豈不遠哉？」蒙衣袂而絕乎壽宮。蟲流出於戶，上蓋以楊門之扇，三月不葬。此[[不卒聽管仲之言]]也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十六》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十六</p></article></main></div></div>
