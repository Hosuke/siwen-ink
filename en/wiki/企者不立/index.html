    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 企者不立</nav></header><main><article><h1>企者不立</h1><p>踮足而立者，反不能自立。</p><p>人欲企足以立，是不能久立者也。喻人強為矜飾，違其自然，則去道遠矣。蓋道貴柔弱謙下，企足而望，非自然之立，乃強行之立，終必仆跌老子所以深戒也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 二十四章》 — https://zh.wikisource.org/wiki/道德經_(王弼本)</p></article></main></div></div>
