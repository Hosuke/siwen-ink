    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 采采衣服</nav></header><main><article><h1>采采衣服</h1><p>形容服飾華美之盛。</p><p>「采采衣服」與首章「衣裳楚楚」義同而辭變，皆狀蜉蝣羽翼之華美，以喻人衣飾之盛。采者，采色相映也；衣服者，舉上下以該也。《詩》中疊字言物盛者多矣，如「灼灼其華」之於花、「采采卷耳」之於菜皆是。此則以蟲翼比人之衣，同一 [[興]] 法。</p><p><strong>所出</strong>：《詩經 · 蜉蝣》 — https://zh.wikisource.org/wiki/詩經/蜉蝣</p></article></main></div></div>
