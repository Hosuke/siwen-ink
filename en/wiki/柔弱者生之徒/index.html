    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 柔弱者生之徒</nav></header><main><article><h1>柔弱者生之徒</h1><p>柔弱為生者之所屬，堅強為死者之所趨。</p><p>[[老子 (帛書本)]]第七十六章云：人之生也柔弱，其死也恆仞；萬物草木之生也柔脆，其死也枯槁。故曰堅強者死之徒也，柔弱微細生之徒也。</p><p>此章以人與草木為喻，明柔弱為生之象、堅強為死之象。活着之時，形體柔弱；及其死也，筋骨仞強。草木亦然：生時柔脆，死則枯槁。是故老子斷言：堅強者歸於死徒，柔弱者屬乎生類。示人以守柔為貴，勿以堅強自恃也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章七十六》 — https://zh.wikisource.org/wiki/老子_(帛書本)</p></article></main></div></div>
