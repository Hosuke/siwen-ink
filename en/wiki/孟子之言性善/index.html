    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 孟子言性善</nav></header><main><article><h1>孟子言性善</h1><p>荀子駁孟子性善之說，謂其不及知性與僞之分。</p><p>孟子曰：「今之學者，其性善。」曰：是不然。是不及知人之性，而不察乎人之性、僞之分者也。孟子又曰：「今人之性善，將皆失喪其性故也。」曰：若是，則過矣。今人之性，生而離其朴，離其資，必失而喪之。夫所謂性善者，不離其朴而美之，不離其資而利之也。若[[性善]]之說，則[[性與僞之分]]不明，而[[為性惡之故|聖王之化]]無所施矣。</p><p><strong>所出</strong>：《荀子 · 性惡篇》 — https://zh.wikisource.org/wiki/荀子/性惡篇</p></article></main></div></div>
