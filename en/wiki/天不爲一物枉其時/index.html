    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 天不爲一物枉其時</nav></header><main><article><h1>天不爲一物枉其時</h1><p>天道公正，不為一物而枉四時之序。</p><p>然而天不爲一物枉其時，明君聖人亦不爲一人枉其法。天行其所行而萬物被其利，聖人亦行其所行而百姓被其利，是故萬物均既誇衆矣。</p><p><strong>所出</strong>：《管子 · 第38篇白心》 — https://zh.wikisource.org/wiki/管子/第38篇白心</p></article></main></div></div>
