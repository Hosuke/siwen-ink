    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 因其俗簡其禮</nav></header><main><article><h1>因其俗簡其禮</h1><p></p><p>太公至國，修政，因其俗，簡其禮，通工商之業，便魚鹽之利，而人民多歸齊。此因其俗簡其禮之效也。</p><p>  <strong>所出</strong>：《史記 · 卷032》 — https://zh.wikisource.org/wiki/史記/卷032</p></article></main></div></div>
