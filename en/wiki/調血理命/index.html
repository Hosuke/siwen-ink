    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 調血理命</nav></header><main><article><h1>調血理命</h1><p>調和榮衛，血氣有序，命道乃全。</p><p>血者榮也，氣者衛也。榮衛者，血氣之分別名。榮行脈中，衛行脈外，二者和暢，則身形康豫。</p><p>調血理命者，以神御氣、以意引血，令周流無滯、陰陽交濟也。丹元主之，故心君清則血脈暢，血脈暢則命道長。世人役於嗜欲，則榮衛不和，而身枯命促。修煉者必先調心，心清則神定，神定則氣和，氣和則血順，血順則命全而身不枯矣。</p><p><strong>所出</strong>：《黃庭內景經 · 心部章第十》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/心部章第十</p></article></main></div></div>
