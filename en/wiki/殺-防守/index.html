    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 殺</nav></header><main><article><h1>殺</h1><p></p><p><strong>殺</strong>者，墨子所述城外防守之殺敵所也。《備蛾傅》篇云：「二十步一殺，有𡑾，厚十尺，殺有兩門，門廣五步，薄門板梯貍之，勿築，令易拔。」</p><p>其制：二十步置一殺，有𡑾焉，厚十尺。殺有兩門，門廣五步。薄之門以板為梯，貍附之，勿築，令易拔而復設也。</p><p>城外之備，殺居其一。殺與薄相表裡，薄在外以阻敵，殺在內以殲敵。敵攻城者，先薄而遇殺，必被殲焉。城上之人希薄門而置楬，以望敵人之所在。殺之所以名為殺者，取其殺敵之意也。此守城者之要地，不可忽也。</p></article></main></div></div>
