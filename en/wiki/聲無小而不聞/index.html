    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 聲無小而不聞</nav></header><main><article><h1>聲無小而不聞</h1><p>聲無微而不達於遠，行無隱而不形於世。</p><p>故聲無小而不聞，行無隱而不形；玉在山而草木潤，淵生珠而崖不枯。為善不積邪，安有不聞者乎？</p><p><strong>所出</strong>：《荀子 · 勸學篇》 — https://zh.wikisource.org/wiki/荀子/勸學篇</p></article></main></div></div>
