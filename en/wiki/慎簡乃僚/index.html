    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 慎簡乃僚</nav></header><main><article><h1>慎簡乃僚</h1><p>選置僚屬務在得人</p><p>穆王命伯冏作大正，正于群僕侍御之臣，戒之曰：[[慎簡乃僚]]。簡，揀也；僚，同官也。大正之任，既在正群僕侍御之臣，又在慎簡其僚屬。僚非其人，則非心無以格，愆過無以糾。是以古人任官，丁寧反覆，唯在得人。得一吉士，則[[僕臣正，厥后克正]]；失一便辟，則為[[便嬖左右]]之患。治忽之分，繁於此焉。</p><p><strong>所出</strong>：《尚書 · 冏命》 — https://zh.wikisource.org/wiki/尚書/冏命</p></article></main></div></div>
