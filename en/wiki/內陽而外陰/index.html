    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 內陽而外陰</nav></header><main><article><h1>內陽而外陰</h1><p>泰之象，陽在內而陰在外，君子小人之正位也。</p><p>泰卦內陽而外陰，君子道長，小人道消。陽為君子，陰為小人。內居陽剛之德，外遠陰柔之徒，則泰運亨通。
<strong>所出</strong>：《周易註 (王弼) · 卷02》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷02</p></article></main></div></div>
