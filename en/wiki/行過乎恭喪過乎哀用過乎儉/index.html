    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 行過乎恭喪過乎哀用過乎儉</nav></header><main><article><h1>行過乎恭喪過乎哀用過乎儉</h1><p>象辭。君子法小過之象，於行、喪、用皆小過之恭。</p><p>山上有雷，小過。君子以行過乎恭，喪過乎哀，用過乎儉。恭以行禮，過恭則敬；哀以盡情，過哀則誠；儉以節用，過儉則約。此三者皆小過之美，非過越之愆，乃成德之義也。</p><p><strong>所出</strong>：《周易 · 小過》 — https://zh.wikisource.org/wiki/周易/小過</p></article></main></div></div>
