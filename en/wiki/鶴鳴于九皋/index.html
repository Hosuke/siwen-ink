    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 鶴鳴于九皋</nav></header><main><article><h1>鶴鳴于九皋</h1><p>鶴鳴九皋，聲聞廣遠，以喻賢者隱伏而德音遠達。</p><p>鶴鳴于九皋，聲聞于野。魚潛在淵，或在于渚。樂彼之園，爰有樹檀，其下維蘀。他山之石，可以為錯。</p><p>九皋者，幽深之澤也。鶴鳴於此，其聲達於野、達於天，以喻賢者在隱，厥德斯遠。或言宣王之世，賢者隱於下位，而其德音不可掩抑，朝廷當求之也。</p><p><strong>所出</strong>：《詩經 · 鶴鳴》 — https://zh.wikisource.org/wiki/詩經/鶴鳴</p></article></main></div></div>
