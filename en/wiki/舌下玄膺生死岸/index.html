    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 舌下玄膺生死岸</nav></header><main><article><h1>舌下玄膺生死岸</h1><p>舌下玄膺，實生死之關津</p><p>玄膺者，喉胸之深隱也，在舌下。[[生死岸]]者，[[生死]]之分界也。言此玄膺之地，乃魂魄出沒之津要，實為生死之彼岸。修真之士，必洞達乎此，而後可以出青入玄，超乎生死之外矣。</p><p><strong>所出</strong>：《黃庭內景經 · 天中章第六》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/天中章第六</p></article></main></div></div>
