    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 悠悠我思</nav></header><main><article><h1>悠悠我思</h1><p>思緒悠遠，念茲在茲。</p><p>「悠悠我思」，與首章「悠悠我心」相應。心以感言，思以念言；心動而思隨，心之感於物者深，則思亦無時或已。疊言「悠悠」，見思念之無盡期也。</p><p><strong>所出</strong>：《詩經 · 子衿》 — https://zh.wikisource.org/wiki/詩經/子衿</p><hr><p>《雄雉》第三章云「瞻彼日月，悠悠我思」，言日月迭邁，思念悠長也。</p><p><strong>所出</strong>：《詩經 · 雄雉》 — https://zh.wikisource.org/wiki/詩經/雄雉</p></article></main></div></div>
