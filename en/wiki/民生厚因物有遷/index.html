    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 民生厚因物有遷</nav></header><main><article><h1>民生厚因物有遷</h1><p>民心本厚而易化於習染</p><p>王誡君陳，言民風之蔽，曰：「惟民生厚，因物有遷。」夫民生之性本厚，與上同然，及其染於習俗，則漸失其本然之美矣。善治者當因其厚以教之，防其遷以率之，不可以刑罰威劫之也。</p><p><strong>所出</strong>：《尚書 · 君陳》 — https://zh.wikisource.org/wiki/尚書/君陳</p></article></main></div></div>
