    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 兄弟無遠</nav></header><main><article><h1>兄弟無遠</h1><p>兄弟之親，不可以疏遠；朋友之誼，當以兄弟為法。</p><p>「籩豆有踐，兄弟無遠」，[[詩經 · 伐木]]之義也。言兄弟之親，不可以疏遠。詩人陳饋八簋，以待兄弟，非特血屬，凡同氣之類，皆當相近。</p><p>古者以兄弟喻朋友之義，蓋友朋之情，同於兄弟。詩之意，在親親而仁民。籩豆陳設，禮儀不缺，所以明兄弟之情不可忘也。</p><p><strong>所出</strong>：《詩經 · 伐木》 — https://zh.wikisource.org/wiki/詩經/伐木</p></article></main></div></div>
