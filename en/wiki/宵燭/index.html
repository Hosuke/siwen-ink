    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 宵燭</nav></header><main><article><h1>宵燭</h1><p>宵庶子司宮甸人闉人各掌燭</p><p>宵，則[[庶子]]執燭[[阼階]]上，司宮執燭[[西階]]上，[[甸人]]執大燭于庭，[[闉人]]為大燭于門外。賔醉，北面坐取其荐脯以降。奏《[[陔]]》。賔所執脯以賜鍾人于門內[[霤]]，遂出。卿、大夫皆出。公不送。</p><p><strong>所出</strong>：《儀禮 · 燕禮》 — https://zh.wikisource.org/wiki/儀禮/燕禮</p></article></main></div></div>
