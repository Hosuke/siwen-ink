    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 求厥章</nav></header><main><article><h1>求厥章</h1><p>求其典章法度。諸侯請命于王，以正邦國之儀也。</p><p>求厥章，求其典章法度也。章者，禮樂法度之總名。諸侯來朝，首言求章，正以見天王之柄在乎制禮，天下諸侯咸需稟命于上，無敢自專也。</p><p>此四字為一篇之綱，以下龍旂、和鈴、鞗革之盛，皆章之所寓；而率見、孝享、眉壽之祈，亦皆章之所致者也。</p><p><strong>所出</strong>：《詩經 · 載見》 — https://zh.wikisource.org/wiki/詩經/載見</p></article></main></div></div>
