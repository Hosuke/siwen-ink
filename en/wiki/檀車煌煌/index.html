    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 檀車煌煌</nav></header><main><article><h1>檀車煌煌</h1><p>戰車赫奕，師旅之盛。</p><p>牧野洋洋，檀車煌煌，駟騵彭彭。</p><p>檀車，檀木所造之兵車也。煌煌，明盛也。洋洋，廣大也。言牧野之地廣大，檀木之車光盛，馬匹彭彭而馳，皆形容[[肆伐大商]]之師甚盛也。[[其會如林]]言敵兵之盛，此言伐商之師亦盛，而[[時維鷹揚]]言尚父之勇。</p><p><strong>所出</strong>：《詩經 · 大明》 — https://zh.wikisource.org/wiki/詩經/大明</p></article></main></div></div>
