    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 久矣，吾不復夢見周公</nav></header><main><article><h1>久矣，吾不復夢見周公</h1><p>聖人衰老，道之不行。</p><p>孔子自嘆衰老，久不夢見周公。周公，制禮作樂之聖人也。聖人壯年志行王道，夢寐之間猶思行道；及衰老而道不行於天下，遂不復夢。此[[聖人]]傷時之辭，亦見周公之道的在聖人心中。</p><p><strong>所出</strong>：《論語 · 述而第七》 — https://zh.wikisource.org/wiki/論語/述而第七</p></article></main></div></div>
