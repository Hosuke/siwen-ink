  <body>
    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 五溫鬼七兄弟</nav></header><main><article><h1>五溫鬼七兄弟</h1><p>述五方溫鬼兄弟七人並祖父母父母之名形能飛，隨月行毒以誅惡人。</p><p>東方青溫鬼名咎遠，南方赤溫鬼名士言，西方白溫鬼名堯，北方黑溫鬼名天遐，中央黃溫鬼名太黃奴，第六溫鬼名誅女，第七溫鬼名伯陵。</p><p>祖父名梁州，祖母名交成，父名延年，母名出中。</p><p>右五方溫鬼，兄弟七人，合祖父母、父母十一，形能飛，隨月行毒，以誅惡人。</p><p><strong>所出</strong>：《女青鬼律 · 卷6》 — https://zh.wikisource.org/wiki/女青鬼律/卷6</p></article></main></div></div>
