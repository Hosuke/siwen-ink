    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 撫民以寬</nav></header><main><article><h1>撫民以寬</h1><p>以寬治民，除去邪虐。</p><p>此命述成湯之德，曰：「撫民以寬，除其邪虐。」言湯以寬和政治撫慰人民，除去邪惡暴虐之行也。</p><p><strong>所出</strong>：《尚書 · 微子之命》 — https://zh.wikisource.org/wiki/尚書/微子之命</p></article></main></div></div>
