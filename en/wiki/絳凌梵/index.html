    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 絳凌梵</nav></header><main><article><h1>絳凌梵</h1><p>帝君之名字，存思之主神也。</p><p>帝君有字，名絳凌梵，字履昌靈。</p><p>《上清大洞真經》此章載存思法，先請帝君：「玉帝君章。謹請帝君絳凌梵，字履昌靈，常守兆兩眉中間，紫戶外宮死炁之門，使華蓋入兩眉中間，上昇紫房，七世父母罪解福生，上登帝宮。」蓋存思之時，先請此神守於眉心紫戶之外，以制伏死炁，納福登真也。</p><p><strong>所出</strong>：《上清大洞真經 · 3章》 — https://zh.wikisource.org/wiki/上清大洞真經/3章</p></article></main></div></div>
