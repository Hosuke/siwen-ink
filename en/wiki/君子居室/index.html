    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 君子居室</nav></header><main><article><h1>君子居室</h1><p>君子居於室而善言發，千里之外莫不響應；人主處九重之室，當順陰陽之節以發號令。</p><p>君子居其室，出其言善，則千里之外應之。萬乘之主，處九重之室，發號出令，順陰陽節。</p><p>言出於近而應及於遠，理之自然也。君子修德於內，善言播於外，故千里之外聞風而靡。人主富有四海，處九重之邃室，發號施令必當循陰陽之序、循四時之節，而後天下服從。此為治者所當法也。</p><p><strong>所出</strong>：《周易參同契 · 17章》 — https://zh.wikisource.org/wiki/周易參同契/17章</p></article></main></div></div>
