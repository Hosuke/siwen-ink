    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 下愚之狂惑</nav></header><main><article><h1>下愚之狂惑</h1><p>效忠赴死不察禍福，雖烈而非上智之所取。</p><p>懷冰先生譏世俗之忠曰：「要離滅家以效功，紀信赴燔以誑楚，陳賈刎頸以證弟，仲由投命而葅醢，嬴門伏劍以表心，聶政感惠而屠葅，荊卿絕臏以報燕，樊公含悲而授首，皆下愚之狂惑，豈上智之攸取哉！」言此輩皆不察成敗之勢，徒以匹夫之勇輕擲其身，非[[不動心]]之大人，乃[[匹夫之勇]]之屬也。</p><p><strong>所出</strong>：《抱朴子 · 卷01》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷01</p></article></main></div></div>
