    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 細柳軍</nav></header><main><article><h1>細柳軍</h1><p>周亞夫屯軍細柳，帝親勞軍，見其軍令嚴肅，乃稱善。</p><p>匈奴入寇，遣三將軍軍隴西、北地、上郡，中尉周舍為衛將軍，郎中令張武為車騎將軍，軍渭北。帝親自勞軍，勒兵申教令，賜軍吏卒。帝欲自將擊匈奴，群臣諫，皆不聽。皇太后固要帝，帝乃止。於是以東陽侯張相如為大將軍，成侯赤為內史，欒布為將軍，擊匈奴。又河內守周亞夫為將軍，居細柳；宗正劉禮為將軍，居霸上；祝茲侯軍棘門：以備胡。</p><p><strong>所出</strong>：《史記 · 卷010》 — https://zh.wikisource.org/wiki/史記/卷010</p></article></main></div></div>
