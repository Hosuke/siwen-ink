    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 大夫相見禮</nav></header><main><article><h1>大夫相見禮</h1><p>大夫相見，以鴈、以羔為摯，等級有差，飾維之儀各異也。</p><p>大夫相見以摯為禮，而等級有序。下大夫相見以鴈為摯，用布以為裝飾，以繩索維繫之，執之之儀如執雉然。</p><p>上大夫相見以羔為摯，布以為飾，四維之繩結於胸前，左頭持之，如人執麛然。羔、鴈之異，所以別尊卑也。</p><p>皆如士相見之禮行之，交拜辭讓，一如常儀。</p><p><strong>所出</strong>：《儀禮 · 士相見禮》 — https://zh.wikisource.org/wiki/儀禮/士相見禮</p></article></main></div></div>
