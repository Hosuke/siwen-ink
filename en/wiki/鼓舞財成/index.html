    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 鼓舞財成</nav></header><main><article><h1>鼓舞財成</h1><p>聖人鼓舞財成為萬有之蓍，知來藏往。</p><p>言大道之妙有一隂一陽，論聖人之範圍顯仁藏用，寔三元之胎祖，鼓舞財成為萬有之蓍，知來藏往。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷10》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷10</p></article></main></div></div>
