    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 嫘祖</nav></header><main><article><h1>嫘祖</h1><p>西陵氏之女，黃帝正妃，養蠶繅絲之祖。</p><p>黃帝居軒轅之丘，而娶於西陵之女，是爲嫘祖。嫘祖爲黃帝正妃，生二子，其後皆有天下：其一曰玄囂，是爲青陽，青陽降居江水；其二曰昌意，降居若水。</p><p><strong>所出</strong>：《史記 · 卷001》 — https://zh.wikisource.org/wiki/史記/卷001</p></article></main></div></div>
