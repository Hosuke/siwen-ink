    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 約定俗成</nav></header><main><article><h1>約定俗成</h1><p>名無固宜，因約定而成其宜；名無固實，因約定而成其實。</p><p>名無固宜，約之以命，約定俗成謂之宜，異於約則謂之不宜。名無固實，約之以命實，約定俗成謂之實名。名有固善，徑易而不拂，謂之善名。</p><p>物有同狀而異所者，有異狀而同所者，可別也。狀同而為異所者，雖可合，謂之二實。狀變而實無別而為異者，謂之化。有化而無別，謂之一實。此[[三名之樞要]]也。</p><p><strong>所出</strong>：《荀子 · 正名篇》 — https://zh.wikisource.org/wiki/荀子/正名篇</p></article></main></div></div>
