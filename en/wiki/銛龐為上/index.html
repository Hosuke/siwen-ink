    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 銛龐為上</nav></header><main><article><h1>銛龐為上</h1><p>兵以簡疾為上，美之則凶。</p><p>用兵之道，貴乎銛龐。銳利迅疾，簡而不繁，乃為上乘。若[[恬淡為上]]之旨，反是若美其兵、樂其殺，則是[[樂殺人者不可以得志]]，凶莫大焉。兵者[[兵者不祥之器]]，不可為[[君子居則貴左|君子之器]]，用之貴速貴簡，不貴夸耀。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第七十五章 貴左》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
