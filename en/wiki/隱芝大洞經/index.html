    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 隱芝大洞經</nav></header><main><article><h1>隱芝大洞經</h1><p>真人至乃授隱芝大洞之經，此金丹之秘道也。</p><p>隱芝大洞經者，金丹秘道之經也。經云「真人既至使六丁，即授隱芝大洞經」，言真人降臨，遣六丁之神傳授隱秘芝草之方、大洞經典，此所以通神靈、成道果者也。隱芝者，神芝之隱而不顯者；大洞經者，上清之高經也。學者當沐浴盛潔、散髮無欲、誦經萬遍，真人乃可降授焉。</p><p><strong>所出</strong>：《黃庭內景經 · 沐浴章第三十六》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/沐浴章第三十六</p></article></main></div></div>
