    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 欲坐觀成敗</nav></header><main><article><h1>欲坐觀成敗</h1><p>見兵事起而坐待成敗，見勝者欲合從之，心懷觀望，不忠之甚也。</p><p>任安為北軍使者護軍時，太子召安與節令發兵。安拜受節，入，閉門不出。武帝聞之，以為任安為詳邪，不傅事，何也。任安笞辱北軍錢官小吏，小吏上書言之，以為受太子節。書上聞，武帝曰：「是老吏也，見兵事起，欲坐觀成敗，見勝者欲合從之，有兩心。安有當死之罪甚眾，吾常活之，今懷詐，有不忠之心。」下安吏，誅死。</p><p><strong>所出</strong>：《史記 · 卷104》 — https://zh.wikisource.org/wiki/史記/卷104</p></article></main></div></div>
