    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 咸卦</nav></header><main><article><h1>咸卦</h1><p>澤山交感，取女之象，感應之正</p><p>咸，亨。利貞。取女吉。</p><p>卦以兌上艮下，澤在山上。柔上而剛下，二氣感應以相與，止而說，男下女。天地感而萬物化生，聖人感人心而天下和平。觀其所感，而天地萬物之情可見矣。</p><p><strong>所出</strong>：《周易 · 咸》 — https://zh.wikisource.org/wiki/周易/咸</p></article></main></div></div>
