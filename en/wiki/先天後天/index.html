    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 先天後天</nav></header><main><article><h1>先天後天</h1><p>聖人與天合德，先天以成事，後天以奉時。</p><p>文言釋九五大人之德曰：「夫大人者，與天地合其德，與日月合其明，與四時合其序，與鬼神合其吉凶。先天而天弗違，後天而奉天時。天且弗違，而況於人乎？！況於鬼神乎？！」先天者，先天之道，天未往而聖人成之；後天者，後天之道，天已運而聖人遵之。唯大人能與天同運，故天弗違而物胥化成。</p><p><strong>所出</strong>：《周易 · 文言》 — https://zh.wikisource.org/wiki/周易/文言</p></article></main></div></div>
