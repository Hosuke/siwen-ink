    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 墮三都</nav></header><main><article><h1>墮三都</h1><p>孔子帥令拆毀三桓之城牆。</p><p>使仲由為季氏宰，將墮三都。於是叔孫氏先墮郈。季氏將墮費，公山不狃、叔孫輒率費人襲魯……遂墮費。將墮成，公歛處父謂孟孫曰：「墮成，齊人必至于北門……」十二月，公圍成，弗克。此孔子欲拆毀三桓城池以強公室之事也。</p><p><strong>所出</strong>：《史記 · 卷047》 — https://zh.wikisource.org/wiki/史記/卷047</p></article></main></div></div>
