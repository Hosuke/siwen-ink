    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 鐵柱鎮蛟</nav></header><main><article><h1>鐵柱鎮蛟</h1><p>許遜役鬼神鑄鐵柱鎮蛟，誓鐵柱正則妖永除。</p><p>蛟精所穴不有以鎮之，後且復出為患，人不能制也。真君乃役鬼神於牙城南井鑄鐵為柱，出井外數尺，下施八索，鉤鎖地脈。延真宮是也。</p><p>祝之曰：「鐵柱若亞，其妖再興，吾當復出；鐵柱若正，其妖永除。」由是水妖屏邏，城邑無虞。</p><p>又慮後世奸雄妄作，故因鐵柱以為讖記，有「地勝人心善，永不出奸雄；縱有興謀者，終須不到頭」之言。真君之慮後世也，深有如此者。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 26》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/26</p></article></main></div></div>
