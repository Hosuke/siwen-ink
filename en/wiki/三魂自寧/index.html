    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 三魂自寧</nav></header><main><article><h1>三魂自寧</h1><p>三魂安靜，帝書之命自然降集。</p><p>三魂自寧帝書命，三魂者，爽靈、胎光、幽精，各安其舍則魂神清寧。帝書命者，天帝簡命之書，自然降集於身。魂寧則天書下降，壽命延長，修真者魂神清靜，帝命自至矣。</p><p><strong>所出</strong>：《黃庭內景經 · 上睹章第十六》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/上睹章第十六</p></article></main></div></div>
