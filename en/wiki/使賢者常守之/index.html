    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 使賢者常守之</nav></header><main><article><h1>使賢者常守之</h1><p>景公牛山流涕，晏子以為迭失迭得乃天運，非偶然流涕可止。</p><p>景公遊牛山，北臨國城而流涕曰：「若何滂滂去此而死乎？」艾孔、梁丘據皆從而泣，晏子獨笑於旁。公問之，晏子曰：「使賢者常守之，則太公、桓公將常守之矣；使勇者常守之，則靈公、莊公將常守之矣。數君者將守之，則吾君安得此位而立焉？以其迭處之，迭去之，至於君也，而獨為之流涕，是不仁也。」言人君之位，有迭有去，天運固然，獨為之涕，非知命者也。</p><p><strong>所出</strong>：《晏子春秋 · 卷一》 — https://zh.wikisource.org/wiki/晏子春秋/卷一</p></article></main></div></div>
