    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 嬴姓</nav></header><main><article><h1>嬴姓</h1><p>伯翳之後為嬴姓，其國將興。</p><p>史伯云伯翳能議百物以佐舜，其後為嬴姓。秦仲、齊侯，皆嬴姓之雋。史伯以此推之，以為嬴姓之國將興。秦果有其後，而伯翳之德未失祀也。</p><p><strong>所出</strong>：《國語 · 卷16》 — https://zh.wikisource.org/wiki/國語/卷16</p></article></main></div></div>
