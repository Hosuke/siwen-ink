    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 名與道不兩明</nav></header><main><article><h1>名與道不兩明</h1><p>世有盛名則衰至，人受名則道不用，道勝人則名息，二者競長，不能並立。</p><p>名與道不兩明，人受名則道不用，道勝人則名息矣。道與人競長。章人者，息道者也；人章道息，則危不遠矣。故世有盛名，則衰之日至矣。</p><p><strong>所出</strong>：《淮南子 · 詮言訓》 — https://zh.wikisource.org/wiki/淮南子/詮言訓</p></article></main></div></div>
