    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 民游世矣</nav></header><main><article><h1>民游世矣</h1><p>天下大治，百姓優游自適。</p><p>[[管仲]]言[[為天下]]之效：「菀濁困滯，皆法度不亡，往行不來，而民游世矣。」言法度既行，民得優游，無所困滞，此[[民游世矣]]之盛世也。</p><p><strong>所出</strong>：《管子 · 第19篇中匡》 — https://zh.wikisource.org/wiki/管子/第19篇中匡</p></article></main></div></div>
