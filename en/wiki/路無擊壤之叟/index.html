    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 路無擊壤之叟</nav></header><main><article><h1>路無擊壤之叟</h1><p>治世則民樂太平，路有擊壤之歌。</p><p>路無擊壤之叟，則羞聞和音之作；民有不粒之匱，則愧臨方丈之膳。</p><p><strong>所出</strong>：《抱朴子 · 卷05》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷05</p></article></main></div></div>
