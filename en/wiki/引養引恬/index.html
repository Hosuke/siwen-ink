    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 引養引恬</nav></header><main><article><h1>引養引恬</h1><p>長養民以德，長保安民之道。</p><p>《文心雕龍·養氣》所述養氣之法，與引養引恬之義相合。劉勰云吐納文蓺務在節宣，清和其心，條暢其氣，逍遙以針勞，談笑以藥倦，皆引養之術、致恬之道也。蓋人之心神，常動而易疲，唯善引養者能使之恬然不擾，悠遊自得。</p><p>  <strong>所出</strong>：《文心雕龍 · 養氣》 — https://zh.wikisource.org/wiki/文心雕龍/養氣</p></article></main></div></div>
