    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 彭越居梁地</nav></header><main><article><h1>彭越居梁地</h1><p>梁地之中立，既助漢亦助楚。</p><p>田橫亡走梁，歸彭越。彭越是時居梁地，中立，且為漢，且為楚。</p><p>及項籍滅，漢王立為皇帝，以彭越為梁王。越本盜賊，從師起兵於巨野澤中。楚漢之際，越據梁地，觀望成敗，既助漢擊楚，又持兩端以觀時變，其智術如此。</p><p><strong>所出</strong>：《史記 · 卷094》 — https://zh.wikisource.org/wiki/史記/卷094</p></article></main></div></div>
