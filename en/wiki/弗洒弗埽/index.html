    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 弗洒弗埽</nav></header><main><article><h1>弗洒弗埽</h1><p>廷內荒蕪不治，居所廢壞。</p><p>子有廷內，弗洒弗埽。</p><p>洒埽，洒水掃地也。言有宮室庭院而不洒掃以治，居處荒穢，政事亦將何如。晉昭公有朝廷而不能洒埽，故詩人刺之。</p><p><strong>所出</strong>：《詩經 · 山有樞》 — https://zh.wikisource.org/wiki/詩經/山有樞</p></article></main></div></div>
