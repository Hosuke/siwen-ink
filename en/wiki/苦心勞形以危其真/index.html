    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 苦心勞形以危其真</nav></header><main><article><h1>苦心勞形以危其真</h1><p>苦心勞形以危其真，仁者未免其身，距道遠矣。</p><p>子貢言孔子之志在於忠信仁義，漁父笑而還，行言曰：「仁則仁矣，恐不免其身；苦心勞形以危其真。嗚呼！遠哉其分於道也！」蓋有心為仁，反害其真；唯有道者，能全其天。</p><p><strong>所出</strong>：《莊子 · 漁父》 — https://zh.wikisource.org/wiki/莊子/漁父</p></article></main></div></div>
