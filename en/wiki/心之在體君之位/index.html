    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 心之在體君之位</nav></header><main><article><h1>心之在體君之位</h1><p>以心喻君，以九竅喻百官，明人君無為而治之義。</p><p>心之在體，君之位也。九竅之有職，官之分也。心處其道，九竅循理；嗜欲充益，目不見色，耳不聞聲。故上離其道，下失其事。是故君子虛心守正，不以智巧擾其耳目，使官各安其分、循其理。此[[心術者無為而制竅者]]之旨也。</p><p><strong>所出</strong>：《管子 · 第36篇心術上》 — https://zh.wikisource.org/wiki/管子/第36篇心術上</p></article></main></div></div>
