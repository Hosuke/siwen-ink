    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 王傅</nav></header><main><article><h1>王傅</h1><p>周人，服黃連百四十年，耳目聰明，髮白返黑，父子並昇天。</p><p>王傅字恭確，周人也。五十棄家學道，服黃連一百四十年，耳目聰明，智慧目廣，髮白返黑，齒落更生。有兒名神精，其父子並得道，後昇天而去。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 4》 — https://zh.wikisource/wiki/歷世真仙體道通鑑/4</p></article></main></div></div>
