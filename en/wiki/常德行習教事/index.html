    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 常德行習教事</nav></header><main><article><h1>常德行習教事</h1><p>君子法坎水之象，持守常德，修習教化之事。</p><p>象傳言「水洊至，習坎；君子以常德行，習教事」。</p><p>君子觀坎之重險，知水之德在恆久相繼，故持守其德行之常，又修習教化之事而不已。此以水之性喻君子之學，雖遇坎窪，不渝其德也。</p><p><strong>所出</strong>：《周易 · 坎》 — https://zh.wikisource.org/wiki/周易/坎</p></article></main></div></div>
