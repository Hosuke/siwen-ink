    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 子若遇之昇天漢</nav></header><main><article><h1>子若遇之昇天漢</h1><p>遇真則登天</p><p>天漢者，天河也。言修真之子，若能遇[[宅中有真常衣丹|宅中之真]]，悟[[出青入玄二炁煥|二炁之交煥]]，則形神脫洒，可以昇登天漢，與道合真矣。</p><p><strong>所出</strong>：《黃庭內景經 · 天中章第六》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/天中章第六</p></article></main></div></div>
