    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 社</nav></header><main><article><h1>社</h1><p>祭后土之神，共工氏之子后土能平九州，故祀以為社。</p><p>共工氏之霸九州也，其子曰后土，能平九州，故祀之以為社。又立大社、王社、國社、侯社、置社，尊卑有等。</p><p><strong>所出</strong>：《禮記 · 祭法》 — https://zh.wikisource.org/wiki/禮記/祭法</p></article></main></div></div>
