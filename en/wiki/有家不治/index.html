    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 有家不治</nav></header><main><article><h1>有家不治</h1><p>斥無道之君、有道之臣皆以治家為本，治家不治則一切皆敗。</p><p>管子既斥無道之君「有家不治，借人為國」，又述無道之臣「生奪之政」。而言有道之臣，則曰「事君有義，使下有禮」。合觀之，治家為治國之本，家苟不治而欲治國，猶乘漏舟而渡洪流，未有不覆者也。</p><p><strong>所出</strong>：《管子 · 第33篇四稱》 — https://zh.wikisource.org/wiki/管子/第33篇四稱
===終::</p></article></main></div></div>
