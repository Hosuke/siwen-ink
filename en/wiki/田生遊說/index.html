    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 田生遊說</nav></header><main><article><h1>田生遊說</h1><p>齊人田生為營陵侯劉澤遊說呂后近臣張子卿，卒使澤封瑯邪王。</p><p>高后時，齊人田生遊說干營陵侯澤，澤予金二百斤。田生歸齊後，澤使人召之，語以「弗與矣」。田生乃如長安，不見澤，假大宅，令其子求事呂后所幸大謁者張子卿。居數月，田生子請張卿臨，設具甚盛，張卿大驚。酒酣之間，田生屏人說之，陳呂后欲立諸呂之計，以為卿可乘此為澤求封。張卿然之，入言太后，太后許之，遂封澤為瑯邪王。</p><p><strong>所出</strong>：《史記 · 卷051》 — https://zh.wikisource.org/wiki/史記/卷051</p></article></main></div></div>
