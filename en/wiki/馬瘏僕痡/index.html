    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 馬瘏僕痡</nav></header><main><article><h1>馬瘏僕痡</h1><p>馬病僕病，喻行役之苦。</p><p>《卷耳》卒章云「我馬瘏矣，我僕痡矣」，迭言馬僕皆病，以見行役之極苦也。馬瘏則不能行，僕痡則不能馭，上下皆病，道途之艱可知。后妃知臣下之勤勞，實本於此詩之喻也。</p><p><strong>所出</strong>：《詩經 · 卷耳》 — https://zh.wikisource.org/wiki/詩經/卷耳</p></article></main></div></div>
