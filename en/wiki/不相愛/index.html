    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 不相愛</nav></header><main><article><h1>不相愛</h1><p>不相愛者，天下亂事之所由起也。人各私其身，不愛他人，故虧人以自利，乃至盜賊攻伐。</p><p><strong>不相愛</strong>者，墨子所指為天下亂之本源也。夫人之有亂，非天之降殃，乃人之自致。其致之之道，在於不相愛。</p><p>墨子歷數其狀：於家則子不愛父，弟不愛兄，臣不愛君，各虧其所愛者以自利；於盜賊則竊異室以利其室，賊人以利其身；於大夫則亂異家以利其家；於諸侯則攻異國以利其國。凡此種種，皆起於人唯知自愛，而不知愛人。</p><p>墨子明言：「天下之亂物，具此而已矣。」謂天下之亂象，盡於此矣，無他故也。其救治之道，亦惟在使人兼相愛而已。</p></article></main></div></div>
