    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 躑躅</nav></header><main><article><h1>躑躅</h1><p>漸染毒物以為常，則強弩巨鼎皆可漸引漸舉。</p><p>躑躅之酒，烏啄之脯，莨蕩之膏，冶葛之乳。初啖之若芥，再啖之若黍，復啖之若丸，又啖之若脯。小人由是知強弩可以漸引，巨鼎可以漸舉，水火可以漸習，虎兕可以漸侶。逆者我所化，辱者我所與，不應者我所命，不臣者我所取。所以信柔馬不可馭，漸賊不可禦。得之以為萬化之母。</p><p><strong>所出</strong>：《化書 · 卷四》 — https://zh.wikisource.org/wiki/化書/卷四</p></article></main></div></div>
