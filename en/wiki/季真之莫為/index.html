    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 季真之莫為</nav></header><main><article><h1>季真之莫為</h1><p>或使莫為，皆未免於物，未為虛無之至。</p><p>少知問季真之莫為、接子之或使，二家之議孰正於其情、孰徧於其理。大公調曰：「雞鳴狗吠，是人之所知；雖有大知，不能以言讀其所自化，又不能以意其所將為。斯而析之，精至於无倫，大至於不可圍，或之使，莫之為，未免於物而終以為過。或使則實，莫為則虛。有名有實，是物之居；无名无實，在物之虛。可言可意，言而癒疏。」吾觀之本，其往无窮；吾求之末，其來无止。无窮无止，言之无也，與物同理。</p><p><strong>所出</strong>：《莊子 · 則陽》 — https://zh.wikisource.org/wiki/莊子/則陽</p></article></main></div></div>
