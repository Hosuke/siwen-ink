    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 隨風巽</nav></header><main><article><h1>隨風巽</h1><p>風與風相隨，君子申命行事之象也。</p><p>《象》曰「隨風，巽」，明此卦之象也。疊巽為重風，風之相隨者，無時而不至，無物而不入。君子觀此象，乃以申命行事。命出於上而行於下者，風之義也；相隨而不已者，風之象也。治道之要，在乎命令之重申，風以象之。</p><p><strong>所出</strong>：《周易 · 巽》 — https://zh.wikisource.org/wiki/周易/巽</p></article></main></div></div>
