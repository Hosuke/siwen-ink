    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 疏通知遠而不誣</nav></header><main><article><h1>疏通知遠而不誣</h1><p>深於《書》者，兼疏通博聞與信實而不流於誣。</p><p>《書》之教使人疏通知遠，然過於疏通則失之誣。唯疏通知遠而不誣者，乃為深於《書》者也。</p><p><strong>所出</strong>：《禮記 · 經解》 — https://zh.wikisource.org/wiki/禮記/經解</p></article></main></div></div>
