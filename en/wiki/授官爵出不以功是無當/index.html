    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 授官爵出不以功是無當</nav></header><main><article><h1>授官爵出不以功是無當</h1><p>授官受祿不以功，猶器無底，終不能盈。</p><p>三寸之管毋當，不可滿也。授官爵、出利祿不以功，是無當也。管無底則不能盛物，官無功而受賞則不能服人。是以官爵之予，必驗之於功，賞祿之出，必考之於實，否則名器混淆，法制隳矣。</p><p><strong>所出</strong>：《韓非子 · 飭令》 — https://zh.wikisource.org/wiki/韓非子/飭令</p></article></main></div></div>
