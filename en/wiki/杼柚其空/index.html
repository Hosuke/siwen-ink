    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 小東大東，杼柚其空</nav></header><main><article><h1>小東大東，杼柚其空</h1><p>東土之民，機杼盡空，無衣可製</p><p>「小東」「大東」，皆指東方之地，大小諸侯之國也。言東土之民，被征斂至急，機杼之杼柚皆空矣。杼，梭也；柚，軸也。杼柚其空，則布帛無出，是以糾糾葛屨可以履霜，無布履可易，唯著葛屨以踐霜雪。此述民之困悴，亦見周室征求之酷也。</p><p><strong>所出</strong>：《詩經 · 大東》 — https://zh.wikisource.org/wiki/詩經/大東</p></article></main></div></div>
