    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 黃髮終否而不悢悢</nav></header><main><article><h1>黃髮終否而不悢悢</h1><p>賢者終不得志而不悔恨，以見君子安命守道之節。</p><p>抱朴子曰：「黃髮終否，而不悢悢也。安肯蹙太山之峻，以適鑿枘之中；斂垂天之羽，為戒旦之役？編於仕類，而抑郁庸兒之下。舍鸞鳳之林，適枳棘之藪，競腐鼠於踞鴟，而枉尺以直尋哉！」</p><p><strong>所出</strong>：《抱朴子 · 卷20》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷20</p></article></main></div></div>
