    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 古亟於德中世逐智當今爭力</nav></header><main><article><h1>古亟於德中世逐智當今爭力</h1><p>治世之道各殊：古人急於德，中世逐於智，當今爭於力。</p><p>古人亟於德，中世逐於智，當今争於力。古者寡事而備簡，樸陋而不盡，故有珧銚而推車者；處多事之時，用寡士之器，非智者之備也；當大爭之世，而循揖讓之軌，非聖人之治也。故智者不乘推車，聖人不行推政。</p><p><strong>所出</strong>：《韓非子 · 八說》 — https://zh.wikisource.org/wiki/韓非子/八說</p></article></main></div></div>
