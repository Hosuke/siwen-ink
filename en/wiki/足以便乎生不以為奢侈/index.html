    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 足以便乎生，不以為奢侈</nav></header><main><article><h1>足以便乎生，不以為奢侈</h1><p>宮室之作，但求便民，不尚華美。</p><p>古者之為宮室也，足以便乎生，不以為奢侈也，故節於身，謂於民。</p><p>晏子之論，以為宮室之作，本以便生民之居，非以示威儀之美也。上不節己，下必效尤；上不奢侈，下乃知儉。是以古之王天下者，土事不文，木事不鏤，示民以節也。及夏之衰，桀為璁室玉門；殷之衰，紂為傾宮靈台，卒以速亡。此古今之明驗也。</p><p><strong>所出</strong>：《晏子春秋 · 卷二》 — https://zh.wikisource.org/wiki/晏子春秋/卷二</p></article></main></div></div>
