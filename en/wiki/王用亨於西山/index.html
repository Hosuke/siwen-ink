    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 王用亨於西山</nav></header><main><article><h1>王用亨於西山</h1><p>羈絆既解，王者可以亨祀於遠西山之上。</p><p>上六：「拘係之，乃從維之。王用亨於西山。」象曰：「拘係之，上窮也。」</p><p>上六居隨之極，上无應援，羈絆至於穷尽。然「乃從維之」者，言羈絆之中仍有維繋之理。王者因時制變，亨祀於西山，遠去塵囂，以通神明。夫拘係之甚，上至穷极，乃能脫然而出，其道在於從之而維之，非徒以力勝也。</p><p><strong>所出</strong>：《周易 · 隨》 — https://zh.wikisource.org/wiki/周易/隨</p></article></main></div></div>
