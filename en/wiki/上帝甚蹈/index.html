    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 上帝甚蹈</nav></header><main><article><h1>上帝甚蹈</h1><p>言天道變動不常，不可測也。</p><p>「上帝甚蹈」，蹈，踐也，變動也。言天帝變動不常，其道難測。詩人以此戒世，勿輕附麗於人或天象。</p><p>《菀柳》詩人見[[詩經菀柳|菀柳]]之盛而有戒心，聞天帝之變而不敢昵近，皆出於對變幻莫測之敬畏也。</p><p><strong>所出</strong>：《詩經 · 菀柳》 — https://zh.wikisource.org/wiki/詩經/菀柳</p></article></main></div></div>
