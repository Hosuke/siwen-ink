    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 陽平治都功印</nav></header><main><article><h1>陽平治都功印</h1><p>天師以陽平治都功印為法印，總治萬靈。</p><p>陽平治都功印者，天師張道陵所掌太上老君親授之印也。
