    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 好牛</nav></header><main><article><h1>好牛</h1><p>通稱隨定形則名分自離</p><p>語曰：好牛，又曰：不可不察也。「好」則物之通稱，「牛」則物之定形，以通稱隨定形，不可窮極者也。設復言「好馬」，則復連於「馬」矣，則「好」所通，無方也。設復言「好人」，則彼屬於人矣，則「好」非人，「人」非好也。則「好牛」、「好馬」、「好人」之名自離矣，故曰：名分不可相亂也。</p><p><strong>所出</strong>：《尹文子 · 大道上》 — https://zh.wikisource.org/wiki/尹文子/大道上</p></article></main></div></div>
