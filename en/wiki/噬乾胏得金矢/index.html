    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 噬乾胏得金矢</nav></header><main><article><h1>噬乾胏得金矢</h1><p>噬艱難之物而得剛直之象，喻艱貞致福</p><p>九四之爻，噬乾胏，得金矢。乾胏者，肉之乾而帶骨者，噬之艱難；金矢者，金為之鏃，矢為直物，剛直之象也。</p><p>當噬嗑之時，必用力以噬，而後可得通。乾胏至艱，噬之非易，而竟得金矢，是艱苦之中有至剛至直之德感之也。夫能艱苦而不變其守，則外得金矢之象，內有貞固之德，故利艱貞而吉也。</p><p><strong>所出</strong>：《周易 · 噬嗑》 — https://zh.wikisource.org/wiki/周易/噬嗑</p></article></main></div></div>
