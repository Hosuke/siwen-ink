    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 享于克誠</nav></header><main><article><h1>享于克誠</h1><p>鬼神無常享，能誠則享。</p><p>[[克敬惟親]]之義及於鬼神。鬼神享祀無常，唯能誠敬者，鬼神饗之。是故接鬼神之道，與接天接人一也——敬與誠而已。</p><p><strong>所出</strong>：《尚書 · 太甲下》 — https://zh.wikisource.org/wiki/尚書/太甲下</p></article></main></div></div>
