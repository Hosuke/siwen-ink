    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 幼伯子</nav></header><main><article><h1>幼伯子</h1><p>周蘇氏客，形貌歲異，後數十年更壯，世世誠枯蘇氏子孫。</p><p>幼伯子者，周蘇氏客也。冬嘗著單衣，盛暑著懦拷。形貌歲異，後數十年更壯，時人莫知。世世來誠枯蘇氏子孫，得其福力焉。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 3》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/3</p></article></main></div></div>
