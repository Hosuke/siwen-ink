    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 復歸於無物</nav></header><main><article><h1>復歸於無物</h1><p>道歸無物，物由道生。</p><p>[[繩繩不可名]]，卒復歸於無物。無物者，道之體也。第十四章言道始於視聽之不及，[[混而為一]]，終於[[復歸於無物]]，而以[[道紀]]終焉。明道為萬物之宗，而終以無物為的也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 十四章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
