    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 豈敢憚行</nav></header><main><article><h1>豈敢憚行</h1><p>非畏行路之難，畏己之不能躋也。</p><p>《緜蠻》云「豈敢憚行，畏我不能躋」。行者，道路也；躋者，升也。言非憚於道路之艱，實畏己之才力不足以上達也。君子之敬事上也，恒以自強為心，若己之不能，則愧怍生焉。此與[[戰戰兢兢]]之義相發。</p><p><strong>所出</strong>：《詩經 · 緜蠻》 — https://zh.wikisource.org/wiki/詩經/緜蠻</p></article></main></div></div>
