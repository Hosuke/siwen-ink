    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 利君子貞</nav></header><main><article><h1>利君子貞</h1><p>君子守正，無所不利</p><p>「利君子貞」者，[[同人]]卦辭之終也。</p><p>[[同人]]之世，天下大同，然非人人皆能同之，[[君子]]以其中正之德、光明之行，方可以正行事，無所不利。貞者，正而固也，君子守正不渝，則[[同人]]之功可成。</p><p>天下之志不難通，惟患於私。君子能[[類族辨物]]而不私，故[[通天下之志]]。此「利君子貞」之本義也。</p><p><strong>所出</strong>：《周易 · 同人》 — https://zh.wikisource.org/wiki/周易/同人</p></article></main></div></div>
