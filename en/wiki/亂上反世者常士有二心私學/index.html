    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 亂上反世者常士有二心私學</nav></header><main><article><h1>亂上反世者常士有二心私學</h1><p>亂上反世之徒，大抵皆有二心私學。</p><p>凡亂上反世者，常士有二心私學者也。故《本言》曰：「所以治者，法也；所以亂者，私也。法立，則莫得為私矣。」</p><p>夫立法令者，以廢私也，法令行而私道廢矣。私者，所以亂法也。而士有二心私學、巖居窞路、託伏深慮，大者非世，細者惑下，上不禁，又從而尊之以名，化之以實，是無功而顯，無勞而富也。</p><p><strong>所出</strong>：《韓非子 · 詭使》 — https://zh.wikisource.org/wiki/韓非子/詭使</p></article></main></div></div>
