    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 主不積務於兵，以其國予人</nav></header><main><article><h1>主不積務於兵，以其國予人</h1><p>君怠武備，國必隨亡。</p><p>主不積務於兵者，以其國予人也。</p><p>君上不以兵事為急，是將祖宗基業拱手讓人。積務者，時時備之，念念不忘之謂。</p><p><strong>所出</strong>：《管子 · 第28篇參患》 — https://zh.wikisource.org/wiki/管子/第28篇參患</p></article></main></div></div>
