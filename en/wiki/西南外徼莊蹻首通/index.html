    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 西南外徼莊蹻首通</nav></header><main><article><h1>西南外徼莊蹻首通</h1><p>太史公論西南夷緣起、置郡及滇王獨受王印之事</p><p>太史公曰：楚之先豈有天祿哉？在周為文王師，封楚。及周之衰，地稱五千里。秦滅諸候，唯楚苗裔尚有滇王。漢誅西南夷，國多滅矣，唯滇復為寵王。然南夷之端，見枸醬番禺，大夏杖、邛竹。西夷后揃，剽分二方，卒為七郡。</p><p>【索隱述贊】西南外徼，莊蹻首通。漢因大夏，乃命唐蒙。勞洸、靡莫，異俗殊風。夜郎最大，邛、筰稱雄。及置郡縣，萬代推功。</p><p><strong>所出</strong>：《史記 · 卷116》 — https://zh.wikisource.org/wiki/史記/卷116</p></article></main></div></div>
