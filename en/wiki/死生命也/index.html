    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 死生命也</nav></header><main><article><h1>死生命也</h1><p>死生皆命，若夜旦之常，不可與於人事。</p><p>死生，命也；其有夜旦之常，天也。人之有所不得與，皆物之情也。</p><p><strong>所出</strong>：《莊子 · 大宗師》 — https://zh.wikisource.org/wiki/莊子/大宗師</p></article></main></div></div>
