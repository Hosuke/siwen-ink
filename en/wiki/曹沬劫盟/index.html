    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 曹沬劫盟</nav></header><main><article><h1>曹沬劫盟</h1><p>曹沬以匕首劫盟誓，退而還地不失信</p><p>桓公與魯會柯而盟，曹沬以匕首劫桓公於壇上，曰：「反魯之侵地！」桓公許之。已而曹沬去匕首，北面就臣位。桓公后悔，管仲曰：「夫劫許之而倍信殺之，愈一小快耳，而棄信於諸侯，失天下之援，不可。」桓公乃與曹沬三敗所亡地於魯。諸侯聞之，皆信齊而欲附焉。此兼取誠信與權變，以成霸業也。</p><p><strong>所出</strong>：《史記 · 卷032》 — https://zh.wikisource.org/wiki/史記/卷032</p></article></main></div></div>
