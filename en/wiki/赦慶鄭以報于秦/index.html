    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 赦慶鄭以報于秦</nav></header><main><article><h1>赦慶鄭以報于秦</h1><p>赦之以報秦，不可殺之</p><p>晉惠公夷吾既為秦所虜，及歸，慶鄭不救惠公，惠公斬之。然秦晉之交，恩怨相尋，惠公先負約，秦猶賑其粟；秦伐晉而敗，晉卒歸三將，惠公終以河西地贖身。君子論之，以為秦能用德而晉屢失信也。</p><p>  <strong>所出</strong>：《史記 · 卷005》 — https://zh.wikisource.org/wiki/史記/卷005</p></article></main></div></div>
