    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 過而里革匡我</nav></header><main><article><h1>過而里革匡我</h1><p>臣有過則匡正之，是為良臣；君能納諫，是為明主。</p><p>宣公夏濫於泗淵，里革斷其罟而棄之，曰古之訓也。公聞之曰：「吾過而里革匡我，不亦善乎！是良罟也，為我得法，使有司藏之，使吾無忘諗。」師存侍，曰：「藏罟不如寘里革於側之不忘也。」</p><p><strong>所出</strong>：《國語 · 卷04》 — https://zh.wikisource.org/wiki/國語/卷04</p></article></main></div></div>
