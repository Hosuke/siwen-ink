    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 賞罰以為君</nav></header><main><article><h1>賞罰以為君</h1><p>賞罰乃君之所以為君，失度則民不附、國危亡</p><p>國之所以為國者，民體以為國。君之所以為君者，賞罰以為君。致賞則匱，致罰則虐。財匱而令虐，所以失其民也。是故明君審居處之教，使民可居、可治、可戰、可守。賞罰者，人主之威也。威惠遷於下，則為人上者危矣。[[賞罰以信]]</p><p><strong>所出</strong>：《管子 · 第31篇君臣下》 — https://zh.wikisource.org/wiki/管子/第31篇君臣下</p></article></main></div></div>
