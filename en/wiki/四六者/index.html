    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 四六者蕩胸中</nav></header><main><article><h1>四六者蕩胸中</h1><p>勃志、謬心、累德、塞道四者各六，合為二十四患，唯虛乃正。</p><p>徹志之勃，解心之謬，去德之累，達道之塞。勃志者六：貴、富、顯、嚴、名、利。謬心者六：容、動、色、理、氣、意。累德者六：惡、欲、喜、怒、哀、樂。塞道者六：去、就、取、與、知、能。此四六者，不蕩胸中則正，正則靜，靜則明，明則虛，虛則无為而无不為也。</p><p><strong>所出</strong>：《莊子 · 庚桑楚》 — https://zh.wikisource.org/wiki/莊子/庚桑楚</p></article></main></div></div>
