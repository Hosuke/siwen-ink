    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 唐易之言弋</nav></header><main><article><h1>唐易之言弋</h1><p>弋者謹廪，猶人主之謹法令；虚静無為乃治國之本</p><p>田子方問唐易鞠曰：「弋者何慎？」對曰：「鳥以數百目視子，子以二目御之，子謹周子廩。」田子方曰：「善。子加之弋，我加之國。」</p><p>鄭長者聞之曰：「田子方知欲為廩，而未得所以為廪。夫虚無無見者，廪也。」</p><p>又載[[申子之言]]曰：「『在人主之所執也。』」唐易弋射之喻，與[[申子]]「六慎」之旨相通，皆貴[[虚静以待]]、貴[[獨視者謂明獨聽者謂聰]]之說也。</p><p><strong>所出</strong>：《韓非子 · 外儲說右上》 — https://zh.wikisource.org/wiki/韓非子/外儲說右上</p></article></main></div></div>
