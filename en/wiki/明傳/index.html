    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 明傳</nav></header><main><article><h1>明傳</h1><p>先聖之道，在止三失而起四德，義勝欲昌，敬勝怠吉。</p><p>文王寢疾，召太公望，欲以至道之言明傳子孫。</p><p>太公曰：「先聖之道，其所止，其所起，可得聞乎？」太公曰：「見善而怠，時至而疑，知非而處，此三者，道之所止也。柔而靜，恭而敬，強而弱，忍而剛，此四者，道之所起也。」</p><p>又申其旨曰：「故義勝欲則昌，欲勝義則亡；敬勝怠則吉，怠勝敬則滅。」</p><p>此[[修身]]之要義，與[[過則改之]]相通，而歸於[[敬慎]]者也。</p><p><strong>所出</strong>：《六韜》 — https://zh.wikisource.org/wiki/六韜</p></article></main></div></div>
