    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 膏人肉人脂人</nav></header><main><article><h1>膏人肉人脂人</h1><p>膏人縱腹垂腴，肉人上下容大，脂人雖脂不能大，治必先別其三形。</p><p>是故膏人縱腹垂腴，肉人者，上下容大，脂人者，雖脂不能大也。必先別其三形，血之多少，氣之清濁，而後調之。</p><p><strong>所出</strong>：《黃帝內經 · 靈樞第九卷》 — https://zh.wikisource.org/wiki/黃帝內經/靈樞第九卷</p></article></main></div></div>
