    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 二真堅玉君</nav></header><main><article><h1>二真堅玉君</h1><p>上清大洞守胃之神，名凝羽珠，堅玉守靈，絕滅三尸。</p><p>二真堅玉君，上清大洞真經所載胃脘二真之一神也。其字曰凝羽珠，主兆太倉之腑五腸之口死炁之門。常守其位，則黃庭香潔，三尸滅絕，中元之炁常滿，帝皇之光鬱鬱，上衝泥丸，敷散骨節。修誦此章，當存呼其內諱，佩消魔玉符，叩齒三通，咽液二過。</p><p><strong>所出</strong>：《上清大洞真經 · 18章》 — https://zh.wikisource.org/wiki/上清大洞真經/18章</p></article></main></div></div>
