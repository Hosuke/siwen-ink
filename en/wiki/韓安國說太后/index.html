    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 韓安國說太后</nav></header><main><article><h1>韓安國說太后</h1><p>韓安國以長公主為介，彌縫梁王與太后之隙。</p><p>梁王怨望，使韓安國因長公主謝罪太后。韓安國見長公主，說曰：「梁王揣上意，欲為嗣。及吳楚七國之亂，梁王以區區之城，親矢石，與太尉、亞夫同心，又馳入吳楚反壁，說止原涉。此其功豈可忘哉！今事浸乃覺悟，愁悔之甚。太后飲食不甘，遊觀不樂，皆梁王之過也。」</p><p>長公主入言太后，太后以為然，乃起至帝前泣。帝心疑梁王，太后怒不解。</p><p><strong>所出</strong>：《史記 · 卷058》 — https://zh.wikisource.org/wiki/史記/卷058</p></article></main></div></div>
