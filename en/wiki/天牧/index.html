    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 天牧</nav></header><main><article><h1>天牧</h1><p>奢者三歲之計一歲之用，儉者一歲之計三歲之用；能終其儉者可以為天下牧。</p><p>奢者三歲之計，一歲之用；儉者一歲之計，三歲之用。至奢者猶不及，至儉者尚有餘。奢者富不足，儉者貧有餘。奢者心常貧，儉者心常富。奢者好親人，所以多過，儉者能遠人，所以寡禍。奢者事君必有所辱，儉者事君必保其祿。奢者多憂，儉者多福，能終其儉者，可以為天下之牧。</p><p><strong>所出</strong>：《化書 · 卷六》 — https://zh.wikisource.org/wiki/化書/卷六</p></article></main></div></div>
