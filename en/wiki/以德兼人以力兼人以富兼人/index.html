    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 以德兼人以力兼人以富兼人</nav></header><main><article><h1>以德兼人以力兼人以富兼人</h1><p>兼人之道有德、力、富三術，效果截然不同。</p><p>孫卿子云：「凡兼人者有三術：有以德兼人者，有以力兼人者，有以富兼人者。」以德兼人者，民親其上，樂其君，樂為之死，故王。以力兼人者，民畏威而離心，戎甲俞眾而奉養必費，故弱。以富兼人者，民虛腹張口來歸，食之、富之、立良有司接之，期年而後可信，故貧。故曰：以德兼人者王，以力兼人者弱，以富兼人者貧，古今一也。</p><p><strong>所出</strong>：《荀子 · 議兵篇》 — https://zh.wikisource.org/wiki/荀子/議兵篇</p></article></main></div></div>
