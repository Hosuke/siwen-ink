    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 刑德月占</nav></header><main><article><h1>刑德月占</h1><p>刑德迭居，以月為佔</p><p>十一月大德在初九，居地下，德時在室中，故內有氣，萬物歸之也；時刑在上六，在四遠野，故外無氣而清也，外空萬物，士眾皆歸王德，隨之入黃泉之下。十二月德在九二，之時在醜，居土之中，而未出達；時德在明堂，萬物隨德而上，未敢出見，上有刑也。</p><p>四月巳，德在上九，到於六遠八境，盛德八方，善氣陽氣莫不響應相生；時刑在萬物之根，居內室，故下空無物，而上茂盛也，莫不樂從德而為治也。</p><p><strong>所出</strong>：《太平經 · 12》 — https://zh.wikisource.org/wiki/太平經/12</p></article></main></div></div>
