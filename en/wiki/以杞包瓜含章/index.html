    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 以杞包瓜含章</nav></header><main><article><h1>以杞包瓜含章</h1><p>九五爻辭，杞葉包瓜，含蓄章美，喻聖人含弘光大之德。</p><p>「九五：以杞包瓜，含章，有隕自天。」</p><p>杞，柳屬，其葉可包物。瓜性柔弱易敗，必有以包之乃可久存。九五陽剛中正，具含容之德，故能包此易敗之物，涵蓄其章美而不露也。</p><p>象曰「九五含章，中正也」，言九五之德，中而且正，含蓄章美而不自炫也。有隕自天者，言其福澤之來，若天降然，非人力所能致也。</p><p><strong>所出</strong>：《周易 · 姤》 — https://zh.wikisource.org/wiki/周易/姤</p></article></main></div></div>
