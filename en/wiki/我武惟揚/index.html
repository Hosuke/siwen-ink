    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 我武惟揚</nav></header><main><article><h1>我武惟揚</h1><p>振揚武力，侵取凶殘，誅暴救民。</p><p>我武惟揚，侵于之疆，取彼凶殘，我伐用張。言振作我之兵威，侵伐商之疆土，俘獲其凶暴之徒，征伐之事由是而大張也。武王伐罪吊民，師出有名，故其武得以振揚。此頌師旅之盛、征伐之正也。</p><p><strong>所出</strong>：《尚書 · 泰誓中》 — https://zh.wikisource.org/wiki/尚書/泰誓中</p></article></main></div></div>
