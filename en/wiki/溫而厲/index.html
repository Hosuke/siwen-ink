    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 子溫而厲，威而不猛，恭而安</nav></header><main><article><h1>子溫而厲，威而不猛，恭而安</h1><p>聖人中和之德。</p><p>[[孔子]]之德：[[溫而厲]]者，溫和而嚴厲；[[威而不猛]]者，有威而不暴；[[恭而安]]者，恭敬而安詳。[[聖人]]之容，[[中庸]]之道也。[[申申如也，夭夭如也]]，亦見聖人氣象之自然。</p><p><strong>所出</strong>：《論語 · 述而第七》 — https://zh.wikisource.org/wiki/論語/述而第七</p></article></main></div></div>
