    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 賞足以勸善，威足以勝暴</nav></header><main><article><h1>賞足以勸善，威足以勝暴</h1><p>賞罰並用，治國之要也。</p><p>聖王之立法也，其賞足以勸善，其威足以勝暴，其備足以必完法。夫賞所以勸善，使民嚮善而不倦；威所以勝暴，使姦宄畏威而不敢犯。二者相濟，然後法度可成，治世可致也。</p><p><strong>所出</strong>：《韓非子 · 守道》 — https://zh.wikisource.org/wiki/韓非子/守道</p></article></main></div></div>
