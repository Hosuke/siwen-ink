    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 劉綱</nav></header><main><article><h1>劉綱</h1><p>晉時真人，師事帛君，得道上昇。</p><p>劉綱，晉時下邳人也。初居四明山，後為上虞令，師事帛君受道，治中部事。歷年道成，作《續仙傳》行於世。</p><p>一日，邀諸親故人會別，飲食畢，上縣廳側大皂莢樹上，去地十餘丈，舉手而別，忽然飛入雲中而去。其妻亦得道，同時昇舉。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 31》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/31</p></article></main></div></div>
