    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 辰星正四時</nav></header><main><article><h1>辰星正四時</h1><p>辰星以二月、五月、八月、十一月效四方之星，正四時之節。</p><p>辰星正四時，常以二月春分效奎、婁，以五月夏至效東井、輿鬼，以八月秋分效角、亢，以十一月冬至效斗、牽牛。出以辰戌，入以丑未，出二旬而入。晨候之東方，夕候之西方。一時不出，其時不和；四時不出，天下大饑。</p><p><strong>所出</strong>：《淮南子 · 天文訓》 — https://zh.wikisource.org/wiki/淮南子/天文訓</p></article></main></div></div>
