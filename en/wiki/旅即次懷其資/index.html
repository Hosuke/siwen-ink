    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 旅即次懷其資</nav></header><main><article><h1>旅即次懷其資</h1><p>羈旅得舍，懷有所資。</p><p>旅即次，懷其資，得童僕貞。六二柔中當位，旅而有次，懷資得僕，象曰「終无尤」也。</p><p><strong>所出</strong>：《周易 · 旅》 — https://zh.wikisource.org/wiki/周易/旅</p></article></main></div></div>
