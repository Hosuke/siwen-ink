    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 至智說至聖</nav></header><main><article><h1>至智說至聖</h1><p>至智之人說至聖之君，言未必即受。伊尹說湯，身執鼎俎為庖宰，昵近習親而後湯知其賢而用之。以卑屈親近為階，非直言之所能遽入也。</p><p>上古有湯，至聖也；伊尹，至智也。夫至智說至聖，然且七十說而不受；身執鼎爼爲庖宰，昵近習親，而湯乃僅知其賢而用之。故曰：以至智說至聖，未必至而見受，伊尹說湯是也。</p><p><strong>所出</strong>：《韓非子 · 難言》 — https://zh.wikisource.org/wiki/韓非子/難言</p></article></main></div></div>
