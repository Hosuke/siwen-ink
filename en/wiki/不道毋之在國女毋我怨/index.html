    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 不道，毋之在國，女毋我怨</nav></header><main><article><h1>不道，毋之在國，女毋我怨</h1><p>告誡諸侯，不循道者，當誅絕于境內，勿怨于王。</p><p>湯終誥之辭：「不道，毋之在國，女毋我怨。」言諸侯若行不道，則誅滅之，置于境外，汝勿怨我也。</p><p><strong>所出</strong>：《尚書 · 湯誥》 — https://zh.wikisource.org/wiki/尚書/湯誥</p></article></main></div></div>
