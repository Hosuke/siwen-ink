    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 漆沮之從</nav></header><main><article><h1>漆沮之從</h1><p>循漆沮之水，致之天子之所。</p><p>漆、沮，二水名。漆水出今陝西，沮水亦出同地，會流而入渭。漆沮之間，為周人祖宗之地。天子田獵於漆沮之濱，乃依就近水草豐美之所，兼寓不忘先祖之義。《大雅·緜》言「率西漆沮」，亦此水也。</p><p>詩言獸聚漆沮之間，故從而致之於天子射獵之所。</p><p><strong>所出</strong>：《詩經 · 吉日》 — https://zh.wikisource.org/wiki/詩經/吉日</p></article></main></div></div>
