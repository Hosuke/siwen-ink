    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 方寸之地虛</nav></header><main><article><h1>方寸之地虛</h1><p>文摯視龍叔之心，方寸之地虛矣，幾聖人</p><p>龍叔謂文摯曰：「子之術微矣。吾有疾，子能已乎？」文摯問其所病，龍叔具言其情狀，謂毀譽、得失、生死、富貧皆不能動，又曰：「固不可事國君，交親友，御妻子，制僕隸。」文摯乃命龍叔背明而立，自後向明而望之，曰：「吾見子之心矣，方寸之地虛矣。幾聖人也！子心六孔流通，一孔不達。今以聖智爲疾者，或由此乎！」</p><p><strong>所出</strong>：《列子 · 仲尼篇》 — https://zh.wikisource.org/wiki/列子/仲尼篇</p></article></main></div></div>
