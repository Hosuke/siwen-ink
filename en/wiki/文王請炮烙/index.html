    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 文王請炮烙</nav></header><main><article><h1>文王請炮烙</h1><p>文王辭千里之地，獨請去炮烙之刑，以為民請命。</p><p>文王處歧事紂，冤侮雅遜，朝夕必時，上貢必適，祭祀必敬。紂喜，命文王稱西伯，賜之千里之地。文王載拜稽首而辭曰：「願為民請炮烙之刑。」文王非惡千里之地，以為民請炮烙之刑，必欲得民心也。得民心則賢於千里之地，故曰文王智矣。</p><p><strong>所出</strong>：《呂氏春秋 · 卷九》— https://zh.wikisource.org/wiki/呂氏春秋/卷九</p></article></main></div></div>
