    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 登是南邦</nav></header><main><article><h1>登是南邦</h1><p>王命申伯奄有南土，世執其功，永保侯國。</p><p>王命申伯「登是南邦，世執其功」，言使申伯奄有南土，為南國之長，令其子孫世代保守功業，無有怠廢也。 [[謝人]] 因之以作爾庸，[[召伯]] 定其宅兆，徹其土田，而申伯之國以成。詩序云「天下復平，能建國親諸侯，褒賞申伯焉」，正此之謂。</p><p><strong>所出</strong>：《詩經 · 崧高》 — https://zh.wikisource.org/wiki/詩經/崧高</p></article></main></div></div>
