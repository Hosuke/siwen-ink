    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 為道者日損</nav></header><main><article><h1>為道者日損</h1><p>修道者日日減損嗜欲，以至於無為，無為則无不為。</p><p>黃帝曰：「故曰：『為道者日損，損之又損之以至於无為，无為而无不為也。』今已為物也，欲復歸根，不亦難乎！其易也，其唯大人乎！」</p><p>修煉之道，在於損去人為之嗜欲，日日剗削，以還於自然之無為。及其至也，無所不為，而實無所作為之意。</p><p><strong>所出</strong>：《莊子 · 知北遊》 — https://zh.wikisource.org/wiki/莊子/知北遊</p></article></main></div></div>
