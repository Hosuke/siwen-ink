    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 南伯子綦</nav></header><main><article><h1>南伯子綦</h1><p>人知之則售之，人不知則我悲人，悲人之悲亦悲，其後日遠而心如死灰。</p><p>南伯子綦隱几而坐，仰天而噓。顏成子入見曰：「夫子，物之尤也。形固可使若槁骸，心固可使若死灰乎？」曰：「吾嘗居山穴之中矣。當是時也，田禾一覩我，而齊國之衆三賀之。我必先之，彼故知之；我必賣之，彼故鬻之。若我而不有之，彼惡得而知之？若我而不賣之，彼惡得而鬻之？嗟乎！我悲人之自喪者，吾又悲夫悲人者，吾又悲夫悲人之悲者，其後而日遠矣。」</p><p><strong>所出</strong>：《莊子 · 徐無鬼》 — https://zh.wikisource.org/wiki/莊子/徐無鬼</p></article></main></div></div>
