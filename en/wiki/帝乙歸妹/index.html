    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 帝乙歸妹，其君之袂，不如其娣之袂良，月幾望，吉</nav></header><main><article><h1>帝乙歸妹，其君之袂，不如其娣之袂良，月幾望，吉</h1><p>帝乙嫁女與諸侯，諸侯夫人衣飾不及娣，然居中履正，以貴行之，吉。</p><p>六五：「帝乙歸妹，其君之袂，不如其娣之袂良，月幾望，吉。」帝乙，商之賢君也。歸妹於諸侯，其正室之袂，反不如娣之袂良。夫衣飾崇儉，謙德之象也。其位在中，以貴行也。爻辭以月幾望取象，陰道將盈而未盈，守中履正，故吉。</p><p><strong>所出</strong>：《周易 · 歸妹》 — https://zh.wikisource.org/wiki/周易/歸妹</p></article></main></div></div>
