    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 思附君子</nav></header><main><article><h1>思附君子</h1><p>思慕君子而欲歸附之也。</p><p>《齊詩說》解《江有汜》曰：「江水汜沱，思附君子。」</p><p>思者，思慕也；附者，歸附也。女子之情，本欲與君子相親相近，不以艱苦而改其志也。觀江水之汜沱，支流派別而皆歸於江，猶女子之思君子，欲托身而終不可得。</p><p>「伯仲爰歸」，言夫之仲兄遣仲弟以歸，所謂「不我肯顧」者也。女子之心，終不以其見棄而改其思慕之誠焉。</p><p><strong>所出</strong>：《詩經 · 江有汜》 — https://zh.wikisource.org/wiki/詩經/江有汜</p></article></main></div></div>
