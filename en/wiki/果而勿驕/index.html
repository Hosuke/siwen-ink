    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 果而勿驕</nav></header><main><article><h1>果而勿驕</h1><p>成事勿驕，驕則失德。</p><p>果而勿驕。驕，欺也。勿以為尊人也。</p><p><strong>所出</strong>：《老子河上公章句 · 儉武》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p><hr><p>已成其功，勿生驕慢。驕則志滿，志滿則損，此成事之所以敗也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 三十章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
