    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 天與水違行</nav></header><main><article><h1>天與水違行</h1><p>乾上坎下相違，訴訟之象</p><p>天與水違行，[[訴訟]]之象也。乾為天，坎為水。天道左旋，水流就下，其行相違。剛者健而必進，險者窒而難通，二者相遇，是以有爭。《易》立象以明理，天水相違，非天之咎，亦非水之愆，時勢然也。君子觀此象，知爭之生於相違也，故作事必謀其始，使相違者不至于乖絕，審之於微，則讼端自熄矣。</p><p><strong>所出</strong>：《周易 · 訴訟》 — https://zh.wikisource.org/wiki/周易/訴訟</p></article></main></div></div>
