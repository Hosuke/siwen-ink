    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 聖人不仁</nav></header><main><article><h1>聖人不仁</h1><p>聖人法天，不施私恩，使百姓自正。</p><p>聖人治天下，法天地之道，以不仁為仁。何也？仁者私心之發，聖人無私，故不見有仁。觀[[聖人治若父母之愛子]]之說，而知其不然——[[為之無益]]，[[使民自為]]，此聖人之術也。[[清靜為治]]，使民自正，非聖人之仁不及，是聖人之道不貴有為而貴無為。百姓芻狗，待时而用，不待聖人之愛護；聖人[[虛心以為道舍]]，故能成萬物之自然。</p><p><strong>所出</strong>：《老子河上公章句 · 虛用》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
