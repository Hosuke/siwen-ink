    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 由豫大有得志大行</nav></header><main><article><h1>由豫大有得志大行</h1><p>九四為豫之主，萬物由之以豫，故志大行。</p><p>九四由豫大有得勿疑朋盍簪。由豫者，豫之所以成，六爻皆應乎四也。萬物各得其欲，志大行矣。
<strong>所出</strong>：《周易註 (王弼) · 卷02》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷02</p></article></main></div></div>
