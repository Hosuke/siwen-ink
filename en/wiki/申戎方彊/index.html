    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 申戎方彊</nav></header><main><article><h1>申戎方彊</h1><p>申呂方彊則王室方弱。</p><p>史伯言周將亡之勢，曰：「申、繒、西戎方彊，王室方騷，將以縱欲，不亦難乎？王欲殺太子以成伯服，必求之申，申人弗畀，必伐之。若伐申，而繒與西戎會以伐周，周不守矣！」又言申、呂方彊，其隩愛太子亦必可知，王師若在，其救之亦必然矣。凡周存亡，不三稔矣。</p><p><strong>所出</strong>：《國語 · 卷16》 — https://zh.wikisource.org/wiki/國語/卷16</p></article></main></div></div>
