    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 百人事智而一人用力</nav></header><main><article><h1>百人事智而一人用力</h1><p>人皆趨文學言談之途，鮮肯務農征戰之力；如此則國貧兵弱，天下所以亂也。</p><p>夫耕之用力也勞，而民爲之者，曰可得以富也。戰之爲事也危，而民爲之者，曰可得以貴也。今修文學，習言談，則無耕之勞而有富之實，無戰之危而有貴之尊，則人孰不爲也？是以百人事智而一人用力。事智者衆則法敗，用力者寡則國貧，此世之所以乱也。</p><p><strong>所出</strong>：《韓非子 · 五蠹》 — https://zh.wikisource.org/wiki/韓非子/五蠹</p></article></main></div></div>
