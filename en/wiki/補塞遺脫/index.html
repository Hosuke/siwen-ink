    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 補塞遺脫</nav></header><main><article><h1>補塞遺脫</h1><p>謂參同契前說未備，此篇補其闕遺潤色幽深，以臻完密。</p><p>魏伯陽以《參同契》上篇敷陳梗概，猶有纖微未備、闕略仿佛之處。遂更撰是篇，題曰「補塞遺脫」，專以補前之闕、塞其漏遺。篇中自云：「參同契者，敷陳梗概，不能純一，泛濫而說，纖微未備，闕略仿佛。今更撰錄，補塞遺脫，潤色幽深，鉤援相逮，旨意等齊，所趨不悖。」是知此章為全書之補苴完密計，非別立新義也。末附四象之別序，欲使後生不惑，俾前說煥然而大明。</p><p><strong>所出</strong>：《周易參同契 · 34章》 — https://zh.wikisource.org/wiki/周易參同契/34章</p></article></main></div></div>
