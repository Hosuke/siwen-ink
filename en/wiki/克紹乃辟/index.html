    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 克紹乃辟</nav></header><main><article><h1>克紹乃辟</h1><p>能繼續先王之道，使民長得安定。</p><p>王曰：「爾克紹乃辟于先王，永綏民！」言大臣能輔君以繼續先王之業，則斯民可以長久安定矣。[[監于先王成憲]]言取法，此言承緒，其義相成也。</p><p><strong>所出</strong>：《尚書 · 說命下》 — https://zh.wikisource.org/wiki/尚書/說命下</p></article></main></div></div>
