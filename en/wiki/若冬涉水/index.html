    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 若冬涉水</nav></header><main><article><h1>若冬涉水</h1><p>修道之人，小心謹慎，如履薄冰也。</p><p>古之善為道者，若[[若冬涉水]]。</p><p>言古之修道者，戒慎恐懼，不敢稍有忽慢。冬水寒冽，冰薄易陷，一有不慎，則陷溺隨之。行道之人亦然，見[[夫輕敵者幾亡吾]]，可不戒哉。[[敬慎]]所以全身，[[矜而不爭]]所以遠害，皆此意也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章十五》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
