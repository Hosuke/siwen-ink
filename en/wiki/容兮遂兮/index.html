    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 容兮遂兮</nav></header><main><article><h1>容兮遂兮</h1><p>形容人儀容莊重、容止自若之貌。</p><p>「容兮遂兮，垂帶悸兮。」</p><p>容，儀容也；遂，舒放也。言童子佩觿之後，容儀儼然，若甚舒泰自得之狀。然「垂帶悸兮」，則帶垂而不整，帶末顫動，見其矜持太過而失其自然。詩人以此諷惠公之驕：徒有其表，而無充實之德以配之。後世言威儀者，多本此義。</p><p><strong>所出</strong>：《詩經 · 芄蘭》 — https://zh.wikisource.org/wiki/詩經/芄蘭</p></article></main></div></div>
