    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 當其無有埴器之用</nav></header><main><article><h1>當其無有埴器之用</h1><p>埏埴以為器，器之用在其空；虛實相資，有無互為。</p><p>埏埴以為器，器之形成於土，器之用在其空。是故當其無有埴器之用，非無器也，乃器之所以為器者在是焉。</p><p>器之為用，盛水以養人，納粟以資生。然水之能養、粟之能資，非器之壁所能也，乃器中之空所容也。使器無空，是器也者將焉用之？虛者實之君，無者有之主。埴器之空，乃萬用之所從出也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章十一》 — https://zh.wikisource.org/wiki/老子_(帛書本)</p></article></main></div></div>
