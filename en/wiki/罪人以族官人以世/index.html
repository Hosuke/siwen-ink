    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 罪人以族，官人以世</nav></header><main><article><h1>罪人以族，官人以世</h1><p>商王用法酷暴，罰則連族，官則世及，不問賢否。</p><p>罪人以族，官人以世。</p><p>商王受之惡政也。罪人以族者，犯則夷族，誅連無辜；官人以世者，不考才能，但父死子繼，賢愚同升。蓋言暴虐之甚，殃及無辜，賞罰皆私，非天討之公也。</p><p><strong>所出</strong>：《尚書 · 泰誓上》 — https://zh.wikisource.org/wiki/尚書/泰誓上</p></article></main></div></div>
