    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 周公出奔晉</nav></header><main><article><h1>周公出奔晉</h1><p>周公奔晉，天子之臣出走附諸侯，義本於臣道。</p><p>成公十二年，「周公出奔晉」。傳曰：「周有入無出，其曰出，上下一見之也。言其上下之道，無以存也。上雖失之，下孰敢有之？今上下皆失之矣！」</p><p>  夫周，天子所都也；晉，諸侯之強也。周公，天子之卿士也。今而出奔於晉，是上下失道之甚也。穀梁子以「上下一見之」發其義，明周之失道與晉之無臣節皆可見焉。此聖人所以謹書之，以為萬世戒也。</p><p>  <strong>所出</strong>：《春秋穀梁傳 · 成公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/成公</p></article></main></div></div>
