    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 性主處內</nav></header><main><article><h1>性主處內</h1><p>性居於內，若置城郭以為防守，不可妄動。</p><p>《參同契》云：「性主處內，立置鄞鄂。」性者，[[元精]]之粹，得乎[[陰陽]]之正，稟之於天者也。性主乎內，宜安靜以守之，如建立[[城郭溝渠不足以固守|城郭]]，名曰鄞鄂，以為藩衛。[[虛心以為道舍]]，[[虛靜恬淡寂漠無為|虛靜恬淡]]，則性有所止而不外馳。若情熾而妄動，則性主失位，故必先立其內，以[[情主營外]]之垣郭為之表，二者相須而全。</p><p><strong>所出</strong>：《周易參同契 · 20章》 — https://zh.wikisource.org/wiki/周易參同契/20章</p></article></main></div></div>
