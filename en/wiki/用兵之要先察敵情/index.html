    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 用兵之要先察敵情</nav></header><main><article><h1>用兵之要先察敵情</h1><p>用兵之要，必先察敵之情，審其虛實，而後動。</p><p>《軍讖》曰：「用兵之要，必先察敵情，視其倉庫，度其糧食，卜其強弱，察其天地，伺其空隙。」</p><p>故國無軍旅之難而運糧者，虛也；民菜色者，窮也；千里饋糧，士有飢色；樵蘇後爨，師不宿飽。夫運糧千里，無一年之食；二千里，無二年之食；三千里，無三年之食，是謂國虛。國虛，則民貧；民貧，則上下不親。敵攻其外，民盜其內，是謂必潰。</p><p><strong>所出</strong>：《三略》 — https://zh.wikisource.org/wiki/三略</p></article></main></div></div>
