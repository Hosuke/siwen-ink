    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 善貸且成</nav></header><main><article><h1>善貸且成</h1><p>道善於施予而成就萬物，萬物賴之而各正性命。</p><p>夫唯道，善貸且成。</p><p>道之於物，生之、育之，養之、成之，所謂「[[道生之，德畜之]]」也。[[萬物恃道而生]]，[[生而不有]]，[[長而不宰]]，皆道之善貸之義。[[成功遂事莫知其狀]]者，[[生而不有為而不恃長而不宰]]之旨也。</p><p>夫道不言而萬物成，不求而萬物遂，此[[道隱無名]]之驗也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 四十一章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
