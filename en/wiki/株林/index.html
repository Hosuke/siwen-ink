    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 株林</nav></header><main><article><h1>株林</h1><p>詩刺陳靈公馳驅株野以淫於夏姬也</p><p>《株林》，陳風也。陳靈公事夏姬，日夜驅馳於株林之地，往而不息。詩人刺之，其辭曰：</p><p>「胡為乎株林？從夏南。匪適株林，從夏南。」</p><p>問其所往，託言從夏南，實刺其意不在遊觀，而在夏姬也。</p><p>「駕我乘馬，說于株野。乘我乘駒，朝食于株。」</p><p>言其車馬之盛，朝夕不息，往株林而朝食，其淫慝之態見矣。</p><p>二章，章四句。</p><p><strong>所出</strong>：《詩經 · 株林》 — https://zh.wikisource.org/wiki/詩經/株林</p></article></main></div></div>
