    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 怒髮上衝冠</nav></header><main><article><h1>怒髮上衝冠</h1><p>藺相如怒髮上衝冠，欲碎璧於柱。</p><p>相如因持璧卻立，倚柱，怒髮上衝冠，謂秦王曰：「大王必欲急臣，臣頭今與璧俱碎於柱矣！」</p><p><strong>所出</strong>：《史記 · 卷081》 — https://zh.wikisource.org/wiki/史記/卷081</p></article></main></div></div>
