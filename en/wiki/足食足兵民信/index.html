    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 足食足兵民信</nav></header><main><article><h1>足食足兵民信</h1><p>治國之要，在於富國、強兵、得民之信。</p><p>見[[民無信不立]]所引。</p><p>食者養民之源，兵者衛民之具，信者治民之本。三者並舉，而[[民無信不立]]乃見聖人輕重之權衡也。</p><p><strong>所出</strong>：《論語 · 顏淵第十二》 — https://zh.wikisource.org/wiki/論語/顏淵第十二</p></article></main></div></div>
