    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 側弁之俄</nav></header><main><article><h1>側弁之俄</h1><p>醉則冠傾，儀容失正。</p><p>《詩》言「側弁之俄」，記醉者之狀也。弁者，皮冠也。俄，傾側不正之貌。賓之初筵，未醉之時，威儀秩秩，溫恭有度；及其既醉，冠傾弁側，傞傞屢舞，失其威儀矣。詩人深刺當時君臣沈湎無度，以見伐德之漸，非止言行之失，實有辱於冠裳之重焉。</p><p><strong>所出</strong>：《詩經 · 賓之初筵》 — https://zh.wikisource.org/wiki/詩經/賓之初筵</p></article></main></div></div>
