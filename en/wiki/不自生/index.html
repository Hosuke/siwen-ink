    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 不自生</nav></header><main><article><h1>不自生</h1><p>天地長久，以其不為己而生。</p><p>天地所以能長且久者，以其不自生。</p><p>河上公注云：天地安靜，施不求報，不汲汲求自饒之利，不奪人以自與。蓋有為者求生，反而促死；無心者不自生，乃能長生不終。聖人亦然，後其身而身先，外其身而身存。不以生為生，故生也無盡。</p><p>是故自生者夭不自生者壽，求利者失讓譽者得。聖人無私而厚人，故能成其私；汲汲自饋者，奪人而自與，適足速斃。</p><p><strong>所出</strong>：《老子河上公章句 · 韜光》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
