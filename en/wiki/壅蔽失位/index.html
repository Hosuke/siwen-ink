    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 壅蔽失位</nav></header><main><article><h1>壅蔽失位</h1><p>私心塞聽，是失位的根源。</p><p>今亂君則不然。有私視也，故有不見也；有私聽也，故有不聞也；有私慮也，故有不知也。夫私者，壅蔽失位之道也。上舍公法而聽私說，故羣臣百姓皆設私立方以教於國。羣黨比周以立其私，請謁任舉以亂公法，人用其心以幸於上，上無度量以禁之，是以私說日益，而公法日損，國之不治，從此產矣。</p><p><strong>所出</strong>：《管子 · 第45篇任法》 — https://zh.wikisource.org/wiki/管子/第45篇任法</p></article></main></div></div>
