    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 陽子居見老子</nav></header><main><article><h1>陽子居見老子</h1><p>驕人睢睢盱盱，不與人居；及其返也，爭席而坐，是去驕之道也。</p><p>陽子居南之沛，老耼西遊於秦，邀於郊，至於梁而遇老子。老子中道仰天而歎曰：「始以汝為可教，今不可也。」陽子居不答。至舍，進盥漱巾櫛，脫履戶外，膝行而前請問其過。老子曰：「而睢睢盱盱，而誰與居？大白若辱，盛德若不足。」陽子居蹵然變容敬聞命。其往也，舍者迎將，爭席；其反也，舍者與之爭席矣！蓋言驕慢不去，則人不敢近；及其去之，人乃得與之狎也。</p><p><strong>所出</strong>：《莊子 · 寓言》 — https://zh.wikisource.org/wiki/莊子/寓言</p></article></main></div></div>
