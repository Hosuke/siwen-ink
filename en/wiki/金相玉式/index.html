    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 金相玉式</nav></header><main><article><h1>金相玉式</h1><p>《楚辭》文質兼備，金相玉式，百世無匹。</p><p>王逸以為詩人提耳，屈原婉順，《離騷》之文，依《經》立義，駟虯乘翳，則時乘六龍，崐崙流沙，則《禹貢》敷土，名儒辭賦，莫不擬其儀表，所謂金相玉質，百世無匹者也。</p><p>贊曰：不有屈原，豈見《離騷》。驚才風逸，壯志煙高。山川無極，情理實勞，金相玉式，豔溢錙毫。</p><p><strong>所出</strong>：《文心雕龍 · 辨騷》 — https://zh.wikisource.org/wiki/文心雕龍/辨騷</p></article></main></div></div>
