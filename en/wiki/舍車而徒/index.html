    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 舍車而徒</nav></header><main><article><h1>舍車而徒</h1><p>不乘華車，徒步而行，義也。</p><p>初九「舍車而徒」，徒步而行，不乘車也。《象》曰「義弗乘」，以其非己所當得之器，義不可乘之也。夫車者，人之所欲；徒行者，人之所賤。君子以義制欲，不以其所以奉己者而枉道焉。</p><p><strong>所出</strong>：《周易 · 賁》 — https://zh.wikisource.org/wiki/周易/賁</p></article></main></div></div>
