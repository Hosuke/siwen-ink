    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 孺子之遊</nav></header><main><article><h1>孺子之遊</h1><p>句踐載食以賑流亡之童也。</p><p>句踐之地廣被百里，東至於鄞，西至於姑蔑。及內修德政，外卑事吳，民生漸復。句踐乃載稻與脂於舟以行，見國之孺子而遊者，無不餔之、無不歠之，必問其名而記之。又非其身之所種則不食，非其夫人之所織則不衣。十年不收於國，而民俱有三年之食。</p><p>此舉蓋恤民之窮者、養民之幼者，使幼有所養、遊者有所歸，由是民心附越，為後來報吳復仇之基焉。</p><p><strong>所出</strong>：《國語 · 卷20》 — https://zh.wikisource.org/wiki/國語/卷20</p></article></main></div></div>
