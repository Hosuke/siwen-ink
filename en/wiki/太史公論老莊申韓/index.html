    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 太史公論老莊申韓</nav></header><main><article><h1>太史公論老莊申韓</h1><p>太史公評老、莊、申、韓四家皆原於道德，而老子最深遠。</p><p>太史公曰：老子所貴道，虛無，因應變化於無為，故著作之辭稱微妙難識。莊子散道德，放論，要亦歸之自然。申子卑卑，施之於名實。韓子引繩墨，切事情，明是非，其極慘礉少恩。皆原於道德之意，而老子深遠矣。</p><p><strong>所出</strong>：《史記 · 卷063》 — https://zh.wikisource.org/wiki/史記/卷063</p></article></main></div></div>
