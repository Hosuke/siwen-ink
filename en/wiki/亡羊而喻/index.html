    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 亡羊而喻</nav></header><main><article><h1>亡羊而喻</h1><p>臧者讀書，穀者博塞，事業不同，亡羊則均。以喻殉名殉利各異，而失性同歸。</p><p>臧與穀，二人相與牧羊，而俱亡其羊。問臧奚事，則挾筴讀書；問穀奚事，則博塞以遊。二人者，事業不同，其於亡羊，均也。莊子借此以明世之情：小人則以身殉利，士則以身殉名，大夫則以身殉家，聖人則以身殉天下。故此數子者，事業不同，名聲異號，其於傷性以身為殉，一也。夫亡羊之喻，在於明夫殉物之失——所趨雖殊，所喪均耳。</p><p><strong>所出</strong>：《莊子 · 駢拇》 — https://zh.wikisource.org/wiki/莊子/駢拇</p></article></main></div></div>
