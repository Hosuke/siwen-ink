    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 天難諶</nav></header><main><article><h1>天難諶</h1><p>天命無常，視德而信，人不可以恃天命也。</p><p>天道至公，而難以諶信。命非一成不變，常視人之德以為轉移。民之於國，恃德而不恃命；君之於天，亦然。使不修厥德，而徒祈天命之永，是猶無根之木而望其長茂也。</p><p>嗚呼！天難諶，命靡常。常厥德，保厥位。厥德匪常，九有以亡。</p><p><strong>所出</strong>：《尚書 · 咸有一德》 — https://zh.wikisource.org/wiki/尚書/咸有一德</p></article></main></div></div>
