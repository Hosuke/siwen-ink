    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 魏文侯見段干木</nav></header><main><article><h1>魏文侯見段干木</h1><p>魏文侯見段干木，立倦而不敢息，反見翟黃，踞於堂而與之言。</p><p>魏文侯見段干木，立倦而不敢息，反見翟黃，踞於堂而與之言。翟黃不說。文侯曰：「段干木官之則不肯，祿之則不受。今女欲官則相位，欲祿則上卿，既受吾實，又責吾禮，無乃難乎？」故賢主之畜人也，不肯受實者其禮之。禮士莫高乎節欲，欲節則令行矣，文侯可謂好禮士矣。好禮士故南勝荊於連隄；東勝齊於長城，虜齊侯，獻諸天子，天子賞文侯以上卿。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十五》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十五</p></article></main></div></div>
