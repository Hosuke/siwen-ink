    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 含元虛危</nav></header><main><article><h1>含元虛危</h1><p>言虛危之宿含蓄元氣，萬物之精由此播散。</p><p>含元虛危，播精于子。</p><p>虛危者，北方之星，於十二次為玄枵。含元者，虛危居水位，坎之中氣所從出，是元氣含藏於此也。播，散也。精者，陽精之精華。子者，坎位也。言陽精播散於子位，坎為一陽初動之象，萬物之精由此而出也。</p><p><strong>所出</strong>：《周易參同契 · 29章》 — https://zh.wikisource.org/wiki/周易參同契/29章</p></article></main></div></div>
