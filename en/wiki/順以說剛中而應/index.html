    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 順以說剛中而應</nav></header><main><article><h1>順以說剛中而應</h1><p>萃之由，柔順剛中上下相應</p><p>《彖》曰「萃，聚也；順以說，剛中而應，故聚也」。柔下承上為順，上悅而下應，剛中得位相應，是以聚也。</p><p><strong>所出</strong>：《周易 · 萃》 — https://zh.wikisource.org/wiki/周易/萃</p></article></main></div></div>
