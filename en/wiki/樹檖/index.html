    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 樹檖</nav></header><main><article><h1>樹檖</h1><p>挺立之檖，以興賢臣之無依。</p><p>隰有樹檖。</p><p>樹檖，灌木之挺立者。樹，挺立之意；檖，赤羅，一名山梨。</p><p>詩以隰有此木，與首章「隰有六駮」相承，皆以起興賢者之散處低位，無所援引也。</p><p><strong>所出</strong>：《詩經 · 晨風》 — https://zh.wikisource.org/wiki/詩經/晨風</p></article></main></div></div>
