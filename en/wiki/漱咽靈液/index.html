    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 漱咽靈液</nav></header><main><article><h1>漱咽靈液</h1><p>漱咽津液以養生修真。</p><p>口為[[玉池]]，漱咽靈液則灾不干。蓋[[黃庭]]以口為太和宮，是人身之一大要地也。漱咽雲者，非徒然咽唾，乃凝神聚氣，以時而咽之，使靈液灌溉五臟，滋潤百骸，自然邪疾不侵而身光華氣香蘭矣。《抱朴子》有咽津之法，《黃庭經》言漱咽靈液，正合此義。學者茍能審是而修之，則內境清寧，外邪不入，故云「漱咽靈液灾不干」。</p><p><strong>所出</strong>：《黃庭內景經 · 口為章第三》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/口為章第三</p></article></main></div></div>
