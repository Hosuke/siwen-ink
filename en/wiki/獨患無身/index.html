    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 獨患無身</nav></header><main><article><h1>獨患無身</h1><p>智略過人者，唯一患在於有身，身存則功可立，身亡則萬事皆空。</p><p>太史公論魏豹、彭越曰：彼無異故，智略絕人，獨患無身耳。言其才智權謀過於常人，非患無智無勇，唯一憂患者，正以其有身耳。身存則可以乘時有為，身亡則智略無所施，故云「獨患無身」也。</p><p><strong>所出</strong>：《史記 · 卷090》 — https://zh.wikisource.org/wiki/史記/卷090</p></article></main></div></div>
