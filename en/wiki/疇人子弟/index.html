    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 疇人子弟</nav></header><main><article><h1>疇人子弟</h1><p>曆官之族，周衰而散，或在諸夏，或在夷狄。</p><p>幽、厲之後，周室微，陪臣執政，史不記時，君不告朔，故疇人子弟分散，或在諸夏，或在夷狄，是以其禨祥廢而不統。周襄王二十六年閏三月，而春秋非之。先王之正時也，履端於始，舉正於中，歸邪於終。履端於始，序則不愆；舉正於中，民則不惑；歸邪於終，事則不悖。</p><p><strong>所出</strong>：《史記 · 卷026》 — https://zh.wikisource.org/wiki/史記/卷026</p></article></main></div></div>
