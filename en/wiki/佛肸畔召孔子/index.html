    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 佛肸畔召孔子</nav></header><main><article><h1>佛肸畔召孔子</h1><p>佛肸以中牟畔，召孔子，孔子欲往。</p><p>佛肸以中牟畔，又召孔子。子路疑之，孔子曰：「然，有是言也。不曰堅乎？磨而不磷。不曰白乎？涅而不緇。吾豈匏瓜也哉？焉能繫而不食！」</p><p>  佛肸，晉大夫范氏之臣也，以中牟畔。與公山弗擾之事相類，皆畔臣召孔子而孔子欲往。子路以為親於其身為不善者君子不入，孔子未嘗不以此言自解也。然卒不往者，以時之未可爾。匏瓜繫而不食，喻無用也；聖人抱道而無所施，亦何以異於是。</p><p>  <strong>所出</strong>：《論語 · 陽貨第十七》 — https://zh.wikisource.org/wiki/論語/陽貨第十七</p></article></main></div></div>
