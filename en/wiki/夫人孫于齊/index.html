    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 夫人孫于齊</nav></header><main><article><h1>夫人孫于齊</h1><p>魯莊之母文姜以淫奔而出奔，父子之恩絶焉。</p><p>元年春，不稱即位，文姜出故也。三月，夫人孫于齊。不稱姜氏，絶不爲親，禮也。</p><p>秋，築王姬之館於外。爲外，禮也。</p><p><strong>所出</strong>：《春秋左氏傳 · 莊公》 — https://zh.wikisource.org/wiki/春秋左氏傳/莊公</p></article></main></div></div>
