    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 城成周</nav></header><main><article><h1>城成周</h1><p>魯與列國城成周，尊王室之義。</p><p>昭公三十二年冬，仲孫何忌會晉韓不信、齊高張、宋仲幾、衛世叔申、鄭國參、曹人、莒人、邾婁人、薛人、杞人、小邾婁人城成周。</p><p><strong>所出</strong>：《春秋公羊傳 · 昭公》 — https://zh.wikisource.org/wiki/春秋公羊傳/昭公</p></article></main></div></div>
