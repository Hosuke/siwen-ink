    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 木馬繁纓・壤龍雲雨</nav></header><main><article><h1>木馬繁纓・壤龍雲雨</h1><p>用非其人，則無以騁跡致功</p><p>夫用非其人，譬猶被木馬以繁纓，何由騁跡於追風？以壤龍當雲雨，安能耀景於天衢哉？</p><p>若秉國之鈞，出納王命者，審良藥之顧眄，不令跛蹇廁騏騄，冒昧苟得，暗於自量者，慮中道之顛躓，不以駑薾服鸞衡，則何患庶績之不康，何憂四兇之不退，三皇豈足四，五帝難六哉！</p><p><strong>所出</strong>：《抱朴子 · 卷28》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷28</p></article></main></div></div>
