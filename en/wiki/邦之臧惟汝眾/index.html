    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 邦之臧惟汝眾</nav></header><main><article><h1>邦之臧惟汝眾</h1><p>邦國興壞，係於臣民善否。</p><p>邦之臧，惟汝眾；邦之不臧，惟予一人有佚（抶）罰。</p><p>盤庚以邦之[[臧]]與[[不臧]]屬之臣民。臣民從令[[度乃口]]，恭爾事，則[[邦之臧]]；茲令不行，[[罰及爾身]]。[[惟予一人有佚罰]]者，罰亦及王，非王之得私賞罰也。此[[尚書]]所述上下共治之義。</p><p><strong>所出</strong>：《尚書 · 盤庚上》 — https://zh.wikisource.org/wiki/尚書/盤庚上</p></article></main></div></div>
