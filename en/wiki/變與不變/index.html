    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 變與不變</nav></header><main><article><h1>變與不變</h1><p>聖人治世，不泥古亦不妄變，唯求其可。</p><p>不知治者，必曰：「無變古，毋易常。」變與不變，聖人不聽，正治而已。然則古之無變，常之毋易，在常古之可與不可。</p><p><strong>所出</strong>：《韓非子 · 南面》 — https://zh.wikisource.org/wiki/韓非子/南面</p></article></main></div></div>
