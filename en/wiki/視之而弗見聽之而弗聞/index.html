    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 視之而弗見聽之而弗聞</nav></header><main><article><h1>視之而弗見聽之而弗聞</h1><p>道在視聽之外，非感官所能測。</p><p>老子以視聽三名說道之超越感官：視之而弗見，名之曰微；聽之而弗聞，命之曰希；昏之而弗得，名之曰夷。三者不可至計，故混而為一。此道之上不皦、下不忽，深不可命，復歸於無物。</p><p><strong>所出</strong>：《老子 (帛書本) · 章十四》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
