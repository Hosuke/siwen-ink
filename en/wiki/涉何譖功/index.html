    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 涉何譖功</nav></header><main><article><h1>涉何譖功</h1><p>涉何出使朝鲜，不肯奉詔，反殺朝鲜裨王長以歸，誣以為功，竟拜遼東東部都尉，朝鲜怨而襲殺之。</p><p>[[元封二年]]，[[樓船將軍征朝鲜]]之前，天子先使涉何譙諭右渠，右渠終不肯奉詔。涉何去至界上，臨浿水，使御刺殺送何者朝鲜裨王長，即渡，馳入塞，遂歸報天子曰「殺朝鲜將」。</p><p>上為其名美，即不詰，拜何為遼東東部都尉。朝鲜怨何，發兵襲攻殺何。</p><p>[[太史公]]曰：「涉何誣功，為兵發首。」言其不以實聞，妄殺人而冒受上賞，致啟兵端也。</p><p><strong>所出</strong>：《史記 · 卷115》 — https://zh.wikisource.org/wiki/史記/卷115</p></article></main></div></div>
