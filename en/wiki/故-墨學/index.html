    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 故</nav></header><main><article><h1>故</h1><p></p><p><strong>故</strong>，墨子哲學之基本邏輯範疇也。《墨子·經上》云：「故，所得而後成也。」言事物之成因，蓋有所得，而後乃成其果也。</p><p>此範疇為墨家論理學之根基。墨家以為，欲明一事之理，必先求其故。知其故，則可以預見其果，可以施為，可以立論。《墨經》又別因果為多端：有故、有所以成名之故、有為之故。夫知其故而行之，則功可成焉。</p><p>墨家重功用，故尤重因果。苟不知故，則行事盲然；知其故者，可以興利除害，可以利民。此故之學說，實墨學求實精神之體現也。</p><p>相關條目：[[兼愛]]、 [[墨學]]、 [[說-墨學]]、 [[體-墨學]]</p></article></main></div></div>
