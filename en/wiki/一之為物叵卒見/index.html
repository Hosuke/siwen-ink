    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 一之為物叵卒見</nav></header><main><article><h1>一之為物叵卒見</h1><p>萬物之始真一難睹</p><p>「一」之為物，不可卒然得見。萬物皆始於一，而一者無形無名，不可執滯。</p><p>修真者必得至真乃顧眄者，以一之難見也。惟至真之人，乃能回顧而見之。眼曰顧眄，即反觀內照之義。</p><p><strong>所出</strong>：《黃庭內景經 · 玄元章第二十七》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/玄元章第二十七</p></article></main></div></div>
