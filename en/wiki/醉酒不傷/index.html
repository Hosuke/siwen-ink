    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 醉酒不傷</nav></header><main><article><h1>醉酒不傷</h1><p>醉酒之人神全無外，故墜車無損；至人藏於天者，莫能傷之。</p><p>夫醉者之墜車，雖疾不死。骨節與人同而犯害與人異，其神全也，乘亦不知也，墜亦不知也，死生驚懼不入乎其胷中，是故𨕣物而不慴。彼得全於酒而猶若是，而況得全於天乎？聖人藏於天，故莫之能傷也。復讎者不折鏌干，雖有忮心者不怨飄瓦，是以天下平均。</p><p><strong>所出</strong>：《莊子 · 達生》 — https://zh.wikisource.org/wiki/莊子/達生</p></article></main></div></div>
