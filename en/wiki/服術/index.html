    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 服術</nav></header><main><article><h1>服術</h1><p>紫微</p><p>[[紫微王夫人]] 制服術方以行於世。其方兼用五雲、水桂、術根、黃精、南燭、陽草、東石、空青、松脂、柏實、[[巨勝]]、茯苓，皆養生之具，將可以長年。太上導仙銘曰：「子欲長生，當服山精；子欲輕翔，當服山薑。」夫人戒曰：「末世多疾，宜當服禦。」又云：「夫術者，一可以長生永壽，二可以卻萬魔之枉疾。山林隱逸，得服此之道，千年八百，比肩於五嶽矣。」</p><p>  <strong>所出</strong>：《墉城集仙錄 · 卷03》 — https://zh.wikisource.org/wiki/墉城集仙錄/卷03</p></article></main></div></div>
