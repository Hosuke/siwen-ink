    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 欲歙固張</nav></header><main><article><h1>欲歙固張</h1><p>為將翕之，必故張之；為將弱之，必故強之；為將廢之，必故興之；為將奪之，必故與之。</p><p>將欲翕之，必固張之；將欲弱之，必固強之；將欲廢之，必固興之；將欲奪之，必固與之。</p><p>[[先開張之者，欲極其奢淫。先強大之者，欲使遇禍患。先興之者，欲使其驕危。先與之者，欲極其貪心。]]</p><p>[[將欲取之必姑予之]] 蓋同此旨。物盛則衰，強梁者不得其死，此天道之微而明者。</p><p><strong>所出</strong>：《老子河上公章句 · 微明》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
