    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 聞喪不得奔</nav></header><main><article><h1>聞喪不得奔</h1><p>不得奔喪而為位哭，與奔喪者禮同。</p><p>聞喪不得奔喪，哭盡哀；問故，又哭盡哀。乃為位，括髮袒成踴，襲絰絞帶即位，拜賓反位成踴。賓出，主人拜送於門外，反位，若有賓後至者，拜之成踴，送賓如初。於又哭，括髮袒成踴，於三哭，猶括髮袒成踴，三日成服，於五哭，拜賓送賓如初。</p><p>若除喪而後歸，則之墓，哭成踴，東括髮袒絰，拜賓成踴，送賓反位，又哭盡哀，遂除，於家不哭。主人之待之也，無變於服，與之哭，不踴。</p><p><strong>所出</strong>：《禮記 · 奔喪》 — https://zh.wikisource.org/wiki/禮記/奔喪</p></article></main></div></div>
