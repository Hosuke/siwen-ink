    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 後德惟臣，不德惟臣</nav></header><main><article><h1>後德惟臣，不德惟臣</h1><p>君德視臣為轉移</p><p>穆王戒伯冏以正群僕侍御之臣，其言曰：[[後德惟臣，不德惟臣]]。德者，得也。君之所以得者，在乎得人以為臣；君之所以失者，在乎失人而任非人。臣賢則法度修、綱紀正，君德以之而立；臣姦則邪說行、傾覆起，君德以之而隳。然則為人君者，可不務得人哉？</p><p><strong>所出</strong>：《尚書 · 冏命》 — https://zh.wikisource.org/wiki/尚書/冏命</p></article></main></div></div>
