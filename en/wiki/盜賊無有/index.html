    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 盜賊無有</nav></header><main><article><h1>盜賊無有</h1><p>絕巧棄利則盜賊無由生。</p><p>此三者（[[絕知棄辯]] [[絕僞棄慮]] [[絕巧棄利]]）皆絕而去之，則民風返古，盜賊無有矣。</p><p>  絕知則不爭，絕僞則不欺，絕巧則不貪。不爭、不欺、不貪，則何盜何賊之有？</p><p>  <strong>所出</strong>：《老子 (帛書校勘版) · 第六十三章 樸素》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
