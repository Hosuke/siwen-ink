    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 淮南臥理</nav></header><main><article><h1>淮南臥理</h1><p>臥而治之，不勞而理。</p><p>黯伏謝不受淮陽印，詔數彊予，然後奉詔。詔召見黯，黯為上泣曰：「臣自以為填溝壑，不復見陛下，不意陛下復收用之。臣常有狗馬病，力不能任郡事，臣願為中郎，出入禁闥，補過拾遺，臣之願也。」上曰：「君薄淮陽邪？吾今召君矣。顧淮陽吏民不相得，吾徒得君之重，臥而治之。」黯既辭行。</p><p>黯居郡如故治，淮陽政清。</p><p><strong>所出</strong>：《史記 · 卷120》 — https://zh.wikisource.org/wiki/史記/卷120</p></article></main></div></div>
