    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 左右計之者不用</nav></header><main><article><h1>左右計之者不用</h1><p>秦兵圍城，道不通，則左右謀士之計無所用。</p><p>城固守，則秦必興兵而圍王一都，道不通，則難必謀，其勢不救，左右計之者不用。</p><p><strong>所出</strong>：《韓非子 · 存韓》 — https://zh.wikisource.org/wiki/韓非子/存韓</p></article></main></div></div>
