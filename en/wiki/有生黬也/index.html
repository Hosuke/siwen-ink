    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 有生黬也</nav></header><main><article><h1>有生黬也</h1><p>生者若黬瘡膿皰，推移而去，是之謂移是。</p><p>有生，黬也，披然曰移是。嘗言移是，非所言也。雖然，不可知者也。</p><p>古之人，其知有所至矣。惡乎至？有以為未始有物者，至矣，盡矣，弗可以加矣！其次以為有物矣，將以生為喪也，以死為反也，是以分已。其次曰始无有，既而有生，生俄而死；以无有為首，以生為體，以死為尻；孰知有无死生之一守者，吾與之為友。</p><p><strong>所出</strong>：《莊子 · 庚桑楚》 — https://zh.wikisource.org/wiki/莊子/庚桑楚</p></article></main></div></div>
