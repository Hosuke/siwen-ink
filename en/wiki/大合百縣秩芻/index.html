    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 大合百縣秩芻</nav></header><main><article><h1>大合百縣秩芻</h1><p>季夏之月，命四監大合百縣之秩芻，以共皇天上帝四方之神。</p><p>季夏之月，命四監大合百縣之秩芻，以養犧牲。令民無不咸出其力，以共皇天、上帝、名山、大川、四方之神，以祠宗廟社稷之靈，以為民祈福。</p><p><strong>所出</strong>：《禮記 · 月令》 — https://zh.wikisource.org/wiki/禮記/月令</p></article></main></div></div>
