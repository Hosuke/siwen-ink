    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 成功之下，未易久處</nav></header><main><article><h1>成功之下，未易久處</h1><p>功高位重之時，最易生驕招患，賢者當知戒慎。</p><p>抱樸子以「周廟之器」為喻，明盈必有損之理。其言曰：「故養由之射，行人識以馳弦，東野之禦，顏子知其方敗，成功之下，未易久處也。」蓋功業既隆，恩寵既極，則上下之心易生驕怠，危亡之隙由此萌兆。夫爵賞之來，非必盡由於才德；機變之際，孰能保其始終？是以智者料事於倚伏之表，伐木於毫末之初，吐高言不於累棋之際，議治裘不於群狐之中，見微而知著者也。</p><p><strong>所出</strong>：《抱朴子 · 卷49》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷49</p></article></main></div></div>
