    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 文之四體</nav></header><main><article><h1>文之四體</h1><p>情志為神明，事義為骨髓，辭采為肌膚，宮商為聲氣，此文章之四體也。</p><p>夫才量學文，宜正體製，必以情志為神明，事義為骨髓，辭采為肌膚，宮商為聲氣，然後品藻元黃，摛振金玉，獻可替否，以裁厥中。</p><p><strong>所出</strong>：《文心雕龍 · 附會》 — https://zh.wikisource.org/wiki/文心雕龍/附會</p></article></main></div></div>
