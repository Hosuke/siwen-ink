    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 雍人</nav></header><main><article><h1>雍人</h1><p>掌烹煮牲牢及陳鼎之官。</p><p>雍人者，掌烹煮犧牲之官也。祭前，雍人概鼎、匕、俎於雍爨，雍爨在門東南北上。羹定，雍人陳鼎五，三鼎在羊鑊之西，二鼎在豕鑬之西。司馬升羊，司士升豕，各實於鼎。雍人倫肤九實於一鼎。卒脀，皆設扃冪，乃舉，陳鼎於廟門之外。祭時，雍正執一匕以從，雍府執四匕以從，序入以供匕載之事。其職專掌腥鍋之務，故名。</p><p><strong>所出</strong>：《儀禮 · 少牢饋食禮》 — https://zh.wikisource.org/wiki/儀禮/少牢饋食禮</p></article></main></div></div>
