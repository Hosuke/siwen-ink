    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 萬物之生各異類</nav></header><main><article><h1>萬物之生各異類</h1><p>萬物各依其類而生，稟受有清濁之異</p><p>萬物之生而各異類。蠶食而不飲，蟬飲而不食，蜉蝣不飲不食，介鱗者夏食而冬蟄。齧吞者八竅而卵生，嚼咽者九竅而胎生。四足者無羽翼，戴角者無上齒。無角者膏而無前，有角者指而無後。晝生者類父，夜生者似母。至陰生牝，至陽生牡。</p><p>夫熊羆蟄藏，飛鳥時移。</p><p>萬物之生而各異類，蛤蟹珠龜，與月盛衰。</p><p>是故以水和土，以土和火，以火化金，以金治木，木得反土。五行相治，所以成器用。</p><p><strong>所出</strong>：《淮南子 · 墜形訓》 — https://zh.wikisource.org/wiki/淮南子/墜形訓</p></article></main></div></div>
