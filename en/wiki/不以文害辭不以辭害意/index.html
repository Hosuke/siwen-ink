    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 不以文害辭不以辭害意</nav></header><main><article><h1>不以文害辭不以辭害意</h1><p>孟子論讀詩之法，戒人勿拘泥文字而失詩人之意</p><p>孟子云：「說詩者不以文害辭，不以辭害意。」文，字也；辭，句也；意，志也。蓋詩之言夸飾者多，若拘泥字句，則失詩人之本意。是以讀詩者當以意逆志，不可執文字以求也。劉勰引之以證夸飾之理，謂[[夸飾恆存]]於詩書，辭雖已甚，其義無害，正合孟子之旨。</p><p><strong>所出</strong>：《文心雕龍 · 夸飾》 — https://zh.wikisource.org/wiki/文心雕龍/夸飾</p></article></main></div></div>
