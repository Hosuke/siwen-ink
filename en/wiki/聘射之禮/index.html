    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 聘射之禮</nav></header><main><article><h1>聘射之禮</h1><p>聘射至大禮，非強有力者弗能行</p><p>聘、射之禮，至大禮也。質明而始行事，日幾中而禮成，非強有力者弗能行也。</p><p>強有力者之所以可貴，以其能行禮也。酒清，人渴而不敢飲；肉乾，人饑而不敢食；日莫人倦，齊莊正齊，而不敢解惰。以成禮節，以正君臣，以親父子，以和長幼。此眾人之所難，而君子行之，故謂之有行；有行之謂有義，有義之謂勇敢。</p><p><strong>所出</strong>：《禮記 · 聘義》 — https://zh.wikisource.org/wiki/禮記/聘義</p></article></main></div></div>
