    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 四象會中</nav></header><main><article><h1>四象會中</h1><p>木火金水四象，會於中宮戊己土，乃成金丹。</p><p>《參同契》末云：「別序斯四象，以曉后生盲。」此伯陽丁寧後學之辭也。丹道之要，在辨四象之別序：水位之北、火位之南、木位之東、金位之西，各有其時有其候，不可紊也。昧者不明此別序，則盲修瞎煉，終無所成；唯曉然於四象之遞嬗、會歸中宮之理，方可以入道。篇中象辭深微，以仲冬竹木摧傷、佐陽詰賈旅為喻，正言當閉口藏鋒、順時節令，不可妄作也。</p><p><strong>所出</strong>：《周易參同契 · 34章》 — https://zh.wikisource.org/wiki/周易參同契/34章</p></article></main></div></div>
