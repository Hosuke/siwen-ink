    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 望呵忽呵</nav></header><main><article><h1>望呵忽呵</h1><p>形容道之恍惚幽深，難以名狀。</p><p>[[望呵忽呵]] 道之為物，唯望唯忽。望呵忽呵，中有象，中有物，幽呵鳴呵。</p><p>此[[老子 (帛書本)]] 述道之辭。「望」「忽」者，[[恍惚]]之別寫也，喻道之幽微深遠、難以名狀。望呵忽呵，言道之恍惚貌；幽呵鳴呵，言道之深遠貌。[[老子 (帛書本) · 章二十一]]</p><p><strong>所出</strong>：《老子 (帛書本) · 章二十一》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
