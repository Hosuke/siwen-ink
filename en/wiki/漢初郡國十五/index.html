    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 漢初郡國十五</nav></header><main><article><h1>漢初郡國十五</h1><p>漢初直隸郡縣僅有三河、東郡、潁川、南陽及內史，凡十五郡。</p><p>太史公述漢初中央直轄之地曰：漢獨有三河、東郡、潁川、南陽，自江陵以西至蜀，北自雲中至隴西，與內史凡十五郡，而公主列侯頗食邑其中。何者？天下初定，骨肉同姓少，故廣彊庶孽，以鎮撫四海，用承衛天子也。時諸侯王地大者或五六郡，連城數十，僭於天子，而漢之郡守特十五而已。</p><p><strong>所出</strong>：《史記 · 卷017》 — https://zh.wikisource.org/wiki/史記/卷017</p></article></main></div></div>
