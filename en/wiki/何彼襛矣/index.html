    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 何彼襛矣</nav></header><main><article><h1>何彼襛矣</h1><p>詠王姬下嫁諸侯，車儀肅穆，媲美平王之孫與齊侯之子。</p><p>《何彼襛矣》，《詩經·國風·召南》之一也。毛詩序云：「美王姬也。雖則王姬亦下嫁於諸侯，車服不繫其夫，下王后一等。猶執婦道，以成肅雝之德。」</p><p>詩凡三章，章四句。首章言唐棣之華盛大，何其肅敬和諧，王姬之車以迎；次章言其華如桃李，平王之孫與齊侯之子相配；三章言以絲線為釣繩，齊侯之子與平王之孫相匹。</p><p>魯齊韓三家說云：「言齊侯嫁女，以其母王姬始嫁之車遠送之。」蓋王姬嫁於齊侯，其女孫復歸於周室，天子嫁女於諸侯，遣車送至夫家，所用之馬則反還其本族，是為「留車反馬」之禮。</p></article></main></div></div>
