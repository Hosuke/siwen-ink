    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 龍陽數奇</nav></header><main><article><h1>龍陽數奇</h1><p>龍為陽物，數主奇；虎為陰物，數主偶。奇偶分而造化明。</p><p>四者混沌，列為龍虎，龍陽數奇，虎陰數偶。</p><p>龍秉陽精，其數奇；虎秉陰魄，其數偶。[[四象會中|四象]]之數既定，而後剛柔之分明、造化之功起。此[[龍虎]]之所以列，而非徒象也。</p><p><strong>所出</strong>：《周易參同契 · 28章》 — https://zh.wikisource.org/wiki/周易參同契/28章</p></article></main></div></div>
