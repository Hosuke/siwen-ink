    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 貴真</nav></header><main><article><h1>貴真</h1><p>聖人法天貴真，不拘於俗，真者受於天自然不可易。</p><p>真者，精誠之至也。真在內者，神動於外，是所以貴真也。其用於人理也，事親則慈孝，事君則忠貞，飲酒則歡樂，處喪則悲哀。禮者，世俗之所為也；真者，所以受於天也，自然不可易也。故聖人法天貴真，不拘於俗。</p><p><strong>所出</strong>：《莊子 · 漁父》 — https://zh.wikisource.org/wiki/莊子/漁父</p></article></main></div></div>
