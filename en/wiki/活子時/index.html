    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 活子時</nav></header><main><article><h1>活子時</h1><p>藥生之時，不拘子月，而在窈冥恍惚間一陽初動之候。</p><p>丹法以活子時為藥生之候。尹師云：「欲求大藥為丹本，須認身中活子時。」活子時者，非專指夜半子月而言，乃在窈冥恍惚之中、一陽初動之際。蓋人心靜極，則陽氣潛萌，自覺心花發現，暖氣沖融，此時真精自生，是名活子時。較之正子時有死有活之異，故曰活。一日之內，意到不止一次，來藥亦不止一次。張紫陽所謂「一粒複一粒，從微而至著」是也。</p><p><strong>所出</strong>：《性命圭旨 · 利集》 — https://zh.wikisource.org/wiki/性命圭旨/利集</p></article></main></div></div>
