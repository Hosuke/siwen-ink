    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 寵辱若驚</nav></header><main><article><h1>寵辱若驚</h1><p>寵辱之來，足以警動人心，故君子不以得失縈懷。</p><p>寵辱若驚一語，見於《老子》第十三章。帛書校勘本此章經文與王弼本略同，唯文字小異。河上公注以「得龍若驚」解「寵為下」之義，謂寵本居人上者，屈而為下則驚。學者多以此章與《莊子》「舉世譽之而不加勸，舉世非之而不加沮」義相發明，蓋道家言心無旁驚、物無能累之旨。[[無身無患]]</p><p>  <strong>所出</strong>：《老子 (帛書校勘版) · 第五十七章 寵辱》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
