    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 宇宙在乎手萬化生乎身</nav></header><main><article><h1>宇宙在乎手萬化生乎身</h1><p>聖人與天為一，手攬造化，身即道樞。</p><p>宇宙在乎手，萬化生乎身。</p><p>宇宙萬物之理，聖人以一手而握之；陰陽萬化之機，聖人以一身而生之。與天為一，與道合真，此黃帝所以馭龍上昇也。常人與此隔者，以其心有私而機未忘也。</p><p><strong>所出</strong>：《黃帝陰符經集註》 — https://zh.wikisource.org/wiki/黃帝陰符經集註</p></article></main></div></div>
