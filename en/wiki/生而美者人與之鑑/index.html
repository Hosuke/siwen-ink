    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 生而美者人與之鑑</nav></header><main><article><h1>生而美者人與之鑑</h1><p>美不自美，因人而彰；愛不自愛，待告而成。</p><p>生而美者，人與之鑑，不告則不知其美於人也。若知之，若不知之，若聞之，若不聞之，其可喜也終无已，人之好之亦无已，性也。聖人之愛人也，人與之名，不告則不知其愛人也。若知之，若不知之，若聞之，若不聞之，其愛人也終无已，人之安之亦无已，性也。美與愛，固有之於己者，不能自見，必待人之知而後彰，此聖人之所以不居其名也。</p><p><strong>所出</strong>：《莊子 · 則陽》 — https://zh.wikisource.org/wiki/莊子/則陽</p></article></main></div></div>
