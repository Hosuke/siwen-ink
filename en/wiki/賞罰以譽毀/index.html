    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 賞罰以譽毀</nav></header><main><article><h1>賞罰以譽毀</h1><p>以譽為賞、以毀為罰，則公道不行，私術行矣。</p><p>主釋法以譽進能，則臣離上而下比周矣；以黨舉官，則民務交而不求用矣。官之失其治，是主以譽為賞、以毀為罰也。喜賞惡罰之人，離公道而行私術矣。</p><p><strong>所出</strong>：《管子 · 第46篇明法》 — https://zh.wikisource.org/wiki/管子/第46篇明法</p></article></main></div></div>
