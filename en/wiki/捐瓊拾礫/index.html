    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 捐瓊拾礫</nav></header><main><article><h1>捐瓊拾礫</h1><p>識別不明，則美惡顛倒，終無以臻至善。</p><p>捐瓊拾礫者，必無甄珍之明。瓊，美玉也；礫，碎石也。昧者遺棄瑾瑜，反取碔砆，則至寶失察，無由辨矣。抱朴子借是以諷世之不知揀材者：薄九成之雅樂而悅北鄙之俚曲，是棄瓊而拾礫也；舍英秀之賢士而杖常民之庸碌，是捐瓊而取礫也。夫甄別之不明，則彝倫失敘，升平無期矣。</p><p><strong>所出</strong>：《抱朴子 · 卷38》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷38</p></article></main></div></div>
