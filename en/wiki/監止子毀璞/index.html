    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 監止子毀璞</nav></header><main><article><h1>監止子毀璞</h1><p>欲取先與，欲敗故毀；成大事者不惜小費。</p><p>宋之富賈有監止子者，與人爭買百金之璞玉，因佯失而毁之，負其百金，而理其毁瑕，得千溢焉。事有舉之而有敗，而賢其毋舉之者，負之時也。</p><p><strong>所出</strong>：《韓非子 · 說林下》 — https://zh.wikisource.org/wiki/韓非子/說林下</p></article></main></div></div>
