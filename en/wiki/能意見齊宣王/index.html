    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 能意之直諫</nav></header><main><article><h1>能意之直諫</h1><p>賢士不撓於威，犯顏以直諫其君。</p><p>能意者，以直聞於齊宣王。宣王問曰：「寡人聞子好直，有之乎？」對曰：「意惡能直？意聞好直之士，家不處亂國，身不見污君。身今得見王，而家宅乎齊，意惡能直？」宣王怒，欲罪之。能意曰：「臣少而好事，長而行之，王胡不能與野士乎，將以彰其所好耶？」王乃舍之。</p><p>[[行人燭過]]嘗論趙簡子，亦此意也。賢主求直言之士，不肖主惡之，然直言之士犯危而不辭者，為其心有所守也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十三》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十三</p></article></main></div></div>
