    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 車御之妻</nav></header><main><article><h1>車御之妻</h1><p>御者自足而晏子之志深，以人為鏡，可知賢愚。</p><p>晏子為齊相，出，其御之妻從門閒而闚其夫。其夫為相御，擁大蓋，策駟馬，意氣揚揚甚自得也。既而歸，其妻請去。夫問其故。妻曰：「晏子長不滿六尺，身相齊國，名顯諸侯。今者妾觀其出，志念深矣，常有以自下者。今子長八尺，乃為人仆御，然子之意自以為足，妾是以求去也。」其後夫自抑損。晏子怪而問之，御以實對。晏子薦以為大夫。</p><p><strong>所出</strong>：《史記 · 卷062》 — https://zh.wikisource.org/wiki/史記/卷062</p></article></main></div></div>
