    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 爾所弗勖其于爾躬有戮</nav></header><main><article><h1>爾所弗勖其于爾躬有戮</h1><p>告戒將士：不能用命者必誅。</p><p>「爾所弗勖，其于爾躬有戮。」言[[不愆六步七步]]而行止齊焉，[[桓桓如虎如貔如熊如羆]]而赴敵者，[[弗御克奔以役西土]]，皆所以成[[恭行天罰]]之功。茲乃申戒：不能用命者，必加之以戮，此[[賞罰以信]]之意也。</p><p><strong>所出</strong>：《尚書 · 牧誓》 — https://zh.wikisource.org/wiki/尚書/牧誓</p></article></main></div></div>
