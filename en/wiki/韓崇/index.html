    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 韓崇</nav></header><main><article><h1>韓崇</h1><p>韓崇字長季，受流珠丹法，仕宦而不礙仙舉。</p><p>韓崇，字長季，吳郡毗陵人也。少好道，林屋仙人王璋玄授以流珠丹一法，崇奉而修之，大有驗。</p><p>璋玄語之曰：「子行此道，亦可以出身仕宦，無妨仙舉也。」崇遂仕至宛陵令，行仁為政，用道撫民，虎狼深避，蝗不集界。</p><p>遷汝南太守，拔書佐袁安。安後位至司徒，人以崇有識物之鑒。</p><p>崇獨居清素，上奇之，加俸祿，秩中二千石。漢孝明皇帝巡狩汝南，上治崇府，崇使妻出住孤獨老嫗家。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 16》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/16</p></article></main></div></div>
