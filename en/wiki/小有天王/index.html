    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 小有天王</nav></header><main><article><h1>小有天王</h1><p>王褒受太素清虛真人號，領小有天王，三元四司右保上公，治王屋山洞天。</p><p>太素三元上道君授王褒為太素清虛真人，領小有天王。</p><p>三元四司右保上公，治王屋山洞天之中。給玉童玉女各三百人，主領上清玉章、太素寶玄太極上品九天靈文、六合祕籍、山海妙經。又總括洞內明景三寶，得乘虎旅龍輦、金蓋瓊輪、八景飛輿，出入上清，受事太素，寢宴太極。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 14》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/14</p></article></main></div></div>
