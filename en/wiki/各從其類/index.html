    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 各從其類</nav></header><main><article><h1>各從其類</h1><p>物以類聚，氣同相感，天地之理然也。</p><p>文言解九五「飛龍在天」曰：「同聲相應，同氣相求。水流濕，火就燥，雲從龍，風從虎。聖人作而萬物覩。本乎天者，親上；本乎地者，親下。則各從其類也。」此言天地之間，氣類相感，各歸其群，自然之理也。</p><p><strong>所出</strong>：《周易 · 文言》 — https://zh.wikisource.org/wiki/周易/文言</p></article></main></div></div>
