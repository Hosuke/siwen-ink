    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 卻語</nav></header><main><article><h1>卻語</h1><p>察伺其短，驗之以忌諱時禁</p><p>卻語者，察伺短也。故多必有數短之處，識其短驗之。動以忌諱，示以時禁，其人恐畏，然後結信以安其心，收語蓋藏而卻之。無見己之所不能於多方之人。</p><p><strong>所出</strong>：《鬼谷子 · 卷03》 — https://zh.wikisource.org/wiki/鬼谷子/卷03</p></article></main></div></div>
