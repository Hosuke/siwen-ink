    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 奮言者華</nav></header><main><article><h1>奮言者華</h1><p>奮於言者華，奮於行者伐；色知而有能者，小人。君子知之曰知之，不知曰不知。</p><p>奮於言者華，奮於行者伐，色知而有能者，小人也。</p><p>自矜其言者，華而不實；自伐其行者，露而不深沉；顏色之間便佯其知者，小人之尤。君子則[[言要知行至仁]]：知之曰知，不知曰不知，坦蕩明白。此正[[盛服見孔子]]之戒，子路聞之遂改服而入。</p><p><strong>所出</strong>：《荀子 · 子道篇》 — https://zh.wikisource.org/wiki/荀子/子道篇</p></article></main></div></div>
