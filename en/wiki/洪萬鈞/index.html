    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 洪萬鈞，圔曠所訂</nav></header><main><article><h1>洪萬鈞，圔曠所訂</h1><p>樂之至者，可定萬鈞，妙鑒之論，不謬蹊徑。</p><p>洪萬鈞，圔曠所定。良書盈篋，妙鑒迺訂。流鄭淫人，無或失聽。獨有此律，不謬蹊徑。</p><p>[[六觀]]立則批評有[[操千曲而後曉聲|準則]]，[[書亦國華]]故賞鑒有可臻之境。[[見異唯知音耳]]，知音之難，萬鈞之重也。</p><p><strong>所出</strong>：《文心雕龍 · 知音》 — https://zh.wikisource.org/wiki/文心雕龍/知音</p></article></main></div></div>
