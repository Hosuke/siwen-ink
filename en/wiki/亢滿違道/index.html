    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 亢滿違道</nav></header><main><article><h1>亢滿違道</h1><p>君驕亢自滿，悖離天道，必致敗亡之緒。</p><p>或君驕佚，亢滿違道。</p><p>[[存亡之緒]]之分，在乎君之馭臣。亢則必傾，滿則必覆，[[御政之首]]不以[[辰極受正]]為法，而以驕佚自處，是亢滿以違道也。[[四七乖戾]]，[[五緯錯順]]失其序，[[弦望盈縮]]乖其度，凶咎之來，實自此始。</p><p><strong>所出</strong>：《周易參同契 · 05章》 — https://zh.wikisource.org/wiki/周易參同契/05章</p></article></main></div></div>
