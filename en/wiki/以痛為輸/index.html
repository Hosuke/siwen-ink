    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 以痛為輸</nav></header><main><article><h1>以痛為輸</h1><p>取穴之法，於痛處定穴，毋待他求。</p><p>凡治經筋之病，以痛為輸，即以病者疼痛之處為腧穴，不必拘於常規穴位。此法為[[燔針劫刺]]之要則。</p><p><strong>所出</strong>：《黃帝內經 · 靈樞第四卷》 — https://zh.wikisource.org/wiki/黃帝內經/靈樞第四卷</p></article></main></div></div>
