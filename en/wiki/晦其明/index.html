    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 晦其明</nav></header><main><article><h1>晦其明</h1><p>艱貞之道，在晦藏其明以避害。</p><p>「利艱貞，晦其明也。」卦辭言利艱貞者，蓋當明夷之世，光明受傷，君子欲保其貞，不在於顯明，在於晦藏。晦其明者，非無明也，乃晦之而不發也。艱而能貞，晦而能守，此明夷之善用也。</p><p><strong>所出</strong>：《周易 · 明夷》 — https://zh.wikisource.org/wiki/周易/明夷</p></article></main></div></div>
