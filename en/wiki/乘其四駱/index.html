    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 乘其四駱</nav></header><main><article><h1>乘其四駱</h1><p>賢者乘四馬之車也。</p><p>「我覯之子，乘其四駱。」駱，白馬黑鬛也。四駱者，四馬之車，古者諸侯、賢臣乘之以行。詩言君子乘四馬之車，見其儀從之盛，以興己之遇賢也。</p><p><strong>所出</strong>：《詩經 · 裳裳者華》 — https://zh.wikisource.org/wiki/詩經/裳裳者華</p></article></main></div></div>
