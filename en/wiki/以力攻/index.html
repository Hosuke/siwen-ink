    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 以力攻</nav></header><main><article><h1>以力攻</h1><p>實力征伐，出一取十；以空言攻人，出十喪百。</p><p>韓非論征伐之務，云「以力攻者，出一取十；以言攻者，出十喪百」。又云「國好力，此謂以難攻；國好言，此謂以易攻」。夫力者，兵甲之實、耕戰之功也；言者，辯說之辭、仁義之說也。以實力攻敵，出一兵而取十地，功實而利厚；以空言攻人，發十語而喪百信，徒費而無功。是故霸王之國務力而不務言，修內政而不恃外援，此所以無敵於天下也。</p><p><strong>所出</strong>：《韓非子 · 飭令》 — https://zh.wikisource.org/wiki/韓非子/飭令</p></article></main></div></div>
