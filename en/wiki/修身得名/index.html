    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 修身得名</nav></header><main><article><h1>修身得名</h1><p>入而行不脩則身之罪，出而名不章則友之過。學者入則篤行，出則友賢。</p><p>故君子入則篤行，出則友賢，何為而無孝之名也！</p><p>子路問有耕耘手足胼胝而無孝名者，孔子詰其身敬、辭遜、色順三者闕否。復申之曰：入而不行修，是己之罪；出而名不章，是友之過。[[修身]]既成，賢友既得，孝名自至。此[[孝行大小]]之義，兼及內外之道也。</p><p><strong>所出</strong>：《荀子 · 子道篇》 — https://zh.wikisource.org/wiki/荀子/子道篇</p></article></main></div></div>
