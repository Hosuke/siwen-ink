    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 匈奴好漢物之弊</nav></header><main><article><h1>匈奴好漢物之弊</h1><p>中行說言匈奴以衣食異而彊，若變俗好漢物則歸於漢。</p><p>初，匈奴好漢繒絮食物。中行說曰：「匈奴人眾不能當漢之一郡，然所以彊者，以衣食異，無仰於漢也。今單于變俗好漢物，漢物不過什二，則匈奴盡歸於漢矣。其得漢繒絮，以馳草棘中，衣袴皆裂敝，以示不如旃裘之完善也。得漢食物皆去之，以示不如湩酪之便美也。」</p><p><strong>所出</strong>：《史記 · 卷110》 — https://zh.wikisource.org/wiki/史記/卷110</p></article></main></div></div>
