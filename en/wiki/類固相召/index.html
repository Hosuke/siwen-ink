    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 類固相召</nav></header><main><article><h1>類固相召</h1><p>物之同類者，氣相感而應。</p><p>類固相召，氣同則合，聲比則應。鼓宮而宮動，鼓角而角動。平地注水，水流溼。均薪施火，火就燥。山雲草莽，水雲魚鱗，旱雲煙火，雨雲水波，無不皆類其所生以示人。故以龍致雨，以形逐影。師之所處，必生棘楚。禍福之所自來，眾人以為命，安知其所。</p><p>覆巢毀卵，則鳳凰不至；刳獸食胎，則麒麟不來；乾澤涸漁，則龜龍不往。物之從同，不可為記。</p><p>類同相召，理勢然也。聖人察此，故能觀萬物之類，通陰陽之變。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十三》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十三</p></article></main></div></div>
