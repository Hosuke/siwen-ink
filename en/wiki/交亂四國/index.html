    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 交亂四國</nav></header><main><article><h1>交亂四國</h1><p>讒言流布，致四鄰之國交相擾亂。</p><p>「交亂四國」，《青蠅》次章句也。</p><p>四國者，謂四方之鄰國也。讒人以其言播於外，交相擾亂，非一國之患也。夫言之不慎，害及境內；言之流播，害及四鄰。詩人明其所自，言讒言不止，則邦交由之而壞，四國之亂實由中也。此見[[讒言致罪|讒言之害]]自近及遠，自小及大焉。</p><p><strong>所出</strong>：《詩經 · 青蠅》 — https://zh.wikisource.org/wiki/詩經/青蠅</p></article></main></div></div>
