    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 德盛不狎侮</nav></header><main><article><h1>德盛不狎侮</h1><p>德盛者不自矜慢，狎侮之行損德敗名。</p><p>德盛不狎侮。狎侮者，待人輕忽之謂也。狎侮君子，則無以盡人心；狎侮小人，則無以盡其力。夫[[德盛不狎侮]]者，待人各有其道：尊賢以盡心，撫賤以用力，無簡褻之心，則上下各得其分。</p><p><strong>所出</strong>：《尚書 · 旅獒》 — https://zh.wikisource.org/wiki/尚書/旅獒</p></article></main></div></div>
