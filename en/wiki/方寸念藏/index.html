    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 方寸念藏</nav></header><main><article><h1>方寸念藏</h1><p>方寸之中，深藏正念，念而不蕩。</p><p>方寸之中念深藏，方寸者心也，心方一寸之地而能含萬機。修真者心存正念，深藏於方寸之中，念茲在茲，不散不馳也。</p><p><strong>所出</strong>：《黃庭內景經 · 上睹章第十六》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/上睹章第十六</p></article></main></div></div>
