    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 恭遜敬愛</nav></header><main><article><h1>恭遜敬愛</h1><p>恭遜敬愛辭讓之道，吉事凶事皆可用，大以理天下小以治一人。</p><p>管子言：「修恭遜敬愛辭讓，除怨無爭，以相逆也，則不失於人矣。」此道也，吉事可以入察，凶事可以居喪；大以理天下而不益，小以治一人而不損。往之中國、蠻夷之國，以及禽獸昆蟲，皆待此而爲治亂。審行之身毋怠，雖夷貉之民，可化而使之愛；審去之身，雖兄弟父母，可化而使之惡。先王曰道如此。</p><p><strong>所出</strong>：《管子 · 第32篇小稱》 — https://zh.wikisource.org/wiki/管子/第32篇小稱</p></article></main></div></div>
