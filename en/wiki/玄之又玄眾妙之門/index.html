    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 玄之又玄眾妙之門</nav></header><main><article><h1>玄之又玄眾妙之門</h1><p>幽深復幽深，萬妙所從出。</p><p>玄之有玄，眾眇之門。玄者，深遠不可測之謂。言道之幽而又幽、深而又深，萬有萬妙皆出於此。[[道可道非恆道]]，此道不可道者也；[[名可名非恆名]]，此名不可名者也。不可道之道，不可名之名，萬物之妙所由生、眾有之門所由啟。玄之又玄，則無名之始與有名之母，闔然為一，妙用無方矣。</p><p><strong>所出</strong>：《老子 (帛書本) · 章一》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
