    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 終南何有</nav></header><main><article><h1>終南何有</h1><p>問山之所產，實美君子之德。</p><p>終南何有，有條有梅。終南何有，有紀有堂。此詩之興也。以山之所有起興，引出君子至止、衣錦乘玉之美。《序》曰：「大夫美之，故作是詩以戒勸之。」條、梅、紀、堂，皆山之所有，以起下文「君子至止」之意。詩以問答發端，而歸美於君，其旨深矣。</p><p><strong>所出</strong>：《詩經 · 終南》 — https://zh.wikisource.org/wiki/詩經/終南</p></article></main></div></div>
