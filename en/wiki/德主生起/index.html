    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 德主生起</nav></header><main><article><h1>德主生起</h1><p>言德象陽，主生發起始之功。</p><p>德主生起。</p><p>德者陽之事，其用在生發起始。陽氣宣暢，布於萬物，故主生；勾萌甲坼，悉由茲起，故主起。與刑之「伏殺」相對為用也。</p><p><strong>所出</strong>：《周易參同契 · 29章》 — https://zh.wikisource.org/wiki/周易參同契/29章</p></article></main></div></div>
