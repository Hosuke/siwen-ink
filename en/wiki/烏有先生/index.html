    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 烏有先生</nav></header><main><article><h1>烏有先生</h1><p>子虛所述虛構人物，烏有此事，蓋假以難子虛之夸楚。</p><p>相如以「子虛」，虛言也，為楚稱；「烏有先生」者，烏有此事也，為齊難；「無是公」者，無是人也，明天子之義。</p><p><strong>所出</strong>：《史記 · 卷117》 — https://zh.wikisource.org/wiki/史記/卷117</p></article></main></div></div>
