    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 二客從死</nav></header><main><article><h1>二客從死</h1><p>田橫二客，穿冢旁孔自剄以從葬。</p><p>田橫自剄，客奉其頭馳奏高帝。帝以王者禮葬之，既葬，二客穿其冢旁孔，皆自剄，下從之。</p><p>高帝聞之大驚，以為田橫之客皆賢。二客者，從橫入洛陽，親見橫之死而不及止，乃以死報知遇之恩。</p><p><strong>所出</strong>：《史記 · 卷094》 — https://zh.wikisource.org/wiki/史記/卷094</p></article></main></div></div>
