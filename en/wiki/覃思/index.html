    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 覃思</nav></header><main><article><h1>覃思</h1><p>深思詳研，方能得文之精義也。</p><p>劉勰分之為二途：其一為「覃思」，情饒歧路，鑑在疑後，研慮方定。覃思之人，心多歧路之惑，必待疑惑既明，而後研精覃慮，方能底於成就。其二為「敏悟」，心總要術，敏在慮前，應機立斷。二者難易殊途，而成功則一。故云「機敏故造次而成功，慮疑故愈久而致績」，亦云「難易雖殊，並資博練」，明博聞廣見之功，不可廢也。</p><p><strong>所出</strong>：《文心雕龍 · 神思》 — https://zh.wikisource.org/wiki/文心雕龍/神思</p></article></main></div></div>
