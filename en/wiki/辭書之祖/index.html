    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 辭書之祖</nav></header><main><article><h1>辭書之祖</h1><p>爾雅為我國辭書之宗，後世字典、詞典之濫觴也。</p><p>爾雅一書，彙集古訓，別為釋詁、釋言、釋訓諸篇，以今言釋古語，以雅言通方言，使學者得循是以窺古籍焉。厥後揚雄作《方言》，許慎著《說文》，劉熙撰《釋名》，皆祖述其法。故稱之曰「辭書之祖」，言辭書之學，由此而興也。</p><p><strong>所出</strong>：《爾雅》 — https://zh.wikisource.org/wiki/爾雅</p></article></main></div></div>
