    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 鼎卦</nav></header><main><article><h1>鼎卦</h1><p>巽下離上，鼎象也；以木巽火，烹飪成養。</p><p>鼎，居《周易》第五十卦，巽下離上。</p><p>卦辭曰：「鼎：元吉，亨。」鼎為禮器，烹飪之具。聖人烹飪以享上帝，大亨以養聖賢，故鼎象為治世之器。[[木上有水]]，井之象；木上有火，鼎之象。皆聖人法象以成政治者也。</p><p>彖傳曰：「鼎，象也。以木巽火，亨飪也。聖人亨以享上帝，而大亨以養聖賢。巽而耳目聰明，柔進而上行，得中而應乎剛，是以元亨。」</p><p>象傳曰：「木上有火，鼎；君子以正位凝命。」</p><p><strong>所出</strong>：《周易 · 鼎》 — https://zh.wikisource.org/wiki/周易/鼎</p></article></main></div></div>
