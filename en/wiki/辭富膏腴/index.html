    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 辭富膏腴</nav></header><main><article><h1>辭富膏腴</h1><p>緯書之事豐奇偉，無益經典，而有助文章，辭人捃摭英華焉。</p><p>若乃羲農軒皞之源，山瀆鍾律之要，白魚赤烏之符，黃金紫玉之瑞，事豐奇偉，辭富膏腴，無益經典而有助文章。</p><p>是以後來辭人，捃摭英華，平子恐其迷學，奏令禁絕；仲豫惜其雜真，未許煨燔。</p><p>蓋前代配經，故詳論之，非一欲焚棄之也。</p><p><strong>所出</strong>：《文心雕龍 · 正緯》 — https://zh.wikisource.org/wiki/文心雕龍/正緯</p></article></main></div></div>
