    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 設大盤造冰</nav></header><main><article><h1>設大盤造冰</h1><p>君設大盤以容冰，大夫以下各因其等而降殺之，以防腐敗。</p><p>君設大盤造冰焉，大夫設夷盤造冰焉，士并瓦盤無冰，設床襢笫，有枕。含一床，襲一床遷尸於堂又一床，皆有枕席──君大夫士一也。</p><p><strong>所出</strong>：《禮記 · 喪大記》 — https://zh.wikisource.org/wiki/禮記/喪大記</p></article></main></div></div>
