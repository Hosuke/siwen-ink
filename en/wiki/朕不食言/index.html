    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 朕不食言</nav></header><main><article><h1>朕不食言</h1><p>湯之自誓，言己言必踐，無有反覆。</p><p>王曰：「爾無不信，朕不食言。」</p><p>湯之誓師，以信為本。食言者，食而吐之，謂言而無實也。湯自謂吾言一出，必踐於行，不為虛語以誑眾。後世用「食言」以指失信，而「不食言」以稱誠實之君子焉。</p><p><strong>所出</strong>：《尚書 · 湯誓》 — https://zh.wikisource.org/wiki/尚書/湯誓</p></article></main></div></div>
