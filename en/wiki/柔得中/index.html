    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 柔得中</nav></header><main><article><h1>柔得中</h1><p>柔居中位以成濟</p><p>未濟，亨，柔得中也。彖辭以為，卦之所以亨者，以柔得中也。六五柔居中位，下應九二，上與上九相接，故能致亨。《[[柔得中小事吉]]》之象，未濟以柔中而亨，其義相通也。</p><p><strong>所出</strong>：《周易 · 未濟》 — https://zh.wikisource.org/wiki/周易/未濟</p></article></main></div></div>
