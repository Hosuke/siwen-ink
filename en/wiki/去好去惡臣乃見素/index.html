    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 去好去惡</nav></header><main><article><h1>去好去惡</h1><p>君去好惡，臣乃見其素志</p><p>君無見其所欲，君見其所欲，臣自將雕琢；君無見其意，君見其意，臣將自表異。故曰：去好去惡，臣乃見素；去舊去智，臣乃自備。</p><p><strong>所出</strong>：《韓非子 · 主道》 — https://zh.wikisource.org/wiki/韓非子/主道</p></article></main></div></div>
