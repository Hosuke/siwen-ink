    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 重巽以申命</nav></header><main><article><h1>重巽以申命</h1><p>上下皆巽，則命令重申而德意達矣。</p><p>重巽以申命者，上下皆巽，上下皆風也。風相隨而行，無物不入，故命由此而重申，德由此而大布。《彖》曰「重巽以申命」，明此卦之所以為申命也。象又申之曰「君子以申命行事」，則非徒命之申而已，抑且見諸行事矣。</p><p><strong>所出</strong>：《周易 · 巽》 — https://zh.wikisource.org/wiki/周易/巽</p><hr><p><strong>所出</strong>：《周易註 (王弼) · 卷06》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷06</p></article></main></div></div>
