    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 駿奔走</nav></header><main><article><h1>駿奔走</h1><p>疾馳趨事，不敢怠惰也。</p><p>「駿奔走在廟」，[[詩經]]之句也。駿，迅速也。言助祭之臣既對越[[在天]]，又疾馳趨事於廟中，致敬不懈，蓋所以承[[秉文之德]]之旨也。[[清廟]]之詩，以臣工之敬謹與文德之廣被終焉。</p><p><strong>所出</strong>：《詩經 · 清廟》 — https://zh.wikisource.org/wiki/詩經/清廟</p></article></main></div></div>
