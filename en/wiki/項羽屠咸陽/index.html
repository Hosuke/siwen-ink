    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 項羽屠咸陽</nav></header><main><article><h1>項羽屠咸陽</h1><p>項羽入關後大肆屠殺焚掠，毀咸陽宮室，掠寶貨婦女而東。</p><p>居數日，項羽引兵西屠咸陽，殺秦降王子嬰，燒秦宮室，火三月不滅；收其貨寶婦女而東。項羽既破秦而入咸陽，暴虐之行較之秦軍有甚焉，遂失秦地民心，为后日败亡之根。</p><p><strong>所出</strong>：《史記 · 卷007》 — https://zh.wikisource.org/wiki/史記/卷007</p></article></main></div></div>
