    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 將無還令賞罰必信</nav></header><main><article><h1>將無還令賞罰必信</h1><p>將軍發令不可收回，賞罰必信如天地，方可使人效命。</p><p>《軍讖》曰：「將之所以為威者，號令也。戰之所以全勝者，軍政也。士之所以輕死者，用命也。故將無還令，賞罰必信，如天如地，乃可使人，士卒用命，乃可越境。」</p><p>令出必行，賞罰分明，如天地之不可欺，則軍令暢通，士卒用命，戰無不勝。</p><p><strong>所出</strong>：《三略》 — https://zh.wikisource.org/wiki/三略</p></article></main></div></div>
