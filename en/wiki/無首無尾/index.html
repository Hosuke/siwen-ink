    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 無首無尾</nav></header><main><article><h1>無首無尾</h1><p>五行互生滅之，其來無首其往無尾，惟無我無人是與天地冥。</p><p>五行之運，因精有魂，因魂有神，因神有意，因意有魄，因魄有精。五行迴環不已，所以我之偽心流轉造化，幾億萬歲，未有窮極。然核芽相生，不知其幾萬株，天地雖大不能芽空中之核；雌卵相生，不知其幾萬禽，陰陽雖妙不能卵無雄之雌。</p><p>惟其來於我者皆攝之以一息，則變物為我，無物非我，所謂五行者孰能變之？</p><p>精神水火，五行互生滅之，其來無首，其往無尾。惟無我無人，無首無尾，所以與天地冥。</p><p><strong>所出</strong>：《關尹子 · 4》 — https://zh.wikisource.org/wiki/關尹子/4</p></article></main></div></div>
