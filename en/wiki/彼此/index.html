    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 彼此</nav></header><main><article><h1>彼此</h1><p>名實相當，則彼此分明。</p><p>彼此者，名所指之雙方也。其名正，則唯乎其彼此。謂彼而彼，不唯乎彼，則彼謂不行；謂此而此，不唯乎此，則此謂不行。以其名之不當，是以致亂。</p><p>彼此而彼此當，則彼此各止於彼此，此之謂正。彼此混淆，彼而此、此而彼，則名實紊亂，不可不慎也。</p><p><strong>所出</strong>：《公孫龍子 · 6》 — https://zh.wikisource.org/wiki/公孫龍子/6</p></article></main></div></div>
