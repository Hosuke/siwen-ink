    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 湯遭厄際</nav></header><main><article><h1>湯遭厄際</h1><p>湯聖之世，水旱並興，萬物失榮；以此喻學道者亦歷世間之厄。</p><p>經云：「湯遭厄際，水旱隔并。柯葉萎黃，失其華榮。」</p><p>湯聖之世，遭逢厄運，水旱之災並興，萬物失其華榮，柯葉萎黃。此世間之常變，聖人不能免。然伯陽以之為喻——修道之人，雖棲遲僻陋、抱一毋舍，亦未免世間之湯旱水旱。然「吉人相乘負」，彼此扶持，則「安穩可長生」。</p><p>厄際之來，非修道之咎，乃天運之常。持守含德抱一之旨者，雖遇厄際而心不搖，此長生之所以成。</p><p><strong>所出</strong>：《周易參同契 · 35章》 — https://zh.wikisource.org/wiki/周易參同契/35章</p></article></main></div></div>
