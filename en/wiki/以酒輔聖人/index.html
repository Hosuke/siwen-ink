    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 以酒輔聖人</nav></header><main><article><h1>以酒輔聖人</h1><p>援引聖賢以為酒辯，其說似是而實非。</p><p>或人難葛洪，以酒輔聖賢，云堯舜千鍾百斛，仲尼無量，周公制禮，漢高斬蛇，於公斷獄，管輅清辯，揚雲著《太玄》，皆因乎酒。葛洪一一折之，謂聖賢之異自才智，「一日之飲，安能至是」？仲尼畏性之變不敢及亂，周公終日百拜而肴乾酒澄。漢高之斬蛇，乃應天承運，縱不醉亦然。於公之明，在於聰達，不賴於酒。以此觀之，以酒輔聖人之說，不過借口文飾而已，非實論也。</p><p><strong>所出</strong>：《抱朴子 · 卷24》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷24</p></article></main></div></div>
