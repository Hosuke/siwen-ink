    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 甯乘說大將軍</nav></header><main><article><h1>甯乘說大將軍</h1><p>甯乘以衞青三子皆侯由后族，勸以千金為王夫人壽，青從之，乘亦蒙拜官。</p><p>甯乘說大將軍曰：「將軍所以功未甚多，身食萬戶，三子皆為侯者，徒以皇后故也。今王夫人幸而宗族未富貴，願將軍奉所賜千金為王夫人親壽。」大將軍乃以五百金為壽。天子聞之，問大將軍，大將軍以實言，上乃拜甯乘為東海都尉。</p><p><strong>所出</strong>：《史記 · 卷111》 — https://zh.wikisource.org/wiki/史記/卷111</p></article></main></div></div>
