    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 操千曲而後曉聲，觀千劍而後識器</nav></header><main><article><h1>操千曲而後曉聲，觀千劍而後識器</h1><p>博觀而後能辨，為文評之要法。</p><p>凡操千曲而後曉聲，觀千劍而後識器；故圓照之象，務先博觀。閱喬嶽以形培塿，酌滄波以喻畎澮，無私於輕重，不偏於憎愛，然後能平理若嶽，照辭如鏡矣。</p><p>此[[知多偏好]]之病，所為救也。不[[操千曲而後曉聲|博觀]]，則所知有限，所好偏執，安能別文章之優劣哉。</p><p><strong>所出</strong>：《文心雕龍 · 知音》 — https://zh.wikisource.org/wiki/文心雕龍/知音</p></article></main></div></div>
