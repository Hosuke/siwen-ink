    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 自矜不長</nav></header><main><article><h1>自矜不長</h1><p>自矜者不可以長久。喻驕盈之不可以保。</p><p>此章又云「自矜者不長」，與[[自伐無功]][[自見不明]][[自是不彰]]同為老子所列六病之一。皆示人矜伐之害——自矜者，驕傲自尊也。如此者不可以長久，以其犯天之道、物之情也。有道者[[有道者不處]]此矜伐之事。</p><p>  <strong>所出</strong>：《道德經 (王弼本) · 二十四章》 — https://zh.wikisource.org/wiki/道德經_(王弼本)</p></article></main></div></div>
