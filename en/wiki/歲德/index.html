    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 歲德</nav></header><main><article><h1>歲德</h1><p>土德居中，輔四時之出入，節風雨、和萬物。</p><p>中央曰土。土德實輔四時，入出以風雨。節土益力，土生皮肌膚。其德和平用均，中正無私，實輔四時。春嬴育，夏養長，秋聚收，冬閉藏。大寒乃極，國家乃昌，四方乃服。此謂歲德。歲掌和，和為雨。</p><p><strong>所出</strong>：《管子 · 第40篇四時》 — https://zh.wikisource.org/wiki/管子/第40篇四時</p></article></main></div></div>
