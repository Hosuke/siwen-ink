    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 爾友邦冢君</nav></header><main><article><h1>爾友邦冢君</h1><p>友邦，與周同德之諸侯；冢君，諸侯之長。</p><p>王曰：「嗟！我友邦冢君，御事、司徒、司馬、司空、亞、旅、師氏、千夫長、百夫長及庸、蜀、羌、髳、微、盧、彭、濮人。」言誓師之際，西土諸侯及[[庸蜀羌髳微盧彭濮]]之蠻夷，咸在焉，共聞[[恭行天罰]]之誓也。</p><p><strong>所出</strong>：《尚書 · 牧誓》 — https://zh.wikisource.org/wiki/尚書/牧誓</p></article></main></div></div>
