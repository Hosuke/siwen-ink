    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 湯孫</nav></header><main><article><h1>湯孫</h1><p>商家子孫之稱，祭祀時自謂其祖湯也</p><p>商家祭祀，稱其子孫為湯孫。湯者，成湯也；孫者，子姓之裔也。[[湯孫之緒]]言湯之遺緒，[[湯孫之將]]言湯孫奉祀以將其祭也。</p><p><strong>所出</strong>：《詩經 · 那》 — https://zh.wikisource.org/wiki/詩經/那</p><hr><p>此命言微子為湯孫，曰：「湯孫之緒。」又勉之曰：「爾惟踐修厥猷，舊有令聞。」言湯之孫裔當踐行湯道，保守先祖令名也。</p><p>  <strong>所出</strong>：《尚書 · 微子之命》 — https://zh.wikisource.org/wiki/尚書/微子之命</p></article></main></div></div>
