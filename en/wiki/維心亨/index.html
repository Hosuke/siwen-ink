    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 維心亨</nav></header><main><article><h1>維心亨</h1><p>心懷誠信，則險難無阻。</p><p>「維心亨」者，卦辭之要義也。言坎之時，雖身陷險難，唯心懷誠信則無往不通。蓋九二、九五剛中得位，內外交應，故能「有孚」而「亨」。</p><p><strong>所出</strong>：《周易 · 坎》 — https://zh.wikisource.org/wiki/周易/坎</p><hr><p>坎之為卦，水流而不盈，行險而不失其信，維心亨。夫水之流盈而後達，坎之維心，剛中而實也。行有尚者，往而有功，以其剛中不失其信也。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷03》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷03</p></article></main></div></div>
