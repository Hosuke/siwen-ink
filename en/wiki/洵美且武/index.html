    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 洵美且武</nav></header><main><article><h1>洵美且武</h1><p>美而且武，兼有威容之稱也。</p><p>「洵美且武」，《叔于田》末章之辭也。言叔于野外，其服馬御眾，赫然有威，而其人則又[[洵美]]可觀。此詩人所以極言其人之完美，仁與好與武並陳，而歎其無往而非美也。</p><p><strong>所出</strong>：《詩經 · 叔于田》 — https://zh.wikisource.org/wiki/詩經/叔于田</p></article></main></div></div>
