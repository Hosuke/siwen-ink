    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 王乃天</nav></header><main><article><h1>王乃天</h1><p>王合天德，是為天。</p><p>王之德洽於天下，與天合德，則王亦天也。天無心而成化，王無為而天下治。[[公乃王]]之極也。</p><p><strong>所出</strong>：《老子河上公章句 · 歸根》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
