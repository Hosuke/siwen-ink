    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 乾坤體乃成</nav></header><main><article><h1>乾坤體乃成</h1><p>龍虎兩弦合精，乾坤之體乃成，丹道之功畢矣。</p><p>乾象天而主陽，坤象地而主陰。龍虎兩弦合精，陰陽交會，乾坤之體以成，此丹道之終極境界也。</p><p>[[兩弦合其精]]而後[[易道正不傾]]，猶[[乾坤]]之定於上下，而天地之體成焉。[[二八應一斤]]者，正乾坤之象，以二爻合為一卦，以八乘二成一斤，與[[坎離匡廓]]之義相通，而功用異焉。</p><p><strong>所出</strong>：《周易參同契 · 09章》 — https://zh.wikisource.org/wiki/周易參同契/09章</p></article></main></div></div>
