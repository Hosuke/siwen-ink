    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 明月暗投</nav></header><main><article><h1>明月暗投</h1><p>明珠夜璧，以闇投人，人無不按劍相眄。</p><p>鄒陽書曰：「臣聞明月之珠，夜光之璧，以闇投人於道路，人無不按劍相眄者。何則？無因而至前也。」以珍寶暗投於行人，行人疑其有故，皆按劍以防之。喻賢才懷忠抱義而無因自達，時主不察，反以為疑而不見用也。又言蟠木根柢、輪囷離詭者，先得左右為之容飾，方成萬乘之器；無因而至，雖隨侯之珠、夜光之璧，猶結怨而不見德。是以賢士困於無援，良璞毀於暗投也。</p><p><strong>所出</strong>：《史記 · 卷083》 — https://zh.wikisource.org/wiki/史記/卷083</p></article></main></div></div>
