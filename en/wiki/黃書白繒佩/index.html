    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 黃書白繒佩</nav></header><main><article><h1>黃書白繒佩</h1><p>以黃書佩於白繒，存呼老君內諱。</p><p>黃書白繒佩者，大洞三素老君消魔玉符之用法也。诀曰：「當黃書白繒佩之，存呼老君內諱名字，鎮我鼻下人中，備衛我身，身得長存，我形昇飛，七祖皆仙，上登南宮，奉謁帝晨。」</p><p>書符於白繒而佩之，存呼老君內諱，鎮於鼻下人中之戶，此[[大洞消魔玉符]]行持之要法也。</p><p><strong>所出</strong>：《上清大洞真經 · 36章》 — https://zh.wikisource.org/wiki/上清大洞真經/36章</p></article></main></div></div>
