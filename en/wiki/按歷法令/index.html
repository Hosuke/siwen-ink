    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 按歷法令</nav></header><main><article><h1>按歷法令</h1><p>治世者當循曆法之正，至誠專密，不敢有違。</p><p>按歷法令，至誠專密。</p><p>治世者必本之於曆數，正之以法令。曆者天時之軌，律者人事之準。[[藏器俟時]]、慎候日辰，皆是意也。[[屯以子申蒙用寅戌]]之義，即按歷以定卦日也。專密者，心不外馳，意不旁騖，一於道而無或渝也。[[四時順宜]]而後剛柔斷，[[五行守界]]而不妄盈縮，此之謂敷。</p><p><strong>所出</strong>：《周易參同契 · 17章》 — https://zh.wikisource.org/wiki/周易參同契/17章</p></article></main></div></div>
