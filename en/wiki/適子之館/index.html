    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 適子之館</nav></header><main><article><h1>適子之館</h1><p>往之其人之居。言好賢者親至其館。</p><p>適，往也。館，舍也。[[粲]]者所授之物，而授之之禮，必先「適子之館」焉。</p><p>《緇衣》三章，皆言「適子之館兮，還，予授子之粲兮」。蓋言往造賢者之居，見其人而歸，至於還也，則以粲遺之。夫好賢者必致敬以盡其情，故先往見之，然後歸而報之。此古人待賢之禮，所以見於詩詠者也。</p><p><strong>所出</strong>：《詩經 · 緇衣》 — https://zh.wikisource.org/wiki/詩經/緇衣</p></article></main></div></div>
