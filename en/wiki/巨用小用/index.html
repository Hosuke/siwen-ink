    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 巨用小用</nav></header><main><article><h1>巨用小用</h1><p>治國有巨用、小用之別，巨用者先義後利，小用者先利後義。</p><p>國者，巨用之則大，小用之則小；綦大而王，綦小而亡，小巨分流者存。巨用之者，先義而後利，安不卹親疏，不卹貴賤，唯誠能之求；小用之者，先利而後義，安不卹是非，不治曲直，唯便僻親比己者之用。粹而王，駁而霸，無一焉而亡。</p><p><strong>所出</strong>：《荀子 · 王霸篇》 — https://zh.wikisource.org/wiki/荀子/王霸篇</p></article></main></div></div>
