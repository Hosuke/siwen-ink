    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 以賤匹貴</nav></header><main><article><h1>以賤匹貴</h1><p>晏子以為廢長立少，以賤匹貴，乃亂國亡家之本。</p><p>景公愛孺子荼，欲廢陽生而立荼。晏子曰：「不可。以賤匹貴，國之害也；置大立少，亂之本也。」又言：「服位有等，故賤不陵貴；立子有禮，故孽不亂宗。」若廢長立少，不可以教下；尊孽卑宗，不可以利所愛。田氏卒如其言，殺君荼，立陽生；殺陽生，立簡公；殺簡公而取齊國。晏子之見，可謂遠矣。</p><p><strong>所出</strong>：《晏子春秋 · 卷一》 — https://zh.wikisource.org/wiki/晏子春秋/卷一</p></article></main></div></div>
