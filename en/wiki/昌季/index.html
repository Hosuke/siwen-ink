    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 昌季</nav></header><main><article><h1>昌季</h1><p>崖崩不死，仙人尹伊授藥服之，夫婦皆得飛昇。</p><p>昌季，不知何許人。入山擔柴，崖崩墮山下，尚有微氣。其婦來見之，涕泣哀働，仙人尹伊聞之，愴然謂婦曰：「吾能治汝夫。」即以藥賜之，並付其方，云：「能長服之，令人成仙。」</p><p>季合藥服之千日，忽然飛昇。妻追之，顧謂曰：「道與世殊，卿善自愛敬。」妻亦合藥服之三年，便復飛去，至蓬萊山見季，季曰：「知卿當來爾。」</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 21》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/21</p></article></main></div></div>
