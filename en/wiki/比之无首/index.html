    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 比之无首</nav></header><main><article><h1>比之无首</h1><p>親附而無首領，無所終止。</p><p>比之无首，謂親附而無首領也。《比》上六象曰「比之无首，无所終也」，言上六陰柔居卦終，首尾皆無所依恃。上以无首之象比人，人亦无首可從，其道窮矣，故凶。比之道，貴乎有首有末，上下相應；无首則无以率下，无末則无以自保，凶莫甚焉。</p><p><strong>所出</strong>：《周易 · 比》 — https://zh.wikisource.org/wiki/周易/比</p></article></main></div></div>
