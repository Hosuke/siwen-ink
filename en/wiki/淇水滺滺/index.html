    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 淇水滺滺</nav></header><main><article><h1>淇水滺滺</h1><p>水流盈滿之貌，喻故土之不可忘也</p><p>淇水滺滺，言水之盈溢而長流也。衞女適異國而不得歸，故道淇水之滺滺，以起[[思歸不得]]之意。泉源在左，淇水在右，山川縈帶於故土者，歷歷在目，而身不得歸，是以前章言「遠兄弟父母」，後章言「以寫我憂」，皆由淇水之觸目而興悲也。</p><p><strong>所出</strong>：《詩經 · 竹竿》 — https://zh.wikisource.org/wiki/詩經/竹竿</p></article></main></div></div>
