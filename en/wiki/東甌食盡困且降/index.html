    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 東甌食盡困且降</nav></header><main><article><h1>東甌食盡困且降</h1><p>閩越圍東甌，東甌食盡且困，乃使人告急天子。</p><p>至建元三年，閩越發兵圍東甌。東甌食盡，困，且降，乃使人告急天子。天子問太尉田蚡，蚡對曰：「越人相攻擊，固其常，又數反覆，不足以煩中國往救也。自秦時棄弗屬。」夫東甌以糧盡援絕而告急，閩越以數世之讎而加兵，兄弟之邦自相屠戮，亦可悲矣。天子不聽蚡言，遣莊助發兵會稽，卒解東甌之圍。東甌請舉國徙中國，乃悉眾來，處江淮之間。東甌之國遂虛，而東甌之名亦不復見於後矣。</p><p><strong>所出</strong>：《史記 · 卷114》 — https://zh.wikisource.org/wiki/史記/卷114</p></article></main></div></div>
