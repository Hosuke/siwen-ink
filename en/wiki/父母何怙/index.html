    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 父母何怙</nav></header><main><article><h1>父母何怙</h1><p>父母無恃，子女不知所怙。言不得養親之痛。</p><p>「父母何怙」，出自〈[[鴇羽]]〉首章。怙者，恃也、賴也。子女之於父母，恃以為生。</p><p>征人言「不能蓺稷黍」，則父母無以為食；不得歸耕，則父母失所恃怙。怙字下從心、上從古，示人有所依仗之意。今言「何怙」，是以反問出怨意，言父母竟無可恃之物，子女之罪也。</p><p>後世「失怙」之詞，本此而來。</p><p><strong>所出</strong>：《詩經 · 鴇羽》 — https://zh.wikisource.org/wiki/詩經/鴇羽</p></article></main></div></div>
