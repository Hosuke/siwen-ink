    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 人之生也直</nav></header><main><article><h1>人之生也直</h1><p>直道者生，罔人者幸免</p><p>孔子曰：「人之生也直，罔之生也幸而免。」直者，天理之正，生存之本；罔者，僥倖之術，或可以免，亦不可以為常也。</p><p><strong>所出</strong>：《論語 · 雍也第六》 — https://zh.wikisource.org/wiki/論語/雍也第六</p></article></main></div></div>
