    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 死生</nav></header><main><article><h1>死生</h1><p>虛化神氣形血而遞至於老死，死復化虛，達此理者虛而乳之神可以不化形可以不生。</p><p>虛化神，神化氣，氣化血，血化形，形化嬰，嬰化童，童化少，少化壯，壯化老，老化死。死復化為虛，虛復化為神，神復化為氣，氣復化為物。化化不間，由環之無窮。夫萬物非欲生，不得不生；萬物非欲死，不得不死。達此理者虛而乳之，神可以不化，形可以不生。</p><p><strong>所出</strong>：《化書 · 卷一》 — https://zh.wikisource.org/wiki/化書/卷一</p></article></main></div></div>
