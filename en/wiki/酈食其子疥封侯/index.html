    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 酈食其子疥封侯</nav></header><main><article><h1>酈食其子疥封侯</h1><p>高祖念酈食其，封其子疥為高梁侯。</p><p>漢十二年，曲周侯酈商以丞相將兵擊黥布有功。高祖舉列侯功臣，思酈食其。酈食其子疥數將兵，功未當侯，上以其父故，封疥為高梁侯。後更食武遂，嗣三世。元狩元年中，武遂侯平坐詐詔衡山王取百斤金，當棄市，病死，國除。</p><p><strong>所出</strong>：《史記 · 卷097》 — https://zh.wikisource.org/wiki/史記/卷097</p></article></main></div></div>
