    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 雅潤清麗</nav></header><main><article><h1>雅潤清麗</h1><p>四言尚雅潤、五言尚清麗，詩體風格之宗尚也。</p><p>「若夫四言正體，則雅潤為本；五言流調，則清麗居宗；華實異用，惟才所安。」四言詩以雅正溫潤為本色，五言詩以清新綺麗為宗尚，然皆資乎才性，非一途可拘。又「平子得其雅，叔夜含其潤，茂先凝其清，景陽振其麗」，四家各得一體，而「兼善則子建仲宣，偏美則太沖公幹」，才性不同，風格亦異。</p><p><strong>所出</strong>：《文心雕龍 · 明詩》 — https://zh.wikisource.org/wiki/文心雕龍/明詩</p></article></main></div></div>
