    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 審能見之無疾患</nav></header><main><article><h1>審能見之無疾患</h1><p>見真則無患</p><p>「審能見之無疾患」，言人若能內視審觀，見[[宅中有真常衣丹|宅中之真]]，則形神完固，無有疾病夭傷之患也。蓋修真之要，在乎見性明心，心君泰然，百骸俱理矣。</p><p><strong>所出</strong>：《黃庭內景經 · 天中章第六》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/天中章第六</p></article></main></div></div>
