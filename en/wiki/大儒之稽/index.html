    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 大儒之稽</nav></header><main><article><h1>大儒之稽</h1><p>大儒之所以自別於俗儒者，在其言有類、行有禮、舉事無悔、持險應變曲當，而道終歸於一。</p><p>大儒之稽，見於《荀子 · 儒效篇》。其言有類，其行有禮，其舉事無悔，其持險應變曲當，與時遷徙，與世偃仰，千舉萬變，其道一也。其通也，英傑化之，嵬瑣逃之，邪說畏之，衆人媿之。通則一天下，窮則獨立貴名，天不能死，地不能埋，桀、跖之世不能汙，非大儒莫之能立，仲尼、子弓是也。</p><p><strong>所出</strong>：《荀子 · 儒效篇》 — https://zh.wikisource.org/wiki/荀子/儒效篇</p></article></main></div></div>
