    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 從之</nav></header><main><article><h1>從之</h1><p>不能自勝則從之，神無怨焉</p><p>詹子告中山公子牟曰：「重生則輕利。」「雖知之，猶不能自勝。」詹子曰：「不能自勝則從之，從之，神無怨乎！」[[知和曰常]]之義。</p><p><strong>所出</strong>：《淮南子 · 道應訓》 — https://zh.wikisource.org/wiki/淮南子/道應訓</p></article></main></div></div>
