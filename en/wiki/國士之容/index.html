    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 國士之容</nav></header><main><article><h1>國士之容</h1><p>述國士所具之德操。</p><p>士不偏不黨，柔而堅，虛而實。其狀朖然不儇，若失其一。傲小物而志屬於大，似無勇而未可恐狼，執固橫敢而不可辱害，臨患涉難而處義不越，南面稱寡而不以侈大，今日君民而欲服海外，節物甚高而細利弗賴，耳目遺俗而可與定世，富貴弗就而貧賤弗朅，德行尊理而羞用巧衛，寬裕不訾而中心甚厲，難動以物而必不妄折。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十六》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十六</p></article></main></div></div>
