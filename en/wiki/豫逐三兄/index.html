    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 豫逐三兄</nav></header><main><article><h1>豫逐三兄</h1><p>越王豫欲盡殺兄子以據其位，卒因國人之怒而被逐。</p><p>越王授有子四人。越王之弟曰豫，欲盡殺之，而為之後。惡其三人而殺之矣，國人不說，大非上。又惡其一人而欲殺之，越王未之聽。其子恐必死，因國人之欲逐豫，圍王宮。越王太息曰：「余不聽豫之言，以罹此難也。」亦不知所以亡也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷九》— https://zh.wikisource.org/wiki/呂氏春秋/卷九</p></article></main></div></div>
