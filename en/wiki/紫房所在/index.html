    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 紫房所在</nav></header><main><article><h1>紫房所在</h1><p>紫房由明堂眉間一中而入，三元合化之宮。</p><p>紫房所在，上清大洞修真之宮也。[[三元合化，是為紫房]]，紫房所在，先由[[明堂]]眉間一中，明堂之內守[[神名桃康]]。[[塞閉欲孔割破戀根]]，[[大道君]]之聖、霐之真乃可見，兆能知之，乃[[開金門]]。此[[上清大洞]]登真之階梯也。</p><p><strong>所出</strong>：《上清大洞真經 · 18章》 — https://zh.wikisource.org/wiki/上清大洞真經/18章</p></article></main></div></div>
