    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 佞臣在上必受禍殃</nav></header><main><article><h1>佞臣在上必受禍殃</h1><p>佞臣用事，必致禍亂；明主當察而去之。</p><p>《軍讖》曰：「佞臣在上，一軍皆訴；引威自與，動違於眾；無進無退，苟然取容；專任自己，舉措伐功；誹謗盛德，誣述庸庸；無善無惡，皆與己同；稽留行事，命令不通；造作苛政，變古易常；君用佞人，必受禍殃。」</p><p>又有六戒：將拒諫，則英雄散；策不從，則謀士叛；善惡同，則功臣倦；專己，則下歸咎；自伐，則下少功；信讒，則眾離心；貪財，則奸不禁；內顧，則士卒淫。</p><p><strong>所出</strong>：《三略》 — https://zh.wikisource.org/wiki/三略</p></article></main></div></div>
