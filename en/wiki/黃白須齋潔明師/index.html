    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 黃白須齋潔明師</nav></header><main><article><h1>黃白須齋潔明師</h1><p>黃白之術必待齋潔百日、口傳心授、入深山清凈之地，方可為之。</p><p>抱朴子以為，黃白術亦如合神丹，皆須齋潔百日已上，又當得閒解方書，意合者乃可為之，非濁穢之人及不聰明人希涉術數者所辨作也。</p><p>其中或有須口傳者，皆宜師授。又宜入於深山之中，清潔之地，不欲令凡俗愚人知之。</p><p>而劉向止宮中作之，使宮人供給其事，必非齋潔者，又不能斷絕人事，使不來往也，如此安可得成哉？</p><p><strong>所出</strong>：《抱朴子 · 卷16》 — https://zh.wikisource.org/wiki/抱朴子/卷16</p></article></main></div></div>
