    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 禮主其謙樂主其盈</nav></header><main><article><h1>禮主其謙樂主其盈</h1><p>禮主謙而進，樂主盈而反；禮得報則樂，樂得反則安。</p><p>樂也者，動於內者也；禮也者，動於外者也。故禮主其謙，樂主其盈。禮謙而進，以進為文；樂盈而反，以反為文。禮謙而不進，則銷；樂盈而不反，則放。故禮有報而樂有反。禮得其報則樂，樂得其反則安。禮之報，樂之反，其義一也。</p><p><strong>所出</strong>：《史記 · 卷024》 — https://zh.wikisource.org/wiki/史記/卷024</p></article></main></div></div>
