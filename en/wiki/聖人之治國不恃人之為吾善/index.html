    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 聖人之治國不恃人之為吾善</nav></header><main><article><h1>聖人之治國不恃人之為吾善</h1><p>聖人治國，不恃人自為善，而恃人不得為非。</p><p>夫聖人之治國，不恃人之為吾善也，而用其不得為非也。恃人之為吾善也，境內不什數；用人不得為非，一國可使齊。為治者用眾而舍寡，故不務德而務法。</p><p><strong>所出</strong>：《韓非子 · 顯學》 — https://zh.wikisource.org/wiki/韓非子/顯學</p></article></main></div></div>
