    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 必有以也</nav></header><main><article><h1>必有以也</h1><p>久而不救，必有其故</p><p>「必有以也」者，《詩·旄丘》二章之辭也。</p><p>《旄丘》二章：「何其處也，必有與也，何其久也，必有以也。」孔穎達疏：「言衞人何其安處不出，必有所與共為之者；何其久而不至，必有故也。」</p><p>此黎臣詰問衞臣之辭也。言汝何為安居不動，必有所黨與；何為久延不救，必有其故。婉辭以刺，深望其出兵，而言外之意則責其觀望也。</p><p>後世以「必有以」言事出有因。</p><p><strong>所出</strong>：《詩經 · 旄丘》 — https://zh.wikisource.org/wiki/詩經/旄丘</p></article></main></div></div>
