    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 三元之道</nav></header><main><article><h1>三元之道</h1><p>一炁之造化，五行八卦，河洛易數，皆渾括焉。</p><p>三元之道者，斗姆所示一炁之全體也。斗姆云：「七元九皇，皆吾先天一炁相接而生。一炁之動靜，陰陽晦朔，晝夜昏曉，皆倡率焉；一炁之造化，五行八卦，河洛易數，皆渾括焉。年月日時，天干地支，東西南北，山川海嶽，卵胎濕化，無非一炁之所在。大無不包，細無不入，信之者生，背之者死，從之者昌，違之者亡。三教大眾，均宜知此。」</p><p><strong>所出</strong>：《張三丰先生全集 · 卷7》 — https://zh.wikisource.org/wiki/張三丰先生全集/卷7</p></article></main></div></div>
