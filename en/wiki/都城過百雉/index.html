    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 都城過百雉</nav></header><main><article><h1>都城過百雉</h1><p>先王之制，大都參國之一</p><p>大叔完聚，繕甲兵，具卒乘，將襲鄭。</p><p>祭仲曰：「都城過百雉，國之害也。先王之制：大都不過參國之一，中五之一，小九之一。今京不度，非制也，君將不堪。」</p><p>公曰：「姜氏欲之，焉辟害？」</p><p>對曰：「姜氏何厭之有？！不如早為之所，無使滋蔓！蔓草猶不可除，況君之寵弟乎？！」</p><p>公曰：「多行不義，必自斃，子姑待之。」</p><p><strong>所出</strong>：《春秋左氏傳 · 隱公》 — https://zh.wikisource.org/wiki/春秋左氏傳/隱公</p></article></main></div></div>
