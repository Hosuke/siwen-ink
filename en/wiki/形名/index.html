    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 形名</nav></header><main><article><h1>形名</h1><p>形定名，名應形，二者相符而理顯</p><p>形者，應名者也。然形非正名也，名非正形也，則形之與名，居然別矣！不可相亂，亦不可相無。無名，故大道無稱；有名，故名以正形。今萬物具存，不以名正之，則亂；萬名具列，不以形應之，則乖。故形名者，不可不正也。</p><p><strong>所出</strong>：《尹文子 · 大道上》 — https://zh.wikisource.org/wiki/尹文子/大道上</p></article></main></div></div>
