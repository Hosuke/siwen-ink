    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 不以天下害其生</nav></header><main><article><h1>不以天下害其生</h1><p>天下至重，而有道者不以害其生，唯無以天下為者可以託天下。</p><p>堯以天下讓許由，許由不受。又讓於子州支父，子州之父曰：「以我為天子，猶之可也。雖然，我適有幽憂之病。方且治之，未暇治天下也。」夫天下至重也，而不以害其生，又況他物乎！唯無以天下為者，可以託天下也。</p><p><strong>所出</strong>：《莊子 · 讓王》 — https://zh.wikisource.org/wiki/莊子/讓王</p></article></main></div></div>
