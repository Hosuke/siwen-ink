    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 與民偕樂</nav></header><main><article><h1>與民偕樂</h1><p>先王與民同樂，故能享其樂</p><p>孟子引《詩》言文王建靈台、闢靈沼，民欣然趨事，不日而成。王在靈囿，麀鹿攸伏，魚鱉踊躍，民皆悅之。古之人與民偕樂，故能樂也。反之，《湯誓》時日民欲與之偕亡，雖有[[靈囿]]、台池、鳥獸，豈能獨樂哉？[[與民同樂]]者昌，與民偕亡者亡。</p><p><strong>所出</strong>：《孟子 · 梁惠王上》 — https://zh.wikisource.org/wiki/孟子/梁惠王上</p></article></main></div></div>
