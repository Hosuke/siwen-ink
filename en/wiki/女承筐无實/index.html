    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 女承筐无實，士刲羊无血，无攸利</nav></header><main><article><h1>女承筐无實，士刲羊无血，无攸利</h1><p>祭祀之時，女捧空筐，士刲羊無血，無所得利，上六之凶。</p><p>上六：「女承筐无實，士刲羊无血，无攸利。」筐所以奉祭品，羊所以供祭祀。女承筐而无實，士刲羊而无血，是祭祀不成、婚儀終闕之象也。上六无實，承虛筐也。柔乘剛，無以自助，故无所利。</p><p><strong>所出</strong>：《周易 · 歸妹》 — https://zh.wikisource.org/wiki/周易/歸妹</p></article></main></div></div>
