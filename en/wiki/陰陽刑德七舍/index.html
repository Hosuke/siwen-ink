    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 陰陽刑德七舍</nav></header><main><article><h1>陰陽刑德七舍</h1><p>刑德同居七舍，十二月德居室三十日，迭徙所居。</p><p>陰陽刑德有七舍。何謂七舍？室、堂、庭、門、巷、術、野。十二月德居室三十日，先日至十五日，後日至十五日，而徙所居各三十日。德在室則刑在野，德在堂則刑在術，德在庭則刑在巷，陰陽相德則刑德合門。八月、二月，陰陽氣均，日夜分平，故曰刑德合門。德南則生，刑南則殺，故曰二月會而萬物生，八月會而草木死。</p><p><strong>所出</strong>：《淮南子 · 天文訓》 — https://zh.wikisource.org/wiki/淮南子/天文訓</p></article></main></div></div>
