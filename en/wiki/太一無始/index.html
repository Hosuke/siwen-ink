    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 太一無始</nav></header><main><article><h1>太一無始</h1><p>太一者，未始之始；無始者，道之原也。</p><p>原夫一炁蟠集，溟溟涬涬，窅窅莫測，氤氳活動，含靈至妙，是為太乙，是為未始之始。始也，是為道也，故曰無始。</p><p>夫天地之有始也，一炁動盪，虛無開合，雌雄感召，黑白交凝，有無相射，混混沌沌，沖虛至聖，包元含靈，神明變化，恍惚立極，是為太易，是為有始之始。始也，是謂道生一也，是曰元始。</p><p>此以「無始」明道之原，以「太一」明炁之始。溟涬之中，含靈至妙，是為萬化之根。</p><p><strong>所出</strong>：《性命圭旨 · 元集》 — https://zh.wikisource.org/wiki/性命圭旨/元集</p></article></main></div></div>
