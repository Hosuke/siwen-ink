    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 義勝欲則昌</nav></header><main><article><h1>義勝欲則昌</h1><p>義勝欲則昌，敬勝怠則吉；柔而靜、恭而敬，乃道之所起。</p><p>文王寢疾，召太公問先聖之道。太公言道之止者有三：「見善而怠，時至而疑，知非而處，此三者，道之所止也。」</p><p>又言道之所起者有四：「柔而靜，恭而敬，強而弱，忍而剛，此四者，道之所起也。」</p><p>終之以要言：「故義勝欲則昌，欲勝義則亡；敬勝怠則吉，怠勝敬則滅。」</p><p>此修身治國之樞要，義與敬二者而已。</p><p><strong>所出</strong>：《六韜》 — https://zh.wikisource.org/wiki/六韜</p></article></main></div></div>
