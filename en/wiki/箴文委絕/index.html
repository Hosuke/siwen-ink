    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 箴文委絕</nav></header><main><article><h1>箴文委絕</h1><p>戰國以還，箴文湮滅不行，逮揚雄起而復振。</p><p>戰代以來，棄德務功，銘辭代興，箴文委絕。劉勰敘箴體之衰，以為周末以降，功利之說勝，而箴戒之風微。箴者，所以防患於未然，功不在當世，故世輕之。逮至揚雄稽考古法，始範《虞箴》而作二十五篇，崔胡補綴，總稱《百官》，箴文之傳，賴茲數人。</p><p><strong>所出</strong>：《文心雕龍 · 銘箴》 — https://zh.wikisource.org/wiki/文心雕龍/銘箴</p></article></main></div></div>
