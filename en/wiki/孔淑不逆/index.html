    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 孔淑不逆</nav></header><main><article><h1>孔淑不逆</h1><p>淮夷受化而歸順，不復為逆也。</p><p>[[孔淑不逆]]，第七章之句也。淑者，善也；逆者，畔也。言淮夷既服之後，行為甚善，不復為逆叛之行。美魯侯德化之遠，淮夷受其治理而不復畔也。與上文[[式固爾猶]]相承：既已屈服之，尤當固守善道，使彼永不為逆。</p><p><strong>所出</strong>：《詩經 · 泮水》 — https://zh.wikisource.org/wiki/詩經/泮水</p></article></main></div></div>
