    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 三界</nav></header><main><article><h1>三界</h1><p>欲界、色界、無色界，持誦此經可遊行三界，昇入金門</p><p>[[天人傳授|下士得之，在世長年，遊行三界，昇入金門]]。</p><p>三界者，欲界、色界、無色界也。凡人沉淪於三界之中，輪轉生死。[[持誦此經|持誦此經]]，漸入[[真靜應物|真道]]，則不但出離三界，且能遊行其間，終昇金門，超凡入聖。</p><p><strong>所出</strong>：《太上老君說常清靜經》 — https://zh.wikisource.org/wiki/太上老君說常清靜經</p></article></main></div></div>
