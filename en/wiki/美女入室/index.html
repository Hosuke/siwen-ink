    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 美女入室</nav></header><main><article><h1>美女入室</h1><p>女無美惡，入室見妒；士無賢不肖，入朝見嫉。</p><p>傳曰：「女無美惡，入室見妒；士無賢不肖，入朝見嫉。」美女者，惡女之仇。</p><p>褚先生申之曰：浴不必江海，要之去垢；馬不必騏驥，要之善走；士不必賢世，要之知道；女不必貴種，要之貞好。豈不然哉！</p><p><strong>所出</strong>：《史記 · 卷049》 — https://zh.wikisource.org/wiki/史記/卷049</p></article></main></div></div>
