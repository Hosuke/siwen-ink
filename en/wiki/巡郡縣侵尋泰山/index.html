    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 巡郡縣侵尋泰山</nav></header><main><article><h1>巡郡縣侵尋泰山</h1><p>天子始巡郡縣，封禪之議起於郡縣之巡。</p><p>上親望拜后土，禮畢，天子遂至滎陽而還。過雒陽，下詔封周後為周子南君。是歲，天子始巡郡縣，侵尋於泰山矣。及后[[封禪]]，令諸侯各治邸泰山下。</p><p><strong>所出</strong>：《史記 · 卷012》 — https://zh.wikisource.org/wiki/史記/卷012</p></article></main></div></div>
