    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 城中城</nav></header><main><article><h1>城中城</h1><p>鄭人圍許而城中城，修內以備外患。</p><p>成公九年，楚人入鄆。傳又書「城中城」，曰：「城中城者，非外民也。」蓋城中城，乃內城之建，非以居民於外也。城中之城，所以別於外郭，謹守禦之義明矣。</p><p>  楚既入鄆，而魯城中城，是自守之急，非居民之舉也。穀梁子特言「非外民」，以別於驅民實城之失禮耳。</p><p>  <strong>所出</strong>：《春秋穀梁傳 · 成公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/成公</p></article></main></div></div>
