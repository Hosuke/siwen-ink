    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 毀方而瓦合</nav></header><main><article><h1>毀方而瓦合</h1><p>儒者磨去己方之棱角，以與眾合，然内懷方正之心不改。</p><p>儒有慕賢而容衆，毀方而瓦合。</p><p>「毀方」者，磨去己之棱角也；「瓦合」者，與眾如瓦之相合也。儒者心存方正，然於待人接物之際，不以己度人，不峭厲以加人。慕賢而容眾，既能敬慕賢者，又能容納众人，此非鄉愿，乃知和而和者也。毀方非失方，乃以方濟方，以義合義，善莫大焉。</p><p><strong>所出</strong>：《禮記 · 儒行》 — https://zh.wikisource.org/wiki/禮記/儒行</p></article></main></div></div>
