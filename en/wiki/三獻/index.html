    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 三獻</nav></header><main><article><h1>三獻</h1><p>主人、主婦、賓長依次酌酒獻尸之禮，達敬於死者也。</p><p>三獻者，主人、主婦、賓長三人各以酒獻尸，迭伸其敬者也。士虞禮云：「主人洗廢爵，酌酒酳尸。」尸拜受，主人北面答拜。尸祭酒嘗之，賓長以肝從，實於俎。尸右取肝，擩鹽，振祭嚌之，加於俎。此主人之獻也。主婦「洗足爵於房中，酌，亞獻尸，如主人儀」。又有「賓長洗繶爵，三獻」。三獻之禮，主客迭進，以盡事死之道。</p><p><strong>所出</strong>：《儀禮 · 士虞禮》 — https://zh.wikisource.org/wiki/儀禮/士虞禮</p></article></main></div></div>
