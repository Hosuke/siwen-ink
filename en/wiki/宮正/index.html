    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 宮正</nav></header><main><article><h1>宮正</h1><p>上士二人，掌王宮戒令糾禁，比宮中官府次舍</p><p>宮正，上士二人，中士四人，下士八人；府二人，史四人，胥四人，徒四十人。</p><p>掌王宮之戒令、糾禁。以時比宮中之官府、次舍之眾寡，為之版以待。夕擊柝而比之。</p><p>辨外內而時禁，稽其功緒，糾其德行，幾其出入，均其稍食。會其什伍而教之道藝。月終會其稍食，歲終會其行事。</p><p>春秋以木鐸修火禁。凡邦之事，蹕，宮中廟中則執燭。</p><p><strong>所出</strong>：《周禮 · 天官冢宰》 — https://zh.wikisource.org/wiki/周禮/天官冢宰</p></article></main></div></div>
