    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 仁暴皆亡國</nav></header><main><article><h1>仁暴皆亡國</h1><p>仁者慈惠而輕財，暴者心毅而易誅，二者皆足以亡國。</p><p>故存國者，非仁義也。仁者，慈惠而輕財者也；暴者，心毅而易誅者也。慈惠則不忍，輕財則好與；心毅則憎心見於下，易誅則妄殺加於人。不忍則罰多宥赦，好與則賞多無功。憎心見則下怨其上，妄誅則民將背叛。故仁人在位，下肆而輕犯禁法；暴人在位，則法令妄而臣主乖。民怨而亂心生，故曰：仁暴者，皆亡國者也。</p><p><strong>所出</strong>：《韓非子 · 八說》 — https://zh.wikisource.org/wiki/韓非子/八說</p></article></main></div></div>
