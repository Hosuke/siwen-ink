    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 吳滅徐</nav></header><main><article><h1>吳滅徐</h1><p>吳滅徐，徐子章禹奔楚，吳楚東爭。</p><p>昭公三十年，冬十月，吳滅徐。徐子章羽奔楚。</p><p>  吳入楚之師，取道淮泗，先滅徐以為勢。《春秋》書滅以著吳之強暴，徐子奔楚以存宗祀也。</p><p>  <strong>所出</strong>：《春秋穀梁傳 · 昭公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/昭公</p></article></main></div></div>
