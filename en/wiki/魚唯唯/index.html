    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 魚唯唯</nav></header><main><article><h1>魚唯唯</h1><p>魚之出入自如，以喻威禁不行</p><p>「唯唯」者，魚相隨而入、出、隨、逐之貌。笱以制魚，既敝則魚無所畏，往來出入如入無人之境。</p><p>詩人以此喻人君失政，禁令不行於下；姦宄之徒得以肆志，如魚之出入敝笱然。威禁既弛，姦邪自恣，其患非區區一魚之得失可比也。</p><p><strong>所出</strong>：《詩經 · 敝笱》 — https://zh.wikisource.org/wiki/詩經/敝笱</p></article></main></div></div>
