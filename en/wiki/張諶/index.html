    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 張諶</nav></header><main><article><h1>張諶</h1><p></p><p>真人張諶字子堅，[[張修]]之長子。博學，為當時通儒，攻草隸。晚年好道，能闢穀。一-{云}-唐文宗召見，賜官不受而歸。懿宗鹹通中，降金建醮。一日三飲，大醉而化，年一百餘歲。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 19》 — https://zh.wikisource/wiki/歷世真仙體道通鑑/19</p></article></main></div></div>
