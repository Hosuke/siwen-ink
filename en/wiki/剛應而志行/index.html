    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 剛應而志行</nav></header><main><article><h1>剛應而志行</h1><p>九四陽剛，上應下行，豫之所以成也。</p><p>《彖》曰「豫，剛應而志行」。九四一陽，獨應上下五陰之求，故剛得應而志得行。豫之成也，以陽剛居大臣之位，得上之信、下之附，其志大行而無疑阻，此豫之根本也。</p><p><strong>所出</strong>：《周易 · 豫》 — https://zh.wikisource.org/wiki/周易/豫</p></article></main></div></div>
