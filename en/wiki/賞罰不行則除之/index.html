    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 賞罰不行則除之</nav></header><main><article><h1>賞罰不行則除之</h1><p>賞譽不足以勸，罰毀不足以畏，則當屏退之。</p><p>人臣之於君，賞罰而已矣。若夫四者加焉而不變，則其人不足用也。明主任法而不任情，誅賞一斷於律。故曰：「賞之譽之不勸，罰之毁之不畏，四者加焉不變，則其除之。」夫進賢退不肖，此治國之要務也。</p><p><strong>所出</strong>：《韓非子 · 外儲說右上》 — https://zh.wikisource.org/wiki/韓非子/外儲說右上</p></article></main></div></div>
