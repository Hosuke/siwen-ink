    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 陰德</nav></header><main><article><h1>陰德</h1><p>紫微宮內二星，主施德惠，不明宜暗，明則新君踐極。</p><p>前列直斗口三星，隨北端兌，若見若不，曰陰德。星經云：「陰德二星在紫微宮內，尚書西，主施德惠者，故贊陰德遺惠，周急賑撫。占以不明為宜；明，新君踐極也。」</p><p>又云：「陰德星，中宮女主之象。星動搖，衅起宮掖，貴嬪內妾惡之。」</p><p><strong>所出</strong>：《史記 · 卷027》 — https://zh.wikisource.org/wiki/史記/卷027</p></article></main></div></div>
