    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 卜之龜兆</nav></header><main><article><h1>卜之龜兆</h1><p>代王卜龜，得大橫之兆，占曰「余為天王」，遂知天命有歸。</p><p>代王猶豫未定，卜之龜，卦兆得大橫。占曰：「大橫庚庚，余為天王，夏啟以光。」代王曰：「寡人固已為王矣，又何王？」卜人曰：「所謂天王者乃天子。」於是遣太后弟薄昭往見絳侯，確知迎立之意，遂即天子位。</p><p><strong>所出</strong>：《史記 · 卷010》 — https://zh.wikisource.org/wiki/史記/卷010</p></article></main></div></div>
