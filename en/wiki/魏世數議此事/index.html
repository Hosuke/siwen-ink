    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 魏世數議此事，咸謂宜復肉刑</nav></header><main><article><h1>魏世數議此事，咸謂宜復肉刑</h1><p>記魏世議復肉刑之事</p><p>昔魏世數議此事，諸碩儒達學，洽通殷理者，咸謂宜復肉刑，而意異者駁之，皆不合也。魏武帝亦以為然。直以二陲未賓，遠人不能統至理者，卒聞中國刖人肢體，割人耳鼻，便當望風謂為酷虐，故且權停，以須四方之並耳。通人揚子雲亦以為肉刑宜復也。但廢之來久矣，坐而論道者，未以為急耳。</p><p><strong>所出</strong>：《抱朴子 · 卷14》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷14</p></article></main></div></div>
