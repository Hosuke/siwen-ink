    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 維桑與梓，必恭敬止</nav></header><main><article><h1>維桑與梓，必恭敬止</h1><p>人見父母所植之桑梓，必加恭敬；以喻人子事父母當敬也。</p><p>《小弁》三章云：「維桑與梓，必恭敬止。」桑與梓，木之美者，昔人家必種之於庭前者也，以是父母之所植，故人見之而敬意自生。</p><p>[[心之憂矣]]一篇，言孝子被放，情事不同，而此句言桑梓之義則一也。</p><p><strong>所出</strong>：《詩經 · 小弁》 — https://zh.wikisource.org/wiki/詩經/小弁</p></article></main></div></div>
