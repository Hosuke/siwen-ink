    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 執法刺譏</nav></header><main><article><h1>執法刺譏</h1><p>執法之人刺舉過失，譏刺時政，乃天象乖變所致之咎。</p><p>弦望盈縮，乖變凶咎。執法刺譏，詰過貽主。</p><p>[[弦望盈縮]]乖其度，則[[四七乖戾]]，刑罰失中。執法者刺舉譏彈，詰責過失，上以詰過貽譴於人主。[[五緯錯順]]則[[明堂布政]]得其宜，執法刺譏之弊無由而生。</p><p><strong>所出</strong>：《周易參同契 · 05章》 — https://zh.wikisource.org/wiki/周易參同契/05章</p></article></main></div></div>
