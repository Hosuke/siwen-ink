    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 勿用有攸往</nav></header><main><article><h1>勿用有攸往</h1><p>時未可動，不宜輕往。</p><p>屯之卦辭曰：「元亨，利貞。勿用有攸往，利建侯。」言屯難之世，大通而利於守正，然不可輕有作為以自試也。時方艱屯，冒進則凶，唯宜安止待時，廣建諸侯以輔助王室，乃得屯道之正。</p><p><strong>所出</strong>：《周易 · 屯》 — https://zh.wikisource.org/wiki/周易/屯</p></article></main></div></div>
