    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 撮壤不能填決河</nav></header><main><article><h1>撮壤不能填決河</h1><p>一撮之土不能填決堤之河，以喻小人之力不足以救世之大弊。</p><p>抱朴子悲時世之弊曰：「亦猶撮壤不能填決河，升水不能殄原火。於是鼖鼓戢雷霆之音，鞉鞞恣喋鼛之響。芳蕙芟夷，臭鮑佩禦。玄鬯傾棄而不羞，醨酪專灌於圓丘。汗血驅放而垂耳，跛蹇馳騁於鑾軒。」</p><p><strong>所出</strong>：《抱朴子 · 卷20》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷20</p></article></main></div></div>
