    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 吉事上左喪事上右</nav></header><main><article><h1>吉事上左喪事上右</h1><p>吉尚左，凶尚右，尊卑左右，各以其禮。</p><p>吉事尚左，喪事尚右。左者陽也、生也、喜也；右者陰也、殺也、哀也。君子居，則[[居則貴左|貴左]]；用兵，則[[偏將軍居左上將軍居右|貴右]]。[[吉事尚左]]與此同一義旨。所以然者，居常以左為尊，動眾以右為重。兵凶器也，[[兵者不祥之器]]，以右居之者，明其凶也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第七十五章 貴左》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
