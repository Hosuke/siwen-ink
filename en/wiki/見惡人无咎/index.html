    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 見惡人无咎</nav></header><main><article><h1>見惡人无咎</h1><p>當睽之時，見惡人亦可无咎，以避害為先。</p><p>「見惡人无咎」者，睽卦初九之辭也。初九以陽處下，在睽之初，悔亡而馬失，勿逐而自復；然於此時而有惡人來見，見之无咎。蓋睽之世，人心乖異，苟遇不善之人，當避遠之可也；若正之太甚，反以取怨。見之无咎，乃所以辟咎也。《象》曰「見惡人以辟咎」，明其義在避害，非與惡人為徒也。</p><p><strong>所出</strong>：《周易 · 睽》 — https://zh.wikisource.org/wiki/周易/睽</p></article></main></div></div>
