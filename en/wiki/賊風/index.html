    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 賊風</nav></header><main><article><h1>賊風</h1><p>濕氣惡血藏於體內，復加喜怒不節、寒溫不時，與風寒相襲，猝然而病。</p><p>此皆嘗有所傷於濕氣，藏於血脈之中，分肉之間，久留而不去，若有所墮墜，惡血在內而不去。卒然喜怒不節，飲食不適，寒溫不時，腠理閉而不通，其開而遇風寒，則血氣凝結，與故邪相襲，則為寒痹。其有熱則汗出，汗出則受風，雖不遇賊風邪氣，必有因加而發焉。</p><p><strong>所出</strong>：《黃帝內經 · 靈樞第九卷》 — https://zh.wikisource.org/wiki/黃帝內經/靈樞第九卷</p></article></main></div></div>
