    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 不可得而親</nav></header><main><article><h1>不可得而親</h1><p>玄同之人，無間親疏，無有利害，無有貴賤。</p><p>玄同之至，則無復親疏之分、利害之殊、貴賤之辨。世人溺於愛惡，故有親疏；蔽於利害，故有取舍；眩於榮辱，故有貴賤。聖人 [[塞兌閉門]]，心無所著，渾然與道為一，故不可以此區分之也。[[和光同塵]] 之效，於是為天下貴。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第十九章 玄同》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
