    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 雍齒叛</nav></header><main><article><h1>雍齒叛</h1><p>雍齒本為沛公守豐，既而降魏，沛公攻之不能取。</p><p>雍齒守豐。陳王使魏人周市略地，周市使人謂雍齒曰：「豐，故梁徙也。今魏地已定者數十城。齒今下魏，魏以齒為侯守豐。不下，且屠豐。」雍齒雅不欲屬沛公，及魏招之，即反為魏守豐。沛公引兵攻豐，不能取。</p><p>沛公怨雍齒與豐子弟叛之。</p><p><strong>所出</strong>：《史記 · 卷008》 — https://zh.wikisource.org/wiki/史記/卷008</p></article></main></div></div>
