    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 斤斤其明</nav></header><main><article><h1>斤斤其明</h1><p>明察秋毫，審於分辨</p><p>斤斤，明察之貌。言成王、康王明審而辨察，其德精明，照臨下土。《說文》：「斤，斫木也。」引申為明察。斤斤者，戒慎精審之意。學者引之以言聖王之明德，觀微察著，無所遺漏也。</p><p><strong>所出</strong>：《詩經 · 執競》 — https://zh.wikisource.org/wiki/詩經/執競</p></article></main></div></div>
