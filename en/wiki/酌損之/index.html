    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 酌損之</nav></header><main><article><h1>酌損之</h1><p>損之在下者，宜斟酌以損，不可過也。</p><p>初九曰：「已事遄往，无咎，酌損之。」《象》曰：「已事遄往，尚合志也。」夫初九以陽居下，有志於上，故既成己事，即速往助之。速往者，急公之義也；酌損者，斟酌其損之多寡，不可過分之義也。《易》之丁寧於此，欲人損己以益上之時，知所節制而不失其正。</p><p><strong>所出</strong>：《周易 · 損》 — https://zh.wikisource.org/wiki/周易/損</p></article></main></div></div>
