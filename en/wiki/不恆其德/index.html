    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 不恆其德</nav></header><main><article><h1>不恆其德</h1><p>德無恆守，必蒙羞恥。</p><p>九三：「不恆其德，或承之羞，貞吝。」</p><p>九三陽居陽位而不中，過剛不中，德行無恆。或承之羞者，言羞辱或隨之而至也。貞吝，雖守正亦難免吝也。《象》曰：「不恆其德，無所容也。」德之不恆，人無所容其身矣。蓋操守貴乎恆久，朝三暮四，鮮克有終，羞辱自茲而來。</p><p><strong>所出</strong>：《周易 · 恒》 — https://zh.wikisource.org/wiki/周易/恒</p></article></main></div></div>
