    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 比類雖繁以切至為貴</nav></header><main><article><h1>比類雖繁以切至為貴</h1><p>比之工拙，在切當而至，不在馳騖浮華也。</p><p>比類雖繁，以切至為貴。麻衣如雪，兩驂如舞，蜩螗號呼，澣衣心憂，凡斯切象，皆比義也。若刻鵠類鶩，則無所取焉。</p><p>蓋比之要，在於切類指事。苟於事不切，雖詞采繁縟，終歸虛妄。善為比者，必深觀物理，慎取符驗，使讀者一覽而喻，不失其倫也。</p><p><strong>所出</strong>：《文心雕龍 · 比興》 — https://zh.wikisource.org/wiki/文心雕龍/比興</p></article></main></div></div>
