    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 老且惡</nav></header><main><article><h1>老且惡</h1><p>晏子以糟糠之義辭景公以愛女易妻之請。</p><p>景公有愛女，請嫁于晏子。公往燕晏子之家，見其妻，曰：「此子之內子邪？亦老且惡矣。寡人有女，少且姣，請以滿夫子之宮。」晏子違席而對曰：「乃此則老且惡，嬰與之居故矣，故及其少而姣也。且人固以壯托乎老，姣托乎惡，彼嘗托而嬰受之矣。君雖有賜，可以使嬰倍其托乎？」再拜而辭。</p><p>糟糠之妻不下堂，貧賤之交不可忘。晏子之辭，其義正矣。</p><p><strong>所出</strong>：《晏子春秋 · 卷六》 — https://zh.wikisource.org/wiki/晏子春秋/卷六</p></article></main></div></div>
