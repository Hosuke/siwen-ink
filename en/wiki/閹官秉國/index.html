    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 閹官秉國</nav></header><main><article><h1>閹官秉國</h1><p>斥閹宦竊權，秉持國政，廢興由己，禍及天下。</p><p>抱朴子言當塗端右閹官之徒，操弄神器，秉國之鈞，廢正興邪，殘仁害義。同惡成群，汲引姦黨。宦者奪人主之威，三九死庸豎之手。終至凌上替下，盜賊多有，忠賢望士被指為黨人，天下嗟嗷。</p><p><strong>所出</strong>：《抱朴子 · 卷33》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷33</p></article></main></div></div>
