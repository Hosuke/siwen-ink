    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 專氣致柔</nav></header><main><article><h1>專氣致柔</h1><p>專精其氣，致柔守和，可返於嬰兒之純。</p><p>專氣致柔者，言人能專一精神，專氣致柔，無有縱橫之氣，可以漸入嬰兒之純。嬰兒者，純和之至也。河上公以為，專守精氣，使不散馳，則形體柔弱而近乎道。致柔者，非懦弱也，乃以柔克剛、以弱勝強之意。復歸嬰兒者，返其天真是也。</p><p><strong>所出</strong>：《老子河上公章句 · 能為》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
