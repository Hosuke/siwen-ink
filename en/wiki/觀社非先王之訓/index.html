    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 觀社非先王之訓</nav></header><main><article><h1>觀社非先王之訓</h1><p>齊觀社非先王之業，諸侯相會祀亦不法，君子當書以垂戒。</p><p>莊公如齊觀社。曹劌諫曰：「不可。夫禮，所以正民也。先王制諸侯，使五年四王、一相朝，終則講於會，以正班爵之義，帥長幼之序。天子祀上帝，諸侯會之受命焉；諸侯祀先王、先公，卿大夫佐之受事焉。臣不聞諸侯相會祀也，祀又不法。君舉必書，書而不法，後嗣何觀？」公不聽，遂如齊。</p><p><strong>所出</strong>：《國語 · 卷04》 — https://zh.wikisource.org/wiki/國語/卷04</p></article></main></div></div>
