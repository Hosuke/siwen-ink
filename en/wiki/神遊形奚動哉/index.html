    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 神遊形奚動哉</nav></header><main><article><h1>神遊形奚動哉</h1><p>精神可遊於異境，形骸不隨之而往。夢中為君，覺亦夢也。</p><p>化人謁穆王同遊，穆王執其袪而升，中天乃止。既歸，所坐猶嚮，侍御如故，王默存而已。化人曰：「吾與王神遊也，形奚動哉？」</p><p>蓋精神脫乎形骸，則宇宙之大、天地之遠，可頃刻遍歷。及其還也，形坐故處，了無異焉。是知夢中之榮悴，覺後之得失，其為虛幻，一也。</p><p><strong>所出</strong>：《列子 · 周穆王篇》 — https://zh.wikisource.org/wiki/列子/周穆王篇</p></article></main></div></div>
