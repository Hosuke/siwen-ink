    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 文公遽見豎頭須</nav></header><main><article><h1>文公遽見豎頭須</h1><p>頭須自陳留守之功，文公悟而接之。</p><p>文公出也，豎頭須守藏，不從。公入，乃求見，公辭焉以沐。頭須謂謁者曰：「沐則心覆，心覆則圖反，宜吾不得見也。從者為羈紲之僕，居者為社稷之守，何必罪居者！國君而讎匹夫，懼者從矣。」謁者以告，公遽見之。</p><p><strong>所出</strong>：《國語 · 卷10》 — https://zh.wikisource.org/wiki/國語/卷10</p></article></main></div></div>
