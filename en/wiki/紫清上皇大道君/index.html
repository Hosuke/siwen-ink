    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 紫清上皇大道君</nav></header><main><article><h1>紫清上皇大道君</h1><p>道之宗極，化生萬物，俠侍端嚴。</p><p>紫清上皇大道君者，道之宗極、神之至尊也。《黃庭經》序此君，以明大道之在己身。</p><p>原其義：太上大道君居紫清之上，宰御萬化，主宰陰陽，使物各遂其生。俠侍端嚴者，謂太玄太和之氣，拱侍於側，不敢少懈。此君非外求也，修煉者反觀內照，神氣凝結，即是此君之全体大用。</p><p><strong>所出</strong>：《黃庭內景經 · 紫清章第二十九》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/紫清章第二十九</p></article></main></div></div>
