    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 聖人初作樂以歸神杜淫</nav></header><main><article><h1>聖人初作樂以歸神杜淫</h1><p>樂之始用，在乎歸心神、止淫佚。</p><p>聖人初作樂也，以歸神杜淫，反其天心；至其衰也，流而不反，淫而好色，不顧正法，流及後世，至於亡國。</p><p><strong>所出</strong>：《文子 · 卷十二》 — https://zh.wikisource.org/wiki/文子/卷十二</p></article></main></div></div>
