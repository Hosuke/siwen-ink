    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 跅弛</nav></header><main><article><h1>跅弛</h1><p>景帝弛田租之半，又弛馬舂之禁，務在舒民。</p><p>元年四月乙卯，赦天下。乙巳，賜民爵一級。五月，除田半租。</p><p>後二年，令徒隸衣七緵布。止馬舂。為歲不登，禁天下食不造歲。</p><p><strong>所出</strong>：《史記 · 卷011》 — https://zh.wikisource.org/wiki/史記/卷011</p></article></main></div></div>
