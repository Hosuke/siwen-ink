    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 先迷失道，後順得常</nav></header><main><article><h1>先迷失道，後順得常</h1><p>君子先行則迷，後順則得常道。</p><p>坤辭曰：「君子有攸往，先迷後得主。」</p><p>彖辭申之曰：「君子攸行，先迷失道，後順得常。」</p><p>言坤道陰柔，君子從之，率先而行則迷，失其道也；隨陽之後，柔順而行，則得常道。此教人以柔順自處，不為天下先也。</p><p><strong>所出</strong>：《周易 · 坤》 — https://zh.wikisource.org/wiki/周易/坤</p></article></main></div></div>
