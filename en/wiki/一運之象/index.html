    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 一運之象</nav></header><main><article><h1>一運之象</h1><p>天地升降皆一運，火升水降，木金升降之介</p><p>一運之象，周乎太空，自中而升為天，自中而降為地。無有升而不降，無有降而不升。升者為火，降者為水。欲升而不能升者為木，欲降而不能降者為金。</p><p>[[一運之象]] 一氣之運，周行太空，自中而昇則為天，自中而降則為地。升者必降，降者必昇，循環不息。火性炎上故升，水性潤下故降。木有生長之性而欲升，勢未足以達；金有肅殺之性而欲降，質未足以沉。故木金者，水火升降之介也。</p><p><strong>所出</strong>：《關尹子 · 2》 — https://zh.wikisource.org/wiki/關尹子/2</p></article></main></div></div>
