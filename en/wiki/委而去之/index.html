    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 委而去之</nav></header><main><article><h1>委而去之</h1><p>民心既失，雖有地利不足守也。</p><p>城非不高也，池非不深也，兵革非不堅利也，米粟非不多也，委而去之，是地利不如人和也。</p><p>孟子言：守國之備，城池也，兵甲也，粟米也。然民心既背，則百姓相率而逃，雖有是備，誰與守之？故曰：有恃敵之資，無致死之心，如是則器械徒設，而喪亡隨之。是故善守者，必得民心以為之城，而不以城為民之心也。</p><p><strong>所出</strong>：《孟子 · 公孫丑下》 — https://zh.wikisource.org/wiki/孟子/公孫丑下</p></article></main></div></div>
