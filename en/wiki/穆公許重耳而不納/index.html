    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 穆公許重耳而不納</nav></header><main><article><h1>穆公許重耳而不納</h1><p>穆公知重耳之仁而不納，留惠公以為質</p><p>公孫枝以為納公子重耳為是，穆公曰：「昔吾之不納公子重耳而納晉君，是吾不置德而置服也。然公子重耳實不肯，吾又奚言哉？殺其內主，背其外賂，彼塞我施，若無天乎？若有天，吾必勝之。」遂歸惠公而質子圉。</p><p><strong>所出</strong>：《國語 · 卷09》 — https://zh.wikisource.org/wiki/國語/卷09</p></article></main></div></div>
