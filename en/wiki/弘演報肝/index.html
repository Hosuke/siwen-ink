    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 弘演報肝</nav></header><main><article><h1>弘演報肝</h1><p>弘演剖腹以納懿公之肝，殺身以殉，卒存衛國之祀。</p><p>衛懿公有臣曰弘演。翟人攻衛，殺懿公，盡食其肉，獨捨其肝。弘演至，報使於肝畢，呼天而啼，盡哀而止，曰：「臣請為襮。」因自殺，先出其腹實，內懿公之肝。</p><p>桓公聞之曰：「衛之亡也，以為無道也。今有臣若此，不可不存。」於是復立衛於楚丘。弘演可謂忠矣，殺身出生以徇其君。非徒徇其君也，又令衛之宗廟復立，祭祀不絕，可謂有功矣。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十一》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十一</p></article></main></div></div>
