    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 正家天下定</nav></header><main><article><h1>正家天下定</h1><p>一家之正，天下治焉。</p><p>正家而天下定，[[周易 · 家人]]彖傳之言也。</p><p>言「父父、子子、兄兄、弟弟、夫夫、婦婦，而家道正」。一家之中，尊卑、長幼、夫婦，各盡其分，不相乖亂，家道正矣。夫人道莫先於正家，家正則人道立；人道立，則天下之治有本矣。是故自古聖王，未有不先正己之家庭，而能正天下者也。</p><p>推而言之，治國如治家，其理一也。故《大學》言：「欲治其國者，先齊其家。」正家天下定之義，萬世治道之宗也。</p><p><strong>所出</strong>：《周易 · 家人》 — https://zh.wikisource.org/wiki/周易/家人</p></article></main></div></div>
