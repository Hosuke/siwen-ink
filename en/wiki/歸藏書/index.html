    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 歸藏書</nav></header><main><article><h1>歸藏書</h1><p>黃帝所名之制易之書。</p><p>黃帝定百物之名，作八卦之說，謂之八索，一號帝鴻氏，一號歸藏氏，乃名所制曰《歸藏書》，此《易》之始也。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 1》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/1</p></article></main></div></div>
