    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 水德之始</nav></header><main><article><h1>水德之始</h1><p>秦始皇以秦代周德，定水德之制，色尚黑，數以六為紀。</p><p>始皇帝推終始五德之傳，以為周得火德，秦代周德，從所不勝。方今水德之始，改年始，朝賀皆自十月朔。衣服旄旌節旗皆上黑。數以六為紀，符、法冠皆六寸，而輿六尺，六尺為步，乘六馬。更名河曰德水，以為水德之始。剛毅戾深，事皆決於法，刻削毋仁恩和義，然後合五德之數。於是急法，久者不赦。</p><p><strong>所出</strong>：《史記 · 卷006》 — https://zh.wikisource.org/wiki/史記/卷006</p></article></main></div></div>
