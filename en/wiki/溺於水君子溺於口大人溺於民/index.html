    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 溺於水君子溺於口大人溺於民</nav></header><main><article><h1>溺於水君子溺於口大人溺於民</h1><p></p><p>《禮記·緇衣》載孔子之言，以溺水為喻，闡三等之危：「小人溺於水，君子溺於口，大人溺於民，皆在其所褻也。」</p><p>夫水，近人而溺人，德易狎而難親，易以溺人：此小人之危機也。口費而煩，易出難悔，易以溺人：此君子之危機也。民閉於人而有鄙心，可敬不可慢，易以溺人：此大人之危機也。</p><p>蓋世人各有其所忽、所易、所褻者。小人忽於水，不知其危；君子忽於言，不知其失；大人忽於民，不知其墜。是以聖人戒之曰：「故君子不可以不慎也。」</p><p>此三溺之說，見於《大甲》《兌命》《尹誥》之引，皆所以垂誡後世，示人當戒慎其所易忽者焉。</p></article></main></div></div>
