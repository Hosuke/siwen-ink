    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 小醜備物終必亡</nav></header><main><article><h1>小醜備物終必亡</h1><p>庸人享有過盛之物，終必取敗</p><p>密康公從恭王遊涇上，有三女奔之。其母戒之曰：「必致之王。夫獸三為羣，人三為衆，女三為粲。王田不取羣，公行下衆，王御不參一族。夫粲，美之物也。衆以美物歸女，而何德以堪之？王猶不堪，況爾小醜乎？小醜備物，終必亡。」康公不獻，恭王遂滅密。言庸常之人而享非分之奉，必以無德致敗也。</p><p><strong>所出</strong>：《國語 · 卷01》 — https://zh.wikisource.org/wiki/國語/卷01</p></article></main></div></div>
