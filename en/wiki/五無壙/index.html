    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 五無壙</nav></header><main><article><h1>五無壙</h1><p>將者當敬謀、敬事、敬吏、敬眾、敬敵，無有懈壙。</p><p>孫卿子云：「敬謀無壙，敬事無壙，敬吏無壙，敬眾無壙，敬敵無壙。」夫是之謂五無壙。謹行六術、五權、三至，而處之以恭敬無壙，夫是之謂天下之將，通於神明矣。</p><p><strong>所出</strong>：《荀子 · 議兵篇》 — https://zh.wikisource.org/wiki/荀子/議兵篇</p></article></main></div></div>
