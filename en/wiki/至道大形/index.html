    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 至道大形</nav></header><main><article><h1>至道大形</h1><p>隆禮至法，國有常治</p><p>至道大形：隆禮至法則國有常，尚賢使能則民知方，纂論公察則民不疑，賞克罰偷則民不怠，兼聽齊明則天下歸之；然後明分職，序事業，材技官能，莫不治理，則公道達而私門塞矣，公義明而私事息矣：如是，則德厚者進而佞說者止，貪利者退而廉節者起。故天子不視而見，不聽而聰，不慮而知，不動而功，塊然獨坐而天下從之如一體，如四胑之從心：夫是之謂大形。</p><p><strong>所出</strong>：《荀子 · 君道篇》 — https://zh.wikisource.org/wiki/荀子/君道篇</p></article></main></div></div>
