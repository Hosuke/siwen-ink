    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 可以而不可使</nav></header><main><article><h1>可以而不可使</h1><p>人有為善之能，未必有為善之志，故可以而不可使。</p><p>小人可以為君子而不肯為君子，君子可以為小人而不肯為小人。小人、君子者，未嘗不可以相為也，然而不相為者，可以而不可使也。故[[塗之人可以為禹]]則然，[[塗之人能為禹則未必然]]也。[[能不能之與可不可]]，其不同遠矣。[[為學]]之要在於使知者必行，非徒有知而已。</p><p><strong>所出</strong>：《荀子 · 性惡篇》 — https://zh.wikisource.org/wiki/荀子/性惡篇</p></article></main></div></div>
