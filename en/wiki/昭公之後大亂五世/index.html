    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 昭公之後大亂五世</nav></header><main><article><h1>昭公之後大亂五世</h1><p>魯昭公之後，五世動亂，詩人借此刺時。</p><p>毛詩序所言「昭公之後，大亂五世」，指魯昭公後，魯國政權迭有動亂。</p><p>昭公薨於乾侯，其後魯國相繼有哀公、悼公、元公、昭公之衰世，五世之亂，持續數十年。此詩以「昭公之後」起序，蓋詩人傷時之亂，征役不息，孝道不行，因以刺上也。</p><p><strong>所出</strong>：《詩經 · 鴇羽》 — https://zh.wikisource.org/wiki/詩經/鴇羽</p></article></main></div></div>
