    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 夫國亦有狗</nav></header><main><article><h1>夫國亦有狗</h1><p>喻姦臣猛狗，扼抑賢士；近習社鼠，間蔽人主</p><p>宋人酤酒，因狗猛而不售。韓非因設喻曰：夫國亦有狗。</p><p>有道之士懷其術而欲以明萬乘之主，大臣為猛狗迎而齕之，此人主之所以蔽脅，而有道之士所以不用也。故[[不殺其狗則酒酸]]之寓，實治國之大戒也。</p><p>又言社鼠之患：人君左右，出則為勢重而收利於民，入則比周而蔽惡於君。内間主之情以告外，吏不誅則亂法，誅之則君不安——此皆[[任譽姦之鼠]]之類也。</p><p><strong>所出</strong>：《韓非子 · 外儲說右上》 — https://zh.wikisource.org/wiki/韓非子/外儲說右上</p></article></main></div></div>
