    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 丁淑英</nav></header><main><article><h1>丁淑英</h1><p>有救窮陰德，度人急難，上感皇人，授道要，為朱陵嬪，數遊三清。</p><p>丁淑英者，不知何許人也。有救窮之陰德，度趙阜之急難，上感皇人，授其道要，今為朱陵嬪，數遊三清，司命亦令聽政也。</p><p><strong>所出</strong>：《墉城集仙錄 · 卷07》 — https://zh.wikisource.org/wiki/墉城集仙錄/卷07</p></article></main></div></div>
