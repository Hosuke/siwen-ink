    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 師次</nav></header><main><article><h1>師次</h1><p>師行一宿爲舍，再宿爲信，過信爲次，各有差等。</p><p>冬，公次於滑，將會鄭伯，謀紀故也。鄭伯辭以難。凡師，一宿爲舍，再宿爲信，過信爲次。</p><p><strong>所出</strong>：《春秋左氏傳 · 莊公》 — https://zh.wikisource.org/wiki/春秋左氏傳/莊公</p></article></main></div></div>
