    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 上勇</nav></header><main><article><h1>上勇</h1><p>天下有中敢直其身，先王有道敢行其意，是上勇也。</p><p>有上勇者，有中勇者，有下勇者。天下有中，敢直其身；先王有道，敢行其意；上不循於亂世之君，下不俗於亂世之民；仁之所在無貧窮，仁之所亡無富貴；天下知之，則欲與天下同苦樂之；天下不知之，則傀然獨立天地之間而不畏：是上勇也。[[勇與怯]]之辨，[[好勇惡勇]]之別，觀此可見。</p><p><strong>所出</strong>：《荀子 · 性惡篇》 — https://zh.wikisource.org/wiki/荀子/性惡篇</p></article></main></div></div>
