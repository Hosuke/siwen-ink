    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 武丁夜夢</nav></header><main><article><h1>武丁夜夢</h1><p>武丁夜夢得聖人，使百工營求之野，得說於傅險。</p><p>帝小乙崩，子帝武丁立。帝武丁即位，思復興殷，而未得其佐。三年不言，政事決定於冢宰，以觀國風。武丁夜夢得聖人，名曰說。以夢所見視群臣百吏，皆非也。於是迺使百工營求之野，得說於傅險中。是時說為胥靡，筑於傅險。見於武丁，武丁曰是也。得而與之語，果聖人，舉以為相，殷國大治。故遂以傅險姓之，號曰傅說。</p><p><strong>所出</strong>：《史記 · 卷003》 — https://zh.wikisource.org/wiki/史記/卷003</p></article></main></div></div>
