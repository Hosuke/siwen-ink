    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 吹笙鼓簧</nav></header><main><article><h1>吹笙鼓簧</h1><p>奏笙鼓簧，以樂嘉賓。</p><p>笙，編竹之器；簧，笙中振動發聲之薄片也。吹笙鼓簧，猶言鳴笙鼓瑟，皆樂器之總稱。《鹿鳴》首章云「吹笙鼓簧，承筐是將」，以音樂迎嘉賓，以筐篚將幣帛，禮文備具，見主人待客之誠也。</p><p><strong>所出</strong>：《詩經 · 鹿鳴》 — https://zh.wikisource.org/wiki/詩經/鹿鳴</p></article></main></div></div>
