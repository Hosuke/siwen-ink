    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 翩彼飛鴞</nav></header><main><article><h1>翩彼飛鴞</h1><p>鴞止泮林，以興淮夷之受化。</p><p>[[翩彼飛鴞]]，第八章之首句也。鴞者，惡聲之鳥也，古人以為不祥。詩言翩翩然一飛鴞，集於泮林之上。林於泮宮，鴞止於此，似非其所宜。然下文云「食我桑黮，懷我好音」，言鴞食桑葚之後，乃有好音。喻淮夷本狼戾，至此受魯之化，亦革心向化，來獻方物也。</p><p><strong>所出</strong>：《詩經 · 泮水》 — https://zh.wikisource.org/wiki/詩經/泮水</p></article></main></div></div>
