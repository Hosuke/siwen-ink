    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 鉛丹</nav></header><main><article><h1>鉛丹</h1><p>食之飽饑不在丹而在人誠，能齊一有亡則蛻五行脫三光。</p><p>術有火練鉛丹以代谷食者，其必然也。然歲豐則能飽，歲儉則能饑，是非丹之恩，蓋由人之誠也。則是我本不饑而自饑之，丹本不飽而自飽之。饑者大妄，飽者大幻，蓋不齊其道也。故人能一有無，一死生，一情性，一內外，則可以蛻五行、脫三光，何患乎一日百食，何慮乎百日一食。</p><p><strong>所出</strong>：《化書 · 卷一》 — https://zh.wikisource.org/wiki/化書/卷一</p></article></main></div></div>
