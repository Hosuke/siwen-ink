    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 罔非天胤</nav></header><main><article><h1>罔非天胤</h1><p>民皆天之子，無一例外。</p><p>王司敬民，以民無非天之胤嗣也。天生育萬民，莫非己出，民皆天之子，則王可不敬其民乎？[[王司敬民]]，正以其皆[[天監下民]]之子也。此義與[[天佑下民]]相發，天既佑之，王即當敬之，一脈相承焉。</p><p><strong>所出</strong>：《尚書 · 高宗肜日》 — https://zh.wikisource.org/wiki/尚書/高宗肜日</p></article></main></div></div>
