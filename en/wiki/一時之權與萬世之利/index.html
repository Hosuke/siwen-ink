    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 一時之權與萬世之利</nav></header><main><article><h1>一時之權與萬世之利</h1><p>舅犯言一時之權，雍季言萬世之利，文公兼知之。</p><p>文公辭舅犯，因召雍季而問之。雍季言萬世之利，舅犯言一時之權。文公用舅犯之謀與楚人戰以敗之，歸而行爵，先雍季而後舅犯。羣臣以為不然。文公曰：「夫舅犯言，一時之權也；雍季言，萬世之利也。」仲尼聞之，曰：「文公之霸也宜哉！既知一時之權，又知萬世之利。」</p><p><strong>所出</strong>：《韓非子 · 難一》 — https://zh.wikisource.org/wiki/韓非子/難一</p></article></main></div></div>
