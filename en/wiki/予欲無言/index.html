    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 予欲無言</nav></header><main><article><h1>予欲無言</h1><p>聖人欲無言，以天為法，四時行而百物生，不言而化成。</p><p>孔子曰：「予欲無言！」子貢曰：「子如不言，則小子何述焉？」孔子曰：「天何言哉？四時行焉，百物生焉，天何言哉？」</p><p>聖人倦於言久矣，欲無言以化天下。然子貢疑之，以為無言則道何以傳？聖人指天以示之：天不言而四時行，百物生，功用自然，無待言說也。聖人之道亦猶是爾，身教以化之，恭行以成之，不言而民自勸，此其所以為聖也。</p><p><strong>所出</strong>：《論語 · 陽貨第十七》 — https://zh.wikisource.org/wiki/論語/陽貨第十七</p></article></main></div></div>
