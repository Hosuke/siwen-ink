    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 刻舟以摸遺劍，參天而射五步</nav></header><main><article><h1>刻舟以摸遺劍，參天而射五步</h1><p>譏拘泥古道、不達時變之弊</p><p>而欲以太昊之道，治偷薄之俗；以畫一之歌，救鼎湧之亂，非識因革之隨時，明損益之變通也。所謂刻舟以摸遺劍，叁天而射五步，摜犀兕之甲，以涉不測之淵，踵之解除，頤之搔背，其為愦愦，莫此之劇矣！</p><p><strong>所出</strong>：《抱朴子 · 卷14》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷14</p></article></main></div></div>
