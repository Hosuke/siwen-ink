    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 四鄰謀取其國家</nav></header><main><article><h1>四鄰謀取其國家</h1><p>鄰國覬覦危亡之國，國人作詩刺君。</p><p>政荒民散，將以危亡，四鄰謀取其國家而不知。</p><p>民散於內，四鄰謀於外，內外交迫，國家危亡無日。昭公懵然不知，故詩人作詩以刺之，欲其感悟而脩德也。</p><p><strong>所出</strong>：《詩經 · 山有樞》 — https://zh.wikisource.org/wiki/詩經/山有樞</p></article></main></div></div>
