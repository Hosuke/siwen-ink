    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 父召無諾</nav></header><main><article><h1>父召無諾</h1><p>敬長之禮，急於應對，不可怠慢。</p><p>《禮》曰：「父召無諾；君命召，不俟駕。」</p><p>景子論君臣之禮，孟子引《禮》以明之：父子之恩，主於敬；君臣之分，主於敬。然敬之至者，莫先於速。父之召也，未命而先至，無諾緩之容；君命之召也，不俟駕而行，不留片刻之頃。是故敬長之禮，急於赴命如此，否則慢矣。</p><p><strong>所出</strong>：《孟子 · 公孫丑下》 — https://zh.wikisource.org/wiki/孟子/公孫丑下</p></article></main></div></div>
