    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 福履綏將成</nav></header><main><article><h1>福履綏將成</h1><p>福履之來，由逮下而漸至於成也。</p><p>「福履綏之」「福履將之」「福履成之」，〈樛木〉三章之漸也。</p><p>綏，安也。言福祿先以安撫逮下者。
將，扶也。言福祿繼以扶持下者。
成，全也。言福祿終以成全下者。</p><p>由綏而將而成，循序漸進，上下相逮，內無嫉妒，外蒙覆蓋，故天下莫不蒙其福也。</p><p><strong>所出</strong>：《詩經 · 樛木》 — https://zh.wikisource.org/wiki/詩經/樛木</p></article></main></div></div>
