    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 無剋勝</nav></header><main><article><h1>無剋勝</h1><p>重積德於己，則物莫能與之競。</p><p>剋，勝也。重積德於己，則無不剋勝。河上公云：「莫知己德之窮極也。」德積而至於無極，則天下之物莫能與競。[[重積德]]而致乎莫知其極，是以無剋而不勝，[[莫極]]之德被乎四海，非智力之所能爭，[[不爭]]而天下莫能與爭者已。</p><p><strong>所出</strong>：《老子河上公章句 · 守道》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
