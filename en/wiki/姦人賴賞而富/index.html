    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 姦人賂賞而富</nav></header><main><article><h1>姦人賂賞而富</h1><p>姦邪之人竊賞而致富，賢者反不能得位。</p><p>本篇以燕、趙交兵之轍為戒：趙嘗以龜筴「大吉」北伐，而秦出上黨，兵至釐而六城拔，至陽城而秦拔鄴，龐援南救而障盡。韓非歎曰：「趙龜雖無遠見於燕，且宜近見於秦。秦以其大吉，辟地有實，救燕有有名。趙以其大吉，地削兵辱，主不得意而死。」夫卜筴不可恃如是，非秦龜神而趙龜欺也，治法與不治法異耳。</p><p>  <strong>所出</strong>：《韓非子 · 飾邪》 — https://zh.wikisource.org/wiki/韓非子/飾邪</p></article></main></div></div>
