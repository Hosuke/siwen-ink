    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 車轂空虛</nav></header><main><article><h1>車轂空虛</h1><p>轂有空而車可行，心有虛而神歸之。</p><p>車有轂三十輻所以湊之者，轂中有孔也。孔虛則輪轉，心虛則神居。治身者去情欲則五藏空，治國者寡所能則眾弱為強。虛者萬化之根，空者眾妙之門。</p><p><strong>所出</strong>：《老子河上公章句 · 無用》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
