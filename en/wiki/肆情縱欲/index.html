    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 肆情縱欲</nav></header><main><article><h1>肆情縱欲</h1><p>君王肆情縱欲，則神器易手，國將覆亡。</p><p>若乃肆情縱欲，而不與天下共其樂，故有憂莫之恤也。削基憎峻，而不覺下墮則上崩，故傾頹莫之扶也。</p><p><strong>所出</strong>：《抱朴子 · 卷05》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷05</p></article></main></div></div>
