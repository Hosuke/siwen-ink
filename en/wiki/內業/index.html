    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 內業</nav></header><main><article><h1>內業</h1><p>精氣藏於胸中，修之於內，以成德智，謂之內業。</p><p>文：內業者，精氣充於胸中、善守勿失之謂也。萬物之精，上爲列星，下生五穀，流於天地謂之鬼神，藏於胸中謂之聖人。是故此氣也，不可止以力，可安以德；不可呼以聲，可迎以音。敬守勿失，是謂成德。德成而智出，萬物果得。人能正靜，皮膚裕寬，耳目聰明，筋信而骨強，乃能戴大圜而履大方。此內業之實效也。</p><p><strong>所出</strong>：《管子 · 第49篇內業》 — https://zh.wikisource.org/wiki/管子/第49篇內業</p></article></main></div></div>
