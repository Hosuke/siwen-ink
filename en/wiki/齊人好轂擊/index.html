    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 齊人好轂擊</nav></header><main><article><h1>齊人好轂擊</h1><p>禁之以制不如化其心，教化為本。</p><p>齊人甚好轂擊，相犯以為樂，禁之不止。晏子患之，乃為新车良馬，出與人相犯也，曰：「轂擊者不祥，臣其祭祀不順，居處不敬乎！」下车弃而去之。然後國人乃不為。</p><p>禁之以制而身不先行，民不能止。化其心莫若教也。</p><p><strong>所出</strong>：《晏子春秋 · 卷六》 — https://zh.wikisource.org/wiki/晏子春秋/卷六</p></article></main></div></div>
