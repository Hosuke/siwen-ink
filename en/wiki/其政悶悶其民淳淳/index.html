    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 其政悶悶其民淳淳</nav></header><main><article><h1>其政悶悶其民淳淳</h1><p>為政寬簡，則民風淳樸；政令苛察，則民心生變。</p><p>故為政以苛為察，以切為明，以刻下為忠，以計多為功，如此者譬猶廣革者也，大敗大裂之道也。其政悶悶，其民淳淳；其政察察，其民缺缺。</p><p><strong>所出</strong>：《文子 · 卷十二》 — https://zh.wikisource.org/wiki/文子/卷十二</p></article></main></div></div>
