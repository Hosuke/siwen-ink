    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 絕利一源</nav></header><main><article><h1>絕利一源</h1><p>耳目之利，絕其一源；思之精，三反晝夜；用心於一，萬全成也。</p><p>瞽者善聽，聾者善視。絕利一源，用師十倍；三反晝夜，用師萬倍。</p><p>思之精，所以盡其微。耳目之利，絕其一源。</p><p>人之耳目，皆分於心而竟於神。心分，則機不精；神竟，則機不微。是以師曠薰目而聰耳，離朱漆耳而明目。任一源之利，而反用師於心，舉事發機，十全成也。退思三反，經晝歷夜，思而後行，舉事發機，萬全成也。</p><p>目動而心應之；見可則行，見否則止。</p><p><strong>所出</strong>：《陰符經》 — https://zh.wikisource.org/wiki/七注陰符經</p></article></main></div></div>
