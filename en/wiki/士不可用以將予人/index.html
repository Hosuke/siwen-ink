    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 士不可用，以將予人</nav></header><main><article><h1>士不可用，以將予人</h1><p>士不任事，是將之過。</p><p>士不可用者，以其將予人也。</p><p>將者，士之帥。士不能用，由將無知人之明。善將者，必能使士赴湯火。</p><p><strong>所出</strong>：《管子 · 第28篇參患》 — https://zh.wikisource.org/wiki/管子/第28篇參患</p></article></main></div></div>
