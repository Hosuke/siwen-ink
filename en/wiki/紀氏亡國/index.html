    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 紀氏亡國</nav></header><main><article><h1>紀氏亡國</h1><p>强本節用而不通輕重，雖穀豐不能理，終歸於天下。</p><p>管子曰：「可以益愈，而未足以為存也。昔者紀氏之國，强本節用者，其五穀豐滿而不能理也，四流而歸於天下。若是，則紀氏其强本節用，適足以使其民穀盡而不能理，為天下虜，是以其國亡而身無所處。」</p><p>是故善為國者，必通輕重之術，使粟歸於上，而不失之於天下。</p><p><strong>所出</strong>：《管子 · 第81篇輕重乙》 — https://zh.wikisource.org/wiki/管子/第81篇輕重乙</p></article></main></div></div>
