    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 虢石父讒諂</nav></header><main><article><h1>虢石父讒諂</h1><p>佞臣用則王室傾。</p><p>幽王時有虢石父者，善為讒諂巧從之言，王悅之，立以為卿士。史伯論之，以為此人不可用於國，斥其與剸同。又言王棄聘后而立內妾，好窮固；侏儒戚施，實御在側；周法不昭，而婦言是行。皆亡國之象也。夫剸同者，專於一偏，不納諫諍，其害甚矣。</p><p><strong>所出</strong>：《國語 · 卷16》 — https://zh.wikisource.org/wiki/國語/卷16</p></article></main></div></div>
