    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 衞青七出擊匈奴</nav></header><main><article><h1>衞青七出擊匈奴</h1><p>大將軍衞青七度出師，斬捕虜五萬餘級，收河南地，遂開朔方郡。</p><p>最大將軍青，凡七出擊匈奴，斬捕首虜五萬餘級。一與單于戰，收河南地，遂置朔方郡，再益封，凡萬一千八百戶。</p><p><strong>所出</strong>：《史記 · 卷111》 — https://zh.wikisource.org/wiki/史記/卷111</p></article></main></div></div>
