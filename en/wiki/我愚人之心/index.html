    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 我愚人之心也哉</nav></header><main><article><h1>我愚人之心也哉</h1><p>聖人若愚，混沌若濁。</p><p>我愚人之心也哉，沌沌兮。聖人智周萬物，而自若愚闇；明照天下，而自若混沌。以世俗觀之，昭昭者智也，沌沌者愚也；聖人知智之為害，故守之以愚。此老氏所謂大智若愚也。</p><p><strong>所出</strong>：《老子河上公章句 · 異俗》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p><hr><p>言聖人澹然無欲，渾沌沌沌，若愚人之心也。非真愚也，絕聖棄智，返於嬰兒之赤子之心耳。</p><p><strong>所出</strong>：《道德經 (王弼本) · 二十章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
