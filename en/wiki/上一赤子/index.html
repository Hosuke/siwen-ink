    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 上一赤子</nav></header><main><article><h1>上一赤子</h1><p>赤子為玄帝凝天真帝君之號，又名三元先。</p><p>丹皇運珠神名，守鎮死門，上一赤子，玄帝凝天帝君名，一名伯无上，亦曰三元先。丹皇所以運珠守鎮死者，以上一赤子凝天真帝君在焉。赤子者，[[玄帝凝天]]之別號，伯无上、三元先，皆其異名。扶之養之形骸，則使我登雲輪，常坐[[上清軒]]，七玄皆為仙君矣。</p><p><strong>所出</strong>：《上清大洞真經 · 2章》 — https://zh.wikisource.org/wiki/上清大洞真經/2章</p></article></main></div></div>
