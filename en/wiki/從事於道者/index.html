    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 從事於道者</nav></header><main><article><h1>從事於道者</h1><p>從道者同於道，從德者同於德，各從其類。</p><p>故從事於道者，道者同於道，德者同於德，失者同於失。</p><p>求道者與道合，求德者與德合，求失者與失合。以類相從，自然之理也。</p><p><strong>所出</strong>：《老子河上公章句 · 虛無》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
