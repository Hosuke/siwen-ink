    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 炮之燔之</nav></header><main><article><h1>炮之燔之</h1><p>裹泥炮燒與直接火炙，烹兔之二法。</p><p>炮，裹泥而燒之也。燔，就火炙之也。詩言「炮之燔之」「燔之炙之」「燔之炮之」，迭用此四法以烹兔首，示烹法非一，皆可饗客。禮之為體，不泥於一端，貴得其宜也。</p></article></main></div></div>
