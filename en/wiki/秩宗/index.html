    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 秩宗</nav></header><main><article><h1>秩宗</h1><p>掌宗廟祭祀之官，典禮序神。</p><p>舜命伯夷為秩宗。伯夷拜稽首，讓于夔、龍，帝俞之。秩宗之職，夙夜惟寅，直哉惟清，所以典[[三禮]]、敬鬼神、和上下也。</p><p><strong>所出</strong>：《尚書 · 舜典》 — https://zh.wikisource.org/wiki/尚書/舜典</p></article></main></div></div>
