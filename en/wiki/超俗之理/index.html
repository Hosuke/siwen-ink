    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 超俗之理</nav></header><main><article><h1>超俗之理</h1><p>超出流俗之道理，非庸瑣所能知見。</p><p>[[抱朴子]]此卷終篇，仕人聞逸民反覆陳辭，乃「悵然自失，慨爾永嘆曰：『始悟超俗之理，非庸瑣所見矣。』」</p><p>此文以「超俗之理」一語，可為[[抱朴子]]此卷之總結。蓋隱居求志之士，其道理高遠，非汲汲於祿利者所能知；然亦非一意孤高，自絕於世。故其終也，仕人始悟雙方各有是非，而歸於相互理解。</p><p><strong>所出</strong>：《抱朴子 · 卷02》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷02</p></article></main></div></div>
