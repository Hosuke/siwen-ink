    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 大道廢有仁義</nav></header><main><article><h1>大道廢有仁義</h1><p>道衰而後仁義之名始立</p><p>道之既廢，仁義始見。仁義非道，乃其末也；道之既行，仁義不立。此自然之勢也。昔堯舜之世，民忘其善，上無所尚，是為大道。及其衰也，澆淳散樸，仁義之說乃起焉。</p><p><strong>所出</strong>：《道德經 (王弼本) · 十八章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
