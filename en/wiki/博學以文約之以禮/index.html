    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 博學以文約之以禮</nav></header><main><article><h1>博學以文約之以禮</h1><p>廣學典籍而以禮約束之，則不畔於道。</p><p>子曰：「博學以文，約之以禮；亦可以弗畔矣夫！」</p><p>博文者，致知之功；約禮者，養正之實。知與行並進，內外兼修，斯能日躋乎[[聖賢]]之域而不畔於道也。</p><p><strong>所出</strong>：《論語 · 顏淵第十二》 — https://zh.wikisource.org/wiki/論語/顏淵第十二</p></article></main></div></div>
