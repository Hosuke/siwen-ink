    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 弓矢盜以侮天子</nav></header><main><article><h1>弓矢盜以侮天子</h1><p>天子作弓矢威天下，天下盜弓矢以侮天子；君子作禮樂防小人，小人盜禮樂以僣君子。</p><p>天子作弓矢威天下，天下盜弓矢以侮天子。君子作禮樂以防小人，小人盜禮樂以僣君子。有國者好聚斂，蓄粟帛、具甲兵以禦賊盜，賊盜擅甲兵、踞一粟帛以奪其國。或曰：「安危德也。」又曰：「興亡數也。」茍德可以恃，何必廣粟帛乎？茍數可以憑，何必廣甲兵乎？</p><p><strong>所出</strong>：《化書 · 卷三》 — https://zh.wikisource.org/wiki/化書/卷三</p></article></main></div></div>
