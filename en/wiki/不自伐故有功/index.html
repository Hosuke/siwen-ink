    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 不自伐故有功</nav></header><main><article><h1>不自伐故有功</h1><p>不自誇則功自存</p><p>不自伐故有功。不自伐其功者，其功得存。伐則功去矣。</p><p><strong>所出</strong>：《老子河上公章句 · 益謙》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p><hr><p>聖人輔翼萬物不自誇伐，其功反得昭著。伐者，矜功自誇也。弗自伐者，其功自然成就。</p><p><strong>所出</strong>：《老子 (帛書本) · 章二十二》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
