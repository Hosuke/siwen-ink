    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 不知我者-之</nav></header><main><article><h1>不知我者-之</h1><p></p><p>詩云「知我者，謂我心憂，不知我者，謂我何求」。知我者，則洞悉詩人閔宗周、傷故國之志；不知我者，但見其行邁靡靡、徘徊不去，以為必有所圖、有所私求。世人以世俗之心揣度，故不知其本心也。</p><p>  <strong>所出</strong>：《詩經 · 黍離》 — https://zh.wikisource.org/wiki/詩經/黍離</p></article></main></div></div>
