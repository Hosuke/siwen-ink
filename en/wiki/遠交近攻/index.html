    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 遠交近攻</nav></header><main><article><h1>遠交近攻</h1><p>結遠邦而伐近鄰之策。</p><p>范睢說秦昭王，言連衡之計不如遠交近攻。其言曰：「王不如遠交而近攻，得寸則王之寸也，得尺亦王之尺也。今釋此而遠攻，不亦繆乎！」又言：「夫韓、魏中國之處而天下之樞也，王其欲霸，必親中國以為天下樞，以威楚、趙。楚彊則附趙，趙彊則附楚，楚、趙皆附，齊必懼矣。齊懼，必卑辭重幣以事秦。齊附而韓、魏因可虜也。」昭王善之，拜范睢為客卿，卒用其謀。</p><p><strong>所出</strong>：《史記 · 卷079》 — https://zh.wikisource.org/wiki/史記/卷079</p></article></main></div></div>
