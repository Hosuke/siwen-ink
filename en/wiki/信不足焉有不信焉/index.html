    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 信不足焉有不信焉</nav></header><main><article><h1>信不足焉有不信焉</h1><p>君信不足則民不信，理感必應。</p><p>信不足焉，有不信焉。</p><p>信之於人也亦然。人君信不足焉，則民亦不信之。以身感物，物亦應之，理之必然者也。</p><p><strong>所出</strong>：《老子河上公章句 · 虛無》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
