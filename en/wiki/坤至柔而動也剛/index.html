    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 坤至柔而動也剛</nav></header><main><article><h1>坤至柔而動也剛</h1><p>坤之為道，至柔而動則剛，至靜而德則方。</p><p>坤至柔而動也剛，至靜而德方，後得主而有常，含萬物而化光。</p><p>坤以「至柔」言其體，以「動也剛」言其用。雖稟坤順之性，然及其動也，剛健自見，此聖人法坤之要義也。坤之動，非自為也，因陽之動而動，剛在柔中，此地道所以合天德也。至靜者，德不外馳；德方者，用有準的。後得主而有常者，承陽而有序。含萬物而化光者，藏諸用而生物之功無際也。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷01》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷01</p></article></main></div></div>
