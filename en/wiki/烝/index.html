    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 烝</nav></header><main><article><h1>烝</h1><p>冬祭曰烝，天子諸侯孟冬之祭。</p><p>桓公八年，「八年春，正月己卯，烝。」又「夏，五月丁丑，烝。」</p><p>烝者，冬祭也。孟冬之月，天子諸侯用烝。公羊傳書二烝，見桓公用非其時，或以為譏其瀆祭也。</p><p><strong>所出</strong>：《春秋公羊傳 · 桓公》 — https://zh.wikisource.org/wiki/春秋公羊傳/桓公</p></article></main></div></div>
