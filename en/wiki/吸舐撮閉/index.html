    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 吸舐撮閉</nav></header><main><article><h1>吸舐撮閉</h1><p>達摩、海蟾二祖口法，以鼻吸、以舌舐、撮穀道、閉官竅，凝神聚氣以採藥。</p><p>吸舐撮閉者，達摩祖師形解、海蟾祖初乘二诀之總名也。吸者，鼻中吸氣以接先天；舐者，舌拄上齶以迎甘露；撮者，緊攝穀道，內中上提；閉者，塞兌垂簾，兼逆聽，久而神水落黃庭。四者合用，則神氣歸根，精不外泄。純陽祖師云：「窈窈冥冥生恍惚，恍恍惚惚結成團。」正是此诀。下不閉則火不聚而金不升，上不閉則藥不凝而丹不結。此四字者，採取烹煉之先務也。</p><p><strong>所出</strong>：《性命圭旨 · 利集》 — https://zh.wikisource.org/wiki/性命圭旨/利集</p></article></main></div></div>
