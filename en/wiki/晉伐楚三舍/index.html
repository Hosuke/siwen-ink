    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 晉伐楚三舍</nav></header><main><article><h1>晉伐楚三舍</h1><p>莊王引過謝師，晉師夜還</p><p>晉伐楚，三舍不止。大夫請擊之，莊王曰：「先君之時晉不伐楚，及孤之身而晉伐楚，是孤之過也。」大夫亦曰：「此臣之罪也。」王俯而泣，涕沾襟，晉人聞之曰：「君臣爭以過為在己，且輕下其臣，不可伐也。」夜還師而去。此[[能受國之垢]]之驗。</p><p><strong>所出</strong>：《淮南子 · 道應訓》 — https://zh.wikisource.org/wiki/淮南子/道應訓</p></article></main></div></div>
