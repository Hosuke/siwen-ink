    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 積善之家必有餘慶</nav></header><main><article><h1>積善之家必有餘慶</h1><p></p><p>坤文言：「積善之家，必有餘慶；積不善之家，必有餘殃。臣弒其君，子弒其父，非一朝一夕之故，其所由來者漸矣。」</p><p>  此言善惡之報，積漸而成。[[履霜堅冰至]]之義，於此益明。</p><p>  <strong>所出</strong>：《周易 · 坤》 — https://zh.wikisource.org/wiki/周易/坤</p></article></main></div></div>
