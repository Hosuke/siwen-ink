    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 女幾</nav></header><main><article><h1>女幾</h1><p>陳市酒婦，盜仙方修之，隨仙人去。</p><p>女幾者，陳市上酒婦也，作酒常美。仙人過其家飲酒，即以素書五卷質酒錢，幾開視之，乃仙方養性長生之術也。幾私寫其要詁，依而修之三年，顏色更少，如二十許人。數歲質酒，仙人復來，笑謂之曰：「盜道無師，有翅不飛。」女幾遂隨仙人去，居山歷年，人常見之。其後不知所適，今所居即女幾之山也。</p><p><strong>所出</strong>：《墉城集仙錄 · 卷06》 — https://zh.wikisource.org/wiki/墉城集仙錄/卷06</p></article></main></div></div>
