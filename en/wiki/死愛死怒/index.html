    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 死愛死怒</nav></header><main><article><h1>死愛死怒</h1><p>軍中五死，皆以義激，非賞罰所能強。</p><p>凡人死愛，死怒，死威，死義，死利。</p><p>死愛者，愛其將帥，患難相救；死怒者，怒敵之慢，致死地而後快；死威者，威於刑罰，不敢不死；死義者，為大義而死，雖死不避；死利者，貪其賞利而赴死。</p><p>凡戰之道：教約人輕死，道約人死正。教以賞罰者，利之所驅；道以義理者，心之所安。唯二者並用，乃可以使士致死而不怨。</p><p><strong>所出</strong>：《司馬法》 — https://zh.wikisource.org/wiki/司馬法</p></article></main></div></div>
