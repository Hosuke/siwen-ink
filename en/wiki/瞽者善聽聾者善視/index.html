    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 瞽者善聽聾者善視</nav></header><main><article><h1>瞽者善聽聾者善視</h1><p>絕外損而內明，專精之力也。</p><p>瞽者善聽，聾者善視。絕利一源，用師十倍；三反晝夜，用師萬倍。</p><p>瞽者失其視，故聽覺獨專；聾者失其聽，故視覺獨明。此專精之效也。絕彼利欲之一源，專此心源之一本，不散不怠，用師十倍。晝夜更反，三而不已，功效萬倍。修道治兵，其理一也。</p><p><strong>所出</strong>：《黃帝陰符經集註》 — https://zh.wikisource.org/wiki/黃帝陰符經集註</p></article></main></div></div>
