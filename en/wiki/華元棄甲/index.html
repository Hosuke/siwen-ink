    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 華元棄甲</nav></header><main><article><h1>華元棄甲</h1><p>華元與鄭師接戰而奔，城者作睅目之歌以譏之。</p><p>華元，宋大夫也。與鄭師戰，兵敗棄甲而遁。城中守者見其奔逃之狀，作歌以嘲之曰：「睅其目，皤其腹，棄甲而復。」蓋刺其外貌醜陋而師旅敗北也。[[文心雕龍 · 諧讔]]云：「昔華元棄甲，城者發睅目之謳。」並嗤戲形貌，內怨為俳，此諧辭之始見於《左傳》者也。</p><p><strong>所出</strong>：《文心雕龍 · 諧讔》 — https://zh.wikisource.org/wiki/文心雕龍/諧讔</p></article></main></div></div>
