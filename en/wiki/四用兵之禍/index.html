    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 四用兵之禍</nav></header><main><article><h1>四用兵之禍</h1><p>境內貧、戰不勝、勝而死、得地而國敗，四者兵之祸也。</p><p>舉兵之日而境內貧，戰不必勝，勝則多死，得地而國敗。此四者，用兵之祸也。四祸其國，而無不危矣。</p><p><strong>所出</strong>：《管子 · 第17篇兵法》 — https://zh.wikisource.org/wiki/管子/第17篇兵法</p></article></main></div></div>
