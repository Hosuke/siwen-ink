    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 錘杭抵掌</nav></header><main><article><h1>錘杭抵掌</h1><p>形容徒然用力而無實效，空言辯論之態。</p><p>玄泊先生云：「徒口枯氣乏，<strong>錘杭抵掌</strong>，斤斧缺壞而盤節不破，勃然戰色而乖忤愈遠，致令恚容表顏，醜言自口。」言淺近者徒事口辯，空費氣力，終無以動人，但增乖忤之勢而已。</p><p><strong>所出</strong>：《抱朴子 · 卷51》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷51</p></article></main></div></div>
