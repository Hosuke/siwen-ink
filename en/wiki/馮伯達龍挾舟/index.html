    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 馮伯達龍挾舟</nav></header><main><article><h1>馮伯達龍挾舟</h1><p>馮伯達令船主安眠勿開眼，兩龍挾樑翼船，迅若電逝。</p><p>馮伯達者，豫章建昌人。世奉孝道，精進濟物。道民陳辭得旨，與戴矜相似，又是同時人也。</p><p>宋文帝元嘉中，伯達下都，後寄載鄉人還南。行至梅根，阻風連日。伯達謂船主曰：「欲得速至家，但安眠，慎勿開眼。」其夜聞舩下刺樹杪而不危抗。竊有窺者，見兩龍挾樑翼船，迅若電逝。未曉到舍。伯達尋入廬山不返。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 28》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/28</p></article></main></div></div>
