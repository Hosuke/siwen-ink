    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 水行御</nav></header><main><article><h1>水行御</h1><p>水行之令，循壬子而行，天子當斂藏萬物，戒興作。</p><p>睹壬子，水行御。天子出令，命左右使人內御。其氣足則發而止，其氣不足則發撊瀆盜賊，數劋竹箭，伐檀柘，令民出獵禽獸，不釋巨少而殺之，所以貴天地之所閉藏也。然則羽卵者不段，毛胎者不𦢌，𣎜婦不銷棄，草木根本美。七十二日而畢。</p><p>睹壬子，水行御。天子決塞動大水，王后夫人薨。不然，則羽卵者段，毛胎者𦢌，𣎜婦銷棄，草木根本不美。七十二日而畢。</p><p><strong>所出</strong>：《管子 · 第41篇五行》 — https://zh.wikisource.org/wiki/管子/第41篇五行</p></article></main></div></div>
