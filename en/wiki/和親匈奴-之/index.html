    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 和親匈奴-之</nav></header><main><article><h1>和親匈奴-之</h1><p>汉文帝通过和亲与匈奴结为兄弟之约，虽匈奴违约侵扰，仍坚持边防并遣使劝和，终于稳固和平</p><p>孝文與匈奴和親，定約為昆弟，毋使害邊境。然匈奴背約入盜，帝令邊備守，不發兵深入，惡煩苦百姓。遺使者冠蓋相望，結軼於道，以諭朕意於單于，勸其「親與朕俱棄細過，偕之大道，結兄弟之義，以全天下元元之民」。和親已定，始於今年。</p><p>  <strong>所出</strong>：《史記 · 卷010》 — https://zh.wikisource.org/wiki/史記/卷010</p></article></main></div></div>
