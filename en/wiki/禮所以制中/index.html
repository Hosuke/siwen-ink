    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 禮所以制中</nav></header><main><article><h1>禮所以制中</h1><p>禮者，所以節制人情，使其無過不及也。</p><p>原文云「文飾、聲樂、恬愉，所以持平奉吉也；麤惡、哭泣、憂戚，所以持險奉凶也」，皆歸於「禮之中流」。故曰「禮之中流」者，文與質、情與貌相濟而不偏者也。制中之道，在於兼用而適時。</p><p>  <strong>所出</strong>：《荀子 · 禮論篇》 — https://zh.wikisource.org/wiki/荀子/禮論篇</p></article></main></div></div>
