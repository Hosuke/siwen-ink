    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 此邦之人</nav></header><main><article><h1>此邦之人</h1><p>流寓者斥所在之邦，見拒而不容。</p><p>此邦之人，不我肯穀。言旋言歸，復我邦族。</p><p>此邦之人，不可與明。言旋言歸，復我諸兄。</p><p>此邦之人，不可與處。言旋言歸，復我諸父。</p><p>詩人流寓於外邦，此邦之人不以其善道教之、不以恩義待之、不與共處也。詩人受拒既深，乃決意旋歸還土。三章疊言之，以見其不容於外、思歸愈切之情。</p><p><strong>所出</strong>：《詩經·黃鳥》 — https://zh.wikisource.org/wiki/詩經/黃鳥</p></article></main></div></div>
