    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 焚炙忠良，刳剔孕婦</nav></header><main><article><h1>焚炙忠良，刳剔孕婦</h1><p>暴虐之甚，殺戮忠臣，殘害孕婦，無道極矣。</p><p>焚炙忠良，刳剔孕婦。</p><p>此述商王之暴虐。焚炙忠良，殺諫臣也；刳剔孕婦，賊人道也。天理滅絕，無所忌憚，皇天所以震怒而命誅之也。</p><p><strong>所出</strong>：《尚書 · 泰誓上》 — https://zh.wikisource.org/wiki/尚書/泰誓上</p></article></main></div></div>
