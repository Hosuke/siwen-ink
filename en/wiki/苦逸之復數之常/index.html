    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 苦逸之復數之常</nav></header><main><article><h1>苦逸之復數之常</h1><p>苦者夢逸、逸者夢苦，迭為消長，理之常也。</p><p>尹氏大治產，心形俱疲，夜昔昔夢為人僕，趨走作役，無不為也；數罵杖撻，無不至也。其友告之曰：「若位足榮身，資財有餘，勝人遠矣。夜夢為僕，苦逸之復，數之常也。若欲覺夢兼之，豈可得邪？」</p><p>蓋人之情，苦則思逸，逸則虞苦。夜寐之時，心神無所營，往往反其晝之所遇而為之。此消長之數，固然之理也。</p><p><strong>所出</strong>：《列子 · 周穆王篇》 — https://zh.wikisource.org/wiki/列子/周穆王篇</p></article></main></div></div>
