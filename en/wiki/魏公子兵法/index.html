    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 魏公子兵法</nav></header><main><article><h1>魏公子兵法</h1><p>諸侯之客進兵法，公子皆名之，世俗稱魏公子兵法。</p><p>公子率五國之兵破秦軍於河外，走蒙驁。遂乘勝逐秦軍至函谷關，抑秦兵，秦兵不敢出。當此之時，公子威振天下，諸侯之客進兵法，公子皆名之，故世俗稱魏公子兵法。</p><p><strong>所出</strong>：《史記 · 卷077》 — https://zh.wikisource.org/wiki/史記/卷077</p></article></main></div></div>
