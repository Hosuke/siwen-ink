    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 眾人熙熙如享太牢如春登臺</nav></header><main><article><h1>眾人熙熙如享太牢如春登臺</h1><p>俗眾溺於嗜欲，若太牢之享、春臺之樂。</p><p>眾人熙熙，如享太牢，如春登臺。熙熙者，和樂之狀；太牢者，盛宴也；春登臺者，遊觀之娛也。世俗之人，見可欲則心樂，遇賞心之事則情悅，若饜人之嗜味、遊子之愛景，馳騁而不返。唯知道者不然。</p><p><strong>所出</strong>：《老子河上公章句 · 異俗》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
