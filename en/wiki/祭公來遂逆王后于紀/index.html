    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 祭公來遂逆王后于紀</nav></header><main><article><h1>祭公來遂逆王后于紀</h1><p>周使祭公迎后，兼行二事，書遂以見非禮。</p><p>桓公八年，「冬，十月，雨雪。祭公來，遂逆王后于紀。」</p><p>祭公者，周大夫也。來聘于魯，既而遂逆王后于紀。公羊傳以為「遂」者，生事也。不受命而行，故書「遂」以見譏。</p><p><strong>所出</strong>：《春秋公羊傳 · 桓公》 — https://zh.wikisource.org/wiki/春秋公羊傳/桓公</p></article></main></div></div>
