    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 精神外淫則禍福至</nav></header><main><article><h1>精神外淫則禍福至</h1><p>精神馳騁於外而不守，則禍福之至無由識別。</p><p>夫孔竅者，精神之戶牖也，而氣志者，五臟之使候也。耳目淫于聲色之樂，則五臟搖動而不定矣；五臟搖動而不定，則血氣滔蕩而不休矣；血氣滔蕩而不休，則精神馳騁於外而不守矣；精神馳騁於外而不守，則禍福之至，雖如丘山，無由識之矣。</p><p><strong>所出</strong>：《淮南子 · 精神訓》 — https://zh.wikisource.org/wiki/淮南子/精神訓</p></article></main></div></div>
