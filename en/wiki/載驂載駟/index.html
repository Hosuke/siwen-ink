    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 載驂載駟</nav></header><main><article><h1>載驂載駟</h1><p>車馬相繼而至。諸侯來朝，車馬之盛也。</p><p>《采菽》次章言「載驂載駟，君子所屆」。驂者，三馬之車；駟者，四馬之車。諸侯朝王，車馬相繼，絡繹而至。《毛傳》：「屆，至也。」君子，指諸侯而言。言其旂幟既見，鸞聲遠聞，車乘之盛，無復加矣。序《詩》者以為刺幽王「侮慢諸侯，數徵會而無信義」，故君子思古之盛禮如此。</p><p><strong>所出</strong>：《詩經 · 采菽》 — https://zh.wikisource.org/wiki/詩經/采菽</p></article></main></div></div>
