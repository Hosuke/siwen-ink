    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 子車氏三子</nav></header><main><article><h1>子車氏三子</h1><p>秦穆公以子車氏三良為殉，君子傷之，賦《黃鳥》，譏其死而棄民。</p><p>秦伯任好卒，以子車氏之三子，奄息、仲行、鍁虎，為殉，皆秦之良也。國人哀之，為之賦《黃鳥》。君子曰：「秦穆之不為盟主也，宜哉！死而棄民。」</p><p><strong>所出</strong>：《春秋左氏傳 · 文公》 — https://zh.wikisource.org/wiki/春秋左氏傳/文公</p></article></main></div></div>
