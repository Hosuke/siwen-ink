    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 賢聖非時不行</nav></header><main><article><h1>賢聖非時不行</h1><p>抱朴子論仲尼、文種之賢聖，猶且時不我用，明功成之難。</p><p>昔仲尼上聖也，東受累於齊人，南見塞於子西。文種大賢也，初不齒於荊俗，末雍遊於鈞如。競年立功，不亦難乎？</p><p><strong>所出</strong>：《抱朴子 · 卷18》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷18</p></article></main></div></div>
