    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 人之生也柔弱</nav></header><main><article><h1>人之生也柔弱</h1><p>論人之生死以柔弱堅強為判。</p><p>人之生也柔弱，其死也恆仞堅強；萬物草木之生也柔脆，其死也枯槁。故曰：堅強者，死之徒也；柔弱微細，生之徒也。</p><p>此章以人物草木生死之殊，喻柔弱之為生道、堅強之為死途。柔弱者生機未竭，堅強者精氣已涸。是以聖人貴柔弱而賤堅強，取生而去死也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第四十一章 柔弱》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
