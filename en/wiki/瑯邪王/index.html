    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 瑯邪王</nav></header><main><article><h1>瑯邪王</h1><p>高后所立劉澤，後從齊至長安，議立代王。</p><p>高后割齊瑯邪郡立營陵侯劉澤為瑯邪王。齊王發兵，與瑯邪王約共誅呂氏，既行，齊王留瑯邪王不遣。瑯邪王不得反國，乃說齊王使其入關計事。齊王信之，遣之王行。齊王遂舉兵西攻呂國。</p><p>大臣議欲立齊王，瑯邪王及大臣皆曰不可，卒立代王，是為孝文帝。</p><p><strong>所出</strong>：《史記 · 卷052》 — https://zh.wikisource.org/wiki/史記/卷052</p></article></main></div></div>
