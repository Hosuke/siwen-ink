    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 沙丘崩</nav></header><main><article><h1>沙丘崩</h1><p>始皇崩於沙丘，趙高與李斯秘之而立胡亥。</p><p>始皇三十七年冬，行出游會稽，并海上，北走瑯邪。道病，使蒙毅還禱山川，未反。</p><p>始皇至沙丘崩，祕之，群臣莫知。是時丞相李斯、公子胡亥、中車府令趙高常從。</p><p>高雅得幸於胡亥，欲立之，又怨蒙毅法治之而不為己也。因有賊心，乃與丞相李斯、公子胡亥陰謀，立胡亥為太子。太子已立，遣使者以罪賜公子扶蘇、蒙恬死。</p><p><strong>所出</strong>：《史記 · 卷088》 — https://zh.wikisource.org/wiki/史記/卷088</p></article></main></div></div>
