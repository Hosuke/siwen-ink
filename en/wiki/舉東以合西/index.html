    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 舉東以合西</nav></header><main><article><h1>舉東以合西</h1><p>取東方的青龍魂氣以合西方的白虎魄精。</p><p>東者，木之分、青龍所居、魂之象也；西者，金之分、白虎所居、魄之象也。</p><p>[[龍虎兩弦]]之妙，在乎[[舉東以合西]]。取青龍之魂氣，與白虎之魄精相合，如[[青龍與之俱]]而[[汞日流珠]]之汞得[[白虎熬樞]]之金而凝定，二者交會，[[魂魄自相拘]]，而成[[兩弦合其精]]之功。東西相合，猶日月之交光，[[乾坤體乃成]]矣。</p><p><strong>所出</strong>：《周易參同契 · 09章》 — https://zh.wikisource.org/wiki/周易參同契/09章</p></article></main></div></div>
