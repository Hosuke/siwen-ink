    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 辭以其情而遷移</nav></header><main><article><h1>辭以其情而遷移</h1><p>吉凶隨情而變，非辭之有常也；情之感物，動而迭遷。</p><p>《易傳》明辭變之故。吉凶以情遷者，卦爻之辭，本乎情而立也。辭有定而情有殊，是以同一卦爻，而得失異焉。愛惡相攻，遠近相取，情偽相感，而利害生焉。《易》之設辭，昭昭使人知趨避，而其驗之遲速美惡，則視占者之情以為轉移。此聖人所以明情偽之故，使人反躬以定從違也。</p><p><strong>所出</strong>：《周易 · 繫辭下》 — https://zh.wikisource.org/wiki/易傳/繫辭下</p></article></main></div></div>
