    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 輿人為車</nav></header><main><article><h1>輿人為車</h1><p>輿人掌車制，車廣與衡長皆三分而得一稱。</p><p>輿人為車。輪崇，車廣，衡長，叄如一，謂之叄稱。叄分車廣，去一以為隧。叄分其隧，一在前，二在後，以揉其式。以其廣之半為之式崇，以其隧之半為之較崇。</p><p>圜者中規，方者中矩，立者中縣，衡者中水，直者如生焉，繼者如附焉。凡居材，大與小無并。大倚小則摧，引之則絕。棧車欲弇，飾車多侈。</p><p><strong>所出</strong>：《周禮 · 冬官考工記》 — https://zh.wikisource.org/wiki/周禮/冬官考工記</p></article></main></div></div>
