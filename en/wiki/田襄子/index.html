    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 田襄子</nav></header><main><article><h1>田襄子</h1><p>田氏既弒簡公，襄子嗣立於齊，遣兄弟宗人布列齊都，與三晉通使，田氏浸有齊國。</p><p>田襄子既相[[齊宣公]]，三晉殺[[知伯]]，分其地。襄子使其兄弟宗人盡為齊都邑大夫，與三晉通使，且以有齊國。襄子卒，子[[田莊子]]白立。</p><p><strong>所出</strong>：《史記 · 卷046》 — https://zh.wikisource.org/wiki/史記/卷046</p></article></main></div></div>
