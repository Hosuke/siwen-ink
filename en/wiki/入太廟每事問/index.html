    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 入太廟每事問</nav></header><main><article><h1>入太廟每事問</h1><p>聖人於禮器，不敢自恃而必問。</p><p>入太廟，每事問。[[孔子]]至[[周公]]之廟，凡祭器、祭品、禮儀，一一詢之於人，雖已知之，猶必問焉。夫聖人豈不知禮？問者，致謹也；致謹者，敬之至也。</p><p>[[孔子]]嘗言「知之為知之，不知為不知」，入太廟而每事問，正是不恥下問、居敬以嚴之意。禮非空言，必於此等處驗之。</p><p><strong>所出</strong>：《論語 · 鄉黨第十》 — https://zh.wikisource.org/wiki/論語/鄉黨第十</p></article></main></div></div>
