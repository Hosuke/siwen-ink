    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 以其私憾敗國殄民</nav></header><main><article><h1>以其私憾敗國殄民</h1><p>因私怨而敗國殃民，罪莫大焉。</p><p>宋華元將戰，殺羊食士，其御者羊斟不與。及戰，羊斟曰：「疇昔之羊，子為政；今日之事，我為政。」遂與入鄭師，宋師以敗。君子以為非人也，以其私憾，敗國殄民，於是刑孰大焉。詩云「人之無良」，其羊斟之謂乎！夫位在戎事，當以公義為先，區區私怨，遂覆三軍，可不戒哉。</p><p><strong>所出</strong>：《春秋左氏傳 · 宣公》 — https://zh.wikisource.org/wiki/春秋左氏傳/宣公</p></article></main></div></div>
