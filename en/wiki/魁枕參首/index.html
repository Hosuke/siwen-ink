    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 魁枕參首</nav></header><main><article><h1>魁枕參首</h1><p>斗魁枕於參星之首，衡杓相連，參主斬刈及天獄。</p><p>魁枕參首。枕，之禁反。衡，斗衡也。魁，斗第一星也。言北方斗，斗衡直當北之魁，枕於參星之首；北斗之杓連於龍角。</p><p>參主斬刈，又為天獄，主殺罰。其中三星橫列者，三將軍，東北曰左肩主左將，西北曰右肩主右將，東南曰左足主後將，西南曰右足主偏將。中央三小星曰伐，天之都尉也，主戎狄之國。不欲明；若明與參等，大臣謀亂，兵起，夷狄內戰。</p><p><strong>所出</strong>：《史記 · 卷027》 — https://zh.wikisource.org/wiki/史記/卷027</p></article></main></div></div>
