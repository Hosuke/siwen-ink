    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 七元之子主調氣</nav></header><main><article><h1>七元之子主調氣</h1><p>肺中七神主司調暢呼吸之氣。</p><p>七元之子，主調呼吸之氣。七元者，肺中七竅之神，又為肺臟七日之候、七魄之象。調氣者，治理呼吸，使氣機和暢之義。經云「七元之子主調氣」，言肺中諸神掌呼吸吐納之令，調和內外之氣，以養周身。</p><p><strong>所出</strong>：《黃庭內景經 · 肺部章第九》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/肺部章第九</p></article></main></div></div>
