    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 仲夏行冬令</nav></header><main><article><h1>仲夏行冬令</h1><p>孟夏行冬令，則寒氣不效，災禍立至。</p><p>仲夏行冬令，則雹霰傷穀，道路不通，暴兵來至。行春令，則五穀晚熟，百螣時起，其國乃饑。行秋令，則草木零落，果實早成，民殃於疫。</p><p><strong>所出</strong>：《呂氏春秋 · 卷五》 — https://zh.wikisource.org/wiki/呂氏春秋/卷五</p></article></main></div></div>
