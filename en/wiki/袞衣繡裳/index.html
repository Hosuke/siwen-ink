    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 袞衣繡裳</nav></header><main><article><h1>袞衣繡裳</h1><p>繡文之服，諸侯之盛服也。</p><p>袞衣，天子之服也；諸侯得服之者，亦稱袞。繡裳，裳之以繡文為飾者。詩言「我覯之子，袞衣繡裳」，以見君子之尊。詩末又言「是以有袞衣兮」，[[信處信宿]]之頃，不忍[[公歸]]，故欲留其服以象其人。</p><p><strong>所出</strong>：《詩經 · 九罭》 — https://zh.wikisource.org/wiki/詩經/九罭</p></article></main></div></div>
