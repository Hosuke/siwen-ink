    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 歲其有</nav></header><main><article><h1>歲其有</h1><p>歲時豐稔，民得其養</p><p>「自今以始，歲其有」，祈年之辭也。言歲復一歲，年穀豐熟，民無凍餒之患。此非偶然，[[夙夜在公|人君勤於公事]]，與群臣相與 [[于胥樂兮|燕飲以樂]]，政平人和，上[[有年|降之以有年]]，故下效之，而成[[歲時田獵|歲時]]之祥也。詩人因[[乘黃|車馬之盛]][[鼓咽咽|鐘鼓之娛]]，而預卜來年之豐，見治世之象，觀於 [[有年|有年]] 之兆矣。</p><p><strong>所出</strong>：《詩經 · 有駜》 — https://zh.wikisource.org/wiki/詩經/有駜</p></article></main></div></div>
