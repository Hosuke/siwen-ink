    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 右師之介</nav></header><main><article><h1>右師之介</h1><p>天生有所與，人形有所正，介者非人為也</p><p>公文軒見右師而驚，曰：「是何人也？惡乎介也？天與，其人與？」右師曰：「天也，非人也。天之生是使獨也，人之貌有與也，以是知其天也，非人也。」</p><p>夫介者，一足之異也。形骸之不全，非人為之刑罰，乃天之所與。以是知形有所與，命有所定，非人力所能易也。養生者，不以形骸之不全為病，不以世俗之見為累，達天命之自然，則无往而不自得。</p><p><strong>所出</strong>：《莊子 · 養生主》 — https://zh.wikisource.org/wiki/莊子/養生主</p></article></main></div></div>
