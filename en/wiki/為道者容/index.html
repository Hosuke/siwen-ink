    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 為道者容</nav></header><main><article><h1>為道者容</h1><p>修真之士，形容微妙，不可得而言說也。</p><p>[[深不可志]]，故聖人強為之容。[[古之善為士者]]，微妙玄達，深不可志。</p><p>道既不可以智識窺其涯涘，為道者之容亦復如是。形容湛深，變化莫測，若[[淵呵佁萬物之宗]]，若[[虛而不屈]]而用之不竭。其容貌氣象，有非言語所能形容者矣。</p><p>是故修道之士，不可以外貌求之，不可以言論定之，[[善為道者]]其若此也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章十五》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
