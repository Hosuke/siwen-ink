    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 蓮含華</nav></header><main><article><h1>蓮含華</h1><p>心開蓮花，華藏其中。</p><p>心開為蓮，蓮含精華。此言心部之象也。蓮花內含華蕊，以喻心藏神靈精粹之德。</p><p>《黃庭經》以蓮喻心，明心體虛徹、清淨無染、光明煒燁之德。蓮生於泥而不污，居濁世而自清，以比心君居形骸之內而能洞照萬物。修煉者必守此心令其虛明，如蓮之含華而未發，既發則光照一室矣。</p><p><strong>所出</strong>：《黃庭內景經 · 心部章第十》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/心部章第十</p></article></main></div></div>
