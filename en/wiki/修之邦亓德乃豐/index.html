    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 修之邦亓德乃豐</nav></header><main><article><h1>修之邦亓德乃豐</h1><p>德修於邦，敷布廣被，百物豐盛。</p><p>由鄉而邦，邦者諸侯之國也。[[修之鄉亓德乃長|修之鄉]]之德長，推之於邦，則德施普博，萬物以之豐盛焉。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第十七章 善觀》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
