    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 燎之方揚</nav></header><main><article><h1>燎之方揚</h1><p>火盛難滅，以喻惡勢之熾也。</p><p>《正月》有云：「燎之方揚，寧或滅之。」燎者，焚燒也。方揚者，正在熾盛之時也。言火之燎也，方其盛也，孰能熄之？以喻天下之亂，方熾而不可遏；亦以喻小人得志，其焰方張，而正人君子莫能禁也。詩人以此見王室之將亡，無可救藥，而幽王迷惑於褒姒，猶火之燎原，不可撲滅。末云「赫赫宗周，褒姒烕之」，正此意也。寧，或也。言燎盛之時，或有能滅之者乎？蓋深疑之辭也。</p><p><strong>所出</strong>：《詩經 · 正月》 — https://zh.wikisource.org/wiki/詩經/正月</p></article></main></div></div>
