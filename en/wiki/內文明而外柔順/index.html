    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 內文明而外柔順</nav></header><main><article><h1>內文明而外柔順</h1><p>內懷文明之德，外適柔順之道，君子蒙難以全身之象。</p><p>「內文明而外柔順，以蒙大難，文王以之。」夫文明者，離之所以為明也；柔順者，坤之所以為坤也。君子遇明夷之世，明德在躬，而能斂其鋒芒以從時宜，雖蒙大難，卒能全身。彖辭以文王之事明之，蓋文王囚於羑里而能不激，故聖人取以為法也。</p><p><strong>所出</strong>：《周易 · 明夷》 — https://zh.wikisource.org/wiki/周易/明夷</p></article></main></div></div>
