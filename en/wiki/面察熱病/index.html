    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 面察熱病</nav></header><main><article><h1>面察熱病</h1><p>觀面之色以察五藏熱之所在。</p><p>肝熱病者左頰先赤，心熱病者顏先赤，脾熱病者鼻先赤，肺熱病者右頰先赤，腎熱病者頤先赤。病雖未發，見赤色者刺之，名曰治未病。</p><p><strong>所出</strong>：《黃帝內經 · 素問第九卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第九卷</p></article></main></div></div>
