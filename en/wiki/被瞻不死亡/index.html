    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 被瞻不死亡</nav></header><main><article><h1>被瞻不死亡</h1><p>述被瞻以道不行釋不死亡之義。</p><p>鄭君問於被瞻曰：「聞先生之義，不死君，不亡君，信有之乎？」被瞻對曰：「有之。夫言不聽，道不行，則固不事君也。若言聽道行，又何死亡哉？」</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十六》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十六</p></article></main></div></div>
