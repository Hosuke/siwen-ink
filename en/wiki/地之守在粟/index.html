    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 地之守在粟</nav></header><main><article><h1>地之守在粟</h1><p>國以粟為本，無粟則城不固。</p><p>地之守在城，城之守在兵，兵之守在人，人之守在粟，故地不辟則城不固。</p><p><strong>所出</strong>：《管子 · 第03篇權修》 — https://zh.wikisource.org/wiki/管子/第03篇權修</p></article></main></div></div>
