    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 形生勢成，始末相承</nav></header><main><article><h1>形生勢成，始末相承</h1><p>形體既生，勢自成焉，首尾相承而不離。</p><p>贊曰：形生勢成，始末相承。湍迴似規，矢激如繩。因利騁節，情采自凝。枉轡學步，力止襄陵。</p><p>形既生則勢自成，首尾相承，水迴如規，矢激如繩，皆因利而馳其自然。情采凝於其中，若枉轡學步者，力止於襄陵之上，不可復進。此贊辭以總一篇之旨也。</p><p><strong>所出</strong>：《文心雕龍 · 定勢》 — https://zh.wikisource.org/wiki/文心雕龍/定勢</p></article></main></div></div>
