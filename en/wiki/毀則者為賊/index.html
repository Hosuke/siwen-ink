    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 毀則者為賊</nav></header><main><article><h1>毀則者為賊</h1><p>曲筆掩飾者為藏姦，當斥而去之。</p><p>里革遇僕人之書而更之，僕人以告宣公。公執之，曰：「違君命者，女亦聞之乎？」對曰：「臣以死奮筆，奚啻其聞之也！臣聞之曰：『毀則者為賊，掩賊者為藏，竊寶者為宄，用宄之財者為姦，使君為藏姦者，不可不去也。臣違君命者，亦不可不殺也。』」公曰：「寡人實貪，非子之罪。」乃舍之。</p><p><strong>所出</strong>：《國語 · 卷04》 — https://zh.wikisource.org/wiki/國語/卷04</p></article></main></div></div>
