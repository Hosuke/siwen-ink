    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 文情理通</nav></header><main><article><h1>文情理通</h1><p>文滅情則失情，情滅文則失文，唯文情理通乃臻至境。</p><p>文者，所以接物也，情系於中而欲發外者也。以文滅情，則失情；以情滅文，則失文。文情理通，則鳳麟極矣。言至德之懷遠也。</p><p><strong>所出</strong>：《淮南子 · 繆稱訓》 — https://zh.wikisource.org/wiki/淮南子/繆稱訓</p></article></main></div></div>
