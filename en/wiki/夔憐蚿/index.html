    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 夔憐蚿</nav></header><main><article><h1>夔憐蚿</h1><p>一足之夔羨多足之蚿，蚿自不知所以然。喻各稟天機，強較則惑。</p><p>夔憐蚿，蚿憐蛇，蛇憐風，風憐目，目憐心。夔謂蚿曰：「吾以一足趻踔而行，予無如矣。今子之使萬足，獨奈何？」蚿曰：「不然。子不見夫唾者乎？噴則大者如珠，小者如霧，雜而下者不可勝數也。今予動吾天機，而不知其所以然。」</p><p><strong>所出</strong>：《莊子 · 秋水》 — https://zh.wikisource.org/wiki/莊子/秋水</p></article></main></div></div>
