    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 愛己</nav></header><main><article><h1>愛己</h1><p>治世之要在自知、自愛、不迫、不厭。</p><p>此章以「愛己」名篇，實言治世之道、首在自知自愛。去威迫、狹居、厭生之弊，聖人自知而不自見、自愛而不自貴。夫惟在上者不厭，是以在下者亦不厭。上下相安，去彼取此，此章之旨也。</p><p><strong>所出</strong>：《老子河上公章句 · 愛己》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
