    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 凡益之道與時偕行</nav></header><main><article><h1>凡益之道與時偕行</h1><p>增益之道，貴在順時，與時序相合，方為合宜。</p><p>益，損上益下，民說無疆，自上下下，其道大光。利有攸往，中正有慶。利涉大川，木道乃行。益動而巽，日進無疆。天施地生，其益無方。凡益之道，與時偕行。</p><p>益者，損上益下之謂也。天施地生，陰陽交通，而萬物各得其所。益之時用，與時偕行，不可過也。永貞之吉，享帝之德，在此時也。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷04》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷04</p></article></main></div></div>
