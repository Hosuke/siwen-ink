    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 不忍人之心</nav></header><main><article><h1>不忍人之心</h1><p>人皆有怵惕惻隱之心，先王本此心以行不忍人之政，故治天下可運之掌上。</p><p>人皆有不忍人之心。先王有不忍人之心，斯有不忍人之政矣。以不忍人之心，行不忍人之政，治天下可運之掌上。所以謂人皆有不忍人之心者，今人乍見孺子將入於井，皆有怵惕惻隱之心；非所以內交於孺子之父母也，非所以要譽於鄉黨朋友也，非惡其聲而然也。由是觀之，無惻隱之心，非人也。</p><p><strong>所出</strong>：《孟子 · 公孫丑上》 — https://zh.wikisource.org/wiki/孟子/公孫丑上</p></article></main></div></div>
