    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 聞聲知音</nav></header><main><article><h1>聞聲知音</h1><p>聲氣不同則恩愛不接</p><p>聞聲知音者，謂聲氣不同，則恩愛不接。故商角不二合，徵羽不相配。能為四聲主者，其唯宮乎！故音不和則悲，是以聲散、傷、醜、害者，言必逆於耳也。雖有美行盛譽，不可比目合翼相須，此乃氣不合、音調者也。</p><p><strong>所出</strong>：《鬼谷子 · 卷03》 — https://zh.wikisource.org/wiki/鬼谷子/卷03</p></article></main></div></div>
