    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 構禍</nav></header><main><article><h1>構禍</h1><p>遭遇祸患之謂。</p><p>我日構禍，曷云能穀？</p><p>「構」，合也、集也。詩言我日日遭遇禍患，何時方能得善？言己之命運乖舛，禍患踵至，終不得解脫也。後世用「構禍」指遭逢灾祸之事。</p><p><strong>所出</strong>：《詩經 · 四月》 — https://zh.wikisource.org/wiki/詩經/四月</p></article></main></div></div>
