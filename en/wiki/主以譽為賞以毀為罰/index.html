    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 主以譽為賞以毀為罰</nav></header><main><article><h1>主以譽為賞以毀為罰</h1><p>以譽賞、以毀罰，則姦臣得志，忠臣受害</p><p>亂主不察臣之功勞，譽眾者則賞之；不審其罪過，毀眾者則罰之。姦邪無功而得賞，忠臣無罪而有罰。行貨財而得爵祿，則汙辱之人在官。
<strong>所出</strong>：《管子 · 第67篇明法解》 — https://zh.wikisource.org/wiki/管子/第67篇明法解</p></article></main></div></div>
