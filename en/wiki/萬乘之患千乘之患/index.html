    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 萬乘之患千乘之患</nav></header><main><article><h1>萬乘之患千乘之患</h1><p>萬乘患大臣太重，千乘患左右太信。</p><p>萬乘之患，大臣太重；千乘之患，左右太信：此人主之所公患也。</p><p>且人臣有大罪，人主有大失，臣主之利相與異者也。何以明之哉？曰：主利在有能而任官，臣利在無能而得事；主利在有勞而爵禄，臣利在無功而富貴；主利在豪傑使能，臣利在朋黨用私。</p><p><strong>所出</strong>：《韓非子 · 孤憤》 — https://zh.wikisource.org/wiki/韓非子/孤憤</p></article></main></div></div>
