    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 盜竽</nav></header><main><article><h1>盜竽</h1><p>飾辭耀物、竊據高位，實非道之盜也</p><p>老子此章以「盜竽」喻飾智耀德、竊據祿位者。言人厭飲食之足而積財有餘，服文采之衣而帶利劍以自衛，是為大盜而號稱於眾，非行道也。</p><p>文曰「是謂盜竽」，明其人以夸辭吹竿之術取信於時，「非道也」一語斷其歸趣，與[[服文采帶利劍]]相發。帛書作「竽」，與王弼本「盜夸」文異義同，俱指飾外而盜名者。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第十六章 盜竽》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
