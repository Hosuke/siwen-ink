    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 用其光</nav></header><main><article><h1>用其光</h1><p>用道之光輝，反歸其明。</p><p>光者，道之光華寓於[[心]]也。人稟道之光以為[[明]]，然馳於外者光外馳，逐於物者明亦蔽。用其光者，斂而歸之，不逐物、不眩外，返照[[心]]源，則明常存而不昧。與《[[道德經]]》所言「復歸其明」義相成，皆使人返求諸己，不逐乎物也。</p><p><strong>所出</strong>：《老子河上公章句 · 歸元》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
