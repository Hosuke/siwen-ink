    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 何不日鼓瑟</nav></header><main><article><h1>何不日鼓瑟</h1><p>有酒食當及時行樂，日日鼓瑟以永日。</p><p>子有酒食，何不日鼓瑟？</p><p>日，每日也。言有酒食則當日日鼓瑟以娛，與物俱用，不可坐失此日。永日，長日也，樂而不厭，使日長而有所娛。此詩人之意，正對上文「弗曳弗婁」「弗馳弗驅」「弗鼓弗考」而言也。</p><p><strong>所出</strong>：《詩經 · 山有樞》 — https://zh.wikisource.org/wiki/詩經/山有樞</p></article></main></div></div>
