    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 品物阜焉，歲功成焉</nav></header><main><article><h1>品物阜焉，歲功成焉</h1><p>天地之道，不能純仁，故寒暑相濟，品物乃成</p><p>蓋天地之道，不能純仁，故青陽闡陶育之和，素秋厲肅殺之威，融風扇則枯瘁攄藻，白露凝則繁英雕零。是以品物阜焉，歲功成焉。溫而無寒，則蠕動不蟄，根植冬榮。寬而無嚴，則奸宄並作，利器長守。</p><p><strong>所出</strong>：《抱朴子 · 卷14》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷14</p></article></main></div></div>
