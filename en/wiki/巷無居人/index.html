    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 巷無居人</nav></header><main><article><h1>巷無居人</h1><p>悅之深則視若無人之喻也。</p><p>「巷無居人」，《叔于田》之起興也。巷之為地，人所常處，茲言無居人者，非實無人也。悅之深則見之者若無，其心目中惟有叔在，故以為巷無居人耳。[[不如叔也]]之言，正申明此義，非巷真有是人也。詩人之情摯於是見之。</p><p><strong>所出</strong>：《詩經 · 叔于田》 — https://zh.wikisource.org/wiki/詩經/叔于田</p></article></main></div></div>
