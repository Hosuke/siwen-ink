    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 賞罰二者治民之道</nav></header><main><article><h1>賞罰二者治民之道</h1><p>賞罰乃治民之具，不可偏廢，亦不可施於極端之人。</p><p>治國用民之道，不可以許由讓天下為量，不可以盜跖犯刑赴難為準。許由未得有天下而無以天下為，盜跖�廉求財犯刑趨利而忘身。天下太上之士，不可以賞勸也；天下太下之士，不可以刑禁也。然為太上士不設賞，為太下士不設刑，則治國用民之道失矣。故上必且勸之以賞，然後可進；又且畏之以罰，然後不敢退。賞罰二者，治常者之道也。</p><p><strong>所出</strong>：《韓非子 · 忠孝》 — https://zh.wikisource.org/wiki/韓非子/忠孝</p></article></main></div></div>
