    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 五臟</nav></header><main><article><h1>五臟</h1><p>心肝脾肺腎，藏神之府</p><p>五臟者，心肝脾肺腎，藏神之府也。</p><p>經云：「說五臟各有方」，「歷觀五臟視節度」，修真者當歷觀五臟之和否，以知神之得失焉。</p><p><strong>所出</strong>：《黃庭外景經》 — https://zh.wikisource.org/wiki/黃庭外景經</p><hr><p>心又為五臟之王，《黃庭內景經》云「心典一體五臟王」，言心居中馭外，總攝肝、肺、脾、腎之氣，使各有序而不亂也。</p><p>  <strong>所出</strong>：《黃庭內景經 · 心典章第三十一》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/心典章第三十一</p></article></main></div></div>
