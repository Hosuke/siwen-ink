    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 玉池</nav></header><main><article><h1>玉池</h1><p>口之別稱，津液所生</p><p>又有「兩神相會化玉英」之文。言陰陽兩神相會於玉池，則生精華曰玉英。玉英者，精氣凝結之名，入口可以為漿，修之則瓊丹可致。玉池乃水火交會之所，兩神會焉則長生有基。</p><p>  <strong>所出</strong>：《黃庭內景經 · 隱藏章第三十五》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/隱藏章第三十五</p></article></main></div></div>
