    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 正心</nav></header><main><article><h1>正心</h1><p>去喜怒哀樂之偏，使心有所主而不蔽</p><p>傳之七章云：「修身在正其心者，身有所忿懥，則不得其正；有所恐懼，則不得其正；有所好樂，則不得其正；有所憂患，則不得其正。」</p><p>心為身之主宰，四者之情動於中，則心失其正，而視不見、聽不聞、食不知味矣。正心者，非窒情欲之謂，乃使心常存而不倚，因物之所感而無所累焉。《中庸》云「喜怒哀樂之未發謂之中」，正心之功夫即求此中也。</p><p><strong>所出</strong>：《大學》 — https://zh.wikisource.org/wiki/大學</p></article></main></div></div>
