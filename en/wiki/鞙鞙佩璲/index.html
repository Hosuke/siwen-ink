    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 鞙鞙佩璲，不以其長</nav></header><main><article><h1>鞙鞙佩璲，不以其長</h1><p>佩玉之美不由於才能之長</p><p>鞙鞙，佩玉貌。璲，瑞玉也。言或以其酒，不以其漿；或以鞙鞙之佩璲，不以其才能之長。以見周家用人之顛倒，爵賞不以功，不以德，徒以門蔭而已。</p><p><strong>所出</strong>：《詩經 · 大東》 — https://zh.wikisource.org/wiki/詩經/大東</p></article></main></div></div>
