    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 恬淡寂漠</nav></header><main><article><h1>恬淡寂漠</h1><p>聖人法天地之平，以虛無恬淡為德之質。</p><p>恬淡者，不雕琢以害性也；寂寞者，不喧囂以擾神也；虛無者，不盈滿以窒塞也；無為者，不妄作以乖天也。天地之平由此而立，道德之質由此而成。聖人休休焉，則平易矣；平易則恬淡矣；恬淡則憂患不入，邪氣不侵，故德全而神不虧。</p><p><strong>所出</strong>：《莊子 · 刻意》 — https://zh.wikisource.org/wiki/莊子/刻意</p></article></main></div></div>
