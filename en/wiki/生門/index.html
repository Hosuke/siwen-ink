    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 生門</nav></header><main><article><h1>生門</h1><p>人身前通氣之戶，與密戶相對。</p><p>生門在前，乃一身之氣所出入也。與身後密戶相對，前以通生，後以守藏，二門迭用，人之呼吸往還，性命之機皆由此出。黃庭之學，於生門致虛，於密戶守一，虛實相資，而道術備矣。</p><p><strong>所出</strong>：《黃庭內景經 · 上有章第二》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/上有章第二</p></article></main></div></div>
