    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 二十四真出自然</nav></header><main><article><h1>二十四真出自然</h1><p>修真功至，二十四真人自然成就。</p><p>修真功成，八景神安，二十四真自然涌現於身中。此非外求，乃內煉功深之自然效驗，故云「出自然」。</p><p><strong>所出</strong>：《黃庭內景經 · 治生章第二十三》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/治生章第二十三</p></article></main></div></div>
