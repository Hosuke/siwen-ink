    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 蒙求我</nav></header><main><article><h1>蒙求我</h1><p>童蒙求我匪我求童蒙；陰昧而陽明，陰困童蒙陽能之。</p><p>蒙此一卦陰爻亦先求陽。夫陰昧而陽明，陰困童蒙陽能之。凡不識者求問識者，識者不求所告，闇者求明，明者不諮於闇，故童蒙求我匪我求童蒙也。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷10》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷10</p></article></main></div></div>
