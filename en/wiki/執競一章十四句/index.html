    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 《執競》</nav></header><main><article><h1>《執競》</h1><p>祀武王成康之詩，一章十四句</p><p>《詩經·周頌》篇名也。祀武王、成王、康王之詩。首章以武王之武功起興，次述成康之明德，末言祭享鐘鼓而降福之盛。一章十四句，辭簡義深。《毛詩序》以此詩為祀武王之詩，蓋成康時祀武王述其功烈也。</p><p><strong>所出</strong>：《詩經 · 執競》 — https://zh.wikisource.org/wiki/詩經/執競</p></article></main></div></div>
