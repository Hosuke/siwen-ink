    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 鴻門</nav></header><main><article><h1>鴻門</h1><p>項羽欲擊沛公，項伯解救，沛公脫歸。</p><p>項羽大怒，欲擊沛公。時項羽兵四十萬，號百萬；沛公兵十萬，號二十萬，力不敵。會項伯欲活張良，夜往見良，因以文諭項羽，項羽乃止。</p><p>沛公從百餘騎，驅之鴻門，見謝項羽。項羽曰：「此沛公左司馬曹無傷言之。不然，籍何以生此！」沛公以樊噲、張良故，得解歸。歸，立誅曹無傷。</p><p><strong>所出</strong>：《史記 · 卷008》 — https://zh.wikisource.org/wiki/史記/卷008</p></article></main></div></div>
