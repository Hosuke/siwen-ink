    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 遇人之不淑</nav></header><main><article><h1>遇人之不淑</h1><p>嫁得匪人而終見棄也</p><p>遇人之不淑，[[詩經·中谷有蓷]]次章之辭也。</p><p>言「條其歗矣」，哀嘯之聲不絕，何以致此？《詩》曰「遇人之不淑」，明言其夫之行義有虧，不善也。</p><p>淑，善也。不淑，即不善、不德之謂。女子嫁人而夫不良，終以仳離，此千古之悲也。與首章「遇人之艱難」相較，艱難者時也，不淑者人也；時與人交困，而女子的然無告矣。</p><p>後世詩文多用「遇人不淑」以詠女子所嫁非偶，皆本此詩。</p><p><strong>所出</strong>：《詩經 · 中谷有蓷》 — https://zh.wikisource.org/wiki/詩經/中谷有蓷</p></article></main></div></div>
