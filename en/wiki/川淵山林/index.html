    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 川淵深而魚鼈歸之</nav></header><main><article><h1>川淵深而魚鼈歸之</h1><p>以川淵山林喻政教，民物各歸其居，治亂之本在乎修德。</p><p>川淵深則魚鼈歸之，山林茂則禽獸歸之，刑政平則百姓歸之，禮義備則君子歸之。水深者魚之居，林茂者獸之居，國家者士民之居。水竭則魚龍去，林險則鳥獸去，政失則士民去。是以無土則人不安居，無人而土不守，無道法則人不至，無君子則道不舉。此以自然之理喻政治之要也。</p><p><strong>所出</strong>：《荀子 · 致士篇》 — https://zh.wikisource.org/wiki/荀子/致士篇</p></article></main></div></div>
