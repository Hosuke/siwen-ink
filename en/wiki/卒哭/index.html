    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 卒哭</nav></header><main><article><h1>卒哭</h1><p>三虞之明日，止哭而行卒哭之祭。</p><p>三虞，卒哭。明日，以其班祔。卒哭者，漸漸止哭，以就吉祭也。自此朝夕哭如故，而不奠矣。</p><p><strong>所出</strong>：《儀禮 · 既夕禮》 — https://zh.wikisource.org/wiki/儀禮/既夕禮</p></article></main></div></div>
