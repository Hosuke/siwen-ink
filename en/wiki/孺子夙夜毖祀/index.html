    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 孺子夙夜毖祀</nav></header><main><article><h1>孺子夙夜毖祀</h1><p>成王自勉，旦夕敬慎祭祀，以承天命。</p><p>成王受周公之誨，自誓曰「孺子夙夜毖祀」。毖，慎也。言己雖沖子，當早起夜寐，敬慎祭祀，不敢有怠。祭祀者，事天事祖之禮，亦天命所寄。成王以此自策，明非天降康寧，實在人主之慎終如始也。</p><p><strong>所出</strong>：《尚書 · 洛誥》 — https://zh.wikisource.org/wiki/尚書/洛誥</p></article></main></div></div>
