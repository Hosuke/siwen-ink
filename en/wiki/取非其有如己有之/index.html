    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 取非其有如己有之</nav></header><main><article><h1>取非其有如己有之</h1><p>湯、武兼有夏、商之民地財，用非其有而天下稱仁義，此通乎君道也。</p><p>湯、武一日而盡有夏、商之民，盡有夏、商之地，盡有夏、商之財，以其民安而天下莫敢之危，以其地封而天下莫敢不說，以其財賞而天下皆競，無費乎郼與岐周，而天下稱大仁、稱大義，通乎用非其有。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十五》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十五</p></article></main></div></div>
