    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 庭中生榖</nav></header><main><article><h1>庭中生榖</h1><p>成湯時庭生異榖，早朝晏退、務撫百姓，三日榖亡。</p><p>成湯之時，有榖生於庭，昏而生，比旦而大拱。史請卜其故。湯退卜者曰：「吾聞祥者福之先者也，見祥而為不善則福不至；妖者禍之先者也，見妖而為善則禍不至。」</p><p>於是湯早朝晏退，問疾吊喪，務鎮撫百姓，三日而榖自止。蓋禍兮福之所倚，福兮禍之所伏，聖人所獨見，眾人焉知其極。</p><p><strong>所出</strong>：《呂氏春秋 · 卷六》 — https://zh.wikisource.org/wiki/呂氏春秋/卷六</p></article></main></div></div>
