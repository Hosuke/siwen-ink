    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 戒賔</nav></header><main><article><h1>戒賔</h1><p>主人預告于賔，明射事將舉也。</p><p>主人戒賔，賔出迎，再拜。主人荅再拜，乃請。賔禮辭，許。主人再拜，賔荅再拜。主人退，賔送，再拜。此為射禮之始。《記》云「大夫與，則公士為賔」，公士，鄉之士也。</p><p><strong>所出</strong>：《儀禮 · 鄉射禮》 — https://zh.wikisource.org/wiki/儀禮/鄉射禮</p></article></main></div></div>
