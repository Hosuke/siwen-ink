    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 通天下之志</nav></header><main><article><h1>通天下之志</h1><p>君子以正道會通萬民之心</p><p>「通天下之志」，[[同人]]九五爻辭及[[彖傳]]所述之要義也。</p><p>[[彖曰]]：「唯君子為能通天下之志。」言天下之民億萬，心志各異，惟[[君子]]以其[[文明以健]]、中正之道，合萬心於一德，使天下之志無所壅蔽，皆得交通，無有怨叛。</p><p>[[象曰]]：「君子以類族辨物。」類族者，別其同異；辨物者，明其品分。惟能別同異而無私，故能通之。此聖人[[治天下若治一家]]之心，亦[[絜矩之道]]之先聲也。</p><p><strong>所出</strong>：《周易 · 同人》 — https://zh.wikisource.org/wiki/周易/同人</p></article></main></div></div>
