    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 伯樂治馬</nav></header><main><article><h1>伯樂治馬</h1><p>伯樂以種種法制治馬，馬死者十二三；加以飢渴馳驟，鞭筴之威，死者過半。</p><p>及至伯樂，曰：「我善治馬。」燒之剔之，刻之雒之，連之以羈馽，編之以皐棧，馬之死者十二三矣；飢之渴之，馳之驟之，整之齊之，前有橛飾之患，而後有鞭筴之威，而馬之死者已過半矣。</p><p><strong>所出</strong>：《莊子 · 馬蹄》 — https://zh.wikisource.org/wiki/莊子/馬蹄</p></article></main></div></div>
