    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 君子、小人之反</nav></header><main><article><h1>君子、小人之反</h1><p>君子與小人，心之所存、迹之所著，皆相反也。</p><p>君子，小人之反也。君子大心則敬天而道，小心則畏義而節；知則明通而類，愚則端愨而法；見由則恭而止，見閉則敬而齊；喜則和而理，憂則静而理；通則文而明，窮則約而詳。</p><p>小人則不然：大心則慢而曓，小心則淫而傾，知則攫盜而漸，愚則毒賊而亂；見由則兌而倨，見閉則怨而險；喜則輕而翾，憂則挫而懾；通則驕而偏，窮則弃而儑。</p><p>傳曰：「君子兩進，小人兩廢。」此之謂也。</p><p><strong>所出</strong>：《荀子 · 不苟篇》 — https://zh.wikisource.org/wiki/荀子/不苟篇</p></article></main></div></div>
