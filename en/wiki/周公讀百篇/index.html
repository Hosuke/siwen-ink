    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 周公讀百篇</nav></header><main><article><h1>周公讀百篇</h1><p>周公上聖，日讀百篇，以見聖賢未嘗以才自恃。</p><p>《抱朴子》以古聖為法：「夫周公上聖，而日讀百篇。仲尼天縱，而韋編三絕。墨翟大賢，載文盈車。仲舒命世，不窺園門。倪寬帶經以蕓鉏，路生截蒲以寫書，黃霸抱桎梏以受業，寧子勤夙夜以倍功。」</p><p>夫聖賢稟受既高，猶且勤學若是，故能究覽道奧，窮測微言，[[盛德大業冠於當世]]也。</p><p><strong>所出</strong>：《抱朴子 · 卷03》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷03</p></article></main></div></div>
