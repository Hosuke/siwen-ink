    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 蒲與荷</nav></header><main><article><h1>蒲與荷</h1><p>澤陂之上，蒲葦與蓮花相映也。</p><p>陂，池塘也。蒲，水草，一名香蒲，生於水邊。荷，蓮花也，其葉田田，其華亭亭。詩人以「彼澤之陂，有蒲與荷」起興，見澤畔蒲葦蕭森，荷花映發，美人在是，觸目傷心。景以引情，蓋詩人之常法，而蒲荷清幽，亦以映所思者之美也。</p><p><strong>所出</strong>：《詩經 · 澤陂》 — https://zh.wikisource.org/wiki/詩經/澤陂</p></article></main></div></div>
