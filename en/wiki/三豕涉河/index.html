    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 三豕涉河</nav></header><main><article><h1>三豕涉河</h1><p>類非而是，類是而非；字形相近，傳聞易誤。</p><p>昔者子夏之晉，過衛，有讀史記者曰：「晉師三豕涉河。」子夏曰：「非也，是己亥也。夫『己』與『三』相近，『豕』與『亥』相似。」至於晉而問之，則曰「晉師己亥涉河」也。[[辭多類非而是，多類是而非。是非之經，不可不分，此聖人之所慎也。然則何以慎？緣物之情及人之情以為所聞則得之矣。]]</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十二》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十二</p></article></main></div></div>
