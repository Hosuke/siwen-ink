    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 陰陽並交</nav></header><main><article><h1>陰陽並交</h1><p>陰陽並交者，陽氣先至，陰氣後至，唯至人能行陰陽並交之道。</p><p>帝云：</p><p>至陰虛，天氣絕；至陽盛，地氣不足。陰陽並交，至人之所行。</p><p>陰陽交並者，陽氣先至，陰氣後至。</p><p>是以聖人持診之道，先後陰陽而持之。此明陰陽相隨、氣有先後之理，唯至人乃能行之。</p><p><strong>所出</strong>：《黃帝內經 · 素問第二十四卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第二十四卷</p></article></main></div></div>
