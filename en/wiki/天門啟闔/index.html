    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 天門啟闔</nav></header><main><article><h1>天門啟闔</h1><p>天道之門，開闔有時，能為雌以應之。</p><p>天門啟闔者，天道之門戶也。帛書本云：「天門啟闔，能為雌乎。」言天門者，造化之門也，一闔一啟，陰陽迭用。聖人法之，能為雌者，柔弱靜處，不先動而後應，以虛無之情，守柔弱之道，則與天合德。雌者，陰也，主靜也。啟闔者，動也；為雌者，靜也。動中守靜，剛中懷柔，此與道玄同之要也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章十》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
