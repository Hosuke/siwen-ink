    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 為人臣不難免其君</nav></header><main><article><h1>為人臣不難免其君</h1><p>臣子以死免其君者，不可戮之以勸事君。</p><p>逢醜父與齊侯易位，將及華泉，驂絓於木而止。醜父寤於轏中，蛇出於其下，以肱擊之，傷而匿之，故不能推車而及。韓厥執縶馬前，再拜稽首，奉觴加璧以進。郤獻子將戮醜父，呼曰：「自今無有代其君任患者，有一於此，將為戮乎。」郤子曰：「人不難以死免其君，我戮之不祥。赦之以勸事君者。」乃免之。</p><p><strong>所出</strong>：《春秋左氏傳 · 成公》 — https://zh.wikisource.org/wiki/春秋左氏傳/成公</p></article></main></div></div>
