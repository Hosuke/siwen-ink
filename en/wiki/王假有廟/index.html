    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 王假有廟</nav></header><main><article><h1>王假有廟</h1><p>王者至廟以凝聚人心之散</p><p>「渙：亨。王假有廟，利涉大川，利貞」。</p><p>王假有廟者，鄭玄云「假，至也」，王者至於宗廟，格於祖考。人心散則離，居廟以聚之，是渙之正道也。</p><p><strong>所出</strong>：《周易 · 渙》 — https://zh.wikisource.org/wiki/周易/渙</p></article></main></div></div>
