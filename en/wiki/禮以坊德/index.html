    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 禮以坊德</nav></header><main><article><h1>禮以坊德</h1><p></p><p>「禮以坊德」出自《禮記·坊記》，原文云：「故君子禮以坊德，刑以坊淫，命以坊欲。」此三者構成治民之大法：禮以防範於前，刑以禁制於後，命以節制其欲。</p><p>「坊」者，堤防之義。水之為物，無堤防則氾濫；人之情欲，無禮法則逾越。故聖人制禮樂、明教化，使民自然而然趨於善道，不待刑罰而後止。此所謂「防患於未然」者也。</p><p>《坊記》全篇皆論「坊」之道，以禮坊德，以刑坊淫，以命坊欲。其要義在於：治國者當先為民立「坊」，使民有所遵循，有所節制，自然不入於邪惡。與[[禮-儒學-之]]所言禮之功能相發明。</p></article></main></div></div>
