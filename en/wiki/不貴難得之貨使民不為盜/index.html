    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 不貴難得之貨使民不為盜</nav></header><main><article><h1>不貴難得之貨使民不為盜</h1><p>不貴難得之貨則盜不作。</p><p>貴者，隆之稱也。難得之貨，競趣穿窬探篋，沒命而盜。不貴之，則盜無由生。</p><p><strong>所出</strong>：《道德經 (王弼本) · 三章》 — https://zh.wikisource.org/wiki/道德經 (王弼本》</p></article></main></div></div>
