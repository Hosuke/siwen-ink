    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 事善能</nav></header><main><article><h1>事善能</h1><p>上善之行事若水之就下，因其自然無所不能也。</p><p>「事善能」者，言上善之臣事其上，若水之趨下，不待用力而自然能之。水之為物，就溼而流，因方而圓，遇阻而讓，無所不堪，是其能也。聖人法之，以柔弱勝剛強，以不爭席萬物。</p><p><strong>所出</strong>：《老子 (帛書本) · 章八》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
