    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 秋官司寇</nav></header><main><article><h1>秋官司寇</h1><p>周代掌刑罰糾禁之官署</p><p>秋官司寇，為天官之一，掌邦禁以佐王刑邦國。其官屬自大司寇至家士，凡七十餘職。民有詞訴，則訊之以五刑；邦有大事，則禁之以五禁。刑期無刑，明慎用罪，周之治道備矣。</p><p><strong>所出</strong>：《周禮 · 秋官司寇》 — https://zh.wikisource.org/wiki/周禮/秋官司寇</p></article></main></div></div>
