    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 獨行之國</nav></header><main><article><h1>獨行之國</h1><p>心行天下者，四方所歸；獨王之國者，多禍無威。</p><p>四方所歸，心行者也。獨王之國，勞而多禍；獨國之君，卑而不威。夫心行者，以心感人，以德化人，不以威刑迫之，而人自歸也。獨王者，恃其威勢，絕人之心，自以為尊，而不知其孤立也。自媒之女，醜而不信；未之見而親焉，可以往矣。是以聖人之心，如水之善下，如谷之虛受，故能成其大。</p><p><strong>所出</strong>：《管子 · 第02篇形勢》 — https://zh.wikisource.org/wiki/管子/第02篇形勢</p></article></main></div></div>
