    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 祝延</nav></header><main><article><h1>祝延</h1><p>祝在前導引尸升堂，致恭敬也。</p><p>祝延者，祝導引尸升堂之儀也。士虞禮云：「尸及階，祝延尸。尸升，宗人詔踊如初。」延者，引而進之也。尸將升堂，祝居前而導之，使無遲疑之意。祝延之禮，所以致恭敬於神尸，亦所以成主人之孝心者也。</p><p><strong>所出</strong>：《儀禮 · 士虞禮》 — https://zh.wikisource.org/wiki/儀禮/士虞禮</p></article></main></div></div>
