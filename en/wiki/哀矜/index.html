    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 哀矜</nav></header><main><article><h1>哀矜</h1><p>哀矜者，矜憐困厄之情也。怨人者出於情難安而猶可恕，驕人者無故而慢人則不可恕。</p><p>人貧則怨人，富則驕人。怨人者，苦人之不祿施於己也，起於情所難安而不能安，猶可恕也。驕人者，無苦而無故驕人，此情所易制而弗能制，弗可恕矣。眾人見貧賤則慢而疏之，見富貴則敬而親之。貧賤者，有請賕於己，疏之可也；富貴者，有施與己，親之可也。三者獨立，無致親致疏之所，人情終不能不以貧賤富貴易慮。</p><p><strong>所出</strong>：《尹文子 · 大道下》 — https://zh.wikisource.org/wiki/尹文子/大道下</p></article></main></div></div>
