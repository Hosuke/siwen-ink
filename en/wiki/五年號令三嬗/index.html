    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 五年號令三嬗</nav></header><main><article><h1>五年號令三嬗</h1><p>五年之間，號令三變，自古未有其速。</p><p>太史公曰：「五年之閒，號令三嬗。自生民以來，未始有受命若斯之亟也。」自陳涉發難至漢家踐祚，首尾不過五年。陳涉首難，項氏誅暴，漢家受命，號令三變之速，實自古所未有。</p><p><strong>所出</strong>：《史記 · 卷016》 — https://zh.wikisource.org/wiki/史記/卷016</p></article></main></div></div>
