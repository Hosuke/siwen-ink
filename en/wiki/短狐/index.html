    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 短狐</nav></header><main><article><h1>短狐</h1><p>短狐，一名蜮，能射人影為瘡，治之必死。</p><p>抱朴子述江南山谷之毒蟲：「又有短狐，一名蜮，一名射工，一名射影，其實水蟲也，狀如鳴蜩，狀似三合杯，有翼能飛，無目而利耳，口中有橫物角弩，如聞人聲，緣口中物如角弩，以氣為矢，則因水而射人，中人身者即發瘡，中影者亦病，而不即發瘡，不曉治之者煞人。其病似大傷寒，不十日皆死。」</p><p><strong>所出</strong>：《抱朴子 · 卷17》 — https://zh.wikisource.org/wiki/抱朴子/卷17</p></article></main></div></div>
