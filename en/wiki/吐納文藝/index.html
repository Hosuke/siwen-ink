    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 吐納文藝</nav></header><main><article><h1>吐納文藝</h1><p>文思貴在吐故納新，節宣有度。</p><p>吐納文蓺，務在節宣。夫思有利鈍，時有通塞，神之方昏，再三愈黷。是以為文者，當清和其心，條暢其氣，煩而即捨，勿使壅滯。意得則舒懷以命筆，理伏則投筆以卷懷。譬如水停以鑒，火靜而朗，無擾文慮，鬱此精爽。劉勰引曹公懼為文之傷命、陸雲歎用思之困神，以為非虛談。蓋文思之來去，如四時之推移，不可强致，亦不可强遏。逍遙以針勞，談笑以藥倦，常弄閒於才鋒，賈餘於文勇，使刃發如新，腠理無滯，此則養氣之效也。</p><p><strong>所出</strong>：《文心雕龍 · 養氣》 — https://zh.wikisource.org/wiki/文心雕龍/養氣</p></article></main></div></div>
