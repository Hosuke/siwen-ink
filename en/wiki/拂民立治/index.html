    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 拂民立治</nav></header><main><article><h1>拂民立治</h1><p>明主雖拂民心，然必立其法度，以成治功。</p><p>人主者，明能知治，嚴必行之，故雖拂於民，必立其治。商君之內外而鐵殳，重盾而豫戒；郭偃之始治，文公有官卒；管仲之始治，桓公有武車：皆戒民之備也。是以遇惰窳之民，苦小費而忘大利者，皆非明主所取。</p><p><strong>所出</strong>：《韓非子 · 南面》 — https://zh.wikisource.org/wiki/韓非子/南面</p></article></main></div></div>
