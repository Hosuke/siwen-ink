    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 君之過也</nav></header><main><article><h1>君之過也</h1><p>臣殺其君，實君有以致之；失威縱姦，是自取滅亡。</p><p>晉人殺厲公，邊人以告，成公在朝，問臣殺其君誰之過。大夫莫對，里革曰：「君之過也。夫君人者，其威大矣。失威而至於殺，其過多矣。君縱私回而棄民事，民旁有慝無由省之，益邪多矣。用善不肯專，則不能使，至於殄滅而莫之恤。桀奔南巢，紂踣于京，厲流于彘，幽滅于戲，皆是術也。夫君也者，民之川澤也，行而從之，美惡皆君之由，民何能為焉？」</p><p><strong>所出</strong>：《國語 · 卷04》 — https://zh.wikisource.org/wiki/國語/卷04</p></article></main></div></div>
