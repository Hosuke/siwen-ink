    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 歲三田</nav></header><main><article><h1>歲三田</h1><p>天子諸侯歲以三時田獵，一乾豆，二賓客，三充庖。</p><p>天子諸侯无事則歲三田：一為乾豆，二為賓客，三為充君之庖。无事而不田，曰不敬；田不以禮，曰暴天物。</p><p>天子不合圍，諸侯不掩群。天子殺則下大綏，諸侯殺則下小綏，大夫殺則止佐車。佐車止，則百姓田獵。</p><p>獺祭魚，然後虞人入澤梁。豺祭獸，然後田獵。鳩化為鷹，然後設罻羅。草木零落，然後入山林。昆蟲未蟄，不以火田。不麛，不卵，不殺胎，不殀夭，不覆巢。</p><p><strong>所出</strong>：《禮記 · 王制》 — https://zh.wikisource.org/wiki/禮記/王制</p></article></main></div></div>
