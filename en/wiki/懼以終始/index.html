    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 懼以終始</nav></header><main><article><h1>懼以終始</h1><p>君子於《易》之道，懼而慎之，自始至终，不敢懈也。</p><p>《易傳》論《易》之道，以懼終始。《易》之興也，辭危。危者使平，易者使傾，君子居安思危，故其辭危。辭危者，非自擾也，乃戒懼之心發於言也。懼以終始者，自初至末，念念不放也。夫《易》道甚大，百物不廢，而君子懼之；懼之，正所以全之也。能懼則身安，不知懼則傾覆隨之，此聖人之情見乎辭者矣。</p><p><strong>所出</strong>：《周易 · 繫辭下》 — https://zh.wikisource.org/wiki/易傳/繫辭下</p></article></main></div></div>
