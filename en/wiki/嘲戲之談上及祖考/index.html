    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 嘲戲之談上及祖考</nav></header><main><article><h1>嘲戲之談上及祖考</h1><p>嘲戲之言上辱祖先，下及婦女，其害深矣。</p><p>嘲戲之談，或上及祖考，或下逮婦女。往者務其必深焉，報者恐其不重焉。倡之者不慮見答之後患，和之者恥於言輕之不塞。周禾之芟，溫麥之刈，實由報恨，不能已也。</p><p>夫言行者，身之樞機，榮辱之主。發言不慎，則怨咎隨之；嘲戲無節，則仇怨日積。故[[言有召禍也]]，豈虛言哉！是以君子慎言，耻言人之父母先祖，小人則不然，務以其嘲為能事，殊不知禍患之來，正由於此。</p><p><strong>所出</strong>：《抱朴子 · 卷25》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷25</p></article></main></div></div>
