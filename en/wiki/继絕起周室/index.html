    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 继絕起周室之祀</nav></header><main><article><h1>继絕起周室之祀</h1><p>當周室衰微之時，天子幼弱，諸侯強盛。宜扶弱抑強，繼絕諸侯，以興周室。</p><p>桓公問：「當世之王者，何行而可？」管仲對以[[帝王之道]]備矣，不可加也，「公其行義而已矣」。公又問行義奈何。管仲對曰：「天子幼弱，諸侯亢强，聘享不上。公其弱强繼絕，率諸侯以起周室之祀。」</p><p><strong>所出</strong>：《管子 · 第84篇輕重戊》 — https://zh.wikisource.org/wiki/管子/第84篇輕重戊</p></article></main></div></div>
