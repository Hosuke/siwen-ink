    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 辯慧亂之贊</nav></header><main><article><h1>辯慧亂之贊</h1><p>巧辯慧黠，反為亂政之助</p><p>《商君書 · 卷五》[[外內]]篇記淫道之目：為辯知者貴，游宦者任，文學私名顯之謂也。三者不塞，則民不戰而事失矣。又[[君臣]]篇云：釋法而以知，背功而以譽。瞋目扼腕而語勇者得，垂衣裳而談說者得，故農戰之民日寡而游食者愈眾。</p><p>  <strong>所出</strong>：《商君書 · 卷五》 — https://zh.wikisource.org/wiki/商君書/卷五</p></article></main></div></div>
