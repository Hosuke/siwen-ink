    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 師紀姓名譜</nav></header><main><article><h1>師紀姓名譜</h1><p>述天師傳授鬼神姓名之譜系。</p><p>師紀姓名譜曰：高天萬丈鬼百鬼中皇姓，係天六方鬼之主。南鄉三老鬼俗五道鬼姓車名匿。雲中無頭壞軍死將逆惡大鬼姓李名三可。北斗三台招搖大鬼姓伴名玩。此天師所傳鬼神譜系，學道者當記之，以備辟鬼之用。</p><p><strong>所出</strong>：《女青鬼律 · 卷1》 — https://zh.wikisource.org/wiki/女青鬼律/卷1</p></article></main></div></div>
