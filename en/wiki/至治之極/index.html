    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 至治之極</nav></header><main><article><h1>至治之極</h1><p>至治之世，民安其俗，樂其業，老死不相往來。</p><p>老子曰：「至治之極，鄰國相望，雞狗之聲相聞，民各甘其食，美其服，安其俗，樂其業，至老死，不相往來。」太史公引之以為治世之極功，然亦云：「必用此為務，輓近世涂民耳目，則幾無行矣。」蓋明乎時移世易，聖人之言亦不可膠柱鼓瑟也。</p><p><strong>所出</strong>：《史記 · 卷129》 — https://zh.wikisource.org/wiki/史記/卷129</p></article></main></div></div>
