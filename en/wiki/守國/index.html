    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 守國</nav></header><main><article><h1>守國</h1><p>守國當法天地之常，因四時生殺之序，以仁聖之道牧民。</p><p>文王齋七日，北面再拜而問太公守國之道。太公曰：「天生四時，地生萬物。天下有民，聖人牧之。故春道生，萬物榮；夏道長，萬物成；秋道斂，萬物盈；冬道藏，萬物靜。盈則藏，藏則復起。莫知所終，莫知所始。聖人配之，以為天地經紀。」</p><p>又曰：「天下治，仁聖藏；天下亂，仁聖昌，至道其然也。聖人之在天地間也，其寶固大矣。因其常而視之，則民安。」</p><p>又言守國當如天地同光，[[清靜之治]]之旨也。</p><p><strong>所出</strong>：《六韜》 — https://zh.wikisource.org/wiki/六韜</p></article></main></div></div>
