    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 善言害法</nav></header><main><article><h1>善言害法</h1><p>法已既定，不可以動聽之言動搖之。</p><p>韓非云「法已定矣，不以善言害法」。法者，治國之器也；善言者，動聽之說也。法一定而善言易之，是無所準的也。姦言借口於善說，則法不行；邪說假名於仁義，則姦益滋。是故明主治法，必守一定之規，不可以言移法，不可以情撓法。</p><p><strong>所出</strong>：《韓非子 · 飭令》 — https://zh.wikisource.org/wiki/韓非子/飭令</p></article></main></div></div>
