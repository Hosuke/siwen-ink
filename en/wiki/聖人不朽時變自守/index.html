    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 聖人不朽，時變自守</nav></header><main><article><h1>聖人不朽，時變自守</h1><p>《鬼谷子》以為聖人之所以不滅，以其能因時之變而守虛無之常。</p><p>《說苑》引《鬼谷子》曰：「聖人不朽，時變自守。虛者道之常也，因者君之綱。」《索隱》謂出《鬼谷子》，司馬遷引之以成其章。蓋言聖人之道，不隨世變而磨滅，唯順時守虛，乃為長久之法。因者，因時之變也；虛者，道之常體也。《漢書》顏師古注「朽」作「巧」，云「無機巧之心，但順時也」，義亦相通。</p><p><strong>所出</strong>：《鬼谷子 · 鬼谷子附録》 — https://zh.wikisource.org/wiki/鬼谷子/鬼谷子附録</p></article></main></div></div>
