    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 忌之害</nav></header><main><article><h1>忌之害</h1><p>忌賢害能，國之杌隉。</p><p>人之有技，冒嫉以惡之；人之彥聖，而違之，俾不達，是不能容。</p><p>忌者，姦臣之常情也。彼嫉賢者，非徒嫉之，又加以害；非徒不加舉，且抑遏之，使不得通達於上。夫如是，則賢者退而不敢進，智者隱而不敢出，小人得志，國家隨之而危。</p><p>是不能保我子孫黎民，亦曰殆哉。殆者，危亡之謂也。夫忌之一字，敗人家國，喪人事業，小則失士，大則覆邦，可不戒諸。</p><p><strong>所出</strong>：《尚書 · 秦誓》 — https://zh.wikisource.org/wiki/尚書/秦誓</p></article></main></div></div>
