    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 三權</nav></header><main><article><h1>三權</h1><p>天以時、地以財、人以力、君以令，號稱四權，而守之有道。</p><p>管子以權數為治國之要。權有四端：天以時，地以財，人以力，君以令。四者相維，而失其一則三者皆亡。湯七年旱、禹五年水，湯以莊山之金、禹以歷山之金鑄幣贖民，而嘆「天權失，人地之權皆失」。是以明主歲守十分之參，藏粟以備凶年，使民無入於溝壑。行三權之道者，必通廣狹之數，達輕重之術，以軌守其數，准平其流，動於未形，守事已成，此之謂准道。</p><p><strong>所出</strong>：《管子 · 第75篇山權數》 — https://zh.wikisource.org/wiki/管子/第75篇山權數</p></article></main></div></div>
