    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 南北宗源</nav></header><main><article><h1>南北宗源</h1><p>聖胎凝結，和氣薰蒸，水火自相烹煎</p><p>南北宗源翻卦象者，南為火，北為水，聖胎凝結，和氣薰蒸，水火歸於宗源，自相烹煎，任其天然，勿忘勿助之功也。晨昏火候合天樞者，晨為一日之首，陽氣用事；昏為一夜之首，陰氣用事。天樞者，陰陽之氣機，當陽而用陽，當陰而用陰，火候進退，暗合晨昏之機，日乾夕惕之功也。</p><p><strong>所出</strong>：《悟真直指 · 卷一》 — https://zh.wikisource.org/wiki/悟真直指/卷一</p></article></main></div></div>
