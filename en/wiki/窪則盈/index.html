    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 窪則盈</nav></header><main><article><h1>窪則盈</h1><p>窪下則盈</p><p>水之窪者，厥量彌大而無盈滿之患。物之理亦然：心能虛者，納善若谷；志能下者，積德若淵。是以聖人法水之善下，處眾人之所惡，故能成其大。</p><p><strong>所出</strong>：《道德經 (王弼本) · 二十二章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p><hr><p>見 [[曲則全]]。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第六十七章 執一》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
