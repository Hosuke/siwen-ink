    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 天下式</nav></header><main><article><h1>天下式</h1><p>聖人為法使天下不忒。</p><p>知其白，守其黑，為天下式。白者昭明，黑者闇昧。知昭明之可貴，而守闇昧之質，是為天下式。式者法也、表也、模範也。聖人為天下之式，常德不忒。忒者差也、變也。常德者永恆不易之德，不忒者無差失也。聖人垂為楷式於天下，使萬物有所準的，不至差忒。修德如此，復歸於無極。無極者道之本體，空虛廣大，無所不容，非有窮極也。</p><p><strong>所出</strong>：《老子河上公章句 · 反朴》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
