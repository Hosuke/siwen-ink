    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 東方之人</nav></header><main><article><h1>東方之人</h1><p>東方之人形性與地宜</p><p>東方川穀之所注，日月之所出。其人兌形小頭，鼻炎口大，鳧肩企行，竅通於目，筋氣屬焉，蒼色主肝，長大早知而不壽。其地宜麥，多虎豹。</p><p><strong>所出</strong>：《淮南子 · 墜形訓》 — https://zh.wikisource.org/wiki/淮南子/墜形訓</p></article></main></div></div>
