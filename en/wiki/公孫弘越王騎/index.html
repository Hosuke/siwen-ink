    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 公孫弘越王騎</nav></header><main><article><h1>公孫弘越王騎</h1><p>斷髪為人用兵，而人以斷頸相較，是各為其主。</p><p>公孫弘斷髪而為越王騎，公孫喜使人絶之，曰：「吾不與子為昆弟矣。」公孫弘曰：「我斷髪，子斷頸而為人用兵，我將謂子何？」周南之戰，公孫喜死焉。</p><p><strong>所出</strong>：《韓非子 · 說林下》 — https://zh.wikisource.org/wiki/韓非子/說林下</p></article></main></div></div>
