    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 遺之以利</nav></header><main><article><h1>遺之以利</h1><p>德六興之一：導水潦、利陂溝、通津梁，以遺民以水利之便。</p><p>六興之一曰遺之以利。[[德有六興]]所屬也。導水潦，利陂溝，決潘渚，潰泥滯，通鬱閉，慎津梁。導溝瀆以行水，決淤塞以通流，修津梁以便民，此皆遺之以利之實也。</p><p><strong>所出</strong>：《管子 · 第10篇五輔》 — https://zh.wikisource.org/wiki/管子/第10篇五輔</p></article></main></div></div>
