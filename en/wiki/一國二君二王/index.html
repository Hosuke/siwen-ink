    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 一國二君二王</nav></header><main><article><h1>一國二君二王</h1><p>商賈乘時射利致君國失權之患</p><p>管子言：「萬乘之國，必有萬金之賈。千乘之國，必有千金之賈。百乘之國，必有百金之賈。非君之所賴也，君之所與。故爲人君而不審其號令，則中一國而二君二王也。」</p><p>夫商賈之積餘藏羨者，乘民之時而射利，則物價輕去其分，皆入於商賈。貧者失其財，是重貧也；農夫失其五穀，是重竭也。君不能謹守其山林菹澤草萊，不可以立爲天下王。</p><p><strong>所出</strong>：《管子 · 第80篇輕重甲》 — https://zh.wikisource.org/wiki/管子/第80篇輕重甲</p></article></main></div></div>
