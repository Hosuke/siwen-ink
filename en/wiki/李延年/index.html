    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 李延年</nav></header><main><article><h1>李延年</h1><p>中山樂人，以新聲見幸，佩二千石印，後與中人亂誅死</p><p>李延年，中山人也。父母及身兄弟及女，皆故倡也。延年坐法腐，給事狗中。平陽公主言延年女弟善舞，上見，心說之，及入永巷而召貴延年。延年善歌，為變新聲，上方興天地祠，欲造樂詩歌弦之，延年善承意，弦次初詩。其女弟亦幸，有子男。延年佩二千石印，號協聲律，與上臥起，甚貴幸，埒如韓嫣。久之，浸與中人亂，出入驕恣。及其女弟李夫人卒後，愛弛，禽誅延年昆弟也。</p><p><strong>所出</strong>：《史記 · 卷125》 — https://zh.wikisource.org/wiki/史記/卷125</p></article></main></div></div>
