    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 甘心首疾</nav></header><main><article><h1>甘心首疾</h1><p>甘心以思成疾，言相思之深、無所悔也。</p><p>「甘心首疾」，語出《伯兮》。言雖以思致疾，甘心不以為苦也。「首疾」者，頭目之疾，蓋思之深而然。願思其人，雖至於疾，猶甘心焉。</p><p>後世以「甘心疾首」「首疾」言思念之苦，皆本此。</p><p><strong>所出</strong>：《詩經 · 伯兮》 — https://zh.wikisource.org/wiki/詩經/伯兮</p></article></main></div></div>
