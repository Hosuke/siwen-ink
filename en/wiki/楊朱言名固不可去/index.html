    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 楊朱言名固不可去</nav></header><main><article><h1>楊朱言名固不可去</h1><p>楊朱以為名不可去、名不可賓，慕名者雖知其苦而不能已，唯當守名而不累實。</p><p>楊朱曰：「去名者無憂」，老子曰「名者實之賓」，而悠悠者趨名不已。名固不可去，名固不可賓邪？今有名則尊榮，亡名則卑辱；尊榮則逸樂，卑辱則憂苦。名胡可去？名胡可賓？但惡夫守名而累實。守名而累實，將恤危亡之不救，豈徒逸樂憂苦之間哉？</p><p><strong>所出</strong>：《列子 · 楊朱篇》 — https://zh.wikisource.org/wiki/列子/楊朱篇</p></article></main></div></div>
