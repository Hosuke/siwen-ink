    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 麗辭</nav></header><main><article><h1>麗辭</h1><p>對偶之美，偶意逸韻之文也。</p><p>造化賦形，支體必雙，神理為用，事不孤立。夫心生文辭，運裁百慮，高下相須，自然成對。</p><p>自[[揚雄]]、司馬[[相如]]、張[[衡]]、[[蔡邕]]，崇盛麗辭，如宋畫吳冶，刻形鏤法，麗句與深采並流，偶意共逸韻俱發。然契機者入巧，浮假者無功。氣無奇類，文乏異采，碌碌麗辭，則昏睡耳目。必使理圓事密，聯璧其章。迭用奇偶，節以雜佩，乃其貴耳。</p><p><strong>所出</strong>：《文心雕龍 · 麗辭》 — https://zh.wikisource.org/wiki/文心雕龍/麗辭</p></article></main></div></div>
