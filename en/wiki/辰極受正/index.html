    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 辰極受正</nav></header><main><article><h1>辰極受正</h1><p>北辰居中正之位，君主法之，任賢使能，優游無為。</p><p>辰極受正，優游任下。明堂布政，國無害道。</p><p>辰極，北辰也，居天之中，主正萬方。[[文昌統錄]]以詰責百官，[[明堂布政]]以宣布政令，而[[辰極受正]]以法天行之健。君馭臣以道，不侵臣職，則上下各安其位，此[[弦望盈縮]]不失其序之本也。</p><p><strong>所出</strong>：《周易參同契 · 05章》 — https://zh.wikisource.org/wiki/周易參同契/05章</p></article></main></div></div>
