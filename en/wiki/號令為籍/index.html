    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 號令為籍</nav></header><main><article><h1>號令為籍</h1><p>先王不求於民，而以號令斂財。</p><p>先王知其然，故不求於萬民，而籍於號令也。</p><p>令曰十日而具，則財物之賈什去一；令曰八日而具，則財物之賈什去二；令曰五日而具，則財物之賈什去半；朝令而夕具，則財物之賈什去九。</p><p><strong>所出</strong>：《管子 · 第73篇國蓄》 — https://zh.wikisource.org/wiki/管子/第73篇國蓄</p></article></main></div></div>
