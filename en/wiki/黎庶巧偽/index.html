    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 黎庶巧偽，趨利忘義</nav></header><main><article><h1>黎庶巧偽，趨利忘義</h1><p>論民性巧詐，非刑罰不能整齊</p><p>黎庶巧偽，趨利忘義。若不齊之以威，糾之以刑，遠羨羲農之風，則亂不可振，其禍深大。以殺止殺，豈樂之哉！</p><p><strong>所出</strong>：《抱朴子 · 卷14》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷14</p></article></main></div></div>
