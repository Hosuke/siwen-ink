    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 風之積也不厚</nav></header><main><article><h1>風之積也不厚</h1><p>水積厚則負大舟，風積厚則負大翼，無厚不可以圖南。</p><p>且夫水之積也不厚，則負大舟也無力。覆杯水於坳堂之上，則芥為之舟；置杯焉則膠，水淺而舟大也。風之積也不厚，則其負大翼也無力。故九萬里，則風斯在下矣，而後乃今培風；背負青天而莫之夭閼者，而後乃今將圖南。</p><p>物之能有所成，必待其積之厚。鵬之圖南，非風厚則不能負其翼；水之浮舟，非積深則不能載其重。厚積然後可以致遠，此聖人之所以貴積德也。</p><p><strong>所出</strong>：《莊子 · 逍遙遊》 — https://zh.wikisource.org/wiki/莊子/逍遙遊</p></article></main></div></div>
