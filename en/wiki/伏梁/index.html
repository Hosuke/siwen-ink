    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 伏梁</nav></header><main><article><h1>伏梁</h1><p>論伏梁之病，居腸胃之外，裹大膿血，有逆從之辨。</p><p>黃帝問有病少腹盛、上下左右皆有根者。歧伯曰：「病名曰伏梁。裹大膿血，居腸胃之外，不可治，治之每切按之致死。」此乃下則因陰必下膿血，上則迫胃脘，生鬲俠胃脘內癰。居臍上為逆，居臍下為從。又有一種，風根也，其氣溢於大腸而著於肓，肓之原在臍下，環臍而痛，名亦曰伏梁。不可動之，動之則為水溺濇之病。</p><p><strong>所出</strong>：《黃帝內經 · 素問第十一卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十一卷</p></article></main></div></div>
