    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 終日彌夕或無一言</nav></header><main><article><h1>終日彌夕或無一言</h1><p>終日終夕，可以無一言；言不在多，適時而發而已。</p><p>抱朴子述玄泊先生云：「括鋒穎而如訥韜，修翰於彤管，含金懷玉，抑謐華辯，<strong>終日彌夕，或無一言</strong>。」言其斂華歸實，不以多言自炫；待其意得而後發，故能不失言之機。</p><p><strong>所出</strong>：《抱朴子 · 卷51》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷51</p></article></main></div></div>
