    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 從心所欲不逾矩</nav></header><main><article><h1>從心所欲不逾矩</h1><p>七十而從心所欲，亦不越規矩，道德至於化境。</p><p>《論語》載孔子自述云：「七十而從心所欲，不逾矩。」言人生七十，則所欲者莫非天理之自然，而規模法度不能越也。從心者，縱心之所欲也；不逾矩者，動皆中節也。蓋修養之極，渾然天成，無待勉強。此聖人之所以爲聖也。</p><p><strong>所出</strong>：《論語 · 爲政第二》 — https://zh.wikisource.org/wiki/論語/爲政第二</p></article></main></div></div>
