    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 黃景華</nav></header><main><article><h1>黃景華</h1><p>漢司空黃瓊女，密修至要，師韓君受岷山丹方，位協晨夫人，總教授之。</p><p>黃景華者，漢司空黃瓊之女也。景華少好仙道，常密修至要，後師韓君，授其岷山丹方，服之，得入易遷宮，位為協晨夫人，領九宮諸神女，亦總教授之。</p><p><strong>所出</strong>：《墉城集仙錄 · 卷07》 — https://zh.wikisource.org/wiki/墉城集仙錄/卷07</p></article></main></div></div>
