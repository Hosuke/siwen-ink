    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 令終有俶</nav></header><main><article><h1>令終有俶</h1><p>令終之善，乃俶之端。</p><p>《詩》曰「令終有俶」，言善終者必有待焉。《毛傳》云：「俶，始也。」夫物不可以終已，終則有始，如果之熟必有核也。人之德行亦然：始之善易，終之善難。令終者，美其結果也；而俶出於令終者，美其承嗣也。《，既醉》言「高朗令終，令終有俶」，正謂明哲保身、持盈守成者，其終也有耀光，而啟佑子孫，端由於此。後世言「慎終如始」，義本此也。</p><p><strong>所出</strong>：《詩經 · 既醉》 — https://zh.wikisource.org/wiki/詩經/既醉</p></article></main></div></div>
