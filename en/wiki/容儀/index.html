    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 容儀</nav></header><main><article><h1>容儀</h1><p></p><p><strong>容儀</strong>者，人之容貌威儀所以接物待人者也。《禮記·玉藻》詳載其制，為後世禮書之楷模。</p><p>首節言君子日常之容：「足容重，手容恭，目容端，口容止，聲容靜，頭容直，氣容肅，立容德，色容莊，坐如尸，燕居告溫溫。」</p><p>足容重者，步履安重，不輕佻也；手容恭者，拱手而立，不敢肆也；目容端者，視瞻正直，不邪視也；口容止者，未言則緘口，不妄語也；聲容靜者，不喧譁也；頭容直者，不傾斜也；氣容肅者，呼吸</p></article></main></div></div>
