    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 惇典殷獻民</nav></header><main><article><h1>惇典殷獻民</h1><p>周公令成王敬遇殷商遺民之賢者。</p><p>周公命成王相宅洛邑，誡之曰：「其大惇典殷獻民。」惇，厚也；典，常也。言當厚待殷商遺民之賢能者，使之各安其位，國家乃定。周初封建，殷民內遷，洛邑新邑，四方輻輳，周公於此丁寧囑咐，以懷柔為本，不用威迫，實開成康治世之基。</p><p><strong>所出</strong>：《尚書 · 洛誥》 — https://zh.wikisource.org/wiki/尚書/洛誥</p></article></main></div></div>
