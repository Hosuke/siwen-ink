    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 田橫恥北面</nav></header><main><article><h1>田橫恥北面</h1><p>昔與漢王俱南面稱孤，今不忍北面為臣。</p><p>田橫謝使者，止於尸鄉，謂其客曰：「橫始與漢王俱南面稱孤，今漢王為天子，而橫乃為亡虜而北面事之，其恥固已甚矣。」</p><p>橫起兵以來，嘗與項羽、劉邦分庭抗禮。一旦敗亡，若俯首稱臣，是屈於一人之下，而失天下之望。是以寧死不受辱，維護其尊嚴。</p><p><strong>所出</strong>：《史記 · 卷094》 — https://zh.wikisource.org/wiki/史記/卷094</p></article></main></div></div>
