    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 形累事充</nav></header><main><article><h1>形累事充</h1><p>形雖大不能累其體，事雖殷不能充其量</p><p>王弼疏曰：「形雖大，不能累其體，事雖殷，不能充其量。」夫有形者，天地之形也；有事者，萬物之事也。形而上者道，形而下者器。形大於道，猶事殷於道；累之不能自累，充之不能自充。及其推廣言之，天地不能累其體，萬物不能充其量。惟道沖虛不盈，故形累事充之辨明。有形者，累於自有；無為者，充於虛中。</p><p><strong>所出</strong>：《道德經 (王弼本) · 四章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
