    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 肆之而已，勿壅勿閼</nav></header><main><article><h1>肆之而已，勿壅勿閼</h1><p></p><p>晏平仲問養生於管夷吾。管夷吾以「肆之而已，勿壅勿閼」答之。其義已見 [[晏平仲問養生]] 條。</p><p>  <strong>所出</strong>：《列子 · 楊朱篇》 — https://zh.wikisource.org/wiki/列子/楊朱篇</p></article></main></div></div>
