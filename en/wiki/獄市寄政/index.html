    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 獄市寄政</nav></header><main><article><h1>獄市寄政</h1><p>參戒後相，以獄市為寄，慎勿擾之。</p><p>參將入漢為相，囑其後相曰：「以齊獄市為寄，慎勿擾也。」後相不解，曰：「治無大於此者乎？」參曰：「不然。夫獄市者，所以并容也，今君擾之，姦人安所容也？吾是以先之。」蓋姦人與良民並處於市，禁之過嚴，則姦無所容，必至生變。是以聖人不去獄市，正以并容為治也。</p><p><strong>所出</strong>：《史記 · 卷054》 — https://zh.wikisource.org/wiki/史記/卷054</p></article></main></div></div>
