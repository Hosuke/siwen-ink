    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 譬彼舟流，不知所屆</nav></header><main><article><h1>譬彼舟流，不知所屆</h1><p>以舟之隨流無主，比人之飄蕩失所，不知所止也。</p><p>《小弁》四章云：「菀彼柳斯，鳴蜩嘒嘒。有漼者淵，萑葦淠淠。譬彼舟流，不知所屆。心之憂矣，不遑假寐。」言柳茂蟬鳴，深淵蘆長，無不各安其所；獨己如舟之隨流，漂蕩不知所止，故心憂而不暇假寐也。</p><p>與《論語》「君子之德風，小人之德草」之旨異趣，而歎身世飄搖則同。</p><p><strong>所出</strong>：《詩經 · 小弁》 — https://zh.wikisource.org/wiki/詩經/小弁</p></article></main></div></div>
