    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 代斲傷手</nav></header><main><article><h1>代斲傷手</h1><p>代大匠斲木，鮮有不傷其手者。</p><p>「夫代大匠斲者，希有不傷手矣」，承上代司殺之義，極言代天行事之害也。</p><p>夫大匠斲木，手足之工也；代大匠者，豈不拙之甚哉？斲木且傷手，況代天殺人乎？是以人君欲以刑殺立威，而不知天網之不可干，鮮有不自傷焉。</p><p><strong>所出</strong>：《老子河上公章句 · 制惑》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
