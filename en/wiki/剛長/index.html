    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 剛長</nav></header><main><article><h1>剛長</h1><p>陽剛漸長，君子道盛，利有所往。</p><p>彖曰：利有攸往，剛長也。</p><p>[[復]]之成卦，一陽在初，積而漸長。剛長則君子之道盛，故利有攸往。[[剝卦]]以柔剝剛，至[[復]]而剛反，二卦相循，乃天道之常。</p><p><strong>所出</strong>：《周易 · 復》 — https://zh.wikisource.org/wiki/周易/復</p><hr><p>臨此剛長之卦也，剛勝則柔危矣，柔有其德乃得免咎，故此一卦陰爻雖美，莫過无咎也。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷10》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷10</p></article></main></div></div>
