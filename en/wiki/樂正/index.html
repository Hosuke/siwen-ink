    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 樂正</nav></header><main><article><h1>樂正</h1><p>掌樂之官，射時率工遷樂。</p><p>席工于西階上，少東。樂正先升，北面立于其西。樂正適西方，命弟子賛工，遷樂于下。射第三番，司射降，搢扑，東面命樂正，曰「請以樂樂于賔，賔許」。司射遂適階閒，堂下北面命曰「不鼓不釋」。樂正東面命大師，曰「奏《騶虞》，閒若一」。大師不興，許諾。樂正退反位。射禮將終，樂正命弟子賛工即位。</p><p><strong>所出</strong>：《儀禮 · 鄉射禮》 — https://zh.wikisource.org/wiki/儀禮/鄉射禮</p></article></main></div></div>
