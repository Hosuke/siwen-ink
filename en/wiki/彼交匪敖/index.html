    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 彼交匪敖</nav></header><main><article><h1>彼交匪敖</h1><p>交際以禮，不以傲慢，故萬福來求。</p><p>[[彼交匪敖]]出自《桑扈》，言與人交接而不傲慢也。</p><p>詩云：「彼交匪敖，萬福來求。」言君子燕享之際，匪敖於人，則萬福萃焉。《詩本義》以為誡人不可敖慢而失福也。</p><p><strong>所出</strong>：《詩經 · 桑扈》 — https://zh.wikisource.org/wiki/詩經/桑扈</p></article></main></div></div>
