    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 昔儀狄既疏</nav></header><main><article><h1>昔儀狄既疏</h1><p>援引沉酒亡國之古事，以為當世之戒。</p><p>抱朴子列舉因酒亡國敗德之古人，以為誡鑒：儀狄疏而大禹興，糟丘酒池而辛癸亡，豐侯以戴尊銜懷而得罪，景升以三雅之爵而荒壞，劉松以逃暑之飲而爛腸，郭珍以無日不醉而發狂。復有信陵之凶短、襄子之亂政、趙武之失眾、子反之誅戮、漢惠之伐命、灌夫之滅族、陳遵之遇害、季布之疏斥、子建之免退、徐邈之禁言，皆是物也。世人好之樂之者甚多，而戒之畏之者至少。</p><p><strong>所出</strong>：《抱朴子 · 卷24》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷24</p></article></main></div></div>
