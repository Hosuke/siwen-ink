    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 陽樊人不服晉侯</nav></header><main><article><h1>陽樊人不服晉侯</h1><p>陽樊人不服晉師，倉葛以王德曉之，晉侯聞言而出陽民。</p><p>王至自鄭，以陽樊賜晉文公。陽人不服，晉侯圍之。倉葛呼曰：王以晉君為能德，故勞之以陽樊，陽樊懷我王德，是以未從於晉。君若惠及之，唯官是徵，何足以辱師？君之武震，無乃玩而頓乎？臣聞之：「武不可覿，文不可匿。覿武無烈，匿文不昭。」陽不承獲甸，而祇以覿武，臣是以懼。且夫陽，豈有裔民哉？夫亦皆天子之父兄甥舅也，若之何其虐之也？晉侯聞之，曰：是君子之言也。乃出陽民。</p><p><strong>所出</strong>：《國語 · 卷02》 — https://zh.wikisource.org/wiki/國語/卷02</p></article></main></div></div>
