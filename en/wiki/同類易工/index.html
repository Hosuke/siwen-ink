    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 同類易工</nav></header><main><article><h1>同類易工</h1><p>同類之物易以施工，非其種者難以成巧。</p><p>若檗染為黃兮，似藍成綠組。皮革煮成膠兮，（麥曲）蘗化為酒。同類易施工兮，非種難為巧。</p><p>藍可染黃，檗之性也；麥蘗之曲，能化米為酒，蓋同類相從，理之自然。若以異類為之，則功倍而效寡。丹法取藥，亦必審其同類，方能交感成丹，非徒施功之巧，乃定性之然也。</p><p><strong>所出</strong>：《周易參同契 · 32章》 — https://zh.wikisuidce.org/wiki/周易參同契/32章</p></article></main></div></div>
