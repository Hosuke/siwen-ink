    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 風行天上</nav></header><main><article><h1>風行天上</h1><p>風未下被，小畜未成之象。</p><p>風行天上，小畜之象也。風在天上，流行未下，未洽於物，故名小畜。君子法之，當修德以俟時，不可以小成而自足。</p><p><strong>所出</strong>：《周易 · 小畜》 — https://zh.wikisource.org/wiki/周易/小畜</p></article></main></div></div>
