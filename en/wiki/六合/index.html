    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 六合</nav></header><main><article><h1>六合</h1><p>孟春與孟秋為合，仲春與仲秋為合，季春與季秋為合，餘季皆然。合者相應，政令宜配。</p><p>[[時令]]之配合，有一定之序，謂之六合。</p><p>孟春與孟秋為合，仲春與仲秋為合，季春與季秋為合，孟夏與孟冬為合，仲夏與仲冬為合，季夏與季冬為合。</p><p>合之義見於氣化：孟春始贏，孟秋始縮；仲春始出，仲秋始內；季春大出，季秋大內；孟夏始緩，孟冬始急；仲夏至修，仲冬至短；季夏德畢，季冬刑畢。</p><p>德在春夏，刑在秋冬。[[失政]]之咎，因其不合而生。</p><p><strong>所出</strong>：《淮南子 · 時則訓》 — https://zh.wikisource.org/wiki/淮南子/時則訓</p></article></main></div></div>
