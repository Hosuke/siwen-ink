    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 咸池之樂</nav></header><main><article><h1>咸池之樂</h1><p>黃帝張咸池之樂於洞庭之野，樂始於懼，次怠，卒惑，終與道合。</p><p>北門成問於黃帝曰：「帝張咸池之樂於洞庭之野，吾始聞之懼，復聞之怠，卒聞之而惑；蕩蕩默默，乃不自得。」帝曰：「汝殆其然哉！吾奏之以人，徵之以天，行之以禮義，建之以大清。夫至樂者，先應之以人事，順之以天理，行之以五德，應之以自然，然後調理四時，太和萬物。」</p><p>　　樂也者，始於懼，懼故祟；吾又次之以怠，怠故遁；卒之於惑，惑故愚；愚故道，道可載而與之俱也。</p><p><strong>所出</strong>：《莊子 · 天運》 — https://zh.wikisource.org/wiki/莊子/天運</p></article></main></div></div>
