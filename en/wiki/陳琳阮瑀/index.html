    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 陳琳阮瑀</nav></header><main><article><h1>陳琳阮瑀</h1><p>魏時文士，琳瑀之章表有譽當時。</p><p>魏初表章，指事造實，未足美矣。琳瑀章表，有譽當時。陳琳字孔璋，阮瑀字符瑜，並為建安七子。曹丕稱陳琳為健，其表壯而有骨，故云「孔璋稱健」。</p><p><strong>所出</strong>：《文心雕龍 · 章表》 — https://zh.wikisource.org/wiki/文心雕龍/章表</p></article></main></div></div>
