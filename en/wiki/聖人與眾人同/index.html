    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 聖人與眾人同</nav></header><main><article><h1>聖人與眾人同</h1><p>聖人與眾人飲食衣服、富貴貧賤皆同，特物不能拘耳。</p><p>聖人之於眾人，飲食衣服同也，屋宇舟車同也，富貴貧賤同也。眾人每同聖人，聖人每同眾人。彼仰其高侈其大者，其然乎，其不然乎？</p><p>魚欲異群魚，舍水躍岸即死；虎欲異群虎，舍山入市即擒。聖人不異眾人，特物不能拘爾。</p><p><strong>所出</strong>：《關尹子 · 3》 — https://zh.wikisource.org/wiki/關尹子/3</p></article></main></div></div>
