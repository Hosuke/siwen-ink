    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 子之湯兮</nav></header><main><article><h1>子之湯兮</h1><p>狀巫覡執羽旋轉之舞態，以諷陳侯荒娛。</p><p>湯者，通「蕩」，《說文》云「湯，浩流也」，引申為搖蕩旋轉之義。詩言「子之湯兮」者，狀宛丘之上，巫覡執鷺羽而婆娑回旋也。</p><p>陳侯之淫荒昏亂，於是舞焉。羽翿翩翩，旋轉無度，詩人目擊而心傷，故以「湯」字狀其佻達之態。末章復以「洵有情兮，而無望兮」相承——情則有之，望則不可，正見其愛而不能自持、慕而無由親附之意。嗚呼！荒娛之害，於茲可見。</p><p><strong>所出</strong>：《詩經 · 宛丘》 — https://zh.wikisource.org/wiki/詩經/宛丘</p></article></main></div></div>
