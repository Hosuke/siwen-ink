    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 山下出泉</nav></header><main><article><h1>山下出泉</h1><p>蒙卦之象，泉水始出，必待導引以成江河。</p><p>山下出泉，蒙。</p><p>坎下艮上，水在山下，是為山下出泉之象。泉之始出，其流尚微，未足以成江河，然其源清澈，其行不息，但患無以導之。蒙之道亦若是，童蒙者其心雖昧，其性本善，特患無聖人為之啟發耳。</p><p><strong>所出</strong>：《周易 · 蒙》 — https://zh.wikisource.org/wiki/周易/蒙</p></article></main></div></div>
