    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 無知無巧，善治衣裳</nav></header><main><article><h1>無知無巧，善治衣裳</h1><p>狀箴之德，無知巧而善成衣裳，功博不見賢良。</p><p>箴生於山阜，處於室堂。無知無巧，善治衣裳。不盜不竊，穿窬而行。日夜合離，以成文章。功業甚博，不見賢良；時用則存，不用則亡。蓋聖人修身之器，彼聖人者，亦無知無巧，而天下治焉。</p><p><strong>所出</strong>：《荀子 · 賦篇》 — https://zh.wikisource.org/wiki/荀子/賦篇</p></article></main></div></div>
