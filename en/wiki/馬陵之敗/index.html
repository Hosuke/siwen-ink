    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 馬陵之敗</nav></header><main><article><h1>馬陵之敗</h1><p>魏伐趙，齊孫臏敗魏師，龐涓死，太子申虜。</p><p>魏惠王三十年，魏伐趙，趙告急齊。齊宣王用孫子計救趙撃魏。魏遂大興師，使龐涓將，而令太子申爲上將軍。</p><p>過外黃，外黃徐子謂太子曰：「太子自將攻齊，大勝并莒，則富不過有魏，貴不益爲王。若戰不勝齊，則萬世無魏矣。」太子不聽，竟與齊人戰，敗於馬陵。齊虜魏太子申，殺將軍龐涓，軍遂大破。</p><p>馬陵之敗，魏國由是東失屏障，國勢始衰。</p><p><strong>所出</strong>：《史記 · 魏世家》 — https://zh.wikisource.org/wiki/史記/魏世家</p></article></main></div></div>
