    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 去宛陳莝</nav></header><main><article><h1>去宛陳莝</h1><p>平治水腫，蕩滌蓄積，使津液流通。</p><p>去宛陳莝，出[[湯液醪醴論]]。</p><p>論五藏陽竭、津液充郭之證，治以平治於權衡，去宛陳莝。</p><p>宛者，蓄積也；陳莝者，久腐之物也。去宛陳莝，猶言滌除五藏之蓄積、疏通津液之瘀滯也。配合開鬼門、潔淨府、繆刺等法，使精自生，形自盛，巨氣乃平。</p><p><strong>所出</strong>：《黃帝內經 · 素問第四卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第四卷</p></article></main></div></div>
