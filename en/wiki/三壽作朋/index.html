    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 三壽作朋</nav></header><main><article><h1>三壽作朋</h1><p>頌魯國國運如岡陵般穩固，壽可三人相匹。</p><p>詩言祭祀既成，孝孫受福，祝之以「俾爾熾而昌，俾爾壽而臧」，又云「保彼東方，魯邦是常。不虧不崩，不震不騰。三壽作朋，如岡如陵」。</p><p>三壽者，古者以「上壽百二十歲、中壽百歲、下壽八十」為三等，合而言之，喻國運長久，可與三等壽者相匹也。作朋者，相伴助之意。岡陵則山之高大者，以喻魯國基業磐石般不可動搖。此祈福之辭也。</p><p><strong>所出</strong>：《詩經 · 閟宮》 — https://zh.wikisource.org/wiki/詩經/閟宮</p></article></main></div></div>
