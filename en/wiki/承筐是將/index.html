    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 承筐是將</nav></header><main><article><h1>承筐是將</h1><p>以筐盛幣帛以送嘉賓，厚意所寓。</p><p>將，送也；承筐是將，謂以筐盛幣帛而送之也。《鹿鳴》首章云「吹笙鼓簧，承筐是將」，言既奏樂以娛賓，又送之以筐篚之禮。毛傳云：「實幣帛筐篚，以將其厚意。」蓋禮酒食之外，必有玉帛將之，所以盡主人之情也。</p><p><strong>所出</strong>：《詩經 · 鹿鳴》 — https://zh.wikisource.org/wiki/詩經/鹿鳴</p></article></main></div></div>
