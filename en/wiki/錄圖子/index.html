    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 錄圖子</nav></header><main><article><h1>錄圖子</h1><p>帝嚳時降江湄說《黃庭經》，命九天真王授帝嚳以九天真靈及三天寶符。</p><p>錄圖子，在帝嚳之時降於江湄，說《黃庭經》，教以清和之道。又命九天真王、三天真皇執八光之節，景雲之符，下牧德臺，授帝嚳以九天真靈、三天寶符。上以奉天使，二儀無遺；下以營人，使年命無墜。帝乃祭天於北河之壇，藏符於鍾山之峰，後昇天為玄宮真人。錄圖子是時傳道與赤松子、被衣子、王倪、齧缺。一云作《黃庭經》五十卷。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 2》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/2</p></article></main></div></div>
