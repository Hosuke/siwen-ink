    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 制彼裳衣</nav></header><main><article><h1>制彼裳衣</h1><p>歸來脫去戎服，尋常衣裳，以示復為平民。</p><p>「制彼裳衣，勿士行枚」，言歸而為常服也。制彼裳衣，裁製尋常之衣也。勿士行枚，不復銜枚而行。士，事也。言歸後不再事軍事，去其武裝，復為民事。此歸人之心願，亦亂極思治之象也。</p><p><strong>所出</strong>：《詩經 · 東山》 — https://zh.wikisource.org/wiki/詩經/東山</p></article></main></div></div>
