    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 柔乘剛</nav></header><main><article><h1>柔乘剛</h1><p>无攸利之故，柔爻凌乘於剛爻之上，剛道不行也。</p><p>欲剛者必以柔守之，欲強者必以弱保之。積於柔則剛，積於弱則強，觀其所積，以知禍福之鄉。是故柔弱者生之榦，堅強者死之徒。先唱者窮之路，後動者達之原。兵強則滅，木強則折，革固則裂，齒堅於舌而先之敝。唯知柔弱之旨者，能全生而避患，與道周旋而不殆。</p><p>  <strong>所出</strong>：《淮南子 · 原道訓》 — https://zh.wikisource.org/wiki/淮南子/原道訓</p></article></main></div></div>
