    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 季桓子穿井得土缶</nav></header><main><article><h1>季桓子穿井得土缶</h1><p>季桓子穿井得土缶，中有似羊之物，問孔子。</p><p>季桓子穿井得土缶，中若羊，問仲尼云「得狗」。仲尼曰：「以丘所聞，羊也。丘聞之，木石之怪夔、罔閬，水之怪龍、罔象，土之怪坟羊。」此孔子博物之知也。</p><p><strong>所出</strong>：《史記 · 卷047》 — https://zh.wikisource.org/wiki/史記/卷047</p></article></main></div></div>
