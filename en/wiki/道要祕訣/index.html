    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 道要祕祇</nav></header><main><article><h1>道要祕祇</h1><p>示玄關之要、呼吸之機</p><p>道要歌，知道要必遭魔。看玄關，調眞息，知斯二要修行畢。以元神，入氣海，神氣交融默默時，便得一玄眞主宰。將元氣，入黃庭，氣神和合昏昏際，又得一玄最圓明。一玄妙，一玄竅，有欲觀竅無觀妙。兩者玄玄是要機，異名同出誰知道。先從竅內調眞息，神恬氣靜極自然，妙自無生現太極。</p><p><strong>所出</strong>：《張三丰先生全集 · 卷4》 — https://zh.wikisource.org/wiki/張三丰先生全集/卷4</p></article></main></div></div>
