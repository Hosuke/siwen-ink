    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 主釋法以譽進能</nav></header><main><article><h1>主釋法以譽進能</h1><p>以譽進能則臣離上，以黨舉官則民務佼</p><p>亂主聽言而不督其實，故羣臣以虛譽進其黨；任官而不責其功，故愚汙之吏在庭。如此則羣臣相推以美名，相假以功伐，而不為主用。
