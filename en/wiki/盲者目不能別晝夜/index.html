    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 盲者目不能別晝夜</nav></header><main><article><h1>盲者目不能別晝夜</h1><p>瞽者無目而能鼓琴，服習積貫之所致，學不可以已。</p><p>今夫盲者目不能別晝夜，分白黑，然而搏琴撫弦，參彈複徽，攫援摽拂，手若蔑蒙，不失一弦。使未嘗鼓瑟者，雖有離朱之明，攫掇之捷，猶不能屈伸其指。何則？服習積貫之所致。</p><p>故[[學不可以已]]，明矣！玉堅無敵，鏤以為獸，首尾成形，礛諸之功。木直中繩，揉以為輪，其曲中規，檃括之力。唐碧堅忍之類，猶可刻鏤，揉以成器用，又況心意乎！</p><p><strong>所出</strong>：《淮南子 · 脩務訓》 — https://zh.wikisource.org/wiki/淮南子/脩務訓</p></article></main></div></div>
