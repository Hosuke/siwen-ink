    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 得衆而不得其心，與獨行者同實</nav></header><main><article><h1>得衆而不得其心，與獨行者同實</h1><p>師無民心，不堪一用。</p><p>得衆而不得其心，則與獨行者同實。</p><p>兵多而心離，雖有萬衆，不敵一人。將必先附衆心，而後可以驅之。</p><p><strong>所出</strong>：《管子 · 第28篇參患》 — https://zh.wikisource.org/wiki/管子/第28篇參患</p></article></main></div></div>
