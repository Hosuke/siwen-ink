    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 物無貴賤</nav></header><main><article><h1>物無貴賤</h1><p>物之貴賤繫乎所處，非有定實；因其貴而貴之，無物不貴也。</p><p>物無貴賤。因其所貴而貴之，物無不貴也；因其所賤而賤之，物無不賤也。夫玉璞不厭厚，角䚩不厭薄；漆不厭黑，粉不厭白。此四者相反也，所急則均，其用一也。今之裘與蓑，孰急？見雨則裘不用，升堂則蓑不御，此代為常者也。</p><p><strong>所出</strong>：《淮南子 · 齊俗訓》 — https://zh.wikisource.org/wiki/淮南子/齊俗訓</p></article></main></div></div>
