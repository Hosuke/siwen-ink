    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 刻削比肩班狄擅絕</nav></header><main><article><h1>刻削比肩班狄擅絕</h1><p>刻削者比肩而班狄擅絕手之名，援琴者至眾而夔襄專知音之難。</p><p>抱朴子云：「蓋刻削者比肩，而班狄擅絕手之稱；援琴者至眾，而夔襄專知音之難。廄馬千駟，而騏驥有邈群之價；美人萬計，而威施有超世之容。蓋有遠過眾者也。」</p><p><strong>所出</strong>：《抱朴子 · 卷32》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷32</p></article></main></div></div>
