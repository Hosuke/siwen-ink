    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 樸散則為器</nav></header><main><article><h1>樸散則為器</h1><p>一樸散為萬物，聖人用之為官長。</p><p>樸散則爲器，聖人用則爲官長。</p><p>樸者道之全德之素也。散者離而殊也。譬如工匠操樸而斲，器之方圓短長百變生焉。聖人處無爲之世，樸未散也；及乎淳散俗離，乃因時制宜，設官分職，以道用器，以器寓道。官長者，眾器之總持也。非聖人欲爲官長，樸散而不得不然耳。</p><p>此與 [[樸散為器]] 義相成，皆明無爲與有爲相待之理。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第七十二章 恆德》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
