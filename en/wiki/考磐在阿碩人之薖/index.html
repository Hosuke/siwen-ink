    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 考磐在阿，碩人之薖</nav></header><main><article><h1>考磐在阿，碩人之薖</h1><p>考磐於阿，賢者得薖和之樂。</p><p>「考磐在阿，碩人之薖」，[[考磐]]次章之前句。言賢者[[考磐]]於山阿之間，因而得有薖和之樂。[[碩人]]居阿而樂，獨寐[[寤歌]]，[[永矢弗過]]，是其志趣恬淡，不累於世者也。</p><p><strong>所出</strong>：《詩經 · 考磐》 — https://zh.wikisource.org/wiki/詩經/考磐</p></article></main></div></div>
