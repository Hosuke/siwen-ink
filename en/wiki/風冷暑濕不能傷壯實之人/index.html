    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 風冷暑濕不能傷壯實之人</nav></header><main><article><h1>風冷暑濕不能傷壯實之人</h1><p>邪不能傷正氣充沛之人，患之者皆體虛氣少者。</p><p>苟能令正氣不衰，形神相衛，莫能傷也。設有數人，年紀老壯既同，服食厚薄又等，俱造沙漠之地，並冒嚴寒之夜，素雪墮於上，玄冰結於下，寒風摧條而宵駭，欬唾凝沍於唇吻，則其中將有獨中冷者，而不必盡病也。非冷氣之有偏，蓋人體有不耐者耳。</p><p><strong>所出</strong>：《抱朴子 · 卷13》 — https://zh.wikisource.org/wiki/抱朴子/卷13</p></article></main></div></div>
