    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 王順採藥終南</nav></header><main><article><h1>王順採藥終南</h1><p>終南山採藥得道，峯以人名，靈應昭彰。</p><p>王順採藥於終南山，得一道。今終南山有王順峯，靈應昭彰，至今不絕。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 35》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/35</p></article></main></div></div>
