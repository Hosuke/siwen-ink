    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 獨行夜行</nav></header><main><article><h1>獨行夜行</h1><p>召遠者使無為，親近者言无事，唯夜行者獨有也。</p><p>召遠者使無為焉，親近者言无事焉，唯夜行者獨有也。夜行者，心行於道，無聲無臭，不恃威令而人自服也。夫德之流行，速於置郵而傳命。聖人在上，清靜無為，民自試於下；抱蜀不言，而廟堂既脩。此所謂不言之教、無為之益也。鴻鵠鏘鏘，唯民歌之；濟濟多士，殷民化之。遠者來之使安，近者親之使信，而其要在於夜行者之一心。心正則天下正，心邪則天下邪。此內省之道也。</p><p><strong>所出</strong>：《管子 · 第02篇形勢》 — https://zh.wikisource.org/wiki/管子/第02篇形勢</p></article></main></div></div>
