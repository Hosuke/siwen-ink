    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 形骸之內與形骸之外</nav></header><main><article><h1>形骸之內與形骸之外</h1><p>子產以形骸外貌輕人，不知友德於形骸之內也。</p><p>申徒嘉語子產曰：「今子與我遊於形骸之內，而子索我於形骸之外，不亦過乎！」言伯昏无人之門，貴德不貴形；子產以形骸外貌輕我，是過也。</p><p><strong>所出</strong>：《莊子 · 德充符》 — https://zh.wikisource.org/wiki/莊子/德充符</p></article></main></div></div>
