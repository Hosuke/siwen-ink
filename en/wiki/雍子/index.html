    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 雍子</nav></header><main><article><h1>雍子</h1><p></p><p>[[蔡聲子論楚材晉用]]述雍子之事：昔雍子之父兄譖雍子於恭王，王弗是，雍子奔晉，晉人用之。及鄢之役，雍子與於軍事，謂欒書以破楚之策，楚師大敗，王親面傷。詳見[[蔡聲子論楚材晉用]]。</p><p>  <strong>所出</strong>：《國語 · 卷17》 — https://zh.wikisource.org/wiki/國語/卷17</p></article></main></div></div>
