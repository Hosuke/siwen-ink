    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 角</nav></header><main><article><h1>角</h1><p>左角理物以起，右角將帥而動，天之三門，明大則天下太平。</p><p>左角，李；右角，將。李即理，理，法官也。元命包云「左角理，物以起；右角將，帥而動」。石氏云「左角為天田，右角為天門」也。</p><p>角星為天關，其間天門，其內天庭，黃道所經，七耀所行。左角為理主刑，右角為將主兵。蓋天之三門，故其星明大則天下太平，賢人在位；不然反是也。</p><p><strong>所出</strong>：《史記 · 卷027》 — https://zh.wikisource.org/wiki/史記/卷027</p></article></main></div></div>
