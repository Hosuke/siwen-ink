    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 失之己而反諸人</nav></header><main><article><h1>失之己而反諸人</h1><p>患失之由己，反求諸己乃正道，怨人怨天皆非也。</p><p>曾子曰：「同游而不見愛者，吾必不仁也；交而不見敬者，吾必不長也；臨財而不見信者，吾必不信也。」</p><p>三者皆在己身，不在於人。怨人者窮，怨天者無識。失之己而反諸人，豈不亦迂哉！</p><p>是故君子內省不疚，無疚於心，無怨於人，斯為得道之要也。</p><p><strong>所出</strong>：《荀子 · 法行篇》 — https://zh.wikisource.org/wiki/荀子/法行篇</p></article></main></div></div>
