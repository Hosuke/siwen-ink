    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 蹩躠為仁</nav></header><main><article><h1>蹩躠為仁</h1><p>聖人蹩躠為仁、踶跂為義，而天下始疑；澶漫為樂、擿僻為禮，而天下始分。</p><p>及至聖人，蹩躠爲仁，踶跂爲義，而天下始疑矣；澶漫爲樂，擿僻爲禮，而天下始分矣。</p><p><strong>所出</strong>：《莊子 · 馬蹄》 — https://zh.wikisource.org/wiki/莊子/馬蹄</p></article></main></div></div>
