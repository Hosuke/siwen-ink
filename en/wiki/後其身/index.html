    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 後其身</nav></header><main><article><h1>後其身</h1><p>臨政官民者，能先身而後己。</p><p>聖人後其身者，先人而後己也。</p><p>河上公曰：先人而後己，天下敬之，先以為長。夫聖人讓祿不受則民悅，讓功不居則民歸。居上而視民如赤子，則民視之如父母。汲汲以自厚者，人得而賤之；退然不敢先者，人貴而戴之。先之非先，乃無私而民自歸之。先之非先，乃無心而物自賓之。</p><p><strong>所出</strong>：《老子河上公章句 · 韜光》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
