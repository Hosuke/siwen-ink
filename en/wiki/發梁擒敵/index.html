    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 發梁擒敵</nav></header><main><article><h1>發梁擒敵</h1><p>城外塹中施發梁機，敵渡則引機發梁以擒之。</p><p>去城門五步，大塹之，高地三丈，下地至泉。施賊其中，上為發梁，而機巧之。比傅薪土，使可道行，㫄有溝壘，毋可躐越。</p><p>而出佻且北，適人遂入，引機發梁，適人可禽。適人恐懼而有疑心，因而離。</p><p>此以陷阱擒敵之法也。</p><p><strong>所出</strong>：《墨子 · 備城門》 — https://zh.wikisource.org/wiki/墨子/備城門</p></article></main></div></div>
