    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 謹候日辰審查消息</nav></header><main><article><h1>謹候日辰審查消息</h1><p>君子謹候日辰，審察消長，以趨吉避凶。</p><p>謹候日辰，審查消息。纖芥不正，悔吝為賊。</p><p>消息者，盈虛之變也；日辰者，陰陽之樞也。[[按歷法令]]者，此之謂敷。消而息之，盈而虛之，天道之常也。君子觀日辰之移，察陰陽之變，則知吉凶之先見者矣。纖芥不正者，毫釐之差也。[[動靜有常]]，奉其繩墨，則消息不失其正，而悔吝無由生。</p><p><strong>所出</strong>：《周易參同契 · 17章》 — https://zh.wikisource.org/wiki/周易參同契/17章</p></article></main></div></div>
