    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 剛柔應</nav></header><main><article><h1>剛柔應</h1><p>陰陽相應雖位不當而志通</p><p>雖不當位，剛柔應也。彖辭言未濟六爻之象：初二三四五上，陰陽雜處，位皆不當。然而剛柔相應，上下相交感，故曰亨也。[[柔能制剛弱能制強]]，固是之義。位之當否，天數也；應之通否，人事也。人事可以回天，天數不能盡拘，聖人觀象以此。</p><p><strong>所出</strong>：《周易 · 未濟》 — https://zh.wikisource.org/wiki/周易/未濟</p></article></main></div></div>
