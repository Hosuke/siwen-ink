    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 水火者所以活人，亦所以殺人，存乎能用之與不能用</nav></header><main><article><h1>水火者所以活人，亦所以殺人，存乎能用之與不能用</h1><p>刑罰本身無善惡，善用則治，不善用則亂</p><p>且刑由刃也，巧人以自成，拙者以自傷，為治國有道而助之以刑者，能令慝偽不作，兇邪改志。若綱絕網紊，得罪於天，用刑失理，其危必速。亦猶水火者所以活人，亦所以殺人，存乎能用之與不能用。</p><p><strong>所出</strong>：《抱朴子 · 卷14》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷14</p></article></main></div></div>
