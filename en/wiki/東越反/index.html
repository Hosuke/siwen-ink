    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 東越反</nav></header><main><article><h1>東越反</h1><p>記東越反叛及漢征伐之事</p><p>元鼎六年十二月，東越反。遣橫海將軍韓說出會稽，樓船將軍楊僕出豫章，中尉王溫舒出會稽，皆破東越。</p><p><strong>所出</strong>：《史記 · 卷022》 — https://zh.wikisource.org/wiki/史記/卷022</p><hr><p>元鼎六年秋，馀善聞樓船請誅之，漢兵臨境，且往，乃遂反，發兵距漢道。號將軍騶力等為「吞漢將軍」，入白沙、武林、梅嶺，殺漢三校尉。</p><p>  <strong>所出</strong>：《史記 · 卷114》 — https://zh.wikisource.org/wiki/史記/卷114</p></article></main></div></div>
