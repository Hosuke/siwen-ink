    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 免身立功以明先王之跡</nav></header><main><article><h1>免身立功以明先王之跡</h1><p>免於誅戮而立功名，是臣之上計；毀傷先王之名，乃臣之大恐。</p><p>樂毅《報燕惠王書》曰：「夫免身立功，以明先王之跡，臣之上計也。離毀辱之誹謗，墮先王之名，臣之所大恐也。臨不測之罪，以幸為利，義之所不敢出也。」</p><p>免於危亡而能成功名，此臣之志也；若因毀謗而累及先王之明，則非臣所敢出。蓋事仇以苟免，非義也；傷君之明，非忠也。</p><p><strong>所出</strong>：《史記 · 卷080》 — https://zh.wikisource.org/wiki/史記/卷080</p></article></main></div></div>
