    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 孔子攝相事</nav></header><main><article><h1>孔子攝相事</h1><p>孔子代理魯國相國處理外交會盟。</p><p>孔子攝相事，曰：「臣聞有文事者必有武備，有武事者必有文備。古者諸侯出疆，必具官以從。請具左右司馬。」定公曰：「諾。」具左右司馬。此孔子以相禮的身份處理外交之事也。</p><p><strong>所出</strong>：《史記 · 卷047》 — https://zh.wikisource.org/wiki/史記/卷047</p></article></main></div></div>
