    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 一尺布，尚可縫</nav></header><main><article><h1>一尺布，尚可縫</h1><p>民謠諷文帝以天下之大不能容一弟也。</p><p>民有作歌歌淮南厲王曰：「一尺布，尚可縫；一斗粟，尚可舂。兄弟二人不能相容。」上聞之，乃歎曰：「堯舜放逐骨肉，周公殺管蔡，天下稱聖。何者？不以私害公。天下豈以我為貪淮南王地邪？」</p><p>夫民謠所刺者，以天子富有四海，乃不能容一兄弟於同堂，使尺布之微、斗粟之細，皆不得以相縫舂也。文帝聞謠而自解，以堯舜周公為比，然百姓終不以為然。嘻！天下可奪，而兄弟不可合，歌之意深矣。</p><p><strong>所出</strong>：《史記 · 卷118》 — https://zh.wikisource.org/wiki/史記/卷118</p></article></main></div></div>
