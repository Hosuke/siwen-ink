    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 五行相剋更為父母</nav></header><main><article><h1>五行相剋更為父母</h1><p>五行生剋之理，化生萬物</p><p>五行相剋，更迭為父母。母含滋液，滋液者，坤道之精，柔含而資生；父主秉與，秉與者，乾道之剛，健作而成物。凝精流形，金石不朽，喻金丹凝結，光澤不朽之義。</p><p><strong>所出</strong>：《周易參同契 · 25章》 — https://zh.wikisource.org/wiki/周易參同契/25章</p></article></main></div></div>
