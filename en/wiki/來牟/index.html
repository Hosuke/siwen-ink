    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 來牟</nav></header><main><article><h1>來牟</h1><p></p><p>來，小麥也；牟，大麥也。后稷[[貽我來牟]]，遺民以來牟之種，使天下得食而養育。后稷發明農耕，貽民來牟，萬民賴之。</p><p>  <strong>所出</strong>：《詩經 · 思文》 — https://zh.wikisource.org/wiki/詩經/思文</p></article></main></div></div>
