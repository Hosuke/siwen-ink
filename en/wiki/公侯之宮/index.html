    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 公侯之宮</nav></header><main><article><h1>公侯之宮</h1><p>公侯宗廟之寢，祭祀之所在。</p><p>《采蘩》云「于以用之，公侯之宮」。按《詩三家義集疏》，此「宮」指廟與寢，乃公侯葬身之處，即宗廟之通稱。</p><p>詩言采蘩之所用，非別處，乃公侯之宮。夫人采白蒿以供祭祀，其用之所在，即公侯之宗廟也。</p><p><strong>所出</strong>：《詩經 · 采蘩》 — https://zh.wikisource.org/wiki/詩經/采蘩</p></article></main></div></div>
