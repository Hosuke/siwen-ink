    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 禁暴討亂</nav></header><main><article><h1>禁暴討亂</h1><p>兵之為用，以誅暴止亂、救民於危，非為侵奪廣土。</p><p>古之用兵者，非利土壤之廣而貪金玉之略，將以存亡繼絕，平天下之亂，而除萬民之害也。</p><p>夫兵者，所以禁暴討亂也。炎帝為火災，故黃帝禽之；共工為水害，故顓頊誅之。教之以道，導之以德而不聽，則臨之以威武；臨之威武而不從，則制之以兵革。</p><p>義兵之至也，至於不戰而止。湯、武之所以致王者，順天應人，除暴止亂故也。</p><p><strong>所出</strong>：《淮南子 · 兵略訓》 — https://zh.wikisource.org/wiki/淮南子/兵略訓</p></article></main></div></div>
