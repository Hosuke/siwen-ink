    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 沿根討葉，思轉自圓</nav></header><main><article><h1>沿根討葉，思轉自圓</h1><p>順從根本以探枝葉，則思路自然圓通。</p><p>學者為文，當先定根本。沿根討葉，則思轉自圓；根本既立，枝葉自然敷暢。童子雕琢，必先雅製；八體雖殊，會通合數，得其環中，則輻輳相成。蓋環中者，根本之樞要也；得其樞要，則萬變皆歸于一理。</p><p><strong>所出</strong>：《文心雕龍 · 體性》 — https://zh.wikisource.org/wiki/文心雕龍/體性</p></article></main></div></div>
