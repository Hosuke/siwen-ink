    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 三至</nav></header><main><article><h1>三至</h1><p>將有可殺而不可從命之三事。</p><p>孫卿子云：「所以不受命於主有三：可殺而不可使處不完，可殺而不可使擊不勝，可殺而不可使欺百姓。」夫是之謂三至。</p><p><strong>所出</strong>：《荀子 · 議兵篇》 — https://zh.wikisource.org/wiki/荀子/議兵篇</p></article></main></div></div>
