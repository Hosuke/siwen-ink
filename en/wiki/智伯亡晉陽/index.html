    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 智伯亡晉陽</nav></header><main><article><h1>智伯亡晉陽</h1><p>兼人之國而不知足，禍莫大焉，終至身亡國分。</p><p>智伯兼范、中行而攻趙不已，韓、魏反之，軍敗晉陽，身死高梁之東，遂卒被分，漆其首以為溲器。故老子曰：「禍莫大於不知足。」貪而不知止，取亡之道也。</p><p><strong>所出</strong>：《韓非子 · 喻老》 — https://zh.wikisource.org/wiki/韓非子/喻老</p></article></main></div></div>
