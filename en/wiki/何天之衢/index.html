    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 何天之衢</nav></header><main><article><h1>何天之衢</h1><p>荷負天道，四達通途，大畜之成。</p><p>上九「何天之衢，亨」，何，荷也，負荷之義；衢，四達之路也。何天之衢，猶荷負天道而行於四達之途。象曰「道大行也」。畜德至此，與天合德，無所窒礙，其道大行而亨通也。</p><p><strong>所出</strong>：《周易 · 大畜》 — https://zh.wikisource.org/wiki/周易/大畜</p></article></main></div></div>
