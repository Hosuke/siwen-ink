    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 道天地之常</nav></header><main><article><h1>道天地之常</h1><p>聖人法天地之常道，修陰陽之從，以成天下之治也。</p><p>天不變其常，地不易其則，春秋冬夏不更其節，古今一也。天之道，恒久而不已；地之則，生物而不忒。以此觀之，人事之理亦在其中矣。君有君之常，臣有臣之常；父有父之常，子有子之常。各安其常，則上下和，政令行。失其常則變生，變生則亂作。是故聖人法天之常，用地之則，动静作息一循乎道，而天下治矣。</p><p><strong>所出</strong>：《管子 · 第02篇形勢》 — https://zh.wikisource.org/wiki/管子/第02篇形勢</p></article></main></div></div>
