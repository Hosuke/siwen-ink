    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 如山如河</nav></header><main><article><h1>如山如河</h1><p>德行厚重深廣之喻</p><p>如山如河，見於《詩經·君子偕老》。言夫人之德如山之安、如河之大，以山水喻德行深厚之意也。與[[委委佗佗]]相承，狀其容止德言之美。</p><p><strong>所出</strong>：《詩經 · 君子偕老》 — https://zh.wikisource.org/wiki/詩經/君子偕老</p></article></main></div></div>
