    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 五衢之民</nav></header><main><article><h1>五衢之民</h1><p>途旁無陰則民不怠，男女相好於市，衣食因此而貴。</p><p>管子言治道，以為道在便民，不在厲民。途旁之樹，萌生之初，枝葉未成，五衢之民男女相好往來市者，罷市相睹樹下，談語終日；壯者扶輦推輿，戲笑超距；父兄相聚，論議玄語。民皆不歸，故田不發，五穀不播，麻桑不種，縕縷不治。內嚴一家而三不歸，則帛布絲纊之賈安得不貴？故善為政者，務使民歸於本，不使游惰以妨農事也。</p><p><strong>所出</strong>：《管子 · 第83篇輕重丁》 — https://zh.wikisource.org/wiki/管子/第83篇輕重丁</p></article></main></div></div>
