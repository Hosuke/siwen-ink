    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 琴心三疊</nav></header><main><article><h1>琴心三疊</h1><p>琴與心和，心與神合，三疊者三田也。</p><p>琴心和者，琴音與心相諧；心與神合，三疊者，三丹田之謂也。修煉之士，以心御神，神凝氣聚，猶琴之諧音，此舞胎僊之漸階也。</p><p><strong>所出</strong>：《黃庭內景經 · 上清章第一》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/上清章第一</p></article></main></div></div>
