    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 天子至備</nav></header><main><article><h1>天子至備</h1><p>天子至重至佚，無所求於人，而天下之至備咸集焉。</p><p>天子埶至重而形至佚，心至愈而志無所詘，形無所勞，故尊無上焉。天子無妻，言其尊無與匹也；四海無客禮，言其無所適也；足能行而後進，口能言而後詔，不視而見，不聽而聰，不言而信，不慮而知，不動而功，此所謂至備也。足行之備在相者，口言之備在官人，皆有其輔而非獨恃己焉。</p><p><strong>所出</strong>：《荀子 · 君子篇》 — https://zh.wikisource.org/wiki/荀子/君子篇</p></article></main></div></div>
