    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 謝功</nav></header><main><article><h1>謝功</h1><p>謝城建立，功成事畢。</p><p>謝，申之舊都也。肅肅謝功，召伯營之，謝城之功，召伯成之。《詩經·黍苗》曰「肅肅謝功」，言謝邑之城功，修肅然以成也。營之、成之，則皆召伯之功矣。</p><p><strong>所出</strong>：《詩經 · 黍苗》 — https://zh.wikisource.org/wiki/詩經/黍苗</p></article></main></div></div>
