    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 罪當朕躬，弗敢自赦</nav></header><main><article><h1>罪當朕躬，弗敢自赦</h1><p>有罪自承，不敢飾辭求免。</p><p>湯言：「爾有善，朕弗敢蔽；罪當朕躬，弗敢自赦。」言賞善不敢蔽匿，罪己不敢寬宥也。惟簡在上帝之心。</p><p><strong>所出</strong>：《尚書 · 湯誥》 — https://zh.wikisource.org/wiki/尚書/湯誥</p></article></main></div></div>
