    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 五年暇孫</nav></header><main><article><h1>五年暇孫</h1><p>天緩於圖難，予以暇豫，待其自悟。</p><p>天惟五年須暇之子孫，誕作民主，罔可念聽。言天之用威，非即加誅也；蓋嘗一二緩之，予以歲月，俾得省悟自新。猶有誨告至再至三者焉，非不欲亟誅也，姑容以俟其改悔焉耳。此聖人輔相天地之義，緩之非縱，誡之非亟，期於萬方之率俾也。</p><p><strong>所出</strong>：《尚書 · 多方》 — https://zh.wikisource.org/wiki/尚書/多方</p></article></main></div></div>
