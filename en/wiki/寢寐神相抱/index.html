    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 寢寐神相抱</nav></header><main><article><h1>寢寐神相抱</h1><p>修真者寢寐之時，神氣相抱，守而不離</p><p>《參同契》云「心專不縱橫，寢寐神相抱，覺悟候存亡」，言修真者心志專一，寢寐之際，神炁相抱不相離，如雛之覆卵，如龍之守珠。由是以候吾身之存亡，而顏色浸潤、骨節堅強眾效，亦由此出也。</p><p><strong>所出</strong>：《周易參同契 · 22章》 — https://zh.wikisource.org/wiki/周易參同契/22章</p></article></main></div></div>
