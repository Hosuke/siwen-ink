    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 顯比</nav></header><main><article><h1>顯比</h1><p>明顯親比，光明正大。</p><p>顯比者，明顯昭著之親比也。《比》九五象曰「顯比之吉，位正中也」，言九五居尊，陽剛中正，顯明其親比之心以待天下，無有私曲。王者之道，莫大乎光明正大，以親附萬民也。顯者，光也，明也。</p><p><strong>所出</strong>：《周易 · 比》 — https://zh.wikisource.org/wiki/周易/比</p></article></main></div></div>
