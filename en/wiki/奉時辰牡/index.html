    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 奉時辰牡</nav></header><main><article><h1>奉時辰牡</h1><p>言以時令所育之牡獸供田狩也。</p><p>奉時辰牡，辰牡孔碩。辰者，時也；辰牡，謂按時令所畜之牡獸也。《詩經·駟驖》：「奉時辰牡，辰牡孔碩。」言秦襄公田狩，先以所畜之雄獸奉之時令，且其牲甚肥大也。毛傳：「辰，時也。」古者天子諸侯有囿，育禽獸以待田獵。《周禮·地官·囿人》雲「掌囿游之獸禁」，是其制也。
<strong>所出</strong>：《詩經 · 駟驖》 — https://zh.wikisource.org/wiki/詩經/駟驖</p></article></main></div></div>
