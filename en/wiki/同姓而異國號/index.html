    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 同姓而異國號</nav></header><main><article><h1>同姓而異國號</h1><p>五帝皆同姓而異其國號，以章明德。</p><p>自黃帝至舜、禹，皆同姓而異其國號，以章明德。故黃帝爲有熊，帝顓頊爲高陽，帝嚳爲高辛，堯爲陶唐，舜爲有虞。禹爲夏后而別氏，姓姒氏。契爲商而別氏，姓子氏。棄爲周而別氏，姓姬氏。</p><p><strong>所出</strong>：《史記 · 卷001》 — https://zh.wikisource.org/wiki/史記/卷001</p></article></main></div></div>
