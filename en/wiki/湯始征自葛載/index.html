    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 湯始征自葛載</nav></header><main><article><h1>湯始征自葛載</h1><p>湯之征伐，始於葛伯仇餉，為民除害，十一征而天下服。</p><p>《書》曰：「葛伯仇餉」，此之謂也。為其殺是童子而征之，四海之內皆曰：「非富天下也，為匹夫匹婦復讎也。」湯始征，自葛載。十一征而無敵於天下。東面而征，西夷怨；南面而征，北狄怨，曰：「奚為後我？」民之望之若大旱之望雨也。</p><p><strong>所出</strong>：《孟子 · 滕文公下》 — https://zh.wikisource.org/wiki/孟子/滕文公下</p></article></main></div></div>
