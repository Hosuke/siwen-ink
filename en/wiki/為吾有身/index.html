    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 為吾有身</nav></header><main><article><h1>為吾有身</h1><p>大患之原，在於有身。</p><p>吾所以有大患者，為吾有身也。[[及吾無身]]，何患之有？[[老子]]此言，非必欲人毀身絕生，實明心累之生於身見也。有身斯有欲，有欲斯有爭，有爭斯有大患。及其無身，則物我兩忘，患亦無所附麗。</p><p>[[為吾有身]]與[[老子 (王弼本) · 章十三|王弼本]]「為吾有身」義合。</p><p><strong>所出</strong>：《老子 (帛書本) · 章十三》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
