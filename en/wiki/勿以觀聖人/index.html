    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 勿以觀聖人</nav></header><main><article><h1>勿以觀聖人</h1><p>聖人之道無跡無言無為無形，不可外貌觀之。</p><p>勿以行觀聖人，道無跡；勿以言觀聖人，道無言；勿以能觀聖人，道無為；勿以貌觀聖人，道無形。</p><p>行雖至卓，不離高下；言雖至公，不離是非。能雖至神，不離巧拙；貌雖至殊，不離妍醜。聖人假此，以示天下，天下冥此，乃見聖人。</p><p><strong>所出</strong>：《關尹子 · 3》 — https://zh.wikisource.org/wiki/關尹子/3</p></article></main></div></div>
