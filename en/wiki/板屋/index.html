    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 板屋</nav></header><main><article><h1>板屋</h1><p>西戎之俗居室以木板為之，君子遠戍，閔者心曲亂焉。</p><p>「言念君子，溫其如玉。在其板屋，亂我心曲。」</p><p>板屋者，以木板為覆之室也。《漢書·地理志》云「天水、隴西山多林木，民以板為屋」，是西戎之俗。秦處西垂，與戎接壤，故其居室如此。君子在其板屋以禦戎虜，妇人閔念而心曲為之亂，思念之深也。</p><p><strong>所出</strong>：《詩經 · 小戎》 — https://zh.wikisource.org/wiki/詩經/小戎</p></article></main></div></div>
