    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 詒孫子</nav></header><main><article><h1>詒孫子</h1><p>君子積德，福貽後嗣</p><p>「君子有穀，詒孫子」，言君子有善道，可以遺及子孫也。[[于胥樂兮|君臣相樂]]，非徒娛一時，乃欲 [[歲其有|歲歲豐稔]]，長享其福，以傳於後嗣。夫積善者必有餘慶，行仁者必有其報，此[[溫故而知新|詩書]]所以垂訓，而[[積善成德|善積於身]]者，其效乃至於 [[積善之家必有餘慶|積善之報]]，施及萬世也。</p><p><strong>所出</strong>：《詩經 · 有駜》 — https://zh.wikisource.org/wiki/詩經/有駜</p></article></main></div></div>
