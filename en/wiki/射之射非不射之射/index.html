    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 射之射非不射之射</nav></header><main><article><h1>射之射非不射之射</h1><p>技術之射與無心之射，截然有間。</p><p>列禦寇為伯昏无人射，引之盈貫，措杯水其肘上，發之適矢復沓，方矢復寓。伯昏无人曰：「是射之射，非不射之射也。」遂登高山，履危石，臨百仞之淵，背逡巡，足二分垂在外。列禦寇伏地，汗流至踵。伯昏无人言：「夫至人者，上闚青天，下潛黃泉，揮斥八極，神氣不變。今汝怵然有恂目之志，爾於中也殆矣夫！」</p><p><strong>所出</strong>：《莊子 · 田子方》 — https://zh.wikisource.org/wiki/莊子/田子方</p></article></main></div></div>
