    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 黍離</nav></header><main><article><h1>黍離</h1><p>詩名亦為亡國之悲的典故。</p><p>《詩》之十五國風，周有王城之地，其詩入《王風》。首章云「彼黍離離」，故名篇曰〈黍離〉。後世用「黍離」以喻故國丘墟、麥秀之悲。司馬遷述屈子行吟、黍離麥秀，皆此意也。</p><p><strong>所出</strong>：《詩經 · 黍離》 — https://zh.wikisource.org/wiki/詩經/黍離</p></article></main></div></div>
