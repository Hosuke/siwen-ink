    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 雌雄相須</nav></header><main><article><h1>雌雄相須</h1><p>雌雄相待而後成，亦如陰陽之不可離。</p><p>雌雄相須者，喻萬物之雌雄、陰陽，相待以成，不可偏廢。雄稟雌施，缺一則化機不行，故曰「相須」。此與[[陽秉陰受]]之義互通，皆明造化相依之理。</p><p><strong>所出</strong>：《周易參同契 · 16章》 — https://zh.wikisource.org/wiki/周易參同契/16章</p></article></main></div></div>
