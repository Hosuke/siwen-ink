    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 賞罰是非相與四繆</nav></header><main><article><h1>賞罰是非相與四繆</h1><p>賞罰與是非相違，上之所是與法之所非相戾，雖十黃帝不能理。</p><p>尹文論齊王賞罰之弊曰：「殺人者死，傷人者刑。」人有畏王之令者，見侮而終不敢鬭，是全王之令也。而王曰「見侮而不鬭者辱」，謂之辱則非之。無非而王辱之，故除其籍，不以爲臣。不以爲臣者，罰之也。此無罪而王罰之也。賞罰是非，相與四繆，雖十黃帝，不能理也。</p><p><strong>所出</strong>：《公孫龍子 · 1》 — https://zh.wikisource.org/wiki/公孫龍子/1</p></article></main></div></div>
