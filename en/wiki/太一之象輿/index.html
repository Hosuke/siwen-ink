    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 太一之象輿</nav></header><main><article><h1>太一之象輿</h1><p>乘太一所駕之象輿，飛朱鳥為前驅。</p><p>[[後聖李君]]乘三素景輿，從飛軿萬龍，出世於壬辰之年三月六日，以成[[太平]]。</p><p>又太上道君居太空瓊臺、洞真之殿、平玉之房、金華之內，侍女眾[[真人]]五萬人。[[真人]]青童匍匐而前，請受《[[靈書紫文]]》。</p><p><strong>所出</strong>：《太平經 · 01》 — https://zh.wikisource.org/wiki/太平經/01</p></article></main></div></div>
