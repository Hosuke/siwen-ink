    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 內聖外王</nav></header><main><article><h1>內聖外王</h1><p>內懷聖德而外施王道也。</p><p>是故<strong>內聖外王</strong>之道，闇而不明，鬱而不發，天下之人各為其所欲焉以自為方。悲夫，百家往而不反，必不合矣！後世之學者，不幸不見天地之純，古人之大體，道術將為天下裂。</p><p><strong>所出</strong>：《莊子 · 天下》 — https://zh.wikisource.org/wiki/莊子/天下</p></article></main></div></div>
