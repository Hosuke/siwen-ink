    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 鴻則離之</nav></header><main><article><h1>鴻則離之</h1><p>設網求魚而鴻誤入，以興所求非所欲</p><p>「魚網之設，鴻則離之。」設網本為求魚，乃鴻雁誤入而失所偶。此以喻求燕婉之美而得醜陋之人，猶之設網以待魚而鴻去也。義與前二章之「蘧篨不鮮」「蘧篨不殄」相承，皆言所求與所獲之相反也。</p><p><strong>所出</strong>：《詩經 · 新臺》 — https://zh.wikisource.org/wiki/詩經/新臺</p></article></main></div></div>
