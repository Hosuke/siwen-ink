    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 沐猴而冠</nav></header><main><article><h1>沐猴而冠</h1><p>譏項羽有勇無謀，徒具人形，終亡其國。</p><p>人或說項王曰：「關中阻山河四塞，地肥饒，可都以霸。」項王見秦宮皆以燒殘破，又心懷思欲東歸，曰：「富貴不歸故鄉，如衣繡夜行，誰知之者！」說者曰：「人言楚人沐猴而冠耳，果然。」項王聞之，烹說者。是以天下皆知羽失天下之民心，其敗亡之兆已伏於此言。</p><p><strong>所出</strong>：《史記 · 卷007》 — https://zh.wikisource.org/wiki/史記/卷007</p></article></main></div></div>
