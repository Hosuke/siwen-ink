    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 柞棫拔矣</nav></header><main><article><h1>柞棫拔矣</h1><p></p><p>柞棫拔矣，行道兌矣。混夷駾矣，維其喙矣。</p><p>  柞，白楊也。棫，離葉小木。皆叢生之木障塞行者。周人拔去之，使道路通達。行道之所以通者，人力所至也。</p><p>  <strong>所出</strong>：《詩經 · 緜》 — https://zh.wikisource.org/wiki/詩經/緜</p></article></main></div></div>
