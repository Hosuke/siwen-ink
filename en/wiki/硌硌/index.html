    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 硌硌</nav></header><main><article><h1>硌硌</h1><p>魚游散之貌</p><p>硌硌，魚散走之貌。詩言「鱸魚躍躍，硌硌」，言魚之跳躍往來於水中，悠然自得也。</p><p><strong>所出</strong>：《詩經 · 載驅》 — https://zh.wikisource.org/wiki/詩經/載驅</p></article></main></div></div>
