    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 女青鬼律記鬼名</nav></header><main><article><h1>女青鬼律記鬼名</h1><p>此律重下第二卷山海鬼姓名，服之三年，萬鬼不敢當。</p><p>太清玄元上三天太上律勅天地水三官主者，皇天初生，唯神為尊。今世愦愦，邪亂紛紛，不見真神，唯鬼亂人。今當紀別鬼名，定立三五神以治鬼。重下第二卷山海鬼姓名，服之三年，萬鬼不敢當。行來出入，制御邪魅。</p><p><strong>所出</strong>：《女青鬼律 · 卷2》 — https://zh.wikisource.org/wiki/女青鬼律/卷2</p></article></main></div></div>
