    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 嫡能悔過</nav></header><main><article><h1>嫡能悔過</h1><p>嫡妻悔悟己過，舊時婚俗之善也。</p><p>《毛詩序》論《江有汜》曰：「《江有汜》，美媵也。勤而無怨，嫡能悔過也。」嫡，謂正妻；媵，謂側室也。</p><p>江沱之閒，嫡不以媵備數，既遣之則已。及其事過情移，乃自悟其非，深以為悔。此嫡之悔過，非他人強之，乃自發於良心者也。</p><p>是故「悔過」之義，非徒有其事，必其人自知其非而改之，方為可貴。</p><p><strong>所出</strong>：《詩經 · 江有汜》 — https://zh.wikisource.org/wiki/詩經/江有汜</p></article></main></div></div>
