    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 聖王所以免於天地之誅</nav></header><main><article><h1>聖王所以免於天地之誅</h1><p>修德修刑修和修生，可免天地之罰。</p><p>日食則失德之國惡之，月食則失刑之國惡之，彗星見則失和之國惡之，風與日爭明則失生之國惡之。是故聖王日食則修德，月食則修刑，彗星見則修和，風與日爭明則修生。此四者，聖王所以免於天地之誅也。</p><p><strong>所出</strong>：《管子 · 第40篇四時》 — https://zh.wikisource.org/wiki/管子/第40篇四時</p></article></main></div></div>
