    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 變</nav></header><main><article><h1>變</h1><p>變者，右有與也。若右苟變，安可謂右？苟不變，安可謂變？二者相對而言之，乃有變之可說。</p><p>謂變非不變可乎？曰：可。右有與，可謂變乎？曰：可。變隻？曰：右。右苟變，安可謂右？苟不變，安可謂變？</p><p>夫變者，右有與之謂也。若右已變，則不得復謂之右；若右未變，則不得謂之變。唯其未嘗決然以言也，是以二苟無左又無右，二者左與右柰何？</p><p>是故變與不變，相待而言，非孤立之義也。有與則變，無與則不變；已變則非右，未變則非變。辯者審此，乃可以定名實。</p><p><strong>所出</strong>：《公孫龍子 · 4》 — https://zh.wikisource.org/wiki/公孫龍子/4</p></article></main></div></div>
