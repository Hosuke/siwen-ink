    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 若崩厥角</nav></header><main><article><h1>若崩厥角</h1><p>百姓歸附，急如野獸磕額。</p><p>百姓檁檁，若崩厥角。言百姓惶恐來歸，其狀若野獸之以額叩地然。厥角，以額觸地也。民不堪暴政，翹首以待義師，其心迫切，有若渴者求飲、迷者求路。此寫末世之民，急盼明主來臨，歸附之切如喪亡之迫也。</p><p><strong>所出</strong>：《尚書 · 泰誓中》 — https://zh.wikisource.org/wiki/尚書/泰誓中</p></article></main></div></div>
