    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 千里而戰兵不獲利</nav></header><main><article><h1>千里而戰兵不獲利</h1><p>師行千里，兵無所獲其利，匈奴不可以力征。</p><p>匈奴來請和親，天子下議。安國曰：「千里而戰，兵不獲利。今匈奴負戎馬之足，懷禽獸之心，遷徙鳥舉，難得而制也。得其地不足以爲廣，有其眾不足以爲彊，自上古不屬爲人。漢數千里爭利，則人馬罷，虜以全制其敝。」</p><p><strong>所出</strong>：《史記 · 卷108》 — https://zh.wikisource.org/wiki/史記/卷108</p></article></main></div></div>
