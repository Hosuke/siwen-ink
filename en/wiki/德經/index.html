    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 德經</nav></header><main><article><h1>德經</h1><p>大德之善言，治世之輔也</p><p>[[德經]]者，拘校上古、中古、下古大德之善言，以類相從而成者也。</p><p>[[太平經]]云：「拘校上古、中古、下古大德之辭，以為德經。」</p><p>大德之人，教化流布，其言足以輔世。拘校而聚之，去其復重，因次而編，則[[德經]]成焉。[[帝王]]案用之，與[[聖經]]並行，以成至治之化。</p><p><strong>所出</strong>：《太平經 · 09》 — https://zh.wikisource.org/wiki/太平經/09</p></article></main></div></div>
