    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 見賢思齊</nav></header><main><article><h1>見賢思齊</h1><p>見賢者則思與之齊，見不賢者則內自省。</p><p>見賢思齊焉，見不賢而內自省也。見賢則當思與之齊，不可自畫；見不賢則當內自省檢，勿蹈其轍。一則取法乎上，一則戒免乎下，此修德之大方也。</p><p><strong>所出</strong>：《論語 · 里仁第四》 — https://zh.wikisource.org/wiki/論語/里仁第四</p></article></main></div></div>
