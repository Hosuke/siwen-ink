    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 克敬惟親</nav></header><main><article><h1>克敬惟親</h1><p>天雖無常親，能敬則親。</p><p>尹誥以為：天無常親，鬼神無常享，唯敬與誠可以感之。民之歸懷亦然——罔常懷而懷于有仁。是故克敬，則天與人鬼皆親己；苟不敬，雖欲人之親己，不可得也。此[[天道無親]]而[[惟德是輔]]之義。</p><p><strong>所出</strong>：《尚書 · 太甲下》 — https://zh.wikisource.org/wiki/尚書/太甲下</p></article></main></div></div>
