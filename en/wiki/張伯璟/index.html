    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 張伯璟</nav></header><main><article><h1>張伯璟</h1><p></p><p>真人張伯璟字德瑩，[[張守真]]長子也。儀冠軒偉，豐玉枕，美鬚髯，人皆謂有正一之風。宋孝宗乾道中，侍正應先生赴召，高宗賜坐賜齋，御筆更名景淵。又見南內，宣演道法，甚嘉納焉。越月，高宗命正應大醮月臺，正應以景淵隸其事，每獲殊應，上加錫賚並賜象簡以歸。遂掌三元之教符錄，受者尤盛。初，皇子魏王鎮明州，以玉壇召師，相得尤厚。一日遣人甫來邀近，忽謂其徒曰：「人問之寵雖至，然吾自有仙期，不可爽矣。」遂隱-{几}-而化。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 19》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/19</p></article></main></div></div>
