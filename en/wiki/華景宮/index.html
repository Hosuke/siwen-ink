    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 華景宮</nav></header><main><article><h1>華景宮</h1><p>九素之炁所出，與太初天相表裏</p><p>華景宮，大洞經所言天真內景之宮也。</p><p>經云「炁出華景宮名中」，言九素之炁自華景宮出，與太初天相經緯。誦經者存思此宮，使景雲之炁充於泥丸，乃能與天真相感通。</p><p><strong>所出</strong>：《上清大洞真經 · 22章》 — https://zh.wikisource.org/wiki/上清大洞真經/22章</p></article></main></div></div>
