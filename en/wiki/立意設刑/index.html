    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 立意設刑</nav></header><main><article><h1>立意設刑</h1><p>聖人立刑德之旨，仁義並行，逆者致凶。</p><p>聊陳兩象，未能究悉。立意設刑，當仁施德，逆之者凶，順之者吉。</p><p>聖人治世，刑德相須，仁義並用。刑以糾姦，德以化民；仁以愛人，義以正己。陳兩象者，刑與德、仁與義，迭相為用也。施德在仁，設刑在義，恩威並行，寬猛相濟。逆此道者，凶必隨之；順此道者，吉必應之。</p><p><strong>所出</strong>：《周易參同契 · 17章》 — https://zh.wikisource.org/wiki/周易參同契/17章</p></article></main></div></div>
