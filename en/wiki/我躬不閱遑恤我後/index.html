    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 我躬不閱，遑恤我後</nav></header><main><article><h1>我躬不閱，遑恤我後</h1><p>身尚不容，何暇憂及身後之事；言困厄之極，無可如何也。</p><p>《小弁》八章卒章云：「莫高匪山，莫浚匪泉。君子無易由言，耳屬于垣。無逝我梁，無發我笱。我躬不閱，遑恤我後。」</p><p>言莫有高山而非泉水可浚者，莫有深泉而非山可增高者；君子不可輕易發言，蓋牆垣亦有耳也。又戒之曰：毋往我魚梁，毋發我魚笱。最後云：我身尚不能見容，何暇憂恤我身後之事邪？</p><p>《論語》記[[微子去之]]之類，皆此意也。</p><p><strong>所出</strong>：《詩經 · 小弁》 — https://zh.wikisource.org/wiki/詩經/小弁</p></article></main></div></div>
