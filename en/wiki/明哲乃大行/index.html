    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 明哲乃大行</nav></header><main><article><h1>明哲乃大行</h1><p>擅美自盛則必至於苓落，盛而不落者，未之有也。</p><p>「明乃哲，哲乃明，奮乃苓，明哲乃大行」，此言擅美主盛自奮也。以琅湯凌轢人，人之敗也常自此。是故聖人著之簡筴，傳以告後進曰：「奮盛苓落也。盛而不落者，未之有也。」故有道者不平其稱，不滿其量，不依其樂，不致其度。爵尊即肅士，祿豐則務施，功大而不伐，業明而不矜。夫名實之相怨久矣，是故絕而無交。惠者知其不可兩守，乃取一焉，故安而無憂。</p><p><strong>所出</strong>：《管子 · 第11篇宙合》 — https://zh.wikisource.org/wiki/管子/第11篇宙合</p></article></main></div></div>
