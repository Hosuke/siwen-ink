    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 振亂</nav></header><main><article><h1>振亂</h1><p>當世濁甚，非義兵不足以正之。</p><p>當今之世，濁甚矣，黔首之苦，不可以加矣。天子既絕，賢者廢伏，世主恣行，與民相離，黔首無所告愬。</p><p>世有賢主秀士，宜察此論也，則其兵為義矣。天下之民，且死者也而生，且辱者也而榮，且苦者也而逸。世主恣行，則中人將逃其君、去其親，又況於不肖者乎？故義兵至，則世主不能有其民矣，人親不能禁其子矣。</p><p><strong>所出</strong>：《呂氏春秋 · 卷七》 — https://zh.wikisource.org/wiki/呂氏春秋/卷七</p></article></main></div></div>
