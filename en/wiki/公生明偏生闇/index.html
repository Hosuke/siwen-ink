    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 公生明，偏生闇</nav></header><main><article><h1>公生明，偏生闇</h1><p>公正則明，偏私則闇，端愨則通，誠信則神。</p><p>公生明，偏生闇，端愨生通，詐僞生塞，誠信生神，夸誕生惑。此六生者，君子慎之，而禹、桀所以分也。</p><p><strong>所出</strong>：《荀子 · 不苟篇》 — https://zh.wikisource.org/wiki/荀子/不苟篇</p></article></main></div></div>
