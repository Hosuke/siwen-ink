    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 致數與无與</nav></header><main><article><h1>致數與无與</h1><p>過於計度反失其實，聖人不欲華美而務返樸質。</p><p>老子云：「致數與无與，是故不欲祿祿若玉，硌硌若石。」</p><p><strong>致數</strong>，過也；<strong>與</strong>，譽也。物至則有數，數極則與，不若無與之為全也。</p><p>是以聖人觀夫<strong>祿祿若玉</strong>者，華而不實；<strong>硌硌若石</strong>者，質而不炫。玉炫於外，則<strong>盈</strong>而難守；石塊然而處下，乃能<strong>久長</strong>。</p><p>此與[[致數車無車]]之義相發。皆言形式之譽不如實質之存，過於求數則失道矣。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第二章 得一》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
