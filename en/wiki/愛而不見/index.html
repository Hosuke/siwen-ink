    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 愛而不見</nav></header><main><article><h1>愛而不見</h1><p>情方深而跡潛藏，相見之機在隱微也。</p><p>靜女之詩，述戀人幽期之辭。「愛而不見」，靜女潛形以俟，情深而跡隱。愛，讀為薙，藏也；見，出現也。女子隱於城隅，男子至而不得遇，蓋情之所鍾，在所愛者前，每有羞怯之心，故匿跡以試其誠。</p><p>此與[[愛而不見]]同旨，而別於彤管之貽、荑之貽，其義在匿而非遺也。[[俟我於城隅]]乃其俟，[[搔首踟躕]]乃其情狀，而愛而不見乃其所以俟之所以然。情深者不以不見而怨，反以不見而思，此靜女之旨也。</p><p><strong>所出</strong>：《詩經 · 靜女》 — https://zh.wikisource.org/wiki/詩經/靜女</p></article></main></div></div>
