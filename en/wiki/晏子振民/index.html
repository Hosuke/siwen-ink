    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 晏子振民</nav></header><main><article><h1>晏子振民</h1><p>借役以振民，因事而施惠，晏子之智也。</p><p>景公之時饑，晏子請為民發粟，公不許。時方為路寢之台，晏子令吏重其僦，遠其兆，徐其日而不趨，三年，台成而民振。君子曰：「政則晏子欲發粟與民而已，若使不可得，則依物而偶于政。」</p><p>言發粟不得，則借築台之役以濟民力，使民得傭錢而食，是所謂不拂人情、不戾上意，而實惠及于下也。</p><p><strong>所出</strong>：《晏子春秋 · 卷五》 — https://zh.wikisource.org/wiki/晏子春秋/卷五</p></article></main></div></div>
