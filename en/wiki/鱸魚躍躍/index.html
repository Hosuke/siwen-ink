    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 鱸魚躍躍</nav></header><main><article><h1>鱸魚躍躍</h1><p>鱸魚跳躍之貌</p><p>鱸魚，水族之美者也。躍躍，往來跳動之貌。詩人立於河側，見鱸魚往來跳躍，自適其樂，以寓優遊之志。</p><p><strong>所出</strong>：《詩經 · 載驅》 — https://zh.wikisource.org/wiki/詩經/載驅</p></article></main></div></div>
