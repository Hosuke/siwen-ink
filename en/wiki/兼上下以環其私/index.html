    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 兼上下以環其私</nav></header><main><article><h1>兼上下以環其私</h1><p>兼上下而環營私利者，爵制不可加，必危其上</p><p>賢不肖之知於上，必由中央之人；財力之貢於上，必由中央之人。能易賢不肖，而可威黨於下。有能以民之財力，上陷其主，而可以勞於下。兼上下以環其私，爵制而不可加，則為人上者危矣。</p><p><strong>所出</strong>：《管子 · 第31篇君臣下》 — https://zh.wikisource.org/wiki/管子/第31篇君臣下</p></article></main></div></div>
