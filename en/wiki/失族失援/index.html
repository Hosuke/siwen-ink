    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 失族失援</nav></header><main><article><h1>失族失援</h1><p>羣官朋黨以懷其私，則失族；陰約閉謀以相待，則失援</p><p>四者無別，主失其體，羣官朋黨以懷其私，則失族矣。國之幾臣，陰約閉謀以相待也，則失援矣。失族於內，失援於外，此二亡也。</p><p><strong>所出</strong>：《管子 · 第31篇君臣下》 — https://zh.wikisource.org/wiki/管子/第31篇君臣下</p></article></main></div></div>
