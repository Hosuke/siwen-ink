    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 爰旌目不食盜食</nav></header><main><article><h1>爰旌目不食盜食</h1><p>義不食盜人之食，雖餓而死，不失名實。</p><p>[[東方]]有人焉，曰[[爰旌目]]，將有適也，而餓於道。[[狐父之盜]]曰[[丘]]，見而下壺餐以餔之。爰旌目三餔而後能視，曰：「子何爲者也？」曰：「我狐父之人丘也。」爰旌目曰：「譆！汝非盜邪？胡爲而食我？吾義不食子之食也。」兩手據地而歐之，不出，喀喀然，遂伏而死。狐父之人則盜矣，而食非盜也。以人之盜因謂食爲盜而不敢食，是失名實者也。</p><p><strong>所出</strong>：《列子 · 說符篇》 — https://zh.wikisource.org/wiki/列子/說符篇</p></article></main></div></div>
