    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 驃騎日以親貴</nav></header><main><article><h1>驃騎日以親貴</h1><p>霍去病日益親貴，門下多去事驃騎，唯任安不肯。</p><p>自是之後，大將軍青日退，而驃騎日益貴。舉大將軍故人門下多去事驃騎，輒得官爵，唯任安不肯。</p><p><strong>所出</strong>：《史記 · 卷111》 — https://zh.wikisource.org/wiki/史記/卷111</p></article></main></div></div>
