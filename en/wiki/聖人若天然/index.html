    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 聖人若天然</nav></header><main><article><h1>聖人若天然</h1><p>聖人無私覆無私載，若天若地。</p><p>是故聖人若天然，無私覆也；若地然，無私載也。私者，亂天下者也。</p><p>夫天之覆物也，無偏無頗；地之載物也，無棄無遺。聖人之心亦猶是焉。視天下如一體，愛萬民如赤子，無親疏遠近之別，無厚薄多寡之分。斯之謂無私覆、無私載也。</p><p>若夫私心一起，則智巧生而爭奪起，愛憎立而賞罰乖，亂之端也。是以明主務去其私，使心若天若地，廓然而大公，則天下自然治矣。</p><p><strong>所出</strong>：《管子 · 第37篇心術下》 — https://zh.wikisource.org/wiki/管子/第37篇心術下</p></article></main></div></div>
