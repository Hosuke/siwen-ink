    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 大道歌</nav></header><main><article><h1>大道歌</h1><p>述金丹全功，由築基以至脫胎</p><p>金丹之要在先天與後天之分。先天一點號眞鉛，後天渣質爲無用。命要傳，性要悟，靜功悟性動取藥。內有龜蛇顚倒縮，一陽發動便行功。斡轉天關須猛烈，陰生在午，卯酉行持要從容。黃婆宫中會姹女，姹女嬰兒自相配。要築基，須煉已，己純熟，明採取。九竅原在尾閭穴，先從腳底湧泉衝。溫養十箇月，老成更過三年，三三如九面丹壁。丹成長嘯出山去，上帝聞名下紫書，詔我朝天飛空碧。</p><p><strong>所出</strong>：《張三丰先生全集 · 卷4》 — https://zh.wikisource.org/wiki/張三丰先生全集/卷4</p></article></main></div></div>
