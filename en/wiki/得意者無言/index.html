    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 得意者無言</nav></header><main><article><h1>得意者無言</h1><p>得意者無需言說，言說皆出於不得已</p><p>子列子與南郭子連牆二十年，不相謁請。子列子門徒以為有敵。及子列子率弟子往見南郭子，果若欺魄而不可與接。南郭子俄而指末行者與言，衎衎然若專直而在雄者。子列子之徒咸有疑色。子列子曰：「得意者無言，進知者亦無言。用無言爲言亦言，無知爲知亦知。亦無所不言，亦無所不知；亦無所言，亦無所知。如斯而已。」</p><p><strong>所出</strong>：《列子 · 仲尼篇》 — https://zh.wikisource.org/wiki/列子/仲尼篇</p></article></main></div></div>
