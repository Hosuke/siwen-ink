    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 季女斯飢</nav></header><main><article><h1>季女斯飢</h1><p>喻賢者困於在下，雖美善而不得其所養，以諷世道之不平。</p><p>季女，少女之少者，婉孌美好之稱也。詩言婉孌之少女尚且飢餓者，以見在下之賢能無以自達也。</p><p>《候人》卒章云「婉兮孌兮，季女斯飢」，與首章「彼候人兮，何戈與祋」相呼應。候人為賤役而勤，季女為美善而飢，遠君子而好近小人之世，固若是倒置也。是故以季女之飢況賢人之困，其旨微，其刺深。</p><p><strong>所出</strong>：《詩經 · 候人》 — https://zh.wikisource.org/wiki/詩經/候人</p></article></main></div></div>
