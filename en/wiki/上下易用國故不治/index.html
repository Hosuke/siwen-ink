    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 上下易用</nav></header><main><article><h1>上下易用</h1><p>上下易用，國故不治</p><p>明男女之別，昭嫌疑之節，防其姦也。是以中外不通，讒慝不生，宮中亂曰妬紛，兄弟亂曰黨偏，大臣亂曰稱述，中民亂曰讋諄，小民亂曰財匱。[[中外不通]]</p><p><strong>所出</strong>：《管子 · 第31篇君臣下》 — https://zh.wikisource.org/wiki/管子/第31篇君臣下</p></article></main></div></div>
