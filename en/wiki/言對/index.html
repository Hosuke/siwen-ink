    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 言對</nav></header><main><article><h1>言對</h1><p>雙比空辭，無徵引實事，辭易而意淺者也。</p><p>言對者，雙比空辭者也。凡偶辭胸臆，言對所以為易也。是以言對為美，貴在精巧。</p><p>[[長卿]]《上林賦》-{云}-：「修容乎禮園，翱翔乎書圃。」此言對之類也。</p><p><strong>所出</strong>：《文心雕龍 · 麗辭》 — https://zh.wikisource.org/wiki/文心雕龍/麗辭</p></article></main></div></div>
