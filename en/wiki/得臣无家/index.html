    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 得臣无家</nav></header><main><article><h1>得臣无家</h1><p>不損以益天下，則天下皆臣，其心無私家。</p><p>上九曰：「弗損益之，无咎，貞吉，利有攸往，得臣无家。」夫上九以陽居損之極，不損於下而直益之，故无往不利，而天下之臣皆歸之。得臣无家者，以其心無私家之累，故能盡得天下之臣也。《象》曰「大得志也」，言上九之志，以天下為公家，無一家之私也。</p><p><strong>所出</strong>：《周易 · 損》 — https://zh.wikisource.org/wiki/周易/損</p></article></main></div></div>
