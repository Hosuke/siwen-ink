    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 人情大趣</nav></header><main><article><h1>人情大趣</h1><p>貧則怨人賤則怨時，莫有自怨者，此人情之大趣也。</p><p>貧則怨人，賤則怨時，而莫有自怨者，此人情之大趣也。然則不可以此是人情之大趣而一槩非之，亦有可矜者焉，不可不察也。今能同算鈞而彼富我貧，能不怨則美矣，雖怨無所非也。才鈞智同而彼貴我賤，能不怨則美矣，雖怨無所非也。其敝在於不知乘權藉勢之異，而雖曰智能之同，是不達之過，雖君子之郵，亦君子之怒也。</p><p><strong>所出</strong>：《尹文子 · 大道下》 — https://zh.wikisource.org/wiki/尹文子/大道下</p></article></main></div></div>
