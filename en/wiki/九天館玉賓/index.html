    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 九天館玉賓</nav></header><main><article><h1>九天館玉賓</h1><p>九天之上設玉館以待仙人。</p><p>九天館玉賓者，上清仙京之象也。金房唱霄歌，賢哉對帝賓左仙仲成子，役召伯幽車，是皆九天真館延迎玉賓之事。學者誦呪存思，幻想此景，則身已在玄阿之館、紫戶之庭，而玉京之賓可接引矣。</p><p><strong>所出</strong>：《上清大洞真經 · 2章》 — https://zh.wikisource.org/wiki/上清大洞真經/2章</p></article></main></div></div>
