    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 定獨威勝</nav></header><main><article><h1>定獨威勝</h1><p>定威必先定獨，威立則無敵於天下。</p><p>管子論威勝之道，於[[定獨威勝]]之本旨外，又申之以定計財、定聞知、定選士、定方用諸端，總為十二定。其言曰：「定獨威勝，定計財勝，定聞知勝，定選士勝，定制祿勝，定方用勝，定綸理勝，定死生勝，定成敗勝，定依奇勝，定實虛勝，定盛衰勝。」蓋威不徒在力，而在能定己之一、稽校之事，以成不可搖動之勢。</p><p>  <strong>所出</strong>：《管子 · 第09篇幼官圖》 — https://zh.wikisource.org/wiki/管子/第09篇幼官圖</p></article></main></div></div>
