    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 止於至善</nav></header><main><article><h1>止於至善</h1><p>居止於至善之地而不遷，此為人道之極致</p><p>大學之道，在止於至善。傳之三章詳釋其義：黃鳥止於丘隅，人當知其所當止。詩云「穆穆文王，於緝熙敬止」，為人君止於仁，為人臣止於敬，為人子止於孝，為人父止於慈，與國人交止於信。</p><p>止者，非徒止息之謂，乃安住乎至善之理而不遷移也。仁、敬、孝、慈、信，五者皆善之所在，各止其所，則至善在其中矣。</p><p><strong>所出</strong>：《大學》 — https://zh.wikisource.org/wiki/大學</p></article></main></div></div>
