    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 養性延命</nav></header><main><article><h1>養性延命</h1><p>修煉之道，以養性為本，可延命卻期，超乎命數。</p><p>欲期長生，必先養性。[[將欲取之必姑予之|將欲取之，必姑予之]]；將欲延命，必先養性。《參同契》云：「將欲養性，延命卻期。審思后末，當慮其先。」人稟父母之軀，體本一元。當審察其末終，必先究其根本。[[養生以不傷為本]]，《參同契》以為養性乃延命之本，養性則性主乎內，心神安定；延命則[[乾動而直，炁布精流]]，可以卻去命數之期，達於長生。</p><p><strong>所出</strong>：《周易參同契 · 20章》 — https://zh.wikisource.org/wiki/周易參同契/20章</p></article></main></div></div>
