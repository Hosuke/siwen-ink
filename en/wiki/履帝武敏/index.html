    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 履帝武敏</nav></header><main><article><h1>履帝武敏</h1><p>姜嫄踏上帝之足跡，感而有孕。</p><p>姜嫄祈子，見上帝之足跡，欣然踐履，心意感通，遂而有孕。詩-{云}-「履帝武敏歆」，言其所踐之跡倏然發動，而中心悅豫也。</p><p><strong>所出</strong>：《詩經 · 生民》 — https://zh.wikisource.org/wiki/詩經/生民</p></article></main></div></div>
