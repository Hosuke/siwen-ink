    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 冉求問未有天地</nav></header><main><article><h1>冉求問未有天地</h1><p>古猶今也，天地無始無終。</p><p>冉求問於仲尼曰：「未有天地可知邪？」仲尼曰：「可。古猶今也。」冉求失問而退。明日復見，曰：「昔者吾問『未有天地可知乎？』夫子曰：『可。古猶今也。』昔日吾昭然，今日吾昧然。敢問何謂也？」</p><p>仲尼曰：「昔之昭然也，神者先受之；今之昧然也，且又為不神者求邪？无古无今，无始无終。未有子孫而有子孫，可乎？」</p><p>夫天地者，古今一也。無古則無今，無始則無終。生死之化，亦若是爾。</p><p><strong>所出</strong>：《莊子 · 知北遊》 — https://zh.wikisource.org/wiki/莊子/知北遊</p></article></main></div></div>
