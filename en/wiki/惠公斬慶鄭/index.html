    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 惠公斬慶鄭</nav></header><main><article><h1>惠公斬慶鄭</h1><p>慶鄭以誤國獲罪，終被行刑</p><p>惠公未至，蛾析告慶鄭待刑以快君志。及絳郊，使家僕徒召之。慶鄭自陳三罪：不降、不聽諫、不敗，既敗而誅又失有罪。蛾析請赦以報秦，梁由靡以為「失刑亂政，不威」，不可赦。</p><p>司馬說數其罪四：失次犯令、擅進退、誤梁由靡、不面夷。遂斬慶鄭。</p><p>十五年，惠公卒，懷公立，秦納重耳，晉人殺懷公而授重耳，是為文公。</p><p><strong>所出</strong>：《國語 · 卷09》 — https://zh.wikisource.org/wiki/國語/卷09</p></article></main></div></div>
