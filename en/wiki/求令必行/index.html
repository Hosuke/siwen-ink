    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 求令必行</nav></header><main><article><h1>求令必行</h1><p>令出必行，賞罰必信，近者先服，遠者乃從。</p><p>能不通於官，受祿賞不當於功，號令逆於民心，動靜詭於時變，有功不必賞，有罪不必誅，令焉不必行，禁焉不必止，在上位無以使下，而求民之必用，不可得也。</p><p>將帥不嚴威，民心不專一，陳士不死制，卒士不輕敵，而求兵之必勝，不可得也。</p><p>內守不能完，外攻不能服，野戰不能制敵，侵伐不能威四鄰，而求國之重，不可得也。</p><p><strong>所出</strong>：《管子 · 第15篇重令》 — https://zh.wikisource.org/wiki/管子/第15篇重令</p></article></main></div></div>
