    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 材人</nav></header><main><article><h1>材人</h1><p>量材授官，各當其分</p><p>材人：愿愨拘錄，計數纖嗇，而無敢遺喪，是官人使吏之材也。脩飭端正，尊法敬分，而無傾側之心，守職脩業，不敢損益，可傳世也，而不可使侵奪，是士大夫官師之材也。知隆禮義之為尊君也，知好士之為美名也，知愛民之為安國也，知有常法之為一俗也，知尚賢使能之為長功也，知務本禁末之為多材也，知無與下爭小利之為便於事也，知明制度，權物稱用之為不泥也，是卿相輔佐之材也，未及君道也。能論官此三材者而無失其次，是謂人主之道也。</p><p><strong>所出</strong>：《荀子 · 君道篇》 — https://zh.wikisource.org/wiki/荀子/君道篇</p></article></main></div></div>
