    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 冥默無有</nav></header><main><article><h1>冥默無有</h1><p>玄者冥默，無形無名，萬物所自出</p><p>玄者，[[冥默無有]]也。</p><p>[[王弼]]注：「玄者，冥默無有也，始、母之所出也。不可得而名，故不可言同名曰玄。」玄，超言絕象，冥然而默，廓然無有，而為天地萬物之宗。欲名之，已非其實；欲言之，適增其蔽。[[王弼]]以為不可定名，正以其無名之實也。</p></article></main></div></div>
