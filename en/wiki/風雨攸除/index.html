    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 風雨攸除</nav></header><main><article><h1>風雨攸除</h1><p>宮室既成，風雨不入。</p><p>[[風雨攸除]]者，言宮室完固，風雨無由侵之也。除，去也。詩以風雨之無害，喻居室之安寧，此居家之福，亦可見其工之精、構之固也。</p><p><strong>所出</strong>：《詩經 · 斯干》 — https://zh.wikisource.org/wiki/詩經/斯干</p></article></main></div></div>
