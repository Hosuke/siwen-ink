    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 呂尚</nav></header><main><article><h1>呂尚</h1><p>冀州人，內智預見存亡，避紂隱遼東四十年，後垂釣蟠溪，得兵鈐，佐武王伐紂。</p><p>呂尚者，冀州人也。生而內智，預見存亡。避紂之亂，隱於遼東四十年。西適周，匿於南山，釣於蟠溪，三年不獲魚。比問皆曰：可已矣。尚曰：非爾所及也。已而果得兵鈐於魚腹中。</p><p>文王夢得聖人，聞尚，遂載而歸。</p><p>至周武王伐紂，尚作陰謀百餘篇。服澤芝地髓。且二百年而告亡，有難而不葬。後子伋葬之，無屍，唯有《玉鈐》六篇在棺中。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 3》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/3</p></article></main></div></div>
