    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 夷希微</nav></header><main><article><h1>夷希微</h1><p>道的三名，超乎感覺，不可致詰。</p><p>老子舉視聽搏握所不及者三名：視之不見曰夷，聽之不聞曰希，搏之不得曰微。夷希微三者，雖名言有別，實混而為一。一者道之全體，非耳目鼻口四肢所能窮，故不可致詰、無可推問。[[視之不見]]之義，實兼此三名而言之。</p><p><strong>所出</strong>：《道德經 (王弼本) · 十四章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
