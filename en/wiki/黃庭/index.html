    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 黃庭</nav></header><main><article><h1>黃庭</h1><p>人身之中，神氣所宅，修真之要庭也</p><p>人身之中，有黃庭焉。上距心中，下對關元，實神氣之淵藪，修真之要庭也。</p><p>經云：「上有黃庭下關元」，又云「黃庭中人衣朱衣」，又云「吾之言畢矣勿妄傳」。是經專以黃庭為宗，蓋內景之根柢、養生之樞機也。</p><p><strong>所出</strong>：《黃庭外景經》 — https://zh.wikisource.org/wiki/黃庭外景經</p></article></main></div></div>
