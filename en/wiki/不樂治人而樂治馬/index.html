    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 不樂治人而樂治馬</nav></header><main><article><h1>不樂治人而樂治馬</h1><p>晏子以為景公重馬而輕人，厚祿御夫而薄賢人，非治國之道。</p><p>景公悅翟王子羨之車駕，嬖人欲觀之，景公遂欲厚祿羨。晏子諫曰：「不樂治人，而樂治馬；不厚祿賢人，而厚祿御夫。」又引詩「載驂載駟，君子所屆」，以為駕八非制，重之則非制彌甚。又言景公不以厚德善政被諸侯，而易之以僻，非所以子民、彰名、致遠、親鄰之道。賢良廢滅，孤寡不振，而聽嬖妾以祿禦夫以蓄怨，此[[與民為仇之道也]]。景公善之，罷之。</p><p><strong>所出</strong>：《晏子春秋 · 卷一》 — https://zh.wikisource.org/wiki/晏子春秋/卷一</p></article></main></div></div>
