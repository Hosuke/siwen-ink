    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 為天下渾其心</nav></header><main><article><h1>為天下渾其心</h1><p>聖人渾同天下之心，使民不離也。</p><p>聖人在天下歙歙，為天下渾其心。</p><p>[[聖人無常心]]，其心無所主治，故天下之心渾然而歸一。夫智巧出則民心散，機智用則民情乖。渾其心者，非泯民之智也，去大智之鑿，使各安其性命之情，而不相傾也。[[百姓皆注其耳目]]，而[[聖人皆孩之]]，此渾心之效也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 四十九章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
