    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 圓鑒區域，大判條例</nav></header><main><article><h1>圓鑒區域，大判條例</h1><p>劉勰謂通才必資曉術，須圓觀鑒照全域，條例分明。</p><p>夫才之能通，必資曉術。自非圓鑒區域，大判條例，豈能控引源、製勝文苑哉！</p><p>「圓鑒區域」者，謂博觀而無遺，鑒照周遍乎文學之全域也。「大判條例」者，謂條理分明，剖析其體式法度也。二者相須，乃足以通才。蓋不截盤根，無以驗利器；不剖文奧，無以辨通才。是以圓與判兼備，術斯得矣。</p><p><strong>所出</strong>：《文心雕龍 · 總術》 — https://zh.wikisource.org/wiki/文心雕龍/總術</p></article></main></div></div>
