    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 甫及申</nav></header><main><article><h1>甫及申</h1><p>甫國申國，維周之翰，屏藩四方。</p><p>詩云「維申及甫，維周之翰」，言甫國、申國皆為周室之股肱，以文章德行為四方之屏障也。申伯受封於謝，奄有南土；甫國之君亦受命為冊，典制刑辟。 [[四國于蕃]] ， [[四方于宣]] ，皆申甫之功也。宣王褒賞申伯，[[吉甫作誦]]以美之，正以見申甫之於周室，關係至重。</p><p><strong>所出</strong>：《詩經 · 崧高》 — https://zh.wikisource.org/wiki/詩經/崧高</p></article></main></div></div>
