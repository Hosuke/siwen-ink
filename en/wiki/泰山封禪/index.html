    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 泰山封禪</nav></header><main><article><h1>泰山封禪</h1><p>孝武封禪泰山，祭天也；禪肅然山，祭地也；遂巡郡縣而還。</p><p>天子既已封[[泰山]]，無風雨菑，而方士更言蓬萊諸神山若將可得。於是上欣然庶幾遇之，乃復東至海上望。奉車子侯暴病，一日死。上乃遂去，并海上，北至碣石，巡自遼西，歷北邊至九原。五月，返至甘泉。有司言寶鼎出為元鼎，以今年為[[元封元年]]。</p><p><strong>所出</strong>：《史記 · 卷012》 — https://zh.wikisource.org/wiki/史記/卷012</p></article></main></div></div>
