    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 泉竭邦衰</nav></header><main><article><h1>泉竭邦衰</h1><p>泉水自中而竭，喻賢人隱退則國傾。</p><p>池之竭矣，不云自頻？泉之竭矣，不云自中？溥斯害矣，職兄斯弘，不烖我躬？</p><p>泉水之竭，必先自其中而竭；賢人之去，必先自朝廷而遠。詩言池水自岸旁而竭，泉水自中央而竭，言其源之先涸也。源竭而流亡，賢去而邦傾，理之自然也。</p><p>水竭則魚失其所，賢逝則國失其輔。召公之臣既沒，幽王之世無如召公者，是以賢路塞而邦業頹也。</p><p>以此喻治國之道：根本先傾，末節無益；賢能先去，雖欲有為，不可得已。</p><p><strong>所出</strong>：《詩經 · 召旻》 — https://zh.wikisource.org/wiki/詩經/召旻</p></article></main></div></div>
