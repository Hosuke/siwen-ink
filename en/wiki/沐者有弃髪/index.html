    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 沐者有弃髪</nav></header><main><article><h1>沐者有弃髪</h1><p>行事難免小害，不可以小害而廢大功。</p><p>夫沐者有弃髪，除者傷血肉。爲人見其難，因釋其業，是無術之士也。先聖有言曰：「規有摩而水有波，我欲更之，無奈之何！」此[[通權之言]]也。是以說有必立而曠於實者，言有辭拙而急於用者。故聖人不求無害之言，而務無易之事。</p><p><strong>所出</strong>：《韓非子 · 八說》 — https://zh.wikisource.org/wiki/韓非子/八說</p></article></main></div></div>
