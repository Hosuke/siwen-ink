    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 月有三政</nav></header><main><article><h1>月有三政</h1><p>一歲之中有三月之政，治道當循此理，不中者死，失理者亡。</p><p>月有三政，王事必理。以為必長，不中者死，失理者亡。</p><p><strong>所出</strong>：《管子 · 第40篇四時》 — https://zh.wikisource.org/wiki/管子/第40篇四時</p></article></main></div></div>
