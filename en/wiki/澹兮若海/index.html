    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 澹兮其若海</nav></header><main><article><h1>澹兮其若海</h1><p>聖人心量若海，寥廓無際。</p><p>澹者，靜而深之貌。言聖人之心淡然若海，寥廓廣大，無邊無際，不為物動，不為事拘，與道合真。</p><p><strong>所出</strong>：《道德經 (王弼本) · 二十章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
