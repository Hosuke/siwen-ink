    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 入國九惠之教</nav></header><main><article><h1>入國九惠之教</h1><p>治國以惠為本，列九策以養民也。</p><p>治國之道，莫先於惠。[[管子]]謂治國者，入其境，當行九惠之教，以養萬民。其九惠者：老老、慈幼、恤孤、養疾、合獨、問疾、通窮、振困、接絕是也。凡國都皆設官主其事，使老者得其養、幼者得其育、孤者得其恤、病者得其醫、鰥寡者得耦、死者後嗣得其祭、困窮者得其通、凶歲者得其濟、殉國者得其祀。九惠既行，則民心歸附，國本安定矣。</p><p><strong>所出</strong>：《管子 · 第54篇入國》 — https://zh.wikisource.org/wiki/管子/第54篇入國</p></article></main></div></div>
