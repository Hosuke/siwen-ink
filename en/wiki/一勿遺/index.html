    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 一勿遺</nav></header><main><article><h1>一勿遺</h1><p>湯伐夏，帝命亟絕其嗣，一人不留。</p><p>湯往征弗附，摯度摯德，自西翦西邑，戡其有夏。夏料民，入於水，曰戰。帝曰：「一勿遺。」言伐罪之師，當亟絕其嗣，一人不留也。尹之謀、湯之伐、帝之命，於是乎三才合矣。</p><p><strong>所出</strong>：《尚書 · 尹至》 — https://zh.wikisource.org/wiki/尚書/尹至</p></article></main></div></div>
