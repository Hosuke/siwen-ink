    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 會鄭伯于垂，假許田</nav></header><main><article><h1>會鄭伯于垂，假許田</h1><p>鄭以璧假田，公羊傳以為易田非禮。</p><p>桓公元年，「三月，公會鄭伯于垂。鄭伯以璧假許田。」</p><p>鄭伯以璧假許田，魯鄭易田也。公羊傳以為許田，先王所錫，不可以假易。</p><p><strong>所出</strong>：《春秋公羊傳 · 桓公》 — https://zh.wikisource.org/wiki/春秋公羊傳/桓公</p></article></main></div></div>
