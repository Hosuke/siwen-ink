    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 不得養其父母</nav></header><main><article><h1>不得養其父母</h1><p>征人從役，不得躬耕以養親，詩刺時政之本旨。</p><p>「不得養其父母」，此〈[[鴇羽]]〉詩刺時之本旨，亦毛詩序所言「君子下從征役，不得養其父母」之義。</p><p>詩人陳三章之苦，皆以「不能蓺」為言：不能蓺稷黍、不能蓺黍稷、不能蓺稻粱。不能蓺則無食可奉，父母何怙、何食、何嘗，皆無以答。三問皆歸於「悠悠蒼天」，愈見其無可如何。孝道不行，實由王事靡盬，刺時之意在此。</p><p><strong>所出</strong>：《詩經 · 鴇羽》 — https://zh.wikisource.org/wiki/詩經/鴇羽</p></article></main></div></div>
