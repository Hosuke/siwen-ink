    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 季平子與郈昭伯鬬雞</nav></header><main><article><h1>季平子與郈昭伯鬬雞</h1><p>季平子與郈昭伯因鬬雞結怨，導致魯亂。</p><p>而季平子與郈昭伯以鬬雞故得罪魯昭公，昭公率師擊平子，平子與孟氏、叔孫氏三家共攻昭公，昭公師敗，奔於齊。此魯國內亂之始也。</p><p><strong>所出</strong>：《史記 · 卷047》 — https://zh.wikisource.org/wiki/史記/卷047</p></article></main></div></div>
