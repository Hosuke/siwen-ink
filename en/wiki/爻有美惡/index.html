    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 爻有美惡</nav></header><main><article><h1>爻有美惡</h1><p>一卦之體必由一爻為主，指明一爻之美以統一卦之義；卦不由乎一爻則全以二體之義明之。</p><p>一卦之體必由一爻為主，則指明一爻之美以統一卦之義，大有之類是也。卦體不由乎一爻，則全以二體之義明之，豐卦之類是也。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷10》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷10</p></article></main></div></div>
