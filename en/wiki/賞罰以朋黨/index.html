    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 賞罰以朋黨</nav></header><main><article><h1>賞罰以朋黨</h1><p>選舉任人以黨為準，非賢路之正。</p><p>「而多黨者不必逸群之才也，信衆口，故謂其可焉。」又言賞罰不由銓衡，而以疏數輕重；不由度量，而以綸集多少。蓋皆以朋黨為準，非以賢能為斷也。</p><p><strong>所出</strong>：《抱朴子 · 卷50》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷50</p></article></main></div></div>
