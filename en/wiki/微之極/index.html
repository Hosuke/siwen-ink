    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 微之極</nav></header><main><article><h1>微之極</h1><p>妙者微之極，萬物始於微而後成</p><p>故常[[無欲]]以觀其妙。妙者，[[微之極也]]。</p><p>[[王弼]]注：「妙者，微之極也。萬物始於微而後成，始於無而後生。故常無欲空虛，可以觀其始物之妙。」微者，未著之始；妙者，觀微之通。[[王弼]]以「微之極」訓「妙」，言萬物成於微、始於無，守無欲之虛，乃可見其始生之妙。妙者，事物初動之微，造化之端倪也。</p></article></main></div></div>
