    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 嬴嬴縮縮</nav></header><main><article><h1>嬴嬴縮縮</h1><p>屈伸盈縮，與時消息，因天地之形而為之，此聖人觀時之義也。</p><p>修陰陽之從，而道天地之常。嬴嬴縮縮，因而為當。死死生生，因天地之形。</p><p><strong>所出</strong>：《管子 · 勢》 — https://zh.wikisource.org/wiki/管子/勢</p></article></main></div></div>
