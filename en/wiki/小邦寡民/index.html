    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 小邦寡民</nav></header><main><article><h1>小邦寡民</h1><p>理想國之規模，當人口寡少、國土褊小。</p><p>聖人欲治天下，必先去甚去奢，務崇儉約，使邦域小而人口寡。人口寡則欲寡，欲寡則民歸於樸。民樸則不爭，不爭則無用兵之厄，無竭澤之傷。邦之小也，非以為陋；民之寡也，乃以致安。《老子》本章云「小邦寡民」，言治者以小為功、以寡為德，使民各安其土、樂其俗，不以廣土眾民為貴也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章八十》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
