    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 神交</nav></header><main><article><h1>神交</h1><p>情愛相接神氣可交，大人和其心融其氣則可以將天下之兵滅天下之敵。</p><p>牝牡之道，龜龜相顧，神交也；鶴鶴相唳，氣交也。蓋由情愛相接，所以神氣可交也。是故大人大其道以合天地，廓其心以符至真，融其氣以生萬物，和其神以接兆民。我心熙熙，民心怡怡。心怡怡兮不知其所思，形惚惚兮不知其所為。若一氣之和合，若一神之混同，若一聲之哀樂，若一形之窮通。安用旌旗，安用金鼓，安用賞罰，安用行伍？斯可以將天下之兵，滅天下之敵。是謂神交之道也。</p><p><strong>所出</strong>：《化書 · 卷一》 — https://zh.wikisource.org/wiki/化書/卷一</p></article></main></div></div>
