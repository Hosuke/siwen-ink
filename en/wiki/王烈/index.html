    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 王烈</nav></header><main><article><h1>王烈</h1><p>嵇康之友，得石髓服之，復入石室見素書。</p><p>王烈字長休，鄴鄂人也。烈入海東抱犢山中，嘗與嵇叔夜同遊。烈得石髓如飴，即自服半，餘半與叔夜。叔夜既至，皆凝為石。又入一石室，室中有兩卷素書。烈讀，不知其字，不敢取，頗記十數字形體。歸，書之以示叔夜，叔夜盡知其字。烈喜，乃將叔夜同往，識其徑分明了了。往至，失石所在。烈因語弟子曰：「叔夜未應得仙也。」</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 31》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/31</p></article></main></div></div>
