    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 勿藥有喜</nav></header><main><article><h1>勿藥有喜</h1><p>疾可不藥而癒，承天之佑。</p><p>勿藥有喜者，九五陽剛中正，履至尊之位，而遇无妄之疾。夫疾之來，或有天數焉，非藥石所能治也。不眩於疾，不妄投醫藥，順其自然，則天佑之，喜可知矣。《象》曰「无妄之藥，不可試也」，言不可以人為而試於天也。聖人以此示人：天下之事有其自然而然者，不可強以人力。</p><p><strong>所出</strong>：《周易 · 无妄》 — https://zh.wikisource.org/wiki/周易/无妄</p></article></main></div></div>
