    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 來游來歌</nav></header><main><article><h1>來游來歌</h1><p>君子來遊，欣然賦詩。</p><p>豈弟君子，來游來歌，以矢其音。言君子之德平易近人，來遊此地而作歌，以陳其音聲也。</p><p><strong>所出</strong>：《詩經 · 卷阿》 — https://zh.wikisource.org/wiki/詩經/卷阿</p></article></main></div></div>
