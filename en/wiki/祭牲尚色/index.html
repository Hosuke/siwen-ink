    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 祭牲尚色</nav></header><main><article><h1>祭牲尚色</h1><p>四代祭祀所用犧牲及酒醴，各有所尚。</p><p>夏-{后}-氏，牲尚黑，殷白牡，周騂剛。泰，有虞氏之尊也。山罍，夏-{后}-氏之尊也。著，殷尊也。犧象，周尊也。爵，夏-{后}-氏以琖，殷以斝，周以爵。灌尊，夏-{后}-氏以雞夷。殷以斝，周以黃目。其勺，夏-{后}-氏以龍勺，殷以疏勺，周以蒲勺。夏-{后}-氏尚明水，殷尚醴，周尚酒。</p><p><strong>所出</strong>：《禮記 · 明堂位》 — https://zh.wikisource.org/wiki/禮記/明堂位</p></article></main></div></div>
