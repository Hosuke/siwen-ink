    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 山雲蒸柱礎潤</nav></header><main><article><h1>山雲蒸柱礎潤</h1><p>雲蒸於山則礎潤，伏苓掘則兔絲死，物之類也。</p><p>山雲蒸，柱礎潤；伏苓掘，兔絲死。一家失熛，百家皆燒；讒夫陰謀，百姓暴骸。</p><p>物之相關有如此者。故聖人防微而杜漸，慎之於未形。</p><p><strong>所出</strong>：《淮南子 · 說林訓》 — https://zh.wikisource.org/wiki/淮南子/說林訓</p></article></main></div></div>
