    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 銅金錢精鬼</nav></header><main><article><h1>銅金錢精鬼</h1><p>宅中銅金錢精主作祟之鬼</p><p>[[女青鬼律]]所記銅金錢精鬼有二名：令精華、是補坐。經云：「右二鬼，人家宅中有銅金錢精，主作於此鬼，鬼或變化作人形，居宅不安，呼之即去。」</p><p>此鬼在宅中銅金錢上，或變化作人形，令人居宅不安。呼其名即去。</p><p>蓋錢財亦能生鬼，知其名則可辟之。</p><p><strong>所出</strong>：《女青鬼律 · 卷4》 — https://zh.wikisource.org/wiki/女青鬼律/卷4</p></article></main></div></div>
