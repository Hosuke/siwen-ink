    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 德之本，教所生</nav></header><main><article><h1>德之本，教所生</h1><p>孝為德行根本，亦教化所由起也</p><p>夫孝，德之本也，教之所由生也。身體髮膚，受之父母，不敢毀傷，孝之始也；立身行道，揚名於後世，以顯父母，孝之終也。</p><p>夫孝，始於事親，中於事君，終於立身。《大雅》云：「無念爾祖，聿修厥德。」</p><p><strong>所出</strong>：《孝經》 — https://zh.wikisource.org/wiki/今文孝經</p></article></main></div></div>
