    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 往來井井</nav></header><main><article><h1>往來井井</h1><p>往者來者皆用其井，井道普施无私有常。</p><p>「往來井井。」言井之養人，往者取之，來者亦取之，无有禁也。水在井中，取之不竭，用之不盈，如是則往者[[改邑不改井]]，來者亦[[改邑不改井]]，人人各得其養也。此井道之公也。[[井收勿幕]]，勿幕者，不覆其口，[[往來井井]]者，人皆得而汲之也。井以養人為公，不私於一人，故往者用之而無喪，來者用之而無得，水不加多，亦不加少，此所以能長也。</p><p><strong>所出</strong>：《周易 · 井》 — https://zh.wikisource.org/wiki/周易/井</p></article></main></div></div>
