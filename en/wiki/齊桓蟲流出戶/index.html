    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 齊桓蟲流出戶</nav></header><main><article><h1>齊桓蟲流出戶</h1><p>桓公屍床上六十七日，屍蟲出戶，喻身后之慘</p><p>桓公病，五公子樹黨爭立。及桓公卒，相攻，以故宮中空，莫敢棺。桓公尸在床上六十七日，尸蟲出于戶。十二月乙亥，無詭立，乃棺赴。此言爭立構亂，至親不葬，示後世以國本先定為戒也。</p><p><strong>所出</strong>：《史記 · 卷032》 — https://zh.wikisource.org/wiki/史記/卷032</p></article></main></div></div>
