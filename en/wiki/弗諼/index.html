    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 弗諼</nav></header><main><article><h1>弗諼</h1><p>不忘之謂也。</p><p>「弗諼」者，不忘之謂。[[永矢弗諼]]言誓守此志，終不敢忘。《[[考槃]]》首章用此義，與「弗過」「弗告」相對而言之。弗諼者心之存，弗過者行之謹，弗告者言之慎，三者備而隱者之節全矣。</p><p><strong>所出</strong>：《詩經 · 考磐》 — https://zh.wikisource.org/wiki/詩經/考磐</p></article></main></div></div>
