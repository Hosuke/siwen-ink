    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 柔能制剛弱能制強</nav></header><main><article><h1>柔能制剛弱能制強</h1><p>柔者德也，弱者人所助；剛者賊也，強者怨之所攻。</p><p>《軍讖》曰：「柔能制剛，弱能制強。」</p><p>柔者，德也；剛者，賊也。弱者，人之所助；強者，怨之所攻。柔有所設，剛有所施；弱有所用，強有所加。兼此四者，而制其宜。</p><p>又曰：「能柔能剛，其國彌光；能弱能強，其國彌彰。純柔純弱，其國必削；純剛純強，其國必亡。」</p><p>剛柔相濟，弱強迭用，此聖人應事機之道也。柔非懦弱，乃含藏收斂之意；剛非暴虐，乃果斷行事之能。唯兼備而制宜，方可保國安民。</p><p><strong>所出</strong>：《三略》 — https://zh.wikisource.org/wiki/三略</p></article></main></div></div>
