    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 葛藟施于條枚</nav></header><main><article><h1>葛藟施于條枚</h1><p>葛藤延蔓，依附條枚，以興君子依循正道，求福不回。</p><p>莫莫葛藟，施于條枚。葛藟，藤類也，纍緣草木之莖而上行；條，枝也；枚，榦也。葛藟蔓延，依附於條枚而生，喻萬物各有所依附。君子亦然，依循先王之道，不敢有違。末章言「求福不回」，不回者，不違背也。葛藟之依附，正以況君子之依附於正道，其福乃得，非枉道以求之也。</p><p><strong>所出</strong>：《詩經 · 旱麓》 — https://zh.wikisource.org/wiki/詩經/旱麓</p></article></main></div></div>
