    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 乘其墉</nav></header><main><article><h1>乘其墉</h1><p>乘人之垣，未克而義</p><p>「乘其墉」者，[[同人]]九四之爻辭也。</p><p>九四陽居陰位，不中不正，處上卦之下，欲奪九五之應，據六二之好，乘人之垣而攻之。然弗克者，言其力不足以勝也。</p><p>象曰「乘其墉，義弗克也。其吉，則困而反則也」，言以不義而乘人，人亦以不義拒之，故弗克。然而困而不失其則，卒能反於正道，是以吉也。</p><p><strong>所出</strong>：《周易 · 同人》 — https://zh.wikisource.org/wiki/周易/同人</p></article></main></div></div>
