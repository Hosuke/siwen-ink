    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 善診者察色按脈先別陰陽</nav></header><main><article><h1>善診者察色按脈先別陰陽</h1><p>診病之要，先別陰陽，陰陽既明，則病無遁情。</p><p>語出 [[陰陽應象大論]]。歧伯云：「善診者，察色按脈，先別陰陽；審清濁，而知部分；視喘息，聽音聲，而知所苦；觀權衡規矩，而知病所主。按尺寸，觀浮沈滑澀，而知病所生；以治無過，以診則不失矣。」</p><p>診病之法，望聞問切，四者皆備，而以別陰陽為首。陰陽既辨，然後審其色脈所現，觀其喘息所苦，以定病之所主，則治之無過矣。</p><p><strong>所出</strong>：《黃帝內經 · 素問第二卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第二卷</p></article></main></div></div>
