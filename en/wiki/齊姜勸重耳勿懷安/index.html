    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 齊姜勸重耳勿懷安</nav></header><main><article><h1>齊姜勸重耳勿懷安</h1><p>齊姜引詩書勸重耳勿懷安，申言天時將至。</p><p>齊侯妻重耳，甚善焉。重耳安之，曰：「民生安樂，誰知其他？」桓公卒，孝公即位，諸侯叛齊。齊姜知重耳有安齊終焉之志，乃戒之曰：「從者將以子行。子必從之，不可以貳。《詩》云：『上帝臨女，無貳爾心。』」又引《周詩》《鄭詩》以明懷安之害，述管仲之訓，云：「時日及矣，公子幾矣。君國可以濟百姓，而釋之者，非人也。」公子弗聽。</p><p><strong>所出</strong>：《國語 · 卷10》 — https://zh.wikisource.org/wiki/國語/卷10</p></article></main></div></div>
