    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 雜性不合</nav></header><main><article><h1>雜性不合</h1><p>異類之物不可同煉，強合則敗。</p><p>雜性不同類，安肯同體居。丹家之要，在知物性之同異。同類者，金與金、砂與汞、陰與陽、剛與柔，相得而化。異類者，水與火、金與木、雜石與五金，強合之則乖戾而不成。</p><p>五石之銅，非砂非汞；羌石膽、雲母、礬磁、硫磺、泥汞，各有性焉。鼓之下之，雜然而煉，欲成丹道，譬如烹馬而求其生於水，伐木而欲其生於火，安可得乎？</p><p>故修煉之失，無過於雜取異類；雜性不合，雖千萬舉必萬敗矣。</p><p><strong>所出</strong>：《周易參同契 · 12章》 — https://zh.wikisource.org/wiki/周易參同契/12章</p></article></main></div></div>
