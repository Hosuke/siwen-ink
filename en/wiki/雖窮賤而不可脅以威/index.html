    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 雖窮賤而不可脅以威</nav></header><main><article><h1>雖窮賤而不可脅以威</h1><p>賢者雖居賤位，終不可威武所能屈服，以見志節之堅。</p><p>抱朴子贊大賢之操曰：「雖窮賤，而不可脅以威；雖危苦，而不可動以利。」</p><p><strong>所出</strong>：《抱朴子 · 卷20》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷20</p></article></main></div></div>
