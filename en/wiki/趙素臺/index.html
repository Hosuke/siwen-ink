    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 趙素臺</nav></header><main><article><h1>趙素臺</h1><p>漢幽州刺史趙熙女，熙積陰德濟困乏，女得遊洞天，居易遷宮四百年。</p><p>趙素臺者，漢幽州刺史趙熙之女也。熙少有善行，常濟窮困，救王惠等族，殊有陰德數十年，熙得身詣朱陵，兒子得遊洞天素臺，在易遷宮中已四百年，不肯移去，自謂：「天下無復樂於此處也。」數微服遊行，眄山澤以自足。易遷夫人者，乃其品也。</p><p><strong>所出</strong>：《墉城集仙錄 · 卷07》 — https://zh.wikisource.org/wiki/墉城集仙錄/卷07</p></article></main></div></div>
