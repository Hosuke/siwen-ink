    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 蹄筌之喻</nav></header><main><article><h1>蹄筌之喻</h1><p>以蹄捕兔、以筌取魚為喻，謂言象為得意之具，既得則忘。</p><p>言者象之蹄也，象者意之筌也。蹄所以在兔，得兔而忘蹄；筌所以在魚，得魚而忘筌。是以存言者非得象，存象者非得意。象生於意，而存象焉則所存非其象；言生於象，而存言焉則所存非其言。忘象者乃得意，忘言者乃得象。故立象以盡意而象可忘，重畫以盡情而畫可忘。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷10》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷10</p></article></main></div></div>
