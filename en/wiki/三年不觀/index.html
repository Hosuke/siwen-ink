    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 三年不觀</nav></header><main><article><h1>三年不觀</h1><p>董仲舒下帷講誦，三年不觀於舍園，其精如此。</p><p>董仲舒以治春秋，孝景時為博士。下帷講誦，弟子傳以久次相受業，或莫見其面。蓋三年董仲舒不觀於舍園，其精如此。進退容止，非禮不行，學士皆師尊之。</p><p>[[三年不觀]] 以言專精向學之至也。仲舒為學如此，故能名明春秋，傳公羊氏也。</p><p><strong>所出</strong>：《史記 · 卷121》 — https://zh.wikisource.org/wiki/史記/卷121</p></article></main></div></div>
