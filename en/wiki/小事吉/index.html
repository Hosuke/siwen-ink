    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 小事吉</nav></header><main><article><h1>小事吉</h1><p>睽卦柔中應剛，小事可成。</p><p>「小事吉」者，睽卦彖辭也。蓋睽之成卦，柔得中而上行，應乎九二之剛，以悅而麗乎明，以柔而應乎健，故小事得吉。吉者，非大事之謂，乃凡以柔和致詳者皆可言吉也。然聖人不明言「吉」而曰「小事吉」者，正以見睽之世，大有為者必資剛健，不可以柔懦成之也。</p><p><strong>所出</strong>：《周易 · 睽》 — https://zh.wikisource.org/wiki/周易/睽</p></article></main></div></div>
