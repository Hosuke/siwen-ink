    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 赤螭青虯</nav></header><main><article><h1>赤螭青虯</h1><p>赤螭青虯，神龍也，小大之辨存乎境界之殊。</p><p>赤螭、青虯之游冀州，天清地定，毒獸不作，飛鳥不駭，入榛薄，食薦梅，蛇鱔輕之以為不能與之爭於江海。及其[[玄雲之素朝]]，陰陽交爭，降扶風，雜凍雨，威動天地，蛇鱔著泥百仞，熊羆失木枝。是故明於小動之跡者，不知大節之所由成。</p><p><strong>所出</strong>：《淮南子 · 覽冥訓》 — https://zh.wikisource.org/wiki/淮南子/覽冥訓</p></article></main></div></div>
