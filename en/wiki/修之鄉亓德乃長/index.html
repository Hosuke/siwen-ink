    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 修之鄉亓德乃長</nav></header><main><article><h1>修之鄉亓德乃長</h1><p>德修於鄉，其德滋長，可以化俗。</p><p>由家而鄉，由近及遠。[[修之家亓德有餘|修之家]]之德有餘，推而及於一鄉，則風俗以之移易，德化浸以深厚，其德乃長。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第十七章 善觀》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
