    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 小年不及大年</nav></header><main><article><h1>小年不及大年</h1><p>小知不及大知，小年不及大年，以壽命之短長而喻境界之高低。</p><p>朝菌不知晦朔，蟪蛄不知春秋，此小年也。楚之南有冥靈者，以五百歲為春，五百歲為秋；上古有大椿者，以八千歲為春，八千歲為秋。而彭祖乃今以久特聞，眾人匹之，不亦悲乎！</p><p>小年之物，不知大年之境；小知之人，不及大知之觀。世人以彭祖之壽為至，而不知更有冥靈、大椿以千歲為春秋者，其視彭祖，不亦悲乎！</p><p><strong>所出</strong>：《莊子 · 逍遙遊》 — https://zh.wikisource.org/wiki/莊子/逍遙遊</p></article></main></div></div>
