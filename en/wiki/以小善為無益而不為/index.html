    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 以小善為無益而不為</nav></header><main><article><h1>以小善為無益而不為</h1><p>忽於小善，積成大惡，不可掩止。</p><p>安忍為之！過而不改，斯誠委夷路而陷叢棘，舍嘉旨而咽鉤吻者也，豈所謂以小善為無益而不為，以小惡為無損而不止，以至惡積而不可掩，罪大而不可解者邪！</p><p>夫[[積小以高大]]，[[積善成德]]，皆由累積而至。善既可積，惡亦可積。忽小善而不為，則善日削；諱小惡而不改，則惡日增。及其積也，雖欲改之，已無及矣。</p><p><strong>所出</strong>：《抱朴子 · 卷25》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷25</p></article></main></div></div>
