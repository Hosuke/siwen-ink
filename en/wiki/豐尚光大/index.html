    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 豐尚光大</nav></header><main><article><h1>豐尚光大</h1><p>豐明以動之卦，尚於光顯宣揚暢；爻皆以居陽位又不應隂為美。</p><p>豐此一卦明以動之卦也，尚於光顯宣揚暢者也。故爻皆以居陽位又不應隂為美，其統在於惡闇而巳矣。小闇謂之沛，大闇謂之蔀，闇甚則明盡，未盡則明昧。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷10》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷10</p></article></main></div></div>
