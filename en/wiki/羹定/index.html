    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 羹定</nav></header><main><article><h1>羹定</h1><p>肉羹煮孰可食，禮以時節為準也</p><p>禮云「羹定」，言肉羹之孰也。公食大夫之禮，鼎實既陳，羹在鼎中，必待其熟而定其時。《儀禮》首言「羹定」，甸人陳鼎，士舉鼎去鼏，次于陳之，皆以羹既孰、禮可行事也。蓋羹為食禮之主饌，必先熟而定，方依次進食焉。</p><p><strong>所出</strong>：《儀禮 · 公食大夫禮》 — https://zh.wikisource.org/wiki/儀禮/公食大夫禮</p></article></main></div></div>
