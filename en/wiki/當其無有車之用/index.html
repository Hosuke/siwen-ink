    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 當其無有車之用</nav></header><main><article><h1>當其無有車之用</h1><p>車轂中虛，故能運轉；明虛無為大用之本。</p><p>三十輻共一轂。轂，車輪之中央孔也，受軸以行。</p><p>當其無，有車之用。河上公注云：轂空虛，故車得運轉。蓋車之用，不在輻之多寡，而在轂中有「無」。苟無其虛以容軸，雖有三十輻，終不能行。是故<strong>無為本，有為末</strong>。</p><p><strong>所出</strong>：《老子河上公章句 · 無用》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
