    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 袁盎刺殺</nav></header><main><article><h1>袁盎刺殺</h1><p>梁王怨望，遣使刺殺袁盎等議臣十餘人。</p><p>其夏四月，上立膠東王為太子。梁王怨袁盎及議臣，乃與羊勝、公孫詭之屬陰使人刺殺袁盎及他議臣十餘人。逐其賊，未得也。於是天子意梁王，逐賊，果梁使之。乃遣使冠蓋相望於道，覆按梁，捕公孫詭、羊勝。公孫詭、羊勝匿王後宮。使者責二千石急，梁相軒丘豹及內史韓安國進諫王，王乃令勝、詭皆自殺，出之。</p><p>上由此怨望於梁王。梁王恐，乃使韓安國因長公主謝罪太后，然后得釋。</p><p><strong>所出</strong>：《史記 · 卷058》 — https://zh.wikisource.org/wiki/史記/卷058</p></article></main></div></div>
