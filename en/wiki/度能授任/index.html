    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 度能授任</nav></header><main><article><h1>度能授任</h1><p>授任必量其能，否則傾覆及之。</p><p>抱朴子曰：「臣職分則治，統廣則多滯。非賁獲之壯，不可以舉兼人之重；非萬夫之特，不可以總異官之局。韓侯所以罪侵冒之典，子元所以懼不勝之禍也。」若乃才力絕倫者，可兼而任之；若非此器，則宜自忖引，轅若載重，鮮不及矣。常人貪榮，不慮後患，身既傾溺，而禍逮君親，不亦哀哉！</p><p><strong>所出</strong>：《抱朴子 · 卷06》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷06</p></article></main></div></div>
