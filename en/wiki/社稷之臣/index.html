    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 社稷之臣</nav></header><main><article><h1>社稷之臣</h1><p>輔少主、守城郭，招之不來，麾之不去。</p><p>黯多病，病且滿三月，上常賜告者數，終不愈。最後病，莊助為請告。上曰：「汲黯何如人哉？」助曰：「使黯任職居官，無以踰人。然至其輔少主，守城深堅，招之不來，麾之不去，雖自謂賁育亦不能奪之矣。」上曰：「然。古有社稷之臣，至如黯，近之矣。」</p><p><strong>所出</strong>：《史記 · 卷120》 — https://zh.wikisource.org/wiki/史記/卷120</p></article></main></div></div>
