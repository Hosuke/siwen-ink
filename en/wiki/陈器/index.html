    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 陈器</nav></header><main><article><h1>陈器</h1><p>葬前陳列明器于壙上。</p><p>厥明，陳鼎五于門外，如初。東方之饌：四豆，四笾，醴酒。陳器。滅燎。執燭俠輅，北面。豆南上，綪。笾南，北上，綪。俎二以成，南上，不綪。</p><p><strong>所出</strong>：《儀禮 · 既夕禮》 — https://zh.wikisource.org/wiki/儀禮/既夕禮</p></article></main></div></div>
