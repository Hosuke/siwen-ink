    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 兄弟不如友生</nav></header><main><article><h1>兄弟不如友生</h1><p>太平之世，或以友情勝於兄弟。</p><p>《常棣》五章云：「喪亂既平，既安且寧。雖有兄弟，不如友生。」此詩之一轉筆。當喪亂之際，兄弟急難相救；及乎太平，則友生之情或為殷勤，而兄弟反若疏闊。蓋傷之也。然終篇仍歸於室家之和樂，正見兄弟之情義不因時勢而替也。</p><p><strong>所出</strong>：《詩經 · 常棣》 — https://zh.wikisource.org/wiki/詩經/常棣</p></article></main></div></div>
