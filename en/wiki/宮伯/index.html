    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 宮伯</nav></header><main><article><h1>宮伯</h1><p>中士二人，掌王宮士庶子政令與其誅賞</p><p>宮伯，中士二人，下士四人；府一人，史二人，胥二人，徒二十人。</p><p>掌王宮之士庶子，凡在版者。掌其政令，行其秩敘，作其徒役之事。授八次八舍之職事。</p><p>若邦有大事，作宮眾，則令之。月終則均秩，歲終則均敘。以時頒其衣裘，掌其誅賞。</p><p><strong>所出</strong>：《周禮 · 天官冢宰》 — https://zh.wikisource.org/wiki/周禮/天官冢宰</p></article></main></div></div>
