    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 法平則吏無姦</nav></header><main><article><h1>法平則吏無姦</h1><p>法度公平，則姦吏無所用其私。</p><p>[[韓非]]云「法平則吏無姦」。令之要，在於公平畫一，不為私情所移，不為巧言所動。法官持平，則姦者無隙可乘，吏治自清矣。</p><p><strong>所出</strong>：《韓非子 · 飭令》 — https://zh.wikisource.org/wiki/韓非子/飭令</p></article></main></div></div>
