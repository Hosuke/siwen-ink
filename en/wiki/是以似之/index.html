    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 是以似之</nav></header><main><article><h1>是以似之</h1><p>子孫似其先人，以德相傳也。</p><p>「維其有之，是以似之。」似，像也。言先君子有其德，後子孫亦肖其德而不失也。《傳》曰「似，嗣也」，子肖父德，傳之永久。《禮》曰「父母生子，傳之宗族」，善述父事，是之謂似。</p><p><strong>所出</strong>：《詩經 · 裳裳者華》 — https://zh.wikisource.org/wiki/詩經/裳裳者華</p></article></main></div></div>
