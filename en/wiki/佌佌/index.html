    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 佌佌</nav></header><main><article><h1>佌佌</h1><p>狀人之卑微渺小也。</p><p>《正月》有云：「佌佌彼有屋，蔌蔌方有穀。」毛傳曰：「佌佌，小也。」蓋言小人得志，不過區區小屋，聊足以庇其身，較之君子闊達恢宏之度，相去遠矣。佌佌狀其貌，見其器小；蔌蔌言其聚，見其貪多。詩人所以刺當世者，以為在位者無德無才，徒據區區之祿，而賢者反沉於下僚也。</p><p><strong>所出</strong>：《詩經 · 正月》 — https://zh.wikisource.org/wiki/詩經/正月</p></article></main></div></div>
