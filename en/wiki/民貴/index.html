    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 民貴</nav></header><main><article><h1>民貴</h1><p>民為邦本，社稷次之，君為輕。</p><p>孟子言治道之序曰：「民為貴，社稷次之，君為輕。」民為邦本，無民則社稷無所奉，無社稷則君無所寄，故民最貴。得乎丘民之心者得天下，得乎天子之心者為諸侯，得乎諸侯之心者為大夫。又言諸侯若危害社稷，則可變置之；犧牲既成、粢盛既潔、祭祀以時，而仍有旱乾水溢之患，則亦當變置社稷。推而至於天子，亦必順民心而後可立也。</p><p><strong>所出</strong>：《孟子 · 盡心下》 — https://zh.wikisource.org/wiki/孟子/盡心下</p></article></main></div></div>
