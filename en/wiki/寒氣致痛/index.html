    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 寒氣致痛</nav></header><main><article><h1>寒氣致痛</h1><p>言寒氣侵襲經脈、腸胃諸處，所致諸痛之狀及機理。</p><p>黃帝問五藏卒痛何氣使然。歧伯對曰：「經脈流行不止，環周不休，寒氣入經而稽遲，泣而不行，客於脈外則血少，客於脈中則氣不通，故卒然而痛。」遂詳述寒氣客於脈外、脈中、腸胃之間、俠脊之脈、衝脈、背俞之脈、厥陰之脈、陰股、小腸膜原、五藏、腸胃、小腸諸所，所致痛狀各異，皆由寒氣稽留、氣血不通所致。</p><p><strong>所出</strong>：《黃帝內經 · 素問第十一卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十一卷</p></article></main></div></div>
