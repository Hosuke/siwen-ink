    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 比之匪人</nav></header><main><article><h1>比之匪人</h1><p>親附非其人，自取其傷。</p><p>比之匪人，謂親附非其人也。《比》六三象曰「比之匪人，不亦傷乎」，言六三陰柔不中不正，居上下之交而承乘皆陰，所比皆非其人，自取其傷也。匪人者，不當親附之人也。親附之道，首在知人；不擇賢愚而妄比，鮮有不敗者。</p><p><strong>所出</strong>：《周易 · 比》 — https://zh.wikisource.org/wiki/周易/比</p></article></main></div></div>
