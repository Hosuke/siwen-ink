    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 剽姚校尉</nav></header><main><article><h1>剽姚校尉</h1><p>霍去病年十八為剽姚校尉，率壯士棄大軍赴利，斬捕過當。</p><p>大將軍姊子霍去病年十八，幸，為天子侍中。善騎射，再從大將軍，受詔與壯士，為剽姚校尉，與輕勇騎八百直棄大軍數百里赴利，斬捕首虜過當。</p><p><strong>所出</strong>：《史記 · 卷111》 — https://zh.wikisource.org/wiki/史記/卷111</p></article></main></div></div>
