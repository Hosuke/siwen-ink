    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 衡聽顯幽重明退姦進良之術</nav></header><main><article><h1>衡聽顯幽重明退姦進良之術</h1><p>廣聽兼納，明辨忠姦，黜退邪佞，登進賢良之方。</p><p>衡聽者，兼聽也；顯幽者，使幽隱之人顯達也；重明者，重明察也；退姦者，黜退姦人也；進良者，登進良士也。其要在於：凡流言浮說，不經官府而橫至者，君子慎之，不聽也；然而忠言嘉謀，則明通而行之。故姦言、姦說、姦事、姦謀、姦譽、姦愬，莫之敢試；忠言、忠說、忠事、忠謀、忠譽、忠愬，方起以盡。[[聽政之大分]] 云：「耳目心智股肱助」，正此意也。</p><p><strong>所出</strong>：《荀子 · 致士篇》 — https://zh.wikisource.org/wiki/荀子/致士篇</p></article></main></div></div>
