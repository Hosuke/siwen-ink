    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 童子坐玉闕</nav></header><main><article><h1>童子坐玉闕</h1><p>肺中有神童守之，居玉闕之上。</p><p>肺中有神，謂之童子，據玉闕而坐。玉闕者，肺臟之別稱，喻其精白瑩澈若玉。童子者，肺神之象，主居此宮而調護呼吸之氣。經云「下有童子坐玉闕」，言肺神居於其宮，守玉闕之門，為呼吸之主宰。</p><p><strong>所出</strong>：《黃庭內景經 · 肺部章第九》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/肺部章第九</p></article></main></div></div>
