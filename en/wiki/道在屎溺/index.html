    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 道在屎溺</nav></header><main><article><h1>道在屎溺</h1><p>道無所不在，雖至穢之物亦寓其中。</p><p>東郭子問於莊子曰：「所謂道，惡乎在？」莊子曰：「无所不在。」東郭子期而後可。莊子曰：「在螻蟻。」「何其下邪？」「在稊稗。」「何其愈下邪？」「在瓦甓。」「何其愈甚邪？」「在屎溺。」</p><p>東郭子不應。莊子曰：「正獲之問於監市履狶也，每下愈況。汝唯莫必，无乎逃物。」言道周徧咸，無物可逃，愈微而至者，乃愈得其真也。</p><p><strong>所出</strong>：《莊子 · 知北遊》 — https://zh.wikisource.org/wiki/莊子/知北遊</p></article></main></div></div>
