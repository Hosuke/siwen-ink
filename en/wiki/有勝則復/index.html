    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 有勝則復</nav></header><main><article><h1>有勝則復</h1><p>勝至則復，無勝則否，此六氣勝復之常理也。</p><p>歧伯論勝復之理：「時有常位，而氣無必也。」</p><p>「初氣終三氣，天氣主之，勝之常也。四氣盡終氣，地氣主之，復之常也。有勝則復，無勝則否。」</p><p>勝至則復，無常數也，衰乃止耳。復已而勝，不復則害，此傷生也。若復而反病者，乃居非其位，不相得也，大復其勝則主勝之，故反病也，所謂火燥熱也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第二十二卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第二十二卷</p></article></main></div></div>
