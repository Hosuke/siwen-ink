    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 達乎通塞之至理</nav></header><main><article><h1>達乎通塞之至理</h1><p>達人知命，不以通塞累心；賢士循理，縲紲無改其操。</p><p>達乎通塞之至理者，不悁悒於窮否；審乎自然之有命者，不逸豫於道行。抱朴子言乎君子之所以自處也。夫通塞者時也，否泰者運也，君子能窮理以觀其變，則時之通也不以是而矜，時之塞也不以是而慍。其心安定，如止水之無波，縈抑淵洿而無慍悶之心，振耀宸居而無得意之色。三仕三已，往者無怨，來者無欲，此其人之所以為大人也。知命之說，在乎順受其正，而非聽其自然以遂棄也。</p><p><strong>所出</strong>：《抱朴子 · 卷38》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷38</p></article></main></div></div>
