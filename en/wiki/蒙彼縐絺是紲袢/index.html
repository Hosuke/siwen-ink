    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 蒙彼縐絺，是紲袢也</nav></header><main><article><h1>蒙彼縐絺，是紲袢也</h1><p>覆彼細葛以為夏日之服</p><p>蒙彼縐絺、是紲袢，見於《詩經·君子偕老》。毛傳云：「蒙，覆也。縐絺，縐之靡者也。紲袢，暑之服也。」鄭玄云：「蒙覆彼細葛之布，以為暑時之袢服。」蓋縐絺者，細葛布之精者也；紲袢者，夏日之薄衣也。</p><p><strong>所出</strong>：《詩經 · 君子偕老》 — https://zh.wikisource.org/wiki/詩經/君子偕老</p></article></main></div></div>
