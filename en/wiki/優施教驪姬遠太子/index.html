    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 優施教驪姬遠太子</nav></header><main><article><h1>優施教驪姬遠太子</h1><p>優施謂申生精潔易辱，可先施讒以遠之。</p><p>優施教驪姬曰：「早處之，使知其極。夫人知極，鮮有慢心；雖其慢，乃易殘也。」又曰：「申生為人，小心精潔，而大志重，又不忍人。精潔易辱，重僨可疾，不忍人，必自忍也。辱之近行。」又云：「甚精必愚。精為易辱，愚不知避難。雖欲無遷，其得之乎？」是故先施讒於申生。</p><p><strong>所出</strong>：《國語 · 卷07》 — https://zh.wikisource.org/wiki/國語/卷07</p></article></main></div></div>
