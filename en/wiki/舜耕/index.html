    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 舜耕</nav></header><main><article><h1>舜耕</h1><p>舜起於小人，親事耕耘，恐而求中，終受堯禪</p><p>《保訓》述舜之事云：「昔舜久作小人，親耕於鬲茅。恐，救中。自詣厥志，不諱於庶萬眚之多欲，厥有施於上下遠埶，乃易立埶詣，測陰陽之物，咸川不逆。」</p><p>言舜昔嘗為凡人，親事耕耘於鬲茅之中。心存危懼，求取中道。已得中之後，言不易實變名，身茲備，惟允，翼翼不懈，用作三降之德。帝堯嘉之，用受厥緒。</p><p>是明聖人起於庸賤，而成於持中不懈。《保訓》以舜之事為「中」道之典範，欲太子發法之。</p><p><strong>所出</strong>：《尚書 · 保訓》 — https://zh.wikisource.org/wiki/尚書/保訓</p></article></main></div></div>
