    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 五帝憲</nav></header><main><article><h1>五帝憲</h1><p>五帝養氣體而不乞言，有善則記之</p><p>凡養老，五帝憲，三王有乞言。</p><p>五帝憲，養氣體而不乞言，有善則記之為惇史。</p><p>三王亦憲，既養老而後乞言，亦微其禮，皆有惇史。</p><p><strong>所出</strong>：《禮記 · 內則》 — https://zh.wikisource.org/wiki/禮記/內則</p></article></main></div></div>
