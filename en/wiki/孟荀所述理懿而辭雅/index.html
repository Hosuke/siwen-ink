    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 孟荀所述理懿而辭雅</nav></header><main><article><h1>孟荀所述理懿而辭雅</h1><p>孟子、荀子之書，理懿而辭雅。</p><p>孟荀所述，理懿而辭雅；管晏屬篇，事覈而言練；列御寇之書，氣偉而采奇；鄒子之說，心奢而辭壯；墨翟隨巢，意顯而語質；尸佼尉繚，術通而文鈍；鶡冠緜緜，亟發深言；鬼谷眇眇，每環奧義。</p><p><strong>所出</strong>：《文心雕龍 · 諸子》 — https://zh.wikisource/wiki/文心雕龍/諸子</p></article></main></div></div>
