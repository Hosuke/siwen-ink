    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 利一害百民去城郭</nav></header><main><article><h1>利一害百民去城郭</h1><p>利一害百則民散，利一害萬則國思散；去一利百則人慕澤，去一利萬則政不亂。</p><p>利壹害百，民去城郭；利壹害萬，國乃思散。去壹利百，人乃慕澤；去壹利萬，政乃不亂。</p><p>故治民使平，致平以清，則民得其所，而天下寧。犯上者尊，貪鄙者富，雖有聖王，不能致其治。犯上者誅，貪鄙者拘，則化行而眾惡消。</p><p><strong>所出</strong>：《三略》 — https://zh.wikisource.org/wiki/三略</p></article></main></div></div>
