    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 咸有一德</nav></header><main><article><h1>咸有一德</h1><p>君臣同道，上下一心。</p><p>咸有一德者，伊尹戒太甲之辭也。伊尹既復政厥辟，將告歸，陳戒于德，以天難諶命靡常為首言，以德唯一則吉、德二三則凶為樞要，而歸之於民歸于一德、天祐于一德。終以七世之廟觀德、萬夫之長觀政為效驗，而以匹夫匹婦皆得自盡為民主成功之本。商之所以有天下，非天之私，乃商之德足以一天下，而民之歸之也。湯與伊尹躬暨咸有純一之德，故能克享天心，受天明命而有九有之師，革夏正，建商緒。</p><p>伊尹作《咸有一德》。</p><p><strong>所出</strong>：《尚書 · 咸有一德》 — https://zh.wikisource.org/wiki/尚書/咸有一德</p></article></main></div></div>
