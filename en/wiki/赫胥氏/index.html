    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 赫胥氏</nav></header><main><article><h1>赫胥氏</h1><p>赫胥氏之世，民含哺而熙，鼓腹而遊，不知所為，不知所之，此太古至德之象。</p><p>夫赫胥氏之時，民居不知所為，行不知所之，含哺而熙，鼓腹而遊，民能以此矣。</p><p><strong>所出</strong>：《莊子 · 馬蹄》 — https://zh.wikisource.org/wiki/莊子/馬蹄</p></article></main></div></div>
