    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 唯止能止眾止</nav></header><main><article><h1>唯止能止眾止</h1><p>物之能用者，必有待於無用；止能止眾止，萬動原於不動。</p><p>雨之集無能霑，待其止而能有濡；矢之發無能貫，待其止而能有穿；唯止能止眾止。</p><p>物之待用者，必有待於無待。如雨無止則散漫無所潤，矢無止則力散無所穿。萬物之動，莫不本於不動；萬事之作，莫不原於不作。故曰「唯止能止眾止」，此以無為有之本、不用為用之原也。</p><p><strong>所出</strong>：《淮南子 · 說山訓》 — https://zh.wikisource.org/wiki/淮南子/說山訓</p></article></main></div></div>
