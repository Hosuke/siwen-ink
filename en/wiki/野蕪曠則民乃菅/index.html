    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 野蕪曠則民乃菅</nav></header><main><article><h1>野蕪曠則民乃菅</h1><p>田野荒蕪則民失其業，民失業則放縱妄為。</p><p>野蕪曠則民乃菅，上無量則民乃妄。文巧不禁則民乃淫，不墇兩原則刑乃繁。</p><p><strong>所出</strong>：《管子 · 第01篇牧民》 — https://zh.wikisource.org/wiki/管子/第01篇牧民</p></article></main></div></div>
