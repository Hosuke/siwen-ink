    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 粟行</nav></header><main><article><h1>粟行</h1><p>粟米流通之遠近，係國家虛實之徵驗。</p><p>粟行於三百里，則國毋一年之積；粟行於四百里，則國毋二年之積；粟行於五百里，則衆有飢色。田野萬家之衆，可食之地方五十里，可以爲足。萬家以下，就山澤可矣；萬家以上，去山澤可矣。彼野悉辟而民無積者，國地小而食地淺也；田半墾而民有餘食而粟米多者，國地大而食地博也。</p><p><strong>所出</strong>：《管子 · 第13篇八觀》 — https://zh.wikisource.org/wiki/管子/第13篇八觀</p></article></main></div></div>
