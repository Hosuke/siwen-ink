    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 道不遠人</nav></header><main><article><h1>道不遠人</h1><p>道在日用之間不可以遠人也。</p><p>子曰：「道不遠人。人之為道而遠人，不可以為道。《詩》云：『伐柯伐柯，其則不遠。』執柯以伐柯，睨而視之，猶以為遠。故君子以人治人，改而止。忠恕違道不遠，施諸己而不願，亦勿施於人。庸德之行，庸言之謹，有所不足，不敢不勉，有餘不敢盡；言顧行，行顧言，君子胡不慥慥爾！」</p><p><strong>所出</strong>：《中庸 · 中庸章句》 — https://zh.wikisource.org/wiki/四書章句集註/中庸章句</p></article></main></div></div>
