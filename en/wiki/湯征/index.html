    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 湯征</nav></header><main><article><h1>湯征</h1><p>湯伐葛伯，始於征討。</p><p>湯居亳，與葛為鄰。葛伯放而不祀，湯使人問之，使遺之牛羊，葛伯食之，又不以祀。湯使亳眾往為之耕，老弱饋食。葛伯率其民，要其有酒食黍稻者奪之，不授者殺之。有童子以黍肉餉，殺而奪之。《書》曰：「葛伯仇餉」，此之謂也。為其殺是童子而征之，四海之內皆曰：「非富天下也，為匹夫匹婦復讎也。」湯始征，自葛載。十一征而無敵於天下。東面而征，西夷怨；南面而征，北狄怨，曰：「奚為後我？」民之望之若大旱之望雨也。</p><p><strong>所出</strong>：《孟子 · 滕文公下》 — https://zh.wikisource.orgwiki/孟子/滕文公下</p></article></main></div></div>
