    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 取蕭祭脂</nav></header><main><article><h1>取蕭祭脂</h1><p>祭祀之時，取香蒿合牛脂，以享上帝。</p><p>祀上帝者，取香蒿之蕭，與牛腸脂合焚之，使氣上達。詩-{云}-「取蕭祭脂，取羝以軷」，言以香物燔炙之，致其誠敬，以興來歲之豐也。</p><p><strong>所出</strong>：《詩經 · 生民》 — https://zh.wikisource.org/wiki/詩經/生民</p></article></main></div></div>
