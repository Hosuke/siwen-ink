    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 輕千乘之國而重一言</nav></header><main><article><h1>輕千乘之國而重一言</h1><p>孔子稱楚莊王賢，以其能重一言之義，輕千乘之國。</p><p>孔子讀史記至楚復陳，曰：「賢哉楚莊王！輕千乘之國而重一言。」</p><p><strong>所出</strong>：《史記 · 卷036》 — https://zh.wikisource.org/wiki/史記/卷036</p></article></main></div></div>
