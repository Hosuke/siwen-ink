    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 信者信之</nav></header><main><article><h1>信者信之</h1><p>聖人待信不信，其德一也。</p><p>聖人之心，無信不信之別。見信者信之，見不信者亦信之。信者信之，是因其本信而信之；不信者亦信之，非以其不信而疑之，乃以信道感之、化之、俟之。此聖人之德充達，不以信不信二其心、不以誠欺易其度。夫信與不信皆百姓也，信者信之，是致其意；不信者亦信之，是俟其孚。信不信之名，待之如一，所謂德信者，信出於心之自然，非計較於外也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第十二章 德善》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
