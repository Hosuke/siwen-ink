    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 察能授官</nav></header><main><article><h1>察能授官</h1><p>考校賢能，依才授任，此為官之樞機。</p><p>察能授官，班祿賜予，使民之機也。凡牧民者，以其所積者食之，不可不審也。其積多者其食多，其積寡者其食寡，無積者不食。或有積而不食者，則民離上；有積多而食寡者，則民不力；有積寡而食多者，則民多詐；有無積而徒食者，則民偷幸。取於民有度，用之有止，國雖小必安；取於民無度，用之不止，國雖大必危。</p><p><strong>所出</strong>：《管子 · 第03篇權脩》 — https://zh.wikisource.org/wiki/管子/第03篇權脩</p></article></main></div></div>
