    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 諂諛之臣唯聖王知之</nav></header><main><article><h1>諂諛之臣唯聖王知之</h1><p>諂諛之臣，唯有聖王能知之而遠之，亂主則近之，故至身死國亡。</p><p>有臣如此，雖當聖王尚恐奪之，而況昏亂之君，其能無失乎？有臣如此者，皆身死國亡，為天下笑。故周威公身殺，國分為二；鄭子陽身殺，國分為三；陳靈公身死於夏徵舒氏；荆靈王死於乾谿之上；隨亡於荆；吳并於越；知伯滅於晉陽之下；桓公身死七日不收。故曰：諂諛之臣，唯聖王知之，而亂主近之，故至身死國亡。</p><p><strong>所出</strong>：《韓非子 · 說疑》 — https://zh.wikisource.org/wiki/韓非子/說疑</p></article></main></div></div>
