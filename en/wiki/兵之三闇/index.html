    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 兵之三闇</nav></header><main><article><h1>兵之三闇</h1><p>恃不信智、不守愚民、不戰卒僥倖取勝，兵之三闇也</p><p>夫兵之為事，不可僥倖以期勝也。今之為國者，乃有三闇焉：恃不信之人，而求以智；用不守之民，而欲以固；將不戰之卒，而幸以勝。凡此三者，皆亡國之師、敗軍之兆也。恃不信者不可以任智，彼己之不信，智何所用焉？用不守者不可以求固，民心已攜，國何由固？將不戰者不可以圖勝，卒無鬪志，僥倖適足以速亡。此兵之三闇，為將者不可不察也。</p><p><strong>所出</strong>：《管子 · 第44篇九變》 — https://zh.wikisource.org/wiki/管子/第44篇九變</p></article></main></div></div>
