    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 指與物非指</nav></header><main><article><h1>指與物非指</h1><p>指與物合而言之，則不得復謂之指。</p><p>指，非非指也。指與物，非指也。</p><p>[[指非指]] 之說也。指之所以為指，在其能指。指若與物合而言之，則指已化為物，不得復以指論之矣。此公孫龍析名實之要義也。</p><p><strong>所出</strong>：《公孫龍子 · 3》 — https://zh.wikisource.org/wiki/公孫龍子/3</p></article></main></div></div>
