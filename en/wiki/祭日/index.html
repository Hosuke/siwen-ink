    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 祭日</nav></header><main><article><h1>祭日</h1><p>天子以春日出祭於壇，昭示生物之德。</p><p>以冬日至始，數四十六日，冬盡而春始。天子東出其國四十六里而壇，服青而絻青，搢玉揔，帶玉監，朝諸侯卿大夫列士，循於百姓，號曰祭日，犧牲以魚。</p><p>言天子於春始之際，東行祭日之禮。東出四十六里者，從陽道而出也；服青尚木之德；搢玉揔、帶玉監，所以象陽氣之明也；犧牲以魚，魚潛深淵，春氣始達，萬物滋生之象也。</p><p><strong>所出</strong>：《管子 · 第85篇輕重己》 — https://zh.wikisource.org/wiki/管子/第85篇輕重己</p></article></main></div></div>
