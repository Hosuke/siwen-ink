    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 亡國之臣</nav></header><main><article><h1>亡國之臣</h1><p>六人者，皆亡國之臣，善以巧言亂主。</p><p>昔者有扈氏有失度，讙兜氏有孤男，三苗有成駒，桀有侯侈，紂有崇侯虎，晉有優施，此六人者，亡國之臣也。言是如非，言非如是，内險以賊，其外小謹，以徵其善；稱道往古，使良事沮；善禅其主，以集精微，亂之以其所好。</p><p><strong>所出</strong>：《韓非子 · 說疑》 — https://zh.wikisource.org/wiki/韓非子/說疑</p></article></main></div></div>
