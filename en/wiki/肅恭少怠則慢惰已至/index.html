    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 肅恭少怠，則慢惰已至；威嚴暫馳，則群邪生心</nav></header><main><article><h1>肅恭少怠，則慢惰已至；威嚴暫馳，則群邪生心</h1><p>威嚴不可稍弛，一懈即生禍亂</p><p>肅恭少怠，則慢惰已至；威嚴暫馳，則群邪生心。當怒不怒，奸臣為虎；當殺不殺，大賊乃發。水久壞河，山起咫尺。</p><p><strong>所出</strong>：《抱朴子 · 卷14》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷14</p></article></main></div></div>
