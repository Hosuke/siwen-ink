    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 順乎天而應乎人</nav></header><main><article><h1>順乎天而應乎人</h1><p>聖人之悅，循天理、應人心，合天道人事而言之。</p><p>語出彖傳。順乎天，循天理之正也；應乎人，順人心之欲也。剛中而柔外，乃能說以利貞；是以上悅天心、下合民情，天人皆應，治道之所以成也。</p><p><strong>所出</strong>：《周易 · 兌》 — https://zh.wikisource.org/wiki/周易/兌</p></article></main></div></div>
