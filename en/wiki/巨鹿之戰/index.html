    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 巨鹿之戰</nav></header><main><article><h1>巨鹿之戰</h1><p>項羽破釜沈舟，大破秦軍，諸侯膝行而屬。</p><p>秦將章邯圍趙王歇於鉅鹿。楚遣宋義為上將軍，項羽為次將。北救趙。義觀望不前，羽遂陽殺義，率兵渡河救鉅鹿。項羽令軍破釜沈舟，持三日糧，示必死無還心。楚兵踴躍大破秦軍，諸侯將皆屬項羽。自此，項羽為諸侯上將軍，諸侯兵皆屬焉，秦之亡蓋定於此。</p><p><strong>所出</strong>：《史記 · 卷016》 — https://zh.wikisource.org/wiki/史記/卷016</p></article></main></div></div>
