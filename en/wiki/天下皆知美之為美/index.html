    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 天下皆知美之為美</nav></header><main><article><h1>天下皆知美之為美</h1><p>美惡、善不善對待而生，執名則失道。</p><p>天下皆知美之為美、斯惡已。皆知善之為善、斯不善已。此言美惡、善不善，相待而立。舉天下咸知美之所以為美，則執美以為是，而惡斯形矣。咸知善之所以為善，則徇善以為實，而不善斯形矣。蓋執名起對，對執一生，對之名立，斯對之患生。此萬物之自然，非聖人之所為也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 二章》 — https://zh.wikisource.org/wiki/道德經_(王弼本)</p></article></main></div></div>
