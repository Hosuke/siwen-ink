    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 三滅關</nav></header><main><article><h1>三滅關</h1><p>天地人三重死關，必俱濟之乃得超昇。</p><p>[[三滅關]]者，天地人三重之關隘也。修行者必與日中白帝、日中黑帝俱濟之，方可啟籍登太明，出地戶之難，超凌九天。</p><p>三滅之義：滅死、滅滯、滅障。濟此關者，乃能七祖反胎嬰，世世登玉虛之境。經云「俱濟三滅關，啟籍登太明」，此之謂也。</p><p><strong>所出</strong>：《上清大洞真經 · 13章》 — https://zh.wikisource.org/wiki/上清大洞真經/13章</p></article></main></div></div>
