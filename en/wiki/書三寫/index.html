    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 書三寫</nav></header><main><article><h1>書三寫</h1><p>符書傳寫易訛，魚魯亥豕之誤，符之效驗所以失也。</p><p>書三寫之諺，出抱朴子以喻符書傳寫之誤。</p><p>抱朴子云：「老君能通於神明，符皆神明所授。今人用之少驗者，由於出來歷久，傳寫之多誤故也。」又云：「書字人知之，猶尚寫之多誤。故諺曰，書三寫，魚成魯，虛成虎，此之謂也。」</p><p>七與士，以倨勾長短之間為異，傳寫之誤尚易辨；而符上字不可讀，誤不可覺，故莫知其不定。用符者若信心不篤，施用不行，亦不能驗。</p><p><strong>所出</strong>：《抱朴子 · 卷19》 — https://zh.wikisource.org/wiki/抱朴子/卷19</p></article></main></div></div>
