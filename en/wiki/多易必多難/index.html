    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 多易必多難</nav></header><main><article><h1>多易必多難</h1><p>輕易事物，積久成大難。</p><p>多易必多難者，世人見事之易者，往往忽之，久之而難成矣。夫輕諾必寡信，多易必多難。輕諾者易於出言，而難於踐信；多易者易於苟簡，而難於成效。聖人知此，是以圖難於其易，為大於其細，終不為大而能成其大。此恩始於謹微、德本於慎始之義也。</p><p><strong>所出</strong>：《老子河上公章句 · 恩始》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
