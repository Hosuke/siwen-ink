    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 秦侵晉止惠公於秦</nav></header><main><article><h1>秦侵晉止惠公於秦</h1><p>秦師侵晉，惠公被擒，晉師潰於韓</p><p>六年，秦帥師侵晉，至於韓。惠公令韓簡視師，秦莫不慟，晉莫不怠。惠公令挑戰，穆公出見，公子縶、公孫枝議殺之、逐之或復之。公孫枝以為不如歸之，以要晉國之成，復其君而質其適子。穆公從之，歸惠公而質子圉，秦始知河東之政。</p><p><strong>所出</strong>：《國語 · 卷09》 — https://zh.wikisource.org/wiki/國語/卷09</p></article></main></div></div>
