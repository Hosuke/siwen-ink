    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 不辱以靜</nav></header><main><article><h1>不辱以靜</h1><p>靜則無辱，天地自正。</p><p>老子論治道之極歸於靜。萬物自化，化而欲作，則以[[無名之樸]]貞之。夫能用無名之樸而不辱者，以其靜也。不辱以靜，則萬物各返其真，而天地將自正矣。</p><p>此與[[清靜為天下正]]之義相發。靜者，萬物之本；正者，天地之則。侯王守[[道恆無名|道]]，萬物自化而不乖，靜以制欲，天地之正不在外求，而在於己之靜也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第八十一章 无名》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
