    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 白虹貫日</nav></header><main><article><h1>白虹貫日</h1><p>精誠感動，白虹為之貫日。</p><p>鄒陽獄中上書，言精誠可以動天。曰：「昔者荊軻慕燕丹之義，白虹貫日，太子畏之。」白虹貫日者，忠義精誠感天現象也。荊軻之志，感天動地，故白虹貫日。太子丹反為之畏，是太子疑心過重，不能知義士之誠也。後世以「白虹貫日」喻忠臣烈士之精誠上格於天也。</p><p><strong>所出</strong>：《史記 · 卷083》 — https://zh.wikisource.org/wiki/史記/卷083</p></article></main></div></div>
