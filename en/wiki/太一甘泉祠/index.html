    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 太一甘泉祠</nav></header><main><article><h1>太一甘泉祠</h1><p>漢家常以正月上辛祠太一甘泉，昏祠至明，童男女七十人俱歌，春夏秋冬各有其歌。</p><p>漢家常以正月上辛祠太一甘泉，以昏時夜祠，到明而終。常有流星經於祠壇上。使僮男僮女七十人俱歌。春歌青陽，夏歌朱明，秋歌西暤，冬歌玄冥。世多有，故不論。</p><p><strong>所出</strong>：《史記 · 卷024》 — https://zh.wikisource.org/wiki/史記/卷024</p></article></main></div></div>
