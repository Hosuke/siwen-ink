    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 荊實有昭德</nav></header><main><article><h1>荊實有昭德</h1><p>羋姓荊楚承祝融之緒，天啟而將興。</p><p>史伯言荊楚之將興也，曰：「重、黎之後也，夫黎為高辛氏火正，以淳燿敦大，天明地德，光照四海，故命之曰祝融。」祝融之功大矣，其後八姓，唯羋姓有荊楚。楚之先祖叔熊逃難於濮而蠻，季紃是立，天啟之心，又甚聰明和協。臣聞之，天之所啟，十世不替。羋姓夔越不足命，蠻羋蠻矣，唯荊實有昭德，若周衰，其必興矣。</p><p><strong>所出</strong>：《國語 · 卷16》 — https://zh.wikisource.org/wiki/國語/卷16</p></article></main></div></div>
