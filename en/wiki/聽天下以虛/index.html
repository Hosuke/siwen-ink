    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 聽天下以虛</nav></header><main><article><h1>聽天下以虛</h1><p>聖人通意之悖，解心之繆，去德之累，通道之塞，胸中正乃靜清明虛，無為而無不為。</p><p>先王不能盡知，執一而萬物治。使人不能執一者，物感之也。故曰：通意之悖，解心之繆，去德之累，通道之塞。貴、富、顯、嚴、名、利六者，悖意者也。容、動、色、理、氣、意六者，繆心者也。惡、欲、喜、怒、哀、樂六者，累德者也。智、能、去、就、取、舍六者，塞道者也。此四六者不蕩乎胸中則正。正則靜，靜則清明，清明則虛，虛則無為而無不為也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十五》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十五</p></article></main></div></div>
