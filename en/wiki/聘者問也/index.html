    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 聘者問也</nav></header><main><article><h1>聘者問也</h1><p>天子使王子來聘，問名脩好，禮之正也</p><p>天王使王季子來聘。</p><p>穀梁氏曰：「聘，問也。」</p><p>聘者，遣使問於侯國之謂也。天子遣使問諸侯，問其安否，脩親親之誼。稱「王季子」者，明王子之尊，加「子」字以示優異。來聘問名，通二國之好，禮之所起也。</p><p><strong>所出</strong>：《春秋穀梁傳 · 宣公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/宣公</p><hr><p>聘禮，上公七介，侯伯五介，子男三介，所以明貴賤也。</p><p>  <strong>所出</strong>：《禮記 · 聘義》 — https://zh.wikisource.org/wiki/禮記/聘義</p></article></main></div></div>
