    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 察人五法</nav></header><main><article><h1>察人五法</h1><p>觀人之法有五：親、富、達、窮、貧。</p><p>魏文侯問李克置相之事，李克對曰：「君不察故也。居視其所親，富視其所與，達視其所舉，窮視其所不爲，貧視其所不取，五者足以定之矣，何待克哉！」</p><p>五觀之法：由親疏以觀其行，由施予以觀其心，由顯達以觀其識，由逆境以觀其守，由匱乏以觀其操。具此五者，人莫能遁也。</p><p><strong>所出</strong>：《史記 · 魏世家》 — https://zh.wikisource.org/wiki/史記/魏世家</p></article></main></div></div>
