    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 東陵聖母監所</nav></header><main><article><h1>東陵聖母監所</h1><p>青鳥集盜物人之上</p><p>聖母之神祠，常有青鳥，人有失物，乞問，青鳥即集盜物人之上，路不拾遺。歲月稍久亦不爾。海陵海中，不得為奸盜，大者風波沒溺，小者病傷。</p><p><strong>所出</strong>：《神仙傳 · 卷六》 — https://zh.wikisource/wiki/神仙傳/卷六</p></article></main></div></div>
