    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 大臣太重封君太衆</nav></header><main><article><h1>大臣太重封君太衆</h1><p>大臣權勢過重、封君人數過多，乃貧國弱兵之由。</p><p>大臣太重，封君太衆。若此，則上偪主而下虐民，此貧國弱兵之道也。</p><p>吳起以此言告楚悼王。大臣太重，則君令不行；封君太衆，則民力竭於租稅。上偪主，則君權替；下虐民，則民心離。是以國必貧且弱。欲救此弊，必收封君之子孫三世而收爵禄，絶減百吏之禄秩，損不急之枝官。</p><p><strong>所出</strong>：《韓非子 · 和氏》 — https://zh.wikisource.org/wiki/韓非子/和氏</p></article></main></div></div>
