    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 姦聲感人</nav></header><main><article><h1>姦聲感人</h1><p>姦聲應之而淫樂興，正聲應之而和樂興。</p><p>凡姦聲感人，而逆氣應之；逆氣成象，而淫樂興焉。正聲感人，而順氣應之；順氣成象，而和樂興焉。倡和有應，回邪曲直，各歸其分；而萬物之理，各以其類相動也。</p><p>是故君子反情以和其志，比類以成其行。姦聲亂色，不留聰明；淫樂慝禮，不接心術。惰慢邪辟之氣不設於身體，使耳目鼻口、心知百體皆由順正以行其義。</p><p>然後發以聲音，而文以琴瑟，動以干戚，飾以羽旄，從以簫管。奮至德之光，動四氣之和，以著萬物之理。</p><p><strong>所出</strong>：《禮記 · 樂記》 — https://zh.wikisource.org/wiki/禮記/樂記</p></article></main></div></div>
