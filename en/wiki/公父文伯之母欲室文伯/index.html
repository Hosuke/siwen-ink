    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 公父文伯之母欲室文伯</nav></header><main><article><h1>公父文伯之母欲室文伯</h1><p>公父文伯之母為文伯求室，賦《綠衣》之詩以合室，師亥以為詩所以合意，歌所以詠詩。</p><p>公父文伯之母欲室文伯，饗其宗老，而為賦《綠衣》之三章。老請守龜卜室之族。師亥聞之曰：「善哉！男女之饗，不及宗臣；宗室之謀，不過宗人。謀而不犯，微而昭矣。詩所以合意，歌所以詠詩也。今詩以合室，歌以詠之，度於法矣。」</p><p><strong>所出</strong>：《國語 · 卷05》 — https://zh.wikisource.org/wiki/國語/卷05</p></article></main></div></div>
