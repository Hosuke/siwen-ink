    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 公子既眾</nav></header><main><article><h1>公子既眾</h1><p>公子既眾，宗室憂吟，止之之道在數披其木</p><p>公子既眾，宗室憂唫。止之之道，數披其木，毋使枝茂。木數披，黨與乃離。掘其根本，木乃不神。填其洶淵，毋使水清。探其懷，奪之威。</p><p><strong>所出</strong>：《韓非子 · 揚榷》 — https://zh.wikisource.org/wiki/韓非子/揚榷</p></article></main></div></div>
