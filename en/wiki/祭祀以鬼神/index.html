    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 祭祀以鬼神</nav></header><main><article><h1>祭祀以鬼神</h1><p>祭祀之禮，乃事死如生、媚神求福之道。</p><p>今絜爲酒醴粢盛，以敬慎祭祀。若使鬼神請有，是得其父母姒兄而飲食之也，豈非厚利哉？</p><p>若使鬼神請亡，是乃費其所爲酒醴粢盛之財耳。自夫費之，非特注之汙壑而棄之也，內者宗族，外者鄉里，皆得如具飲食之。</p><p>是故子墨子曰：今吾爲祭祀也，非直注之汙壑而棄之也，上以交鬼之福，下以合驩聚衆，取親乎鄉里。</p><p><strong>所出</strong>：《墨子 · 明鬼下》 — https://zh.wikisource.org/wiki/墨子/明鬼下</p></article></main></div></div>
