    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 緜緜若存</nav></header><main><article><h1>緜緜若存</h1><p>道用不絕，似存非存。</p><p>緜緜，連綿不絕之貌。欲言其存，則不見其形；欲言其亡，萬物以之而生。[[谷神]]生物之功，未嘗暫息。[[用之不勤]]，無物不成，用而不勞。[[玄牝之門]]，[[天地之根]]，皆此道之妙用。言道體無形而功用廣被，似亡而實存。</p><p><strong>所出</strong>：《道德經 (王弼本) · 六章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
