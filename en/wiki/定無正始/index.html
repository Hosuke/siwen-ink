    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 定無正始</nav></header><main><article><h1>定無正始</h1><p>定公以昭公久喪在外，不得正其即位之始。</p><p>《春秋穀梁傳》釋「元年春王正月」不言正月，云「定無正也」。昭公之終非正終，定之始亦非正始。昭無正終，故定無正始。不言即位者，喪在外也。</p><p>其說以為：先君無正終，則後君無正始。先君有正終，則後君有正始。公即位所以日戊辰者，先正棺於兩楹之間，待喪至京師，殯畢，然後受命即位。定之即位，不可不察也。</p><p><strong>所出</strong>：《春秋穀梁傳 · 定公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/定公</p></article></main></div></div>
