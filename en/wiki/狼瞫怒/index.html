    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 狼瞫怒</nav></header><main><article><h1>狼瞫怒</h1><p>狼瞫以勇求右位，黜而不怨，及彭衙之戰，死焉報晉，君子賢之。</p><p>箕之役，先軫黜之，而立續簡伯。狼瞫怒，其友曰：「盍死之？」瞫曰：「吾未獲死所。」其友曰：「吾與女為難。」瞫曰：「《周志》有之：『勇則害上，不登於明堂。』死而不義，非勇也。共用之謂勇，吾以勇求右，無勇而黜，亦其所也。謂上不我知，黜而宜，乃知我矣。子姑待之！」及彭衙既陳，以其屬馳秦師，死焉。晉師從之，大敗秦師。君子謂狼瞫於是乎君子。</p><p><strong>所出</strong>：《春秋左氏傳 · 文公》 — https://zh.wikisource.org/wiki/春秋左氏傳/文公</p></article></main></div></div>
