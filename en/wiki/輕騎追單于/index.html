    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 輕騎追單于</nav></header><main><article><h1>輕騎追單于</h1><p>漢輕騎校尉郭成逐單于數百里不及，右賢王突圍北去。</p><p>漢輕騎校尉郭成等逐數百里，不及，得右賢裨王十餘人，眾男女萬五千餘人，畜數千百萬，於是引兵而還。</p><p><strong>所出</strong>：《史記 · 卷111》 — https://zh.wikisource.org/wiki/史記/卷111</p></article></main></div></div>
