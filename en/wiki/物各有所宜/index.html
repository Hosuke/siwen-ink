    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 物各有所宜</nav></header><main><article><h1>物各有所宜</h1><p>器使之道，在役其所長，避其所短，則世無棄材。</p><p>抱樸子曰：劍戟不長於縫緝，錐鉆不可以擊斷，牛馬不能吠守，雞犬不任駕乘。物之有能，如是者多矣。</p><p>夫役其所長，則事無廢功；避其所短，則世無棄材矣。善為國者，必量人之才，隨器而使之，使農以其力耕耘，工以其巧治器，士以其智輔政，兵以其勇卻敵。尺有所短，寸有所長，堯不能以一事尽天下之才，舜不能以一能周天下之用。惟聖人明於知人，審於任使，故無材之可惜、無功之可歎也。</p><p><strong>所出</strong>：《抱朴子 · 卷10》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷10</p></article></main></div></div>
