    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 俾無訧</nav></header><main><article><h1>俾無訧</h1><p>使己無過，以古道為法。</p><p>俾無訧，謂使己不失德而無過也。訧，罪過之義。詩人言「我思古人，俾無訧兮」，蓋傷今之不如古也。[[古人之思|古人]]行事皆有法度，修身正家，不失其序。今則不然，妾僭於上，夫人失位，禮義陵遲，詩人惟思古昔之治，使己得以無過。然詩人之所以思古人者，正以見今之有訧也。思古而不得，故中心愈悲矣。</p><p><strong>所出</strong>：《詩經 · 綠衣》 — https://zh.wikisource.org/wiki/詩經/綠衣</p></article></main></div></div>
