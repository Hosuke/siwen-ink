    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 威絕域之民</nav></header><main><article><h1>威絕域之民</h1><p>威施遠域之民，在師行速而無遠不至，守備固而無險可乘。</p><p>絕域，荒遠之地。威絕域之民者，以威德加於荒遠，使之畏服而不畔。</p><p>其文曰：「不遠道里，故能威絕域之民；不險山河，故能服恃固之國。」</p><p>威之在遠域者，非力征之所能致，必也[[風雨之行]]以速至，[[飛鳥之舉]]以輕舉，使敵不及為備，而[[金城之守]]以固後方，則威德所及，無遠弗屆。</p><p><strong>所出</strong>：《管子 · 選陳》 — https://zh.wikisource.org/wiki/管子/七法/選陳</p></article></main></div></div>
