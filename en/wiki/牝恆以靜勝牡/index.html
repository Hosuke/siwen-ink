    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 牝恆以靜勝牡</nav></header><main><article><h1>牝恆以靜勝牡</h1><p>雌柔以靜止勝雄剛。</p><p>天下之牝，牝恆以靜勝牡。牝者雌也，牡者雄也。雌居下而靜，雄在上而動。靜則能制動，下則能勝上。此老子借用牝牡之喻，以明柔弱勝剛強之理也。萬物之運，雄強者易折，雌柔者終勝。靜者不先動，以下取之，是謂以靜制動、以柔克剛矣。</p><p><strong>所出</strong>：《老子 (帛書本) · 章六十一》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
