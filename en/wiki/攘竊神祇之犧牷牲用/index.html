    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 攘竊神祇之犧牷牲用</nav></header><main><article><h1>攘竊神祇之犧牷牲用</h1><p>民盜祭牲，禮制大壞</p><p>殷民不敬鬼神，相攘竊祭祀犧牲。父師曰：「殷民乃攘竊神祇之犧牷牲用，以容將食，無災。」言竊神之牲而食之，竟無災禍，故民慢神不畏。此非天之不罰，乃民之無知，亦見殷之政教蕩然無存矣。</p><p><strong>所出</strong>：《尚書 · 微子》 — https://zh.wikisource.org/wiki/尚書/微子</p></article></main></div></div>
