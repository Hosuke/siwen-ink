    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 羊肉羶</nav></header><main><article><h1>羊肉羶</h1><p>物各有所嗜，羊肉羶而蟻慕之。</p><p>羊肉不慕蟻，蟻慕於羊肉，羊肉羶也；醯酸不慕蚋，蚋慕於醯酸。</p><p>天下之物，嗜之者趨之，厭之者避之，非有他也，理固然耳。</p><p><strong>所出</strong>：《淮南子 · 說林訓》 — https://zh.wikisource.org/wiki/淮南子/說林訓</p></article></main></div></div>
