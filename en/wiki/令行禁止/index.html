    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 令行禁止</nav></header><main><article><h1>令行禁止</h1><p>令在必行，禁在必止，則天下服矣。</p><p>令行禁止，聖王貴之。勝一而服百，則天下畏之矣。立少而觀多，則天下懷之矣。罰有罪，賞有功，則天下從之矣。</p><p><strong>所出</strong>：《管子 · 爲兵之數》 — https://zh.wikisource.org/wiki/管子/七法/爲兵之數</p><hr><p>夫非主令而行，有功利因賞之，是教妄舉也；主令而行之，有傷敗而罰之，是使民慮利害而離法也。羣臣百姓人慮利害，而以其私心舉措，則法制毀而令不行矣。</p><p><strong>所出</strong>：《管子 · 第45篇任法》 — https://zh.wikisource.org/wiki/管子/第45篇任法</p></article></main></div></div>
