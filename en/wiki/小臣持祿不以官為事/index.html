    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 小臣持祿不以官為事</nav></header><main><article><h1>小臣持祿不以官為事</h1><p>官失其能，由持祿養佼不以官為事</p><p>明主任官置吏，使之奉主之法、行主之令，以治百姓而誅盜賊。其任官者大則爵尊祿厚，任官者小則爵卑祿薄。亂主之治也，處尊位、受奉祿、養所與佼，而不以官為務，如此則官失其能。
<strong>所出</strong>：《管子 · 第67篇明法解》 — https://zh.wikisource.org/wiki/管子/第67篇明法解</p></article></main></div></div>
