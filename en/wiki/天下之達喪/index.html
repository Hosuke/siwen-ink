    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 天下之達喪</nav></header><main><article><h1>天下之達喪</h1><p>三年之喪，通於上下，為古今一之王制。</p><p>《禮記·喪服小記》又論及從服之義，云：「從服者，所從亡則已。屬從者，所從雖沒也服。」從服者，附屬於人之服也。從亡則已，屬從則雖亡猶服，此又喪服之變例也。</p><p>  又云：「妾從女君而出，則不為女君之子服。」此明妾之地位及其服制之限制也。</p></article></main></div></div>
