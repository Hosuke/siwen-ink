    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 孝治</nav></header><main><article><h1>孝治</h1><p>明王以孝治天下，得萬國萬民之心</p><p>昔者明王之以孝治天下也，不敢遺小國之臣，而況於公、侯、伯、子、男乎？故得萬國之懽心，以事其先王。</p><p>治國者不敢侮於鰥寡，而況於士民乎？故得百姓之懽心，以事其先君。</p><p>治家者不敢失於臣妾，而況於妻子乎？故得人之懽心，以事其親。</p><p>夫然，故生則親安之，祭則鬼享之，是以天下和平，災害不生，禍亂不作。</p><p><strong>所出</strong>：《孝經》 — https://zh.wikisource.org/wiki/今文孝經</p></article></main></div></div>
