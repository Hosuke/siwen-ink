    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 射檥</nav></header><main><article><h1>射檥</h1><p>城上設射矢御敵之檥板。</p><p>射檥者，城上射箭之檥板也。《墨子·備水》云：「城上為射檥，疾佐之。」蓋城外決水攻城之時，城中出兵以 [[轒轀]] 襲敵，城上須有高檥以便射箭，疾速援助。《備城門》篇亦有「三十步一鸕鶿」之說，皆此類防禦工事。</p><p>古人云「居高臨下」，城上射檥正合此理。敵攻外堤，我據高檥俯射之；敵退，我亦射之。此與 [[仁者如射]] [[發而不中反求諸己]] 之義有別，乃實用之守城術，非修身之射藝也。</p><p>《墨子》城守諸篇，每以射檥與器械相配為用。[[蛾傅]] 攻城之時，守者立射檥之上，攢矢下射，是為城守要務。</p></article></main></div></div>
