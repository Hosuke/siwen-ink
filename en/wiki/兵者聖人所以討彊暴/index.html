    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 兵者聖人所以討彊暴</nav></header><main><article><h1>兵者聖人所以討彊暴</h1><p>兵者聖人所以討彊暴、平亂世、夷險阻、救危殆。</p><p>兵者，聖人所以討彊暴，平亂世，夷險阻，救危殆。自含齿戴角之獸見犯則校，而況於人懷好惡喜怒之氣？喜則愛心生，怒則毒螫加，情性之理也。</p><p>夫兵之為用，非好殺也，乃所以平天下之險阻、救兆民於危亡。聖人不得已而用之，然亦不可廢。教笞不可廢於家，刑罰不可捐於國，誅伐不可偃於天下，用之有巧拙，行之有逆順耳。</p><p><strong>所出</strong>：《史記 · 卷025》 — https://zh.wikisource.org/wiki/史記/卷025</p></article></main></div></div>
