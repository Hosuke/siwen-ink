    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 五戰至兵</nav></header><main><article><h1>五戰至兵</h1><p>經由五種經濟戰而後興兵之謂</p><p>桓公問輕重之數與用兵奈何，管子對曰：「五戰而至於兵。」又釋之曰：「請戰衡，戰准，戰流，戰權，戰勢。此所謂五戰而至於兵者也。」</p><p>衡者，物價之平準也；准者，度量之制度也；流者，財貨之通塞也；權者，輕重之變化也；勢者，因時之部署也。先以經濟之戰屈人，而後以甲兵之戰取之，此管子之持重而後發也。</p><p><strong>所出</strong>：《管子 · 第80篇輕重甲》 — https://zh.wikisource.org/wiki/管子/第80篇輕重甲</p></article></main></div></div>
