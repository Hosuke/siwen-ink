    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 彊本幹弱枝葉</nav></header><main><article><h1>彊本幹弱枝葉</h1><p>漢郡錯置諸侯之間，犬牙相臨，以收拱衛京師之效。</p><p>太史公論漢郡之制曰：形錯諸侯閒，犬牙相臨，秉其阸塞地利，彊本幹，弱枝葉之勢，尊卑明而萬事各得其所。漢定百年，親屬益疏，諸侯驕奢，至有叛逆。主父偃建議推恩，諸侯遂自分其地。於是齊分為七，趙分為六，梁分為五，淮南分三，大國不過十餘城，小侯不過數十里，而京師愈固矣。</p><p><strong>所出</strong>：《史記 · 卷017》 — https://zh.wikisource.org/wiki/史記/卷017</p></article></main></div></div>
