    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 歸谷子</nav></header><main><article><h1>歸谷子</h1><p>張儀、蘇秦師事之山谷隱士，或稱「歸谷子」，乃鬼谷子之別號。</p><p>《拾遺記》載張儀、蘇秦勤苦向學，遇一先生問答，答曰「吾死生於山谷，世論謂余歸谷子也」。秦、儀後遊學，「復逄歸谷子，乃請其學術，則教以干世出俗之辯，乃探胷中韋秩三卷書，言輔時之事」。《古史考》云「儀、秦受術鬼谷先生，歸之聲與鬼相亂故也」。是「歸谷」「鬼谷」，音近而傳異，歸谷子即鬼谷子之別稱。[[鬼谷子書之淵源]]</p><p><strong>所出</strong>：《鬼谷子 · 鬼谷子附録》 — https://zh.wikisource.org/wiki/鬼谷子/鬼谷子附録</p></article></main></div></div>
