    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 直躬之信</nav></header><main><article><h1>直躬之信</h1><p>直躬以父竊羊而告之，孔子譏其借父名以取聲，而非真信。</p><p>楚有直躬者，其父竊羊而謁之上，上執而將誅之。直躬請代之。將誅，告吏曰：「父竊羊而謁之，不亦信乎？父誅而代之，不亦孝乎？信且孝而誅之，國將有不誅者乎？」荊王聞之，乃不誅也。</p><p>孔子聞之曰：「異哉直躬之為信也，一父而載取名焉。」故直躬之信，不若無信。</p><p>以告父竊羊之迹，而遂致之於死地，此非信道也，乃借父子之名以干譽也。名實不符，義已悖矣。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十一》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十一</p></article></main></div></div>
