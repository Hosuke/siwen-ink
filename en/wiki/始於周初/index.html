    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 始於周初</nav></header><main><article><h1>始於周初</h1><p>爾雅所錄，多周初之語，其書亦成於斯時。</p><p>《爾雅》之名，見於《漢書·藝文志》，而未署作者。其所援引之書，若《詩》《書》《禮》《樂》諸經，皆周初以來之典籍。又書中時置博士之官，秦漢之世已然。據此數端，可知其書成於周初至春秋之世，積數百年間，聖賢門徒遞相增補，遂成今本。</p><p><strong>所出</strong>：《爾雅》 — https://zh.wikisource.org/wiki/爾雅</p></article></main></div></div>
