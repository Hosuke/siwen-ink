    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 天符</nav></header><main><article><h1>天符</h1><p>歲運與司天之氣相合也。太過、不及皆有之，共二十四歲。</p><p>歧伯言天符之義曰：太過而加同天符，不及而加同歲會。又曰：太過不及，皆曰天符，而變行有多少，病形有微甚，生死有早晏耳。</p><p>天符之歲，凡二十四歲。過者三：甲辰甲戌太宮，下加太陰；壬寅壬申太角，下加厥陰；庚子庚午太商，下加陽明。不及者三：癸巳癸亥少徵，下加少陽；辛丑辛未少羽，下加太陽；癸卯癸酉少徵，下加少陰。此歲運與司天之氣相合之歲也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第二十一卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第二十一卷</p></article></main></div></div>
