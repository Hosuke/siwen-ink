    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 爾公爾侯</nav></header><main><article><h1>爾公爾侯</h1><p>稱賢者之位，勸以任職。</p><p>「爾公爾侯」，詩《白駒》第三章句。言賢者之才，可以為公為侯，宜出而任職，享其逸樂，不當隱遁也。詩人勸之以祿位，戒之以優游，蓋望賢才之見用於世。後世以「公侯」並稱，亦本於此。</p><p><strong>所出</strong>：《詩經 · 白駒》 — https://zh.wikisource.org/wiki/詩經/白駒</p></article></main></div></div>
