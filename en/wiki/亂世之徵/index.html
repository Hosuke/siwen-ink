    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 亂世之徵</nav></header><main><article><h1>亂世之徵</h1><p>亂世有其朕兆，觀服容、俗志、聲樂、文章可知。</p><p>亂世之徵，其服組，其容婦，其俗淫，其志利，其行襍，其聲樂險，其文章匿而采，其養生無度，其送死瘠墨，賤禮義而貴勇力，貧則為盜，富則為賊。治世反是。</p><p><strong>所出</strong>：《荀子 · 樂論篇》 — https://zh.wikisource.org/wiki/荀子/樂論篇</p></article></main></div></div>
