    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 社鼠</nav></header><main><article><h1>社鼠</h1><p>左右近習，寄身社中，燻之則焚木，灌之則敗塗，難以除去。</p><p>桓公問[[管仲]]：「治國最奚患？」對曰：「最患社鼠矣。」公曰：「何患社鼠哉？」對曰：「君亦見夫為社者乎？樹木而塗之，鼠穿其間，堀穴託其中。燻之則恐焚木，灌之則恐塗阤，此社鼠之所以不得也。今人君之左右，出則為勢重而收利於民，入則比周而蔽惡於君。内間主之情以告外，外内為重，諸臣百吏以為富。吏不誅則亂法，誅之則君不安，據而有之，此亦國之社鼠也。」</p><p><strong>所出</strong>：《韓非子 · 外儲說右上》 — https://zh.wikisource.org/wiki/韓非子/外儲說右上</p></article></main></div></div>
