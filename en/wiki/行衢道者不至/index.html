    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 行衢道者不至</nav></header><main><article><h1>行衢道者不至</h1><p>涉於歧路則無所至；事兩君者無所容；心不專一，則事無功。</p><p>是故無冥冥之志者無昭昭之明，無惛惛之事者無赫赫之功。行衢道者不至，事兩君者不容。目不能兩視而明，耳不能兩聽而聰。</p><p><strong>所出</strong>：《荀子 · 勸學篇》 — https://zh.wikisource.org/wiki/荀子/勸學篇</p></article></main></div></div>
