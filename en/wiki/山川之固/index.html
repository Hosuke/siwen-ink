    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 山川之固</nav></header><main><article><h1>山川之固</h1><p>山高淵深，物各有所依，君子法之，則德固而功立。</p><p>山高而不崩，則祈羊至矣。淵深而不涸，則沈玉極矣。此所以山川之固也。物各有所依，山以高而不崩為固，淵以深而不涸為固。祈羊至而後山靈可格，沈玉出而後淵旨可通。是故君子之於國，亦猶是焉。德立於內，功成於外，不待外求而自至也。</p><p><strong>所出</strong>：《管子 · 第02篇形勢》 — https://zh.wikisource.org/wiki/管子/第02篇形勢</p></article></main></div></div>
