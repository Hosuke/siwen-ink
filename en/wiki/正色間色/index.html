    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 正色間色</nav></header><main><article><h1>正色間色</h1><p></p><p>《[[詩經/綠衣]]》云「綠衣黃裏」「綠衣黃裳」，以正色之黃與間色之綠相混淆，興嫡妾之位顚倒。黃者，土之正色，古以為尊；綠者，蒼黃之閒色，古以為賤。詩人見綠衣在外而黃裳在內，是尊卑易位、陰陽失常之象，傷己之失位，思[[我思古人|古人]]之正道也。</p><p>  <strong>所出</strong>：《詩經 · 綠衣》 — https://zh.wikisource.org/wiki/詩經/綠衣</p></article></main></div></div>
