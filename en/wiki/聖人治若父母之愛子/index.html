    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 聖人治若父母之愛子</nav></header><main><article><h1>聖人治若父母之愛子</h1><p>治國如父母愛子，如兄愛弟，賞罰如加諸身，賦斂如取於己。</p><p>太公述愛民之道，喻以父母兄長之親情：「善為國者，馭民如父母之愛子，如兄之愛弟。見其饑寒則為之憂，見其勞苦則為之悲。賞罰如加諸身，賦斂如取於己。」</p><p>此言君主視民如子，待民如弟，推己及人，感同身受。賞罰賦斂之間，皆心存愛愍，不以威虐凌之。此[[愛民之道]]之精義，亦[[堯舜之治]]所由本也。</p><p><strong>所出</strong>：《六韜》 — https://zh.wikisource.org/wiki/六韜</p></article></main></div></div>
