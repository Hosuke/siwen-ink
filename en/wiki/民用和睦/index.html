    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 民用和睦</nav></header><main><article><h1>民用和睦</h1><p>以孝道化民，則民用和睦，上下無怨</p><p>先王有至德要道，以順天下，民用和睦，上下無怨。</p><p>是以其教不肅而成，其政不嚴而治。先王見教之，可以化民也。</p><p><strong>所出</strong>：《孝經》 — https://zh.wikisource.org/wiki/今文孝經</p></article></main></div></div>
