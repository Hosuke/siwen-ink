    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 晉平公令官為鍾</nav></header><main><article><h1>晉平公令官為鍾</h1><p>師曠知音，知後世有知音者必知鍾之不調。</p><p>昔晉平公令官為鍾。鍾成，而示師曠。師曠曰：「鍾音不和。」平公曰：「寡人以示工，工皆以為調。而以為不和，何也？」師曠曰：「使後世無知音者則已，若有知音者，必知鍾之不和。」故師曠之欲善調鍾也，以為後之有知音者也。</p><p>三代與我同行，五伯與我齊智，彼獨有聖智之實，我曾無有閭裏之聞，窮巷之知者何？彼並身而立節，我誕謾而悠忽。</p><p><strong>所出</strong>：《淮南子 · 脩務訓》 — https://zh.wikisource.org/wiki/淮南子/脩務訓</p></article></main></div></div>
