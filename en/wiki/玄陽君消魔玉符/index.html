    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 玄陽君消魔玉符</nav></header><main><article><h1>玄陽君消魔玉符</h1><p>佩符存神，鎮守背骨地戶，通天生炁之秘法。</p><p>[[玄陽君消魔玉符]]以黃書白繒佩之。修行者存呼玄陽君之內諱名字，鎮兆背窮骨之地戶，為通天生炁，固塞死道，六津凝精，長生不老。乃叩齒九通，咽液七過。</p><p>其法出於七真玄陽君章，為大洞經中要妙之術。</p><p><strong>所出</strong>：《上清大洞真經 · 13章》 — https://zh.wikisource.org/wiki/上清大洞真經/13章</p></article></main></div></div>
