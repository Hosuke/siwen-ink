    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 朱建之死</nav></header><main><article><h1>朱建之死</h1><p>淮南厲王殺辟陽侯，文帝欲捕朱建，朱建自剄以絕禍。</p><p>孝文帝時，淮南厲王殺辟陽侯，以諸呂故。文帝聞平原君為計策，使吏捕欲治。聞吏至門，平原君欲自殺。諸子及吏皆曰：「事未可知，何早自殺為？」</p><p>平原君曰：「我死禍絕，不及而身矣。」遂自剄。孝文帝聞而惜之，曰：「吾無意殺之。」乃召其子，拜為中大夫。使匈奴，單于無禮，乃罵單于，遂死匈奴中。</p><p><strong>所出</strong>：《史記 · 卷097》 — https://zh.wikisource.org/wiki/史記/卷097</p></article></main></div></div>
