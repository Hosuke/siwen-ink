    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 清者濁之源</nav></header><main><article><h1>清者濁之源</h1><p>清為濁之始，動為靜之基，人能常清靜則天地歸焉</p><p>清者濁之源，動者靜之基。人能常清靜，天地悉皆歸。</p><p>夫清與濁、動與靜，相待而立。清者實為濁之根本，動者實為靜之根基。修煉之人，遣其慾，澄其心，常保清靜，則天地萬物，皆歸於我也。</p><p><strong>所出</strong>：《太上老君說常清靜經》 — https://zh.wikisource.org/wiki/太上老君說常清靜經</p></article></main></div></div>
