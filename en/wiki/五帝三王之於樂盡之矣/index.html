    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 五帝三王之於樂盡之矣</nav></header><main><article><h1>五帝三王之於樂盡之矣</h1><p>五帝三王以音樂治世之理至矣，亂國之主未嘗知此。</p><p>五帝三王之於樂盡之矣。亂國之主，未嘗知樂者，是常主也。夫有天賞得為主，而未嘗得主之實，此之謂大悲。是正坐於夕室也，其所謂正，乃不正矣。</p><p>凡生非一氣之化也，長非一物之任也，成非一形之功也。眾正之所積，其福無不及；眾邪之所積，其禍無不逮。</p><p><strong>所出</strong>：《呂氏春秋 · 卷六》 — https://zh.wikisource.org/wiki/呂氏春秋/卷六</p></article></main></div></div>
