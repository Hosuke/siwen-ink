    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 鳩佔鵲巢</nav></header><main><article><h1>鳩佔鵲巢</h1><p>詩經鵲巢之成語，喻據人之所有。</p><p>維鵲有巢，維鳩居之。鵲以-build巢，鳩以 virtue 居之，此詩之本義也。</p><p>毛詩序云：「國君積行累功以致爵位，夫人起家而居有之。」鵲喻國君，鳩喻夫人。君有功德以立家室，后有懿德以配君子，乃詩之正道也。</p><p>後世引申其義，以「鳩佔鵲巢」喻人據人之所有，取其居處或位置，而失其本義之和敬矣。《左傳》昭公元年，穆叔賦鵲巢，趙孟曰「武不堪也」，正用其本義。</p><p><strong>所出</strong>：《詩經 · 鵲巢》 — https://zh.wikisource.org/wiki/詩經/鵲巢</p></article></main></div></div>
