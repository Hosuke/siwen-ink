    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 天符歲會</nav></header><main><article><h1>天符歲會</h1><p>天符與歲會合，是為太一天符，其病速而危，或暴而死。</p><p>木運臨卯，火運臨午，土運臨四季，金運臨酉，水運臨子，所謂歲會，氣之平也。</p><p>歲不與會，是非位也。</p><p>土運之歲，上見太陰；火運之歲，上見少陽少陰；金運之歲，上見陽明；木運之歲，上見厥陰；水運之歲，上見太陽，是天之與會也，天冊謂之天符。</p><p>天符為執法，歲位為行令，太一天符為貴。</p><p>中執法者，其病速而危；中行令者，其病徐而持；中貴人者，其病暴而死。</p><p><strong>所出</strong>：《黃帝內經 · 素問第十九卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十九卷</p></article></main></div></div>
