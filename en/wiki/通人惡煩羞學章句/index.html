    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 通人惡煩，羞學章句</nav></header><main><article><h1>通人惡煩，羞學章句</h1><p>通達之人厭繁瑣之注疏，以專門章句為恥。</p><p>若秦延君之注《堯典》，十餘萬字；朱普之解《尚書》，三十萬言；所以通人惡煩，羞學章句。若毛公之訓《詩》，安國之傳《書》，鄭君之釋《禮》，王弼之解《易》，要約明暢，可為式矣。通人貴乎明暢要約，不貴繁瑣支離，此論[[注]]之得失也。</p><p><strong>所出</strong>：《文心雕龍 · 論說》 — https://zh.wikisource.org/wiki/文心雕龍/論說</p></article></main></div></div>
