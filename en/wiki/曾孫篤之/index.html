    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 曾孫篤之</nav></header><main><article><h1>曾孫篤之</h1><p>勉後世子孫當篤行先王之道</p><p>「曾孫篤之」，《詩經·維天之命》句也。鄭箋：「曾孫，謂成王也。篤，厚也。」</p><p>[[曾孫]]之義，泛指後世子孫。「篤」者，厚也、固也，專一守之而不渝。言曾孫當厚行文王之道，不可懈怠。[[修身]]以為本，此詩勉子孫以「篤」，正是修身之義。[[述而不作]]稱孔子之學，此則勉後王之承，要皆一脈相傳。《書》言[[堯舜禹湯文武之道]]，此詩以「篤」字該之，見承傳之要義。</p><p><strong>所出</strong>：《詩經 · 維天之命》 — https://zh.wikisource.org/wiki/詩經/維天之命</p></article></main></div></div>
