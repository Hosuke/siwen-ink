    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 趙綰王臧</nav></header><main><article><h1>趙綰王臧</h1><p>趙綰、王臧以文學為公卿，議立明堂草封禪事，竇太后不好儒術，皆案誅之。</p><p>上鄉儒術，招賢良，[[趙綰]]、王臧等以文學為公卿，欲議古立明堂城南，以朝諸侯。草巡狩封禪改歷服色事未就。會[[竇太后]]治黃老言，不好儒術，使人微得趙綰等姦利事，召案綰、臧，綰、臧自殺，諸所興為者皆廢。</p><p><strong>所出</strong>：《史記 · 卷012》 — https://zh.wikisource.org/wiki/史記/卷012</p></article></main></div></div>
