    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 茅津封殽</nav></header><main><article><h1>茅津封殽</h1><p>記繆公伐晉渡河焚船報殽之役，封尸哭之三日，作誓以記過。</p><p>三十六年，繆公復益厚孟明等，使將兵伐晉，渡河焚船，大敗晉人，取王官及鄗，以報殽之役。晉人皆城守不敢出。於是繆公乃自茅津渡河，封殽中尸，為發喪，哭之三日。乃誓於軍曰：「嗟士卒！聽無譁，余誓告汝。古之人謀黃髪番番，則無所過。」以申思不用蹇叔、百里傒之謀，故作此誓，令後世以記余過。君子聞之，皆為垂涕，曰：「嗟乎！秦繆公之與人周也，卒得孟明之慶。」</p><p><strong>所出</strong>：《史記 · 卷005》 — https://zh.wikisource.org/wiki/史記/卷005</p></article></main></div></div>
