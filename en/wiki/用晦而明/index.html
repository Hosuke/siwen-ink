    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 用晦而明</nav></header><main><article><h1>用晦而明</h1><p>君子蒞眾，在能用晦，乃所以全明也。</p><p>「明入地中，明夷；君子以蒞眾，用晦而明。」象辭之義，以晦用明，乃聖人之道也。夫明以照物，晦以藏身。蒞眾而不露其明，乃能和光同塵，不為世忌。苟明而不知晦，則物忌之，身且不保，何以濟世？用晦者，非晦其明，乃晦之用耳。晦而明全，明而晦失，此聖人之所以持世也。</p><p><strong>所出</strong>：《周易 · 明夷》 — https://zh.wikisource.org/wiki/周易/明夷</p></article></main></div></div>
