    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 陽虎務取我守</nav></header><main><article><h1>陽虎務取我守</h1><p>明主治術不治人</p><p>陽虎議曰：「主賢明，則悉心以事之；不肖，則飾姦而試之。」逐於魯，疑於齊，走而之趙，趙簡主迎而相之。左右曰：「虎善竊人國政，何故相也？」簡主曰：「陽虎務取之，我務守之。」遂執術而御之。陽虎不敢爲非，以善事簡主，興主之强，幾至於霸也。</p><p>陽虎善竊國政，趙簡主用之而曰「陽虎務取之，我務守之」，蓋明主治術不治人，任其才而馭之以法也。</p><p><strong>所出</strong>：《韓非子 · 外儲說左下》 — https://zh.wikisource.org/wiki/韓非子/外儲說左下</p></article></main></div></div>
