    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 井之常道</nav></header><main><article><h1>井之常道</h1><p>井居其所而不可改，民賴其養而無終竭。</p><p>井之為象，位乎坎上之巽。坎為水，巽為木，木上有水，汲而上行，此井之用也。然井之所以為井，不在水之盈涸，而在其道之常。城邑可遷，井不可徙；人來人往，井不易其用。水給於下，不以汲者之眾寡而增損；民食其利，不以時之古今而盈竭。是故[[改邑不改井]]，言井道之恒也。水在井中，養而不窮，此井之所以為象於君子也。</p><p><strong>所出</strong>：《周易 · 井》 — https://zh.wikisource.org/wiki/周易/井</p></article></main></div></div>
