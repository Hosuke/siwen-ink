    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 虛車勿索</nav></header><main><article><h1>虛車勿索</h1><p>關市之征，宜寬不宜苛，以來遠人、通商旅。</p><p>虛車勿索，徒負勿入，以來遠人。夫關者，諸侯之陬隧也，而外財之門戶也，萬人之道行也。明道以重告之，征於關者勿征於市，征於市者勿征於關。虛車者，空車也，無所載而過者，則禁之是暴；徒負者，負荷而行者，無所取而索之則擾。唯商旅通而財貨流，然後遠人至而國用足。若[[關市]]之征煩數，則商旅不行、財用竭匱，而[[國]]且困矣。</p><p><strong>所出</strong>：《管子 · 第24篇問》 — https://zh.wikisource.org/wiki/管子/第24篇問</p></article></main></div></div>
