    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 宗人</nav></header><main><article><h1>宗人</h1><p>掌宗廟禮儀及贊導之事之官。</p><p>宗人者，掌宗廟禮儀之官也。祭前主人為期，宗人朝服北面請曰「請祭期」，主人對曰「比於子」，宗人曰「旦明行事」。又奉盤於庭，沃尸時奉匜水、奉簍巾，以供尸盥洗。又遣賓就主人皆盥於洗。宗人主持祭祀節次，贊導主人、尸、賓之行事，居廟中以序上下之義也。</p><p><strong>所出</strong>：《儀禮 · 少牢饋食禮》 — https://zh.wikisource.org/wiki/儀禮/少牢饋食禮</p></article></main></div></div>
