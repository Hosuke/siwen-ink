    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 堯舜巡守</nav></header><main><article><h1>堯舜巡守</h1><p>堯舜五歲一巡狩，羣后四朝，徧告以言，明試以功。</p><p>堯老，命舜攝行天子之政。歲二月，東巡狩，至於岱宗，祡，望秩於山川。遂見東方君長，合時月正日，同律度量衡，脩五禮五玉三帛二生一死爲摯，如五器，卒乃復。五月，南巡狩；八月，西巡狩；十一月，北巡狩：皆如初。歸，至于祖禰廟，用特牛禮。五歲一巡狩，羣后四朝。徧告以言，明試以功，車服以庸。</p><p><strong>所出</strong>：《史記 · 卷001》 — https://zh.wikisource.org/wiki/史記/卷001</p></article></main></div></div>
