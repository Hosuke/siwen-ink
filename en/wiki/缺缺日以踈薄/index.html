    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 缺缺</nav></header><main><article><h1>缺缺</h1><p>民失所養日以迫蹙也。</p><p>缺缺者，迫蹙之象。[[其政察察|察察]]之政急疾，民[[醇醇|不聊生]]，[[不以兵強天下|不相保]]，日以踈薄。
