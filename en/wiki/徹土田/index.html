    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 徹土田</nav></header><main><article><h1>徹土田</h1><p>測定土田疆界，定其賦稅，以藩屏周室。</p><p>王命 [[召伯]] 「徹申伯土田」，言測定其土田之疆界，定其貢賦之數也。徹者，通也、治也。土田既徹，則疆理分明，賦役有經。又令「以峙其粻，式遄其行」，儲峙糧粻，以備 [[謝人]] 遷徙之需。《詩》序云「褒賞申伯」，徹土田者，賞之大者也。</p><p><strong>所出</strong>：《詩經 · 崧高》 — https://zh.wikisource.org/wiki/詩經/崧高</p></article></main></div></div>
