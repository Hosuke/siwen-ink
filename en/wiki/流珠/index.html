    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 流珠</nav></header><main><article><h1>流珠</h1><p>靈知妄動如流珠，常欲離人，必待真鉛攝之</p><p>流珠者，離內七般朱砂之一，真種之外妄情也。人心靈知，易動飛走，如太陽流珠，常欲去人，無真種則時刻難留。黃鶴賦云：「離內七般朱砂，無真種則時刻難留。」皆因道心有失，而不定之。若下道心真知以制之，則靈歸於真，不復飛走，《參同》所謂「卒得金華，轉而相因」者是也。</p><p><strong>所出</strong>：《悟真直指 · 卷一》 — https://zh.wikisource.org/wiki/悟真直指/卷一</p></article></main></div></div>
