    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 夾脊雙關</nav></header><main><article><h1>夾脊雙關</h1><p>上通天谷、下達尾閭之要路，修煉徑路此為尊。</p><p>夾脊雙關，乃人身至要之竅也。</p><p>古仙有言：「夾脊雙關透頂門，修煉徑路此為尊。」以其上通天谷，下達尾閭，中通心腎，召攝靈陽，救護命寶。</p><p>人未有此身，先有此息；此身未滅，此息先滅。此竅乃[[修煉正路]]之根本。</p><p>欲通此竅，先要存想山根，則呼吸之氣漸次通夾脊，透混元，而直達於命府，方才子母會合，破鏡重圓。久久擴充，根本完固，命寶永固。</p><p><strong>所出</strong>：《性命圭旨 · 亨集》 — https://zh.wikisource.org/wiki/性命圭旨/亨集</p></article></main></div></div>
