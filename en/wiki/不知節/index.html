    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 不知節</nav></header><main><article><h1>不知節</h1><p>肆情而忘限度</p><p>亦不知節也。象辭以釋《[[濡首]]》之義。濡首之失，在於不知節也。《[[節用]]》以止奢，《[[節飲食]]》以養生，《[[敖不可長欲不可從]]》之戒，皆節之意也。不知節，則慢天理而傷生。《[[無節於中]]》之患，賢者慎之。</p><p><strong>所出</strong>：《周易 · 未濟》 — https://zh.wikisource.org/wiki/周易/未濟</p></article></main></div></div>
