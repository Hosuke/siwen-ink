    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 刺熱</nav></header><main><article><h1>刺熱</h1><p>以針刺泄藏熱之法。</p><p>熱病先胸脅痛，手足躁，刺足少陽，補足太陰。熱病始手臂痛者，刺手陽明太陰而汗出止。熱病始於頭首者，刺項太陽而汗出止。熱病始於足脛者，刺足陽明而汗出止。熱病先身重骨痛，耳聾好瞑，刺足少陰。</p><p>治熱病，以飲之寒水，乃刺之，必寒衣之，居止寒處，身寒而止也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第九卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第九卷</p></article></main></div></div>
