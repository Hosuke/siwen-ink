    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 虛受人</nav></header><main><article><h1>虛受人</h1><p>君子虛心以受人，感通之道</p><p>山上有澤，咸。君子以虛受人。</p><p>澤居山上，虛而能受。君子法之，虛其心而受人言。山之所以能含澤，以其虛也；人之所以能感人，以其虛也。苟有其滿，則無以待人之感；苟存乎私，則不能通人之情。</p><p>虛者，非空洞之謂也，乃無我之私而存天理之公。以此感人，感無不通；以此受人，受無不納。</p><p><strong>所出</strong>：《周易 · 咸》 — https://zh.wikisource.org/wiki/周易/咸</p></article></main></div></div>
