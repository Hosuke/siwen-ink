    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 嘻亦樂亦樂</nav></header><main><article><h1>嘻亦樂亦樂</h1><p>世俗之所樂，舉群趣者，誙誙然如將不得已，而皆曰樂者，吾未之樂也，亦未之不樂也。</p><p>今俗之所為與其所樂，吾又未知樂之果樂邪，果不樂邪？吾觀夫俗之所樂，舉羣趣者，誙誙然如將不得已，而皆曰樂者，吾未之樂也，亦未之不樂也。果有樂無有哉？</p><p><strong>所出</strong>：《莊子 · 至樂》 — https://zh.wikisource.org/wiki/莊子/至樂</p></article></main></div></div>
