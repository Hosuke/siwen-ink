    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 黃帝得六相</nav></header><main><article><h1>黃帝得六相</h1><p>黃帝得六相以治天下，分掌天道、地利及四方。</p><p>昔者黃帝得蚩尤而明於天道，得大常而察於地利，得奢龍而辯於東方，得祝融而辯於南方，得大封而辯於西方，得后土而辯於北方。黃帝得六相而天地治，神明至。蚩尤明乎天道，故使為當時。大常察乎地利，故使為廩者；奢龍辨乎東方，故使為土師；祝融辨乎南方，故使為司徒；大封辨於西方，故使為司馬；后土辨乎北方，故使為李。</p><p>是故春者土師也，夏者司徒也，秋者司馬也，冬者李也。</p><p><strong>所出</strong>：《管子 · 第41篇五行》 — https://zh.wikisource.org/wiki/管子/第41篇五行</p></article></main></div></div>
