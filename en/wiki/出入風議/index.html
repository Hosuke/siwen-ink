    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 出入風議</nav></header><main><article><h1>出入風議</h1><p>言清談議論而不任事。</p><p>「或出入風議」，[[詩經·北山]]之句。言人高談闊論，出入言議，而無實事。與「靡事不為」者相對，以刺居上位者但尚言談，而不任勤事之苦也。</p><p><strong>所出</strong>：《詩經 · 北山》 — https://zh.wikisource.org/wiki/詩經/北山</p></article></main></div></div>
