    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 龍之為虫</nav></header><main><article><h1>龍之為虫</h1><p>龍柔可狎，然觸逆鱗則殺人；說者當無嬰人主之逆鱗。</p><p>夫龍之為虫也，柔可狎而騎也；然其喉下有逆鱗徑尺，若人有嬰之者，則必殺人。人主亦有逆鱗，說者能無嬰人主之逆鱗，則幾矣。</p><p><strong>所出</strong>：《韓非子 · 說難》 — https://zh.wikisource.org/wiki/韓非子/說難</p></article></main></div></div>
