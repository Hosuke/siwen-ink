    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 鳥覆翼之</nav></header><main><article><h1>鳥覆翼之</h1><p>后稷被棄，冰鳥以翼覆之而活。</p><p>后稷初生，薑嫄疑而棄之，寘諸寒冰。有鳥忽來，以翼覆護，溫之以暖。后稷因此而活，鳥去之後，呱呱泣聲，聞於道路。詩備述其異，以見-{后}-稷之稟受天命，非偶然也。</p><p><strong>所出</strong>：《詩經 · 生民》 — https://zh.wikisource.org/wiki/詩經/生民</p></article></main></div></div>
