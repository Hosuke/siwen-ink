    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 智之極者知智果不足以周物故愚</nav></header><main><article><h1>智之極者知智果不足以周物故愚</h1><p>智辨勇皆有其極，極則反，故智以愚成，辨以訥成，勇以怯成。</p><p>智之極者，知智果不足以周物，故愚；辨之極者，知辨果不足以喻物，故訥；勇之極者，知勇果不足以勝物，故怯。</p><p><strong>所出</strong>：《關尹子 · 9》 — https://zh.wikisource.org/wiki/關尹子/9</p></article></main></div></div>
