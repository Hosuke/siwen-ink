    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 偃月法</nav></header><main><article><h1>偃月法</h1><p>丹灶取象偃月，以喻陰陽消長之機。</p><p>偃月者，半明半晦之月象也。丹法取之以象[[爐鼎]]之形，月盈則[[白虎]]當旺，月晦則[[青龍]]始萌。丹灶之中，火候進退如月之盈闕，不可過亦不可不及。</p><p>此法以[[龍虎兩弦]]為用，上弦起於月之將盈，下弦成於月之既晦，兩弦交會之時，如月當晦而忽有微明，乃丹道最玄之機。此[[火計]]之所以不虛作者，正以演易象而明示之也。</p><p><strong>所出</strong>：《周易參同契 · 09章》 — https://zh.wikisource.org/wiki/周易參同契/09章</p></article></main></div></div>
