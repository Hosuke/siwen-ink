    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 含漱金醴</nav></header><main><article><h1>含漱金醴</h1><p>漱咽金醴玉英，乃集靈液、養五臟、致不飢之功。</p><p>金醴者，金行之液，喻肺炁之精華；玉英者，玉華之英，喻心神之英光。修煉之法，閉塞三關、握固專氣，含漱金醴、吞嚥玉英，液入五臟，滋養筋骨。行之既久，可以不食穀食而神氣充盈，三尸之蟲亦隨之而亡，心意常和、致欣然而昌盛。此乃黃庭煉液之秘道也。</p><p><strong>所出</strong>：《黃庭內景經 · 脾長章第十五》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/脾長章第十五</p></article></main></div></div>
