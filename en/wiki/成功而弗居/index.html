    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 成功而弗居</nav></header><main><article><h1>成功而弗居</h1><p>聖人功成而不處其位</p><p>成功而弗居，若此，其不欲見賢也。</p><p>「弗居」者，終不處其功也。通行本作「功成而不居」，帛書作「成功而弗居」，多一「而」字，去一「不」字而用「弗」。辭氣之異，蓋帛書本以「而」字承接「為而弗有」，又以「弗居」代「不居」，義各有在。</p><p>夫道之為物，生而不有，為而不恃，成功弗居，此聖人抱一之德也。功成自來，弗居自去，與天道損餘補不足者同揆。是以聖人無名，百姓自然歸之。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第四十二章 天道》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
