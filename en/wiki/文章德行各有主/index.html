    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 文章德行各有主</nav></header><main><article><h1>文章德行各有主</h1><p>德行易見而文章難識，故論人者當兼取之。</p><p>抱朴子答客難曰：「德行為有事，優劣易見。文章微妙，其體難識。夫易見者粗也，難識者精也。夫唯粗也，故銓衡有定焉；夫唯精也，故品藻難一焉。吾故舍易見之粗，而論難識之精，不亦可乎！」又申論云：「文章之與德行，猶十尺之與一丈，謂之余事，未之前聞。」且夫「本不必皆珍，末不必悉薄。譬如錦繡之因素地，珠玉之居蚌石，雲雨生於肤寸，江河始於咫尺爾。」</p><p><strong>所出</strong>：《抱朴子 · 卷32》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷32</p></article></main></div></div>
