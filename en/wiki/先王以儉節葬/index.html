    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 先王以儉節葬</nav></header><main><article><h1>先王以儉節葬</h1><p>先王儉葬，非惜其費，乃為死者慮，使發之則辱，儉則不發。</p><p>先王之所惡，惟死者之辱也。發則必辱，儉則不發，故先王之葬，必儉、必合、必同。</p><p>何謂合？何謂同？葬於山林則合乎山林，葬於阪隰則同乎阪隰，此之謂愛人。</p><p>堯葬於穀林，通樹之；舜葬於紀市，不變其肆；禹葬於會稽，不變人徒；是故先王以儉節葬死也，非愛其費也，非惡其勞也，以為死者慮也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十</p></article></main></div></div>
