    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 塞閉欲孔割破戀根</nav></header><main><article><h1>塞閉欲孔割破戀根</h1><p>塞閉情欲之竅、割斷愛戀之根，為道之要。</p><p>塞閉欲孔割破戀根，上清大洞修真之要功也。[[明堂]]之內守[[神名桃康]]，風雲鬱鬱，既清且涼，乃能塞閉欲孔；塞既閉，則[[大道君]]之光可入，故又當割破戀根。欲孔不塞則神散，戀根不割則炁滯，二者皆[[死炁之門]]之根由也。</p><p><strong>所出</strong>：《上清大洞真經 · 18章》 — https://zh.wikisource.org/wiki/上清大洞真經/18章</p></article></main></div></div>
