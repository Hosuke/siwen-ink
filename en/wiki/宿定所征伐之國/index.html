    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 宿定所征伐之國</nav></header><main><article><h1>宿定所征伐之國</h1><p>興師之先，人主當先定征伐之國，絕臣下之私議。</p><p>宿定所征伐之國，使羣臣、大吏、父兄、便辟左右不能議成敗，人主之任也。</p><p>師出有名，斯可以伐敵。[[兵主之事|兵主]]所以稟命而行者，以君先定其志，而後臣下奉令惟謹。若左右之人得以議論成敗，則軍志不行，而師出無功。故[[主明相知將能]]之「主明」者，必先定此也。</p><p><strong>所出</strong>：《管子 · 第27篇地圖》 — https://zh.wikisource.org/wiki/管子/第27篇地圖</p></article></main></div></div>
