    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 仙方九品</nav></header><main><article><h1>仙方九品</h1><p>天皇靈方有九品次第，太上真人所宜服食</p><p>安期問西漢夫人所授玉胎瓊膏之方，夫人云：「此天皇之靈方，乃真人所宜用耳，非流俗下屍所能窺也。仙方凡有九品：一名太和自然瑯之醴，二名玉胎瓊液之膏，三名飛丹紫華流精，四名朱光雲碧之腴，五名九泉紅華神丹，六名太清金液之華，七名九轉霜雪之丹，八名九鼎雲英，九名雲光石流飛丹，此皆九丹之次第也。」</p><p><strong>所出</strong>：《墉城集仙錄 · 卷04》 — https://zh.wikisource.org/wiki/墉城集仙錄/卷04</p></article></main></div></div>
