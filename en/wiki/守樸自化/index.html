    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 侯王守之萬物自化</nav></header><main><article><h1>侯王守之萬物自化</h1><p>侯王守道，萬物自正其性，不待裁制。</p><p>侯王若能守無為之道，萬物將自化。自化者，不待督責，各自化也。魚泳於淵，鳥棲於木，百姓日用而不知，此之謂自化。聖人在上，清靜寡欲，百姓見其自然之風，莫之令而自正焉。</p><p>若化而欲作者起焉，則以無名之樸鎮之。欲作者，嗜欲萌動，有為之漸也。聖人知其然，故以無名之樸鎮之，使不逐於外物也。</p><p><strong>所出</strong>：《老子河上公章句 · 為政》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
