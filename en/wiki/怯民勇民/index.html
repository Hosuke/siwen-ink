    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 怯民勇民</nav></header><main><article><h1>怯民勇民</h1><p>怯者用刑使之勇，勇者用賞使之必死</p><p>民畏死事亂而戰，故兵農怠而國弱。民之怯也，非怯於死，乃怯於辱也。刑治之世，民見辱之苦，甚於死之危，則怯心化而勇心生。是以怯民可以為勇民，視其所以治之何如爾。</p><p>夫民之性，畏死亡，樂安逸。苟賞不足以勸，刑不足以禁，則民怯於公戰，而勇於私闘。然上茍以刑賞驅之，則怯者可使忘死，勇者可使蹈刃。故曰：「怯民勇民，治之幾也。」</p><p><strong>所出</strong>：《商君書 · 卷五》 — https://zh.wikisource.org/wiki/商君書/卷五</p></article></main></div></div>
