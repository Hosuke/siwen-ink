    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 匪咎艱貞</nav></header><main><article><h1>匪咎艱貞</h1><p>无交害者不為咎，知艱守正者終得无咎。</p><p>初九「无交害，匪咎，艱則无咎」。言未有交往則無利害之涉，匪以此為咎也。然處《大有》之初，雖无交害，若不知艱難持守，亦將有咎。唯其以艱難自持，謹慎而不易，則終得无咎矣。《象》曰「无交害也」，正所以別乎有交之害云。</p><p><strong>所出</strong>：《周易 · 大有》 — https://zh.wikisource.org/wiki/周易/大有
===終::</p></article></main></div></div>
