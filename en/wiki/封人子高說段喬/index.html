    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 封人子高說段喬</nav></header><main><article><h1>封人子高說段喬</h1><p>善言者隱己之為，卒成其事。</p><p>韓氏城新城，期十五日而成。司空段喬執其吏而囚之。囚者之子走告封人子高，願委以救父。子高許之，乃見段喬，自扶而上城。左右望而嘆曰：「美哉城乎！一大功矣。子必有厚賞。自古及今，功若此其大而能無罪戮者，未嘗有也。」子高出，段喬使人夜解其吏之束縛而出之。夫人隱己之為而行之，段喬匿己之行而聽之，說之行若此其精也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十一》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十一</p></article></main></div></div>
