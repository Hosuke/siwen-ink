    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 三五合氣</nav></header><main><article><h1>三五合氣</h1><p>三五之氣相合，而歸於九九之節，萬化之原也。</p><p>三五合氣者，[[二物三五]]之氣相合，而歸於[[九九還丹|九九之節]]也。三五者，木火為三五，金水為三五，土為[[三一]]之一也。氣相合則返一，一返而九九之數周，[[萬物]]之化生皆原於此。[[存三|三]][[抱元]][[一]]之道，於斯為要。</p><p><strong>所出</strong>：《黃庭內景經 · 五行章第二十五》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/五行章第二十五</p></article></main></div></div>
