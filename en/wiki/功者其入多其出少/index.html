    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 功者其入多其出少</nav></header><main><article><h1>功者其入多其出少</h1><p>行事有利有害，功在利多害少，不在有名無實。</p><p>凡功者，其入多，其出少，乃可謂功。今大費無罪而少得為功，則人臣出大費而成小功，小功成而主亦有害。韓非以為，人主行事當計利害，不可以虛名為功。</p><p><strong>所出</strong>：《韓非子 · 南面》 — https://zh.wikisource.org/wiki/韓非子/南面</p></article></main></div></div>
