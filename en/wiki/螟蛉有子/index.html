    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 螟蛉有子</nav></header><main><article><h1>螟蛉有子</h1><p>螟蛾之子，比喻人之當善教子弟。</p><p>螟蛉，螟蛾之幼蟲也。《小宛》以中原有菽、庶民采之為比，明人力之可及；又言螟蛉有子、蜾蠃負之，乃自然之理。蜾蠃捕螟蛉以哺其子，古人誤以為養義子，實則寄生之術。詩取此象，以喻教誨爾子、式穀似之，使後嗣能善承祖德也。</p><p><strong>所出</strong>：《詩經 · 小宛》 — https://zh.wikisource.org/wiki/詩經/小宛</p></article></main></div></div>
