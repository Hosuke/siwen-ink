    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 言為文之用心</nav></header><main><article><h1>言為文之用心</h1><p>劉勰釋「文心」之名，謂用心於文者也。</p><p>「文心」者，「言為文之用心」之謂也。昔《涓子》有「琴心」，《王孫》有「巧心」，心之美者，莫過於是，而文章之用，亦在乎此心矣。</p><p><strong>所出</strong>：《文心雕龍 · 序志》 — https://zh.wikisource.org/wiki/文心雕龍/序志</p></article></main></div></div>
