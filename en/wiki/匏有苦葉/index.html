    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 匏有苦葉</nav></header><main><article><h1>匏有苦葉</h1><p>詠濟水渡口之景，以候人待渡諷衛宣公之事。</p><p>《匏有苦葉》，衞風之一篇也。前序云「衞宣公也。公與夫人並為淫亂。」蓋刺之也。</p><p>詩言匏瓜之葉已苦，秋時將熟；濟水深涉，行者當視深淺以為厲揭。水盈則雉鳴，雌求雄牡，以比淫奔之非禮。迨旭旦氷未泮，士宜歸妻以時。舟子招招，而人尚躊躇，蓋必待其友而後濟。言外之意，謂國有綱紀，人循禮義，不可以躁迫失度也。</p><p>四章，章四句。</p><p><strong>所出</strong>：《詩經 · 匏有苦葉》 — https://zh.wikisource.org/wiki/詩經/匏有苦葉</p></article></main></div></div>
