    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 密雲不雨自我西郊</nav></header><main><article><h1>密雲不雨自我西郊</h1><p>六五爻辭。雲密而不雨，陰已上亢也。公弋取彼在穴，取物以時之義。</p><p>六五柔中居尊，密雲不雨，自我西郊。雲自西而聚，陰已上盛，不能成雨，陽不及也。公弋取彼在穴者，陰陷於穴，不可得大，惟小取之而已。已上之義，戒勿亢也。</p><p><strong>所出</strong>：《周易 · 小過》 — https://zh.wikisource.org/wiki/周易/小過</p></article></main></div></div>
