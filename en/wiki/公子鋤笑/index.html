    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 公子鋤笑</nav></header><main><article><h1>公子鋤笑</h1><p>笑人送妻者，自亦見招；伐人者人亦伐之。</p><p>[[晉文公]]出會，欲伐[[衛]]，[[公子鋤]]仰天而笑。公問：「何笑？」曰：「臣笑鄰之人有送其妻適私家者，道見桑婦，悅而與言。然顧視其妻，亦有招之者矣。臣竊笑此也。」公寤其言，乃止，引師而還。未至，而有伐其北鄙者矣。</p><p><strong>所出</strong>：《列子 · 說符篇》 — https://zh.wikisource.org/wiki/列子/說符篇</p></article></main></div></div>
