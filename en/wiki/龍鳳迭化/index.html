    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 龍鳳迭化</nav></header><main><article><h1>龍鳳迭化</h1><p>陽氣消而陰氣長，迭為升降，終而復始，猶龍鳳之迭居。</p><p>陽炁消索，屈折低降，是龍居於上而鳳退於下也。十六轉受統，陽復得主，巽辛見平明，艮直于丙南，是鳳升而龍潛也。迭而化之，屈伸異時，終則有始，此萬物之常道。</p><p>[[蟾蜍與兔魄]]所以視卦節而吐光，[[日月炁雙明]]所以為之根柢者也。</p><p><strong>所出</strong>：《周易參同契 · 04章》 — https://zh.wikisource.org/wiki/周易參同契/04章</p></article></main></div></div>
