    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 望冠蓋選用任朋黨</nav></header><main><article><h1>望冠蓋選用任朋黨</h1><p>漢末吳晚，仕進專凭門蔭，師友之設有名無實，不惟無益，反為損。</p><p>漢之末世，吳之晚年，則不然焉。望冠蓋以選用，任朋黨之華譽，有師友之名，無拾遺之實。匪唯無益，乃反為損。故其所講說，非道德也；其所貢進，非忠益也。</p><p><strong>所出</strong>：《抱朴子 · 卷04》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷04</p></article></main></div></div>
