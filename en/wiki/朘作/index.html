    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 朘作</nav></header><main><article><h1>朘作</h1><p>嬰兒未解牝牡交合而朘自作者，精氣充盈自然之驗。</p><p>赤子未知牝牡之合，而朘自作者，精之至也。河上公以為，含德深厚之人，其精充盈，不待人事而自然發越，此乃道家煉精保氣之要義。</p><p><strong>所出</strong>：《老子河上公章句 · 玄符》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
