    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 坎為紀</nav></header><main><article><h1>坎為紀</h1><p>天開於甲子，坎為綱紀。</p><p>坎為紀者，子稱坎；甲，天也，綱也，陽也；坎者，子也，水也，陰也，紀也。故天與地常合，其[[綱紀]]於玄甲子初出，此可為有德上君治[[綱紀]]也，故言坎為紀也。乃謂上皇天書，下為德君出真經，書以繩斷邪，以玄甲為微初也。凡物生者，皆以甲為首，子為本，故以上甲子序出之也。</p><p><strong>所出</strong>：《太平經 · 07》 — https://zh.wikisource.org/wiki/太平經/07</p></article></main></div></div>
