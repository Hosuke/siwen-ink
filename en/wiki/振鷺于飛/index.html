    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 振鷺于飛</nav></header><main><article><h1>振鷺于飛</h1><p>以白鷺之潔脩喻賢者之德儀。</p><p>「振鷺于飛，于彼西雍」，以白鷺羣飛之姿，興賢者戾止之美。鷺之振羽而翔，潔白脩整，不染於泥塗，以喻君子之德，脩且清也。西雍者，水澤之地，鷺之所居，以興賢者之有歸宿也。</p><p>我客戾止，亦有斯容。言賢賓之至，其儀容之美，如振鷺之翔於天際也。</p><p><strong>所出</strong>：《詩經 · 振鷺》 — https://zh.wikisource.org/wiki/詩經/振鷺</p></article></main></div></div>
