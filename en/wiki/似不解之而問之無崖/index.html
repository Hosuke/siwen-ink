    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 似不解之而問之無崖</nav></header><main><article><h1>似不解之而問之無崖</h1><p>解之似不解之者，不知而後知之；問之不可以有崖，亦不可以無崖。</p><p>盡有天，循有照，冥有樞，始有彼。則其解之也似不解之者，其知之也似不知之也，不知而後知之。其問之也，不可以有崖，而不可以無崖。頡滑有實，古今不代，而不可以虧，則可不謂有大揚搉乎！</p><p><strong>所出</strong>：《莊子 · 徐無鬼》 — https://zh.wikisource.org/wiki/莊子/徐無鬼</p></article></main></div></div>
