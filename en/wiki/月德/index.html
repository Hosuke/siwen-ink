    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 月德</nav></header><main><article><h1>月德</h1><p>北方之月掌冬令，寒水之氣凝閉，閉藏成歲。</p><p>北方曰月，其時曰冬，其氣曰寒。寒生水與血，其德淳越，溫怒周密。其事號令，修禁徙，民令靜止，地乃不泄，斷刑致罰，無赦有罪，以符陰氣。大寒乃至，甲兵乃强，五穀乃熟，國家乃昌，四方乃備，此謂月德。月掌罰，罰為寒。</p><p><strong>所出</strong>：《管子 · 第40篇四時》 — https://zh.wikisource.org/wiki/管子/第40篇四時</p></article></main></div></div>
