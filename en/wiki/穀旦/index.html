    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 穀旦</nav></header><main><article><h1>穀旦</h1><p>良辰吉日，祭祀、會聚之所選也</p><p>穀旦者，良晨也。穀，善也；旦，明也。言善明之時，即吉日良辰，祭祀、會聚之所選用也。</p><p>《詩》云「穀旦于差」，言卜日以差選其良辰也；「穀旦于逝」，言良辰既至而往赴也。鄭箋云：「旦，明。」《傳》言「穀旦于差」，猶言「于以差」，以善日選擇之。陳風此詩言男女以穀旦聚會歌舞，是時俗重日選以為歡。《陳風·東門》言此，正見其淫荒之俗，假穀旦以為名，實則廢業歡會也。</p><p><strong>所出</strong>：《詩經 · 東門之枌》 — https://zh.wikisource.org/wiki/詩經/東門之枌</p></article></main></div></div>
