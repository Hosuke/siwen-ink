    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 伐喪之禁</nav></header><main><article><h1>伐喪之禁</h1><p>討違王命，諸侯之罪</p><p>冬，十月庚申，改葬惠公。冬十二月，衛侯來會葬，不見公，亦不書。</p><p>十一年冬，齊人、鄭人入郕，討違王命也。</p><p>諸侯相侵，以及葬天子為慢天，伐有喪之國為不義。齊、鄭之伐郕，書曰「討」，以其違王命故也。</p><p><strong>所出</strong>：《春秋左氏傳 · 隱公》 — https://zh.wikisource.org/wiki/春秋左氏傳/隱公</p></article></main></div></div>
