    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 德不可不興</nav></header><main><article><h1>德不可不興</h1><p>為政之本在德，德興則民所欲皆得，民所欲得則聽上，聽上而後政可善。</p><p>夫民必得其所欲，然後聽上，聽上然後政可善爲也。故曰：德不可不興也。</p><p><strong>所出</strong>：《管子 · 第10篇五輔》 — https://zh.wikisource.org/wiki/管子/第10篇五輔</p></article></main></div></div>
