    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 事故君臣之際</nav></header><main><article><h1>事故君臣之際</h1><p>君臣之際以禮義為神</p><p>「事故也，君臣之際也。禮義者，人君之神也，且君臣之屬也。親戚之愛，性也。使君親之察同索，屬故也。使人君不安者，屬際也，不可不謹也。」禮義乃人君之神明所寄，君臣之際以此相維。親戚之愛出乎天性，而君臣之屬在乎禮義。使人君不安者，正在此親密之際，不可不謹。賢不可威，能不可留。</p><p><strong>所出</strong>：《管子 · 第35篇侈靡》 — https://zh.wikisource.org/wiki/管子/第35篇侈靡</p></article></main></div></div>
