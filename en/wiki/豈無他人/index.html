    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 豈無他人</nav></header><main><article><h1>豈無他人</h1><p>怨辭也。明知有他人可適，而仍戀於故舊者之情也。</p><p>「豈無他人」者，《詩經·褰裳》之名句也。詩言：「子惠我，子不我思。豈無他人，狂童之狂也且。」</p><p>意謂：子若真心惠愛我，我亦以心相待；子若不思念我，豈無他人邪？我亦可他去也。以反詰之辭，表替代之勢，顯女子獨立不懼之概。</p><p>後世用此語者，類皆表達：此人既不相得我，別有人得我，勿以為天下止此一人爾。是以「豈無他人」四字，遂為表示替代可求、不必株守之典故。</p><p><strong>所出</strong>：《詩經 · 褰裳》 — https://zh.wikisource.org/wiki/詩經/褰裳</p></article></main></div></div>
