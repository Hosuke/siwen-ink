    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 修厥身</nav></header><main><article><h1>修厥身</h1><p>君王治國，必先修飭己身。</p><p>修厥身，允德協于下，惟明后。先修己身，則所行有德，而能和協於下。身修而後德崇，德崇而後民服。此為君之先務，亦[[正心]][[修身]]之義所自出。</p><p><strong>所出</strong>：《尚書 · 太甲中》 — https://zh.wikisource.org/wiki/尚書/太甲中</p></article></main></div></div>
