    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 熙寧己酉得道</nav></header><main><article><h1>熙寧己酉得道</h1><p>張伯端隨陸公入成都，感真人授金丹藥物火候之訣。</p><p>[[悟真篇]]序述自身經歷，云：「僕幼親善道，涉獵三教經書，惟金丹一法，閱盡羣經及諸家歌詩論契，皆莫能通曉真宗。僕以至人未遇，口訣難逢，雖詢求遍于海嶽，請益盡於賢愚，皆莫能通曉真宗。後至熙寧己酉歲，因隨龍圖陸公入成都，以夙志不回，初誠愈恪，遂感真人，授金丹藥物火候之訣。其言甚簡，其要不繁，可謂指流知源，語一悟百。」熙寧己酉，神宗熙寧二年（西元一零六九年）也。</p><p><strong>所出</strong>：《悟真篇》 — https://zh.wikisource.org/wiki/悟真篇</p></article></main></div></div>
