    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 楊朱言伯夷展季</nav></header><main><article><h1>楊朱言伯夷展季</h1><p>楊朱以為伯夷矜清而死，展季矜貞而寡宗，清貞之誤善，其患如此。</p><p>楊朱曰：「伯夷非亡欲，矜清之郵，以放餓死。展季非亡情，矜貞之郵，以放寡宗。清貞之誤善之若此！」</p><p><strong>所出</strong>：《列子 · 楊朱篇》 — https://zh.wikisource.org/wiki/列子/楊朱篇</p></article></main></div></div>
