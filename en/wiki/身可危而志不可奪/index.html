    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 身可危而志不可奪</nav></header><main><article><h1>身可危而志不可奪</h1><p>儒者雖陷於危難，身命或有不保，而心志堅定不可動搖。</p><p>適弗逢世；上弗援，下弗推。讒諂之民，有比黨而危之者，身可危也，而志不可奪也。雖危起居，竟信其志，猶將不忘百姓之病也。</p><p>逢世之不遇，遭人之相害，身之危也，固無可言。然儒者之志，非由外鑠，乃我所固有。讒言不能搖之，威力不能奪之，身可殺而志不可易。此正《孟子》所謂「富貴不能淫，貧賤不能移，威武不能屈」之義。竟信其志者，終遂其志也；不忘百姓之病者，兼善之心也。</p><p><strong>所出</strong>：《禮記 · 儒行》 — https://zh.wikisource.org/wiki/禮記/儒行</p></article></main></div></div>
