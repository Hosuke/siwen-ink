    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 三真生太無</nav></header><main><article><h1>三真生太無</h1><p>誦呪存思，混合三元之氣。</p><p>[[帝卿]]誦呪云：「三真生太無，玉戶映晨霞，太素洞元虛，丹靈森朱阿，回神九重府，內唱發瓊華，百關納津液，停年秀三柯，我身騰玉清，七祖離幽都，長保不終劫，萬世為仙家。」斯呪也，以默誦為貴，心會三色之雲炁，吐故納新，而身得超昇者也。</p><p><strong>所出</strong>：《上清大洞真經 · 38章》 — https://zh.wikisource.org/wiki/上清大洞真經/38章</p></article></main></div></div>
