    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 知其白守其黑</nav></header><main><article><h1>知其白守其黑</h1><p>守黑淵默，恆德不忒，復歸無極。</p><p>知其白、守其黑，爲天下式。爲天下式，恆德不忒。恆德不忒，復歸於无極。</p><p>白者昭昭，黑者暗暗。聖人知昭昭之易竭，而守暗暗以爲法式。式者法也、準也，爲天下所取正焉。忒，差也；無差忒，則德全。德全無已，復歸無極——無極者，道之本體，廣大悉備，不可限量也。</p><p>此與 [[復歸於無極]] 義同，蓋老子言德至於極，無以復加，歸於道之初也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第七十二章 恆德》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
