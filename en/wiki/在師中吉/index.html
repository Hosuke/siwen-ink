    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 在師中吉</nav></header><main><article><h1>在師中吉</h1><p>將在師中，受王寵命，乃得吉祥。</p><p>九二在師中吉，无咎；王三錫命。將帥在師，承天之寵，故吉而无咎。王三錫命者，懷萬邦而天下服也。象曰：「在師中吉，承天寵也。王三錫命，懷萬邦也。」</p><p><strong>所出</strong>：《周易 · 師》 — https://zh.wikisource.org/wiki/周易/師</p></article></main></div></div>
