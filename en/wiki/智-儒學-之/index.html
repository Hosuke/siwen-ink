    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 智-儒學-之</nav></header><main><article><h1>智-儒學-之</h1><p></p><p>《不苟篇》以智與愚對舉，論君子小人之分：</p><p>  君子知則明通而類，愚則端愨而法；小人知則攫盜而漸，愚則毒賊而亂。是知與愚，在君子則通而法，在小人則漸而亂，運用之殊也。</p><p>  <strong>所出</strong>：《荀子 · 不苟篇》 — https://zh.wikisource.org/wiki/荀子/不苟篇</p><hr><p>昔者君子比德於玉焉：縝密以栗，知也。</p><p>  <strong>所出</strong>：《禮記 · 聘義》 — https://zh.wikisource.org/wiki/禮記/聘義</p></article></main></div></div>
