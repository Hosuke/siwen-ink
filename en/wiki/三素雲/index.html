    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 三素雲</nav></header><main><article><h1>三素雲</h1><p>三素雲者，三色之炁合而成雲，象肺白、心赤、脾黃之三元。</p><p>三素雲者，三素合成之雲象也。素者，白色之純；然兼赤黃言之者，三素乃肺白、心赤、脾黃三元之炁，交互為雲，浮遊人身之中。《上清黃庭內景經》以紫煙上下三素雲，言炁之升降交錯，滋養五華，灌溉靈根，皆三素之功用也。</p><p><strong>所出</strong>：《黃庭內景經 · 上有章第二》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/上有章第二</p></article></main></div></div>
