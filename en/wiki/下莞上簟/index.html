    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 下莞上簟</nav></header><main><article><h1>下莞上簟</h1><p>莞簟相承，寢臥安適。</p><p>[[下莞上簟]]者，言臥席之制也。莞，蒲之初生者，可以為席；簟，竹席也。下以莞為底，上以簟覆之。言宮室既安，於是安寢於斯，竹莞相承，以見其臥之安適也。</p><p><strong>所出</strong>：《詩經 · 斯干》 — https://zh.wikisource.org/wiki/詩經/斯干</p></article></main></div></div>
