    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 有獻不死之藥於荆王者</nav></header><main><article><h1>有獻不死之藥於荆王者</h1><p>食不死之藥而王殺臣，是死藥也，客欺王也</p><p>有獻不死之藥於荆王者，謁者操之以入。中射之士問曰：「可食乎？」曰：「可。」因奪而食之。王大怒，使人殺中射之士。中射之士使人說王曰：「臣問謁者，曰『可食』，臣故食之，是臣無罪而罪在謁者也。且客獻不死之藥，臣食之而王殺臣，是死藥也，是客欺王也。夫殺無罪之臣而明人之欺王也，不如釋臣。」王乃不殺。</p><p><strong>所出</strong>：《韓非子 · 說林上》 — https://zh.wikisource.org/wiki/韓非子/說林上</p></article></main></div></div>
