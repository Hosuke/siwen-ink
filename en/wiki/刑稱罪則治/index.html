    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 刑稱罪則治</nav></header><main><article><h1>刑稱罪則治</h1><p>刑罰當罪則治，不當罪則亂</p><p>治古不然。凡爵列、官職、賞慶、刑罰，皆報也，以類相從者也。一物失稱，亂之端也。夫德不稱位，能不稱官，賞不當功，罰不當罪，不祥莫大焉。</p><p>刑稱罪則治，不稱罪則亂。故治則刑重，亂則刑輕，犯治之罪固重，犯亂之罪固輕也。書曰「刑罰世輕世重」，此之謂也。</p><p><strong>所出</strong>：《荀子 · 正論篇》 — https://zh.wikisource.org/wiki/荀子/正論篇</p></article></main></div></div>
