    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 平準書</nav></header><main><article><h1>平準書</h1><p>述漢初至武帝時財用盈虛、幣制變革、鹽鐵官營、均輸平準之由來。</p><p>《史記》有〈平準書〉，司馬遷所述，以記漢興至武帝時財用盈虛之故。首述秦末凋敝，天下既定，高祖令民鑄錢，孝文弛鑄令，吳鄧錢布天下，鑄錢之禁生焉。匈奴數侵，邊粟不足，募民輸粟拜爵。及武帝即位，征伐四夷，費用不足，於是興鹽鐵、鑄金幣、推行告緡。又令孔僅、東郭咸陽領鹽鐵，桑弘羊起大農，設均輸、平準，以抑物價、贍軍國。其末論物盛而衰之變，以為治道之鑑。</p><p><strong>所出</strong>：《史記 · 卷030》 — https://zh.wikisource.org/wiki/史記/卷030</p></article></main></div></div>
