    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 乳童</nav></header><main><article><h1>乳童</h1><p>返樸還淳，在於以儉化下，不在法制威刑。</p><p>乳童拱手，誰敢戲之，豈在乎黼黻也。牧豎折腰，誰敢背之，豈在乎刑政也。有賓主之敬，則雞黍可以為大享，豈在乎簫韶也。有柔淑之態，則荊苧可以行婦道，豈在乎組繡也。而王者之制，設溝隍以禦之，陳棨戟以衛之，蓄粟帛以養之，張欄檻以遠之。蓋有機於民，不得不藏；有私於己，不得不防。夫能張儉之機，民自不欺；用儉之私，我自不疑。夫儉者，可以為大人之師。</p><p><strong>所出</strong>：《化書 · 卷六》 — https://zh.wikisource.org/wiki/化書/卷六</p></article></main></div></div>
