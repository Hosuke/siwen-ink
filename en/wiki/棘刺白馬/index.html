    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 棘刺白馬之說</nav></header><main><article><h1>棘刺白馬之說</h1><p>喻空言無用、詭辭飾姦而不可施行</p><p>棘刺之說、{{白馬非馬}}之論，皆虛言無實、飾辭以眩人者也。夫棘刺端為母猴，必三月齋而後能觀，終不可得，此姦人之巧言也。{{兒說}}持{{白馬非馬}}之說，能勝一國，而不能謾於關吏，可見詭辯雖巧，終於實事無補。是以明主治世，必禁此類浮說，使民歸於實用。</p><p><strong>所出</strong>：《韓非子 · 外儲說左上》 — https://zh.wikisource.org/wiki/韓非子/外儲說左上</p></article></main></div></div>
