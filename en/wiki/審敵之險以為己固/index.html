    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 審敵之險以為己固</nav></header><main><article><h1>審敵之險以為己固</h1><p>兵貴因敵，因敵之險以為固，因敵之謀以為事，此勝不可窮之道。</p><p>凡兵，貴其因也。因也者，因敵之險以為己固，因敵之謀以為己事。能審因而加，勝則不可窮矣。勝不可窮之謂神，神則能不可勝也。</p><p>夫兵，貴不可勝。不可勝在己，可勝在彼。聖人必在己者，不必在彼者，故執不可勝之術以遇可勝之敵，若此則兵無失矣。凡兵之勝，敵之失也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷八》 — https://zh.wikisource.org/wiki/呂氏春秋/卷八</p></article></main></div></div>
