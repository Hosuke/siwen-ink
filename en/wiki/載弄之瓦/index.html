    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 載弄之瓦</nav></header><main><article><h1>載弄之瓦</h1><p>女嬰弄瓦，習其德。</p><p>[[載弄之瓦]]者，言生女子則玩弄紡磚也。瓦，紡磚也，古代紡織之具。女子弄瓦，示其日後主中饋、操持家務之事。此與男子弄璋相對，分別以器物象其異德。</p><p><strong>所出</strong>：《詩經 · 斯干》 — https://zh.wikisource.org/wiki/詩經/斯干</p></article></main></div></div>
