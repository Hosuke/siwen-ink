    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 無戲豫</nav></header><main><article><h1>無戲豫</h1><p></p><p>《詩·大雅·板》又言「敬天之怒，無敢戲豫」，此[[敖不可長欲不可從]]之義也。戲豫者，[[敖不可長]]之漸；馳驅者，[[欲不可從]]之流。</p><p>  戒人君不可輕天之威，而[[逸豫]]亡身，[[淫佚]]敗德。[[驕人好好]]，終至[[悔吝]]叢生也。</p><p>  <strong>所出</strong>：《詩經 · 板》 — https://zh.wikisource.org/wiki/詩經/板</p></article></main></div></div>
