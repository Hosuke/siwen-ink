    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 太古之事滅</nav></header><main><article><h1>太古之事滅</h1><p>楊朱以為三皇之事若存若亡，五帝若覺若夢，億不識一；矜一時之毀譽以焦苦神形，不值也。</p><p>楊朱曰：「太古之事滅矣，孰誌之哉？三皇之事若存若亡，五帝之事若覺若夢，三王之事或隱或顯，億不識一。當身之事或聞或見，萬不識一。目前之事或存或廢，千不識一。太古至于今日，年數固不可勝紀。但伏羲已來三十餘萬歲，賢愚、好醜、成敗、是非，無不消滅，但遲速之間耳。矜一時之毀譽，以焦苦其神形，要死後數百年中餘名，豈足潤枯骨？何生之樂哉？」</p><p><strong>所出</strong>：《列子 · 楊朱篇》 — https://zh.wikisource.org/wiki/列子/楊朱篇</p></article></main></div></div>
