    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 心之中又有心焉</nav></header><main><article><h1>心之中又有心焉</h1><p>心有多層，深處別有真心，聲音形言皆由此出。</p><p>文：心以藏心，心之中又有心焉。彼心之心，音以先言。音然後形，形然後言，言然後使，使然後治。是故治心者，當求諸心之中；心不治則形不能正，形不正則德不來。善氣迎人，親於弟兄；惡氣迎人，害於戎兵。內靜外敬，能反其性，性將大定。</p><p><strong>所出</strong>：《管子 · 第49篇內業》 — https://zh.wikisource.org/wiki/管子/第49篇內業</p></article></main></div></div>
