    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 班孟飛行</nav></header><main><article><h1>班孟飛行</h1><p>班孟能飛行虛空，入地穿泉，禁蟲卻虎，噴墨成文。</p><p>班孟者，不知何許人。或雲女子也。能飛行終日，又能坐虛空之中與人言語，又能入地中，初沒足，至腰及胸，漸漸但餘冠幘，良久而盡沒不見。又以指刺地，即成泉井而可汲引。又吸人屋上瓦，瓦即飛入人家。人家有桑果數千株，皆聚之成積如山，如此十餘日，吹之各還其處如常。又能舍墨舒紙著前，嚼墨亦噴之，皆成文字滿紙，各有意義。服酒餌丹，年四百歲更少容。後入大冷山中仙去。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 5》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/5</p></article></main></div></div>
