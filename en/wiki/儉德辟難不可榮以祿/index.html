    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 儉德辟難不可榮以祿</nav></header><main><article><h1>儉德辟難不可榮以祿</h1><p>君子以儉約之德避患難，不可以祿位為榮</p><p>天地不交，否；君子以儉德辟難，不可榮以祿。</p><p>象辭也。言天地上下不交，閉塞成否。君子觀此象，當斂藏其德，不露才華，以避患難。處否世而受祿受賞，非保身之道也。</p><p><strong>所出</strong>：《周易 · 否》 — https://zh.wikisource.org/wiki/周易/否</p></article></main></div></div>
