    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 紫極</nav></header><main><article><h1>紫極</h1><p>頭頂上丹田之別稱，象北辰之光明。</p><p>紫極者，頭部上丹田之別稱也。《經》云「洞房紫極」，紫象北方紫微垣之色，極者至極高遠之處。在人身則頭象天頂，紫微帝座居其所。修煉者存思紫極，令頭中一點光明上燭，與天北辰相映，則神遊八表、與道合虛。一說紫極即泥丸宮，泥象坤土色黃而生金，丸者圓象天極，合而言之，是頭部最上一點靈明之處也。</p><p><strong>所出</strong>：《黃庭內景經 · 靈臺章第十七》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/靈臺章第十七</p></article></main></div></div>
