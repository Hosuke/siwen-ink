    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 宿治者削</nav></header><main><article><h1>宿治者削</h1><p>治事延緩則國削，以五里斷者王，以九里斷者强。</p><p>韓非論治緩之害，云「行法曲斷，以五里斷者王，以九里斷者强，宿治者削」。曲斷者，就近裁決也；宿治者，積壓不決也。五里而斷，則事速功成，可以王天下；九里而斷，則民知畏法，可以強國家；至於宿治不決，則姦宄滋生，政令不行，國必削弱矣。此言治事貴速，遲則有損也。</p><p><strong>所出</strong>：《韓非子 · 飭令》 — https://zh.wikisource.org/wiki/韓非子/飭令</p></article></main></div></div>
