    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 視其所愛以分其威</nav></header><main><article><h1>視其所愛以分其威</h1><p>察敵之所愛，分其威勢，離其心腹。</p><p>而謀有功者五：一曰視其所愛以分其威。一人兩心，其內必衰也。臣不用，其國可危。二曰視其陰所憎。厚其貨賂，得情可深。身內情外，其國可知。</p><p><strong>所出</strong>：《管子 · 第53篇禁藏》 — https://zh.wikisource.org/wiki/管子/第53篇禁藏</p></article></main></div></div>
