    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 逆順肥瘦</nav></header><main><article><h1>逆順肥瘦</h1><p>刺法因人肥瘦而異，臨深決水，循掘決衝，隨氣血而行。</p><p>刺法因人而異，不可執一。肥人深而留之，瘦人淺而疾之，壯士真骨者因其氣澀血濁或氣滑血清而異，嬰兒以毫針淺刺日再可也。</p><p>氣之滑澀、血之清濁、行之逆順，可以決水通經。血清氣濁，疾寫之則氣竭；血濁氣澀，疾寫之則經可通。</p><p>脈行之逆順：手之三陰從藏走手，手之三陽從手走頭，足之三陽從頭走足，足之三陰從足走腹。唯衝脈為五藏六府之海，其氣下行，故少陰脈獨下行。</p><p><strong>所出</strong>：《黃帝內經 · 靈樞第六卷》 — https://zh.wikisource.org/wiki/黃帝內經/靈樞第六卷</p></article></main></div></div>
