    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 來威</nav></header><main><article><h1>來威</h1><p>以威服之使來，征蠻荊之功成。</p><p>來威者，以威加敵而使之服也。《采芑》四章末句云：「顯允方叔，征伐玁狁，蠻荊來威。」言[[顯允方叔]]北征玁狁，南服蠻荊，以赫赫之軍威，加於強敵，而荊人不敵而至，故曰來威。[[如霆如雷]]之威，無往不服，此武功之成也。</p><p><strong>所出</strong>：《詩經 · 采芑》 — https://zh.wikisource.org/wiki/詩經/采芑</p></article></main></div></div>
