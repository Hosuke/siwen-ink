    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 在己無居</nav></header><main><article><h1>在己無居</h1><p>聖人動若水、靜若鏡、應若響，未嘗先人而嘗隨人。</p><p>在己無居，形物自著，其動若水，其靜若鏡，其應若響，芒乎若亡，寂乎若清，同焉者和，得焉者失，未嘗先人，而嘗隨人。</p><p>渾乎洋乎游太初乎，時金己，時玉己，時糞己，時土己，時翔物，時逐物，時山物，時淵物，端乎權乎狂乎愚乎。</p><p><strong>所出</strong>：《關尹子 · 3》 — https://zh.wikisource.org/wiki/關尹子/3</p></article></main></div></div>
