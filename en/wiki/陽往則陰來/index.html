    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 陽往則陰來</nav></header><main><article><h1>陽往則陰來</h1><p>陰陽迭運，往來相循，此造化之常道也。</p><p>天地之道，陽往則陰來，陰往則陽來。迭運不息，循還無端。陽之始，陰所終；陰之始，陽所終。一消一息，自然之理。</p><p><strong>所出</strong>：《周易參同契 · 03章》 — https://zh.wikisource.org/wiki/周易參同契/03章</p></article></main></div></div>
