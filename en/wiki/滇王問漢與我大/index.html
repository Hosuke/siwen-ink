    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 滇王問漢與我大</nav></header><main><article><h1>滇王問漢與我大</h1><p>述滇王與漢使者問答及夜郎侯亦然，以道不通故各自以為一州主之事</p><p>滇王與漢使者言曰：「漢孰與我大？」及夜郎侯亦然。以道不通故，各自以為一州主，不知漢廣大。使者還，因盛言滇大國，足事親附。天子注意焉。</p><p><strong>所出</strong>：《史記 · 卷116》 — https://zh.wikisource.org/wiki/史記/卷116</p></article></main></div></div>
