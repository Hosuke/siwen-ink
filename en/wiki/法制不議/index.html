    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 法制不議</nav></header><main><article><h1>法制不議</h1><p>法度既定，則民不私相授受。</p><p>法者，天子與天下公共也。法制不議，然聖人立法之時，既已盡天之節。列地而守之，分民而部之；法猛刑頗，則神濕天清。上下有閒，於是設防知蔽並起。政在私家而不能取，重人掉權而不能止。為政之道，非法不足以靖民也。</p><p><strong>所出</strong>：《鶡冠子》 — https://zh.wikisource.org/wiki/鶡冠子</p></article></main></div></div>
