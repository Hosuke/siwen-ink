    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 三守</nav></header><main><article><h1>三守</h1><p>人主所當謹守之三事，防姦臣竊權之道。</p><p>人主執國，當有三守：一守心藏，不令近習能人窺測意向；二守端直，不使端言之人不得上達；三守賞罰，不令大臣擅殺生奪予之柄。</p><p>三守完固，則國安身榮；其或不完，則姦臣乘隙而起，是生三劫之禍。[[六守]]之別，在於所守之物不同；三守專就人主一身言之，防其為近習所蔽、為大臣所劫也。</p><p><strong>所出</strong>：《韓非子 · 三守》 — https://zh.wikisource.org/wiki/韓非子/三守</p></article></main></div></div>
