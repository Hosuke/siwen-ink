    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 胃為脈之根</nav></header><main><article><h1>胃為脈之根</h1><p>胃為五藏六府之海，清氣上注於肺，肺氣從太陰而行，故人一呼一吸，脈再動而不止。</p><p>胃為五藏六府之海，其清氣上注於肺，肺氣從太陰而行之，其行也，以息往來，故人一呼，脈再動，一吸，脈亦再動，呼吸不已，故動而不止。</p><p><strong>所出</strong>：《黃帝內經 · 靈樞第九卷》 — https://zh.wikisource.org/wiki/黃帝內經/靈樞第九卷</p></article></main></div></div>
