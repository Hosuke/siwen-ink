    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 法度之制</nav></header><main><article><h1>法度之制</h1><p>度量權衡，法度程式，不可欺以詐僞。</p><p>明主有法度之制，故羣臣皆出於方正之治，而不敢為姦。百姓知主之從事於法也，故有法則民從之，無法則止。民以法與吏相距，故詐偽之人不得欺其主。
<strong>所出</strong>：《管子 · 第67篇明法解》 — https://zh.wikisource.org/wiki/管子/第67篇明法解</p></article></main></div></div>
