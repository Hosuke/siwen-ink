    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 主人獻卿</nav></header><main><article><h1>主人獻卿</h1><p>主人獻卿，司宮兼卷重席，卿辭重席，徹之</p><p>主人洗，升，實散，獻卿于西階上。司宮兼卷重席，設于賔左，東上。卿升，拜受觚；主人拜送觚。卿辭重席，司宮徹之，乃[[荐脯醢]]。卿升席坐，左執爵，右祭脯醢，遂祭酒，不啐酒；降席，西階上北面坐卒爵，興；坐奠爵，拜，執爵興。主人荅拜，受爵。卿降復位。辯獻卿，主人以虛爵降，奠于篚。射人乃升卿，卿皆升就席。若有諸公，則先卿獻之，如獻卿之禮；席于[[阼階]]西，北面東上，無加席。</p><p><strong>所出</strong>：《儀禮 · 燕禮》 — https://zh.wikisource.org/wiki/儀禮/燕禮</p></article></main></div></div>
