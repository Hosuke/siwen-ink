    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 安在紫房幃幕間</nav></header><main><article><h1>安在紫房幃幕間</h1><p>真神安居紫房之中，如在幃幕之內。</p><p>紫房者，內景經所謂「紫微宮」，在人身中宮之位。幃幕，帷幕也。真神安然居此，神與身一，神安則形泰。</p><p><strong>所出</strong>：《黃庭內景經 · 治生章第二十三》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/治生章第二十三</p></article></main></div></div>
