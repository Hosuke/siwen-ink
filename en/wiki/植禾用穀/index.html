    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 植禾用穀</nav></header><main><article><h1>植禾用穀</h1><p>種植當用同類之種，喻修煉必以同氣之物相合。</p><p>植禾當以谷，覆雞用其卵，以類補自然，物成易陶冶。此以農事喻丹道之理也。夫禾生於谷，雞由於卵，種瓜得瓜，種豆得豆，理之自然也。修煉亦然，必取同類之氣、同質之物，相感相合，方可成就。</p><p>世人不明此理，妄以五石雜煉，冀獲神丹，譬如以蓬蒿期其為檟、以魚目望其成珠，終不可得。故聖人立教，必本自然而後動，合同類而後成。</p><p><strong>所出</strong>：《周易參同契 · 12章》 — https://zh.wikisource.org/wiki/周易參同契/12章</p></article></main></div></div>
