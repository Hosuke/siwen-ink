    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 燒香接手玉華前</nav></header><main><article><h1>燒香接手玉華前</h1><p>焚香持手，承玉華之精。</p><p>修真之際，燒香以通神，承接玉華。玉華者，津液之精華、漱津咽液之類也。香在手而液承前，乃內外兼修之象。</p><p><strong>所出</strong>：《黃庭內景經 · 治生章第二十三》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/治生章第二十三</p></article></main></div></div>
