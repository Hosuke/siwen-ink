    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 被髮而無卷領</nav></header><main><article><h1>被髮而無卷領</h1><p>古者質樸，無禮義之繁，民物大和。</p><p>古者被髮而無卷領，以王天下，其德生而不殺，與而不奪，天下非其服，同懷其德，當此之時，陰陽和平，萬物蕃息，飛鳥之巢可俯而探也，走獸可係而從也。</p><p>及其衰也，鳥獸蟲蛇，皆為民害。</p><p><strong>所出</strong>：《文子 · 卷十二》 — https://zh.wikisource.org/wiki/文子/卷十二</p></article></main></div></div>
