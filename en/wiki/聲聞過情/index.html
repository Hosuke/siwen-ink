    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 聲聞過情</nav></header><main><article><h1>聲聞過情</h1><p>名過乎實，君子恥之。</p><p>孟子以水喻人：「有本者如是」，源泉混混，盈科而進，終放四海；若無本，雖一時盈溢，頃刻立待。遂曰：「故聲聞過情，君子恥之。」名聲超越實際，是無本之人也，君子以為恥。名實相副，君子之所尚；名過其實，君子之所賤。</p><p><strong>所出</strong>：《孟子 · 離婁下》 — https://zh.wikisource.org/wiki/孟子/離婁下</p></article></main></div></div>
