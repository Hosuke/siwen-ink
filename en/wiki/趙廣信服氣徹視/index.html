    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 趙廣信</nav></header><main><article><h1>趙廣信</h1><p>陽城人，魏末渡江入刻小白山，受李法成服氣法及左君守玄中之道，內見五臟徹視法，賣藥人間數十年，丹成以晉穆帝永和元年白日登天。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 17》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/17</p></article></main></div></div>
