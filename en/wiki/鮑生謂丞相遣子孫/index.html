    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 鮑生謂丞相遣子孫</nav></header><main><article><h1>鮑生謂丞相遣子孫</h1><p>鮑生教蕭何遣子孫昆弟詣軍所以解上疑。</p><p>漢三年，漢王與項羽相距京索之間，上數使使勞苦丞相。鮑生謂丞相曰：「王暴衣露蓋，數使使勞苦君者，有疑君心也。為君計，莫若遣君子孫昆弟能勝兵者悉詣軍所，上必益信君。」於是何從其計，漢王大說。夫疑心之萌也，在功高而不自斂。鮑生之言，可謂知機矣。</p><p><strong>所出</strong>：《史記 · 卷053》 — https://zh.wikisource.org/wiki/史記/卷053</p></article></main></div></div>
