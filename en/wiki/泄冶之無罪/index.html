    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 泄冶之無罪</nav></header><main><article><h1>泄冶之無罪</h1><p>泄冶以諫喪身，國人聞之猶可，仁人聞之則不可</p><p>陳殺其大夫泄冶。</p><p>穀梁氏曰：「泄冶之無罪如何？陳靈公通于夏徵舒之家，公孫寧、儀行父，亦通其家。或衣其衣，或衷其襦，以相戲於朝。泄冶聞之，入諫曰：『使國人聞之則猶可，使仁人聞之則不可。』君愧於泄冶，不能用其言而殺之。」</p><p>諫有得失，泄冶之言，非必盡善，然以身殉國，志在正君，可謂忠矣。靈公不能用而殺之，是君之罪也。</p><p><strong>所出</strong>：《春秋穀梁傳 · 宣公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/宣公</p></article></main></div></div>
