    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 史巫紛若</nav></header><main><article><h1>史巫紛若</h1><p>史巫以誠相見，則能獲吉而無咎也。</p><p>九二之爻曰「巽在牀下，用史巫紛若，吉无咎」。《象》曰「紛若之吉，得中也」。史巫者，祝史巫覡，以祠祀為職者也。處下而能自卑，致敬以事鬼神，故吉而无咎。九二以剛居柔，屈居下體，是得中道也。</p><p><strong>所出</strong>：《周易 · 巽》 — https://zh.wikisource.org/wiki/周易/巽</p></article></main></div></div>
