    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 不待權輿</nav></header><main><article><h1>不待權輿</h1><p>有十勝之資，不待權謀而天下自定。</p><p>國家既有[[十年之蓄]]之資，十勝之備，則發如風雨，動如雷霆，獨出獨入，莫之能禁止，「不待權輿」。蓋蓄積既厚，不假外求，而威聲自然遠震。此與[[霸王之器]]之義相近。</p><p><strong>所出</strong>：《管子 · 第71篇事語》 — https://zh.wikisource.org/wiki/管子/第71篇事語</p></article></main></div></div>
