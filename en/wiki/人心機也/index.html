    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 人心機也</nav></header><main><article><h1>人心機也</h1><p>天性本於人，人心之機，乃天人相感之樞紐。</p><p>天性，人也。人心，機也。立天之道，以定人也。</p><p>諸葛亮曰：「以為立天定人，其在於五賊。」</p><p><strong>所出</strong>：《黃帝陰符經集註》 — https://zh.wikisource.org/wiki/黃帝陰符經集註</p></article></main></div></div>
