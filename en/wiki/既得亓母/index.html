    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 既得亓母</nav></header><main><article><h1>既得亓母</h1><p>得道則知子，循本則無危</p><p>「既得亓母，以知亓子。」言既得道之根本，則知萬物之理；既知萬物之理，則復守其本，沒身不殆。得母而不知子，守母而不行，是滯於一隅；知子而不守母，是逐物而忘本。唯[[既得亓母]]而[[以知亓子]]，循[[以為天下母]]之理，終身不殆。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第十五章 守母》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
