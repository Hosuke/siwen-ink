    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 虚静以待-之</nav></header><main><article><h1>虚静以待-之</h1><p></p><p>[[虚静以待]]之說，見於[[申子之言]]及[[堂谿公問玉巵]]。</p><p>[[申子]]云：「惟無為可以規之。」[[唐易之言弋]]引鄭長者之言：「虚無無見者，廪也。」皆虛静無為之義。</p><p>[[堂谿公問玉巵]]言：昭侯聞玉巵無當之喻，「欲發天下之大事，未嘗不獨寢」——虛静慎言之驗也。</p><p>[[賞罰以信]]必本於虛静，否則[[任譽姦之鼠]]竊柄而[[不殺其狗則酒酸]]矣。</p><p><strong>所出</strong>：《韓非子 · 外儲說右上》 — https://zh.wikisource.org/wiki/韓非子/外儲說右上</p></article></main></div></div>
