    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 高上虛皇君道經第一</nav></header><main><article><h1>高上虛皇君道經第一</h1><p>上清大洞真經第一章以虛皇為宗</p><p>[[上清大洞真經]]三十九章，此為首章，以高上虛皇君為宗主。茅山上清三十八代宗師蔣宗瑛校勘經文，言此章為[[太微小童]]章，專明守護舌根、固塞死源之要。行者先[[存神]]思赤雲，誦[[大洞玉經]]，呼[[太微小童]]內諱，佩[[消魔玉符]]，然後[[叩齒咽液]]，方為行道之全功。三十九章皆倣此法，一脈相承，以[[守一]]為宗焉。</p><p><strong>所出</strong>：《上清大洞真經 · 1章》 — https://zh.wikisource.org/wiki/上清大洞真經/1章</p></article></main></div></div>
