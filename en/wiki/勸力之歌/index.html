    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 勸力之歌</nav></header><main><article><h1>勸力之歌</h1><p>號子之歌，適時合用，勝於淫聲</p><p>翟煎論治國以擧大木為喻，前呼邪許，後亦應之，此舉重勸力之歌也。豈無鄭衞激楚之音，然而不用者，不若此其宜也。[[治國有禮]]之別喻。</p><p><strong>所出</strong>：《淮南子 · 道應訓》 — https://zh.wikisource.org/wiki/淮南子/道應訓</p></article></main></div></div>
