    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 四門穆穆</nav></header><main><article><h1>四門穆穆</h1><p>明堂四門，諸侯來朝，穆穆然皆有威儀。</p><p>舜納于百揆，百揆時敘；賓于四門，四門穆穆。百揆敘，則庶事理；四門穆穆，則遠人至。四門者，明堂之四門也；穆穆者，威儀之美也。聖人在上，則萬邦惟和，諸侯來朝，肅肅雍雍，不肅而成也。</p><p><strong>所出</strong>：《尚書 · 舜典》 — https://zh.wikisource.org/wiki/尚書/舜典</p></article></main></div></div>
