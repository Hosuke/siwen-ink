    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 厭不能自聽</nav></header><main><article><h1>厭不能自聽</h1><p>掩耳盜鍾，自欺以害己，君主蔽過亦然。</p><p>范氏之亡也，百姓有得鍾者，欲負而走，則鍾大不可負，以椎毀之，鍾況然有音，恐人聞之而奪己也，遽揜其耳。惡人聞之可也，惡己自聞之悖矣。</p><p>為人主而惡聞其過，非猶此也？惡人聞其過尚猶可，惡己自聞之，不亦悖乎！ [[察見淵魚者不祥]]，[[自知]]之謂也。人不能自知，必有旁人之聞以正之；掩耳閉目，適增其弊而已。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十四》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十四</p></article></main></div></div>
