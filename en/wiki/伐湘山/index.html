    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 伐湘山</nav></header><main><article><h1>伐湘山</h1><p>秦始皇渡江至湘山祠，遇風不得渡，怒使刑徒伐湘山樹而赭之。</p><p>始皇還，過彭城，齋戒禱祠，欲出周鼎泗水。使千人沒水求之，弗得。乃西南渡淮水，之衡山、南郡。浮江，至湘山祠。逢大風，幾不得渡。上問博士曰：「湘君神？」博士對曰：「聞之，堯女，舜之妻，而葬此。」</p><p>於是始皇大怒，使刑徒三千人皆伐湘山樹，赭其山。上自南郡由武關歸。</p><p><strong>所出</strong>：《史記 · 卷006》 — https://zh.wikisource.org/wiki/史記/卷006</p></article></main></div></div>
