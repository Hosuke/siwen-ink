    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 秦繆公食馬徧飲</nav></header><main><article><h1>秦繆公食馬徧飲</h1><p>繆公以食馬徧飲之恩，收野人之力，卒救韓原之敗。</p><p>昔者秦繆公乘馬而車為敗，右服失而埜人取之。見埜人方將食之於岐山之陽，繆公歎曰：「食駿馬之肉而不還飲酒者傷人，余恐其傷女也！」於是徧飲而去。處一年，為韓原之戰，晉人已環繆公之車矣，嘗食馬肉者三百有餘人，畢力為繆公疾鬭於車下，遂大克晉，反獲惠公以歸。</p><p><strong>所出</strong>：《呂氏春秋 · 卷八》 — https://zh.wikisource.org/wiki/呂氏春秋/卷八</p></article></main></div></div>
