    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 反本</nav></header><main><article><h1>反本</h1><p>求王當反求其本，不在於兵力而在於仁政</p><p>孟子見梁襄王而出，語人曰：「望之不似人君，就之而不見所畏焉。」終以天下定於一，言歸之之道在於仁政。又見齊宣王，以為欲圖霸王，當反本而行仁政，不可以兵力求之。求大欲而不得，反本則天下可定。</p><p><strong>所出</strong>：《孟子 · 梁惠王上》 — https://zh.wikisource.org/wiki/孟子/梁惠王上</p></article></main></div></div>
