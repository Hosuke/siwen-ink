    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 高祖祠公子</nav></header><main><article><h1>高祖祠公子</h1><p>劉邦微時即聞公子賢，即位後過大梁必祠之，使五家守冢。</p><p>高祖始微少時，數聞公子賢。及即天子位，每過大梁，常祠公子。高祖十二年，從擊黥布還，為公子置守冢五家，世世歲以四時奉祠公子。</p><p><strong>所出</strong>：《史記 · 卷077》 — https://zh.wikisource.org/wiki/史記/卷077</p></article></main></div></div>
