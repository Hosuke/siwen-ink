    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 孔子為高昭子家臣</nav></header><main><article><h1>孔子為高昭子家臣</h1><p>孔子赴齊為高昭子家臣以通景公。</p><p>孔子適齊，為高昭子家臣，欲以通乎景公。蓋聖人欲得位以行道，雖居下僚而不廢其志也。</p><p><strong>所出</strong>：《史記 · 卷047》 — https://zh.wikisource.org/wiki/史記/卷047</p></article></main></div></div>
