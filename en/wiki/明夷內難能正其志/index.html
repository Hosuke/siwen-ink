    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 明夷內難能正其志</nav></header><main><article><h1>明夷內難能正其志</h1><p>明入地中，內文明而外柔順，晦其明以蒙難，正志不失。</p><p>明入地中，明夷。內文明而外柔順，以蒙大難，文王以之。利艱貞，晦其明也，內難而能正其志，箕子以之。</p><p>明夷之世，明入地中，幽暗時也。內文明者，明不可息也；外柔順者，晦以全身。箕子晦明守正，此其所以利貞也。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷04》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷04</p></article></main></div></div>
