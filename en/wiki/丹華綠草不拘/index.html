    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 丹華綠草不拘</nav></header><main><article><h1>丹華綠草不拘</h1><p>真正之才，不困於地；盛德之士，不限於時。</p><p>丹華綠草，不拘於曲瘁之株；紫芝芳秀，不限於斥鹵之壤。抱朴子借此以言人才之自振也。凡有真實之美材，不待沃土而后秀，不賴良境而後成。是以受玄珪以告成者，生於四罪之門；承歷數於文祖者，出於頑嚚之家。蓋本源既正，則末流自清；根柢既深，則枝葉自茂。庸流惑於外貌，見其困悴而忽其內美，豈知夫蘭生空谷不以無人而自改其芬邪？</p><p><strong>所出</strong>：《抱朴子 · 卷38》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷38</p></article></main></div></div>
