    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 比樂師憂</nav></header><main><article><h1>比樂師憂</h1><p>親比則樂，興師則憂，人事之喜懼，國運之盛衰也。</p><p>比者，地水之象，地上水下，水土相親，比之義也。比則無嫌隙，故樂。師者，坤之初交乎乾，師出之象，興眾以伐罪也。師者存亡之道，故憂。</p><p>《小象》曰「比之初六，有他吉也」，言親比之道在先也。《師》卦「丈人吉，无咎」，言師旅之要在得人也。比與師對言之，見治亂相循之理——比而能和，則樂；不和而致師，則憂。是以聖王之世，比而不比則兆民心攜，師出不祥；及乎末世，比道不立，干戈日尋矣。</p><p><strong>所出</strong>：《周易 · 雜卦》 — https://zh.wikisource.org/wiki/易傳/雜卦</p></article></main></div></div>
