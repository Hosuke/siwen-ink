    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 恒產恆心</nav></header><main><article><h1>恒產恆心</h1><p></p><p>孟子告齊宣王：「無恆產而有恆心者，惟士為能。若民，則無恆產，因無恆心。苟無恆心，放辟邪侈，無不為已。」明君制民之產，必使仰足以事父母，俯足以畜妻子；樂歲終身飽，凶年免於死亡。然後驅而之善，民之從之也輕。若仰不足以事父母，俯不足以畜妻子，樂歲終身苦，凶年不免於死亡，此惟救死而恐不贍，奚暇治禮義哉？</p><p><strong>所出</strong>：《孟子 · 梁惠王上》 — https://zh.wikisource.org/wiki/孟子/梁惠王上</p></article></main></div></div>
