    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 朽木不可雕</nav></header><main><article><h1>朽木不可雕</h1><p>以朽木糞牆喻人無可造就也。</p><p>《史記》述宰予晝寢事，孔子曰：「朽木不可雕也，糞土之牆不可圬也。」</p><p>宰予從孔子受業，而問三年之喪太久。孔子既以為不仁，宰予又晝間睡眠，不勤於學。孔子是以深責之，謂其材之敗壞，不可復加雕飾。</p><p>後世用「朽木不可雕」喻人之才質朽敗，不可教化。亦省言「朽木」。</p><p><strong>所出</strong>：《史記 · 卷六七》 — https://zh.wikisource.org/wiki/史記/卷067</p></article></main></div></div>
