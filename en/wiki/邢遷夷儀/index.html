    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 邢遷夷儀</nav></header><main><article><h1>邢遷夷儀</h1><p>邢國遭狄難，遷于夷儀，諸侯城之。</p><p>齊師、宋師、曹伯次于聶北，救邢。邢人潰，出奔師。師遂逐狄人，具邢器用而遷之，師無私焉。夏，邢遷于夷儀。諸侯城之，救患也。凡侯伯，救患、分災、討罪，禮也。邢遷如歸，衛國忘亡，諸侯之於患難相恤如此，亦見霸王之輔翼小國也。</p><p><strong>所出</strong>：《春秋左氏傳 · 僖公》 — https://zh.wikisource.org/wiki/春秋左氏傳/僖公</p></article></main></div></div>
