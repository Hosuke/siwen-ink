    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 刑于寡妻</nav></header><main><article><h1>刑于寡妻</h1><p>以德行範圍家室，由妻而至兄弟，推而至於家邦，齊家治國之要道也。</p><p>《思齊》次章云「刑于寡妻，至于兄弟，以御于家邦」。寡妻，文王之嫡配大姒也。刑者，法也、範也。言文王以德行示範於嫡妻，推及兄弟，由是及於家國。</p><p>此明齊家之道：身教為先，上行下效，自近以及遠。《大學》雲「其家不可教而能教人者，無之」，正此義也。</p><p><strong>所出</strong>：《詩經 · 思齊》 — https://zh.wikisource.org/wiki/詩經/思齊</p></article></main></div></div>
