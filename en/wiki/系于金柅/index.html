    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 系于金柅</nav></header><main><article><h1>系于金柅</h1><p>初六爻辭，戒陰柔之物不可輕動，牽而止之乃吉。</p><p>「初六：系于金柅，貞吉，有攸往，見凶，羸豕孚踟躅。」</p><p>金柅，銅制之制動也。車行而有柅止之，使不妄動。初六陰柔在下，始有浸長之勢，若繫而止之，守正以防，則吉。苟輕有往來，則必見凶。譬如羸弱之豕，躁動不安，當戒其踟躅也。</p><p>象曰「柔道牽也」，言柔道當有所牽制，不可縱其浸長。此聖人防微杜漸之意，戒之於始也。</p><p><strong>所出</strong>：《周易 · 姤》 — https://zh.wikisource.org/wiki/周易/姤</p></article></main></div></div>
