    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 遷生龍門</nav></header><main><article><h1>遷生龍門</h1><p>司馬遷生於龍門，耕牧河山之陽，年十歲誦古文。</p><p>遷生龍門，耕牧河山之陽。年十歲則誦古文。二十而南游江、淮，上會稽，探禹穴，闚九疑，浮於沅、湘；北涉汶、泗，講業齊、魯之都，觀孔子之遺風，鄉射鄒、嶧；戹困鄱、薛、彭城，過梁、楚以歸。於是遷仕為郎中，奉使西征巴、蜀以南，南略邛、笮、昆明，還報命。</p><p><strong>所出</strong>：《史記 · 卷130》 — https://zh.wikisource.org/wiki/史記/卷130</p></article></main></div></div>
