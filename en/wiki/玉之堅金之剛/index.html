    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 玉之堅金之剛</nav></header><main><article><h1>玉之堅金之剛</h1><p>玉堅金剛，冰冷火熱，不待自言而後明；喻真才不假自炫。</p><p>玄泊先生云：「夫<strong>玉之堅也，金之剛也，冰之冷也，火之熱也，豈須自言，然後明哉</strong>！」言真才异能，譬如玉石金火，其質自著，不待稱說而後知；淺近者不然，徒以言論自炫，反見輕於當世。</p><p><strong>所出</strong>：《抱朴子 · 卷51》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷51</p></article></main></div></div>
