    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 大人寄形於天地</nav></header><main><article><h1>大人寄形於天地</h1><p>聖人與天地合德，萬物備於我，國家富於山海。</p><p>故大人寄形於天地而萬物備，歴心於山海而國家富。</p><p>大人者，與天地合其德，與日月合其明，與四時合其序者也。[[萬物皆備於我|萬物皆備於我]]，此之謂也。[[大人與天地合德|大人與天地合德]]，則至治可成。</p><p><strong>所出</strong>：《韓非子 · 大體》 — https://zh.wikisource.org/wiki/韓非子/大體</p></article></main></div></div>
