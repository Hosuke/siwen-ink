    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 桑俱鳳</nav></header><main><article><h1>桑俱鳳</h1><p>白鹿洞隱者，狂率不羈，化去莫測。</p><p>白鹿洞隱者姓桑名俱鳳，自稱進士，闐茸性器，不近人情。寄闐州紫極宮，買堵腸充饌，脫布衫裸露酣寤，冰霜切骨，眾大駭。謁南平王，一足草履一足麻鞋，自號野人。言《左傳》藻摔轉棒乃以棗安盤揮而食之。節度使遣虞候褫之出界，至星子潭，遂踴身騰空而去。後多在北地，題膀雲「廬山白鹿洞鄉貢進士桑俱鳳」，竟莫知其所止。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 44》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/44</p></article></main></div></div>
