    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 恃鬼神者慢於法</nav></header><main><article><h1>恃鬼神者慢於法</h1><p></p><p>本篇以趙、燕交兵之事明之：趙、燕皆以龜筴卜吉凶，兆同而後果殊。趙嘗以北伐之兆「大吉」出兵，而秦出上黨拔六城、秦拔鄴，兵至釐而六城拔、至陽城而龐援南救無功。燕以「大吉」伐趙，而趙先得意於燕、齊，地削兵辱。龜筴之兆無常，而秦以法得地，趙以卜失國。是故越王勾踐恃龜與吳戰而不勝，及弃龜明法而遂擒吳。故恃鬼神者慢於法，恃諸侯者危其國。</p><p>  <strong>所出</strong>：《韓非子 · 飾邪》 — https://zh.wikisource.org/wiki/韓非子/飾邪</p></article></main></div></div>
