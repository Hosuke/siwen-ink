    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 三人行，必有我師焉</nav></header><main><article><h1>三人行，必有我師焉</h1><p>君子善於取法。</p><p>[[孔子]]言[[三人行必有我師]]焉。[[擇其善者而從之]]，[[其不善者而改之]]。善者之可從，不善者之可戒，皆[[聖人]]取善之方也。此[[學者]]無[[棄人之善]]之義，故[[三人行]]皆有[[我師]]。</p><p><strong>所出</strong>：《論語 · 述而第七》 — https://zh.wikisource.org/wiki/論語/述而第七</p></article></main></div></div>
