    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 斵削於繩之内</nav></header><main><article><h1>斵削於繩之内</h1><p>裁斷事物當在法度之內，不可越軌。</p><p>斵削者，木工之事也。必循繩墨之正，方可成器；治國亦然，必在[[法所以為國|法度之內]]裁斷賞罰，方為安術。反是而[[斷割於法之外]]，則賞濫刑暴，是為[[危道有六]]之一。人之趨於危亡，往往始於守法之微，終至犯法之大。[[賞罰隨是非]]者，正此斵削於繩之内之意也。</p><p><strong>所出</strong>：《韓非子 · 安危》 — https://zh.wikisource.org/wiki/韓非子/安危</p></article></main></div></div>
