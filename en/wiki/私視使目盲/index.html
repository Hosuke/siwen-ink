    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 私視使目盲</nav></header><main><article><h1>私視使目盲</h1><p>私心蔽明，公正乃喪。</p><p>私視使目盲，私聽使耳聾，私慮使心狂。三者皆私設，精則智無由公。智不公，則福日衰，災日隆。</p><p>是故上揆之天，下驗之地，中審之人，若此則是非可不可無所遁矣。天曰順，順維生；地曰固，固維寧；人曰信，信維聽。三者咸當，無為而行。</p><p>黃帝之所以誨顓頊者，蓋聞古之清世，是法天地。大圜在上，大矩在下，汝能法之，為民父母。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十二》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十二</p></article></main></div></div>
