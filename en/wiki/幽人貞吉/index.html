    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 幽人貞吉</nav></header><main><article><h1>幽人貞吉</h1><p>隱居守正，不以外動，是得吉也。</p><p>九二：幽人貞吉。</p><p>幽人，隱居不仕、抱道自守之人。居中不亂，守正以俟時，故[[幽人貞吉]]。非遺世之謂，乃中不自亂，坦然履道之象。</p><p><strong>所出</strong>：《周易 · 履》 — https://zh.wikisource.org/wiki/周易/履</p></article></main></div></div>
