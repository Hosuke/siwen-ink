    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 物其多矣，維其嘉矣</nav></header><main><article><h1>物其多矣，維其嘉矣</h1><p>物之盛者，必有其美。</p><p>物其多矣，維其嘉矣。</p><p>言物既充溢而繁多，則其美善亦隨之而著也。多而不嘉，徒繁無益；嘉而不多，未足示盛。物既充盛，則美善形於其間矣。此與下文「物其旨矣維其偕」「物其有矣維其時」相承，皆言物盛則德全，理之所固然也。</p><p><strong>所出</strong>：《詩經 · 魚麗》 — https://zh.wikisource.org/wiki/詩經/魚麗</p></article></main></div></div>
