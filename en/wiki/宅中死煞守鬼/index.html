    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 宅中死煞守鬼</nav></header><main><article><h1>宅中死煞守鬼</h1><p>宅中死煞守鬼，常住堂屋梁上</p><p>[[女青鬼律]]所記宅中死煞守鬼有天正鬼迭臥、地正鬼枔木。經云：「右二鬼是宅中死煞守鬼，常住人堂屋梁上，夜主傷害人雞犬六畜。子知其名，鬼伏住不敢動。此鬼不敢害人，宅中應有福德之家，此鬼主護人外客殃煞，不敢過宅中。」</p><p>此鬼常住堂屋梁上，夜主傷害人及六畜。然知其名，鬼不敢害人。若宅有福德，此鬼反主護人外客殃煞，不敢過宅中。</p><p>是鬼之善惡，亦視人之德行。</p><p><strong>所出</strong>：《女青鬼律 · 卷4》 — https://zh.wikisource.org/wiki/女青鬼律/卷4</p></article></main></div></div>
