    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 其儀一兮</nav></header><main><article><h1>其儀一兮</h1><p>君子威儀貴乎專一，表裏如一，始能正己正人。</p><p>[[詩經]]·[[詩經/鳲鳩|鳲鳩]]以鳲鳩起興。鳲鳩之於桑，食桑之實，育其七子，專心無二。詩人借以諷刺曹國在位之臣用心不壹，而勉以「淑人君子，其儀一兮」。儀者，威儀也。威儀發乎外，而本於心；心不專則儀必失其次。及其儀既一，則心如結兮，不可解也。外無乖異之舉，內有貞固之操，内外兼備，表裏如一。君子苟能如此，則不特自治，亦可以正人、正國、正天下矣。</p><p><strong>所出</strong>：《詩經 · 鳲鳩》 — https://zh.wikisource.org/wiki/詩經/鳲鳩</p></article></main></div></div>
