    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 天地之大義</nav></header><main><article><h1>天地之大義</h1><p>歸妹乃天地相交之義，天地不交則萬物不興，歸妹實人之終始。</p><p>彖傳曰：「歸妹，天地之大義也。天地不交，而萬物不興，歸妹人之終始也。」男女構精，實稟天地之交。天地不交，則氣化不行、萬物不生；歸妹者，人道之始，故曰人之終始。說以動，所歸妹也，此所以涉險之義也。</p><p><strong>所出</strong>：《周易 · 歸妹》 — https://zh.wikisource.org/wiki/周易/歸妹</p></article></main></div></div>
