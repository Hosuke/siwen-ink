    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 荒墜厥緒，覆宗絕祀</nav></header><main><article><h1>荒墜厥緒，覆宗絕祀</h1><p>荒墜祖緒，覆滅宗祀。</p><p>祖宗之緒，荒墜而絕，則宗族覆滅，祭祀不存。此[[五子之歌]]所述，以戒後嗣不可荒怠先業也。</p><p><strong>所出</strong>：《尚書 · 五子之歌》 — https://zh.wikisource.org/wiki/尚書/五子之歌</p></article></main></div></div>
