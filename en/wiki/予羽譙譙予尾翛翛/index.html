    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 予羽譙譙予尾翛翛</nav></header><main><article><h1>予羽譙譙予尾翛翛</h1><p>羽殘尾敝，喻己之疲憊困悴。</p><p>「予羽譙譙，予尾翛翛」，出《詩經·鴟鴞》第四章。言己之羽翼譙譙然傷敝，尾翛翛然凋脫，以喻己之疲憊困悴、無復往日之盛也。譙譙者，傷敗之貌；翛翛者，稀疏乾枯之貌。</p><p>此以羽尾之凋傷，比己身之困悴，辭危而意悲。</p><p><strong>所出</strong>：《詩經 · 鴟鴞》 — https://zh.wikisource.org/wiki/詩經/鴟鴞</p></article></main></div></div>
