    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 衣錦褧衣</nav></header><main><article><h1>衣錦褧衣</h1><p>衣錦尚絅，惡文太章，貴乎反本。華美之文，亦當以質樸斂之，乃得文質彬彬之妙。</p><p>聯辭結采，將欲明理；采濫辭詭，則心理愈翳。翠綸桂餌，反所以失魚；言隱榮華，殆謂此也。是以「衣錦褧衣」，惡文太章，賁象窮白，貴乎反本。夫能設以位理，擬地以置心，心定而後結音，理正而後摛藻，使文不滅質，博不溺心，正采耀乎朱藍，間色屏於紅紫，乃可謂雕琢其章，彬彬君子矣。蓋文采之用，貴在適度；繁而有節，華而能斂，斯為至善。</p><p><strong>所出</strong>：《文心雕龍 · 情采》 — https://zh.wikisource.org/wiki/文心雕龍/情采</p></article></main></div></div>
