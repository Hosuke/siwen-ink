    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 桑田滄海</nav></header><main><article><h1>桑田滄海</h1><p>滄海三為桑田，示世變之無常</p><p>麻姑自云：「接侍已來，見東海三為桑田，向到蓬萊，水又淺於往者，會時略半也，豈將復還為陵陸乎？」王方平笑曰：「聖人皆言海中行復揚塵也。」</p><p><strong>所出</strong>：《墉城集仙錄 · 卷04》 — https://zh.wikisource.org/wiki/墉城集仙錄/卷04</p></article></main></div></div>
