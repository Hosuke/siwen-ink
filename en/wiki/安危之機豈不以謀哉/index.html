    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 安危之機豈不以謀哉</nav></header><main><article><h1>安危之機豈不以謀哉</h1><p>安危之際，終賴主父偃之謀以弱諸侯，則知謀之為用大矣。</p><p>太史公曰：「及主父偃言之，而諸侯以弱，卒以安。安危之機，豈不以謀哉？」</p><p>言七國之亂雖定，然終以主父偃推恩之策漸削諸侯之力，天下乃安。可見安危成敗之分，不在力征而在智謀。</p><p><strong>所出</strong>：《史記 · 卷011》 — https://zh.wikisource.org/wiki/史記/卷011</p></article></main></div></div>
