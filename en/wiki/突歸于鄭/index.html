    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 突歸于鄭</nav></header><main><article><h1>突歸于鄭</h1><p>鄭厲公篡位歸國，公羊傳以為忽讓位之義。</p><p>桓公十一年，「突歸于鄭」。突者，鄭厲公也。[[祭仲知權]]從宋人之請，出世子忽而立突。及後突歸，正其位焉。公羊傳以為此乃行權之效，忽以生易死、國以存易亡，非篡也。</p><p><strong>所出</strong>：《春秋公羊傳 · 桓公》 — https://zh.wikisource.org/wiki/春秋公羊傳/桓公</p></article></main></div></div>
