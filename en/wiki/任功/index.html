    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 任功</nav></header><main><article><h1>任功</h1><p>授官賞爵必以功，則民知勸而姦不起。</p><p>韓非論授官之道，云「授官爵、出利禄不以功，是無當也」，又云「國以功授官與爵，此謂以成智謀，以威勇戰，其國無敵」。是以明主治國，必以功定爵，以勞受賞。官非功授，則倖門開而賢路塞；禄非功得，則姦人進而良士退。任功者，民知所趨，爭立功效；任善者，民尚空言，競為浮說。此治亂之分也。</p><p><strong>所出</strong>：《韓非子 · 飭令》 — https://zh.wikisource.org/wiki/韓非子/飭令</p></article></main></div></div>
