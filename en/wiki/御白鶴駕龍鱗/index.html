    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 御白鶴駕龍鱗</nav></header><main><article><h1>御白鶴駕龍鱗</h1><p>真人超昇，御鶴龍以遊太虛，謁仙君而錄天圖。</p><p>「御白鶴，駕龍鱗，游太虛，謁仙君，錄天圖，號[[真人]]」者，金丹成就，神遊[[太虛]]，上謁仙真，此[[真人過焉]]之境界也。與「[[真人潛深淵]]」「[[至人無己]]」諸義相足。</p><p><strong>所出</strong>：《周易參同契 · 33章》 — https://zh.wikisource.org/wiki/周易參同契/33章</p></article></main></div></div>
