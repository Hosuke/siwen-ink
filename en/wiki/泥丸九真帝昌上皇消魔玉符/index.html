    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 泥丸九真帝昌上皇消魔玉符</nav></header><main><article><h1>泥丸九真帝昌上皇消魔玉符</h1><p>大洞存思法之玉符，佩之可以固塞死門、拔度七玄。</p><p>泥丸九真帝昌上皇消魔玉符者，上清大洞真經第十一章末所載玉符也。以青書赤繣佩之，存呼[[帝昌上皇]] 內諱名字，[[皇清洞真道君|皇清洞真道君]]即來鎮我口之四際死炁之門，為我固塞死門。</p><p>其效驗：九孔受靈，反胎三天，上升帝庭，[[七祖]]免難，更受始生。行持之法：叩齒九通，咽液九過。</p><p><strong>所出</strong>：《上清大洞真經 · 11章》 — https://zh.wikisource.org/wiki/上清大洞真經/11章</p></article></main></div></div>
