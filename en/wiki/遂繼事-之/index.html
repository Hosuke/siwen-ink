    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 遂繼事-之</nav></header><main><article><h1>遂繼事-之</h1><p></p><p>楚子、鄭人侵陳遂侵宋，遂，繼事也。入陳之師既有所成，復加兵於宋，是其事相因而後者可見也。</p><p>  <strong>所出</strong>：《春秋穀梁傳 · 宣公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/宣公</p></article></main></div></div>
