    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 函掩其跡</nav></header><main><article><h1>函掩其跡</h1><p>君當掩飾形跡，絕臣窺探之望</p><p>函掩其跡，匿其端，下不能原；去其智，絶其能，下不能意。保吾所以往而稽同之，謹執其柄而固握之。絶其望，破其意，毋使人欲之。</p><p><strong>所出</strong>：《韓非子 · 主道》 — https://zh.wikisource.org/wiki/韓非子/主道</p></article></main></div></div>
