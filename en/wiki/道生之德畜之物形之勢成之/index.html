    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 道生之德畜之物形之勢成之</nav></header><main><article><h1>道生之德畜之物形之勢成之</h1><p>述道、德、物、勢四者化育萬物之序。</p><p>道生物以始，德畜之以成。物以形貌著，勢以趨向成。萬物之生，莫不稟此四者之功，故莫不尊道而貴德焉。</p><p>夫道之尊、德之貴，非有待於命也，自然而然耳。是以道常生物，德常畜物，匪止生物已也，又從而長之育之，亭之毒之，蓋之覆之，終始相養而無已。</p><p>及其成也，生之而不以為己有，為之而不恃其功，長之而不宰制之。是之謂玄德，德之至者也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 五十一章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
