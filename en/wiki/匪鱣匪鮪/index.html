    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 匪鱣匪鮪</nav></header><main><article><h1>匪鱣匪鮪</h1><p>潛逃深淵，以喻賢者之明哲保身。</p><p>匪鱣匪鮪，濳逃于淵。</p><p>「鱣」，鱘也。「鮪」，鱘之小者，皆大魚也。詩言非為大鱣大鮪，則當潛逃深淵以自全。接上[[翰飛戾天]]之義，上句言鳥之欲高翔者，此句言魚之不得志者，賢者於濁世，非進即退，退而藏身，亦所以全身遠害也。</p><p><strong>所出</strong>：《詩經 · 四月》 — https://zh.wikisource.org/wiki/詩經/四月</p></article></main></div></div>
