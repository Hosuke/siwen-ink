    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 五者亡天下</nav></header><main><article><h1>五者亡天下</h1><p>五事過度，任何其一皆足以覆亡天下；當務節儉，歸本舍末。</p><p>夫聲色五味，遠國珍怪，瑰異奇物，足以變心易志，搖盪精神，感動血氣者，不可勝計也。夫天地之生財也，本不過五。聖人節五行，則治不荒。</p><p>本立而道行，本傷而道廢。今背其本而求其末，釋其要而索之於詳，未可與言至也。</p><p><strong>所出</strong>：《淮南子 · 本經訓》 — https://zh.wikisource.org/wiki/淮南子/本經訓</p></article></main></div></div>
