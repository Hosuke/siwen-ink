    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 化身度人</nav></header><main><article><h1>化身度人</h1><p>真人時降人間，化度有緣，出入隱顯，不可測識。</p><p>呂嵓自雲：「沖昇之後，時降人間，化度有綠。」真人成道之後，非隱居不出，乃時出世間，應機接物，遊戲人間，以其神通智慧，度有緣之輩。或隱或顯，莫可測識，或朝遊北嶽而暮蒼梧，或三過岳陽而人不識。此道家所謂化身度人之旨，非尸解之徒可比也。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 45》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/45</p></article></main></div></div>
