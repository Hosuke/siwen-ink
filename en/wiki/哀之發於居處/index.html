    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 哀之發於居處</nav></header><main><article><h1>哀之發於居處</h1><p>居喪居處，視喪服之差而異其倚廬、屋堽、寢席之制。</p><p>居喪之居處，視服之輕重以為節。父母之喪，居倚廬，寢苫枕塊，不說絰帶。倚廬者，於中庭倚木為廬也；苫者，編草覆地以為席也；塊者，土塊也。不說絰帶者，終喪不去也。齊衰之喪，屋堽室，翦翦不納，蓋屋之使受日光者翦之使平正也。大功之喪，寢有席。小功緦麻，床可也。此哀之發於居處者也。</p><p><strong>所出</strong>：《禮記 · 間傳》 — https://zh.wikisource.org/wiki/禮記/間傳</p></article></main></div></div>
