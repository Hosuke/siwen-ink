    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 王者之制</nav></header><main><article><h1>王者之制</h1><p>道不過三代，法不二後王；衣服有制，宮室有度，人徒有數，喪祭械用皆有等宜。</p><p>王者之制：道不過三代，法不二後王；道過三代謂之蕩，法二後王謂之不雅。衣服有制，宮室有度，人徒有數，喪祭械用皆有等宜。聲、則非雅聲者舉廢，色、則凡非舊文者舉息，械用，則凡非舊器者舉毀，夫是之謂復古，是王者之制也。</p><p><strong>所出</strong>：《荀子 · 王制篇》 — https://zh.wikisource.org/wiki/荀子/王制篇</p></article></main></div></div>
