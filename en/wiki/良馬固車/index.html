    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 良馬固車</nav></header><main><article><h1>良馬固車</h1><p>良馬固車，善御則日取千里，不善御則為人笑；治國亦然，善用勢則治，不善用則亂。</p><p>[[韓非]]以良馬固車為喻：臧獲御之則為人笑，王良御之則日取千里。車馬非異也，或至千里，或為人笑，巧拙相去遠矣。以國位為車、以勢為馬、以號令為轡、以刑罰為鞭筴，使堯舜御之則天下治，桀紂御之則天下亂，賢不肖相去遠矣。欲追速致遠，不知任王良；欲進利除害，不知任賢能，此則不知類之患也。</p><p><strong>所出</strong>：《韓非子 · 難勢》 — https://zh.wikisource.org/wiki/韓非子/難勢</p></article></main></div></div>
