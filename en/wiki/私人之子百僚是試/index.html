    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 私人之子，百僚是試</nav></header><main><article><h1>私人之子，百僚是試</h1><p>私家子弟，試用於百官之位</p><p>私人，私家之臣也。百僚，百官也。言私家臣子之子弟，皆得試用於百官之位。而東人子弟，則職勞不來，不蒙獎拔。以此見周家用人之私，亦東人之所以怨也。</p><p><strong>所出</strong>：《詩經 · 大東》 — https://zh.wikisource.org/wiki/詩經/大東</p></article></main></div></div>
