    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 國人宜之</nav></header><main><article><h1>國人宜之</h1><p>國人皆以為宜。言其德足以洽民心也。</p><p>宜，猶當也、合也。《緇衣》序云「國人宜之」，言其德之在己者善，故為國人所宜也。</p><p>夫在上者苟善於其職，則民必宜之。宜之云者，非私譽也，實至公之論也。武公父子並為司徒，善於其職，故國人宜之如此。《詩》之興也，在此。</p><p><strong>所出</strong>：《詩經 · 緇衣》 — https://zh.wikisource.org/wiki/詩經/緇衣</p></article></main></div></div>
