    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 絕知棄辯</nav></header><main><article><h1>絕知棄辯</h1><p>絕去智辯，民得大利。</p><p>絕聖棄智，民利百倍。</p><p>言絕去知識與辯說，民乃得其利，百倍於前也。智辯興則機心起，機心起則民擾攘。絕之則返於素樸，而利溥矣。</p><p>蓋有知則有恃，有辯則有爭。老氏以絕為用，以棄為得。絕知者，非真無知也，去其知之累耳；棄辯者，非無言也，去其辯之妄耳。民利百倍者，言其效也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第六十三章 樸素》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
