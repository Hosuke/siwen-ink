    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 夢怪不及覺</nav></header><main><article><h1>夢怪不及覺</h1><p>夢中之怪猶不及覺時所見，有耳目手臂者，其怪更甚。</p><p>汝見蛇首人身者，牛臂魚鱗者，鬼形禽翼者，汝勿怪，此怪不及夢，夢怪不及覺，有耳有目有手有臂，怪尤矣。大言不能言，大智不能思。</p><p><strong>所出</strong>：《關尹子 · 6》 — https://zh.wikisource.org/wiki/關尹子/6</p></article></main></div></div>
