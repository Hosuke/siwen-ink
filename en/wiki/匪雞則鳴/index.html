    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 匪雞則鳴</nav></header><main><article><h1>匪雞則鳴</h1><p>借蒼蠅之聲以辭朝會，耽逸忘返之喻也。</p><p>「匪雞則鳴，蒼蠅之聲」，此詩第二章之答辭也。妃以為晨光已動，當速赴朝；君乃借口曰：「非雞之鳴，乃蒼蠅之聲耳。」</p><p>推其意也，非不知東方之明，特以耽戀枕席，不欲即起。蒼蠅之聲狀其幽夢未醒，與夫「月出之光」之辭，皆飾詞也。然月出之光，東方未明之象也；蒼蠅之聲，晨興稍早之候也。臣不欲行則有辭，君不欲起亦有辭，此人情之常，而詩人之善言也。</p><p>後世以「匪雞則鳴」為耽逸忘返之典，蓋取諸此。</p><p><strong>所出</strong>：《詩經 · 雞鳴》 — https://zh.wikisource.org/wiki/詩經/雞鳴</p></article></main></div></div>
