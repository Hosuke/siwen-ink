    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 歲藏三分</nav></header><main><article><h1>歲藏三分</h1><p>國用歲儲三分，十年必有五年之餘。</p><p>又有 [[山至數]] 云：「粟之三分在上，謂民萌皆受上粟，度君藏焉。」言豐歲之時，以粟三分在君、七分在下民也。又[[分大夫]] 云「是藏一分以致諸侯之一分」，是藏於民者一分，致諸侯者亦一分，其餘皆在君。歲藏三分，循而行之，二歲則四分在上，一歲則三分在君。以此藏輕出輕以重，[[守穀]] 之要在斯。</p><p>  <strong>所出</strong>：《管子 · 第76篇山至數》 — https://zh.wikisource.org/wiki/管子/第76篇山至數</p></article></main></div></div>
