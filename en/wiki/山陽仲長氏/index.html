    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 山陽仲長氏</nav></header><main><article><h1>山陽仲長氏</h1><p>《尹文子》之編定者，姓名無考。</p><p>山陽仲長氏者，《尹文子》之編定者也。其郡望曰山陽，其姓曰仲長，然名字皆不可考。</p><p>當黃初本始之際，至京師，得繆熙伯以此書見示，「意甚玩之，而多說誤」，遂從事[[上下篇]]之撰定，條次篇目，使書之分合有倫。</p><p>仲長氏自言編次之志在於整理篇次，非敢妄事刪潤。然其人、他事皆亡，可考者僅此一篇之功而已。</p><p><strong>所出</strong>：《尹文子 · 序》 — https://zh.wikisource.org/wiki/尹文子/序</p></article></main></div></div>
