    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 胃脘二真</nav></header><main><article><h1>胃脘二真</h1><p>守胃腑二神，使死炁滅絕、中元充盈之要法也。</p><p>胃為太倉，屬土德，稟中元之炁。胃脘二真，即[[二真堅玉君]]，常守兆胃腑五腸之口死炁之門。存思此神，則[[三尸]]滅絕，黃庭香潔，帝皇之光上衝泥丸，骨節通泰。其法以[[真思]]碧雲之色罩頂，默呪通神，咽津納炁，結作二神，青衣冠而下布太倉五腸之口，面相向立，順時吐息。</p><p><strong>所出</strong>：《上清大洞真經 · 18章》 — https://zh.wikisource.org/wiki/上清大洞真經/18章</p></article></main></div></div>
