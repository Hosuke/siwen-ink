    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 三宅三俊</nav></header><main><article><h1>三宅三俊</h1><p>夏商二代用人之法，宅之俊之，各因其材也。</p><p>三宅三俊，夏商二代用人之法也。湯循此道，「三有宅，克即宅」；又「三有俊，克即俊」。言宅之俊之者，審度人才而官使之也。周公述成湯之德曰「嚴惟丕式，克用三宅三俊」，以明宅俊之效，至於「其在商邑，用協于厥邑；其在四方，用丕式見德」，而天下治矣。</p><p><strong>所出</strong>：《尚書 · 立政》 — https://zh.wikisource.org/wiki/尚書/立政</p></article></main></div></div>
