    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 自伐無功</nav></header><main><article><h1>自伐無功</h1><p>自稱其功者，功無由成。喻矜伐者悖於道。</p><p>伐，聲張而自述也。自伐者，矜伐其功，亟欲見於世。殊不知功之成者在於不自伐惟歸之於天。今自伐而亟欲見功，是以功無功也。老子-{zh-cn:之;zh-tw:之;}教人[[功成不處]]，[[不自矜故長]]，正此之謂。</p><p><strong>所出</strong>：《道德經 (王弼本) · 二十四章》 — https://zh.wikisource.org/wiki/道德經_(王弼本)</p></article></main></div></div>
