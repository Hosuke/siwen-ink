    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 言有事宗</nav></header><main><article><h1>言有事宗</h1><p>言之所言各有主宰，事之所務各有根本。</p><p>言有君，事有宗。</p><p>言之發也，必有所主。事之為也，必有所宗。夫言非虛發，事非妄作。言之君者，樞機也，發而萬方觀焉；事之宗者，綱紀也，振而羣目舉焉。</p><p>言失其所主，則支離而無歸；事失其所宗，則汗漫而莫整。是以君子言必有事，言有事則言不妄；事必有事宗，有事宗則事不亂。言與事相待，而君宗互明，此聖人觀物之要也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第三十五章 懷玉》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
