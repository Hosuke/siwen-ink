    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 精想思之</nav></header><main><article><h1>精想思之</h1><p>精舍既除，精將自來；又想又思，漸入於定。</p><p>文：精也者，氣之精者也。敬除其舍，精將自來。精想思之，寧念治之。嚴容畏敬，精將至定。得之而勿捨，耳目不淫，心無他圖。正心在中，萬物得度。道滿天下，普在民所，民不能知也。思索生知，慢易生憂，暴傲生怨，憂鬱生疾，疾困乃死。思之思之，又重思之。思之而不通，鬼神將通之。非鬼神之力也，精氣之極也。</p><p><strong>所出</strong>：《管子 · 第49篇內業》 — https://zh.wikisource.org/wiki/管子/第49篇內業</p></article></main></div></div>
