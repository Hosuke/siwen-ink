    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 男女之別國之大節</nav></header><main><article><h1>男女之別國之大節</h1><p>夫婦之贄各有定物，男玉帛禽鳥，女棗栗告虔，不可混用。</p><p>哀姜至，公使大夫、宗婦覿用幣。宗人夏父展曰：「非故也。」公曰：「君作故。」對曰：「君作而順則故之，逆則亦書其逆也。夫婦贄不過棗、栗，以告虔也；男則玉、帛、禽、鳥，以章物也。今婦執幣，是男女無別也。男女之別，國之大節也，不可無也。」公弗聽。</p><p><strong>所出</strong>：《國語 · 卷04》 — https://zh.wikisource.org/wiki/國語/卷04</p></article></main></div></div>
