    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 法與時轉</nav></header><main><article><h1>法與時轉</h1><p>法與時轉則治，治與世宜則有功；禁與能變乃可不削。</p><p>治民無常，唯治為治。法與時轉則治，治與世宜則有功。故民樸而禁之以名則治，世知維之以刑則從。時移而治不易者亂，能眾而禁不變者削。</p><p>故聖人之治民也，法與時移而禁與能變。</p><p><strong>所出</strong>：《韓非子 · 心度》 — https://zh.wikisource.org/wiki/韓非子/心度</p></article></main></div></div>
