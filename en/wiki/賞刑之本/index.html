    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 賞刑之本</nav></header><main><article><h1>賞刑之本</h1><p>賞繁亂本，刑勝治首；聖人先用刑而輔以賞。</p><p>聖人治民，度於本，不從其欲，期於利民而已。故其與之刑，非所以惡民，愛之本也。刑勝而民靜，賞繁而姦生。故治民者，刑勝，治之首也；賞繁，亂之本也。</p><p>夫民之性，喜其亂而不親其法。故明主之治國也，明賞則民勸功，嚴刑則民親法；勸功則公事不犯，親法則姦無所萌。能用四者強，不能用四者弱。</p><p><strong>所出</strong>：《韓非子 · 心度》 — https://zh.wikisource.org/wiki/韓非子/心度</p></article></main></div></div>
