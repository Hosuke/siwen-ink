    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 不如我同父</nav></header><main><article><h1>不如我同父</h1><p>言同父之親，勝於途人之情。</p><p>「不如我同父」，出自《詩經·杕杜》。言天下之人雖多，豈無他人？然皆不如同父之兄弟為親。蓋兄弟同氣，共出父母，患難相扶持，非途人可比。詩人見棄於世，而思同父之親以為援也。</p><p><strong>所出</strong>：《詩經 · 杕杜》 — https://zh.wikisource.org/wiki/詩經/杕杜</p></article></main></div></div>
