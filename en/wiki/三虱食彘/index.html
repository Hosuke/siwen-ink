    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 三虱食彘</nav></header><main><article><h1>三虱食彘</h1><p>聚而爭利者，不知大患之將至；苟安目前，必有後患。</p><p>三虱相與訴訟，一虱過之，曰：「訴訟者奚說？」三虱曰：「爭肥饒之地。」一虱曰：「若亦不患臘之至而茅之燥耳，若又奚患於是？」乃相與聚嘬其母而食之。彘臞，人乃弗殺。</p><p><strong>所出</strong>：《韓非子 · 說林下》 — https://zh.wikisource.org/wiki/韓非子/說林下</p></article></main></div></div>
