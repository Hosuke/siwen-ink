    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 三五合一</nav></header><main><article><h1>三五合一</h1><p>木三火二土五，三物會合，共宗於戊己之土。</p><p>水以土為鬼，土鎮水不起。朱雀為火精，執平調勝負。水盛火消滅，俱死歸厚土。三性即合會，本性共祖宗。</p><p>「三五」者，木三、火二、土五也。震木、離火、坤土，三物會合，共宗戊己之土。「三性」者，木性、火性、土性也。三物既合，則金水自從，而還丹之本立。巨勝尚延年，還丹可入口。金性不敗朽，故為萬物寶。術士伏食之，壽命得長久。</p><p><strong>所出</strong>：《周易參同契 · 11章》 — https://zh.wikisource.org/wiki/周易參同契/11章</p></article></main></div></div>
