    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 無射於人斯</nav></header><main><article><h1>無射於人斯</h1><p>德澤在人，萬民承奉，終古不厭也。</p><p>「無射於人斯」，[[詩經]]之句也。射，厭也。言文王之德既顯且承，萬民承受其福，終古而無厭射之心也。此[[不顯不承]]之旨，見[[清廟]]之詩以文王之德澤萬世為終焉。</p><p><strong>所出</strong>：《詩經 · 清廟》 — https://zh.wikisource.org/wiki/詩經/清廟</p></article></main></div></div>
