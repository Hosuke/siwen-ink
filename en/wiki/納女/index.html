    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 納女</nav></header><main><article><h1>納女</h1><p>納女之禮，尊卑有差，各有名數。</p><p>納女於天子曰「備百姓」，於國君曰「備酒漿」，於大夫曰「備埽灑」。</p><p>[[納女]]者，諸侯或大夫以女進御於上也。天子為天下父母，納女曰「備百姓」，言廣[[子姓]]以為國本也。國君次之，曰「備酒漿」，言供粢盛酒醴之事也。大夫又次之，曰「備埽灑」，言供[[掃灑]]之役使也。名數遞降，等威之辨，毫釐不爽。</p><p><strong>所出</strong>：《禮記 · 曲禮下》 — https://zh.wikisource.org/wiki/禮記/曲禮下</p></article></main></div></div>
