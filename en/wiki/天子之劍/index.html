    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 天子之劍</nav></header><main><article><h1>天子之劍</h1><p>以天下為劍，上決浮雲，下絕地紀。</p><p>莊子論劍之分別，以天子之劍為至高。</p><p>其劍以燕谿石城為鋒，齊岱為鍔，晉衞為脊，周宋為鐔，韓魏為夾；包以四夷，裹以四時；繞以渤海，帶以常山；制以五行，論以刑德；開以陰陽，持以春夏，行以秋冬。</p><p>此劍「直之无前，舉之无上，案之无下，運之无旁，上決浮雲，下絕地紀」。一用，匡諸侯，天下服矣。</p><p>蓋以天子之劍喻治國之道，取天地四方之物為劍之部位，刑德為用，陰陽為開闔，道法自然，而天下歸往。</p><p><strong>所出</strong>：《莊子 · 說劍》 — https://zh.wikisource.org/wiki/莊子/說劍</p></article></main></div></div>
