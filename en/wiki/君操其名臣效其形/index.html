    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 君操其名臣效其形</nav></header><main><article><h1>君操其名臣效其形</h1><p>君主執名以馭，臣下循形以效，形名相符則上下調和。</p><p>君臣不同道，下以名禱。君操其名，臣效其形，形名參同，上下和調也。夫形名者，治國之具也。名者，號令也；形者，事功也。君設名以待臣，臣循名以成事。名定則事成，名倚則事徙。形名參同，賞罰乃信；形名乖離，姦偽乃生。明主操此以馭臣，臣下各效其形，不敢欺也。</p><p><strong>所出</strong>：《韓非子 · 揚權》 — https://zh.wikisource.org/wiki/韓非子/揚權</p></article></main></div></div>
