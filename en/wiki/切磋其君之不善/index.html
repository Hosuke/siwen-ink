    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 入則切磋其君之不善，出則高譽其君之德義</nav></header><main><article><h1>入則切磋其君之不善，出則高譽其君之德義</h1><p>善臣之法，於內盡規諫之忠，於外弘君德之譽。</p><p>入則切磋其君之不善，出則高譽其君之德義。</p><p>切磋者，切摩循繹，務令君知過失而改之；高譽者，播宣流布，使天下知君之德義。內不蔽其過，外不失其美，此善臣之所以為國楨榦也。晏子以仲尼之語稱之，許以為「古之善為人臣者」。</p><p><strong>所出</strong>：《晏子春秋 · 卷二》 — https://zh.wikisource.org/wiki/晏子春秋/卷二</p></article></main></div></div>
