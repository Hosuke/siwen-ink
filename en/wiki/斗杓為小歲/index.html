    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 斗杓為小歲，太歲為咸池</nav></header><main><article><h1>斗杓為小歲，太歲為咸池</h1><p>斗杓主小歲，太歲即咸池，各有所行。</p><p>斗杓為小歲，正月建寅，月從左行十二辰。咸池為太歲，二月建卯，月從右行四仲，終而復始。太歲迎者辱，背者強，左者衰，右者昌，小歲東南則生，西北則殺，不可迎也，而可背也，不可左也，而可右也，其此之謂也。大時者，咸池也；小時者，月建也。</p><p><strong>所出</strong>：《淮南子 · 天文訓》 — https://zh.wikisource.org/wiki/淮南子/天文訓</p></article></main></div></div>
