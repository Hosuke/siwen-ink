    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 衡與挈引</nav></header><main><article><h1>衡與挈引</h1><p>《墨</p><p>《墨子·經說下》論衡與挈引之理，闡述槓桿、滑車之機械原理。衡木如重焉而不撓，極勝重也。衡之要在於「權重相若」，本短標長則標下，此機械利益之要義也。</p><p>挈與引有別：挈有力，引無力。挈長重者下，短輕者上。繩直權重相若，則正矣。收者，上者愈喪，下者愈得。此論述滑車組之原理，繩之引軲，猶自舟中引橫，倚、倍、拒、堅，各有其用。</p><p>更有車梯之制：兩輪高為輲，重其前弦，縣重於前，是梯挈且挈則行。此乃早期機械裝置之記載，見墨家重實用之學風。</p></article></main></div></div>
