    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 百姓有過在予一人</nav></header><main><article><h1>百姓有過在予一人</h1><p>君王自任百姓之過，不以責民。</p><p>百姓有過，在予一人。言百姓若有過愆，皆由君王一人承當之也。民之得失安危，繫於君德。百姓有罪，是君失德所致；百姓有過，是君未能教化之故。君王當自任己過，不可歸咎於民。此儒家「民本」之義、「父母官」觀念之濫觴也。</p><p><strong>所出</strong>：《尚書 · 泰誓中》 — https://zh.wikisource.org/wiki/尚書/泰誓中</p></article></main></div></div>
