    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 齊奏四方之樂</nav></header><main><article><h1>齊奏四方之樂</h1><p>夾谷會中齊國奏夷狄之樂，孔子斥之。</p><p>會齊侯夾谷，為壇位，土階三等，以會遇之禮相見，揖讓而登。獻酬之禮畢，齊有司趨而進曰：「請奏四方之樂。」景公曰：「諾。」於是旍旄羽袚矛戟劍撥鼓噪而至。孔子趨而進，歷階而登，不盡一等，舉袂而言曰：「吾兩君為好會，夷狄之樂何為於此！請命有司！」此孔子斥齊國以夷狄之樂也。</p><p><strong>所出</strong>：《史記 · 卷047》 — https://zh.wikisource.org/wiki/史記/卷047</p></article></main></div></div>
