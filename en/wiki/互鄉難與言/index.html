    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 互鄉難與言</nav></header><main><article><h1>互鄉難與言</h1><p>聖人教人取其進。</p><p>[[互鄉]]之人難與言，[[童子]]見之，門人惑。[[孔子]]曰：「與其進也，不與其退也。[[人潔己以進，與其潔也，不保其往也]]。」[[聖人]][[有教無類]]之心，取[[童子]]之[[進善]]，不執其前愆也。</p><p><strong>所出</strong>：《論語 · 述而第七》 — https://zh.wikisource.org/wiki/論語/述而第七</p></article></main></div></div>
