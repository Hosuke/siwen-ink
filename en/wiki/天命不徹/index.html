    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 天命不徹</nav></header><main><article><h1>天命不徹</h1><p>天命失常，不可效尤，當守正而不從俗</p><p>末章云「悠悠我里，亦孔之痗。四方有羨，我獨居憂。民莫不逸，我獨不敢休。天命不徹，我不敢傚我友自逸」，詩人自傷孤立，以天命之失其常道，故不敢效法他人之逸。[[幽王之失德]]之世，賢者以天命不徹而自勉於正，不以俗眾之安逸而改其守。此[[下民之孽匪降自天]]之義，而歸本於天命之說也。</p><p><strong>所出</strong>：《詩經 · 十月之交》 — https://zh.wikisource.org/wiki/詩經/十月之交</p></article></main></div></div>
