    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 物壯即老</nav></header><main><article><h1>物壯即老</h1><p>物至壯盛，必趨衰朽，不道者速亡。</p><p>物壯則老，壯者，非真強也，乃盛極將衰之象。譬如弓力既盡，弦急必絕；如火勢既極，灰燼隨之。老子戒之曰「謂之不道」，是壯非道所貴，强梁者不得其死之漸也。</p><p>「不道早已」，言不道之人，死將及之，無延緩之理。與[[物極則反]]之義相發明。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第十八章 含德》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
