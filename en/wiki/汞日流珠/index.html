    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 汞日流珠</nav></header><main><article><h1>汞日流珠</h1><p>汞之流行如日之光，如珠之走盤，難制而貴斂。</p><p>汞之性流動不定如日之照曜無已時，故曰汞日。珠之圓轉易走，故曰流珠。</p><p>丹法以[[青龍]]之汞合[[白虎熬樞]]之金氣，[[青龍與之俱]]而行，青龍主升而汞性善走，白虎主降而金氣善斂，二者相須以成丹。[[火計]]所謂「汞日為流珠」者，正言汞性飄忽、難制難收，非得[[偃月法]]之火候不能收斂歸鼎也。</p><p><strong>所出</strong>：《周易參同契 · 09章》 — https://zh.wikisource.org/wiki/周易參同契/09章</p></article></main></div></div>
