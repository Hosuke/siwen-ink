    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 井谷射鮒</nav></header><main><article><h1>井谷射鮒</h1><p>井如谷中射鮒，泉下流而不上汲，喻無與之援。</p><p>九二之辭曰：「井谷射鮒，瓮敝漏。」井谷者，井底之穴也；射鮒者，水下流而射小魚也。井水當上行以養人，今乃下流而射鮒，是失其職也。瓮敝漏者，汲器已破，水無由上。夫九二陽爻居下，上无應援，如井谷之射鮒，泉潤下流而不上汲也。《象》曰「井谷射鮒，无與也」，言九二陽剛而無九五之援，才雖可用而位不當，功無由成也。</p><p><strong>所出</strong>：《周易 · 井》 — https://zh.wikisource.org/wiki/周易/井</p></article></main></div></div>
