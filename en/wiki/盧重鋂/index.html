    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 盧重鋂</nav></header><main><article><h1>盧重鋂</h1><p>獵犬一環貫二鐶，比人之多才多藝也。</p><p>「盧重鋂」，犬以一環貫二鐶也。[[盧重環]]為二環相屬，此則一環貫二，制又有加。詩以犬之三重飾起興，喻獵者才藝愈盛，見君子才德層層增益之象。</p><p><strong>所出</strong>：《詩經 · 盧令》 — https://zh.wikisource.org/wiki/詩經/盧令</p></article></main></div></div>
