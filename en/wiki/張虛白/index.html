    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 張虛白</nav></header><main><article><h1>張虛白</h1><p></p><p>張虛白字致祥，鄧州南陽人。隸道士籍於太一宮。身長六尺，美鬚髯。性靜重，通太一六壬術。留心丹竈，遇異人得妙诀，自言前身乃武陵張白先生。虛白亦善飲。宋徽宗知其道行過人，每召見，必飲數斗，雖醉益恭。上愛之，俾管轄龍德太一宮。金人犯闕，聞其名，搜訪甚急。得之，肩輿至南薰門，諸番爭肩輿以行，悉以神仙事之。居龍德太一宮凡十年，非宣召不出。官至太虛大夫沖和殿侍宸金門羽客。出入禁中，以玉牌為號。侍宸之名九人，虛白其一也。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 51》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/51</p></article></main></div></div>
