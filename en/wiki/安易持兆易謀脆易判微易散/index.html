    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 物易持易謀易判易散</nav></header><main><article><h1>物易持易謀易判易散</h1><p>未兆易謀，未形易持，脆微易散</p><p>治身治國，貴乎豫防。情欲禍患未有形兆，聖人察於卵，遏之於萌芽，則用力寡而成功多。</p><p>欲有所為，當於未有言之。[[為之於未有]]之事，[[慎終如始]]之戒，皆此義之推也。</p><p>脆者易破，[[思患豫防]]之未至，微者易散，[[慎終如始]]之志不勤，其理一也。</p><p><strong>所出</strong>：《老子河上公章句 · 守微》 — https://zh.wikisource.org/wiki/老子河上公章句/德經
===</p><hr></article></main></div></div>
