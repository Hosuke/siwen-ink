    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 橘</nav></header><main><article><h1>橘</h1><p>屈原託橘以喻志，明人之立身當深固難徙、獨立不遷。</p><p>《橘頌》全篇以橘為喻：「后皇嘉樹，橘徠服兮。受命不遷，生南國兮。深固難徙，更壹志兮。」又云：「蘇世獨立，橫而不流兮。閉心自慎，不終失過兮。秉德無私，參天地兮。」屈原以橘生於南國而不可移植，喻己受命於君、志節堅定不可搖奪；其德行端直、無私無偏，可與天地相參。觀橘之綠葉素榮、精色內白、表裏如一，亦以喻君子表裏一致之德。</p><p><strong>所出</strong>：《楚辭 · 九章》 — https://zh.wikisource.org/wiki/楚辭/九章</p></article></main></div></div>
