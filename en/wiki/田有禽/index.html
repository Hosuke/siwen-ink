    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 田有禽</nav></header><main><article><h1>田有禽</h1><p>田有禽而利執言，師有名而無咎；用人當審。</p><p>六五田有禽，利執言，无咎。此言我有詞執，而彼自來犯，猶田獵之有禽也。師有名之師，故无咎。然長子帥師則吉，弟子輿尸則貞凶。用人之際，不可不審。象曰：「長子帥師，以中行也。弟子輿尸，使不當也。」</p><p><strong>所出</strong>：《周易 · 師》 — https://zh.wikisource.org/wiki/周易/師</p></article></main></div></div>
