    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 用之不已形不滯</nav></header><main><article><h1>用之不已形不滯</h1><p>久久行之，形體通暢無礙。</p><p>用之不已者，行持此法，終身不廢。形不滯者，形體通暢，無病痛之礙。肺主氣，氣行則身無阻滯。經云「用之不已形不滯」，言久久行之於存思肺神，呼吸調暢，則形體康健，無疾病之苦也。</p><p><strong>所出</strong>：《黃庭內景經 · 肺部章第九》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/肺部章第九</p></article></main></div></div>
