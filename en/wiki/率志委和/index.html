    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 率志委和</nav></header><main><article><h1>率志委和</h1><p>循心志自然之和，以暢文情。</p><p>率志委和，則理融而情暢；鑽礪過分，則神疲而氣衰。蓋文之作也，本乎心志。心志暢達，則文理通融，情意舒暢；若強思苦索，過用其神，則精神疲憊，氣力衰減，不可久持。劉勰援引王充《養氣》之篇，明此理非虛造，乃驗之於己者。是以古人為文，貴在順其自然，不事勉強，使心志與天地之和氣相接，文思乃滔滔不竭。</p><p><strong>所出</strong>：《文心雕龍 · 養氣》 — https://zh.wikisource.org/wiki/文心雕龍/養氣</p></article></main></div></div>
