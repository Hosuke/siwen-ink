    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 虎傅翼</nav></header><main><article><h1>虎傅翼</h1><p>乘不肖人以勢，是為虎傅翼，暴亂之事成矣。</p><p>《周書》曰：「毋為虎傅翼，將飛入邑，擇人而食之。」[[韓非]]以為，乘不肖人於勢，是為虎傅翼也。桀紂高臺深池以盡民力、為炮烙以傷民性，得成肆行者，南面之威為之翼耳。使桀紂為匹夫，未始行一而身在刑戮矣。勢者，養虎狼之心而成暴亂之事者也，此天下之大患也。</p><p><strong>所出</strong>：《韓非子 · 難勢》 — https://zh.wikisource.org/wiki/韓非子/難勢</p></article></main></div></div>
