    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 天道福善禍淫</nav></header><main><article><h1>天道福善禍淫</h1><p>天之行罰，善者福之，淫者禍之。</p><p>天道福善禍淫，降災于夏，以彰厥罪。夏王滅德作威，以敷虐于萬方百姓，天乃以災罰之，明報施之道也。</p><p><strong>所出</strong>：《尚書 · 湯誥》 — https://zh.wikisource.org/wiki/尚書/湯誥</p></article></main></div></div>
