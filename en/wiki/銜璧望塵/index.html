    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 銜璧望塵</nav></header><main><article><h1>銜璧望塵</h1><p>望塵而銜璧，喻見高明者而自慚形穢，不暇酬對。</p><p>抱朴子述玄泊先生云：「道靡遠而不究，言無微而不測，以儒墨為城池，以機神為干戈，故<strong>談者莫不望塵而銜璧，文士寅目而格筆</strong>。」言才高德邵，見者皆自失而不敢與爭辯也。</p><p><strong>所出</strong>：《抱朴子 · 卷51》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷51</p></article></main></div></div>
