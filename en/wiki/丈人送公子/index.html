    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 丈人送公子</nav></header><main><article><h1>丈人送公子</h1><p>為人之易者，或有其難在其後。</p><p>荆令公子將伐陳。丈人送之曰：「晉彊，不可不慎也。」公子曰：「丈人奚憂？吾為丈人破晉。」丈人曰：「可。吾方廬陳南門之外。」公子曰：「是何也？」曰：「我笑勾踐也。為人之如是其易也，己獨何為密密十年難乎？」</p><p><strong>所出</strong>：《韓非子 · 說林下》 — https://zh.wikisource.org/wiki/韓非子/說林下</p></article></main></div></div>
