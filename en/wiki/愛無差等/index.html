    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 愛無差等</nav></header><main><article><h1>愛無差等</h1><p>墨者夷之謂愛人無等級之別，施由親始</p><p>墨者夷之因徐辟求見孟子，謂儒者之道「若保赤子」，愛無差等，施由親始。孟子非之，謂愛親兄之子與愛鄰人之赤子，本非同例；天之生物使之一本，而夷子二本故也。</p><p><strong>所出</strong>：《孟子 · 滕文公上》 — https://zh.wikisource.org/wiki/孟子/滕文公上</p></article></main></div></div>
