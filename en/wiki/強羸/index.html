    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 強羸</nav></header><main><article><h1>強羸</h1><p>強大羸弱相待而成</p><p>[[強羸]]者，強弱之對也。河上公注「或強或羸」云：「有所強大，必有所羸弱。」物之壯者必有衰之者，壯弱相傾，強羸迭用，天之道也。聖人無為，強者不驕，弱者不懼，各安其分。</p><p><strong>所出</strong>：《老子河上公章句 · 無為》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
