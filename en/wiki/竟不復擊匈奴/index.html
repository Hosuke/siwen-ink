    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 竟不復擊匈奴</nav></header><main><article><h1>竟不復擊匈奴</h1><p>衞青自圍單于後十四年不復擊匈奴，以漢馬少而方南誅兩越、東伐朝鲜。</p><p>自大將軍圍單于之後，十四年而卒。竟不復擊匈奴者，以漢馬少，而方南誅兩越，東伐朝鲜，擊羌、西南夷，以故久不伐胡。</p><p><strong>所出</strong>：《史記 · 卷111》 — https://zh.wikisource.org/wiki/史記/卷111</p></article></main></div></div>
