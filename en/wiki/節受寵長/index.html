    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 節受寵長</nav></header><main><article><h1>節受寵長</h1><p>晏子以節受於上者寵長、儉居於處者名廣，釋辭邑之義。</p><p>景公賜晏子邑，晏子辭。田桓子問何以不受，晏子對曰：「嬰聞之，節受於上者，寵長於君；儉居於處者，名廣於外。夫長寵廣名，君子之事也，嬰獨庸能已乎？」</p><p>節者，廉之本也；儉者，禮之實也。節而上之者以其恭，儉而居之者以其遜，此所以寵日長而名日廣也。</p><p><strong>所出</strong>：《晏子春秋 · 卷六》 — https://zh.wikisource.org/wiki/晏子春秋/卷六</p></article></main></div></div>
