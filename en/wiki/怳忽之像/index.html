    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 怳忽之像</nav></header><main><article><h1>怳忽之像</h1><p>怳忽之中有像有物，非空無也</p><p>忽兮怳兮其中有像，怳兮忽兮其中有物。[[道之為物]]既是怳忽無形，然怳中有像，像者道之影也；忽中有物，物者道之實也。譬如深淵之水，無形而中有魚；虛室之空，無色而中有光。此言道雖[[道弘大無形]]，而實能生物生像，非頑空枯寂之說。[[有生於無]]之義，於此益明。</p><p><strong>所出</strong>：《老子河上公章句 · 虛心》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
