    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 宣房宮</nav></header><main><article><h1>宣房宮</h1><p>塞瓠子決後所建之宮，以紀塞河之功，附有二渠復禹舊跡。</p><p>宣房宮者，天子塞瓠子決河後所築之宮也。《史記》載：「於是卒塞瓠子，筑宮其上，名曰宣房宮。」時天子臨河決，悼功之不成，使汲仁、郭昌發卒數萬人塞之，沈白馬玉璧於河，群臣從官皆負薪窴決河。功成，乃作歌以紀，並築宮於決口之上，額曰宣房。宮成，道河北行二渠，復禹舊跡，梁楚之地遂無水災。後世言水利者，必稱宣房，以其為塞河成功之標誌也。</p><p><strong>所出</strong>：《史記 · 卷029》 — https://zh.wikisource.org/wiki/史記/卷029</p></article></main></div></div>
