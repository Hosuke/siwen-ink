    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 百兩</nav></header><main><article><h1>百兩</h1><p>詩經語，謂車輛之眾，示昏禮之盛。</p><p>《鵲巢》言「百兩御之」「百兩將之」「百兩成之」。</p><p>「百」者虛數，狀其多也；「兩」即車輛。百兩者，夫人家之車也，非國君之車。毛詩、鄭注皆以為此乃夫人之家陪送之車。</p><p>「御之」者，毛詩、鄭註解為迎接，魯詩解為侍奉。三家詩說文理，王先謙以魯詩「侍」義為暢。三章之「御」「將」「成」，展轉見意：由迎之、送到之、終成昏禮，一氣貫通，而百兩之盛，正見夫人德配君子之尊。</p><p><strong>所出</strong>：《詩經 · 鵲巢》 — https://zh.wikisource.org/wiki/詩經/鵲巢</p></article></main></div></div>
