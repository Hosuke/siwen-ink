    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 周鼎著饕餮</nav></header><main><article><h1>周鼎著饕餮</h1><p>周鼎著饕餮，有首無身，食人未咽，害及其身，以言報更。</p><p>周鼎著饕餮，有首無身，食人未咽，害及其身，以言報更也。為不善亦然。白圭之中山，中山之王欲留之，白圭固辭，乘輿而去。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十六》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十六</p></article></main></div></div>
