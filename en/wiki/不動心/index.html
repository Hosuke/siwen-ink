    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 不動心</nav></header><main><article><h1>不動心</h1><p>孟子四十不動心，告子先之。其要在持其志而勿暴其氣。</p><p>公孫丑問不動心之故。孟子曰：「否，我四十不動心。」又引告子曰：「不得於言，勿求於心；不得於心，勿求於氣。」孟子斷之曰：「夫志，氣之帥也；氣，體之充也。夫志至焉，氣次焉。故曰：持其志，無暴其氣。」又言：「志壹則動氣；氣壹則動志也。」</p><p><strong>所出</strong>：《孟子 · 公孫丑上》 — https://zh.wikisource.org/wiki/孟子/公孫丑上</p></article></main></div></div>
