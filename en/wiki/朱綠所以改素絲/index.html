    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 朱綠所以改素絲</nav></header><main><article><h1>朱綠所以改素絲</h1><p>教誨可以改變稟性，如朱綠施於素絲。</p><p>《抱朴子》以為人稟受有深淺，遲解晚覺者非不可成，特患不學耳。故曰：「故朱綠所以改素絲，訓誨所以移蒙蔽。披玄雲而揚大明，則萬物無所隱其狀矣。」</p><p>又曰：「況乎含五常而稟最靈者哉！」言人之稟受既美，加之以教誨，其效必速。是故[[低仰之駟]]之於良馬，[[鷙擊之禽]]之於凡禽，教之功也。</p><p><strong>所出</strong>：《抱朴子 · 卷03》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷03</p></article></main></div></div>
