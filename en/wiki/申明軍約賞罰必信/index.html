    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 申明軍約賞罰必信</nav></header><main><article><h1>申明軍約賞罰必信</h1><p>晉用咎犯、吳用孫武，申明軍約，賞罰必信，故能卒伯諸侯。</p><p>自是之後，名士迭興，晉用咎犯，吳用孫武，申明軍約，賞罰必信，卒伯諸侯，兼列邦土。</p><p>咎犯、孫武皆兵家之名將。軍約既定，賞罰必信，則令行禁止，三軍效命。此霸王之兵所以強也。</p><p><strong>所出</strong>：《史記 · 卷025》 — https://zh.wikisource.org/wiki/史記/卷025</p></article></main></div></div>
