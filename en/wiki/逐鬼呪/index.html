    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 逐鬼呪</nav></header><main><article><h1>逐鬼呪</h1><p>逐鬼出宅之呪語</p><p>[[女青鬼律]]所記逐鬼呪有二。</p><p>一為逐蠶鬼之呪，立春日平旦向天門三呪，呪以天之皇清明，長遠上多神，令馬姑來宅中，使蠶大得千萬倍，收千億斛，役使精華以殺百傷小魅。</p><p>一為逐掃鬼之呪，日日平旦向天門三呼金進名，呪曰：「石未子，石未子，太一使汝為我使，何物逆鬼，令速出、速出。」</p><p>呪之要，在以天真正氣斥退邪鬼，使其速出不得停留。</p><p><strong>所出</strong>：《女青鬼律 · 卷4》 — https://zh.wikisource.org/wiki/女青鬼律/卷4</p></article></main></div></div>
