    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 姹女黃芽</nav></header><main><article><h1>姹女黃芽</h1><p>汞以鉛制，乃得凝定</p><p>姹女黃芽者，[[河上姹女]]之別名，[[黃芽為根]]之旨趣，亦內丹家之要語也。姹女象汞，黃芽象鉛，以鉛制汞，乃得凝定，是煉丹之樞機也。本章以姹女喻汞之飛動難制，黃芽為根則言制伏之法，所謂「將欲制之，黃芽為根」者是已。</p><p><strong>所出</strong>：《周易參同契 · 26章》 — https://zh.wikisource.org/wiki/周易參同契/26章</p></article></main></div></div>
