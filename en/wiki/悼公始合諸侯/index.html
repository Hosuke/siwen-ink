    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 悼公始合諸侯</nav></header><main><article><h1>悼公始合諸侯</h1><p>始合諸侯，修好結援，復霸中原。</p><p>始合諸侯于虛朾以救宋，使張老延君譽于四方，且觀道逆者。呂宣子卒，公以趙文子為文也，而能恤大事，使佐新軍。三年，公始合諸侯。四年，諸侯會于雞丘，於是乎布命、結援、修好、申盟而還。令狐文子卒，公以魏絳為不犯，使佐新軍。使張老為司馬，使范獻子為候奄。公譽達于戎。五年，諸戎來請服，使魏莊子盟之，於是乎遂伯。</p><p><strong>所出</strong>：《國語 · 卷13》 — https://zh.wikisource.org/wiki/國語/卷13</p></article></main></div></div>
