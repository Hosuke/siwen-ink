    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 鼎湖</nav></header><main><article><h1>鼎湖</h1><p>黃帝鑄鼎荊山，龍垂胡髯下迎，後世因名其處曰鼎湖。</p><p>公孫卿得鼎書，申功曰：「黃帝郊雍上帝，宿三月。黃帝采首山銅，鑄鼎荊山下。鼎既成，有龍垂胡髯下迎黃帝。黃帝上騎，群臣後宮從上龍七十餘人，乃上去。百姓仰望黃帝既上天，乃抱其弓與龍胡髯號。故後世因名其處曰鼎湖，其弓曰烏號。」</p><p><strong>所出</strong>：《史記 · 卷012》 — https://zh.wikisource.org/wiki/史記/卷012</p></article></main></div></div>
