    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 不畏風濕</nav></header><main><article><h1>不畏風濕</h1><p>述道士山居不畏風濕之藥方。</p><p>道士山居棲岩庇岫，不必有絪縟之溫，直使我不畏風濕，敢問其術也？抱朴子曰：金餅散、三陽液、昌辛丸、葷草耐冬煎、獨搖膏、茵芋玄華散、秋地黃血丸，皆不過五十日服之而止，可以十年不畏風濕。若服金丹大藥，雖未昇虛輕舉，然體不受疾，雖當風臥濕不能傷也。服此七藥，皆謂始學道者耳。</p><p>姚先生但服三陽液便袒臥冰上了不寒振。此皆介先生及梁有道臥石上及秋冬當風寒已試有驗，秘法也。</p><p><strong>所出</strong>：《抱朴子 · 卷17》 — https://zh.wikisource.org/wiki/抱朴子/卷17</p></article></main></div></div>
