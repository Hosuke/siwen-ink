    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 天不發其陰陽</nav></header><main><article><h1>天不發其陰陽</h1><p>天發陰則萬物生，地發陽則萬物成。</p><p>是故天不發其陰，則萬物不生；地不發其陽，則萬物不成。天圓地方，道在中央。日為德，月為刑。月歸而萬物死，日至而萬物生。</p><p><strong>所出</strong>：《淮南子 · 天文訓》 — https://zh.wikisource.org/wiki/淮南子/天文訓</p></article></main></div></div>
