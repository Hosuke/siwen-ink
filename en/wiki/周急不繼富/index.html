    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 周急不繼富</nav></header><main><article><h1>周急不繼富</h1><p>君子周濟當急而非當富</p><p>子華使於齊，冉子為其母請粟，孔子與之釜；請益，與之庾；冉子乃與之粟五秉。孔子聞之，曰：「赤之適齊也，乘肥馬，衣輕裘。吾聞之也：君子周急不繼富。」蓋救人於急，君子之義也；繼人於富，非義之所當為也。</p><p><strong>所出</strong>：《論語 · 雍也第六》 — https://zh.wikisource.org/wiki/論語/雍也第六</p></article></main></div></div>
