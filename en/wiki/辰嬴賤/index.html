    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 辰嬴賤</nav></header><main><article><h1>辰嬴賤</h1><p>趙盾論立公子雍之善，以辰嬴賤、班在九人為據，與賈季異見。</p><p>晉襄公卒。靈公少，晉人以難故，欲立長君。趙孟曰：「立公子雍。好善而長，先君愛之，且近於秦。秦舊好也。」賈季曰：「不如立公子樂。辰嬴嬖於二君，立其子，民必安之。」趙孟曰：「辰嬴賤，班在九人，其子何震之有？且為二嬖，淫也。為先君子，不能求大，而出在小國，辟也。母淫子辟，無威；陳小而遠，無援。將何安焉？」</p><p><strong>所出</strong>：《春秋左氏傳 · 文公》 — https://zh.wikisource.org/wiki/春秋左氏傳/文公</p></article></main></div></div>
