    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 蠶月條桑</nav></header><main><article><h1>蠶月條桑</h1><p>養蠶之月，修整桑枝也。</p><p>[[授衣]]既竟，[[七月流火]]退而歲功將畢，[[四月秀葽]][[五月鳴蜩]]，其[[八月其獲]]，[[十月隕蘀]]，以至於[[授衣]]，一歲之功循是以成。蠶月條桑，取彼斧斨，以伐遠揚，猗彼女桑，此[[授衣]]之候也。</p><p><strong>所出</strong>：《詩經 · 七月》 — https://zh.wikisource.org/wiki/詩經/七月</p></article></main></div></div>
