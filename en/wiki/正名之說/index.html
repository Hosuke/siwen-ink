    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 正名之說</nav></header><main><article><h1>正名之說</h1><p>本文阐述墨子《经说下</p><p>《墨子·經說下》正名之說，立命名之準則。蓋「彼彼此此可，彼此止於彼，此此止於此」，名與實當一一對應，不可混淆。彼此不可者，彼且此也，言名實相亂之弊。</p><p>同與異之分，是邏輯之要務。同名者，或謂之狗，其或謂之犬，是一名而二所指也。異名者，或謂之牛，牛或謂之馬，是二名而各有當也。俱無勝，是不辯也。辯也者，或謂之是，或謂之非，當者勝也。</p><p>又有指之論：子智是，有智是吾所無舉，重。則子智是而不智吾所無舉，是一。謂有智焉，有不智焉也。此論知識之確認，如何知所指與能指相符，乃墨家認識論之要義。</p></article></main></div></div>
