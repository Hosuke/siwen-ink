    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 水可扼而使東西南北</nav></header><main><article><h1>水可扼而使東西南北</h1><p>水性就下可扼，高其上領則水自能行，可以東西定向。</p><p>桓公問水可扼而使東西南北及高乎，管仲對曰：「可。夫水之性，以高走下則疾，至於𣿖石。而下向高，即留而不行，故高其上領瓴之，尺有十分之三，里滿四十九者，水可走也。乃迂其道而遠之，以勢行之。」言水性雖險，只要得地形之宜，因勢利導，則可使之東西南北，此治水之要術也。</p><p><strong>所出</strong>：《管子 · 第57篇度地》 — https://zh.wikisource.org/wiki/管子/第57篇度地</p></article></main></div></div>
