    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 賞加於無功</nav></header><main><article><h1>賞加於無功</h1><p>賞賜不加於有功之人，反加於無功。</p><p>賞賜，所以為重也，而戰鬬有功之士貧賤，而便辟優徒超級。</p><p>凡上之所以治者，刑罰也，今有私行義者尊。社稷之所以立者，安靜也，而躁險讒諛者任。四封之内所以聽從者，信與德也，而陂知傾覆者使。</p><p>令之所以行，威之所以立者，恭儉聽上也，而巖居非世者顯。倉廪之所以實者，耕農之本務也，而-{綦}-組、錦繡、刻畫為末作者富。</p><p><strong>所出</strong>：《韓非子 · 詭使》 — https://zh.wikisource.org/wiki/韓非子/詭使</p></article></main></div></div>
