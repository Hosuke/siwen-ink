    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 一治一亂</nav></header><main><article><h1>一治一亂</h1><p>天下之亂，治亂相循，如環無端。</p><p>天下之生久矣，一治一亂。當堯之時，水逆行，蛇龍居之。堯舜既沒，聖人之道衰，暴君代作。及紂之身，天下又大亂。周公相武王，誅紂、伐奄，天下大悅。厥後世衰道微，邪說暴行有作。聖王不作，諸侯放恣，楊朱、墨翟之言盈天下。</p><p><strong>所出</strong>：《孟子 · 滕文公下》 — https://zh.wikisource.org/wiki/孟子/滕文公下</p></article></main></div></div>
