    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 同人于野</nav></header><main><article><h1>同人于野</h1><p>和同遠邇，無私於天下</p><p>「同人于野」者，[[同人]]卦之辭也。</p><p>野者，城郭之外，荒遠之地，無封域之限，無親疏之分。聖人和同天下，不私於一堂，不蔽於一隅，其心量如郊野之廣，故能「亨」。</p><p>[[大學]]所稱「天下平」，[[禮記]]所述「大同」，皆此「于野」之義也。惟至公無我，方能會通萬類。</p><p><strong>所出</strong>：《周易 · 同人》 — https://zh.wikisource.org/wiki/周易/同人</p></article></main></div></div>
