    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 殷有三仁</nav></header><main><article><h1>殷有三仁</h1><p>孔子稱微子去之、箕子為奴、比干諫死為殷室三仁。</p><p>微子、箕子、比干，紂時三臣也。紂暴虐，三子各持其義：微子知紂不可諫而去，箕子諫而不聽，佯狂為奴；比干以為人臣當以死爭，遂直諫而被殺。[[微子]]去之，[[箕子]]為之奴，[[比干]]諫而死。孔子論之曰：「殷有三仁焉。」</p><p><strong>所出</strong>：《史記·卷038》 — https://zh.wikisource.org/wiki/史記/卷038</p></article></main></div></div>
