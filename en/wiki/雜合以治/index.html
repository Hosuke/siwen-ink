    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 雜合以治</nav></header><main><article><h1>雜合以治</h1><p>聖人統合五方治法，各得其宜。</p><p>聖人雜合以治，各得其所宜。[[異法方宜論]]述其義。</p><p>五方地勢不同，民之稟賦各異，疾病之起亦殊。聖人知其情，得其要，故能統合砭石、毒藥、灸焫、微針、導引按蹺之法，視病之所宜而用之。治之所以異而病皆癒者，在知病之情，知治之大體也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第四卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第四卷</p></article></main></div></div>
