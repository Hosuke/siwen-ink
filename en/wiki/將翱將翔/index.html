    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 將翱將翔</nav></header><main><article><h1>將翱將翔</h1><p>鳥欲飛翔之貌。</p><p>將翱將翔，狀鳧鴈欲飛之貌也。見於《詩經·女曰鷄鳴》：「將翱將翔，弋鳧與鴈。」言鳧鴈將翱將翔之際，乃弋射之時也。又見於《曹風·候人》：「薈兮蔚兮，南山朝隮。婉兮孌兮，季女斯飢。」毛傳云：「非素餐兮，賢者退而窮處。」此以鳧鴈之飛翔，比君子欲有所為也。</p><p><strong>所出</strong>：《詩經 · 女曰鷄鳴》 — https://zh.wikisource.org/wiki/詩經/女曰鷄鳴</p></article></main></div></div>
