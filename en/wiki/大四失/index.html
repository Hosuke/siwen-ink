    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 大四失</nav></header><main><article><h1>大四失</h1><p>兵、病、水、火四大災</p><p>大惡有四：兵、病、水、火。</p><p>[[陽侯之波|陽九]]之周，[[陽侯之波|陰孤盛則水溢]]；[[陽侯之波|百六]]之匝，陽偏興則火起。自堯以前，不復須述。堯水之後，湯火為災，此後[[陽侯之波|遍地小小水火]]，罪重隨招。</p><p>[[種民]]之民，[[天道無親|唯善是與]]，善者修行[[太平]]，成[[太平]]也。</p><p><strong>所出</strong>：《太平經 · 01》 — https://zh.wikisource.org/wiki/太平經/01</p></article></main></div></div>
