    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 弼亮四世</nav></header><main><article><h1>弼亮四世</h1><p>輔佐光明，歷事四世而不替。</p><p>舜曰：「咨！汝二十有二人，欽哉！惟時亮天功。」二十二人者，司空、司徒、士、共工、朕虞、秩宗、典樂、納言，加上四岳、十二牧也。弼者，正也；亮者，明也。二十二人各帥其職，天功乃成。亮天功者，代人君以照臨四方也。</p><p><strong>所出</strong>：《尚書 · 舜典》 — https://zh.wikisource.org/wiki/尚書/舜典</p></article></main></div></div>
