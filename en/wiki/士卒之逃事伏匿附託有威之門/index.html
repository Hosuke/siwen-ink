    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 士卒之逃事伏匿附託有威之門</nav></header><main><article><h1>士卒之逃事伏匿附託有威之門</h1><p>士卒逃避徭役，依附權門，是國家之大患。</p><p>悉租稅，專民力，所以備難充倉府也，而士卒之逃事伏匿、附託有威之門以避傜賦而上不得者萬数。</p><p>夫陳善田利宅，所以戰士卒也，而斷頭裂腹、播骨乎平原野者，無宅容身，身死田奪，而女妹有色、大臣左右無功者，擇宅而受，擇田而食。</p><p><strong>所出</strong>：《韓非子 · 詭使》 — https://zh.wikisource.org/wiki/韓非子/詭使</p></article></main></div></div>
