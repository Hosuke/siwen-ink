    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 伊人</nav></header><main><article><h1>伊人</h1><p>伊人，彼人也，指所思慕之君子賢士，所在者遠而不可即。</p><p>伊人，猶言「那人」也。《蒹葭》三章皆云「所謂伊人」，指詩人所企慕之對象。或以為賢士，或以為美人，或以為隱君子，所在皆在水之一方。求之之道，或溯洄，或溯游，而伊人宛在水中央、水中坻、水中沚，終不可得。辭短而意永，後世用「伊人」稱所思念之人，本此。</p><p><strong>所出</strong>：《詩經 · 蒹葭》 — https://zh.wikisource.org/wiki/詩經/蒹葭</p></article></main></div></div>
