    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 價人維藩</nav></header><main><article><h1>價人維藩</h1><p>國有屏蔽，如藩籬垣牆，不可毀也</p><p>詩云「价人維藩，大師維垣。大邦維屏，大宗維翰。懷德維寧，宗子維城」，言各有所守以為國之屏蔽：价人如藩籬，大師如垣牆，大邦如屏障，大宗如楨榦。懷德者天下安，宗子如城垣，不可使壞。</p><p>此[[藩屏]]之義，與[[脩身]]而[[家國天下]]之理相表裏也。</p><p><strong>所出</strong>：《詩經 · 板》 — https://zh.wikisource.org/wiki/詩經/板</p></article></main></div></div>
