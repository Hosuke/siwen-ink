    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 景十三王索隱述贊</nav></header><main><article><h1>景十三王索隱述贊</h1><p>索隱述贊概括景帝十三王之概要，以四言韻語終焉。</p><p>【索隱述贊】景十三子，五宗親睦。栗姬既廢，臨江折軸。閼于早薨，河間儒服。餘好宮苑，端事馳逐。江都有才，中山禔福。長沙地小，膠東造鏃。仁賢者代，浡亂者族。兒姁四王，分封為六。</p><p><strong>所出</strong>：《史記 · 卷059》 — https://zh.wikisource.org/wiki/史記/卷059</p></article></main></div></div>
