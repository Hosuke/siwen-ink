    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 蜮</nav></header><main><article><h1>蜮</h1><p>短狐之蟲，生於水濱，含沙射影，人被之者必死。</p><p>秋，有蜮。蜮，一名射工，亦曰短狐，形如鱉，三足，居水中，能含沙射人影。人被其射，則病瘧以亡。秋成而見，是為蟲災。[[有蜮]]者，《春秋》記之以明天戒也。</p><p><strong>所出</strong>：《春秋左氏傳 · 十八年》 — https://zh.wikisource.org/wiki/春秋左氏傳/莊公/十八年</p></article></main></div></div>
