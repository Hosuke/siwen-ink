    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 君者善群</nav></header><main><article><h1>君者善群</h1><p>君者，善群也。群道當，則萬物皆得其宜，六畜皆得其長，群生皆得其命。</p><p>君者，善群也。群道當，則萬物皆得其宜，六畜皆得其長，群生皆得其命。故養長時，則六畜育；殺生時，則草木殖；政令時，則百姓一，賢良服。</p><p><strong>所出</strong>：《荀子 · 王制篇》 — https://zh.wikisource.org/wiki/荀子/王制篇</p></article></main></div></div>
