    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 葉公子高問政</nav></header><main><article><h1>葉公子高問政</h1><p></p><p>葉公子高問政於仲尼，曰：「善為政者，若之何？」仲尼對曰：「善為政者，遠者近之，而舊者新之。」</p><p>墨子聞之，批評此答以為未得要領。墨子以為葉公子高未得其問，仲尼亦未得其所以對。蓋葉公子高豈不知善為政者之遠者近也而舊者新是哉？彼所問者，乃所以為之若之何之方法也。仲尼乃不以人之所不智告人，而以所智告之，是答非所問也。</p><p>此論可與[[治天下若治一家]]之旨相發明，皆主切實有用之政術，而非高遠虛玄之空論。</p></article></main></div></div>
