    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 昊天不惠</nav></header><main><article><h1>昊天不惠</h1><p>天失仁惠而降鞠訩</p><p>詩人屢稱「昊天」而悲歎其不惠。上章云「昊天不傭，降此鞠訩」「昊天不惠，降此大戾」，言天道乖戾，降以凶禍者，皆由天失其惠也。天之不惠，非天之無知，乃鑒於世道之失而然爾。惠者，仁惠、惠愛也。天惠既失，則鞠訩、大戾相踵而至矣。</p><p><strong>所出</strong>：《詩經 · 節南山》 — https://zh.wikisource.org/wiki/詩經/節南山</p></article></main></div></div>
