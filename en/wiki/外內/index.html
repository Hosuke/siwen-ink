    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 外內</nav></header><main><article><h1>外內</h1><p>兵出於戰，粟出於農，二者乃王業之本</p><p>民之外事，莫難於戰，故輕法不可以備之。賞多威嚴，民見戰賞之多則忘死，見不戰之辱則苦生。</p><p>民之內事，莫苦於農，故輕治不可以使之。夫農貧而商富，故其食賤者錢重。食賤則農貧，錢重則商富；末事不禁，則技巧之人利，而游食者眾之謂也。</p><p>故為國者，邊利盡歸於兵，市利盡歸於農。邊利盡歸於兵者，彊；市利盡歸於農者，富。故出戰而彊，入休而富者，王也。</p><p><strong>所出</strong>：《商君書 · 卷五》 — https://zh.wikisource.org/wiki/商君書/卷五</p></article></main></div></div>
