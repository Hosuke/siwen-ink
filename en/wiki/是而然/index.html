    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 是而然</nav></header><main><article><h1>是而然</h1><p>「是而然」為《小取》所論論理式之一，謂前提為是則結論亦然。</p><p><strong>「是而然」</strong>，出於《墨子·小取》，論理之一式也。謂前提為是，則結論亦然。</p><p>《小取》云：「白馬，馬也；乘白馬，乘馬也。驪馬，馬也；乘驪馬，乘馬也。獲，人也；愛獲，愛人也。臧，人也；愛臧，愛人也。」</p><p>此數例者，皆示「是而然」之理。白馬為馬，乘白馬即為乘馬；驪馬為馬，乘驪馬亦為乘馬；獲為人，愛獲即為愛人；臧為人，愛臧亦為愛人。蓋名實相符，辭意相應，則論斷亦當相從也。</p><p>其要義在於：若甲屬乙類，而丙之事於甲亦當施之於乙。此論理之正途，不可易也。</p><p>相關條目：[[辟侔援推]]。</p></article></main></div></div>
