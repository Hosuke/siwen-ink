    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 咸淳壬申</nav></header><main><article><h1>咸淳壬申</h1><p>宋度宗咸淳八年，中元，程公端書《上清大洞真經後序》之日。</p><p>咸淳壬申上元日，嗣法程公端焚香敬書《上清大洞真經後序》。時玉海沖妙宗師來游九華，因訪道室，語及大洞經傳授事。懼其將泯絕，欲廣其傳。公端蒙師指教，感恩莫酬，敬命厥工，用鋟諸梓，以承其志。</p><p>咸淳者，宋度宗之年號；壬申為咸淳八年；上元為正月十五日。此為刊刻大洞真經之年月也。</p><p><strong>所出</strong>：《上清大洞真經 · 結尾》 — https://zh.wikisource.org/wiki/上清大洞真經/結尾</p></article></main></div></div>
