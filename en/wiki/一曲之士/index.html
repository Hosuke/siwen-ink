    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 一曲之士</nav></header><main><article><h1>一曲之士</h1><p>偏執一曲之見者，不通萬物之全。</p><p>天下多得一察焉以自好。譬如耳目鼻口，皆有所明，不能相通。猶百家衆技也，皆有所長，時有所用。雖然，不該不徧，<strong>一曲之士</strong>也。判天地之美，析萬物之理，察古人之全，寡能備於天地之美，稱神明之容。</p><p>是故內聖外王之道，闇而不明，鬱而不發，天下之人各為其所欲焉以自為方。悲夫，百家往而不反，必不合矣！後世之學者，不幸不見天地之純，古人之大體，道術將為天下裂。</p><p><strong>所出</strong>：《莊子 · 天下》 — https://zh.wikisource.org/wiki/莊子/天下</p></article></main></div></div>
