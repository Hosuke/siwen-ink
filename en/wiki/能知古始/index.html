    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 能知古始</nav></header><main><article><h1>能知古始</h1><p>人知上古本始有一，是謂知道綱紀</p><p>===續寫===
slug: 玄之又玄
增補: 此章河上公以「混」「皦」「昧」「繩繩」「無物」「惚恍」諸名數詮道體，而以「一」字括之。所言道紀者，正與「玄之又玄」同旨，而更推言其用焉。學者內觀若此，則執古御今之義亦在其中。</p><p><strong>所出</strong>：《老子河上公章句 · 贊玄》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
