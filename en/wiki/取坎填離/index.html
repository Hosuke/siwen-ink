    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 取坎填離</nav></header><main><article><h1>取坎填離</h1><p>取出坎中道心實，點化離宮人心虛，複歸乾元本性。</p><p>若夫至聖神人，能知道體太極之所以判，能知死生根本之所以始，能知乾坤陰陽之所以乖，能知天玄地牡之所以交，是以法乾坤之體，效坎離之用，握陰陽之柄，過生死之關，取坎中之陽，填離中之陰，離陰既實，則複純白為乾矣。</p><p>斯時補足乾元，複全渾敦，以全親之所生，以全天之所賦，是為囫圇一個完人也。</p><p>取坎填離者，以坎中一陽，填離中一陰，離遂成乾。乾坤複位，則金丹成而聖胎圓矣。</p><p><strong>所出</strong>：《性命圭旨 · 元集》 — https://zh.wikisource.org/wiki/性命圭旨/元集</p></article></main></div></div>
