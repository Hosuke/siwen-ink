    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 正法直度</nav></header><main><article><h1>正法直度</h1><p>法度既正，賞罰乃行。</p><p>凡國無法則衆不知所爲，無度則事無機。有法不正、有度不直則治辟，治辟則國亂。故曰：「正法直度，罪殺不赦。殺僇必信，民畏而懼。武威既明，令不再行。」</p><p>凡民者，莫不惡罰而畏罪。是以人君嚴教以示之，明刑罰以致之。故曰：「頓卒台倦以辱之，罰罪有過以懲之，殺僇犯禁以振之。」</p><p>法制不議，法令不法。令貴於寶，威重於爵祿。賞足以勸善，威足以勝暴。</p><p><strong>所出</strong>：《管子 · 第66篇版法解》 — https://zh.wikisource.org/wiki/管子/第66篇版法解</p></article></main></div></div>
