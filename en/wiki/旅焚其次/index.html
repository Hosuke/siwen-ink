    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 旅焚其次</nav></header><main><article><h1>旅焚其次</h1><p>旅次被焚，僕亦亡失，危厲之道。</p><p>旅焚其次，喪其童僕，貞厲。象曰：「亦以傷矣。以旅與下，其義喪也。」九三過剛不中，旅而焚次，僕亦亡焉，危厲甚矣。</p><p><strong>所出</strong>：《周易 · 旅》 — https://zh.wikisource.org/wiki/周易/旅</p></article></main></div></div>
