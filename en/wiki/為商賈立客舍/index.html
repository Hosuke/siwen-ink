    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 為商賈立客舍</nav></header><main><article><h1>為商賈立客舍</h1><p>招徠商旅，定其食菽伍養，以通天下之貨。</p><p>管子言：「皮幹筋角竹箭羽毛齒革不足，為此有道乎？」管仲曰：「惟曲衡之數為可耳。」</p><p>請以令，為諸侯之商賈立客舍，一乘者有食，三乘者有蒭菽，五乘者有伍養，天下之商賈歸齊若流水。</p><p><strong>所出</strong>：《管子 · 第81篇輕重乙》 — https://zh.wikisource.org/wiki/管子/第81篇輕重乙</p></article></main></div></div>
