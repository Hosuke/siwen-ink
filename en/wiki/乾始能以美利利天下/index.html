    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 乾始能以美利利天下</nav></header><main><article><h1>乾始能以美利利天下</h1><p>乾之始，能以美利利天下不言所利，其利大矣。</p><p>文言曰：乾元者，始而亨者也。利貞者，性情也。乾始能以美利利天下，不言所利，大矣哉！</p><p>乾之元，萬物資始，無美不備，無利不行，而不自以為功，不自有其德，是不言所利也。天下後世蒙其澤，而莫知其所以然，是其大也。夫利之在天下，有名而後有利，功成而後有德，未有不言所利而物被其施者，此乾之所以大歟。</p><p><strong>所出</strong>：《周易 · 乾》 — https://zh.wikisource.org/wiki/周易/乾</p></article></main></div></div>
