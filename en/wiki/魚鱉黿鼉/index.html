    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 魚鱉黿鼉喻</nav></header><main><article><h1>魚鱉黿鼉喻</h1><p>物各求利，君子當以義制利，則恥辱不至。</p><p>曾子病甚，曾元持其足。曾子喻之曰：「夫魚鱉黿鼉，以淵為淺而堀其中；鷹鳶以山為卑而增巢其上。及其得也，必以餌。夫利者，害之招也；饵者，祸之媒也。」</p><p>故君子能無以利害義，則恥辱亦無由至矣。是以聖賢戒貪利、遠外誘，守義如玉，持身如砥也。</p><p><strong>所出</strong>：《荀子 · 法行篇》 — https://zh.wikisource.org/wiki/荀子/法行篇</p></article></main></div></div>
