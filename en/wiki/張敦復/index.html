    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 張敦復</nav></header><main><article><h1>張敦復</h1><p></p><p>真人張敦復字延之，[[張象中]]長子。少儒服，有聲場屋，後以嫡子承正一二十八世，丕闡祖風，四方宗之。年五十三而卒，追封葆光先生。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 19》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/19</p></article></main></div></div>
