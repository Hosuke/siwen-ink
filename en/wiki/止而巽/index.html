    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 止而巽</nav></header><main><article><h1>止而巽</h1><p>內止外順則動而不窮</p><p>彖曰：「其位剛，得中也。止而巽，動不窮也。」</p><p>漸之成卦，艮下而巽上。艮者，止也；巽者，入也、順也。內有所止，外有所入，是以動而能進，進而不窮。君子觀此象，以居賢德、善民俗，其猶是-{歟}-？居德則止以定，入俗則巽以和，動而不失其序，故無困躓之患。</p><p><strong>所出</strong>：《周易 · 漸》 — https://zh.wikisource.org/wiki/周易/漸</p></article></main></div></div>
