    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 匪我求童蒙童蒙求我</nav></header><main><article><h1>匪我求童蒙童蒙求我</h1><p>教化之道，貴乎蒙者自求，非師者強施。</p><p>匪我求童蒙，童蒙求我。</p><p>蒙之道，以求者之志應為本也。非我強求於童蒙，乃童蒙之自求於我也。夫師者所以傳道授業解惑，而非以道強人也。童蒙之心未開，其志未立，雖聖人在上，未有不待其自求而後告之者。苟非其求而強告之，是瀆也，瀆則不告。此聖人施教之微意也。</p><p><strong>所出</strong>：《周易 · 蒙》 — https://zh.wikisource.org/wiki/周易/蒙</p></article></main></div></div>
