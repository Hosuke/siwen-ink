    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 使外國道</nav></header><main><article><h1>使外國道</h1><p>張騫始開通外國之道路</p><p>自[[博望侯]]開外國道以尊貴。</p><p>騫出使月氏，往返凡十三歲，中間留匈奴十餘年，終能通大宛、大月氏、大夏、康居諸國。天子欣然，令騫因蜀犍為發間使，四道並出。自此西域道通，而西北國始與漢往來矣。</p><p><strong>所出</strong>：《史記 · 卷123》 — https://zh.wikisource.org/wiki/史記/卷123</p></article></main></div></div>
