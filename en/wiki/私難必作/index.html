    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 私難必作</nav></header><main><article><h1>私難必作</h1><p>昭私則難作；國有驕君，私家必盛，禍將及焉。</p><p>范文子自鄢歸，戒其宗、祝曰：「君驕泰而有烈，夫以德勝者猶懼失之，而況驕泰乎？君多私，今以勝歸，私必昭。昭私，難必作，吾恐及焉。凡吾宗、祝，為我祈死，先難為免。」七年夏，范文子卒。冬，難作，始於三郤，卒於公。</p><p>蓋私者，人心之蟊也。君有驕志，臣遂殖私；私家既盛，難端自起。公室之亡，皆由私家之強；故君子防微杜漸，必絕其私於未形。</p><p><strong>所出</strong>：《國語 · 卷12》 — https://zh.wikisource.org/wiki/國語/卷12</p></article></main></div></div>
