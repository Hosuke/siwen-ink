    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 大庖不盈</nav></header><main><article><h1>大庖不盈</h1><p>君庖充實而不匱乏，取之有節也。</p><p>大庖者，天子之廚也。不盈者，非不足也，取之有節，用之有度，不暴殄天物也。詩言「徒御不驚，大庖不盈」，見師旅肅穆而供膳有節，武功既成，文德亦備。君子之獵，取適於義，不以多獲為貴，此宣王所以興周室也。</p><p><strong>所出</strong>：《詩經 · 車攻》 — https://zh.wikisource.org/wiki/詩經/車攻</p></article></main></div></div>
