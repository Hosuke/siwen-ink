    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 求道在志之篤</nav></header><main><article><h1>求道在志之篤</h1><p>修道貴志之堅笃，不貴近效；患志之不篤，務近忘遠。</p><p>抱朴子借師言以明求道之要：「余師常告門人曰：夫人求道，如憂家之貧，如愁位之卑者，豈有不得耶？但患志之不篤，務近忘遠，聞之則悅，倔倔前席，未久，則忽然若遺，毫釐之益未固，而丘山之損不已，亦安得窮至言之微妙，成罔極之峻崇乎？」</p><p><strong>所出</strong>：《抱朴子 · 卷17》 — https://zh.wikisource.org/wiki/抱朴子/卷17</p></article></main></div></div>
