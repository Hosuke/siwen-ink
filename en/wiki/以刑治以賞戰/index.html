    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 以刑治以賞戰</nav></header><main><article><h1>以刑治以賞戰</h1><p>治民用刑，戰陳用賞。</p><p>以刑治，以賞戰。此法家之大法也。國內之民，驅之以刑罰，使知所畏；境外之敵，激之以賞賚，使樂於致死。刑賞分途，各有其用，不可混也。</p><p><strong>所出</strong>：《韓非子 · 飭令》 — https://zh.wikisource.org/wiki/韓非子/飭令</p></article></main></div></div>
