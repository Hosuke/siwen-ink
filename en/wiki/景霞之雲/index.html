    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 景霞之雲</nav></header><main><article><h1>景霞之雲</h1><p>景雲之霞，吐於頭面，罩護兆身</p><p>景霞之雲，大洞經所言存神所吐之雲也。</p><p>經云「存神吐萬道景霞之雲，罩於頭面之境」，言學者存思紫素左元君時，存神吐萬道景霞之雲，覆罩頭面之境，乃萬邪不侵、千精盡滅之象。</p><p><strong>所出</strong>：《上清大洞真經 · 22章》 — https://zh.wikisource.org/wiki/上清大洞真經/22章</p></article></main></div></div>
