    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 召伯聽讼</nav></header><main><article><h1>召伯聽讼</h1><p>召伯聽斷是非，明察曲直，故能使教化大行。</p><p>「召伯聽讼」，《詩經·行露》毛詩序首句也。序云：「《行露》，召伯聽讼也。」</p><p>召伯，召公奭也。[[召伯聽讼]]而能使[[衰亂之俗微]]，[[貞信之教興]]，[[彊暴之男不能侵陵貞女]]。聽讼之明，乃政治之要也。</p><p>[[行露]]一篇，所以明聽讼之效。詩中女子自言雖[[速我獄]]、 [[速我讼]]而[[室家不足]]，終[[亦不女從]]，正見有司聽讼以正風俗之功也。</p><p><strong>所出</strong>：《詩經 · 行露》 — https://zh.wikisource.org/wiki/詩經/行露</p></article></main></div></div>
