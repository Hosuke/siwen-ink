    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 塞侯微巧</nav></header><main><article><h1>塞侯微巧</h1><p></p><p>太史公論[[塞侯]][[直不疑]]曰「塞侯微巧」，言其人明於[[陰德]]而略嫌巧佞，非醇厚[[恭謹無與比]]之正也。然[[直不疑]]同舍郎金之誤、「我乃無兄」之對，皆長者之行。[[太史公]]以「[[周文]]處讇」並論，言其近乎佞，蓋深戒之也。</p><p>  <strong>所出</strong>：《史記 · 卷103》 — https://zh.wikisource.org/wiki/史記/卷103</p></article></main></div></div>
