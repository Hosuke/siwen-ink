    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 一人三失，怨豈在明？不見是圖</nav></header><main><article><h1>一人三失，怨豈在明？不見是圖</h1><p>怨患不在顯明之時，當圖之於未形。</p><p>一人三失，怨豈在明？不見是圖。此[[五子之歌]]所述皇祖之戒，示人當察微杜漸於未形之時也。</p><p>其一云：「一人三失，怨豈在明？不見是圖。」</p><p><strong>所出</strong>：《尚書 · 五子之歌》 — https://zh.wikisource.org/wiki/尚書/五子之歌</p></article></main></div></div>
