    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 燕私</nav></header><main><article><h1>燕私</h1><p>祭祀之終，族人相與宴樂，以盡歡情。</p><p>第六章言祭祀既畢，「諸父兄弟，備言燕私」。燕私者，祭末之私宴也。自父子至於兄弟，皆序昭穆、合族屬，所以聯親情、昭享祀之終也。「樂具入奏，以綏後祿」，言音樂皆入於廟，而綏取祭餘之福祿也。</p><p><strong>所出</strong>：《詩經 · 楚茨》 — https://zh.wikisource.org/wiki/詩經/楚茨</p></article></main></div></div>
