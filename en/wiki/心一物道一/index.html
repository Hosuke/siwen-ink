    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 心一物道一</nav></header><main><article><h1>心一物道一</h1><p>心、物、道三者本一，聖人知此而合之。</p><p>道茫茫而無知乎，心儻儻而無羈乎，物迭迭而無非乎。電之逸乎，沙之飛乎。聖人以知心一物一道一。三者又合為一。不以一格不一，不以不一害一。</p><p><strong>所出</strong>：《關尹子 · 1》 — https://zh.wikisource.org/wiki/關尹子/1</p></article></main></div></div>
