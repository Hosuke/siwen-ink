    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 維天有漢，監亦有光</nav></header><main><article><h1>維天有漢，監亦有光</h1><p>天之銀河，光華照監然無用</p><p>維天有漢，天之河漢，即銀河也。監亦有光，言其光照可以照監，而終無益於人也。詩人以此起下文言星辰之有名無實，與維南之箕、維北之斗皆不可以實用同義。</p><p><strong>所出</strong>：《詩經 · 大東》 — https://zh.wikisource.org/wiki/詩經/大東</p></article></main></div></div>
