    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 天子立六官、三公、九卿，聽天下之外治</nav></header><main><article><h1>天子立六官、三公、九卿，聽天下之外治</h1><p>天子立六官以聽外治，明章男教，外和而國治。</p><p>天子立六官、三公、九卿、二十七大夫、八十一元士，以聽天下之外治，以明章天下之男教；故外和而國治。</p><p><strong>所出</strong>：《禮記 · 昏義》 — https://zh.wikisource.org/wiki/禮記/昏義</p></article></main></div></div>
