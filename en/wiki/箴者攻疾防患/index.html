    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 箴者攻疾防患</nav></header><main><article><h1>箴者攻疾防患</h1><p>箴如砮石，用以攻疾防患，戒之於未然而已。</p><p>劉勰釋箴之義曰：「箴者，所以攻疾防患，喻箴石也。」夫疾之未成，治之易為；患之未著，備之易全。箴之用，在乎微而先見，約而能救，非若銘之施於已成之事也。箴誦於官，言者陳於上；銘題於器，器以載其言。名目雖異，警戒實同。然箴全禦過，故文資確切；銘兼褒讚，故體貴弘潤。此又二體之殊也。</p><p><strong>所出</strong>：《文心雕龍 · 銘箴》 — https://zh.wikisource.org/wiki/文心雕龍/銘箴</p></article></main></div></div>
