    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 亡國之社以為廟屏</nav></header><main><article><h1>亡國之社以為廟屏</h1><p>亳社之屋所以蔽之，使不得上達，非以受享也。</p><p>亳社火。穀梁子曰：「亳社者，亳之社也。亳，亡國也。亡國之社以為廟，屏戒也。其屋亡國之社，不得達上也。」蓋亳乃商之亡國，其社亡而猶存，以為天子宗廟之屏障。屋覆其上，使其不得通達於天，示戒慎之意也。亡國之社不可祠，不可享，只可為屏為戒，此明尊崇正統、防範僭越之義也。</p><p><strong>所出</strong>：《春秋穀梁傳 · 哀公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/哀公</p></article></main></div></div>
