    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 蚩尤</nav></header><main><article><h1>蚩尤</h1><p></p><p>蚩尤氏不恭帝命，兄弟八十人，並獸身人語，銅頭鐵額，不食五穀，啗沙吞石。始作鐘甲，時人不識，謂是銅頭鐵額。不用帝命，作五虐之刑以害黎庶，於葛廬山發金作冶制為鏡甲及劍，造立兵仗刀戟大弩等，威震天下。帝欲伐之，徵諸侯，一十五旬未克。帝與蚩尤大戰於涿鹿之野，蚩尤作百里大霧，彌三晝，帝之軍人皆迷惑。帝乃帥師與之戰，未勝。帝後得玄女之符及兵信行，遂滅蚩尤。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 1》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/1</p></article></main></div></div>
