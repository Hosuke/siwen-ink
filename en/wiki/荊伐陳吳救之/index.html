    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 荊伐陳吳救之</nav></header><main><article><h1>荊伐陳吳救之</h1><p>星變雨久，兵聚於陳，吳人必至；如其反覆，吾擊之必敗。</p><p>荊伐陳，吳救之，軍間三十里。雨十日，夜星。左史倚相謂子期曰：「雨十日，甲輯而兵聚。吳人必至，不如備之。」乃為陳。陳未成也而吳人至，見荆陳而反。左史曰：「吳反覆六十里，其君子必休，小人必食。我行三十里擊之，必可敗也。」乃從之，遂破吳軍。</p><p><strong>所出</strong>：《韓非子 · 說林下》 — https://zh.wikisource.org/wiki/韓非子/說林下</p></article></main></div></div>
