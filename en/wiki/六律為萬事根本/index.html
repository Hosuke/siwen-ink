    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 六律為萬事根本</nav></header><main><article><h1>六律為萬事根本</h1><p>六律為天地萬事之根本，兵械尤所重用。</p><p>王者制事立法，物度軌則，壹稟於六律，六律為萬事根本焉。其於兵械尤所重，故云「望敵知吉凶，聞聲效勝負」，百王不易之道也。</p><p>六律者，黃鐘、太蔟、姑洗、蕤賓、夷則、無射也。冬至陽氣始動，以黃鐘起之；陽氣漸盛，聲之行亦遂之。六律定，而萬事之度數由此生焉。</p><p><strong>所出</strong>：《史記 · 卷025》 — https://zh.wikisource.org/wiki/史記/卷025</p></article></main></div></div>
