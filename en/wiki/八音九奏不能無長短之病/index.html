    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 八音九奏不能無長短之病</nav></header><main><article><h1>八音九奏不能無長短之病</h1><p>音律至美，猶有長短之憾；聖人全才，亦難無一失之疏。</p><p>玄泊先生云：「<strong>且八音九奏，不能無長短之病，養由百發不能止，將有一失之疏</strong>。」言事物至善，不能無憾；操術至精，不能無失。淺近之徒玩憑河而數溺，好劇談而多漏，昧此理也。</p><p><strong>所出</strong>：《抱朴子 · 卷51》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷51</p></article></main></div></div>
