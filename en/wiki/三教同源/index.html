    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 三教同源</nav></header><main><article><h1>三教同源</h1><p>儒、佛、仙三家同道，異名同實。</p><p>儒也者，行道濟時者也；佛也者，悟道覺世者也；仙也者，藏道度人者也。各講各的妙處，合講合的好處，何必口舌是非哉？夫道者，無非窮理盡性以至於命而已矣。孔子隱諸罕言，仙家暢言之、喻言之。儒離此道不成儒，佛離此道不成佛，仙離此道不成仙，而仙家特稱為道門，是更以道自任也。</p><p><strong>所出</strong>：《張三丰先生全集 · 卷3》 — https://zh.wikisource.org/wiki/張三丰先生全集/卷3</p></article></main></div></div>
