    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 元永貞</nav></header><main><article><h1>元永貞</h1><p>初始之善與恆久之正，兼而有之。</p><p>元者，善之長也；永者，恆久不息也；貞者，正而固也。元永貞，謂兼有初始之至善與恆久之正道。《比》卦辭以元永貞配无咎，蓋言人若能持心至善而守之長永，則可以輔助君王而無過也。</p><p><strong>所出</strong>：《周易 · 比》 — https://zh.wikisource.org/wiki/周易/比</p></article></main></div></div>
