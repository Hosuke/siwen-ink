    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 言必立儀</nav></header><main><article><h1>言必立儀</h1><p></p><p>《墨子·非命下》詳言「言必立儀」之旨。墨子以為，言者不可不先立儀。若不先立儀而言，譬之猶運鈞之上而立朝夕焉。運鈞者，製陶之轉輪也；朝夕者，測日之儀表也。以測影之表置於運轉不息之輪上，則影象終無定時，雖有朝夕之辯，必將終未可得而從定也。</p><p>  此喻言：言論若無標準，譬如測量之物失其準則，則是非無由判定，善惡無由分別。欲知言論之當否，必先立言論之儀表，此即三法之說。所以然者，天下之言語多端，若不立一是非之準則，則人人各是其說，而天下之論將無所折衷矣。</p></article></main></div></div>
