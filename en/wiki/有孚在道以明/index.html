    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 有孚在道以明</nav></header><main><article><h1>有孚在道以明</h1><p>誠信存乎道中，光明自著，雖凶可免。</p><p>九四：「隨有獲，貞凶。有孚在道，以明，何咎。」象曰：「隨有獲，其義凶也。有孚在道，明功也。」</p><p>隨而有所獲，人疑其凶。然誠信存乎道中，光明自著於外，此明之功也。君子處隨從之際，不以利移，不以得肆其志，守道懷信，表裏洞達，故能化凶為无咎。</p><p><strong>所出</strong>：《周易 · 隨》 — https://zh.wikisource.org/wiki/周易/隨</p></article></main></div></div>
