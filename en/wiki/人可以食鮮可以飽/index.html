    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 人可以食，鮮可以飽</nav></header><main><article><h1>人可以食，鮮可以飽</h1><p>亂世之中食猶不足</p><p>牂羊墳首，三星在罶。人可以食，鮮可以飽。</p><p>此章言饑饉之甚也。牂羊本小首，今則瘦瘠而首大如坟，言畜産亦困弊也。三星在罶，星光倒映水中，靜夜無風，魚不入罶，網罟空設，無所得也。人固有欲食之心，而倉庾既竭，野無可獵，鮮可以飽。此與《正月》「仳仳有屋，蔌蔌有粟」之歎，《桑柔》「民有餒飢」之辭，同一傷痛。觀此，可以知幽王之世，師旅並興，因之以饑饉，雖欲苟全，亦不可得矣。</p><p><strong>所出</strong>：《詩經 · 苕之華》 — https://zh.wikisource.org/wiki/詩經/苕之華</p></article></main></div></div>
