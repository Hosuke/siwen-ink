    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 學而不思則閡</nav></header><main><article><h1>學而不思則閡</h1><p>學而不思，則疑惑日增；講而不精，則惑亂喪功。</p><p>浚井不渫則泥濘滋積，嘉谷不耘則荑莠彌蔓。學而不思則閡實繁，講而不精則長惑喪功。抱朴子以耕耘為喻，言為學之工也。井焉浚之而後清，谷焉耘之而後稂不入，學亦如之。學而不深思其義理，則窒塞疑惑日以繁叢；徒資講說而不能精究其歸趣，則增長眩惑而功效盡失。譬如嘉谷，耘耔不施，則稂莠與之俱生；學問之功，不加省察之效，則所養非所用，所知非所行。此修業者所宜深戒也。</p><p><strong>所出</strong>：《抱朴子 · 卷38》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷38</p></article></main></div></div>
