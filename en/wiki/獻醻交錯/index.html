    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 獻醻交錯</nav></header><main><article><h1>獻醻交錯</h1><p>祭祀之末，主人與賓執爵相酬，威儀秩秩。</p><p>「獻醻交錯，禮儀卒度，笑語卒獲」，言祭祀既成之後，主客相與宴飲之儀。獻，主酌以獻賓也；醻，賓既卒爵而酬主人也。交錯，言相承之密。卒度者，無過差也；卒獲者，當其可也。威儀笑語，皆有其節，非肆情以干禮也。</p><p><strong>所出</strong>：《詩經 · 楚茨》 — https://zh.wikisource.org/wiki/詩經/楚茨</p></article></main></div></div>
