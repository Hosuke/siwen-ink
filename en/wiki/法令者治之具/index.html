    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 法令者治之具</nav></header><main><article><h1>法令者治之具</h1><p>法令非致治之本，乃輔治之具。</p><p>太史公曰：「信哉是言也！法令者治之具，而非-{制}-治淸濁之源也。」言法令非本根，乃輔助之器耳。破觚而為圜，斲雕而為樸，網漏-{於}-呑舟之魚，漢初之所以治安者，在德化之歸附，不在法令之繁密也。</p><p><strong>所出</strong>：《史記 · 卷122》 — https://zh.wikisource.org/wiki/史記/卷122</p></article></main></div></div>
