    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 不厚其棟不能任重</nav></header><main><article><h1>不厚其棟不能任重</h1><p>任重者當先厚其德，無德而據高位，必不能久。</p><p>郤犫欲予子叔聲伯邑，聲伯辭之。鮑國問其故，對曰：「吾聞之，不厚其棟，不能任重。重莫如國，棟莫如德。夫苦成叔家欲任兩國而無大德，其不存也，亡無日矣。苦成氏有三亡：少德而多寵，位下而欲上政，無大功而欲大祿，皆怨府也。其君驕而多私，勝敵而歸，必立新家，不因民不能去舊，因民非多怨民無所始。為怨三府，可謂多矣。」</p><p><strong>所出</strong>：《國語 · 卷04》 — https://zh.wikisource.org/wiki/國語/卷04</p></article></main></div></div>
