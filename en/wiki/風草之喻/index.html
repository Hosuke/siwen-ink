    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 風草之喻</nav></header><main><article><h1>風草之喻</h1><p>風行草偃在上者善為則下民化之</p><p>王命君陳尹茲東郊，誡之曰：「爾惟風，下民惟草。」蓋風行而草必偃，上有好者下必甚焉。在上者一舉措一動靜，下民觀感而變化隨之。是以聖人治天下，必先正己以率之，不敢慢不敢易，此風草之喻所以垂戒也。</p><p><strong>所出</strong>：《尚書 · 君陳》 — https://zh.wikisource.org/wiki/尚書/君陳</p></article></main></div></div>
