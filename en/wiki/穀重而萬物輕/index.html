    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 穀重而萬物輕</nav></header><main><article><h1>穀重而萬物輕</h1><p>穀價貴則百物賤，穀價賤則百物貴。</p><p>穀者，民之命也。穀重而萬物輕，穀輕而萬物重。布織財物皆立其貲，財物之貲與幣高下，獨穀貴而萬物賤、穀賤而萬物貴。是以聖人治國，必先平穀價。穀價平則民心定，民心定則天下安。此[[輕重]]之本、治國之樞機也。</p><p><strong>所出</strong>：《管子 · 第69篇乘馬數》 — https://zh.wikisource.org/wiki/管子/第69篇乘馬數</p></article></main></div></div>
