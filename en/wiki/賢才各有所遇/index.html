    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 賢才各有所遇</nav></header><main><article><h1>賢才各有所遇</h1><p>謂賢才未遇者，非才不足，乃未得其時、未逢其主耳。</p><p>姜牙賣漿無所售，而見師於文武；蔣生憒慢於百里，而獨步三槐。</p><p>蓋賢才之在世也，遭時則用，不遇則隱。姜牙屠於朝歌，東海之濱，卒遇文王而為太師；蔣生淹於下位，卒輔文武而參三槐之列。是故人才之顯晦，係乎時君之知遇，非才之有優劣也。</p><p><strong>所出</strong>：《抱朴子 · 卷17》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷17</p></article></main></div></div>
