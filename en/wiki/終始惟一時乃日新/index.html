    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 終始惟一，時乃日新</nav></header><main><article><h1>終始惟一，時乃日新</h1><p>修身治國，以恒一為本，日日有新，則德日進而不已。</p><p>日新之功，在於終始不易其一。始終不一，則德有間斷，日新之功廢矣。惟終始如一，德無或渝，然後時時有新之效。若一曝十寒，初勤而末怠，則不可以言日新。是以湯之聖德，尹之純忠，皆以始終惟一為日新之本。</p><p>今嗣王新服厥命，惟新厥德。終始惟一，時乃日新。</p><p><strong>所出</strong>：《尚書 · 咸有一德》 — https://zh.wikisource.org/wiki/尚書/咸有一德</p></article></main></div></div>
