    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 喋血乘勝</nav></header><main><article><h1>喋血乘勝</h1><p>殺人流血，乘勝席捲，言武功之盛。</p><p>太史公曰：魏豹、彭越雖故賤，然已席捲千里，南面稱孤，喋血乘勝日有聞矣。言其席捲千里之師，殺人流血，乘勝逐北，日有所聞，武功之盛也。</p><p><strong>所出</strong>：《史記 · 卷090》 — https://zh.wikisource.org/wiki/史記/卷090</p></article></main></div></div>
