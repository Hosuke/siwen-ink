    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 良士蹶蹶</nav></header><main><article><h1>良士蹶蹶</h1><p>良士勤勉躁動，常懷警惕。</p><p>蹶蹶，躁動不息之貌。[[良士瞿瞿]] 言其戒懼若有所失，蹶蹶則言其躁動若有所為。《蟋蟀》三章皆云「良士蹶蹶」，以明君子知歲月之逝、光陰之不可荒貸，故汲汲然不敢怠惰，必修其職事而後已。蹶蹶者，動而進取之義，非徒焦躁之謂也。</p><p><strong>所出</strong>：《詩經 · 蟋蟀》 — https://zh.wikisource.org/wiki/詩經/蟋蟀</p></article></main></div></div>
