    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 亂主不知其臣之意行</nav></header><main><article><h1>亂主不知其臣之意行</h1><p>亂主不知臣意，任之以國，致小名卑地削，大國亡身死。</p><p>亂主則不然，不知其臣之意行，而任之以國，故小之名卑地削，大之國亡身死，不明於用臣也。</p><p><strong>所出</strong>：《韓非子 · 說疑》 — https://zh.wikisource.org/wiki/韓非子/說疑</p></article></main></div></div>
