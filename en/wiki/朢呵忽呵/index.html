    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 朢呵忽呵</nav></header><main><article><h1>朢呵忽呵</h1><p>道之恍惚，象物所生</p><p>（道之物，唯朢唯忽。朢呵忽呵，中有象呵。朢呵忽呵，中有物呵。幽呵鳴呵，中有請呵。）</p><p>道之為物也，恍惚不定，而有象有物。朢然而望，則象生；忽然而失，則物隱。二者相摩，而萬象出焉。</p><p>夫朢者，有之初也；忽者，無之漸也。惟朢惟忽，是名道物。視之不見其形，聽之不聞其聲，而象物實在其中。此道之所以為大也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第六十五章 從道》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
