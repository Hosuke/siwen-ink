    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 揚權</nav></header><main><article><h1>揚權</h1><p>揚其權柄，人主之要務也。</p><p>揚權者，發揚人主之威權也。權者，人主之命；威者，馭下之具。人主執柄而御物，則天下定；柄失而人歸，則社稷危。韓非之論，貴在專斷。事在二三人，不在萬人；權在一處，不在散地。人主當虛心以觀物，凝神以察姦，使臣不得窺其好惡，不得測其喜怒。一聽於法，一斷於君，如是則威常在己，姦無所售其巧。權不可旁落，威不可稍渝，此揚權之本旨也。</p><p><strong>所出</strong>：《韓非子 · 02》 — https://zh.wikisource.org/wiki/韓非子/02</p></article></main></div></div>
