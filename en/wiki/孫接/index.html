    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 孫接者仁之能</nav></header><main><article><h1>孫接者仁之能</h1><p>遜順交接，乃仁道之能事，成己之後所以合物者也。</p><p>孫接者，仁之能也。</p><p>能者，功效也。孫者，遜也。溫良根於心，敬慎持於外，寬裕發於作，至孫接則以遜下之姿交接於人矣。《論語》「夫子溫良恭儉讓」，讓即孫也。不自矜伐，不陵人傲物，是仁者接物之能也。</p><p><strong>所出</strong>：《禮記 · 儒行》 — https://zh.wikisource.org/wiki/禮記/儒行</p></article></main></div></div>
