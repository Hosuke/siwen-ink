    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 善言伐齊者亂人</nav></header><main><article><h1>善言伐齊者亂人</h1><p>伐與不伐皆非，治在心，不在言。</p><p>魏瑩怒將使人刺田侯牟。犀首公孫衍請受甲二十萬伐之，虜其人民；季子謂築城十仞，不當以兵連年；華子聞而醜之，曰：「善言伐齊者，亂人也；善言勿伐者，亦亂人也；謂伐之與不伐亂人也者，又亂人也。」君曰：「然則若何？」曰：「君求其道而已矣！」惠子聞之而見戴晉人，以蝸角之喻曉之，梁王惝然若有亡也。</p><p><strong>所出</strong>：《莊子 · 則陽》 — https://zh.wikisource.org/wiki/莊子/則陽</p></article></main></div></div>
