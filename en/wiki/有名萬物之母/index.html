    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 有名萬物之母</nav></header><main><article><h1>有名萬物之母</h1><p>有名者，萬物所從出，萬物之宗。</p><p>有名，萬物之母也。萬物既肇，有名以別之，則物各守其分、得其名。有名者，萬物之所以然者也。母者，育之、生之之謂。萬物得有名以別其性、分其職，而後生生之德以成。是故有名與無名，異名同事、殊途同歸，皆萬物之所以然。</p><p><strong>所出</strong>：《老子 (帛書本) · 章一》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
