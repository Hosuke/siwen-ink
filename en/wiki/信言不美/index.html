    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 信言不美</nav></header><main><article><h1>信言不美</h1><p>信言不美，美言不信；善者不辯，辯者不善；知者不博，博者不知。</p><p>信與美相反。信者，內充者也；美者，外飾者也。內充者不求悅人，故辭質而無文；外飾者惟務悅聽，故言甘而少實。是以信道者不以言為工，飾言者不以信為貴。[[美言不信]] 反此義也。</p><p>世人惑於悅耳之言，往往賤樸素而貴浮華。老氏所以獨標信言不美者，，正以破此迷執也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 八十一章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
