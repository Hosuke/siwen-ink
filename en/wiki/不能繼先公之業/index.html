    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 不能繼先公之業</nav></header><main><article><h1>不能繼先公之業</h1><p>莊公失德，不能承先世之業。</p><p>「不能繼先公之業」，毛詩序刺[[考磐]]所述也。言衛莊公失德，不能承繼先世之善政，致使賢者退而窮處。《[[考磐]]》之刺，正在於此——非刺賢者之退，實刺不能用賢者之主也。</p><p><strong>所出</strong>：《詩經 · 考磐》 — https://zh.wikisource.org/wiki/詩經/考磐</p></article></main></div></div>
