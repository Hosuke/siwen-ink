    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 六慾不生</nav></header><main><article><h1>六慾不生</h1><p>六慾不生則三毒消滅，此遣慾澄心之效驗</p><p>[[遣慾澄心|常能遣其慾而心自靜，澄其心而神自清，自然六慾不生，三毒消滅]]。</p><p>六慾者，眼、耳、鼻、舌、身、意所生之嗜慾也。遣之則心靜，澄之則神清，自然不生。入道之要，在乎遣慾。</p><p><strong>所出</strong>：《太上老君說常清靜經》 — https://zh.wikisource.org/wiki/太上老君說常清靜經</p></article></main></div></div>
