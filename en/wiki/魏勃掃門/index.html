    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 魏勃掃門</nav></header><main><article><h1>魏勃掃門</h1><p>魏勃少時掃齊相舍人門外以求見，終至拜為內史。</p><p>魏勃少時，欲見齊相曹參，家貧無以自通，乃常獨早夜埽齊相舍人門外。相舍人怪之，以為物而伺之，得勃。勃曰：「願見相君，無因，故為子掃，欲以求見。」舍人見勃曹參，因以為舍人，一為參御，言事，參以為賢，言之悼惠王。王召見，拜為內史。</p><p><strong>所出</strong>：《史記 · 卷052》 — https://zh.wikisource.org/wiki/史記/卷052</p></article></main></div></div>
