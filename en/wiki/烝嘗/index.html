    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 烝嘗</nav></header><main><article><h1>烝嘗</h1><p>宗廟冬祭，敬祖報功。</p><p>「烝嘗」出自《商頌·烈祖》，乃宗廟之祭名，冬祭曰烝，秋祭曰嘗，總稱四時之祭也。</p><p>詩云「顧予烝嘗」，言祖考在上，眷顧子孫烝嘗之祭也。祭有常時，冬曰烝，秋曰嘗，蓋秋成之際報本反始，故曰嘗；烝者，眾也，冬祭人多，故曰烝。《周禮》「以烝冬享先王」，正此義也。</p><p>商家重祭，烝嘗之禮，所以盡孝享之誠而延祖德於不替也。詩人稱述烝嘗，正見商家祭祀之禮久而不廢，祖德宗功，世世攸賴焉。</p><p><strong>所出</strong>：《詩經 · 烈祖》 — https://zh.wikisource.org/wiki/詩經/烈祖</p></article></main></div></div>
