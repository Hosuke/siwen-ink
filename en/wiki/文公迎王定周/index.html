    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 文公迎王定周</nav></header><main><article><h1>文公迎王定周</h1><p>文公帥師迎王入成周，定之于郟，饗醴命胙。</p><p>二年春，公以二軍下，次於陽樊。右師取昭叔於溫，殺之於隰城。左師迎王於鄭。王入於成周，遂定之於郟。王饗醴，命公胙侑。公請隧以葬，王弗許，曰：「未有錫命。」公曰：「灌享以，將何賴焉？命之長幼，縱不及，而有天獎。」王命逆晉文公以踐土宮。</p><p><strong>所出</strong>：《國語 · 卷10》 — https://zh.wikisource.org/wiki/國語/卷10</p></article></main></div></div>
