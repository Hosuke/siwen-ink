    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 觀天之道執天之行</nav></header><main><article><h1>觀天之道執天之行</h1><p>天道天行，一覽無餘，聖人之學盡於此。</p><p>觀天之道，執天之行，盡矣。</p><p>觀天之道，則天機在我；執天之行，則人道與天合。天道天行，聖人之所以位天地、育萬物者，盡在於此。一言而道之全體大用備焉，學者可不勉哉。</p><p><strong>所出</strong>：《黃帝陰符經集註》 — https://zh.wikisource.org/wiki/黃帝陰符經集註</p></article></main></div></div>
