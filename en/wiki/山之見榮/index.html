    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 山之見榮</nav></header><main><article><h1>山之見榮</h1><p>山中礦脈有表徵，地面上如有榮光者是也。</p><p>管子述伯高之言曰：「苟山之見其榮者，君謹封而祭之。」又云：「上有丹沙者，下有黃金。上有慈石者，下有銅金。上有陵石者，下有鈆錫赤銅。上有赭者，下有鐵。」此山之見榮之說，蓋古人探礦之術也。以地面表徵推地下礦藏，因地制宜，封禁保護。</p><p><strong>所出</strong>：《管子 · 第77篇地數》 — https://zh.wikisource.org/wiki/管子/第77篇地數</p></article></main></div></div>
