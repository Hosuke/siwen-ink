    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 興雨祁祁</nav></header><main><article><h1>興雨祁祁</h1><p>雨澤綏綏，惠我公田</p><p>有渰萋萋，興雨祁祁。雨我公田，遂及我私。渰，雲起也。祁祁，徐也。言雲起而雨徐至，先潤公田，繼及私田也。此見周人制民之法，公私兼顧，澤被上下。</p><p><strong>所出</strong>：《詩經 · 大田》 — https://zh.wikisource.org/wiki/詩經/大田</p></article></main></div></div>
