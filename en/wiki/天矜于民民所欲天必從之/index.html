    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 天矜于民，民之所欲，天必從之</nav></header><main><article><h1>天矜于民，民之所欲，天必從之</h1><p>天心仁愛，視民之欲以為欲，故民欲天必從之。</p><p>天矜于民，民之所欲，天必從之。</p><p>天以子愛為心，不自遂其意，而視民之所欲以為欲。民欲之，天即從之。此言天人一氣，上有好下必甚焉，天監民心故也。伐暴之師，所以順天而不違民也。</p><p><strong>所出</strong>：《尚書 · 泰誓上》 — https://zh.wikisource.org/wiki/尚書/泰誓上</p></article></main></div></div>
