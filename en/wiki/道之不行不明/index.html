    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 道之不行不明</nav></header><main><article><h1>道之不行不明</h1><p>知者過之愚者不及，賢者過之不肖者不及也。</p><p>子曰：「道之不行也，我知之矣，知者過之，愚者不及也；道之不明也，我知之矣，賢者過之，不肖者不及也。人莫不飲食也，鮮能知味也。」知者知之過，賢者行之過，故道所以不行；愚者知之不及，不肖者行之不及，故道所以不明。譬如飲食，人皆日用之而不知味者，以不能精察之也。</p><p><strong>所出</strong>：《中庸 · 中庸章句》 — https://zh.wikisource.org/wiki/四書章句集註/中庸章句</p></article></main></div></div>
