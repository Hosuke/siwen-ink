    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 掘坎南顺</nav></header><main><article><h1>掘坎南顺</h1><p>掘坎以埋沐浴之水及剩余之水。</p><p>掘坎，南順，廣尺，輪二尺，深三尺，南其壤。垼，用塊。此葬前掘坎以埋沐浴餘水及祭器之屬。</p><p><strong>所出</strong>：《儀禮 · 既夕禮》 — https://zh.wikisource.org/wiki/儀禮/既夕禮</p></article></main></div></div>
