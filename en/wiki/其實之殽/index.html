    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 其實之殽</nav></header><main><article><h1>其實之殽</h1><p></p><p>《園有桃》首章云「園有桃，其實之殽」，二章云「園有棘，其實之食」。朱熹《集傳》：「殽，、食，皆可用以享祖考而實之者。」</p><p>  園中有桃，實可為殽；中有棘，實可為食。此以有用之物興賢者在位可用也。然而桃、棘之實，終為殽食之用；賢者之在位，乃不為時所用。此詩人之所以憂也。毛《傳》以「殽」為「殽」，實即「肴」也。</p><p>  <strong>所出</strong>：《詩經 · 園有桃》 — https://zh.wikisource.org/wiki/詩經/園有桃</p></article></main></div></div>
