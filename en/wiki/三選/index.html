    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 三選</nav></header><main><article><h1>三選</h1><p>官長書功，公親見賢，察驗而授官，選拔基層人才之制。</p><p>管仲定三選之制以廣賢路。正月之朝，鄉長退而脩德進賢，公親見之，遂使役官。官長期書功伐以告，且令選官之賢者而復之，覆按其鄉里，考驗其質素。公宣問其鄉里，有功則召而與之坐，省相其質，以參其成功成事，可立而時，設問國家之患而不肉，退而察問其鄉里，以觀其所能，而無大過，登以為上卿之佐。名之曰三選。高子、國子退而脩鄉，鄉退而脩里。由是匹夫有善可得而舉，不善可得而誅。</p><p><strong>所出</strong>：《管子 · 第20篇小匡》 — https://zh.wikisource.org/wiki/管子/第20篇小匡</p></article></main></div></div>
