    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 玩人喪德，玩物喪志</nav></header><main><article><h1>玩人喪德，玩物喪志</h1><p>輕弄人材則德損，溺愛外物則志渝，皆王者之大戒。</p><p>不役耳目，百度惟貞。耳目者，人之所以受役者也；役之則百度失常。耳目不役，則心有主 [[志以道寧]]，而言有歸 [[言以道接]]。若乃玩人者，以人材為戲弄之具，是[[玩人喪德]]；玩物者，以奇玩為娛樂之資，是[[玩物喪志]]。二者皆足以亂心志、敗政事，王者所當深戒也。</p><p><strong>所出</strong>：《尚書 · 旅獒》 — https://zh.wikisource.org/wiki/尚書/旅獒</p></article></main></div></div>
