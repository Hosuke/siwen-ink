    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 知鬼姓名皆吉</nav></header><main><article><h1>知鬼姓名皆吉</h1><p>述知鬼神姓名則萬鬼不干，千神賓伏之理。</p><p>天下男女，汝曹自可按吾圖書視鬼等名，施吾太玄之下符，上三天生炁，三五七九之生，以與天民，天民死而更生。知鬼姓名皆吉，萬鬼不干，千神賓伏。此言鬼神亦有名號，知其名則鬼不敢侵，是辟鬼之要道也。</p><p><strong>所出</strong>：《女青鬼律 · 卷1》 — https://zh.wikisource.org/wiki/女青鬼律/卷1</p></article></main></div></div>
