    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 誰與獨處</nav></header><main><article><h1>誰與獨處</h1><p>亡夫之後，誰能相伴，唯孤獨耳。</p><p>葛生蒙楚，蘞蔓于野。予美亡此，誰與獨處。</p><p>詩人以葛生蒙楚、蘞蔓于野起興，見物之有所依附，而人則所愛已亡，故言「誰與獨處」。由物及情，倍見淒涼。末章「夏之日，冬之夜」「冬之夜，夏之日」，日夜循環，終歸「獨」字，可與此條互見也。</p><p><strong>所出</strong>：《詩經 · 葛生》 — https://zh.wikisource.org/wiki/詩經/葛生</p></article></main></div></div>
