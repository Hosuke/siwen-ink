    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 相國為民請苑</nav></header><main><article><h1>相國為民請苑</h1><p>蕭何請以苑地予民耕種，帝怒而下之，旋赦。</p><p>相國因為民請曰：「長安地狹，上林中多空地，棄，原令民得入田，毋收槁為禽獸食。」上大怒，以為受賈人金而媚民，下之廷尉。王衛尉力諫，帝悟而出之，曰：「相國休矣！相國為民請苑，吾不許，我不過為桀紂主，而相國為賢相。吾故系相國，欲令百姓聞吾過也。」</p><p><strong>所出</strong>：《史記 · 卷053》 — https://zh.wikisource.org/wiki/史記/卷053</p></article></main></div></div>
