    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 丹精生金</nav></header><main><article><h1>丹精生金</h1><p>仙經雲丹精生金，此是以丹作金之說，故山中有丹砂者，其下多有金。</p><p>仙經雲：「丹精生金。」此是以丹作金之說也。故山中有丹砂，其下多有金。</p><p>且夫作金成則為真物，中表如一，百煉不減。故其方曰可以為釘，明其堅勁也。此則得夫自然之道也，故其能之，何謂詐乎？</p><p><strong>所出</strong>：《抱朴子 · 卷16》 — https://zh.wikisource.org/wiki/抱朴子/卷16</p></article></main></div></div>
