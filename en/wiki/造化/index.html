    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 造化</nav></header><main><article><h1>造化</h1><p>造化者，天地陰陽之運，萬物之所以生成。</p><p>造化者，陰陽迭運之功，萬物由此而生化。須以造化，精氣乃舒者，言精氣之流行發越，必資造化之運以為鼓動。坎離之精、乾坤之氣，皆稟此造化之機而舒達於外。</p><p><strong>所出</strong>：《周易參同契 · 16章》 — https://zh.wikisource.org/wiki/周易參同契/16章</p></article></main></div></div>
