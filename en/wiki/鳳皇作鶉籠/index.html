    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 鳳皇作鶉籠</nav></header><main><article><h1>鳳皇作鶉籠</h1><p>聖賢被置於不堪之地，雖欲伸展而不能，比賢才困於小人之局。</p><p>鳳皇作鶉籠，比聖賢被置於不堪之地也。[[哀時命]]云「為鳳皇作鶉籠兮，雖翕翅其不容」，言大聖大賢之人，若置之於編民之列、凡俗之伍，如以鳳皇為鶉而作籠育之，雖欲斂翼棲止而終不能容納也。蓋上文言「世並舉而好朋兮，壹斗斛而相量。衆比周以肩迫兮，賢者遠而隱藏」，故設此喻，以見世俗嫉賢害能，聖智之士無所容其身矣。</p><p><strong>所出</strong>：《楚辭 · 哀時命》 — https://zh.wikisource.org/wiki/楚辭/哀時命</p></article></main></div></div>
