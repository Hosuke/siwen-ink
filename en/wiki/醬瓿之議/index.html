    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 醬瓿之議</nav></header><main><article><h1>醬瓿之議</h1><p>好文見斥於世俗，終以覆醬瓿，比知音之難得。</p><p>醬瓿之議，豈多歎哉。</p><p>[[樓護]]學不逮文，而信偽迷真，妄稱[[史遷]]之書出於[[東方朔]]，[[桓譚]]之徒相顧嗤笑。夫好文而無鑒，反以覆醬瓿，此[[屈平]]所謂「衆不知餘之異采」者也。世之知音希覯，佳作蒙羞，可勝歎哉。</p><p><strong>所出</strong>：《文心雕龍 · 知音》 — https://zh.wikisource.org/wiki/文心雕龍/知音</p></article></main></div></div>
