    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 霸王之本</nav></header><main><article><h1>霸王之本</h1><p>百姓者，霸王之本也。</p><p>管子對桓公曰：「齊國百姓，公之本也。」又曰：「君若將欲霸王，舉大事乎，則必從其本事矣。」蓋霸王之功業，非一己之智力所能成，必以民為本。輕其稅斂，則人不憂飢；緩其刑政，則人不懼死；舉事以時，則人不傷勞。三者既行，百姓歸之如水，流徙者復還，荒蕪者悉治，霸王之基由此立矣。</p><p><strong>所出</strong>：《管子 · 第22篇霸形》 — https://zh.wikisource.org/wiki/管子/第22篇霸形</p></article></main></div></div>
