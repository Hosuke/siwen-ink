    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 仍舊貫</nav></header><main><article><h1>仍舊貫</h1><p>閔子騫以為仍用舊制，何必改作；夫子稱其言必中。</p><p>魯人爲長府。閔子騫曰：「仍舊貫，如之何？何必改作？」子曰：「夫人不言，言必有中。」</p><p>魯人欲改作長府，閔子以為仍用舊制足矣，何必多事。夫子稱之，以其言簡而當也。儉德之可尚如此。</p><p><strong>所出</strong>：《論語 · 先進第十一》 — https://zh.wikisource.org/wiki/論語/先進第十一</p></article></main></div></div>
