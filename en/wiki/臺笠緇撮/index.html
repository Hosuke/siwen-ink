    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 臺笠緇撮</nav></header><main><article><h1>臺笠緇撮</h1><p>古者士庶之常服，以臺為笠，以緇布撮冠</p><p>彼都人士，臺笠緇撮。</p><p>語出《詩經·小雅·都人士》。臺，莎草也，可為笠；緇，黑緦布也；撮，小冠也。言彼都人士，或戴臺草之笠，或服緦布之冠，皆儉素而有常度。此古者士庶之常服，所以別於奇服異冠也。</p><p><strong>所出</strong>：《詩經 · 都人士》 — https://zh.wikisource.org/wiki/詩經/都人士</p></article></main></div></div>
