    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 二八</nav></header><main><article><h1>二八</h1><p>陰陽相合之數，金丹成象之徵</p><p>二八者，十六之數也。一月上弦，水中之金八兩；下弦，金中之水八兩。二八合為一斤，金水勻和，光輝不偏不倚，至中至正，丹法取此兩弦之象。以陰中之陽為真陽，即上弦也；陽中之陰為真陰，即下弦也。陰中之陽，陽與陰和；陽中之陰，陰與陽和。真陰真陽相合，合而為一，是謂二八一斤，金丹成象。律詩十六首，表二八者，即表此也。</p><p><strong>所出</strong>：《悟真直指 · 卷一》 — https://zh.wikisource.org/wiki/悟真直指/卷一</p></article></main></div></div>
