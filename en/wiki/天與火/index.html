    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 天與火</nav></header><main><article><h1>天與火</h1><p>同人之象，天火相資</p><p>「天與火」者，[[同人]][[象曰]]所述之卦象也。</p><p>[[乾]]上[[離]]下，天在火上。天者剛健無私，火者文明普照。天無私覆，火無私照，二者之德同而不相悖，故卦名「同人」。</p><p>天在上而無言，火炎上而能燭遠。[[君子以類族辨物]]，法天之無私，法火之能照，使天下之人各得其分而心和，此聖人治世之象也。</p><p><strong>所出</strong>：《周易 · 同人》 — https://zh.wikisource.org/wiki/周易/同人</p></article></main></div></div>
