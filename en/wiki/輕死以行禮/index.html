    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 輕死以行禮</nav></header><main><article><h1>輕死以行禮</h1><p>真正的勇，在於以禮為先，不避死亡。</p><p>晏子論勇曰：「輕死以行禮謂之勇，誅暴不避強謂之力。」又曰：「勇力之立也，以行其禮義也。」言勇之極至，非暴虎馮河之謂，乃輕生死、行禮義之事也。湯武誅暴而不逆，並國而不貪，皆本此義以立事。及至衰世，勇力之士行禮義者鮮，徒恃強悍，凌轢天下，終致桀紂以滅。是故勇力本乎禮義，禮義亡則勇力為寇。</p><p><strong>所出</strong>：《晏子春秋 · 卷一》 — https://zh.wikisource.org/wiki/晏子春秋/卷一</p></article></main></div></div>
