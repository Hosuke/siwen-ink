    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 命屬生星</nav></header><main><article><h1>命屬生星</h1><p></p><p>「命屬生星」乃抱朴子所言，命之脩短皆由所值，受氣結胎各有星宿之說。葛洪以為，人之生也，稟氣結胎之時，各有星宿值命。命屬生星者，其人必好仙道，求之亦必得；命屬死星者，則不信仙道，亦不自修其事。此說以天道無為、任物自然為前提，謂人之所樂善否，判於所稟，移易予奪，非天所能干預。</p><p>抱朴子以金石消於爐冶、瓦器甄於陶灶為喻，說明雖由之以成形，而銅鐵之利鈍、罋罌之邪正，適遇所遭，非複爐灶之事。斯乃主張命運稟受各有定分，非人力可強致，亦非天地刻意偏私。</p></article></main></div></div>
