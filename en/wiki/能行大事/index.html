    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 能行大事</nav></header><main><article><h1>能行大事</h1><p>商臣問潘崇能否行弒君之事，崇以江芊怒言激之，商臣乃言「能」。</p><p>商臣聞之而未察，告其師潘崇曰：「若之何而察之？」潘崇曰：「享江芊而勿敬也。」從之。江芊怒曰：「呼，役夫！宜君王之欲殺女而立職也。」告潘崇曰：「信矣。」潘崇曰：「能事諸乎？」曰：「不能。」「能行乎？」曰：「不能。」「能行大事乎？」曰：「能。」</p><p><strong>所出</strong>：《春秋左氏傳 · 文公》 — https://zh.wikisource.org/wiki/春秋左氏傳/文公</p></article></main></div></div>
