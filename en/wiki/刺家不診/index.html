    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 刺家不診</nav></header><main><article><h1>刺家不診</h1><p>刺家聽病者言，在頭刺至骨，在皮中者刺皮，隨病所在而刺之。</p><p>刺家不診，聽病者言。在頭，頭疾痛，為藏針之，刺至骨病已，上無傷骨肉及皮，皮者道也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第十四卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十四卷</p></article></main></div></div>
