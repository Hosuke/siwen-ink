    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 五教</nav></header><main><article><h1>五教</h1><p>目、身、足、手、心，五者皆教，士乃可用。</p><p>教其目以形色之旗，教其身以號令之數，教其足以進退之度，教其手以長短之利，教其心以賞罰之誠。五教各習，而士負以勇矣。</p><p><strong>所出</strong>：《管子 · 第17篇兵法》 — https://zh.wikisource.org/wiki/管子/第17篇兵法</p></article></main></div></div>
