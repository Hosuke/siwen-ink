    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 榛楛濟濟</nav></header><main><article><h1>榛楛濟濟</h1><p>榛楛叢生，以喻君子育成人材，蔚然可觀。</p><p>旱麓之上，榛木楛木濟濟而茂。榛楛皆灌木，叢生則蔚然成林。詩言「榛楛濟濟」，以草木之盛興人材之多。君子有美化之功，人材勃興，如林之榛楛，不可勝用也。二章「遐不作人」承此而言，君子不作人而人材自成，是德化之驗也。</p><p><strong>所出</strong>：《詩經 · 旱麓》 — https://zh.wikisource.org/wiki/詩經/旱麓</p></article></main></div></div>
