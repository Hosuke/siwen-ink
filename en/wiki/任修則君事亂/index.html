    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 任修則君事亂</nav></header><main><article><h1>任修則君事亂</h1><p>修士未必智，委以斷事則必亂政。</p><p>修士者未必智，爲潔其身、因惑其智。以愚人之所愴，處治事之官而爲其所然，則事必亂矣。是以[[任人以事]]之道，必兼有術。</p><p><strong>所出</strong>：《韓非子 · 八說》 — https://zh.wikisource.org/wiki/韓非子/八說</p></article></main></div></div>
