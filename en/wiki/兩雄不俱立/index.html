    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 兩雄不俱立</nav></header><main><article><h1>兩雄不俱立</h1><p>陸賈以天道折趙佗，佗悟而去帝號，稱臣奉貢。</p><p>陸賈至南越，王甚恐，為書謝，稱蠻夷大長不敢竊帝號。乃下令國中曰：「吾聞兩雄不俱立，兩賢不並世。皇帝，賢天子也。自今以後，去帝制黃屋左纛。」</p><p><strong>所出</strong>：《史記 · 卷113》 — https://zh.wikisource.org/wiki/史記/卷113</p></article></main></div></div>
