    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 七八十五</nav></header><main><article><h1>七八十五</h1><p>七八合十五，九六亦十五，四者合三十，陽炁循是以生藏。</p><p>七八數十五者，少陽之數七加少陰之數八，合得十五。九六亦相應者，老陽之數九加老陰之數六，亦得十五。四者合三十者，七加八加九加六，共得三十，是一月之象也。</p><p>陽炁循是以生藏：生于一三之日，盛于十五之期，斂藏于三十之晦，而[[龍鳳迭化]]之機在此數中矣。</p><p>[[月體納甲]]以月之明闇驗此數，[[八卦布列曜]]以卦之象位定此數，皆聖人所以上觀天符者也。</p><p><strong>所出</strong>：《周易參同契 · 04章》 — https://zh.wikisource.org/wiki/周易參同契/04章</p></article></main></div></div>
