    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 匈奴畜產</nav></header><main><article><h1>匈奴畜產</h1><p>匈奴畜馬牛羊，其奇畜有橐駝、驢、驘、駃騠、騊駼、騨騱。</p><p>匈奴，其畜之所多則馬、牛、羊，其奇畜則橐駝、驢、驘、駃騠、騊駼、騨騱。</p><p><strong>所出</strong>：《史記 · 卷110》 — https://zh.wikisource.org/wiki/史記/卷110</p></article></main></div></div>
