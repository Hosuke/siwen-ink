    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 墨氏兼愛是無父也</nav></header><main><article><h1>墨氏兼愛是無父也</h1><p>墨翟兼愛之說，廢親疏之別，故孟子斥之為無父。</p><p>楊朱、墨翟之言盈天下。天下之言，不歸楊則歸墨。楊氏為我，是無君也；墨氏兼愛，是無父也。無父無君，是禽獸也。公明儀曰：「庖有肥肉，廐有肥馬，民有饑色，野有餓莩，此率獸食人也。」楊墨之道不息，孔子之道不著，是邪說誣民、充塞仁義也。</p><p><strong>所出</strong>：《孟子 · 滕文公下》 — https://zh.wikisource.org/wiki/孟子/滕文公下</p></article></main></div></div>
