    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 人自獻于先王</nav></header><main><article><h1>人自獻于先王</h1><p>各以己心之是，奉於先王，不問成敗</p><p>父師終言：「自靖，人自獻于先王。」言各人自安其志，以己心之是者獻於先王，不以成敗利鈍易其節。時殷將亡，而臣子猶各行其是，不以國亡而渝其志，所謂主辱臣死者，蓋如此矣。</p><p><strong>所出</strong>：《尚書 · 微子》 — https://zh.wikisource.org/wiki/尚書/微子</p></article></main></div></div>
