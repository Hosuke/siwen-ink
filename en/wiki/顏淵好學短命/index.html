    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 顏淵好學短命</nav></header><main><article><h1>顏淵好學短命</h1><p>顏淵好學而不幸短命，夫子深惜之。</p><p>季康子問：「弟子孰爲好學？」孔子對曰：「有顏回者好學，不幸短命死矣。今也則亡。」</p><p>季康子問誰為好學，夫子以顏淵對，且惜其短命。言「今也則亡」，見夫子之傷痛深矣。</p><p><strong>所出</strong>：《論語 · 先進第十一》 — https://zh.wikisource.org/wiki/論語/先進第十一</p></article></main></div></div>
