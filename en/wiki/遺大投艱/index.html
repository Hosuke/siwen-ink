    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 遺大投艱</nav></header><main><article><h1>遺大投艱</h1><p>天以大艱投朕，朕不敢自恤。</p><p>朕遭天役，天遺大艱於朕躬，朕不敢自恤也。</p><p>「予造（遭）天役，遺大投艱于朕身，越予沖人，不卬自恤。」</p><p>言朕蒙天之役，天以大艱投朕，朕沖人豈當自恤其身而不任之哉。</p><p><strong>所出</strong>：《尚書 · 大誥》 — https://zh.wikisource.org/wiki/尚書/大誥</p></article></main></div></div>
