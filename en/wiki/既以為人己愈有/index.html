    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 既以為人己愈有</nav></header><main><article><h1>既以為人己愈有</h1><p>施之於人者，其德日新</p><p>聖人无積，既以為人，己愈有。</p><p>言聖人體道而行，無私蓄積於己。及其利人濟物，輔之以德，成其功而民化之，則其德愈進於廣大，是愈有也。老子貴「為而不有」，施而不望報，以其无積故能周流無盡，愈施而愈裕。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第三十一章 不積》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
