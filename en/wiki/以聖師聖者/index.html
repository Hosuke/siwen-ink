    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 以聖師聖者</nav></header><main><article><h1>以聖師聖者</h1><p>以聖師聖者徇跡忘道，以賢師聖者反跡合道。</p><p>以聖師聖者，賢人；以賢師聖者，聖人。蓋以聖師聖者，徇跡而忘道；以賢師聖者，反跡而合道。</p><p>賢人趨上而不見下，眾人趨下而不見上，聖人通乎上下，惟其宜之，豈曰離賢人眾人，別有聖人也哉。</p><p><strong>所出</strong>：《關尹子 · 3》 — https://zh.wikisource.org/wiki/關尹子/3</p></article></main></div></div>
