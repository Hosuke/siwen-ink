    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 隆一而治二而亂</nav></header><main><article><h1>隆一而治二而亂</h1><p>一國二隆，未有不亂；尊卑一統，天下乃治。</p><p>君者，國之隆也；父者，家之隆也。隆一而治，二而亂，自古及今，未有二隆爭重而能長久者。[[上下不交天下无邦]] 之義相近。</p><p><strong>所出</strong>：《荀子 · 致士篇》 — https://zh.wikisource.org/wiki/荀子/致士篇</p></article></main></div></div>
