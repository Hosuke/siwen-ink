    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 升車</nav></header><main><article><h1>升車</h1><p>登車正立執綏，車中儀止端肅。</p><p>升車之時，必正立執綏。綏者，轅上之索，以備攀引者也。正立者，無傾側之容；執綏者，慎啟行之節。車中不內顧，不疾言，不親指。內顧則失容，疾言則擾眾，親指則涉妄。</p><p>此[[孔子]]乘車之威儀也。動容周旋，無往不合禮法。</p><p><strong>所出</strong>：《論語 · 鄉黨第十》 — https://zh.wikisource.org/wiki/論語/鄉黨第十</p></article></main></div></div>
