    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 矢其文德</nav></header><main><article><h1>矢其文德</h1><p>天子布文德於天下，以德綏四國。</p><p>「明明天子，令聞不已。矢其文德，洽此四國。」《毛傳》：「矢，施也。洽，合也。」言天子既有明明之德，美名流聞而無已；又能施其文德，合此四國之人心也。武功既定之後，必以文德終之，此[[耀德不觀兵]]之意，而[[文武吉甫]]之遺烈亦於茲見之。</p><p><strong>所出</strong>：《詩經 · 江漢》 — https://zh.wikisource.org/wiki/詩經/江漢</p></article></main></div></div>
