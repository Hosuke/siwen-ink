    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 厚者為戮薄者見疑</nav></header><main><article><h1>厚者為戮薄者見疑</h1><p>智同而處異，厚者見殺，薄者被疑。</p><p>宋有富人，天雨墻壞。其子曰：「不築，必將有盜。」其鄰人之父亦云。暮而果大亡其財。其家甚智其子，而疑隣人之父。此二人說者皆當矣，厚者為戮，薄者見疑，則非知之難也，處知則難也。</p><p><strong>所出</strong>：《韓非子 · 說難》 — https://zh.wikisource.org/wiki/韓非子/說難</p></article></main></div></div>
