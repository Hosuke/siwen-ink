    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 他山之石可以攻玉</nav></header><main><article><h1>他山之石可以攻玉</h1><p>借彼之外物以切磋己身，以喻納諫礪德當資於人。</p><p>鶴鳴于九皋，聲聞于天。魚在于渚，或潛在淵。樂彼之園，爰有樹檀，其下維穀。他山之石，可以攻玉。</p><p>玉待攻而成器，石待錯而後利。他山之石，本非美材，然可以用以攻玉；猶異國之賢、本處之諫言，雖非己有，善用之則可以成德。以喻人當廣納諷諫，雖賤者亦有所長，不可忽也。</p><p><strong>所出</strong>：《詩經 · 鶴鳴》 — https://zh.wikisource.org/wiki/詩經/鶴鳴</p></article></main></div></div>
