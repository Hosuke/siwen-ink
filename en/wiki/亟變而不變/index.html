    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 亟變而不變</nav></header><main><article><h1>亟變而不變</h1><p>世事亟變而治道有常，唯通變乃能守常。</p><p>治國之要在通變，然變之中有不变者存。管子言治國之道兼取五家之法，而終之以「亟變而不變」。亟變者，隨時之推移而設施不同也；不變者，守其要道而不搖也。五帝殊制而用一，是變也；而其所以為治者，未嘗變焉。是以聖人隨時而立儀，而不失其常；應變而不惑，而永守其本。</p><p><strong>所出</strong>：《管子 · 第79篇國準》 — https://zh.wikisource.org/wiki/管子/第79篇國準</p></article></main></div></div>
