    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 刑廉而不赦</nav></header><main><article><h1>刑廉而不赦</h1><p>刑罰當廉且不濫赦，乃為治世之法。</p><p>[[管仲]]言[[為天下]]之道：「刑廉而不赦。」刑罰貴廉，廉者不濫也；又不赦，赦則法廢。[[刑廉而不赦]]，與「賞不加於無功」相對，皆[[賞罰以信]]之要。</p><p><strong>所出</strong>：《管子 · 第19篇中匡》 — https://zh.wikisource.org/wiki/管子/第19篇中匡</p></article></main></div></div>
