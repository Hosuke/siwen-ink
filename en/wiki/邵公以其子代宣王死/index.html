    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 邵公以其子代宣王死</nav></header><main><article><h1>邵公以其子代宣王死</h1><p>邵公以己子代宣王於難</p><p>彘之亂，宣王在邵公之宮，國人圍之。邵公曰：「昔吾驟諫王，王不從，是以及此難。今殺王子，王其以我為懟而怒乎！夫事君者險而不懟，怨而不怒，況事王乎？」乃以其子代宣王，宣王乃長而立之。言人臣事君，雖蹈危險而不可以怨懟；邵公舍子以全王，正其義也。</p><p><strong>所出</strong>：《國語 · 卷01》 — https://zh.wikisource.org/wiki/國語/卷01</p></article></main></div></div>
