    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 齊子歸止</nav></header><main><article><h1>齊子歸止</h1><p>文姜數往來於齊，其從者甚盛，詩人刺之</p><p>「齊子」者，魯桓公夫人文姜也。姜氏出於齊，歸魯而為國母，然不能守禮，反數與齊襄公私通，往來無度。《春秋》書「夫人姜氏孫于邾」「公與夫人姜氏遂如齊」，皆其事也。</p><p>詩言「齊子歸止」，歸者，歸齊也。文姜既嫁於魯，不當頻歸母國；今歸止若此，是淫佚之行也。《序》云「齊人惡魯桓公微弱，不能防閑文姜，使至淫亂，為二國患焉」，此之謂也。</p><p><strong>所出</strong>：《詩經 · 敝笱》 — https://zh.wikisource.org/wiki/詩經/敝笱</p></article></main></div></div>
