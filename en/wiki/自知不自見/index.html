    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 自知不自見</nav></header><main><article><h1>自知不自見</h1><p>聖人知己之明而不顯己以示人。</p><p>帛書本云「自知而不自見」，王弼本則作「自見不明」，文義小異。帛書義謂聖人自知其己，而不以之自見於人；蓋自見者，矜示之謂也，正與 [[自見不明]] 相反。</p><p>  <strong>所出</strong>：《老子 (帛書本) · 章七十二》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p><hr><p>聖人自知之得失，藏之於內，而不顯見德美於外；自愛其身以保精氣，而不貴高名於世。</p><p>  <strong>所出</strong>：《老子河上公章句 · 愛己》 — https://zh.wikisource.org/wiki/老子河上公章句/德經
===</p></article></main></div></div>
