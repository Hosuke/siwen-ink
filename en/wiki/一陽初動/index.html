    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 一陽初動</nav></header><main><article><h1>一陽初動</h1><p>修煉下手，必待一陽初動、真鉛始生之候。</p><p>學者下手之初，必須知一陽初動之候，真鉛始生之時，其氣迅速如電，而不能久居於先天，霎時而生癸水，頃刻而變經流。迨至生形化，質已屬後天，而不可用矣。太極將判之閒，靜以極而未至於動，陽初復而未離乎陰。候此眞先炁天降，以法追攝，送入黃庭之中。</p><p><strong>所出</strong>：《張三丰先生全集 · 卷3》 — https://zh.wikisource.org/wiki/張三丰先生全集/卷3</p></article></main></div></div>
