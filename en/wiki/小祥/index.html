    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 小祥</nav></header><main><article><h1>小祥</h1><p>父母之喪，期而行之祭，祥祭之始也。</p><p>小祥者，期而祭之祥也。士虞禮《記》末云：「期而小祥，曰：『薦此常事。』」又期而大祥。小祥之祭，主人去凶服之重，漸近吉禮，然猶未純吉，故祭告止稱「常事」，以示哀慕未忘，禮節漸殺之義也。</p><p><strong>所出</strong>：《儀禮 · 士虞禮》 — https://zh.wikisource.org/wiki/儀禮/士虞禮</p></article></main></div></div>
