    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 屈申之喻</nav></header><main><article><h1>屈申之喻</h1><p>屈寸而申尺，小枉而大直；君子之過，猶日月之蝕，不害於明。</p><p>屈者所以求申也，枉者所以求直也。屈寸申尺，小枉大直，君子為之。百川並流，不注海者不為谷；趨行殊方，不歸善者不為君子。善言貴乎可行，善行貴乎仁義。夫君子之過，猶日月之蝕，不害於明。故智者不妄為，勇者不妄殺，擇是而為之，計禮而行之。</p><p><strong>所出</strong>：《文子 · 卷十一》 — https://zh.wikisource.org/wiki/文子/卷十一</p></article></main></div></div>
