    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 野馬也，塵埃也</nav></header><main><article><h1>野馬也，塵埃也</h1><p>天地之間，萬物皆有所待，以息相吹而已。</p><p>野馬也，塵埃也，生物之以息相吹也。天之蒼蒼，其正色邪？其遠而無所至極邪？其視下也，亦若是則已矣。</p><p>野馬游氣，塵埃浮游，皆微物也，然亦有所待而動。鵬之九萬里，固恃風矣；野馬塵埃，亦以息吹。是故物之小大高下，雖不相同，而其有所待則一也。</p><p><strong>所出</strong>：《莊子 · 逍遙遊》 — https://zh.wikisource.org/wiki/莊子/逍遙遊</p></article></main></div></div>
