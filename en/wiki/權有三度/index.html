    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 權有三度</nav></header><main><article><h1>權有三度</h1><p>為政當考三度：上度天祥，下度地宜，中度人順。</p><p>曰：民知務矣，而未知權，然後考三度以動之。</p><p>所謂三度者何？曰：上度之天祥，下度之地宜，中度之人順，此所謂三度。</p><p>故曰：天時不祥，則有水旱；地道不宜，則有飢饉；人道不順，則有禍亂。此三者之來也，政召之。曰：審時以舉事，以事動民，以民動國，以國動天下，天下動然後功名可成也。</p><p><strong>所出</strong>：《管子 · 第10篇五輔》 — https://zh.wikisource.org/wiki/管子/第10篇五輔</p></article></main></div></div>
