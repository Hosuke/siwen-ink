    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 定國淫亂</nav></header><main><article><h1>定國淫亂</h1><p>燕康王之子定國，禽獸行亂，姦父姬、奪弟妻，終以罪誅，國除為郡。</p><p>澤王燕二年薨，傳子嘉，是為康王。康王子定國，與父康王姬姦，生子男一人；奪弟妻為姬；又與子女三人姦。定國有所欲誅殺臣肥如令郢人，郢人等告之，定國使謁者以他法劾捕格殺郢人以滅口。元朔元年，郢人昆弟復上書具言定國陰事，詔下公卿，皆議曰：「定國禽獸行，亂人倫，逆天，當誅。」上許之。定國自殺，國除為郡。</p><p><strong>所出</strong>：《史記 · 卷051》 — https://zh.wikisource.org/wiki/史記/卷051</p></article></main></div></div>
