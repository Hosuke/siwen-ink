    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 無為首生脊死為尻</nav></header><main><article><h1>無為首生脊死為尻</h1><p>以無為首、以生為脊、以死為尻，知死生存亡一體者，方可為友。</p><p>子祀、子輿、子犁、子來四人相與語曰：「孰能以无爲首，以生爲脊，以死爲尻？孰知死生存亡之一體者，吾與之友矣。」</p><p><strong>所出</strong>：《莊子 · 大宗師》 — https://zh.wikisource.org/wiki/莊子/大宗師</p></article></main></div></div>
