    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 有真人然後有真知</nav></header><main><article><h1>有真人然後有真知</h1><p>所持者明則知明，所持者闇則知闇；真人持明，故能知是非之真</p><p>天不定，日月無所載；地不定，草木無所植；所立於身者不寧，是非無所形。是故有真人然後有真知。夫所持者不明，庸詎知吾所謂知之非不知歟？真人抱神處靜，持心若鏡、若止水，足以照見萬物之實，而不以區區耳目之分別其是非。</p><p><strong>所出</strong>：《淮南子 · 俶真訓》 — https://zh.wikisource.org/wiki/淮南子/俶真訓</p></article></main></div></div>
