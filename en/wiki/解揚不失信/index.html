    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 解揚不失信</nav></header><main><article><h1>解揚不失信</h1><p>解揚被執而許以約言，終致晉師令宋勿降楚</p><p>晉使解揚過鄭，鄭與楚親，乃執解揚而獻楚。楚王厚賜與約，使反其言，令宋趣降。解揚登樓車，令呼宋，遂負楚約而致其晉君命曰：「晉方悉國兵以救宋，宋雖急，愼毋降楚，晉兵今至矣！」楚王大怒，將殺之。解揚曰：「君能制命為義，臣能承命為信。受吾君命以出，有死無隕。」楚王赦之使歸。晉爵之為上卿。</p><p><strong>所出</strong>：《史記 · 卷042》 — https://zh.wikisource.org/wiki/史記/卷042</p></article></main></div></div>
