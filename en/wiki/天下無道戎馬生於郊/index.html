    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 天下無道戎馬生於郊</nav></header><main><article><h1>天下無道戎馬生於郊</h1><p>無道之君内暴虐而外侵欺，畜生少而戎馬乏，近臣遂被役使。</p><p>人君無道，則内暴虐其民，而外侵欺其鄰國。内暴虐則民産絶，外侵欺則兵數起。民産絶則畜生少，兵數起則士卒盡。畜生少則戎馬乏，士卒盡則軍危殆。戎馬乏則牸馬出，軍危殆則近臣役。馬者，軍之大用；郊者，言其近也。今所以給軍之具於牸馬近臣。故曰：「天下無道，戎馬生於郊矣。」</p><p><strong>所出</strong>：《韓非子 · 解老》 — https://zh.wikisource.org/wiki/韓非子/解老</p></article></main></div></div>
