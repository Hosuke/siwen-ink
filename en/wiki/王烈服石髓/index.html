    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 王烈服石髓</nav></header><main><article><h1>王烈服石髓</h1><p>青泥如髓搏之成石</p><p>王烈常服黃精並煉鉛。入太行山，聞裂聲，往視，山斷數百丈，有青泥出如髓，取搏之，須臾成石，如熱臘之狀，食之味如粳米。仙經云：「神仙五百歲輒一開，其中有髓，得服之與天地齊畢。」</p><p><strong>所出</strong>：《神仙傳 · 卷六》 — https://zh.wikisource/wiki/神仙傳/卷六</p></article></main></div></div>
