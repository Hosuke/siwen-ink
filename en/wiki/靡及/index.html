    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 靡及</nav></header><main><article><h1>靡及</h1><p>常恐德不足以任事，智不足以周物。</p><p>「每懷靡及」，見於《詩·小雅·皇皇者華》首章。</p><p>「靡及」者，不能及也。言使者深感責任之重，馳驅於原隰之間，雖盡心竭力，仍恐德有未逮、智有未周，不能遍及天下之事。此非謙讓之辭，乃敬畏之心的見於言表者。</p><p>後世引申其義，凡居官任事、心存戒懼、不敢自足者，皆可本此以為誡。</p><p><strong>所出</strong>：《詩經 · 皇皇者華》 — https://zh.wikisource.org/wiki/詩經/皇皇者華</p></article></main></div></div>
