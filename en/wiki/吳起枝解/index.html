    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 吳起枝解</nav></header><main><article><h1>吳起枝解</h1><p>吳起行改革以強楚，悼王薨而身被肢解，以言論不當時也。</p><p>吳起枝解於楚。悼王用吳起之策，收封君子孫之爵禄，損百吏之秩，欲以強國。期年而悼王薨，吳起被肢解而死。</p><p>枝解，分解肢體之刑也。吳起志在強楚，而舊貴族疾之甚。悼王在則吳起有恃，悼王沒則吳起無援。吳起之死，非死於無罪，死於有益於國而有害於大臣也。</p><p><strong>所出</strong>：《韓非子 · 和氏》 — https://zh.wikisource.org/wiki/韓非子/和氏</p></article></main></div></div>
