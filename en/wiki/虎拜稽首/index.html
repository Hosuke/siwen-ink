    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 虎拜稽首</nav></header><main><article><h1>虎拜稽首</h1><p>召虎受命受賞，稽首以拜天子之休命。</p><p>「虎拜稽首，天子萬年。」「虎拜稽首，對揚王休。」《江漢》六章，召虎受天子之冊命，賜以圭瓚、秬鬯、土田，乃再拜稽首以謝。稽首者，臣見君之極敬也。[[對揚王休]]，即[[明明天子令聞不已]]之實效。拜稽之禮行，而[[作召公考天子萬壽]]之辭出焉。</p><p><strong>所出</strong>：《詩經 · 江漢》 — https://zh.wikisource.org/wiki/詩經/江漢</p></article></main></div></div>
