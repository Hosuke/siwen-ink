    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 從陰引陽，從陽引陰</nav></header><main><article><h1>從陰引陽，從陽引陰</h1><p>善用針者，從陰引陽，從陽引陰，以右治左，以左治右。</p><p>語出 [[陰陽應象大論]]。歧伯云：「善用針者，從陰引陽，從陽引陰，以右治左，以左治右，以我知彼，以表知裏，以觀過與不及之理，見微得過，用之不殆。」</p><p>針刺之法，不直攻病所，而從其對面引之。病在陽者，取陰經以引之；病在陰者，取陽經以引之。右有病治左，左有病治右，此巨刺之法也。皆所以調陰陽之偏勝，使其歸於和平。</p><p><strong>所出</strong>：《黃帝內經 · 素問第二卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第二卷
===終::</p></article></main></div></div>
