    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 公歸</nav></header><main><article><h1>公歸</h1><p>公歸無所，言賢者去而不返也。</p><p>詩言「公歸無所」，又言「公歸不復」。無所者，去而無棲止之所也；不復者，一去而不可再還也。[[鴻飛]]之喻，正謂此義。賢者之去，朝廷無以留之。《九罭》刺朝廷之不知賢，故欲[[信處信宿]]以留君子，而終無如之何也。</p><p><strong>所出</strong>：《詩經 · 九罭》 — https://zh.wikisource.org/wiki/詩經/九罭</p></article></main></div></div>
