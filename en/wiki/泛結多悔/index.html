    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 泛結多悔</nav></header><main><article><h1>泛結多悔</h1><p>廣交而不慎，後悔必多；交友之道，當先择而後交。</p><p>《抱朴子》曰：「吾聞詳交者不失人，而泛結者多後悔。故曩哲先择而後交，不先交而後择也。」夫厚則親愛生焉，薄則嫌隙結焉，自然之理也，可不詳择乎！知人之明，上聖所難，而欲力厲近才、短於鑒物者，務廣其交，又欲使悉得，可與經夷險而不易情、歷危苦而相負荷者，未見其可多得也。天下不為盡不中交，率於為益者寡而生累者眾。故交友當慎之於始，不可泛濫而結之。</p><p><strong>所出</strong>：《抱朴子 · 卷16》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷16</p></article></main></div></div>
