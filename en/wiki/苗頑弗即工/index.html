    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 苗頑弗即工</nav></header><main><article><h1>苗頑弗即工</h1><p>三苗頑逆不服，堯舜之世未能盡化。</p><p>「各迪有功，苗頑弗即工」，言天下各盡其功，惟三苗之頑，不肯就功也。苗頑者，九黎之後，崇信姦宄，不用堯舜之教化者也。禹治水成功，獨苗未服，帝堯以其頑梗，深念之。然「迪由知天威」，威德並行，苗之不服者終將化也已。</p><p><strong>所出</strong>：《尚書 · 皐陶謨》 — https://zh.wikisource.org/wiki/尚書/皐陶謨</p></article></main></div></div>
