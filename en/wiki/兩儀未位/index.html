    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 兩儀未位</nav></header><main><article><h1>兩儀未位</h1><p>河龍負圖犧皇畫卦，仰觀俯察，八象窮天地之情。</p><p>原夫兩儀未位，神用藏於視聽，一氣化矣至隱乎名言。於是河龍負圖犧皇畫卦，仰觀俯察，逺物近身，八象窮天地之情，六位備剛柔之體。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷10》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷10</p></article></main></div></div>
