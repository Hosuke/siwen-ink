    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 恭謹無與比</nav></header><main><article><h1>恭謹無與比</h1><p>恭謹之德，無有可比。</p><p>萬石君石奮，「無文學，恭謹無與比」。言其人雖不通書傳，而恭敬謹慎之德，超邁時流，莫之能及也。太史公序石氏父子，以恭謹傳家，因是以著其風。</p><p><strong>所出</strong>：《史記 · 卷103》 — https://zh.wikisource.org/wiki/史記/卷103</p></article></main></div></div>
