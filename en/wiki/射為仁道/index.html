    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 射者仁之道</nav></header><main><article><h1>射者仁之道</h1><p>射求正諸己，反求諸己，不怨勝己者，此射之仁道也。</p><p>射者，仁之道也。射求正諸己，己正而後發，發而不中，則不怨勝己者，反求諸己而已矣。孔子曰：「君子無所爭，必也射乎！揖讓而升，下而飲，其爭也君子。」</p><p><strong>所出</strong>：《禮記 · 射義》 — https://zh.wikisource.org/wiki/禮記/射義</p></article></main></div></div>
