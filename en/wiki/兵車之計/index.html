    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 兵車之計</nav></header><main><article><h1>兵車之計</h1><p>兵車之數、馬匹之數，皆國防之要務。</p><p>問兵車之計，幾何乘也？[[牽家馬]]、軛家車者幾何乘？夫兵車者，[[霸王之器]]也。車數之多寡，馬匹之盈虛，國家所以制敵安疆者，不可不察也。兵車之數有定，則徵發有度；馬牛之數有稽，則芻牧有時。今[[管子]]之意，以為凡言兵事者，必先知其兵車幾何、芻粮幾何、士卒幾何，然後可以言戰。失其數者，師老兵疲而功不成；得其數者，動而有備而無後患。慎謀乃保國，不可以不重也。</p><p><strong>所出</strong>：《管子 · 第24篇問》 — https://zh.wikisource.org/wiki/管子/第24篇問</p></article></main></div></div>
