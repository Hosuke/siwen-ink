    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 修學務早</nav></header><main><article><h1>修學務早</h1><p></p><p>《抱朴子》以才性之稟釋修學之所以貴早：「少則誌一而難忘，長則神放而易失，故修學務早，及其精專，習與性成，不異自然也。」</p><p>  若乃絕倫之器，盛年有故，雖失之於旸谷，而收之於虞淵。方知良田之晚播，愈於座歲之荒蕪也。日燭之喻，斯言當矣。</p><p>  欲超千里，必假追影之足；[[欲淩洪波而遐濟，必因艘楫之器]]。故[[為道常患於晚]]，而[[才性有優劣]]，遲悟者非不可成，特患不肯進學耳。</p><p>  <strong>所出</strong>：《抱朴子 · 卷03》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷03</p></article></main></div></div>
