    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 鄭厲公納惠王</nav></header><main><article><h1>鄭厲公納惠王</h1><p>鄭厲公與虢叔殺子頹，納惠王於鄭</p><p>惠王三年，邊伯、石速、蒍國逐王而立子頹。王子頹享三大夫，樂及徧舞。鄭厲公告虢叔曰：「司寇行戮，君為之不舉，而況敢樂禍乎！出王而代其位，禍孰大焉！」遂與虢叔合謀，鄭伯自圉門入，虢叔自北門入，殺子頹及三大夫，王乃入。</p><p><strong>所出</strong>：《國語 · 卷01》 — https://zh.wikisource.org/wiki/國語/卷01</p></article></main></div></div>
