    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 號令者，國之舟車也</nav></header><main><article><h1>號令者，國之舟車也</h1><p>號令者，國家之至具，承之則安，失之則危。</p><p>號令者，國之舟車也。[[安則智廉生，危則爭鄙起]]。舟車安則人可以行遠，號令明則民可以趨善。[[賞罰隨是非]]，令行禁止，則[[安術有七]]之效也。舟車壞則人無以行，號令弛則國無以立。[[治天下若治一家|治天下若治一家]]，號令不一出，則民不知所從，而國隨以危矣。</p><p><strong>所出</strong>：《韓非子 · 安危》 — https://zh.wikisource.org/wiki/韓非子/安危</p></article></main></div></div>
