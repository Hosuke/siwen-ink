    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 事君數斯辱矣</nav></header><main><article><h1>事君數斯辱矣</h1><p>臣之事君，不可數瀆，數則辱及。</p><p>事君數，斯辱矣。朋友數，斯疏矣。臣之事君，恭以承之可也，若數以為諫，則見辱而不見聽；朋友之交，信以接之可也，若數以告誡，則反疏而不見親。事上以恭，交友以義，不可亟瀆以求容，此修身涉世之要也。</p><p><strong>所出</strong>：《論語 · 里仁第四》 — https://zh.wikisource.org/wiki/論語/里仁第四</p></article></main></div></div>
