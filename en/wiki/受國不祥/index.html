    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 受國不祥</nav></header><main><article><h1>受國不祥</h1><p>聖人承天下之凶禍，乃得為天下之王。</p><p>「受國不祥，是為天下王。」聖人為天下王，非以其福慶也，以其能受天下之不祥。凶年饑歲，民無所仰，聖人承受其厄；兵革之世，兆民流離，聖人承當其患。不祥之事，眾人避之唯恐不及，聖人則以為己任。是以百姓有歸，而天命眷焉。觀湯之禱桑林，文王之羑里，皆受不祥而王天下之驗也。垢者，小恥也；不祥者，大凶也。能受大凶，乃成大王者，此之謂也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 七十八章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
