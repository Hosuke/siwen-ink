    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 匪女之為美</nav></header><main><article><h1>匪女之為美</h1><p>物之美者，由貽者而貴，不在物也。</p><p>彤管有煒，洵美且異，然詩人明言：匪女之為美，美人之貽也。女，讀為汝，指彤管與荑。言彤管、荑之所以美者，非物本身之美，乃因美人之手貽我故也。</p><p>此一語道破戀情之真諦：情之所鍾，不在物之貴賤，而在所從來之人心。情人之物，尋常亦逾珍寶；非情人所予，珍玩亦無足貴。</p><p>千古情人視禮物輕重，不在物值，而在心誠，此[[荑]]與[[彤管]]之所以可愛也。</p><p><strong>所出</strong>：《詩經 · 靜女》 — https://zh.wikisource.org/wiki/詩經/靜女</p></article></main></div></div>
