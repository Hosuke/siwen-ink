    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 乘天地之正</nav></header><main><article><h1>乘天地之正</h1><p>乘天地之正，御六氣之辨，以遊無窮，無所待矣。</p><p>夫列子御風而行，泠然善也，旬有五日而後反。彼於致福者，未數數然也。此雖免乎行，猶有所待者也。若夫乘天地之正，而御六氣之辨，以遊無窮者，彼且惡乎待哉！</p><p>風有所待，則待風者非逍遙也。唯乘天地之正，御六氣之變，與造物者遊於無窮，方為真正的逍遙之遊。</p><p><strong>所出</strong>：《莊子 · 逍遙遊》 — https://zh.wikisource.org/wiki/莊子/逍遙遊</p></article></main></div></div>
