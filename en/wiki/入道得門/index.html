    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 入道得門</nav></header><main><article><h1>入道得門</h1><p>探端索緒，必得其門戶；入道無適莫，常傳於賢者。</p><p>探端索其緒兮，必得其門戶。入道無適莫兮，常傳于賢者。</p><p>道之為物，微妙幽玄，必探其端緒，方能得其門戶而入。師者，所以示人之門戶也；道必傳於賢者，以其能審諦而不妄語，傳于億世，昭然可考也。</p><p><strong>所出</strong>：《周易參同契 · 32章》 — https://zh.wikisource.org/wiki/周易參同契/32章</p></article></main></div></div>
