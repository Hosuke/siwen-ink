    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 存亡之緒</nav></header><main><article><h1>存亡之緒</h1><p>邦國存亡之端，在乎君道是否循天理、任賢臣。</p><p>原始要終，存亡之緒，或君驕佚，亢滿違道；或臣邪佞，行不順軌。</p><p>[[存亡之緒]]，治亂之端也。[[御政之首]]得其道，則[[明堂布政]]而國存；[[弦望盈縮]]失其度，[[四七乖戾]]，則[[詰責台輔]]之柄廢，[[存亡之緒]]遂兆。[[辰極受正]]則存，亢滿驕佚則亡，天人之理一也。</p><p><strong>所出</strong>：《周易參同契 · 05章》 — https://zh.wikisource.org/wiki/周易參同契/05章</p></article></main></div></div>
