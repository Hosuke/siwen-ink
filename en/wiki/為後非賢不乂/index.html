    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 為後非賢不乂</nav></header><main><article><h1>為後非賢不乂</h1><p>為君者非賢人不能治，為臣者非賢主無以食其祿。</p><p>王曰：「為後非賢不乂，惟賢非后不食。」言君必得賢臣而後可以治，臣必得賢君而後可以食其祿。君臣相須如[[股肱惟人]]之義，而尤以致賢為急務也。</p><p><strong>所出</strong>：《尚書 · 說命下》 — https://zh.wikisource.org/wiki/尚書/說命下</p></article></main></div></div>
