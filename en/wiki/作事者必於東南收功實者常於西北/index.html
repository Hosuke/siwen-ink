    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 東南起事西北成功</nav></header><main><article><h1>東南起事西北成功</h1><p>言王業之興，皆起於東南，成於西北，天道自然之勢。</p><p>太史公讀秦記，考其終始，乃得天道之要義。天下作事者必於東南，收功實者常於西北。蓋四方之氣，東南生物之始，西北收斂之成，相生相成，迭為興廢。觀之往聖：禹興於西羌，湯起於亳，周之王也以豐鎬伐殷，秦之帝用雍州興，漢之興自蜀漢。皆起東南而成西北之功，先儒所謂天時地理之運者，此之謂也。</p><p><strong>所出</strong>：《史記 · 卷015》 — https://zh.wikisource.org/wiki/史記/卷015</p></article></main></div></div>
