    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 聞道日損以至於无</nav></header><main><article><h1>聞道日損以至於无</h1><p>損之至於無為。</p><p>聞道者日損，損之有云，以至於无。損者，損嗜欲、損智巧、損有為之事。及其至也，損無可損，歸於无為。无為而无不為，此取天下之要在是。</p><p><strong>所出</strong>：《老子 (帛書本) · 章四十八》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
