    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 四時發病</nav></header><main><article><h1>四時發病</h1><p>冬傷於寒，春生癉熱；春傷於風，夏生飧泄；夏傷於暑，秋生痎瘧；秋傷於濕，冬生咳嗽。</p><p>四時之變，寒暑之勝，重陰必陽，重陽必陰，故陰主寒，陽主熱。故寒甚則熱，熱甚則寒。故曰：寒生熱，熱生寒，此陰陽之變也。故曰：冬傷於寒，春生癉熱；春傷於風，夏生飧泄腸澼；夏傷於暑，秋生痎瘧；秋傷於濕，冬生咳嗽。是謂四時之序也。</p><p><strong>所出</strong>：《黃帝內經 · 靈樞第十一卷》 — https://zh.wikisource.org/wiki/黃帝內經/靈樞第十一卷</p></article></main></div></div>
