    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 天地易位，四時易鄉</nav></header><main><article><h1>天地易位，四時易鄉</h1><p>刺世之言，謂天地失常，四時失序，以喻國政之乱。</p><p>天下不治，乃陳佹詩以刺之。首言「天地易位，四時易鄉」，謂上下失常，陰陽失序。列星殞墜，旦暮晦盲；幽晦登昭，日月下藏。猶亂世之時，公道不行，姦邪在上，仁人見絀，暴人得志，宇宙之內，舉失其常。千歲必反，古之常也；天不忘勉學之人，而聖人亦將起而救世矣。</p><p><strong>所出</strong>：《荀子 · 賦篇》 — https://zh.wikisource.org/wiki/荀子/賦篇</p></article></main></div></div>
