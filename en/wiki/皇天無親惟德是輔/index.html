    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 皇天無親惟德是輔</nav></header><main><article><h1>皇天無親惟德是輔</h1><p>天鑒厥德，無所私親，善則輔之。</p><p>皇天無親，惟德是輔，民心無常，惟惠之懷；為善不同，同歸于治，為惡不同，同歸于亂。</p><p>此言天之於人，無偏無陂，唯德是輔；民之於上，無恒厥心，唯惠是懷。善與惡途殊而歸於治亂理固然也。與[[天道無親]]之義相發。</p><p><strong>所出</strong>：《尚書 · 蔡仲之命》 — https://zh.wikisource.org/wiki/尚書/蔡仲之命</p></article></main></div></div>
