    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 嚮晦入宴息</nav></header><main><article><h1>嚮晦入宴息</h1><p>隨以澤中有雷，君子嚮晚入而宴安也。</p><p>澤中有雷隨，君子以嚮晦入宴息。雷蟄則靜，君子斂藏以休，不逆時也。
