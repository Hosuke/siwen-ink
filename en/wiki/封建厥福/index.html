    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 封建厥福</nav></header><main><article><h1>封建厥福</h1><p>受命封建，庇福下國。</p><p>命于下國，封建厥福。</p><p>言商王受天命於下國，分封諸侯，封建而布其福澤於天下。</p><p>[[殷武]]第四章言天命、商德、封建三者一貫。天命降監，故能封建諸侯；封建既定，故下民蒙福。此詩所述封建之義，乃[[天命多辟]]之結果也。</p><p><strong>所出</strong>：《詩經 · 殷武》 — https://zh.wikisource.org/wiki/詩經/殷武</p></article></main></div></div>
