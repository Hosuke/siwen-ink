    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 迎氣制作</nav></header><main><article><h1>迎氣制作</h1><p>受命之王，因民而作，追俗為制，不必泥古也。</p><p>上聞之，制詔御史曰：「蓋受命而王，各有所由興，殊路而同歸，謂因民而作，追俗為制也。議者咸稱太古，百姓何望？漢亦一家之事，典法不傳，謂子孫何？化隆者閎博，治淺者褊狹，可不勉與！」乃以太初之元改正朔，易服色，封太山，定宗廟百官之儀，以為典常，垂之於後云。</p><p><strong>所出</strong>：《史記 · 卷023》 — https://zh.wikisource.org/wiki/史記/卷023</p></article></main></div></div>
