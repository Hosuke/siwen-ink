    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 中石沒鏃</nav></header><main><article><h1>中石沒鏃</h1><p>廣射虎，誤以石為虎，矢沒入石。</p><p>廣出獵，見草中石，以為虎而射之，中石沒鏃，視之石也。因復更射之，終不能復入石矣。</p><p><strong>所出</strong>：《史記 · 卷109》 — https://zh.wikisource.org/wiki/史記/卷109</p></article></main></div></div>
