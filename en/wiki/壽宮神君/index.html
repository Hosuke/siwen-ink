    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 壽宮神君</nav></header><main><article><h1>壽宮神君</h1><p>設壽宮奉神君，神君最貴者太一，時去時來，聞其音而不見其人。</p><p>天子病鼎湖甚，巫醫無所不致。游水發根言有巫能致鬼。置祠之甘泉，病癒，幸甘泉，病良已。大赦天下，置壽宮神君。神君最貴者太一，其佐曰大禁、司命之屬，皆從之。非可得見，聞其音，與人言等。時去時來，來則風肅然。居室帷中。時晝言，然常以夜。天子祓，然後入。因巫為主人，關飲食。所言命之曰「畫法」，其事祕，世莫知也。</p><p><strong>所出</strong>：《史記 · 卷012》 — https://zh.wikisource.org/wiki/史記/卷012</p></article></main></div></div>
