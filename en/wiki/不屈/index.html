    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 不屈</nav></header><main><article><h1>不屈</h1><p>察士能言，未必能行，言辭巧妙而理不當者，適足飾非遂過。</p><p>察士以為得道則未也。雖然，其應物也，辭難窮矣。辭雖窮，其為禍福猶未可知。察而以達理明義，則察為福矣；察而以飾非惑愚，則察為禍矣。[[言行相詭]]者，不屈之蔽也。[[不屈]]者，言屈而理不屈，非辭令之屈也。公子食我之辯，適足以飾非遂過；翟翦非惠王之法，而善之不可行；皆所謂[[辭巧而不中道理]]者也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十八》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十八</p></article></main></div></div>
