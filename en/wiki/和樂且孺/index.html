    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 和樂且孺</nav></header><main><article><h1>和樂且孺</h1><p>兄弟既集，和樂而孺。</p><p>《常棣》六章云：「兄弟既具，和樂且孺。」言兄弟既已聚集，則和樂之情，深入孺稚。孺者，親暱之謂也。[[兄弟急難]]之時，[[莫如兄弟]]；[[宜爾室家]]之際，和樂且孺。兄弟之情，危則急難，安則孺樂。</p><p><strong>所出</strong>：《詩經 · 常棣》 — https://zh.wikisource.org/wiki/詩經/常棣</p></article></main></div></div>
