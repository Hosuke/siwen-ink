    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 陳鼎于碑南</nav></header><main><article><h1>陳鼎于碑南</h1><p>鼎陳廟堂之中，以碑為節也</p><p>鼎為禮器，陳之有序。公食大夫禮，士舉鼎出，陳于碑南，南面西上。碑者，廟堂之中石也，古人宮廟皆有碑，以為考考攸縣之具。鼎陳碑南，取其南面以對尊位也。西上者，以右為尊，設鼎以西為上首焉。陳鼎之后，右人抽扃，左人待載，各司其職，禮不紊也。</p><p><strong>所出</strong>：《儀禮 · 公食大夫禮》 — https://zh.wikisource.org/wiki/儀禮/公食大夫禮</p></article></main></div></div>
