    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 文信侯</nav></header><main><article><h1>文信侯</h1><p>呂不韋之封號，食河南洛陽十萬戶。</p><p>莊襄王元年，以呂不韋為丞相，封為文信侯，食河南洛陽十萬戶。</p><p>十萬戶之封，在戰國之世最為隆重。呂不韋以商賈之身，佐子楚得國，驟躋將相，封侯食邑，可謂極富貴之盛矣。及其免相，秦王猶書責之曰：「何功於秦？何親於秦？」終迫令徙蜀，飲酖而死。功名富貴，轉瞬成空，可不戒哉！</p><p><strong>所出</strong>：《史記 · 卷085》 — https://zh.wikisource.org/wiki/史記/卷085</p></article></main></div></div>
