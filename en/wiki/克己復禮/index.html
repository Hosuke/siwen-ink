    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 克己復禮</nav></header><main><article><h1>克己復禮</h1><p>約束己身，歸復禮儀，乃仁之要道。</p><p>顏淵問仁。子曰：「克己復禮為仁。一日克己復禮，天下歸仁焉，為仁由己，而由人乎哉？」</p><p>[[克己]]者，約束一己之私欲也；[[復禮]]者，歸復事物之當然也。天下之歸仁，非待外求，乃由內省。孔子示修身之要，莫切於此。</p><p><strong>所出</strong>：《論語 · 顏淵第十二》 — https://zh.wikisource.org/wiki/論語/顏淵第十二</p></article></main></div></div>
