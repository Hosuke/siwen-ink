    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 高克奔陳</nav></header><main><article><h1>高克奔陳</h1><p>高克為鄭帥暴師河上，久而不召，衆散，終奔于陳。刺文公用舍失道。</p><p>高克，鄭文公之臣也。好利而不顧其君，文公惡之，欲遠之而不能正法。乃使將兵以禦狄于竟，屯師河上，陳其師旅，久而不召，衆散而歸。高克遂奔陳。</p><p>《傳》曰：「公子素惡高克，進之不以禮，文公退之不以道，危國亡師之本。」是詩之作，正刺此事。暴師久旅而不罷，衆心渙散，覆亡隨之。將帥之道，在知進退、馭士卒；高克不知自斂，文公不能用而不去，各失其道，故有此敗。</p><p><strong>所出</strong>：《詩經 · 清人》 — https://zh.wikisource.org/wiki/詩經/清人</p></article></main></div></div>
