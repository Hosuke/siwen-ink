    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 形體有處</nav></header><main><article><h1>形體有處</h1><p>形聲相應，萬物皆稟陰陽之氣而生。</p><p>太一出兩儀，兩儀出陰陽。陰陽變化，一上一下，合而成章。萬物所出，造於太一，化於陰陽。萌芽始震，凝凂以形。形體有處，莫不有聲。聲出於和，和出於適。和適，先王定樂由此而生。</p><p><strong>所出</strong>：《呂氏春秋 · 卷五》 — https://zh.wikisource.org/wiki/呂氏春秋/卷五</p></article></main></div></div>
