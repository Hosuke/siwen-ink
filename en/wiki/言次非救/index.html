    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 言次非救也</nav></header><main><article><h1>言次非救也</h1><p>救邢之師，當書「救」，不當書「次」。</p><p>齊師、宋師、曹師次于聶北，救邢。救不言次，言次非救也，非救而曰救，何也？遂齊侯之意也。</p><p>《穀梁》明書法之別：兵馬救邢，當書「救邢」；今書「次于聶北」，是止而不前，非真救也。《春秋》因其實而書之，明齊侯之師實止不行，非誠欲救邢耳。</p><p><strong>所出</strong>：《春秋穀梁傳 · 僖公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/僖公</p></article></main></div></div>
