    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 治病必求於本</nav></header><main><article><h1>治病必求於本</h1><p>治病之道，當求陰陽之本本，本於陰陽，則萬病皆可治。</p><p>語出 [[陰陽應象大論]]。黃帝曰：「陰陽者，天地之道也，萬物之綱紀，變化之父母，生殺之本始，神明之府也，治病必求於本。」</p><p>蓋言人之有病，不外形氣之乖逆；形氣之乖逆，不外陰陽之失調。欲療其疾，必追本於陰陽之所偏盛，調其太過，補其不足，使歸於平，此千古治法之大宗也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第二卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第二卷</p></article></main></div></div>
