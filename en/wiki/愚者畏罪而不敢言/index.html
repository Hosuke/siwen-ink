    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 愚者畏罪而不敢言，智者無以讼</nav></header><main><article><h1>愚者畏罪而不敢言，智者無以讼</h1><p>明主之世，言有準的，故愚者不敢妄言，智者無所施其爭辩。</p><p>明主之國，令者言最貴，法者事最適。言當則有大利，不當則有重罪，是以愚者畏罪而不敢言，智者無以讼。此所以無辯之故也。令既行，法既明，則言之當否有定論，愚者自知不當言而不言，智者亦無由起爭而讼之也。</p><p><strong>所出</strong>：《韓非子 · 問辯》 — https://zh.wikisource.org/wiki/韓非子/問辯</p></article></main></div></div>
