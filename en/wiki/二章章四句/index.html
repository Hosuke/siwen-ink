    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 二章章四句</nav></header><main><article><h1>二章章四句</h1><p>詩之二章，各四句，詩經常用章句之例。</p><p>「二章章四句」，《詩經·鵲之奔奔》之章法也。詩凡二章，每章四句，二句一意，首章以「鵲之奔奔」起，興人而不如鳥；次章以「鵲之彊彊」起，反覆詠歎，辭義一貫。</p><p>詩之章句，歷代解說不同。《毛詩正義》以為一章二句、二章二句，共四句。鄭玄以為每章四句。孔穎達疏取鄭說，後世多沿之。此詩章句簡短，而意在言外，故歷代注家多有發明。</p><p><strong>所出</strong>：《詩經 · 鵲之奔奔》 — https://zh.wikisource.org/wiki/詩經/鵲之奔奔</p></article></main></div></div>
