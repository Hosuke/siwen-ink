    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 有无相生</nav></header><main><article><h1>有无相生</h1><p>有與无相待而生，對舉而成。</p><p>故有無相生，難易相成，長短相較，高下相傾，音聲相和，前後相隨。</p><p>此言萬物之對待，皆兩端而立，相待而見，非孤有也。有之顯則無之隱，非先有而後無也；無之隱則有之彰，非先無而後有也。[[難易相成]]亦然，[[長短相較]]亦然。天地之數，倚伏為形，傾和相隨，理一而已矣。</p><p><strong>所出</strong>：《道德經 (王弼本) · 二章》 — https://zh.wikisource.org/wiki/道德經_(王弼本)</p></article></main></div></div>
