    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 觥飯不及壸飧</nav></header><main><article><h1>觥飯不及壸飧</h1><p>時機已晚，不可坐待豐盛，當速有作為</p><p>玄月至，越王問范蠡曰：「諺有之曰：『觥飯不及壺飧。』今歲晚矣，子將奈何？」</p><p>范蠡對曰：「微君王之言，臣故將謁之。臣聞從時者，猶救火、追亡人也，蹶而趨之，唯恐弗及。」越王遂興師伐吳。</p><p>「觥飯」謂盛饌，「壺飧」謂薄食。諺意謂豐盛之饌不及臨時之薄餐，喻時機已至，不可坐待。</p><p><strong>所出</strong>：《國語 · 卷21》 — https://zh.wikisource.org/wiki/國語/卷21</p></article></main></div></div>
