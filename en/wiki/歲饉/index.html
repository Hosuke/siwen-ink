    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 五穀不收之歲</nav></header><main><article><h1>五穀不收之歲</h1><p>歲有五等之饑，各有其象。</p><p>歲之饑荒，凡有五等：一穀不收謂之饉，二穀不收謂之旱，三穀不收謂之凶，四穀不收謂之餽，五穀不收謂之饑。歲饉，則仕者大夫以下皆損祿五分之一。旱，則損五分之二。凶，則損五分之三。餽，則損五分之四。饑，則盡無祿，稟食而已矣。</p><p>故倉無備粟，不可以待凶饑；庫無備兵，不可以征無義；城郭不備完，不可以自守。此[[備者國之重]]之道也。</p><p><strong>所出</strong>：《墨子 · 七患》 — https://zh.wikisource.org/wiki/墨子/七患</p></article></main></div></div>
