    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 誹謗妖言之罪</nav></header><main><article><h1>誹謗妖言之罪</h1><p>孝文除誹謗妖言之法，使臣民得盡情言事。</p><p>上曰：「古之治天下，朝有進善之旌，誹謗之木，所以通治道而來諫者。今法有誹謗妖言之罪，是使眾臣不敢盡情，而上無由聞過失也。將何以來遠方之賢良？其除之。民或祝詛上以相約結而後相謾，吏以為大逆，其有他言，而吏又以為誹謗。此細民之愚無知抵死，朕甚不取。自今以來，有犯此者勿聽治。」</p><p><strong>所出</strong>：《史記 · 卷010》 — https://zh.wikisource.org/wiki/史記/卷010</p></article></main></div></div>
