    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 要盟無益</nav></header><main><article><h1>要盟無益</h1><p>無信之盟，禍亂滋多。</p><p>要盟，迫而結之，不以信也。茍信不繼，盟無益也。《詩》云：「君子屢盟，亂是用長。」言無信也。</p><p>鄭與宋數會，而宋辭平。公遂與鄭伯盟于武父，帥師伐宋，戰焉。君子以是知宋無信也。</p><p><strong>所出</strong>：《春秋左氏傳 · 桓公》 — https://zh.wikisource.org/wiki/春秋左氏傳/桓公</p></article></main></div></div>
