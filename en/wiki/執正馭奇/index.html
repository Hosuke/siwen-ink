    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 執正馭奇</nav></header><main><article><h1>執正馭奇</h1><p>舊練之才執正以馭奇，新學之銳逐奇而失正。</p><p>然密會者以意新得巧，苟異者以失體成怪。舊練之才，則執正以馭奇；新學之銳，則逐奇而失正；勢流不反，則文體遂弊。秉茲情術，可無思耶！</p><p>密合文理者，以意新而得巧；苟求異者，以失體而成怪。老成之士執正道以馭奇變，新進之徒逐奇異而喪正體。勢既流溢而不返，文體遂至弊敗。此情此術，可不深思耶！</p><p><strong>所出</strong>：《文心雕龍 · 定勢》 — https://zh.wikisource.org/wiki/文心雕龍/定勢</p></article></main></div></div>
