    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 康侯用錫馬蕃庶</nav></header><main><article><h1>康侯用錫馬蕃庶</h1><p>康侯受賞馬眾多，一日三受接見</p><p>晉，進也。明出地上，順而麗乎大明，柔進而上行，是以康侯用錫馬蕃庶，晝日三接也。</p><p>晉者，明出地上，順麗大明，柔進而上行。錫馬蕃庶，晝日三接，言受賞之厚、接待之勤也。明德上行，天下化之。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷04》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷04</p></article></main></div></div>
