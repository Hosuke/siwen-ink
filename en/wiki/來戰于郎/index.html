    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 來戰于郎</nav></header><main><article><h1>來戰于郎</h1><p>齊衛鄭伯來戰，三國稱來，見魯無罪。</p><p>桓公十年，「冬，十有二月丙午，齊侯、衛侯、鄭伯來戰于郎。」</p><p>三國諸侯聯兵侵魯，戰于郎。書「來戰」，見敵加於我也。三國為主犯，魯乃被害者。</p><p><strong>所出</strong>：《春秋公羊傳 · 桓公》 — https://zh.wikisource.org/wiki/春秋公羊傳/桓公</p></article></main></div></div>
