    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 縉雲之官</nav></header><main><article><h1>縉雲之官</h1><p>黃帝以雲紀官，春夏秋冬各有名號，總曰縉雲。</p><p>帝以景雲之瑞，慶雲之祥，即以雲紀官。官以雲為名，故有縉雲之官。或雲：帝煉金丹，有縉雲之瑞，自號縉雲氏，赤多白少曰縉。於是設官分職，以雲命官，春為青雲官，夏為縉雲官，秋為白雲官，冬為黑雲官，帝以雲為師也。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 1》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/1</p></article></main></div></div>
