    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 神雲咽津</nav></header><main><article><h1>神雲咽津</h1><p>吸神雲入口，咽津十二過，結神於形。</p><p>神雲咽津者，存思法之要功也。修此法者，先思五色紫雲從兆泥丸中入，乃口吸神雲，咽津十二過，結作一神。</p><p>所結之神，身披五彩紫白霞圓光輪，神在光內，下布一形之內，散炁九孔之中，聚在舌尖之上，順時吐息。</p><p>此法為大洞存思正統法門，以神雲為媒，接引帝一尊君入於身中，結神成真，終致上昇上清。</p><p><strong>所出</strong>：《上清大洞真經 · 39章》 — https://zh.wikisource.org/wiki/上清大洞真經/39章</p></article></main></div></div>
