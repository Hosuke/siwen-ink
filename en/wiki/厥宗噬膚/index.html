    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 厥宗噬膚</nav></header><main><article><h1>厥宗噬膚</h1><p>柔中應剛，厥宗噬肤，往有慶也。</p><p>「厥宗噬肤，往何咎」者，睽卦六五之辭也。六五以柔居中，下應九二之剛，有宗族同類相應之象；噬肤者，言其易合而速也。《象》曰「厥宗噬肤，往有慶也」，蓋柔以應剛，得其助力，往而何咎，慶之至也。</p><p><strong>所出</strong>：《周易 · 睽》 — https://zh.wikisource.org/wiki/周易/睽</p></article></main></div></div>
