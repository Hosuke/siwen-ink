    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 好人提提</nav></header><main><article><h1>好人提提</h1><p>貴人安佚之態，宛然而左辟以慢人也。</p><p>好人提提，宛然左辟。</p><p>「好人」者，指魏國貴族之女，衣華服、佩象揥，養尊處優之態也。「提提」，安佚貌。「宛然左辟」，側身迴避、不予之正面相對之義。言彼好人安坐高堂，見縫裳之女宛然左辟，若不屑與之並行，傲然慢之。</p><p>此詩句刺富貴者心胸褊狹，矜己而忽人者也。</p><p><strong>所出</strong>：《詩經 · 葛屨》 — https://zh.wikisource.org/wiki/詩經/葛屨</p></article></main></div></div>
