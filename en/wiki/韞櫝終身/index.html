    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 韞櫝終身</nav></header><main><article><h1>韞櫝終身</h1><p>藏之櫝中，終身不渝；道貴密傳，不輕示人。</p><p>托號諸名，覆謬眾文，學者得之，韞櫝終身。</p><p>[[韞櫝終身]]者，非秘而不宣，乃所以重其道也。圖集既成，學者得之，當珍藏密守，終身不易。</p><p><strong>所出</strong>：《周易參同契 · 31章》 — https://zh.wikisource.org/wiki/周易參同契/31章</p></article></main></div></div>
