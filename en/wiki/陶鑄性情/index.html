    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 陶鑄性情</nav></header><main><article><h1>陶鑄性情</h1><p>聖人之文，化育人心，猶陶匠鑄金也。</p><p>文章之用，在乎陶鑄性情。「陶」也者，範土為器，揉之煅之，以成其形；「鑄」也者，銷金入模，煉之範之，以成其器。聖人之心，見乎辭矣。辭也者，非徒言說之美，乃所以正人之情、養人之性者也。功在乎上哲，言之詳矣。文之為用，非僅悅目悅耳而已；感人以神，化人以德，其功為大。</p><p><strong>所出</strong>：《文心雕龍 · 征聖》 — https://zh.wikisource.org/wiki/文心雕龍/徵聖</p></article></main></div></div>
