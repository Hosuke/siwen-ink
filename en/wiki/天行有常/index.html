    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 天行有常</nav></header><main><article><h1>天行有常</h1><p>天道循恆，不因堯桀而改</p><p>天運有常，不為聖王而存，不為暴君而亡。以治應之則吉，以亂應之則凶。強本而節用，天不能使之貧；養備而動時，天不能使之病；脩道而不貳，天不能使之禍。反是，水旱不能使之飢，寒暑不能使之疾，祅怪不能使之凶。人事之得失，決於人為，不可以怨天。</p><p><strong>所出</strong>：《荀子 · 天論篇》 — https://zh.wikisource.org/wiki/荀子/天論篇</p></article></main></div></div>
