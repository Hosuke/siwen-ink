    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 一歲耕五歲食</nav></header><main><article><h1>一歲耕五歲食</h1><p>一歲耕而有五年之食，乃國之至蓄</p><p>「一歲耕，五歲食」者，[[管子]]所言耕斂之道也。一夫耕之，可以養五人；一歲之收，可積五年之食。粟賈因此而五倍，此非天災，乃人功也。</p><p>又云：「一歲耕，六歲食，粟賈六倍。二年耕，而十一年食。」言斂斂有道，則地利不竭，歲收有餘。善為國者，必使耕三餘一，積九年之粟，然後可以備兵荒、禦外患。故曰「夫富能奪，貧能予，乃可以為天下」，奪有餘以予不足，此之謂也。</p><p><strong>所出</strong>：《管子 · 第78篇揆度》 — https://zh.wikisource.org/wiki/管子/第78篇揆度</p></article></main></div></div>
