    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 石可破也而不可奪堅</nav></header><main><article><h1>石可破也而不可奪堅</h1><p>堅與赤，性之固有，不可汙也。</p><p>石可破也，而不可奪堅；丹可磨也，而不可奪赤。堅與赤，性之有也。性也者，所受於天也，非擇取而為之也。</p><p>豪士之自好者，其不可漫以汙也，亦猶此也。是以伯夷、叔齊餓於首陽之下而不改其操，[[伯夷叔齊]]之義，於此可驗。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十二》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十二</p></article></main></div></div>
