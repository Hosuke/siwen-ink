    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 小狐汔濟</nav></header><main><article><h1>小狐汔濟</h1><p>幾於成而未竟</p><p>小狐汔濟，濡其尾，無攸利。汔，庶幾也。小狐渡水，幾及其岸而濡濕其尾，終無所利。狐之涉水，恃其尾以為舵，尾濡則失其度，不能竟渡。此喻人之做事，幾乎有成而不能終之者也。《[[濡其尾]]》之義，亦備於此。</p><p><strong>所出</strong>：《周易 · 未濟》 — https://zh.wikisource.org/wiki/周易/未濟</p><hr><p><strong>所出</strong>：《周易註 (王弼) · 卷06》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷06</p></article></main></div></div>
