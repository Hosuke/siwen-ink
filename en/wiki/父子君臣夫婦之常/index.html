    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 父子君臣夫婦之常</nav></header><main><article><h1>父子君臣夫婦之常</h1><p>人倫之正，在各守其分，不可逾越。</p><p>天下之亂生於不明人倫之正。臣之事君，子之事父，妻之事夫，三者順則天下治，三者逆則天下亂，此天下之常道也。明王賢臣雖不易此道，而人主不肖，臣猶不敢侵，是知倫紀一定，雖遇不肖之君，猶得相保。若廢此常道而任智尚賢，則上下易位，亂亡隨之。</p><p><strong>所出</strong>：《韓非子 · 忠孝》 — https://zh.wikisource.org/wiki/韓非子/忠孝</p></article></main></div></div>
