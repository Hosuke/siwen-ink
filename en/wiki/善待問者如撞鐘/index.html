    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 善待問者如撞鐘</nav></header><main><article><h1>善待問者如撞鐘</h1><p>善答問者，如鐘之待叩，叩小則小鳴，叩大則大鳴。</p><p>善待問者，如撞鐘，叩之以小者則小鳴，叩之以大者則大鳴，待其從容，然後盡其聲。不善答問者反此。</p><p>鐘之為物，虛以待叩也。叩之者小，則鳴之者亦小；叩之者大，則鳴之者亦大。待其從容者，俟其氣定而後應之，聲乃悠遠而無竭也。師之答問，亦若是矣。學者之問有淺深，則答之者亦有高下；不先不後，適當其可，然後答之斯盡善也。</p><p><strong>所出</strong>：《禮記 · 學記》 — https://zh.wikisource.org/wiki/禮記/學記</p></article></main></div></div>
