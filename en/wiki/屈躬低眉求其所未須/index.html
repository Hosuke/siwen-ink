    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 絕不屈躬低眉，求其所未須</nav></header><main><article><h1>絕不屈躬低眉，求其所未須</h1><p>賢者寧守困乏，決不折腰以求祿位，以見人格之峻潔。</p><p>抱朴子言：「獨可散發高枕，守其所有已，絕不屈躬低眉，求其所未須也。」</p><p><strong>所出</strong>：《抱朴子 · 卷20》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷20</p></article></main></div></div>
