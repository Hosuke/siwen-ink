    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 屨校滅趾</nav></header><main><article><h1>屨校滅趾</h1><p>足械沒趾，小刑止惡，不行也</p><p>初九之爻，屨校滅趾，无咎。校者，械也；履校者，納械於足；滅趾者，械沒其趾，不見其趾也。</p><p>初九以剛居初，在下而動，其過小焉。聖人因其小過而刑之，納械於足以滅其趾，使不得行，非暴之也，止之也。止之使不行，則不至於大惡，而无咎也。噬嗑之義，小罪噬之，不使行焉，乃所以止大惡也。</p><p><strong>所出</strong>：《周易 · 噬嗑》 — https://zh.wikisource.org/wiki/周易/噬嗑</p></article></main></div></div>
