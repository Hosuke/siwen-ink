    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 立法術，設度數</nav></header><main><article><h1>立法術，設度數</h1><p>立法度、設數術，所以利民萌、便眾庶，非為一身之安。</p><p>韓子自明其志曰：「立法術，設度數，所以利民萌、便眾庶之道也。」</p><p>又云：「廢先王之教，而行賤臣之所取者，竊以為立法術，設度數。」言廢舊教而行新法，非為己身之私利，乃所以利民萌、便眾庶。其意在以法術整齊百姓，非以法術自固。此[[貪鄙之為]]與[[仁智之行]]之大辨也。</p><p><strong>所出</strong>：《韓非子 · 問田》 — https://zh.wikisource.org/wiki/韓非子/問田</p></article></main></div></div>
