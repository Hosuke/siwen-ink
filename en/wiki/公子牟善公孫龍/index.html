    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 公子牟善公孫龍</nav></header><main><article><h1>公子牟善公孫龍</h1><p>公孫龍與魏公子牟相善，公子牟不以世人譏議為尤。</p><p>公孫龍與魏公子牟相善。樂正子輿嘗笑曰：「公孫龍之爲人也，行無師，學無友，佞給而不中，漫衍而無家，好怪而妄言，欲惑人之心，屈人之口，與韓檀等肄之。」而公子牟不以爲尤也。</p><p><strong>所出</strong>：《公孫龍子 · 原序》 — https://zh.wikisource.org/wiki/公孫龍子/原序</p></article></main></div></div>
