    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 吞漢將軍</nav></header><main><article><h1>吞漢將軍</h1><p>東越王馀善叛漢，號其將為「吞漢將軍」，以示抗漢之志。</p><p>元鼎六年秋，東越王馀善聞樓船將軍楊仆請誅之，漢兵且至，遂反。發兵距漢道，號將軍騶力等為「吞漢將軍」，入白沙、武林、梅嶺，殺漢三校尉。漢遣橫海將軍韓說、樓船將軍楊仆、中尉王溫舒、越侯等數道並進，咸入東越。東越素發兵距險，使徇北將軍守武林，敗樓船軍數校尉，殺長吏。樓船將軍率錢唐轅終古斬徇北將軍，為御兒侯。然兵未往而東越已破。號稱吞漢，卒以自覆，可為狂謀亡國者之戒。</p><p><strong>所出</strong>：《史記 · 卷114》 — https://zh.wikisource.org/wiki/史記/卷114</p></article></main></div></div>
