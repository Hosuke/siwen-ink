    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 偏解</nav></header><main><article><h1>偏解</h1><p>偏執一端，不足以論萬里之文。</p><p>通變之道，貴乎宏通，忌乎偏執。</p><p>劉勰以為：為文宜先博覽精閱，總綱紀而攝契，然后拓衢路、置關鍵，長轡遠馭，從容按節。若僅偏解一方面，而矜激以為是，乃庭間之迴驟而已，非萬里之逸步也。</p><p>庭間迴驟，謂繞庭一週，極言其狹隘局促；萬里逸步，謂馳騁千里，極言其宏遠通達。二者之別，在通與偏之間。</p><p>為文者必識此分際，方可與言通變矣。</p><p><strong>所出</strong>：《文心雕龍 · 通變》 — https://zh.wikisource.org/wiki/文心雕龍/通變</p></article></main></div></div>
