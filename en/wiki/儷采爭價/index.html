    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 儷采爭價</nav></header><main><article><h1>儷采爭價</h1><p>宋初詩趨於對偶工整、語句新奇之風也。</p><p>「儷采百字之偶，爭價一句之奇，情必極貌以寫物，辭必窮力而追新，此近世之所競也。」劉宋詩人追求駢儷之采，對偶成篇；字句之間，競求新奇。極盡形貌之描寫，窮究文辭之新變，此近世之所競尚者也。</p><p><strong>所出</strong>：《文心雕龍 · 明詩》 — https://zh.wikisource.org/wiki/文心雕龍/明詩</p></article></main></div></div>
