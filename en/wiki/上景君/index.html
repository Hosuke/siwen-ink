    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 上景君</nav></header><main><article><h1>上景君</h1><p>金闕後聖太平李真人所屬天帝上景之君。</p><p>上景君，金闕後聖太平李真人所屬之尊神。居金闕之上，號上景，總三元之炁，領十方之暉。修大洞三十章者，皆賴此君蔭護，使三華流津，九明通照，與帝合靈，世得仙契。</p><p><strong>所出</strong>：《上清大洞真經 · 30章》 — https://zh.wikisource.org/wiki/上清大洞真經/30章</p></article></main></div></div>
