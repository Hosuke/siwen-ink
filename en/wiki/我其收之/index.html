    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 我其收之</nav></header><main><article><h1>我其收之</h1><p>言子孫當承受保守天命也</p><p>「我其收之」，《詩經·維天之命》句也。「收」者，聚也，受也。言上天以嘉福溢我，我其承受而保守之。</p><p>此與[[收族]]之義相類，皆言承先業而保守之。「收之」者，收天命於己身也。[[受祿于天]]、《詩》言[[受天之祜]]，皆此義。天命非徒降而已，必待人受之、守之，乃能有成。[[無忝皇祖]]戒後人勿辱沒先德，此詩則勉後人當收之、保之，以無負天眷。</p><p><strong>所出</strong>：《詩經 · 維天之命》 — https://zh.wikisource.org/wiki/詩經/維天之命</p></article></main></div></div>
