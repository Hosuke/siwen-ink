    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 高陽應好小察</nav></header><main><article><h1>高陽應好小察</h1><p>高陽應逞小智而不通大理，居室始成而後卒敗。</p><p>高陽應將為室家，匠對曰：「未可也。木尚生，加塗其上，必將撓。以生為室，今雖善，後將必敗。」高陽應曰：「緣子之言，則室不敗也。木益枯則勁，塗益乾則輕，以益勁任益輕則不敗。」匠人無辭而對，受令而為之。室之始成也善，其後果敗。高陽應好小察，而不通乎大理也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十五》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十五</p></article></main></div></div>
