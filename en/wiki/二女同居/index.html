    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 二女同居</nav></header><main><article><h1>二女同居</h1><p>二女異志同居，喻志同道合之難，此革之象也。</p><p>二女共室，顏色甚姝，蘇秦通言，張儀合媒，發辯利舌，奮舒美辭，推心調諧，合為夫妻，終不相知。夫求合之道，必取同類；陰陽相配，牝牡相從，猶關關之於洲渚，逑窈窕之淑女也。二女皆陰，無陽以和，雖有善言之媒，終歸乖睽。是以修煉之道，亦貴同類相從，異類相乘，否則終無益也。</p><p><strong>所出</strong>：《周易參同契 · 30章》 — https://zh.wikisource.org/wiki/周易參同契/30章</p></article></main></div></div>
