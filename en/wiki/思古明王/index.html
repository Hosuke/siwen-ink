    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 思古明王交於萬物有道</nav></header><main><article><h1>思古明王交於萬物有道</h1><p>古之聖王治萬物循道，奉養有節。</p><p>《鴛鴦》之序，論幽王之世當思古明王之政。其辭曰：「思古明王交於萬物有道，自奉養有節焉。」言古之聖王，於天下萬物皆有所交，皆有所道，不妄作、不過取，至於自奉養亦不敢過度，以節為貴。此詩人借鴛鴦之得其偶、乘馬之得其飼，以興君子受福之義，而於序言明王交萬物之道，歸本於自奉之節，亦諷幽王不能然也。</p><p><strong>所出</strong>：《詩經 · 鴛鴦》 — https://zh.wikisource.org/wiki/詩經/鴛鴦</p></article></main></div></div>
