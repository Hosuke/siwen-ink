    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 枸醬番禺</nav></header><main><article><h1>枸醬番禺</h1><p>述蜀枸醬流入番禺，為通西南夷之端之事</p><p>騫在大夏時，見邛竹杖、蜀布。大夏國人曰：「吾賈人往市之身毒。身毒在大夏東南可數千里。其俗土著，大與大夏同，而卑溼暑熱云。其人民乘象以戰。其國臨大水焉。」以[[昆莫|騫]]度之，大夏去漢萬二千里，今身毒國又居大夏東南數千里，有蜀物，此其去蜀不遠矣。</p><p>  <strong>所出</strong>：《史記 · 卷123》 — https://zh.wikisource.org/wiki/史記/卷123</p></article></main></div></div>
