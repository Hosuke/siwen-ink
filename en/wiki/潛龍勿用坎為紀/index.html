    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 潛龍勿用坎為紀</nav></header><main><article><h1>潛龍勿用坎為紀</h1><p>潛龍藏氣，坎為紀綱。</p><p>[[潛龍]]者，天氣還復初九，甲子歲也，冬至之日也，天地正始起於是也。龍者，乃東方少陽，木之精神也，故天道因木而出，以興火行。[[坎為紀]]者，天與地常合，其[[綱紀]]於玄甲子初出，此可為有德上君治[[綱紀]]也。</p><p><strong>所出</strong>：《太平經 · 07》 — https://zh.wikisource.org/wiki/太平經/07</p></article></main></div></div>
