    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 正形飾德</nav></header><main><article><h1>正形飾德</h1><p>形正則德自來，心精則萬物畢得。</p><p>形不正者德不來，中不精者心不治。正形飾德，萬物畢得。翼然自來，神莫知其極。昭知天下，通於四極。</p><p>夫形者，德之符也；中者，心之鏡也。形苟正矣，則德自應之而來；中苟精矣，則心自然安定。及其正也，飾以德行，則萬物莫不各得其宜，如翼之自来，神亦莫究其極。斯道昭明，足以通於天下四極矣。</p><p>聖人脩此，則五官得其正，五音不相奪，五味不相傷，萬物畢來而聽命焉。</p><p><strong>所出</strong>：《管子 · 第37篇心術下》 — https://zh.wikisource.org/wiki/管子/第37篇心術下</p></article></main></div></div>
