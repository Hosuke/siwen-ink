    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 良工能與不能</nav></header><main><article><h1>良工能與不能</h1><p>各有所能亦有所不能，君子知之。</p><p>疾步累趨，未若托乘乎逸足；尋飛逐走，未若假伎乎鷹犬。言才性各有限，智者不強所不能，而資人之所能也。</p><p><strong>所出</strong>：《抱朴子 · 卷12》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷12</p></article></main></div></div>
