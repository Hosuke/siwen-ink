    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 無以物亂官</nav></header><main><article><h1>無以物亂官</h1><p>當謹五官之守，勿使外物移易其心。</p><p>是故曰：無以物亂官，毋以官亂心，此之謂內德。</p><p>五官者，心之守也；物者，誘五官之媒介也。不謹五官之交於物，則欲蔽心生而德去矣；五官既亂，則心亦隨之而搖，內德不立，而天下無以治也。</p><p>是故欲脩內德者，先正五官之交。目之於色，耳之於聲，鼻之於臭，口之於味，身之於觸，皆有所節而不流，斯之謂能治五官而不為五官所使也。</p><p>五官既正，則心自靜；心既靜，則神自明。內德之成其在茲乎。</p><p><strong>所出</strong>：《管子 · 第37篇心術下》 — https://zh.wikisource.org/wiki/管子/第37篇心術下</p></article></main></div></div>
