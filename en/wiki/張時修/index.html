    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 張時修</nav></header><main><article><h1>張時修</h1><p></p><p>真人張時修字朝英，[[張景端]]之後也。素習儒術，累舉不第，乃恬然靜退，志慕修煉。以虛靜不娶無嗣，眾推承襲。年六十一歲，於龍虎故居解化。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 19》 — https://zh.wikisource.org/wiki/歷世真仙體通鑑/19</p></article></main></div></div>
