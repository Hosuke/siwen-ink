    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 白不能自白</nav></header><main><article><h1>白不能自白</h1><p>白固不能自白，惡能白石物乎？色不能自為色，則石不能自顯其石，天下未有離色可見之物。</p><p>世無孤立之白矣，故曰白固不能自白。旣不能自白，安能自白於石與物？若使白者必能自白，則亦不待白於物而自白矣，豈堅、白乎？黃、黑與之然也。石其無有，惡取堅、白乎？故離也。離也者，因是自然而自離矣。石反覆相見，則堅、白之與萬物莫不皆離矣。夫離者，豈有物使之離乎？莫不因是天然而自離矣。白不能自白，色不能自為色，此萬物皆離之根本也。</p><p><strong>所出</strong>：《公孫龍子 · 5》 — https://zh.wikisource.org/wiki/公孫龍子/5</p></article></main></div></div>
