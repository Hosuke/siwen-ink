    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 六淫四難</nav></header><main><article><h1>六淫四難</h1><p>民從六淫則國弱，行四難則兵彊</p><p>民之有欲有惡也，欲有六淫，惡有四難。從六淫則國弱，行四難則兵彊。故王者刑於九而賞出一。刑於九則六淫止，賞出一則四難行。六淫止則國無姦，四難行則兵無敵。</p><p><strong>所出</strong>：《商君書 · 卷二》 — https://zh.wikisource.org/wiki/商君書/卷二</p><hr><p>《商君書 · 卷五》[[弱民]]篇云：農商官三者，國之常官也。三官生蝨六：曰歲，曰食，曰美，曰好，曰志，曰行。六者有樸，必削。</p><p>  <strong>所出</strong>：《商君書 · 卷五》 — https://zh.wikisource.org/wiki/商君書/卷五</p></article></main></div></div>
