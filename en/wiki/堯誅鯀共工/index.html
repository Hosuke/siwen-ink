    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 堯誅鯀共工</nav></header><main><article><h1>堯誅鯀共工</h1><p>誅殺諫臣乃所以傳天下於聖賢，其事雖難，其義則正。</p><p>[[堯]]欲傳天下於[[舜]]。[[鯀]]諫曰：「不祥哉！孰以天下而傳之於匹夫乎？」堯不聽，舉兵而誅殺鯀於羽山之郊。[[共工]]又諫曰：「孰以天下而傳之於匹夫乎？」堯不聽，又舉兵而誅共工於幽州之都。於是天下莫敢言無傳天下於舜。</p><p><strong>所出</strong>：《韓非子 · 外儲說右上》 — https://zh.wikisource.org/wiki/韓非子/外儲說右上</p></article></main></div></div>
