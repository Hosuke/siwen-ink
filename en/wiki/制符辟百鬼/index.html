    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 制符辟百鬼</nav></header><main><article><h1>制符辟百鬼</h1><p>桃刺朱書，制符辟除百鬼</p><p>[[女青鬼律]]所言制符辟百鬼之法，以桃刺長尺二，朱書符籙，懸於門戶。其符象四方之神：青龍主東，白虎主西，朱雀主南，玄武主北，中央黃驎以居中。此符能辟除鬼賊，急急如律令。</p><p>又言四壁角厭鬼法：用桃刺長尺二，朱書四壁角，亦以辟鬼。</p><p>符之要義，在以正一之氣制邪。符青龍、白虎、朱雀、玄武、中央黃驎者，象天之四方神聖以制百鬼。</p><p><strong>所出</strong>：《女青鬼律 · 卷4》 — https://zh.wikisource.org/wiki/女青鬼律/卷4</p></article></main></div></div>
