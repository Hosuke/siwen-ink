    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 知子之來之</nav></header><main><article><h1>知子之來之</h1><p>知其所愛而以玉佩答之。</p><p>知子之來之，雜佩以贈之。見於《詩經·女曰鷄鳴》末章。言知子之來，即以雜佩答之也。末章凡三「知」句，皆言以雜佩相報之義，所異者「來之」「順之」「好之」而已。「來」者，來致之也；「順」者，溫順也；「好」者，愛好也。知其一，便以佩玉報之，所報非一端，所待亦非一人，以見情義之相通也。</p><p><strong>所出</strong>：《詩經 · 女曰鷄鳴》 — https://zh.wikisource.org/wiki/詩經/女曰鷄鳴</p></article></main></div></div>
