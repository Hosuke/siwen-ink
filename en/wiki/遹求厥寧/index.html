    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 遹求厥寧</nav></header><main><article><h1>遹求厥寧</h1><p>文王求天下之安寧，以德治民，萬民賴焉。</p><p>「文王烝哉」，此詩人所以美文王也。首章云「文王有聲，遹駿有聲」，言文王之聲名廣大。「遹求厥寧」者，發語辭也，言文王求天下之安寧。「遹觀厥成」者，言文王觀其功之已成。文王受天命而有武功，既伐于崇，乃作邑于豐，以定根本。以德服人，以綏萬邦，故能成一代之功業。此詩述文王所以有聲者，正在於求寧觀成，德化天下，非以威力赫然者也。</p><p><strong>所出</strong>：《詩經 · 文王有聲》 — https://zh.wikisource.org/wiki/詩經/文王有聲</p></article></main></div></div>
