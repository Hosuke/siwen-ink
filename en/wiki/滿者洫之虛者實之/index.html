    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 滿者洫之虛者實之</nav></header><main><article><h1>滿者洫之虛者實之</h1><p>長者斷之，短者續之，滿者洫之，虛者實之，行政之道也。</p><p>管子言：「甚矣，百姓之惡人之有餘忌也！是以長者斷之，短者續之，滿者洫之，虛者實之。」此言行政者當知所損益。民有餘忌，則長而去之；民有所短，則續而益之；滿則洫之使損，虛則實之使盈，此聖人之所以輔萬物之自然而不敢為也。</p><p><strong>所出</strong>：《管子 · 第32篇小稱》 — https://zh.wikisource.org/wiki/管子/第32篇小稱</p></article></main></div></div>
