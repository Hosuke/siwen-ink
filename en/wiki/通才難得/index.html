    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 通才難得</nav></header><main><article><h1>通才難得</h1><p>劉勰歎善治者寡文，工文者疎治，對策所取唯通才，志足文遠者鮮矣。</p><p>難矣哉，士之為才也！或練治而寡文，或工文而疎治，對策所選，實屬通才，志足文遠，不其鮮歟！</p><p><strong>所出</strong>：《文心雕龍 · 議對》 — https://zh.wikisource.org/wiki/文心雕龍/議對</p></article></main></div></div>
