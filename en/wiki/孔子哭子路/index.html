    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 孔子哭子路於中庭</nav></header><main><article><h1>孔子哭子路於中庭</h1><p>夫子哭子路，進使者問故，既聞醢之遂命覆醢</p><p>孔子哭子路於中庭。有人弔者而夫子拜之。既哭，進使者而問故。使者曰：「醢之矣。」遂命覆醢。</p><p>子路死於衛，結纓而死，蹈難而亡。夫子哭之於庭，哀甚焉。及使者至，問其死狀，使者以「醢之矣」對。夫子聞之，命覆其醢，不復食也。</p><p>師弟之情，生則切磋，沒則哀慟。聞其遇害而遂絕其所嗜之味，是愛人以德之至也。</p><p><strong>所出</strong>：《禮記 · 檀弓上》 — https://zh.wikisource.org/wiki/禮記/檀弓上</p></article></main></div></div>
