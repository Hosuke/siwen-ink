    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 聖人四反</nav></header><main><article><h1>聖人四反</h1><p>聖人治世四事</p><p>聖人治世有四事：我無為而民自化，我好靜而民自正，我無事而民自富，我無欲而民自樸。</p><p>曰無為也者，修道承天，無所改作，而民自化成。好靜也者，不言不教，而民自忠正。無事也者，無瑤役徵召之事，民安其業，故皆自富。無欲也者，去華文，微服飾，民則隨我為質樸。修道守真，絕去六情，民自隨我而清也。</p><p><strong>所出</strong>：《老子河上公章句 · 淳風》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
