    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 蘇代遺穰侯書</nav></header><main><article><h1>蘇代遺穰侯書</h1><p>齊人蘇代說齊襄王命其遺書予穰侯，以五不可伐齊之說止秦兵。</p><p>穰侯與白起客卿胡陽復攻趙、韓、魏，破芒卯於華陽下，取觀津，且益趙以兵，伐齊。齊襄王懼，使蘇代為齊陰遺穰侯書，具陳五不可伐齊之理：秦之深讎在晉楚，破齊以肥趙，於秦不利；秦少出兵則晉楚不信，多出兵則晉楚為制於秦；齊若走秦必走晉楚；三晉得秦之齊，則秦反受敵；不如得安邑以善事之，無患於秦。於是穰侯不行，引兵而歸。</p><p><strong>所出</strong>：《史記 · 卷072》 — https://zh.wikisource.org/wiki/史記/卷072</p></article></main></div></div>
