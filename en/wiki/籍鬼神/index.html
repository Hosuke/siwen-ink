    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 籍鬼神</nav></header><main><article><h1>籍鬼神</h1><p>假祭祀之名以取財而不傷民之術</p><p>桓公欲籍於室屋、萬民、六畜、樹木皆不可。管子請以令籍於鬼神，立堯之五吏之祭，春獻蘭，秋斂落，原魚以爲脯，鯢以爲殽。則澤魚之正伯倍異日，無屋粟邦布之籍矣。</p><p>管子云：「厭宜乘勢，事之利得也。計議因權，事之囿大也。王者乘勢，聖人乘幼，與物皆耳。」假神道以設教，因民俗以取財，務使民樂輸而不怨，此善政之術也。</p><p><strong>所出</strong>：《管子 · 第80篇輕重甲》 — https://zh.wikisource.org/wiki/管子/第80篇輕重甲</p></article></main></div></div>
