    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 白鹿皮幣</nav></header><main><article><h1>白鹿皮幣</h1><p>天子苑有白鹿以其皮為幣，以發瑞應，造白金焉。</p><p>時禁苑有白鹿，而少府多銀錫。民盜鑄錢者不可勝數，錢益多而輕，物益少而貴。有司言：「古者皮幣，諸侯以聘享。金有三等，黃金為上，白金為中，赤金為下。今半兩錢法重四銖，而姦或盜摩錢裏取鋊，錢益輕薄而物貴，則遠方用幣煩費不省。」乃以白鹿皮方尺，緣以藻繢，為皮幣，直四十萬。王侯宗室朝覲聘享，必以皮幣薦璧，然後得行。</p><p><strong>所出</strong>：《史記 · 卷030》 — https://zh.wikisource.org/wiki/史記/卷030</p></article></main></div></div>
