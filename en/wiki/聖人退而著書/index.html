    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 聖人退而著書</nav></header><main><article><h1>聖人退而著書</h1><p>孔子干七十餘君不能用，乃退而論舊聞，作《春秋》，以繩當世。</p><p>孔子明王道，干七十餘君，莫能用，故西觀周室，論史記舊聞，興於魯而次[[春秋]]，上記隱，下至哀之獲麟，約其辭文，去其煩重，以制義法，王道備，人事浹。七十子之徒口受其傳指，為有所刺譏襃諱挹損之文辭，不可以書見也。蓋聖人之志不行於時，則載之空言以俟後世，其事則然也。</p><p><strong>所出</strong>：《史記 · 卷014》 — https://zh.wikisource.org/wiki/史記/卷014</p></article></main></div></div>
