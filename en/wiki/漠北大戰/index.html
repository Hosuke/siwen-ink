    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 漠北大戰</nav></header><main><article><h1>漠北大戰</h1><p>記衛青、李廣等擊匈奴單于之事</p><p>元狩四年，大將軍青出定襄，擊單于。以前的將軍為前將軍太僕公孫賀、左將軍主爵、右將軍平陽侯曹襄並隸大將軍。李廣再失道，不受賞。</p><p><strong>所出</strong>：《史記 · 卷022》 — https://zh.wikisource.org/wiki/史記/卷022</p><hr><p>時，匈奴眾失單于十餘日，右谷蠡王聞之，自立為單于。單于後得其眾，右王乃去單于之號。</p><p><strong>所出</strong>：《史記 · 卷111》 — https://zh.wikisource.org/wiki/史記/卷111</p></article></main></div></div>
