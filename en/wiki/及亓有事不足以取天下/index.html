    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 及亓有事也不足以取天下</nav></header><main><article><h1>及亓有事也不足以取天下</h1><p>聖人以有事取天下，則不足以取天下。</p><p>取天下之道，在乎无事。及有其事焉，雖欲取天下，不可得也。蓋有事則機心生，機心生則民散，民散則天下離。縱以兵戈威天下，猶不可以得之，況区区人事之有為乎。是故聖人處无為之事，行不言之教，萬物自正而天下自定。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第十一章 无為》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
