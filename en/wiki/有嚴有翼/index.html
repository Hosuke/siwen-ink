    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 有嚴有翼</nav></header><main><article><h1>有嚴有翼</h1><p>將帥敬謹而有序。</p><p>詩云「有嚴有翼，共武之服」。嚴，敬也；翼，輔也。言將帥既有敬謹之心，又有輔翼之臣，共脩武事也。將帥如此，故可以定王國。</p><p><strong>所出</strong>：《詩經 · 六月》 — https://zh.wikisource.org/wiki/詩經/六月</p></article></main></div></div>
