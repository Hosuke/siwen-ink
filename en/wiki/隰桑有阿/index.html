    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 隰桑有阿</nav></header><main><article><h1>隰桑有阿</h1><p>以濕地桑之盛美，喻思慕君子之情。</p><p>隰桑，生於低濕之地者也。「阿」言其曲隅，「難」言其葉盛。詩人見隰桑之婀娜茂美，而興思見君子之心。蓋桑生於下濕，而枝葉猶美，以比君子在野，小人在位，而其德不渝也。</p><p><strong>所出</strong>：《詩經 · 隰桑》 — https://zh.wikisource.org/wiki/詩經/隰桑</p></article></main></div></div>
