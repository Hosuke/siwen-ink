    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 果臝之實</nav></header><main><article><h1>果臝之實</h1><p>征人設想故園荒廢，瓜蔫蔓延於簷宇。</p><p>「果臝之實，亦施于宇」，征人遙想故里之荒也。果臝，瓜蔫也，其實蔓延，達於屋宇。室中則伊威（即地鱉）生焉，蠨蛸（蜘蛛）編戶。町畽鹿場，言禽獸遊行之跡也。熠燿宵行，言磷火夜明，幽明混淆。此皆述室廬之荒廢，而歸人之心不能不有所思也。</p><p><strong>所出</strong>：《詩經 · 東山》 — https://zh.wikisource.org/wiki/詩經/東山</p></article></main></div></div>
