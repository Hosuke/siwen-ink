    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 善為士者不武</nav></header><main><article><h1>善為士者不武</h1><p>君子為治不以武力威服。</p><p>士之善者，不矜其武力。《老子》河上公章句此言，以明君子為政，不貴剛武。士者，居官任事之稱。為士而善，非以甲兵為威，乃以德義服人。下文具四善之例：善戰者不怒，善勝敵者不與，善用人者為之下。此皆聖人之要道，以柔克剛、以卑取 high、俟時而動、不與物爭。故曰：是謂不爭之德。</p><p><strong>所出</strong>：《老子河上公章句 · 配天》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
