    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 聖人一之不膠</nav></header><main><article><h1>聖人一之不膠</h1><p>聖人兼行仁義禮智信，天下名之而不得。</p><p>聖人之道，或以仁為仁，或以義為仁，或以禮以智以信為仁。仁義禮智信，各兼五者，聖人一之不膠，天下名之不得。</p><p><strong>所出</strong>：《關尹子 · 3》 — https://zh.wikisource.org/wiki/關尹子/3</p></article></main></div></div>
