    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 五藏者中之守</nav></header><main><article><h1>五藏者中之守</h1><p>五藏為人身之中守，藏氣盛衰、形聲變化，皆可驗得守失守，以定死生。</p><p>「五藏者，中之守也。」言五臟藏精而守於內也。其驗之之法：中盛藏滿，氣勝傷恐，聲如從室中言，是中氣之濕也；言而微，終日乃復言，是奪氣也；衣被不斂，言語善惡不避親疏，是神明之亂也；倉廩不藏，是門戶不要也；水泉不止，是膀胱不藏也。得守者生，失守者死。</p><p><strong>所出</strong>：《黃帝內經 · 素問第五卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第五卷</p></article></main></div></div>
