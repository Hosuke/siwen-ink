    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 受邦之垢是胃社稷之主受邦之不祥是胃天下之王</nav></header><main><article><h1>受邦之垢是胃社稷之主受邦之不祥是胃天下之王</h1><p>能受一國之垢辱不祥者，方堪為社稷之主、天下之王。</p><p>天下莫柔弱於水，而攻堅強者莫之能易也。以亓無以易之也。水之朕剛也、弱之朕強也，天下莫弗知也，而所以然者何？水之朕剛也，弱之朕強也。</p><p>故聖人之言云曰：受邦之詬，是胃社稷之主；受邦之不祥，是胃天下之王。</p><p>正言若反。</p><p><strong>所出</strong>：《老子 (帛書本) · 章七十八》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
