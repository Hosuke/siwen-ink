    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 令有所屬</nav></header><main><article><h1>令有所屬</h1><p>文不足恃，故當使民有所歸屬。</p><p>故令有所屬者，聖智、仁義、巧利三者之文具既不足恃，故當使民之心意有所歸屬焉。</p><p><strong>所出</strong>：《老子河上公章句 · 還淳》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
