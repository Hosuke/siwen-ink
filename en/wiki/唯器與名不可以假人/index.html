    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 唯器與名不可以假人</nav></header><main><article><h1>唯器與名不可以假人</h1><p>器物名位關係國家興亡，不可假人以亂政紀。</p><p>仲叔于奚救孫桓子，衛人賞之以邑，辭，請曲縣繁纓以朝。仲尼聞之曰：「惜也，不如多與之邑。唯器與名，不可以假人。君之所司也。名以出信，信以守器，器以藏禮，禮以行義，義以生利，利以平民，政之大節也。若以假人，與人政也。政亡，則國家從之，弗可止也已。」</p><p><strong>所出</strong>：《春秋左氏傳 · 成公》 — https://zh.wikisource.org/wiki/春秋左氏傳/成公</p></article></main></div></div>
