    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 仲山父諫宣王立戲</nav></header><main><article><h1>仲山父諫宣王立戲</h1><p>仲山父以為立少不宜於教民</p><p>仲山父諫穆王不可立戲為魯世子，言：「今天子立諸侯而建其少，是敎逆也。令之不行，政之不立，行而不順，民將棄上。」又言若魯從之而諸侯效之，王命將有所壅；若不從而誅之，是自誅王命也。言之利害深切，而王卒立之，卒致懿公被殺、伯御代之之禍。</p><p><strong>所出</strong>：《國語 · 卷01》 — https://zh.wikisource.org/wiki/國語/卷01</p></article></main></div></div>
