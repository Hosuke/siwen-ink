    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 其寢不夢，其智不萌</nav></header><main><article><h1>其寢不夢，其智不萌</h1><p>真人寢不夢、智不萌，魄不抑、魂不騰，復歸太宵之宅而遊於無形。</p><p>是故其寢不夢，其智不萌，其魄不抑，其魂不騰。反覆終始，不知其端緒，甘瞑太宵之宅，而覺視於昭昭之宇，休息於無委曲之隅，而游敖於無形埒之野。居而無容，處而無所，其動無形，其靜無體，存而若亡，生而若死，出入無間，役使鬼神。淪於不測，入於無間，以不同形相嬗也，終始若環，莫得其倫。此精神之所以能登假於道也。</p><p><strong>所出</strong>：《淮南子 · 精神訓》 — https://zh.wikisource.org/wiki/淮南子/精神訓</p></article></main></div></div>
