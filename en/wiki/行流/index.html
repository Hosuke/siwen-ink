    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 行流</nav></header><main><article><h1>行流</h1><p>用貢國危出寶，國安行流。</p><p>管子以貢制論行流：中二齊之壤筴以為貢。用貢，則國危出寶；國安，則行流。流者，物之暢行於市也；貢者，物之斂藏於府也。一出一入，一斂一散，相時而動，相勢而施，此馭輕重之妙用，霸王之術也。</p><p><strong>所出</strong>：《管子 · 第75篇山權數》 — https://zh.wikisource.org/wiki/管子/第75篇山權數</p></article></main></div></div>
