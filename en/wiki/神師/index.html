    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 神師</nav></header><main><article><h1>神師</h1><p>假神率眾之術。</p><p>田單令城中人食必祭其先祖，飛鳥悉翔舞城中下食。燕人怪之。單宣言曰：「神來下教我。」乃令城中人曰：「當有神人為我師。」有一卒曰：「臣可以為師乎？」因反走。田單乃起，引還，東鄉坐，師事之。卒曰：「臣欺君，誠無能也。」田單曰：「子勿言也！」因師之。每出約束，必稱神師。城中兵民信之，士氣乃振。</p><p><strong>所出</strong>：《史記 · 卷082》 — https://zh.wikisource.org/wiki/史記/卷082</p></article></main></div></div>
