    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 以德行仁者王</nav></header><main><article><h1>以德行仁者王</h1><p>以力假仁者霸，必有大國；以德行仁者王，不待大。霸道非心服，力不贍故；王道心悅誠服，如七十子之服孔子。</p><p>孟子曰：「以力假仁者霸，霸必有大國；以德行仁者王，王不待大，湯以七十里，文王以百里。以力服人者，非心服也，力不贍也；以德服人者，中心悅而誠服也，如七十子之服孔子也。」</p><p><strong>所出</strong>：《孟子 · 公孫丑上》 — https://zh.wikisource.org/wiki/孟子/公孫丑上</p></article></main></div></div>
