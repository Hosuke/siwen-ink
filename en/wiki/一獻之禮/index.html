    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 一獻之禮</nav></header><main><article><h1>一獻之禮</h1><p>舅姑饗婦，以一獻之禮，奠酬而成。</p><p>厥明，舅姑共饗婦以一獻之禮。奠酬，舅姑先降自西階；婦降自阼階，以著代也。</p><p><strong>所出</strong>：《禮記 · 昏義》 — https://zh.wikisource.org/wiki/禮記/昏義</p></article></main></div></div>
