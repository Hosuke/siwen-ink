    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 樂彼之園</nav></header><main><article><h1>樂彼之園</h1><p>樂於是園，以喻聖賢樂育英才，亦以喻居高位者宜庇覆賢才。</p><p>鶴鳴于九皋，聲聞于野。魚潛在淵，或在于渚。樂彼之園，爰有樹檀，其下維蘀。他山之石，可以為錯。</p><p>園中有檀，其下有蘀。檀以喻賢，蘀以喻在下之才。園之所以可樂，正以其上庇嘉材、下育羣木也。以喻王者當樂育人材，使賢者居上位，而凡材亦得其所。</p><p><strong>所出</strong>：《詩經 · 鶴鳴》 — https://zh.wikisource.org/wiki/詩經/鶴鳴</p></article></main></div></div>
