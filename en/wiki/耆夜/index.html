    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 耆夜</nav></header><main><article><h1>耆夜</h1><p>武王戡耆旋師，與群臣飲至太室，各有歌詩以酬。</p><p>武王八年征伐耆，大戡之。還，乃飲至於文太室。畢公高為客，召公保奭為夾，周公叔旦為主，辛公甲為位，作策逸為東堂之客，呂尚父命為司正，監飲酒。</p><p>王與群臣迭相酬酢，作歌凡五章，周公終以《蟋蟀》之誦。席間皆稱頌旨酒、武德、天命，而歸本於康樂毋荒。其事足見周初君臣相得、戡亂不忘警惕之風。</p><p><strong>所出</strong>：《尚書 · 耆夜》 — https://zh.wikisource.org/wiki/尚書/耆夜</p></article></main></div></div>
