    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 棘門之變</nav></header><main><article><h1>棘門之變</h1><p>考烈王卒，李園伏死士於棘門，春申君入而被刺殺。</p><p>楚考烈王病時，朱英曾言李園陰養死士，楚王卒必先入殺春申君以滅口。春申君不能用其言。</p><p>後十七日，楚考烈王卒，李園果先入，伏死士於棘門之內。春申君入棘門，園死士俠刺春申君，斬其頭，投之棘門外。於是遂使吏盡滅春申君之家。</p><p>而李園女弟初幸春申君有身而入之王所生子者遂立，是為楚幽王。</p><p><strong>所出</strong>：《史記 · 卷078》 — https://zh.wikisource.org/wiki/史記/卷078</p></article></main></div></div>
