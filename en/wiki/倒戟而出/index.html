    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 倒戟而出</nav></header><main><article><h1>倒戟而出</h1><p>戎事尚果，臨陣倒兵以救人，君子非之。</p><p>宋師與鄭師戰于大棘，宋師敗績。鄭人入于井，宋之大夫狂狡，乃倒戟而出之，鄭人卒獲狂狡。君子曰：「失禮違命，宜其為禽也。戎昭果毅以聽之，之謂禮。殺敵為果，致果為毅。易之戮也。」夫軍旅之事，以殺敵致果為上，狂狡倒兵以出之，是亂命也，故君子非之。</p><p><strong>所出</strong>：《春秋左氏傳 · 宣公》 — https://zh.wikisource.org/wiki/春秋左氏傳/宣公</p></article></main></div></div>
