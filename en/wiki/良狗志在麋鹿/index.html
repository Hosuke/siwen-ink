    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 良狗志在麋鹿</nav></header><main><article><h1>良狗志在麋鹿</h1><p>喻大才者志在遠大，不屑細事。</p><p>齊有善相狗者，其鄰假以買取鼠之狗，期年乃得之。相者曰：「是良狗也。其志在獐麋豕鹿，不在鼠。欲其取鼠也則桎之。」其鄰桎其後足，狗乃取鼠。夫驥驁之氣，鴻鵠之志，有諭乎人心者誠也。人亦然。誠有之則神應乎人矣，言豈足以諭之哉？此謂不言之言也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十六》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十六</p></article></main></div></div>
