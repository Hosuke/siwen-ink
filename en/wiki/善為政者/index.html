    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 善為政者</nav></header><main><article><h1>善為政者</h1><p>善政之君能使田野闢、倉廩實、賢人進、姦民退，上下和同而有禮義。</p><p>善爲政者，田疇墾而國邑實，朝廷閒而官府治，公法行而私曲止，倉廩實而囹圄空，賢人進而姧民退。</p><p>其君子上中正而下諂諛，其士民貴武勇而賤得利，其庶人好耕農而惡飲食，於是財用足而飲食薪菜饒。</p><p>是故上必寬裕而有解舍，下必聽從而不疾怨，上下和同而有禮義。故處安而動威，戰勝而守固，是以一戰而正諸侯。</p><p><strong>所出</strong>：《管子 · 第10篇五輔》 — https://zh.wikisource.org/wiki/管子/第10篇五輔</p></article></main></div></div>
