    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 韶響難追，鄭聲易啟</nav></header><main><article><h1>韶響難追，鄭聲易啟</h1><p>雅頌之音難以復得，而鄭衛淫聲則易於流行，此樂道之患也。</p><p>自雅聲浸微，溺音騰沸。暨後郊廟，惟雜雅章，辭雖典文，而律非夔曠。魏之三祖，氣爽才麗，觀其北上秋風，志不出於淫蕩，辭不離於哀思，雖三調之正聲，實韶夏之鄭曲也。贊曰：「韶響難追，鄭聲易啟。豈惟觀樂，於焉識禮。」</p><p><strong>所出</strong>：《文心雕龍 · 樂府》 — https://zh.wikisource.org/wiki/文心雕龍/樂府</p></article></main></div></div>
