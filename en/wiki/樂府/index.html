    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 樂府</nav></header><main><article><h1>樂府</h1><p>聲依永而作，律和聲而成，朝廷採詩配樂之官署及詩體也。</p><p>樂府者，聲依永，律和聲也。自黃帝鈞天之奏，葛天八闋，以至塗山候人之南音，有娀飛燕之北聲，歷代音樂之流變，皆有可言者。暨秦燔《樂經》，漢初稍稍紹復，武帝遂崇禮而立樂府焉。夫樂府之職，總趙代之音，撮齊楚之氣，採詩配律，使謠詠得入樂章。然自雅聲浸微，溺音騰沸，正音乖俗，而樂府之旨漸失矣。贊曰：「八音摛文，樹辭為體。」</p><p><strong>所出</strong>：《文心雕龍 · 樂府》 — https://zh.wikisource.org/wiki/文心雕龍/樂府</p></article></main></div></div>
