    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 抱一毋舍</nav></header><main><article><h1>抱一毋舍</h1><p>持守真一之道，勿令有舍，是長生久視之要。</p><p>經云：「近在我心，不離己身，抱一毋舍，可以長存。」</p><p>「一」者，先天一氣之總名，太極之樞紐。伯陽以為，此道不在遠求，近在己心，不離己身。持守此一，勿令有舍，則形神不散，可以長存。</p><p>世人所以不能長存者，以其心外馳，不能抱一也。今棲遲僻陋、忽略利名、執守恬淡，正所以去物累、致虛極、守真一之功夫。晏然閑居，抱一毋舍，與道為一，故長生久視。</p><p><strong>所出</strong>：《周易參同契 · 35章》 — https://zh.wikisource.org/wiki/周易參同契/35章</p></article></main></div></div>
