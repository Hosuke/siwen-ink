    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 孔子適衞主顏濁鄒</nav></header><main><article><h1>孔子適衞主顏濁鄒</h1><p>孔子至衞國，住於顏濁鄒之家。</p><p>孔子遂適衞，主於子路妻兄顏濁鄒家。衞靈公問孔子：「居魯得祿幾何？」對曰：「奉粟六萬。」衞人亦致粟六萬。居頃之，或譖孔子於衞靈公。靈公使公孫余假一出一入。孔子恐獲罪焉，居十月，去衞。</p><p><strong>所出</strong>：《史記 · 卷047》 — https://zh.wikisource.org/wiki/史記/卷047</p></article></main></div></div>
