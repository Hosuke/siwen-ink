    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 物之不齊，物之情也</nav></header><main><article><h1>物之不齊，物之情也</h1><p>萬物之不齊，乃其自然之性，不可強同</p><p>許行主市賈不貳、同物同價之說。孟子駁之，謂「夫物之不齊，物之情也。或相倍蓰，或相什百，或相千萬」，若比而同之，是亂天下也。巨屨小屨同賈，人豈為之？從許子之道，是相率而為偽，烏能治國家。</p><p><strong>所出</strong>：《孟子 · 滕文公上》 — https://zh.wikisource.org/wiki/孟子/滕文公上</p></article></main></div></div>
