    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 天下歸之</nav></header><main><article><h1>天下歸之</h1><p>得天下者，在乎仁、德、義、道四者，能與天下共之，則天下歸心。</p><p>太公答文王問歸天下之道，分而言之：「天有時，地有財，能與人共之者，仁也；仁之所在，天下歸之。免人之死，解人有難，救人之患，濟人之急者，德也；德之所在，天下歸之。與人同憂同樂、同好同惡者，義也；義之所在，天下赴之。凡人惡死而樂生，好德而歸利，能生利者，道也；道之所在，天下歸之。」</p><p>四者雖殊，歸於「與天下共之」一語。此《六韜》政治哲學之核心，視天下為天下人所共有，而非君主之私產也。</p><p><strong>所出</strong>：《六韜》 — https://zh.wikisource.org/wiki/六韜</p></article></main></div></div>
