    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 三教歸一</nav></header><main><article><h1>三教歸一</h1><p>儒釋道三家之教雖分，而道本歸一，金丹為其大宗。</p><p>[[悟真篇]]以為，老氏以鍊養為真，釋氏以空寂為宗，儒家有窮理盡性至命之辭，三者各有所長，而皆可通於道。奈何後世黃緇之流，各自專門，互相非是，致使三家宗要迷沒邪歧，不能混一。僕遂以至人未遇，口訣難逢，既得真傳，乃成[[悟真篇]]九九八十一首詩文，會通三家，使歸一道。序云：「教雖分三，道乃歸一」，此之謂也。</p><p><strong>所出</strong>：《悟真篇》 — https://zh.wikisource.org/wiki/悟真篇</p></article></main></div></div>
