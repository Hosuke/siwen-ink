    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 躋彼公堂</nav></header><main><article><h1>躋彼公堂</h1><p>年終躋升公堂，飲燕稱壽也。</p><p>[[九月肅霜]]，[[十月滌場]]，朋酒斯饗，[[躋彼公堂]]，稱彼兕觥，萬壽無疆。[[授衣]]既成，歲功既畢，於是合鄉人共饗，而祝公堂之壽也。</p><p><strong>所出</strong>：《詩經 · 七月》 — https://zh.wikisource.org/wiki/詩經/七月</p></article></main></div></div>
