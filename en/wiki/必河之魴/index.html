    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 必河之魴</nav></header><main><article><h1>必河之魴</h1><p>食魚何必河魴，喻上位者不當苛求完美也。</p><p>豈其食魚，必河之魴。豈其取妻，必齊之姜。豈其食魚，必河之鯉。豈其取妻，必宋之子。</p><p>詩人自問曰：豈食魚必河之魴乎？豈娶妻必齊之姜乎？河魴，黃河之美魚；齊姜，齊國之貴姓。言食魚何必求魴，娶妻何必求姜，以喻上位者不必以盛滿為求，[[飲食之人則人皆賤之]]之戒也。[[衡門]]一篇，反覆言此，皆誡人臣當知止足，不可汲汲於高位顯祿。</p><p><strong>所出</strong>：《詩經 · 衡門》 — https://zh.wikisource.org/wiki/詩經/衡門</p></article></main></div></div>
