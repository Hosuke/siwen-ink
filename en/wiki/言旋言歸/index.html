    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 言旋言歸</nav></header><main><article><h1>言旋言歸</h1><p>決意返歸故土。</p><p>言旋言歸，復我邦族。言旋言歸，復我諸兄。言旋言歸，復我諸父。</p><p>詩人流寓他邦，見拒於人，乃決意旋行而歸於故土。「旋」者，轉身而去也。復我邦族、諸兄、諸父者，言故土之親情猶在，足以安居也。重言「言旋言歸」三見於三章，見其歸思益堅，不可留也。</p><p><strong>所出</strong>：《詩經·黃鳥》 — https://zh.wikisource.org/wiki/詩經/黃鳥</p></article></main></div></div>
