    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 以妄發之中秋毫為拙</nav></header><main><article><h1>以妄發之中秋毫為拙</h1><p>射而無的，雖中微物，終非善射；言行而無功用，雖有可觀，終非善言行。</p><p>砥礪殺矢而以妄發，其端未嘗不中秋毫也，然而不可謂善射者，無常儀的也。無常，則以妄發之中秋毫為拙。矢發而無的，不知所向，縱使偶然中於秋毫，亦不得謂之善射，以其無定向、無準的也。言行亦然，觀其言，察其行，皆有可觀，然不以功用為的，是亦妄發之類也。</p><p><strong>所出</strong>：《韓非子 · 問辯》 — https://zh.wikisource.org/wiki/韓非子/問辯</p></article></main></div></div>
