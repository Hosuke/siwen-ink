    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 天網恢恢踈而不失</nav></header><main><article><h1>天網恢恢踈而不失</h1><p>天網廣大雖疏，善惡之報終不遺漏。</p><p>天之為網也恢恢廣大，不可執持，不可以形迹求也。乍觀之，若甚踈闊；其實善善惡惡，纖毫無所遺失焉。是故報應之道，不于其近而于其遠，不于其顯而于其微。恢恢者天之量，踈而不失者天之信也。</p><p><strong>所出</strong>：《老子河上公章句 · 任為》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
