    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 趙簡子將有代</nav></header><main><article><h1>趙簡子將有代</h1><p>當道者預言簡子後嗣將代晉，有改革胡服之運，後襄子果有其事。</p><p>簡子使原過主霍泰山祠祀，受三神之令。其後娶空同氏，生五子。襄子為伯魯之不立也，不肯立子，且必欲傳位與伯魯子代成君。成君先死，乃取代成君子浣立為太子。襄子立三十三年卒，浣立，是為獻侯。</p><p>獻侯少即位，治中牟。襄子弟桓子逐獻侯，自立於代，一年卒。國人曰桓子立非襄子意，乃共殺其子而復迎立獻侯。十年，中山武公初立。十三年，城平邑。十五年，獻侯卒，子烈侯籍立。</p><p><strong>所出</strong>：《史記 · 卷043》 — https://zh.wikisource.org/wiki/史記/卷043</p></article></main></div></div>
