    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 忠告善道之不可則止</nav></header><main><article><h1>忠告善道之不可則止</h1><p>交友以忠言善道導之，不聽則止，毋自辱。</p><p>子貢問友。子曰：「忠告而善道之，不可則止，毋自辱焉。」</p><p>忠告者，盡心以相正也；善道者，善辭以引之也；不可則止，則不失己亦不失人也。朋友之道，忠而不瀆，善而不執，斯得之矣。</p><p><strong>所出</strong>：《論語 · 顏淵第十二》 — https://zh.wikisource.org/wiki/論語/顏淵第十二</p></article></main></div></div>
