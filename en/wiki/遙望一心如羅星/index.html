    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 遙望一心如羅星</nav></header><main><article><h1>遙望一心如羅星</h1><p>凝神內觀，心光朗現若北辰羅星。</p><p>一心澄明，光照內景，如天中羅星高懸。修煉至此，萬念俱寂、真心獨朗，此守一之功也。</p><p><strong>所出</strong>：《黃庭內景經 · 呼吸章第二十》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/呼吸章第二十</p></article></main></div></div>
