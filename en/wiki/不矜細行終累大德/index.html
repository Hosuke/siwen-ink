    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 不矜細行，終累大德</nav></header><main><article><h1>不矜細行，終累大德</h1><p>小節不謹，終損大德；防微杜漸，君子所謹。</p><p>嗚呼！夙夜罔或不勤，不矜細行，終累大德。細行者，小節也。小節之不矜，如[[功虧一簣]]之於[[為山九仞]]，雖盛德累積，猶可以一朝而累之。是以君子敬慎威儀，修其[[德盛不狎侮]]之行，而不以細行自恕也。嗚呼二字，見太保深戒之切。</p><p><strong>所出</strong>：《尚書 · 旅獒》 — https://zh.wikisource.org/wiki/尚書/旅獒</p></article></main></div></div>
