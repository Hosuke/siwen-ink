    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 末宦之暇</nav></header><main><article><h1>末宦之暇</h1><p>居官秩末之時，公餘之暇。</p><p>倞以末宦之暇，頗窺篇籍，竊感炎黃之風未洽於聖代，謂荀、孟有功於時政，尤所耽慕。</p><p><strong>所出</strong>：《荀子 · 荀子序》 — https://zh.wikisource.org/wiki/荀子/荀子序</p></article></main></div></div>
