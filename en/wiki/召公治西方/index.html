    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 召公治西方</nav></header><main><article><h1>召公治西方</h1><p>召公巡行西方，民各得其所，惠澤及於棠樹。</p><p>召公之治西方，甚得兆民之和。召公巡行鄉邑，有棠樹，決獄政事其下，自侯伯至庶人各得其所，無失職者。召公卒，而民人思召公之政，懷棠樹不敢伐，哥詠之，作甘棠之詩。</p><p><strong>所出</strong>：《史記 · 卷034》 — https://zh.wikisource.org/wiki/史記/卷034</p></article></main></div></div>
