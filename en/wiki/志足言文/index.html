    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 志足而言文</nav></header><main><article><h1>志足而言文</h1><p>情志充實則言辭自美，文之美惡本於情志之虛實也。</p><p>《征聖》明文章之要旨曰：「志足而言文，情信而辭巧。」志者，心之所之也；情者，心之所得也。志充於中，則言自豐；情實於中，則辭自美。言非文不傳，辭非巧不行，然志與情者，文與辭之本也。情欲信，辭欲巧——信者不妄，巧者不失其正。此乃含章之玉牒、秉文之金科，不可易者也。外此而言文，猶逐影而忘形也。</p><p><strong>所出</strong>：《文心雕龍 · 征聖》 — https://zh.wikisource.org/wiki/文心雕龍/徵聖</p></article></main></div></div>
