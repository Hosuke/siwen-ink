    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 吐故納新</nav></header><main><article><h1>吐故納新</h1><p>導引之士，去濁納清，吐故而納新，以求長生。</p><p>吹呴呼吸，吐故納新，熊經鳥申，為壽而已矣：此道引之士、養形之人、彭祖壽考者之所好也。</p><p><strong>所出</strong>：《莊子 · 刻意》 — https://zh.wikisource.org/wiki/莊子/刻意</p></article></main></div></div>
