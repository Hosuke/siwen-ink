    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 視履考祥</nav></header><main><article><h1>視履考祥</h1><p>審視所履，考其善惡，以定吉凶。</p><p>上九：視履考祥，其旋元吉。</p><p>[[視履考祥]]者，觀省一己之所履，考察其善惡禍福。履終而能反觀自省，則知所從違。旋者，周旋完滿、歸復本原之義。返躬而無愧，故元吉。</p><p><strong>所出</strong>：《周易 · 履》 — https://zh.wikisource.org/wiki/周易/履</p></article></main></div></div>
