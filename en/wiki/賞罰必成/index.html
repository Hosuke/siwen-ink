    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 賞罰必成</nav></header><main><article><h1>賞罰必成</h1><p>賞罰必成，使民信之；德莫博厚，使民死之。</p><p>故德莫若博厚，使民死之。賞罰莫若必成，使民信之。夫善牧民者，非以城郭也，輔之以什，司之以伍。伍無非其人，人無非其里，里無非其家。故奔亡者無所匿，遷徙者無所容。不求而約，不召而來，故民無流亡之意，吏無備追之憂。故主政可往於民，民心可係於主。</p><p><strong>所出</strong>：《管子 · 第53篇禁藏》 — https://zh.wikisource.org/wiki/管子/第53篇禁藏</p></article></main></div></div>
