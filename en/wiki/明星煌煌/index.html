    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 明星煌煌</nav></header><main><article><h1>明星煌煌</h1><p>晨星燦然，喻久候未得之人</p><p>明星，啟明之星也，朝見於東方，光耀燦然，故曰煌煌。明星煌煌，狀其光之盛也；《東門之楊》言「昏以為期，明星煌煌」，是已逾昏時，而明星已出，久待不至之意也。</p><p>《毛詩》傳云：「明星，啟明之星。」天文言之，啟明即金星，晨見於東，光芒特亮。古人觀之以候時節，此詩以之星象之明，襯人情之寂，候者望彼明星，而所期之人終未至也。</p><p>「皙皙」與「煌煌」皆狀明星之光，迭字成義，聲韻相諧，亦見詩人反覆詠歎之情。</p><p><strong>所出</strong>：《詩經 · 東門之楊》 — https://zh.wikisource.org/wiki/詩經/東門之楊</p></article></main></div></div>
