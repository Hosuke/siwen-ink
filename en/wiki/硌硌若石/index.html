    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 硌硌若石</nav></header><main><article><h1>硌硌若石</h1><p>不欲華美若玉，而務樸質若石，以明返樸之旨。</p><p>帛書本言：「不欲<strong>祿祿若玉</strong>，<strong>硌硌若石</strong>。」</p><p><strong>硌硌</strong>，石塊然之貌。玉光彩外見，華而實不至；石塊然在下，質而用不窮。不欲若玉之<strong>盈</strong>而炫，而務若石之<strong>窳</strong>而實，此[[不欲盈]]之旨也。</p><p>王弼本「珞珞如石」，帛書「硌硌若石」，字異而義同。皆言聖人內充而外損，不以外飾亂其真也。見[[致數與无與]]。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第二章 得一》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
