    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 各復歸其根</nav></header><main><article><h1>各復歸其根</h1><p>萬物終歸其本</p><p>萬物雖芸芸盛多，終各復歸其根。根者，本也、原也、始也。物生於無、歸於無，[[返本歸根]]之謂也。譬如葉落歸根，水流歸海，人之生死、國之興亡，莫不有其根。知此根者，不以物之盛衰而動心。</p><p><strong>所出</strong>：《道德經 (王弼本) · 十六章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
