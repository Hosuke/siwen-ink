    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 井渠</nav></header><main><article><h1>井渠</h1><p>穿渠崖善崩，乃為井井下相通之法，為龍首渠所創。</p><p>井渠者，穿渠引水之法也。尋常渠道遇崖岸善崩之地，則無法施工，乃穿井代之。井深者四十餘丈，往往為井，井下相通行水，水流由地下相通，自一井達於他井，引水過山。此法始於龍首渠，《史記》明言「井渠之生自此始」。蓋我國西北黃土高原土質疏鬆，渠道易崩，故鑿井地下引流，實為因地制宜之智術也。</p><p><strong>所出</strong>：《史記 · 卷029》 — https://zh.wikisource.org/wiki/史記/卷029</p></article></main></div></div>
