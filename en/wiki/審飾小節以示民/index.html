    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 審飾小節以示民</nav></header><main><article><h1>審飾小節以示民</h1><p>聖王禁飾小節以動上、假爵以臨朝。</p><p>飾於貧窮，而發於勤勞，權於貧賤，身無職事，家無常姓，列上下之閒，議言為民者，聖王之禁也。壹士以為亡資，脩田以為亡本，則生之養私不死，然後失矯以深，與上為市者，聖王之禁也。審飾小節以示民，時言大事以動上，遠交以踰羣，假爵以臨朝者，聖王之禁也。</p><p><strong>所出</strong>：《管子 · 第14篇法禁》 — https://zh.wikisource.org/wiki/管子/第14篇法禁</p></article></main></div></div>
