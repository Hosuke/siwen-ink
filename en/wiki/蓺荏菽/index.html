    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 蓺荏菽</nav></header><main><article><h1>蓺荏菽</h1><p>后稷幼年即能種植菽豆，技藝過人。</p><p>后稷孩提之時，甫能匍匐，即知求食。稍長，蓺種荏菽，其葉斾斾，茂盛異常。詩人稱其異稟，以見后稷之善種，非學而能，天性然也。</p><p><strong>所出</strong>：《詩經 · 生民》 — https://zh.wikisource.org/wiki/詩經/生民</p></article></main></div></div>
