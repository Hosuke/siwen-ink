    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 不貴異物，賤用物</nav></header><main><article><h1>不貴異物，賤用物</h1><p>珍奇之物不足貴，日用之物不可賤；貴賤倒置，則民不給。</p><p>不作無益害有益，功乃成；不貴異物賤用物，民乃足。異物者，遠方所貢珍奇之屬；用物者，服食器用之日需也。[[不貴異物]]者，不以遠來之物為貴；[[賤用物]]者，不以日用之物為賤也。夫民之所需，在於實用，不在奇貨。遠物之來，用飾耳目，耳目役則心志渝矣；用物之備，在於養生，生養足則民心安矣。是以明王貴之。</p><p><strong>所出</strong>：《尚書 · 旅獒》 — https://zh.wikisource.org/wiki/尚書/旅獒</p></article></main></div></div>
