    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 四方風神</nav></header><main><article><h1>四方風神</h1><p>八風各有神靈司之</p><p>諸稽、攝提，條風之所生也。通視，明庶風之所生也。赤奮若，清明風之所生也。共工，景風之所生也。諸比，涼風之所生也。皋稽，閶闔風之所生也。隅強，不周風之所生也。窮奇，廣莫風之所生也。</p><p><strong>所出</strong>：《淮南子 · 墜形訓》 — https://zh.wikisource.org/wiki/淮南子/墜形訓</p></article></main></div></div>
