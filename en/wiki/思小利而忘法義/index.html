    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 思小利而忘法義</nav></header><main><article><h1>思小利而忘法義</h1><p>小利之臣進則揜蔽賢良，退則撓亂百官，輔其君以遂其欲。</p><p>若夫周滑之、鄭王孫申、陳公孫寧、儀行父、荆芋尹申亥、隨少師、越種干、吳王孫頟、晉陽成泄、齊竪刁、易牙，此十二人者之為其臣也，皆思小利而忘法義，進則揜蔽賢良以陰闇其主，退則撓亂百官而為禍難；皆輔其君，共其欲，苟得一說於王，雖破國殺衆，不難為也。</p><p><strong>所出</strong>：《韓非子 · 說疑》 — https://zh.wikisource.org/wiki/韓非子/說疑</p></article></main></div></div>
