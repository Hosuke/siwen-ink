    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 剛上而尚賢</nav></header><main><article><h1>剛上而尚賢</h1><p>剛居上位，尊賢任能，以成畜德之治。</p><p>彖辭言「剛上而尚賢」，陽爻居上，剛健在上，而能尊尚賢者。尚賢，治道之本也；畜德而能用賢，則德愈大而功愈遠矣。</p><p><strong>所出</strong>：《周易 · 大畜》 — https://zh.wikisource.org/wiki/周易/大畜</p></article></main></div></div>
