    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 說以犯難，民忘其死</nav></header><main><article><h1>說以犯難，民忘其死</h1><p>君以悅道發民，雖赴危蹈難，民亦欣然忘身。</p><p>語出彖傳。犯難，謂冒險犯難也。民之悅上，既忘其勞；則有事之時，蹈赴危亡，亦忘其死。蓋感分之至，不復計較生死利害，此為政悅民之效也。</p><p><strong>所出</strong>：《周易 · 兌》 — https://zh.wikisource.org/wiki/周易/兌</p></article></main></div></div>
