    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 韓穆子辭公族</nav></header><main><article><h1>韓穆子辭公族</h1><p>韓穆子以厲公之亂無功辭掌公族，悼公嘉其能讓而授之。</p><p>韓獻子老，使公族穆子受事於朝。辭曰：「厲公之亂，無忌備公族，不能死。臣聞之曰：『無功庸者，不敢居高位。』今無忌，智不能匡君，使至於難，仁不能救，勇不能死，敢辱君朝以忝韓宗，請退也。」固辭不立。</p><p>悼公聞之，曰：「難雖不能死君而能讓，不可不賞也。」使掌公族大夫。</p><p><strong>所出</strong>：《國語 · 卷13》 — https://zh.wikisource.org/wiki/國語/卷13</p></article></main></div></div>
