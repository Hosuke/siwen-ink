    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 魂魄歸徠</nav></header><main><article><h1>魂魄歸徠</h1><p>招魂歸來，勿遠遊四方。</p><p>魂兮歸徠！青春受謝，白日昭只。春氣奮發，萬物遽只。冥淩浹行，魂無逃只。魂魄歸徠，無遠遥只！魂兮歸徠，無東無西，無南無北只！</p><p>文以「魂魄歸徠」發端，反覆申述，欲招遊魂之遠逝者返其故土也。初言春氣發越，萬物蓬勃，魂當自奮以歸；繼言四方皆有險難，東則溺海、螭龍、霧雨；南則火千里、蝮蛇；西則流沙、豕首之怪；北則寒山、逴龍、代水之深。言外之意，四方皆不可久留，唯故土荊楚為安宅也。</p><p><strong>所出</strong>：《楚辭 · 大招》 — https://zh.wikisource.org/wiki/楚辭/大招</p></article></main></div></div>
