    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 後世賢師吾儉</nav></header><main><article><h1>後世賢師吾儉</h1><p>蕭何置田宅必居窮處，戒後世勿為勢家所奪。</p><p>蕭何置田宅必居窮處，為家不治垣屋。曰：「後世賢，師吾儉；不賢，毋為勢家所奪。」夫厚藏者怨之府，隘居者安之基。儉以修身，儉以遺後，其操心也危，其慮患也深，豈徒愛財而已哉！</p><p><strong>所出</strong>：《史記 · 卷053》 — https://zh.wikisource.org/wiki/史記/卷053</p></article></main></div></div>
