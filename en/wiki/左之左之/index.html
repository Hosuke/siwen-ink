    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 左之左之</nav></header><main><article><h1>左之左之</h1><p>左有宜者，君子左右皆賢也。</p><p>「左之左之，君子宜之。」左之者，左道之宜者也。言君子在左則宜左，在右則宜右，左右皆得其人，無不宜者。此言君子身旁輔弼之臣皆賢，故能左右逢源也。</p><p><strong>所出</strong>：《詩經 · 裳裳者華》 — https://zh.wikisource.org/wiki/詩經/裳裳者華</p></article></main></div></div>
