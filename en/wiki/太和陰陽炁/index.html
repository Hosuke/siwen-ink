    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 太和陰陽炁</nav></header><main><article><h1>太和陰陽炁</h1><p>獨食太和，可不死天相</p><p>太和陰陽炁者，天地太和之氣，修真者獨食此炁，可以不死天相也。</p><p>經云：「人食穀與五味，獨食太和陰陽炁，故能不死天相」，言不食五穀而食太和之炁，乃長生之上法。</p><p><strong>所出</strong>：《黃庭外景經》 — https://zh.wikisource.org/wiki/黃庭外景經</p></article></main></div></div>
