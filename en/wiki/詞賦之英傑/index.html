    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 詞賦之英傑</nav></header><main><article><h1>詞賦之英傑</h1><p>《楚辭》雖為《雅》《頌》之博徒，實為詞賦之英傑。</p><p>固知《楚辭》者，體慢於三代，而風雅於戰國，乃《雅》、《頌》之博徒，而詞賦之英傑也。</p><p><strong>所出</strong>：《文心雕龍 · 辨騷》 — https://zh.wikisource.org/wiki/文心雕龍/辨騷</p></article></main></div></div>
