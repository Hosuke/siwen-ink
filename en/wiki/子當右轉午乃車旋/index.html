    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 子當右轉午乃車旋</nav></header><main><article><h1>子當右轉午乃車旋</h1><p>喻陰陽運轉，如車輪之旋。</p><p>子當右轉，午乃車旋。</p><p>子為陽生之位，午為陰盛之鄉。子時陽氣右轉，午時如車之旋。丹家取法天地之運，以人身之陰陽合天行之躔次，乃可成丹。此象天地之門戶，而以車旋為喻，明其無停息也。</p><p><strong>所出</strong>：《周易參同契 · 24章》 — https://zh.wikisource.org/wiki/周易參同契/24章</p></article></main></div></div>
