    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 小惑易方大惑易性</nav></header><main><article><h1>小惑易方大惑易性</h1><p>小惑變方向，大惑變本性；世之殉物者，皆失其性命之情。</p><p>何以知其然邪？自虞氏招仁義以撓天下也，天下莫不奔命於仁義，是非以仁義易其性與？莊子以為，夫小惑易方，大惑易性。小惑者，方向之迷，猶可返也；大惑者，本性之奪，不可復也。故嘗試論之：自三代以下者，天下莫不以物易其性矣。嗚呼！小大之惑，差之毫釐，謬之千里，其為累豈有極哉！</p><p><strong>所出</strong>：《莊子 · 駢拇》 — https://zh.wikisource.org/wiki/莊子/駢拇</p></article></main></div></div>
