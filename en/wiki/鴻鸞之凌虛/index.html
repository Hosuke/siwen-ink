    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 鴻鸞之凌虛</nav></header><main><article><h1>鴻鸞之凌虛</h1><p>俊彥之能成大功，必資良輔。</p><p>鴻鸞之淩虛者，六翮之力也；淵虬之天飛者，雲霧之偕也。</p><p>夫大才之士，若鴻鸞淩於太虛，恃六翮以翔空；若淵虬騰於天衢，賴雲霧以並馳。是知孤立無援者，雖有絕世之才，不能獨成其功也。故聖主欲建鴻勳，必修人道之塗廣其翼；賢佐欲展素抱，必待明主之明用其長。君臣相濟，猶翼與風相助、霧與龍相從，乃可以翔萬里、登九霄也。</p><p><strong>所出</strong>：《抱朴子 · 卷11》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷11</p></article></main></div></div>
