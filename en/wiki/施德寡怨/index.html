    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 施德寡怨</nav></header><main><article><h1>施德寡怨</h1><p>施恩狹隘則怨多，施恩博廣則怨亡。</p><p>施恩博而怨者弗歸，非施之多寡，實德之廣狹也。恩狹者怨集，德廣者怨散，此亦物理之自然者歟。</p><p><strong>所出</strong>：《淮南子 · 繆稱訓》 — https://zh.wikisource.org/wiki/淮南子/繆稱訓</p></article></main></div></div>
