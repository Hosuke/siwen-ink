    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 李離</nav></header><main><article><h1>李離</h1><p>晉理李離過聽殺人，伏劍而死，以明失刑之罪</p><p>李離者，晉文公之理也。過聽殺人，自拘當死。文公曰：「官有貴賤，罰有輕重。下吏有過，非子之罪也。」李離曰：「臣居官爲長，不與吏讓位；受祿爲多，不與下分利。今過聽殺人，傅其罪下吏，非所聞也。」辭不受令。文公曰：「子則自以爲有罪，寡人亦有罪邪？」李離曰：「理有法，失刑則刑，失死則死。公以臣能聽微決疑，故使爲理。今過聽殺人，罪當死。」遂不受令，伏劍而死。</p><p><strong>所出</strong>：《史記 · 卷119》 — https://zh.wikisource.org/wiki/史記/卷119</p></article></main></div></div>
