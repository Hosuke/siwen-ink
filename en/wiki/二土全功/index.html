    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 二土全功</nav></header><main><article><h1>二土全功</h1><p>戊己二土相合，功成全備，為還丹之要。</p><p>子午數合三，戊己號稱五。三五既和諧，八石正綱紀。</p><p>魏伯陽以子午為火數，戊己為土數。火自子而升，數至三而陽浸盛；土位中央，寄旺於五。戊己者，真意之別名也。以其位鎮中宮，馭馭呼吸，往來含育，而能使坎離交構、龍虎會逢，故曰「二土全功」。土為萬物之母，攝御四象，循是而還丹可就。</p><p><strong>所出</strong>：《周易參同契 · 11章》 — https://zh.wikisource.org/wiki/周易參同契/11章</p></article></main></div></div>
