    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 有洌氿泉，無浸獲薪</nav></header><main><article><h1>有洌氿泉，無浸獲薪</h1><p>冽泉不可浸薪，喻人不可失所</p><p>冽泉，出於厓底之泉也。氿泉，側出之泉也。言有冽然而寒之氿泉，人不可浸濕已獲之薪也。皆水之不能得時者。詩人以此興下文言東人困悴，薪為獲薪，人不可以失所也。水不可以浸薪，猶法不可以困民。</p><p><strong>所出</strong>：《詩經 · 大東》 — https://zh.wikisource.org/wiki/詩經/大東</p></article></main></div></div>
