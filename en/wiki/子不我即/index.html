    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 子不我即</nav></header><main><article><h1>子不我即</h1><p>思人而人不至，怨慕之情溢於言表。</p><p>豈不爾思？子不我即。</p><p>詩人自言：豈不思子乎？特子不肯來就我也。「不我即」者，不肯降臨就我之謂也。思之深而怨之切，故以此詰問出之。</p><p>此與「其室則邇，其人甚遠」相呼應，見物理之近不足恃，而人情之隔為可歎焉。</p><p><strong>所出</strong>：《詩經 · 東門之墠》 — https://zh.wikisource.org/wiki/詩經/東門之墠</p></article></main></div></div>
