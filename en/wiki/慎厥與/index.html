    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 慎厥與</nav></header><main><article><h1>慎厥與</h1><p>始終慎所與，治亂之端判焉。</p><p>伊尹誥王，以終始慎厥與為明後之首務。言人之趨向，所與為善則治，所與為惡則亂，故明主治事，必先慎所親附。與善人同道，則國興；與惡人同事，則國亡。此[[德惟治否德亂]]之說所從出也。</p><p><strong>所出</strong>：《尚書 · 太甲下》 — https://zh.wikisource.org/wiki/尚書/太甲下</p></article></main></div></div>
