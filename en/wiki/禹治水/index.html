    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 禹治水</nav></header><main><article><h1>禹治水</h1><p>禹憂民溺水，勞身焦思，十三年不入家門，終平水土。</p><p>鴻水滔天，下民其憂。禹受堯命，鯀績不成，禹乃與益、稷奉堯命，續鯀之業。禹傷先人功之不成受誅，乃勞身焦思，居外十三年，過家門不敢入。薄衣食，致孝于鬼神。卑宮室，致費於溝淢。陆行乘車，水行乘船，泥行乘橇，山行乘檋。左準繩，右規矩，載四時，以開九州，通九道，陂九澤，度九山。食少，調有餘相給，以均諸侯。遂使天下洪水得平。</p><p><strong>所出</strong>：《史記 · 卷002》 — https://zh.wikisource.org/wiki/史記/卷002</p></article></main></div></div>
