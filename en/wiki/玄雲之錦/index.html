    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 玄雲之錦</nav></header><main><article><h1>玄雲之錦</h1><p>盟誓之帛，代替割髮歃血之約。</p><p>古者盟用[[玄雲之錦]]九十尺、金簡鳳文之羅四十尺、金鈕九雙，以代割髮歃血之約。今錦可用白絹，羅可用青布，鈕可用金鐓，亦足以誓信九天，制告三官。</p><p><strong>所出</strong>：《黃庭內景經 · 序》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/序</p></article></main></div></div>
