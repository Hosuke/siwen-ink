    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 以人言善我必以人言罪我</nav></header><main><article><h1>以人言善我必以人言罪我</h1><p></p><p>魯丹三說中山之君而不受也，因散五十金事其左右。復見，未語，而君與之食。魯丹出，而不反舍，遂去中山。其御曰：「反見，乃始善我，何故去之？」魯丹曰：「夫以人言善我，必以人言罪我。」未出境，而公子惡之曰：「爲趙來間中山。」君因索而罪之。</p><p>  <strong>所出</strong>：《韓非子 · 說林上》 — https://zh.wikisource.org/wiki/韓非子/說林上</p></article></main></div></div>
