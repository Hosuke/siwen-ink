    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 三壇同墠</nav></header><main><article><h1>三壇同墠</h1><p>周公為武王病設三壇共一墠，卜以祈福。</p><p>武王旣克殷三年，王不豫。二公告周公，欲為王穆卜。周公曰：「未可以蹙吾先王。」乃為三壇同墠，爲一壇於南方，周公立焉。[[秉璧戴珪]]</p><p>三壇同墠，乃周公為祈請先王、欲以身代武王之疾而行祭之儀也。</p><p><strong>所出</strong>：《尚書 · 周武王有疾周公所自以代王之志》 — https://zh.wikisource.org/wiki/尚書/周武王有疾周公所自以代王之志</p></article></main></div></div>
