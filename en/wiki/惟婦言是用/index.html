    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 惟婦言是用</nav></header><main><article><h1>惟婦言是用</h1><p>聽信讒言而棄骨肉、怠祭祀，國必亡。</p><p>「今商王受，惟婦言是用。昏棄厥肆祀，弗答；昏弃厥遺王父母弟，不迪。」言獨夫受專聽[[妲己]]之言，絕先祖之祀，疏骨肉之親，任[[四方之多罪逋逃是崇是長]]，遂至[[暴虐無親]]、姦宄充商邑也。</p><p><strong>所出</strong>：《尚書 · 牧誓》 — https://zh.wikisource.org/wiki/尚書/牧誓</p></article></main></div></div>
