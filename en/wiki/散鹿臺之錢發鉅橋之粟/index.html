    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 散鹿臺之錢發鉅橋之粟</nav></header><main><article><h1>散鹿臺之錢發鉅橋之粟</h1><p></p><p>武王伐紂，散鹿臺之錢，發鉅橋之粟，以振貧民。封比干墓，釋箕子囚，遷九鼎，修周政。此散財以惠民、贖過以招來之道也。</p><p>  <strong>所出</strong>：《史記 · 卷032》 — https://zh.wikisource.org/wiki/史記/卷032</p></article></main></div></div>
