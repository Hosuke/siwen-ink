    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 北冥有魚</nav></header><main><article><h1>北冥有魚</h1><p>北海有魚，化而為鵬，志存高遠。</p><p>北冥有魚，其名為鯤。鯤之大，不知其幾千里也。化而為鳥，其名為鵬。鵬之背，不知其幾千里也；怒而飛，其翼若垂天之雲。是鳥也，海運則將徙於南冥。南冥者，天池也。《齊諧》者，志怪者也。《諧》之言曰：「鵬之徙於南冥也，水擊三千里，摶扶搖而上者九萬里，去以六月息者也。」</p><p>世人仰視蒼穹，以為正色；不知其遠無極，鵬之視下，亦若是而已。蓋物之大小高下，皆相對而論，未可執一端以概其全也。</p><p><strong>所出</strong>：《莊子 · 逍遙遊》 — https://zh.wikisource.org/wiki/莊子/逍遙遊</p></article></main></div></div>
