    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 金液還丹破迷</nav></header><main><article><h1>金液還丹破迷</h1><p>辨金丹正道，破旁門小術</p><p>還丹之要在於陰陽交合、鉛汞相接。先築基，後進藥，百日功夫牢抱着。若將鉛汞歸眞土，抽鉛永滅。烏八兩、兔半斤，二物同入戊己村。十月功勤火候足，純陽煉就壽無窮。換鼎移胎三五載，九年面壁出陽神。饒服炁，空煉精，閉尾閭而望飛昇，不得金丹總不成。</p><p><strong>所出</strong>：《張三丰先生全集 · 卷4》 — https://zh.wikisource.org/wiki/張三丰先生全集/卷4</p></article></main></div></div>
