    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 監于二代</nav></header><main><article><h1>監于二代</h1><p>取鑒夏商之興亡，以德為本，以敬為先。</p><p>我不敢知曰，有夏服天命，惟有歷年；我不敢知曰，不其延，惟不敬厥德，乃早墜厥命。我不敢知曰，有殷受天命，惟有歷年；我不敢知曰，不其延，惟不敬厥德，乃早墜厥命。</p><p>今王嗣受厥命，我亦惟茲二國命，嗣若功。</p><p>是故明主監于二代，非徒紀其故事，乃審其興亡之故，以為今日之戒也。</p><p><strong>所出</strong>：《尚書 · 召誥》 — https://zh.wikisource.org/wiki/尚書/召誥</p></article></main></div></div>
