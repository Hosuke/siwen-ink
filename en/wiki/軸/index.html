    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 軸</nav></header><main><article><h1>軸</h1><p>轉旋之意，軸旋而有餘趣。</p><p>「軸」者，事物所恃以轉旋者也。[[考磐]]末章言「[[碩人之軸]]」，言[[碩人]]居[[在陸]]而心有軸旋之趣，無往而不自得也。軸之為物，恃之則能運，[[碩人]]以此自喻，言其心之自在，無所窒礙。</p><p><strong>所出</strong>：《詩經 · 考磐》 — https://zh.wikisource.org/wiki/詩經/考磐</p></article></main></div></div>
