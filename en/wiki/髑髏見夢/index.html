    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 髑髏見夢</nav></header><main><article><h1>髑髏見夢</h1><p>莊子見髑髏，夢聞死之樂，蓋生死之論也。</p><p>莊子之楚，見空髑髏，髐然有形，撽以馬捶，因而問之。夢中髑髏曰：「死，無君於上，無臣於下，亦無四時之事，從然以天地為春秋，雖南面王樂，不能過也。」</p><p>莊子不信，欲復之，髑髏深矉蹙頞曰：「吾安能棄南面王樂而復為人閒之勞乎！」</p><p><strong>所出</strong>：《莊子 · 至樂》 — https://zh.wikisource.org/wiki/莊子/至樂</p></article></main></div></div>
