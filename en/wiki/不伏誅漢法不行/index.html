    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 不伏誅漢法不行</nav></header><main><article><h1>不伏誅漢法不行</h1><p>梁王犯法而不誅，則漢法不行於天下，故為陛下憂也。</p><p>田叔還報，景帝問其事安在，叔曰：「上毋以梁事為也。」上曰：「何也？」曰：「今梁王不伏誅，是漢法不行也；如其伏法，而太后食不甘味，臥不安席，此憂在陛下也。」景帝大賢之，以為魯相。</p><p><strong>所出</strong>：《史記 · 卷104》 — https://zh.wikisource.org/wiki/史記/卷104</p></article></main></div></div>
