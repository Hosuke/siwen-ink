    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 不籍而贍國</nav></header><main><article><h1>不籍而贍國</h1><p>循軌守時、官天財，則國用自足，不待橫賦於民。</p><p>管子以爲治國之道在軌守，不在重斂。軌守其時，則田有餘粟；官天財，則山澤之利可掌；輕重用幣，則穀與萬物之價可調。如是則國用足，而不籍於民。設官置吏以掌鹽鐵之利，因時節用，此其法也。</p><p><strong>所出</strong>：《管子 · 第74篇山國軌》 — https://zh.wikisource.org/wiki/管子/第74篇山國軌</p></article></main></div></div>
