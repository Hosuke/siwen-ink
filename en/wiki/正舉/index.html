    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 正舉</nav></header><main><article><h1>正舉</h1><p>黃為正色，青白相合之碧為非正舉。喻之君臣國，則各正其所舉者為正，爭而不決者為非正。</p><p>黃其正矣，是正舉也。黃，正色也，天下固有黃矣。以青、白喻君臣，黃以喻國，故君臣各正其所舉，則國强而君壽矣。</p><p>非正舉者，碧也。青、白不相與，而相與不相勝，則兩明也。爭而明，其色碧也。碧則非正舉矣。非正舉者，名實無當，驪色章焉。</p><p>是正舉者，名實相當，黃中居位，不偏於青，不偏於白，而天下之正色備矣。</p><p><strong>所出</strong>：《公孫龍子 · 4》 — https://zh.wikisource.org/wiki/公孫龍子/4</p></article></main></div></div>
