    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 非長生難，聞道難</nav></header><main><article><h1>非長生難，聞道難</h1><p>非長生難，聞道難；非聞道難，行之難；非行之難，終之難。</p><p>故曰：非長生難也，聞道難也；非聞道難也，行之難也；非行之難也，終之難也。良匠能與人規矩，不能使人必巧也；明師能授人方書，不能使人必為也。</p><p><strong>所出</strong>：《抱朴子 · 卷13》 — https://zh.wikisource.org/wiki/抱朴子/卷13</p></article></main></div></div>
