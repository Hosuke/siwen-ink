    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 六轡沃若</nav></header><main><article><h1>六轡沃若</h1><p>六轡光澤柔潤之貌。</p><p>「乘其四駱，六轡沃若。」轡，轡繩也。沃若，光澤柔潤之貌。六轡者，禦者所執六轡也。馬壯轡美，見君子威儀之盛。鄭《箋》云「沃若，猶沃沃然」，言其光澤。</p><p><strong>所出</strong>：《詩經 · 裳裳者華》 — https://zh.wikisource.org/wiki/詩經/裳裳者華</p></article></main></div></div>
