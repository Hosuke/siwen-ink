    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 伏戎于莽</nav></header><main><article><h1>伏戎于莽</h1><p>潛藏戎兵，伺隙而動，終不能興</p><p>「伏戎于莽」者，[[同人]]九三之爻辭也。</p><p>九三陽居陽位，過剛不中，處下卦之極，無應於上，而欲附九五之尊。力不能敵，智不能通，乃潛伏兵戎於草莽之中，登高陵以窺伺，歷三歲而不能興。</p><p>象曰「伏戎于莽，敵剛也。三歲不興，安行也」，言敵者九五之剛，剛而中正，不可犯也。九三妄動，不量力度，終歸困躓，其事安可行乎。</p><p><strong>所出</strong>：《周易 · 同人》 — https://zh.wikisource.org/wiki/周易/同人</p></article></main></div></div>
