    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 恬淡為上</nav></header><main><article><h1>恬淡為上</h1><p>用兵之要，以恬淡為上，不可以兵為美。</p><p>恬淡為上，老子言用兵之道也。兵者不祥之器，非君子之器，不得已而用之，當以恬淡為上。[[佳兵不祥之器]]，用之已乖[[道之旨]]，若更以[[兵事]]為美，[[樂殺人者不可以得志]]矣。是以聖人雖不得已而動甲兵，猶 [[勝而不美]]，終以 [[以喪禮處之]]，此所以全 [[有道者不處]] 之旨也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 三十一章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
