    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 虛者無貴</nav></header><main><article><h1>虛者無貴</h1><p>子列子論虛，虛者無貴，非其名也，莫如靜虛。</p><p>或謂子列子曰：「子奚貴虛？」列子曰：「虛者無貴也。」子列子曰：「非其名也，莫如靜，莫如虛。靜也虛也，得其居矣；取也與也，失其所矣。事之破䃣而後有舞仁義者，弗能復也。」</p><p><strong>所出</strong>：《列子 · 天瑞篇》 — https://zh.wikisource.org/wiki/列子/天瑞篇</p></article></main></div></div>
