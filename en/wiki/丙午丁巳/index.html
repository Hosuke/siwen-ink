    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 丙午丁巳</nav></header><main><article><h1>丙午丁巳</h1><p>丙午丁巳，干支相配，以為化生之祖。</p><p>丙午丁巳，干支之配合也。丙丁為火，午巳亦主火。火與火疊，是為盛陽之氣、萬物蕃秀之象。
陽以丙午為正，陰以丁巳為配，二者相繼，則天地之化機啟焉。</p><p>文云「丙午丁巳為祖始」，言陽火之氣由此而萌，萬物之生由此而起。祖者，本也；始者，發端之稱。
道家以火候配陰陽消長，丙午象徵陽氣極盛之時，丁巳預示陰生之初。二者迭用，為丹道進退之樞機。</p><p><strong>所出</strong>：《太平經 · 06》 — https://zh.wikisource.org/wiki/太平經/06</p></article></main></div></div>
