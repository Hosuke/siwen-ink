    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 有待而行</nav></header><main><article><h1>有待而行</h1><p>愆期非失時，乃志在有待而行，不妄動也。</p><p>象傳釋九四曰：「愆期之志，有待而行也。」歸妹愆期，非坐失時機，乃志有所待。賢女守禮，不苟求偶，必待其時而後行焉。</p><p><strong>所出</strong>：《周易 · 歸妹》 — https://zh.wikisource.org/wiki/周易/歸妹</p></article></main></div></div>
