    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 雲梯攻城</nav></header><main><article><h1>雲梯攻城</h1><p></p><p><strong>雲梯攻城</strong>乃古代攻城之重要方式，雲梯為高聳之攻城塔，可載士兵直登城牆。《墨子·備梯》首述禽滑釐問守城之道，次及敵軍施用雲梯之勢：「雲梯既施，攻備已具，武士又多，爭上吾城。」墨子對此詳陳防守之法。</p><p>墨子以為，雲梯雖為重器，然「其動移甚難」，故防守之要，在乎行城襍樓之構築，使敵無從近城。城上繁下矢石沙灰以雨之，薪火水湯以濟之。更以「審賞行罰，以靜為故，從之以急」之令，使士卒一心。如此則「雲梯之攻敗矣」。此篇所述雲梯攻城之防禦策略，與[[蛾傅]]之攻城術相對，構成墨家城守之學的重要組成。</p></article></main></div></div>
