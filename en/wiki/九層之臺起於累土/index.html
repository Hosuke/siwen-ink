    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 九層之臺起於累土</nav></header><main><article><h1>九層之臺起於累土</h1><p>九仞之臺，必自一簣之土始。事之成壞，在積與虧。</p><p>九層之臺起於累土。言臺之崇，必由土之積；事之大，必由小之聚也。《[[為山九仞功虧一簣]]》戒功之將成而毀，此則言功之未成而積，其義相成。</p><p><strong>所出</strong>：《老子河上公章句 · 守微》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
