    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 食指動</nav></header><main><article><h1>食指動</h1><p>子公食指動，知必嘗異物；後見靈公竟弗予羹</p><p>靈公獻黿於靈公。子家、子公將朝，子公之食指動，謂子家曰：「佗日指動，必食異物。」及入，見靈公進黿羹，子公笑曰：「果然！」靈公問其笑故，具告靈公。靈公召之，獨弗予羹。子公怒，染其指，嘗之而出。公怒，欲殺子公。子公與子家謀先，夏，弒靈公。</p><p><strong>所出</strong>：《史記 · 卷042》 — https://zh.wikisource.org/wiki/史記/卷042</p></article></main></div></div>
