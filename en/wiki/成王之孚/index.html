    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 成王之孚</nav></header><main><article><h1>成王之孚</h1><p>成王之信義，為下土之準式。</p><p>「永言配命，成王之孚」，[[詩經·下武]]之辭也。言周人恒道配天之命，以成王之信孚著稱於世。成王者，[[武王]]之子，是周家守成之始主也。孚者，信也；成王之孚，言其誠信著明，足以取信於天下。</p><p>下云「成王之孚，下土之式」，言成王之信，乃天下之準式，萬民所視效也。[[成康之際]]，天下安寧，刑措不用四十年，正成王之孚所奏效也。為[[人主]]者，[[賞罰以信]]，則民化之矣。</p><p><strong>所出</strong>：《詩經 · 下武》 — https://zh.wikisource.org/wiki/詩經/下武</p></article></main></div></div>
