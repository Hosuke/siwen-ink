    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 佞雄亂群</nav></header><main><article><h1>佞雄亂群</h1><p>姦佞之人亂於群眾，當嚴刑以誅之。</p><p>夫災蟲害谷，至降霜則殄矣。佞雄亂群，值嚴時則敗矣。獨善其身者，唯可以不肯事之，不行效之而已耳。有斧無柯，其如之何哉！</p><p>佞臣在位，則賢者退而自保；姦雄橫行，則善政無由而立。是故[[姦臣蔽賢]]，國之大患；[[佞臣覆國]]，理之固然。</p><p><strong>所出</strong>：《抱朴子 · 卷25》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷25</p></article></main></div></div>
