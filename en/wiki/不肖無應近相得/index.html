    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 不肖無應近相得</nav></header><main><article><h1>不肖無應近相得</h1><p>凡陰陽二爻率相比而无應則近而不相得，有應則雖逺而相得。</p><p>凡陰陽者相求之物也，近而不相得者志各有所存也。凡陰陽二爻率相比而无應則近而不相得，是无應而相得之例也；有應則雖逺而相得，然時有險易卦有小大同救以相親。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷10》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷10</p></article></main></div></div>
