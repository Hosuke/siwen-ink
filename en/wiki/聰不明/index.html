    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 聰不明</nav></header><main><article><h1>聰不明</h1><p>耳有所聞而心無所察，喻聽而不審</p><p>上九之象辭曰「何校滅耳，聰不明也」。何校滅耳者，刑加於首，罪之極也。聰不明者，有耳而不能審聽，有目而不能察見也。</p><p>聖人觀此以為戒：聽人之諫而不悟，納人之言而不察，積小罪以成大惡，至於荷校滅耳而後已，此非天亡之也，自亡之也。聰者善聽，明者善察，聰而不明，則善言不入，邪僻日滋，凶莫甚焉。</p><p><strong>所出</strong>：《周易 · 噬嗑》 — https://zh.wikisource.org/wiki/周易/噬嗑</p></article></main></div></div>
