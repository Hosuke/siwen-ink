    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 乘成</nav></header><main><article><h1>乘成</h1><p>造物不息黥而補劓，使人乘其全形以隨道。</p><p>意而子見許由，許由以堯黥汝以仁義而劓汝以是非，意而子願遊其藩。許由以盲瞽為喻拒之，意而子曰：「夫无莊之失其美，據梁之失其力，黃帝之亡其知，皆在鑪錘之間耳。庸詎知夫造物者之不息我黥而補我劓，使我乘成以隨先生邪？」</p><p><strong>所出</strong>：《莊子 · 大宗師》 — https://zh.wikisource.org/wiki/莊子/大宗師</p></article></main></div></div>
