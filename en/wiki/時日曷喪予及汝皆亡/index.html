    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 時日曷喪予及汝皆亡</nav></header><main><article><h1>時日曷喪予及汝皆亡</h1><p>夏民怨桀之語，言暴君在則民生無望。</p><p>王曰：「有眾率怠弗協。曰：『時日曷喪？予及汝皆亡！』」</p><p>夏之民困於暴政，相與愁怨。其言若曰：「是日也，何時而亡？吾儕寧與汝俱亡，不願更受其虐也。」蓋言暴君在則生不如死，視其國如仇讎矣。後世用為嫉惡之辭，凡虐民者聞之，可以鑒矣。</p><p><strong>所出</strong>：《尚書 · 湯誓》 — https://zh.wikisource.org/wiki/尚書/湯誓</p></article></main></div></div>
