    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 敗國三患</nav></header><main><article><h1>敗國三患</h1><p>爵服賤、祿賞輕、民閒其治，此敗國之教也。</p><p>故夫爵服賤，祿賞輕，民閒其治，賊臣首難，此謂敗國之教也。上恃龜筮，好用巫醫，則鬼神驟祟。故功之不立，名之不章，爲之患者三：有獨王者，有貧賤者，有日不足者。</p><p><strong>所出</strong>：《管子 · 第03篇權脩》 — https://zh.wikisource.org/wiki/管子/第03篇權脩</p></article></main></div></div>
