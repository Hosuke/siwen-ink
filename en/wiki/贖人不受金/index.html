    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 贖人不受金</nav></header><main><article><h1>贖人不受金</h1><p>聖人行事可以移風易俗</p><p>魯國之法，魯人為人妾者，取金於府。子贛贖之而不受金。孔子曰：「賜失之矣。夫聖人之舉事也，可以移風易俗，而受教順可施後世。今國之富者寡而貧者眾，贖而受金則為不廉；不受金則不復贖人。」此[[見小曰明]]之驗。</p><p><strong>所出</strong>：《淮南子 · 道應訓》 — https://zh.wikisource.org/wiki/淮南子/道應訓</p></article></main></div></div>
