    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 張曇要</nav></header><main><article><h1>張曇要</h1><p>居衡陽招仙觀，感天真授內養元和之道，行十二年，面朝大帝，延興中上昇。</p><p>衡陽招仙觀在廟東八里。舊記云啟基劉宗卜字蕭齊。又記云晉武帝咸寧中建。昔張真人諱曇要居之，感通天真密降，傳內養元和、默朝大帝之道。</p><p>行之十二年，神遊太空，面朝皇極大帝，賜以瓊寶琅膏、混神合景之液。餌之，變化莫測，神用無方。</p><p>以齊廢帝延興元年七月初三日，忽然雷吼，天地震動，俄有鸞鶴丹詔，迎之昇天。重和元年，宋徽宗賜號葆光襲明真人。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 33》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/33</p></article></main></div></div>
