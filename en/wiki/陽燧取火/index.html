    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 陽燧取火</nav></header><main><article><h1>陽燧取火</h1><p>陽燧聚焦取火，非日則光不生，以喻真陽之炁必資虛無而後成。</p><p>陽燧，取火之器也；以凹面鏡映日，則火生焉。非日不生光者，陽炁之資於虛無也。在內修之道，以喻身中真陽之火，必待虛極靜篤，方可感召而成就。陽燧無日則不能生火，修真者無虛靜之功，亦不能成丹道之陽炁，此乃天人感應之理，與[[方諸水漿]]相對為用。</p><p><strong>所出</strong>：《周易參同契 · 21章》 — https://zh.wikisource.org/wiki/周易參同契/21章</p></article></main></div></div>
