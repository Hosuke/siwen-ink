    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 铏芼牛藿羊苦豕薇</nav></header><main><article><h1>铏芼牛藿羊苦豕薇</h1><p>羹之菜，各有所宜，以五味之和也</p><p>記文云「铏芼，牛藿，羊苦，豕薇，皆有滑」，言羹之加菜各有本也。铏者，羹器；芼者，菜之加入羹中者。牛羹加藿，羊羹加苦，豕羹加薇。藿者，豆葉；苦者，苦茶；薇者，野踠豆苗。皆有滑者，菜之柔滑可食者也。滑所以利入口，亦羹之所以為羹也。</p><p><strong>所出</strong>：《儀禮 · 公食大夫禮》 — https://zh.wikisource.org/wiki/儀禮/公食大夫禮</p></article></main></div></div>
