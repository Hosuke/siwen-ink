    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 形體灰土</nav></header><main><article><h1>形體灰土</h1><p>歲月既盡，形體毀傷，化為灰土，狀若明窗塵。</p><p>歲月將欲訖，毀性傷壽年。形體為灰土，狀若明窗塵。</p><p><strong>所出</strong>：《周易參同契 · 14章》 — https://zh.wikisource.org/wiki/周易參同契/14章</p></article></main></div></div>
