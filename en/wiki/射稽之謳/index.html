    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 射稽之謳</nav></header><main><article><h1>射稽之謳</h1><p>喻事之實效不在於動聽之美，而在於成果之著</p><p>宋王築武宮，謳癸倡，行者止觀，築者不倦。王聞，召而賜之。對曰：「臣師射稽之謳又賢於癸。」王召射稽使之謳，行者不止，築者知倦。王曰：「行者不止，築者知倦，其謳不勝如癸美，何也？」對曰：「王試度其功。」癸四板，射稽八板；擿其堅，癸五寸，射稽二寸。夫歌之美不如功之實，觀人之效，當於实事中求之。</p><p><strong>所出</strong>：《韓非子 · 外儲說左上》 — https://zh.wikisource.org/wiki/韓非子/外儲說左上</p></article></main></div></div>
