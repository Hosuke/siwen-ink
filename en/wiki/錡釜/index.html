    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 錡釜</nav></header><main><article><h1>錡釜</h1><p>烹煮之器，三腳曰錡，無腳曰釜</p><p>錡釜者，皆烹煮之器也。</p><p>《采蘋》次章云「于以湘之？維錡及釜。」湘，按服虔《音義》音同享，祭祀義，蓋煮物以供神也。錡，音奇，三腳之釜；釜，無腳之鍋。祭祀之時，以錡釜煮蘋藻之屬，以供神明。</p><p><strong>所出</strong>：《詩經 · 采蘋》 — https://zh.wikisource.org/wiki/詩經/采蘋</p></article></main></div></div>
