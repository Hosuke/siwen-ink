    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 蒲社災</nav></header><main><article><h1>蒲社災</h1><p>蒲社為天子之社，其災乃記異也。</p><p>哀公四年六月辛丑，蒲社災。蒲社者，天子之社也。諸侯有亳社，魯得用天子之社者，備物也。蒲社之災，與桓宮、僖宮災同義，皆記變異以警戒也。</p><p><strong>所出</strong>：《春秋公羊傳 · 哀公》 — https://zh.wikisource.org/wiki/春秋公羊傳/哀公</p></article></main></div></div>
