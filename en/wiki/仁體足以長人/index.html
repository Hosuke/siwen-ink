    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 仁體足以長人</nav></header><main><article><h1>仁體足以長人</h1><p>君子體仁，則足以為人之首長。</p><p>文言曰：君子體仁足以長人，嘉會足以合禮，利物足以和義，貞固足以幹事。君子行此四德者，故曰：「乾，元亨利貞。」</p><p>元亨利貞，析而言之，則為四德；合而言之，總一乾也。體仁者，念念皆仁，如身之不可離也。以此居心，則無私欲之累，足以為人之首長矣。嘉會者，美善之聚也，禮以節之，故能合。利物者，便於物也，義者和也，物各得其利，則義無乖違。貞固者，正而堅也，事之幹如木之有榦，非貞固則事不成焉。</p><p><strong>所出</strong>：《周易 · 乾》 — https://zh.wikisource.org/wiki/周易/乾</p></article></main></div></div>
