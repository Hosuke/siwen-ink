    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 七政</nav></header><main><article><h1>七政</h1><p>天子所欲齊之七事，日月五星。</p><p>在璿璣玉衡，以齊七政。七政者，日、月、星、歲、月、日、星辰也。又說以為：春、夏、秋、冬、天文、地理、人道。玉衡者，觀象之器也；璿璣者，運轉之機也。聖人觀天文以察時變，齊七政以授民事。</p><p><strong>所出</strong>：《尚書 · 舜典》 — https://zh.wikisource.org/wiki/尚書/舜典</p></article></main></div></div>
