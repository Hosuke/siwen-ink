    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 大洞</nav></header><main><article><h1>大洞</h1><p>斂精聚神、鍊神會道之要徑，動極復靜，恍惚圍帝一之妙。</p><p>夫道生於無，潛眾靈而莫測；神凝於虛，妙萬變而無方，杳冥有精而泰定發光，太玄無際而致虛守靜，是之謂大洞者歟。及其斂精聚神，御祖炁以迴旋；鍊神會道，運祥風而鼓舞；無中欻有，呼吸散萬神之形；動極復靜，恍惚圍帝一之妙。</p><p><strong>所出</strong>：《上清大洞真經 · 序》 — https://zh.wikisource.org/wiki/上清大洞真經/序</p></article></main></div></div>
