    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 介先生辟蛇法</nav></header><main><article><h1>介先生辟蛇法</h1><p>思作五色蛇及吳蚣以衣身，終不逢蛇。</p><p>抱朴子述介先生辟蛇法：「介先生法，到山中住，思作五色蛇各一頭，乃閉炁以青竹及小木板屈刺之，左徊禹步，思作吳蚣數千板，以衣其身，乃去，終亦不逢蛇也。」又有他法：「或以乾薑附子帶之肘後，或燒牛羊鹿角薰身，或帶王方平雄黃丸，或以豬耳中垢及麝香丸著足爪甲中，皆有效也。又麝及野豬皆啖蛇，故以厭之也。」</p><p><strong>所出</strong>：《抱朴子 · 卷17》 — https://zh.wikisource.org/wiki/抱朴子/卷17</p></article></main></div></div>
