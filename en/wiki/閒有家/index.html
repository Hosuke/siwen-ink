    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 閒有家</nav></header><main><article><h1>閒有家</h1><p>治家當防範於始，則悔吝不生。</p><p>閒有家，[[周易 · 家人]]初九爻辭也。</p><p>初九居卦之初，陽爻得位，家人之始。「閒有家」，言治家之道，當防閒於始也。閒者，闌也，所以止物之出入者。家人之始，即為之防範，立其規矩，正其趨向，使子弟未縱其欲而先知所守，則悔吝亡矣。</p><p>《論語》言「君子不重則不威」，治家亦然。始不閒之，後欲正之，難矣。是以聖人貴乎防之於早也。</p><p><strong>所出</strong>：《周易 · 家人》 — https://zh.wikisource.org/wiki/周易/家人</p></article></main></div></div>
