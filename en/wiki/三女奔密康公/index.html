    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 三女奔密康公</nav></header><main><article><h1>三女奔密康公</h1><p>密康公從穆王游涇上，有三女奔之，其母戒以必致於王，康公不獻，一年而密亡。</p><p>共王游於涇上，密康公從，有三女奔之。其母曰：「必致之王。夫獸三為群，人三為眾，女三為粲。王田不取群，公行不下眾，王御不參一族。夫粲，美之物也。眾以美物歸女，而何德以堪之？王猶不堪，況爾之小醜乎！小醜備物，終必亡。」康公不獻，一年，共王滅密。</p><p><strong>所出</strong>：《史記 · 卷004》 — https://zh.wikisource.org/wiki/史記/卷004</p></article></main></div></div>
