    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 吉甫燕喜</nav></header><main><article><h1>吉甫燕喜</h1><p>凱旋燕飲，慶功之樂。</p><p>詩云「吉甫燕喜，既多受祉」。燕，安也；喜，樂也。吉甫伐玁狁而定王國，歸而燕飲，喜樂受福。此詩人所述將帥成功之慶，功成受福，理所固然也。</p><p><strong>所出</strong>：《詩經 · 六月》 — https://zh.wikisource.org/wiki/詩經/六月</p><hr><p>尹吉甫之詩，不止[[文武吉甫]]之美王師，又有《江漢》之篇，美宣王[[能興衰撥亂命召公平淮夷]]之功。[[吉甫]]之於宣王，可謂全材之臣矣。</p><p>  <strong>所出</strong>：《詩經 · 江漢》 — https://zh.wikisource.org/wiki/詩經/江漢</p></article></main></div></div>
