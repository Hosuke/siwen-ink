    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 功述身芮</nav></header><main><article><h1>功述身芮</h1><p>功成名遂，斂身而退，乃合天之道</p><p>功述身芮，天之道也。功成而不居，事遂而身退，斂藏以自全，此天之道也。[[持盈定傾節事]]之道，功遂身退，不以其成功自矜，故能全其身而終其天年。聖人[[功成不名]]，[[功成弗居]]，是之謂與天合德。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第五十三章 持盈》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
