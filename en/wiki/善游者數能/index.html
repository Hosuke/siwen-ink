    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 善游者數能</nav></header><main><article><h1>善游者數能</h1><p>善游泳者反覆練習而能忘水，乃不知有利害之心。</p><p>顏淵問仲尼曰：「吾嘗濟乎觴深之淵，津人操舟若神。吾問焉，曰：『操舟可學邪？』曰：『可。善游者數能。若乃夫沒人，則未嘗見舟而便操之也。』」仲尼曰：「善游者數能，忘水也；若乃夫沒人之未嘗見舟而便操之也，彼視淵若陵，視舟之履猶其車卻也。覆卻萬方陳乎前而不得入其舍，惡往而不暇！」</p><p><strong>所出</strong>：《莊子 · 達生》 — https://zh.wikisource.org/wiki/莊子/達生</p></article></main></div></div>
