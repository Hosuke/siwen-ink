    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 坎離沒亡</nav></header><main><article><h1>坎離沒亡</h1><p>消息之中，坎離消逝，變化潛運。</p><p>故推消息，坎離沒亡。消者減，息者增；消息者，增減盈虛之理。坎離隨消息之運而消逝隱沒。</p><p>消息盈虛，天地之常道；坎離沒亡，二用之潛運。推究消息之理，則知坎離之行非永存，隨時消亡而復生。</p><p><strong>所出</strong>：《周易參同契 · 02章》 — https://zh.wikisource.org/wiki/周易參同契/02章</p></article></main></div></div>
