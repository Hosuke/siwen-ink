    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 伐木丁丁</nav></header><main><article><h1>伐木丁丁</h1><p>斧斤之聲，起居之事；朋友之情，由茲而興。</p><p>「伐木丁丁」，[[詩經]]《伐木》之首句也。伐木者，以斧斤斫木也。丁丁者，木聲相應之貌。</p><p>詩人聞伐木之聲，而思故舊。伐木者，朋友之事也，蓋古者朋友切磋，常於山林之間，故以起興焉。</p><p><strong>所出</strong>：《詩經 · 伐木》 — https://zh.wikisource.org/wiki/詩經/伐木</p></article></main></div></div>
