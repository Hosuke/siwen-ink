    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 帝一大洞尊君</nav></header><main><article><h1>帝一大洞尊君</h1><p>統攝上景連眾之神帝</p><p>帝一大洞尊君者，大洞玉經所稱之最高神帝也。號上景，統眾炁，攝煙霞，長契一運。經云「帝一大洞尊君號上景，連眾攝煙」，此[[太微小童]]章之樞紐。修煉者誦玉經，呼此帝號，則可以[[守一]]統萬神，使[[泥丸百神方位|百神方位]]各正。帝一者，大洞之宗也，誦者所歸焉。</p><p><strong>所出</strong>：《上清大洞真經 · 1章》 — https://zh.wikisource.org/wiki/上清大洞真經/1章</p></article></main></div></div>
