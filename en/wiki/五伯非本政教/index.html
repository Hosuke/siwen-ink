    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 五伯非本政教</nav></header><main><article><h1>五伯非本政教</h1><p>五伯但知鄉方略、畜積脩鬬，以詐心依仁取勝，非王道也。</p><p>仲尼之門言羞稱五伯者，何也？彼非本政教也，非致隆高也，非綦文理也，非服人之心也。鄉方略，審勞佚，畜積修鬬而能顛倒其敵，詐心以勝矣。彼以讓飾爭，依乎仁而蹈利，是小人之傑也。</p><p>彼王者則不然。致賢而能以救不肖，致彊而能以寬弱，戰必能殆之而羞與之鬬，委然成文以示之天下，而天下國安自化。有災繆者然後誅之，故聖王之誅也綦省矣。</p><p><strong>所出</strong>：《荀子 · 仲尼篇》 — https://zh.wikisource.org/wiki/荀子/仲尼篇</p></article></main></div></div>
