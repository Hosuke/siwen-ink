    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 太虛寥廓</nav></header><main><article><h1>太虛寥廓</h1><p>太虛寥廓，肇基化元，萬物資始，五運終天。</p><p>臣聞之，太始天元冊文曰：</p><p>太虛寥廓，肇基化元，萬物資始，五運終天，布氣真靈，總統坤元，九星懸朗，七曜周旋，曰陰曰陽，曰柔曰剛，幽顯既位，寒暑弛張，生生化化，品物咸章。</p><p><strong>所出</strong>：《黃帝內經 · 素問第十九卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十九卷</p></article></main></div></div>
