    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 釋勢委法</nav></header><main><article><h1>釋勢委法</h1><p>廢勢背法，雖堯舜戶說而人辨之，不能治三家。</p><p>[[韓非]]以為，弃[[隱栝]]之法、去度量之數，使奚仲為車不能成一輪。[[賞罰之威]]不行，[[釋勢委法]]，堯舜戶說而人辨之，不能治三家。[[抱法處勢]]而待[[桀紂]]，[[千世治而一亂]]；廢法[[背法去勢]]而待[[堯舜]]，[[千世亂而一治]]。夫勢之足用亦明矣，曰「必待賢」，則亦不然也。</p><p><strong>所出</strong>：《韓非子 · 難勢》 — https://zh.wikisource.org/wiki/韓非子/難勢</p></article></main></div></div>
