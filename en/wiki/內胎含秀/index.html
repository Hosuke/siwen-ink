    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 內胎含秀</nav></header><main><article><h1>內胎含秀</h1><p>修大洞者死炁滅絕之後，內胎含蓄英華之象。</p><p>內胎含秀，上清大洞修真之效驗也。修者佩[[消魔玉符]]，存呼[[二真堅玉君]]內諱，鎮兆太倉之腑，死炁滅絕，則內胎含秀，長對神室。秀者精華凝結之象，含者韞藏不失之義。與[[胞胎受氣之初]]相參，而功用尤大。</p><p><strong>所出</strong>：《上清大洞真經 · 18章》 — https://zh.wikisource.org/wiki/上清大洞真經/18章</p></article></main></div></div>
