    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 功蓋天下而似不自己</nav></header><main><article><h1>功蓋天下而似不自己</h1><p>明王之治，功成而民弗知，德厚而莫得名焉。</p><p>陽子居問老聃：「有人嚮疾彊梁，物徹疏明，學道不勌，可比明王乎？」老聃斥之，以為是胥易技繫、勞形怵心之徒，虎豹以文招田，猨狙以便見縶，皆不得比於明王。</p><p>明王之治，功蓋天下而似不自己，化貸萬物而民弗恃，有莫舉名，使物自喜，立乎不測，遊於無有。不自有其功，不自任其德，功反而天下被之，德薄而萬物歸之，此聖人之所以大也。</p><p><strong>所出</strong>：《莊子 · 應帝王》 — https://zh.wikisource.org/wiki/莊子/應帝王</p></article></main></div></div>
