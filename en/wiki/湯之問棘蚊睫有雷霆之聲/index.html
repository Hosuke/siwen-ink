    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 湯之問棘蚊睫有雷霆之聲</nav></header><main><article><h1>湯之問棘蚊睫有雷霆之聲</h1><p>湯之問棘云：蚊睫有雷霆之聲。</p><p>若乃湯之問棘云蚊睫有雷霆之聲；惠施對梁王，云蝸角有伏尸之戰；《列子》有移山跨海之談，《淮南》有傾天折地之說，此踳駮之類也。</p><p><strong>所出</strong>：《文心雕龍 · 諸子》 — https://zh.wikisource.org/wiki/文心雕龍/諸子</p></article></main></div></div>
