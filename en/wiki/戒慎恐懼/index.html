    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 戒慎恐懼</nav></header><main><article><h1>戒慎恐懼</h1><p>君子於不睹不聞之際所以存養省察也。</p><p>道也者，不可須臾離也，可離非道也。是故君子戒慎乎其所不睹，恐懼乎其所不聞。言道之不可離如此。</p><p><strong>所出</strong>：《中庸 · 中庸章句》 — https://zh.wikisource.org/wiki/四書章句集註/中庸章句</p></article></main></div></div>
