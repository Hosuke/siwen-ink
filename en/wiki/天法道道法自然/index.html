    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 天法道道法自然</nav></header><main><article><h1>天法道道法自然</h1><p>天地皆法道，道法自然而無所法。</p><p>老子極言道之歸宿曰：「天法道，道法自然。」天之所以高，地之所以厚，皆本於道。而道之所以尊，以其自然而已。自然者，無為無造之謂，道無可法，故法其自然。此[[道法自然]]之的義，亦[[輔萬物之自然]]之旨。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第六十九章 昆成》 — https://zh.wikisource.org/wiki/老子_(帛書校勘版)</p></article></main></div></div>
