    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 朕敬于刑有德惟刑</nav></header><main><article><h1>朕敬于刑有德惟刑</h1><p>敬刑則有德，刑與德相成。</p><p>刑罰之設，非徒以威，乃所以輔德。敬之則刑正，德之則民化，二者不可偏廢。</p><p><strong>所出</strong>：《尚書 · 呂刑》 — https://zh.wikisource.org/wiki/尚書/呂刑</p></article></main></div></div>
