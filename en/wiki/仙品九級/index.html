    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 仙品九級</nav></header><main><article><h1>仙品九級</h1><p>仙人九品，各有差降，不可超越</p><p>夫人云：「得仙者亦有九品：第一上仙號九天真王，第二次仙號三天真皇，第三號太上真人，第四號飛天真人，第五號靈仙，第六號真人，第七號靈人，第八號飛仙，第九號仙人，此九仙之品第也，各有差降，不可超越。彼學知金液已為過矣，至於玉皇之所餌，非淺學所宜聞也。」</p><p><strong>所出</strong>：《墉城集仙錄 · 卷04》 — https://zh.wikisource.org/wiki/墉城集仙錄/卷04</p></article></main></div></div>
