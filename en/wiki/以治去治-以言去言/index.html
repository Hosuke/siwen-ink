    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 以治去治以言去言</nav></header><main><article><h1>以治去治以言去言</h1><p>以功與爵去無功之賞，以法去空言，治之要也。</p><p>韓非云「以治去治，以言去言」，又云「以功與爵者也」。言者，空言也；治者，實功也。空言亂國，必以實功去之；空言害法，必以實治去之。功成則言自息，治著則說自廢。此非禁言也，乃以實效掩空言耳。</p><p><strong>所出</strong>：《韓非子 · 飭令》 — https://zh.wikisource.org/wiki/韓非子/飭令</p></article></main></div></div>
