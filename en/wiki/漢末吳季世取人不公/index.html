    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 漢末吳季世取人不公</nav></header><main><article><h1>漢末吳季世取人不公</h1><p>刺漢末吳季選舉附黨、賢愚倒置之弊。</p><p>「漢之末年，吳之季世，則不然焉。舉士也，必附己者為前；取人也，必多黨者為決。」此刺東漢末季、三國吳末之世，選拔人才不問賢否，唯視其人是否附己、是否為同黨而定。於是庸猥者得進，英異者見抑，公道不行，賢路堵塞，風俗大壞。</p><p><strong>所出</strong>：《抱朴子 · 卷50》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷50</p></article></main></div></div>
