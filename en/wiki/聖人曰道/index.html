    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 聖人曰道</nav></header><main><article><h1>聖人曰道</h1><p>聖人視天地人物皆一道，無愛無棄，無尊無賤。</p><p>聖人曰道，觀天地人物皆吾道，倡和之，始終之，青黃之，卵翼之，不愛道不棄物，不尊君子，不賤小人。賢人曰物，物物不同，旦旦去之，旦旦與之，短之長之，直之方之，是為物易也。殊不知聖人鄙雜廁、別分居，所以為人，不以此為己。</p><p><strong>所出</strong>：《關尹子 · 3》 — https://zh.wikisource.org/wiki/關尹子/3</p></article></main></div></div>
