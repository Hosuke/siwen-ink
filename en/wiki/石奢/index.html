    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 石奢</nav></header><main><article><h1>石奢</h1><p>楚相石奢縱父自刎，以死明法</p><p>石奢者，楚昭王相也。堅直廉正，無所阿避。行縣，道有殺人者，相追之，乃其父也。縱其父而還自繫焉。使人言之王曰：「殺人者，臣之父也。夫以父立政，不孝也；廢法縱罪，非忠也；臣罪當死。」王曰：「追而不及，不當伏罪，子其治事矣。」石奢曰：「不私其父，非孝子也；不奉主法，非忠臣也。王赦其罪，上惠也；伏誅而死，臣職也。」遂不受令，自刎而死。</p><p><strong>所出</strong>：《史記 · 卷119》 — https://zh.wikisource.org/wiki/史記/卷119</p></article></main></div></div>
