    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 大夢</nav></header><main><article><h1>大夢</h1><p>今茲之為，夢與覺異；及其大覺，方知皆夢</p><p>夢之為物，最能喻道。夢為鳥而飛於天，夢為魚而沒於淵，方其夢也，不知其夢也，覺而後知其夢也。今將有大覺，然後知今此之為大夢也。夢時不知其妄，覺時方悟其非；起大覺者觀之，則舉世營為皆夢中事矣。</p><p><strong>所出</strong>：《淮南子 · 俶真訓》 — https://zh.wikisource.org/wiki/淮南子/俶真訓</p></article></main></div></div>
