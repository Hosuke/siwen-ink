    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 觀大水必觀</nav></header><main><article><h1>觀大水必觀</h1><p>君子觀水，必觀其德。</p><p>君子之所以見大水必觀焉者，以其有德也。水大徧與諸生而無為，似德；流也埤下，裾拘必循其理，似義；洸洸乎不淈盡，似道。若有決行之，其應佚若聲響，其赴百仞之谷不懼，似勇。主量必平，似法。盈不求概，似正。淖約微達，似察。以出以入，以就鮮絜，似善化。其萬折也必東，似志。是故見大水必觀焉。</p><p><strong>所出</strong>：《荀子 · 宥坐篇》 — https://zh.wikisource.org/wiki/荀子/宥坐篇</p></article></main></div></div>
