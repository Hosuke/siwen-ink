    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 明君立功成名者四</nav></header><main><article><h1>明君立功成名者四</h1><p>天時、人心、技能、勢位，四者備乃功成名立。</p><p>明君之所以立功成名者四：一曰天時，二曰人心，三曰技能，四曰勢位。非天時，雖十堯不能冬生一穗；逆人心，雖賁、育不能盡人力。故得天時，則不務而自生；得人心，則不趣而自勸；因技能，則不急而自疾；得勢位，則不推進而名成。</p><p><strong>所出</strong>：《韓非子 · 功名》 — https://zh.wikisource.org/wiki/韓非子/功名</p></article></main></div></div>
