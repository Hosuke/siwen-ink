    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 名正而法順</nav></header><main><article><h1>名正而法順</h1><p>君臣各守其分，名正則法行</p><p>慶賞刑罰，君事也；守職效能，臣業也。君科功黜陟，故有慶賞刑罰；臣各慎所任，故有守職效能。君不可與臣業，臣不可侵君事，上下不相侵與，謂之名正。名正而法順也。</p><p><strong>所出</strong>：《尹文子 · 大道上》 — https://zh.wikisource.org/wiki/尹文子/大道上</p></article></main></div></div>
