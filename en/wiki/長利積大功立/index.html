    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 長利積，大功立</nav></header><main><article><h1>長利積，大功立</h1><p>循道治國，則長遠之利累積，盛大之功可立。</p><p>長利積，大功立，名成於前，德垂於後，治之至也。</p><p>[[利莫長於簡福莫久於安|利莫長於簡]]，功莫大於長遠。循道法，用賞罰，不以一時之私害天下之公，則[[累微|積微]]可以成著，累小功可以成大德。[[厚德載物|厚德載物]]，此之謂與。</p><p><strong>所出</strong>：《韓非子 · 大體》 — https://zh.wikisource.org/wiki/韓非子/大體</p></article></main></div></div>
