    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 殷其靁在南山之陽</nav></header><main><article><h1>殷其靁在南山之陽</h1><p>以雷在南山下起興，言君子遠役不得寧處</p><p>「殷其靁，在南山之陽」，詩之首句也。靁，雷也；陽，山之南麓。雷聲殷殷然起於南山之陽，以興君子之遠出於外，不得寧處。</p><p>疊言「南山之陽」「南山之側」「南山之下」，三者錯綜成文，迭言其地，見君子蹤跡靡定，無往而非役也。毛詩以為此詩勸以義，室家閔其勤苦而望其歸。</p><p><strong>所出</strong>：《詩經 · 殷其靁》 — https://zh.wikisource.org/wiki/詩經/殷其靁</p></article></main></div></div>
