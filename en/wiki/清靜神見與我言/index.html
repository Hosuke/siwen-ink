    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 清靜神見與我言</nav></header><main><article><h1>清靜神見與我言</h1><p>心神清靜，真神降見而相告語。</p><p>清而且靜，此心之所以明也。修真至此，真神降見，與我以言。斯乃心死神活、虛室生白之驗，非恍惚之說也。</p><p><strong>所出</strong>：《黃庭內景經 · 治生章第二十三》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/治生章第二十三</p></article></main></div></div>
