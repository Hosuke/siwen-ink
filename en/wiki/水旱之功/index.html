    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 水旱之功</nav></header><main><article><h1>水旱之功</h1><p>水旱之功，在因天時以困敵，野不收、耕不獲，使敵困乏。</p><p>水旱之功，非灌溉之利，乃因天時以困敵之術。野不收、耕不獲者，使敵不得耕種，喪其地利。</p><p>其文曰：「水旱之功者，野不收，耕不獲也。」「有水旱之功，故能攻國救邑。」</p><p>興師出境，因敵之天時而困之，使其田野荒蕪、耕者失獲，此[[因時制宜]]之道，兵家之變也。</p><p><strong>所出</strong>：《管子 · 選陳》 — https://zh.wikisource.org/wiki/管子/七法/選陳</p></article></main></div></div>
