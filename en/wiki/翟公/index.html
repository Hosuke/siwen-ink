    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 翟公</nav></header><main><article><h1>翟公</h1><p>為廷尉時賓客填門，廢則門可設雀羅，因言交情有貴賤之變。</p><p>翟公為廷尉，賓客填門；及廢，門外可設雀羅。翟公復為廷尉，賓客欲往，翟公乃人署其門曰：「一死一生，乃知交情。一貧一富，乃知交態。一貴一賤，交情乃見。」</p><p><strong>所出</strong>：《史記 · 卷120》 — https://zh.wikisource.org/wiki/史記/卷120</p></article></main></div></div>
