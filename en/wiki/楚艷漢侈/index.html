    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 楚艷漢侈</nav></header><main><article><h1>楚艷漢侈</h1><p>楚漢之文華而不實，流弊不可不戒</p><p>四教所先，符采相濟，勵德樹聲，莫不師聖。惟建言脩辭，鮮克宗經。是以楚艷漢侈，流弊不還。正末歸本，不其懿歟。言後世文辭尚艷尚奢，失卻宗經之本，劉勰深以為戒也。</p><p><strong>所出</strong>：《文心雕龍 · 宗經》 — https://zh.wikisource.org/wiki/文心雕龍/宗經</p></article></main></div></div>
