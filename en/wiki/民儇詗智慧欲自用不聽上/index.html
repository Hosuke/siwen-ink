    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 民儇詗智慧，欲自用，不聽上</nav></header><main><article><h1>民儇詗智慧，欲自用，不聽上</h1><p>古之黔首惷愚易欺，今之民智慧自用，非賞罰不能治。</p><p>古者黔首悗密惷愚，故可以虛名取也。今民儇詗智慧，欲自用，不聽上。是以人主欲治天下，不可恃道德感化，必也賞罰並用。</p><p>上必且勸之以賞，然後民可進；又且畏之以罰，然後民不敢退。賞以勸善，罰以止姦，使民知趨利避害，則[[竭力守法專心事主者為忠臣|分義可得而正]]也。</p><p><strong>所出</strong>：《韓非子 · 忠考》 — https://zh.wikisource.org/wiki/韓非子/忠考</p></article></main></div></div>
