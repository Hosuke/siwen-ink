    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 枉則直</nav></header><main><article><h1>枉則直</h1><p>枉屈而後直</p><p>枉，屈己而伸人。聖人屈己以伸人，久久自得直也。</p><p>聖人枉己以從人，不以直繩人，而天下之枉者自直。
[[枉則直]]之義，以屈申為用，以[[曲則全]]為體。屈者，非屈於人也，屈於道也。屈於道者，道伸之。</p><p><strong>所出</strong>：《老子河上公章句 · 益謙》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
