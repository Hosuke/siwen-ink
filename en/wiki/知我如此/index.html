    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 知我如此</nav></header><main><article><h1>知我如此</h1><p>自傷生不逢時</p><p>苕之華，其葉青青。知我如此，不如無生。</p><p>「知我如此」者，非徒知我之困悴，乃知我之生於此世，乃所以為不幸也。方太平之世，君子得行其道，則生為可贵；當衰亂之時，君子無以自存，則生不如死。詩人由苕葉之青青，自傷人之不如物，正與[[人可以食鮮可以飽]]同義，皆以見亂世之極也。</p><p><strong>所出</strong>：《詩經 · 苕之華》 — https://zh.wikisource.org/wiki/詩經/苕之華</p></article></main></div></div>
