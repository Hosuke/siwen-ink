    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 德溢乎名</nav></header><main><article><h1>德溢乎名</h1><p>德溢則名生，名溢則暴起，謀稽則知出乎爭。</p><p>德溢乎名，名溢乎暴，謀稽乎誸，知出乎爭，柴生乎守，官事果乎衆宜。</p><p>夫德者，本也；名者，末也。德積則名歸，名盛則矜暴。[[莊子]] 言治道之失，在乎以名累德、以暴傷名。眾宜者，事之所以成也；而名實相傾，則治之所以廢也。此與[[堯舜湯文武之道]] 相對，堯舜无名而德被萬世，桀紂有名而國以之亡。</p><p><strong>所出</strong>：《莊子 · 外物》 — https://zh.wikisource.org/wiki/莊子/外物</p></article></main></div></div>
