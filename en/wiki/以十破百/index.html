    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 以十破百</nav></header><main><article><h1>以十破百</h1><p>天道不行、人事荒亂之時，弱者可以勝衆。</p><p>天道不行，屈不足從。人事荒亂，以十破百。器備不行，以半擊倍。故軍爭者不行於完城池，有道者不行於無君。故莫知其將至也，至而不可圍。莫知其將去也，去而不可止。敵人雖衆，不能止待。</p><p><strong>所出</strong>：《管子 · 第29篇制分》 — https://zh.wikisource.org/wiki/管子/第29篇制分</p></article></main></div></div>
