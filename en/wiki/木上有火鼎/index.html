    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 木上有火鼎</nav></header><main><article><h1>木上有火鼎</h1><p>鼎之象，君子以正位凝命。</p><p>象辭云：「木上有火，鼎。」此鼎卦之象也。火在木上，薪傳火熾，烹飪乃成。君子觀之，知法象之理，當正其位、凝其命，修德以成天下之治。</p><p>[[木上有水]]之象為井；木上有火之象為鼎。井養人而鼎烹飪，功用不同，而皆象君子之德焉。</p><p><strong>所出</strong>：《周易 · 鼎》 — https://zh.wikisource.org/wiki/周易/鼎</p></article></main></div></div>
