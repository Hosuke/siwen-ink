    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 結喉本戶</nav></header><main><article><h1>結喉本戶</h1><p>死炁之門，在結喉之處。</p><p>結喉本戶，死炁之門也。在人結喉之處，乃[[胎中白炁君]]所守之要害。修煉之時，白炁君下布此戶，順時吐息，使三華之炁不入死門，而入帝一之府，以成生化之功。</p><p><strong>所出</strong>：《上清大洞真經 · 30章》 — https://zh.wikisource.org/wiki/上清大洞真經/30章</p></article></main></div></div>
