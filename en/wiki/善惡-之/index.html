    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 善惡-之</nav></header><main><article><h1>善惡-之</h1><p></p><p>為惡者畏人識，必有識者；為善者欲人知，必有不知者。是故人不識者，謂之大惡；人不知者，謂之至善。好行惠者恩不廣，務奇特者功不大，善博奕者智不遠，文綺麗者名不久。是以君子惟道是貴，惟德自守，所以能萬世不朽。</p><p>  <strong>所出</strong>：《化書 · 卷四》 — https://zh.wikisource.org/wiki/化書/卷四</p></article></main></div></div>
