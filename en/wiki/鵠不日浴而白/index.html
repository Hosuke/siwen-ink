    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 鵠不日浴而白</nav></header><main><article><h1>鵠不日浴而白</h1><p>老子以鵠白烏黑為喻，譏仁義名譽之辨為末事。</p><p>老子曰：「夫鵠不日浴而白，烏不日黔而黑。黑白之樸，不足以為辯；名譽之觀，不足以為廣。」</p><p><strong>所出</strong>：《莊子 · 天運》 — https://zh.wikisource.org/wiki/莊子/天運</p></article></main></div></div>
