    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 經籍深富</nav></header><main><article><h1>經籍深富</h1><p>經典為群言之奧區，才思之神皋</p><p>夫經典沈深，載籍浩瀚，實群言之奧區，而才思之神皋也。揚班以下，莫不取資，任力耕耨，縱意漁獵，操刀能割，必列膏腴。</p><p>贊曰：「經籍深富，辭理遐亙。皜如江海，鬱若崐鄧。」</p><p><strong>所出</strong>：《文心雕龍 · 事類》 — https://zh.wikisource.org/wiki/文心雕龍/事類</p></article></main></div></div>
