    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 女子善懷</nav></header><main><article><h1>女子善懷</h1><p>女子多愁善感，各有遠慮。</p><p>《載馳》四章云：「陟彼阿丘，言采其蝱，女子善懷，亦各有行。」</p><p>言女子之情善感而多懷，然亦各有其道理、其志向，非徒然者。詩人因采蝱以起興，自明己意雖在女子，而思有所適，非許人之所知也。許人乃反以此為過，云「衆穉且狂」，是許人之蔽，而非詩人之失。</p><p>後世以「善懷」為女子情深多感之辭。</p><p><strong>所出</strong>：《詩經 · 載馳》 — https://zh.wikisource.org/wiki/詩經/載馳</p></article></main></div></div>
