    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 火候</nav></header><main><article><h1>火候</h1><p>烹煉之時機，太早則藥嫩，太遲則藥老，貴在恰到好處。</p><p>火候者，烹煉之時機也。紫陽云：「縱識朱砂及黑鉛，不知火候也如閒。」朱晦翁云：「神仙不作參同契，火候工夫哪得知。」可見火候之妙，聖賢罕言，學者難曉。採取之法，貴乎知時，太早則藥嫩易升，太遲則藥老成質。必也鉛華吐白、玄珠成象，方是采取時節。張紫陽云：「鉛遇癸生須急采，金逢望遠不堪嘗。」電光煉處，恍惚之間，一陽爻動，珠落畢池，此其候也。</p><p><strong>所出</strong>：《性命圭旨 · 利集》 — https://zh.wikisource.org/wiki/性命圭旨/利集</p></article></main></div></div>
