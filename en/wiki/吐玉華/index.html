    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 吐玉華</nav></header><main><article><h1>吐玉華</h1><p>心神發越，華光外應。</p><p>心為君主，神明出焉。外應口舌者，心之精華發越於言笑之間也。玉華者，心光之異稱，以其清瑩溫潤若玉焉。</p><p>心君虛明，則言之吐出者自然文雅和暢，不假雕琢而光彩煒然，此即吐玉華之驗也。是知修心者修口，修口者修心，心口相應，神氣相傳，則口舌之雲為莫非心光之流溢矣。</p><p><strong>所出</strong>：《黃庭內景經 · 心部章第十》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/心部章第十</p></article></main></div></div>
