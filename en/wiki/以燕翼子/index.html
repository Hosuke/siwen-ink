    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 以燕翼子</nav></header><main><article><h1>以燕翼子</h1><p>遺子孫以安，庇護後嗣，使國祚綿長。</p><p>「以燕翼子」者，言遺安後嗣、庇護子孫也。詩末章云「豐水有芑，武王豈不仕。詒厥孫謀，以燕翼子」。武王伐紂成功，豐水之傍生長芑菜，天地效靈，國用充足。武王豈無所事？其所以经营者，正是留貽子孫以善謀，安護翼蔽其後嗣也。聖人處國，必為子孫萬世之計；前人之德澤，正好為後人藩衛。[[詒厥孫謀以燕翼子]]，此周之所以享國久遠者也。</p><p><strong>所出</strong>：《詩經 · 文王有聲》 — https://zh.wikisource.org/wiki/詩經/文王有聲</p></article></main></div></div>
