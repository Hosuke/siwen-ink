    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 物雖胡越合則肝膽</nav></header><main><article><h1>物雖胡越合則肝膽</h1><p>詩人比興，觸物圓覽，萬物雖遠，合之則一也。</p><p>贊曰：詩人比興，觸物圓覽。物雖胡越，合則肝膽。擬容取心，斷辭必敢。攢雜詠歌，如川之渙。</p><p>夫萬物之散也，若胡越之遼遠；比興之合也，若肝膽之相親。詩人觸物圓覽，觀其容貌，究其心思，則雖殊類可以相通。是以辭之敢斷者，必有其見焉。攢集詠歌，敷陳比義，自然流暢，如川水之渙渙然矣。</p><p><strong>所出</strong>：《文心雕龍 · 比興》 — https://zh.wikisource.org/wiki/文心雕龍/比興</p></article></main></div></div>
