    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 雨無正</nav></header><main><article><h1>雨無正</h1><p>刺幽王時政苛民困，言者無辜而獲罪，賢者無所容也。</p><p>《雨無正》，《詩經·小雅》篇名也。毛亨傳云：「雨自上下者也，衆多如雨，而非所以為政也。」言幽王為政，暴虐無常，災異並臻，如雨之驟至，非真雨也，乃天譴之象也。</p><p>詩凡七章，二章十句、二章八句、三章六句。其辭則言天譴虐政、君子失職、言路不通、賢者無所容身之事。蓋幽王時，三師怠職，諸侯不朝，大夫離居，而下情不能上達，有言者反獲罪，故詩人因而哀之。</p><p><strong>所出</strong>：《詩經 · 雨無正》 — https://zh.wikisource.org/wiki/詩經/雨無正</p></article></main></div></div>
