    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 維北有斗，西柄之揭</nav></header><main><article><h1>維北有斗，西柄之揭</h1><p>斗柄西指，欲挹於東，以喻周室之剝削東土</p><p>斗柄西揭，言斗之柄揭然而向西方也。斗在北而柄西揭，是欲挹取西方乎？不然。詩人之意，以為斗在南則柄揭而可挹，今在北而柄揭，則失其位。又有「西柄」之語，與「維北有斗」相應，見其位不正而柄有所向。周自西方而來，其柄揭然，挹取東土之膏血，此詩人刺之意也。</p><p><strong>所出</strong>：《詩經 · 大東》 — https://zh.wikisource.org/wiki/詩經/大東</p></article></main></div></div>
