    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 丹房寶鑑</nav></header><main><article><h1>丹房寶鑑</h1><p>丹房寶鑑之圖，以象陰陽四象，配四方神獸，示丹道法象。</p><p>[[悟真篇]]有《丹房寶鑑之圖》，以青龍配東、白虎配西、朱雀配南、玄武配北，中央以土居之。四方之神獸，分別象[[龍虎]][[龜蛇]]之氣。圖中以「土」居中，四象環之，乃成鼎器之象。圖象之外，復列[[汞]]與[[金丹]]及[[鉛]]之別名，總三百餘字，皆丹經隱語。</p><p><strong>所出</strong>：《悟真篇》 — https://zh.wikisource.org/wiki/悟真篇</p></article></main></div></div>
