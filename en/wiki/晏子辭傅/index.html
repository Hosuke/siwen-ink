    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 晏子辭傅</nav></header><main><article><h1>晏子辭傅</h1><p>晏子辭景公以為子，恐其離樹別党，傾國之道。</p><p>景公有男子五人，所使傅之者皆有車百乘。景公告晏子曰：「勉之，將以而所傅者為子。」晏子辭曰：「君命其臣，據其肩以盡其力，臣敢不勉乎。今有車百乘之家，此一國之權臣也。人人以君命命之曰：『將以而所傅為子。』此離樹別党，傾國之道也，嬰不敢受命，願君圖之。」晏子之見，遠慮[[以賤匹貴]]之患，守[[從義不從父]]之義，以為非分之讓不可受也。</p><p><strong>所出</strong>：《晏子春秋 · 卷一》 — https://zh.wikisource.org/wiki/晏子春秋/卷一</p></article></main></div></div>
