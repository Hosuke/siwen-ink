    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 趣湯如歸</nav></header><main><article><h1>趣湯如歸</h1><p>義士赴死不辭，如歸其宅，誠知所處也。</p><p>欒布與彭越有舊。越反，夷三族，梟首洛陽，詔禁收視。布自齊還，奏事彭越頭下，祠而哭之。吏捕以聞，高祖欲亨之。布被提趣湯，顧曰：「願一言而死。」乃陳彭越之功、天下之定，辭氣慷慨，無求生之意。竟釋布罪，拜爲都尉。太史公曰：「<strong>趣湯如歸</strong>者，彼誠知所處，不自重其死。雖往古烈士，何以加哉！」蓋士之慷慨赴義者，視死如歸，非輕生也，，知道之所在，義無所辭。</p><p><strong>所出</strong>：《史記 · 卷100》 — https://zh.wikisource.org/wiki/史記/卷100</p></article></main></div></div>
