    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 以為天下母</nav></header><main><article><h1>以為天下母</h1><p>天下之本源，萬物所從生</p><p>天下有始，萬物之先也。以此為天下之母，猶母生子，子歸其本，萬物皆稟道而生，循母而終。[[天下有始]]言其原，[[以為天下母]]明其用。言道為天下萬物之母，萬物由之以生，循之則存，失之則亡。此[[老子 (帛書校勘版)]]之要義，與王弼本「天下有始，以為天下母」義同，唯文字稍異，義無殊別。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第十五章 守母》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
