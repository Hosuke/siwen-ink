    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 水脹</nav></header><main><article><h1>水脹</h1><p>水邪聚腹，按之隨手而起，如裹水之狀。</p><p>水始起也，目窠上微腫，如新臥起之狀，其頸脈動，時欬，陰股間寒，足脛腫，腹乃大，其水已成矣。以手按其腹，隨手而起，如裹水之狀，此其候也。</p><p><strong>所出</strong>：《黃帝內經 · 靈樞第九卷》 — https://zh.wikisource.org/wiki/黃帝內經/靈樞第九卷</p></article></main></div></div>
