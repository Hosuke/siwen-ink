    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 不欺其民</nav></header><main><article><h1>不欺其民</h1><p>施政不可欺民，不可僥倖於一時。</p><p>不偷取一世則民無怨心，不欺其民則下親其上。</p><p><strong>所出</strong>：《管子 · 第01篇牧民》 — https://zh.wikisource.org/wiki/管子/第01篇牧民</p></article></main></div></div>
