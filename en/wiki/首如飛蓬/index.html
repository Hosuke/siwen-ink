    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 首如飛蓬</nav></header><main><article><h1>首如飛蓬</h1><p>髮散而不整，以喻思念之切、無心修飾也。</p><p>「首如飛蓬」，語出《伯兮》。言自夫東征之後，己之髮散亂如飛蓬，無心梳理也。「蓬」為草名，遇風則飛卷漂蕩，因以為散亂之喻。</p><p>後世詩文用「飛蓬」「蓬鬢」言戎旅別離之苦、閨中思念之情，皆本此詩。</p><p><strong>所出</strong>：《詩經 · 伯兮》 — https://zh.wikisource.org/wiki/詩經/伯兮</p></article></main></div></div>
