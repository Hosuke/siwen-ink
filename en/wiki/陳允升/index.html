    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 陳允升</nav></header><main><article><h1>陳允升</h1><p>龍虎山道士，歸而顏貌如初，頃擕橘而至。</p><p>陳允升者，入龍虎山。唐哀帝天祐中，人見之於麻姑山，計去家七十年矣，顏貌如初。刺史迎置郡中，夜坐嘗曰：「豐城橘美，頗思之。」允升少頃擕數百枚至。時人謂之仙矣。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 44》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/44</p></article></main></div></div>
