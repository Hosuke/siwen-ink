    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 苟亦無從</nav></header><main><article><h1>苟亦無從</h1><p>戒勿盲從偽言也。</p><p>苟亦無從，乃《采苓》三章之誡也。言聞人之為言，苟可以從之耶？無之也。戒人勿盲從偽言。</p><p>「無信」戒在始接，「無與」戒在傳播，「無從」戒在奉行。三者環環相扣，以見慎言聽言之要。《大學》言「此之謂絜矩之道」，亦此意也。</p><p><strong>所出</strong>：《詩經 · 采苓》 — https://zh.wikisource.org/wiki/詩經/采苓</p></article></main></div></div>
