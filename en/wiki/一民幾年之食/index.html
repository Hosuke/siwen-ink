    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 一民幾年之食</nav></header><main><article><h1>一民幾年之食</h1><p>問民所有之食可足幾年，察歲儲之虛實。</p><p>問一民有幾年之食也？夫食者，民之命也；歲者，國之儲也。一年之食者，民之常也；三年之食者，國之備也；五年之食者，霸王之資也。民無三年之蓄，則心不寧；國無五年之儲，則事不濟。故善為國者，必先務本厚農，使耕耘以時、收獲以節，蓄積盈而有餘，然後水旱可備、兵荒不虞。若民無隔宿之粮，則姦宄生、變亂作，此亡國之象也。</p><p><strong>所出</strong>：《管子 · 第24篇問》 — https://zh.wikisource.org/wiki/管子/第24篇問</p></article></main></div></div>
