    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 太史公曰韓信盧綰陳豨</nav></header><main><article><h1>太史公曰韓信盧綰陳豨</h1><p>非積德累善，徼一時權變，遭漢初定得列地，內見疑彊大，外倚蠻貊，卒赴匈奴。</p><p>太史公曰：韓信、盧綰非素積德累善之世，徼一時權變，以詐力成功，遭漢初定，故得列地，南面稱孤。內見疑彊大，外倚蠻貊以為援，是以日疏自危，事窮智困，卒赴匈奴，豈不哀哉！陳豨，梁人，其少時數稱慕魏公子；及將軍守邊，招致賓客而下士，名聲過實。周昌疑之，疵瑕頗起，懼禍及身，邪人進說，遂陷無道。於戲悲夫！夫計之生孰成敗於人也深矣！</p><p><strong>所出</strong>：《史記 · 卷093》 — https://zh.wikisource.org/wiki/史記/卷093</p></article></main></div></div>
