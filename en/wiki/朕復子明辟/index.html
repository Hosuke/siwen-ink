    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 朕復子明辟</nav></header><main><article><h1>朕復子明辟</h1><p>周公還政於成王，命其親理天下。</p><p>周公拜手稽首，率群臣還政於孺子成王。洛邑既建，周公述卜相之功，勸王親政，以「朕復子明辟」一言，定成王踐阼之始。蓋周公攝政七年，天下大定，因以明辟還之，成王於是為天下主。此「明辟」之還，實周初興衰之大節，後世稱之，以為賢臣不私於位之典範。</p><p><strong>所出</strong>：《尚書 · 洛誥》 — https://zh.wikisource.org/wiki/尚書/洛誥</p></article></main></div></div>
