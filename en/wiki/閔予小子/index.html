    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 詩經·閔予小子</nav></header><main><article><h1>詩經·閔予小子</h1><p>嗣王自傷幼沖，誓敬事以繼先王之業。</p><p>《閔予小子》，[[詩經]]《周頌》之篇也。嗣王於父喪既殯，朝廷新立，自傷幼沖，援筆述志。</p><p>全詩一章，十一句。辭曰：</p><p>:「維予小子，夙夜敬止。」
:「於乎皇王，繼序思不忘。」</p><p>首言己方童年踐祚，德薄任重，惟早夜敬慎，不敢懈怠。次言感念皇王之烈，念茲在茲，務期繼承其緒業而不忘。辭約義深，辭少情長。[[後世]][[帝王]]即位詔誥，多祖述此義。</p><p><strong>所出</strong>：《詩經 · 閔予小子》 — https://zh.wikisource.org/wiki/詩經/閔予小子</p></article></main></div></div>
