    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 鄭伯享王于闕西辟</nav></header><main><article><h1>鄭伯享王于闕西辟</h1><p>鄭伯助周定亂，享王于闕西辟，樂備，王賞以武公之略，而原伯以效尤致咎。</p><p>二十一年春，胥命於弭。夏，同伐王城。鄭伯將王，自圉門入，虢叔自北門入，殺王子頹及五大夫。鄭伯享王于闕西辟，樂備。王與之武公之略，自虎牢以東。原伯曰：「鄭伯效尤，其亦將有咎。」五月，鄭厲公卒。</p><p>王巡虢守。</p><p><strong>所出</strong>：《春秋左氏傳 · 莊公》 — https://zh.wikisource.org/wiki/春秋左氏傳/莊公</p></article></main></div></div>
