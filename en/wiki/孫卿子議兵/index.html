    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 孫卿子議兵</nav></header><main><article><h1>孫卿子議兵</h1><p>孫卿與趙孝成王、臨武君論兵，以仁義為本。</p><p>[[臨武君]]與[[孫卿子]]議兵於[[趙孝成王]]前。王問兵要，臨武君以為貴天時、地利、觀敵變動。孫卿子則以為本在乎壹民，善附民者善用兵也。二人反覆詰難，論仁者之兵與權謀埶利之辨，及齊、魏、秦三國兵制之優劣。孫卿子復論為將之道六術、五權、三至，論王者軍制及兵之終極目的。末論以德、力、富兼人之異效，及凝士以禮、凝民以政之要義。</p><p><strong>所出</strong>：《荀子 · 議兵篇》 — https://zh.wikisource.org/wiki/荀子/議兵篇</p></article></main></div></div>
