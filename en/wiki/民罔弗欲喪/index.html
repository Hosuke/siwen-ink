    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 民罔弗欲喪</nav></header><main><article><h1>民罔弗欲喪</h1><p>殷民無不欲殷之亡，天不降威則民心去。</p><p>「今我民罔弗欲喪，曰：『天曷不降威？大命不摯？』」言殷民無不欲商之王室滅亡，仰望上天速降誅罰。天威不降，大命不就，民心已離。</p><p><strong>所出</strong>：《尚書 · 西伯戡黎》 — https://zh.wikisource.org/wiki/尚書/西伯戡黎</p></article></main></div></div>
