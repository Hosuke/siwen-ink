    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 無材可為材</nav></header><main><article><h1>無材可為材</h1><p>無材者無所可用，乃可以為天下用</p><p>田駢對齊王曰：「臣之言無政，而可以為政。譬之若林木無材，而可以為材。」無材者無所偏執，因物付物，天下之至材也。齊國之政何足問哉，天地之間可陶冶而變化也。</p><p><strong>所出</strong>：《淮南子 · 道應訓》 — https://zh.wikisource.org/wiki/淮南子/道應訓</p></article></main></div></div>
