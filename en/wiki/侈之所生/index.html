    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 侈之所生</nav></header><main><article><h1>侈之所生</h1><p>奢侈生於無度，而匱不足生於奢，姦邪又生於匱。</p><p>匱不足之所生，生於侈；侈之所生，生於毋度。是以審度量、節衣服、儉財用、禁侈泰，乃爲國之急也。主上無積而宮室美，氓家無積而衣服脩，乘車者飾觀望，步行者雜文采，本資少而末用多者，乃侈國之俗也。國侈則用費，用費則民貧，民貧則姦智生，姦智生則邪巧作。故姦邪之所生，生於匱不足；匱不足之所生，生於侈。觀其衣服車馬宮室之美，可以知其國之侈儉矣。</p><p><strong>所出</strong>：《管子 · 第13篇八觀》 — https://zh.wikisource.org/wiki/管子/第13篇八觀</p></article></main></div></div>
