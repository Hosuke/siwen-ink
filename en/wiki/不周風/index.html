    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 不周風</nav></header><main><article><h1>不周風</h1><p>不周風居西北，主殺生，十月之律為應鐘。</p><p>不周風居西北，主殺生。東壁居不周風東，主辟生氣至於營室。陽氣而産之。東至於危。危，垝也。言陽氣之垝，故曰危。十月也，律中應鐘。應鐘者，陽氣之應，不用事也。其於十二子為亥。亥者，該也，言陽氣藏於下，故該也。</p><p>不周者，不周全之意。西北之風，陰氣用事，萬物收殺，故主殺生。陽氣至此而藏，故曰垝、曰該。</p><p><strong>所出</strong>：《史記 · 卷025》 — https://zh.wikisource.org/wiki/史記/卷025</p></article></main></div></div>
