    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 常足</nav></header><main><article><h1>常足</h1><p>常足者無欲心，糞精糞田，常保盈滿。</p><p>[[常足]]者[[無欲心]]也。知足之足守真根，常足無欲心，是[[糞田糞身]]而至[[常足]]之域。[[卻走馬以糞]]則地肥，糞精以糞身則[[常足]]。欲得者[[咎莫大]]，知足者[[常足]]。[[糞]]者，取也；[[常足]]者，不匱也。</p><p><strong>所出</strong>：《老子河上公章句 · 儉欲》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
