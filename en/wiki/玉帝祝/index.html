    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 玉帝祝</nav></header><main><article><h1>玉帝祝</h1><p>玉清大和王之祝辭，誦之以成仙也。</p><p>玉清大和王祝，誦玉經竟所陳之辭也。</p><p>《上清大洞真經》此章云：「玉清大和王祝曰：扶晨始暉生，紫雲映玄阿，煥洞圓光蔚，晃朗濯耀羅，眇眇靈景元，森灑空青華，九天館玉賓，金房唱霄歌，賢哉對帝賓，役召伯幽車，七祖解胞根，世世為仙家。」蓋行道者誦玉經竟，誦此祝以扶晨生暉、映照紫房、迎帝賓、解胞根，使七祖皆為仙家也。</p><p><strong>所出</strong>：《上清大洞真經 · 3章》 — https://zh.wikisource.org/wiki/上清大洞真經/3章</p></article></main></div></div>
