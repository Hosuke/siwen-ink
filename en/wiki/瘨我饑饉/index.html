    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 瘨我饑饉</nav></header><main><article><h1>瘨我饑饉</h1><p>饑荒為害，民不得食，流徙四方。</p><p>瘨我饑饉，民卒流亡。</p><p>瘨者，病也。饑饉之病加於我民，民無所得食，不得已而流散亡徙於四方。饑荒之甚，至於民皆失其所養而後已。</p><p>詩言此者，以見幽王之世，上不能備水旱，下不能給民食，致民流離失所也。流亡之民，非一日之故，乃饑饉累積，民力已竭而後然也。</p><p>是故為國者，必先務農重本，使民有積蓄之粟，然後水旱可備，饑饉不為災也。</p><p><strong>所出</strong>：《詩經 · 召旻》 — https://zh.wikisource.org/wiki/詩經/召旻</p></article></main></div></div>
