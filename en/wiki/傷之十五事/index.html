    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 傷之十五事</nav></header><main><article><h1>傷之十五事</h1><p>十五事皆足傷身，養生者當戒之。</p><p>且又才所不逮而困思之，傷也；力所不勝而強舉之，傷也；悲哀憔悴，傷也；喜樂過差，傷也；汲汲所欲，傷也；久談言笑，傷也；寢息失時，傷也；挽弓引弩，傷也；沈醉嘔吐，傷也；飽食即臥，傷也；跳走喘乏，傷也；歡呼哭泣，傷也；陰陽不交，傷也；積傷至盡則早亡，早亡非道也。</p><p><strong>所出</strong>：《抱朴子 · 卷13》 — https://zh.wikisource.org/wiki/抱朴子/卷13</p></article></main></div></div>
