    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 仁者無敵</nav></header><main><article><h1>仁者無敵</h1><p>行仁政於民，敵國外患者不攻自服</p><p>梁惠王問何以報仇雪恥。孟子對曰：地方百里，而可以王。王如施仁政於民，省刑罰，薄稅斂，深耕易耨；壯者以暇日修其孝悌忠信，入以事其父兄，出以事其長上；可使制梃以撻秦楚之堅甲利兵矣。彼陷溺其民，王往而征之，夫誰與王敵？故曰「仁者無敵」。</p><p><strong>所出</strong>：《孟子 · 梁惠王上》 — https://zh.wikisource.org/wiki/孟子/梁惠王上</p></article></main></div></div>
