    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 朱虛侯與大臣共誅諸呂</nav></header><main><article><h1>朱虛侯與大臣共誅諸呂</h1><p>劉章為內應，共誅諸呂而立代王。</p><p>朱虛侯章知呂祿女為婦，知其謀，乃使人陰出告齊王，令發兵西，章與東牟侯興居為內應，以誅諸呂，因立齊王為帝。齊王聞計，與舅父駟鈞等陰謀發兵。大臣聞之，議欲立齊王，而瑯邪王及大臣皆不可，卒迎立代王，遣朱虛侯以誅呂氏事告齊王，令罷兵。</p><p><strong>所出</strong>：《史記 · 卷052》 — https://zh.wikisource.org/wiki/史記/卷052</p></article></main></div></div>
