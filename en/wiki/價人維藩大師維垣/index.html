    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 价人維藩，大師維垣</nav></header><main><article><h1>价人維藩，大師維垣</h1><p>愛民而安，好士而榮，二者亡一焉而亡。</p><p>《詩·大雅·板》又別言「价人維藩」，以別於「[[價人維藩]]」之專言「价人」者。此則兼言大師、大邦、大宗、宗子，各有所司：</p><p>  大師維垣，猶[[公侯干城]]之任；大邦維屏，與[[守在海外匪山河]]之義相發；大宗維翰，如[[大宗小宗]]之固本；宗子維城，則[[宗子維城]]之義也。</p><p>  詩以藩、垣、屏、翰、城錯言其用，見國之屏蔽，非一端而立也。</p><p>  <strong>所出</strong>：《詩經 · 板》 — https://zh.wikisource.org/wiki/詩經/板</p></article></main></div></div>
