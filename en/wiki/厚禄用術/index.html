    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 厚禄用術</nav></header><main><article><h1>厚禄用術</h1><p>以厚禄待有術之人，使其為國效力而不為姦。</p><p>韓非云「以刑治，以賞戰，厚禄以用術」。術者，法術、計謀之術也。有術者，能察姦禁邪、輔國成事之人。厚禄以養之，則其心無外交之私，其志專治國之事；薄禄以處之，則必奔走衣食，為姦以自利。是故欲用術，必先厚禄；欲厚禄，必先富國。此霸王之要道也。</p><p><strong>所出</strong>：《韓非子 · 飭令》 — https://zh.wikisource.org/wiki/韓非子/飭令</p></article></main></div></div>
