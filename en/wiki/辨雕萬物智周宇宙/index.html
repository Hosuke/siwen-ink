    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 辨雕萬物智周宇宙</nav></header><main><article><h1>辨雕萬物智周宇宙</h1><p>丈夫處世，辨雕萬物，智周宇宙。</p><p>丈夫處世，懷寶挺秀。辨雕萬物，智周宇宙。立德何隱，含道必授。條流殊述，若有區囿。</p><p><strong>所出</strong>：《文心雕龍 · 諸子》 — https://zh.wikisource.org/wiki/文心雕龍/諸子</p></article></main></div></div>
