    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 男戎女戎</nav></header><main><article><h1>男戎女戎</h1><p>男戎伐戎而有女戎覆之，興滅相因之理。</p><p>史蘇曰：「有男戎必有女戎。若晉以男戎勝戎，而戎亦必以女戎勝晉，其若之何！」又云：「諸夏從戎，非敗而何？從政者不可以不戒，亡無日矣！」</p><p><strong>所出</strong>：《國語 · 卷07》 — https://zh.wikisource.org/wiki/國語/卷07</p></article></main></div></div>
