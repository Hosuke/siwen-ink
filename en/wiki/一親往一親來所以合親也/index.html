    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 一親往，一親來</nav></header><main><article><h1>一親往，一親來</h1><p>喪葬之禮以相往來為合親</p><p>「長喪以𪑺其時，重送葬以起身財。一親往，一親來，所以合親也，此謂眾約。」厚辦喪事所以盡孝思，重行送葬所以起身財。一人往而一人來，相往還而無已時，此所以合乎親情也。巨瘞堷所以使貧民，美壟墓所以文明，巨棺槨所以起木工，多衣衾所以起女工，作此相食，然後民相利。</p><p><strong>所出</strong>：《管子 · 第35篇侈靡》 — https://zh.wikisource.org/wiki/管子/第35篇侈靡</p></article></main></div></div>
