    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 景星</nav></header><main><article><h1>景星</h1><p>黃帝時有德感之星，形似月助月為光。</p><p>帝以嘉禾為糧，以醴泉為漿，以五芝為芳。時有水物洋湧，山車滿野，於是德感上天，故有黃星之祥，謂之異星，形狀似月，助月為光，名曰景星。又有赤方氣與青方氣相連，赤方中有二星，青方中有一星，凡三星。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 1》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/1</p></article></main></div></div>
