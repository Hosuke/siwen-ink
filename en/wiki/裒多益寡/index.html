    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 裒多益寡</nav></header><main><article><h1>裒多益寡</h1><p>取有餘以補不足，使物得其平。</p><p>《象》曰「君子以裒多益寡」，言君子觀謙之象，取過多者裒損之，取不足者增益之，使多寡適均也。</p><p><strong>所出</strong>：《周易 · 謙》 — https://zh.wikisource.org/wiki/周易/謙</p><hr><p>謙謙君子，裒多益寡，稱物平施。取彼有餘以濟不足，多者不自以為多，寡者不以為怨，均平之道也。
<strong>所出</strong>：《周易註 (王弼) · 卷02》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷02</p></article></main></div></div>
