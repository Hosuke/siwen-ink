    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 尊道貴德</nav></header><main><article><h1>尊道貴德</h1><p>萬物尊道而貴德，夫莫之命而常自然。</p><p>萬物之生，莫非道之所生，莫非德之所畜。形於物，成於勢，而終莫不以道為尊、以德為貴。</p><p>道之所以尊，德之所以貴，不待上命，不假外援。物自從之，莫之令而自正，此之謂「常自然」。</p><p><strong>所出</strong>：《老子河上公章句 · 養德》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
