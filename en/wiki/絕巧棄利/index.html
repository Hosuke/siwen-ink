    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 絕巧棄利</nav></header><main><article><h1>絕巧棄利</h1><p>絕去奇技巧利，則盜賊自止。</p><p>絕巧棄利，盜賊无有。</p><p>言絕去技巧與利欲之心，則盜賊無由而生。</p><p>巧者，機變之術；利者，貪取之心。巧所以啟爭，利所以招怨。絕而去之，則民不見可欲，盜賊之類無自生存。此承前二絕而極言之也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第六十三章 樸素》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
