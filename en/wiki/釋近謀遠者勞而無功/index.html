    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 釋近謀遠者勞而無功</nav></header><main><article><h1>釋近謀遠者勞而無功</h1><p>舍近圖遠者徒勞無功，舍遠圖近者安逸有成。</p><p>釋近謀遠者，勞而無功；釋遠謀近者，佚而有終。佚政多忠臣，勞政多怨民。</p><p>故曰，務廣地者荒，務廣德者強。能有其有者安，貪人之有者殘。殘滅之政，累世受患；造作過制，雖成必敗。</p><p><strong>所出</strong>：《三略》 — https://zh.wikisource.org/wiki/三略</p></article></main></div></div>
