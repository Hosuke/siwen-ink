    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 鳳皇于飛</nav></header><main><article><h1>鳳皇于飛</h1><p>聖君得賢臣，相得益彰。</p><p>鳳皇于飛，翽翽其羽，亦集爰止。又言亦傅于天。鳳皇，靈鳥也，喻聖賢相遇。其飛翩翩，其羽煌煌，集于所止，傅于高天，言賢才聚而用之，輔翼其君，上達天聽也。</p><p><strong>所出</strong>：《詩經 · 卷阿》 — https://zh.wikisource.org/wiki/詩經/卷阿</p><hr><p>齊懿仲欲妻陳敬仲，卜之，占曰：「是謂鳳皇于飛，和鳴鏘鏘。有媯之後，將育于姜。五世其昌，并于正卿。八世之後，莫之與京。」</p><p><strong>所出</strong>：《史記 · 卷036》 — https://zh.wikisource.org/wiki/史記/卷036</p></article></main></div></div>
