    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 燕婉之求</nav></header><main><article><h1>燕婉之求</h1><p>求新婚之好合，詩以為反興得醜之辭</p><p>燕婉，美好之貌，蓋新婚伉儷和順之謂也。《新臺》三章皆以「燕婉之求」發端，而下言「蘧篨不鮮」「蘧篨不殄」「得此戚施」，正反相形，見人心所求與事實所遭者截然相反，所以刺也。</p><p><strong>所出</strong>：《詩經 · 新臺》 — https://zh.wikisource.org/wiki/詩經/新臺</p></article></main></div></div>
