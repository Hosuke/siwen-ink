    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 授事以能</nav></header><main><article><h1>授事以能</h1><p>授人以事，當以其才能為準；論功行賞，各當其分。</p><p>授事以能，則人上功；[[祿予有功]]，則士輕死節。夫用人者，必量其能而授之事，考其功而予之祿。能使者居上位，不能者退處閒散，則賢才進而功業成。若授非其人，則事廢賞濫，而國危矣。是以明主治國，先別賢否，次問事功，而賞罰行焉。</p><p><strong>所出</strong>：《管子 · 第24篇問》 — https://zh.wikisource.org/wiki/管子/第24篇問</p></article></main></div></div>
