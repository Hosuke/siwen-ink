    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 四固-之</nav></header><main><article><h1>四固-之</h1><p></p><p>《管子》言安國有四固，乃安危之本也：</p><p>  君之所慎者四：一曰大德不至仁，不可以授國柄。二曰見賢不能讓，不可與尊位。三曰罰避親貴，不可使主兵。四曰不好本事，不務地利而輕賦斂，不可與都邑。此四務者，安危之本也。</p><p>  故曰：卿相不得衆，國之危也。大臣不和同，國之危也。兵主不足畏，國之危也。民不懷其產，國之危也。故大德至仁，則操國得衆；見賢能讓，則大臣和同；罰不避親貴，則威行於鄰敵；好本事、務地利、重賦斂，則民懷其產。</p><p>  <strong>所出</strong>：《管子 · 第04篇立政》 — https://zh.wikisource.org/wiki/管子/第04篇立政</p></article></main></div></div>
