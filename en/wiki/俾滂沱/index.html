    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 俾滂沱</nav></header><main><article><h1>俾滂沱</h1><p>致令大雨傾盆，喻天象示警，征途益艱。</p><p>「俾滂沱」者，使之暴雨如注也。俾，使也。滂沱，大雨貌。承上文「月離于畢」而言，占星之言驗矣，大雨果然。</p><p>東征之師，本已山路崎嶇、天暑人乏，加以暴雨驟至，道路泥濘，行役愈困。詩人疊此意象，非徒狀天時之惡，實以見師旅之艱危，無以復加也。</p><p><strong>所出</strong>：《詩經 · 漸漸之石》 — https://zh.wikisource.org/wiki/詩經/漸漸之石</p></article></main></div></div>
