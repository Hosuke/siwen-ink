    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 柳融含粉成物</nav></header><main><article><h1>柳融含粉成物</h1><p>南極子姓柳名融，含粉成鵓煮之不死，呪杯成龜，呪水成酒，吐木為林。</p><p>南極子姓柳名融，能含粉成鵓子，吐之數十枚，煮而啖之，與鵓子無異。黃中皆餘粉少許如指端者，取杯呪之，即成龜，煮之可食，腸臟皆具，而杯成龜殼，煮取肉則殼還成杯矣。取水呪之，即成美酒，飲之醉人。舉手即成大樹，人或折其細枝以刺屋間，連日猶在，以漸萎壞，與真木無異。服雲霜丹得仙去。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 5》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/5</p></article></main></div></div>
