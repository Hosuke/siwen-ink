    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 繾綣</nav></header><main><article><h1>繾綣</h1><p>姦人膠固不去之貌也。</p><p>繾綣者，糾結不解之貌，以喻姦人之固結而不可去也。姦人不去，則正道不行；不去姦人，而求政治之明，難矣。</p><p><strong>所出</strong>：《詩經 · 民勞》 — https://zh.wikisource.org/wiki/詩經/民勞</p></article></main></div></div>
