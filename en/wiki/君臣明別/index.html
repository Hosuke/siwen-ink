    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 君臣明別</nav></header><main><article><h1>君臣明別</h1><p>君臣職分曉然，則治易為功。</p><p>是故官之失其治也，是主以譽為賞、以毀為罰也。然則喜賞惡罰之人，離公道而行私術矣。比周以相為匿，是忘主死交以進其譽。然則君臣之間明別，明別則易治也。主雖不身下為，而守法為之可也。</p><p><strong>所出</strong>：《管子 · 第46篇明法》 — https://zh.wikisource.org/wiki/管子/第46篇明法</p></article></main></div></div>
