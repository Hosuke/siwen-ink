    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 武王虎賁三千禽紂</nav></header><main><article><h1>武王虎賁三千禽紂</h1><p>武王虎賁三千人、簡車三百乘，禽紂牧野，遂有天下。</p><p>武王虎賁三千人，簡車三百乘，以要甲子之事於牧野而紂為禽。顯賢者之位，進殷之遺老，而問民之所欲，行賞及禽獸，行罰不辟天子，親殷如周，視人如己，天下美其德，萬民說其義，故立為天子。</p><p><strong>所出</strong>：《呂氏春秋 · 卷八》 — https://zh.wikisource.org/wiki/呂氏春秋/卷八</p></article></main></div></div>
