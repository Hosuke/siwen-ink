    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 臣道</nav></header><main><article><h1>臣道</h1><p>臣道在於方論是處，當為事先唱；君臣異道即治，同道即亂。</p><p>臣道，方論是處，當為事先唱，守職明分，以立成功。故君臣異道即治，同道即亂，各得其宜，處有其當，即上下有以相使也。枝不得大於榦，末不得強於本；言輕重大小有以相制也。</p><p><strong>所出</strong>：《文子 · 卷十一》 — https://zh.wikisource.org/wiki/文子/卷十一</p></article></main></div></div>
