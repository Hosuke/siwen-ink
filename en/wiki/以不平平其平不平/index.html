    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 以不平平其平不平</nav></header><main><article><h1>以不平平其平不平</h1><p>以不均齊均均愈失</p><p>以不平平，其平也不平；以不徵徵，其徵也不徵。</p><p>[[明者唯為之使，神者徵之。夫明之不勝神也久矣，而愚者恃其所見入於人，其功外也，不亦悲乎！]]</p><p>世人欲以人為之不平以見其平，是強為軒輊，而真平終不可得；欲以私意之徵驗以見其應驗，是妄加揣測，而真徵終不得聞。刻意以為之，反而失其自然之理，明不如神，巧不如拙。</p><p><strong>所出</strong>：《莊子 · 列禦寇》 — https://zh.wikisource.org/wiki/莊子/列禦寇</p></article></main></div></div>
