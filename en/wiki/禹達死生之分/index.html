    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 禹達死生之分</nav></header><main><article><h1>禹達死生之分</h1><p>禹受命於天，生死有命，故黃龍負舟而龍俛耳低尾而逝。</p><p>禹南省，方濟乎江，黃龍負舟。舟中之人，五色無主。禹仰視天而歎曰：「吾受命於天，竭力以養人。生，性也；死，命也。余何憂於龍焉？」龍俛耳低尾而逝。則禹達乎死生之分、利害之經也。凡人物者，陰陽之化也。陰陽者，造乎天而成者也。天固有衰嗛廢伏，有盛盈坌息；人亦有困窮屈匱，有充實達遂；此皆天之容、物理也，而不得不然之數也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十</p></article></main></div></div>
