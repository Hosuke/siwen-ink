    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 晉武敕戒百官</nav></header><main><article><h1>晉武敕戒百官</h1><p>述晉武帝敕戒遍及都督、州牧、郡守、牙門，各有專司。</p><p>及晉武敕戒，備告百官；敕都督以兵要，戒州牧以董司，警郡守以恤隱，勒牙門以御衛，有訓典焉。</p><p><strong>所出</strong>：《文心雕龍 · 詔策》 — https://zh.wikisource.org/wiki/文心雕龍/詔策</p></article></main></div></div>
