    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 端言直道</nav></header><main><article><h1>端言直道</h1><p>端正直言、不阿權貴之道，治國之所貴也。</p><p>端言者，言詞端正；直道者，道途正直。端言直道之人，專以忠直輔君，不為苟合，不阿權貴。</p><p>然人臣有議當途之失、用事之過、舉臣之情者，其言固端且直也；第以近習能人蔽塞主聽，言路遂塞，端言直道之人日見疏遠，而忠直日疏矣。</p><p>此韓非所以深憂也。姦臣塞言路，則[[明劫]]起；[[事劫]]行，則賞罰亂；[[刑劫]]成，則君之威柄失。端言直道之不存，乃三劫所由生之朕兆也。</p><p><strong>所出</strong>：《韓非子 · 三守》 — https://zh.wikisource.org/wiki/韓非子/三守</p></article></main></div></div>
