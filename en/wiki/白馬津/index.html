    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 白馬津</nav></header><main><article><h1>白馬津</h1><p>津渡之名，劉賈渡此入楚，燒楚積聚，以絕項王軍食。</p><p>漢四年，漢王使劉賈將二萬人、騎數百，渡白馬津入楚地，燒其積聚，以破其業，無以給項王軍食。白馬津者，黃河津渡要地，河北通往河南之衝也。</p><p><strong>所出</strong>：《史記 · 卷051》 — https://zh.wikisource.org/wiki/史記/卷051</p></article></main></div></div>
