    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 太微、紫宮</nav></header><main><article><h1>太微、紫宮</h1><p>太微為太一之庭，紫宮為太一之居，軒轅為帝妃之舍，咸池為水魚之囿，天阿為群神之闕。</p><p>太微者，太一之庭也。紫宮者，太一之居也。軒轅者，帝妃之舍也。咸池者，水魚之囿也。天阿者，群神之闕也。四宮者，所以為司賞罰。太微者主朱雀，紫宮執斗而左旋，日行一度，以周於天。日冬至峻狼之山，日移一度，凡行百八十二度八分度之五，而夏至牛首之山。反覆三百六十五度四分度之一而成一歲。</p><p><strong>所出</strong>：《淮南子 · 天文訓》 — https://zh.wikisource.org/wiki/淮南子/天文訓</p></article></main></div></div>
