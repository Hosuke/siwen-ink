    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 有身有患</nav></header><main><article><h1>有身有患</h1><p>人之所以有大患者，以其有身也；苟無身焉，患亦何有。</p><p>吾所以有大患者，為吾有身。及吾無身，吾何有患。</p><p>夫身者，患之所寓也。有身則有欲，有欲則有爭，有爭則有大患隨之。是故人之所以有患患者，非由外至，正由有身故耳。苟能及吾無身，則何患之有？</p><p><strong>所出</strong>：《老子河上公章句 · 厭恥》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
