    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 不伐喪</nav></header><main><article><h1>不伐喪</h1><p>鄰國有喪，君子不加兵焉。</p><p>晉士丐帥師侵齊。至穀，聞齊侯卒，乃還。還者，事未畢之辭也。受命而誅，生死無所加其怒，不伐喪，善之也。</p><p>不伐喪者，兵家之義、仁者之心也。齊有喪，晉帥伐之，師至穀而聞訃，則斂兵以還，不復加兵。蓋死亡者，天之所廢；吾之加兵，則是乘人之厄而暴之，非義舉也。不伐喪，善之也。</p><p><strong>所出</strong>：《春秋穀梁傳 · 襄公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/襄公</p></article></main></div></div>
