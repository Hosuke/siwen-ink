    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 將安將樂，女轉棄予</nav></header><main><article><h1>將安將樂，女轉棄予</h1><p>危難則相扶持，安樂則相遺棄，友道之薄也。</p><p>「將安將樂，女轉棄予」，言當汝將安將樂之時，則反轉而棄我也。《小雅·谷風》言朋友之交，以利相合，患難之時維予與女；及其安樂，則轉而棄予如遺矣。世態之薄，於是可見；交道之窮，於斯為甚。《詩》刺朋友道絕，而歎人心之不古也。<strong>所出</strong>：《詩經 · 谷風》 — https://zh.wikisource.org/wiki/詩經/谷風</p></article></main></div></div>
