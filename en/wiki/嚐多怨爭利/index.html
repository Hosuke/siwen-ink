    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 嚐多怨爭利</nav></header><main><article><h1>嚐多怨爭利</h1><p>嚐試多怨爭利相為不遜，則不得其身；修恭遜敬愛，則不失於人。</p><p>管子言：「修恭遜敬愛辭讓，除怨無爭，以相逆也，則不失於人矣。嚐試多怨爭利，相為不遜，則不得其身。」恭遜者吉，爭利者凶，二者相去遠矣。[[審去之身]]者，不能脩恭遜，是自辱其身也。</p><p><strong>所出</strong>：《管子 · 第32篇小稱》 — https://zh.wikisource.org/wiki/管子/第32篇小稱</p></article></main></div></div>
