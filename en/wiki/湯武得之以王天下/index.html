    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 湯武得之以王天下</nav></header><main><article><h1>湯武得之以王天下</h1><p>黃帝得之以登天，湯武得之以王天下，五霸得之以統諸侯。</p><p>黃帝得之以登雲天，湯武得之以王天下，五霸得之以統諸侯。</p><p>黃帝得《陰符》之妙，契合天機，故能馭龍上昇。湯武得之，以有道伐無道，替天行道，故王天下。五霸得之，假仁義以令諸侯。然得之淺深不同，用之得失亦異。湯武以道得，故傳之永久；五霸以術得，故功僅一世。</p><p><strong>所出</strong>：《黃帝陰符經集註》 — https://zh.wikisource.org/wiki/黃帝陰符經集註</p></article></main></div></div>
