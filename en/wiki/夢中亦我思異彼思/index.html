    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 夢中亦我思異彼思</nav></header><main><article><h1>夢中亦我思異彼思</h1><p>夢中之人亦我思異彼思，人我之別實難分。</p><p>世之人，以我思異彼思彼思異我思分人我者，殊不知夢中人亦我思異彼思。彼思異我思，孰為我，孰為人。</p><p><strong>所出</strong>：《關尹子 · 6》 — https://zh.wikisource.org/wiki/關尹子/6</p></article></main></div></div>
