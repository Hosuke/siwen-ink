    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 恭若先王成烈</nav></header><main><article><h1>恭若先王成烈</h1><p>敬慎以承先王之功烈。</p><p>王戒畢公「欽若先王成烈，以休于前政」。言畢公當敬順先王之功烈，恭而行之，以休美前人之善政也。</p><p><strong>所出</strong>：《尚書 · 畢命》 — https://zh.wikisource.org/wiki/尚書/畢命</p></article></main></div></div>
