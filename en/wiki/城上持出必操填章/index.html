    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 城上持出必操填章</nav></header><main><article><h1>城上持出必操填章</h1><p>城中之人持物出城，必持符印為驗，否則禁止。</p><p>城持出必為明填，令吏民皆知之。從一人百人以上，持出不操填章，從人非其故人，乃其填章也，千人之將以上止之，勿令得行。行及吏卒從之，皆斬，具以聞於上。</p><p>此守城之重禁也，所以杜姦細之出沒，防敵人之間諜。</p><p><strong>所出</strong>：《墨子 · 備城門》 — https://zh.wikisource.org/wiki/墨子/備城門</p></article></main></div></div>
