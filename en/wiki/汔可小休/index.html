    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 汔可小休</nav></header><main><article><h1>汔可小休</h1><p>庶幾可得小休止也。</p><p>「休」者，息也。民亦勞止，汔可小休。休非徒息其力也，亦息其心也。政苛則民無時而休，姦縱則民無地而安。能使民有小休者，亦仁政之端也。</p><p><strong>所出</strong>：《詩經 · 民勞》 — https://zh.wikisource.org/wiki/詩經/民勞</p></article></main></div></div>
