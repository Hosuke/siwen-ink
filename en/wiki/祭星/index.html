    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 祭星</nav></header><main><article><h1>祭星</h1><p>天子於春分祭星，以時布令。</p><p>以冬日至始，數九十二日，謂之春至。天子東出其國九十二里而壇，朝諸侯卿大夫列士，循於百姓，號曰祭星。十日之內，室無處女，路無行人。</p><p>言天子於春至之節，行[[祭日|祭星之禮]]。四時之星，各有所司，春祭東方之星以布春令。其時令行禁止，故室無處女、路無行人，務使民從令以急春事也。</p><p><strong>所出</strong>：《管子 · 第85篇輕重己》 — https://zh.wikisource.org/wiki/管子/第85篇輕重己</p></article></main></div></div>
