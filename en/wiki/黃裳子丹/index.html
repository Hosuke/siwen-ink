    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 黃裳子丹</nav></header><main><article><h1>黃裳子丹</h1><p>丹田元氣凝成赤子，為長生之苗。</p><p>黃裳子丹者，丹田元氣凝聚之象也。《經》曰「黃裳子丹氣頻煩」，黃裳象坤德居下，子丹象赤子居腹。丹田居人身之中，其色黃、其德厚，所孳元氣凝而成丹，若赤子在腹中頻頻發動。修煉者心存丹田，則黃庭之氣日滋月長，赤子漸大，所謂一粒金丹吞入腹，始知我命不由天。此為內丹修煉之根苗，長生久視之根本也。</p><p><strong>所出</strong>：《黃庭內景經 · 靈臺章第十七》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/靈臺章第十七</p></article></main></div></div>
