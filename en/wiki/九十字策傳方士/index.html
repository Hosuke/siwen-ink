    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 九十字策傳方士</nav></header><main><article><h1>九十字策傳方士</h1><p>天書九十，以傳有道。</p><p>九者，究也，竟也，得行此者，德乃究洽天地陰陽萬物之心也。十者，十十相應，無為文也。字者，言天文上下字，周流遍道足也。傳者，信也，故為作委字符信以傳之也。方者，大方正也，持此道急往付歸有道德之君，可以消去[[承負之厄]]，其治即方且大正也。士者，有可克誌一介之人也，一介之人者，端心可教化屬事，使往通此道也。</p><p><strong>所出</strong>：《太平經 · 07》 — https://zh.wikisource.org/wiki/太平經/07</p></article></main></div></div>
