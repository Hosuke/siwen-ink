    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 酈生說沛公</nav></header><main><article><h1>酈生說沛公</h1><p>酈食其說沛公襲陳留，得秦積粟，助沛公西進。</p><p>沛公西過高陽，酈食其為監門，曰：「諸將過此者多，吾視沛公大人長者。」乃求見說沛公。沛公方踞床，使兩女子洗足。酈生不拜，長揖，曰：「足下必欲誅無道秦，不宜踞見長者。」於是沛公起，攝衣謝之，延上坐。</p><p>酈生說沛公襲陳留，得秦積粟。乃以酈食其為廣野君，酈商為將，將陳留兵，與偕攻開封，拔之。</p><p><strong>所出</strong>：《史記 · 卷008》 — https://zh.wikisource.org/wiki/史記/卷008</p></article></main></div></div>
