    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 鬼谷子術遇正人而窮</nav></header><main><article><h1>鬼谷子術遇正人而窮</h1><p>此書之術，於守正之人無所用之。</p><p>《[[拾遺記]]》言鬼谷先生教[[蘇秦]]、張儀以「干世出俗之辯」，言輔時之事，是其術主乎權謀用世。[[鬼谷子不可毀]]載秦皇遣徐福求金菜玉蔬，是秦皇信之。[[鬼谷子不待教學而能]]載蘇秦習其術以遊說諸侯。然[[鬼谷子嘉慶刻本]]附録之義，鬼谷之術，固有用世之智，亦有時窮之嘆。</p><p><strong>所出</strong>：《鬼谷子 · 鬼谷子附録》 — https://zh.wikisource.org/wiki/鬼谷子/鬼谷子附録</p></article></main></div></div>
