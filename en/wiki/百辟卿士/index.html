    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 百辟卿士</nav></header><main><article><h1>百辟卿士</h1><p>天下諸侯與卿大夫，皆媚于天子者也。</p><p>「百辟卿士」，語出《假樂》，言天下諸侯與卿大夫也。</p><p>辟者，諸侯也。卿士者，朝廷之臣也。之綱之紀既定，則天下之諸侯卿士，皆得燕及朋友，各安其位，媚于天子而無有二心。不解于位，則民有攸塈。此詩美成王之能得人心也。</p><p><strong>所出</strong>：《詩經 · 假樂》 — https://zh.wikisource.org/wiki/詩經/假樂</p></article></main></div></div>
