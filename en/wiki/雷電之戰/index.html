    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 雷電之戰</nav></header><main><article><h1>雷電之戰</h1><p>雷電之戰，士不齊也。以整擊亂，故能獨行無敵。</p><p>雷電之戰，以雷電喻攻伐之迅烈，士不齊者，敵陣不整也。</p><p>其文曰：「雷電之戰者，士不齊也。」「有雷電之戰，故能獨行而無敵矣。」</p><p>敵陣不整，我師整肅，以整擊亂，勢如雷電之相加，無有能當者。此[[奇正相生]]之義，正以整師而遇敵之不整也。</p><p><strong>所出</strong>：《管子 · 選陳》 — https://zh.wikisource.org/wiki/管子/七法/選陳</p></article></main></div></div>
