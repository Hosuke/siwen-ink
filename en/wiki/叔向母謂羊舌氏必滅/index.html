    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 叔向母謂羊舌氏必滅</nav></header><main><article><h1>叔向母謂羊舌氏必滅</h1><p>觀貌知性，虎目豕喙者必以賄亡宗。</p><p>叔魚生，其母視之，曰：「是虎目而豕喙，鳶肩而牛腹，谿壑可盈，是不可饜也，必以賄死。」遂不視。楊食我生，叔向之母聞之，往，及堂，聞其號也，乃還，曰：「其聲，豺狼之聲，終滅羊舌氏之宗者，必是子也。」</p><p><strong>所出</strong>：《國語 · 卷14》 — https://zh.wikisource.org/wiki/國語/卷14</p></article></main></div></div>
