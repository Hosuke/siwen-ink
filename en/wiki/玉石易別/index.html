    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 玉石易別</nav></header><main><article><h1>玉石易別</h1><p>抱朴子言玉石賢愚易別，而愛寶之情人皆有之，猶且獲罪受誣，況賢才之難知者乎。</p><p>夫玉石易別於賢愚，愛寶情篤於好士，以易別之寶，合篤好之物，猶獲罪截趾，歷世受誣。況乎難知之賢，非意所急，讒人畫蛇足於無形，奸臣畏忠貞之害己，體曲者忌繩墨之容，夜裸者憎明燈之來。是以高譽美行，抑而不揚，虛構之謗，先形生影。又無楚人號哭之薦，萬無一遇，固其宜矣。</p><p><strong>所出</strong>：《抱朴子 · 卷18》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷18</p></article></main></div></div>
