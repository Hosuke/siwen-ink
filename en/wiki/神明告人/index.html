    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 神明告人</nav></header><main><article><h1>神明告人</h1><p>神明或告人，心靈乍自吾，喻道成德契之感通。</p><p>神明或告人兮，心靈乍自吾。</p><p>丹道功深，神明默相，或以夢寐、或以靈感告人；而心靈忽悟，若出於己，非由外鑠。此修煉至於化境，道與人接、神與人通之驗也。</p><p><strong>所出</strong>：《周易參同契 · 32章》 — https://zh.wikisource.org/wiki/周易參同契/32章</p></article></main></div></div>
