    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 稱情而立文</nav></header><main><article><h1>稱情而立文</h1><p>禮文當依人情而立，以飾等威別親疏，不可增減。</p><p>三年之喪何也？曰：稱情而立文，因以飾群，別親疏貴賤之節，而弗可損益也。故曰：無易之道也。</p><p>創钜者其日久，痛甚者其愈遲，三年者，稱情而立文，所以為至痛極也。斬衰苴杖，居倚廬，食粥，寢苫枕塊，所以為至痛飾也。</p><p>上取象於天，下取法於地，中取則於人，人之所以群居和一之理盡矣。</p><p><strong>所出</strong>：《禮記 · 三年問》 — https://zh.wikisource.org/wiki/禮記/三年問</p></article></main></div></div>
