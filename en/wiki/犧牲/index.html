    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 犧牲</nav></header><main><article><h1>犧牲</h1><p>祭神以暴虐之心，神不享享必有咎悔。</p><p>犧牲之享，羔雁之薦，古之禮也。且古之君子，非不知情之憂喜、聲之哀樂能動天地、能感鬼神。刀杌前列，則憂喜之情可知矣；鷹犬齊至，則哀樂之聲可知矣。以是祭天地，以是禱神明，天地必不享，茍享之必有咎；神明必不歆，茍歆之必有悔。所以知神龍見，喪風雲之象也；鳳凰來，失尊戴之象也；麒麟出，亡國土之象也。觀我之義，禽必不義也；以彼為祥，禽必不祥也。</p><p><strong>所出</strong>：《化書 · 卷四》 — https://zh.wikisource.org/wiki/化書/卷四</p></article></main></div></div>
