    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 物至而能神應</nav></header><main><article><h1>物至而能神應</h1><p>物之感觸，則神應之而智動。</p><p>物至而能神應，知之動也。物之感觸於外，心神即時回應，此聖人虛靜之驗也。外物之來，不待思慮而自知，其樞機在於精神虛明、無所窒礙。達道之人，心若明鏡，物來則照，物去不留，故能動靜不失其時，感應無有過差。</p><p><strong>所出</strong>：《淮南子 · 原道訓》 — https://zh.wikisource.org/wiki/淮南子/原道訓</p></article></main></div></div>
