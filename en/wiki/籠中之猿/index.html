    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 籠中之猿</nav></header><main><article><h1>籠中之猿</h1><p>機變萬端不能出大人之道，蓋道大無外，無日不怨、無人不欺，萬物知其所歸。</p><p>籠中之猿，踴躍萬變不能出於籠；匣中之虎，狂怒萬變不能出於匣；小人之機，智慮萬變不能出於大人之道。夫大人之道，如地之負，如天之垂。無日不怨，無人不欺，怨不我怒，欺不我夷，然後萬物知其所歸。</p><p><strong>所出</strong>：《化書 · 卷三》 — https://zh.wikisource.org/wiki/化書/卷三</p></article></main></div></div>
