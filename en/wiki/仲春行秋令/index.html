    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 仲春行秋令</nav></header><main><article><h1>仲春行秋令</h1><p>仲春行秋令則大水寒氣揔至，行冬令則陽氣不勝，行夏令則大旱蟲螟。</p><p>仲春行秋令，則其國大水，寒氣揔至，寇戎來征。行冬令，則陽氣不勝，麥乃不熟，民多相掠。行夏令，則國乃大旱，煖氣早來，蟲螟為害。</p><p><strong>所出</strong>：《禮記 · 月令》 — https://zh.wikisource.org/wiki/禮記/月令</p></article></main></div></div>
