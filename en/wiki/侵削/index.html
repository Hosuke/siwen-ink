    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 侵削</nav></header><main><article><h1>侵削</h1><p>地四削而入諸侯則破，離本國徙都邑則亡。</p><p>法虛立而害疏遠，令一布而不聽者存，賤爵祿而毋功者富，則衆必輕令而上位危。良田不在戰士，三年而兵弱；賞罰不信，五年而破；上賣官爵，十年而亡；倍人倫而禽獸行，十年而滅。戰不勝，弱也；地四削，入諸侯，破也；離本國，徙都邑，亡也；有者異姓，滅也。</p><p><strong>所出</strong>：《管子 · 第13篇八觀》 — https://zh.wikisource.org/wiki/管子/第13篇八觀
===終::</p></article></main></div></div>
