    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 直方大</nav></header><main><article><h1>直方大</h1><p></p><p>坤六二曰：「直方大，不習无不利。」</p><p>  坤象曰：「六二之動，直以方也。不習无不利，地道光也。」</p><p>  坤文言申之曰：「直其正也，方其義也。君子敬以直內，義以方外，敬義立而德不孤。『直方大，不習无不利。』則不疑其所行也。」</p><p>  言地道之直者，正也；方者，義也。君子以敬直內，以義方外，敬義並立則德不孤。不習而无不利者，地道光也。</p><p>  <strong>所出</strong>：《周易 · 坤》 — https://zh.wikisource.org/wiki/周易/坤</p></article></main></div></div>
