    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 桀土</nav></header><main><article><h1>桀土</h1><p>五桀之土甚鹹以苦，其物為下，其種白稻長狹，蓄殖果木效最劣。</p><p>夫桀土者，下土之至也。五桀之狀，甚鹹以苦，其物為下。種白稻長狹，蓄殖果木，不如三土以十分之七。</p><p>桀土之病，水味既苦，土壤又鹹，萬物不生。雖稻之種，亦僅得白稻長狹者，禾稼之形已陋，而味之甘美可知其減矣。果木之蓄殖，效益不及上土十分之三。此九州之土所終，下等之中最下者。聖人度地，不廢此土，以其可以種稻，亦因時之利焉。</p><p><strong>所出</strong>：《管子 · 第58篇地員》 — https://zh.wikisource.org/wiki/管子/第58篇地員</p></article></main></div></div>
