    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 君子閔之也</nav></header><main><article><h1>君子閔之也</h1><p>楚滅江黃，桓公不能救，君子閔之。</p><p>楚人滅黃。貫之盟，管仲曰：「江、黃遠齊而近楚，楚為利之國也。若伐而不能救，則無以宗諸侯矣！」桓公不聽，遂與之盟。管仲死，楚伐江、滅黃，桓公不能救。故君子閔之也。</p><p>《穀梁》以管仲之智先見江黃必亡，而桓公不能用，既盟而不能救，是有闕也。[[得道多助]]者，必能救其同盟之國；不能救者，是德衰之兆也。君子閔之，言可惜也。</p><p><strong>所出</strong>：《春秋穀梁傳 · 僖公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/僖公</p></article></main></div></div>
