    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 化為一心</nav></header><main><article><h1>化為一心</h1><p>魯國之化，撟而為一心，曾無與二。</p><p>魯昭公問莫三人而迷，晏子對以「撟魯國化而為一心，曾無與二，其何暇有三」。三人之疑，起於議論不一；化為一心，則令出於一，無所用疑。</p><p>夫左右逼邇皆同於君之心者，距本朝之勢，國之所以殆也。讒諛塞善，行之所以衰也。士者持祿，遊者養交，身之所以危也。是故古之聖王明君，用人以善，外知事情，內得心誠，是以不迷也。</p><p><strong>所出</strong>：《晏子春秋 · 卷四》 — https://zh.wikisource.org/wiki/晏子春秋/卷四</p></article></main></div></div>
