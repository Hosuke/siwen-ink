    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 言意相離</nav></header><main><article><h1>言意相離</h1><p>言以表意，若言意相離，則亂國之俗，賢主猶惑。</p><p>言者，以諭意也。言意相離，凶也。亂國之俗，甚多流言，而不顧其實，務以相毀，務以相譽，毀譽成黨，眾口熏天，賢不肖不分，以此治國，賢主猶惑之也，又況乎不肖者乎？夫辭者，意之表也。鑒其表而棄其意，悖。故古之人，得其意則舍其言矣。[[言不可以不察]]，[[聽言者以言觀意]]，皆防此弊也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十八》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十八</p></article></main></div></div>
