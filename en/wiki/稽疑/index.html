    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 稽疑</nav></header><main><article><h1>稽疑</h1><p>卜筮以決疑，行事先從龜筮，次及卿士、庶民。</p><p>稽疑者，擇建立卜筮人。乃命卜筮，曰雨，曰濟，曰涕，曰霧，曰克，曰貞，曰悔，凡七。卜五，占之用二，衍貣。三人占則從二人之言。女有大疑，謀及女心，謀及卿士，謀及庶人，謀及卜筮。若龜從，筮從，卿士從，庶民從，是之謂大同，而身其康彊，子孫其逢吉。此[[洪範九疇]]之七，言決疑之道也。</p><p><strong>所出</strong>：《史記·卷038》 — https://zh.wikisource.org/wiki/史記/卷038</p></article></main></div></div>
