    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 道無所不在</nav></header><main><article><h1>道無所不在</h1><p>道充盈宇宙，萬物皆在其間。</p><p>天地有大美而不言，四時有明法而不議，萬物有成理而不說。道原天地之美，達萬物之理，无所不在。九竅者胎生，八竅者卵生，其來无跡，其往无崖，无門无房，四達之皇皇。天不得不高，地不得不廣，日月不得不行，萬物不得不昌，此皆道之流行也。</p><p>道在糞溺，在瓦甓，在稊稗，在螻蟻。周徧咸三者，異名同實，其指一也。</p><p><strong>所出</strong>：《莊子 · 知北遊》 — https://zh.wikisource.org/wiki/莊子/知北遊</p></article></main></div></div>
