    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 老楓</nav></header><main><article><h1>老楓</h1><p>萬物皆有情性精魄，虛無所不至，萬物一物，萬神一神。</p><p>老楓化為羽人，朽麥化為蝴蝶，自無情而之有情也。賢女化為貞石，山蚯化為百合，自有情而之無情也。是故土木金石，皆有情性精魄。虛無所不至，神無所不通，氣無所不同，形無所不類。孰為彼，孰為我？孰為有識，孰為無識？萬物，一物也；萬神，一神也，斯道之至矣。</p><p><strong>所出</strong>：《化書 · 卷一》 — https://zh.wikisource.org/wiki/化書/卷一</p></article></main></div></div>
