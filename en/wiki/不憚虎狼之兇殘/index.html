    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 不憚虎狼之兇殘</nav></header><main><article><h1>不憚虎狼之兇殘</h1><p>持誦《黃庭》，則千灾消除，百病痊愈，虎狼之害不能加。</p><p>修煉《黃庭》，詠之萬遍，則千灾以消，百病以痊，即虎狼之兇殘，亦無所憚。蓋道炁充盈，邪不能犯，延年卻老，其效驗如此。</p><p><strong>所出</strong>：《黃庭內景經 · 上清章第一》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/上清章第一</p></article></main></div></div>
