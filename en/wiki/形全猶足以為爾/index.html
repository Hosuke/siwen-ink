    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 形全猶足以為爾</nav></header><main><article><h1>形全猶足以為爾</h1><p>形骸完具，不足貴也；全德之人，愈可貴焉。</p><p>仲尼論哀駘它曰：「為天子之諸御，不爪翦，不穿耳，取妻者止於外，不得復使。形全猶足以為爾，而況全德之人乎！」言形骸完具，不過如此；全德之人，其可貴遠過之矣。</p><p><strong>所出</strong>：《莊子 · 德充符》 — https://zh.wikisource.org/wiki/莊子/德充符</p></article></main></div></div>
