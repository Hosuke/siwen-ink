    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 黃裏正道</nav></header><main><article><h1>黃裏正道</h1><p>裏用黃而衣用綠，尊卑之序不可紊也。</p><p>黃裏者，裳在上而裏在內，黃為正色，應居於內也。今詩言「綠衣黃裏」「綠衣黃裳」，是裏與裳皆失其正位。夫上衣下裳，黃裏者以裏為黃，黃裳者以裳為黃，皆正色也。然正色居下，間色居上，是尊卑倒置、陰陽失常之象。[[心之憂矣|詩人之憂]]，憂此也。妾以綠衣而居上位，夫人以黃裳而居下位，[[俾無訧|俾無訧]]者，欲正其失也；[[我思古人]]者，思先王之禮所以定尊卑、正名分也。</p><p><strong>所出</strong>：《詩經 · 綠衣》 — https://zh.wikisource.org/wiki/詩經/綠衣</p></article></main></div></div>
