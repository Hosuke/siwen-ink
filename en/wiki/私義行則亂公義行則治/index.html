    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 私義行則亂公義行則治</nav></header><main><article><h1>私義行則亂公義行則治</h1><p>私義行則亂，公義行則治；明主使人臣去私心行公義。</p><p>明主之道，必明於公私之分。令必行，禁必止，人主之公義也；必行其私，信於朋友，不可為賞勸，不可為罰沮，人臣之私義也。私義行則亂，公義行則治，故公私有分。</p><p>人臣有私心，有公義。脩身潔白而行公行正，居官無私，人臣之公義也；汙行從欲，安身利家，人臣之私心也。</p><p>明主在上，則人臣去私心行公義；亂主在上，則人臣去公義行私心。</p><p><strong>所出</strong>：《韓非子 · 飾邪》 — https://zh.wikisource.org/wiki/韓非子/飾邪</p></article></main></div></div>
