    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 天命不又</nav></header><main><article><h1>天命不又</h1><p>天命已去，不可再得。</p><p>天命不又，言天命之去，不可復還也。《小宛》之詩，戒人各敬爾儀，若肆志妄行，則天命不留，終將失所。猶今言福祿一去不返。此亦見古人之天命觀：福緣善慶，殃由自作，敬慎者蒙福，悖慢者罹殃，理之常也。</p><p><strong>所出</strong>：《詩經 · 小宛》 — https://zh.wikisource.org/wiki/詩經/小宛</p></article></main></div></div>
