    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 五真散靈呪</nav></header><main><article><h1>五真散靈呪</h1><p>誦此呪者，萬神並唱，熙怡我身。</p><p>此呪為脾中五真章存思時所誦，云：「五真散靈，炁布九玄，金光曜暉，玉炁吐津，萬神並唱，熙怡我身，圓光奏命籍，太一勒九天，降志八景輿，策龍駕紫烟，混合三帝室，保我萬劫年。」誦時默念五真之名，意想土星入絳宮，是[[上清大洞真經]]存想煉形之要呪也。</p><p><strong>所出</strong>：《上清大洞真經 · 15章》 — https://zh.wikisource.org/wiki/上清大洞真經/15章</p></article></main></div></div>
