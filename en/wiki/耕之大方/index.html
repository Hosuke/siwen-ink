    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 耕之大方</nav></header><main><article><h1>耕之大方</h1><p>述耕耘之五法。</p><p>后稷曰：子能以窐為突乎？子能藏其惡而揖之以陰乎？子能使吾士靖而甽浴土乎？子能使保溼安地而處乎？子能使雚夷毋淫乎？子能使子之野盡為泠風乎？子能使槁數節而莖堅乎？子能使穗大而堅、均乎？子能使粟圜而薄糠乎？子能使米多沃而食之彊乎？無之若何？</p><p>凡耕之大方：力者欲柔，柔者欲力。息者欲勞，勞者欲息。棘者欲肥，肥者欲棘。急者欲緩，緩者欲急。溼者欲燥，燥者欲溼。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十六》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十六</p></article></main></div></div>
