    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 會於北杏</nav></header><main><article><h1>會於北杏</h1><p>齊桓始伯，會諸侯于北杏，以平宋亂，遂人不至。</p><p>十三年春，會於北杏，以平宋亂。遂人不至。夏，齊人滅遂而戍之。冬，盟于柯，始及齊平也。宋人背北杏之會。</p><p><strong>所出</strong>：《春秋左氏傳 · 莊公》 — https://zh.wikisource.org/wiki/春秋左氏傳/莊公</p></article></main></div></div>
