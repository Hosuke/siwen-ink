    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 吾黨小子狂簡</nav></header><main><article><h1>吾黨小子狂簡</h1><p>孔子言弟子狂進取不忘初心。</p><p>是日，孔子曰：「歸乎歸乎！吾黨之小子狂簡，斐然成章，吾不知所以裁之。」子貢知孔子思歸，送冉求，因誡曰「即用，以孔子為招」云。此孔子言弟子之狀況也。</p><p><strong>所出</strong>：《史記 · 卷047》 — https://zh.wikisource.org/wiki/史記/卷047</p></article></main></div></div>
