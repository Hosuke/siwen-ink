    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 為王留行</nav></header><main><article><h1>為王留行</h1><p>賢者去就，以道為準，不受人留難。</p><p>孟子去齊，宿於晝。有欲為王留行者，坐而言。不應，隱几而臥。</p><p>孟子辭齊而去，有欲為王挽留者，端坐而言，冀以道義動之。孟子不應，隱几而臥，漠然不以為意。蓋君子之去就，定於其心，非人之所能留也。昔者魯繆公無人在子思之側，則不能安子思；洩柳、申詳無人在繆公之側，則不能安其身。賢者之去就，在乎上之能否禮賢，不在乎下之挽留也。客之留行，孟子之臥，几之間，而道之從違判焉。</p><p><strong>所出</strong>：《孟子 · 公孫丑下》 — https://zh.wikisource.org/wiki/孟子/公孫丑下</p></article></main></div></div>
