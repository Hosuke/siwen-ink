    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 外其身而身存</nav></header><main><article><h1>外其身而身存</h1><p>外身而存，身忘而存</p><p>外其身而身存，聖人忘己而無身於物累，是以身反而存。夫外身者，非遺棄其身也，無私累於中，則利害不能加之，故身存而長久。</p><p><strong>所出</strong>：《老子河上公章句 · 韜光》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p><hr><p>聖人視其身如寄旅，不私惜之；置之度外，無所縈懷。而民共保之，身反得全存。[[後其身而身先]]言其名，此言其實，義相足也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 七章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
