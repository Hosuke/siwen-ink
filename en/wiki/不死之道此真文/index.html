    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 不死之道此真文</nav></header><main><article><h1>不死之道此真文</h1><p>太上微言可致神仙，而不死之道即此黃庭沐浴之真文。</p><p>不死之道此真文者，黃庭沐浴之章，真仙之要道也。經云「太上微言致神僊，不死之道此真文」，言太上道祖之微言妙語，可以致神僊、長生不死，而其道即在此黃庭內景之經、沐浴之章。學者傳授有儀，盟誓有信，告於三官，勿令七祖受冥患，則道成德備，神僊可致矣。</p><p><strong>所出</strong>：《黃庭內景經 · 沐浴章第三十六》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/沐浴章第三十六</p></article></main></div></div>
