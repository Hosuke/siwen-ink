    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 天道虧盈而益謙</nav></header><main><article><h1>天道虧盈而益謙</h1><p>天道、地道、鬼神、人道，皆損盈益謙。</p><p>謙尊而光，卑而不可逾。天道虧盈而益謙，地道變盈而流謙，鬼神害盈而福謙，人道惡盈而好謙。謙之一卦，六爻皆吉，盈滿之不可恃也。
<strong>所出</strong>：《周易註 (王弼) · 卷02》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷02</p></article></main></div></div>
