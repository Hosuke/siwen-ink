    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 蓋亦勿思</nav></header><main><article><h1>蓋亦勿思</h1><p>賢者知音稀遂不復念歸</p><p>「心之憂矣，其誰知之？其誰知之？蓋亦勿思。」</p><p>賢者之心憂，既無可告語，又無有知者，則姑以「勿思」自遣。言「蓋亦」者，姑且如此之意，非真能忘也。蓋賢者不幸而生茲季世，無如之何，故托此辭以自寬耳。亦見其欲忘而不能忘，欲解而無由解，憂之至也。</p><p><strong>所出</strong>：《詩經 · 園有桃》 — https://zh.wikisource.org/wiki/詩經/園有桃</p></article></main></div></div>
