    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 不召而自來</nav></header><main><article><h1>不召而自來</h1><p>天道感化，不待呼召，物自來至。</p><p>不召而自來。</p><p>此承上文「不言而善應」而言。天道感化萬物，無待呼召，物自賓服而至。人之有為，必以賞罰驅使；天道自然，萬物歸之如流。此亦[[天之道不單而善朕]]之義也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第三十八章 天網》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
