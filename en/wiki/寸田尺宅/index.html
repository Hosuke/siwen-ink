    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 寸田尺宅</nav></header><main><article><h1>寸田尺宅</h1><p>面部方寸之心及兩目尺宅，修之可治生。</p><p>寸田者，心也，在面之方寸；尺宅者，目也，在面之二尺之地。[[尺宅]]之說久已有之，此兼寸田而言之。保心守目，吸氣吞津，則可以治生長生。</p><p><strong>所出</strong>：《黃庭內景經 · 瓊室章第二十一》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/瓊室章第二十一</p></article></main></div></div>
