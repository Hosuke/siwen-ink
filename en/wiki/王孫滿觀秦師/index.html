    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 王孫滿觀秦師</nav></header><main><article><h1>王孫滿觀秦師</h1><p>王孫滿以師輕而驕，斷秦師必有謫，及秦師還，果敗於殽。</p><p>二十四年，秦師將襲鄭，過周北門。左右皆免胄而下拜，超乘者三百乘。王孫滿觀之，言於王曰：秦師必有謫。王曰：何故？對曰：師輕而驕，輕則寡謀，驕則無禮。無禮則脫，寡謀自陷。入險而脫，能無敗乎？秦師無謫，是道廢也。是行也，秦師還，晉人敗諸殽，獲其三帥丙、術、視。</p><p><strong>所出</strong>：《國語 · 卷02》 — https://zh.wikisource.org/wiki/國語/卷02</p></article></main></div></div>
