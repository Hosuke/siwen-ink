    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 正靜筋肕骨強</nav></header><main><article><h1>正靜筋肕骨強</h1><p>人能正靜，則筋骨強固，可戴大圓、體大方。</p><p>人能正靜者，筋肕而骨強。能戴大圓者，體乎大方。正靜不失，日新其德，昭知天下，通於四極。</p><p>正者，不偏不倚也；靜者，不動不搖也。夫人心能正且靜，則形骸之筋自肕，血氣之骨自強，如是而後可以戴天之圓、體地之方，而與天地相參矣。</p><p>且也正靜之功，日日新之又新，其德充積以至於光大，則其明昭昭，可以知天下之理，通於四極之遠，而無所窒礙也。</p><p><strong>所出</strong>：《管子 · 第37篇心術下》 — https://zh.wikisource.org/wiki/管子/第37篇心術下</p></article></main></div></div>
