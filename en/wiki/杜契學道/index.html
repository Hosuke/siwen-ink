    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 杜契學道</nav></header><main><article><h1>杜契學道</h1><p>記杜契師介瑛、受玄白術、居茅山之事。</p><p>杜契，字廣平，京兆杜陵人也。漢靈帝建安初，渡江依孫策，後孫權用為信校尉。黃武二年，契學道，師介瑛，受玄白術，居茅山之束。久之，能隱形遁邇。時與弟子採伐，貨易衣糧，而人不能知之。數入洞中，得仙。</p><p>《真誥》雲：有弟子二人：一人孫貴，孫女寒華也；一人陳世京。世京孫休，時作侍郎。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 15》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/15</p></article></main></div></div>
