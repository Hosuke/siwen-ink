    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 玉在山而草木潤</nav></header><main><article><h1>玉在山而草木潤</h1><p>賢者在位，其德澤被於物；猶玉在山而生草木之潤。</p><p>故聲無小而不聞，行無隱而不形；玉在山而草木潤，淵生珠而崖不枯。為善不積邪，安有不聞者乎？</p><p><strong>所出</strong>：《荀子 · 勸學篇》 — https://zh.wikisource.org/wiki/荀子/勸學篇</p></article></main></div></div>
