    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 豎刀自宮</nav></header><main><article><h1>豎刀自宮</h1><p></p><p>豎刀自宮以適君，非人情，管仲以為難親。桓公不能用其言，卒近用之，致有三子專權之禍。此自宮以媚君者，戒後世之不可以人形事上也。</p><p>  <strong>所出</strong>：《史記 · 卷032》 — https://zh.wikisource.org/wiki/史記/卷032</p></article></main></div></div>
