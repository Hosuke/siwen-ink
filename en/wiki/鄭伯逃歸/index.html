    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 鄭伯逃歸</nav></header><main><article><h1>鄭伯逃歸</h1><p>鄭伯逃首止之盟，不從王命。</p><p>會于首止，會王世子鄭，謀寧周也。秋，諸侯盟。王使周公召鄭伯曰：「吾撫女以從楚，輔之以晉，可以少安。」鄭伯喜於王命，而懼其不朝於齊也，故逃歸不盟。孔叔止之曰：「國君不可以輕，輕則失親；失親，患必至。病而乞盟，所喪多矣！君必悔之。」弗聽，逃其師而歸。夫鄭伯始欲親楚以媚周，終以利而叛盟，其失在于二三其德也。</p><p><strong>所出</strong>：《春秋左氏傳 · 僖公》 — https://zh.wikisource.org/wiki/春秋左氏傳/僖公</p></article></main></div></div>
