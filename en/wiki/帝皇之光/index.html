    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 帝皇之光</nav></header><main><article><h1>帝皇之光</h1><p>帝皇之炁化成之光，上充泥丸、散骨節者。</p><p>帝皇之光，上清大洞所載一身之至寶也。兆存思[[二真堅玉君]]，使中元之炁常滿，帝皇之光乃得上充泥丸，敷散骨節。其光鬱鬱，與三元九氣相參，得之則[[上睹三元]]，三元既睹，則身神通泰，死炁永滅。</p><p><strong>所出</strong>：《上清大洞真經 · 18章》 — https://zh.wikisource.org/wiki/上清大洞真經/18章</p></article></main></div></div>
