    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 牛羊腓字</nav></header><main><article><h1>牛羊腓字</h1><p>后稷被棄，牛羊庇護，愛之以翼。</p><p>姜嫄生子，以為不祥，-{棄}-之隘巷。牛羊來往，皆以足庇覆，而不忍踐踏；以乳字之，而不加毀傷。詩備述之，以見-{后}-稷稟天地之靈異，故-{後}-之-{後}-稷配天享祀，非偶然也。</p><p><strong>所出</strong>：《詩經 · 生民》 — https://zh.wikisource.org/wiki/詩經/生民</p></article></main></div></div>
