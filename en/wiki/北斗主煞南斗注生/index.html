    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 北斗主煞南斗注生</nav></header><main><article><h1>北斗主煞南斗注生</h1><p>述北斗主死、南斗注生之理。</p><p>北斗主煞，南斗注生，煞是天綱，生是三台，自如人身，上應天地，法之日月，道在不遠，三五來返。蓋北斗主殺罰之權，南斗司生成之柄，知此理者可以養生，亦可以知命。</p><p><strong>所出</strong>：《女青鬼律 · 卷1》 — https://zh.wikisource.org/wiki/女青鬼律/卷1</p></article></main></div></div>
