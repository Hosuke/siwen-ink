    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 明天順皇帝</nav></header><main><article><h1>明天順皇帝</h1><p>明天順皇帝，封張三丰為通微顯化真人。</p><p>明天順皇帝者，明英宗复位後之年號也。英宗被虜於漠北，景泰帝立。已而英宗歸，居南宮。景泰十七年，帝崩，無嗣。石亨、徐有貞等迎英宗复位，改元天順。</p><p>是時，有道士張三丰者，行蹤莫測，神化無方。隱顯之間，人不能測。英宗聞其名，遣使物色不得。乃下誥封之，贈號[[通微顯化真人]]。</p><p><strong>所出</strong>：《張三丰先生全集 · 卷1》 — https://zh.wikisource.org/wiki/張三丰先生全集/卷1</p></article></main></div></div>
