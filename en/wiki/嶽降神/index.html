    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 嶽降神</nav></header><main><article><h1>嶽降神</h1><p>山嶽降靈，生甫及申，為周藩翰。</p><p>維四嶽之高大，峻極於天。山嶽降其神靈而生甫國、申國之君。甫與申皆為姜姓諸侯，世為周室之輔弼。 [[甫侯作修刑辟]] ，申伯亦秉忠貞，以 [[文武吉甫]] 之才，式是南邦，藩屏周室。詩云「維嶽降神，生甫及申」，言神靈萃於山嶽，誕降英賢，以輔周室。</p><p><strong>所出</strong>：《詩經 · 崧高》 — https://zh.wikisource.org/wiki/詩經/崧高</p></article></main></div></div>
