    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 大者宜為下</nav></header><main><article><h1>大者宜為下</h1><p>大國謙下，各得其所欲</p><p>夫兩者各得其所欲，大者宜為下。</p><p>兩者，大國與小國也。各得其所欲者，小國欲入事人，大國欲兼畜人，皆如願也。然終言之，大者宜為下。大國不自矜其大，能下其民、下其鄰，則天下莫能與之争。此[[夫唯不爭故莫能與之争]]之義也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 六十一章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
