    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 水火相感神志俱悲</nav></header><main><article><h1>水火相感神志俱悲</h1><p>水之精為志，火之精為神，水火相感，則神志俱悲，目之水生焉。</p><p>帝云：</p><p>夫水之精為志，火之精為神，水火相感，神志俱悲，是以目之水生也。</p><p>諺言曰：心悲名曰志悲，志與心精共湊於目也。是以俱悲則神氣傳於心，精上不傳於志，而志獨悲，故泣出也。</p><p>夫涕之與泣者，譬如人之兄弟，急則俱死，生則俱生，其志以早悲，是以涕泣俱出而橫行也。</p><p>此水火相感、神志相動之理，為泣下之本也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第二十四卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第二十四卷</p></article></main></div></div>
