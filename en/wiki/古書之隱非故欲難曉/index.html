    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 古書之隱非故欲難曉</nav></header><main><article><h1>古書之隱非故欲難曉</h1><p>古人著書未必故作隱晦，後世難知者，時異語變、簡編朽絕故也。</p><p>抱朴子答客難曰：古書之多隱，未必昔人故欲難曉。蓋世異語變，或方言不同；經荒歷亂，埋藏積久；簡編朽絕，亡失者多；或雜續殘缺，或脫去章句。是以難知，似若至深耳。實非作者之本意也。</p><p><strong>所出</strong>：《抱朴子 · 卷30》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷30</p></article></main></div></div>
