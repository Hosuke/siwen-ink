    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 矛楯之說</nav></header><main><article><h1>矛楯之說</h1><p>賢不可禁而勢無不禁，以不可禁之賢加無不禁之勢，此賢勢不相容如矛楯也。</p><p>人有鬻矛與楯者，譽其楯之堅曰「物莫能陷」，俄而又譽其矛曰「吾矛之利，物無不陷」。人應之曰：「以子之矛，陷子之楯，何如？」其人弗能應。</p><p>夫賢之為道不可禁，而勢之為道也無不禁。以不可禁之賢，與無不禁之勢，此矛楯之說也。夫賢勢之不相容亦明矣。</p><p>然則[[千世治而一亂]]之說，正所以解此矛楯之困——勢之無不禁，非必有賴於禁賢也。</p><p><strong>所出</strong>：《韓非子 · 難勢》 — https://zh.wikisource.org/wiki/韓非子/難勢</p></article></main></div></div>
