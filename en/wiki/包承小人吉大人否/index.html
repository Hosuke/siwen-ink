    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 包承小人吉大人否</nav></header><main><article><h1>包承小人吉大人否</h1><p>小人得志則吉，君子守正則否</p><p>六二，包承，小人吉，大人否。亨。</p><p>小人包承受容，得志而吉；大人守正，不為小人之所容，否塞不通。然守正者終得亨通，是非倒置之時，君子當以亨道自處也。</p><p><strong>所出</strong>：《周易 · 否》 — https://zh.wikisource.org/wiki/周易/否</p></article></main></div></div>
