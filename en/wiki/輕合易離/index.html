    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 輕合易離</nav></header><main><article><h1>輕合易離</h1><p>友之始合若形影，久則或變為怨讎，戒在輕易而不慎。</p><p>《抱朴子》言交友之患，在輕合而不重離，易厚而不難薄，始如形影，終為參辰，至歡變為篤恨，接援化成讎敵。蓋人之情好惡各異，操尚不同，猶金沈羽浮，誌好之乖次，猶火升而水降。苟不可同，雖造化之靈、大塊之匠，不可使同也，何可強乎！輕易結合，不知所择，及其情變，悔無及矣。</p><p><strong>所出</strong>：《抱朴子 · 卷16》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷16</p></article></main></div></div>
