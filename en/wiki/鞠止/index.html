    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 鞠止</nav></header><main><article><h1>鞠止</h1><p>言事物既已如此則當止，不可過度以致於極</p><p>《南山》每章卒章皆有「止」字，曰「曷又懷止」「曷又從止」「曷又鞠止」「曷又極止」，皆以既已歸止、庸止、告止、得止為前提，而詰問何以復犯。鞠者，窮也；極者，至也。言事物各有其節，既已得之，則當知止；若縱而不已，至於窮極，必有悔吝。《詩》教人知止，與《易》之「亢龍有悔」義相發明。</p><p><strong>所出</strong>：《詩經 · 南山》 — https://zh.wikisource.org/wiki/詩經/南山</p></article></main></div></div>
