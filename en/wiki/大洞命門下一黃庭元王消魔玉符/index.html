    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 大洞命門下一黃庭元王消魔玉符</nav></header><main><article><h1>大洞命門下一黃庭元王消魔玉符</h1><p>黃書白繒佩之可消魔之神符</p><p>大洞命門下一黃庭元王消魔玉符，乃第十章所傳神符。當黃書白繒佩之，存呼元王內諱「始明精」，可鎮兩胯之間，內華朗耀，百神凝精，反色嬰童，翻然超升。叩齒九通，咽液三過。</p><p><strong>所出</strong>：《上清大洞真經 · 10章》 — https://zh.wikisource.org/wiki/上清大洞真經/10章</p></article></main></div></div>
