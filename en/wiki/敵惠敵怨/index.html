    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 敵惠敵怨</nav></header><main><article><h1>敵惠敵怨</h1><p>臾駢送賈季之帑，不以私憾害公義，援古語以明忠之道。</p><p>冬十月，襄仲如晉。葬襄公。十一月，丙寅，晉殺續簡伯。賈季奔狄。宣子使臾駢送其帑。夷之蒐，賈季戮臾駢。臾駢之人，欲盡殺賈氏以報焉。臾駢曰：「不可。吾聞前志有之曰：『敵惠敵怨，不在後嗣，忠之道也。』」</p><p><strong>所出</strong>：《春秋左氏傳 · 文公》 — https://zh.wikisource.org/wiki/春秋左氏傳/文公</p></article></main></div></div>
