    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 為而不恃</nav></header><main><article><h1>為而不恃</h1><p>聖人有為而不自恃其功。</p><p>《河上公章句》解[[聖人為而不恃]]，言「[[聖人]]為德施，不恃其報」；解[[功成而不處]]，言「功成事就，不處其位」。解[[其不欲見賢]]，言「[[聖人]]不欲使人知己之賢，匿功不居榮，畏天損有餘」。是[[為而不恃]]、功成弗居、不欲見賢，三者一貫，乃[[上德無為]]之全德也。</p><p><strong>所出</strong>：《老子河上公章句 · 天道》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
