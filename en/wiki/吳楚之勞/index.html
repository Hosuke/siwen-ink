    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 吳楚之勞</nav></header><main><article><h1>吳楚之勞</h1><p>從代來有功及吳楚征伐之勳。</p><p>孝惠訖孝景間，追封高祖時遣功臣，及從代來者，又有吳楚之役效力之人，皆得列土封侯。[[吳楚七國兵起]]之事，[[魏其侯]]竇嬰以大將軍屯滎陽扞吳楚，侯三千三百五十戶；[[建陵侯]]衛綰以將軍擊吳楚，用中尉侯。皆所謂吳楚之勞者也。</p><p><strong>所出</strong>：《史記 · 惠景閒矦者年表》 — https://zh.wikisource.org/wiki/史記/惠景閒矦者年表</p></article></main></div></div>
