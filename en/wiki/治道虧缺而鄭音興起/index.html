    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 治道虧缺而鄭音興起</nav></header><main><article><h1>治道虧缺而鄭音興起</h1><p>治道衰而鄭衛之音興，仲尼不能正，陵遲至六國，卒於喪身滅宗。</p><p>治道虧缺而鄭音興起，封君世辟，名顯鄰州，爭以相高。自仲尼不能與齊優遂容於魯，雖退正樂以誘世，作五章以剌時，猶莫之化。陵遲以至六國，流沔沈佚，遂往不返，卒於喪身滅宗，并國於秦。</p><p><strong>所出</strong>：《史記 · 卷024》 — https://zh.wikisource.org/wiki/史記/卷024</p></article></main></div></div>
