    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 多將熇熇</nav></header><main><article><h1>多將熇熇</h1><p>惡不可積，積則不可救治</p><p>詩云「匪我言耄，爾用憂謔。多將熇熇，不可救藥」，言小人之惡，滋長而不已，熇熇然如火之熾，不可撲滅，無藥可治。</p><p>蓋[[為道者病於方成]]之理，亦此意也。善不行，惡日積，如[[溜之大堤]]，一決而不可收拾。故治亂之機，在乎早辨[[善與惡之分]]，不可養癰遺患也。</p><p><strong>所出</strong>：《詩經 · 板》 — https://zh.wikisource.org/wiki/詩經/板</p></article></main></div></div>
