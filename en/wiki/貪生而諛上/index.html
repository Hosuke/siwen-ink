    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 貪生而諛上</nav></header><main><article><h1>貪生而諛上</h1><p>言辭近世恭順，無犯顏之直，人以為怯於死而諂媚其上也。</p><p>言而近世，辭不悖逆，則見以為貪生而諛上。</p><p><strong>所出</strong>：《韓非子 · 難言》 — https://zh.wikisource.org/wiki/韓非子/難言</p></article></main></div></div>
