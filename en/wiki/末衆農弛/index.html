    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 末衆農弛</nav></header><main><article><h1>末衆農弛</h1><p>商賈之民日多，農事之日弛，姦邪必勝，國必削弱。</p><p>韓非以商賈為末業，以農業為本務。云「物多末衆，農弛姦勝，則國必削」。末衆者，商賈工匠之民多是也；農弛者，耕織之事廢弛是也。姦勝者，姦邪之人得志是也。商賈之民既衆，則趨利者多而務本者寡，姦邪乘間而起，國未有能久安者。此韓非重農抑末之論也。</p><p><strong>所出</strong>：《韓非子 · 飭令》 — https://zh.wikisource.org/wiki/韓非子/飭令</p></article></main></div></div>
