    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 表六國時事</nav></header><main><article><h1>表六國時事</h1><p>太史公因秦記，踵《春秋》之後，表六國之事，著興壞之端。</p><p>余於是因秦記，踵春秋之後，起周元王，表六國時事，訖二世，凡二百七十年，著諸所聞興壞之端。後有君子，以覽觀焉。</p><p><strong>所出</strong>：《史記 · 卷015》 — https://zh.wikisource.org/wiki/史記/卷015</p></article></main></div></div>
