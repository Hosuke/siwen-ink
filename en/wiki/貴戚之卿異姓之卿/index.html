    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 貴戚之卿與異姓之卿</nav></header><main><article><h1>貴戚之卿與異姓之卿</h1><p>孟子論卿有二等，貴戚易位，異姓則去，其義各異。</p><p>齊宣王問卿，孟子對以有二等：有[[貴戚之卿]]，有[[異姓之卿]]。貴戚之卿，君有大過則諫，反覆之而不聽，則易位；異姓之卿，君有過則諫，反覆之而不聽，則去。貴戚之卿，以同姓之恩義，肩負變置之責；異姓之卿，以道義合者，故可以去。此[[堯舜禹湯文武之道]]所以異於[[篡弒]]者也。</p><p><strong>所出</strong>：《孟子 · 萬章下》 — https://zh.wikisource.org/wiki/孟子/萬章下</p></article></main></div></div>
