    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 華過韻緩則化而賦</nav></header><main><article><h1>華過韻緩則化而賦</h1><p>弔文若華辭過甚、韻律過緩，則失其本質，淪為賦體。</p><p>夫弔雖古義，而華辭末造；華過韻緩，則化而為賦。固宜正義以繩理，昭德而塞違，割析褒貶，哀而有正，則無奪倫矣。</p><p><strong>所出</strong>：《文心雕龍 · 哀弔》 — https://zh.wikisource.org/wiki/文心雕龍/哀弔</p></article></main></div></div>
