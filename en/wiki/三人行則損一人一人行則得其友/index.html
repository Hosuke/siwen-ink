    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 三人行則損一人一人行則得其友</nav></header><main><article><h1>三人行則損一人一人行則得其友</h1><p>同道者三則相損，專一者得友。</p><p>六三曰：「三人行，則損一人；一人行，則得其友。」《象》曰：「一人行，三則疑也。」夫同道之人既多，則疑忌以生，而損耗隨之；若一人獨行，專心致志，反而得同志之友。《易》言此理，以見損之道貴乎專一，中道而行，不偏不倚，則無過分之損，亦無不足之患。</p><p><strong>所出</strong>：《周易 · 損》 — https://zh.wikisource.org/wiki/周易/損</p></article></main></div></div>
