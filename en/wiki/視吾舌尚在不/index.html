    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 視吾舌尚在不</nav></header><main><article><h1>視吾舌尚在不</h1><p>身遭困辱而志不撓，以舌在則身存，展縱橫之志。</p><p>張儀嘗從楚相飲，楚相亡璧，門下意儀，共執掠笞數百。儀妻曰：「嘻！子毋讀書游說，安得此辱乎？」儀謂其妻曰：「視吾舌尚在不？」其妻笑曰：「舌在也。」儀曰：「足矣。」</p><p>儀以笞辱非辱，身在舌存，縱橫之術猶可施。故古云：士遇困厄，不以簞瓢為賤，唯恐志之不伸也。</p><p><strong>所出</strong>：《史記 · 卷070》 — https://zh.wikisource.org/wiki/史記/卷070</p></article></main></div></div>
