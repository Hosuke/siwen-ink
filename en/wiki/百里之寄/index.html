    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 百里之寄</nav></header><main><article><h1>百里之寄</h1><p>縣令責任至重，當先於臺省之官</p><p>抱朴子曰：三臺九列，坐而論道；州牧郡守，操綱舉領。其官益大，其事愈優，煩劇所鍾，其唯百里。眾役於是乎出，誅求之所叢赴，牧守雖賢而令長不堪，則國事不舉，萬機有闕，其損敗豈徒止乎一境而已哉！</p><p>令長尤宜得才，乃急於臺省之官也。</p><p><strong>所出</strong>：《抱朴子 · 卷28》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷28</p></article></main></div></div>
