    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 離內遠遊危身之道</nav></header><main><article><h1>離內遠遊危身之道</h1><p>遠遊以樂，疏忠臣，身危之道也。</p><p>離內遠遊而忽於諫士，則危身之道也。昔者[[齊景公]]遊於海而樂之，號令曰：「言歸者死。」顏涿聚曰：「君遊海而樂之，柰臣有圖國者何？」遂援戈將擊之。涿聚曰：「臣言為國，非為身也。」延頸而前曰：「君擊之矣。」景公乃釋戈趣駕而歸。至三日，而聞國人有謀不內景公者矣。景公所以遂有齊國者，顏涿聚之力也。是故遠遊荒政，忠臣弗得納諫，其危必矣。</p><p><strong>所出</strong>：《韓非子 · 十過》 — https://zh.wikisource.org/wiki/韓非子/十過</p></article></main></div></div>
