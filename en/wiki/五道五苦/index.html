    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 五道五苦</nav></header><main><article><h1>五道五苦</h1><p>宿對所生之苦，滅之乃可長守帝一</p><p>五道五苦，乃宿對所生之因果苦也。經云「宿對滅五道五苦，長守帝一營」，言滅此因果乃可守一。</p><p><strong>所出</strong>：《上清大洞真經 · 10章》 — https://zh.wikisource.org/wiki/上清大洞真經/10章</p></article></main></div></div>
