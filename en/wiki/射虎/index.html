    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 射虎</nav></header><main><article><h1>射虎</h1><p>射虎見虎不見石，斬蛟見蛟不見水，以我之無合彼之虛則隱顯死生無所拘。</p><p>射似虎者，見虎而不見石；斬暴蛟者，見蛟而不見水。是知萬物可以虛，我身可以無。以我之無，合彼之虛。自然可以隱可以顯，可以死，可以生而無所拘。夫空中之塵若飛雪，而目未嘗見；穴中之蟻若牛闘，而耳未嘗聞，況非見聞者乎！</p><p><strong>所出</strong>：《化書 · 卷一》 — https://zh.wikisource.org/wiki/化書/卷一</p></article></main></div></div>
