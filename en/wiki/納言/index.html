    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 納言</nav></header><main><article><h1>納言</h1><p>出入王命、傳達下情之官。</p><p>舜命龍為納言。龍之職，夙夜出納朕命，惟允。出命者，使民知上意；納言者，使上知民隱。讒說殄行，震驚朕師，故納言之官尤貴允信。帝舜「朕堲讒說殄行」，而立納言以防之。</p><p><strong>所出</strong>：《尚書 · 舜典》 — https://zh.wikisource.org/wiki/尚書/舜典</p></article></main></div></div>
