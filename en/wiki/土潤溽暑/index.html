    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 土潤溽暑</nav></header><main><article><h1>土潤溽暑</h1><p>季夏之月，土潤溽暑，大雨時行，宜燒薙行水以殺草糞田。</p><p>季夏之月，樹木方盛，乃命虞人入山行木，毋有斬伐。不可以興土功，不可以合諸侯，不可以起兵動眾。是月也，土潤溽暑，大雨時行，燒薙行水，利以殺草，如以熱湯。可以糞田疇，可以美土彊。</p><p><strong>所出</strong>：《禮記 · 月令》 — https://zh.wikisource.org/wiki/禮記/月令</p></article></main></div></div>
