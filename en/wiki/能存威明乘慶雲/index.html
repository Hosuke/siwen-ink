    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 能存威明乘慶雲</nav></header><main><article><h1>能存威明乘慶雲</h1><p>存守威明則可乘慶雲而役使萬神朝三元。</p><p>能存威明乘慶雲，役使萬神朝三元。</p><p>存守膽中威明之光，乘慶雲之炁向上超昇，役使萬神，朝謁三元。此為黃庭內景存思之法：膽氣充盈，則眼童明亮、鼻柱潤澤、腦髮鮮潤、九色煥衣光華，佩玉龍文，諸神咸聽驅遣，上朝三元之聖。</p><p><strong>所出</strong>：《黃庭內景經 · 膽部章第十四》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/膽部章第十四</p></article></main></div></div>
