    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 惰農自安</nav></header><main><article><h1>惰農自安</h1><p>怠惰安享，不知生業。</p><p>乃不畏戎毒于遠邇；惰農自安，不昏（暋）作勞，不服田畝，越其罔有黍稷。</p><p>[[惰農自安]]，不知力穡之義。不[[昏作勞]]，[[不服田畝]]，則無以成秋。盤庚以是戒臣民：若[[不畏戎毒]]，怠惰自安，猶惰農之無秋也。此[[尚書]]所述戒惰勸勤之義。</p><p><strong>所出</strong>：《尚書 · 盤庚上》 — https://zh.wikisource.org/wiki/尚書/盤庚上</p></article></main></div></div>
