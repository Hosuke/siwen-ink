    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 五日為期，六日不詹</nav></header><main><article><h1>五日為期，六日不詹</h1><p>夫行有期而歸逾約，託詩以寫怨也。</p><p>采藍之章，言君子之期約也。五日為期，約以五日當還；六日不詹，至六日而猶未見也。詹者，至也。不詹者，不至也。幽王之時，征役不息，室家離散，怨曠多矣。此詩人因采藍而不盈襜，以起興於夫之逾期者。</p><p><strong>所出</strong>：《詩經 · 采綠》 — https://zh.wikisource.org/wiki/詩經/采綠</p></article></main></div></div>
