    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 聖人無所見故能無不見</nav></header><main><article><h1>聖人無所見故能無不見</h1><p>聖人無所偏見，故無所不見；無所偏聞，故無所不聞。</p><p>諦毫末者，不見天地之大；審小音者，不聞雷霆之聲。見大者亦不見小，見邇者亦不見遠，聞大者亦不聞小，聞邇者亦不聞遠。聖人無所見，故能無不見，無所聞，故能無不聞。</p><p><strong>所出</strong>：《關尹子 · 9》 — https://zh.wikisource.org/wiki/關尹子/9</p></article></main></div></div>
