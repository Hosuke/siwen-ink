    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 君子義以為上</nav></header><main><article><h1>君子義以為上</h1><p>君子尚義不尚勇，勇而無義則為亂，小人亦然。</p><p>子路曰：「君子尙勇乎？」子曰：「君子義以為上。君子有勇而無義為亂，小人有勇而無義為盜。」</p><p>子路以勇為君子所尚，孔子折之，以為義之為上，而非勇也。勇而無義，君子則為亂，小人則為盜。勇之為德，非義不能節之也。是故君子之所以異於小人者，不在於勇之好不好，在於義之能不能節也。</p><p><strong>所出</strong>：《論語 · 陽貨第十七》 — https://zh.wikisource.org/wiki/論語/陽貨第十七</p></article></main></div></div>
