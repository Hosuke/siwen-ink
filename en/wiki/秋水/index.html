    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 秋水</nav></header><main><article><h1>秋水</h1><p>《莊子》外篇第十七，以河伯北海若之問答，論大小、盈虛、貴賤之相對，通於道而不執名言。</p><p>《秋水》為《莊子》外篇第十七，凡七段：河伯與北海若論道凡四問答，繼以[[夔憐蚿]]之寓、[[孔子遊匡]]之事、[[埳井之鼃]]之喻、莊子辭楚相之[[神龜曳尾]]、惠子懼代相之[[鵷鶵過焉]]、以及莊惠[[鯈魚出游從容]]之辯。核義在破大小、貴賤、智愚之執，歸於天之分際而[[無以人滅天]]。</p><p><strong>所出</strong>：《莊子 · 秋水》 — https://zh.wikisource.org/wiki/莊子/秋水</p></article></main></div></div>
