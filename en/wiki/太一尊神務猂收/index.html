    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 太一尊神務猂收</nav></header><main><article><h1>太一尊神務猂收</h1><p>太一尊神之名，常守玉枕之下，護泥丸、納真炁，使七祖受玄更生。</p><p>太一尊神務猂收，上清大洞真經所存思之上尊神也。兆當存想其真炁為紫雲之色，罩於頂上，默呪而招之令下。蓋神常守兆玉枕之下，泥丸後戶，所以護死炁之門、使生真炁入於泥丸者矣。及其應感，則七祖父母受玄更生，上籍玉皇，重華萬寧，可冀上昇之階焉。</p><p><strong>所出</strong>：《上清大洞真經 · 2章》 — https://zh.wikisource.org/wiki/上清大洞真經/2章</p></article></main></div></div>
