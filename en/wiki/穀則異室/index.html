    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 穀則異室</nav></header><main><article><h1>穀則異室</h1><p>生不得耦居，喻禮制隔絕，有情人難遂其願。</p><p>「穀則異室」，生則不得同室，[[死則同穴]]之反對也。[[陳古刺今]]之義，蓋緣於此——世衰禮廢，大夫欲聽-{zh-cn:讼}-而不能，致令有情人困於別室。毳衣如菼、毳衣如璊，男子盛服之車，女子豈不欲奔？特「畏子不敢」「畏子不奔」耳。[[畏子不敢]]者，非畏其人，畏禮法之不可犯也。</p><p><strong>所出</strong>：《詩經 · 大車》 — https://zh.wikisource.org/wiki/詩經/大車</p></article></main></div></div>
