    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 行人得牛邑人災</nav></header><main><article><h1>行人得牛邑人災</h1><p>偶然之得，偶然而失，邑人受其累。</p><p>行人得牛，邑人災者，《象》傳述六三爻之義也。牛本邑人之有，行人取之而得，非盜也，時之適然。邑人失之而災，亦非罪也，數之偶爾。聖人觀此，明夫利之所在，祸亦隨之；人之所失，抑非盡由己也。君子處世，不以偶然之得失縈懷，、守其无妄之正而已。</p><p><strong>所出</strong>：《周易 · 无妄》 — https://zh.wikisource.org/wiki/周易/无妄</p></article></main></div></div>
