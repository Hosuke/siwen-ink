    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 門伯戶丞</nav></header><main><article><h1>門伯戶丞</h1><p>門戶之鬼，晝為神福，暮作鬼</p><p>[[女青鬼律]]所記門伯戶丞，乃門戶之神，亦即門戶之鬼。經云：「天載、蔑嚮二鬼是門伯戶丞，白日為神福室，暮作鬼。」</p><p>門伯戶丞之性，似人似鬼，白日居門戶，能降福於人；暮夜則化為鬼，作祟害人。制之之法：人定時於門戶左右呼其名，三掌手，反首持兩三過，此鬼即止，不敢作害。</p><p>此鬼亦寓神鬼一體之意，不可不慎。</p><p><strong>所出</strong>：《女青鬼律 · 卷4》 — https://zh.wikisource.org/wiki/女青鬼律/卷4</p></article></main></div></div>
