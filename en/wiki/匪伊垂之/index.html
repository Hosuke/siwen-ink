    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 匪伊垂之</nav></header><main><article><h1>匪伊垂之</h1><p>物有自然之理，非人之所能強</p><p>匪伊垂之，帶則有餘；匪伊卷之，髮則有旟。</p><p>語出《詩經·小雅·都人士》。帶非故為之垂，乃帶自有餘；髮非故為之卷，乃髮自有旟。言事物各有其自然之理，不可強使如是。順其自然，則無為而成；拂其自然，則徒勞無功。此道家「無為」之旨，亦聖人「正其誼不謀其利」之義也。</p><p>後世用此語，多謂事之成毀自有其時，不可妄意強求。</p><p><strong>所出</strong>：《詩經 · 都人士》 — https://zh.wikisource.org/wiki/詩經/都人士</p></article></main></div></div>
