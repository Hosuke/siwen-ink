    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 霍去病遺址祁連</nav></header><main><article><h1>霍去病遺址祁連</h1><p>霍去病卒，天子為冢象祁連山以旌其功。</p><p>天子悼之，發屬國玄甲軍，陳自長安至茂陵，為冢象祁連山。謚之，并武與廣地曰景桓侯。</p><p><strong>所出</strong>：《史記 · 卷111》 — https://zh.wikisource.org/wiki/史記/卷111</p></article></main></div></div>
