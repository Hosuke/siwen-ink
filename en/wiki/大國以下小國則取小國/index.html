    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 大國以下小國則取小國</nav></header><main><article><h1>大國以下小國則取小國</h1><p>大國謙下則小國自附，小國謙下則大國容之，各遂所欲。</p><p>大國以謙下遇小國，則小國自來歸附；小國以謙下事大國，則大國容納之。或自卑以取人，或自卑而為人所取，勢雖異而皆出於下。大國之欲，不過兼畜人；小國之欲，不過入事人。兩者各得其所欲，然大者宜益加謙下。[[曲則全]]之義，於斯為驗。</p><p><strong>所出</strong>：《老子河上公章句 · 謙德》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
