    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 白露為霜</nav></header><main><article><h1>白露為霜</h1><p>白露凝霜，時節已深，求者道遠，意志彌堅。</p><p>「白露為霜」，《蒹葭》首章句也。蒹葭之上，露重為霜，秋深矣。詩人觸物興懷，借白露以見時序之遷、幽期之阻。露至凝霜，則涼意已深，求道之難亦可知也。後世騷人詠秋感遇，多用此事。</p><p><strong>所出</strong>：《詩經 · 蒹葭》 — https://zh.wikisource.org/wiki/詩經/蒹葭</p></article></main></div></div>
