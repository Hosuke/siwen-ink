    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 蕭何帶劍履上殿</nav></header><main><article><h1>蕭何帶劍履上殿</h1><p>高祖許蕭何帶劍履上殿，入朝不趨，以殊禮寵之。</p><p>高祖以蕭何功最盛，封為酇侯。及論功行封畢，乃令蕭何，賜帶劍履上殿，入朝不趨。此漢初人臣之極賞也。帶劍者，示其親任；履上殿者，異其朝儀；入朝不趨者，從容而不迫。於是何父子兄弟十餘人皆有食邑，益封二千戶。</p><p><strong>所出</strong>：《史記 · 卷053》 — https://zh.wikisource.org/wiki/史記/卷053</p></article></main></div></div>
