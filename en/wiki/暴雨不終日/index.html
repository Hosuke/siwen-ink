    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 暴雨不終日</nav></header><main><article><h1>暴雨不終日</h1><p>暴雨不能竟日，以喻甚者不終。</p><p>飄風不終朝，暴雨不終日。</p><p>暴疾之雨，不能竟乎一日。以況天地之為，其勢不可以久持，況人事乎？</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第六十八章 同道》 — https://zh.wikisource.org/wiki/老子_(帛書校勘版)</p></article></main></div></div>
