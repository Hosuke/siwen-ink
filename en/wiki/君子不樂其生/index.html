    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 君子不樂其生</nav></header><main><article><h1>君子不樂其生</h1><p>亂世君子厭倦人生之悲</p><p>「君子不樂其生」出[[兔爰]]前之序辭。序者述其旨-{云}-：「周也。桓王失信，諸侯背叛，構怨連禍，王師傷敗，君子不樂其生焉。」[[兔爰]]三章皆此意也。詩中[[尚寐無吪|尚寐無吪]]之辭，即此「不樂其生」之具體表白。亂世至於令君子厭生，則其世道衰微可知矣。</p><p><strong>所出</strong>：《詩經 · 兔爰》 — https://zh.wikisource.org/wiki/詩經/兔爰</p></article></main></div></div>
