    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 取人無取健，無取佞，無取口啍</nav></header><main><article><h1>取人無取健，無取佞，無取口啍</h1><p>取人當以信愨為本，不可以健、佞、口才為賢。</p><p>哀公問取人，孔子對曰：「無取健，無取佞，無取口啍。健，貪也；佞，亂也；口啍，誕也。」又申之曰：「弓調而後求勁焉，馬服而後求良焉，士信愨而後求知能焉。士不信愨而有多知能，譬之其豺狼也，不可以身尒也。」</p><p><strong>所出</strong>：《荀子 · 哀公篇》 — https://zh.wikisource.org/wiki/荀子/哀公篇</p></article></main></div></div>
