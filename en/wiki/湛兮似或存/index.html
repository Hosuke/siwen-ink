    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 湛兮似或存</nav></header><main><article><h1>湛兮似或存</h1><p>道體至湛若亡而有真存</p><p>湛兮似或存，言道體至深至湛，若亡若存，實則真有而不滅也。王弼注云「不亦湛兮似或存乎」，言地守形、天慊象，皆不能及道之覆載；德之過者無過是矣。道不可以形迹求，其存也若亡，其湛也若沒，而妙用無方焉。</p><p><strong>所出</strong>：《道德經 (王弼本) · 四章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
