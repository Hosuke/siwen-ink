    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 既差我馬</nav></header><main><article><h1>既差我馬</h1><p>揀選良馬，以備田獵。</p><p>「差」者，簡別揀選之義。田事所用之馬，非苟然已也，必精選其良者。《小雅·車攻》亦言「我馬既同」，皆言田獵之先，必簡閱車馬，使良駑有別。</p><p>庚午之日，天干地支皆陽，剛健純備，以之差馬，亦取其吉也。</p><p><strong>所出</strong>：《詩經 · 吉日》 — https://zh.wikisource.org/wiki/詩經/吉日</p></article></main></div></div>
