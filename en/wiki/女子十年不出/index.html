    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 女子十年不出</nav></header><main><article><h1>女子十年不出</h1><p>女子十年不出，姆教婉娩聽從</p><p>女子十年不出，姆教婉娩聽從，執麻枲，治絲繭，織紝組紃，學女事以共衣服，觀於祭祀，納酒漿、籩豆、菹醢，禮相助奠。</p><p>十有五年而笄，二十而嫁；有故，二十三年而嫁。聘則為妻，奔則為妾。凡女拜尚右手。</p><p><strong>所出</strong>：《禮記 · 內則》 — https://zh.wikisource.org/wiki/禮記/內則</p></article></main></div></div>
