    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 靈根</nav></header><main><article><h1>靈根</h1><p>舌根或命根，神氣之本</p><p>靈根者，人身性命之根本也。根於下則為丹田，達於上則為泥丸，總攝精神魂魄之樞機。經云「灌溉五華植靈根」，五華茂而靈根深，根深則炁足，炁足則神全，而長生之基以立。《太上黃庭內景經》以靈根為人身之蒂，蒂固則枝葉榮，蒂枯則神氣散，此之謂也。</p><p><strong>所出</strong>：《黃庭內景經 · 上有章第二》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/上有章第二</p></article></main></div></div>
