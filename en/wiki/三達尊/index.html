    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 三達尊</nav></header><main><article><h1>三達尊</h1><p>天下有三事為人所共尊：爵也，齒也，德也，各有所當。</p><p>天下有達尊三：爵一，齒一，德一。朝廷莫如爵，鄉黨莫如齒，輔世長民莫如德。惡得有其一以慢其二哉？</p><p>孟子言：天下之尊，有三達道：爵位也，年齒也，德行也。朝廷之上，尊卑有序，莫如以爵位定之；鄉里之間，長幼有序，莫如以年齡別之；至於輔佐世道、治理民人，則莫如以德行為先。既居其一，則不可以慢其二；尊賢使能之道，在於兼取而不偏廢也。</p><p><strong>所出</strong>：《孟子 · 公孫丑下》 — https://zh.wikisource.org/wiki/孟子/公孫丑下</p></article></main></div></div>
