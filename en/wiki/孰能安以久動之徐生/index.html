    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 孰能安以久動之，徐生</nav></header><main><article><h1>孰能安以久動之，徐生</h1><p>久安則生機自化，動而生生不息。</p><p>孰能安以久動之，徐生。動者所以起滞弊、通神明也。安者，道之基也；久安者，化之漸也。安之久而動以時，則生機流通，萬化自成。此聖人無為之功、以靜致動之術也。</p><p><strong>所出</strong>：《老子河上公章句 · 顯德》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p><hr><p><strong>所出</strong>：《道德經 (王弼本) · 十五章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
