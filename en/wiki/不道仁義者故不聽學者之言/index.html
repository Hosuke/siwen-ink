    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 不道仁義者故不聽學者之言</nav></header><main><article><h1>不道仁義者故不聽學者之言</h1><p>不稱道仁義之故，所以不聽儒者空言。</p><p>今世儒者之說人主，不善今之所以為治，而語已治之功；不審官法之事，不察姦邪之情，而皆道上古之傳譽、先王之成功。儒者飾辭曰：「聽吾言，則可以霸王。」此說者之巫祝，有度之主不受也。故明主舉實事，去無用，不道仁義者故，不聽學者之言。</p><p><strong>所出</strong>：《韓非子 · 顯學》 — https://zh.wikisource.org/wiki/韓非子/顯學</p></article></main></div></div>
