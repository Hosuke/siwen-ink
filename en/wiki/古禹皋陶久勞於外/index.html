    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 古禹、皋陶久勞於外</nav></header><main><article><h1>古禹、皋陶久勞於外</h1><p>稱述禹與皋陶勤民事而民安，以戒諸侯。</p><p>湯告諸侯，言古禹、皋陶久勞於外，其有功乎民，民乃有安。東為江，北為濟，西為河，南為淮，四瀆已修，萬民乃有居。后稷降播，農殖百穀。三公咸有功于民，故后有立。言此以勸戒諸侯，當法前賢之勤也。</p><p><strong>所出</strong>：《尚書 · 湯誥》 — https://zh.wikisource.org/wiki/尚書/湯誥</p></article></main></div></div>
