    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 四亡</nav></header><main><article><h1>四亡</h1><p>令不出、留、上不通、止，國之所以亡也。</p><p>令求不出謂之滅，出而道留謂之擁，下情求不上通謂之塞，下情上而道止謂之侵。滅、擁、塞、侵之所生，從法之不立也。是故先王之治國，不淫意於法之外，不為惠於法之內也。</p><p><strong>所出</strong>：《管子 · 第46篇明法》 — https://zh.wikisource.org/wiki/管子/第46篇明法</p></article></main></div></div>
