    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 關刺解牒</nav></header><main><article><h1>關刺解牒</h1><p>關刺解牒，書記之一體，百官詢事之書。</p><p>書記廣大，百官詢事，則有[[關刺解牒]]。</p><p>關者，閉也。出入由門，關閉當審；庶務在政，通塞應詳。[[韓非]]-{云}-「[[孫亶回]]聖相也，而關於州部」，蓋謂此也。刺者，達也。詩人諷刺，《周禮》三刺，事敘相達，若針之通結矣。解者，釋也。解釋結滯，徵事以對也。牒者，葉也。短簡編牒，如葉在枝，[[溫舒截蒲]]，即其事也。議政未定，故短牒咨謀。牒之尤密，謂之為籤。籤者，纖密者也。</p><p><strong>所出</strong>：《文心雕龍 · 書記》 — https://zh.wikisource.org/wiki/文心雕龍/書記</p></article></main></div></div>
