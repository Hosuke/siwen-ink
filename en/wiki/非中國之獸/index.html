    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 非中國之獸</nav></header><main><article><h1>非中國之獸</h1><p>麟非中國所有，乃聖王之瑞應。</p><p>公羊子釋獲麟之義曰：何以書？記異也。何異爾？非中國之獸也。夫麟生於郊藪，乃四夷所產，非中原之物，故以為異。然麟者仁獸，實為治世之瑞，聖王有德則至。孔子傷世道之衰而麟忽來，故記之以見天意之未終也。</p><p><strong>所出</strong>：《春秋公羊傳 · 哀公》 — https://zh.wikisource.org/wiki/春秋公羊傳/哀公</p></article></main></div></div>
