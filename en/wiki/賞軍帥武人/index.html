    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 賞軍帥武人</nav></header><main><article><h1>賞軍帥武人</h1><p>孟秋迎秋還反，天子賞軍帥、武人於朝。</p><p>孟秋之月，天子居總章左个。立秋之日，天子親帥三公、九卿、諸侯、大夫以迎秋於西郊。還反，賞軍帥、武人於朝。天子乃命將帥選士厲兵，簡練桀俊，專任有功，以征不義。</p><p><strong>所出</strong>：《禮記 · 月令》 — https://zh.wikisource.org/wiki/禮記/月令</p></article></main></div></div>
