    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 中山公子牟</nav></header><main><article><h1>中山公子牟</h1><p>魏國賢公子，好與賢人游，悅公孫龍之學</p><p>中山公子牟者，魏國之賢公子也，好與賢人游，不恤國事，而悅趙人公孫龍。樂正子輿之徒笑之，數稱公孫龍言行之謬。公子牟一一析之，謂「無意則心同；無指則皆至；盡物者常有；影不移者，說在改也；髮引千鈞，勢至等也；白馬非馬，形名離也；孤犢未嘗有母，非孤犢也。」樂正子輿不能屈，公子牟默然良久，告退曰：「請待餘日，更謁子論。」</p><p><strong>所出</strong>：《列子 · 仲尼篇》 — https://zh.wikisource.org/wiki/列子/仲尼篇</p></article></main></div></div>
