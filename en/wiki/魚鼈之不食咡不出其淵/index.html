    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 魚鼈之不食咡者，不出其淵</nav></header><main><article><h1>魚鼈之不食咡者，不出其淵</h1><p>賢者自治則不從聖人</p><p>「魚鼈之不食咡者，不出其淵。樹木之勝霜雪者，不聽於天。士能自治者，不從聖人。」魚鼈不肯食人之咡，則不出淵以求；林木能勝霜雪，則不聽天時之令。賢才能自治者，亦不肯從聖人之教。此非聖教之失，乃賢者自有主也。</p><p><strong>所出</strong>：《管子 · 第35篇侈靡》 — https://zh.wikisource.org/wiki/管子/第35篇侈靡</p></article></main></div></div>
