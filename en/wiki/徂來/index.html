    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 徂來</nav></header><main><article><h1>徂來</h1><p>泰山以東之山，魯人取材以造宮室。</p><p>詩云「徂來之松，新甫之柏」，又云「松桷有舄，路寢孔碩，新廟奕奕」。</p><p>徂來，山名，在泰山以東，魯地也。魯人伐徂來之松，斷之以尋尺，度之以規矩，取材造宮。路寢者，正寢也。新廟者，閟宮也。徂來之松材大而直，宜為桷桷故詩人述之。</p><p><strong>所出</strong>：《詩經 · 閟宮》 — https://zh.wikisource.org/wiki/詩經/閟宮</p></article></main></div></div>
