    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 古之良工不勞其知巧以為玩好</nav></header><main><article><h1>古之良工不勞其知巧以為玩好</h1><p>良工不作無用之物以悅上；人主若悅玩好，則民不足於備用。</p><p>今工以巧矣，而民不足於備用者，其悅在玩好。農以勞矣，而天下飢者，其悅在珍怪，方丈陳於前。女以巧矣，而天下寒者，其悅在文繡。是故博帶梨，大袂列，文繡染，刻鏤削，雕琢采，關幾而不征，市鄽而不稅。</p><p>古之良工，不勞其知巧以爲玩好。是故無用之物，守法者不失。</p><p><strong>所出</strong>：《管子 · 第10篇五輔》 — https://zh.wikisource.org/wiki/管子/第10篇五輔</p></article></main></div></div>
