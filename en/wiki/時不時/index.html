    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 時不時</nav></header><main><article><h1>時不時</h1><p>郊祀失其時節，則為非禮。</p><p>穀梁子明郊祀之義，以時為貴。其說曰：「郊自正月至于三月，郊之時也。夏四月郊，不時也；五月郊，不時也。」蓋郊天之祭，必以正月至三月舉之，方為合禮。逾此而行，皆為失時。又有「夏之始可以承春，以秋之末承春之始，蓋不可矣」之論，謂夏月雖近春天之始，然已非正月之正時；秋末距春更遠，尤不可也。又九月用郊，穀梁以為「用者，不宜用者也」，皆非禮之郊也。時者，天道之節；失時，則逆天而行，祥瑞不降，災異隨之矣。</p><p><strong>所出</strong>：《春秋穀梁傳 · 哀公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/哀公</p></article></main></div></div>
