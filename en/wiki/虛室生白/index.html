    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 虛室生白</nav></header><main><article><h1>虛室生白</h1><p>心地虛空，則吉祥止止</p><p>又，《徐無鬼》論真人修養之法云：「無所甚親，無所甚疏，抱德煬和以順天下。」又云：「以目視目，以耳聽耳，以心復心。若然者，其平也繩，其變也循。」皆言返照本心、不逐外物之旨，可與 [[虛室生白]] 條相發。</p><p>  <strong>所出</strong>：《莊子 · 徐無鬼》 — https://zh.wikisource.org/wiki/莊子/徐無鬼</p></article></main></div></div>
