    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 邊信傷德</nav></header><main><article><h1>邊信傷德</h1><p>守邊之信義與外交之和睦，邦交之要義也。</p><p>小利害信，小怒傷義；邊信傷德，厚和構四國，以順貌德，后鄉四極。夫邦國之交，信義為本。和則百姓安，怨則四隣構。守邊之吏，若僅知小利小害，而不達大信大義，則邊釁生而德義傷矣。唯能守信而不渝、懷德而遠怨者，方能和協四隣、藩屏天子的也。是以[[明主]]之於邊事，必以信為干櫓、以德為城池，使外隣懷德而來，敵國畏威不敢犯，此霸王之業所由成也。</p><p><strong>所出</strong>：《管子 · 第24篇問》 — https://zh.wikisource.org/wiki/管子/第24篇問</p></article></main></div></div>
