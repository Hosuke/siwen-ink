    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 天下無指物無可以謂物</nav></header><main><article><h1>天下無指物無可以謂物</h1><p>天下若無指之名，則物亦不得名為物。</p><p>天下無指，物無可以謂物。非指者，天下而物，可謂指乎？</p><p>[[指非指]]之反詰也。世人皆以物為實有，不知物之所以為物，正賴指以成之。設使天下竟無指之名，則物亦無由以稱物。譬如未有「白」之名，則白馬亦無由以別也。</p><p><strong>所出</strong>：《公孫龍子 · 3》 — https://zh.wikisource.org/wiki/公孫龍子/3</p></article></main></div></div>
