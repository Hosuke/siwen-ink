    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 雷出地奮</nav></header><main><article><h1>雷出地奮</h1><p>雷發於地，聲勢振發，豫之象也。</p><p>《象》曰「雷出地奮，豫」。震在坤上，雷者震之物，出於地上，奮發有聲，萬物莫不欣然，此豫之象也。先王法此以作樂崇德，殷荐上帝以配祖考，樂以致豫，以和萬民，是聖人因象以為治者也。</p><p><strong>所出</strong>：《周易 · 豫》 — https://zh.wikisource.org/wiki/周易/豫</p></article></main></div></div>
