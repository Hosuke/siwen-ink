    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 詔策六體</nav></header><main><article><h1>詔策六體</h1><p>條列詔策六大類及其文辭風格：授官、封策、敕戒、治戎、肆赦、明罰。</p><p>故授官選賢，則義炳重離之輝；優文封策，則氣含風雨之潤；敕戒恆誥，則筆吐星漢之華；治戎燮伐，則聲有洊雷之威；眚災肆赦，則文有春露之滋；明罰敕法，則辭有秋霜之烈：此詔策之大略也。</p><p><strong>所出</strong>：《文心雕龍 · 詔策》 — https://zh.wikisource.org/wiki/文心雕龍/詔策</p></article></main></div></div>
