    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 血滯</nav></header><main><article><h1>血滯</h1><p>身中死根之滯，流風所斷之患也。</p><p>血滯，身中死根之滯也。流風斷之，黃寧清之，乃得長生。行道者存思流風掃血滯，可滅絕三塗生、昇登南仙焉。</p><p><strong>所出</strong>：《上清大洞真經 · 19章》 — https://zh.wikisource.org/wiki/上清大洞真經/19章</p></article></main></div></div>
