    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 賞罰應春秋</nav></header><main><article><h1>賞罰應春秋</h1><p>賞罰應春秋，猶春夏生長、秋冬收斂之相應。</p><p>賞罰應春秋，昏明順寒暑。賞以春夏，罰以秋冬，天之道也。賞罰與陰陽之氣相應，則政令合於天道。善者賞之，則陽氣盛而萬物長；惡者罰之，則陰氣肅而奸邪消。天時人事，相須以成，此聖人治世之大法。</p><p><strong>所出</strong>：《周易參同契 · 01章》 — https://zh.wikisource.org/wiki/周易參同契/01章</p></article></main></div></div>
