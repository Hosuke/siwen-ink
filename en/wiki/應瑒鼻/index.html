    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 應瑒鼻</nav></header><main><article><h1>應瑒鼻</h1><p>應瑒鼻大，時人以其比於盜竊所削之卵。</p><p>應瑒，魏文人，為五官將文學。鼻大而醜，時人嘲之，比之於盜竊削卵之狀。[[文心雕龍 · 諧讔]]云：「應瑒之鼻，方於盜削卵。」皆嗤戲形貌之言也。魏晉滑稽之風，盛相驅扇如此，而曾無益於世用。</p><p><strong>所出</strong>：《文心雕龍 · 諧讔》 — https://zh.wikisource.org/wiki/文心雕龍/諧讔</p></article></main></div></div>
