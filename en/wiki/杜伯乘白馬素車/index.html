    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 杜伯乘白馬素車</nav></header><main><article><h1>杜伯乘白馬素車</h1><p>周宣王殺臣杜伯，三年後杜伯乘白馬素車射殺宣王，以證鬼神報應不爽。</p><p>周宣王殺其臣杜伯而不辜，杜伯曰：「吾君殺我而不辜，若以死者爲無知，則止矣；若死而有知，不出三年，必使吾君知之。」</p><p>其三年，周宣王合諸侯而田於圃田，車數百乘，從數千，人滿野。日中，杜伯乘白馬素車，朱衣冠，執朱弓，挾朱矢，追周宣王，射之車上，中心折脊，殪車中，伏弢而死。當是之時，周人從者莫不見，遠者莫不聞，著在周之《春秋》。</p><p><strong>所出</strong>：《墨子 · 明鬼下》 — https://zh.wikisource.org/wiki/墨子/明鬼下</p></article></main></div></div>
