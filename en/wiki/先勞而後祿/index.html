    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 先勞而後祿</nav></header><main><article><h1>先勞而後祿</h1><p>儒者先盡其道而後受其祿，不以祿為先圖。</p><p>難得而易祿也，易祿而難畜也。非時不見，不亦難得乎？非義不合，不亦難畜乎？先勞而後祿，不亦易祿乎？其近人有如此者。</p><p>儒者之難得，以非時不見也；難畜，以非義不合也。然一旦相遇，先事其勞，不問其祿，祿自易來。此儒者待世之道：行道為先，受祿為後。《孟子》「何必曰利」之旨，亦此意也。</p><p><strong>所出</strong>：《禮記 · 儒行》 — https://zh.wikisource.org/wiki/禮記/儒行</p></article></main></div></div>
