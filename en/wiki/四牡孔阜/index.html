    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 四牡孔阜</nav></header><main><article><h1>四牡孔阜</h1><p>四牡壯盛，心念君子將歸也。</p><p>「四牡孔阜，六轡在手，騏駵是中，騧驪是驂。」</p><p>四牡者，四匹雄馬也。孔，甚也。阜，肥壯也。言四馬甚肥壯，六轡執於手中，騏、駵居中，騧、驪為驂，車乘之盛如此也。與[[田車既好四牡孔阜]]義相類，狀軍容之盛，而心念君子之歸期。</p><p><strong>所出</strong>：《詩經 · 小戎》 — https://zh.wikisource.org/wiki/詩經/小戎</p></article></main></div></div>
