    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 豐隆將雨</nav></header><main><article><h1>豐隆將雨</h1><p>季春豐隆出以將雨，至秋地氣收殺，百蟲蟄伏。</p><p>季春三月，豐隆乃出，以將其雨。至秋三月，地氣不藏，乃收其殺，百蟲蟄伏，靜居閉戶，青女乃出，以降霜雪。行十二時之氣，以至于仲春二月之夕，乃收其藏而閉其寒，女夷鼓歌，以司天和，以長百穀禽鳥草木。孟夏之月，以熟穀禾，雄鳩長鳴，為帝候歲。</p><p><strong>所出</strong>：《淮南子 · 天文訓》 — https://zh.wikisource.org/wiki/淮南子/天文訓</p></article></main></div></div>
