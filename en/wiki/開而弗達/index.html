    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 開而弗達</nav></header><main><article><h1>開而弗達</h1><p>啟發之而不遽告之，使學者深思而自得。</p><p>開而弗達，則思。教者之於學者，貴乎啟發其心，使之自悟，而不貴乎遽以答案告之也。</p><p>開者，叩其端而啟之也；弗達者，不竟其說而使之自得之也。學者之心，經啟發而深思，因深思而自得，則其智日開，其德日新。若夫遽以告之，則學者不假思索，坐享其成，其智不開，其德不成也。</p><p>和易以思，可謂善喻矣。教者之道，盡於此矣。</p><p><strong>所出</strong>：《禮記 · 學記》 — https://zh.wikisource.org/wiki/禮記/學記</p></article></main></div></div>
