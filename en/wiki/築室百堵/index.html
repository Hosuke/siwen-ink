    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 築室百堵</nav></header><main><article><h1>築室百堵</h1><p>營建宮室，廣大其制。</p><p>[[築室百堵]]者，言建築宮室其廣百堵也。堵者，版牆之量詞。百堵，极言其多，見其家世之盛、規模之大。詩云「築室百堵」，述宗族繁衍，居室相承之象。</p><p><strong>所出</strong>：《詩經 · 斯干》 — https://zh.wikisource.org/wiki/詩經/斯干</p><hr><p>捄之陾陾，度之薨薨。築之登登，削屢馮馮。百堵皆興，鼛鼓弗勝。</p><p>  百堵，眾牆也。言其功之盛，版築之聲百堵一時皆作，鼓不能勝也。民力之勤，王業之基。</p><p>  <strong>所出</strong>：《詩經 · 緜》 — https://zh.wikisource.org/wiki/詩經/緜</p></article></main></div></div>
