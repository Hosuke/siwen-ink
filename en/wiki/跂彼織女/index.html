    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 跂彼織女，終日七襄</nav></header><main><article><h1>跂彼織女，終日七襄</h1><p>織女三星，終日推移七次而無功</p><p>跂彼織女，織女三星，在銀河之旁，狀如跂足然。襄，駕也，移也。七襄，終日七移也。言織女之星，終日推移七次，而不成報章之布也。雖有織之名，無織之功。詩人借星以諷有位無實者。</p><p><strong>所出</strong>：《詩經 · 大東》 — https://zh.wikisource.org/wiki/詩經/大東</p></article></main></div></div>
