    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 觀過知仁</nav></header><main><article><h1>觀過知仁</h1><p>觀人之過，可以知其心之仁與不仁。</p><p>人之過也，各於其黨。觀過，斯知仁矣。過出於心，觀其所犯之過，即可以知其心之仁與不仁。情有偏倚，過從之生，驗之於過，仁與不仁見矣。</p><p><strong>所出</strong>：《論語 · 里仁第四》 — https://zh.wikisource.org/wiki/論語/里仁第四</p></article></main></div></div>
