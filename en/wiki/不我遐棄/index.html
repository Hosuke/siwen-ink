    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 不我遐棄</nav></header><main><article><h1>不我遐棄</h1><p>君子歸而誓不相遺，婦心始安。</p><p>「既見君子，不我遐棄」，遐，遠也；棄，遺也。婦既見其夫之歸，乃言君子不我遠弃爾。毛傳云「不以我為遐遠而棄遺之」，言其夫誓與之同處，不以道遠而離絶也。盖别離之際，惄如調飢；既見而後，心乃獲安。此一句，見伉儷之恩義深矣。</p><p><strong>所出</strong>：《詩經 · 汝坟》 — https://zh.wikisource.org/wiki/詩經/汝坟</p></article></main></div></div>
