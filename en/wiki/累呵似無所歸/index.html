    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 累呵似無所歸</nav></header><main><article><h1>累呵似無所歸</h1><p>聖人無所滞著，蕩蕩然無定處</p><p>累呵似無所歸者，言聖人無所滞著、蕩蕩然無定止也。</p><p>帛書云：「累呵，似無所歸。」累者，倚賴依托之義；無所歸者，無固定之棲止、無偏執之依著。</p><p>道之蕩蕩無朕，聖人法之，故累然若無所歸，此非無歸也，歸乎道也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第六十四章 食母》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
