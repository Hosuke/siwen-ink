    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 芴</nav></header><main><article><h1>芴</h1><p>人臣執柄擅禁，為己者利，不為己者必害。</p><p>桓公問[[管仲]]曰：「治國何患？」對曰：「最苦社鼠。夫社，木而塗之，鼠因自託也。燻之則木焚，灌之則塗陁，此所以苦於社鼠也。今人君左右，出則為勢重以收利於民，入則比周謾侮蔽惡以欺於君，不誅則亂法，誅之則人主危，據而有之，此亦社鼠也。」故人臣執柄擅禁，明為己者必利，不為己者必害，亦猛狗也。故左右為社鼠，用事者為猛狗，則[[術]]不行矣。</p><p><strong>所出</strong>：《韓非子 · 外儲說右上》 — https://zh.wikisource.org/wiki/韓非子/外儲說右上</p></article></main></div></div>
