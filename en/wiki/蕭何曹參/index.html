    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 蕭何曹參</nav></header><main><article><h1>蕭何曹參</h1><p>蕭何與曹參有隙，及卒，舉曹參代己，無私恩怨。</p><p>蕭何素不與曹參相能。及何病，孝惠自臨視相國病，因問曰：「君即百歲後，誰可代君者？」對曰：「知臣莫如主。」孝惠曰：「曹參何如？」何頓首曰：「帝得之矣！臣死不恨矣！」夫將相之和，國之元氣也。雖素有嫌隙，而以國事為重，不以私害公，此大臣之度也。</p><p><strong>所出</strong>：《史記 · 卷053》 — https://zh.wikisource.org/wiki/史記/卷053</p></article></main></div></div>
