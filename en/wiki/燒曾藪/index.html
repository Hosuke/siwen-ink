    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 燒曾藪斬羣害</nav></header><main><article><h1>燒曾藪斬羣害</h1><p>有虞之世，焚藪澤、斬羣害，利民為本，封土立社。</p><p>有虞之王，燒曾藪，斬羣害，以爲民利，封土爲社，置木爲閭，始民知禮也。當是其時，民無慍惡不服，而天下化之。</p><p><strong>所出</strong>：《管子 · 第84篇輕重戊》 — https://zh.wikisource.org/wiki/管子/第84篇輕重戊</p></article></main></div></div>
