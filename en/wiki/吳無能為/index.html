    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 吳無能為</nav></header><main><article><h1>吳無能為</h1><p>子貢辭太宰嚭，歸而斷吳必亡。</p><p>太宰嚭召季康子，康子使子貢辭。太宰嚭曰：「國君道長，而大夫不出門，此何禮也？」對曰：「豈以為禮，畏大國也。大國不以禮命於諸侯，苟不以禮，豈可量也？寡君既共命焉，其老豈敢棄其國？大伯端委以治周禮，仲雍嗣之，斷髮文身，臝以為飾，豈禮也哉，有由然也。」反自鄫，以吳為無能為也。</p><p><strong>所出</strong>：《春秋左氏傳 · 哀公七年》 — https://zh.wikisource.org/wiki/春秋左氏傳/哀公</p></article></main></div></div>
