    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 清靜能為天下正</nav></header><main><article><h1>清靜能為天下正</h1><p>能清靜則為天下之長，持身正無終已時</p><p>清靜能為天下正。</p><p>河上公曰：「能清靜則為天下之長，持身正則無終已時也。」</p><p>夫清者澄而不雜，靜者虛而無擾。清以澄心，靜以定志，心澄志定，則無私智以眩物，無妄動以干時。此[[躁勝寒靜勝熱]]之效驗、聖人正天下之樞機也。清而能靜，靜而能正，其德配天，其治垂世。</p><p><strong>所出</strong>：《老子河上公章句 · 洪德》 — https://zh.wikisource/wiki/wiki/老子河上公章句/德經</p></article></main></div></div>
