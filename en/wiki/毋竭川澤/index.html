    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 毋竭川澤</nav></header><main><article><h1>毋竭川澤</h1><p>仲春之月，禁竭川澤、漉陂池、焚山林，以護生氣。</p><p>仲春之月，耕者少舍，乃脩闔扇，寢廟畢備。毋作大事，以妨農事。是月也，毋竭川澤，毋漉陂池，毋焚山林。</p><p><strong>所出</strong>：《禮記 · 月令》 — https://zh.wikisource.org/wiki/禮記/月令</p></article></main></div></div>
