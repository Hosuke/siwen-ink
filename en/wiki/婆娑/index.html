    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 婆娑</nav></header><main><article><h1>婆娑</h1><p>舞貌，舒其肢體以為戲也</p><p>婆娑者，舞貌也。舒展肢體、旋轉以為戲之稱。《說文》：「婆，奢也。一曰小妻也。娑，舞也。」合而言之，則為婆然以舞之貌。</p><p>《詩》言「婆娑其下」，是子仲之女婆娑舞於枌栩之下；「市也婆娑」，是男女罷績聚於市肆婆娑歡舞。《九歌》有「帝服食兮坐堂，婆娑乎五音之宮」，亦以婆娑狀舞容。《史記》稱「西京之人婆娑乎其中」，皆舞戲之意也。</p><p><strong>所出</strong>：《詩經 · 東門之枌》 — https://zh.wikisource.org/wiki/詩經/東門之枌</p></article></main></div></div>
