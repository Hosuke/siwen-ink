    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 蔡姬歸蔡</nav></header><main><article><h1>蔡姬歸蔡</h1><p>齊侯與蔡姬蕩舟，蔡人嫁之。</p><p>齊侯與蔡姬乘舟于囿，蕩公。公懼，變色。禁之，不可。公怒，歸之，未之絕也。蔡人嫁之。夫蔡姬之歸，初以其戲蕩夫舟而怒，終以忿而嫁之，齊蔡之隙由此起也。不韙之端，起於閨門，而國與國之嫌隙隨之矣。</p><p><strong>所出</strong>：《春秋左氏傳 · 僖公》 — https://zh.wikisource.org/wiki/春秋左氏傳/僖公</p></article></main></div></div>
