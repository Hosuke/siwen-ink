    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 櫻桃獻宗廟</nav></header><main><article><h1>櫻桃獻宗廟</h1><p>祭祀之禮，由漸而起，因時而立。</p><p>孝惠帝嘗春出游離宮，叔孫生曰：「古者有春嘗果，方今櫻桃孰，可獻，願陛下出，因取櫻桃獻宗廟。」上乃許之。諸果獻由此興。夫祭之有果，始於一時之制宜；禮之漸備，由於一事之增損。可見聖人之制禮，非一日而成，亦非一旦而廢；因時損益，漸以成之者也。</p><p><strong>所出</strong>：《史記 · 卷099》 — https://zh.wikisource.org/wiki/史記/卷099</p></article></main></div></div>
