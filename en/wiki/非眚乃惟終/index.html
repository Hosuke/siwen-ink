    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 非眚乃惟終</nav></header><main><article><h1>非眚乃惟終</h1><p>罰輕重視犯罪之心迹，過誤與故犯當有別。</p><p>《康誥》明刑罰輕重之義，以為「人有小罪，非眚，乃惟終自作不典，式爾有厥罪小，乃不可不殺；乃有大罪，非終，乃惟眚災，適爾既道極厥辜，時乃不可殺」。蓋眚者，過誤也；終者，故意也。小罪而故意犯之，是心明知故犯，情無可恕，故不可不殺；大罪而無心犯之，是出於偶然，情有可矜，故時乃不可殺。此以心迹定刑罰輕重之法，後世律令所由設也。</p><p><strong>所出</strong>：《尚書 · 康誥》 — https://zh.wikisource.org/wiki/尚書/康誥</p></article></main></div></div>
