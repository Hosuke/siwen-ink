    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 功烈於民</nav></header><main><article><h1>功烈於民</h1><p>聖王之祀有功烈於民者，非此則不入祀典也。</p><p>聖王之制祭祀，法施於民、以死勤事、以勞定國、能禦大菑、能捍大患，皆功烈於民者也。厲山氏之有天下，其子曰農，能殖百穀，夏之衰也周棄繼之，故祀以為稷。共工氏之子后土能平九州，故祀以為社。帝嚳能序星辰，堯能賞均刑法，舜勤眾事而野死，鯀障洪水而殛死，禹能修鯀之功，黃帝正名百物，顓頊能修之，契為司徒而民成，冥勤其官而水死，湯以寬治民而除虐，文王以文治，武王以武功去民之災。此皆有功烈於民者也。</p><p><strong>所出</strong>：《禮記 · 祭法》 — https://zh.wikisource.org/wiki/禮記/祭法</p></article></main></div></div>
