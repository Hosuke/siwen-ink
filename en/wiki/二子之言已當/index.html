    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 二子之言已當</nav></header><main><article><h1>二子之言已當</h1><p>吳起、商鞅之言皆合時宜，其法皆效，而其人皆不得其死。</p><p>吳起教楚悼王以收封君三世之爵禄，商君教秦孝公以連什伍、明法令。楚不用吳起而削亂，秦行商君法而富強。二子之言也已當矣。</p><p>「已當」者，謂其言切中時弊，其法可以致效也。吳起之言，於楚為當；商君之言，於秦為當。然而吳起被肢解、商鞅受車裂者，何也？大臣苦法而細民惡治也。言當而不見用，用而不獲其死，可為痛哭也已。</p><p><strong>所出</strong>：《韓非子 · 和氏》 — https://zh.wikisource.org/wiki/韓非子/和氏</p></article></main></div></div>
