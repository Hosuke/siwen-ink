    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 兵半用</nav></header><main><article><h1>兵半用</h1><p>賞罰之利出於二塗，則兵半為國用，半為姦利用。</p><p>韓非以賞罰為治國之本，而「利出一空」為無敵之道。言「利出二空者，其兵半用」。利出二空者，賞罰之柄不專於上也。一空利歸於君，則民皆為君用而無二志；二空利分於下，則民有趨避，兵有向背，僅半為國效命耳。此言賞罰必專必信之要也。</p><p><strong>所出</strong>：《韓非子 · 飭令》 — https://zh.wikisource.org/wiki/韓非子/飭令</p></article></main></div></div>
