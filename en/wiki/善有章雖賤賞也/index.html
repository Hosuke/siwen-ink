    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 善有章雖賤賞也</nav></header><main><article><h1>善有章雖賤賞也</h1><p>賞善罰惡，當及時而果斷，不以賤人而廢賞。</p><p>晉文公解曹地以分諸侯，僖公使臧文仲往，宿於重館。重館人告以晉始伯欲固諸侯之勢，促其速行。臧文仲從之，獲地於諸侯為多。反命，文仲為之請賞曰：「地之多也，重館人之力也。臣聞之：『善有章，雖賤賞也；惡有釁，雖貴罰也。』今一言而辟境，其章大矣，請賞之。」乃出而爵之。</p><p><strong>所出</strong>：《國語 · 卷04》 — https://zh.wikisource.org/wiki/國語/卷04</p></article></main></div></div>
