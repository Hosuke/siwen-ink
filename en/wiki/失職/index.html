    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 失職</nav></header><main><article><h1>失職</h1><p>祭祀之職，夫人所當盡，不得廢弛。</p><p>《采蘩》毛詩序云「夫人不失職」，此「失職」之始見也。</p><p>按《鄉飲酒》鄭注所言，失職者，謂夫人幫助國君舉行祭祀之職責。《詩》之四家——魯、齊、韓、毛——解釋皆同，無有異義。</p><p>是詩以采蘩為起興，言夫人終日忙碌於祭祀之事，采蘩以供籩豆，被髮以飾威儀，夙夜在公，不敢怠惰。此正不失職之謂也。</p><p><strong>所出</strong>：《詩經 · 采蘩》 — https://zh.wikisource.org/wiki/詩經/采蘩</p></article></main></div></div>
