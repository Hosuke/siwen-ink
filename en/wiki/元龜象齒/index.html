    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 元龜象齒</nav></header><main><article><h1>元龜象齒</h1><p>龜甲象牙，遠方之至寶，以見朝貢之盛。</p><p>[[元龜象齒]]，第八章之句也。元龜者，大龜也，古人以龜甲卜吉凶，象齒可以為器，皆遠方之至寶。淮夷處江海之間，厥貢如此。詩人詳列其方物，以見[[來獻其琛]]之盛，見德化之感人，遠人皆來服也。</p><p><strong>所出</strong>：《詩經 · 泮水》 — https://zh.wikisource.org/wiki/詩經/泮水</p></article></main></div></div>
