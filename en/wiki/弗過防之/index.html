    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 弗過防之</nav></header><main><article><h1>弗過防之</h1><p>九三爻辭。弗過而防之，否則凶也。</p><p>九三以陽處陽，弗過乎剛，乃自恃而不防。從或戕之，言過而不防，則人或從而害之，其凶如何，言凶不可言也。戒在過防，不可忽也。</p><p><strong>所出</strong>：《周易 · 小過》 — https://zh.wikisource.org/wiki/周易/小過</p></article></main></div></div>
