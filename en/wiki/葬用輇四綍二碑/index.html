    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 葬用輇四綍二碑</nav></header><main><article><h1>葬用輇四綍二碑</h1><p>諸侯葬用柩車，設四繩二碑，規制隆殺各有差等。</p><p>君葬用輇，四綍二碑，御棺用羽葆。大夫葬用輇，二綍二碑，御棺用茅。士葬用國車。二綍無碑，比出宮，御棺用功布。凡封，用綍去碑負引，君封以衡，大夫士以咸。君命毋嘩，以鼓封；大夫命毋哭；士哭者相止也。</p><p><strong>所出</strong>：《禮記 · 喪大記》 — https://zh.wikisource.org/wiki/禮記/喪大記</p></article></main></div></div>
