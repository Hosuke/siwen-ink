    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 無俾正反</nav></header><main><article><h1>無俾正反</h1><p>勿使正道傾覆也。</p><p>「正反」者，正道傾覆之謂也。繾綣者，姦宄膠固不去之貌。姦人不去，則善政不行；善政不行，則正道日微；正道日微，則國隨之矣。是以去姦者，正所以存正也。</p><p><strong>所出</strong>：《詩經 · 民勞》 — https://zh.wikisource.org/wiki/詩經/民勞</p></article></main></div></div>
