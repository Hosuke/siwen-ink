    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 各復其根</nav></header><main><article><h1>各復其根</h1><p>萬物終歸本根，渾沌不知，乃合於道。</p><p>鴻蒙語雲將以治人之道曰：「浮遊不知所求，猖狂不知所往，遊者鞏掌，以觀无妄。」又云：「亂天之經，逆物之情，玄天弗成。」欲治天下者，當使萬物各復其根。各復其根而不知，渾渾沌沌，終身不離；若彼知之，乃是離之。無問其名，無闚其情，物故自生。此言萬物各有其自然之性，循其本根而不加人為之擾，則天下自正。</p><p><strong>所出</strong>：《莊子 · 在宥》 — https://zh.wikisource.org/wiki/莊子/在宥</p></article></main></div></div>
