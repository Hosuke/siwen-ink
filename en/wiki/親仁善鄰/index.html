    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 親仁善鄰</nav></header><main><article><h1>親仁善鄰</h1><p>治國之寶，不可失也</p><p>夏，盟于艾，始平于齊也。五月庚申，鄭伯侵陳，大獲。</p><p>往歲，鄭伯請成于陳，陳侯不許。五父諫曰：「親仁善鄰，國之寶也。君其許鄭。」陳侯曰：「宋、衛實難，鄭何能為？」遂不許。</p><p>君子曰：「善不可失，惡不可長，其陳桓公之謂乎？長惡不悛，從自及也。雖欲救之，其將能乎？」</p><p><strong>所出</strong>：《春秋左氏傳 · 隱公》 — https://zh.wikisource.org/wiki/春秋左氏傳/隱公</p></article></main></div></div>
