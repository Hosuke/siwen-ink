    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 虞氏被滅</nav></header><main><article><h1>虞氏被滅</h1><p>以腐鼠辱俠客，俠客聚衆以滅其家。</p><p>[[虞氏]]者，[[梁]]之富人也，家充殷盛，錢帛無量，財貨無訾。登高樓，臨大路，設樂陳酒，擊博樓上。俠客相隨而行，樓上博者射，明瓊張中，反兩㯓魚而笑，飛鳶適墜其腐鼠而中之。俠客相與言曰：「虞氏富樂之日久矣，而常有輕易人之志。吾不侵犯之，而乃辱我以腐鼠。此而不報，無以立慬於天下。請與若等戮力一志，率徒屬必滅其家爲等倫。」皆許諾。至期日之夜，聚衆積兵以攻虞氏，大滅其家。</p><p><strong>所出</strong>：《列子 · 說符篇》 — https://zh.wikisource.org/wiki/列子/說符篇</p></article></main></div></div>
