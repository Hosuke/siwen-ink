    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 任智則君欺</nav></header><main><article><h1>任智則君欺</h1><p>智士未必可信，任之以勢則必欺君。</p><p>智士者未必信也，爲多其智，因惑其信。以智士之計，處乘勢之資而爲其私急，則君必欺焉。是以[[任人以事]]之道，不可無術。</p><p><strong>所出</strong>：《韓非子 · 八說》 — https://zh.wikisource.org/wiki/韓非子/八說</p></article></main></div></div>
