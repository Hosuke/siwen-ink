    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 外國歸義</nav></header><main><article><h1>外國歸義</h1><p>外族歸附義從者，亦得封侯。</p><p>孝惠訖孝景間，封者九十有餘，其一類曰外國歸義。[[弓高侯]]韓頹當以匈奴相國降，[[襄成侯]]韓嬰以匈奴相國降，皆故韓王信之子孫，以羈縻之恩，納之於侯。</p><p><strong>所出</strong>：《史記 · 惠景閒矦者年表》 — https://zh.wikisource.org/wiki/史記/惠景閒矦者年表</p></article></main></div></div>
