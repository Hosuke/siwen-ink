    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 漏釜之喻</nav></header><main><article><h1>漏釜之喻</h1><p>以漏釜無竭喻無道之君虐民自攻，終必崩潰。</p><p>無道之君，內削其民，以為攻伐。管子喻之曰：「辟猶漏釜，豈能無竭？」言釜底有漏，縱加水而不已，終必竭亡。猶虐民以為征伐者，取竭於下而不知止，其亡無日矣。</p><p><strong>所出</strong>：《管子 · 第33篇四稱》 — https://zh.wikisource.org/wiki/管子/第33篇四稱</p></article></main></div></div>
