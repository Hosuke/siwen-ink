    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 焦螟</nav></header><main><article><h1>焦螟</h1><p>物性各異，志趣不同，不可強之以同一趨向。</p><p>焦螟之卑棲，不肯為銜鼠之唳天；玄蟬之潔饑，不願為蜣螂之穢飽。</p><p>物之情異，則趨向殊。焦螟以卑棲為安，則不以銜鼠之唳為高；玄蟬以潔饑為貴，則不以蜣螂之飽為利。是以御寇不納鄭陽之惠，曾叁不美晉楚之寶。抱其一節，守其攸好，不以外物而易其守也。賢者之立操亦然，達則行之，窮則晦處，時屈則不敢忘其伸，時伸則不敢渝其屈。</p><p><strong>所出</strong>：《抱朴子 · 卷39》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷39</p></article></main></div></div>
