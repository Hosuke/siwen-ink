    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 堯舜放逐骨肉，周公殺管蔡</nav></header><main><article><h1>堯舜放逐骨肉，周公殺管蔡</h1><p>以堯舜周公之事，明帝王不以私害公之義。</p><p>上聞民謠，乃歎曰：「堯舜放逐骨肉，周公殺管蔡，天下稱聖。何者？不以私害公。」</p><p>蓋堯舜之世，天下為公；骨肉之親，苟害於理，亦在必放。管蔡之誅，非周公之忍也，乃為宗廟社稷計也。是以聖人行權，義重而恩輕；匹夫執禮，恩篤而義薄。[[堯舜禹湯文武之道]]之所以能一天下者，正以能絕私情而立公法也。</p><p><strong>所出</strong>：《史記 · 卷118》 — https://zh.wikisource.org/wiki/史記/卷118</p></article></main></div></div>
