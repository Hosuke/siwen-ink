    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 園客妻</nav></header><main><article><h1>園客妻</h1><p>神女也，助園客養華蠶，繭成俱去。</p><p>園客妻者，神女也。園客者，濟陰人也，美姿貌而良色，人多欲以女妻之，客終不娶，常種五色香草，積數十年，服食其實。忽有五色蛾集於香草上，客收而薦之以布，生華蠶焉。</p><p>至蠶時，有一女自來助客養蠶，亦以香草飼之，蠶女養蠶既壯，得繭百二十枚，繭大如甕，每一繭繰六七日乃盡。繰訖，此女與園客俱去。濟陰今有華蠶之祠宇焉。</p><p><strong>所出</strong>：《墉城集仙錄 · 卷06》 — https://zh.wikisource.org/wiki/墉城集仙錄/卷06</p></article></main></div></div>
