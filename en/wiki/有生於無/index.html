    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 有生於無</nav></header><main><article><h1>有生於無</h1><p>天下萬物皆生於虛無。</p><p>有生於無，實出於虛。天下為之圈，則名實同居。道生於無形，光生於無形之祖，水生於無形之孫。是故無形者，物之大祖；無音者，聲之大宗。視之不見其形，聽之不聞其聲，循之不得其身，然而無形而有形生焉，無聲而五音鳴焉，無味而五味形焉，無色而五色成焉。此道之玄德，天地之根柢也。</p><p><strong>所出</strong>：《淮南子 · 原道訓》 — https://zh.wikisource.org/wiki/淮南子/原道訓</p></article></main></div></div>
