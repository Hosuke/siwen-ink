    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 有聞無聲</nav></header><main><article><h1>有聞無聲</h1><p>行師肅穆，聞其名而未嘗有囂雜之聲也。</p><p>「有聞無聲」者，師之旅帥，肅肅而行，[[徒御不驚]]，[[蕭蕭馬鳴]]，其名可聞，其聲不譁。詩言「之子于征，有聞無聲」，美君子之行師，整齊而不喧，儼然有制也。[[允矣君子，展也大成]]，此之謂矣。</p><p><strong>所出</strong>：《詩經 · 車攻》 — https://zh.wikisource.org/wiki/詩經/車攻</p></article></main></div></div>
