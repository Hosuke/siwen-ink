    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 龍蛇之蟄，以存身也</nav></header><main><article><h1>龍蛇之蟄，以存身也</h1><p>蟄者潛藏，非為怯也，乃保身全身之道。</p><p>《易傳》復以龍蛇為喻。龍蛇之蟄伏於深淵，非遂忘世也，乃所以存身以待時也。君子值有事之秋，知不可為，則斂身而退，若龍蛇之蟄然。蟄非永晦，乃潛以保真、待時而動者也。聖人體此，知屈伸之時，蟄而不失其貞，此全身遠害之道也。</p><p><strong>所出</strong>：《周易 · 繫辭下》 — https://zh.wikisource.org/wiki/易傳/繫辭下</p></article></main></div></div>
