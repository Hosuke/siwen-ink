    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 民無常勇亦無常怯</nav></header><main><article><h1>民無常勇亦無常怯</h1><p>勇怯出於虛實，實則勇，虛則怯，此兵之精微也。</p><p>夫民無常勇，亦無常怯。有氣則實，實則勇；無氣則虛，虛則怯。怯勇虛實，其由甚微，不可不知。勇則戰，怯則北。戰而勝者，戰其勇者也；戰而北者，戰其怯者也。</p><p>巧拙之所以相過，以益民氣與奪民氣，以能鬭眾與不能鬭眾。軍雖大，卒雖多，無益於勝。夫眾之為福也大，其為禍也亦大。善用兵者，諸邊之內，莫不與鬭，雖廝輿白徒，方數百里，皆來會戰，勢使之然也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷八》 — https://zh.wikisource.org/wiki/呂氏春秋/卷八</p></article></main></div></div>
