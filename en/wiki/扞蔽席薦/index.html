    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 扞蔽席薦</nav></header><main><article><h1>扞蔽席薦</h1><p>喻韓事秦如屏障之扞禦、蓆墊之供奉，卑微無異郡縣。</p><p>韓事秦三十餘年，出則為扞蔽，入則為蓆薦。秦特出銳師取地而韓隨之，怨懸於天下，功歸於强秦。且夫韓入貢職，與郡縣無異也。韓之地不能滿千里，而所以得與諸侯班位於天下者，以世世相教事秦之力也。</p><p><strong>所出</strong>：《韓非子 · 存韓》 — https://zh.wikisource.org/wiki/韓非子/存韓</p></article></main></div></div>
