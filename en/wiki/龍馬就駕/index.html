    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 龍馬就駕</nav></header><main><article><h1>龍馬就駕</h1><p>龍馬負圖而出，君王御之以行治道。</p><p>龍馬就駕者，[[明君御時]]，取象坤卦牝馬之貞，以柔馭剛，以德化民。明君馭時，龍馬就駕而天下治。治身者亦取此象，以神馭氣，歸乎虛無之域。</p><p><strong>所出</strong>：《周易參同契 · 16章》 — https://zh.wikisource.org/wiki/周易參同契/16章</p></article></main></div></div>
