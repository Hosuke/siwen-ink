    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 天下之良寶</nav></header><main><article><h1>天下之良寶</h1><p></p><p>墨子駁世俗所謂珍寶之非是。世人皆以和氏之璧、隋侯之珠、三棘六異為諸侯之所謂良寶，然墨子以為此等之物，不能富國家、衆人民、治刑政、安社稷，故非真寶。</p><p>墨子曰：「所為貴良寶者，為其可以利民也。」和氏之璧、隋侯之珠、三棘六異不可以利人，是非天下之良寶也。今用義為政於國家，國家必富，人民必衆，刑政必治，社稷必安。故義者，天下之良寶也。</p><p>此論與[[愛人為大]]之旨相通，而以[[興利除害]]為衡量萬物之準繩。物質之珍，終不及道義之貴。</p></article></main></div></div>
