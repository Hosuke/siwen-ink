    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 宅爾邑</nav></header><main><article><h1>宅爾邑</h1><p>許殷民仍居其土，安其居，繼其業。</p><p>周公之誥殷多士，其末章反覆丁寧，歸于「宅爾邑」一語。言殷士尚保有其土田，尚寧其居止。克敬者，天畀矜而使之有年；不敬者，不特有罰，且失其土。周人新造東都，欲以容四國之民，而殷士亦在其中，故特申此命以安其心。宅爾邑者，非徒居之，兼使之安；繼爾居者，非徒止之，兼使之續也。</p><p><strong>所出</strong>：《尚書 · 多士》 — https://zh.wikisource.org/wiki/尚書/多士</p></article></main></div></div>
