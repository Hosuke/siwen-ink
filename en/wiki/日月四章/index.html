    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 日月四章</nav></header><main><article><h1>日月四章</h1><p>詩分四章，章各六句，為怨詩之定制</p><p>《詩經》〈日月〉之詩，四章，章六句。凡二十四句，句句言日月之象，句句寓怨慕之情。四章之中，「日居月諸」與「胡能有定」各章皆見，而其餘詞句遞有增變，由不見荅、以至相好、以至斥其無良、以至引父母之恩，漸層深遠，怨情愈甚。六句一章之制，亦見詩章之謹嚴，非漫然為之也。</p><p><strong>所出</strong>：《詩經 · 日月》 — https://zh.wikisource.org/wiki/詩經/日月</p></article></main></div></div>
