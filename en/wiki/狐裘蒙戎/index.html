    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 狐裘蒙戎</nav></header><main><article><h1>狐裘蒙戎</h1><p>刺衞臣衣盛服而無救鄰之心</p><p>「狐裘蒙戎」者，《詩·邶風》刺衞臣之辭也。</p><p>《旄丘》三章：「狐裘蒙戎，匪車不東，叔兮伯兮，靡所與同。」毛傳：「狐裘蒙戎，言衞大夫之盛服也。」鄭玄箋：「大夫狐裘，蒙戎以言盛服也。」</p><p>狐裘，貴者之服；蒙戎，毛盛之貌。黎人流離失所，而衞大夫盛服自娛，其車不肯東向以救黎人，是不以救鄰國為事也。末句「靡所與同」，言其心不以黎人之難為同患也。</p><p>後世以「蒙戎」形容毛物之盛，亦作「蒙茸」。</p><p><strong>所出</strong>：《詩經 · 旄丘》 — https://zh.wikisource.org/wiki/詩經/旄丘</p></article></main></div></div>
