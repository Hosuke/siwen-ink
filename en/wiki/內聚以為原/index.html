    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 內聚以為原</nav></header><main><article><h1>內聚以為原</h1><p>內聚精氣以為泉源，則表裏遂通，四肢堅固。</p><p>凡心之刑，過知先王，是故內聚以為原。泉之不竭，表裏遂通；泉之不涸，四支堅固。能令用之，被服四固。</p><p>心之法度，過於智巧則失其本。故聖人務積聚精氣以為泉源，如地中有泉焉，混混不竭，故表裏遂通而無所窒礙；又如泉之不涸，故四肢強固而有所倚任。守是道以治身，則筋肕而骨強；守是道以治國，則四境帖然而無外侮。</p><p>是故聖人用之，被服四固，無往而不自得也。</p><p><strong>所出</strong>：《管子 · 第37篇心術下》 — https://zh.wikisource.org/wiki/管子/第37篇心術下</p></article></main></div></div>
