    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 父歸兄歸獨子歸養</nav></header><main><article><h1>父歸兄歸獨子歸養</h1><p>信陵君勒兵選鋒，令父子兄弟同在軍中者各歸，獨子亦歸養。</p><p>至鄴，公子矫魏王令代晉鄙。晉鄙合符，疑之。公子乃令朱亥椎殺晉鄙，遂將晉鄙軍。勒兵下令軍中曰：「父子俱在軍中，父歸；兄弟俱在軍中，兄歸；獨子無兄弟，歸養。」得選兵八萬人，進兵擊秦軍。秦軍解去，遂救邯鄲，存趙。</p><p><strong>所出</strong>：《史記 · 卷077》 — https://zh.wikisource.org/wiki/史記/卷077</p></article></main></div></div>
