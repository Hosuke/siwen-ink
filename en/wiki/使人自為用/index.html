    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 使人自為用</nav></header><main><article><h1>使人自為用</h1><p>君人者使人，使其自為用而不使為我用，此古者君使臣之要義也。</p><p>田子曰：「人皆自為，而不能為人。故君人者之使人，使其自為用，而不使為我用。」魏下先生曰：「善哉，田子之言！古者君之使臣，求不私愛於己，求顯忠於己。而居官者必能，臨陣者必勇。祿賞之所勸，名法之所齊，不出於己心，不利於己身。語曰：『祿薄者，不可與經亂；賞輕者，不可於入難。』此處上者所宜慎者也。」</p><p><strong>所出</strong>：《尹文子 · 佚文》 — https://zh.wikisource.org/wiki/尹文子/佚文</p></article></main></div></div>
