    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 王者之人</nav></header><main><article><h1>王者之人</h1><p>王者之人，飾動以禮義，聽斷以類，明振毫末，舉措應變而不窮。</p><p>彼國錯者，非封焉之謂也，何法之道，誰子之與也。故道王者之法，與王者之人為之，則亦王；道霸者之法，與霸者之人為之，則亦霸；道亡國之法，與亡國之人為之，則亦亡。故與積禮義之君子為之則王，與端誠信全之士為之則霸，與權謀傾覆之人為之則亡。</p><p><strong>所出</strong>：《荀子 · 王霸篇》 — https://zh.wikisource.org/wiki/荀子/王霸篇</p></article></main></div></div>
