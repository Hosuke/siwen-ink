    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 興寧</nav></header><main><article><h1>興寧</h1><p>晉哀帝年號，乙丑歲，眾真降於楊羲。</p><p>[[興寧]]，晉哀帝年號。[[太微玄清左夫人]]與太元真人眾真，[[興寧]]三年乙丑十二月十七日，降於句曲金壇真人楊羲之室。[[東華上房靈妃]]亦同夜降。[[紫微王夫人]]以是歲六月降楊羲家，九月六日又降，十月十七日又與眾真降。皆上清修真之事，述之詳矣。</p><p><strong>所出</strong>：《墉城集仙錄 · 卷03》 — https://zh.wikisource.org/wiki/墉城集仙錄/卷03</p></article></main></div></div>
