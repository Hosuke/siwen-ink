    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 立法非所以備曾、史</nav></header><main><article><h1>立法非所以備曾、史</h1><p>法為庸主設，不為聖人備。</p><p>故設柙，非所以備鼠也，所以使怯弱能服虎也；立法，非所以備曾、史也，所以使庸主能止盜跖也；為符，非所以豫尾生也，所以使眾人不相謾也。不獨恃比干之死節，不幸亂臣之無詐也；恃怯之所能服，握庸主之所易守。</p><p><strong>所出</strong>：《韓非子 · 守道》 — https://zh.wikisource.org/wiki/韓非子/守道</p></article></main></div></div>
