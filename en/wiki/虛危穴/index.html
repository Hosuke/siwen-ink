    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 虛危穴</nav></header><main><article><h1>虛危穴</h1><p>任督二脈交會之處，天地陽氣往來之門，人身陰陽變化之關鍵。</p><p>虛危穴，一名地戶，又名生死窟。其穴在任督二脈之中，上通天谷，下達湧泉。翠虛篇云：「有一子母分胎路，妙在尾箕斗牛女。」此穴干係最大，系人生死岸頭。參同契云「築固靈株」「拘束禁門」，黃庭經云「閉塞命門保玉都」「閉了精路可長活」，皆指此穴。真陽既生，必由此穴經過，若閉塞堅固，攻之不開，則驅回尾閭，連焰起入天衢。是故仙家重視此穴，以其為陰陽交關、水火所會之地。</p><p><strong>所出</strong>：《性命圭旨 · 利集》 — https://zh.wikisource.org/wiki/性命圭旨/利集</p></article></main></div></div>
