    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 賢人悲寓世之倏忽</nav></header><main><article><h1>賢人悲寓世之倏忽</h1><p>賢人感人生倏忽，故不自懈而勤於進學行道。</p><p>《抱朴子》以賢人之所以汲汲於學者，由其感知生命之倏忽也：「以是賢人悲寓世之倏忽，疾泯沒之無稱；感朝聞之弘訓，悟通微之無類；懼將落之明戒，覺罔念之作狂；不飽食以終日，不棄功於寸陰；鑒逝川之勉誌，悼過隙之電速。」</p><p>故割遊情之不急，損人間之末務，知[[徒思之無益]]，遂振策於聖途。學以聚之，問以辯之，進德修業，[[溫故知新]]。</p><p><strong>所出</strong>：《抱朴子 · 卷03》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷03</p></article></main></div></div>
