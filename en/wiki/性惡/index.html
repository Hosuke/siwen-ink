    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 人之性惡</nav></header><main><article><h1>人之性惡</h1><p>荀子以為人性本惡，善者皆由人為也。</p><p>人之性惡，其善者僞也。[[性善]]之言，以為人皆有惻隱羞惡之心，荀子則反是，謂人生而有好利、疾惡、耳目聲色之欲，順是而行，則爭奪殘賊淫亂生而辭讓忠信禮義亡。必待師法之化、禮義之道，然後可以歸於治世。是故性惡之說，與孟子[[性善]]相對，別為儒學一派。</p><p><strong>所出</strong>：《荀子 · 性惡篇》 — https://zh.wikisource.org/wiki/荀子/性惡篇</p></article></main></div></div>
