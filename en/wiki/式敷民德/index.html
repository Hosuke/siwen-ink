    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 式敷民德</nav></header><main><article><h1>式敷民德</h1><p>施德於民，永懷一心。</p><p>盤庚勉臣工以德義布於百姓，使各安其業，永保一心也。</p><p>古我先王，迪于高德，嘉績于邦。今朕沖人，承天命，撫萬民，式敷文德，以永凝新邑之化。嗚呼！爾尚敬恭朕命，無戲怠，共建大命。茲朕敷心腹腎腸，告爾百姓：朕不肩好貨，敢共生生；鞠人謀人，敘欽是欽。無總貨寶，生生自庸。式敷民德，永肩一心。</p><p>此文述盤庚告誡臣工，當以德義廣施於民，使民懷一心歸附，以成中興之治也。</p><p><strong>所出</strong>：《尚書 · 盤庚下》 — https://zh.wikisource.org/wiki/尚書/盤庚下</p></article></main></div></div>
