    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 一情冥為聖人</nav></header><main><article><h1>一情冥為聖人</h1><p>情之冥者為聖人，善者為賢人，惡者為小人。</p><p>一情冥為聖人，一情善為賢人，一情惡為小人。一情冥者，自有之無，不可得而示。一情善惡者，自無起有，不可得而秘。一情善惡為有知，惟動物有之。一情冥者為無知，溥天之下，道無不在。</p><p><strong>所出</strong>：《關尹子 · 1》 — https://zh.wikisource.org/wiki/關尹子/1</p></article></main></div></div>
