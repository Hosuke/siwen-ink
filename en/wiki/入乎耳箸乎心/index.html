    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 入乎耳，箸乎心</nav></header><main><article><h1>入乎耳，箸乎心</h1><p>君子之學，入於耳而著於心，布於四體，形於動靜；小人之學，入乎耳，出乎口，相去四寸而已。</p><p>君子之學也，入乎耳，箸乎心，布乎四體，形乎動靜，端而言，蝡而動，一可以為法則。小人之學也，入乎耳，出乎口。口耳之間則四寸耳，曷足以美七尺之軀哉！</p><p><strong>所出</strong>：《荀子 · 勸學篇》 — https://zh.wikisource.org/wiki/荀子/勸學篇</p></article></main></div></div>
