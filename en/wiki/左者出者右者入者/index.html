    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 左者出者也；右者入者也</nav></header><main><article><h1>左者出者也；右者入者也</h1><p>左右出入之義，各止其所，不相傷也。</p><p>左者，出者也；右者，入者也。出者而不傷人，入者自傷也。</p><p><strong>所出</strong>：《管子 · 第38篇白心》 — https://zh.wikisource.org/wiki/管子/第38篇白心</p></article></main></div></div>
