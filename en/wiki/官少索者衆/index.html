    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 官少而索者衆</nav></header><main><article><h1>官少而索者衆</h1><p>因能授祿錄功與官</p><p>桓公謂管仲曰：「官少而索者衆，寡人憂之。」管仲曰：「君無聽左右之請，因能而受祿，錄功而與官，則莫敢索官。君何患焉？」</p><p>管仲對桓公之問，謂當因能授祿、錄功與官，則人不敢苟索官職。此救官少之弊之道也。</p><p><strong>所出</strong>：《韓非子 · 外儲說左下》 — https://zh.wikisource.org/wiki/韓非子/外儲說左下</p></article></main></div></div>
