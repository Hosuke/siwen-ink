    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 德將無醉</nav></header><main><article><h1>德將無醉</h1><p>以德行自律，則自然不醉，非強制所能致。</p><p>德將無醉者，以德自律則不致於醉也。原文云：「越庶國，飲惟祀，德將無醉。」言諸侯之國，饮酒必於祭祀之時，且以德行扶將扶持之，自然不醉。誡人臣事君、治民，當以德義為本，非專恃乎禁令；苟能以德自將，則酒不能亂其心性矣。</p><p><strong>所出</strong>：《尚書 · 酒誥》 — https://zh.wikisource.org/wiki/尚書/酒誥</p></article></main></div></div>
