    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 赦死宥刑威淫</nav></header><main><article><h1>赦死宥刑威淫</h1><p>赦死罪、宥刑罰，乃致威權放縱之由。</p><p>故不赦死，不宥刑，赦死宥刑，是謂威淫。社稷將危，國家偏威。</p><p><strong>所出</strong>：《韓非子 · 愛臣》 — https://zh.wikisource.org/wiki/韓非子/愛臣</p></article></main></div></div>
