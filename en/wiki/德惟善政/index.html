    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 德惟善政，政在養民</nav></header><main><article><h1>德惟善政，政在養民</h1><p>德之美，莫過於善政；善政之要，在乎養民。</p><p>禹之論治道也，曰：「德惟善政，政在養民。水、火、金、木、土、穀，惟修；正德、利用、厚生，惟和。九功惟敘，九敘惟歌。」</p><p>[[德惟善政]]者，言德之美莫大於善政，善政之要莫先於養民也。欲養民者，必修六府以裕民之源，正三德以範民之行。三者和備，九功皆敘，歌之以九歌，則民樂其業而政成矣。</p><p>此聖人所以兼[[水火金木土穀]]而理之，致中和之用也。</p><p><strong>所出</strong>：《尚書 · 大禹謨》 — https://zh.wikisource.org/wiki/尚書/大禹謨</p></article></main></div></div>
