    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 郤至勇而知禮</nav></header><main><article><h1>郤至勇而知禮</h1><p>郤至臨陳而勇，見王必下奔；及楚王使人問之，免冑而聽命，不失禮度，君子是以稱之。</p><p>鄢之戰，郤至以韎韋之跗注，三逐楚平王卒，見王必下奔退戰。王使工尹襄問之以弓，曰：「方事之殷也，有韎韋之跗注，君子也，屬見不穀而下，無乃傷乎？」郤至甲冑而見客，免冑而聽命，曰：「君之外臣至，以寡君之靈，閒蒙甲冑，不敢當拜君命之辱，為使者故，敢三肅之。」</p><p>君子曰：勇以知禮。</p><p><strong>所出</strong>：《國語 · 卷12》 — https://zh.wikisource.org/wiki/國語/卷12</p></article></main></div></div>
