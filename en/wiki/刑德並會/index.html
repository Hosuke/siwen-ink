    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 刑德並會</nav></header><main><article><h1>刑德並會</h1><p>言刑與德相遇於卯酉，二氣會合而萬物相見歡喜。</p><p>刑德並會，相見歡喜。</p><p>刑者陰氣肅殺，德者陽氣生長，二者相遇於卯酉之位，如賓主之相見，歡然而喜。蓋陰陽和則萬物成，刑德會則百官肅，此天道之協應也。</p><p><strong>所出</strong>：《周易參同契 · 29章》 — https://zh.wikisource.org/wiki/周易參同契/29章</p></article></main></div></div>
