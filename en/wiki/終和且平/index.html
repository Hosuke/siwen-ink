    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 終和且平</nav></header><main><article><h1>終和且平</h1><p>和平者，福之所積也；神佑之，人宜之。</p><p>「神之聽之，終和且平」，[[詩經 · 伐木]]之句也。和者，萬事之和諧；平者，諸事之安寧。言神明聽從善人之所為，使其終獲和平之福。</p><p>和平者，非一朝一夕之功，必積之以歲月，養之以德行。詩人以此祝頌，謂能和且平者，神明必佑之。是以君子脩身為本，積善成德，而福祿自臻矣。</p><p><strong>所出</strong>：《詩經 · 伐木》 — https://zh.wikisource.org/wiki/詩經/伐木</p></article></main></div></div>
