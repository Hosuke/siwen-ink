    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 見末悟本</nav></header><main><article><h1>見末悟本</h1><p>讀悟真篇，當見末而悟本，捨妄以從真。</p><p>[[悟真篇]]末序云：「所期同志者，覽之則見末而悟本，捨妄以從真。」又云：「達本明性之道盡於此矣。」全書之旨，在使學者由文字之末，悟道之本；捨旁門之妄，從金丹之真。此[[悟真篇]]命名之意，所以垂教後世者也。</p><p><strong>所出</strong>：《悟真篇》 — https://zh.wikisource.org/wiki/悟真篇</p></article></main></div></div>
