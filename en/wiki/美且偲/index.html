    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 美且偲</nav></header><main><article><h1>美且偲</h1><p>美貌與才智兼稱，君子多材之謂也。</p><p>「其人美且偲」，《說文》「偲，彊力也」，或云才智過人。較前二章之[[美且仁]]、[[美且鬈]]，此則兼及才能。[[美]]之一字貫通三章，而「仁」「鬈」「偲」三者遞進：仁者心德，鬈者形儀，偲者才智，合之而君子之全美備矣。</p><p><strong>所出</strong>：《詩經 · 盧令》 — https://zh.wikisource.org/wiki/詩經/盧令</p></article></main></div></div>
