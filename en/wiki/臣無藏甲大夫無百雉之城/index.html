    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 臣無藏甲大夫無百雉之城</nav></header><main><article><h1>臣無藏甲大夫無百雉之城</h1><p>孔子建議削弱大夫城堡以強公室。</p><p>定公十三年夏，孔子言於定公曰：「臣無藏甲，大夫毋百雉之城。」使仲由為季氏宰，將墮三都。此孔子欲弱大夫之兵以強公室之策也。</p><p><strong>所出</strong>：《史記 · 卷047》 — https://zh.wikisource.org/wiki/史記/卷047</p></article></main></div></div>
