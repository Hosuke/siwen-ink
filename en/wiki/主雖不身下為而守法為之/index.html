    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 主雖不身下為而守法為之</nav></header><main><article><h1>主雖不身下為而守法為之</h1><p>明主操術任臣，不躬親庶事，但守法可也</p><p>明主操術任臣下，使羣臣效其智能，進其長技。智者效其計，能者進其功，以前言督後事所效。張官任吏治民，案法試課成功，守法而法之，身無煩勞而分職。
<strong>所出</strong>：《管子 · 第67篇明法解》 — https://zh.wikisource.org/wiki/管子/第67篇明法解</p></article></main></div></div>
