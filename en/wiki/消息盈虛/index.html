    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 消息盈虛</nav></header><main><article><h1>消息盈虛</h1><p>天道消長盈虛，迭為終始，君子尚之，乃知進退存亡之正。</p><p>《剝》之彖曰：「君子尚消息盈虛，天行也。」</p><p>消息者，消而生息；盈虛者，盈而轉虛。天地之道，寒暑往來，晝夜迭更，無有盈滿而不虛者，無有消亡而不息者。此天之行也，自然之理也。</p><p>君子觀此，則知時之盛衰不可以力爭，時當剝也則止，時當復也則作。進而不驕，退而不懼，盈而不矜，虛而不餒。此所以不失其正也。</p><p>故《剝》之象「山附地上」，山高而地厚承之，厚下以安宅，乃尚消息盈虛之實用耳。</p><p><strong>所出</strong>：《周易 · 剝》 — https://zh.wikisource.org/wiki/周易/剝</p></article></main></div></div>
