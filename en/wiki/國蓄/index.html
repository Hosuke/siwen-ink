    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 國蓄</nav></header><main><article><h1>國蓄</h1><p>君當守其有餘以制不足，使民無累於上。</p><p>人君挾其食，守其用，據有餘而制不足，故民無不累於上。</p><p>夫五穀者，萬物之主也。穀貴則萬物必賤，穀賤則萬物必貴。兩者為敵，則不俱平。故人君御穀物之秩相勝，而操事於其不平之閒，萬民無籍，而國利歸於君也。</p><p>故大賈蓄家不得豪奪吾民矣。然則何？君養其本謹也。春賦以斂繒帛，夏貸以收秋實，是故民無廢事，而國無失利也。</p><p><strong>所出</strong>：《管子 · 第73篇國蓄》 — https://zh.wikisource.org/wiki/管子/第73篇國蓄</p></article></main></div></div>
