    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 加我數年，五十以學易</nav></header><main><article><h1>加我數年，五十以學易</h1><p>聖人好學之辭。</p><p>[[孔子]]欲學《易》，言加我數年以學之，可無大過。[[易]]者，潔淨精微之書，聖人晚年好之，以期無悔於言行。《史記》稱孔子晚而喜《易》，[[聖人]][[學而不厭]]之實也。</p><p><strong>所出</strong>：《論語 · 述而第七》 — https://zh.wikisource.org/wiki/論語/述而第七</p></article></main></div></div>
