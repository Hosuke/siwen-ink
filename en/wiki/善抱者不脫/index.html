    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 善抱者不脫</nav></header><main><article><h1>善抱者不脫</h1><p>抱道懷德，牢固不脫，永傳於後。</p><p>抱道若抱嬰，固而不解。善抱者，非力制之，乃德之所化、機之所契，故無物得以脫之。抱而不脫，則道脈相傳，祭祀以之永續。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第十七章 善觀》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p><hr><p>抱精神者終不可拔引解脫。抱神、守一，如赤子之守母，未嘗離也。</p><p><strong>所出</strong>：《老子河上公章句 · 修觀》 — https://zh.wikisource.org/wiki/老子河上公章句/德觀</p></article></main></div></div>
