    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 芃芃黍苗</nav></header><main><article><h1>芃芃黍苗</h1><p>黍苗得雨，喻賢才得治道而長也。</p><p>「芃芃黍苗，陰雨膏之」，《下泉》末章之首也。上三章皆言下泉浸害，末章忽轉言黍苗得膏澤之潤，以興賢者得治世而遂其生也。芃芃，茂盛之貌。陰雨者，天澤之洽；膏之者，潤及之也。此與[[春日在魯而愛心生]]之義相類，皆以雨澤喻恩惠普施。</p><p><strong>所出</strong>：《詩經 · 下泉》 — https://zh.wikisource.org/wiki/詩經/下泉</p></article></main></div></div>
