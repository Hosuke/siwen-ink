    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 秦文公夢黃蛇作鄜畤</nav></header><main><article><h1>秦文公夢黃蛇作鄜畤</h1><p>記文公獵於汧渭，夢黃蛇，史敦以為上帝之徵，遂作鄜畤，用三牲郊祭白帝。</p><p>秦襄公既侯十六年，秦文公東獵汧渭之閒，卜居之而吉。文公夢黃蛇自天下屬地，其口止於鄜衍。史敦曰：「此上帝之徵，君其祠之。」於是作鄜畤，用三牲郊祭白帝焉。</p><p>自未作鄜畤也，而雍旁故有吳陽武畤，雍東有好畤，皆廢無祠。或曰：「自古以雍州積高，神明之隩，故立畤郊上帝，諸神祠皆聚云。蓋黃帝時嘗用事，雖晚周亦郊焉。」</p><p><strong>所出</strong>：《史記 · 卷028》 — https://zh.wikisource.org/wiki/史記/卷028</p></article></main></div></div>
