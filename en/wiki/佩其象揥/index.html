    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 佩其象揥</nav></header><main><article><h1>佩其象揥</h1><p>貴人佩象牙之揥，矜夸服飾，慢待善工之女也。</p><p>好人提提，宛然左辟。佩其象揥。</p><p>「象揥」，象牙所作之簪，所以摘發理髮者，貴族之飾也。詩言彼好人既安佚自得，又佩象揥以矜其服飾，見操勞之女而不屑一顧，側身左辟以慢之。</p><p>維是褊心，是以為刺。詩人所以刺者，非止其傲慢，乃刺其褊急之心、以貴忽賤之德焉。</p><p><strong>所出</strong>：《詩經 · 葛屨》 — https://zh.wikisource.org/wiki/詩經/葛屨</p></article></main></div></div>
