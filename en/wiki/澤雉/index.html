    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 澤雉</nav></header><main><article><h1>澤雉</h1><p>野雉十步一啄、百步一飲，不願畜乎樊中，喻自由之樂也</p><p>「澤雉十步一啄，百步一飲，不蘄畜乎樊中。神雖王，不善也。」</p><p>夫樊中之雉，雖粟食無乏，神雖王而安，不知外有天地之廣也。澤中之雉，十步、百步，勞而求食，然悠然自得，無羈絆之苦。以喻養生者，不貴外物之豐而在內心之適；不求安逸之極而在形神之自由。樊籠之養，非不善也，弗若水中之樂也。</p><p><strong>所出</strong>：《莊子 · 養生主》 — https://zh.wikisource.org/wiki/莊子/養生主</p></article></main></div></div>
