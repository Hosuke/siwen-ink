    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 嚴法刻刑</nav></header><main><article><h1>嚴法刻刑</h1><p>二世之用刑日益深刻，李斯迎合以自保，終至羣臣自危也。</p><p>二世皇帝立，以趙高為郎中令。高說二世：「嚴法而刻刑，令有罪者相坐誅，至收族，滅大臣而遠骨肉。」二世然之，更為法律。於是殺大臣蒙毅等，公子十二人僇死咸陽市，十公主矺死於杜，財物沒入縣官，連坐者不可勝數。羣臣諸公子有罪，輒下高令鞠治之。法令誅罰日益刻深，羣臣人人自危，欲畔者眾。</p><p><strong>所出</strong>：《史記 · 卷087》 — https://zh.wikisource.org/wiki/史記/卷087</p></article></main></div></div>
