    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 耗火亡資財</nav></header><main><article><h1>耗火亡資財</h1><p>不明真諦而妄修，徒耗資力終無所成。</p><p>時間多學士，高妙負良材，邂逅不遭遇，耗火亡資財。丹道之失，莫甚於此。學者徒挾高才，不知配合之理、真類之方，妄以意為之，端緒無因緣，度量失操持，擣治羌石，雜煉五金，耗終身之力，竭所用之財，而終無所成。</p><p>耗火者，非徒耗其火也，耗其精神、耗其歲月、耗其貨財也。亡資財者，非僅亡其金帛也，亡其志氣、亡其正法、亡其成道之機也。智者可不慎哉？</p><p><strong>所出</strong>：《周易參同契 · 12章》 — https://zh.wikisource.org/wiki/周易參同契/12章</p></article></main></div></div>
