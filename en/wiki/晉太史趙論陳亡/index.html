    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 晉太史趙論陳亡</nav></header><main><article><h1>晉太史趙論陳亡</h1><p>陳為顓頊之族，陳氏得政於齊，乃卒亡；盛德之後，必百世祀。</p><p>招之殺悼太子也，太子之子名吳，出奔晉。晉平公問太史趙曰：「陳遂亡乎？」對曰：「陳，顓頊之族。陳氏得政於齊，乃卒亡。自幕至于瞽瞍，無違命。舜重之以明德。至於遂，世世守之。及胡公，周賜之姓，使祀虞帝。且盛德之後，必百世祀。虞之世未也，其在齊乎？」</p><p><strong>所出</strong>：《史記 · 卷036》 — https://zh.wikisource.org/wiki/史記/卷036</p></article></main></div></div>
