    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 為籠以守民</nav></header><main><article><h1>為籠以守民</h1><p>不通輕重之術，不可以為籠以守民。</p><p>凡將為國，不通於輕重，不可為籠以守民；不能調通民利，不可以語制為大治。是故萬乘之國，有萬金之賈；千乘之國，有千金之賈。然者何也？國多失利，則臣不盡其忠，士不盡其死矣。</p><p><strong>所出</strong>：《管子 · 第73篇國蓄》 — https://zh.wikisource.org/wiki/管子/第73篇國蓄</p></article></main></div></div>
