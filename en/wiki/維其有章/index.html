    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 維其有章</nav></header><main><article><h1>維其有章</h1><p>君子有文章德行也。</p><p>「我覯之子，維其有章矣。」章者，文采也，德行也。《書》曰「愼儉德，惟懷永圖」，又云「政事惟醇」，章之義兼之。詩言君子有其文章、德行、儀表，是以慶福隨之。</p><p><strong>所出</strong>：《詩經 · 裳裳者華》 — https://zh.wikisource.org/wiki/詩經/裳裳者華</p></article></main></div></div>
