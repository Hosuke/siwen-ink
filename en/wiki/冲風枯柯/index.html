    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 冲風枯柯</nav></header><main><article><h1>冲風枯柯</h1><p>冲風赴林而枯柯先摧，喻邪侵正體因其本先傷。</p><p>由茲以觀，則人之無道，體已素病，因風寒暑濕者以發之耳。苟能令正氣不衰，形神相衛，莫能傷也。</p><p><strong>所出</strong>：《抱朴子 · 卷13》 — https://zh.wikisource.org/wiki/抱朴子/卷13</p></article></main></div></div>
