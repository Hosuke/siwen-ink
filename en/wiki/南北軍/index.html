    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 南北軍</nav></header><main><article><h1>南北軍</h1><p>北軍守宮中，南軍守宮外，皆呂氏將之。</p><p>七月中，高后病甚，乃令趙王呂祿為上將軍，軍北軍；呂王產居南軍。呂太后誡產、祿曰：「高帝已定天下，與大臣約，曰『非劉氏王者，天下共擊之』。今呂氏王，大臣弗平。我即崩，帝年少，大臣恐為變。必據兵衛宮，慎毋送喪，毋為人所制。」</p><p><strong>所出</strong>：《史記 · 卷009》 — https://zh.wikisource.org/wiki/史記/卷009</p></article></main></div></div>
