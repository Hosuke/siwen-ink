    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 孥戮汝</nav></header><main><article><h1>孥戮汝</h1><p>不用命者，不僅殺其身，並殺其子孫，無遺類。</p><p>王曰：「爾不從誓言，予則孥戮汝，罔有攸赦。」</p><p>湯之伐夏，誓於師旅，嚴以示眾。孮戮汝者，謂不從我誓，則誅殺其身，并及其妻子，沒而為奴婢，無有赦宥也。夫師律貴嚴，湯之所以令於下者如此。故曰孮戮者，威以戒眾之辭也。</p><p><strong>所出</strong>：《尚書 · 湯誓》 — https://zh.wikisource.org/wiki/尚書/湯誓</p></article></main></div></div>
