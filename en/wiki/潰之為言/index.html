    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 潰之為言，上下不相得也</nav></header><main><article><h1>潰之為言，上下不相得也</h1><p>蔡潰者，上下離心不相親附之謂。</p><p>公會齊侯、宋公、陳侯、衛侯、鄭伯、許男、曹伯侵蔡。蔡潰。潰之為言，上下不相得也。侵，淺事也。侵蔡而蔡潰，以桓公為知所侵也。不土其地，不分其民，明正也。</p><p>《穀梁》釋「潰」之義：非兵敗散走之謂，乃民心離散、上下不相親附之義。蔡師聞齊桓公之侵而自潰，是其國之內政有虧也。又言「不土其地，不分其民」者，見桓公之正，不乘亂取之也。</p><p><strong>所出</strong>：《春秋穀梁傳 · 僖公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/僖公</p></article></main></div></div>
