    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 千金之裘非一狐之腋</nav></header><main><article><h1>千金之裘非一狐之腋</h1><p>偉大之功，出於眾力之所積。</p><p>太史公贊劉敬、叔孫通之功曰：「千金之裘，非一狐之腋也；臺榭之榱，非一木之枝也；三代之際，非一士之智也。」言一代之治，非一人之所能成，必賴賢才眾智，累積而後備。譬如千金之裘，必集百狐之腋而成；臺榭之榱，必取眾木之枝而成。故創業之君，欲建萬世之安者，不可專恃一己之智，必廣納賢士以成之。</p><p><strong>所出</strong>：《史記 · 卷099》 — https://zh.wikisource.org/wiki/史記/卷099</p></article></main></div></div>
