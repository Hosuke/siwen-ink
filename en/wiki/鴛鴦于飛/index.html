    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 鴛鴦于飛</nav></header><main><article><h1>鴛鴦于飛</h1><p>鴛鴦群飛而以網羅掩之，君子蒙福亦若是焉。</p><p>《鴛鴦》首章云：「鴛鴦于飛，畢之羅之。君子萬年，福祿宜之。」言鴛鴦群飛而過，獵者以畢以羅掩取之，無所遁逸。詩人以興君子享福，猶網羅之及鴛鴦，無有遺漏。畢者，掩取之具；羅者，網也。福祿之來，亦若是已然。詩人美君子受福長久，以鴛鴦被獲為比，義含福慶之無失也。</p><p><strong>所出</strong>：《詩經 · 鴛鴦》 — https://zh.wikisource.org/wiki/詩經/鴛鴦</p></article></main></div></div>
