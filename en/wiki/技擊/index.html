    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 技擊</nav></header><main><article><h1>技擊</h1><p>齊人之短兵伎藝，不足以當大敵。</p><p>齊人隆技擊，得一首者則賜贖錙金，無本賞。事小敵毳則偷可用，事大敵堅則渙然離耳，若飛鳥然，傾側反覆無日，是亡國之兵也。</p><p><strong>所出</strong>：《荀子 · 議兵篇》 — https://zh.wikisource.org/wiki/荀子/議兵篇</p></article></main></div></div>
