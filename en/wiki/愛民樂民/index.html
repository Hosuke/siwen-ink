    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 愛民樂民</nav></header><main><article><h1>愛民樂民</h1><p>意莫高於愛民，行莫厚於樂民；意莫下於刻民，行莫賤於害身。</p><p>叔向問意孰為高、行孰為厚，晏子對以「意莫高於愛民，行莫厚於樂民」。愛民者，惻隱之心也；樂民者，與民同樂也。意出於愛，則政必寬；行成於樂，則民必附。</p><p>又問意孰為下、行孰為賤，對以「意莫下於刻民，行莫賤於害身」。刻民者，殘忍之舉也；害身者，自亡之道也。上下之別，於是可知。</p><p><strong>所出</strong>：《晏子春秋 · 卷四》 — https://zh.wikisource.org/wiki/晏子春秋/卷四</p></article></main></div></div>
