    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 白魚入舟</nav></header><main><article><h1>白魚入舟</h1><p>武王渡河，中流白魚躍入王舟，又有火鳥之瑞，諸侯不期會盟津者八百。</p><p>武王渡河，中流，白魚躍入王舟中，武王俯取以祭。既渡，有火自上復于下，至于王屋，流為烏，其色赤，其聲魄云。是時，諸侯不期而會盟津者八百諸侯。諸侯皆曰：「紂可伐矣。」武王曰：「女未知天命，未可也。」乃還師歸。</p><p><strong>所出</strong>：《史記 · 卷004》 — https://zh.wikisource.org/wiki/史記/卷004</p></article></main></div></div>
