    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 高天萬丈鬼</nav></header><main><article><h1>高天萬丈鬼</h1><p>述高天萬丈鬼之名號、姓族、居處及職司。</p><p>高天萬丈鬼，百鬼中皇姓，係天六方鬼之主，住在太山東南角道水中，諸死人所歸。鬼亦上天對問考罰，月一上。上古以來，已三萬六千餘年，如有三萬六千神與鬼等數。此鬼居太山，死者所歸，每月一上於天考校世人之罪福，與神數略等，故世人宜畏而敬之，知其名者可以辟之。</p><p><strong>所出</strong>：《女青鬼律 · 卷1》 — https://zh.wikisource.org/wiki/女青鬼律/卷1</p></article></main></div></div>
