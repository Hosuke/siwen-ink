    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 周天</nav></header><main><article><h1>周天</h1><p>河車搬運一周，過三關、凝丹砂，小週天之功也。</p><p>週天者，河車搬運一周之名也。小週天，即小河車，乃抽添烹煉之功，所以煉精化氣、凝結丹砂者也。大週天，乃十月胎養之後、聖胎已結，運溫養之功，所以煉氣化神、沖開天門者也。石杏林云：「萬籟風初起，千山月三圓。急須行政生，便可運周天。」此言小週天之候。兩者施功不同，而要皆本於陰陽交媾、坎離會合也。</p><p><strong>所出</strong>：《性命圭旨 · 利集》 — https://zh.wikisource.org/wiki/性命圭旨/利集</p></article></main></div></div>
