    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 天下之結</nav></header><main><article><h1>天下之結</h1><p>誠信者，天下之結也；結者，固也，固則聚，聚則天下定。</p><p>先王貴誠信，誠信者，天下之結也。賢大夫不恃宗至，士不恃外權，坦坦之利不以功，坦坦之備不為用，故存國家，定社稷，在卒謀之間耳。</p><p><strong>所出</strong>：《管子 · 第12篇樞言》 — https://zh.wikisource.org/wiki/管子/第12篇樞言</p></article></main></div></div>
