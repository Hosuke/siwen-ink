    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 樂正子春愛信</nav></header><main><article><h1>樂正子春愛信</h1><p>愛鼎而往，是愛物也；愛信而不往，是愛己也；信重於物。</p><p>齊伐魯，索讒鼎，魯以其鴈往。齊人曰：「鴈也。」魯人曰：「真也。」齊曰：「使樂正子春來，吾將聽子。」魯君請樂正子春，樂正子春曰：「胡不以其真往也？」君曰：「我愛之。」答曰：「臣亦愛臣之信。」</p><p><strong>所出</strong>：《韓非子 · 說林下》 — https://zh.wikisource.org/wiki/韓非子/說林下</p></article></main></div></div>
