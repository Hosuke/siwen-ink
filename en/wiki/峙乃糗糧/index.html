    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 峙乃糗糧</nav></header><main><article><h1>峙乃糗糧</h1><p>征伐之先，必儲軍食</p><p>「甲戌，我惟征徐戎。峙乃糗糧，無敢不逮，汝則有大刑。魯人三郊三遂，峙乃楨榦。甲戌，我惟筑，無敢不供，汝則有無餘刑，非殺。」</p><p>「糗糧」，乾糒也。「峙」，儲也。「逮」，及也。「楨榦」，版築之木。言甲戌之日征徐戎，汝等宜儲糗糧，不及者有大刑。魯人三郊三遂皆在近郭，當峙版築之木；甲戌之日我惟修築城壘，不供者有刑，然止於別刑，不在必殺。師行糧食為先，此兵家之常也。</p><p><strong>所出</strong>：《尚書 · 費誓》 — https://zh.wikisource.org/wiki/尚書/費誓</p></article></main></div></div>
