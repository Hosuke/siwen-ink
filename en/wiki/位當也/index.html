    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 位當也</nav></header><main><article><h1>位當也</h1><p>居得其位，無有過差。</p><p>六四以陰居陰，柔承陽剛，[[位當]]而無過。六四曰「至臨，无咎」，《象》曰「位當也」，言其以柔乘剛而能下接於民，處近君之位而不僭，是以其咎無也。</p><p>夫[[德薄位厚弗交]]者危，[[德厚者流光]]者昌。六四以柔正承陽剛，其義得矣。</p><p><strong>所出</strong>：《周易 · 臨》 — https://zh.wikisource.org/wiki/周易/臨</p></article></main></div></div>
