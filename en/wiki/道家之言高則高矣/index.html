    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen — Confucian &amp; Daoist Classics</a> › <a href="/en/wiki/">Glossary</a> › 道家之言，高則高矣，用之則弊</nav></header><main><article><h1>道家之言，高則高矣，用之則弊</h1><p>批評道家之言高遠難施於治世</p><p>世人薄申韓之實事，嘉老莊之誕談。然而為政莫能錯刑，殺人者原其死，傷人者赦其罪，所謂土木半瓦胾，無救朝饑者也。道家之言，高則高矣，用之則弊，遼落迂闊，譬猶幹將不可以縫線，巨象不可使鼠，金舟不能淩陽侯之波，玉馬不任騁千里之跡也。</p><p><strong>所出</strong>：《抱朴子 · 卷14》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷14</p></article></main></div></div>
