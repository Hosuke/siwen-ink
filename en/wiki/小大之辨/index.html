    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/wiki/">Glossary</a> › 小大之辨</nav></header><main><article><h1>小大之辨</h1><p>量大者無嫌乎多，量小者不足以議宏博。</p><p>蜩與學鳩笑鵬之徙南冥，斥鴳又笑鵬之遠適。小大之辨，非止形體之大小，更在志趣之高低。蜩鳩之飛，不過榆枋；斥鴳之翔，不過蓬蒿；其自得也固亦至矣。然小者不可以議大，隘者不可以語博，是有小大之辨也。</p><p>  宋榮子能定內外之分、辨榮辱之境，然猶有未樹；列子御風而行，泠然善也，然猶有所待。唯至人無己、神人無功、聖人無名，乘天地之正、御六氣之辨，以遊無窮者，方為無待之逍遙，此則超出小大之辨者也。</p><p>  <strong>所出</strong>：《莊子 · 逍遙遊》 — https://zh.wikisource.org/wiki/莊子/逍遙遊</p></article></main></div></div>
