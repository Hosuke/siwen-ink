    <div id="root"><div data-prerender><header><nav><a href="/en/">Siwen</a> › <a href="/en/persons/">People</a> › Pan Anren</nav></header><main><article><h1>Pan Anren</h1><p lang="zh-Hant">潘安仁</p><p>247-300 CE</p><p>Western Jin writer known for poetry and commemorative prose. Anren is his courtesy name.</p><h2>Appearances (2 entries)</h2><ul><li><a href="/wiki/%E4%BA%8C%E8%B3%A2%E6%89%80%E4%BD%9C/">二賢所作</a> — 夏侯湛、潘安仁之補亡詩，古詩三百未足以偶之，喻今人之文才不在古賢之下。</li><li><a href="/wiki/%E5%8D%97%E9%99%BD%E5%85%AC%E4%B8%BB/">南陽公主</a> — 漢南陽公主，慕道尚虛，空王之世乃於華山棲止，冉冉絕壑，秉雲昇去。</li></ul><h2>Related people</h2><p><a href="/en/person/%E5%A4%8F%E4%BE%AF%E6%B9%9B/">夏侯湛</a>、<a href="/en/person/%E6%8A%B1%E6%9C%B4%E5%AD%90/">抱朴子</a></p></article></main></div></div>
