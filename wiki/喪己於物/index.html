    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 喪己於物，失性於俗</nav></header><main><article><h1>喪己於物，失性於俗</h1><p>溺於外物、染於俗習，則本性亡焉，是謂倒置之民</p><p>今寄去則不樂，由是觀之，雖樂，未嘗不荒也。故曰，喪己於物，失性於俗者，謂之倒置之民。此[[喪己於物]]之歎，與[[以己為物役]]之義相發，皆言外物役使己身，俗習奪其本性也。</p><p><strong>所出</strong>：《莊子 · 繕性》 — https://zh.wikisource.org/wiki/莊子/缮性</p></article></main></div></div>
