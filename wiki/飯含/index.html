    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 飯含</nav></header><main><article><h1>飯含</h1><p>斂之始，以粳米二升陳於尸西。</p><p>飯含者，孝子之深情也。親沒，納粟米於尸口，期其享祀於冥冥。甸人掘坎於西牆下，埋巾柶，示終事之畢。商祝入，北面，執巾授尸以升，自阼階。奠於貝北，主人米實於右，三實一貝，左中亦如之。唯盈而止。夫飯含者，非獨養口體也，養死之心焉。</p><p>死則飯之，孝子不以死亡之遠而忘視膳之恭。是故祝受巾，巾之，降自西階，執以入，宰從立於牀西。祝受巾，授尸，升自阼階。主人米實，實於右，唯盈。</p><p><strong>所出</strong>：《儀禮 · 士喪禮》 — https://zh.wikisource.org/wiki/儀禮/士喪禮</p></article></main></div></div>
