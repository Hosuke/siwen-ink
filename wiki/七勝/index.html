    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 七勝</nav></header><main><article><h1>七勝</h1><p>衆能勝寡，勇能勝怯，道能勝不道，天下之通理也。</p><p>衆勝寡，疾勝徐，勇勝怯，智勝愚，善勝惡，有義勝無義，有天道勝無天道。凡此七勝者貴衆，用之終身者衆矣。</p><p>人主好佚欲、亡其身、失其國者，殆。其德不足以懷其民者，殆。明其刑而賤其士者，殆。諸侯假之威，久而不知極已者，殆。身彌老，不知敬其適子者，殆。蓄藏積陳朽腐，不以與人者，殆。</p><p><strong>所出</strong>：《管子 · 第12篇樞言》 — https://zh.wikisource.org/wiki/管子/第12篇樞言</p></article></main></div></div>
