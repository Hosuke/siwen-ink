    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 行權合變度時施宜</nav></header><main><article><h1>行權合變度時施宜</h1><p>褚先生言當世君子行權合變、度時施宜、希世用事以立功封侯，而不知持滿守成之道。</p><p>褚先生曰：「太史公記事盡於孝武之事，故復脩記孝昭以來功臣侯者，編於左方，令後好事者得覽觀成敗長短絕世之適，得以自戒焉。」又云：「當世之君子，行權合變，度時施宜，希世用事，以建功有土封侯，立名當世，豈不盛哉！」然其觀持滿守成之道，皆不謙讓，驕蹇爭權，喜揚聲譽，知進不知退，終以殺身滅國。以三得之，及身失之，不能傳功於後世，令恩德流子孫，豈不悲哉！</p><p><strong>所出</strong>：《史記 · 卷020》 — https://zh.wikisource.org/wiki/史記/卷020</p></article></main></div></div>
