    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 修命有兩端</nav></header><main><article><h1>修命有兩端</h1><p>修命之法有兩端，有易遇而難成者，有難遇而易成者。</p><p>[[悟真篇]]序明言之，云：「道門尚於修命，而不知修命之法理出兩端，有易遇而難成者，有難遇而易成者。」易遇難成者，蓋指一切旁門小法；難遇易成者，指金丹正途。然世人不知辨別，輕棄金丹而執旁門，良可痛傷。</p><p><strong>所出</strong>：《悟真篇》 — https://zh.wikisource.org/wiki/悟真篇</p></article></main></div></div>
