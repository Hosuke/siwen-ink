    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 同用七日</nav></header><main><article><h1>同用七日</h1><p>七日為一週，魂魄充盈，形神完固。</p><p>同用七日自充盈者，週而復始之義也。七日為一終始，魂魄歷是一週，則虛者自盈、弱者自強，無英煥然，形神完固。垂絕之念神至此而復生，永無傾覆之患矣。《[[無英]]》云「百疴所鍾」，惟七日充盈乃能勝之，此修煉一定之程，不可躐等而求也。</p><p><strong>所出</strong>：《黃庭內景經 · 肝部章第十一》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/肝部章第十一</p></article></main></div></div>
