    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 分定而不偏</nav></header><main><article><h1>分定而不偏</h1><p>分均則不偏，埶齊則不壹，眾齊則不使。分者，天下之本也。</p><p>分均則不偏，埶齊則不壹，眾齊則不使。有天有地，而上下有差；明王始立，而處國有制。夫兩貴之不能相事，兩賤之不能相使，是天數也。埶位齊，而欲惡同，物不能澹則必爭；爭則必亂，亂則窮矣。先王惡其亂也，故制禮義以分之，使有貧富貴賤之等，足以相兼臨者，是養天下之本也。書曰：「維齊非齊。」此之謂也。</p><p><strong>所出</strong>：《荀子 · 王制篇》 — https://zh.wikisource.org/wiki/荀子/王制篇</p></article></main></div></div>
