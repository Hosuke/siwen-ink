    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 東土之人</nav></header><main><article><h1>東土之人</h1><p>周司徒掌東土之民。</p><p>桓公為司徒，甚得周眾與東土之人。東土者，周之王畿以東之地也。司徒掌邦教，敷五典，擾萬民。桓公得人心如此，是以王室多故之時，能問於史伯以求避死之策。</p><p><strong>所出</strong>：《國語 · 卷16》 — https://zh.wikisource.org/wiki/國語/卷16
