    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 用夏變夷</nav></header><main><article><h1>用夏變夷</h1><p>用華夏之教化變夷狄，不可反為夷狄所變</p><p>孟子斥陳相倍師從許行，曰「吾聞用夏變夷者，未聞變於夷者也」。陳良悅周公仲尼之道，北學中國，為豪傑之士，其弟師之數十年，師死遂倍之。引《魯頌》「戎狄是膺，荊舒是懲」，以斥南蠻鴃舌之非先王之道。</p><p><strong>所出</strong>：《孟子 · 滕文公上》 — https://zh.wikisource.org/wiki/孟子/滕文公上</p></article></main></div></div>
