    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 治國必先富民</nav></header><main><article><h1>治國必先富民</h1><p>治國以富民為本，民富則易治。</p><p>治國之道，必先富民。民富則易治，民貧則難治。何以然？民富則安鄉重家，安鄉重家則敬上畏罪，敬上畏罪則易治也。民貧則危鄉輕家，危鄉輕家則敢陵上犯禁，陵上犯禁則難治也。故治國常富，而亂國必貧。是以善為國者，必先富民，然後治之。昔者七十九代之君，法制不一，號令不同，然俱王天下者，何也？必國富而粟多也。夫富國多粟，生於農，故先王貴之。</p><p><strong>所出</strong>：《管子 · 第48篇治國》 — https://zh.wikisource.org/wiki/管子/第48篇治國</p></article></main></div></div>
