    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖人苟可以強國不法其故</nav></header><main><article><h1>聖人苟可以強國不法其故</h1><p>聖人強國利民，不拘成法</p><p>聖人苟可以強國，不法其故；苟可以利民，不循其禮。法者所以愛民也，禮者所以便事也。立法之本，在於強國利民，不當泥古不化。</p><p><strong>所出</strong>：《商君書 · 卷一》 — https://zh.wikisource.org/wiki/商君書/卷一</p></article></main></div></div>
