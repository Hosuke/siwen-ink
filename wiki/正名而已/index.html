    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 正名而已矣</nav></header><main><article><h1>正名而已矣</h1><p>梁亡之責，在己不在人；直書其實，正名分而已。</p><p>梁亡，出惡正也。鄭棄其師，惡其長也。</p><p>《穀梁》以「正名」釋《春秋》書法：梁之亡，乃梁君自取，故經文直書「梁亡」以見其咎；鄭之棄師，乃大夫之罪，亦書其实以正其名分也。</p><p><strong>所出</strong>：《春秋穀梁傳 · 僖公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/僖公</p></article></main></div></div>
