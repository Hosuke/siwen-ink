    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蟬聯血食</nav></header><main><article><h1>蟬聯血食</h1><p>陳杞雖亡，而田常、句踐之族蟬聯不絕，蓋盛德之裔。</p><p>「索隱述贊」曰：「句踐勃興，田和吞噬。蟬聯血食，豈其苗裔？」</p><p><strong>所出</strong>：《史記 · 卷036》 — https://zh.wikisource.org/wiki/史記/卷036</p></article></main></div></div>
