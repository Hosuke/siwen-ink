    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 齊聖</nav></header><main><article><h1>齊聖</h1><p>稟賦純明、行事中正之人。</p><p>齊聖，謂人之稟賦純明、智識通達、行事中正者也。《小宛》云「人之齊聖」，以別於彼昏昧不知之人。齊者，整也、正也；聖者，通明之至也。齊聖之人雖醉酒亦能溫克，不失其度；若昏昧者，則壹醉日富，肆無忌憚，終違天命而不返。</p><p><strong>所出</strong>：《詩經 · 小宛》 — https://zh.wikisource.org/wiki/詩經/小宛</p></article></main></div></div>
