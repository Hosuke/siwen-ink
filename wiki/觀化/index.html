    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 觀化</nav></header><main><article><h1>觀化</h1><p>觀萬物之變化，順其自然，則死生一觀，無所惡焉。</p><p>《要略》論學者觀化之道曰：「今《易》之《乾》、《坤》，足以窮道通義也，八卦可以識吉凶、知禍福矣，然而伏羲為之六十四變，周室增以六爻，所以原測淑清之道，而扌麏逐萬物之祖也。」</p><p>  又言博觀之要曰：「誠通乎二十篇之論，睹凡得要，以通九野，徑十門，外天地，捭山川，其於逍遙一世之間，宰匠萬物之形，亦優遊矣。」</p><p>  此[[帝王之道]]所以貴乎[[通變]]而後能觀化也。</p><p>  <strong>所出</strong>：《淮南子 · 要略》 — https://zh.wikisource.org/wiki/淮南子/要略</p></article></main></div></div>
