    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 吳子應變</nav></header><main><article><h1>吳子應變</h1><p>據敵之情，隨變而制，或擊或避，各有其道。</p><p>吳子言應變之道，備論師眾寡寡之勢：</p><p>敵眾我寡，避之於易，邀之於阨。用眾者務易，用少者務隘。</p><p>遇谿谷險阻，疾行亟去，勿得從容。若猝然相遇，必先鼓譟而乘之。</p><p>谷戰之法，募材士輕足利兵以為前行，分車列騎隱於四旁，出旌列旆熒之，敵必懼而堅陳。</p><p>水戰之道，登高四望，必得水情，敵若絕水，半渡而薄之。</p><p>暴寇之來，善守勿應，待其暮去，追而擊之。</p><p>凡此皆因敵制宜、相機而動之法也。</p><p><strong>所出</strong>：《吳子》 — https://zh.wikisource.org/wiki/吳子</p></article></main></div></div>
