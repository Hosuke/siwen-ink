    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天險不可升</nav></header><main><article><h1>天險不可升</h1><p>天之險高不可攀，以喻君子守正以自守。</p><p>彖傳曰：「天險不可升也，地險山川丘陵也，王公設險以守其國，坎之時用大矣哉！」</p><p>天有雷霆風雨之險，不可升越；地有山川丘陵之阻，難以逾度。王公法天地之險以為城池關隘，用以守國。此言坎之用大，非止一身之憂，實天下國家之重務也。</p><p><strong>所出</strong>：《周易 · 坎》 — https://zh.wikisource.org/wiki/周易/坎</p></article></main></div></div>
