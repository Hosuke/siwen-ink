    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 善學者師逸功倍</nav></header><main><article><h1>善學者師逸功倍</h1><p>善學者，師不勤而功倍，且歸功於師。</p><p>善學者，師逸而功倍，又從而庸之。不善學者，師勤而功半，又從而怨之。</p><p>善學者之得，非偶然也。蓋其心敏而志專，其受教之時，潛心玩索，不待督促而自進也。及其有成，以為皆師之功焉。不善學者反是，既不能用功於己，乃歸咎於師之不勤，此古今之通患也。</p><p><strong>所出</strong>：《禮記 · 學記》 — https://zh.wikisource.org/wiki/禮記/學記</p></article></main></div></div>
