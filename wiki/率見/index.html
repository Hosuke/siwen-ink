    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 率見</nav></header><main><article><h1>率見</h1><p>率領以見。臣工帥諸侯以朝于廟也。</p><p>率見，率領而見之也。成王帥諸侯以見武王之廟，故曰率見。率者，以身作則、率先引導之義。《載見》首言成王率見昭考，下及群辟，見祭廟之禮非一人之私奉，乃天下諸侯共尊先王之盛典也。</p><p><strong>所出</strong>：《詩經 · 載見》 — https://zh.wikisource.org/wiki/詩經/載見</p></article></main></div></div>
