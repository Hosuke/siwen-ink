    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 設五寸之的，引十步之遠</nav></header><main><article><h1>設五寸之的，引十步之遠</h1><p>射必有準的，言行必有功用；無的之射、無用之言，皆非善射善言。</p><p>夫新砥礪殺矢，彀弩而射，雖冥而妄發，其端未嘗不中秋毫也，然而莫能復其處，不可謂善射，無常儀的也。設五寸之的，引十步之遠，非{{羿}}、{{逄蒙}}不能必全者，有常儀的也。有度難而無度易也。有常儀的，則{{羿}}、{{逄蒙}}以五寸為巧；無常儀的，則以妄發而中秋毫為拙。故無度而應之，則辯士繁說；設度而持之，雖知者猶畏失也，不敢妄言。</p><p><strong>所出</strong>：《韓非子 · 外儲說左上》 — https://zh.wikisource.org/wiki/韓非子/外儲說左上</p></article></main></div></div>
