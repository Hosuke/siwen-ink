    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 和樂且湛</nav></header><main><article><h1>和樂且湛</h1><p>妻子兄弟皆合，其樂湛深。</p><p>《常棣》七章云：「兄弟既翕，和樂且湛。」[[妻子好合]]之外，兄弟亦翕然而合，其樂湛深而久。[[和樂且孺]]但言兄弟，此則兼兄弟、妻子而言之，其樂彌廣也。</p><p><strong>所出</strong>：《詩經 · 常棣》 — https://zh.wikisource.org/wiki/詩經/常棣</p></article></main></div></div>
