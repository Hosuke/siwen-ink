    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 結罝罘布密網</nav></header><main><article><h1>結罝罘布密網</h1><p>批判貴族縱橫獵場，弋獲禽魚，攻城略地般馳騁平原。</p><p>或結罝罘於林麓之中，合重圍於山澤之表，列丹飈於豐草，騁逸騎於平原，縱盧獵以噬狡獸，飛輕鷂以鷙翔禽，勁弩殪狂兕，長戟斃熊虎。如此，既彌年而不厭，歷載而無已矣。</p><p><strong>所出</strong>：《抱朴子 · 卷04》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷04</p></article></main></div></div>
