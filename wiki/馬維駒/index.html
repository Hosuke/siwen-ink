    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 馬維駒</nav></header><main><article><h1>馬維駒</h1><p>維駒，良馬之稱，以喻使臣才堪重任。</p><p>「我馬維駒」，見於《詩·小雅·皇皇者華》第二章。</p><p>「駒」者，馬之少壯者；《說文》「馬二歲曰駒」。詩言使臣以駒為馬，非取其稚，乃取其力充而未已、志銳而方升之象。維駒六轡如濡，言其控馭有度、潤澤光華，以比使臣才器之美。</p><p>詩中四章，各言「維駒」「維騏」「維駱」「維駰」，以狀馬之不同，以喻使臣所至之廣、所用之殊。維駒居首，尤見期許之意。</p><p><strong>所出</strong>：《詩經 · 皇皇者華》 — https://zh.wikisource.org/wiki/詩經/皇皇者華</p></article></main></div></div>
