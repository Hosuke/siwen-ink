    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 志在外也</nav></header><main><article><h1>志在外也</h1><p>六三渙躬而志存外義</p><p>《象》言「咸臨貞吉，志行正也」，以陽居下而上應，其志在君也。[[志行正]]者，行君之正也；志在外者，心存君上也。</p><p>[[知進退存亡而不失其正]]者，志在正君也；[[志在內]]者，志在守正也。咸臨之初九，志在外而以正道相正，此[[犯而不憤]]之所以為美也。</p><p><strong>所出</strong>：《周易 · 臨》 — https://zh.wikisource.org/wiki/周易/臨</p></article></main></div></div>
