    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 周封五等</nav></header><main><article><h1>周封五等</h1><p>周室封建之制，分公、侯、伯、子、男五等，以屏藩王室。</p><p>太史公述周代封建之制曰：周封五等：公，侯，伯，子，男。伯禽封於魯，康叔封於衛，各四百里，親親之義，褒有德也；太公封於齊，兼五侯之地，尊勤勞也。周初所封數百，而同姓五十五，地上不過百里，下三十里，以輔衛王室。其後有管叔、蔡叔、康叔、曹、鄭之屬，或過或損。逮厲王、幽王之後，王室衰微，侯伯彊國興焉，天子微弱，不能正之。</p><p><strong>所出</strong>：《史記 · 卷017》 — https://zh.wikisource.org/wiki/史記/卷017</p></article></main></div></div>
