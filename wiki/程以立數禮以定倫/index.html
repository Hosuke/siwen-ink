    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 程者物之準　禮者節之準</nav></header><main><article><h1>程者物之準　禮者節之準</h1><p>程以立數，禮以定倫，德以敘位，能以授官。</p><p>程者，物之準也；禮者，節之準也。程以立數，禮以定倫，德以敘位，能以授官。凡節奏欲陵，而生民欲寬，節奏陵而文，生民寬而安。上文下安，功名之極也。[[制度在禮]]、 [[禮之所以正國]]，此之謂也。</p><p><strong>所出</strong>：《荀子 · 致士篇》 — https://zh.wikisource.org/wiki/荀子/致士篇</p></article></main></div></div>
