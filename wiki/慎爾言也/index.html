    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 慎爾言也</nav></header><main><article><h1>慎爾言也</h1><p>戒人慎言，否則人將不信。</p><p>「慎爾言也，謂爾不信。」</p><p>戒告譖人云：汝當慎言！若輕肆其言，人將以為不信也。反言以刺之，言譖人平日言不由衷，終至人不信之。</p><p><strong>所出</strong>：《詩經 · 巷伯》 — https://zh.wikisource.org/wiki/詩經/巷伯</p></article></main></div></div>
