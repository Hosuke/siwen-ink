    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 學校廢</nav></header><main><article><h1>學校廢</h1><p>學校荒廢，乱世之徵。</p><p>毛詩序云：「《子衿》，刺學校廢也。亂世則學校不脩焉。」序者以此詩刺鄭國學校之廢弛，以為乱世之中，教化不興，學校荒毀，學子無所依歸。鄭當衛之後，學校之設始於衛，鄭人從而風化之。今學校不修，是非一人之咎，乃亂世之所由兆也。</p><p><strong>所出</strong>：《詩經 · 子衿》 — https://zh.wikisource.org/wiki/詩經/子衿</p></article></main></div></div>
