    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 守一明天</nav></header><main><article><h1>守一明天</h1><p>一者天之紀綱，守一則天將憐之，此解承負之要道也。</p><p>天師云：「欲解承負之責，莫如守一。守一久，天將憐之。一者，天之紀綱，萬物之本也。思其本，流及其末。」</p><p>又云：「以思守一。何也？一者，數之始也；一者，生之道也；一者，元氣所起也；一者，天之紀綱也。故使守思一，從上更下也。」</p><p>守一者，非枯坐守空也。持心於一隅，不使外物奪之；守志於至道，不使浮華搖之。夫末不反本者，由不守一故也。守一則心定，心定則明生，明生則萬事萬理皆得其本。</p><p><strong>所出</strong>：《太平經 · 05》 — https://zh.wikisource.org/wiki/太平經/05</p></article></main></div></div>
