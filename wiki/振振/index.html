    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 振振</nav></header><main><article><h1>振振</h1><p>仁厚之貌，子孫盛多之象。</p><p>詩云「振振兮」。字從「手」從「辰」，音真。毛傳云：「振振，仁厚也。」言子孫之振振者，品德純備、仁愛充實之貌。首章以螽斯「詵詵」興「宜爾子孫，振振兮」，言蟲之衆多猶人之子孫繁昌、品德仁厚也。</p><p>所出：《詩經 · 螽斯》 — https://zh.wikisource.org/wiki/詩經/螽斯</p></article></main></div></div>
