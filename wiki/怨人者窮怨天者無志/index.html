    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 怨人者窮　怨天者無志</nav></header><main><article><h1>怨人者窮　怨天者無志</h1><p>自知者不怨人，知命者不怨天；失之己而反之人，不亦迂乎。</p><p>自知者不怨人，知命者不怨天，怨人者窮，怨天者無志。失之己，反之人，豈不迂乎哉！</p><p><strong>所出</strong>：《荀子 · 榮辱篇》 — https://zh.wikisource.org/wiki/荀子/榮辱篇</p></article></main></div></div>
