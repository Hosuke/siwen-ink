    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 溫故知新</nav></header><main><article><h1>溫故知新</h1><p>溫習舊學以知新義，可以爲人師。</p><p>溫故知新，溫習舊聞以知新義也。《小宛》之詩念昔先人、明發不寐，即溫故之心也。夫溫故非徒記誦，要在推廣先人之德行，以應當世之變。[[明發不寐]]所念者二人，先人之遺訓也；溫故而踐行之，乃知新義之所在。《小宛》戒人敬儀教子，皆溫故知新之實事也。</p><p>  <strong>所出</strong>：《詩經 · 小宛》 — https://zh.wikisource.org/wiki/詩經/小宛</p></article></main></div></div>
