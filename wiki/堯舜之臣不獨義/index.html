    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 堯舜之臣不獨義</nav></header><main><article><h1>堯舜之臣不獨義</h1><p>賢臣盡忠，在乎得遇明君；遇暴則鄙，遇明則忠</p><p>堯、舜之臣不獨義，湯、禹之臣不獨忠，得其數也；桀、紂之臣不獨鄙，幽、厲之臣不獨辟，失其理也。賢臣之盡忠與否，不專在臣之身，而在乎君之明闇。堯舜之臣之所以能各盡其才，以其得主之相遇也。苟不得其君，雖有伊呂之賢，亦無所用之。此[[審分]]篇所以極論名分不可不審，而[[君守]]之道，亦在於此。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十七》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十七</p></article></main></div></div>
