    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 張儀歸報</nav></header><main><article><h1>張儀歸報</h1><p>魏既背從約，張儀陰令秦伐之，魏戰敗；復事秦如故。</p><p>張儀留魏四歲，哀王立，儀復說之，不聽。儀陰令秦伐魏，魏敗。明年，齊又敗魏於觀津。秦復欲攻魏，先敗韓申差軍，斬首八萬，諸侯震恐。儀歸報，復相秦。三歲而魏復背秦為從，秦攻魏，取曲沃。明年，魏復事秦。</p><p><strong>所出</strong>：《史記 · 卷070》 — https://zh.wikisource.org/wiki/史記/卷070</p></article></main></div></div>
