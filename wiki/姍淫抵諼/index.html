    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 姍淫抵諼</nav></header><main><article><h1>姍淫抵諼</h1><p>不知法治本源者，雖泥古而終亂。</p><p>知法治所由生，則應時而變；不知法治之源，雖循古，終亂。今世之法籍與時變，禮義與俗易，為學者循先襲業，據籍守舊教，以為非此不治，是猶持方枘而周員鑿也，欲得宜適致固焉，則難矣。</p><p><strong>所出</strong>：《淮南子 · 氾論訓》 — https://zh.wikisource.org/wiki/淮南子/氾論訓</p></article></main></div></div>
