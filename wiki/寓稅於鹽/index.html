    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 寓稅於鹽</nav></header><main><article><h1>寓稅於鹽</h1><p>鹽稅潛行於鹽價之中，民不知而國用足。</p><p>管子之術，不以稅目相加，而以鹽價寓之。禁北海之衆煮鹽，則民乏鹽；乏鹽，則官府以四什倍之價售之天下。外輸梁、趙、宋、衛、濮陽，得利無窮，而民不知其為稅也。此[[寓稅於粟]]之術，特變而施之於鹽耳。</p><p><strong>所出</strong>：《管子 · 第77篇地數》 — https://zh.wikisource.org/wiki/管子/第77篇地數</p></article></main></div></div>
