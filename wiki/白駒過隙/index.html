    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 白駒過隙</nav></header><main><article><h1>白駒過隙</h1><p>喻人生短暫，如白馬過隙，倏忽即逝。</p><p>魏豹謝漢王之使者曰：「人生一世閒，如白駒過隙耳。」言人生促迫，若白馬馳過隙穴，頃刻即逝，不可復返。</p><p><strong>所出</strong>：《史記 · 卷090》 — https://zh.wikisource.org/wiki/史記/卷090</p></article></main></div></div>
