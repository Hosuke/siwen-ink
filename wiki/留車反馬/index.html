    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 留車反馬</nav></header><main><article><h1>留車反馬</h1><p>天子嫁女，送車留夫家，馬還本族之禮。</p><p>留車反馬者，周代天子與大夫嫁女之禮制也。《何彼襛矣》「王姬之車」鄭玄註云：「按王先謙考證，此天子、大夫嫁娶時留車反馬之禮。女方嫁至男方時所乘之車，到達後歸屬於男方家庭，但所用之馬則要退還給女方。」蓋車象徵女身，既嫁則留於夫家；馬象徵自由，當還其本族，以示女不二適之義。此禮行於王姬下嫁諸侯，亦見於大夫嫁娶之間。</p></article></main></div></div>
