    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 脂粉非體中之至急，而轡策須臾不可無也</nav></header><main><article><h1>脂粉非體中之至急，而轡策須臾不可無也</h1><p>仁政如脂粉，刑罰如轡策，後者更為迫切</p><p>善為政者，必先端此以率彼，治親以整疏，不曲法以行意，必有罪而無赦。若石昔之割愛以滅親，晉文之忍情以斬頡。故仁者，為政之脂粉；刑者，禦世之轡策；脂粉非體中之至急，而轡策須臾不可無也。</p><p><strong>所出</strong>：《抱朴子 · 卷14》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷14</p></article></main></div></div>
