    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 四工</nav></header><main><article><h1>四工</h1><p>攻木、攻金、設色、刮摩之工，各有其職，以成百器。</p><p>凡攻木之工七，攻金之工六，攻皮之工五，設色之工五，刮摩之工五，搏埴之工二。</p><p>攻木之工：輪、輿、弓、廬、匠、車、梓。攻金之工：筑、冶、鳧、栗、段、桃。攻皮之工：函、鮑、韗、韋、裘。設色之工：畫、繢、鍾、筐、幌。刮摩之工：玉、櫛、雕、矢、磬。搏埴之工：陶、旊。</p><p><strong>所出</strong>：《周禮 · 冬官考工記》 — https://zh.wikisource.org/wiki/周禮/冬官考工記</p></article></main></div></div>
