    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 兵者百歲不一用</nav></header><main><article><h1>兵者百歲不一用</h1><p>兵事雖百年不用，然大國不可一日忘之。</p><p>人道何先？先兵。天者高難知，地者廣大深厚，多利而鮮威，時舉錯代更無一。三者不可以立化樹俗，故聖人弗法。天與地不能盡恃，則兵為急務。兵者百歲不一用，然不可一日忘也。是以人道先兵，兵者禮義忠信也。治國家以法，失道敢以賤逆貴，不義敢以小侵大，行枉則禁，反正則舍。此聖人所以衛萬民、藩社稷之道也。</p><p><strong>所出</strong>：《鶡冠子》 — https://zh.wikisource.org/wiki/鶡冠子</p></article></main></div></div>
