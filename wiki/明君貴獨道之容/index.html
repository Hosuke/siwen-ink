    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 明君貴獨道</nav></header><main><article><h1>明君貴獨道</h1><p>明君貴獨道之容，道無雙故曰一</p><p>道無雙，故曰一。道者弘大而無形，下周於事，因稽而命，與時生死。萬物皆稟此道，而道實無雙。道不同於萬物，德不同於陰陽，衡不同於輕重，繩不同於出入，和不同於燥濕，君不同於羣臣。凡此六者，道之出也。道既然獨一不二，是故明君貴獨道之容。君操其名，臣效其形，形名參同，上下和調也。君者，道之具象；臣者，道之施行。明主知此，故獨執一道，不與臣共之。</p><p><strong>所出</strong>：《韓非子 · 揚權》 — https://zh.wikisource.org/wiki/韓非子/揚權</p></article></main></div></div>
