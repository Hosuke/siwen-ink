    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 官府選効必先</nav></header><main><article><h1>官府選効必先</h1><p>聖王設官，必先立祭司之人，祭器藏府，祝宗有司畢立於朝。</p><p>官府選効必先，祭器祭服畢藏於府，祝宗有司畢立於朝，犧牲不與昔聚羣。故古者聖王之爲政若此。</p><p>必擇國之父兄慈孝貞良者，以爲祝宗；必擇六畜之腯肥倅毛，以爲犧牲。</p><p><strong>所出</strong>：《墨子 · 明鬼下》 — https://zh.wikisource.org/wiki/墨子/明鬼下</p></article></main></div></div>
