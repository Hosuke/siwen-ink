    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 散宜生獻美女</nav></header><main><article><h1>散宜生獻美女</h1><p>閎夭之徒因殷嬖臣費仲，獻有莘氏美女及文馬奇物於紂，紂赦西伯。</p><p>崇侯虎譖西伯於殷紂曰：「西伯積善累德，諸侯皆向之，將不利於帝。」帝紂乃囚西伯於羑里。閎夭之徒患之。乃求有莘氏美女，驪戎之文馬，有熊九駟，他奇怪物，因殷嬖臣費仲而獻之紂。紂大說，曰：「此一物足以釋西伯，況其多乎！」乃赦西伯，賜之弓矢斧鉞，使西伯得征伐。</p><p><strong>所出</strong>：《史記 · 卷004》 — https://zh.wikisource.org/wiki/史記/卷004</p></article></main></div></div>
