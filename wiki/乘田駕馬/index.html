    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 乘田駕馬</nav></header><main><article><h1>乘田駕馬</h1><p>文王於渭陽遇太公，乘田車、駕田馬而田，太公坐茅以漁，終獲師望。</p><p>文王將田，史編布卜，兆辭曰：「田於渭陽，將大得焉。非龍非彲，非虎非羆，兆得公侯，天遺汝師。以之佐昌，施及三王。」</p><p>文王齋戒三日，乘田車，駕田馬，田於渭陽，卒見太公坐茅以漁。文王勞而問之，太公以[[文師第一]]之義答之，論[[天下歸之]]之理。文王再拜，受天之詔，命駕而歸，立為師。</p><p>此事為文王得太公之始，亦周興之關鍵。後世以[[武王伐紂]]之功，皆本於此文王得太公之事。</p><p><strong>所出</strong>：《六韜》 — https://zh.wikisource.org/wiki/六韜</p></article></main></div></div>
