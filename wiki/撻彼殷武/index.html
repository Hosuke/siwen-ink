    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 撻彼殷武</nav></header><main><article><h1>撻彼殷武</h1><p>武丁伐楚之威武。</p><p>撻彼殷武，奮伐荊楚。</p><p>撻，疾行之貌；殷武，指商王武丁，以其武功顯著故稱「殷武」。荊楚，荊州之楚國也。</p><p>[[殷武]]首章言武丁帥師疾馳，深入楚地，俘擄楚師，一如成湯之緒業。詩以「撻彼」狀軍行之速，以「奮伐」見其勇猛，冞入其阻則言冒險深入，裒荊之旅則言俘獲楚師也。</p><p><strong>所出</strong>：《詩經 · 殷武》 — https://zh.wikisource.org/wiki/詩經/殷武</p></article></main></div></div>
