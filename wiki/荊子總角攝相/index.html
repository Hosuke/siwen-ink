    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 荊子總角攝相</nav></header><main><article><h1>荊子總角攝相</h1><p>幼者居上位而賴賢臣以成治。</p><p>荊子總角而攝相事，賴二十五老，臻乎惠康。言稚齡秉政，茍得人以輔，皆可致治也。</p><p><strong>所出</strong>：《抱朴子 · 卷12》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷12</p></article></main></div></div>
