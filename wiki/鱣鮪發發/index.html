    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鱣鮪發發</nav></header><main><article><h1>鱣鮪發發</h1><p>狀魚尾擺動之聲，喻生機蓬勃。</p><p>「鱣鮪發發」，《詩經·衞風·碩人》之句也。鱣，鯉之大者；鮪，鱘魚也。發發，魚尾擊水之聲，狀其跳躍生動。</p><p>全章云：「河水洋洋，北流活活，施罛濊濊，鱣鮪發發，葭菼揭揭。」鱣鮪為大河中所出美魚，網罟既施，魚猶跳躍，見嫁娶道上河濱之熱鬧景象，亦寓有多子之祝。</p><p><strong>所出</strong>：《詩經 · 碩人》 — https://zh.wikisource.org/wiki/詩經/碩人</p></article></main></div></div>
