    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 介子推</nav></header><main><article><h1>介子推</h1><p>姓王名光，悅趙宣子。從重耳流亡十九年，歸國後隱山，三十年後為世俗扇，後莫知所在。</p><p>介子推者，姓王名光，而無名，悅趙宣子，與遊。晉人也。</p><p>隱。一有黃雀在門上，晉公重耳異之，與出居外十餘年，勞苦不辭。及還介山，伯子震晨來呼推曰：可去矣。推辭母入山中，從伯子常遊。</p><p>後文公遣數千人以玉帛禮之，不出。</p><p>後三十年，見東海邊，為王俗賣扇。後數十年，莫知所在。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 3》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/3</p></article></main></div></div>
