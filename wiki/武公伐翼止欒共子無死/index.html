    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 武公伐翼止欒共子無死</nav></header><main><article><h1>武公伐翼止欒共子無死</h1><p>欒共子辭不死之誘，守臣道而鬥死。</p><p>武公伐翼，殺哀侯，止欒共子，許以子上卿之位，欲令制晉國之政。共子辭曰：「成聞之：『民生於三，事之如一。』父生之，師教之，君食之。非父不生，非食不長，非教不知生之族也，故壹事之。唯其所在，則致死焉。報生以死，報賜以力，人之道也。臣敢以私利廢人之道，君何以訓矣？且君知成之從也，未知其待於曲沃也。從君而貳，君焉用之？」遂鬥而死。</p><p><strong>所出</strong>：《國語 · 卷07》 — https://zh.wikisource.org/wiki/國語/卷07</p></article></main></div></div>
