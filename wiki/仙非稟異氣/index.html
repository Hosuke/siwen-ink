    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 仙非稟異氣</nav></header><main><article><h1>仙非稟異氣</h1><p>仙人皆由學以得之，非稟異氣而然。</p><p>或問曰：「古之仙人者，皆由學以得之，將特稟異氣耶？」抱朴子答曰：「是何言歟？彼莫不負笈隨師，積其功勤，蒙霜冒險，櫛風沐雨，而躬親灑掃，契闊勞藝，始見之以信行，終被試以危困，性篤行貞，心無怨貳，乃得升堂以入於室。」</p><p><strong>所出</strong>：《抱朴子 · 卷13》 — https://zh.wikisource.org/wiki/抱朴子/卷13</p></article></main></div></div>
