    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天駟</nav></header><main><article><h1>天駟</h1><p>房星為天駟，天馬主車駕，四星間有日月光道。</p><p>房為府，曰天駟。爾雅云「天駟，房」。詩記曆樞云「房為天馬，主車駕」。宋均云「房旣近心，為明堂，又別為天府及天駟也」。</p><p>尚書運期授曰「房，四表之道」。宋均云「四星間有三道，日、月、五星所從出入也」。其陰右驂，旁有兩星曰衿，北一星曰舝。說文云「轄，車軸耑鍵也」。星經云「鍵閉一星在房東北，掌管籥也」。占：不居其所則津梁不通，宮門不禁。</p><p><strong>所出</strong>：《史記 · 卷027》 — https://zh.wikisource.org/wiki/史記/卷027</p></article></main></div></div>
