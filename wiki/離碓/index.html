    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 離碓</nav></header><main><article><h1>離碓</h1><p>蜀守冰所鑿之渠，以避沫水之害，穿二江於成都。</p><p>離碓者，蜀守冰所鑿之渠口也。《史記》載：「於蜀，蜀守冰鑿離碓，辟沫水之害，穿二江成都之中。」蜀地有沫水為患，冰乃鑿離碓以分水勢，免其為害，並穿二江於成都平原，使水流行舟，百姓饗其灌溉之利。此渠皆可行舟，有餘則用溉浸，百姓饗其利，功施於世。所言「離碓」，即今都江堰之雛型，其法疏水防患，兼利農田，誠千古之智也。</p><p><strong>所出</strong>：《史記 · 卷029》 — https://zh.wikisource.org/wiki/史記/卷029</p></article></main></div></div>
