    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 屬纊以俟絕氣</nav></header><main><article><h1>屬纊以俟絕氣</h1><p>疾革之時，屬絲棉於口鼻，以待其氣絕。</p><p>疾病，外內皆掃。君大夫徹縣，士去琴瑟。寢東首於北牖下。廢床。徹褻衣，加新衣，體一人。男女改服。屬纊以俟絕氣。男子不死於婦人之手，婦人不死於男子之手。</p><p><strong>所出</strong>：《禮記 · 喪大記》 — https://zh.wikisource.org/wiki/禮記/喪大記</p><hr><p>屬纩，以俟絕氣。男子不絕于婦人之手，婦人不絕于男子之手。屬，著也；纩，絮也。新棉輕著于鼻口，微有出入則未死，無則氣絕矣。</p><p><strong>所出</strong>：《儀禮 · 既夕禮》 — https://zh.wikisource.org/wiki/儀禮/既夕禮</p></article></main></div></div>
