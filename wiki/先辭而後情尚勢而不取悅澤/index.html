    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 先辭而後情，尚勢而不取悅澤</nav></header><main><article><h1>先辭而後情，尚勢而不取悅澤</h1><p>陸雲早年論文，先辭後勢，後乃悟先情之要。</p><p>又陸雲自稱往日論文，先辭而後情，尚勢而不取悅澤，及張公論文，則欲宗其言。夫本固先辭，勢實須澤，可謂先迷後能從善矣。</p><p>陸雲自述：昔年論文，先觀其辭，後察其情；崇尚勢而忽悅澤。及聞張華之論，始知其言之善。夫文固先有辭，勢則須有潤澤，可謂先迷而後能從善者也。</p><p><strong>所出</strong>：《文心雕龍 · 定勢》 — https://zh.wikisource.org/wiki/文心雕龍/定勢</p></article></main></div></div>
