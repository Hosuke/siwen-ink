    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以五事觀</nav></header><main><article><h1>以五事觀</h1><p>以身、家、鄉、國、天下之五事，觀其脩悖。</p><p>故以身觀身，以家觀家，以鄉觀鄉，以國觀國，以天下觀天下。夫觀者何從辨脩不脩哉？以其效驗觀之。身脩則家從，家脩則鄉化，鄉脩則國治，國脩則天下平。效驗之跡，昭然可睹。</p><p><strong>所出</strong>：《老子河上公章句 · 修觀》 — https://zh.wikisource.org/wiki/老子河上公章句/德觀</p></article></main></div></div>
