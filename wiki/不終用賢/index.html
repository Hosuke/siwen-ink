    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不終用賢</nav></header><main><article><h1>不終用賢</h1><p>桓公身死蟲出而不收，以不終用賢也。</p><p>[[桓公慚死]]之論。管子言齊之所以興，以能用賢也；桓公之所以亡，以不能用賢也。易牙、豎刁、堂巫、公子開方，皆管仲所戒不用之人，仲沒而桓公復用之，遂至於死且無葬地。故[[鮑叔祝三不忘]]之言，在酒酣耳熱之際，而桓公不能終守也。</p><p><strong>所出</strong>：《管子 · 第32篇小稱》 — https://zh.wikisource.org/wiki/管子/第32篇小稱</p></article></main></div></div>
