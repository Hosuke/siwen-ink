    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 冢宰制國用</nav></header><main><article><h1>冢宰制國用</h1><p>冢宰於歲杪制國用，量入為出，務使蓄積足用。</p><p>冢宰制國用，必於歲之杪，五穀皆入然後制國用。用地小大，視年之豐耗。以三十年之通制國用，量入以為出，祭用數之仂。喪用三年之仂。喪祭，用不足曰暴，有餘曰浩。祭，豐年不奢，凶年不儉。</p><p>國無九年之蓄曰不足，無六年之蓄曰急，無三年之蓄曰國非其國也。三年耕，必有一年之食；九年耕，必有三年之食。以三十年之通，雖有凶旱水溢，民無菜色，然後天子食，日舉以樂。</p><p><strong>所出</strong>：《禮記 · 王制》 — https://zh.wikisource.org/wiki/禮記/王制</p></article></main></div></div>
