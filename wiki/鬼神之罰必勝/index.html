    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鬼神之罰必勝</nav></header><main><article><h1>鬼神之罰必勝</h1><p>鬼神之罰無可抗拒，富貴衆強皆不能免。</p><p>鬼神之罰，不可爲富貴衆強、勇力強武、堅甲利兵，鬼神之罰必勝之。</p><p>昔者夏王桀貴爲天子，富有天下，上詬天侮鬼，下殃傲天下之萬民，然不能以此圉鬼神之誅。昔者殷王紂貴爲天子，富有天下，然不能以此圉鬼神之誅。</p><p><strong>所出</strong>：《墨子 · 明鬼下》 — https://zh.wikisource.org/wiki/墨子/明鬼下</p></article></main></div></div>
