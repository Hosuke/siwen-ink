    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 神僊久視無災害</nav></header><main><article><h1>神僊久視無災害</h1><p>久視肺神，則神僊可致，身無災害。</p><p>久視者，專精注想，時時不忘之義。神仙者，通過存思肺神，久而不怠，則形神俱妙，可致神仙之域。災害者，病患夭折之厄。經云「神僊久視無災害」，言能久視肺神者，精神不散，灾害不侵，神仙之道成矣。</p><p><strong>所出</strong>：《黃庭內景經 · 肺部章第九》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/肺部章第九</p></article></main></div></div>
