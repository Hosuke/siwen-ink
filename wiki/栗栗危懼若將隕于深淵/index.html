    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 栗栗危懼，若將隕于深淵</nav></header><main><article><h1>栗栗危懼，若將隕于深淵</h1><p>居安思危，常若臨深履薄。</p><p>湯自言：「茲朕未知獲戾于上下。栗栗危懼，若將隕于深淵。」言其敬天畏民，常懷危懼，不敢自安也。</p><p><strong>所出</strong>：《尚書 · 湯誥》 — https://zh.wikisource.org/wiki/尚書/湯誥</p></article></main></div></div>
