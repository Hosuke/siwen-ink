    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 周而不比</nav></header><main><article><h1>周而不比</h1><p>君子與人周遍親和，而不私相比黨。</p><p>《論語》載孔子之言曰：「君子周而不比，小人比而不周。」言君子以義合人，普遍周遍，無所偏私；小人不義而合，但相比以爲朋黨也。周者，周遍也；比者，私相比也。此君子小人之辨也。</p><p><strong>所出</strong>：《論語 · 爲政第二》 — https://zh.wikisource.org/wiki/論語/爲政第二</p></article></main></div></div>
