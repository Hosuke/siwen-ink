    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 敝笱在梁</nav></header><main><article><h1>敝笱在梁</h1><p>以破笱不能制魚，比擬諸侯失政、威令不行</p><p>《敝笱》之詩，以破舊之笱置於魚梁而起興。笱者，竹器之有逆刺、設於梁以限魚者；魚梁者，水中之堰壩也。笱既能限魚，亦能制魚，使之不得遁逸。今笱敝矣，刺齒皆敗，魚乃出入自如，無所拘礙。</p><p>詩人取此象，以喻治道之弛。諸侯有威儀禁令，猶笱之制魚也；及其政教不明，則威令不行，如敝笱然，魚何畏哉？</p><p>《詩》曰「敝笱在梁，其魚魴鰥」，又曰「其魚唯唯」。「唯唯」者，相隨出入之貌，魚不畏笱，往來自如，政荒而莫之禁也。</p><p><strong>所出</strong>：《詩經 · 敝笱》 — https://zh.wikisource.org/wiki/詩經/敝笱</p></article></main></div></div>
