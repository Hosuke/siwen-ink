    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 備長存乎在賢</nav></header><main><article><h1>備長存乎在賢</h1><p>君欲尊安，必賴賢佐。</p><p>凡人君所以尊安者，賢佐也。佐賢則君尊、國安、民治，無佐則君卑、國危、民亂。故曰：「備長存乎在賢。」</p><p>慶勉敦敬以顯之，富祿有功以勸之，爵貴有名以休之。</p><p>明君兼愛以親之，明教順以道之，便其勢、利其備、愛其力而勿奪其時以利之。如此，則衆親上鄉意，從事勝任矣。</p><p><strong>所出</strong>：《管子 · 第66篇版法解》 — https://zh.wikisource.org/wiki/管子/第66篇版法解</p></article></main></div></div>
