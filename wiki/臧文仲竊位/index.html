    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 臧文仲竊位</nav></header><main><article><h1>臧文仲竊位</h1><p>謂知賢而不進，與竊居祿位無異。</p><p>子曰：「臧文仲，其竊位者與！知柳下惠之賢，而不與立也。」</p><p>言臧文仲知柳下惠之賢，不能引進以共立于朝，是負位而不盡其責，與竊位何殊。聖人責人臣尸位之戒也。</p><p><strong>所出</strong>：《論語 · 衞靈公第十五》 — https://zh.wikisource.org/wiki/論語/衞靈公第十五</p></article></main></div></div>
