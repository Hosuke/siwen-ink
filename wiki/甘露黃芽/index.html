    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 甘露黃芽</nav></header><main><article><h1>甘露黃芽</h1><p>心地清靜則甘露降、意念虛明則黃芽生</p><p>甘露者，心清之象也。黃芽者，意靜之象也。人生本來良知健德，天也；良能順德，地也；虛靈不昧之神為靈性，火也；純粹不雜之精為真情，水也。人能健順如一，則身中天地相合，如甘露灑心，煩惱頓脫；人能精神不耗，則身中坎離相交，如黃芽自生，元氣乃複。心清意靜，良知良能，一靈真性，常應常靜，造化難移，萬物難屈，我命由我不由天，長生之道在是矣。</p><p><strong>所出</strong>：《悟真直指 · 卷一》 — https://zh.wikisource.org/wiki/悟真直指/卷一</p></article></main></div></div>
