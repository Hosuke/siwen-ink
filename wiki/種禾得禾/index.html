    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 種禾得禾</nav></header><main><article><h1>種禾得禾</h1><p>天地之於人，感應不爽，猶種則種、獲則獲也。</p><p>天師云：「夫地尚不欺人，種禾得禾，種麥得麥，其用功力多者，其稼善，何況天哉！」</p><p>天之道至公至正，不以人之貴賤而異其施，不以時之治亂而渝其常。種善者天報以善，種不善者天報以不善，自然之理也。地在下而能生長萬物，天在上而能照臨下土，其感應之速，捷於影響。</p><p>今人輕易天道，謂天無知，不效。殊不知天之視聽，端倪不爽，比之地之生植，尤有過之無不及焉。此承負之說所由作也。</p><p><strong>所出</strong>：《太平經 · 05》 — https://zh.wikisource.org/wiki/太平經/05</p></article></main></div></div>
