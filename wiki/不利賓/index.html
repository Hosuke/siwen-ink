    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不利賓</nav></header><main><article><h1>不利賓</h1><p>九二爻辭，包有魚則無咎，然不利於賓客，以義不及遠也。</p><p>「九二：包有魚，无咎，不利賓。」</p><p>九二陽居中位，有包制之量，故无咎。然物止於近，未可達於遠也。聖人明義，曰不及賓，蓋先近後遠，先親後疏，理之常也。苟以遠者為利而忽近，未有能成者也。</p><p><strong>所出</strong>：《周易 · 姤》 — https://zh.wikisource.org/wiki/周易/姤</p></article></main></div></div>
