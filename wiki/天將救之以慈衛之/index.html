    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天將救之以慈衛之</nav></header><main><article><h1>天將救之以慈衛之</h1><p>天助聖人，以慈為衛</p><p>[[慈以戰則勝，以守則固]]者，聖人用慈以禦侮，兵革不加，而天下莫之能犯也。天將救之，以慈衛之，言天心無私，獨佑有德之人。聖人行慈，與天合德，天乃以慈救護之，如影隨形然。是故[[不敢為天下先]]者，不爭之德也；天將救之者，不爭之報也。茲亦[[三要]]之義所該也。</p><p><strong>所出</strong>：《老子河上公章句 · 三寶》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
