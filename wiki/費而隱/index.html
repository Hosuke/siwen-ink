    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 費而隱</nav></header><main><article><h1>費而隱</h1><p>君子之道大無不包微無可破，夫婦之愚不肖可以與知行，聖人有所不知不能。</p><p>君子之道費而隱。夫婦之愚，可以與知焉，及其至也，雖聖人亦有所不知焉；夫婦之不肖，可以能行焉，及其至也，雖聖人亦有所不能焉。天地之大也，人猶有所憾。故君子語大，天下莫能載焉；語小，天下莫能破焉。《詩》云：「鳶飛戾天，魚躍於淵。」言其上下察也。君子之道，造端乎夫婦；及其至也，察乎天地。</p><p><strong>所出</strong>：《中庸 · 中庸章句》 — https://zh.wikisource.org/wiki/四書章句集註/中庸章句</p></article></main></div></div>
