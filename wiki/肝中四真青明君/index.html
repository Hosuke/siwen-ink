    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 肝中四真青明君</nav></header><main><article><h1>肝中四真青明君</h1><p>肝中四真之神，名青明，字明輪童子，主守胃脘死戶、斷絕死炁、流通玉液。</p><p>肝中居四真，青明君其首也。字明輪童子，青光華精之氣所凝。</p><p>常守兆胃脘之戶、膏膜之下死炁之門。司命丈人侍立其側，左三右二，與之共鎮死戶。</p><p>使三素之炁生華，五淳之神侍衛，出入玉液，灌澤胃宮。修之者，青炁自泥丸入，結作四神，青衣冠，下布胃脘，死戶乃閉，玉液流通，華嬰可保。</p><p><strong>所出</strong>：《上清大洞真經 · 16章》 — https://zh.wikisource.org/wiki/上清大洞真經/16章</p></article></main></div></div>
