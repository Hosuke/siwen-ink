    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 芣苢</nav></header><main><article><h1>芣苢</h1><p>車前草也，古人以為利於生子。</p><p>芣苢，植物名，即車前子。年生草本，葉叢生，夏日抽花莖。《詩經》詠之，以其有利於妇人求子故也。</p><p><strong>所出</strong>：《詩經 · 芣苢》 — https://zh.wikisource.org/wiki/詩經/芣苢</p></article></main></div></div>
