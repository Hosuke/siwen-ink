    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 瓠巴鼓瑟而流魚出聽，伯牙鼓琴而六馬仰秣</nav></header><main><article><h1>瓠巴鼓瑟而流魚出聽，伯牙鼓琴而六馬仰秣</h1><p>至誠之音，足以感動萬物；學而至於誠，則天地應之。</p><p>昔者瓠巴鼓瑟而流魚出聽，伯牙鼓琴而六馬仰秣。故聲無小而不聞，行無隱而不形；玉在山而草木潤，淵生珠而崖不枯。為善不積邪，安有不聞者乎？</p><p><strong>所出</strong>：《荀子 · 勸學篇》 — https://zh.wikisource.org/wiki/荀子/勸學篇</p></article></main></div></div>
