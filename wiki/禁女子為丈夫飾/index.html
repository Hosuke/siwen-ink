    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 禁女子為丈夫飾</nav></header><main><article><h1>禁女子為丈夫飾</h1><p>晏子諫靈公示以身教，令內外一體。</p><p>靈公好婦人而丈夫飾者，國人盡服之。公使吏禁之，曰：「女子而男子飾者，裂其衣，斷其帶。」裂衣斷帶，相望而不止。晏子見，公問故。晏子對曰：「君使服之於內，而禁之於外，猶懸牛首於門而賣馬肉也。公何以不使內勿服，則外莫敢為也。」公善之，使內勿服，不逾月，國人莫之服。</p><p>夫上不行而下止者，禁令之所以不行也。晏子知治道在於率先，是以言「內勿服」而效及於外。君子之化人也，若風之偃草，未有上慢而下勤者矣。</p><p><strong>所出</strong>：《晏子春秋 · 卷六》 — https://zh.wikisource.org/wiki/晏子春秋/卷六</p></article></main></div></div>
