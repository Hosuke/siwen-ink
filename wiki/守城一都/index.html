    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 守城一都</nav></header><main><article><h1>守城一都</h1><p>城若固守，秦必興兵四面合圍，道不通，援兵不及。</p><p>城固守，則秦必興兵而圍王一都，道不通，則難必謀，其勢不救，左右計之者不用。</p><p><strong>所出</strong>：《韓非子 · 存韓》 — https://zh.wikisource.org/wiki/韓非子/存韓</p></article></main></div></div>
