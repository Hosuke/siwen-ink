    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 乘元輪</nav></header><main><article><h1>乘元輪</h1><p>天上內音，輪轉幽宗。</p><p>乘元輪者，天上之內音也。音曰「乘元輪，入幽宗」，謂乘此元炁之輪，可入幽隱之宗。幽宗者，玄冥之處也。</p><p><strong>所出</strong>：《上清大洞真經 · 31章》 — https://zh.wikisource.org/wiki/上清大洞真經/31章</p></article></main></div></div>
