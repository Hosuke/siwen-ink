    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 其事好還</nav></header><main><article><h1>其事好還</h1><p>師旅之舉，必有後報，善惡終及。</p><p>用兵之事，其於終始必還報焉。善惡之應，終必及之。</p><p><strong>所出</strong>：《老子河上公章句 · 儉武》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p><hr><p>兵事一行，其於其事必反而還之。殺人者人亦殺之，傷人者人亦傷之，未有能自免者也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 三十章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
