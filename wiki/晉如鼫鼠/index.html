    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 晉如鼫鼠，貞厲</nav></header><main><article><h1>晉如鼫鼠，貞厲</h1><p>九四陽居陰位，進如鼫鼠，守正亦危</p><p>鼫鼠，碩鼠也，貪而不能遠害。九四以陽居陰，不中不正，而處上卦之初，赫然有進用之象，然德不配位，竊祿高位，如鼫鼠然。象曰：「鼫鼠貞厲，位不當也。」言居位不當，雖守正亦危。</p><p><strong>所出</strong>：《周易 · 晉》 — https://zh.wikisource.org/wiki/周易/晉</p></article></main></div></div>
