    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 江河淮濟</nav></header><main><article><h1>江河淮濟</h1><p>四大水系之源流</p><p>江出岷山，東流絕漢入海，左還北流，至於開母之北，右還東流，至於東極。河出積石。睢出荊山。淮出桐柏山。睢出羽山。清漳出楬戾，濁漳出發包。濟出王屋。</p><p><strong>所出</strong>：《淮南子 · 墜形訓》 — https://zh.wikisource.org/wiki/淮南子/墜形訓</p></article></main></div></div>
