    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 仲尼異楚人於所謂人</nav></header><main><article><h1>仲尼異楚人於所謂人</h1><p>孔子異楚王「楚人得弓」之說，廣以為「人得之」，公孫龍據此喻白馬非馬之說不悖。</p><p>公孫龍引仲尼之事以自證。云楚王張繁弱之弓，載忘歸之矢，射蛟兕于雲夢之圃，而喪其弓。左右求之，王曰：「止！楚王遺弓，楚人得之，又何求乎？」仲尼聞之，曰：「楚王仁義而未遂也。亦曰人亡弓，人得之而已，何必楚？」若此，仲尼異楚人於所謂人。夫是仲尼異楚人於所謂人，而非龍異白馬於所謂馬，悖。龍據此以證己說與仲尼之例相類，無悖之理。</p><p><strong>所出</strong>：《公孫龍子 · 1》 — https://zh.wikisource.org/wiki/公孫龍子/1</p></article></main></div></div>
