    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 公孫龍書六篇虛誕</nav></header><main><article><h1>公孫龍書六篇虛誕</h1><p>序者言公孫龍所著六篇，多虛誕不可解，註釋之際心存疑信。</p><p>今閱公孫龍所著六篇，多虛誕不可解。謬以膚識註釋，私心尚在疑信間，未能頓怡然無-{异}-也。</p><p><strong>所出</strong>：《公孫龍子 · 原序》 — https://zh.wikisource.org/wiki/公孫龍子/原序</p></article></main></div></div>
