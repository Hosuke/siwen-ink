    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 脾神養光</nav></header><main><article><h1>脾神養光</h1><p>脾中之神光照五藏，書符刊玉。</p><p>脾神養光者，脾中之神以光華滋養五藏也。經云「脾神養光，肺神梁南，書我五符，刊玉刻金」，言脾神主養光華，肺神梁南主和諧，共書五符、刊玉刻金，令生華日茂、死炁月沉。</p><p><strong>所出</strong>：《上清大洞真經 · 31章》 — https://zh.wikisource.org/wiki/上清大洞真經/31章</p></article></main></div></div>
