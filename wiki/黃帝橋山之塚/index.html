    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 黃帝橋山之塚</nav></header><main><article><h1>黃帝橋山之塚</h1><p>黃帝服神丹之後龍來迎之，群臣追慕；其葬於橋山，乃仙去非死，猶有廟墓之類。</p><p>按荊山經及龍首記，皆雲黃帝服神丹之後，龍來迎之，群臣追慕，靡所措思，或取其幾杖，立廟而祭之；或取其衣冠，葬而守之。列仙傳雲：黃帝自擇亡日，七十日去，七十日還，葬於橋山，山陵忽崩，墓空無屍，但劍舄在焉。此諸說雖異，要於為仙也。言黃帝仙者，見於道書及百家之說者甚多，而儒家不肯長奇怪，開異塗，務於禮教，而神仙之事，不可以訓俗，故雲其死以杜民心耳。</p><p><strong>所出</strong>：《抱朴子 · 卷13》 — https://zh.wikisource.org/wiki/抱朴子/卷13</p></article></main></div></div>
