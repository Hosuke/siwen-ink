    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 巫臣教吳以車戰</nav></header><main><article><h1>巫臣教吳以車戰</h1><p>巫臣奔晉，使吳通好於晉，教吳車戰以疲楚。</p><p>巫臣請使於吳，吳子壽夢說之。乃通吳于晉，以兩之一卒適吳，舍偏兩之一焉。與其射御，教吳乘車，教之戰陳，教之叛楚。窋其子狐庸焉，使為行人於吳。吳始伐楚，伐巢，伐徐，子重奔命。馬陵之會，吳入州來。楚於是乎始病。</p><p><strong>所出</strong>：《春秋左氏傳 · 成公》 — https://zh.wikisource.org/wiki/春秋左氏傳/成公</p></article></main></div></div>
