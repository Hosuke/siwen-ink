    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖人皆咳之</nav></header><main><article><h1>聖人皆咳之</h1><p>聖人容納百姓，無有揀擇。</p><p>「咳」者，小兒笑聲，引申為悅樂愛護之義。百姓屬耳目，不能自解；聖人則不以聰明距之、不以嗜欲距之，一皆咳之。咳之者，欣然接之、容受之、愛護之，如父母之於赤子，無有賢不肖之分、善意惡意之別。百姓之不善不信者，聖人之所以咳之者，正以其不能解於耳目之累、不能達於道心之正也。是以聖人待天下如一，無所不容，無所不悅。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第十二章 德善》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
