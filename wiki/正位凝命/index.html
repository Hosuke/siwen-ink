    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 正位凝命</nav></header><main><article><h1>正位凝命</h1><p>君子正其位以凝天命。</p><p>象辭曰：「君子以正位凝命。」位者，官職之名分也；命者，天命之所賦也。君子居位以正，則天命凝焉，不搖不奪。猶鼎之器，端正則安，可以受實而濟天下也。</p><p>[[革]]卦言「湯武革命」；此言凝命，革與凝相待而後備也。</p><p><strong>所出</strong>：《周易 · 鼎》 — https://zh.wikisource.org/wiki/周易/鼎</p></article></main></div></div>
