    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鄭子儀</nav></header><main><article><h1>鄭子儀</h1><p>子儀以嬰為君，無謚號</p><p>高渠彌弒昭公，祭仲不敢立厲公，乃立昭公弟子亹為君，是為子亹。齊殺子亹後，高渠彌與祭仲立子亹弟公子嬰，是為鄭子。子儀元年——言其無謚號。</p><p><strong>所出</strong>：《史記 · 卷042》 — https://zh.wikisource.org/wiki/史記/卷042</p></article></main></div></div>
