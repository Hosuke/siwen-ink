    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 同於道者道亦樂得之</nav></header><main><article><h1>同於道者道亦樂得之</h1><p>道與人相得，如影響相應。</p><p>同於道者，道亦樂得之。同於德者，德亦樂得之，同於失者，失亦樂得之。</p><p>同於道者，道來歸之，如樂聲之有應也；同於德者，德來居之；同於失者，失亦就之。此感應之理，自然而然者也。</p><p><strong>所出</strong>：《老子河上公章句 · 虛無》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
