    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 研思無慚匠石</nav></header><main><article><h1>研思無慚匠石</h1><p>深研深思，足以裁制事類，無愧匠石</p><p>山木為良匠所度，經書為文士所擇。木美而定於斧斤，事美而制於刀筆。研思之士，無慚匠石矣。</p><p>言研思之深，如匠石之於木，知其美惡，審其短長，取之裁之，各得其宜。是以引事之道，在乎精研深思，審其虛實，定其取捨，方可以無愧也。</p><p><strong>所出</strong>：《文心雕龍 · 事類》 — https://zh.wikisource.org/wiki/文心雕龍/事類</p></article></main></div></div>
