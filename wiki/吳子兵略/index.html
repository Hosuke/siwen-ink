    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 吳子兵略</nav></header><main><article><h1>吳子兵略</h1><p>兼用文德武備，料敵料人，以勝為務。</p><p>吳子全書以文德武備兼修為宗。開篇即言：「明主鑒玆，必內修文德，外治武備。故當敵而不進，無逮於義矣；僵屍而哀之，無逮於仁矣。」</p><p>其論兵起之由，有爭名、爭利、積惡、內亂、因饑五者。論兵之胜负，有天下戰國五勝者禍、四勝者弊、三勝者霸、二勝者王、一勝者帝之戒。</p><p>又言料人固國之道：賢者居上則陳定，民安田宅則守固，百姓皆是吾君而非鄰國則戰勝。</p><p>此皆吳子兵略之大要也。</p><p><strong>所出</strong>：《吳子》 — https://zh.wikisource.org/wiki/吳子</p></article></main></div></div>
