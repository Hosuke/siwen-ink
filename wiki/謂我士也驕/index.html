    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 謂我士也驕</nav></header><main><article><h1>謂我士也驕</h1><p></p><p>《園有桃》首章云「不知我者，謂我士也驕」，言世俗不察賢者之志，妄加之以驕名也。</p><p>  夫賢者之心，固有不見知於世者。詩人之歌謠以遣憂，非傲也，乃不得已也；而世俗不達，反以為驕。此[[彼人是哉]]之詰所由發也。</p><p>  然《尚書》有之「驕淫矜侉，將由惡終」，又云「滿招損，謙受益」，則驕之為德，聖賢所戒也。而詩人自謂無驕，彼人誤加之，故心不能無憂。</p><p>  <strong>所出</strong>：《詩經 · 園有桃》 — https://zh.wikisource.org/wiki/詩經/園有桃</p></article></main></div></div>
