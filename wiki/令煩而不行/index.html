    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 亡國非無令也，患於令煩而不行；敗軍非無禁也，患於禁設而不止</nav></header><main><article><h1>亡國非無令也，患於令煩而不行；敗軍非無禁也，患於禁設而不止</h1><p>令禁之弊在於不行、不止，非令禁本身之過</p><p>亡國非無令也，患於令煩而不行；敗軍非無禁也，患於禁設而不止。故眾慝彌蔓，而下黷其上。夫賞貴當功而不必重，罰貴得罪而不必酷也。</p><p><strong>所出</strong>：《抱朴子 · 卷14》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷14</p></article></main></div></div>
