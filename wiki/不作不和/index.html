    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不作不和</nav></header><main><article><h1>不作不和</h1><p>家居不睦不可以居室，伯牧不洽不可以治民。</p><p>自作不和，爾惟和哉！爾室不睦，爾惟和哉！言家政然，推移以至方伯連帥亦然。一室之內，父子兄弟不相睦，雖欲家和不可得；方伯連帥，不能和其治下之民，雖欲國治亦不可得。和也者，千古治道之本也。不和則乖，乖則爭，爭則亂，亂則天所以致罰也。慎和以承天，戒乖以永命，其道一耳。</p><p><strong>所出</strong>：《尚書 · 多方》 — https://zh.wikisource.org/wiki/尚書/多方</p></article></main></div></div>
