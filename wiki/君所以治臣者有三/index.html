    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 君所以治臣者有三</nav></header><main><article><h1>君所以治臣者有三</h1><p>明人主治臣之法，曰勢、曰利、曰術</p><p>人主治臣之道有三：一曰<strong>勢</strong>，二曰<strong>利</strong>，三曰<strong>術</strong>。</p><p>勢者，權力之勢也。不可以力化者，則除之。此[[善持勢者蚤絶其姦萌]]之說也。</p><p>利者，人主為利害之轂轂，射者之所集也。臣有好惡，則下有所因；臣有辭言，則主不能神。此申子六慎、唐易弋射之喻也。</p><p>術者，所以馭臣之法也。術之不行，往往有故——不殺其狗則酒酸，左右皆社鼠則人主無以自主。此[[不殺其狗則酒酸]]之寓也。</p><p><strong>所出</strong>：《韓非子 · 外儲說右上》 — https://zh.wikisource.org/wiki/韓非子/外儲說右上</p></article></main></div></div>
