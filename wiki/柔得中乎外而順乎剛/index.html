    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 柔得中乎外而順乎剛</nav></header><main><article><h1>柔得中乎外而順乎剛</h1><p>柔爻得中於外，順從剛爻，止而附麗於明。</p><p>柔得中乎外，而順乎剛，止而麗乎明。旅之成卦，柔居五中，順乎上剛，有止而明之象。小亨者，以此故也。</p><p><strong>所出</strong>：《周易 · 旅》 — https://zh.wikisource.org/wiki/周易/旅</p></article></main></div></div>
