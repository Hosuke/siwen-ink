    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 玉金籥常完堅</nav></header><main><article><h1>玉金籥常完堅</h1><p>金玉之器完堅不壞</p><p>玉金者，身中之堅固之物也。籥以藏玉金，喻形體之可藏養神精也。常完堅者，完好而堅固，不為外邪所侵。</p><p>修真者形氣完固，則內可以含真，外可以辟邪，故曰常完堅。</p><p><strong>所出</strong>：《黃庭內景經 · 玄元章第二十七》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/玄元章第二十七</p></article></main></div></div>
