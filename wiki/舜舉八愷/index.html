    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 舜舉八愷</nav></header><main><article><h1>舜舉八愷</h1><p>舜舉高陽氏才子八人，使主后土，百事有序。</p><p>昔高陽氏有才子八人，世得其利，謂之「八愷」。堯舉八愷，使主后土，以揆百事，莫不時序。</p><p><strong>所出</strong>：《史記 · 卷001》 — https://zh.wikisource.org/wiki/史記/卷001</p></article></main></div></div>
