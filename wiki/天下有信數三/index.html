    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天下有信數三</nav></header><main><article><h1>天下有信數三</h1><p>智不能立、力不能舉、彊不能勝，凡事皆有定數，不可強求。</p><p>或問桓公以隱-{zh:者}--{zh:曰}-：「一難，二難，三難，何也？」</p><p>管仲對曰：「一難也，近優而遠士。二難也，去其國而數之海。三難也，君老而晩置太子。」</p><p>夫分勢不二，庶孽卑，寵無藉，雖處大臣，晚置太子可也。然則晚置太子，庶孽不亂，又非其難也。物之所謂難者，必借人成勢而勿使侵害己，可謂一難也。貴妾不使二后，二難也。愛孽不使危正適，專聽一臣而不敢偶君，此則可謂三難也。</p><p><strong>所出</strong>：《韓非子 · 難三》 — https://zh.wikisource.org/wiki/韓非子/難三</p></article></main></div></div>
