    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 善毛嗇西施之美</nav></header><main><article><h1>善毛嗇西施之美</h1><p>縱有西施之容，不施脂粉無益；縱有先王之道，不行賞罰無益於治。</p><p>善毛嗇、西施之美，無益吾面；用脂澤粉黛，則倍其初。言先王之仁義，無益於治；明吾法度，必吾賞罰者，亦國之脂澤粉黛也。</p><p><strong>所出</strong>：《韓非子 · 顯學》 — https://zh.wikisource.org/wiki/韓非子/顯學</p></article></main></div></div>
