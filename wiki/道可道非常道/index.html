    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 道可道非常道</nav></header><main><article><h1>道可道非常道</h1><p>道可言者非恆常之正道也。</p><p>道可道，非常道，名可名，非常名。</p><p>夫道超乎言象，名言所及，特事物之麤迹爾。苟可以言傳者，是有限之道也；苟可以名命者，是有待之名也，而非恆常不易之正道、恆名矣。蓋言之愈多，去道愈遠；名之愈著，乖性愈深。是故聖人絕聖棄智，體道於言象之表，悟名於分別之先，見萬物之出於道而道之未嘗有名也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 一章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
