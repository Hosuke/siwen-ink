    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 幡幡瓠葉</nav></header><main><article><h1>幡幡瓠葉</h1><p>瓠葉搖曳之貌，喻物雖微賤亦可採用。</p><p>幡幡，葉動搖貌。瓠即匏瓜，其葉可用以為菹。詩言「幡幡瓠葉，采之亨之」，明物雖微賤苟有可用，人即采之以供祭祀宴饗，非必珍奇而後可享也。</p></article></main></div></div>
