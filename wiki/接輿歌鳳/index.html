    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 接輿歌鳳</nav></header><main><article><h1>接輿歌鳳</h1><p>鳳兮之歌，傷世道之衰</p><p>孔子適楚，楚狂接輿遊其門，曰：「鳳兮鳳兮，何如德之衰也！來世不可待，往世不可追也。天下有道，聖人成焉；天下无道，聖人生焉。方今之時，僅免刑焉。」</p><p><strong>所出</strong>：《莊子 · 人間世》 — https://zh.wikisource.org/wiki/莊子/人間世</p></article></main></div></div>
