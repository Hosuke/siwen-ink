    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 民視天聽</nav></header><main><article><h1>民視天聽</h1><p>天之視聽，即民之視聽，天人相應，民意為天意之準。</p><p>天無口目，其視聽寄於民。民之所視，天以為視；民之所聽，天以為聽。言天之賞罰善惡，皆因民之視聽為準。[[天視自我民視，天聽自我民聽]]，此[[民之所欲天必從之]]之說也。天人相應，未有違民而能得天佑者。</p><p><strong>所出</strong>：《尚書 · 泰誓》 — https://zh.wikisource.org/wiki/尚書/泰誓</p></article></main></div></div>
