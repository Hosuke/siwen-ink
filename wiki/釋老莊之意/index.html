    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 釋老莊之意</nav></header><main><article><h1>釋老莊之意</h1><p>當世聖明，宜去老莊之說不急者，精究六經之正道。</p><p>今聖明在上，稽古濟物，堅堤防以杜決溢，明褒貶以彰勸沮；想宗室公族，及貴門富年，必當競尚儒術，撙節藝文，釋老莊之意不急，精六經之正道也。</p><p><strong>所出</strong>：《抱朴子 · 卷04》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷04</p></article></main></div></div>
