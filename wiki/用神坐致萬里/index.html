    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 用神坐致萬里</nav></header><main><article><h1>用神坐致萬里</h1><p>以神用形則可坐致萬里，蟲之無足者蛇蛭蝸牛皆能如此</p><p>蟲之無足：蛇能屈曲，蛭能掬蹙，蝸牛能蓄縮。小人所以見其機，由是得其師，可以坐致萬里而不馳。是故足行者有所不達，翼飛者有所不至，目視者有所不見，耳聽者有所不聞。夫何故？彼知形而不知神，此知神而不知形。以形用神則亡，以神用形則康。</p><p><strong>所出</strong>：《化書 · 卷二》 — https://zh.wikisource.org/wiki/化書/卷二</p></article></main></div></div>
