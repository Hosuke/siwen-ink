    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 胞樹伐絕</nav></header><main><article><h1>胞樹伐絕</h1><p>斷胞樹之根，除生死之累。</p><p>胞樹伐絕，大洞玉經所言解脫之功也。胞者生育之始，樹者根本之喻。胞有樹則生死相纏，樹有根則血氣不斷。</p><p>高上神霄玉清王祝云「胞樹伐絕，斷滅血根」，令七玄更起、沉景生烟，則胞樹絕而生死之累解矣。</p><p><strong>所出</strong>：《上清大洞真經 · 36章》 — https://zh.wikisource.org/wiki/上清大洞真經/36章</p></article></main></div></div>
