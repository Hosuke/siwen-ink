    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 孟春行夏令</nav></header><main><article><h1>孟春行夏令</h1><p>孟春行夏令則風雨不時草木蚤落，行秋令則大疫，行冬令則水潦雪霜。</p><p>孟春行夏令，則風雨不時，草木蚤落，國時有恐。行秋令，則其民大疫，猋風暴雨總至，藜、莠、蓬、蒿並興。行冬令，則水潦為敗，雪霜大摯，首種不入。</p><p><strong>所出</strong>：《禮記 · 月令》 — https://zh.wikisource.org/wiki/禮記/月令</p></article></main></div></div>
