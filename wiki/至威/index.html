    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 至威</nav></header><main><article><h1>至威</h1><p>善諭威者，於其未發，敵已服而不自知。</p><p>古之至兵，民之重令也。重乎天下，貴乎天子。其藏於民心，捷於肌膚也，深痛執固，不可搖蕩，物莫之能動。若此則敵胡足勝矣？</p><p>故善諭威者，於其未發也，於其未通也，窅窅乎冥冥，莫知其情，此之謂至威之誠。</p><p><strong>所出</strong>：《呂氏春秋 · 卷八》 — https://zh.wikisource.org/wiki/呂氏春秋/卷八</p></article></main></div></div>
