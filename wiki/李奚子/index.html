    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 李奚子</nav></header><main><article><h1>李奚子</h1><p>晉東平太守李忠祖母，救濟禽鳥，積陰德，居華陽洞宮。</p><p>李奚子者，晉東平太守李忠祖母也，不知姓氏。忠祖父貞節丘園，性多慈憫，以陰德為事，奚子每與一誌，務於救人。大雪寒凍路，積稻及谷於園庭，恐禽鳥餓死。其用心如此，今得道而居華陽洞宮中也。</p><p><strong>所出</strong>：《墉城集仙錄 · 卷07》 — https://zh.wikisource.org/wiki/墉城集仙錄/卷07</p></article></main></div></div>
