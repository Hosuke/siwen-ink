    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 季女</nav></header><main><article><h1>季女</h1><p>年少之女子，亦指習禮將嫁之少女</p><p>季女者，年少之女子也。</p><p>《采蘋》言「有齊季女」，毛詩解作「敬」，韓詩解作「好」。據王先謙引士昏禮，季女於祖廟或宗室學習婦德、婦言、婦容、婦功四項功課，所謂「四德」是也。季者，幼也、少也。季女此處指學完功課、將行祭祀之少女，非必年最幼者。</p><p>以季女尸祭，示敬神明；以其主祭，知祭祀之重在承嗣。</p><p><strong>所出</strong>：《詩經 · 采蘋》 — https://zh.wikisource.org/wiki/詩經/采蘋</p></article></main></div></div>
