    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 妾不衣帛馬不食粟</nav></header><main><article><h1>妾不衣帛馬不食粟</h1><p>居上位者當與民同苦樂，不可以奢靡示眾。</p><p>季文子相宣、成，無衣帛之妾，無食粟之馬。仲孫它諫曰：「子為魯上卿，相二君矣，妾不衣帛，馬不食粟，人其以子為愛，且不華國乎！」文子曰：「吾觀國人，其父兄之食麤而衣惡者猶多矣，吾是以不敢。且吾聞以德榮為國華，不聞以妾與馬。」</p><p>文子以告孟獻子，獻子囚之七日。自是，子服之妾衣不過七升之布，馬餼不過稂莠。文子聞之，曰：「過而能改者，民之上也。」使為上大夫。</p><p><strong>所出</strong>：《國語 · 卷04》 — https://zh.wikisource.org/wiki/國語/卷04</p></article></main></div></div>
