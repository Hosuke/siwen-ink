    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 維虺維蛇</nav></header><main><article><h1>維虺維蛇</h1><p>虺蛇入夢，女祥之徵。</p><p>[[維虺維蛇]]者，夢兆之吉也。虺蛇為柔物，象陰靜之德。維虺維蛇，女子之祥。古人以此為生女之兆，與熊羆之象相對，一剛一柔，以見陰陽之別。</p><p><strong>所出</strong>：《詩經 · 斯干》 — https://zh.wikisource.org/wiki/詩經/斯干</p></article></main></div></div>
