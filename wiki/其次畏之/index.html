    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 其次畏之</nav></header><main><article><h1>其次畏之</h1><p>政以威持，民以刑懼。</p><p>德之薄者，下之情不能相通，故以威力懾之。威立則民畏，畏而後服。此治道之又一降也。《[[失道而後德]]》云：「失德而後仁，失仁而後義」，正此之謂。</p><p><strong>所出</strong>：《老子河上公章句 · 淳風》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
