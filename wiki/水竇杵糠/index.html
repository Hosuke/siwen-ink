    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 水竇杵糠</nav></header><main><article><h1>水竇杵糠</h1><p>法本無祖，術本無狀，師之於心，得之於象</p><p>水竇可以下溺，杵糠可以療噎。斯物也，始制於人，又復用於人。法本無祖，術本無狀，師之於心，得之於象。陽為陰所伏，男為女所制，剛為柔所克，智為愚所得。以是用本無，得虛之竊者，知法術之要乎！</p><p><strong>所出</strong>：《化書 · 卷二》 — https://zh.wikisource.org/wiki/化書/卷二</p></article></main></div></div>
