    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 指南車</nav></header><main><article><h1>指南車</h1><p>風後法鬥機所作，以別四方。</p><p>帝與蚩尤大戰於涿鹿之野，未克。蚩尤作百里大霧，彌三晝，帝之軍人皆迷惑。帝乃令風後法鬥機作指南車，以別四方。崔豹《古今注》曰：周公作指南之車。據此時已有指南車，即周公再修之爾。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 1》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/1</p></article></main></div></div>
