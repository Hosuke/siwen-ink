    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 轉降適斗藏初九</nav></header><main><article><h1>轉降適斗藏初九</h1><p>斂神歸斗，藏始生之陽</p><p>轉降適斗藏初九者，[[修真]]斂藏之法也。</p><p>斗在天為北斗，在人象[[泥丸]]。行者以意斂[[兩腎之神]]，逆上而歸於上丹田，斂藏初九之陽勿使外散，如斗之運轉不息。夫[[初九]]者，陽氣始生之機，斂之則[[精]]凝神旺，泄之則形衰壽促。</p><p>其法：旋轉五行之氣，使不上逆而下歸，聚斂[[命門]]之火，藏於[[泥丸]]，如斗之含光。行之積久，[[長生久視]]之道備矣。</p><p><strong>所出</strong>：《黃庭內景經 · 經歷章第三十二》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/經歷章第三十二</p></article></main></div></div>
