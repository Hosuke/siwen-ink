    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 嗚呼曷歸</nav></header><main><article><h1>嗚呼曷歸</h1><p>故國不可歸，萬姓仇予，顏厚有忸怩。</p><p>太康失邦，五子流離，無所歸往，萬姓仇之。此[[五子之歌]]末章所述，深悲覆宗之禍，悔不慎德，雖欲追悔而不可及也。</p><p>其五云：「嗚呼曷歸！予懷之悲。萬姓仇予，予將疇依？鬱陶乎予心，顏厚有忸怩。弗慎厥德，雖悔可追。」</p><p><strong>所出</strong>：《尚書 · 五子之歌》 — https://zh.wikisource.org/wiki/尚書/五子之歌</p></article></main></div></div>
