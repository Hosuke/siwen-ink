    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 卿大夫日卒</nav></header><main><article><h1>卿大夫日卒</h1><p>大夫日卒，正也；稱公弟叔仲，賢也。</p><p>三月壬申，公子季友卒。大夫日卒，正也。稱公弟叔仲，賢也。大夫不言公子公孫，疏之也。</p><p>秋，七月甲子，公孫茲卒。大夫日卒，正也。</p><p>《穀梁》明大夫卒之書法：書日者，以其正也；稱「公弟叔仲」者，以其賢也；不稱公子公孫者，以其疏也。一人之稱，分三等，書法之嚴也。</p><p><strong>所出</strong>：《春秋穀梁傳 · 僖公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/僖公</p></article></main></div></div>
