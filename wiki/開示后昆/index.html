    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 開示后昆</nav></header><main><article><h1>開示后昆</h1><p>聖賢憫後生之迷惑，披露圖文以開示之。</p><p>好道之倫，隨傍風采，指畫古文，著為圖集，開示后昆。</p><p>後昆者，後世之學者也。聖賢憂憫後生之迷惑，因指畫古文，著為圖集，以開示之，使不失正途。</p><p><strong>所出</strong>：《周易參同契 · 31章》 — https://zh.wikisource.org/wiki/周易參同契/31章</p></article></main></div></div>
