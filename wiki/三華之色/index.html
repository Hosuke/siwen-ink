    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三華之色</nav></header><main><article><h1>三華之色</h1><p>三種精華之色，華光罩於頂上。</p><p>三華之色，修煉時觀想之光華也。思[[胎中白炁君]]與太一精魂玄歸子之真炁，化為三華光明之色，罩於頂上。泥丸中入，口吸神雲，咽津結神，以成修煉之功。</p><p><strong>所出</strong>：《上清大洞真經 · 30章》 — https://zh.wikisource.org/wiki/上清大洞真經/30章</p></article></main></div></div>
