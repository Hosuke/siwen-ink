    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 棺槨之間君容柷</nav></header><main><article><h1>棺槨之間君容柷</h1><p>棺與槨之間，其容量之制，因爵命而殊，示禮秩之等差。</p><p>棺槨之間，君容柷，大夫容壺，士容甒。君里槨虞筐，大夫不里槨，士不虞筐。</p><p><strong>所出</strong>：《禮記 · 喪大記》 — https://zh.wikisource.org/wiki/禮記/喪大記</p></article></main></div></div>
