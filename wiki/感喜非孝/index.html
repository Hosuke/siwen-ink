    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 感喜非孝</nav></header><main><article><h1>感喜非孝</h1><p>感父之慈非孝，喜君之寵非忠；感喜在心由物之有毒，由蓬之藏火，不可不慮。</p><p>感父之慈，非孝也；喜君之寵，非忠也。感始於不感，喜始於不喜。多感必多怨，多喜必多怒。感喜在心，由物之有毒，由蓬之藏火，不可不慮。是以君子之業，爵之不貴，禮之不大，親之不知，疏之不疑，辱之不得，何感喜之有。</p><p><strong>所出</strong>：《化書 · 卷三》 — https://zh.wikisource.org/wiki/化書/卷三</p></article></main></div></div>
