    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 選明師良友</nav></header><main><article><h1>選明師良友</h1><p>教育子弟，當選明師以成之，良友以漸染之，方能免於邪偽。</p><p>先哲居高，不敢忘危，愛子欲教之義方，雕琢切磋，弗納於邪偽。選明師以象成之，擇良友以漸染之，督之以博覽，示之以成敗，使之察往以悟來，觀彼以知此，驅之於直道之上，斂之乎檢括之中，懍乎若跟掛於萬仞，栗然有如乘奔以履冰。故能多遠悔吝，保其貞吉也。</p><p><strong>所出</strong>：《抱朴子 · 卷04》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷04</p></article></main></div></div>
