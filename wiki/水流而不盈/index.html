    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 水流而不盈</nav></header><main><article><h1>水流而不盈</h1><p>坎之為水，雖流不溢，以喻行險不失其信。</p><p>彖曰：「水流而不盈，行險而不失其信。」</p><p>水之性，趨下而流，盈於坎窪而不過滿，以喻君子處險，能守誠信，不渝於危困者也。水流坎窪而常若未盈，此聖人之德在乎持守剛中，雖遇艱險而終得有孚之亨。</p><p><strong>所出</strong>：《周易 · 坎》 — https://zh.wikisource.org/wiki/周易/坎</p></article></main></div></div>
