    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 武卒</nav></header><main><article><h1>武卒</h1><p>魏氏精選之武士，耗稅而難繼。</p><p>魏氏之武卒，以度取之，衣三屬之甲，操十二石之弩，負服矢五十，冠冑帶劍，贏三日之糧，日中而趨百里。中試則復其戶，利其田宅，數年而衰，未可奪也，改造則不易周，是故地雖大，其稅必寡，是危國之兵也。</p><p><strong>所出</strong>：《荀子 · 議兵篇》 — https://zh.wikisource.org/wiki/荀子/議兵篇</p></article></main></div></div>
