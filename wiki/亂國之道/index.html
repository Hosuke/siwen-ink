    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 亂國之道</nav></header><main><article><h1>亂國之道</h1><p>聖王所禁者，皆亂國之道。</p><p>亂國之道，易國之常，賜賞恣於己者，聖王之禁也。聖王既歿，受之者衰。君人而不能知立君之道，以為國本，則大臣之贅下而射人心者必多矣。君不能審立其法以為下制，則百姓之立私理而徑於利者必衆矣。</p><p><strong>所出</strong>：《管子 · 第14篇法禁》 — https://zh.wikisource.org/wiki/管子/第14篇法禁</p></article></main></div></div>
