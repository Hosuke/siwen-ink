    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 逆者還順</nav></header><main><article><h1>逆者還順</h1><p>犯律者改悔從善，則天奪之算可贖。</p><p>犯《[[女青鬼律]]二十一禁而奪算者，若能「逆者還順，惡者還善」，則可「改往修來」。[[天師]]云：「逆者還順，惡者還善，改往修來，當依鬼律令。」又云：「功過相贖，民若不用，故有宣化之心，可自改往修來，專一養性，可度天三災九厄。」</p><p><strong>所出</strong>：《女青鬼律 · 卷3》 — https://zh.wikisource.org/wiki/女青鬼律/卷3</p></article></main></div></div>
