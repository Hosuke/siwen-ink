    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大盈若沖</nav></header><main><article><h1>大盈若沖</h1><p>至滿者其容若虛空</p><p>大盈若沖，其用不窮。</p><p>極大之充盈者，其外視若空虛，然其功用無有窮竭。盈與沖相待而成，滿則必溢，沖則能容。此與[[大成若缺]]之旨相通，示聖人盛德若虛，無所盈滿，故能以不足之器受無盡之用。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第八章 請靚》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
