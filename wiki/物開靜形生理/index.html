    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 物開靜形生理</nav></header><main><article><h1>物開靜形生理</h1><p>物之生也，開於靜；形之成也，循其理。</p><p>物之為物也，開其靜者乃能遂生；形之成理也，守其開者乃能成務。凡物稟此開靜之性，則形生於內，理成於外，無所窒礙。此聖人所以畜民而養之者，必以靜為本，不擾不迫，而萬物自遂其生也。</p><p><strong>所出</strong>：《管子 · 第09篇幼官圖》 — https://zh.wikisource.org/wiki/管子/第09篇幼官圖</p></article></main></div></div>
