    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無敵八事</nav></header><main><article><h1>無敵八事</h1><p>治兵有八要：聚財、論工、制器、選士、政教、服習、遍知天下、明於機數。</p><p>治兵之要，有八事焉。存乎聚財，而財無敵。存乎論工，而工無敵。存乎制器，而器無敵。存乎選士，而士無敵。存乎政教，而政教無敵。存乎服習，而服習無敵。存乎遍知天下，而遍知天下無敵。存乎明於機數，而明於機數無敵。故兵未出境，而無敵者八。苟缺其一，則天下不可以正矣。</p><p><strong>所出</strong>：《管子 · 爲兵之數》 — https://zh.wikisource.org/wiki/管子/七法/爲兵之數</p></article></main></div></div>
