    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 尚賢使能等貴賤分親疏序長幼</nav></header><main><article><h1>尚賢使能等貴賤分親疏序長幼</h1><p>先王以賢能、貴賤、親疏、長幼四者為治世之綱紀。</p><p>先王之道，以尚賢使能為首務，賢能既尊，則貴賤有等而不紊；其次分親疏之別，親者近而疏者遠，各有其施；再次序長幼之倫，長幼既定，則事功捷成而無競。《書》曰：「百姓不親，五品不遜。」先王知其然，故設為四者之教，使天下曉然知所趨嚮，而政治得其次序也。</p><p><strong>所出</strong>：《荀子 · 君子篇》 — https://zh.wikisource.org/wiki/荀子/君子篇</p></article></main></div></div>
