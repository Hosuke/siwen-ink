    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 劉琨勸進</nav></header><main><article><h1>劉琨勸進</h1><p>劉琨之勸進表，文致耿介，陳事之美表也。</p><p>劉琨勸進，張駿自序，文致耿介，並陳事之美表也。劉琨字越石，晉室傾覆，懷愍蒙塵，琨屢上表勸進，其辭慷慨激烈，忠義耿介，實為表文之上品。</p><p><strong>所出</strong>：《文心雕龍 · 章表》 — https://zh.wikisource.org/wiki/文心雕龍/章表</p></article></main></div></div>
