    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 西門豹引漳水溉鄴</nav></header><main><article><h1>西門豹引漳水溉鄴</h1><p>西門豹引漳水以溉鄴，使魏之河內富饒。</p><p>西門豹引漳水溉鄴，以富魏之河內。鄴在魏國之北，漳水流經其地。豹為鄴令，興水利，導漳水入渠，以灌田疇，使鹵地化為膏腴，魏之河內遂以富饒。此為戰國水利典範之一，與蜀守冰穿離碓、秦鄭國穿涇渠，並為千古水利之佳話。</p><p><strong>所出</strong>：《史記 · 卷029》 — https://zh.wikisource.org/wiki/史記/卷029</p></article></main></div></div>
