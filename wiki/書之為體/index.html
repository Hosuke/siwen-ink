    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 書之為體</nav></header><main><article><h1>書之為體</h1><p>書以主言，為表情志之具。</p><p>書之為體，主言者也。[[書者舒也]]，舒布其言，陳之簡牘，取象於夬，貴在明決而已。聖賢言辭，總為之書。[[揚雄]]云「言，心聲也；書，心畫也」，聲畫形而君子小人見矣。</p><p><strong>所出</strong>：《文心雕龍 · 書記》 — https://zh.wikisource.org/wiki/文心雕龍/書記</p></article></main></div></div>
