    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 男生而伏</nav></header><main><article><h1>男生而伏</h1><p>男女稟氣有定，死後亦效</p><p>男生而伏，女偎其軀，秉乎胞胎，受氣之初，非徒生時，著而見之，及其死也，亦復效之，此非父母教令使然，本在[[交媾定置始先]]。言男女之形稟乎陰陽，生而死，死而生，莫不皆然，非學而能者。[[胞胎受氣之初]]，已定其稟，非後所能易也。</p><p><strong>所出</strong>：《周易參同契 · 26章》 — https://zh.wikisource.org/wiki/周易參同契/26章</p></article></main></div></div>
