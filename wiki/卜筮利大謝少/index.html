    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 卜筮利大謝少</nav></header><main><article><h1>卜筮利大謝少</h1><p>季主言卜筮利人甚大而謝禮甚寡</p><p>季主言卜筮之德云：「而以義置數十百錢，病者或以愈，且死或以生，患或以免，事或以成，嫁子娶婦或以養生：此之為德，豈直數十百錢哉！」言卜者所濟甚廣，而所取甚微，其利人弘矣，其謝寡矣。</p><p><strong>所出</strong>：《史記 · 卷127》 — https://zh.wikisource.org/wiki/史記/卷127</p></article></main></div></div>
