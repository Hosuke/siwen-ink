    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 祭仲專國</nav></header><main><article><h1>祭仲專國</h1><p>祭仲為莊公卿，專執國政，數易君主</p><p>祭仲甚有寵於莊公，莊公使為卿。公使娶鄧女，生太子忽，故祭仲立忽，是為昭公。莊公又娶宋雍氏女，生厲公突。雍氏有寵於宋。宋莊公聞祭仲之立忽，乃使人誘執祭仲，曰：「不立突，將死。」祭仲許宋，與宋盟，以突歸，立之，是為厲公。厲公四年，祭仲專國政。厲公陰使其壻雍糾欲殺祭仲，祭仲反殺雍糾。厲公出居櫟，祭仲迎昭公忽，六月乙亥，復入鄭。</p><p><strong>所出</strong>：《史記 · 卷042》 — https://zh.wikisource.org/wiki/史記/卷042</p></article></main></div></div>
