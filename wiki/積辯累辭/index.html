    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 積辯累辭</nav></header><main><article><h1>積辯累辭</h1><p>累辭積辯，離理失術，兩末之議，不足以難道理之言。</p><p>[[韓非]]駁客之說，以為待越人之善[[海遊者]]以救中國之溺人，越人善遊而溺者不濟；待古之王良以馭今之馬，亦猶[[越人救溺]]之說。[[賞罰]]不行，[[勢]]之足用不明，乃累辭積辯，離理失術，兩末之議也。夫[[良馬固車]]，五十里而一置，中手御之，追速致遠可以及矣，何必待古之王良乎？此味非飴蜜，必苦[[萊亭歴]]也，奚可以難[[道理之言]]哉？</p><p><strong>所出</strong>：《韓非子 · 難勢》 — https://zh.wikisource.org/wiki/韓非子/難勢</p></article></main></div></div>
