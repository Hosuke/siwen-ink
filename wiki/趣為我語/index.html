    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 趣為我語</nav></header><main><article><h1>趣為我語</h1><p>絳侯不好文學，召士說書，促令直陳，以其椎樸少文也。</p><p>勃為人木彊敦厚，不好文學。每召諸生說士，東鄉坐而責之曰：「趣為我語。」其椎少文如此。</p><p><strong>所出</strong>：《史記 · 卷057》 — https://zh.wikisource.org/wiki/史記/卷057</p></article></main></div></div>
