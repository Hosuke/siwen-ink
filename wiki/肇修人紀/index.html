    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 肇修人紀</nav></header><main><article><h1>肇修人紀</h1><p>先王始修人倫綱紀以為治本。</p><p>伊尹稱先王之德，曰：「先王肇修人紀，從諫弗咈，先民時若。」言古之聖王始修人道之綱紀，樂聞直言而不逆從諫之美，先民之行皆可法則。以此居上則明，在下則忠，與人不求備，檢身若不及，故能至於有萬邦。此艱難之道，不可不勉也。</p><p><strong>所出</strong>：《尚書 · 伊訓》 — https://zh.wikisource.org/wiki/尚書/伊訓</p></article></main></div></div>
