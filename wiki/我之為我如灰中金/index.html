    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 我之為我如灰中金</nav></header><main><article><h1>我之為我如灰中金</h1><p>我之真我不若礦砂之金，破礦得金，淘沙得金，揚灰終身無得金者。</p><p>我之為我，如灰中金，而不若礦砂之金。破礦得金，淘沙得金，揚灰終身，無得金者。</p><p><strong>所出</strong>：《關尹子 · 6》 — https://zh.wikisource.org/wiki/關尹子/6</p></article></main></div></div>
