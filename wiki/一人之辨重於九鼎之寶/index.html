    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 一人之辨，重於九鼎之寶</nav></header><main><article><h1>一人之辨，重於九鼎之寶</h1><p>辯士一人之論，其力重於九鼎。</p><p>一人之辨，重於九鼎之寶，三寸之舌，強於百萬之師。[[說]]之善用，足以動搖邦國。[[弛張相隨]]之術，[[披肝膽以濟辭]]之心，合而用之，乃辯士之極致。戰國之際，[[從橫參謀]]之風興焉。</p><p><strong>所出</strong>：《文心雕龍 · 論說》 — https://zh.wikisource.org/wiki/文心雕龍/論說</p></article></main></div></div>
