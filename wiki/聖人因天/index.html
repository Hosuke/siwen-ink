    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖人因天</nav></header><main><article><h1>聖人因天</h1><p>天因人而變，聖人因天而行，天人之際，相須而成也。</p><p>逆節萌生，天地未刑，先為之政，其事乃不成，繆受其刑。天因人，聖人因天。</p><p>是故善周者，明不能見；善明者，周不能蔽。大明勝大周，則民無大周也；大周勝大明，則民無大明也。大周之先，可以奮信；大明之祖，可以代天下。</p><p><strong>所出</strong>：《管子 · 勢》 — https://zh.wikisource.org/wiki/管子/勢</p></article></main></div></div>
