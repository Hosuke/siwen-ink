    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 建言</nav></header><main><article><h1>建言</h1><p>老子引古言以明道之反常人智</p><p>建言者，設言以明道也。[[河上公章句]]引古人之言，以為信道者之戒。上士勤行，中士若亡，下士大笑，是道之不行於下也。及夫明道若昧、進道若退、夷道若纇，無非以柔弱谦下為宗。後世之君，苟能法此，則道洽民淳，而德化成矣。</p><p><strong>所出</strong>：《老子河上公章句 · 同異》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
