    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 百果草木皆甲坼</nav></header><main><article><h1>百果草木皆甲坼</h1><p>雷雨作則百果草木甲冑坼裂，以喻恩澤及物，生意勃發。</p><p>解之成卦，天地閉塞之氣散焉。雷雨既作，則百果、草木皆甲坼。甲者，種之皮；坼者，裂也。言雷雨溥施，生意勃然而起，勾萌甲坼，各遂其性。此天地之解，於以見浩蕩之仁也。</p><p>「解之時義大矣哉」，正指此等氣象而言之。</p><p><strong>所出</strong>：《周易 · 解》 — https://zh.wikisource.org/wiki/周易/解</p></article></main></div></div>
