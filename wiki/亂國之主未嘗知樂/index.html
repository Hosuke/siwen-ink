    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 亂國之主未嘗知樂</nav></header><main><article><h1>亂國之主未嘗知樂</h1><p>亂世之主不識音樂治道之理，有其名而無其實。</p><p>五帝三王之於樂盡之矣，亂國之主，未嘗知樂者，是常主也。夫有天賞得為主，而未嘗得主之實，此之謂大悲。是正坐於夕室也，其所謂正，乃不正矣。</p><p><strong>所出</strong>：《呂氏春秋 · 卷六》 — https://zh.wikisource.org/wiki/呂氏春秋/卷六</p></article></main></div></div>
