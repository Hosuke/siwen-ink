    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 寧丁我躬</nav></header><main><article><h1>寧丁我躬</h1><p>旱災適加於我身，言天祸之酷。</p><p>詩言「耗斁下土，寧丁我躬」，丁，當也。言天耗敗下土，寧當我身，躬當其祸也。后稷不克，上帝不臨，諸神不聽，而旱灾卒加於我也。</p><p><strong>所出</strong>：《詩經 · 雲漢》 — https://zh.wikisource.org/wiki/詩經/雲漢</p></article></main></div></div>
