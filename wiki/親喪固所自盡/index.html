    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 親喪固所自盡</nav></header><main><article><h1>親喪固所自盡</h1><p>親喪之際，當自盡其心，不待外求</p><p>滕定公薨，世子欲行三年之喪，問之孟子。孟子引曾子之言，謂親喪者固所自盡，非有待於外也。三年之喪，上自天子、下達庶人，三代共之，此人心所同然耳。</p><p><strong>所出</strong>：《孟子 · 滕文公上》 — https://zh.wikisource.org/wiki/孟子/滕文公上</p></article></main></div></div>
