    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 雞狗之聲相聞</nav></header><main><article><h1>雞狗之聲相聞</h1><p>雞鳴狗吠之聲相及，喻境壤相近，聲息可達。</p><p>老子所述至治之世，鄰邦相望，雞狗之聲相聞，而民至老死不相往來。相聞者，言其近也；不相往來者，言其安也。近而能不往，聞而不相擾，此至治之極也。蓋人情好往來而厭寂寞，唯聖人治世，使民各安其土、自樂其俗，聲息可達而不相通，雞鳴狗吠之頃已知鄰居之所在，而無往來交接之勞。相聞而不相往，乃所以全其靜、保其樸也。聲之相聞者天地之自然，人之不相往來者至治之功，相輔以成郅治之象。</p><p><strong>所出</strong>：《老子 (帛書本) · 章八十》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
