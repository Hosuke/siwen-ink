    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 道交者父子</nav></header><main><article><h1>道交者父子</h1><p>道交者合於父子，出於是非賢愚之外，故能久。</p><p>有道交者，有德交者，有事交者。道交者，父子也，出於是非賢愚之外，故久。德交者，則有是非賢愚矣，故或合或離。事交者，合則離。</p><p><strong>所出</strong>：《關尹子 · 9》 — https://zh.wikisource.org/wiki/關尹子/9</p></article></main></div></div>
