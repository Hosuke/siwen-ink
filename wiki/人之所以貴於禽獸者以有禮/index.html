    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 人之所以貴於禽獸者以有禮</nav></header><main><article><h1>人之所以貴於禽獸者以有禮</h1><p>禮別人獸，人無禮則同於禽獸。</p><p>景公與群臣酣飲，欲廢禮。晏子諫曰：「禽獸以力為政，強者犯弱，故日易主。今君去禮，則是禽獸也。群臣以力為政，強者犯弱，而日易主，君將安立矣？」又云：「凡人之所以貴於禽獸者，以有禮也。」遂引《詩》曰：「人而無禮，胡不遄死。」蓋禮者，人之所以為人，國之所以為國。晏子以為，去禮則上下失序，強凌弱、眾暴寡，其國必危。故禮不可一日而去。</p><p><strong>所出</strong>：《晏子春秋 · 卷一》 — https://zh.wikisource.org/wiki/晏子春秋/卷一</p></article></main></div></div>
