    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 胎仙母</nav></header><main><article><h1>胎仙母</h1><p>帝一之母，胞胎之源，養形之宗。</p><p>九靈真仙母青金丹皇君者，帝一尊君之全號也。經云「九靈真仙母青金丹皇君道經第三十九」，又辭云「帝一變日神，合靈西丹皇」。</p><p>丹皇者，金丹之皇，[[西王母宮]]之主。修此法者，存思帝一與丹皇合靈，上為胎仙母，下號理神宗，以[[玄一]]老子、三老素牢為輔，共登玉晨。</p><p><strong>所出</strong>：《上清大洞真經 · 39章》 — https://zh.wikisource.org/wiki/上清大洞真經/39章</p></article></main></div></div>
