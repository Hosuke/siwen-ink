    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 六職</nav></header><main><article><h1>六職</h1><p>王公、士大夫、百工、商旅、農夫、婦功，國之六種職業也。</p><p>國有六職，百工與居一焉。</p><p>或坐而論道；或作而行之；或審曲面勢，以飭五材，以辨民器；或通四方之珍異以資之；或飭力以長地財；或治絲麻以成之。</p><p>坐而論道，謂之王公；作而行之，謂之士大夫；審曲面勢，以飭五材，以辨民器，謂之百工；通四方之珍異以資之，謂之商旅；飭力以長地財，謂之農夫；治絲麻以成之，謂之婦功。</p><p><strong>所出</strong>：《周禮 · 冬官考工記》 — https://zh.wikisource.org/wiki/周禮/冬官考工記</p></article></main></div></div>
