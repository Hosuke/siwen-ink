    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 弗厭不厭</nav></header><main><article><h1>弗厭不厭</h1><p>不厭民者，民亦不厭之</p><p>夫唯弗厭，是以不厭。</p><p>上不厭下，則下不厭上；上厭下，則下亦厭上，此感應之常理也。不厭者，非徒不以刑威懾民，亦不奪民時、不竭民力、不傷民生也。上無厭求，下乃安居樂業，上下相安，國家長保，此之謂不厭之效也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第三十七章 畏畏》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
