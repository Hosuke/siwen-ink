    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 讚者明也助也</nav></header><main><article><h1>讚者明也助也</h1><p>讚者，明也，助也，所以獎歎也</p><p>讚者，明也，助也。昔虞舜之祀，樂正重讚，蓋唱發之辭也。及益讚於禹，伊陟讚於巫咸，並颺言以明事，嗟嘆以助辭也。故漢置鴻臚，以唱拜為讚，即古之遺語也。</p><p><strong>所出</strong>：《文心雕龍 · 頌讚》 — https://zh.wikisource.org/wiki/文心雕龍/頌讚</p></article></main></div></div>
