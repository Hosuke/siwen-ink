    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 惠迪吉，從逆凶</nav></header><main><article><h1>惠迪吉，從逆凶</h1><p>順道而行則吉，逆道而行則凶，如影隨形，如響應聲。</p><p>益贊於禹，申言天道報應之理曰：「惠迪吉，從逆凶，惟影響。」</p><p>[[惠迪吉從逆凶]]者，言人行善道，則吉慶從之；行逆道，則凶禍隨之。其應也，如影之隨形，如響之應聲，曾無爽也。</p><p>此即天道至公之義。《易》曰「積善之家必有餘慶，積不善之家必有餘殃」，義與此同。帝王之所以戒慎者，惟在慎其所從之道而已。</p><p><strong>所出</strong>：《尚書 · 大禹謨》 — https://zh.wikisource.org/wiki/尚書/大禹謨</p></article></main></div></div>
