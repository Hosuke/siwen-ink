    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 緜緜瓜瓞</nav></header><main><article><h1>緜緜瓜瓞</h1><p>瓜之漸大以興周族之繁衍不絕也。</p><p>緜緜瓜瓞，民之初生，自土沮漆。</p><p>瓜之蔓近則漸大，遠則引之而彌長。周人自沮漆之地出，由小以至盛大，取興於茲也。</p><p><strong>所出</strong>：《詩經 · 緜》 — https://zh.wikisource.org/wiki/詩經/緜</p></article></main></div></div>
