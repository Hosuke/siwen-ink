    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 旨酒思柔</nav></header><main><article><h1>旨酒思柔</h1><p>酒旨而性和，柔亦美德也。</p><p>[[旨酒思柔]]出《桑扈》，言酒旨而性和也。</p><p>詩云：「兕觥其觩，旨酒思柔。」言美酒柔和，可以養德也。《傳》曰：「思，語辭也。」此頌君子燕饗之禮。</p><p><strong>所出</strong>：《詩經 · 桑扈》 — https://zh.wikisource.org/wiki/詩經/桑扈</p></article></main></div></div>
