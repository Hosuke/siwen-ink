    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 綱紀</nav></header><main><article><h1>綱紀</h1><p>天合地合於玄甲，治之綱紀。</p><p>坎者，水也，陰也，[[紀]]也。天與地常合，其[[綱紀]]於玄甲子初出，此可為有德上君治[[綱紀]]也。</p><p><strong>所出</strong>：《太平經 · 07》 — https://zh.wikisource.org/wiki/太平經/07</p></article></main></div></div>
