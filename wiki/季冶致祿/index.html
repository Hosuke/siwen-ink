    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 季冶致祿</nav></header><main><article><h1>季冶致祿</h1><p>季冶追卞人而歸其祿，以為受欺君之祿而立其朝，非所能事。</p><p>襄公在楚，季武子取卞，使季冶逆，追而予之璽書，以告曰：「卞人將畔，臣討之，既得之矣。」公未言，榮成子曰：「子股肱魯國，社稷之事，子實制之。唯子所利，何必卞？」子冶歸，致祿而不出，曰：「使予欺君，謂予能也。欺其君，敢享其祿而立其朝乎？」</p><p><strong>所出</strong>：《國語 · 卷05》 — https://zh.wikisource.org/wiki/國語/卷05</p></article></main></div></div>
