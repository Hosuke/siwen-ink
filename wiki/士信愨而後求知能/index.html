    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 士信愨而後求知能</nav></header><main><article><h1>士信愨而後求知能</h1><p>士先以信愨為本，而後可以求其才能。</p><p>孔子言：「弓調而後求勁焉，馬服而後求良焉，士信愨而後求知能焉。」言取人之法，如弓必先調而後求其勁，馬必先服而後求其良，士必先信愨而後可任以智能。若士無信愨而有多知多能，則如豺狼，不可以身試也。</p><p><strong>所出</strong>：《荀子 · 哀公篇》 — https://zh.wikisource.org/wiki/荀子/哀公篇</p></article></main></div></div>
