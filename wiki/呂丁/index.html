    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 呂丁</nav></header><main><article><h1>呂丁</h1><p>許國始封之君，受封於許者。</p><p>呂丁者，許國之始封君也。</p><p>考《封許之命》首言「則惟汝呂丁」，又云「亦惟汝呂丁」，凡再見之。呂丁蓋丁公之名，諡曰丁公，與周之太公望、魯公伯禽、衛康叔封並稱。成王以其輔翼文王、武王有功，封建於許，使為侯伯，扞輔王室。命辭稱其「肇牽文王」以言其早歲事文王，「扞輔武王」以言其武王時之功烈，蓋許之先世嘗為周文、武舊臣可知也。</p><p>許國既封，呂丁後子孫世守其地，春秋之世猶見許男諸侯之事。</p><p><strong>所出</strong>：《尚書 · 封許之命》 — https://zh.wikisource.org/wiki/尚書/封許之命</p></article></main></div></div>
