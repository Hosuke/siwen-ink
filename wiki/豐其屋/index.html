    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 豐其屋</nav></header><main><article><h1>豐其屋</h1><p>居豐之極，屋宅豐大而幽暗不明，闃無其人，凶之道也。</p><p>上六：「豐其屋，蔀其家，窺其戶，闃其無人，三歲不覿，凶。」</p><p>上六居豐之極，處動之末，豐大其屋以自尊，蔀蔽其家以自絕。窺其戶而闃然無人之象，三歲不見一人，凶甚矣。</p><p>象曰「天際翔」者，言其屋高如翔於天際，自藏而莫能窺也。又曰「自藏」，言非人藏之，乃自取幽蔽以至是也。</p><p><strong>所出</strong>：《周易 · 豐》 — https://zh.wikisource.org/wiki/周易/豐</p></article></main></div></div>
