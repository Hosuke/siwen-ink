    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 東越王馀善刻璽</nav></header><main><article><h1>東越王馀善刻璽</h1><p>馀善既殺郢自立，後復叛漢，乃刻「武帝」璽以自尊，欺其民而為妄言。</p><p>東越王郢既弒，弟馀善威行國中，既立為東越王矣。及南越反，馀善請從樓船將軍擊呂嘉，兵至揭揚，托以海風波，不行，陰通南越。漢破番禺，樓船將軍楊僕請擊東越，天子以其疲師，不許。迨元鼎六年秋，馀善聞樓船請誅之，漢兵且至，遂反。發兵距漢道，號將軍騶力等為「吞漢將軍」，入白沙、武林、梅嶺，殺漢三校尉。復刻「武帝」璽自立，詐其民，為妄言。其狂悖甚矣。</p><p><strong>所出</strong>：《史記 · 卷114》 — https://zh.wikisource.org/wiki/史記/卷114</p></article></main></div></div>
