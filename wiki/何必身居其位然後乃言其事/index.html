    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 何必身居其位然後乃言其事</nav></header><main><article><h1>何必身居其位然後乃言其事</h1><p>論不必居官而在野者亦可議政</p><p>抱朴子駁客嘲曰：老子，無為者也；鬼谷，終隱者也，而皆著書論世務。[[伯成子高隱耕]]，亦嘗為[[堯舜禹湯文武之道]]之辨。是知器非瓊瑤則楚和不泣，質非潛虛則風雲不集，未必達官乃可[[議事]]也。</p><p><strong>所出</strong>：《抱朴子 · 卷42》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷42</p></article></main></div></div>
