    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 脩德</nav></header><main><article><h1>脩德</h1><p>脩德於身，乃及家國天下，遞相慶也。</p><p>脩之於身者，其德乃真，長生不死之真人。脩之於家者，父慈子孝，祥風被世。脩之於鄉，尊敬長老，無不覆焉。脩之於國，仁義自生，政平無私。脩之於天下，不言而化，不教而治，其德普傳。蓋脩德者自近及遠，自小逮大，自家而天下，莫不始於一人之身。</p><p><strong>所出</strong>：《老子河上公章句 · 修觀》 — https://zh.wikisource.org/wiki/老子河上公章句/德觀</p></article></main></div></div>
