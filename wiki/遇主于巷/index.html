    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 遇主于巷</nav></header><main><article><h1>遇主于巷</h1><p>賢者失位，遇主於微，以誠相遇，巷非失道。</p><p>「遇主于巷」者，睽卦九二之辭也。九二以陽居陰，失位而非正，然其心在遇六五之君，雖在巷陋之中，不失其道。《象》曰「遇主于巷，未失道也」，蓋賢者之遇主也，不以遇之非其地而改其志，屈以求伸，因時待命，斯亦无咎之義也。</p><p><strong>所出</strong>：《周易 · 睽》 — https://zh.wikisource.org/wiki/周易/睽</p></article></main></div></div>
