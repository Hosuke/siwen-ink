    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 思神致神</nav></header><main><article><h1>思神致神</h1><p>思善致善，思神致神，思邪致愚，感應之理必然</p><p>是故思神致神，思真致真，思仙致仙，思道致道，思智致智。聖人之精思賢人，致賢人之神來佑之；思邪，致愚人之鬼來惑之。人可思念，皆有可致，在可思者優劣而已。</p><p>故上士為君，乃思神真；中士為君，乃心通而多智；下士為君，無可能思，隨命可為。</p><p>思神守一乃治之本也，壽之征也。</p><p>夫樂於道何為者也？樂乃可和合陰陽，凡事默作也，使人得道本也。</p><p><strong>所出</strong>：《太平經 · 02》 — https://zh.wikisource.org/wiki/太平經/02</p></article></main></div></div>
