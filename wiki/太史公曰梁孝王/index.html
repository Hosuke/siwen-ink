    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 太史公曰梁孝王</nav></header><main><article><h1>太史公曰梁孝王</h1><p>梁孝王以親愛享膏腴，然僭天子儀衛，終以驕蹇致禍。</p><p>太史公曰：梁孝王雖以親愛之故，王膏腴之地，然會漢家隆盛，百姓殷富，故能植其財貨，廣宮室，車服擬於天子。然亦僭矣。</p><p>【索隱述贊】文帝少子，徙封於梁。太后鍾愛，廣築睢陽。旌旂警蹕，勢擬天王。功扞吳楚，計醜孫羊。竇嬰正議，袁盎劫傷。漢窮梁獄，冠蓋相望。禍成驕子，致此倡狂。雖分五國，卒亦不昌。</p><p><strong>所出</strong>：《史記 · 卷058》 — https://zh.wikisource.org/wiki/史記/卷058</p></article></main></div></div>
