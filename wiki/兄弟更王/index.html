    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 兄弟更王</nav></header><main><article><h1>兄弟更王</h1><p>田儋、田榮、田橫兄弟三人相繼為齊王。</p><p>田儋起兵殺狄令，自立為齊王，與秦將章邯戰死於臨濟。其弟田榮收兵東走，立田儋子市為齊王，榮相之，田橫為將。項羽分封後，榮不肯出兵助楚，自立為齊王，盡並三齊之地。榮敗死，橫復收齊散兵，立田廣為齊王，而橫相之。是兄弟三人，更相為王，故云「兄弟更王」。</p><p><strong>所出</strong>：《史記 · 卷094》 — https://zh.wikisource.org/wiki/史記/卷094</p></article></main></div></div>
