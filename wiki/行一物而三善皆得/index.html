    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 行一物而三善皆得</nav></header><main><article><h1>行一物而三善皆得</h1><p>世子齒學一事，而父子、君臣、長幼之道皆得。</p><p>行一物而三善皆得者，唯世子而已。其齒於學之謂也。故世子齒於學，國人觀之曰：「將君我而與我齒讓何也？」曰：「有父在則禮然，然而眾知父子之道矣。」其二曰：「將君我而與我齒讓何也？」曰：「有君在則禮然，然而眾著於君臣之義也。」其三曰：「將君我而與我齒讓何也？」曰：「長長也，然而眾知長幼之節矣。」</p><p><strong>所出</strong>：《禮記 · 文王世子》 — https://zh.wikisource.org/wiki/禮記/文王世子</p></article></main></div></div>
