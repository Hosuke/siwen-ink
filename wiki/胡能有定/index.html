    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 胡能有定</nav></header><main><article><h1>胡能有定</h1><p>冀望安定而不可得，反覆詠歎之辭</p><p>詩中凡四見，章各一言。言日月照臨，終古有常；而乃如之人，去而不還，恩情有變，靡有定止。詩人所以四言「胡能有定」者，蓋深傷夫匹偶之無常、內心之靡定也。舊說以為衛莊姜傷己之詩，遭州吁之亂，不見荅於先君，故發此問。欲定而不得，怨慕之情至矣。</p><p><strong>所出</strong>：《詩經 · 日月》 — https://zh.wikisource.org/wiki/詩經/日月</p></article></main></div></div>
