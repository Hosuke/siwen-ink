    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 惟斯妙術</nav></header><main><article><h1>惟斯妙術</h1><p>丹道妙術，審諦不誑，傳于億世，昭然可考。</p><p>惟斯之妙術兮，審諦不誑語。傳于億世后兮，昭然自可考。</p><p>丹道之術，妙而難言，必審諦而後達，非妄語者所可窺。惟斯妙術，循而行之，傳于億世，昭昭然明白可考，非幻設也。</p><p><strong>所出</strong>：《周易參同契 · 32章》 — https://zh.wikisource.org/wiki/周易參同契/32章</p></article></main></div></div>
