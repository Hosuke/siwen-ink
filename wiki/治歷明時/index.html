    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 治歷明時</nav></header><main><article><h1>治歷明時</h1><p>君子觀革象而明時令，順天治世。</p><p>象辭云「澤中有火，革；君子以治歷明時」，言君子觀水火相息之象，知四時有變革之序，故修治曆法以明天時。曆法明則民時不惑，治世之道在於知時、守時，此革之大用也。</p><p><strong>所出</strong>：《周易 · 革》 — https://zh.wikisource.org/wiki/周易/革</p></article></main></div></div>
