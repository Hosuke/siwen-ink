    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 子産忠諫被譙</nav></header><main><article><h1>子産忠諫被譙</h1><p>忠臣危身及其父</p><p>子産者，子國之子也。子産忠於鄭君，子國譙怒之曰：「夫介異於人臣，而獨忠於主。主賢明，能聽汝；不明，將不汝聽。聽與不聽，未可必知，而汝已離於羣臣。離於羣臣，則必危汝身矣。非徒危己也，又且危父矣。」</p><p>子産忠於鄭君，其父子國譙怒之，謂忠而見疏，則危身且危父。此父誡子以明哲保身之道也。</p><p><strong>所出</strong>：《韓非子 · 外儲說左下》 — https://zh.wikisource.org/wiki/韓非子/外儲說左下
===孫叔敖===</p></article></main></div></div>
