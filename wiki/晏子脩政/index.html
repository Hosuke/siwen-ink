    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 晏子脩政</nav></header><main><article><h1>晏子脩政</h1><p>晏子受景公相命，脩政改月，百姓肅然。</p><p>景公疾瘧期年，祝史祠祀無益。晏子曰：「命會譴毋治齊國之政，梁丘據毋治賓客之事，兼屬之乎晏子。」晏子受命，相退，把政，改月而君病悛。景公以晏子為[[晏嬰]]之功，厚祿之，晏子不受。晏子之於齊政，可謂行其所知，言出而令行，政脩而民肅也。</p><p><strong>所出</strong>：《晏子春秋 · 卷一》 — https://zh.wikisource.org/wiki/晏子春秋/卷一</p></article></main></div></div>
