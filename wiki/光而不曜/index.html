    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 光而不曜</nav></header><main><article><h1>光而不曜</h1><p>聖德內含，不以明耀炫人。</p><p>聖人光照萬物，而不自呈其耀。譬如日之明，無私照也。</p><p>此與「光而不耀」義同，皆言聖人含光不耀、不以才智外炫於人也。</p><p><strong>所出</strong>：《老子河上公章句 · 順化》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
