    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五禮明義</nav></header><main><article><h1>五禮明義</h1><p>朝覲明君臣之義，聘問使諸侯相敬，喪祭明臣子之恩，鄉飲酒明長幼之序，昏姻明男女之別。</p><p>故朝覲之禮，所以明君臣之義也；聘問之禮，所以使諸侯相尊敬也；喪祭之禮，所以明臣子之恩也；鄉飲酒之禮，所以明長幼之序也；昏姻之禮，所以明男女之別也。</p><p><strong>所出</strong>：《禮記 · 經解》 — https://zh.wikisource.org/wiki/禮記/經解</p></article></main></div></div>
