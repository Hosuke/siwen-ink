    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 少牢</nav></header><main><article><h1>少牢</h1><p>天子以下祭祀用羊、豕各一，不及大牢之牛，故稱少牢。</p><p>少牢者，祭祀之牲牢也。《儀禮》有《少牢饋食禮》《有司徹》諸篇，專記卿大夫祭祖之儀。《說文》：「牢，養牛圈也。」引之為犧牲之通稱。大牢用牛，士以上用之；少牢唯用羊、豕，大夫之禮也。《王制》：「大夫祭用少牢，士無事不敢與大夫并列。」然亦有士用特豚之說，要之少牢為大夫正祭之牲，羊曰柔毛，豕曰剛鬣，各具其名。篇中「日用丁己」，蓋祭日以丁、己為宜，取其陽氣充盈之義。</p><p><strong>所出</strong>：《儀禮 · 少牢饋食禮》 — https://zh.wikisource.org/wiki/儀禮/少牢饋食禮</p></article></main></div></div>
