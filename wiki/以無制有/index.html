    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以無制有</nav></header><main><article><h1>以無制有</h1><p>道以無形制有形，器以中空致其用。</p><p>以無制有，器用者空。包囊萬物，為道紀綱。</p><p>無形之道，包羅主宰萬物，乃大道之綱紀。以無形制有形，無為之道乃能制有為之器。器之成其用，以其中空故；苟實而不空，則無所用之。</p><p>道以無形主宰萬物，器以中空而成其用，此不易之理也。</p><p><strong>所出</strong>：《周易參同契 · 02章》 — https://zh.wikisource.org/wiki/周易參同契/02章</p></article></main></div></div>
