    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 榮啟期行乎郕之野</nav></header><main><article><h1>榮啟期行乎郕之野</h1><p>榮啟期年九十，鹿裘帶索，鼓琴而歌，以得為人、為男、年九十八為樂。</p><p>孔子遊於太山，見榮啟期行乎郕之野，鹿裘帶索，鼓琴而歌。孔子問曰：「先生所以樂，何也？」對曰：「吾樂甚多：天生萬物，唯人為貴。而吾得為人，是一樂也。男女之別，男尊女卑，故以男為貴；吾既得為男矣，是二樂也。人生有不見日月、不免襁褓者，吾既己行年九十矣，是三樂也。貧者士之常也，死者人之終也，處常得終，當何憂哉？」孔子曰：「善乎！能自寬者也。」</p><p><strong>所出</strong>：《列子 · 天瑞篇》 — https://zh.wikisource.org/wiki/列子/天瑞篇</p></article></main></div></div>
