    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 名定物不競</nav></header><main><article><h1>名定物不競</h1><p>名定則心無所措，私不行則欲無所施</p><p>名定，則物不競；分明，則私不行。物不競，非無心，由名定，故無所措其心；私不行，非無欲，由分明，故無所措其欲。然則心欲人人有之，而得同於心無欲者，制之有道也。</p><p><strong>所出</strong>：《尹文子 · 大道上》 — https://zh.wikisource.org/wiki/尹文子/大道上</p></article></main></div></div>
