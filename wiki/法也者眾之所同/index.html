    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 法也者眾之所同</nav></header><main><article><h1>法也者眾之所同</h1><p>法者，眾之所同也，賢不肖之所以盡其力者也。</p><p>今有人於此，擅自理行則免國家，利輕重則若衡石，為方圜則若規矩，此則工矣巧矣，而不足法。法也者，眾之所同也，賢不肖之所以其力也。謀出乎不可用，事出乎不可同，此為先王之所舍也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十五》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十五</p></article></main></div></div>
