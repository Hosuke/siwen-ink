    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 既雨既處</nav></header><main><article><h1>既雨既處</h1><p>雨已降而陽已止之象。</p><p>既雨既處，小畜上九爻辭也。言陰陽和而雨既降，陽得處止而不前。象曰「德積載也」，言上九之德已積滿而可勝任也。亦寓陰陽消息之理，盈不可久。</p><p><strong>所出</strong>：《周易 · 小畜》 — https://zh.wikisource.org/wiki/周易/小畜</p></article></main></div></div>
