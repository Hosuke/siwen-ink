    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大洞後序</nav></header><main><article><h1>大洞後序</h1><p>程公端與張宇初各為大洞經作後序，闡性命修真之旨。</p><p>大洞經有兩《後序》。咸淳壬申，程公端以為經旨本乎迴元復命，存心養性以事天，聚精會神而合道；又稱茅山宗壇歷代單傳，千餘年間裁三十八人，因刊諸梓以廣其傳。又，正一嗣教張宇初序稱大洞經發乎天真之音，由上帝真仙宣演而下傳；修煉之道必本乎養炁存神、逐物去虑，氣凝神化，復乎溟涬混沌之始。二序相參，可見上清與正一兩家共重此經也。</p><p><strong>所出</strong>：《上清大洞真經 · 結尾》 — https://zh.wikisource.org/wiki/上清大洞真經/結尾</p></article></main></div></div>
