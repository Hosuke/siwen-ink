    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 沐浴盛潔</nav></header><main><article><h1>沐浴盛潔</h1><p>修仙先以沐浴焚香為潔，去肥甘五臭，方可入室誦經。</p><p>沐浴盛潔，乃修仙之基也。經云「沐浴盛潔棄肥薰」，言學道之人，先當淨治其身，絕去肥膩葷腥五味薰臭，方可入室東向，誦讀玉篇。蓋身不潔則氣不清，氣不清則神不凝，故煉丹之先，必資乎此。</p><p><strong>所出</strong>：《黃庭內景經 · 沐浴章第三十六》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/沐浴章第三十六</p></article></main></div></div>
