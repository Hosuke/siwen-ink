    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 行大道</nav></header><main><article><h1>行大道</h1><p>大道至坦，而人畏其艱。</p><p>行於大道，萬物之正路也。老子言「使我介然有知，行於大道」，明行道之要在知。苟無所知，則施之不當、賞罰失序，而民好徑之弊生矣。</p><p>夫大道之要，在無為之治、清靜之化。施政以寬，不擾民之自化；聽斷以簡，不絕民之自遂。然世人昧焉，見大道之坦而疑其迂，睹小徑之捷而趨之若騖。殊不知大道之夷，正以其無施之可畏、無為之當然也。</p><p>故行道之要，在知而後行、知施之畏，非徒行之已也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 五十三章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
