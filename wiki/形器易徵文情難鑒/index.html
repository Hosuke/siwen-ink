    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 形器易徵，文情難鑒</nav></header><main><article><h1>形器易徵，文情難鑒</h1><p>器物之辨尚有差錯，文情之鑒更無準則。</p><p>麟鳳與麏雉懸絕，珠玉與礫石超殊。然[[魯]]臣以麟為麏，[[楚]]人以雉為鳳，[[魏]]氏以夜光為怪石，[[宋]]客以燕礫為寶珠。形器易徵，猶謬若是；文情難鑒，誰曰易分。</p><p>[[知音其難哉]]，器物之誤尚可徵實，文情之辨全賴心照，是以[[知多偏好]]，賞鑒多偏也。</p><p><strong>所出</strong>：《文心雕龍 · 知音》 — https://zh.wikisource.org/wiki/文心雕龍/知音</p></article></main></div></div>
