    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 使貪使愚</nav></header><main><article><h1>使貪使愚</h1><p>因人情而用之，使智者、勇者、貪者、愚者各盡其用，此軍之微權。</p><p>《三略·中略》引《軍勢》之言，明用人之微權，其辭曰：</p><p>「使智、使勇、使貪、使愚：智者樂立其功，勇者好行其志，貪者邀趨其利，愚者不顧其死；因其至情而用之，此軍之微權也。」</p><p>此言用人當順其性。智者尚功，可用之以圖事；勇者任氣，可用之以陷陣；貪者趨利，可用之以開土；愚者不畏死，可用之以赴難。一偏之見，不可以語此。唯聖王觀人於微，因材器使，各當其位，此《中略》所謂「差德行，審權變」之旨也。</p><p><strong>所出</strong>：《三略》 — https://zh.wikisource.org/wiki/三略</p></article></main></div></div>
