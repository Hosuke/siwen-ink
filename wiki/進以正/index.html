    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 進以正</nav></header><main><article><h1>進以正</h1><p>漸進之道以正為本</p><p>彖曰：「漸之進也，女歸吉也。進得位，往有功也。進以正，可以正邦也。」</p><p>進不可以急，急則躓；亦不可以邪，邪則凶。必也循序而行，以正為節，所-{得}-者其位也，所往者其功也，所及者邦家也。是以聖人-{云}-修身、齊家、治國、平天下，其序不可紊也。</p><p><strong>所出</strong>：《周易 · 漸》 — https://zh.wikisource.org/wiki/周易/漸</p></article></main></div></div>
