    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 月受六律紀</nav></header><main><article><h1>月受六律紀</h1><p>月之晦朔弦望，受六律以正時紀，循三十度而終始。</p><p>月受六律紀。五六三十度，度竟復更始。</p><p>[[日合五行精]]以定天度，[[月受六律紀]]以正人時。六律十二管，陽六陰六，以候月之節。[[弦望盈縮]]循其度，[[四七乖戾]]不作，[[五緯錯順]]不忒，治忽之幾皆天象也。</p><p><strong>所出</strong>：《周易參同契 · 05章》 — https://zh.wikis.org/wiki/周易參同契/05章</p></article></main></div></div>
