    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 道至高無上</nav></header><main><article><h1>道至高無上</h1><p>道為萬物之極，超乎形名，無往不適。</p><p>道至高無上，至深無下，平乎准，直乎繩，圓乎規，方乎矩，包裹宇宙而無表裏，洞同覆載而無所礙。是故體道者，不哀不樂，不喜不怒，其坐無慮，其寢無夢，物來而名，事來而應。</p><p><strong>所出</strong>：《淮南子 · 繆稱訓》 — https://zh.wikisource.org/wiki/淮南子/繆稱訓</p></article></main></div></div>
