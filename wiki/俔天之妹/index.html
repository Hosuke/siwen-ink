    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 俔天之妹</nav></header><main><article><h1>俔天之妹</h1><p>大邦之女，堪比天仙。</p><p>大邦有子，俔天之妹。</p><p>俔，磬也，猶言如也。天之妹，天女也。大邦，指莘國也。言莘國之女，有如天帝之妹，美而且貴也。[[造舟為梁]]言文王親迎于渭，[[文定厥祥]]言婚禮之定，皆此詩所述文王之婚配也。</p><p><strong>所出</strong>：《詩經 · 大明》 — https://zh.wikisource.org/wiki/詩經/大明</p></article></main></div></div>
