    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 戒飭臣工</nav></header><main><article><h1>戒飭臣工</h1><p>聖人御下之嚴，敬慎以終。</p><p>帝舜末年，布命臣工，咨諏善道，明試功狀，黜幽陟明。二十二人欽哉，惟時亮天功。戒之者在敬，飭之者在明。敬則不懈，明則不蔽。堯舜之治，臣工奔走用命，職此之故也。</p><p><strong>所出</strong>：《尚書 · 舜典》 — https://zh.wikisource.org/wiki/尚書/舜典</p></article></main></div></div>
