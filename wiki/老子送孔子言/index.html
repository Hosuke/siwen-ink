    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 老子送孔子言</nav></header><main><article><h1>老子送孔子言</h1><p>老子告誡孔子為人子臣之道。</p><p>辭去，而老子送之曰：「吾聞富貴者送人以財，仁人者送人以言。吾不能富貴，竊仁人之號，送子以言，曰：『聰明深察而近於死者，好議人者也。博辯廣大危其身者，發人之惡者也。為人子者毋以有己，為人臣者毋以有己。』」此老子誡孔子之言，示以謙退全身之道也。</p><p><strong>所出</strong>：《史記 · 卷047》 — https://zh.wikisource.org/wiki/史記/卷047</p></article></main></div></div>
