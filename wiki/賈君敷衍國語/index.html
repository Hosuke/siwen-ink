    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 賈君敷衍國語</nav></header><main><article><h1>賈君敷衍國語</h1><p>侍中賈君敷而衍之，發明大義，然文閒有遺忘。</p><p>至於細碎，有所闕略。侍中賈君敷而衍之，其所發明，大義略舉，為已憭矣，然於文閒時有遺忘。</p><p><strong>所出</strong>：《國語 · 國語解敘》 — https://zh.wikisource.org/wiki/國語/國語解敘</p></article></main></div></div>
