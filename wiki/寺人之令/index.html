    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 寺人之令</nav></header><main><article><h1>寺人之令</h1><p>寺人傳令，待命而行。</p><p>寺人之令，[[詩經·車鄰]]之辭也。寺人者，閽人也，主內廷之令。毛傳云：「寺人而令，言不及者也。」此言欲見君子，必待寺人傳令，方得入見。詩人自外而來，未見君子於是乎有待。若[[秦仲]]之時，禮儀隆重，非奉命不敢擅入也。</p><p><strong>所出</strong>：《詩經 · 車鄰》 — https://zh.wikisource.org/wiki/詩經/車鄰</p></article></main></div></div>
