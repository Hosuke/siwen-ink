    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 曲要磬折</nav></header><main><article><h1>曲要磬折</h1><p>孔子見漁父曲要磬折言拜而應，子路以為太敬，孔子以為禮賢之道。</p><p>孔子見澤畔漁父，下船而來，曲要磬折，言拜而應。子路怪之，問曰：「萬乘之主、千乘之君見夫子，未嘗不分庭伉禮，夫子猶有倨敖之容。今漁父杖拏逆立，而夫子曲要磬折，得無太甚乎？」孔子曰：「甚矣，由之難化也！彼非至人，不能下人，下人不精，不得其真，故長傷身。惜哉！不仁之於人也，禍莫大焉，而由獨擅之。」</p><p><strong>所出</strong>：《莊子 · 漁父》 — https://zh.wikisource.org/wiki/莊子/漁父</p></article></main></div></div>
