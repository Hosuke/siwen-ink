    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 由其道則人得其所好</nav></header><main><article><h1>由其道則人得其所好</h1><p>百姓循道則得所欲，違道則遇所惡，故治世賞罰行而姦宄息。</p><p>天下之人，莫不欲利而惡害。由其道，則人得其所好焉；不由其道，則必遇其所惡焉。姦者雖隱竄逃亡，終不足以免其罪，故莫不服罪而請。賞罰明而威行如流，此治世之效也。若夫亂世不然，則賞罰失序，而姦者僥倖，良者受害，風俗日壞而不可收拾矣。</p><p><strong>所出</strong>：《荀子 · 君子篇》 — https://zh.wikisource.org/wiki/荀子/君子篇</p></article></main></div></div>
