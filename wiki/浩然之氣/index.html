    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 浩然之氣</nav></header><main><article><h1>浩然之氣</h1><p>至大至剛、塞乎天地之氣，配義與道，集義所生，助長則害之。</p><p>「敢問何謂浩然之氣？」曰：「難言也。其為氣也至大至剛，以直養而無害，則塞于天地之間。其為氣也配義與道，無是餒也。是集義所生者，非義襲而取之也。行有不慊於心則餒矣。」又言：「必有事焉而勿正，心勿忘，勿助長也。」</p><p><strong>所出</strong>：《孟子 · 公孫丑上》 — https://zh.wikisource.org/wiki/孟子/公孫丑上</p></article></main></div></div>
