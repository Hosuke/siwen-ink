    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 巧而好度必節，勇而好同必勝，知而好謙必賢</nav></header><main><article><h1>巧而好度必節，勇而好同必勝，知而好謙必賢</h1><p>孔子論知者行事之道：巧者好法度則有節，勇者好同心則能勝，知者好謙遜則成賢。</p><p>孔子曰：「巧而好度必節，勇而好同必勝，知而好謙必賢。」</p><p>此言知者之舉事也，滿則慮嗛，平則慮險，安則慮危，曲重其豫，猶恐及其旤，是以百舉而不陷也。</p><p><strong>所出</strong>：《荀子 · 仲尼篇》 — https://zh.wikisource.org/wiki/荀子/仲尼篇</p></article></main></div></div>
