    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 輔星</nav></header><main><article><h1>輔星</h1><p>北斗第六旁之大臣象，明近則輔臣親彊，遠則疎弱。</p><p>輔星在北斗第六星旁。孟康曰「在北斗第六星旁」。</p><p>大臣之象也。占：欲其小而明；若大而明，則臣奪君政；小而不明，則臣不任職；明大與斗合，國兵暴起；暗而遠斗，臣不死則奪。若近臣專賞、排賢用佞，則輔生角；近臣擅國符印將謀社稷，則輔生翼；不然則死也。</p><p><strong>所出</strong>：《史記 · 卷027》 — https://zh.wikisource.org/wiki/史記/卷027</p><hr><p><strong>所出</strong>： [[黃敬]] 條，《歷世真仙體道通鑑 · 12》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/12</p></article></main></div></div>
