    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蝍蛆食蛇</nav></header><main><article><h1>蝍蛆食蛇</h1><p>聖人之言亦如食物鏈，引鋸而進，善聖者不留一言。</p><p>蝍蛆食蛇，蛇食蛙，蛙食蝍蛆，互相食也。聖人之言亦然，言有無之弊，又言非有非無之弊，又言去非有非無之弊。言之如引鋸然，惟善聖者不留一言。</p><p><strong>所出</strong>：《關尹子 · 3》 — https://zh.wikisource.org/wiki/關尹子/3</p></article></main></div></div>
