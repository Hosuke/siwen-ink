    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 同病異治</nav></header><main><article><h1>同病異治</h1><p>同一病名，虛實有異，治法遂殊。</p><p>同病異治，[[黃帝內經]]要義也。同名之病，其證各異，治法不得同施。如頸癰之類：癰氣之息者，氣未盛而血未聚，宜用[[針]]開除去之；氣盛血聚者，則宜[[石]]而瀉之。此所謂同病異治也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第十三卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十三卷</p></article></main></div></div>
