    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 為人臣有大罪</nav></header><main><article><h1>為人臣有大罪</h1><p>臣受爵祿而倍官遺事、穆君之色從欲以勝之者，大罪也</p><p>夫臣人者，受君高爵重祿，治大官。倍其官，遺其事，穆君之色，從其欲，阿而勝之，此臣人之大罪也。[[臣道]]</p><p><strong>所出</strong>：《管子 · 第31篇君臣下》 — https://zh.wikisource.org/wiki/管子/第31篇君臣下</p></article></main></div></div>
