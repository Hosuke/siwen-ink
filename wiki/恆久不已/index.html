    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 恆久不已</nav></header><main><article><h1>恆久不已</h1><p>天地之道，恆久不替，終始循環無已。</p><p>天地之道，恆久而不已。</p><p>《彖》以「恆」釋「久」，言天地之道所以長久者，以其恆久不替也。剛居上而柔居下，雷風相與，巽而能動，剛柔相應，此恆之所以為恆。惟其終始循環，故能「利有攸往」——往而不已，終則有始，終始相承，天地之理然矣。</p><p>日月至於天，能久照者，以其得天地之道也；四時變化而能久成者，亦以其循乎恆久之理也。聖人久於其道，而天下化成；觀其所恆，則天地萬物之情可見矣。</p><p><strong>所出</strong>：《周易 · 恒》 — https://zh.wikisource.org/wiki/周易/恒</p></article></main></div></div>
