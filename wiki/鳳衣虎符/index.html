    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鳳衣虎符</nav></header><main><article><h1>鳳衣虎符</h1><p>身披鳳衣，口銜虎符，以象神聖之儀。</p><p>身披鳳衣銜虎符，鳳衣者赤炁之衣，南方之色以象鳳；虎符者西方之精以象虎。修真者魂魄斂藏，身被赤炁，內懷金精，故云身披鳳衣而口銜虎符也。一至不久昇虛無者，言神真之遊，一旦飛昇，入於虛無，不待久也。</p><p><strong>所出</strong>：《黃庭內景經 · 上睹章第十六》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/上睹章第十六</p></article></main></div></div>
