    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 韓一背秦</nav></header><main><article><h1>韓一背秦</h1><p>韓嘗一背秦而國迫地侵，兵弱至今，聽姦臣浮說，不權事實故也。</p><p>夫韓嘗一背秦而國迫地侵，兵弱至今，所以然者，聽姦臣之浮說，不權事實，故雖殺戮姦臣，不能使韓復强。</p><p><strong>所出</strong>：《韓非子 · 存韓》 — https://zh.wikisource.org/wiki/韓非子/存韓</p></article></main></div></div>
