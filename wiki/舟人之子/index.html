    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 舟人之子，熊羆是裘</nav></header><main><article><h1>舟人之子，熊羆是裘</h1><p>舟子之子以熊羆為裘，以喻所用非分</p><p>舟人，掌舟之官也。其子以熊羆之皮為裘。熊羆是裘，以熊羆之皮為裘衣也。詩言舟人本賤者，而其子猶得美裘，私人之子亦得百僚試用。是皆西人與其下屬之得志者。東人則職勞不來，無以異於此三者之貴也。</p><p><strong>所出</strong>：《詩經 · 大東》 — https://zh.wikisource.org/wiki/詩經/大東</p></article></main></div></div>
