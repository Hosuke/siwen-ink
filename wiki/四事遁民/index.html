    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 四事遁民</nav></header><main><article><h1>四事遁民</h1><p>楊朱言世人有壽、名、位、貨四者之欲，畏鬼畏人畏威畏刑，是為遁民；若不羨此四者，則天下無對，制命在內。</p><p>楊朱曰：「生民之不得休息，為四事故：一為壽，二為名，三為位，四為貨。有此四者，畏鬼，畏人，畏威，畏刑。此謂之遁民也。可殺可活，制命在外。不逆命，何羨壽？不矜貴，何羨名？不要勢，何羨位？不貪富，何羨貨？此之謂順民也。天下無對，制命在內。」</p><p><strong>所出</strong>：《列子 · 楊朱篇》 — https://zh.wikisource.org/wiki/列子/楊朱篇</p></article></main></div></div>
