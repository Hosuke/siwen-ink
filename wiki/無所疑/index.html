    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無所疑</nav></header><main><article><h1>無所疑</h1><p>居上無位，則進退無礙，無所疑也</p><p>《象》曰：「肥遯，無不利；無所疑也。」</p><p>上九以陽居遯極，無位於下，不累於事，超然遠引，故得肥游之吉。《象》以「無所疑」一言盡之。蓋天下之累人者，非事物也，疑也。疑則瞻顧，瞻顧則不能決，不能決則失幾而悔生。上九既無位以累其心，又居天外之域，其於天下之事，無所疑、無所戀、無所礙，是以遯之肥而無不利也。</p><p><strong>所出</strong>：《周易 · 遯》 — https://zh.wikisource.org/wiki/周易/遯</p></article></main></div></div>
