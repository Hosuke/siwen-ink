    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 夢覺精結晝見夜夢</nav></header><main><article><h1>夢覺精結晝見夜夢</h1><p>精之所結一人獨見於晝，神之所合兩人同夢於夜，皆我精神，不可以夢覺分。</p><p>世之人以獨見者為夢，同見者為覺，殊不知精之所結，亦有一人獨見於晝者，神之所合，亦有兩人同夢於夜者。二者皆我精神，孰為夢，孰為覺。</p><p><strong>所出</strong>：《關尹子 · 6》 — https://zh.wikisource.org/wiki/關尹子/6</p></article></main></div></div>
