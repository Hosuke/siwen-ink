    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 求賢之道</nav></header><main><article><h1>求賢之道</h1><p></p><p><strong>求賢之道</strong>，墨子所論求賢用賢之方。尚賢下篇設問：天下之士君子皆欲富貴而惡貧賤，然則如何可得富貴而闢貧賤？墨子答曰：「莫若爲賢。」</p><p>復申其義云：「有力者疾以助人，有財者勉以分人，有道者勸以教人。」此三者，賢人之道也。</p><p>苟能行此，則飢者得食，寒者得衣，亂者得治。墨子稱之曰「安生生」——使天下萬民皆得安寧生息之樂。</p><p>此道非獨利己，乃兼利天下。與[[兼愛]]之旨相合。賢者不徒自善而已，必有功於人；有財者不徒自富而已，必能分人以財；有道者不徒自明而已，必能教人以道。三者備，然後天下治。</p></article></main></div></div>
