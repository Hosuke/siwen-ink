    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 為王休</nav></header><main><article><h1>為王休</h1><p>成王之美也。</p><p>「休」者，美也，善也。臣之所以勤其勞者，非為己也，乃所以成王之美也。「無棄爾勞，以為王休」，言勿以王之未信而怠其事，當堅持以俟王之悔悟。詩人教人以忠也。</p><p><strong>所出</strong>：《詩經 · 民勞》 — https://zh.wikisource.org/wiki/詩經/民勞</p></article></main></div></div>
