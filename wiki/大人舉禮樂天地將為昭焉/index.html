    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大人舉禮樂天地將為昭焉</nav></header><main><article><h1>大人舉禮樂天地將為昭焉</h1><p>大人舉禮樂則天地欣合，陰陽相得，煦嫗覆育萬物。</p><p>是故大人舉禮樂，則天地將為昭焉。天地欣合，陰陽相得，煦嫗覆育萬物，然後草木茂，區萌達，羽翮奮，角觡生，蟄蟲昭穌，羽者嫗伏，毛者孕鬻，胎生者不殰而卵生者不殈，則樂之道歸焉耳。</p><p><strong>所出</strong>：《史記 · 卷024》 — https://zh.wikisource.org/wiki/史記/卷024</p></article></main></div></div>
