    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 先白後黃</nav></header><main><article><h1>先白後黃</h1><p>丹成先白而後黃，赤黑達於表裏。</p><p>先白而後黃兮，赤黑達表裏。</p><p>丹成之色，先白而後黃，白者金精，黃者土德，赤黑乃水火之正色，達於表裏，是為大丹成就之象也。</p><p><strong>所出</strong>：《周易參同契 · 32章》 — https://zh.wikisource.org/wiki/周易參同契/32章</p></article></main></div></div>
