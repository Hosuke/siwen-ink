    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 媵</nav></header><main><article><h1>媵</h1><p>嫡妻之從嫁者，古婚制之重要組成也。</p><p>《毛詩序》曰：「《江有汜》，美媵也。」</p><p>媵者，諸侯嫁女，娣從之，或姪女為媵，皆備數於嫡者也。《儀禮·士昏禮》有「媵御餕」之文，是其制也。</p><p>《江有汜》所述之媵，嫡不以為數，或遣之歸。然而勤事嫡室，雖遇勞苦而無怨。嫡卒能悔過者，亦由媵之厚德有以感動之也。</p><p>故知媵之於古制，非徒備員而已，其行事亦關乎風化之得失焉。</p><p><strong>所出</strong>：《詩經 · 江有汜》 — https://zh.wikisource.org/wiki/詩經/江有汜</p></article></main></div></div>
