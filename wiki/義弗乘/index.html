    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 義弗乘</nav></header><main><article><h1>義弗乘</h1><p>非義所當得，則弗乘之。</p><p>《象》辭云「舍車而徒，義弗乘也」。車馬之奉，非分所當受，則義以為不可而弗乘之。蓋君子取與有節，不以物累其身，不以利渝其志，故舍車而徒，以明守分之義焉。</p><p><strong>所出</strong>：《周易 · 賁》 — https://zh.wikisource.org/wiki/周易/賁</p></article></main></div></div>
