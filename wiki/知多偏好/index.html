    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 知多偏好</nav></header><main><article><h1>知多偏好</h1><p>見者各執一隅之解，不能圓該。</p><p>篇章雜沓，質文交加，知多偏好，人莫圓該。慷慨者逆聲而擊節，醞者見密而高蹈，浮慧者觀綺而躍心，愛奇者聞詭而驚聽。會己則嗟諷，異我則沮棄，各執一隅之解，欲擬萬端之變。所謂東向而望，不見西牆也。</p><p>[[形器易徵文情難鑒]]之故，在賞者各有好尚，未能博觀以平其心也。</p><p><strong>所出</strong>：《文心雕龍 · 知音》 — https://zh.wikisource.org/wiki/文心雕龍/知音</p></article></main></div></div>
