    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不自為大成其大</nav></header><main><article><h1>不自為大成其大</h1><p>不自大者終能成其大，此道之玄德</p><p>以其終不自為大，故能成其大。不自為大者，非不能大，乃不居其大、不矜其大、不自以為大。萬物歸焉而不為主，功成而不名有，是以其成也大。聖人法此，貴不敢為天下先，而天下莫能與之爭。成其大者，以其不自大；不能大者，以其自大也。玄德之深，莫過於此。</p><p><strong>所出</strong>：《道德經 (王弼本) · 三十四章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
