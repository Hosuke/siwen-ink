    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 燕土風俗</nav></header><main><article><h1>燕土風俗</h1><p>燕土墝埆，北迫匈奴，其民勇而少慮，故誡以慎德備邊。</p><p>燕土墝埆，北迫匈奴，其人民勇而少慮，故誡之曰「葷粥氏無有孝行而禽獸心，以竊盜侵犯邊民。朕詔將軍往征其罪，萬夫長，千夫長，三十有二君皆來，降旗奔師。葷粥徙域遠處，北州以安矣」。「悉若心，無作怨」者，勿使從俗以怨望也。「無俷德」者，勿使王背德也。「無廢備」者，無乏武備，常備匈奴也。「非教士不得從徵」者，言非習禮義不得在於側也。</p><p><strong>所出</strong>：《史記 · 卷060》 — https://zh.wikisource.org/wiki/史記/卷060</p></article></main></div></div>
