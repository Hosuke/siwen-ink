    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 佩玉之儺</nav></header><main><article><h1>佩玉之儺</h1><p></p><p>又見《詩經·竹竿》：「巧笑之瑳，佩玉之儺。」</p><p>  此言衞女容飾之美、威儀之盛。巧笑之瑳，齒白而笑粲然也；佩玉之儺，行止有節，玉聲相應也。夫女子在父母之邦，容儀之美，出於自然。今適異國而[[思歸不得]]，其[[豈不爾思]]之情，雖佩玉之盛、巧笑之美，亦不足以解其憂。[[以寫我憂|出遊以寫]]，正此意也。</p><p>  <strong>所出</strong>：《詩經 · 竹竿》 — https://zh.wikisource.org/wiki/詩經/竹竿</p></article></main></div></div>
