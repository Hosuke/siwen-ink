    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 白圭之誡</nav></header><main><article><h1>白圭之誡</h1><p>南容誦白圭而謹言，夫子以其慎行妻之。</p><p>南容三復《白圭》，孔子以其兄之子妻之。</p><p>《白圭》之詩，戒人多言。南容反覆誦之，夫子嘉其謹言，乃以兄之女妻之。蓋謹言者，可以全身遠害也。</p><p><strong>所出</strong>：《論語 · 先進第十一》 — https://zh.wikisource.org/wiki/論語/先進第十一</p></article></main></div></div>
