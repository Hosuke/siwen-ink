    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 豫讓明臣義</nav></header><main><article><h1>豫讓明臣義</h1><p>豫讓毀身變容為故君報仇，明君臣之義非從易也。</p><p>豫讓欲殺趙襄子，滅鬚去眉，自刑以變其容，為乞人而往乞於其妻之所。妻曰：「狀貌無似吾夫者，其音何類吾夫之甚也？」又吞炭以變其音。其友謂之曰：「子之所道甚難而無功。子之材而索事襄子，襄子必近子，子得近而行所欲，此甚易而功必成。」豫讓笑而應之曰：「是先知報後知也，為故君賊新君矣，大亂君臣之義者無此，失吾所為為之矣。凡吾所為為此者，所以明君臣之義也，非從易也。」</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十</p></article></main></div></div>
