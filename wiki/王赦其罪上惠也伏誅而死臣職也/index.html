    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 王赦其罪上惠也伏誅而死臣職也</nav></header><main><article><h1>王赦其罪上惠也伏誅而死臣職也</h1><p>赦罪出於上之恩，不受而伏誅乃臣之節</p><p>石奢對楚王之言曰：「王赦其罪，上惠也；伏誅而死，臣職也。」言赦出於王之恩，不可受也；伏誅以死，乃臣子之天職。</p><p><strong>所出</strong>：《史記 · 卷119》 — https://zh.wikisource.org/wiki/史記/卷119</p></article></main></div></div>
