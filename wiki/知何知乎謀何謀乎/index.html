    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 知何知乎？謀何謀乎？</nav></header><main><article><h1>知何知乎？謀何謀乎？</h1><p>聖人自知知人，所謀皆合天理，則天下周。</p><p>知何知乎？謀何謀乎？審而出者彼自來。自知曰稽，知人曰濟。知苟適，可爲天下周。</p><p><strong>所出</strong>：《管子 · 第38篇白心》 — https://zh.wikisource.org/wiki/管子/第38篇白心</p></article></main></div></div>
