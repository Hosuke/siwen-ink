    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 民惟邦本，本固邦寧</nav></header><main><article><h1>民惟邦本，本固邦寧</h1><p>民為國本，本固邦寧。</p><p>民者，邦之本也；本固而後邦寧。此[[五子之歌]]所載皇祖之訓也。夫根基不固，則傾覆隨之。是以聖人臨民，若臨大敵，敬慎而不怠焉。</p><p>其一曰：「皇祖有訓。民可近，不可下。民惟邦本，本固邦寧。」</p><p><strong>所出</strong>：《尚書 · 五子之歌》 — https://zh.wikisource.org/wiki/尚書/五子之歌</p></article></main></div></div>
