    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不得已而用之</nav></header><main><article><h1>不得已而用之</h1><p>兵凶器也，聖人用之，必待不得已而後起。</p><p>[[兵者不祥之器]]，非[[君子居則貴左|君子之器]]，聖人不得已而後用之。[[果而不得已]]亦此義也。夫[[樂殺人者不可以得志]]，以殺人為樂者，必失天下之志。[[佳兵不祥之器]]之誡，[[兵者尊主安國之經]]之正，乃聖人貴左賤右之本意也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第七十五章 貴左》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
