    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 馬丹</nav></header><main><article><h1>馬丹</h1><p>晉狄人，數仕數退，倏忽乘安車而去，風入迴風。</p><p>馬丹者，晉狄人也。當文侯時為大夫，至獻公時復為幕正。獻公滅狄，殺恭太子，丹去。</p><p>至趙宣子時，乘安車入晉都，候諸大夫。靈公欲仕之，逼不以禮，有迅風發，丹入迴風中而去。北方人尊而祠之。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 3》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/3</p></article></main></div></div>
