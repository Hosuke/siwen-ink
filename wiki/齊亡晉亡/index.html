    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 齊亡晉亡</nav></header><main><article><h1>齊亡晉亡</h1><p>齊以田氏用呂氏弗制而亡，晉以六卿專姬氏弗制而亡。</p><p>人之所以謂齊亡者，非地與城亡也，吕氏弗制而田氏用之；所以謂晉亡者，亦非地與城亡也，姬氏不制而六卿專之也。</p><p>今大臣執柄獨斷，而上弗知收，是人主不明也。與死人同病者，不可生也；與亡國同事者，不可存也。今襲跡於齊、晉，欲國安存，不可得也。</p><p><strong>所出</strong>：《韓非子 · 孤憤》 — https://zh.wikisource.org/wiki/韓非子/孤憤</p></article></main></div></div>
