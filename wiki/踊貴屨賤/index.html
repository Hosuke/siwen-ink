    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 踊貴屨賤</nav></header><main><article><h1>踊貴屨賤</h1><p>晏子以近市知物價諷景公省刑。</p><p>景公欲更晏子之宅，晏子辭以近市得所求。公問：「子近市，識貴賤乎？」對曰：「既竊利之，敢不識乎？」公曰：「何貴何賤？」是時，公繁於刑，有鬻踊者。對曰：「踊貴而屨賤。」公愀然改容，公為是省于刑。</p><p>一人之身，踊貴而屨賤，此刑繁之驗也。晏子以市價諷之，景公因而省刑，可謂善諫。</p><p><strong>所出</strong>：《晏子春秋 · 卷六》 — https://zh.wikisource.org/wiki/晏子春秋/卷六</p></article></main></div></div>
