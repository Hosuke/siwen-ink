    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 季次原憲終身空室</nav></header><main><article><h1>季次原憲終身空室</h1><p>季次、原憲，閭巷人也，讀書懷獨行君子之德，終身空室蓬戶，死而已四百餘年而弟子志之不倦。</p><p>及若季次、原憲，閭巷人也，讀書懷獨行君子之德，義不苟合當世，當世亦笑之。故季次、原憲終身空室蓬戶，褐衣疏食不厭。死而已四百餘年，而弟子志之不倦。</p><p><strong>所出</strong>：《史記 · 卷124》 — https://zh.wikisource.org/wiki/史記/卷124</p></article></main></div></div>
