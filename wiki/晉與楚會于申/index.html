    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 晉與楚會于申</nav></header><main><article><h1>晉與楚會于申</h1><p>楚合諸侯于申，荊楚之勢大張。</p><p>昭公四年春，楚子、蔡侯、陳侯、鄭伯、許男、徐子、滕子、頓子、胡子、沈子、小邾婁子、宋世子佐、淮夷會于申。楚人執徐子。秋，楚合伐吳，執齊慶封殺之。</p><p><strong>所出</strong>：《春秋公羊傳 · 昭公》 — https://zh.wikisource.org/wiki/春秋公羊傳/昭公</p></article></main></div></div>
