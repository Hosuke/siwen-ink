    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天地之使</nav></header><main><article><h1>天地之使</h1><p>聖人者，天地之使也，能用抵巇之術以輔世。</p><p>聖人者，天地之使也。世無可抵，則深隱而待時；時有可抵，則爲之謀。能因能循，爲天地守神。</p><p><strong>所出</strong>：《鬼谷子 · 卷01》 — https://zh.wikisource.org/wiki/鬼谷子/卷01</p></article></main></div></div>
