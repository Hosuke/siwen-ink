    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 厚德載物</nav></header><main><article><h1>厚德載物</h1><p></p><p>「厚德載物」之原典，出於坤卦大象。坤象曰：「地勢坤，君子以厚德載物。」</p><p>  坤為純陰之卦，地道至柔而廣厚，萬物資之以生。君子法坤之象，修德以厚，足以容載天下之物也。</p><p>  <strong>所出</strong>：《周易 · 坤》 — https://zh.wikisource.org/wiki/周易/坤</p></article></main></div></div>
