    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 遠水不救近火</nav></header><main><article><h1>遠水不救近火</h1><p>遠助不如近謀，緩急之勢異也。</p><p>魯穆公遣衆公子分仕晉、荊，欲以為外援。犁鉏進諫曰：「假人於越而救溺子，越人雖善遊，子必不生；失火而取水於海，海水雖多，火必不滅。遠水不救近火也。今晉與荊雖強，而齊近，魯患其不救乎！」蓋救患貴及時，圖難於易，預事於近。齊為近鄰，患莫大焉，而外援迂遠，緩急之間，事機已失。故欲解近憂，不可恃遠圖；欲救己急，不可舍近助。是以智者居中而制遠，不以遠援而忘近憂。</p><p><strong>所出</strong>：《韓非子 · 說林上》 — https://zh.wikisource.org/wiki/韓非子/說林上</p></article></main></div></div>
