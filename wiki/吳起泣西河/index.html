    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 吳起泣西河</nav></header><main><article><h1>吳起泣西河</h1><p>吳起聞召而去，望西河而泣，預見其將入於秦。</p><p>吳起治西河之外，王錯譖之於魏武侯，武侯使人召之。吳起至於岸門，止車而望西河，泣數行而下。其僕謂吳起曰：「竊觀公之意，視釋天下若釋躧，今去西河而泣，何也？」</p><p>吳起抿泣而應之曰：「子不識。君知我而使我畢能西河可以王。今君聽讒人之議而不知我，西河之為秦取不久矣，魏從此削矣。」</p><p>吳起果去魏入楚。有間，西河畢入秦，秦日益大。此吳起之所先見而泣也。賢臣蒙讒，疆土隨去，悲之至也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十一》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十一</p></article></main></div></div>
