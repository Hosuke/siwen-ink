    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 羊牛下來</nav></header><main><article><h1>羊牛下來</h1><p>暮時羊牛群下，以比物之有所歸。</p><p>「日之夕矣，羊牛下來。」日夕則羊牛自山下而歸，入其肆欄，蓋物之各得其所止也。君子于役而不返，反不如羊牛之有常期。故觸景而生離思，以興行人之不得息也。</p><p><strong>所出</strong>：《詩經 · 君子于役》 — https://zh.wikisource.org/wiki/詩經/君子于役</p></article></main></div></div>
