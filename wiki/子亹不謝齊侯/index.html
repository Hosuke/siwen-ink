    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 子亹不謝齊侯</nav></header><main><article><h1>子亹不謝齊侯</h1><p>子亹與齊侯會，不謝而被殺</p><p>齊襄公會諸侯於首止，鄭子亹往會，高渠彌相從。祭仲稱疾不行——因子亹自為公子時，嘗會鬭，相仇。子亹不聽，卒行。至，不謝齊侯，齊侯怒，遂伏甲而殺子亹。高渠彌亡歸，與祭仲謀，召子亹弟公子嬰於陳而立之，是為鄭子。</p><p><strong>所出</strong>：《史記 · 卷042》 — https://zh.wikisource.org/wiki/史記/卷042</p></article></main></div></div>
