    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 公尸嘉告</nav></header><main><article><h1>公尸嘉告</h1><p>祭祀之尸，傳神惠以嘉告。</p><p>古者祭祀，奉尸以象祖者為「尸」；王祭祀之尸，天子之尸，故曰「公尸」。尸既饗神之惠，乃以神意曉主人，是為「告」；所言皆善，是「嘉告」也。《詩》曰「公尸嘉告」，言祭祀既成，尸以神嘏播告主人，其辭美善，足為子孫之戒也。蓋生人不能直接祖考，故立尸以達其意。此禮之大者，故詩人歌之。</p><p><strong>所出</strong>：《詩經 · 既醉》 — https://zh.wikisource.org/wiki/詩經/既醉</p></article></main></div></div>
