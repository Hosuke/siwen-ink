    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三氣右廻九道明</nav></header><main><article><h1>三氣右廻九道明</h1><p>三丹田之氣右旋運行，九竅通明，喻內景朗現。</p><p>三氣者，上中下三丹田之元炁也。右廻者，真氣運行之軌道。九道明者，眼耳鼻口及下極諸竅皆通，乃丹成景現之驗。</p><p><strong>所出</strong>：《黃庭內景經 · 呼吸章第二十》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/呼吸章第二十</p></article></main></div></div>
