    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 周邦咸喜</nav></header><main><article><h1>周邦咸喜</h1><p>周邦舉國歡喜，咸慶得有良翰。</p><p>「周邦咸喜，戎有良翰」，言周之舉國皆大歡喜，慶幸得有賢能之大臣為庇障也。申伯既 [[謝于誠歸]]，入於謝土， [[徒御嘽嘽]]，其從甚盛。周邦之人欣喜於此，蓋以申伯 [[柔惠且直]]，足以 [[文武是憲]]，為周之屏翰也。</p><p><strong>所出</strong>：《詩經 · 崧高》 — https://zh.wikisource.org/wiki/詩經/崧高</p></article></main></div></div>
