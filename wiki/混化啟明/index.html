    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 混化啟明</nav></header><main><article><h1>混化啟明</h1><p>混化之世，開明之辰。</p><p>混化啟明，上清玉經述[[上清大洞]]修真之象也。[[混化啟明，正一左右仙人中神]]，又云[[混化啟明，合我仙魂]]。混者混沌之混，化者變化之化，啟明者三元開朗、神魂清朗之時。修真至此，[[七祖同飛，滅絕胞根]]。</p><p><strong>所出</strong>：《上清大洞真經 · 18章》 — https://zh.wikisource.org/wiki/上清大洞真經/18章</p></article></main></div></div>
