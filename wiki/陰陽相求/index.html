    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 陰陽相求</nav></header><main><article><h1>陰陽相求</h1><p>陰求陽、陽求陰，乃卦體之主；雖寡而為主，則眾之所宗。</p><p>少者多之所貴，寡者眾之所宗。一卦五陽而一陰，則一陰為之主；五陰而一陽，則一陽為之主。夫陰之所求者陽也，陽之所求者陰也。陽苟一焉，五陰何得不同而歸之；陰苟一焉，五陽何得不同而從之。故陰爻雖賤而為一卦之主者，處其至少之地。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷10》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷10</p></article></main></div></div>
