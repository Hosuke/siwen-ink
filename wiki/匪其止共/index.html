    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 匪其止共</nav></header><main><article><h1>匪其止共</h1><p>職而不恭，乃為王病</p><p>匪其止共，維王之卭。</p><p>言此輩小人，非無其位也，位有職焉；非不能止也，乃不恭爾。止者，守其分也；共者，恭厥事也。小人尸位素餐，不恭其職，黷貨竊柄，讒言亂政，王受其病而不知悟，故詩人深疾之。[[匪其彭]]之義取諸易，此則取諸詩，其旨一也。</p><p><strong>所出</strong>：《詩經 · 巧言》 — https://zh.wikisource.org/wiki/詩經/巧言</p></article></main></div></div>
