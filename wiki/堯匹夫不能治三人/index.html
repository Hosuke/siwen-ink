    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 堯匹夫不能治三人</nav></header><main><article><h1>堯匹夫不能治三人</h1><p>堯之賢無以加，而匹夫之位不能令一人，況三人乎。</p><p>堯之為聖，百代所宗。然為匹夫之時，不能治三人。桀之為暴，天厭之，而南面之王天下，足以亂海內。是知勢位之足恃，而賢智之不足慕也。</p><p>故[[上法而不上賢]]，此之謂與？</p><p><strong>所出</strong>：《韓非子 · 難勢》 — https://zh.wikisource.org/wiki/韓非子/難勢</p></article></main></div></div>
