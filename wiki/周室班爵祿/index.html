    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 周室班爵祿</nav></header><main><article><h1>周室班爵祿</h1><p>孟子述周代爵祿之制，天子以至士凡五等，祿以代耕。</p><p>北京錡問孟子以周室班爵祿之法。孟子言其詳不可得聞，諸侯惡其害己而去其籍，然嘗聞其略：天子上公侯伯子男凡五等；君卿大夫士凡六等。大國地方百里，祿十倍卿；次國七十里，祿十倍卿而卿祿三大夫；小國五十里，祿十倍卿而卿祿二大夫。其下士與庶人在官者同祿，[[祿足以代其耕也]]。耕者一夫百畝，上農夫食九人，下次食八人，中食七人，中次食六人，下食五人。此周制祿以代耕之意也。</p><p><strong>所出</strong>：《孟子 · 萬章下》 — https://zh.wikisource.org/wiki/孟子/萬章下</p></article></main></div></div>
