    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天人傳授</nav></header><main><article><h1>天人傳授</h1><p>此經天人所習，口口相傳，不記文字</p><p>葛玄言此經云：「此經是天人所習，不傳下士。吾昔受之於東華帝君。東華帝君受之於金闕帝君，金闕帝君受之於西王母。西王母皆口口相傳，不記文字。」</p><p>[[持誦此經|持誦此經]]之利益，蓋因經法出自天界，傳承有自。上士悟之，昇為天官；中士修之，南宮列仙；下士得之，在世長年，遊行三界，昇入金門。</p><p><strong>所出</strong>：《太上老君說常清靜經》 — https://zh.wikisource.org/wiki/太上老君說常清靜經</p></article></main></div></div>
