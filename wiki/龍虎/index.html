    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 龍虎</nav></header><main><article><h1>龍虎</h1><p>龍化虎變蹈虛貫石，有無相通，物我相同，形不可斃神不可逝。</p><p>龍為陽，主生機，屬東方木，在人為性；虎為陰，主殺機，屬西方金，在人為情。五行不和，則各一其性，龍東虎西，性亂情迷，殺氣削生氣矣。五行若全，則龍蟠虎踞，性定情忘，真情真性，殺氣亦成生氣矣。是故修丹之道，不過調和剛柔，使龍虎相並而已。</p><p><strong>所出</strong>：《悟真直指 · 卷一》 — https://zh.wikisource.org/wiki/悟真直指/卷一</p></article></main></div></div>
