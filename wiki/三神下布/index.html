    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三神下布</nav></header><main><article><h1>三神下布</h1><p>上清內煉以存思結三神，入膀胱而下布身中之法。</p><p>此為上清大洞經精血三真章之行持要法。修煉者以口吸神雲、咽津三過，結作三神，赤衣冠下布絳官，入兩膀胱，運下元精血纏繞神身，入尾閭穴，穿骨髓，上入泥丸，下布鼻凹而出赤光。三神既布，則精血得主、死根可斷，是為上清煉血之樞機。</p><p><strong>所出</strong>：《上清大洞真經 · 17章》 — https://zh.wikisource.org/wiki/上清大洞真經/17章</p></article></main></div></div>
