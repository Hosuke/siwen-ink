    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 風雷益</nav></header><main><article><h1>風雷益</h1><p>風雷相助，其象相益；君子法之，見善則遷、有過則改。</p><p>《象》曰：「風雷，益。」震為雷，巽為風，風烈則雷迅，雷動則風疾，二者相助以成其益。君子觀此象，悟修身之旨：[[見善則遷|見善則遷]]，[[有過則改|有過則改]]。遷善改過，如風雷之相成，不可或緩。</p><p><strong>所出</strong>：《周易 · 益》 — https://zh.wikisource.org/wiki/周易/益</p></article></main></div></div>
