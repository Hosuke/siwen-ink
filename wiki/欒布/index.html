    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 欒布</nav></header><main><article><h1>欒布</h1><p>俞侯欒布，以將軍擊吳楚反齊有功，又為彭越舍人，梟越而哭之，高祖義而舍之。</p><p>欒布為俞侯，六百戶。以將軍吳楚反擊齊有功。布故彭越舍人，越反時布使齊，還已梟越，布祭哭之，當亨，高祖舍之。黥布反，布為都尉，侯千八百戶。蓋激於義而忠於舊主者也。</p><p><strong>所出</strong>：《史記 · 惠景閒矦者年表》 — https://zh.wikisource.org/wiki/史記/惠景閒矦者年表</p></article></main></div></div>
