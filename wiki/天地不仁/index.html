    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天地不仁</nav></header><main><article><h1>天地不仁</h1><p>天地無心，任物自化，不施仁恩。</p><p>天地運行，無所偏愛，無恩無怨。[[芻狗]]之喻，正所以明此旨。河上公以「不仁」言天，非謂天之殘忍，乃謂天無心為仁，如[[道法自然]]所云，任萬物自然之性，不加干預。此與聖人治天下同理——[[聖人不仁]]，非不愛民，乃不施私恩，使民自化。譬如四時之行，不以寒暑害人，亦不以溫涼愛物，無心之至也。</p><p><strong>所出</strong>：《老子河上公章句 · 虛用》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
