    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 樂樂旨酒</nav></header><main><article><h1>樂樂旨酒</h1><p>武王宴酣，酬畢公而作是歌，以美旨酒、期同樂。</p><p>王夜爵酬畢公，作歌一終曰《樂樂旨酒》：「樂樂旨酒，宴以二公。紝夷兄弟，庶民和同。方壯方武，穆穆克邦。嘉爵速飲，後爵乃從。」</p><p><strong>所出</strong>：《尚書 · 耆夜》 — https://zh.wikisource.org/wiki/尚書/耆夜</p></article></main></div></div>
