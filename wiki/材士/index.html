    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 材士</nav></header><main><article><h1>材士</h1><p>墨子所述城中技藝精湛之戰士，以其家人為質而養之。</p><p>材士者，城守之精銳也。《墨子·備水》云：「先養材士，為異舍，食其父母妻子，以為質。」是於城中別居材士及其家室，厚給其食，令無內顧之憂，以專心守禦。</p><p>其選募之法：「二十船為一隊，選材士有力者三十人共船。」此三十人者，各有所長：二十人擅弩，又有方，略同 [[五兵]] 之射者；十人擅苗，則執農器以為兵者。蓋墨子尚功用，不拘兵器之常形也。</p><p>材士不同於 [[死士賁士]]。死士者，捐軀赴難之勇也；材士者，有技藝之長、可以應變之才也。其所以異舍而食其家者，[[墨子]] 以為「備」之本義——未雨綢繆，養之以待用也。</p></article></main></div></div>
