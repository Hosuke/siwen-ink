    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 曷維其亡</nav></header><main><article><h1>曷維其亡</h1><p>欲忘其憂而不可得。</p><p>亡者，忘也。詩言「心之憂矣，曷維其亡」，與上章「曷維其已」互文見義。已者，止也；亡者，忘也。[[心之憂矣]]於首章言止，於次章言忘，反覆詠歎，其憂之深、思之切，愈見於言辭之重。蓋欲其止而不能止，欲其忘而不能忘，詩人之情至是極矣。詩人之所以憂者，非區區一身之得失，乃傷夫婦之倫失序、國家之綱常紊亂也。此憂之大者，豈可既乎？豈可忘乎？</p><p><strong>所出</strong>：《詩經 · 綠衣》 — https://zh.wikisource.org/wiki/詩經/綠衣</p></article></main></div></div>
