    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 卓氏鐵山鼓鑄</nav></header><main><article><h1>卓氏鐵山鼓鑄</h1><p>蜀卓氏之先遷於臨邛，大喜，即鐵山鼓鑄，傾滇蜀之民，富至僮千人。</p><p>蜀卓氏之先，趙人也，用鐵冶富。秦破趙，遷卓氏。卓氏見虜略，獨夫妻推輦，行詣遷處。諸遷虜少有餘財，爭與吏，求近處，處葭萌。唯卓氏曰：「此地狹薄。吾聞汶山之下，沃野，下有蹲鴟，至死不饑。民工於市，易賈。」乃求遠遷。致之臨邛，大喜，即鐵山鼓鑄，運籌策，傾滇蜀之民，富至僮千人。田池射獵之樂，擬於人君。</p><p><strong>所出</strong>：《史記 · 卷129》 — https://zh.wikisource.org/wiki/史記/卷129</p></article></main></div></div>
