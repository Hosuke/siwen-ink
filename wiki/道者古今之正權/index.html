    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 道者古今之正權</nav></header><main><article><h1>道者古今之正權</h1><p>道為古今之正權，離道內自擇則不知禍福之所託。</p><p>道者，古今之正權也；離道而內自擇，則不知禍福之所託。</p><p>凡人莫不從其所可，而去其所不可。知道之莫之若也，而不從道者，無之有也。假之有人而欲南，無多；而惡北，無寡，豈為夫南之不可盡也，離南行而北走也哉！</p><p>故可道而從之，奚以損之而亂？不可道而離之，奚以益之而治？故知者論道而已矣，小家珍說之所願者皆衰矣。</p><p><strong>所出</strong>：《荀子 · 正名篇》 — https://zh.wikisource.org/wiki/荀子/正名篇</p></article></main></div></div>
