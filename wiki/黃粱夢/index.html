    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 黃粱夢</nav></header><main><article><h1>黃粱夢</h1><p>富贵功名，夢醒皆空，喻世人之迷夢。</p><p>黃粱未熟，已夢千秋。富貴一夢，貧賤亦夢。夢覺歸來，飯猶未熟。世人迷夢，執以為真，不知一息不來，四大各散，金珠外物、子孫他人，皆非我有。是以鍾離權授道於呂嵓，先以黃粱一夢警之，使知世間富貴功名，轉盼即空，不可恃也。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 45》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/45</p></article></main></div></div>
