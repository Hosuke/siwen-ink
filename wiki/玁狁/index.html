    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 玁狁</nav></header><main><article><h1>玁狁</h1><p></p><p>玁狁，亦作獫狁、葷粥、薰育，周時北方部族，與晉狄有別。[[詩有六義]]所謂「獫狁之故」者，《采薇》云「[[玁狁之故]]，不遑啟居」，又「[[玁狁之故]]，不遑啟處」，反覆致意，以見征戍之苦皆本乎玁狁之患。《六月》言「玁狁匪茹，整居焦獲」，又《出車》言「天子命我，城彼朔方」，皆周人扞禦玁狁之事。《小雅》備載玁狁之患者，以見王事征戍之艱，亦《小雅》怨悱之義也。</p><p>  <strong>所出</strong>：《詩經 · 采薇》 — https://zh.wikisource.org/wiki/詩經/采薇</p></article></main></div></div>
