    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 師保</nav></header><main><article><h1>師保</h1><p></p><p>《禮記·文王世子》述師、保之義云：「師也者，教之以事而喻諸德者也；保也者，慎其身以輔翼之而歸諸道者也。」</p><p>  又引古記云：「虞、夏、商、周，有師保，有疑丞。」設四輔及三公以養世子。</p><p>  師以喻德，保以歸道，二者內外相成，以成世子之德。</p></article></main></div></div>
