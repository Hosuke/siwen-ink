    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 千金之珠在驪龍頷下</nav></header><main><article><h1>千金之珠在驪龍頷下</h1><p>厚利必伏大患，僥倖難恃</p><p>河上有家貧恃緯蕭而食者，其子沒於淵，得千金之珠。其父謂其子曰：「取石來鍛之！夫千金之珠，必在九重之淵而驪龍頷下。子能得珠者，必遭其睡也。使驪龍而寤，子尚奚微之有哉！」</p><p>今宋國之深，非直九重之淵也；宋王之猛，非直驪龍也；子能得車者，必遭其睡也。使宋王而寤，子為𩐈粉夫。</p><p>獲厚利者，必居於至危之地；幸而得之，乃值龍之假寐耳。一旦龍醒，禍亦隨之。莊子借此以警世之僥倖求利者。</p><p><strong>所出</strong>：《莊子 · 列禦寇》 — https://zh.wikisource.org/wiki/莊子/列禦寇</p></article></main></div></div>
