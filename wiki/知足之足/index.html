    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 知足之足</nav></header><main><article><h1>知足之足</h1><p>知足者之足，乃恆足之道。</p><p>天下有道，則人樂素履而無外慕。及失其道，爭逐之風熾，欲壑之壑深，人自是以不能足。聖人知其然，反求諸己，審於所足之處，而不以物之盈缺為累。是以足在其心，不在外物；足在自知，不在人之予奪。如是之足，無待乎外，無耗乎內，常久而不匱。此聖人之所貴，而百家之所述者也。[[知足者富]]言其效，此言其本。皆[[寡欲]]之義，而進焉者也。</p><p><strong>所出</strong>：《老子河上公章句 · 儉欲》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
