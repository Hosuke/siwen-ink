    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 桓桓丕敬</nav></header><main><article><h1>桓桓丕敬</h1><p>威武而盛大之敬也。</p><p>桓桓丕敬，言威武盛大之敬也。</p><p>《封許之命》述武王云「桓桓丕敬，嚴將天命」，言武王之敬盛大而威武也。桓桓者，威武之貌；丕敬者，大敬之稱。[[敬慎威儀]]言威儀之恭，此言武王之敬盛大如彼，二者皆敬德之形容，而壯敬、恭敬之別也。</p><p><strong>所出</strong>：《尚書 · 封許之命》 — https://zh.wikisource.org/wiki/尚書/封許之命</p></article></main></div></div>
