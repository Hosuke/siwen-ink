    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 氣之所自生</nav></header><main><article><h1>氣之所自生</h1><p>氣生於搖，形生於鑽，皆有待而後成</p><p>有時者氣，彼非氣者，未嘗有晝夜。有方者形，彼非形者，未嘗有南北。何謂非氣？氣之所自生者如搖箑得風。彼未搖時，非風之氣；彼已搖時，即名為氣。何謂非形？形之所自生者，如鑽木得火。彼未鑽時，非火之形；彼已鑽時，即名為形。</p><p>[[氣之所自生]] 氣之生，搖箑而後有風；形之生，鑽木而後有火。未搖、未鑽之時，風與火之氣形無有也。言凡物之生，皆有待於動，有待而後形氣成，無待則未嘗有是物也。</p><p><strong>所出</strong>：《關尹子 · 2》 — https://zh.wikisource.org/wiki/關尹子/2</p></article></main></div></div>
