    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不敢暴虎，不敢馮河</nav></header><main><article><h1>不敢暴虎，不敢馮河</h1><p>智小謀大、僥倖輕試之戒。</p><p>不敢暴虎，不敢馮河。暴虎者，空手以闘虎；馮河者，無舟而涉水。皆恃勇輕死、僥倖萬一之徒也。詩人以二者並言，明智士不為此魯莽之事。蓋小人之於國事，知其一端，莫知其他；昧然而行之，適足以覆邦耳。詩以為鑒誡，深戒後人勿逞一時之勇以蹈危亡。</p><p><strong>所出</strong>：《詩經 · 小旻》 — https://zh.wikisource.org/wiki/詩經/小旻</p></article></main></div></div>
