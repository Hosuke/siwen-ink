    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 溥將</nav></header><main><article><h1>溥將</h1><p>天命深厚，普及萬方。</p><p>「溥將」出自《商頌·烈祖》，言受天命者恩溥業大，普及萬方也。</p><p>詩云「我受命溥將」，言商家受天命，其德澤溥博，其功業盛大，足以覆被天下也。《毛傳》以「將」為大，「溥將」者，言天命既降，其施至廣，其功至大。</p><p>商家以武功定天下，受命為天子，故云「溥將」。《烈祖》美中宗之德，言其承祖業而光大之，天命所加，恩澤所被，無遠弗屆也。</p><p><strong>所出</strong>：《詩經 · 烈祖》 — https://zh.wikisource.org/wiki/詩經/烈祖</p></article></main></div></div>
