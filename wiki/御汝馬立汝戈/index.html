    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 御汝馬立汝戈</nav></header><main><article><h1>御汝馬立汝戈</h1><p>整飭武備，戒不虞。</p><p>禹誓令有「御汝馬、立汝戈」之語。馬者，戎事之所恃；戈者，兵革之所資。御馬以待馳驅，立戈以備格鬬。此所以整飭武備、戒不虞也。軍容不肅，則士不用命；器械不利，則戰不勝敵。故禹先戒其整暇，而後賞罰以令之。</p><p><strong>所出</strong>：《尚書 · 禹誓》 — https://zh.wikisource.org/wiki/尚書/禹誓</p></article></main></div></div>
