    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 診有大方</nav></header><main><article><h1>診有大方</h1><p>診者當坐起有常，出入有行，以轉神明，必清必淨，上觀下觀，循尺滑澀，合之病能，乃可十全。</p><p>帝示診法之大略曰：</p><p>診有大方，坐起有常，出入有行，以轉神明，必清必淨，上觀下觀，司八正邪，別五中部，按脈動靜，循尺滑澀寒溫之意，視其大小，合之病能，逆從以得，復知病名，診可十全，不失人情。</p><p>又云：不知此道，失經絕理，亡言妄期，此謂失道。</p><p><strong>所出</strong>：《黃帝內經 · 素問第二十四卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第二十四卷</p></article></main></div></div>
