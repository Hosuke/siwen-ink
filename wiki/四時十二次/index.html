    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 四時十二次</nav></header><main><article><h1>四時十二次</h1><p>以二十八宿分為十二次，配四方以候吉凶。</p><p>帝旁羅日月星辰，作蓋天儀，測玄象，推分星度，以二十八宿為十二次。角亢為壽星之次，房心為大火之次，尾箕為析木之次，斗女為星紀之次，虛危為玄楊之次，室壁為課訾之次，奎婁為降婁之次，昴畢為大樑之次，賁參為實沈之次，井鬼為鶉首之次，星張為鶉火之次，翼斡為鶉尾之次。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 1》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/1</p></article></main></div></div>
