    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 芟繁剪穢</nav></header><main><article><h1>芟繁剪穢</h1><p>刪除繁蕪、洗滌穢濫，以弛文章之負擔也</p><p><strong>文</strong></p><p>贊曰：篇章戶牖，左右相瞰。辭如川流，溢則汎濫。權衡損益，斟酌濃淡。芟繁剪穢，弛於負擔。</p><p><strong>所出</strong>：《文心雕龍 · 鎔裁》 — https://zh.wikisource.org/wiki/文心雕龍/鎔裁</p></article></main></div></div>
