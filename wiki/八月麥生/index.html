    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 八月麥生</nav></header><main><article><h1>八月麥生</h1><p>言仲秋之月麥始萌生，刑德會酉之象。</p><p>八月麥生，天罡據酉。</p><p>酉仲秋之月。仲秋之時，陰刑用事，而麥始播種者，陽德潛根未泯，雖陰氣方盛而陽生之機已伏。天罡者，星名，其位在酉，刑德之象也。</p><p><strong>所出</strong>：《周易參同契 · 29章》 — https://zh.wikisource.org/wiki/周易參同契/29章</p></article></main></div></div>
