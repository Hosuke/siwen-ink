    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 風吹落葉</nav></header><main><article><h1>風吹落葉</h1><p>以風喻在上者，吹落葉而落葉應之，喻君倡臣和之義。</p><p>風吹落葉，《詩經·蘀兮》之興也。首章云「蘀兮蘀兮，風其吹女」，以風吹枯葉為興。落葉無力，隨風飄轉，故象臣之從君。[[風行天上]]之義，風者上也，葉者下也，風動則葉應。末章云「風其漂女」，漂亦吹也，變文以協韻爾。《左傳》曰「君弱臣強，不倡而和」，正此詩之註腳。倡者唱也，和者應也，上不倡則下不和，故詩人借風葉之喻，以諷時政之失序也。</p><p><strong>所出</strong>：《詩經 · 蘀兮》 — https://zh.wikisource.org/wiki/詩經/蘀兮</p></article></main></div></div>
