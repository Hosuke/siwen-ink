    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 脩除玄鑑能毋疵</nav></header><main><article><h1>脩除玄鑑能毋疵</h1><p>滌除心上塵垢，若玄鑑之無瑕。</p><p>脩除玄鑑者，言修治其心，若磨鏡然，去其塵垢，使湛然清明也。玄鑑，心之喻也。一本作案鑒。脩除者，時時拂拭，不使留瑕也。能毋疵乎，問之辭也，脩之則無疵，不脩則瑕生。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第五十四章 无不為》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)
