    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 尚絅</nav></header><main><article><h1>尚絅</h1><p>君子之於禮蔽，為之不厭而誨人不倦，則可以利用天下也。</p><p>成己，仁也；成物，知也。性之德也，合外內之道也。時措之宜也，故君子素其位而行，不願乎其外。喜怒哀樂之未發，謂之中；發而皆中節，謂之和。</p><p><strong>所出</strong>：《中庸 · 中庸章句》 — https://zh.wikisource.org/wiki/四書章句集註/中庸章句</p></article></main></div></div>
