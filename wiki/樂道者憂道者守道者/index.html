    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 樂道者憂道者守道者</nav></header><main><article><h1>樂道者憂道者守道者</h1><p>遇治而贊曰樂道，遭亂而救曰憂道，亂不可救而避曰守道，以別賢者之高下。</p><p>周生恭遠論世變之際人有三品：遇治而贊之，謂之樂道；遭亂而救之，謂之憂道；亂不可救而避之，謂之守道。援古以證：虞舜，樂道者也；仲尼，憂道者也；微子，守道者也。當漢世將傾、世務交遊之時，林宗法當慨然虛心，與同志君子共矯而正之；乃棲棲自雄，不肯退避以全其道，此非憂道者之宜，而亦非守道者之倫也。是故知而不能改，是乃林宗之蔽，非知之難，改之難矣。</p><p><strong>所出</strong>：《抱朴子 · 卷46》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷46</p></article></main></div></div>
