    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 穀有所藏</nav></header><main><article><h1>穀有所藏</h1><p>凶歲穀有所藏，而民有飢餓不食者。</p><p>且君引錣量用，耕田發草，上得其數矣。民人所食，人有若干步畝之數矣。計本量委則足矣，然而民有飢餓不食者，何也？穀有所藏也。</p><p>物適賤，則半力而無予，民事不償其本。物適貴，則什倍而不可得，民失其用。然則豈財物固寡，而本委不足也哉？夫民利之時失而物利之不平也。</p><p><strong>所出</strong>：《管子 · 第73篇國蓄》 — https://zh.wikisource.org/wiki/管子/第73篇國蓄</p></article></main></div></div>
