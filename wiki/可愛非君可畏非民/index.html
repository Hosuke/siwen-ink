    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 可愛非君，可畏非民</nav></header><main><article><h1>可愛非君，可畏非民</h1><p>民不可無君為之主，君不可失民以為守，二者相須而不可離。</p><p>舜之戒禹也，終之以[[可愛非君可畏非民]]之義。</p><p>可愛者，[[后克艱厥后]]之君，以其政治清明也；可畏者，小民之眾，以其力厚勢重也。君非民，無以守邦；民非君，無所戴奉。</p><p>後之論者言「水能載舟，亦能覆舟」，[[得眾動天]]之義、《左傳》「民，神之主也」之旨，皆與此相通。</p><p><strong>所出</strong>：《尚書 · 大禹謨》 — https://zh.wikisource.org/wiki/尚書/大禹謨</p></article></main></div></div>
