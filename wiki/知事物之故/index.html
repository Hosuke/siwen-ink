    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 知事物之故</nav></header><main><article><h1>知事物之故</h1><p>行事而不知其故，雖當與不知同，卒必受困。</p><p>凡物之然也，必有故。而不知其故，雖當與不知同，其卒必困。先王名士達師之所以過俗者，以其知也。水出於山而走於海，水非惡山而欲海也，高下使之然也。稼生於野而藏於倉，稼非有欲也，人皆以之也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷九》— https://zh.wikisource.org/wiki/呂氏春秋/卷九</p></article></main></div></div>
