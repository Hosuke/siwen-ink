    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 人人自有長生藥</nav></header><main><article><h1>人人自有長生藥</h1><p>長生大藥不待他求，在人良知良能之本性</p><p>金丹者，即人秉受良知良能之本性。此性人人具足，個個圓成，處聖不增，處凡不減，不待他求，自己本有。若下肯心，直登聖城，性定命凝，永久不壞，是良知良能之本性，即長生之大藥也。一切迷徒，不究聖賢實理，空空一世，到老無成，枉自擺拋，可悲也哉。</p><p><strong>所出</strong>：《悟真直指 · 卷一》 — https://zh.wikisource.org/wiki/悟真直指/卷一</p></article></main></div></div>
