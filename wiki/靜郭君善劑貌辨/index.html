    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 靜郭君善劑貌辨</nav></header><main><article><h1>靜郭君善劑貌辨</h1><p>靜郭君善待劑貌辨，雖人多而非之，終賴之以免患。</p><p>靜郭君善劑貌辨。劑貌辨之為人也多訾，門人弗說。士尉以証靜郭君，靜郭君弗聽，士尉辭而去。孟嘗君竊以諫靜郭君，靜郭君大怒曰：「(戔刀)而類！揆吾家，苟可以傔劑貌辨者，吾無辭為也。」於是舍之上舍，令長子御，朝暮進食。靜郭君辭而之薛，與劑貌辨俱。靜郭君薨，宣王立，不善靜郭君。劑貌辨往見宣王，備述靜郭君之忠。宣王迎靜郭君於郊，乃以為相。靜郭君辭，十日謝病，三日而聽。</p><p><strong>所出</strong>：《呂氏春秋 · 卷九》— https://zh.wikisource.org/wiki/呂氏春秋/卷九</p></article></main></div></div>
