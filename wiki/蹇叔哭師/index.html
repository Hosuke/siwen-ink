    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蹇叔哭師</nav></header><main><article><h1>蹇叔哭師</h1><p>記蹇叔百里傒共沮發兵，哭其子必敗於殽。</p><p>昔秦繆公興師以襲鄭，蹇叔諫曰：「不可。」蹇叔送師於門外而哭曰：「師乎！見其出而不見其入也。」蹇叔有子曰申與視，與師偕行。蹇叔謂其子曰：「晉若遏師必於殽。女死不於南方之岸，必於北方之岸，為吾尸女之易。」繆公不聽也。及師還，晉人遏之殽，大敗秦師。蹇叔非欲敗於殽也，智不至也。智不至則不信。言之不信，師之不反也從此生，故不至之為害大矣。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十六》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十六</p></article></main></div></div>
