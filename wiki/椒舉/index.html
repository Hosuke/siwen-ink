    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 椒舉</nav></header><main><article><h1>椒舉</h1><p></p><p>[[蔡聲子論楚材晉用]]述椒舉之事：椒舉娶於申公子牟，子牟有罪而亡，康王以為椒舉遣之，椒舉奔鄭，將遂奔晉。蔡聲子遇之，勸以事晉，又與令尹子木論楚材晉用之弊。子木懼，使椒鳴召其父而復之。詳見[[蔡聲子論楚材晉用]]。</p><p>  <strong>所出</strong>：《國語 · 卷17》 — https://zh.wikisource.org/wiki/國語/卷17</p></article></main></div></div>
