    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 咎單作《明居》</nav></header><main><article><h1>咎單作《明居》</h1><p>咎單為湯臣，作《明居》之篇，述居民之法。</p><p>咎單為湯之臣，見湯誥既作，遂作《明居》之篇。據《偽古文尚書》孔傳，咎單明陳居人之法。《真古文尚書》無此文。</p><p><strong>所出</strong>：《尚書 · 湯誥》 — https://zh.wikisource.org/wiki/尚書/湯誥</p></article></main></div></div>
