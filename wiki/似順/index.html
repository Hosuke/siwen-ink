    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 似順</nav></header><main><article><h1>似順</h1><p>事多似倒而順，多似順而倒；聖人知此，乃可與言化。</p><p>事多似倒而順，多似順而倒。有知順之為倒、倒之為順者，則可與言化矣。</p><p>[[至長反短]]，[[至短反長]]，天之道也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十五》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十五</p></article></main></div></div>
