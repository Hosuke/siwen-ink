    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 飛昇十天</nav></header><main><article><h1>飛昇十天</h1><p>煉形成功，飛昇十天之上，駕玉輪而遊。</p><p>飛昇十天者，修煉之極功也。</p><p>十天者，十層天也。修煉者由積功以成煉，由煉以化形，形既化則輕舉而遊於天界。玉輪者，神車之喻，承載上升。</p><p>此非徒言想像，乃內丹煉形之效驗：精化為氣，氣化為神，神能脫化，輕舉遙遊。故經云「使我僊」，蓋修煉之功至是，形神俱妙，與道合真矣。</p><p><strong>所出</strong>：《黃庭內景經 · 紫清章第二十九》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/紫清章第二十九</p></article></main></div></div>
