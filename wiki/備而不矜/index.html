    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 備而不矜</nav></header><main><article><h1>備而不矜</h1><p>聖人備具萬善而不自矜，故天下莫能與之争功。</p><p>聖人兼仁、義、節、忠四者而備之，備矣而不自矜其善，一循乎天性之自然，是之謂聖。不矜者，不以賢自居也；不與天下争能，而天下自能用其功。功成而不自有，此所以為天下貴也。《詩》云「淑人君子，其儀不忒」，言其德行恆常、無有差忒，足以正四方之俗。此聖人之所以為天下儀表也。</p><p><strong>所出</strong>：《荀子 · 君子篇》 — https://zh.wikisource.org/wiki/荀子/君子篇</p></article></main></div></div>
