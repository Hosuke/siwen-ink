    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 吳起置表</nav></header><main><article><h1>吳起置表</h1><p>吳起立木於南門以示信，遂成賞罰必信之治。</p><p>吳起治西河，欲諭其信於民，夜日置表於南門之外，令於邑中曰：「明日有人僨南門之外表者，仕長大夫。」明日日晏矣，莫有僨表者。民相謂曰：「此必不信。」有一人曰：「試往僨表，不得賞而已，何傷？」往僨表，來謁吳起。吳起自見而出，仕之長大夫。夜日又復立表，又令於邑中如前。邑人守門爭表，表加植，不得所賞。自是之後，民信吳起之賞罰。賞罰信乎民，何事而不成，豈獨兵乎？</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十五》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十五</p></article></main></div></div>
