    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 遊俠之徒</nav></header><main><article><h1>遊俠之徒</h1><p>結交貴遊，聲譽赫赫然，非真隱逸，不得躋於逸隱之科。</p><p>《抱朴子》論郭林宗，謂其「聲譽翕熠，秦胡景附，巷結朱輪之軌，堂列赤紱之客，軺車盈街，載奏連車」，此誠遊俠之所為，非逸隱之徒也。有道之世而臻此者，猶不得復廁高潔之條貫。夫隱者當韜鱗括囊，棲神巖岫，娛心彭老；林宗則自西徂東，席不暇溫，交關貴遊，是立名養譽之徒，非守道全真之士，故不得以隱逸論也。</p><p><strong>所出</strong>：《抱朴子 · 卷46》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷46</p></article></main></div></div>
