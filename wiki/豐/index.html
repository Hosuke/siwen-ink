    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 豐</nav></header><main><article><h1>豐</h1><p>卦名，象豐大之義；離下震上，明以動而致豐也。</p><p>豐之為卦，離下震上。離為火、為明，震為雷、為動。明以動，故能豐大亨通也。</p><p>卦辭曰：「豐：亨。王假之，勿憂，宜日中。」言王者致天下之豐，宜如日之中，無所不照也。假，至也。</p><p>六爻之義：初九「遇其配主」，九四「遇其夷主」，皆以相遇而有成；六二、六五，以明德相遇而有慶；九三、上六，處豐之極，或不能用君子而致咎也。</p><p>彖傳發其義曰：「明以動，故豐。」又戒以盈虛之理，與時消息，則可以保豐也。</p><p><strong>所出</strong>：《周易 · 豐》 — https://zh.wikisource.org/wiki/周易/豐</p></article></main></div></div>
