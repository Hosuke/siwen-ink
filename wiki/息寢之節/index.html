    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 息寢之節</nav></header><main><article><h1>息寢之節</h1><p>先生將息，弟子敬奉枕席，問所趾俟；既息則各就其友，相切相磋，周而復始。</p><p>先生將息，弟子皆起，敬奉枕席，問所何趾。俶衽則請，有常有否。先生有命，弟子乃敢退而就寢。</p><p>先生既息，弟子亦各就其友，相切相磋，各長其儀。周則復始，是謂弟子之紀。</p><p>蓋學之不可以已也如是。先生之息也，弟子非徒退去而已，乃相與切磋琢磨，以輔仁義之術，增進其所聞。日復一日，循循不息，此為弟子事師之終節，而亦學之所以成終者也。</p><p><strong>所出</strong>：《管子 · 第59篇弟子職》 — https://zh.wikisource.org/wiki/管子/第59篇弟子職</p></article></main></div></div>
