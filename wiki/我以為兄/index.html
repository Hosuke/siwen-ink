    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 我以為兄</nav></header><main><article><h1>我以為兄</h1><p>刺公子頑烝於後母，以為己兄而不齒。</p><p>「我以為兄」，《詩經·鵲之奔奔》句也。首章云「人之無良，我以為兄」，言人之無善德，而詩人反以兄事之，刺意深矣。</p><p>毛傳以為刺宣姜與公子頑之事。公子頑者，宣公之子也，與後母宣姜私通，詩人刺之，以為人至無良，反不如禽鳥之有常匹，而乃尊之以兄長之禮，其譏刺之義明矣。《左傳》嘗載其事，與詩義相發明。</p><p><strong>所出</strong>：《詩經 · 鵲之奔奔》 — https://zh.wikisource.org/wiki/詩經/鵲之奔奔</p></article></main></div></div>
