    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 伯牙之絕弦</nav></header><main><article><h1>伯牙之絕弦</h1><p>鍾子期死，伯牙破弦，喻知音難遇。</p><p>伯牙之絕弦，出於《七諫 · 謬諫》。原文云：「伯牙之絕弦兮，無鍾子期而聽之。」夫伯牙鼓琴，鍾子期善聽，子期既沒，伯牙破弦而絕音，終身不復鼓也。君子之於世，得一知己，可以無恨。及乎，知音既沒，則志無由通，意無由達，修途化為長往，援琴至於絕弦，斯誠賢士之至痛也。屈原之於楚國，讒諛蔽明，邪曲害正，無可告訴，與伯牙之絶弦，異世而同心矣。</p><p><strong>所出</strong>：《楚辭 · 七諫》 — https://zh.wikisource.org/wiki/楚辭/七諫</p></article></main></div></div>
