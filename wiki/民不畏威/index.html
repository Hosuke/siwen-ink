    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 民不畏威</nav></header><main><article><h1>民不畏威</h1><p>民不畏威，則大威至。</p><p>民不畏威，則大威至。此言上之威罰不可忽也。威出於民之所畏；若民無所畏，則大亂之威至矣。老子以為，聖人知此，故不以威臨民，而民自畏之。</p><p><strong>所出</strong>：《道德經 (王弼本) · 七十二章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
