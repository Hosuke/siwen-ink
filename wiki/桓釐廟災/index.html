    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 桓釐廟災</nav></header><main><article><h1>桓釐廟災</h1><p>魯桓釐廟失火，孔子預言之。</p><p>夏，魯桓釐廟燔，南宮敬叔救火。孔子在陳，聞之，曰：「災必於桓釐廟乎？」已而果然。此孔子論桓釐廟之災也。</p><p><strong>所出</strong>：《史記 · 卷047》 — https://zh.wikisource.org/wiki/史記/卷047</p></article></main></div></div>
