    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 公劉復修后稷</nav></header><main><article><h1>公劉復修后稷</h1><p>公劉在戎狄之間，復修后稷之業，周道自此興焉。</p><p>后稷卒，子不窋立。不窋末年，夏后氏政衰，去稷不務，不窋以失其官而犇戎狄之間。不窋卒，子鞠立。鞠卒，子公劉立。公劉雖在戎狄之間，復修后稷之業，務耕種，行地宜，自漆、沮度渭，取材用，行者有資，居者有畜積，民賴其慶。百姓懷之，多徙而保歸焉。周道之興自此始，故詩人歌樂思其德。公劉卒，子慶節立，國於豳。</p><p><strong>所出</strong>：《史記 · 卷004》 — https://zh.wikisource.org/wiki/史記/卷004</p></article></main></div></div>
