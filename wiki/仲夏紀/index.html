    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 仲夏紀</nav></header><main><article><h1>仲夏紀</h1><p>紀夏五月之月令，兼樂師整備、君子齋戒之節。</p><p>仲夏之月，日在東井，昏亢中，旦危中。天子居明堂太廟，乘朱輅，駕赤駵，養壯狡。是月也，命樂師修鞀鞞鼓，均琴瑟管簫，執干戚戈羽，調竽笙塤箎，飭鍾磬柷敔。乃命百縣，雩祭祀百辟卿士有益於民者，以祈穀實。君子齋戒，處必揜身，欲靜無躁，止聲色，薄滋味，退嗜慾，定心氣，百官靜，事無刑，以定晏陰之所成。鹿角解，蟬始鳴，半夏生，木堇榮。仲夏行冬令則雹霰傷穀；行春令則五穀晚熟；行秋令則草木零落，果實早成。</p><p><strong>所出</strong>：《呂氏春秋 · 卷五》 — https://zh.wikisource.org/wiki/呂氏春秋/卷五</p></article></main></div></div>
