    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 車舝</nav></header><main><article><h1>車舝</h1><p>詠娶親之詩，以車軸興思，慶新婚之合。</p><p>《車舝》，《詩經·小雅》篇名，五章、章六句，凡三十句。</p><p>首章以「閒關車之舝」起興，-{閒關}-者，車軸轉動之聲也。軸轉而行，喻君子迎季女而來。詩人內心匪有飢渴之感，唯望德音相合。後世以「-{覯爾新昏}-」喻夫婦相得，以「-{高山仰止}-」喻慕賢崇德。</p><p>《毛詩正義》以為此詩刺幽王無道、褒姒嫉妒，周人思得賢女以配君子，然詩辭溫婉，終以新婚相慰為旨。</p><p><strong>所出</strong>：《詩經 · 車舝》 — https://zh.wikisource.org/wiki/詩經/車舝</p></article></main></div></div>
