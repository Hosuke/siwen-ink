    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 用之則行，舍之則藏</nav></header><main><article><h1>用之則行，舍之則藏</h1><p>君子進退以時。</p><p>[[顏淵]]問行藏之道。[[孔子]]言：[[用之則行]]，則一出而有為；[[舍之則藏]]，則退而無悶。唯我與顏淵能之。[[子路]]問行三軍則誰與，孔子言暴虎馮河者吾不與，必也臨事而懼，好謀而成。此見[[聖人]]用行舍藏之道，非忘世也，亦非枉道也。</p><p><strong>所出</strong>：《論語 · 述而第七》 — https://zh.wikisource.org/wiki/論語/述而第七</p></article></main></div></div>
