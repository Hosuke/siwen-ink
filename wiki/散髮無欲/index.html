    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 散髮無欲</nav></header><main><article><h1>散髮無欲</h1><p>解散髮髻，絕嗜欲之情，乃長生久視之道。</p><p>散髮無欲，謂修行之要也。經云「散髮無欲以長存」，言修真之士，當解冠散髮，去羈絆之飾，絕嗜欲之情，無所挂礙，如是則形神俱妙，可以長生久視。髮象甲坼甲生，解散之義，非徒在外服，亦內無所縈心也。</p><p><strong>所出</strong>：《黃庭內景經 · 沐浴章第三十六》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/沐浴章第三十六</p></article></main></div></div>
