    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大明終始</nav></header><main><article><h1>大明終始</h1><p>日月照臨，終而復始，乾道之所以運也。</p><p>大明終始，六位時成，時乘六龍以御天。</p><p>大明者，日也。日象天之明，終而復始，無時或息。六位者，初二三四上，以分畫夜之象。以大明終始之光照臨四方，故六位各以其時而成也。時乘六龍者，聖人體乾之德，乘時而動，如龍之蟄而復起，起而復蟄，乘六位之時以馭天行之正。此言聖人法天，因時而立治，與大明之昭明終始同理者也。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷01》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷01</p></article></main></div></div>
