    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 地道迎穴</nav></header><main><article><h1>地道迎穴</h1><p>敵為穴以入，我亟遣穴師迎而穴之，內弩以待。</p><p>地道迎穴之術，備穴所述尤詳。其法有數端：一者，審知穴之所在而迎之，穿井城內，穴而迎之；二者，置康若疾於穴中，勿滿，令敵入而困之；三者，置艾於穴口，覆以版，鼓橐熏之；四者，用頡臯衝之，灌以不潔，置艾焚之。迎穴之要，在於速而密，勿令敵知我之將迎也。</p></article></main></div></div>
