    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 冀州</nav></header><main><article><h1>冀州</h1><p>堯都所在，王畿之土</p><p>冀州者，堯舜建都之地，王畿之所在也。其地西界於河，東至於海，堯都平陽在焉。土白而壤，賦列上上，田居中中。水道既導，民生既遂，为九州之首。</p><p><strong>所出</strong>：《尚書 · 禹貢》 — https://zh.wikisource.org/wiki/尚書/禹貢</p></article></main></div></div>
