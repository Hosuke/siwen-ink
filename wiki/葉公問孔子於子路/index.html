    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 葉公問孔子於子路</nav></header><main><article><h1>葉公問孔子於子路</h1><p>葉公向子路問孔子為人。</p><p>[[葉公]]問[[孔子]]於[[子路]]，子路不對。[[孔子]]聞之，曰：「女奚不曰：其為人也，發憤忘食，[[樂以忘憂]]，[[不知老之將至]]云爾。」此[[聖人]]自述為學之樂，[[學而時習]]之，不厭不倦，老而不衰也。</p><p><strong>所出</strong>：《論語 · 述而第七》 — https://zh.wikisource.org/wiki/論語/述而第七</p></article></main></div></div>
