    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不鼓不成列</nav></header><main><article><h1>不鼓不成列</h1><p>君子不鼓不成列，臨大事不忘大禮。</p><p>宋襄公之役，執禮不殺，君子大之。</p><p>僖公二十二年，宋公及楚人戰于泓。楚人濟泓而來，有司請擊，宋公曰：「不可。吾聞之也：君子不厄人。吾雖喪國之餘，寡人不忍行也。」既濟，未畢陳，有司復請，宋公又曰：「不可。吾聞之也：君子不鼓不成列。」已陳，然後襄公鼓之，宋師敗績。君子大其不鼓不成列，臨大事而不忘大禮，以為[[雖文王之戰亦不過此]]也。夫偏戰日爾，不鼓不成列乃仁義之師，故公羊子許以為正。</p><p><strong>所出</strong>：《春秋公羊傳 · 僖公》 — https://zh.wikisource.org/wiki/春秋公羊傳/僖公</p></article></main></div></div>
