    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 善言無瑕謫</nav></header><main><article><h1>善言無瑕謫</h1><p>善言者無可指之瑕，無可擊之謫。</p><p>善言者無瑕謫。言完善之論，完密而無闕，使人無可指責、無可攻擊也。《老子》借是以明道之無為：聖人之言，既出於天理之自然，故其言渾全，無隙可尋，不留毁謪之柄於人口。夫有言則有隙，有隙則有争；唯不言而言者，功成而不争，故天下莫能與之争。此與 [[善行無轍跡]] 同意，皆明道之自然無為、功成不居之旨。</p><p><strong>所出</strong>：《老子 (帛書本) · 章二十七》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
