    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 陟方乃死</nav></header><main><article><h1>陟方乃死</h1><p>巡狩南方而崩，聖人死于王事。</p><p>舜生三十徵庸三十，在位五十載，陟方乃死。陟者，升也；方者，方也；陟方者，巡行南方也。帝舜勤民事，東西南北，靡有寧居。及其崩也，猶在巡守之途，此聖人之死也，生無逸豫之樂，死盡艱難之義。</p><p><strong>所出</strong>：《尚書 · 舜典》 — https://zh.wikisource.org/wiki/尚書/舜典</p></article></main></div></div>
