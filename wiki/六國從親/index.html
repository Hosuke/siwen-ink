    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 六國從親</nav></header><main><article><h1>六國從親</h1><p>六國相約親善，共抗強秦。</p><p>蘇秦說六國從親，以并力西鄉攻秦，秦必破。趙王納其計，飾車百乘，黃金千溢，以約諸侯。</p><p><strong>所出</strong>：《史記 · 卷069》 — https://zh.wikisource.org/wiki/史記/卷069</p></article></main></div></div>
