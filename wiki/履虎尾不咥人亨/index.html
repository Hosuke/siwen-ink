    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 履虎尾，不咥人，亨</nav></header><main><article><h1>履虎尾，不咥人，亨</h1><p>履危而善處，虎尾可踐。</p><p>履虎尾，不咥人，亨。</p><p>踩虎之尾，虎不噬人，則亨利。虎喻危險之地，履踏其尾，喻履於危境而不為所傷。[[履虎尾不咥人亨]]之義，在於知危而慎，應乾剛健，悅而不懾，故得亨通。</p><p><strong>所出</strong>：《周易 · 履》 — https://zh.wikisource.org/wiki/周易/履</p></article></main></div></div>
