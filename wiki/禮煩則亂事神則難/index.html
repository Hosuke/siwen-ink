    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 禮煩則亂事神則難</nav></header><main><article><h1>禮煩則亂事神則難</h1><p>禮繁則亂，事神貴簡。</p><p>禮煩則亂，事神則難。禮所以格神也。繁則失其要，緩則乖其敬。是以明王祭祀之禮，尚質貴簡，不貴繁文。</p><p><strong>所出</strong>：《尚書 · 說命中》 — https://zh.wikisource.org/wiki/尚書/說命中</p></article></main></div></div>
