    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 平陽侯</nav></header><main><article><h1>平陽侯</h1><p>曹參封平陽侯，食邑萬六百三十戶。</p><p>高帝以參功高，封平陽侯，食邑平陽萬六百三十戶，號曰平陽侯，除前所食邑。參薨，謚懿侯。子窋代侯。高后時窋為御史大夫，孝文立，免為侯。子奇代侯，謚簡侯。子時尚平陽公主。國於是絶。夫侯國之傳世，既久而後絕，亦功名之常也。</p><p><strong>所出</strong>：《史記 · 卷054》 — https://zh.wikisource.org/wiki/史記/卷054</p></article></main></div></div>
