    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 任下</nav></header><main><article><h1>任下</h1><p>人主任下，前言不驗於後，後言不稽於前，事雖有功，必伏其罪。</p><p>人主之道，使人臣前言不復於後，後言不復於前，事雖有功，必伏其罪，謂之任下。言而不驗者有罪，事有功者必賞，則羣臣莫敢以虛言欺主。韓非以為，主道利明不利幽，必以信賞必罰馭臣下之姦。</p><p><strong>所出</strong>：《韓非子 · 南面》 — https://zh.wikisource.org/wiki/韓非子/南面</p></article></main></div></div>
