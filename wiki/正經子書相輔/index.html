    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 正經與子書相輔</nav></header><main><article><h1>正經與子書相輔</h1><p>正經為道義淵海，子書為增深川流，二者殊途同歸。</p><p>抱朴子曰：「正經為道義之淵海，子書為增深之川流。仰而比之，則景星之佐三辰也；俯而方之，則林薄之裨嵩嶽也。雖津途殊辟，而進德同歸；雖離於舉趾，而合於興化。」又云：「古人歎息於才難，故謂百世為隨踵，不以璞非崑山而棄耀夜之寶，不以書不出聖而廢助教之言。是以閭陌之拙詩，軍旅之鞫誓，或詞鄙喻陋，簡不盈十，猶見撰錄，亞次典誥，百家之言，與善一揆。」</p><p><strong>所出</strong>：《抱朴子 · 卷32》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷32</p></article></main></div></div>
