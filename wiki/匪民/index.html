    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 匪民</nav></header><main><article><h1>匪民</h1><p>征夫斥王者不以民待己之辭也。</p><p>征夫自傷，見於《何草不黃》。幽王之世，[[視民如禽獸]]，[[用兵不息]]，民困於征役，而王不以民畜之。征夫曰「哀我征夫，獨為匪民」，言天下皆民，而己獨不得為民。此[[哀我征夫]]之悲所以極也。</p><p><strong>所出</strong>：《詩經 · 何草不黃》 — https://zh.wikisource.org/wiki/詩經/何草不黃</p></article></main></div></div>
