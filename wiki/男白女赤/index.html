    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 男白女赤</nav></header><main><article><h1>男白女赤</h1><p>男屬金白，女屬火赤，金火相拘乃成坎離，水火既濟。</p><p>《參同契》云：「男白女赤，金火相拘。」金者[[五行]]之義，白者金之色；赤者火之色，女之象也。[[金木水火之交]]，金與火相拘制，則水定而[[水為五行之初|水定火]]，[[坎不盈祗既平|坎離]]相投，[[水火交]]而[[既濟]]成。男白者，坎中之陽；女赤者，離中之陰。[[剛柔應]]，[[柔乘剛]]，[[柔皆順乎剛]]，乃能成還返之功也。</p><p><strong>所出</strong>：《周易參同契 · 20章》 — https://zh.wikisource.org/wiki/周易參同契/20章</p></article></main></div></div>
