    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 子虛之賦</nav></header><main><article><h1>子虛之賦</h1><p>司馬相如遊梁時所作，以子虛為楚使，烏有先生難之，極言雲夢之事。</p><p>梁孝王來朝，從遊說之士齊人鄒陽、淮陰枚乘、吳莊忌夫子之徒，相如見而說之，因病免，客游梁。梁孝王令與諸生同舍，相如得與諸生游士居數歲，乃著子虛之賦。</p><p><strong>所出</strong>：《史記 · 卷117》 — https://zh.wikisource.org/wiki/史記/卷117</p></article></main></div></div>
