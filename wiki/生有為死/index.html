    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 生有為死</nav></header><main><article><h1>生有為死</h1><p>生而有為，是死之由也。陽之生出於自，陰之死有由於他。</p><p>或問：「生有為，死也。勸公以其死也，有自也；而生陽也，無自也。而果然乎？惡乎其所適？惡乎其所不適？天有曆數，地有人據，吾惡乎求之？莫知其所終，若之何其無命也？莫知其所始，若之何其有命也？有以相應也，若之何其無鬼邪？無以相應也，若之何其有鬼邪？」此[[寓言]]之設問，欲人悟生死之自然而無所係也。</p><p><strong>所出</strong>：《莊子 · 寓言》 — https://zh.wikisource.org/wiki/莊子/寓言</p></article></main></div></div>
