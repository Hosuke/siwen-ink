    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 柔上而剛下</nav></header><main><article><h1>柔上而剛下</h1><p>陰陽二氣感應之正位</p><p>柔上而剛下，二氣感應以相與。</p><p>咸卦以兌上艮下。兌為澤、為少女，柔而在上也；艮為山、為少男，剛而在下也。柔上而剛下，是陽氣上行、陰氣下行，兩相交與，而感應之道成焉。</p><p>若剛上而柔下，則陰陽相違，不相感應。唯柔上剛下，乃為感應之正位。聖人觀此象，知世之用感者，必虛己以下人，乃能有得。</p><p><strong>所出</strong>：《周易 · 咸》 — https://zh.wikisource.org/wiki/周易/咸</p></article></main></div></div>
