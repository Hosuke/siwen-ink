    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 彤管</nav></header><main><article><h1>彤管</h1><p>靜女貽我所歡之紅管，情之信物也。</p><p>靜女其孌，貽我彤管。彤，赤色也；管，竹之通節者，蓋笛屬之樂器，或可用以書寫之筆管。女子以彤管為禮，遺其所悅之人。</p><p>彤管有煒，說懌女美。煒，光明也。男子得管，見其色澤之美，而悅之，以為此管之所以可悅者，非管之本身，乃由靜女之貽也。此[[匪女之為美]]之旨，先見於彤管。</p><p>彤管在昔為情人間相互致意之物，後世詩文言贈物傳情，多本此義。</p><p><strong>所出</strong>：《詩經 · 靜女》 — https://zh.wikisource.org/wiki/詩經/靜女</p></article></main></div></div>
