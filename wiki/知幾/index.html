    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 知幾</nav></header><main><article><h1>知幾</h1><p>幾者動之微，知幾則可以通道而有成。</p><p>《易傳》明幾微之義。幾者，動之微，吉之先見者也。事物之始，朕兆未著，而君子已燭其幾。知幾之謂神，神則先機而立應。夫幾在於渺忽之間，非耳目所及，唯心明者能察之。見幾而作，不俟終日，此聖人之所以為聖也。知微知彰，知柔知剛，萬夫所望。知幾之學，乃《易》道之樞機也。</p><p><strong>所出</strong>：《周易 · 繫辭下》 — https://zh.wikisource.org/wiki/易傳/繫辭下</p></article></main></div></div>
