    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 發憤忘食，樂以忘憂</nav></header><main><article><h1>發憤忘食，樂以忘憂</h1><p>聖人為學之樂。</p><p>[[孔子]]自述其為學之志：[[發憤]]則[[忘食]]，[[樂以忘憂]]，不知老之將至。[[聖人]]之學，非為利祿，乃以進德脩業為樂，故能樂以忘憂，[[學而不厭]]也。</p><p><strong>所出</strong>：《論語 · 述而第七》 — https://zh.wikisource.org/wiki/論語/述而第七</p></article></main></div></div>
