    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 法重禁輕</nav></header><main><article><h1>法重禁輕</h1><p>法度尚嚴，禁令宜重。輕則民慢，國危。</p><p>博君大國，未嘗非法重而可以至乎令行禁止於天下。是以君人者分爵制禄，則法必嚴以重之。夫國治則民安，事亂則邦危。法重者得人情，禁輕者失事實。</p><p>法度嚴峻，則賞罰明而民從；禁令輕弱，則姦宄肆而事廢。韓非以為，治亂之機，繫於法禁之輕重。輕禁之國，刑賞失度，禁令不行，姦邪無所畏忌，政事因之以亂。是故明主治國，必先重其法、嚴其禁，使令行禁止，而天下治矣。</p><p><strong>所出</strong>：《韓非子 · 制分》 — https://zh.wikisource.org/wiki/韓非子/制分</p></article></main></div></div>
