    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 品藻乖濫</nav></header><main><article><h1>品藻乖濫</h1><p>論品評人物失其準繩，賢者沉抑、愚者顯達之弊。</p><p>門人問抱朴子曰：「聞漢末之世，靈獻之時，品藻乖濫，英逸窮滯，饕餮得誌，名不準實，賈不本物，以其通者為賢，寒者為愚。其故何哉？」抱朴子答以人心所蔽，不異形器之聾瞽，明不能索奇，智不能經妙，遂致賢愚易位、玉石混淆焉。</p><p><strong>所出</strong>：《抱朴子 · 卷20》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷20</p></article></main></div></div>
