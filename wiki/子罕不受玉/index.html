    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 子罕不受玉</nav></header><main><article><h1>子罕不受玉</h1><p>宋野人獻玉，子罕以不受為寶，其所寶者異也。</p><p>宋之野人，耕而得玉，獻之司城子罕，子罕不受。野人請曰：「此野人之寶也，願相國為之賜而受之也。」</p><p>子罕曰：「子以玉為寶，我以不受為寶。」故宋國之長者曰：「子罕非無寶也，所寶者異也。」</p><p><strong>所出</strong>：《呂氏春秋 · 卷十》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十</p></article></main></div></div>
