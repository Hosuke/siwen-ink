    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 禮貴得中</nav></header><main><article><h1>禮貴得中</h1><p>禮之用貴乎中道，奢不及儉，皆非所宜。</p><p>抱朴子曰：「古人詢於草芻蕘，博辨童謠，狂夫之言，猶在擇焉。」又曰：「三王不相沿樂，五帝不相襲禮，而其移風易俗、安上治民一也。或革或因，損益懷善，何必當乘船以登山，策馬以涉川，被甲以升廟堂，重裘以當隆暑乎！若謂古事終不可變，則棺槨不當代薪埋，衣裳不宜改裸袒矣。」</p><p>夫禮之於世，猶寒暑之於四時，不可膠柱而調瑟也。貴在得其中道焉。奢則民困，儉則禮闕，唯酌古今之宜，損其太過，益其不及，乃為合義。</p><p><strong>所出</strong>：《抱朴子 · 卷31》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷31</p></article></main></div></div>
