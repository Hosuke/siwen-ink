    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 北戎侵鄭</nav></header><main><article><h1>北戎侵鄭</h1><p>三覆待敵，大敗戎師</p><p>北戎侵鄭，鄭伯禦之。患戎師，曰：「彼徒我車，懼其侵軼我也。」</p><p>公子突曰：「使勇而無剛者，嘗寇而速去之。君為三覆以待之。戎輕而不整，貪而無親，勝不相讓，敗不相救。先者見獲必務進，進而遇覆必速奔，後者不救，則無繼矣。乃可以逞。」</p><p>從之。戎人之前遇覆者奔，祝聃逐之。衷戎師，前後擊之，盡殪。戎師大奔。十一月甲寅，鄭人大敗戎師。</p><p><strong>所出</strong>：《春秋左氏傳 · 隱公》 — https://zh.wikisource.org/wiki/春秋左氏傳/隱公</p></article></main></div></div>
