    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天非自天，有為天者</nav></header><main><article><h1>天非自天，有為天者</h1><p>天有待而成，屋宇舟車之喻</p><p>天非自天，有為天者；地非自地，有為地者。譬如屋宇舟車，待人而成，彼不自成。知彼有待，知此無待。上不見天，下不見地，內不見我，外不見人。</p><p>[[天非自天有為天者]] 天不自成其天，有所以為之者；地不自成其地，有所以為之者。譬如屋宇待人而建，舟車待人而成，天地亦待人而後成其功用。聖人知有待，則知無待之可貴；上不見天，下不見地，內外兩忘，而無待之真體露矣。</p><p><strong>所出</strong>：《關尹子 · 2》 — https://zh.wikisource.org/wiki/關尹子/2</p></article></main></div></div>
