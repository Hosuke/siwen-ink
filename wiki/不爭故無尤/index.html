    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不爭故無尤</nav></header><main><article><h1>不爭故無尤</h1><p>唯不爭，故無尤咎。</p><p>夫唯不爭，故無尤。</p><p>夫人之有尤，由於爭；欲無尤者，必先去爭之心。水善利萬物而不與物爭，故天下莫能與之争，莫之尤者也。聖人法水之德，居高而不自處，功成而不自居，有善而不自有，雖居人之所惡，夫誰與爭？夫唯不爭，萬物自化，無怨於物，物亦無尤之者。尤者，咎之萌也；不爭者，咎之門之闔也。是以聖人終身不爭，終身無尤矣。</p><p><strong>所出</strong>：《老子河上公章句 · 易性》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
