    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 禹敷土</nav></header><main><article><h1>禹敷土</h1><p>禹疏土以定萬國</p><p>洪水滔天，懷山襄陵。堯舜之世，命禹治水。禹乘四載，隨山刊木，疏通河道，令水有所歸。九州之土，賴以奠定；萬國之民，始得安居。後世稱頌禹功，以為聖人之極則。</p><p><strong>所出</strong>：《尚書 · 禹貢》 — https://zh.wikisource.org/wiki/尚書/禹貢</p></article></main></div></div>
