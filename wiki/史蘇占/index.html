    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 史蘇占</nav></header><main><article><h1>史蘇占</h1><p>獻公伐驪戎，史蘇占曰「勝而不吉」，後皆驗。</p><p>獻公卜伐驪戎，史蘇占之，曰：「勝而不吉。」公問其故，對曰：「遇兆，挾以銜骨，齒牙為猾，戎、夏交捽。交捽，是交勝也，臣故云。且懼有口，攜民，國移心焉。」公弗聽，遂伐驪戎，克之，獲驪姬以歸。公賞史蘇以爵，罰以無肴。蘇再拜曰：「兆有之，臣不敢蔽。」又告大夫曰：「有男戎必有女戎。若晉以男戎勝戎，而戎亦必以女戎勝晉，其若之何！」</p><p><strong>所出</strong>：《國語 · 卷07》 — https://zh.wikisource.org/wiki/國語/卷07</p></article></main></div></div>
