    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 召平吊相國</nav></header><main><article><h1>召平吊相國</h1><p>召平知相國益封置衛乃疑之兆，戒以辭封讓財。</p><p>淮陰侯既誅，高祖益封蕭何相國五千戶，置卒五百人為衛。諸君皆賀，召平獨吊。召平者，故秦東陵侯，秦亡為布衣，種瓜長安城東，瓜美，世謂之「東陵瓜」。召平謂相國曰：「禍自此始矣。上暴露於外而君守於中，非被矢石之事而益君封置衛者，以今者淮陰侯新反於中，疑君心也。夫置衛衛君，非以寵君也。原君讓封勿受，悉以家私財佐軍，則上心說。」相國從其計，高帝乃大喜。</p><p><strong>所出</strong>：《史記 · 卷053》 — https://zh.wikisource.org/wiki/史記/卷053</p></article></main></div></div>
