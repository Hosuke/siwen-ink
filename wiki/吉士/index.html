    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 吉士</nav></header><main><article><h1>吉士</h1><p>善士也。用之以輔國家，不可任憸人也。</p><p>吉士者，善士之稱也。周公戒成王曰「其惟吉士，用勱相我國家」，又曰「立政，用憸人，不訓于德，是罔顯在厥世」。明立政之道，在能用吉士，而不用憸人也。吉士與憸人相對，用吉士則國興，用憸人則國亡，此治亂之大分也。</p><p><strong>所出</strong>：《尚書 · 立政》 — https://zh.wikisource.org/wiki/尚書/立政</p></article></main></div></div>
