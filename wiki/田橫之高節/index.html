    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 田橫之高節</nav></header><main><article><h1>田橫之高節</h1><p>田橫寧死不辱，其節義感動賓客，爭死以從。</p><p>太史公曰：「田橫之高節，賓客慕義而從橫死，豈非至賢！余因而列焉。」</p><p>橫始與漢王俱南面稱孤，及漢王為天子，橫乃為亡虜而北面事之，恥固已甚。又嘗亨酈生，而酈商為漢將，懼見報復。是以寧自剄以全節，不忍屈辱而生。其高節如此，故賓客慕義，五百人聞死皆自殺。</p><p><strong>所出</strong>：《史記 · 卷094》 — https://zh.wikisource.org/wiki/史記/卷094</p></article></main></div></div>
