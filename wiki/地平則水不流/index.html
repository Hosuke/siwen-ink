    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 地平則水不流</nav></header><main><article><h1>地平則水不流</h1><p>地平則水不留，國平則民不動。有所不平，必有所往歸。</p><p>地平則水不流，水定則清正，動則失平。故惟不動，則所以無不動也。一淵不兩鮫。水定則清正，動則失平。</p><p>水之就下者也，地平則無所往而不留；民之從化者也，國平則無所求而自定。動則生波，一淵不容兩鮫；不平則趨利，萬民必有所歸。是以聖人無為而治，不動以應萬動，不求以禁萬求。水之於地，猶民之於上也。</p><p><strong>所出</strong>：《淮南子 · 說山訓》 — https://zh.wikisource.org/wiki/淮南子/說山訓</p></article></main></div></div>
