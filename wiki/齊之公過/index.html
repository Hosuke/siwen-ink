    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 齊之公過</nav></header><main><article><h1>齊之公過</h1><p>坐立長差，惡惡來刑，善善來榮，此治心禁姦之道。</p><p>管子論心禁，以晉之公過為戒，又及齊之公過：坐立長差，惡惡乎來刑，善善乎來榮，戒也。禁心者，非徒禁其外也，乃以義正心，使為臣者不萌篡弒之念，不行不忠之事，此治之於未形，禁之於未發，所謂國戒者，在是矣。</p><p><strong>所出</strong>：《管子 · 第75篇山權數》 — https://zh.wikisource.org/wiki/管子/第75篇山權數</p></article></main></div></div>
