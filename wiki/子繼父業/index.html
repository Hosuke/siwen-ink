    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 子繼父業</nav></header><main><article><h1>子繼父業</h1><p>子承父志，孫踵祖先，道脈相傳不絕。</p><p>子繼父業，孫踵祖先。</p><p>道脈相承，若父傳之子，子傳之孫，源源不絕。惜乎傳世迷惑，竟無見聞，遂使志士困躓而道統或幾乎絕焉。</p><p><strong>所出</strong>：《周易參同契 · 31章》 — https://zh.wikisource.org/wiki/周易參同契/31章</p></article></main></div></div>
