    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 乃载踊无算</nav></header><main><article><h1>乃载踊无算</h1><p>裝柩于車，踊跳無算。</p><p>有司請祖期。主人入，袒。乃載，踊無算。卒束。襲。降奠，當前束。載，裝柩于車也。踊所以送哀，無算，言其數多也。</p><p><strong>所出</strong>：《儀禮 · 既夕禮》 — https://zh.wikisource.org/wiki/儀禮/既夕禮</p></article></main></div></div>
