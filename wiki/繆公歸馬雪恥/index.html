    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 繆公歸馬雪恥</nav></header><main><article><h1>繆公歸馬雪恥</h1><p>記晉歸三將，繆公素服迎之，自歸不能用蹇叔百里傒之過。</p><p>文公夫人，秦女也，為秦三囚將請曰：「繆公之怨此三人入於骨髓，願令此三人歸，令我君得自快烹之。」晉君許之，歸秦三將。三將至，繆公素服郊迎，向三人哭曰：「孤以不用百里傒、蹇叔言以辱三子，三子何罪乎？子其悉心雪恥，毋怠。」遂復三人官秩如故，愈益厚之。</p><p>三十四年，楚太子商臣弒其父成王代立。繆公於是復使孟明視等將兵伐晉，戰于彭衙。秦不利，引兵歸。</p><p><strong>所出</strong>：《史記 · 卷005》 — https://zh.wikisource.org/wiki/史記/卷005</p></article></main></div></div>
