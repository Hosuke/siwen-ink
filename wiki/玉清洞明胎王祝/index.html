    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 玉清洞明胎王祝</nav></header><main><article><h1>玉清洞明胎王祝</h1><p>泥丸九真章所載玉清天祝，用以解七祖宿對。</p><p>玉清洞明胎王祝者，[[泥丸九真章]]所載玉清天祝也。其辭略云「七炁離羅，大混黃寧精血神」之屬，以六甲陽神輔魂，六丁陰神守魄，[[三真]]精炁神入胃流液，使[[太一]]玄丹君居紫房，[[三尸神|三尸]]降伏，[[七祖]]罪散，宿對悉解。</p><p>誦此祝者，當密念三元君內名，務令七祖各得反生，累命重寧。乃大洞存思之要法，與[[皇清洞真道君|皇清洞真道君]]之功用相須。</p><p><strong>所出</strong>：《上清大洞真經 · 11章》 — https://zh.wikisource.org/wiki/上清大洞真經/11章</p></article></main></div></div>
