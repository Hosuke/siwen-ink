    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三心一貫</nav></header><main><article><h1>三心一貫</h1><p>晏子言己事三君而順，非己有三心，乃三君一心。</p><p>仲尼遊齊，見景公。景公曰：「先生奚不見寡人宰乎？」仲尼對曰：「臣聞晏子，事三君而得順焉，是有三心，所以不見也。」仲尼出，景公以其言告晏子。</p><p>晏子對曰：「不然，非嬰為三心，三君為一心故。三君皆欲其國家之安，是以嬰得順也。嬰聞之，是而非之，非而是之，猶非也。孔丘必據處此一心矣。」</p><p><strong>所出</strong>：《晏子春秋 · 卷八》 — https://zh.wikisource.org/wiki/晏子春秋/卷八</p></article></main></div></div>
