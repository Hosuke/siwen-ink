    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 髐然有形</nav></header><main><article><h1>髐然有形</h1><p>髑髏空枯，髐然有形，狀其枯朽而立之貌。</p><p>莊子之楚，見空髑髏，髐然有形，撽以馬捶，因而問之。</p><p><strong>所出</strong>：《莊子 · 至樂》 — https://zh.wikisource.org/wiki/莊子/至樂</p></article></main></div></div>
