    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 握固</nav></header><main><article><h1>握固</h1><p>嬰兒筋柔而握指堅固，以喻含德者之全精。</p><p>赤子骨弱筋柔，然而握指獨固。河上公云：「骨弱筋柔而握固。」嬰兒不知牝牡之合而朘作者，精之至也。握固者，精不外泄之象，含德之厚者守之。</p><p><strong>所出</strong>：《老子河上公章句 · 玄符》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
