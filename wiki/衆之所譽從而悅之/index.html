    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 衆之所譽從而悅之</nav></header><main><article><h1>衆之所譽從而悅之</h1><p>亂主以衆口斷事，致姦臣得譽而國危。</p><p>無數以度其臣者，必以其衆人之口斷之。衆之所譽，從而悅之；衆之所非，從而憎之。故為人臣者破家殘賥，内搆黨與、外接巷族以為譽，從陰約結以相固也，虚相與爵禄以相勸也。</p><p><strong>所出</strong>：《韓非子 · 說疑》 — https://zh.wikisource.org/wiki/韓非子/說疑</p></article></main></div></div>
