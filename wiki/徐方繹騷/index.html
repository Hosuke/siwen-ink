    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 徐方繹騷</nav></header><main><article><h1>徐方繹騷</h1><p>徐方接連震動、驚擾不安。</p><p>詩言「徐方繹騷，震驚徐方」。繹，本義為抽絲，引申為接連不斷。騷，擾動也。周師臨境，徐方之人接連驚擾惶恐。詩言王師未至而敵已先震，見天子威令之行，自足以懾服遠方也。</p><p><strong>所出</strong>：《詩經 · 常武》 — https://zh.wikisource.org/wiki/詩經/常武</p></article></main></div></div>
