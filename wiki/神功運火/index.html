    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 神功運火</nav></header><main><article><h1>神功運火</h1><p>戒慎恐懼、不睹不聞之慎獨功</p><p>神功者，即神明默運、慎獨之功也。火者，真知靈知剛柔合一之和氣。運火者，戒慎乎其所不睹，恐懼乎其所不聞，運此真知靈知剛柔合一，不使有一點滓質留於方寸之間耳。這個神功之火，如立竿見影，呼穀傳聲，若下肯心，不待終日，即能陰中返陽，如深潭日出自退也。詩中最要處，是「欲留」「先下」四字，有先發制人、義不及賓之旨。</p><p><strong>所出</strong>：《悟真直指 · 卷一》 — https://zh.wikisource.org/wiki/悟真直指/卷一</p></article></main></div></div>
