    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 胎中白炁君</nav></header><main><article><h1>胎中白炁君</h1><p>胎中白氣，主育上生，與太一精魂共守五藏。</p><p>胎中白炁君，乃大洞三十章所言守護之神也。名務玄子，字育上生。與太一精魂玄歸子共守兆五藏之上，結喉本戶死炁之門，使三華之炁入帝一之府，九明之津，生六胎之下，九玄散旤，七祖解結，身登玉堂，位列太一。</p><p>修煉之法：真思其真炁三華之色，罩於頂上，默呪曰：「金闕煥玉清，白炁映丹霞。」次思三華之氣從兆泥丸中入，口吸神雲，咽津三過，結作三神，白炁君白袞冕而下布結喉本戶。</p><p><strong>所出</strong>：《上清大洞真經 · 30章》 — https://zh.wikisource.org/wiki/上清大洞真經/30章</p></article></main></div></div>
