    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 孟夏始絺</nav></header><main><article><h1>孟夏始絺</h1><p>天子孟夏始服細葛以應暑氣</p><p>孟夏之月，天子始絺。</p><p>絺者，細葛布也。孟夏溫氣將盛，天子初服葛衣，以示[[敬時愛日]]之義。《詩》云「七月流火，九月授衣」，明 [[季夏紀]] 又有暑盛斂衣之事。孟夏始絺，是歲時衣服之一大事，天子率先行之，以為[[節令]]之應。野虞出行田原，[[敬時愛日]]，[[孟夏始耕]]，皆此月之急務也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷四》 — https://zh.wikisource.org/wiki/呂氏春秋/卷四</p></article></main></div></div>
