    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 如嬰兒之未孩</nav></header><main><article><h1>如嬰兒之未孩</h1><p>若嬰兒未解笑，純樸未散。</p><p>如嬰兒之未孩。孩，小兒笑也；未孩者，未解嬉笑之時也。嬰兒在襁褓之中，未有知識，情欲未形，專氣致柔，純粹渾全。聖人所以若嬰兒者，以其心無分別、欲未萌動，與道合真也。</p><p><strong>所出</strong>：《老子河上公章句 · 異俗》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
