    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖人龍之</nav></header><main><article><h1>聖人龍之</h1><p>聖人如龍能變化，賢人如蛟，不能為龍。</p><p>若龍若蛟，若蛇若龜，若魚若蛤，龍皆能之。蛟，蛟而已，不能為龍，亦不能為蛇為龜為魚為蛤。聖人龍之，賢人蛟之。</p><p><strong>所出</strong>：《關尹子 · 3》 — https://zh.wikisource.org/wiki/關尹子/3</p></article></main></div></div>
