    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 善人之寶，不善人之所保</nav></header><main><article><h1>善人之寶，不善人之所保</h1><p>道為善者所珍，亦為不善者所賴</p><p>善人之寶，言道為[[善人]]所珍若[[拱璧]]；不善人之所保，言[[不善人]]亦賴道以存其身。夫道之為物，不分賢與不肖，咸賴以生，咸賴以免於患難。此[[貴以賤為本|道貴]]之旨也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 六十二章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
