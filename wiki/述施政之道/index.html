    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 述施政之道</nav></header><main><article><h1>述施政之道</h1><p>堯咨四岳治水，四岳稱禹可，堯命司空平水土，禹讓於稷、契、皋陶，終受命治水。</p><p>堯崩，帝問四嶽曰：「有能成美之事者使居官？」皆曰：「禹可爲司空，可成美之功。」帝曰：「嗟，然！」命禹：「女平水土，維是勉之。」禹拜稽首，讓於稷、契與皋陶。帝曰：「女其往視爾事矣。」</p><p><strong>所出</strong>：《史記 · 卷002》 — https://zh.wikisource.org/wiki/史記/卷002</p></article></main></div></div>
