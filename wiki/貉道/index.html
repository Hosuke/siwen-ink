    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 貉道</nav></header><main><article><h1>貉道</h1><p>欲輕堯舜之賦者，大貉小貉也；欲重之者，大桀小桀也。</p><p>欲輕之於堯舜之道者，大貉、小貉也；欲重之於堯舜之道者，大桀、小桀也。</p><p>白圭欲二十而取一，孟子以為此[[貉道]]，非君子之道也。蓋北方夷狄之地，無城郭宗廟，無諸侯幣帛，無百官有司，故二十取一而足；若居中國，去人倫、無君子，豈可以為國？</p><p>輕堯舜之稅，是薄斂以害國用，與夷狄同；重堯舜之稅，是厚斂以困百姓，與桀紂同。君子之治，取之有制，用之有節，介於二者之間，庶乎其可也。</p><p><strong>所出</strong>：《孟子 · 告子下》 — https://zh.wikisource.org/wiki/孟子/告子下</p></article></main></div></div>
