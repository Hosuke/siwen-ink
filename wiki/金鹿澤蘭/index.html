    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 金鹿澤蘭</nav></header><main><article><h1>金鹿澤蘭</h1><p>潘岳哀辭之代表作，義直文婉，體舊趣新。</p><p>潘岳哀辭，觀其慮善辭變，情洞悲苦，敘事如傳，結言摹詩，促節四言，鮮有緩句；故能義直而文婉，體舊而趣新，《金鹿》《澤蘭》，莫之或繼也。</p><p><strong>所出</strong>：《文心雕龍 · 哀弔》 — https://zh.wikisource.org/wiki/文心雕龍/哀弔</p></article></main></div></div>
