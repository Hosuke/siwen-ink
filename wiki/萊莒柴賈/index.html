    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 萊莒柴賈</nav></header><main><article><h1>萊莒柴賈</h1><p>管仲令齊重柴之價，誘萊莒釋農而治柴，既得其利，乃止柴而困之。</p><p>萊、莒與柴田相并，萊、莒之山生柴。君其率白徒之卒，鑄莊山之金以爲幣，重萊之柴賈。</p><p>萊君聞之，告左右曰：「金幣者，人之所重也。柴者，吾國之奇出也。以吾國之奇出，盡齊之重寶，則齊可并也。」萊即釋其耕農而治柴。管子即令隰朋反農。</p><p>二年，桓公止柴。萊、莒之糴三百七十，齊糶十錢，萊、莒之民降齊者十分之七。二十八月，萊、莒之君請服。</p><p><strong>所出</strong>：《管子 · 第84篇輕重戊》 — https://zh.wikisource.org/wiki/管子/第84篇輕重戊</p></article></main></div></div>
