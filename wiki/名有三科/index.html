    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 名有三科</nav></header><main><article><h1>名有三科</h1><p>名有命物、毀譽、況謂三類</p><p>名有三科，法有四呈。一曰命物之名，方圓白黑是也；二曰毀譽之名，善惡貴賤是也；三曰況謂之名，賢愚愛憎是也。</p><p><strong>所出</strong>：《尹文子 · 大道上》 — https://zh.wikisource.org/wiki/尹文子/大道上</p></article></main></div></div>
