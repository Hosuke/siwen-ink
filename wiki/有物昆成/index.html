    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 有物昆成</nav></header><main><article><h1>有物昆成</h1><p>道先天地而生，渾淪莫測，為萬物之母。</p><p>老子述道之渾淪曰：「有物昆成，先天地生。」昆者，渾淪之義；成者，生物之功。言道在天地之先，無名無形，默默化生萬物，實為天地之母。[[道生天地]]、[[為天下母]]皆此義也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第六十九章 昆成》 — https://zh.wikisource.org/wiki/老子_(帛書校勘版)</p></article></main></div></div>
