    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 衢國</nav></header><main><article><h1>衢國</h1><p>四面受敵之地，雖大必削。</p><p>前有萬乘之國，而後有千乘之國，謂之抵國。前有千乘之國，而後有萬乘之國，謂之距國。壤正方，四面受敵，謂之衢國。</p><p>以百乘衢處，謂之託食之君。千乘衢處，壤削少半；萬乘衢處，壤削太半。是特名羅於為君耳，無壤之有。號有百乘之守，而實無尺壤之用，故謂託食之君。</p><p><strong>所出</strong>：《管子 · 第73篇國蓄》 — https://zh.wikisource.org/wiki/管子/第73篇國蓄</p></article></main></div></div>
