    <meta property="og:description" content="坤上六曰：「龍戰于野，其血玄黃。」 坤象曰：「龍戰于野，其道窮也。」 坤文言曰：「陰疑於陽必戰，為其嫌於无陽也，故稱龍焉。猶未離其類也，故稱血焉。夫玄黃者，天地之雜也。天玄而地黃。」 言陰盛至極，疑於陽而必戰。龍者陽物，陰盛稱龍，猶未離其類，故稱血。玄黃者，天地雜色，陰陽兩傷也。 所出：《周易 · …" />

    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 龍戰于野</nav></header><main><article><h1>龍戰于野</h1><p></p><p>坤上六曰：「龍戰于野，其血玄黃。」</p><p>  坤象曰：「龍戰于野，其道窮也。」</p><p>  坤文言曰：「陰疑於陽必戰，為其嫌於无陽也，故稱龍焉。猶未離其類也，故稱血焉。夫玄黃者，天地之雜也。天玄而地黃。」</p><p>  言陰盛至極，疑於陽而必戰。龍者陽物，陰盛稱龍，猶未離其類，故稱血。玄黃者，天地雜色，陰陽兩傷也。</p><p>  <strong>所出</strong>：《周易 · 坤》 — https://zh.wikisource.org/wiki/周易/坤</p></article></main></div></div>
