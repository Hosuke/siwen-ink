    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 至人無己，神人無功，聖人無名</nav></header><main><article><h1>至人無己，神人無功，聖人無名</h1><p>至人忘己，神人不矜功，聖人不求名，乃逍遙之極致。</p><p>故曰：至人無己，神人無功，聖人無名。</p><p>至人神人聖人，名異而實同，皆能破除我執，無待於物，超然物外，以遊於無窮，此逍遙之極致也。</p><p><strong>所出</strong>：《莊子 · 逍遙遊》 — https://zh.wikisource.org/wiki/莊子/逍遙遊</p></article></main></div></div>
