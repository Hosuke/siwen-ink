    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 動靜相摩化火</nav></header><main><article><h1>動靜相摩化火</h1><p>動靜燥濕水火湯盎飲水皆可化物，陰陽可召，五行可役</p><p>動靜相磨，所以化火也；燥濕相蒸，所以化水也；水火相勃，所以化雲也；湯盎投井，所以化雹也；飲水雨日，所以化虹霓也。小人，由是知陰陽可以召，五行可以役，天地可以別構，日月可以我作。有聞是言者，必將以為誕。夫民之形也，頭圓而足方，上動而下靜，五行運於內，二曜明於外。斯亦構之道也。</p><p><strong>所出</strong>：《化書 · 卷二》 — https://zh.wikisource.org/wiki/化書/卷二</p></article></main></div></div>
