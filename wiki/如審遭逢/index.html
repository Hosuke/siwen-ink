    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 如審遭逢</nav></header><main><article><h1>如審遭逢</h1><p>述遇合之理，明五行化生之妙</p><p>此章論修道者遇合之理。首言「如審遭逢」，謂真人相遇，當察其端緒，循其綱紀。以類相況，揆度萬物始終，則道在是矣。</p><p>五行相剋，更為父母。母含滋液，凝精流形；父主秉與，凝精流形。金石稟此精華，故能不朽。審其專一，不有泄露，乃得成道。</p><p>道之顯驗，立竿見影，呼谷傳響。影之與響，豈不靈哉！此天地至象，昭昭可信。</p><p><strong>所出</strong>：《周易參同契 · 25章》 — https://zh.wikisource.org/wiki/周易參同契/25章</p></article></main></div></div>
