    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 德音孔昭</nav></header><main><article><h1>德音孔昭</h1><p>嘉賓德隆譽著，昭然可見。</p><p>德音者，美善之名聲也；孔昭，猶甚明也。德音孔昭，謂嘉賓之德行名譽，昭昭然著明於世也。《鹿鳴》次章言「我有嘉賓，德音孔昭」，贊其人德厚譽美，堪為矜式。鄭玄解德音為先王道德之教，嘉賓能宣暢其美於王庭者也。</p><p><strong>所出</strong>：《詩經 · 鹿鳴》 — https://zh.wikisource.org/wiki/詩經/鹿鳴</p></article></main></div></div>
