    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 治亂存亡若秋毫</nav></header><main><article><h1>治亂存亡若秋毫</h1><p>治亂存亡之始，察之於微，如察秋毫。</p><p>使治亂存亡若高山之與深谿，若白堊之與黑漆，則無所用智，雖愚猶可矣。且治亂存亡則不然，如可知、如可不知，如可見、如可不見。故智士賢者相與積心愁慮以求之，猶尚有管叔、蔡叔之事與東夷八國不聽之謀。故治亂存亡，其始若秋毫。察其秋毫，則大物不過矣。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十六》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十六</p></article></main></div></div>
