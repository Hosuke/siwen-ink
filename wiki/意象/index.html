    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 意象</nav></header><main><article><h1>意象</h1><p>內蓄之象，寓於心思，外發而為文者也。</p><p>劉勰以「獨照之匠，闚意象而運斤」喻之。獨照者，洞徹之明也；意象者，心中所蓄之象也。匠人闚意象而運斤斧，是知意象乃為文之張本。必胸中先有昭然之象，方能驅遣文辭，妙手成春。此與「尋聲律而定墨」並稱，皆馭文之首術也。</p><p><strong>所出</strong>：《文心雕龍 · 神思》 — https://zh.wikisource.org/wiki/文心雕龍/神思</p></article></main></div></div>
