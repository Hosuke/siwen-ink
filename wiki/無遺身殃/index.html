    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無遺身殃</nav></header><main><article><h1>無遺身殃</h1><p>不遺過咎於身，殃不及之。</p><p>遺者，留也、加也。既有[[見小曰明]]之智，又能[[用其光]]以歸[[明]]，則明鏡在胸，物來則照，纖微之過無所逃焉。既無過咎之加，則殃患亦無自而至。此[[全生]]之道，所以避害全身也。</p><p><strong>所出</strong>：《老子河上公章句 · 歸元》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
