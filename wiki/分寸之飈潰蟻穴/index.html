    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 分寸之飈・一蟻之穴</nav></header><main><article><h1>分寸之飈・一蟻之穴</h1><p>患起於微，小隙可敗大功</p><p>夫百尋之室，焚於分寸之飈；千丈之陂，潰於一蟻之穴。何可不深防乎！何可不改張乎！</p><p>而秉斤兩者，或舍銓衡而任情；掌柯斧者，或曲繩墨於附己。選之者既不為官擇人，而求之者又不自謂不任，於是蒞政而政荒，牧民而民散。</p><p><strong>所出</strong>：《抱朴子 · 卷28》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷28</p></article></main></div></div>
