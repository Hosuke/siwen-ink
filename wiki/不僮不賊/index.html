    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不僮不賊</nav></header><main><article><h1>不僮不賊</h1><p>不妄動不害義，可為法則。</p><p>「不僮不賊，鮮不為則」，言不悖慢不殘害者，其善行少有不為人法則者也。僮，癡也；賊，害也。言無癡妄無戕賊，則其身為世所法效矣。</p><p><strong>所出</strong>：《詩經 · 振鷺》 — https://zh.wikisource.org/wiki/詩經/振鷺</p></article></main></div></div>
