    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 内寵並后外寵貳政</nav></header><main><article><h1>内寵並后外寵貳政</h1><p>内寵並后、外寵貳政、枝子配適、大臣擬主，此亂之道。</p><p>故曰：内寵並后，外寵貳政，枝子配適，大臣擬主，亂之道也。故《周記》曰：「無尊妾而卑妻，無孽適子而尊小枝，無尊嬖臣而匹上卿，無尊大臣以擬其主也。」四擬者破，則上無意、下無怪也；四擬不破，則隕身滅國矣。</p><p><strong>所出</strong>：《韓非子 · 說疑》 — https://zh.wikisource.org/wiki/韓非子/說疑</p></article></main></div></div>
