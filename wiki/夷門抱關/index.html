    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 夷門抱關</nav></header><main><article><h1>夷門抱關</h1><p>侯嬴自稱其為大梁夷門守門之人，以喻微賤。</p><p>侯生攝敝衣冠，直上載公子上坐，不讓，欲以觀公子。侯生又謂公子曰：「臣有客在市屠中，願枉車騎過之。」侯生下見其客朱亥，俾倪故久立，與其客語，微察公子。</p><p>侯生遂為上客，謂公子曰：「今日嬴之為公子亦足矣。嬴乃夷門抱關者也，而公子親枉車騎，自迎嬴於眾人廣坐之中，不宜有所過，今公子故過之。」</p><p><strong>所出</strong>：《史記 · 卷077》 — https://zh.wikisource.org/wiki/史記/卷077</p></article></main></div></div>
