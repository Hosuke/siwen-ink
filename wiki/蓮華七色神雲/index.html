    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蓮華七色神雲</nav></header><main><article><h1>蓮華七色神雲</h1><p>蓮華七色神雲者，誦此章所存想之神氣也，罩於頂上，口吸咽之。</p><p>蓮華七色神雲者，誦此章所存想之神氣也。</p><p>經云：「真思混合蓮華七色神雲，罩於頂上，乃默呪。」又云：「次思七色蓮華之炁從兆泥丸中入，兆乃口吸神雲，咽津七過，每念一名則咽一過。」</p><p>蓮華七色者，青、黃、赤、白、黑、綠、紺之雲也。從兆泥丸中入，罩於頂上，口吸咽津，七神之名各咽一過，此誦此章之要行也。</p><p><strong>所出</strong>：《上清大洞真經 · 35章》 — https://zh.wikisource.org/wiki/上清大洞真經/35章</p></article></main></div></div>
