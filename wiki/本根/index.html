    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 本根</nav></header><main><article><h1>本根</h1><p>觀道當觀其本根，循於自然之理。</p><p>「今彼神明至精，與彼百化。物已死生方圓，莫知其根也，扁然而萬物自古以固存。六合為巨，未離其內；秋豪為小，待之成體。天下莫不沉浮，終身不故；陰陽四時運行，各得其序。惛然若亡而存，油然不形而神，萬物畜而不知。此之謂本根，可以觀於天矣。」</p><p>道為萬物之本根，無形無名，而化生一切。觀天者，觀此本根之流行爾。</p><p><strong>所出</strong>：《莊子 · 知北遊》 — https://zh.wikisource.org/wiki/莊子/知北遊</p></article></main></div></div>
