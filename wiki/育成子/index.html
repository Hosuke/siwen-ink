    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 育成子</nav></header><main><article><h1>育成子</h1><p>周武王時由守藏史遷柱下史，作《遊璣經》。</p><p>育成子，周武王克商踐祚，以守藏史遷為柱下史。一云周武王時出為師，號郭叔子，亦稱續成子，或號天老公，復稱為老君。乍為常人，乍為柱下史。作《長生經》三十卷，以授於王。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 2》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/2</p></article></main></div></div>
