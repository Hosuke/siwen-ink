    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 子以四教：文、行、忠、信</nav></header><main><article><h1>子以四教：文、行、忠、信</h1><p>聖人教人之目。</p><p>[[孔子]]教人四者：[[文]]者，詩書六藝之文；[[行]]者，躬行實踐；[[忠]]者，盡心竭力；[[信]]者，言行相孚。[[聖人]]教人以文行基礎，而以[[忠信]]為歸宿，亦[[為人由己]]之義也。</p><p><strong>所出</strong>：《論語 · 述而第七》 — https://zh.wikisource.org/wiki/論語/述而第七</p></article></main></div></div>
