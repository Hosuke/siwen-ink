    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鼓脹</nav></header><main><article><h1>鼓脹</h1><p>論心腹脹滿、食後乃發之病，由飲食不節、氣聚於腹所致。</p><p>黃帝問：「有病心腹滿，旦食則不能暮食，此為何病。」歧伯對曰：「名為鼓脹。」治以雞矢醴，一劑知，二劑已。其復發者，由飲食不節，氣聚於腹故也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第十一卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十一卷</p></article></main></div></div>
