    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 荒兮未央</nav></header><main><article><h1>荒兮未央</h1><p>俗學無已，若未央之無竟。</p><p>世俗人荒亂，欲進學為文，未央止也。</p><p>荒者，不止也。央者，盡也。世之俗學浮文，泛濫不返，未有止竟。絕學者去此浮華，故無荒未央之患，道心自定。</p><p><strong>所出</strong>：《老子河上公章句 · 異俗》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
