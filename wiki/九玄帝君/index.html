    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 九玄帝君</nav></header><main><article><h1>九玄帝君</h1><p>後聖九玄帝君，姓李，總領九重十疊</p><p>九玄帝君，[[後聖李君]]之尊號也。姓李，高上太之胄，玉皇虛無之胤，玄元帝君時太皇十五年太歲丙子兆氣，皇平元年甲申成形。</p><p>上升上清之殿，中遊[[太一之象輿|太極之宮]]，下治十方之天，封掌億萬兆庶，[[天理四星|鑒察諸天河海、地源山林]]，無不仰從。總領九重十疊，故號九玄。</p><p>七十之歲，定無極之壽，適隱顯之宜，[[刓不死之術]]，撰[[神仙不死|長生之方]]。</p><p><strong>所出</strong>：《太平經 · 01》 — https://zh.wikisource.org/wiki/太平經/01</p></article></main></div></div>
