    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 季札觀辭</nav></header><main><article><h1>季札觀辭</h1><p>觀樂當察辭意，不徒聽聲音之美惡；以辭觀樂，乃知風化之盛衰。</p><p>昔季札聘魯，觀周樂，使工歌《周南》《召南》，曰：「美哉！始基之矣。」師曠亦覘風於盛衰，季札鑒微於興廢。夫季札觀辭，不直聽聲而已。若夫豔歌婉孌，怨志詄絕，淫辭在曲，正響焉生！</p><p><strong>所出</strong>：《文心雕龍 · 樂府》 — https://zh.wikisource.org/wiki/文心雕龍/樂府</p></article></main></div></div>
