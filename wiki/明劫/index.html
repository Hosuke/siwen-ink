    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 明劫</nav></header><main><article><h1>明劫</h1><p>羣臣持祿養交、行私廢公之姦，此姦之大者也。</p><p>明劫者，姦臣竊國之第一途。其狀云何？羣臣持祿以養交，行私道而不效公忠。</p><p>夫國有賢良，逆者必有禍，順者必有福；彼則逆亦不敢言，順亦不為忠，但知持祿待時、交結攀援而已。國家有事，彼皆袖手旁觀，無有挺身效命者。君以為臣滿朝，實則國無一人。</p><p>明者何？此輩姦狀明白，人皆可見，而君或不知，故曰明。非隱微之姦，乃昭然之害也。[[三劫]]之一。</p><p><strong>所出</strong>：《韓非子 · 三守》 — https://zh.wikisource.org/wiki/韓非子/三守</p></article></main></div></div>
