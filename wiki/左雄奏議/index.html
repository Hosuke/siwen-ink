    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 左雄奏議</nav></header><main><article><h1>左雄奏議</h1><p>東漢左雄之奏議，臺閣以為法式。</p><p>逮後漢察舉，必試章奏。左雄奏議，臺閣為式。左雄為尚書，其所上奏議，言簡意賅，典重有法，故當時臺閣皆以為楷式。</p><p><strong>所出</strong>：《文心雕龍 · 章表》 — https://zh.wikisource.org/wiki/文心雕龍/章表</p></article></main></div></div>
