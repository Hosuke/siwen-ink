    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 葛生蒙楚</nav></header><main><article><h1>葛生蒙楚</h1><p>葛蔓覆木，以興生者之無依。</p><p>葛生蒙楚，蘞蔓于野。</p><p>葛，草名，蔓延而生；蒙，覆也；楚，荊也。葛生而蒙於楚木之上，蘞蔓而遍於荒野之中，以興生者之無所依托也。物有依附而人無與偶，對觀之下，情自深矣。</p><p><strong>所出</strong>：《詩經 · 葛生》 — https://zh.wikisource.org/wiki/詩經/葛生</p></article></main></div></div>
