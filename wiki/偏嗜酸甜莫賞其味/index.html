    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 偏嗜酸甜莫賞其味</nav></header><main><article><h1>偏嗜酸甜莫賞其味</h1><p>偏嗜一隅者，不足以識大全。喻學者專執一業則無由通子書之深旨。</p><p>抱朴子曰：「是偏嗜酸甜者，莫能賞其味也；用思有限者，不得辯其神也。」</p><p>言子書之旨，高深弘遠，若偏執一隅，譬如嗜酸者不知甜之美，則無由得其至味。以況學者守一業、遊井俆海，而不知博觀子書以窮其理，終陷於泥濘而不自知也。</p><p><strong>所出</strong>：《抱朴子 · 卷44》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷44</p></article></main></div></div>
