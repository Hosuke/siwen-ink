    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大夫妻</nav></header><main><article><h1>大夫妻</h1><p>卿大夫之妻，承祭祀之重任</p><p>大夫妻者，卿大夫之妻也。</p><p>《采蘋》毛詩序以「大夫妻能循法度」為言，是詩即美大夫妻之德。卿大夫之妻，位亞君子，當備婦德、婦言、婦容、婦功四項功課。及其嫁也，則主持祭祀，操持籩豆，以承先祖。</p><p>祭祀之禮，非徒備物而已，必有能循法度之人以主之。大夫妻躬行婦道，使祭祀不失其序，乃家室之福、子孫之範。</p><p><strong>所出</strong>：《詩經 · 采蘋》 — https://zh.wikisource.org/wiki/詩經/采蘋</p></article></main></div></div>
