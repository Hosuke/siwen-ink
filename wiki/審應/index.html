    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 審應</nav></header><main><article><h1>審應</h1><p>人主出聲應容，當謹慎以對，以言觀意，執其要道。</p><p>審應者，人主出聲應容不可不審也。凡主有識，言不欲先，人唱我和，人先我隨。以其出為之入，以其言為之名，取其實以責其名，則說者不敢妄言，而人主之所執其要矣。是以明主慎言，不以言害名，不以名害實，名實相稽，善惡乃見。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十八》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十八</p></article></main></div></div>
