    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 昏以為期</nav></header><main><article><h1>昏以為期</h1><p>暮色訂約，候而不至</p><p>昏以為期，謂以黃昏之時為相會之約也。昏者，日暮、《說文》云「昏，日冥也」。古人婚嫁以昏時行者，故昏字兼有暮與婚之意。</p><p>《東門之楊》以「昏以為期」起興，言期以暮時相見，而人竟不至，明星煌煌之際，猶未得踐約也。此與《詩》中「期我乎桑中」（《桑中》）「子不我思，豈無他士」（《褰裳》）諸辭，皆言期約之難必。</p><p>後世「後期」「失約」之義，皆此意之引申。昏時為期，蓋取陰陽交會之義；《禮》稱「娶婦以昏時」，是以昏為婚之正時也。</p><p><strong>所出</strong>：《詩經 · 東門之楊》 — https://zh.wikisource.org/wiki/詩經/東門之楊</p></article></main></div></div>
