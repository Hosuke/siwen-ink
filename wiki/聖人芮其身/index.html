    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖人芮其身而身先</nav></header><main><article><h1>聖人芮其身而身先</h1><p>聖人退身不爭，人乃推先之；外身不私，身乃得存；無私而私願成。</p><p>聖人退其身而身先，退身者，不居前，不爭先也。不以身為先，而天下之人反推之使居前，是身先也。</p><p>外其身而身存，外身者，不以身為貴，不以身為念，不以身處我所欲存之地，而身反得全存也。</p><p>不以其無私輿故能成其私。聖人無私心之求，故能成其私志。</p><p>帛書本「芮」讀為「退」，與通行本異。</p><p><strong>所出</strong>：《老子 (帛書本) · 章七》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
