    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 巨楚縣吾前</nav></header><main><article><h1>巨楚縣吾前</h1><p>齊處四戰之地，強敵環伺，若不修義，國必分裂。</p><p>今巨楚縣吾前，大燕䱔吾後，勁魏鉤吾右，西壤之不絕若繩，楚人則乃有襄賁開陽以臨吾左，是一國作謀，則三國必起而乘我。如是，則齊必斷而為四、三，國若假城然耳，必為天下大笑。</p><p><strong>所出</strong>：《荀子 · 彊國篇》 — https://zh.wikisource.org/wiki/荀子/彊國篇</p></article></main></div></div>
