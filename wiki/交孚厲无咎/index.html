    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 交孚厲无咎</nav></header><main><article><h1>交孚厲无咎</h1><p>睽孤遇元夫，交孚而信，雖危无咎，志行可也。</p><p>「睽孤，遇元夫，交孚，厲无咎」者，睽卦九四之辭也。九四以陽處陰，內失所應，外无其朋，睽而且孤；然遇初九元夫，相與交孚，以誠相與。《象》曰「交孚无咎，志行也」，蓋以陽遇陽，志同道合，雖涉於厲，終得无咎，而志以之可行矣。</p><p><strong>所出</strong>：《周易 · 睽》 — https://zh.wikisource.org/wiki/周易/睽</p></article></main></div></div>
