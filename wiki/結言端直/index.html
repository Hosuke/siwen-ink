    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 結言端直</nav></header><main><article><h1>結言端直</h1><p>結言端直，則文骨成焉。</p><p>結言端直，則文骨成焉。言辭結構端正直接，則文章之骨幹立矣。骨之為言，如體之樹骸，骸不正則形廢，言不端則文散。故練於骨者，析辭必精；捶字堅而難移，結響凝而不滯。端直者，非板滯之謂，乃情志明達、辭義正大之謂也。骨髓之言，譬如潘勖錫魏，思摹經典，群才韜筆，乃其骨髓畯也。</p><p><strong>所出</strong>：《文心雕龍 · 風骨》 — https://zh.wikisource.org/wiki/文心雕龍/風骨</p></article></main></div></div>
