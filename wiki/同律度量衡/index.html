    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 同律度量衡</nav></header><main><article><h1>同律度量衡</h1><p>天下法度度量衡皆同，無有乖異。</p><p>協時月正日，同律度量衡。律者，音律也；度者，丈尺也；量者，斗斛也；衡者，斤兩也。四者既同，則商賈通，爭奪息，萬國之民往來如一也。</p><p><strong>所出</strong>：《尚書 · 舜典》 — https://zh.wikisource.org/wiki/尚書/舜典</p></article></main></div></div>
