    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 未知牝牡之會而朘怒</nav></header><main><article><h1>未知牝牡之會而朘怒</h1><p>德全者精之至。</p><p>赤子未知男女之合，而陽物時時挺舉，以其精氣充盈，自然而然，是精之至也。精者，一身之本；精充則氣全，氣全則神定。赤子無欲無知，而精自成，此之謂「精之至」。</p><p><strong>所出</strong>：《老子 (帛書本) · 章五十五》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
