    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 弱者道之用</nav></header><main><article><h1>弱者道之用</h1><p>道以柔弱為用，非以剛強。</p><p>道之應世也，不以剛克，而以弱施。弱者，非怯懦之謂也，乃虛己謙下、不先物之義。水之攻堅、舌之存齒、槁木之逢春，皆弱之為也。</p><p>聖人知強之害、守弱之益，故無欲以觀其妙，柔下以處其上。民之歸附，不在威刑；在無為之化，其效自來。此道之用所以為柔弱也。</p><p>===續寫===
