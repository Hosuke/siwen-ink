    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蟾蜍兔魄</nav></header><main><article><h1>蟾蜍兔魄</h1><p>蟾蜍視卦節，兔者吐生光，象日月之精，以成[[日月炁雙明]]。</p><p>蟾蜍視卦節者，蟾蜍之精主月，月之盈闕如卦之節候，是[[月體納甲]]之所以然也。</p><p>兔者吐生光者，月兔吐納生光，與蟾蜍之視卦相須，共成日月之明，是[[日月炁雙明]]之所以然也。</p><p>[[七八十五]]之數，[[龍鳳迭化]]之機，皆由是而出焉。</p><p><strong>所出</strong>：《周易參同契 · 04章》 — https://zh.wikisource.org/wiki/周易參同契/04章</p></article></main></div></div>
