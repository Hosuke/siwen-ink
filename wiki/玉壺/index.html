    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 玉壺</nav></header><main><article><h1>玉壺</h1><p>南溟夫人所遺，叩之則珍味自至，可以濟乏。</p><p>南溟夫人以玉壺遺元徹、柳實二人，曰：「前程有事，可叩此壺也。」二子中路餒甚，試叩之，則珍味至，一食不復饑渴。後張守珪茶園少年亦有叩樹得物之術，豈非陽平洞府之遺法耶。</p><p>夫人又遣百花橋使者持玉環往還雁峰廟，水仙之偶遺玉環者，皆以報恩而還。</p><p><strong>所出</strong>：《墉城集仙錄 · 卷08》 — https://zh.wikisource.org/wiki/墉城集仙錄/卷08</p></article></main></div></div>
