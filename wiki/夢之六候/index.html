    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 夢之六候</nav></header><main><article><h1>夢之六候</h1><p>夢有六端：正夢、蘁夢、思夢、寤夢、喜夢、懼夢，皆神所交也。</p><p>覺有八徵，夢有六候。奚謂六候？一曰正夢，二曰蘁夢，三曰思夢，四曰寤夢，五曰喜夢，六曰懼夢。此六者，神所交也。</p><p>神遇為夢，形接為事。夢者神之遊也，故其所感不因乎形，而因乎神。精魄散馳，則夢兆交感；神凝意定，則想夢自消。真人無夢，以此。</p><p><strong>所出</strong>：《列子 · 周穆王篇》 — https://zh.wikisource.org/wiki/列子/周穆王篇</p></article></main></div></div>
