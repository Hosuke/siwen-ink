    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 雨者同出異名</nav></header><main><article><h1>雨者同出異名</h1><p>微妙與歸趣，本源既同，異名而已。</p><p>兩者同出，異名。同出者，何也？道也。道一而已，而有無欲、有欲之分；微妙與所噭之觀，異名而已，其實則同。[[有名萬物之母]]與[[無名萬物之始]]，非有二物也；[[恆無欲以觀其眇]]與[[恆有欲以觀其所噭]]，非有二觀也。名異而實同，此道之所以為大。</p><p><strong>所出</strong>：《老子 (帛書本) · 章一》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
