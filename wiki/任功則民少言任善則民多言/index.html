    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 任功則民少言</nav></header><main><article><h1>任功則民少言</h1><p>任用有功之人，則民尚實踐而寡虛言；任用空言之人，則民皆趨於辭辯。</p><p>任功則民少言，任善則民多言。功者實也，善者空言也。國家以功賞人，則民趨於實；以善取人，則民競於言。法家賤空言而貴實功，故以功任事則言寡，以善取譽則言繁。</p><p><strong>所出</strong>：《韓非子 · 飭令》 — https://zh.wikisource.org/wiki/韓非子/飭令</p></article></main></div></div>
