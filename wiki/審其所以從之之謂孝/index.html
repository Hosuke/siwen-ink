    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 審其所以從之之謂孝</nav></header><main><article><h1>審其所以從之之謂孝</h1><p>子從父命非皆孝，臣從君命非皆貞，唯審其所以從之者，乃得孝貞之實。</p><p>故子從父，奚子孝？臣從君，奚臣貞？審其所以從之之謂孝，之謂貞也。</p><p>魯哀公問從命是否即孝，孔子不對。子貢答以為然，孔子斥其為小人。蓋孝非盲從之名，貞非唯命之稱。從父從君，必也本乎義理而從之，乃為真孝真貞。若父命悖禮、君命乖義，則從之非孝，聽之非貞。[[從道不從君]]，[[從義不從父]]，此之謂也。</p><p><strong>所出</strong>：《荀子 · 子道篇》 — https://zh.wikisource.org/wiki/荀子/子道篇</p></article></main></div></div>
