    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 其上不皦，其下不昧</nav></header><main><article><h1>其上不皦，其下不昧</h1><p>道超明暗，不可以上下求之。</p><p>道之上者不皦，皦者光也；道之下者不昧，昧者暗也。言道不在明處、不在暗處，[[混而為一]]，超乎明暗之表，[[繩繩不可名]]也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 十四章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
