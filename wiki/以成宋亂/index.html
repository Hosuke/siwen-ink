    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以成宋亂</nav></header><main><article><h1>以成宋亂</h1><p>會于稷以成宋亂，取鼎納廟，公羊傳深譏之。</p><p>桓公二年，「三月，公會齊侯、陳侯、鄭伯于稷，以成宋亂。」</p><p>宋督弒君取鼎，魯受之不以義。公羊傳以為[[取郜大鼎于宋]]，[[納于太廟]]，皆[[內其君而外弒者]]之類，助亂之甚者也。</p><p><strong>所出</strong>：《春秋公羊傳 · 桓公》 — https://zh.wikisource.org/wiki/春秋公羊傳/桓公</p></article></main></div></div>
