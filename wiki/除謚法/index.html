    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 除謚法</nav></header><main><article><h1>除謚法</h1><p>秦始皇以為子議父臣議君無謂，除去謚法，自稱始皇帝。</p><p>制曰：「朕聞太古有號毋謚，中古有號，死而以行為謐。如此，則子議父，臣議君也，甚無謂，朕弗取焉。自今已來，除謚法。朕為始皇帝。後世以計數，二世三世至于萬世，傳之無窮。」</p><p><strong>所出</strong>：《史記 · 卷006》 — https://zh.wikisource.org/wiki/史記/卷006</p></article></main></div></div>
