    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 問死事之孤</nav></header><main><article><h1>問死事之孤</h1><p>為國而死之臣，其孤無所依者，國家當恤之。</p><p>[[問死事之孤]]，其未有田宅者有乎？[[問少壯而未勝甲兵者幾何人]]？[[問死事之寡]]，其餼廩何如？凡為國而死事者，其身殉國難，義烈昭著；其孤其寡，國家所當卹養者也。使其孤無田宅以居、無祿廩以食，則是旌善勸忠之義闕，而人孰肯致死於國乎？明主治國，必先撫死亡之遺孤、卹死事之遺寡，使存者有養、亡者有祀，然後人心附、士氣振，而霸王之業可成也。</p><p><strong>所出</strong>：《管子 · 第24篇問》 — https://zh.wikisource.org/wiki/管子/第24篇問</p></article></main></div></div>
