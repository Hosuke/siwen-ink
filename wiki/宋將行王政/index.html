    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 宋將行王政</nav></header><main><article><h1>宋將行王政</h1><p>宋小國欲行王政，齊楚伐之，孟子謂苟行王政，四海之內皆舉首而望之。</p><p>萬章問曰：「宋，小國也，今將行王政，齊、楚惡而伐之，則如之何？」孟子曰：「湯居亳，與葛為鄰。」云云。湯受堯之天下，不以為泰。苟行王政，四海之內皆舉首而望之，欲以為君。齊楚雖大，何畏焉？</p><p><strong>所出</strong>：《孟子 · 滕文公下》 — https://zh.wikisource.org/wiki/孟子/滕文公下</p></article></main></div></div>
