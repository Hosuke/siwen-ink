    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 器成於僇教行於鈔</nav></header><main><article><h1>器成於僇教行於鈔</h1><p>器成於殺伐之厲，教行於循習之功。</p><p>器成於僇，僇者，創也，厲也。凡物之成，必有所傷折而後利；教行於鈔，鈔者，徹也，習也。凡教之施，必有所循守而後通。動靜之節不可以形跡求，行止之理不可以繩墨拘。唯因其自然而不敢強為，此治之大要也。</p><p><strong>所出</strong>：《管子 · 第09篇幼官圖》 — https://zh.wikisource.org/wiki/管子/第09篇幼官圖</p></article></main></div></div>
