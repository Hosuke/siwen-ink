    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 約法可久</nav></header><main><article><h1>約法可久</h1><p>蕭何約法三章，可垂久遠，收秦圖書，可成大功。</p><p>【索隱述贊】云：「約法可久，收圖可大。」言蕭何入咸陽，收秦丞相御史律令圖書，使漢王知天下形勢；又約法三章，除秦苛法，使百姓悅服。此二者皆可久可大之政，非一時功利之術也。</p><p><strong>所出</strong>：《史記 · 卷053》 — https://zh.wikisource.org/wiki/史記/卷053</p></article></main></div></div>
