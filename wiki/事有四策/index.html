    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 事有四策</nav></header><main><article><h1>事有四策</h1><p>可行不可言、可言不可行、易成而難成、難成而易敗，聖人獨見而留意。</p><p>故事有可行而不可言者，有可言而不可行者，有易為而難成者，有難成而易敗者。所謂可行而不可言者，趨舍也；可言而不可行者，偽詐也；易為而難成者，事也；難成而易敗者，名也。此四策者，聖人之所獨見而留意也。</p><p><strong>所出</strong>：《淮南子 · 氾論訓》 — https://zh.wikisource.org/wiki/淮南子/氾論訓</p></article></main></div></div>
