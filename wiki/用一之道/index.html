    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 用一之道</nav></header><main><article><h1>用一之道</h1><p>以名為首，名正則物定</p><p>用一之道，以名為首，名正物定，名倚物徒。故聖人執一以靜，使名自命，令事自定。不見其采，下故素正。因而任之，使自事之；因而予之，彼將自舉之；正與處之，使皆自定之。上以名舉之，不知其名，複修其形。形名參同，用其所生。二者誠信，下乃貢情。</p><p><strong>所出</strong>：《韓非子 · 揚榷》 — https://zh.wikisource.org/wiki/韓非子/揚榷</p></article></main></div></div>
