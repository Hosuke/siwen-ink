    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 六親不和有孝慈</nav></header><main><article><h1>六親不和有孝慈</h1><p>六親乖離而後孝慈之行見</p><p>六親不和，有孝慈。[[六親不和有孝慈]]之生於乖離，亦猶[[智慧出有大偽]]之生於巧智。當夫情意相親、上下相安之時，孝慈之名不立；及其離析也，而後孝慈之名始見焉。孝慈者天性之自然，非有待於教令也。六親之情，既以利害相傾，則孝慈者始為人所貴重。</p><p><strong>所出</strong>：《道德經 (王弼本) · 十八章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
