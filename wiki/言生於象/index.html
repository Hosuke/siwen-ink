    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 言生於象</nav></header><main><article><h1>言生於象</h1><p>言生於象，故可尋言以觀象；象生於意，故可尋象以觀意。</p><p>言生於象故可尋言以觀象，象生於意故可尋象以觀意。言者所以明象，得象而忘言；象者所以存意，得意而忘象。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷10》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷10</p></article></main></div></div>
