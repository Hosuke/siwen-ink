    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 籩豆有踐</nav></header><main><article><h1>籩豆有踐</h1><p>籩豆成行而有次，禮之於迎妻，亦有其則也。</p><p>籩，竹器，用以盛籩粔籩羞豆，木器也，用以盛醢醯。有踐者，言其行列整齊、次第有序也。「我覯之子，籩豆有踐」，言得我中意之配偶，其迎之也，籩豆之物莫不排比整齊，以示敬謹。此與昏禮相承。昏禮者，禮之本；迎親之時，器用有次，進退有容，即是踐禮之實。匪媒不得，則無以成昏；籩豆有踐，乃可以成配。二者相須，而昏禮之道備矣。</p><p><strong>所出</strong>：《詩經 · 伐柯》 — https://zh.wikisource.org/wiki/詩經/伐柯</p></article></main></div></div>
