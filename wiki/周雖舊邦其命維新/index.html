    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 周雖舊邦其命維新</nav></header><main><article><h1>周雖舊邦其命維新</h1><p>文王以新德受天命，滕亦可煥然一新</p><p>《詩》云「周雖舊邦，其命維新」，言文王之德日新也。孟子以勉滕文公，謂子力行之，亦可以新子之國。國之新舊，不在地之大小，在德之新故耳。</p><p><strong>所出</strong>：《孟子 · 滕文公上》 — https://zh.wikisource.org/wiki/孟子/滕文公上</p></article></main></div></div>
