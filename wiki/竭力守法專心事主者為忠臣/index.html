    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 竭力守法，專心於事主者為忠臣</nav></header><main><article><h1>竭力守法，專心於事主者為忠臣</h1><p>忠臣之實，不在稱美先王，而在盡力守法、專心事主。</p><p>人臣毋稱堯舜之賢，毋譽湯武之伐，毋言烈士之高。盡力守法，專心於事主者，此之為忠臣。</p><p>堯舜湯武者，誹謗其君者也；[[忠臣不危其君孝子不非其親|烈士高行]]者，亂世絕嗣之道也。忠臣之實，不在空言仁義，不在標榜高節，唯在[[臣事君子事父妻事夫|守其分義]]，奉法盡職，以安其君。此[[堯舜湯武反君臣之義]]之蔽旣破，而治道乃可得而言也。</p><p><strong>所出</strong>：《韓非子 · 忠考》 — https://zh.wikisource.org/wiki/韓非子/忠考</p></article></main></div></div>
