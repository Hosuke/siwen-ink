    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 野禁五事</nav></header><main><article><h1>野禁五事</h1><p>述田野之五禁。</p><p>野禁有五：地未辟易，不操麻，不出糞。齒年未長，不敢為園囿。量力不足，不敢渠地而耕。農不敢行賈，不敢為異事。為害於時也。</p><p>然後制四時之禁：山不敢伐材下木，澤人不敢灰僇，繯網罝罦不敢出於門，罛罟不敢入於淵，澤非舟虞，不敢緣名，為害其時也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十六》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十六</p></article></main></div></div>
