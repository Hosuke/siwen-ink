    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 信陵君</nav></header><main><article><h1>信陵君</h1><p></p><p>魏齊亡走，間行欲因信陵君走楚。信陵君聞其來，畏秦，猶豫未肯見，曰：「虞卿何如人也？」侯嬴在旁，具道虞卿之事，云：「夫虞卿躡屩檐簦，一見趙王，賜白璧一雙，黃金百鎰；再見，拜為上卿；三見，卒受相印，封萬戶侯。當此之時，天下爭知之。夫魏齊窮困過虞卿，虞卿不敢重爵祿之尊，解相印，捐萬戶侯而間行。急士之窮而歸公子，公子曰『何如人』。人固不易知，知人亦未易也！」信陵君大慚，駕如野迎之。魏齊聞信陵君之初難見之，怒而自剄。</p><p>  <strong>所出</strong>：《史記 · 卷079》 — https://zh.wikisource.org/wiki/史記/卷079</p></article></main></div></div>
