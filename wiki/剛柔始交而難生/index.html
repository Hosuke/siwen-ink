    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 剛柔始交而難生</nav></header><main><article><h1>剛柔始交而難生</h1><p>陰陽始交，艱難隨之而生。</p><p>屯之彖辭曰：「屯，剛柔始交而難生，動乎險中，大亨貞。」震為剛，坎為柔，震之一陽動於坎下，是剛柔始交之際。天地之氣既交，萬物始生，而艱難亦隨之而生。動乎險中者，言雖有進取之心，而陷於艱險之地，唯守正者乃得大通。</p><p><strong>所出</strong>：《周易 · 屯》 — https://zh.wikisource.org/wiki/周易/屯</p></article></main></div></div>
