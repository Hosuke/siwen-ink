    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 南極內外音</nav></header><main><article><h1>南極內外音</h1><p>內音合帝伯，外音理生來。</p><p>南極內外音，乃大洞經文之秘密音聲也。經云「天上內音，合帝伯，方超凝」者，此內音也；「地上外音，理生來，福田延」者，此外音也。</p><p>內音在泥丸，外音在[[命門]]，內外相合，則[[帝晨]]可奉、福田可延。</p><p><strong>所出</strong>：《上清大洞真經 · 36章》 — https://zh.wikisource.org/wiki/上清大洞真經/36章</p></article></main></div></div>
