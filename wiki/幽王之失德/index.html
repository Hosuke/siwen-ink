    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 幽王之失德</nav></header><main><article><h1>幽王之失德</h1><p>詩人刺幽王任用小人以致天變人怨</p><p>詩本《小雅》，舊說為刺幽王而作。篇中歷述日食月食、山崩川沸之異，又數皇父諸臣之惡，末章明言「天命不徹，我不敢傚我友自逸」，以天命失序、賢者不安，為幽王失德之驗。詩人自言「哀今之人，胡憯莫懲」，深懼天譴而朝廷無悟己者。</p><p><strong>所出</strong>：《詩經 · 十月之交》 — https://zh.wikisource.org/wiki/詩經/十月之交</p></article></main></div></div>
