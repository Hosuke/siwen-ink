    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 均地分力</nav></header><main><article><h1>均地分力</h1><p>均平地土，民知時日，則用力不倦。</p><p>道曰：均地分力，使民知時也。民乃知時日之蚤晏，日月之不足，飢寒之至于身也。是故夜寢蚤起，父子兄弟不忘其功，爲而不倦，民不憚勞苦。故不均之爲惡也，地利不可竭，民力不可殫。不告之以時而民不知，不道之以事而民不爲。與之分貨則民知得正矣，審其分則民盡力矣，是故不使而父子兄弟不忘其功。</p><p><strong>所出</strong>：《管子 · 第05篇乘馬》 — https://zh.wikisource.org/wiki/管子/第05篇乘馬</p></article></main></div></div>
