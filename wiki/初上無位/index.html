    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 初上無位</nav></header><main><article><h1>初上無位</h1><p>初上為事之終始，無陰陽之分，故不及於當位失位之論。</p><p>案象无初上得位失位之文，又繋辭但論三五二四同功異位，亦不及初上。夫位者列貴賤之地，待才用之宅；爻者守位分之任，應貴賤之序者也。尊者陽之所處，卑者陰之所履。去初上而論位分，則三五各在一卦之上，二四各在一卦之下。初上者體之終始，事之先後也。故位无常分，事无常所，非可以陰陽定也。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷10》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷10</p></article></main></div></div>
