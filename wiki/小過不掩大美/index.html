    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 小過不掩大美</nav></header><main><article><h1>小過不掩大美</h1><p>人有小過不可掩其大美，目有疵不妨其視。</p><p>故目中有疵，不害於視，不可灼也；喉中有病，無害於息，不可鑿也。河上之丘冢，不可勝數，猶之為易也。水激興波，高下相臨，差以尋常，猶之為平。</p><p>今以人之小過揜其大美，則天下無聖王賢相矣。</p><p><strong>所出</strong>：《淮南子 · 氾論訓》 — https://zh.wikisource.org/wiki/淮南子/氾論訓</p></article></main></div></div>
