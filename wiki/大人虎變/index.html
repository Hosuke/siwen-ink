    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大人虎變</nav></header><main><article><h1>大人虎變</h1><p>大人之變如虎，文炳而威，無假蓍占。</p><p>九五云「大人虎變，未占有孚」，言大人在上位者，其變如虎之斑文，自然炳著，不待蓍占而人已信之。虎變者，天生之威自然成文，大人革命之功亦若是焉，其德輝映，其化自孚，此聖人所以擬大人之德於虎也。</p><p><strong>所出</strong>：《周易 · 革》 — https://zh.wikisource.org/wiki/周易/革</p></article></main></div></div>
