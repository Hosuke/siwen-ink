    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 風自火出</nav></header><main><article><h1>風自火出</h1><p>火盛生風，由內及外，喻家之德行施於天下。</p><p>風自火出，[[周易 · 家人]]象傳之辭也。</p><p>火之物，炎上而熾，熾則生風。火在內，風起於外，是家之德積於閨門，而化達於天下也。君子法此象，謹言而有物，不為虛辭；慎行而有恆，不渝於始。內以修己，外以化人，由近以及遠，由家以至國，其理一也。</p><p>是故修齊治平之序，非截然分段，乃風出於火之象焉。身修於內，家齊於中，政理於外，猶風之自火而生，不可遏也。</p><p><strong>所出</strong>：《周易 · 家人》 — https://zh.wikisource.org/wiki/周易/家人</p></article></main></div></div>
