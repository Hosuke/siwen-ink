    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 流風</nav></header><main><article><h1>流風</h1><p>斷血滯之神風，掃三塗之滯者也。</p><p>流風，黃老祝辭所述掃斷血滯之神風也。行道者存思流風，可斷血滯之患、掃三塗之滯，令玄葉得黃寧焉。</p><p><strong>所出</strong>：《上清大洞真經 · 19章》 — https://zh.wikisource.org/wiki/上清大洞真經/19章</p></article></main></div></div>
