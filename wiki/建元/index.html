    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 建元</nav></header><main><article><h1>建元</h1><p>孝武即位，以建元名年，緣年號紀元之制始此。</p><p>孝武皇帝初即位，尤敬鬼神之祀。其後三年，有司言元宜以天瑞命，不宜以一二數。一元曰[[建元]]，二元以長星曰元光，三元以郊得一角獸曰元狩云。</p><p><strong>所出</strong>：《史記 · 卷012》 — https://zh.wikisource.org/wiki/史記/卷012</p><hr><p>孝武建元元年，魏其侯竇嬰為丞相，武安侯田蚡為太尉。置茂陵邑。</p><p>  <strong>所出</strong>：《史記 · 卷022》 — https://zh.wikisource.org/wiki/史記/卷022</p></article></main></div></div>
