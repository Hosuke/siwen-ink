    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 真悲無聲而哀</nav></header><main><article><h1>真悲無聲而哀</h1><p>論真實之情感，本於精誠，強作者不能動人。</p><p>真者，精誠之至也。不精不誠，不能動人。故強哭者雖悲不哀，強怒者雖嚴不威，強親者雖笑不和。真悲無聲而哀，真怒未發而威，真親未笑而和。真在內者，神動於外，是所以貴真也。</p><p><strong>所出</strong>：《莊子 · 漁父》 — https://zh.wikisource.org/wiki/莊子/漁父</p></article></main></div></div>
