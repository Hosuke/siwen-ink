    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三星在罶</nav></header><main><article><h1>三星在罶</h1><p>漁事不成以見物力匱乏</p><p>牂羊坟首，三星在罶。人可以食，鮮可以飽。</p><p>三星，心星也。在罶，星光倒映水中，罶中本當有魚，今寂然無有。三星在罶，靜夜無風，水波不興，故星影得在罶中，非罶中有星也。此言夜之深而魚之少，網罟空設，無所得食。與[[牂羊坟首]]皆以見物力凋敝，雖欲取之，而無可取者。亂世之象，至此而極。</p><p><strong>所出</strong>：《詩經 · 苕之華》 — https://zh.wikisource.org/wiki/詩經/苕之華</p></article></main></div></div>
