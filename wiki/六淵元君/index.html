    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 六淵元君</nav></header><main><article><h1>六淵元君</h1><p>上清身神之一，主精血流布之淵府。</p><p>六淵元君，見於上清大洞經第十七章精血三真章。云「流源迴液，領會六淵元君宮」，蓋以水德深淵象精血流布之府，主精血之化源。與 [[下一真元王]] 章之六淵元君同名而互見，共為上清內煉身神之要神。</p><p><strong>所出</strong>：《上清大洞真經 · 17章》 — https://zh.wikisource.org/wiki/上清大洞真經/17章</p></article></main></div></div>
