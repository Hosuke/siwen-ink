    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 南有喬木不可休</nav></header><main><article><h1>南有喬木不可休</h1><p>喻賢者之不可依恃。</p><p>南方有喬木，高而上偃，不可就而休也。以興賢者居於高位，人無所攀附而息。[[南有樛木]]之喻正相反。</p><p><strong>所出</strong>：《詩經 · 漢廣》 — https://zh.wikisource.org/wiki/詩經/漢廣</p></article></main></div></div>
