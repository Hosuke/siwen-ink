    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 勿忘束縛在魯</nav></header><main><article><h1>勿忘束縛在魯</h1><p>使管子毋忘束縛在魯，以志其艱難而戒其怠。</p><p>[[鮑叔祝三不忘]] 之義。鮑叔牙所祝三事之一。管仲嘗為魯所困，束縛見拘，後歸於齊而相桓公成霸業。使桓公不忘其艱難，則可戒於盈滿，而[[恭遜敬愛]]之道庶幾不失矣。</p><p><strong>所出</strong>：《管子 · 第32篇小稱》 — https://zh.wikisource.org/wiki/管子/第32篇小稱</p></article></main></div></div>
