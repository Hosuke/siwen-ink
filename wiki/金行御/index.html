    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 金行御</nav></header><main><article><h1>金行御</h1><p>金行之令，循庚子而行，天子當修武備，謹誅伐。</p><p>睹庚子，金行御。天子出令，命祝宗選禽獸之禁，五穀之先熟者，而薦之祖廟與五祀。鬼神饗其氣焉，君子食其味焉。然則涼風至，白露下。天子出令，命左右司馬衍組甲厲兵，合什為伍，以修於四境之內，諛然告民有事，所以待天地之殺斂也。然則晝炙陽，夕下露，地競環，五穀鄰熟，草木茂。實歲農豐，年大茂。七十二日而畢。</p><p>睹庚子，金行御，天子攻山擊石，有兵，作戰而敗，士死喪執政。七十二日而畢。</p><p><strong>所出</strong>：《管子 · 第41篇五行》 — https://zh.wikisource.org/wiki/管子/第41篇五行</p></article></main></div></div>
