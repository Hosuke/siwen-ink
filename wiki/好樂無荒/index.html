    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 好樂無荒</nav></header><main><article><h1>好樂無荒</h1><p>欲樂不可廢事，荒逸則失其正。</p><p>荒者，廢也，棄也。詩人勸人以樂，又戒以無荒者，蓋人情不能無欲，而欲過則害於事。《蟋蟀》三章皆以「好樂無荒」終焉。一章言「無已大康，職思其居」，二章言「無已大康，職思其外」，三章言「無已大康，職思其憂」，皆所以申無荒之意。言好樂者人情之常，無荒者義理之正，好樂而不荒，斯之謂得其中。</p><p><strong>所出</strong>：《詩經 · 蟋蟀》 — https://zh.wikisource.org/wiki/詩經/蟋蟀</p></article></main></div></div>
