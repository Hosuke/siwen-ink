    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五鍾</nav></header><main><article><h1>五鍾</h1><p>黃帝制五鍾，配五行，調五聲，以正天時。</p><p>昔黃帝以其緩急作五聲，以政五鍾。令其五鍾：一曰青鍾，大音；二曰赤鍾，重心；三曰黃鍾，洒光；四曰景鍾，昧其明；五曰黑鍾，隱其常。五聲既調，然後作立五行，以正天時，五官以正人位。人與天調，然後天地之美生。</p><p><strong>所出</strong>：《管子 · 第41篇五行》 — https://zh.wikisource.org/wiki/管子/第41篇五行</p></article></main></div></div>
