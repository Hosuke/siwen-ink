    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 爾土宇昄章</nav></header><main><article><h1>爾土宇昄章</h1><p>疆域廣大，文德昭著。</p><p>爾土宇昄章，亦孔之厚矣。昄章，盛大之貌。言君子之土宇廣大，文物章采，盛大而深厚也。</p><p><strong>所出</strong>：《詩經 · 卷阿》 — https://zh.wikisource.org/wiki/詩經/卷阿</p></article></main></div></div>
