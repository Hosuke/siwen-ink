    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖人未始有天</nav></header><main><article><h1>聖人未始有天</h1><p>聖人離四句、遣百非，與世偕行而不替。</p><p>聖人未始有天，未始有人，未始有始，未始有物，與世偕行而不替，所行之備而不洫。其於物也，與之為娛矣；其於人也，樂物之通而保己焉；故或不言而飲人以和，與人並立而使人化。其生也美，其愛人也必有名焉，不告則不知，此聖人之所以樂物之通而保己也。</p><p><strong>所出</strong>：《莊子 · 則陽》 — https://zh.wikisource.org/wiki/莊子/則陽</p></article></main></div></div>
