    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 中行獨復</nav></header><main><article><h1>中行獨復</h1><p>履中行道，獨能復正，不隨眾失。</p><p>六四：中行獨復。</p><p>象曰：中行獨復，以從道也。</p><p>居四陰之中而獨能復者，履中行道，不隨流俗也。[[頻復]]者失而後復，四以柔正自守，不染於群陰之失，故曰「獨復」，所以從道也。</p><p><strong>所出</strong>：《周易 · 復》 — https://zh.wikisource.org/wiki/周易/復</p></article></main></div></div>
