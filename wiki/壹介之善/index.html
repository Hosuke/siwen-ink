    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 壹介之善</nav></header><main><article><h1>壹介之善</h1><p>桓公取人，不以其小惡忘其大美</p><p>寧越飯牛車下，擊角而疾商歌。桓公聞之，命後車載之。左右患其小惡，桓公曰：「不然。問之，患其有小惡也。以人之小惡而忘人之大美，此人主之所以失天下之士也。」[[天大]]之義。</p><p><strong>所出</strong>：《淮南子 · 道應訓》 — https://zh.wikisource.org/wiki/淮南子/道應訓</p></article></main></div></div>
