    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 篤厚君子</nav></header><main><article><h1>篤厚君子</h1><p>蒯成侯操心堅正，可謂篤厚君子。</p><p>蒯成侯周緤操心堅正，身不見疑，上欲有所之，未嘗不垂涕，此有傷心者然，可謂笃厚君子矣。</p><p><strong>所出</strong>：《史記 · 卷098》 — https://zh.wikisource.org/wiki/史記/卷098</p></article></main></div></div>
