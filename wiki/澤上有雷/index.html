    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 澤上有雷</nav></header><main><article><h1>澤上有雷</h1><p>歸妹之象，澤上而有雷鳴，陰陽相感之際，君子觀之以戒。</p><p>象傳曰：「澤上有雷，歸妹。」澤之為物，陰麗於陽；雷之為聲，動而感物。澤上有雷，陰陽相感而不已之象。君子觀之，修德以永終，鑒弊以自戒也。</p><p><strong>所出</strong>：《周易 · 歸妹》 — https://zh.wikisource.org/wiki/周易/歸妹</p></article></main></div></div>
