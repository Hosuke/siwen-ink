    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 君子貞而不諒</nav></header><main><article><h1>君子貞而不諒</h1><p>謂君子守大正，而不拘小信。</p><p>子曰：「君子貞而不諒。」</p><p>貞者，正而固也。諒者，小信之謂。君子守其大正，確乎不可拔，不屑於區區小信也。言有其操者，不以執一而廢大體。</p><p><strong>所出</strong>：《論語 · 衞靈公第十五》 — https://zh.wikisource.org/wiki/論語/衞靈公第十五</p></article></main></div></div>
