    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 得伯樂</nav></header><main><article><h1>得伯樂</h1><p>良馬盈廐不如一伯樂，識人貴於得人。</p><p>得十良馬，不若得一伯樂；得十良劍，不若得一歐冶；得地千里，不若得一聖人。舜得皋陶而舜受之，湯得伊尹而有夏民，文王得呂望而服殷商。夫得聖人，豈有里數哉？</p><p>嗚呼，馬之良者，人亦能辨之；唯伯樂之眼為不可及。歐冶之劍，匠亦能鑄之；唯賞鑒者之智為不可欺。是故千乘之國，得其人則霸王，失其人則危亡。 [[堯舜禹湯文武之道]]，未有不由斯者也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十四》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十四</p></article></main></div></div>
