    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不逆天理，不傷情性</nav></header><main><article><h1>不逆天理，不傷情性</h1><p>治道貴順人情、合天理，不可過察苛求。</p><p>不逆天理，不傷情性。不吹毛而求小疵，不洗垢而察難知；不引繩之外，不推繩之內；不急法之外，不緩法之內。</p><p>[[春夏耕耘秋冬收入|法貴自然，不可逆天而強民]]。過於苛察，則民無所措手足；過於寬弛，則姦宄肆行。唯循天理、順人情，執兩用中，乃得治道之宜。</p><p><strong>所出</strong>：《韓非子 · 大體》 — https://zh.wikisource.org/wiki/韓非子/大體</p></article></main></div></div>
