    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無恥者富多信者顯</nav></header><main><article><h1>無恥者富多信者顯</h1><p>世之所貴，不在德行，而在無恥與多言。</p><p>子張問於滿苟得曰：「盍不為行？無行則不信，不信則不任，不任則不利。故觀之名，計之利，而義真是也。若棄名利，反之於心，則夫士之為行，不可一日不為乎！」</p><p>滿苟得曰：「無恥者富，多信者顯。夫名利之大者，幾在無恥而信。故觀之名，計之利，而信真是也。」</p><p>滿苟得以無恥為富、多信為顯，正言世俗之所以貴者，不在德行，而在無恥與多言也。與 [[枉尺直尋]] 之喻相發。</p><p><strong>所出</strong>：《莊子 · 盜跖》 — https://zh.wikisource.org/wiki/莊子/盜跖</p></article></main></div></div>
