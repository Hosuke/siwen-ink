    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 〈大東〉七章，章八句</nav></header><main><article><h1>〈大東〉七章，章八句</h1><p>此詩之結構</p><p>〈大東〉七章，章八句。蓋《詩經》中篇幅較長之怨詩也。首章言道途之平而小人之悲；次章言杼柚之空；三章言獲薪之不可以浸；四章言東西人之苦樂不均；五章言星辰之有名無實；六章、七章極言星象之不可用，而以「西柄之揭」終篇之義。全詩以物象比興，寄諷刺於天象之中，怨而不怒，溫柔敦厚，蓋《小雅》怨詩之正體也。</p><p><strong>所出</strong>：《詩經 · 大東》 — https://zh.wikisource.org/wiki/詩經/大東</p></article></main></div></div>
