    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 此定壤之數非至數</nav></header><main><article><h1>此定壤之數非至數</h1><p>秦奢節儉之論，乃廣土大國之術，非小國危隘所宜用。</p><p>秦奢教桓公以帷蓋不脩、衣服不衆、俎豆之禮不致牲，宮室不飾，材木不散。管仲以為：「此定壤之數也。」蓋天子壤方千里，諸侯百里，負海子七十里，男五十里，體制有差，故準、徐、疾、贏各有定數。若狹隘之國欲與大國爭衡，非節儉外飾所能濟事也。</p><p><strong>所出</strong>：《管子 · 第71篇事語》 — https://zh.wikisource.org/wiki/管子/第71篇事語</p></article></main></div></div>
