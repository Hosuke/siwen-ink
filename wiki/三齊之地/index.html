    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三齊之地</nav></header><main><article><h1>三齊之地</h1><p>齊、膠東、濟北皆為田榮所並，故稱三齊。</p><p>項羽既滅秦，分封諸侯，以田都為齊王，治臨淄；田安為濟北王，治博陽；徙齊王田市王膠東，治即墨。田榮以負項梁不肯出兵助楚、趙，不得封王。榮自立為齊王，盡並三齊之地，兼有齊、膠東、濟北三方之地，故云「三齊」。</p><p><strong>所出</strong>：《史記 · 卷094》 — https://zh.wikisource.org/wiki/史記/卷094</p></article></main></div></div>
