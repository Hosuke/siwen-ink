    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大忠-之</nav></header><main><article><h1>大忠-之</h1><p></p><p>又《十過》篇以[[行小忠]]之事反襯大忠之義：楚共王與晉厲公戰於鄢陵，楚師敗。酣戰之時，司馬子反渴求飲，[[穀陽]]以酒進之。子反嗜酒，不能絕口，遂醉。戰罷，共王欲復戰，召子反。子反辭以心疾。共王親往，入其幄中，聞酒臭而還，曰：「司馬又醉，是亡楚國而不恤吾衆也。」遂還師，斬子反以徇。夫穀陽之進酒，非讎子反也，其心忠愛之而適足以殺之。是故小忠非忠，乃大忠之賊也。</p><p>  <strong>所出</strong>：《韓非子 · 十過》 — https://zh.wikisource.org/wiki/韓非子/十過</p></article></main></div></div>
