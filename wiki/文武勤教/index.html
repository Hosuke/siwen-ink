    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 文武勤教</nav></header><main><article><h1>文武勤教</h1><p>成王當兼修文德武功，勉力施教。</p><p>成王稱述周公之功，言其「旁作穆穆，御衡不迷文武勤教」。御衡者，持法度也；不迷者，無偏差也。成王望周公：文德以化民，武功以定亂，兩者交修，無或偏廢。兼之以勤，終之以教，則四方可一，王道可成。此成王之於周公，望之深而期之遠也。</p><p><strong>所出</strong>：《尚書 · 洛誥》 — https://zh.wikisource.org/wiki/尚書/洛誥</p></article></main></div></div>
