    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 爪發</nav></header><main><article><h1>爪發</h1><p>爪髮榮衛所不至，則是我本無害無痛，知喜怒非我作哀樂非我動，達此理者可以出生死之外。</p><p>爪髮者，我之形。何爪可割而無害，髮可截而無痛？蓋榮衛所不至也。則是我本無害而筋骨為之害，我本無痛而血肉為之痛。所以知喜怒非我作，哀樂非我動，我為形所昧，形為我所愛。達此理者，可以出生死之外。</p><p><strong>所出</strong>：《化書 · 卷一》 — https://zh.wikisource.org/wiki/化書/卷一</p></article></main></div></div>
