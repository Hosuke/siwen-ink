    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 起鴻乘風</nav></header><main><article><h1>起鴻乘風</h1><p>英雄豪傑得遇明主，功業之成若鴻雁乘風而起，游魚踏雲而升，蓋契合之速，不待歷試也。</p><p>抱朴子言：英雄俊傑一旦遭逢明主，其契合之速，若桑蔭未移而金蘭之盟已固；相知之審，不待歷試而情志已明。其勢飄飄然，若起鴻之乘勁風；翩翩然，若勝鱗之躡驚雲。言其相遇之速，成就之疾，有如是者。</p><p><strong>所出</strong>：《抱朴子 · 卷29》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷29</p></article></main></div></div>
