    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 孟姜孟弋孟庸</nav></header><main><article><h1>孟姜孟弋孟庸</h1><p>詩中所思之三美人，姓族殊異，蓋泛指世族之女以諷淫風。</p><p>《桑中》迭言「美孟姜」「美孟弋」「美孟庸」，-{zh-cn:（孟，姊妹行之首）}-。三姓各異：姜出於齊，弋出於姒姓之國，庸亦古姓也。詩人-{zh-cn:（自稱）}-思慕此三姓之女，輪迭言之，以見衞之世族互相竊妻、無別姓氏之實，正所以刺其淫亂也。</p><p><strong>所出</strong>：《詩經 · 桑中》 — https://zh.wikisource.org/wiki/詩經/桑中</p></article></main></div></div>
