    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 典祀無豐于昵</nav></header><main><article><h1>典祀無豐于昵</h1><p>祭祀有常，不可偏厚近親。</p><p>祀典各有定式，不可豐厚於近昵之親。昵者，近也。祭祀之道，在均而在廣，若[[黷于祭祀時謂弗欽]]，厚於私親而薄於遠祖，是悖天心而忘大義也。祖己戒王勿以私情害祭祀之公典，正欲其敬慎威儀、動合規矩。</p><p><strong>所出</strong>：《尚書 · 高宗肜日》 — https://zh.wikisource.org/wiki/尚書/高宗肜日</p></article></main></div></div>
