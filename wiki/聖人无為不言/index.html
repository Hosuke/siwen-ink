    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖人无為不言</nav></header><main><article><h1>聖人无為不言</h1><p>聖人行无為之政，行不言之教，任萬物自然。</p><p>是以聖人居无為之事，行不言之教。聖人之所以為治者，无為而已；所以為教者，不言而已。无為者，因萬物之自然而無所作為；不言者，順百姓之自化而不煩號令。萬物作焉、百姓化焉，而聖人無所用其智，是為无為之治、不言之教也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第四十六章 觀徼》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
