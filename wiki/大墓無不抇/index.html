    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大墓無不抇</nav></header><main><article><h1>大墓無不抇</h1><p>世俗爭為大墓，不知未有不亡之國，故大墓無不抇。</p><p>以耳目所聞見，齊、荊、燕嘗亡矣，宋、中山已亡矣，趙、魏、韓皆亡矣，其皆故國矣。自此以上者亡國不可勝數，是故大墓無不抇也。而世皆爭為之，豈不悲哉？</p><p><strong>所出</strong>：《呂氏春秋 · 卷十》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十</p></article></main></div></div>
