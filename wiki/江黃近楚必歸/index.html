    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 江黃近楚必歸</nav></header><main><article><h1>江黃近楚必歸</h1><p>管仲遺命：江黃之國近於楚，為臣死則必歸之，否則生亂。</p><p>夫江、黃之國近於楚，為臣死乎，君必歸之楚而寄之。君不歸楚，必私之，私之而不救也則不可，救之則亂自此始矣。</p><p><strong>所出</strong>：《管子 · 第26篇戒》 — https://zh.wikisource.org/wiki/管子/第26篇戒</p></article></main></div></div>
