    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天財所出</nav></header><main><article><h1>天財所出</h1><p>天生之材貨，源於地中。</p><p>桓公問管子以天財所出、地利所在。管子對曰：「山上有赭者其下有鐵，上有鈆者其下有銀。」天財者，非人力所能為，乃天地所生之物也。山川之藏，歲月所積，是之謂天財。善治國者，因其自然，以為國用。</p><p><strong>所出</strong>：《管子 · 第77篇地數》 — https://zh.wikisource.org/wiki/管子/第77篇地數</p></article></main></div></div>
