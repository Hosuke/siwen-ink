    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 觀色知意</nav></header><main><article><h1>觀色知意</h1><p>察人之容色、舉止，可知其心之所存。</p><p>東郭郵言伐莒之故曰：「欣然喜樂者，鍾鼓之色；淵然清靜者，縗絰之色；漻然豐滿而手足拇動者，兵甲之色。」口開不闔，是言莒也；舉手而指，勢當莒也。以微射明，此之謂也。</p><p><strong>所出</strong>：《管子 · 第51篇小問》 — https://zh.wikisource.org/wiki/管子/第51篇小問</p></article></main></div></div>
