    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 弗告</nav></header><main><article><h1>弗告</h1><p>不語、不傳之謂也。</p><p>「弗告」者，不語也，不傳也。[[永矢弗告]]言誓不以此事告人。[[考磐]]末章用此義。弗告者，隱之至也；既不忘，又不失，復不宣之於口，三戒具而志節完。</p><p><strong>所出</strong>：《詩經 · 考磐》 — https://zh.wikisource.org/wiki/詩經/考磐</p></article></main></div></div>
