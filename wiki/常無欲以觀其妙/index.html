    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 常無欲以觀其妙</nav></header><main><article><h1>常無欲以觀其妙</h1><p>心無欲則能觀道之精微。</p><p>故常無欲，以觀其妙；常有欲，以觀其徼。</p><p>無欲者，心澄如鏡，萬累都忘，而道之妙不言自呈。妙者，微而不可象者也，萬物之所以然、造化之精意存焉。及乎心動於欲，則智識不及於精微，而但見其徼。徼者，外之邊際也，事物之粗迹也。同一道也，而無欲者窺其內，有欲者視其外；心清者觀妙，心濁者觀徼，其效之所以異者，不在道之有增減，在心之清濁也。是故修德之首，在乎寡欲；觀妙之要，在乎無欲。</p><p><strong>所出</strong>：《道德經 (王弼本) · 一章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
