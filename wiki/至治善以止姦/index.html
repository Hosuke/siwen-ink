    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 至治善以止姦</nav></header><main><article><h1>至治善以止姦</h1><p>至治之國，以止姦為務；止姦之要，在使民相闚。</p><p>至治之國，善以止姦為務。然則去微姦之道奈何？其務令之相規其情者也。則使相闚奈何？曰：蓋理相坐而已。禁尚有連於己者，理不得不相闚，惟恐不得免。有姦心者不令得忘，闚者多也。</p><p>至治之要，在杜絕微姦。欲止姦邪，當使民相監視。監視之法，在於連坐。彼此有連帶之責，則民不得不相窺而防範。姦者無所匿其心，善者因而免於罪，如此則姦類無由發，細微之惡無所遁形矣。</p><p><strong>所出</strong>：《韓非子 · 制分》 — https://zh.wikisource.org/wiki/韓非子/制分</p></article></main></div></div>
