    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 胞胎大結</nav></header><main><article><h1>胞胎大結</h1><p>胞胎大結者，生死之根，七神守之則開解，誦者當存神以正之。</p><p>胞胎大結，生死之根也。</p><p>經云：「七神常守兆本命之根胞胎大結，常令胞囊玉明，胎結開清。」又云：「使我仰充上入太無庭，解結散禍積，披脫七祖靈，反胎會南宮。」蓋胞胎之結乃生死之機，七神守之則結開，七祖反胎，兆命長生。</p><p>解之之法，在於誦洞經金音，存想蓮華神雲，口吸咽津，呼七神名字以鎮之。</p><p><strong>所出</strong>：《上清大洞真經 · 35章》 — https://zh.wikisource.org/wiki/上清大洞真經/35章</p></article></main></div></div>
