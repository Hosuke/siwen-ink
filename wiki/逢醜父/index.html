    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 逢醜父</nav></header><main><article><h1>逢醜父</h1><p>逢醜父在齐晋之战中与頃公互换位置，助頃公脱险，彰显其忠义之心。</p><p>逢醜父為齊頃公右，與晉戰，車絓於木，醜父與頃公易位，使頃公脫去。此逢醜父之忠也。</p><p>  <strong>所出</strong>：《史記 · 卷032》 — https://zh.wikisource.org/wiki/史記/卷032</p></article></main></div></div>
