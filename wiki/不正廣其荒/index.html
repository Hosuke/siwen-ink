    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不正廣其荒</nav></header><main><article><h1>不正廣其荒</h1><p>君失義正而倚名譽，臣不忠而趨爵祿，亂俗數世，威盡乃亡。</p><p>夫為君上者既失其義正，而倚以為名譽，為臣者不忠而邪，以趨爵祿，亂俗數世，以偷安懷樂，雖廣其威可須也。故曰：「不正廣其荒。」是以古之人阻其路，塞其遂，守而物修。故著之簡筴，傳以告後世人曰：「其為怨也深，是以威盡焉。」</p><p><strong>所出</strong>：《管子 · 第11篇宙合》 — https://zh.wikisource.org/wiki/管子/第11篇宙合</p></article></main></div></div>
