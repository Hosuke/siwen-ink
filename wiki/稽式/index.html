    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 稽式</nav></header><main><article><h1>稽式</h1><p>治國之常法，反智則福從之。</p><p>知此兩者亦稽式。常知稽式，是謂[[玄德]]。稽式者，治國之[[楷式]]也。一曰以智，一曰不以智；一為賊，一為福。[[玄德]]者，常知此式而不失者也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 六十五章》 — https://zh.wikisource.org/wiki/道德經 (王弭本)</p></article></main></div></div>
