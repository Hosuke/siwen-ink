    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五慮</nav></header><main><article><h1>五慮</h1><p>順天、阜財、懌眾、利地、右兵，軍國之五要務。</p><p>凡戰有五慮：順天，阜財，懌眾，利地，右兵。</p><p>順天者奉時，阜財者因敵，懌眾者勉若，利地者守隘險阻，右兵者弓矢以禦，殳矛以守，戈戟以助。五兵迭用，長以衛短，短以救長，迭戰則久，皆戰則強。</p><p>又見物與儷，是謂兩之。見敵之形，則以相似之物應之，此將帥之要也。</p><p><strong>所出</strong>：《司馬法》 — https://zh.wikisource.org/wiki/司馬法</p></article></main></div></div>
