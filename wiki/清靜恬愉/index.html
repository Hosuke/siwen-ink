    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 清靜恬愉</nav></header><main><article><h1>清靜恬愉</h1><p>人性本乎自然，事務準乎法度。</p><p>清淨恬愉，人之性也；儀表規矩，事之制也。知人之性，其自養不勃；知事之制，其舉錯不惑。</p><p>發一端，散無竟，周八極，總一筦，謂之心。見本而知末，觀指而睹歸，執一而應萬，握要而治詳，謂之術。居智所為，行智所之，事智所秉，動智所由，謂之道。</p><p>道者，置之前而不𨎌，錯之後而不軒，內之尋常而不塞，布之天下而不窕。是故使人高賢稱譽己者，心之力也；使人卑下誹謗己者，心之罪也。</p><p><strong>所出</strong>：《淮南子 · 人間訓》 — https://zh.wikisource.org/wiki/淮南子/人間訓</p></article></main></div></div>
