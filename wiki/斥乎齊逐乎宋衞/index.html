    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 斥乎齊逐乎宋衞</nav></header><main><article><h1>斥乎齊逐乎宋衞</h1><p>孔子離魯後在齊、宋、衞受排擠。</p><p>已而去魯，斥乎齊，逐乎宋、衞，困於陳蔡之間。孔子周遊列國，屢遭困厄，卒能反魯而成聖功。</p><p><strong>所出</strong>：《史記 · 卷047》 — https://zh.wikisource.org/wiki/史記/卷047</p></article></main></div></div>
