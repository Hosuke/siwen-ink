    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 陽虎將爲趙武之賢</nav></header><main><article><h1>陽虎將爲趙武之賢</h1><p>枳棘非所以教國</p><p>陽虎將爲趙武之賢、解狐之公，而簡主以爲枳棘，非所以教國也。</p><p>陽虎欲效[[趙武]]之賢、[[解狐]]之公，而簡主以爲枳棘不可以教國。蓋人才有善惡，不可不察[[樹橘柚者食之則甘]]之喻也。</p><p><strong>所出</strong>：《韓非子 · 外儲說左下》 — https://zh.wikisource.org/wiki/韓非子/外儲說左下
