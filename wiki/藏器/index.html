    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 藏器于旁加见</nav></header><main><article><h1>藏器于旁加见</h1><p>窆畢，藏明器于壙旁。</p><p>乃窆。主人哭，踊無算。襲，贈用制幣，玄纁束，拜稽顙，踊如初。卒，袒，拜賓。藏器于旁，加見。藏苞筲于旁。加折，卻之。加抗席，覆之。加抗木。實土三。</p><p><strong>所出</strong>：《儀禮 · 既夕禮》 — https://zh.wikisource.org/wiki/儀禮/既夕禮</p></article></main></div></div>
