    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 善敷善刪</nav></header><main><article><h1>善敷善刪</h1><p>善敷者辭殊而意顯，善刪者字去而意留，二者皆才思之善用也</p><p><strong>文</strong></p><p>故三準既定，次討字句。句有可削，足見其疎；字不得減，乃知其密。精論要語，極略之體；游心竄句，極繁之體；謂繁與略，適分所好。引而伸之，則兩句敷為一章；約以貫之，則一章刪成兩句。思贍者善敷，才覈者善刪。善刪者字去而意留，善敷者辭殊而顯。字刪而意闕，則短乏而非覈；辭敷而言重，則蕪穢而非贍。</p><p><strong>所出</strong>：《文心雕龍 · 鎔裁》 — https://zh.wikisource.org/wiki/文心雕龍/鎔裁</p></article></main></div></div>
