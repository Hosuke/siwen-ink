    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 金返歸其母</nav></header><main><article><h1>金返歸其母</h1><p>金稟月精而生，月晦則返，終始不失；以喻五金返本還原之道。</p><p>五金之所以能通幽明之變者，以其能返本也。</p><p>五金入于猛火，精光不奪；皆稟月精，朔旦受符，月晦相包，循環不息。返本則復其故性，精華內含；失其本則精散光滅，鼎乃寂然。</p><p>余觀《參同契》此章，合數象而言五金，以明返本之學也。金本從月生，月晦則隱，月盈則顯，循晦朔而終始不失。金返其本，鼎乃光耀，威光熺然。非徒五金之瑞，實大道之驗爾。</p><p>是故五金之學，在返其本始而已。</p><p><strong>所出</strong>：《周易參同契 · 10章》 — https://zh.wikisource.org/wiki/周易參同契/10章</p></article></main></div></div>
