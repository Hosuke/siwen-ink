    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 同類相感</nav></header><main><article><h1>同類相感</h1><p>同聲相應，同氣相求；情偽相感，遠近相追，愛惡相攻，屈伸相推。</p><p>同聲相應，高下不必均；同氣相求，體質不必齊。情偽相感，遠近相追，愛惡相攻，屈伸相推。見情者直往，見彼之情往必得志。屯之六四求婚媾往吉无不利，即此例也。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷10》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷10</p></article></main></div></div>
