    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 制詔御史令諸侯推恩分子弟</nav></header><main><article><h1>制詔御史令諸侯推恩分子弟</h1><p>天子令諸侯王推私恩於子弟，各條上名號。</p><p>制詔御史：「諸侯王或欲推私恩分子弟邑者，令各條上，朕且臨定其號名。」</p><p>此元朔二年天子之詔也。時諸侯王得推恩於子弟，分土列侯，而天子親定其號名。恩出於上，權歸於君，諸侯王不得擅為也。</p><p><strong>所出</strong>：《史記 · 卷021》 — https://zh.wikisource.org/wiki/史記/卷021</p><hr><p>孝景二年，立皇子德為河間王，餘為淮陽王，彭祖為廣川王，發為長沙王。</p><p>  <strong>所出</strong>：《史記 · 卷022》 — https://zh.wikisource.org/wiki/史記/卷022</p></article></main></div></div>
