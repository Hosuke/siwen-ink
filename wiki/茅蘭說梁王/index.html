    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 茅蘭說梁王</nav></header><main><article><h1>茅蘭說梁王</h1><p>使臣說梁王微行入關，匿於長公主園。</p><p>上怒稍解，因上書請朝。既至關，茅蘭說王，使乘布車，從兩騎入，匿於長公主園。漢使使迎王，王已入關，車騎盡居外，不知王處。太后泣曰：「帝殺吾子！」景帝憂恐。</p><p>於是梁王伏斧質於闕下，謝罪，然後太后、景帝大喜，相泣，復如故。悉召王從官入關。然景帝益疏王，不同車輦矣。</p><p><strong>所出</strong>：《史記 · 卷058》 — https://zh.wikisource.org/wiki/史記/卷058</p></article></main></div></div>
