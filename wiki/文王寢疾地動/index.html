    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 文王寢疾地動</nav></header><main><article><h1>文王寢疾地動</h1><p>文王遇地動不改行修善，疾乃止而殃妖除。</p><p>周文王立國八年，歲六月，寢疾五日而地動，東西南北不出國郊。百吏皆請移之，文王曰不可。夫天之見妖也，以罰有罪也；我必有罪，故天以此罰我也。今又興事動眾以增國城，是重吾罪也，不可。</p><p>乃謹其禮秩皮革，以交諸侯；飭其辭令幣帛，以禮豪士；頒其爵列等級田疇，以賞有功。疾乃止。文王即位八年而地動，後四十三年，凡立國五十一年而終。此文王之所以止殃剪妖也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷六》 — https://zh.wikisource.org/wiki/呂氏春秋/卷六</p></article></main></div></div>
