    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 主因</nav></header><main><article><h1>主因</h1><p>因其自然則事半功倍</p><p>人主因其所以來，因而予之，則不勞矣。聖人因之，故能掌之。因之修理，故能長久。夫[[因其能者言所用]]，則上下相安；心不為九竅，九竅治；君不為五官，五官治。為善者予之賞，為非者予之罰，皆因其自然而賞罰之，不必用力也。</p><p><strong>所出</strong>：《管子 · 第55篇九守》 — https://zh.wikisource.org/wiki/管子/第55篇九守</p></article></main></div></div>
