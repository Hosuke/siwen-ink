    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 衆穉且狂</nav></header><main><article><h1>衆穉且狂</h1><p>衆人昧於大義，反以賢者為非。</p><p>「許人尤之，衆穉且狂」，詩人自言也。</p><p>許穆夫人欲歸唁兄、控告大邦以救宗國，而許國大夫非之，以為不可。詩人刺之曰：爾等之見，昧於大義，是非不分，但知責人而不知大體，此所謂「穉且狂」也。穉者，幼稚不明；狂者，狂妄自是。</p><p>後世以「衆穉且狂」譏人不知大義、妄加指責賢者。</p><p><strong>所出</strong>：《詩經 · 載馳》 — https://zh.wikisource.org/wiki/詩經/載馳</p></article></main></div></div>
