    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 道常無為而無不為</nav></header><main><article><h1>道常無為而無不為</h1><p>道以無為化育萬物，侯王守之天下自正。</p><p>道之為物，常無為也，而萬物無不為焉。侯王若能守此無為之道，萬物將自化於下，不待有為也。</p><p>無為之治，非束手不事事也。蓋道運陰陽，化生萬物，功成而不宰，物遂其性，是無為而無不為也。侯王體此道以御宇內，百姓自正，百僚自肅，無智名無勇功，巍巍蕩蕩，民無能名焉。</p><p><strong>所出</strong>：《老子河上公章句 · 為政》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
