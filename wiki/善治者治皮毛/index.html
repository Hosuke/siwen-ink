    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 善治者治皮毛</nav></header><main><article><h1>善治者治皮毛</h1><p>治病當及其淺，淺者易治，深者難圖。</p><p>語出 [[陰陽應象大論]]。歧伯云：「故邪風之至，疾如風雨，故善治者治皮毛，其次治肌膚，其次治筋脈，其次治六府，其次治五藏。治五藏者，半死半生也。」</p><p>言外邪中人，傳變甚速，故良醫乘其尚淺而先治之。若待邪入五藏，則生死參半，不可不慎。亦見聖人治未病之意。</p><p><strong>所出</strong>：《黃帝內經 · 素問第二卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第二卷</p></article></main></div></div>
