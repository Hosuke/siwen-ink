    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 爵罔及惡德惟其賢</nav></header><main><article><h1>爵罔及惡德惟其賢</h1><p>爵賞惟賢，惡德不與。</p><p>官不及私昵，惟其能；爵罔及惡德，惟其賢。授官以能，賞爵以賢，則賢能得位，治道成矣。</p><p><strong>所出</strong>：《尚書 · 說命中》 — https://zh.wikisource.org/wiki/尚書/說命中</p></article></main></div></div>
