    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 獨行踽踽</nav></header><main><article><h1>獨行踽踽</h1><p>孤特無偶之貌，以興行人無依之歎。</p><p>「獨行踽踽」者，孤特無偶之貌也。出自《詩經·杕杜》之首章。言行人獨行，踽踽而無所親附。興己之孤特無依，無兄弟以相援助也。</p><p>「睘睘」義同，亦見《杕杜》次章，狀獨行之況。</p><p><strong>所出</strong>：《詩經 · 杕杜》 — https://zh.wikisource.org/wiki/詩經/杕杜</p></article></main></div></div>
