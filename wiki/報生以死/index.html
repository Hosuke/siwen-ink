    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 報生以死</nav></header><main><article><h1>報生以死</h1><p>臣報君之恩，當以死殉之，乃人臣之道。</p><p>欒共子曰：「報生以死，報賜以力，人之道也。」言君生之、養之、教之，臣當以死報之；君之賞賜，則以力報之。此人臣之正道也。</p><p><strong>所出</strong>：《國語 · 卷07》 — https://zh.wikisource.org/wiki/國語/卷07</p></article></main></div></div>
