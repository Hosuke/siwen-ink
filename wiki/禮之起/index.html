    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 禮之起</nav></header><main><article><h1>禮之起</h1><p>人有欲而生爭，先王制禮義以分之，使欲與物相持而長。</p><p>人生而有欲，欲而不得，則不能無求。求而無度量分界，則不能不爭；爭則亂，亂則窮。先王惡其亂也，故制禮義以分之，以養人之欲，給人之求。使欲必不窮於物，物必不屈於欲。兩者相持而長，是禮之所起也。</p><p>故禮者養也。芻豢稻梁，五味調香，所以養口也；椒蘭芬苾，所以養鼻也；雕琢刻鏤，黼黻文章，所以養目也；鐘鼓管磬，琴瑟竽笙，所以養耳也；疏房檖貌，越席床笫几筵，所以養體也。</p><p><strong>所出</strong>：《荀子 · 禮論篇》 — https://zh.wikisource.org/wiki/荀子/禮論篇</p></article></main></div></div>
