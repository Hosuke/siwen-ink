    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 四公子</nav></header><main><article><h1>四公子</h1><p>戰國四君皆下士喜客，威名著於天下。</p><p>當是時，魏有信陵君，楚有春申君，趙有平原君，齊有孟嘗君，皆下士喜賓客以相傾。呂不韋以秦之彊，羞不如，亦招致士。</p><p>四公子者，信陵君魏無忌、春申君黃歇、平原君趙勝、孟嘗君田文是也。皆以宗室之貴，傾身下士，門客三千，一時稱盛。不韋挾秦之強，欲抗衡四君而羞居其下，其志則大矣，其術則末也。</p><p><strong>所出</strong>：《史記 · 卷085》 — https://zh.wikisource.org/wiki/史記/卷085</p></article></main></div></div>
