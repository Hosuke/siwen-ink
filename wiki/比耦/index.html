    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 比耦</nav></header><main><article><h1>比耦</h1><p>配合射者為耦也。</p><p>司射不釋弓矢，遂以比三耦於堂西。司射命上射曰「某御於子」，命下射曰「子與某子射」。大夫若有遵者，則入門左，主人降，賔及衆賔皆降，主人揖讓，以大夫升；大夫及衆賔皆升，就席。若大夫之耦不勝，則亦執弛弓，特升飲。司射比衆耦辯，乃命三耦拾取矢。</p><p><strong>所出</strong>：《儀禮 · 鄉射禮》 — https://zh.wikisource.org/wiki/儀禮/鄉射禮</p></article></main></div></div>
