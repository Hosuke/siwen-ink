    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 安高在乎同利</nav></header><main><article><h1>安高在乎同利</h1><p>與天下同利者，乃可長安高位。</p><p>凡人者，莫不欲利而惡害。是故與天下同利者，天下持之；擅天下之利者，天下謀之。天下所謀，雖立必隳。天下所持，雖高不危。故曰：「安高在乎同利。」</p><p><strong>所出</strong>：《管子 · 第66篇版法解》 — https://zh.wikisource.org/wiki/管子/第66篇版法解</p></article></main></div></div>
