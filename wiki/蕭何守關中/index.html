    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蕭何守關中</nav></header><main><article><h1>蕭何守關中</h1><p>漢王出關，蕭何留守關中，撫百姓，給軍食，事有成法。</p><p>漢二年，漢王與諸侯擊楚，蕭何守關中，侍太子，治櫟陽。為法令約束，立宗廟社稷宮室縣邑，輒奏上，可，許以從事；即不及奏上，輒以便宜施行，上來以聞。關中事計戶口轉漕給軍，漢王數失軍遁去，何常興關中卒，輒補缺。上以此專屬任何關中事。夫漢與楚相距滎陽，軍無見糧，蕭何轉漕關中，給食不乏。鄂君贊之曰：「蕭何常全關中以待陛下，此萬世之功也。」</p><p><strong>所出</strong>：《史記 · 卷053》 — https://zh.wikisource.org/wiki/史記/卷053</p></article></main></div></div>
