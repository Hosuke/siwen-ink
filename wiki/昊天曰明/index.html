    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 昊天曰明</nav></header><main><article><h1>昊天曰明</h1><p>天之照臨，無時不然，人當與之出入游衍</p><p>詩云「昊天曰明，及爾出王。昊天曰旦，及爾游衍」，言天之明，無時不照；天之旦，無時不臨。人君當與天合德，出入游衍，皆在天照臨之下。</p><p>此[[明並懸象]]之義，[[天行有常]]之旨也。[[敬天之怒]]而後可配[[昊天曰明]]，敬則明，怠則幽，明幽之分，治亂之判也。</p><p><strong>所出</strong>：《詩經 · 板》 — https://zh.wikisource.org/wiki/詩經/板</p></article></main></div></div>
