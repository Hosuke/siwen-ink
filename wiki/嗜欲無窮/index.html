    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 嗜欲無窮</nav></header><main><article><h1>嗜欲無窮</h1><p>嗜欲無度則失天，冰炭相賊，禍亂從生。</p><p>人之嗜欲無窮，則必有貪鄙悖亂之心，淫佚姦詐之事矣。強者劫弱，眾者暴寡，勇者凌怯，壯者慠幼，從此生矣。夫樂之有情，譬之若肌膚形體之有情性也，有情性則必有性養矣。能以久處其適，則生長矣。生也者，其身固靜，或而後知，或使之也。遂而不返，制乎嗜欲，制乎嗜欲無窮則必失其天矣。</p><p><strong>所出</strong>：《呂氏春秋 · 卷五》 — https://zh.wikisource.org/wiki/呂氏春秋/卷五</p></article></main></div></div>
