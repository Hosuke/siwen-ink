    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 道不盈</nav></header><main><article><h1>道不盈</h1><p>道體虛空，用之不竭。</p><p>道沖而用之，
或不盈，
淵乎似萬物之宗。</p><p>道以虛空為體，沖然而未嘗滿也。萬物資之而生，莫見其盈竭。譬如巨器，挹之不竭，終古如斯。是故聖人法之，抱虛以守，處卑以成大用焉。</p><p><strong>所出</strong>：《老子河上公章句 · 無源》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
