    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 心齋</nav></header><main><article><h1>心齋</h1><p>虛心以接萬物，乃養生之要法</p><p>顏回問仲尼心齋之道。仲尼曰：「若一志，无聽之以耳而聽之以心，无聽之以心而聽之以氣。聽止於耳，心止於符。氣也者，虛而待物者也。唯道集虛。虛者，心齋也。」</p><p>顏回未得使，實自有回；得使之，未始有回，可謂虛乎？仲尼曰：「盡矣。」</p><p><strong>所出</strong>：《莊子 · 人間世》 — https://zh.wikisource.org/wiki/莊子/人間世</p></article></main></div></div>
