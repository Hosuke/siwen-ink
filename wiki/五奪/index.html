    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五奪</nav></header><main><article><h1>五奪</h1><p>形肉奪、血奪、汗奪、泄奪、產後血奪，此五者皆不可瀉。</p><p>形肉已奪，是一奪也。大奪血之後，是二奪也。大汗出之後，是三奪也。大泄之後，是四奪也。新產及大血，是五奪也，此皆不可寫。</p><p><strong>所出</strong>：《黃帝內經 · 靈樞第九卷》 — https://zh.wikisource.org/wiki/黃帝內經/靈樞第九卷</p></article></main></div></div>
