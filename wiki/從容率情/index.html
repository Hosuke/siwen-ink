    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 從容率情</nav></header><main><article><h1>從容率情</h1><p>為文宜從容不迫，循情自然，不可勉强驅使。</p><p>學業在勤，然為文之道，貴在從容率情、優柔適會。蓋文發於心，心有不暢，強為之則乖。是以志於文者，當舒寫其鬱滯，如其所固有，不以刻厲相迫。若銷鑠精膽，蹙迫和氣，秉牘以驅齡，灑翰以伐性，非聖賢素心，亦非會文之直理。此劉勰所以明為文與治學異，不可一概以勤苦繩之也。</p><p><strong>所出</strong>：《文心雕龍 · 養氣》 — https://zh.wikisource.org/wiki/文心雕龍/養氣</p></article></main></div></div>
