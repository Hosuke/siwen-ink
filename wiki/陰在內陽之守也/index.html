    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 陰在內，陽之守也；陽在外，陰之使也</nav></header><main><article><h1>陰在內，陽之守也；陽在外，陰之使也</h1><p>陰為陽之守，陽為陰之使，陰陽相須，不可離也。</p><p>語出 [[陰陽應象大論]]。歧伯云：「陰在內，陽之守也；陽在外，陰之使也。」</p><p>此言陰陽相須之理。陰居於內，主靜而為陽之根本；陽行於外，主動而為陰之運用。陰守乎陽，則陽有所根而不散；陽運乎陰，則陰有所使而不凝。猶君臣之相須，缺一不可。治病者當知此理，使陰平陽秘，精神乃治。</p><p><strong>所出</strong>：《黃帝內經 · 素問第二卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第二卷</p></article></main></div></div>
