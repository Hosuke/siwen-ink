    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 中正而應</nav></header><main><article><h1>中正而應</h1><p>居中得正，上下一心</p><p>「中正而應」者，[[同人]][[彖傳]]所言六二、九五之德也。</p><p>六二柔中得位，履正應乎乾之九五；九五剛中履正，下應乎六二。二五相應，如君臣相得，如日月相臨，天地感通，無有窒礙，故天下之志可通。</p><p>[[易]]以中正為貴，中則無過不及，正則無偏無倚，二者兼備而相應，乃成和同之功。[[禮記]]云「[[樂與天地同和]]」，亦此意也。</p><p><strong>所出</strong>：《周易 · 同人》 — https://zh.wikisource.org/wiki/周易/同人</p></article></main></div></div>
