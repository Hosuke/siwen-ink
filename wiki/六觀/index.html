    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 六觀</nav></header><main><article><h1>六觀</h1><p>評文之六法：位體、置辭、通變、奇正、事義、宮商。</p><p>是以將閱文情，先標六觀：一觀位體，二觀置辭，三觀通變，四觀奇正，五觀事義，六觀宮商。斯術既形，則優劣見矣。</p><p>[[操千曲而後曉聲]]以博觀為基，六觀以客觀為準。[[知多偏好]]者各執一隅，而六觀立客觀之則，使高下之分有可循焉。</p><p><strong>所出</strong>：《文心雕龍 · 知音》 — https://zh.wikisource.org/wiki/文心雕龍/知音</p></article></main></div></div>
