    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 利出一空</nav></header><main><article><h1>利出一空</h1><p>賞罰之利出於一途，則國無敵；出於多門，則兵散民散。</p><p>韓非論治國之道，以「利出一空」為要。云「利出一空者，其國無敵；利出二空者，其兵半用；利出十空者，民不守」。利者，賞罰之所出也；空者，塗轍之義也。賞罰之柄歸於一塗，則民知所向，無所觀望；賞罰之柄分於多門，則姦者得隙，勇者懈志。是以明主之治，必專賞罰於上，使天下之民唯上之所令是從，然後可以無敵於天下。</p><p><strong>所出</strong>：《韓非子 · 飭令》 — https://zh.wikisource.org/wiki/韓非子/飭令</p></article></main></div></div>
