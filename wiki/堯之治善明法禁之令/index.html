    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 堯之治，善明法禁之令</nav></header><main><article><h1>堯之治，善明法禁之令</h1><p>堯治天下，以明確法令為要。</p><p>昔者堯之治天下也，猶埴已埏也，唯陶之所以為；猶金之在鑪，恣冶之所以鑄。其民引之而來，推之而往，使之而成，禁之而止。故堯之治也，善明法禁之令而已矣。</p><p><strong>所出</strong>：《管子 · 第45篇任法》 — https://zh.wikisource.org/wiki/管子/第45篇任法</p></article></main></div></div>
