    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 為天下谿</nav></header><main><article><h1>為天下谿</h1><p>聖人處下若谷，天下歸德。</p><p><strong>題</strong>：為天下谿</p><p><strong>要</strong>：聖人守雌退讓，天下歸之如水趨壑。</p><p><strong>文</strong>：《老子河上公章句》以「谿」喻聖人之德。夫深谿居下，眾流歸之；聖人卑以自牧，功成不居，是以天下皆歸往而無所牴牾也。
:雄以喻尊，雌以喻卑。人雖自知其尊顯，當復守之以卑微，去雄之強梁，就雌之柔和，如是則天下歸之，如水流入深谿也。
:人能謙下如深谿，則德常在，不復離於己。</p><p><strong>所出</strong>：《老子河上公章句 · 反朴》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
