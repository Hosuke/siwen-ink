    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 梟鳥必匿其形</nav></header><main><article><h1>梟鳥必匿其形</h1><p>伐敵當匿其形，以待時而動。</p><p>越大夫逢同諫句踐曰：「鷙鳥之撃也，必匿其形。」言兵事之妙，在乎隱藏形跡，使敵不備，而後一舉覆之。逢同又言：「今夫吳兵加齊、晉，怨深於楚、越，名高天下，實害周室，德少而功多，必淫自矜。」吳既驕而輕戰，乃可聯齊、楚、晉三國以伐之，越承其弊而收功。此「匿形待時」之說也。</p><p><strong>所出</strong>：《史記 · 卷041》 — https://zh.wikisource.org/wiki/史記/卷041</p></article></main></div></div>
