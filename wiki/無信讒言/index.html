    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無信讒言</nav></header><main><article><h1>無信讒言</h1><p>戒聽言者勿信讒言，當審其實。</p><p>「無信讒言」，《青蠅》首章之戒也。</p><p>[[豈弟君子|君子]]之所以異於常人者，以其聽言而能察也。讒言之所以行者，以聽者信之也。詩云「無信讒言」，是誡聽者，非止責言之者也。讒言之入人也驟，及其信之而後，其害始成。使聽者先以審之，不輕信焉，則讒人無所施其巧矣。此[[詩有六義|雅詩]]之善誨也。</p><p><strong>所出</strong>：《詩經 · 青蠅》 — https://zh.wikisource.org/wiki/詩經/青蠅</p></article></main></div></div>
