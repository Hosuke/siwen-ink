    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 言端責實</nav></header><main><article><h1>言端責實</h1><p>人主令臣下言必知其端由，責其實效。</p><p>人主使人臣言者必知其端以責其實，不言者必問其取舍以爲之責，則人臣莫敢妄言矣，又不敢默然矣，言、默則皆有責也。</p><p><strong>所出</strong>：《韓非子 · 南面》 — https://zh.wikisource.org/wiki/韓非子/南面</p></article></main></div></div>
