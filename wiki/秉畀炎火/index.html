    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 秉畀炎火</nav></header><main><article><h1>秉畀炎火</h1><p>付以烈焰，焚蟲以除害</p><p>秉畀炎火，言以火焚蟲也。秉，持也。畀，付也。言田祖持付蟲害於炎火以焚之，此祈禳之事，詩人因以為農歌。</p><p><strong>所出</strong>：《詩經 · 大田》 — https://zh.wikisource.org/wiki/詩經/大田</p></article></main></div></div>
