    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 法物滋彰</nav></header><main><article><h1>法物滋彰</h1><p>法令物用日盛，盜賊隨之。</p><p>老子云「法物滋彰而盜賊多有」，法物者，法令與器用也。彰者，盛行之謂。法令逾繁，則民趨巧偽，物用逾奢，則盜心日熾，賊乃多有。與[[盜賊多有]]相承，言有為之弊至此而極。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第二十章 治邦》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
