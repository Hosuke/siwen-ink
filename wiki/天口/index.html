    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天口</nav></header><main><article><h1>天口</h1><p>聖為天口，代天立言。</p><p>洞玄真人臣張三丰自言：「聖為天口。」言己非聖，安能代天立言，特以維皇上帝，發瞶振聾，勸善規過，故作《天口》之篇。凡若干篇，以報碧翁崇褒之意云爾。</p><p><strong>所出</strong>：《張三丰先生全集 · 卷6》 — https://zh.wikisource.org/wiki/張三丰先生全集/卷6</p></article></main></div></div>
