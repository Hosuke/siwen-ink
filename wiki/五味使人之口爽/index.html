    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五味使人之口爽</nav></header><main><article><h1>五味使人之口爽</h1><p>嗜於厚味則口失其正。</p><p>五味雜陳，足以爽人之口。口爽者，味覺敗壞之謂也。滋味入於口，口悅之，悅而嗜，嗜而貪，貪而傷生。故聖人致虛守簡，甘其食、薄其味，不以口腹之欲竭其精也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第五十六章 為腹》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
