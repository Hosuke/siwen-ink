    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三加</nav></header><main><article><h1>三加</h1><p>冠禮以緇布冠、皮弁、爵弁三者依次加於將冠者之首。</p><p>三加者，士冠禮之主體也。一加緇布冠，緇布冠無縫，著之以行始加之禮，示尚儉德。再加皮弁，皮弁以白鹿皮為之，配素積素韠，示其有公卿之德。三加爵弁，爵弁玄冕之屬，配纁裳韎韐，示其有助祭之責。三加之際，各有祝辭：始加曰「棄爾幼志，順爾成德」，再加曰「敬爾威儀，淑慎爾德」，三加曰「咸加爾服，兄弟具在，以成厥德」。三加之義，彌尊而論志，故[[三加彌尊]]之義也。</p><p><strong>所出</strong>：《儀禮 · 士冠禮》 — https://zh.wikisource.org/wiki/儀禮/士冠禮</p></article></main></div></div>
