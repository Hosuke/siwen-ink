    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 用罪伐厥死</nav></header><main><article><h1>用罪伐厥死</h1><p>刑賞分明，罪死不赦。</p><p>無有遠邇，用罪伐厥死，用德彰厥善。</p><p>盤庚申賞罰之義。言[[無有遠邇]]，一秉公道；[[用罪伐厥死]]，則[[罰及爾身]]；[[用德彰厥善]]，則賞[[世選爾勞]]。刑賞明而[[邦之臧惟汝眾]]，此[[尚書]]所述賞罰之柄也。</p><p><strong>所出</strong>：《尚書 · 盤庚上》 — https://zh.wikisource.org/wiki/尚書/盤庚上</p></article></main></div></div>
