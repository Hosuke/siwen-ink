    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 雉鳴求牡</nav></header><main><article><h1>雉鳴求牡</h1><p>雌雉鳴以求雄，以比淫奔之非禮。</p><p>「雉鳴求其牡」，《匏有苦葉》句也。雌者求雄，詩以為非禮之比。蓋夫婦有別，雌雄各匹；若雌求牡而不待聘禮，則淫佚之象也。詩刺宣公與夫人並為淫亂，故以雉鳴為喻。</p><p><strong>所出</strong>：《詩經 · 匏有苦葉》 — https://zh.wikisource.org/wiki/詩經/匏有苦葉</p></article></main></div></div>
