    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 謙尊而光</nav></header><main><article><h1>謙尊而光</h1><p>謙居尊位則愈光輝。</p><p>《彖》曰「謙尊而光」，言謙德之人，居尊位而愈見其光輝。蓋謙者不自有其能，不矜於上，故光華發越而人莫能掩。</p><p><strong>所出</strong>：《周易 · 謙》 — https://zh.wikisource.org/wiki/周易/謙</p></article></main></div></div>
