    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 發蹤指示</nav></header><main><article><h1>發蹤指示</h1><p>發掘蹤跡，指示方向，喻指點大局之功。</p><p>高祖以獵為喻，論蕭何之功在於「發蹤指示」。獵狗追逐搏殺，而指示獸之所處者，唯人耳。言功臣之中，若曹參之徒，攻城掠地，身被堅執銳，功固然盛，然不過奔走效力之狗；而蕭何則為操縱指揮之主，其功在人而非狗也。司馬遷記之以明開國之際，文吏之勳有足稱者。</p><p><strong>所出</strong>：《史記 · 卷053》 — https://zh.wikisource.org/wiki/史記/卷053</p></article></main></div></div>
