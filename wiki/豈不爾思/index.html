    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 豈不爾思</nav></header><main><article><h1>豈不爾思</h1><p></p><p>又見《詩經·竹竿》：「籊籊竹竿，以釣于淇，豈不爾思，遠莫致之。」</p><p>  此反言以見意也。豈不爾思者，言我之思之也，非不思也。[[泉水|泉源]]、淇水之在左右，[[佩玉之儺|佩玉之聲]]之在行止，觸目皆是故土之記憶，安得而不思。然[[女子有行|適異國而不得歸]]，[[遠莫致之|道里遼遠]]，雖思而無可如何。《序》言「思而能以禮」，正謂此怨而不怒之意也。</p><p>  <strong>所出</strong>：《詩經 · 竹竿》 — https://zh.wikisource.org/wiki/詩經/竹竿</p></article></main></div></div>
