    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 書不盡言，言不盡意</nav></header><main><article><h1>書不盡言，言不盡意</h1><p>書有限而言有窮，言有限而意無盡，聖人立象以盡意。</p><p>書不盡言，言不盡意。然則聖人之意，其不可見乎？子曰：聖人立象以盡意，設卦以盡情偽，繫辭以盡其言，變而通之以盡利，鼓之舞之以盡神。</p><p>乾坤，其易之縕邪！乾坤成列，而易立乎其中矣。乾坤毀，則无以見易，易不可見，則乾坤或幾乎息矣。</p><p><strong>所出</strong>：《周易 · 繫辭上》 — https://zh.wikisource.org/wiki/易傳/繫辭上</p></article></main></div></div>
