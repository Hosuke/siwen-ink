    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 十度</nav></header><main><article><h1>十度</h1><p>脈度、臟度、肉度、筋度、俞度，合陰陽之度為十，診有十度乃可十全。</p><p>帝論診法曰：</p><p>診有十度度人，脈度，臟度，肉度，筋度，俞度。陰陽氣盡，人病自具。</p><p>又云：</p><p>是以切陰不得陽，診消亡；得陽不得陰，守學不湛。知左不知右，知右不知左，知上不知下，知先不知後，故治不久。</p><p>持診之道，當先後陰陽而持之，奇恆之勢，乃六十首，診合微之事，追陰陽之變，章五中之情，取虛實之要，定五度之事，知此乃足以診。</p><p><strong>所出</strong>：《黃帝內經 · 素問第二十四卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第二十四卷</p></article></main></div></div>
