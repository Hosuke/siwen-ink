    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 孺子牛</nav></header><main><article><h1>孺子牛</h1><p>鮑子以孺子牛喻景公之愛，陽生遂背之而立。</p><p>鮑子醉而往，其臣差車鮑點曰：「此誰之命也。」陳子曰：「受命于鮑子。」遂誣鮑子曰：「子之命也。」鮑子曰：「女忘君之為孺子牛，而折其齒乎，而背之也。」悼公稽首曰：「吾子奉義而行者也，若我可，不必亡一大夫；若我不可，不必亡一公子。義則進，否則退，敢不唯子是從。」</p><p><strong>所出</strong>：《春秋左氏傳 · 哀公六年》 — https://zh.wikisource.org/wiki/春秋左氏傳/哀公</p></article></main></div></div>
