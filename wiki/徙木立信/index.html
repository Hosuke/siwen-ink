    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 徙木立信</nav></header><main><article><h1>徙木立信</h1><p>立法令之信於民</p><p>令既具，未布，恐民之不信，已乃立三丈之木於國都市南門，募民有能徙置北門者予十金。民怪之，莫敢徙。復曰「能徙者予五十金」。有一人徙之，輒予五十金，以明不欺。卒下令。</p><p><strong>所出</strong>：《史記 · 卷068》 — https://zh.wikisource.org/wiki/史記/卷068</p></article></main></div></div>
