    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 介酢主人</nav></header><main><article><h1>介酢主人</h1><p>介洗爵酌酒還敬主人之禮。</p><p>介降洗，主人復闒階，降辭如初。卒洗，主人盥。介揖讓升，授主人爵于兩楹之閒。介西階上立。</p><p>主人實爵，醋于西階上，介右坐奠爵，遂拜，執爵興。介答拜。</p><p>主人坐祭，遂飲，卒爵，興；坐奠爵，遂拜，執爵興。介答拜。</p><p>主人坐奠爵于西楹南，介右再拜崇酒；介答拜。</p><p><strong>所出</strong>：《儀禮 · 鄉飲酒禮》 — https://zh.wikisource.org/wiki/儀禮/鄉飲酒禮</p></article></main></div></div>
