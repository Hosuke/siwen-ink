    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 為者敗之執者失之</nav></header><main><article><h1>為者敗之執者失之</h1><p>強為者必敗，強執者必失，自然之理也。</p><p>為者敗之，執者失之。是以聖人無為故無敗，無執故無失。言世人之敗，在於有為有執；聖人之不敗，在於無為無執也。《[[無為之治]]》以無為致治，《[[為者敗之執者失之]]》以有為致敗，義相反也。慎終如始，則無敗事。此聖人所以終始如一，不敢妄作者也。</p><p><strong>所出</strong>：《老子河上公章句 · 守微》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
