    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 持盈戒滿</nav></header><main><article><h1>持盈戒滿</h1><p>盈不可持，戒在溢滿</p><p>持而盈之，不若亓已。言萬物之理，盈則必虧，持滿不如早止。聖人知進退存亡之分，故持盈而戒其溢滿，致虛守靜，不為物之所害也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第五十三章 持盈》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
