    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 讒語</nav></header><main><article><h1>讒語</h1><p>賞罰進則邪道進，親疏分則小人入；至公之世，盜不敢取金於市，讒不敢語於朝。</p><p>藏於人者謂之機，奇於人者謂之謀。殊不知道德之機，眾人所知；仁義之謀，眾人所無。是故有賞罰之教則邪道進，有親疏之分則小人入。夫棄金於市，盜不敢取；詢政於朝，讒不敢語，天下之至公也。</p><p><strong>所出</strong>：《化書 · 卷三》 — https://zh.wikisource.org/wiki/化書/卷三</p></article></main></div></div>
