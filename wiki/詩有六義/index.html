    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 詩有六義</nav></header><main><article><h1>詩有六義</h1><p>詩之六種功能：風、賦、比、興、雅、頌。</p><p>風，風也，教也。風以動之，教以化之。上以風化下，下以風刺上，主文而譎諫，言之者無罪，聞之者足以戒。</p><p>賦者，鋪陳其事而直言之。比者，以此物比彼物也。興者，托事於物以起情也。</p><p>雅者，正也，言王政之所由廢興也。政有小大，故有小雅焉，有大雅焉。</p><p>頌者，美盛德之形容，以其成功告於神明者也。</p><p><strong>所出</strong>：《詩經 · 序》 — https://zh.wikisource.org/wiki/詩經/序</p></article></main></div></div>
