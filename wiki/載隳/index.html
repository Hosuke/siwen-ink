    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 載隳</nav></header><main><article><h1>載隳</h1><p>安危相倚治亂迭為</p><p>[[載隳]]者，安危之迭也。河上公注「或載或隳」云：「載，安也。隳，危也。有所安必有所危。」安者，非安也，危之幾也；隳者，非隳也，安之兆也。聖人無為，不貴其載而畏其隳，知安之為隳，是以常安。</p><p><strong>所出</strong>：《老子河上公章句 · 無為》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
