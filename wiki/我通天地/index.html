    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 我通天地</nav></header><main><article><h1>我通天地</h1><p>人心與天地相通，夢時物象亦天地之寓</p><p>心應棗，肝應榆。我通天地，將陰夢水，將晴夢火。天地通我，我與天地似契似離，純純各歸。</p><p>[[我通天地]] 我之心與天地之氣相通。將陰而欲雨，則夢水；將晴而欲燥，則夢火。是心也，通乎天地之間者也。然天地通我，亦我寓天地之中，似合似離，各歸其本。</p><p><strong>所出</strong>：《關尹子 · 2》 — https://zh.wikisource.org/wiki/關尹子/2</p></article></main></div></div>
