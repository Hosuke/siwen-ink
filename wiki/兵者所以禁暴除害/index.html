    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 兵者所以禁暴除害</nav></header><main><article><h1>兵者所以禁暴除害</h1><p>兵之為用，在禁暴除害，而非爭奪。</p><p>陳囂問孫卿子以兵，孫卿子曰：「彼兵者所以禁暴除害也，非爭奪也。」仁者愛人故惡人之害之，義者循理故惡人之亂之。仁者之兵，所存者神，所過者化，若時雨之降，莫不說喜。</p><p><strong>所出</strong>：《荀子 · 議兵篇》 — https://zh.wikisource.org/wiki/荀子/議兵篇</p></article></main></div></div>
