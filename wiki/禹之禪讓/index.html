    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 禹之禪讓</nav></header><main><article><h1>禹之禪讓</h1><p>記禹禪天下於益而益讓于啟之事</p><p>禹娶塗山，辛壬癸甲；生啟，予不子，以故能成水土功。禹東巡狩，至于會稽而崩。以天下授益。三年之喪畢，讓之子啟，而辟居之陽。子賢，天下屬意焉。及禹崩，雖授益，益之佐日淺，天下未洽。故諸侯皆去益而朝啟，曰「吾君之子也」。於是啟即天子之位，是爲夏后帝啟。</p><p><strong>所出</strong>：《史記 · 卷002》 — https://zh.wikisource.org/wiki/史記/卷002</p></article></main></div></div>
