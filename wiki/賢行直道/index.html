    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 賢行直道</nav></header><main><article><h1>賢行直道</h1><p>季主所稱賢者之行，以正直利人為務</p><p>季主論賢者之行云：「賢之行也，直道以正諫，三諫不聽則退。其譽人也不望其報，惡人也不顧其怨，以便國家利眾為務。故官非其任不處也，祿非其功不受也；見人不正，雖貴不敬也；見人有污，雖尊不下也；得不為喜，去不為恨；非其罪也，雖累辱而不愧也。」</p><p>此言賢者以直道正諫，利國利民，不戀祿位，不阿貴勢，得失不動其心，羞辱不汙其操。</p><p><strong>所出</strong>：《史記 · 卷127》 — https://zh.wikisource.org/wiki/史記/卷127</p></article></main></div></div>
