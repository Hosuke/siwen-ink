    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 元神</nav></header><main><article><h1>元神</h1><p>人之真性，超乎形骸，生天生地之本是也。</p><p>天地視人如蜉蝣，大道視天地如泡影。惟元神真性，超元全而上之。其精氣則隨天地而敗壞矣。然有元神在，即無極也，生天生地皆由此出。</p><p>凡人投胎之時，元神居於方寸。學人但能守護元神，則超生在陰陽之外，不在三界之中，此惟見性方可，所謂本來面目也。</p><p>魂在天心，陽也，輕清之照也，此自太虛得來，與元始同形。回光所以煉魂、保神、制魄斷識，古人出世法，煉盡陰滓，以返純乾，不過消魄全魂耳。回光即消陰制魄之要諦也。</p><p><strong>所出</strong>：《太乙金華宗旨》 — https://zh.wikisource.org/wiki/太乙金華宗旨</p></article></main></div></div>
