    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 宜其室家</nav></header><main><article><h1>宜其室家</h1><p>和順其居處，室家相宜。</p><p>室，夫婦所居；家，一門之內。齊詩以為「宜」者，和順之意。室與家析言之，渾言之則一也。</p><p>《桃夭》首章言「宜其室家」，二章言「宜其家室」，三章言「宜其家人」，文有小異而義實相承。詩人以為女子于歸，則室家相宜、家室相宜、家人相宜，皆和順之效也。</p><p>後世以「宜室家」為昏姻之祝，亦本此詩。</p><p><strong>所出</strong>：《詩經 · 桃夭》 — https://zh.wikisource.org/wiki/詩經/桃夭</p></article></main></div></div>
