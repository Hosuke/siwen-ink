    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 乾餱以愆</nav></header><main><article><h1>乾餱以愆</h1><p>細微之失，足以傷友情；待友不可以薄。</p><p>「民之失德，乾餱以愆」，[[詩經 · 伐木]]之戒也。言常人之所以失德而獲譴咎者，非有大過也，皆由待友之薄耳。或饋以乾粮，吝嗇不周，遂成怨隙。</p><p>詩人以此為誡，告誡世人：待朋友不可以輕忽，區區食物之微，亦當豐厚。夫失德之漸，必始於微。乾餱之慳，固小事也，然而怨憾生焉。是以君子處友，必盡其誠，寧厚無薄，庶乎可矣。</p><p><strong>所出</strong>：《詩經 · 伐木》 — https://zh.wikisource.org/wiki/詩經/伐木</p></article></main></div></div>
