    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五色精微象</nav></header><main><article><h1>五色精微象</h1><p>五色者氣之華，赤白青黃黑各有欲與不欲，精微象見則壽不久。</p><p>「夫精明五色者，氣之華也。」赤欲如白裹朱，不欲如赭；白欲如鵝羽，不欲如鹽；青欲如蒼璧之澤，不欲如藍；黃欲如羅裹雄黃，不欲如黃土；黑欲如重漆色，不欲如地蒼。五色精微象見，其壽不久。</p><p>又明精明之義：「夫精明者，所以視萬物，別白黑，審短長。以長為短，以白為黑，如是則精衰矣。」</p><p><strong>所出</strong>：《黃帝內經 · 素問第五卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第五卷</p></article></main></div></div>
