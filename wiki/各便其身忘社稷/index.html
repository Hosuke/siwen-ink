    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 各便其身忘社稷</nav></header><main><article><h1>各便其身忘社稷</h1><p>大臣各便其身，士人結黨營私，皆亂國之道。</p><p>君失其道，則大臣比權重以相舉於國，小臣必循利以相就也。故舉國之士以為亡黨，行公道以為私惠。進則相推於君，退則相譽於民，各便其身，而忘社稷，以廣其居，聚徒威羣，上以蔽君，下以索民，此皆弱君亂國之道也。</p><p><strong>所出</strong>：《管子 · 第14篇法禁》 — https://zh.wikisource.org/wiki/管子/第14篇法禁</p></article></main></div></div>
