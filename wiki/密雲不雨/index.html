    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 密雲不雨</nav></header><main><article><h1>密雲不雨</h1><p>陽氣聚而未散，施澤未行之象。</p><p>密雲不雨，周易小畜卦辭也。言雲氣密布而不雨，澤未施也。亦見於大有卦，義同。象傳曰「密雲不雨，尚往也」，言陽氣尚往升而未降，故雨不成。君子觀此，當修德以待時，不可急於有為。</p><p><strong>所出</strong>：《周易 · 小畜》 — https://zh.wikisource.org/wiki/周易/小畜</p></article></main></div></div>
