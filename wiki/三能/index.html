    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三能</nav></header><main><article><h1>三能</h1><p>斗魁下六星兩兩相比，天子三階，應泰階六符之驗。</p><p>斗魁下六星，兩兩相比者，名曰三能。蘇林曰「能音台」。案：漢書東方朔「原陳泰階六符」。孟康曰「泰階，三台也，台星凡六星。六符，六星之符驗也」。</p><p>應劭引黃帝泰階六符經曰「泰階者，天子之三階：上階，上星為男主，下星為女主；中階，上星為諸侯三公，下星為卿大夫；下階，上星為士，下星為庶人」。三階平則陰陽和、風雨時；不平則稼穡不成。</p><p>三能色齊，君臣和；不齊，為乖戾。</p><p><strong>所出</strong>：《史記 · 卷027》 — https://zh.wikisource.org/wiki/史記/卷027</p></article></main></div></div>
