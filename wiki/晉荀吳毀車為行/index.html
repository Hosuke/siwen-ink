    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 晉荀吳毀車為行</nav></header><main><article><h1>晉荀吳毀車為行</h1><p>毀車以為步卒，減兵以增效，卒以大敗無終及群狄。</p><p>晉中行穆子敗無終及群狄於大原。將戰，魏舒曰：「彼徒我車，所遇又阨。以什共車，必克；困諸阨，又克。請皆卒，自我始。」乃毀車以為行，五乘為三伍。荀吳之嬖人不肯即卒，斬以徇。為五陳以相離，大敗狄師。</p><p><strong>所出</strong>：《春秋左氏傳 · 昭公》 — https://zh.wikisource.org/wiki/春秋左氏傳/昭公</p></article></main></div></div>
