    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 賞罰隨是非</nav></header><main><article><h1>賞罰隨是非</h1><p>賞罰當隨是非而施，不可雜以私意。</p><p>賞罰者，治國之柄也。賞當施之於是，罰當加之於非，不可參以愛惡。[[死生隨法度]]，[[有賢不肖而無愛惡]]，皆此意之引申。以賞勸善，以罰止惡，善賞而後善人多，惡罰而後姦人懼。賞罰不明，是非淆亂，則[[號令者國之舟車|號令無以行]]，國必危矣。</p><p><strong>所出</strong>：《韓非子 · 安危》 — https://zh.wikisource.org/wiki/韓非子/安危</p></article></main></div></div>
