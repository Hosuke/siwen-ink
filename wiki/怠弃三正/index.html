    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 怠弃三正</nav></header><main><article><h1>怠弃三正</h1><p>有扈氏怠慢而弃廢三正之官，不循治道。</p><p>三正者，天、地、人之正道也。怠而不勤，弃而不用，故天命剿絕焉。[[知人安民]]之政不行，而亂由生矣。</p><p><strong>所出</strong>：《尚書 · 甘誓》 — https://zh.wikisource.org/wiki/尚書/甘誓</p></article></main></div></div>
