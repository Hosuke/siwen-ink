    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 莊子將死</nav></header><main><article><h1>莊子將死</h1><p>天地為棺槨，萬物為齎送</p><p>莊子將死，弟子欲厚葬之。莊子曰：「吾以天地為棺槨，以日月為連璧，星辰為珠璣，萬物為齎送。吾葬具豈不備邪？何以加此！」</p><p>弟子曰：「吾恐烏鳶之食夫子也。」</p><p>莊子曰：「在上為烏鳶食，在下為螻蟻食，奪彼與此，何其偏也。」</p><p>生死一氣之化，葬以天地，是與造物者同游也。厚葬則執、有遺；薄葬則失、我忘。皆非道之要。莊子之視死生，猶晝夜之常，故不以厚薄動其心。</p><p><strong>所出</strong>：《莊子 · 列禦寇》 — https://zh.wikisource.org/wiki/莊子/列禦寇</p></article></main></div></div>
