    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 一儀不可以百發</nav></header><main><article><h1>一儀不可以百發</h1><p>一法不可施之百事，一衣不可以適之四時；唯施宜乃可以無過。</p><p>夫一儀不可以百發，一衣不可以出歲。儀必應乎高下，衣必適乎寒暑。是故世異則事變，時移則俗易。各用之於其所適，施之於其所宜，即萬物一齊，而無由相過。</p><p><strong>所出</strong>：《淮南子 · 齊俗訓》 — https://zh.wikisource.org/wiki/淮南子/齊俗訓</p></article></main></div></div>
