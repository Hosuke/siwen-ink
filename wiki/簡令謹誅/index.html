    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 簡令謹誅</nav></header><main><article><h1>簡令謹誅</h1><p>簡令謹誅，必盡其罰</p><p>厚者虧之，薄者靡之。虧之若月，靡之若熱。簡令謹誅，必盡其罰。令者，人主之言最貴者也。簡令者，明白易曉，使民不惑；謹誅者，罪情審核，使罰當罪。賞罰之行，必盡其實，不可姑息。賞不加於無功，罰不及於無辜。此法之正也，令之信也。</p><p><strong>所出</strong>：《韓非子 · 揚權》 — https://zh.wikisource.org/wiki/韓非子/揚權</p></article></main></div></div>
