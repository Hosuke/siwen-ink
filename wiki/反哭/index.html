    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 反哭</nav></header><main><article><h1>反哭</h1><p>窆畢，歸哭于殯宮。</p><p>乃窆。藏器于旁，加見。藏苞筲于旁。加折卻之，加抗席覆之，加抗木，實土三。主人拜鄉人。即位踊襲如初。乃反哭，入，升自西階，東面。眾主人堂下東面北上。妇人入，丈夫踊，升自阼階。主婦入于室，踊，出即位，及丈夫拾踊三。賓吊者升自西階，主人拜稽顙。主人送于門外，拜稽顙。遂適殯宮，皆如啟位，拾踊三。</p><p><strong>所出</strong>：《儀禮 · 既夕禮》 — https://zh.wikisource.org/wiki/儀禮/既夕禮</p></article></main></div></div>
