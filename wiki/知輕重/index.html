    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 知輕重</nav></header><main><article><h1>知輕重</h1><p>身重於天下，有道者知輕重，不以利害傷生。</p><p>子華子見昭僖侯，昭僖侯有憂色。子華子曰：「今使天下書銘於君之前，書之言曰：『左手攫之則右手廢，右手攫之則左手廢，然而攫之者必有天下。』君能攫之乎？」昭僖侯曰：「寡人不攫也。」子華子曰：「甚善！自是觀之，兩臂重於天下也，身亦重於兩臂。韓之輕於天下亦遠矣，今之所爭者，其輕於韓又遠。君固愁身傷生以憂戚不得也！」僖侯曰：「善哉！教寡人者衆矣，未嘗得聞此言也。」子華子可謂知輕重矣。</p><p><strong>所出</strong>：《莊子 · 讓王》 — https://zh.wikisource.org/wiki/莊子/讓王</p></article></main></div></div>
