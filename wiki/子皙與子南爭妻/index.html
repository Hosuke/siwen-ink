    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 子皙與子南爭妻</nav></header><main><article><h1>子皙與子南爭妻</h1><p>兄弟同聘一女，戎服超乘者得配，爭亂遂起。</p><p>鄭徐吾犯之妹美，公孫楚已聘之。公孫黑強委禽焉，犯懼，告子產。子產曰：「唯所欲與。」使二子自擇。子皙盛飾入，布幣而出；子南戎服入，左右射，超乘而出。女自房觀之，曰：「子皙信美矣，抑子南夫也。」適子南氏。子皙怒，櫜甲以見子南，欲殺之而取其妻。子南執戈逐之，及衝，擊之以戈，子皙傷而歸。子產論之曰：「直鈞幼賤，有罪，罪在楚也。」遂放游楚於吳。</p><p><strong>所出</strong>：《春秋左氏傳 · 昭公》 — https://zh.wikisource.org/wiki/春秋左氏傳/昭公</p></article></main></div></div>
