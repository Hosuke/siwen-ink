    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 七政四守</nav></header><main><article><h1>七政四守</h1><p>兵事之七政、人之四守，並為軍國之大節。</p><p>一曰人，二曰正，三曰辭，四曰巧，五曰火，六曰水，七曰兵，是謂七政。</p><p>七政皆修，則兵事備矣。人以任將，正以守法，辭以誓師，巧以器械，火以焚敵，水以阻兵，兵以制變。</p><p>榮、利、恥、死，是謂四守。軍中賞以榮，罰以利；退有恥，進必死。容色積威，不過改意。凡此道也，唯仁有親，有仁無信，反敗厥身。是以人人、正正、辭辭、火火。</p><p><strong>所出</strong>：《司馬法》 — https://zh.wikisource.org/wiki/司馬法</p></article></main></div></div>
