    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 垂拱而任賢</nav></header><main><article><h1>垂拱而任賢</h1><p>君主任賢勿疑，自可垂拱無為。</p><p>則人主雖從容玉房之內，逍遙雲閣之端，猶可以垂拱而任賢，高枕以責成。</p><p><strong>所出</strong>：《抱朴子 · 卷05》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷05</p></article></main></div></div>
