    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 高祖制詔御史令郡國立靈星祠</nav></header><main><article><h1>高祖制詔御史令郡國立靈星祠</h1><p>記高祖詔令郡國縣立靈星祠，常以歲時祠以牛。</p><p>其後二歲，或曰周興而邑邰，立后稷之祠，至今血食天下。於是高祖制詔御史：「其令郡國縣立靈星祠，常以歲時祠以牛。」</p><p>高祖十年春，有司請令縣常以春三月及時臘祠社稷以羊豕，民里社各自財以祠。制曰：「可。」</p><p><strong>所出</strong>：《史記 · 卷028》 — https://zh.wikisource.org/wiki/史記/卷028</p></article></main></div></div>
