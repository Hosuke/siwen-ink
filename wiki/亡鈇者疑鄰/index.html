    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 亡鈇者疑鄰</nav></header><main><article><h1>亡鈇者疑鄰</h1><p>意竊鈇也，視其行止顏色動作無不竊鈇；得鈇則不然。</p><p>人有亡鈇者，意其鄰之子，視其行步，竊鈇也；顏色，竊鈇也；言語，竊鈇也：動作態度，無爲而不竊鈇也。俄而抇其谷而得其鈇，他日復見其鄰人之子，動作態度無似竊鈇者。</p><p><strong>所出</strong>：《列子 · 說符篇》 — https://zh.wikisource.org/wiki/列子/說符篇</p></article></main></div></div>
