    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 道之為物</nav></header><main><article><h1>道之為物</h1><p>道之成物，唯怳唯忽，不可得而指定</p><p>道之為物，唯怳唯忽。怳者，心有所見忽然而來；忽者，意無所識倏然而逝。[[道無所不在]]，而非耳目所能聞見，非思慮所能測度。[[道可道非恆道]]，[[道不可言]]，故其為物也，視之不見其形，聽之不聞其聲，求之不得其端。唯以虛心體之，乃能知其怳忽之狀。[[虛心以為道舍]]，此之謂也。</p><p><strong>所出</strong>：《老子河上公章句 · 虛心》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
