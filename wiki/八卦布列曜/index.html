    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 八卦布列曜</nav></header><main><article><h1>八卦布列曜</h1><p>八卦分布如天之星曜，聖人觀之以占天符之進退。</p><p>天符有進退屈伸，聖人上觀以察其時。八卦布列曜者，言八卦分布如天上之星宿，運移不失其常中也。</p><p>[[河圖地形|河圖]]之文，此之根柢；[[月體納甲|七八之數]]，此之節度。</p><p><strong>所出</strong>：《周易參同契 · 04章》 — https://zh.wikisource.org/wiki/周易參同契/04章</p></article></main></div></div>
