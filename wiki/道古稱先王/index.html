    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 道古稱先王</nav></header><main><article><h1>道古稱先王</h1><p>季主斥談士辯人必稱先王以悅人主</p><p>季主又云：「公見夫談士辯人乎？慮事定計，必是人也，然不能以一言說人主意，故言必稱先王，語必道上古；慮事定計，飾先王之成功，語其敗害，以恐喜人主之志，以求其欲。多言誇嚴，莫大於此矣。然欲彊國成功，盡忠於上，非此不立。今夫卜者，導惑教愚也。夫愚惑之人，豈能以一言而知之哉！言不厭多。」</p><p>言談士辯人不能直通要旨，必假先王上古以文其說；卜者則導惑教愚，因材開曉，言多所以濟事，非夸也。</p><p><strong>所出</strong>：《史記 · 卷127》 — https://zh.wikisource.org/wiki/史記/卷127</p></article></main></div></div>
