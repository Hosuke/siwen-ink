    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 賞讒諛之臣</nav></header><main><article><h1>賞讒諛之臣</h1><p>賞讒諛則令不行，賞罰失中則國危。</p><p>景公信用讒佞，賞無功而罰不辜。晏子諫曰：「君賞讒諛之臣，而令吏必從，則是使君失其道，臣失其守也。先王之立愛，以勸善也；其立惡，以禁暴也。」又曰：「愛人不能利，惡人不能疏，失君道矣。」晏子以為，明主望聖人而信其教，不聞聽讒佞以誅賞。賞一人而天下之為善者勸，罰一人而天下之為暴者禁，此先王之道也。今賞讒諛而罰忠直，則有司不敢爭，社稷危矣。</p><p><strong>所出</strong>：《晏子春秋 · 卷一》 — https://zh.wikisource.org/wiki/晏子春秋/卷一</p></article></main></div></div>
