    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 子賤起家治大邦</nav></header><main><article><h1>子賤起家治大邦</h1><p>賢者在位則大邦可治。</p><p>子賤起家而治大邦，實由勝己者多，而招其弘益。言委任賢才，則小事可成大功。</p><p><strong>所出</strong>：《抱朴子 · 卷12》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷12</p></article></main></div></div>
