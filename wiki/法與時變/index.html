    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 法與時變</nav></header><main><article><h1>法與時變</h1><p>法制禮樂者，治之具也，非所以為治；法與時變，禮與俗化。</p><p>法制禮樂者，治之具也，非所以為治也。故曲士不可與論至道者，訊寤於俗而束於教。天下幾有常法哉！當於世事，得於人理，順於天地，詳於鬼神，即可以正治矣。器械者，因時變而制宜適。夫制於法者，不可與遠舉；拘禮之人，不可使應變。必有待獨見之明、獨聞之聰，然後能擅道而行。</p><p><strong>所出</strong>：《文子 · 卷十一》 — https://zh.wikisource.org/wiki/文子/卷十一</p></article></main></div></div>
