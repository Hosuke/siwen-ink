    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 慎子</nav></header><main><article><h1>慎子</h1><p>慎到，法家之醇者也，主張分定不偏，因勢任法</p><p>慎子者，慎到之書也。在[[慎勢]]篇中，[[呂氏春秋]]引其言曰：「今一兔走，百人逐之。非一兔足為百人分也，由未定。由未定，堯且屈力，而況眾人乎？積兔滿市，行者不顧。非不欲兔也，分已定矣。分已定，人雖鄙不爭。」慎子之意，以為治天下及國，在乎定分而已。又曰：「以大畜小吉，以小畜大滅；以重使輕從，以輕使重凶。」此其任勢之說也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十七》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十七</p></article></main></div></div>
