    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 臨船</nav></header><main><article><h1>臨船</h1><p>十船為臨，三十人共之，以決水攻城之戰術單位。</p><p>臨船者攻城水戰之編制也。《墨子·備水》云：「並船以為十臨，臨三十人。」十船相連為一臨，其船三十人：二十人擅弩，十人擅苗。</p><p>此制之要義有數端：
一為船連而進，不若單船易散；
二為人多而有分工，弩射與操持各有所司；
三為 [[材士]] 為骨幹，挾 [[轒轀]] 以渡水。</p><p>視水可決之時，以臨船載兵出城，決外堤以灌敵圍師。城上 [[射檥]] 之兵佐之，矢石交加。此水攻之法，亦墨子「非攻」之義——以守為攻，使敵知難而退也。</p><p>《六韜》有「三軍渡水」之述，與此 [[備水]] 之法相參，可見先秦水戰編制之大略。</p></article></main></div></div>
