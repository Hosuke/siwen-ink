    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天下萬物生於有</nav></header><main><article><h1>天下萬物生於有</h1><p>萬物皆生於有，有生於無。</p><p>天下萬物芸芸，莫不資始於有；有者，氣凝而形具之時也。然有之始，亦非自生，乃生於無形無名之始——道之全體。</p><p>無名，天地之始；有名，萬物之母。故道生一、一生二是生化之序，而終歸乎萬物之生。學者若執有以為本、遺無以為末，是知所生出而昧其所從生也。</p><p>===續寫===
