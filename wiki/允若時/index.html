    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 允若時</nav></header><main><article><h1>允若時</h1><p>言行相副，信實不欺</p><p>說之對武丁也，以「允若時」一語括之。允，信也；若時，如是也。言己凡事當信實以應，如其命之正也。臣之事君，以信為本；信者，不欺之謂也。武丁命以聽戒其言，漸入於心，說則以「允若時」應之，示其奉命惟謹、無有虛飾之心也。</p><p><strong>所出</strong>：《尚書 · 傅說之命中》 — https://zh.wikisource.org/wiki/尚書/傅說之命中</p></article></main></div></div>
