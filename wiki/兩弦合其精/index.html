    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 兩弦合其精</nav></header><main><article><h1>兩弦合其精</h1><p>龍虎兩弦合精，方成金丹之體。</p><p>[[龍虎兩弦]]各有一精：龍精者魂中之陽，汞之氣也；虎精者魄中之陰，金之華也。二精相合，乃成金丹之體。</p><p>[[魂魄自相拘]]而後兩弦之精可合；[[青龍與之俱]]而後[[汞日流珠]]有所附；[[白虎熬樞]]而後汞性可斂。上下兩弦各具[[上弦兌數八下弦艮亦八]]之數，一斤之體以成，[[乾坤體乃成]]，此之謂也。</p><p><strong>所出</strong>：《周易參同契 · 09章》 — https://zh.wikisource.org/wiki/周易參同契/09章</p></article></main></div></div>
