    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 四方之美</nav></header><main><article><h1>四方之美</h1><p>各地所出之美物</p><p>東方之美者，有醫毋閭之珣玗琪焉。東南方之美者，有會稽之竹箭焉。南方之美者，有梁山之犀象焉。西南方之美者，有華山之金石焉。西方之美者，有霍山之珠玉焉。西北方之美者，有昆侖之球琳、琅玕焉。北方之美者，有幽都之筋角焉。東北方之美者，有斥山之文皮焉。中央之美者，有岱嶽以生五穀桑麻，魚鹽出焉。</p><p><strong>所出</strong>：《淮南子 · 墜形訓》 — https://zh.wikisource.org/wiki/淮南子/墜形訓</p></article></main></div></div>
