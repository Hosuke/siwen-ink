    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五福六極</nav></header><main><article><h1>五福六極</h1><p>壽、富、康寧、攸好德、考終命為五福；凶短折、疾、憂、貧、惡、弱為六極。</p><p>[[洪範九疇]]之九，述福極以勸戒：</p><p>五福：一曰壽，二曰富，三曰康寧，四曰攸好德，五曰考終命。
六極：一曰凶短折，二曰疾，三曰憂，四曰貧，五曰惡，六曰弱。</p><p>[[五福]]以勸善，[[六極]]以戒惡，此天人感應之義，治道之所終也。</p><p><strong>所出</strong>：《史記·卷038》 — https://zh.wikisource.org/wiki/史記/卷038</p></article></main></div></div>
