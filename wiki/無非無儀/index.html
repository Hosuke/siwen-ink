    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無非無儀</nav></header><main><article><h1>無非無儀</h1><p>女子無過，行止端莊。</p><p>[[無非無儀]]者，言女子之行，無有邪非，無有邪儀也。女子以柔順為德，不敢有非禮之非，不為邪僻之事。詩云「無非無儀，唯酒食是議」，言女子之職，在於無非無儀，謹守閨門，不預外事。</p><p><strong>所出</strong>：《詩經 · 斯干》 — https://zh.wikisource.org/wiki/詩經/斯干</p></article></main></div></div>
