    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 帝皇太一</nav></header><main><article><h1>帝皇太一</h1><p>帝皇太一重冥空，字幽寥無，主太一之精。</p><p>帝皇太一者，七神之一也。重冥空，字幽寥無，主太一之精。</p><p>大洞玉經云：「太帝京山名，校仙登扶桑。」太帝即帝皇太一之別稱。帝皇太一居七神之三，位在元父、玄母之下，九帝尊神之上。其德在於與九帝合契，與日月同符。</p><p>誦者思之，存想其形，與七神同布於心下臍上。誦大洞玉經，先令胞胎開清，繼使七祖反胎，故七神之中，太一為精要之樞。</p><p><strong>所出</strong>：《上清大洞真經 · 35章》 — https://zh.wikisource.org/wiki/上清大洞真經/35章</p></article></main></div></div>
