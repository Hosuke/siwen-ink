    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 毋閘其所居毋厭其所生</nav></header><main><article><h1>毋閘其所居毋厭其所生</h1><p>不窒民所居、不疲民所生，治之善也</p><p>毋閘其所居，毋厭其所生。</p><p>閘者，塞也。民有定所，則安其土；上有侵奪，則散而之四方。厭者，倦也。民有所生，則樂其業；上有所疲，則怨而立姦。是以聖人治天下，去禁令，弛刑威，使民得安其居、遂其生。居無所塞，生無所疲，上不以欲累民，民得以自遂。此道之所以全民生者也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第三十七章 畏畏》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
