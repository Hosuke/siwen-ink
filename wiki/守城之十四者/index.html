    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 守城之十四者</nav></header><main><article><h1>守城之十四者</h1><p>具十四者城可守，失之則不能守。</p><p>城之可守與否，視乎十四事之具備與否。其十四者：</p><p>厚以高，壕池深以廣，樓㯕脩，守備繕利，薪食足以支三月以上，人衆以選，官吏和敬，大臣有功者衆，主信以義，萬民樂之無窮；父母丘墓在焉；山林草澤饒足；地形難攻而易守；或有深怨於敵而有大功於上；賞明可信，罰嚴足畏。</p><p>十四者俱備，則民宜上，城可守也。十四者无一，雖善者亦不能守。</p><p><strong>所出</strong>：《墨子 · 備城門》 — https://zh.wikisource.org/wiki/墨子/備城門</p></article></main></div></div>
