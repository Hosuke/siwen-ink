    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 御政之首</nav></header><main><article><h1>御政之首</h1><p>治國施政之始端，在革故鼎新，以大本大端為要。</p><p>御政之首，鼎新革故。管括微密，開舒布寶。要道魁柄，統化綱紐。</p><p>治國施政，當先正其本始。[[鼎新革故]]，此為御政之端；[[明堂布政]]，此為施治之方。端本清源，則綱舉目張矣。</p><p><strong>所出</strong>：《周易參同契 · 05章》 — https://zh.wikisource.org/wiki/周易參同契/05章</p></article></main></div></div>
