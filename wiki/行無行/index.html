    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 行無行</nav></header><main><article><h1>行無行</h1><p>兵道貴無形，雖行而不見其行。</p><p>河上公此章言用兵之要，在乎忘形以全道也。「行無行，攘無臂，仍無敵，執無兵」四句，文異而義同，反覆以明至道之無滞於迹也。</p><p>夫兩軍相對，人皆見其戈矛櫓戟之形，是為有行、有臂、有敵、有兵。惟知道者，見敵而若無見，應之以無形之妙。攘臂者以見於人，茲則不攘；扔敵者以加於人，茲則不扔；執兵者以威於人，茲則不執。</p><p>《易》曰「無思也，無為也」，此之謂也。善用兵者，不以兵強天下，故能全師而不傷。</p><p><strong>所出</strong>：《老子河上公章句 · 玄用》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
