    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 視色知病</nav></header><main><article><h1>視色知病</h1><p>言望五色以辨寒熱虛實之理。</p><p>歧伯述望色之法：「五藏六府，固盡有部，視其五色，黃赤為熱，白為寒，青黑為痛。」此所謂視而可見者也。又言捫脈之法：「視其主病之脈堅，而血及陷下者，皆可捫而得也。」</p><p><strong>所出</strong>：《黃帝內經 · 素問第十一卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十一卷</p></article></main></div></div>
