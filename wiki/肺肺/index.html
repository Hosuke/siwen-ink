    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 肺肺</nav></header><main><article><h1>肺肺</h1><p>楊葉之盛貌</p><p>肺肺，與「牂牂」同義，迭字以狀楊葉之盛也。《說文》：「肺肺，盛也。」《東門之楊》次章云「其葉肺肺」，與首章「其葉牂牂」相承，義一而辭變。</p><p>疊字之用，於《詩》常見，若「夭夭」「灼灼」「依依」之屬，皆所以傳神韻而諧音節者也。此詩以楊葉之盛起興，葉愈盛而人愈不至，則情之悵然可知。</p><p><strong>所出</strong>：《詩經 · 東門之楊》 — https://zh.wikisource.org/wiki/詩經/東門之楊</p></article></main></div></div>
