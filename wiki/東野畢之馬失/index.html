    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 東野畢之馬失</nav></header><main><article><h1>東野畢之馬失</h1><p>東野畢馭馬不知止竭，馬力盡而終於失。</p><p>定公問顏淵曰：「東野子畢之善馭乎？」顏淵對曰：「善則善矣。雖然，其馬將失。」後果然，東野畢之馬「兩驂列，兩服入廄」。顏淵曰：「上車執轡，銜體正矣；步驟馳騁，朝禮畢矣；歷險致遠，馬力盡矣。然猶求馬不已，是以知之。」言馭下者若不知止歇，必致敗亡。</p><p><strong>所出</strong>：《荀子 · 哀公篇》 — https://zh.wikisource.org/wiki/荀子/哀公篇</p></article></main></div></div>
