    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 詩經·樛木</nav></header><main><article><h1>詩經·樛木</h1><p>詠后妃逮下無嫉，福履綏將成之。</p><p>《樁木》，〈國風·周南〉之篇也。凡三章，章四句。</p><p>首章云：「南有樛木，葛藟纍之。樂只君子，福履綏之。」</p><p>二章云：「南有樛木，葛藟荒之。樂只君子，福履將之。」</p><p>三章云：「南有樛木，葛藟縈之。樂只君子，福履成之。」</p><p>其義以樛木喻君子，葛藟喻在下之人。葛藟攀附而蔭庇之，因木之垂而下逮之也。君子逮下而無嫉妒之心，故葛藟得附以生長，君子得上之福祿，而其下者亦蒙安撫、扶持、成全之福也。</p><p><strong>所出</strong>：《詩經 · 樛木》 — https://zh.wikisource.org/wiki/詩經/樛木</p></article></main></div></div>
