    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 精氣內銷</nav></header><main><article><h1>精氣內銷</h1><p>過用神思，則精氣消磨於內，如尾閭之泄海。</p><p>人之稟賦有限，而智用無涯。若慚鳧企鶴，强其所不能，則精氣消耗於內，有似尾閭之波，無有止時。尾閭者，相傳海水歸墟之處，滔滔不返。劉勰以此為喻，言人若不知量力，強求高遠，則神志內傷，精氣日削，終至不可復振。是以為學為文，皆當知止有度，不可竭澤而漁。</p><p><strong>所出</strong>：《文心雕龍 · 養氣》 — https://zh.wikisource.org/wiki/文心雕龍/養氣</p></article></main></div></div>
