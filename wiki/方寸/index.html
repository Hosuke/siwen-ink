    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 方寸</nav></header><main><article><h1>方寸</h1><p>心之別稱，神明之宅</p><p>方寸者，心之別稱，神明所宅也。</p><p>經云：「方寸之中謹蓋藏」，又云「方寸之中關下」，守方寸則神不外馳，而精氣凝結矣。</p><p><strong>所出</strong>：《黃庭外景經》 — https://zh.wikisource.org/wiki/黃庭外景經</p></article></main></div></div>
