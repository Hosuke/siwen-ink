    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 上之所以立廉恥者所以厲下</nav></header><main><article><h1>上之所以立廉恥者所以厲下</h1><p>立廉恥之本意在勸勵下屬，今反被濫用。</p><p>上之所以立廉恥者，所以厲下也，今士大夫不羞汙泥醜辱而宦，女妹私義之門不待次而宦。</p><p>賞禄，所以盡民力、易下死也，而戰勝攻取之士勞而賞不霑。賞罰，所以為重也，而戰鬬有功之士貧賤，而便辟優徒超級。</p><p><strong>所出</strong>：《韓非子 · 詭使》 — https://zh.wikisource.org/wiki/韓非子/詭使</p></article></main></div></div>
