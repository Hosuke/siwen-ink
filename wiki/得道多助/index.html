    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 得道者多助，失道者寡助</nav></header><main><article><h1>得道者多助，失道者寡助</h1><p>行道者天下順之，失道者親戚畔之，君子仗義，戰無不克。</p><p>孟子續言人和之效，以為域民不在封疆，固國不在溪險，威天下不在兵革，全在行道與否。得道則多助，天下順之；失道則寡助，親戚亦畔。以天下之所順，攻親戚之所畔，君子是以有不戰，戰必勝矣。此以人心向背為興亡之本，視山川形勢、戈兵之利皆下焉者也。</p><p><strong>所出</strong>：《孟子 · 公孫丑下》 — https://zh.wikisource.org/wiki/孟子/公孫丑下</p></article></main></div></div>
