    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不知常妄作凶</nav></header><main><article><h1>不知常妄作凶</h1><p>昧常而妄作者必凶</p><p>人不知常，昧天地不易之理，則[[妄作凶]]。妄作者，非分之為、不量力之動，逆天而行也。[[多易必多難]]，昧常之人不知[[物極則反]]之理，怙所能而不知止，卒至於凶。知常者則不然，[[知常曰明]]，故能免於此患。</p><p><strong>所出</strong>：《道德經 (王弼本) · 十六章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
