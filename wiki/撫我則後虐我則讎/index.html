    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 撫我則後虐我則讎</nav></header><main><article><h1>撫我則後虐我則讎</h1><p>民待其上，報施然耳；虐之則為仇。</p><p>文
古語有云：「撫我則後，虐我則讎。」言君以仁義撫民，民則奉以為君；君以暴虐虐民，民則視之為仇。湯之於夏、武之於紂，皆循此道也。</p><p><strong>所出</strong>：《尚書 · 泰誓下》 — https://zh.wikisource.org/wiki/尚書/泰誓下</p></article></main></div></div>
