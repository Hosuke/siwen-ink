    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 積功成煉非自然</nav></header><main><article><h1>積功成煉非自然</h1><p>成道非自然而有，皆由日積月累、刻苦修煉。</p><p>積功成煉者，修煉之要義也。</p><p>經云「非自然」，明成道非稟受即得、非偶然可致，必也積功以成煉，煉精以化氣，煉氣以化神，日就月將，方能躋此。</p><p>所謂功者，戒慎恐懼、內守不怠也；所謂煉者，烹煉身心、革除習氣也。七日思勿眠者，概言精進之志，非僅七日而已，終食不忘之義也。</p><p><strong>所出</strong>：《黃庭內景經 · 紫清章第二十九》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/紫清章第二十九</p></article></main></div></div>
