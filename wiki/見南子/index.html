    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 見南子</nav></header><main><article><h1>見南子</h1><p>聖人應變而矢誓自明</p><p>孔子見南子，子路不說。夫子矢之曰：「予所否者，天厭之！天厭之！」聖人行止，本無可議，見子路之不悅，故誓言以明志也。</p><p><strong>所出</strong>：《論語 · 雍也第六》 — https://zh.wikisource.org/wiki/論語/雍也第六</p></article></main></div></div>
