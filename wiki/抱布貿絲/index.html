    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 抱布貿絲</nav></header><main><article><h1>抱布貿絲</h1><p>男子假貿易以誘女子，為求婚之由。</p><p>「抱布貿絲」，語出《詩經·衞風·氓》首章。言男子抱布以為貿易，而實來就女子求謀，非真有市易之心也。</p><p>毛詩序云：「宣公之時，禮義消亡，淫風大行，男女無別，遂相奔誘。」此詩人述其一端也。男子以抱布貿易為名，實則來即女謀，欲求其為室家。匪來貿絲，來即我謀，所懷非布，所圖在絲。女子年少無知，以為男子之蚩蚩者誠然，不知其來意之不在市肆而在閨房也。及其既得所求，色衰而棄，悔之無及。「抱布」之誑，即男子薄情之始事也。</p><p><strong>所出</strong>：《詩經 · 氓》 — https://zh.wikisource.org/wiki/詩經/氓</p></article></main></div></div>
