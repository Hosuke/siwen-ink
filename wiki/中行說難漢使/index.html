    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 中行說難漢使</nav></header><main><article><h1>中行說難漢使</h1><p>中行說教單于候利害，與漢使詰辯，務在詰折漢物。</p><p>自是之後，漢使欲辯論者，中行說輒曰：「漢使無多言，顧漢所輸匈奴繒絮米糱，令其量中，必善美而已矣，何以為言乎？且所給備善則已；不備，苦惡，則候秋孰，以騎馳蹂而稼穡耳。」</p><p>日夜教單于候利害處。</p><p><strong>所出</strong>：《史記 · 卷110》 — https://zh.wikisource.org/wiki/史記/卷110</p></article></main></div></div>
