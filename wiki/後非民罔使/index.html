    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 後非民罔使</nav></header><main><article><h1>後非民罔使</h1><p>君民相須，缺一則不可以成治功。</p><p>君之於民，相須以成治也。君非民則無以為使，民非君則無所稟命。上下相須，此古今之通義也。茍君不以民為本，則民不附；民不以君為率，則事不立。是故人君當知民之不可以忽，而人臣當知君之不可以無民也。</p><p>後非民罔使；民非後罔事。</p><p><strong>所出</strong>：《尚書 · 咸有一德》 — https://zh.wikisource.org/wiki/尚書/咸有一德</p></article></main></div></div>
