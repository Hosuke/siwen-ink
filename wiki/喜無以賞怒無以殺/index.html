    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 喜無以賞，怒無以殺</nav></header><main><article><h1>喜無以賞，怒無以殺</h1><p>喜不以賞人，怒不以加人，賞罰各有其準。</p><p>喜無以賞，怒無以殺。喜以賞，怒以殺，怨乃起，令乃廢。言賞罰之柄，不可挾以喜怒也。[[喜無以賞怒無以殺]]者，乃明主之所以馭下者也。喜而賞，是喜其人，非賞其功；怒而殺，是怒其人，非殺其罪。[[正法直度]]，罪殺不赦，[[賞罰以信]]，此[[令行禁止]]之本也。</p><p><strong>所出</strong>：《管子 · 第07篇版法》 — https://zh.wikisource.org/wiki/管子/第07篇版法</p></article></main></div></div>
