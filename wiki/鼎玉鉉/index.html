    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鼎玉鉉</nav></header><main><article><h1>鼎玉鉉</h1><p>以柔潤濟剛，大吉无不利。</p><p>上九爻辭：「鼎玉鉉，大吉，无不利。」鉉者，舉鼎之杠，貫於兩耳。上九以陽居陰，剛而能柔，如玉之溫潤。以玉飾鉉，剛柔相節，無往不利，大吉之道也。</p><p>象曰：「玉鉉在上，剛柔節也。」</p><p><strong>所出</strong>：《周易 · 鼎》 — https://zh.wikisource.org/wiki/周易/鼎</p></article></main></div></div>
