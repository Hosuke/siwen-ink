    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 振貧補不足</nav></header><main><article><h1>振貧補不足</h1><p>振救貧弱，補益匱乏，使下樂上。</p><p>振貧補不足，乃治國之要道。民有匱乏者振救之，民有不足者補益之。下既樂生，上乃安位。歲凶旱水泆之時，以[[宮室臺榭]]之功起衆，贍無以為生之民，亦此義也。</p><p><strong>所出</strong>：《管子 · 第69篇乘馬數》 — https://zh.wikisource.org/wiki/管子/第69篇乘馬數</p></article></main></div></div>
