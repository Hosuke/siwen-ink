    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 養世子不可不慎</nav></header><main><article><h1>養世子不可不慎</h1><p>世子兼有父親君尊，故養之不可不慎。</p><p>君之於世子也，親則父也，尊則君也。有父之親，有君之尊，然後兼天下而有之。是故，養世子不可不慎也。</p><p><strong>所出</strong>：《禮記 · 文王世子》 — https://zh.wikisource.org/wiki/禮記/文王世子</p></article></main></div></div>
