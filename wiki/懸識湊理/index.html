    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 懸識湊理</nav></header><main><article><h1>懸識湊理</h1><p>懸察湊合其腠理，則文如膠木、豆合黃，自然一體。</p><p>夫能懸識湊理，然後自會，如膠之粘木，豆之合黃矣。是以駟牡異力，而六轡如琴；並駕齊驅，而一轂統輻。</p><p><strong>所出</strong>：《文心雕龍 · 附會》 — https://zh.wikisource.org/wiki/文心雕龍/附會</p></article></main></div></div>
