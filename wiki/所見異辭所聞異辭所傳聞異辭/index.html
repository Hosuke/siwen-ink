    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 所見異辭，所聞異辭，所傳聞異辭</nav></header><main><article><h1>所見異辭，所聞異辭，所傳聞異辭</h1><p>《春秋》記事遠近之辭異，乃祖之所逮聞也。</p><p>《春秋》何以始乎隱？祖之所逮聞也。所见异辞，所闻异辞，所传闘异辞。君子何由知其然？蓋有所見者，則其辭詳；所聞者，其辭約；所傳闘者，其辭略。隱公而上，遠矣，則皆傳闘之辭也。於所見之世，恩義隆重，故錄其詳；於所聞之世，恩義殺矣，故錄其略；於傳闘之世，恩義又殺，故辭又略。此聖人所以寓襃貶於文字之際也。</p><p><strong>所出</strong>：《春秋公羊傳 · 哀公》 — https://zh.wikisource.org/wiki/春秋公羊傳/哀公</p></article></main></div></div>
