    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 王長</nav></header><main><article><h1>王長</h1><p>從真人學道，佐師煉丹，九鼎功成，白日飛昇。</p><p>真人王長，不知何所人也，從[[張正一真人]]學。真人往雲錦山，散群弟子，惟王長習天文，通黃老，留侍左右。長遂負書行歌，同真人往雲錦山，日侍真人。服丹戰鬼，積行累功。後於渠亭山，真人一日指長曰：「惟爾累世種善，宿有仙骨，可與成就矣。」遂盡得真人九鼎之要，白日飛昇。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 19》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/19</p></article></main></div></div>
