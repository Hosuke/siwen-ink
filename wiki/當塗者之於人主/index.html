    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 當塗者之於人主</nav></header><main><article><h1>當塗者之於人主</h1><p>當塗者希不信愛、又且習故，以迎合主心而進。</p><p>凡當塗者之於人主也，希不信愛也，又且習故。若夫即主心，同乎好惡，固其所自進也。</p><p>當塗之人官爵貴重，朋黨又衆，而一國爲之訴訟。則法術之士欲干上者，非有所信愛之親、習故之澤也。</p><p><strong>所出</strong>：《韓非子 · 孤憤》 — https://zh.wikisource.org/wiki/韓非子/孤憤</p></article></main></div></div>
