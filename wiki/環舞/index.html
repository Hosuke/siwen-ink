    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 環舞</nav></header><main><article><h1>環舞</h1><p>物不欺人，人自惑之；唯清靜者物不能欺。</p><p>作環舞者宮室皆轉，瞰回流者頭目自旋。非宮室之幻惑也，而人自惑之；非回流之改變也，則人自變之。是故粉巾為兔，樂石為馬，而人不疑；甘言巧笑，圖臉畫眉，而人不知。唯清靜者，物不能欺。</p><p><strong>所出</strong>：《化書 · 卷一》 — https://zh.wikisource.org/wiki/化書/卷一</p></article></main></div></div>
