    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 詩者志之所之</nav></header><main><article><h1>詩者志之所之</h1><p>詩發乎情志，聲成文而為音，與政相通，詩有六義焉。</p><p>詩者，志之所之也。在心為志，發言為詩。情動於中而形於言，言之不足，故嗟嘆之；嗟嘆之不足，故永歌之；永歌之不足，不知手之舞之、足之蹈之也。</p><p>情發於聲，聲成文謂之音。治世之音安以樂，其政和；亂世之音怨以怒，其政乖；亡國之音哀以思，其民困。</p><p>故正得失，動天地，感鬼神，莫近於詩。先王以是經夫婦，成孝敬，厚人倫，美教化，移風俗。故詩有六義焉：一曰風，二曰賦，三曰比，四曰興，五曰雅，六曰頌。</p><p><strong>所出</strong>：《詩經 · 序》 — https://zh.wikisource.org/wiki/詩經/序</p></article></main></div></div>
