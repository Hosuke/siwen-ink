    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 克明克類</nav></header><main><article><h1>克明克類</h1><p>能明是非善惡，別類而治也。</p><p>克明克類，言王季之德能明察是非，又能分別善惡之類也。《皇矣》曰：「維此王季，帝度其心，貊其德音，其德克明。克明克類，克長克君。」明者，洞悉幽微也；類者，分別黑白也。唯其心能明，故能分辨善類惡類，以之為長為君，治大邦而民順比也。王季之德如是，故能光大其宗，為文王之父，而受命有天下也。</p><p><strong>所出</strong>：《詩經 · 皇矣》 — https://zh.wikisource.org/wiki/詩經/皇矣</p></article></main></div></div>
