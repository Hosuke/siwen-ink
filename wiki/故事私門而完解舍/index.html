    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 故事私門而完解舍</nav></header><main><article><h1>故事私門而完解舍</h1><p>民趨私門而避戰爭，求安利而辟危窮；工商游食之民多而名卑，此皆由於趨利避害之情。</p><p>民之政計，皆就安利如辟危窮。今爲之攻戰，進則死於敵，退則死於誅，則危矣。弃私家之事而必汗馬之勞，家困而上弗論，則窮矣。窮危之所在也，民安得勿避？故事私門而完解舍，解舍完則遠戰，遠戰則安。行貨賂而襲當塗者則求得，求得則私安，私安則利之所在，安得勿就？是以公民少而私人衆矣。</p><p><strong>所出</strong>：《韓非子 · 五蠹》 — https://zh.wikisource.org/wiki/韓非子/五蠹</p></article></main></div></div>
