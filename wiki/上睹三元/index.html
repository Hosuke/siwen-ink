    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 上睹三元</nav></header><main><article><h1>上睹三元</h1><p>仰觀三元，光若連珠，洞照九野。</p><p>上睹三元如連珠，言人之上視三元之星，若連珠之明，昭朗光煥，照於九隅也。三元者，上中下三元之炁，洞照幽遐，無幽不燭。修真者仰觀天光，凝神內視，則三元朗徹，如珠相貫，萬象咸觀矣。</p><p><strong>所出</strong>：《黃庭內景經 · 上睹章第十六》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/上睹章第十六</p></article></main></div></div>
