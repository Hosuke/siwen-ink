    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 善歌使人繼其聲</nav></header><main><article><h1>善歌使人繼其聲</h1><p>善教者使人樂於傳承其志，如善歌者使人繼其聲。</p><p>善歌者使人繼其聲，善教者使人繼其志。</p><p>歌者之善，不在聲音之美也，在能使聽者樂之而欲效之也。教者之善，不在言語之博也，在能使學者慕之而欲踐之也。</p><p>其言也約而達，微而臧，罕譬而喻。可謂繼志矣。言約則不繁，達則不窒，微臧則不淺露，罕譬則不瑣碎。此善教之符驗也。學者既能樂之慕之，又得是言以啟之，則志有不繼者乎？</p><p><strong>所出</strong>：《禮記 · 學記》 — https://zh.wikisource.org/wiki/禮記/學記</p></article></main></div></div>
