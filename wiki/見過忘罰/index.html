    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 見過忘罰</nav></header><main><article><h1>見過忘罰</h1><p>君子見過則忘罰以進諫，見賢則忘賤以能讓，見不足則忘貧以能施。</p><p>君子見過忘罰，故能諫；見賢忘賤，故能讓；見不足忘貧，故能施。情系於中，行形於外。凡行戴情，雖過無怨；不戴其情，雖忠來惡。</p><p><strong>所出</strong>：《淮南子 · 繆稱訓》 — https://zh.wikisource.org/wiki/淮南子/繆稱訓</p></article></main></div></div>
