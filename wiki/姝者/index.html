    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 姝者</nav></header><main><article><h1>姝者</h1><p>美好之人。詩中指賢者而言，問何以禮之。</p><p>姝者，美麗之人也。《干旄》三章皆言「彼姝者子」，蓋指賢者而言。子者，男子之美稱；姝者，容貌之美盛。詩人稱賢者為姝者，非徒美其容色，實美其德行也。</p><p>何以知之？序云「多好善賢者」，則所訪之人，善與賢也。善賢之人，德盛而行美，故詩人以姝言之。然則姝者，非色美之謂，乃德美之稱也。詩人見其德之美，發而為詩，故以美辭稱之。</p><p><strong>所出</strong>：《詩經 · 干旄》 — https://zh.wikisource.org/wiki/詩經/干旄</p></article></main></div></div>
