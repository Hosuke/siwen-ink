    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 南宫敬子問季孫養士</nav></header><main><article><h1>南宫敬子問季孫養士</h1><p>在所與居非在所與謀</p><p>一曰：南宫敬子問顔涿聚曰：「季孫養孔子之徒，所朝服與坐者以十數而遇賊，何也？」曰：「昔周成王近優侏儒以逞其意，而與君子斷事，是能成其欲於天下。今季孫養孔子之徒，所朝服而與坐者以十數，而與優侏儒斷事，是以遇賊。故曰：不在所與居，在所與謀也。」</p><p>顔涿聚答南宫敬子之問，謂季孫養士而遇賊，以所與謀者非其人。故曰：不在所與居，在所與謀也。</p><p><strong>所出</strong>：《韓非子 · 外儲說左下》 — https://zh.wikisource.org/wiki/韓非子/外儲說左下
===孫叔敖===</p></article></main></div></div>
