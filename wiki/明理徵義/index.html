    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 明理與徵義</nav></header><main><article><h1>明理與徵義</h1><p>明理引乎成辭，徵義舉乎人事</p><p>然則明理引乎成辭，徵義舉乎人事，乃聖賢之鴻謨，經籍之通矩也。</p><p>明理者，取古聖先賢已成之言辭，以明義理，如盤庚之誥民，敘遲任之言，全引成辭，是也。徵義者，舉古人之行事，以證明義理，如文王引《易》爻位，稱高宗伐、箕子貞，屬之人事，是也。</p><p>二者皆援古以證今，而用各有當，不可偏廢也。</p><p><strong>所出</strong>：《文心雕龍 · 事類》 — https://zh.wikisource.org/wiki/文心雕龍/事類</p></article></main></div></div>
