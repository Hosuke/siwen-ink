    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 尚書</nav></header><main><article><h1>尚書</h1><p>六經之一，記上古帝王之言行，孔子所編，為政事之要典。</p><p>尚書者，孔子所述之上古帝王政典也。書序云「將遜于位」「歷試諸難」「湯始居亳」「武王伐殷」，皆其所述之大事。</p><p>尚書之義有二：一者「上古之書」，二者「書其政事」。尚書書序備列百篇之目，述其作者與作意，如堯禪天下、湯伐夏桀、武王誅紂、周公營洛，皆所以垂法後世也。</p><p><strong>所出</strong>：《尚書 · 書序》 — https://zh.wikisource.org/wiki/尚書/書序</p></article></main></div></div>
