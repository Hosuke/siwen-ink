    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 見寑石以為伏虎</nav></header><main><article><h1>見寑石以為伏虎</h1><p>冥行之人，蔽於暗中，疑石為虎。</p><p>冥冥而行者，見寑石以為伏虎也，見植林以為後人也：冥冥蔽其明也。醉者越百步之溝，以為蹞步之澮也；俯而出城門，以為小之閨也：酒亂其神也。</p><p><strong>所出</strong>：《荀子 · 解蔽篇》 — https://zh.wikisource.org/wiki/荀子/解蔽篇</p></article></main></div></div>
