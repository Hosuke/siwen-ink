    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 惟聽用德</nav></header><main><article><h1>惟聽用德</h1><p>選賢授官，一惟德是視，不問其門地與舊屬。</p><p>周公戒殷多士曰：「予一人惟聽用德，肆予敢求爾于天邑商。」殷人嘗以夏士在王朝者為言，欲援以自解。周公辭之曰：夏之所以亡，由於弗克庸帝、大淫泆有辭，其臣不能救過；殷之所以亡，由於後嗣王誕罔顯于天，肆淫厥泆。先王之臣猶有在者，湯之舊臣不能延商之命，周之用人豈問所從來乎？惟德是聽者，不以殷、夏、周別，不以故、新分，一準乎能用德與否。此周家所以一天下者，選賢之正道也。</p><p><strong>所出</strong>：《尚書 · 多士》 — https://zh.wikisource.org/wiki/尚書/多士</p></article></main></div></div>
