    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 壽陵匍匐</nav></header><main><article><h1>壽陵匍匐</h1><p>效顰不成，反失本步</p><p>[[連珠]]之擬者，欲穿明珠，多貫魚目。</p><p>壽陵少年學步邯郸，未得其利，而失其故步。[[連珠]]之濫，作者之通弊也。</p><p><strong>所出</strong>：《文心雕龍 · 雜文》 — https://zh.wikisource.org/wiki/文心雕龍/雜文</p></article></main></div></div>
