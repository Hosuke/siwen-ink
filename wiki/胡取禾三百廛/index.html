    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 胡取禾三百廛</nav></header><main><article><h1>胡取禾三百廛</h1><p>反詰在位者取民之粟何以如此之多，以見剝削之甚。</p><p>胡取禾三百廛，胡取禾三百億，胡取禾三百囷。廛，束也；億，束也；囷，稊也。皆言禾粟之數。三章迭言其多，以見在位者斂之無度。民力有限，而在上者取之無窮，此所以為詩人所刺也。</p><p>後世以「三百廛」言橫徵暴斂之甚，又以「三百億」言剝削之廣，皆本此詩之意。</p><p><strong>所出</strong>：《詩經 · 伐檀》 — https://zh.wikisource.org/wiki/詩經/伐檀</p></article></main></div></div>
