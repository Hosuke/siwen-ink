    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蒯成侯</nav></header><main><article><h1>蒯成侯</h1><p>周緤封蒯成侯，帝嘉其忠心，許入殿門不趨。</p><p>蒯成侯緤，沛人，姓周氏。以舍人從起沛，常為高祖參乘，東絕甬道，從出度平陰。高祖十二年封蒯成侯，食邑三千三百户。上欲自擊陳豨，緤泣曰：「今上常自行，是為無人可使者乎？」上以為愛我，賜入殿門不趨，殺人不死。孝文五年以壽終，謚贞侯。子昌嗣，有罪國除。景帝中二年，封緤子居代侯。居後為太常，國除。</p><p><strong>所出</strong>：《史記 · 卷098》 — https://zh.wikisource.org/wiki/史記/卷098</p></article></main></div></div>
