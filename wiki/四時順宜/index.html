    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 四時順宜</nav></header><main><article><h1>四時順宜</h1><p>四時各有宜，若與炁相得則剛柔正而五行諧。</p><p>四時順宜，與炁相得。剛柔斷矣，不相涉入。五行守界，不妄盈縮。易行周流，屈伸反覆。</p><p>四時者，春夏秋冬也；宜者，各有其時也。[[動靜有常]]，奉其繩墨，則四時之序不紊，而與炁相得。剛者陽也，柔者陰也，各安其分，不相越也。[[五行]]者，木火土金水也，各守其界，無妄盈縮。[[易]]者，聖人所以範圍天地之道具也，周流六虛，屈伸往來，終始迭運。</p><p><strong>所出</strong>：《周易參同契 · 17章》 — https://zh.wikisource.org/wiki/周易參同契/17章</p></article></main></div></div>
