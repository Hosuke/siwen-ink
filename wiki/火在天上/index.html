    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 火在天上</nav></header><main><article><h1>火在天上</h1><p>火高照而天下明，盛大之象。</p><p>《大有》之象，上離下乾。離為火，乾為天。火居天上，光被四表，無幽不燭，是為盛大富有之象。君子觀此象，乃知遏止邪惡、弘揚善道，乃順天休美之命也。</p><p><strong>所出</strong>：《周易 · 大有》 — https://zh.wikisource.org/wiki/周易/大有</p></article></main></div></div>
