    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 姜伯真</nav></header><main><article><h1>姜伯真</h1><p>猛山遇僊，誨以服石腦，遂得道。</p><p>姜伯真者，不知何許人也。少好道，在猛山採藥，忽值仙人史伯真。平立日中，背後觀之，其心不正。仙人曰：「勤學之至，而不知心之不正為失。」因教之服石腦。石腦色班柔軟，形如小石，處所皆有。久服身熱而不渴，後遂得仙。繁陽子服之，亦得道。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 22》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/22</p></article></main></div></div>
