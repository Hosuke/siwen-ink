    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 本味</nav></header><main><article><h1>本味</h1><p>求事之本，則功名立；求味之本，則至膳具。</p><p>求之其本，經旬必得；求之其末，勞而無功。功名之立，由事之本也，得賢之化也。非賢其孰知乎事化？故曰其本在得賢。</p><p>求味亦然。商書有之：「凡味之本，水最為始。五味三材，九沸九變，火為之紀。時疾時徐，滅腥去臊除羶，必以其勝，無失其理。」是故天子欲具至味者，必先知道。道者止彼在己，己成而天子成，天子成則至味具。</p><p>是故聖人之道，要矣，豈越越多業哉！審近所以知遠也，成己所以成人也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十四》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十四</p></article></main></div></div>
