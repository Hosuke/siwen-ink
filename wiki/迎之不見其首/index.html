    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 迎之不見其首</nav></header><main><article><h1>迎之不見其首</h1><p>道無終始，不可迎隨。</p><p>[[惚恍]]之道，迎之不見其首，隨之不見其後，[[道紀]]之所以為紀也。第十四章以視聽不可及言道之妙，以迎隨不見言道之虚，以[[執古御今]]言道之用，而[[道紀]]總其義。</p><p><strong>所出</strong>：《道德經 (王弼本) · 十四章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
