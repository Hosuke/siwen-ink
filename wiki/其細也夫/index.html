    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 其細也夫</nav></header><main><article><h1>其細也夫</h1><p>不肖者自小，然大者反似不肖</p><p>天下皆謂[[我]]大似不肖。肖者，像也。天下以為我大而似無所像，言其德大而物莫能形似也。夫唯大，故似不肖；若肖久矣，其細也夫。言大聖之人，恢恢廣博，無形可名；小人守區區之小智，以為有肖，而不知其狹隘之甚，是乃真細者也。</p><p>茲申[[三要]]之旨，[[慈]]者所以成其大，[[儉]]者所以廣其用，不敢為[[天下先]]者所以全其身。忘其大而慕其細，是天下之通患也。</p><p><strong>所出</strong>：《老子河上公章句 · 三寶》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
