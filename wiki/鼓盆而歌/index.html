    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鼓盆而歌</nav></header><main><article><h1>鼓盆而歌</h1><p>莊子妻死，箕踞鼓盆而歌，以為生死如四時行焉。</p><p>莊子妻死，惠子弔之，莊子則方箕踞鼓盆而歌。</p><p>惠子曰：「與人居，長子老身，死不哭亦足矣，又鼓盆而歌，不亦甚乎！」</p><p>莊子曰：「不然。是其始死也，我獨何能無概然！察其始而本無生，非徒無生也，而本無形，非徙無形也而本無氣。雜乎芒芴之間，變而有氣，氣變而有形，形變而有生。今又變而之死。是相與為春秋冬夏四時行也。人且偃然寢於巨室，而我噭噭然隨而哭之，自以為不通乎命，故止也。」</p><p><strong>所出</strong>：《莊子 · 至樂》 — https://zh.wikisource.org/wiki/莊子/至樂</p></article></main></div></div>
