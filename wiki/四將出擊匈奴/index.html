    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 四將出擊匈奴</nav></header><main><article><h1>四將出擊匈奴</h1><p>衞青為車騎將軍，公孫賀為輕車將軍，公孫敖為騎將軍，李廣為驍騎將軍，四將各將萬騎，分道出擊匈奴。</p><p>青為車騎將軍，擊匈奴，出上谷；太僕公孫賀為輕車將軍，出雲中；大中大夫公孫敖為騎將軍，出代郡；衞尉李廣為驍騎將軍，出雁門：軍各萬騎。</p><p><strong>所出</strong>：《史記 · 卷111》 — https://zh.wikisource.org/wiki/史記/卷111</p></article></main></div></div>
