    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 建安風骨</nav></header><main><article><h1>建安風骨</h1><p>建安詩歌慷慨任氣、磊落使才之風也。</p><p>「暨建安之初，五言騰踊，文帝陳思，縱轡以騁節；王徐應劉，望路而爭驅。並憐風月，狎池苑，述恩榮，敘酣宴，慷慨以任氣，磊落以使才；造懷指事，不求纖密之巧；驅辭逐貌，唯取昭晰之能。」此建安風骨之大概也。後世言詩，必宗此格。</p><p><strong>所出</strong>：《文心雕龍 · 明詩》 — https://zh.wikisource.org/wiki/文心雕龍/明詩</p></article></main></div></div>
