    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無是公</nav></header><main><article><h1>無是公</h1><p>相如所述寓言人物，無是此人，乃明天子之義，斥齊楚之奢靡。</p><p>「無是公」者，無是人也，明天子之義。故空藉此三人為辭，以推天子諸侯之苑囿。其卒章歸之於節儉，因以風諫。</p><p><strong>所出</strong>：《史記 · 卷117》 — https://zh.wikisource.org/wiki/史記/卷117</p></article></main></div></div>
