    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 亡國之主必自驕</nav></header><main><article><h1>亡國之主必自驕</h1><p>亡國之主必自驕、自智、輕物，三者皆致壅塞。</p><p>亡國之主，必自驕，必自智，必輕物。自驕則簡士，自智則專獨，輕物則無備。無備召禍，專獨位危，簡士壅塞。欲無壅塞必禮士，欲位無危必得眾，欲無召禍必完備。三者人君之大經也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十</p></article></main></div></div>
