    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 冬至為德，夏至為刑</nav></header><main><article><h1>冬至為德，夏至為刑</h1><p>冬至陽氣萌而德在室，夏至陰氣萌而刑在野。</p><p>日冬至則斗北中繩，陰氣極，陽氣萌，故曰冬至為德。日夏至則斗南中繩，陽氣極，陰氣萌，故曰夏至為刑。陰氣極，則北至北極，下至黃泉，故不可以鑿地穿井。萬物閉藏，蟄蟲首穴，故曰德在室。陽氣極，則南至南極，上至朱天，故不可以夷丘上屋。萬物蕃息，五穀兆長，故曰德在野。日冬至則水從之，日夏至則火從之。</p><p><strong>所出</strong>：《淮南子 · 天文訓》 — https://zh.wikisource.org/wiki/淮南子/天文訓</p></article></main></div></div>
