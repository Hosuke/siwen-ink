    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 濡弱謙下</nav></header><main><article><h1>濡弱謙下</h1><p>以柔弱謙遜為外儀也。</p><p>建之以常無有，主之以太一，以<strong>濡弱謙下</strong>為表，以空虛不毀萬物為實。</p><p>老耼曰：「知其雄，守其雌，為天下谿；知其白，守其辱，為天下谷。」人皆取先，己獨取後，曰受天下之垢；人皆取實，己獨取虛，无藏也故有餘，巋然而有餘。</p><p><strong>所出</strong>：《莊子 · 天下》 — https://zh.wikisource.org/wiki/莊子/天下</p></article></main></div></div>
