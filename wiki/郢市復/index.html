    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 郢市復</nav></header><main><article><h1>郢市復</h1><p>孫叔敖一言而郢都市場恢復如故</p><p>楚莊王以幣輕令民不便，市肆紊亂。孫叔敖言之王，三日而市復如故。太史公贊曰「孫叔敖出一言，郢市復」，言善政感人之速如此。</p><p><strong>所出</strong>：《史記 · 卷119》 — https://zh.wikisource.org/wiki/史記/卷119</p></article></main></div></div>
