    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 粲</nav></header><main><article><h1>粲</h1><p>精米也。言饔飧之美者，引伸為禮物之稱。</p><p>粲，精米之名。引伸之，則為美食之總稱。《緇衣》云「還，予授子之粲兮」，所謂粲者，蓋以精米為禮，遺使之歸也。</p><p>粲字從米從𣎡，𣎡者，散之義。精米散而不糴，故名粲。《鄭風·狡童》云「維子之故，使我不能餐兮」，亦與「授粲」之事相類，皆好賢之意也。</p><p><strong>所出</strong>：《詩經 · 緇衣》 — https://zh.wikisource.org/wiki/詩經/緇衣</p></article></main></div></div>
