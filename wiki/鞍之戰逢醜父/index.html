    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鞍之戰逢醜父代頃公</nav></header><main><article><h1>鞍之戰逢醜父代頃公</h1><p>齊將逢醜父代頃公受縛，頃公因以脫歸。</p><p>鞍之戰，齊師敗績。晉郤克獲齊頃公。頃公之車右逢醜父者，面目與頃公相似，衣服與頃公相似，代頃公當左。頃公取飲，操飲而至，曰：「革取清者。」頃公用是佚而不反。</p><p>郤克曰：「欺三軍者，其法奈何？」曰：「法斮。」於是斮逢醜父。</p><p>逢醜父既被獲，時人謂之「佚獲」，以其代替頃公而被誤擒也。</p><p><strong>所出</strong>：《春秋公羊傳 · 成公》 — https://zh.wikisource.org/wiki/春秋公羊傳/成公</p></article></main></div></div>
