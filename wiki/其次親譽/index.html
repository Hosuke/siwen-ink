    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 其次親譽</nav></header><main><article><h1>其次親譽</h1><p>德稍衰而下親附，澤厚則民譽生。</p><p>太上而降其次，則治化稍遜，民得以情親之矣。恩澤洽於民心，美譽流於口實。及乎親之譽之，則德之薄者所為，非上德之旨也。</p><p><strong>所出</strong>：《老子河上公章句 · 淳風》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p><hr><p>治道降其次者，仁政以德義化民，民皆親附而譽美之。然而親譽之者，機心已萌，非若太上下知之世，民渾然不知有君也。此由無為趨於有為，德治之澤也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 十七章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
