    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 其名不去</nav></header><main><article><h1>其名不去</h1><p>道之德名自古至今，未嘗離去</p><p>自古及今，其名不去。[[道之為物]]在於怳忽，而其名未嘗消亡。[[道通其分]]，[[道終不可得]]，然其名之在人心，如水之在地中，無往而不在。自有天地以來，聖人傳[[道寓]]之旨，萬物稟受其精，皆由道名之不去也。[[名可強立]]而實不可廢，道之謂歟。</p><p><strong>所出</strong>：《老子河上公章句 · 虛心》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
