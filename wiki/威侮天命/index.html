    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 威侮天命</nav></header><main><article><h1>威侮天命</h1><p>有苗輕蔑天道，干犯天命。</p><p>禹誓師有苗之罪，首曰「威侮天命」。夫天者，萬物之主宰；命者，福祿之所稟。有苗慢天虐民，是自干天討也。禹以為此師出有名，故能恭行天罰，聲罪致討。</p><p><strong>所出</strong>：《尚書 · 禹誓》 — https://zh.wikisource.org/wiki/尚書/禹誓</p></article></main></div></div>
