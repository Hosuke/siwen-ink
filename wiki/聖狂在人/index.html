    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖狂在人</nav></header><main><article><h1>聖狂在人</h1><p>聖狂之分，不在稟賦，而在念與不念。</p><p>惟聖罔念作狂，惟狂克念作聖。言者聖與狂，非生稟之殊，乃在一念之間。聖人而不思，則昏昧為狂；狂夫而克念，則通達為聖。是故明者不可以自恃，昧者不可以自棄；念與不念，實繫於我，非由於天也。</p><p><strong>所出</strong>：《尚書 · 多方》 — https://zh.wikisource.org/wiki/尚書/多方</p></article></main></div></div>
