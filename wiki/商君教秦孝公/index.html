    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 商君教秦孝公</nav></header><main><article><h1>商君教秦孝公</h1><p>商鞅教孝公行連坐、焚詩書、明法令、禁游宦之法，秦以富強。</p><p>商君教秦孝公以連什伍，設告坐之過，燔詩書而明法令，塞私門之請而遂公家之勞，禁游宦之民而顯耕戰之士。孝公行之，主以尊安，國以富強，八年而薨，商君車裂於秦。</p><p>商鞅之教，要在以法一之。連什伍則民相監，設告坐則姦不容，燔詩書則思想歸一，塞私門則公義張，禁游宦則民務本，顯耕戰則賞罰明。此秦之所以致富強者也。然孝公不能用終，商鞅竟以車裂死，其法存而其人亡，悲夫！</p><p><strong>所出</strong>：《韓非子 · 和氏》 — https://zh.wikisource.org/wiki/韓非子/和氏</p></article></main></div></div>
