    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 芻豢悅口</nav></header><main><article><h1>芻豢悅口</h1><p>肥甘不足以言樂，必以民心為樂</p><p>梁惠王立沼上，顧鴻雁麋鹿，問賢者亦樂此乎？孟子對曰：賢者而後樂此，不賢者雖有此，不樂也。文王以民力為台為沼，而民歡樂之，[[與民偕樂]]故能樂。反之，暴君雖有[[靈囿]]、台池、鳥獸，終陷於民怨，不可得而樂。是故樂在於得民之心，不在於芻豢之奉口體也。</p><p><strong>所出</strong>：《孟子 · 梁惠王上》 — https://zh.wikisource.org/wiki/孟子/梁惠王上</p></article></main></div></div>
