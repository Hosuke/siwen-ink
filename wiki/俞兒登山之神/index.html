    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 俞兒登山之神</nav></header><main><article><h1>俞兒登山之神</h1><p>登山之神俞兒，見霸王之君而走馬前疾，袪衣示有水，右袪衣示從右涉。</p><p>管仲言登山之神有俞兒者，長尺而人物具焉，霸王之君興而神見，走馬前疾，袪衣示前有水，右袪衣示從右方涉。此山川之應，可以測吉凶也。</p><p><strong>所出</strong>：《管子 · 第51篇小問》 — https://zh.wikisource.org/wiki/管子/第51篇小問</p></article></main></div></div>
