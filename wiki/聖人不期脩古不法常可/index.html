    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖人不期脩古不法常可</nav></header><main><article><h1>聖人不期脩古不法常可</h1><p>聖人治世，不貴循古，不拘常法，隨世而變，因事而備。</p><p>是以聖人不期脩古，不法常可，論世之事，因爲之備。宋人有耕田者，田中有株，兔走觸株，折頸而死，因釋其耒而守株，冀復得兔，兔不可復得，而身爲宋國笑。今欲以先王之政，治當世之民，皆守株之類也。</p><p><strong>所出</strong>：《韓非子 · 五蠹》 — https://zh.wikisource.org/wiki/韓非子/五蠹</p></article></main></div></div>
