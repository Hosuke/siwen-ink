    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 載衣之裳</nav></header><main><article><h1>載衣之裳</h1><p>男子生則衣之裳。</p><p>[[載衣之裳]]者，言生男子則衣之以裳也。裳，下體之衣裙。男子初生，即衣之以裳，與女子之衣裼異也。詩云「乃生男子，載衣之裳」，見古人因性別不同而有異制之禮。</p><p><strong>所出</strong>：《詩經 · 斯干》 — https://zh.wikisource.org/wiki/詩經/斯干</p></article></main></div></div>
