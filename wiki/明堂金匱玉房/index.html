    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 明堂金匱玉房</nav></header><main><article><h1>明堂金匱玉房</h1><p>胸中三處皆神所棲，明察儲藏安宅各有司。</p><p>明堂金匱玉房者，胸中三部之總名也。《經》曰「明堂金匱玉房間，上清真人當吾前」，言三者相距不遠，真人羅列於前。明堂在鼻下、主神光照察，金匱在胸側之傍、主精氣儲藏，玉房在心、主君臣安宅。三者皆胸臆要地，神將所聚之處。修煉者心存明堂則神智清明，守金匱則精氣充實，安玉房則心君泰定。上清真人列侍其間，稟太上之敎以傳心印，故修真者必先行於此三處也。</p><p><strong>所出</strong>：《黃庭內景經 · 靈臺章第十七》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/靈臺章第十七</p></article></main></div></div>
