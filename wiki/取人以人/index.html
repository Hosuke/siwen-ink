    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 取人以人</nav></header><main><article><h1>取人以人</h1><p>取人者以人為的去之亦以人，所行者與所不行者皆在人。</p><p>客辭祿千鍾而不仕，曰：「臣聞取人以人者，其去人也亦用人。吾不仕矣。」蓋以人取人者，亦以人失人，所貴在得其心耳。</p><p><strong>所出</strong>：《管子 · 第51篇小問》 — https://zh.wikisource.org/wiki/管子/第51篇小問</p></article></main></div></div>
