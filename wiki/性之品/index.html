    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 性之品有三</nav></header><main><article><h1>性之品有三</h1><p>韓愈言性三品，荀子則言性本惡而可化為善。</p><p>[[性之品]]之說，後儒多有論列。荀子以為性本惡，而[[聖人化性起僞]]，可使[[塗之人可以為禹]]。韓愈作《性原》，分性為上中下三品，上焉者善而已，中焉者可道而上下，下焉者惡焉而已。此[[才性有優劣]]之辨，與[[性善]]之說異趣，與[[性惡]]之說亦殊途。要之，性與[[僞]]之分，[[為學]]之功，不可廢也。</p><p><strong>所出</strong>：《荀子 · 性惡篇》 — https://zh.wikisource.org/wiki/荀子/性惡篇</p></article></main></div></div>
