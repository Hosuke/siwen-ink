    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 上弦兌數八下弦艮亦八</nav></header><main><article><h1>上弦兌數八下弦艮亦八</h1><p>上弦法兌數八，下弦法艮數八，二八合一斤。</p><p>上弦象月盈之二八日，取法於兌，兌數澤而象金，其數八；下弦象月晦之二八日，取法於艮，艮數山而象土，其數亦八。</p><p>二弦之數各八，合之成一斤之數，正[[乾坤體乃成]]之象也。[[偃月法]]以月之盈闕取象，正合此義。月盈上弦，火候漸盛；月晦下弦，火候漸退。進退之間，各有八日，合而成一斤之全功。[[火計]]之妙，於此可見。</p><p><strong>所出</strong>：《周易參同契 · 09章》 — https://zh.wikisource.org/wiki/周易參同契/09章</p></article></main></div></div>
