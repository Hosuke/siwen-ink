    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 少事長賤事貴</nav></header><main><article><h1>少事長賤事貴</h1><p>少事長賤事貴，共帥時</p><p>少事長，賤事貴，共帥時。</p><p>在父母舅姑之所，有命之，應唯敬對。進退周旋慎齊，升降出入揖游，不敢噦噫、嚏咳、欠伸、跛倚、睇視，不敢唾洟；寒不敢襲，癢不敢搔。</p><p><strong>所出</strong>：《禮記 · 內則》 — https://zh.wikisource.org/wiki/禮記/內則</p></article></main></div></div>
