    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 定所白與不定所白</nav></header><main><article><h1>定所白與不定所白</h1><p>白者不定所白，可通萬物；白馬言白，定所白也，非白之本体。</p><p>「白者不定所白，忘之而可也。」言白之為名，本無定所指，舉天下之物，白皆可以言之，故學者可以淡然忘懷。</p><p>「白馬者言白，定所白也。定所白者，非白也。」言白馬之白，乃定著於白馬之一物，非復通性之白矣。白不定所白，猶水可盛於任何器；白馬之白，則如盛於特定之甕，非水之本性也。此公孫龍所以明白馬之異於馬，亦異於孤白也。</p><p><strong>所出</strong>：《公孫龍子 · 2》 — https://zh.wikisource.org/wiki/公孫龍子/2</p></article></main></div></div>
