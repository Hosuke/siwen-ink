    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 无妄之災</nav></header><main><article><h1>无妄之災</h1><p>禍自天降，非人之愆。</p><p>无妄之災者，爻辭所謂「无妄之災，或系之牛，行人之得，邑人之災」是也。牛系於斯，行人取之而去，居者無故而被詰捕之累，此豈人之罪哉？時數之適然，天道之偶然，不可測也。《象》曰「行人得牛，邑人災也」，明其不然於己也君子觀此，知道德之修，不足免造化之變；亦知吉凶之來，非盡由於善惡，故不以小災而改其守焉。</p><p><strong>所出</strong>：《周易 · 无妄》 — https://zh.wikisource.org/wiki/周易/无妄</p></article></main></div></div>
