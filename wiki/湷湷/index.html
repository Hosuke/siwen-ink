    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 湷湷</nav></header><main><article><h1>湷湷</h1><p>混沌渾樸，道之真也</p><p>湷湷者，混沌渾樸之貌。</p><p>帛書云：「湷湷呵，鬻人昭昭，我獨呵。」通行本「沌沌呵」。湷湷者，水之濁也，借以喻道體之渾淪未剖、返樸歸真。</p><p>昭昭者，智巧外露；湷湷者，愚樸內守。聖人所以異於人者，以其渾沌若濁，不以察察自矜也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第六十四章 食母》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
