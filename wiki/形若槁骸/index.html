    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 形若槁骸</nav></header><main><article><h1>形若槁骸</h1><p>至人忘形抱神，與萬物為一</p><p>被衣行歌而去，述至人之德曰：「形若槁骸，心如死灰。直實不知，以故自持。墨墨恢恢，無心可與謀。」形骸若枯，心神若滅，無知無欲，此至人之遊也。</p><p><strong>所出</strong>：《淮南子 · 道應訓》 — https://zh.wikisource.org/wiki/淮南子/道應訓</p></article></main></div></div>
