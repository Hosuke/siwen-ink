    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 崇侯比干知與不知</nav></header><main><article><h1>崇侯比干知與不知</h1><p>聖人知心事兼備，賢者各執一偏。</p><p>崇侯、惡來知不適紂之誅也，而不見武王之滅之也。比干、子胥知其君之必亡也，而不知身之死也。故曰：「崇侯、惡來知心而不知事，比干、子胥知事而不知心。」聖人其備矣。</p><p><strong>所出</strong>：《韓非子 · 說林下》 — https://zh.wikisource.org/wiki/韓非子/說林下</p></article></main></div></div>
