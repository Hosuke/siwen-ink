    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 禮樂獨行</nav></header><main><article><h1>禮樂獨行</h1><p>聖王制禮樂以和節民情</p><p>聖王知民情之易動，故作樂以和之，制禮以節之。在下者不得用其私，故禮樂獨行。禮樂獨行，則私欲寢廢；私欲寢廢，則遭賢之與遭愚均矣。</p><p><strong>所出</strong>：《尹文子 · 大道上》 — https://zh.wikisource.org/wiki/尹文子/大道上</p></article></main></div></div>
