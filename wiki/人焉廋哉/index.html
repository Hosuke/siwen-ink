    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 人焉廋哉</nav></header><main><article><h1>人焉廋哉</h1><p>觀人者，視其作爲，觀其所由，察其所安，人何所隱匿。</p><p>《論語》載孔子之言曰：「視其所以，觀其所由，察其所安，人焉廋哉！人焉廋哉！」言觀人之法有三：視其所爲之事，觀其所行之由，察其所安之處。循是以觀，則人之賢否善惡，無能遁也。廋者，匿也。聖人以此教人知人也。</p><p><strong>所出</strong>：《論語 · 爲政第二》 — https://zh.wikisource.org/wiki/論語/爲政第二</p></article></main></div></div>
