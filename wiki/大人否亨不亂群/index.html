    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大人否亨不亂群</nav></header><main><article><h1>大人否亨不亂群</h1><p>大人守正而否塞，不為小人群類所亂</p><p>大人否，亨。不亂群也。</p><p>六二爻辭「包承，小人吉，大人否」，象辭以為：大人雖不得志，守正而不通，然其心不為小人群類所亂，是以終得亨通也。</p><p><strong>所出</strong>：《周易 · 否》 — https://zh.wikisource.org/wiki/周易/否</p></article></main></div></div>
