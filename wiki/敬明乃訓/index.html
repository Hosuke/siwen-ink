    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 敬明乃訓</nav></header><main><article><h1>敬明乃訓</h1><p>敬謹修明汝之教誡，奉承先王之道也。</p><p>爾惟敬明乃訓，用奉若于先王。言汝當敬明汝訓，奉承以順先王也。</p><p><strong>所出</strong>：《尚書 · 君牙》 — https://zh.wikisource.org/wiki/尚書/君牙</p></article></main></div></div>
