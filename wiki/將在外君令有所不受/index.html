    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 將在外君令有所不受</nav></header><main><article><h1>將在外君令有所不受</h1><p>將帥統兵於外，雖君命亦可不受，以軍法從事也。</p><p>將帥受命出征，屯於軍中，則國君之令可以不受。蓋兵者，國之大事，機宜瞬息萬變，若事事稟命，必失戎機。穰苴之言曰：「將在軍，君令有所不受。」及其為將，景公遣使馳入軍中赦莊賈，穰苴竟以軍法斬其僕、御、左驂，而不赦使者。遂遣使還報，乃自行軍事。此以見軍中號令之嚴、將權之重，不可以君命撓之也。</p><p><strong>所出</strong>：《史記 · 卷064》 — https://zh.wikisource.org/wiki/史記/卷064</p></article></main></div></div>
