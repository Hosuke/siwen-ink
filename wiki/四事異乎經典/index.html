    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 四事異乎經典</nav></header><main><article><h1>四事異乎經典</h1><p>《離騷》有詭異之辭、譎怪之談、狷狹之志、荒淫之意，四事異乎經典。</p><p>至於託雲龍，說迂怪，豐隆求宓妃，鴆鳥媒娀女，詭異之辭也；康回傾地，夷羿彃日，木夫九首，土伯三目，譎怪之談也；依彭咸之遺則，從子胥以自適，狷狷之志也；士女雜坐，亂而不分，指以為樂，娛酒不廢，沉湎日夜，舉以為懽，荒淫之意也。摘此四事，異乎經典者也。</p><p><strong>所出</strong>：《文心雕龍 · 辨騷》 — https://zh.wikisource.org/wiki/文心雕龍/辨騷</p></article></main></div></div>
