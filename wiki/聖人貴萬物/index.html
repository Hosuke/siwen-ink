    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖人貴萬物</nav></header><main><article><h1>聖人貴萬物</h1><p>聖人能遍偶萬物而無一物能偶之，故能貴萬物。</p><p>所謂聖人之道者，胡然孑孑爾，胡然徹徹爾，胡然堂堂爾，胡然臧臧爾。惟其能遍偶萬物，而無一物能偶之，故能貴萬物。</p><p><strong>所出</strong>：《關尹子 · 3》 — https://zh.wikisource.org/wiki/關尹子/3</p></article></main></div></div>
