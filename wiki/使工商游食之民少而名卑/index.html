    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 使工商游食之民少而名卑</nav></header><main><article><h1>使工商游食之民少而名卑</h1><p>明主當抑制工商游食之民，使其人少名賤，以免耽於末利而荒廢本務。</p><p>夫明王治國之政，使其商工游食之民少而名卑，以寡趣本務而趨末作。今世近習之請行，則官爵可買；官爵可買，則商工不卑也矣。姦財貨賈得用於市，則商人不少矣。聚斂倍農而致尊過耕戰之士，則耿介之士寡而商賈之民多矣。</p><p><strong>所出</strong>：《韓非子 · 五蠹》 — https://zh.wikisource.org/wiki/韓非子/五蠹</p></article></main></div></div>
