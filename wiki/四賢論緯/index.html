    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 四賢論緯</nav></header><main><article><h1>四賢論緯</h1><p>桓譚、尹敏、張衡、荀悅四賢，皆批判緯書虛偽，論之精矣。</p><p>光武之世，篤信斯術，風化所靡，學者比肩，沛獻集緯以通經，曹褒撰讖以定禮，乖道謬典，亦已甚矣。</p><p>是以桓譚疾其虛偽，尹敏戲其深假，張衡發其僻謬，荀悅明其詭誕，四賢博練，論之精矣。</p><p><strong>所出</strong>：《文心雕龍 · 正緯》 — https://zh.wikisource.org/wiki/文心雕龍/正緯</p></article></main></div></div>
