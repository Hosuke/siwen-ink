    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 伯夷盜跖同道</nav></header><main><article><h1>伯夷盜跖同道</h1><p>伯夷死名，盜跖死利，所殉不同，而殘生傷性均也。</p><p>伯夷死名於首陽之下，盜跖死利於東陵之上。二人者，所死不同，其於殘生傷性，均也。莊子以為，天下盡殉也。彼其所殉仁義也，則俗謂之君子；其所殉貨財也，則俗謂之小人。其殉一也，則有君子焉，有小人焉。若其殘生損性，則盜跖亦伯夷已，又惡取君子小人於其間哉！是故殉名與殉利，表裏雖殊，本性之傷無異也。</p><p><strong>所出</strong>：《莊子 · 駢拇》 — https://zh.wikisource.org/wiki/莊子/駢拇</p></article></main></div></div>
