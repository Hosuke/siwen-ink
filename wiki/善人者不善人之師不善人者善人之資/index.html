    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 善人者不善人之師不善人者善人之資</nav></header><main><article><h1>善人者不善人之師不善人者善人之資</h1><p>善人與不善人相待而成師資之義，取其道則善人為師，取其鑒則不善人為資</p><p>故善人，善人之師；不善人，善人之資也。不貴其師，不愛其資，唯知乎大眯，是謂眇要。</p><p>善人與不善人相待而成用。善人者，不善人之所取法，是為師；不善人者，善人之所鑒戒，是為資。師以正之，資以戒之，二者闕一不可。貴師則善日進，愛資則過日寡。唯知乎此者，乃能得其要妙也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第七十一章 曳明》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
