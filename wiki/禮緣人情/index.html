    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 禮緣人情而制</nav></header><main><article><h1>禮緣人情而制</h1><p>禮本乎人之性情，非聖人臆造也。</p><p>太史公云：余至大行禮官，觀三代損益，乃知緣人情而制禮，依人性而作儀，其所由來尚矣。禮之興廢，皆本諸人心之欲，順之則治，逆之則亂，非可以人為強立也。</p><p><strong>所出</strong>：《史記 · 卷023》 — https://zh.wikisource.org/wiki/史記/卷023</p></article></main></div></div>
