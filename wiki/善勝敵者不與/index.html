    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 善勝敵者不與</nav></header><main><article><h1>善勝敵者不與</h1><p>善勝人者不與之争。</p><p>善勝敵者不與。與者，交接構兵之謂。不與，非不戰也，乃以計、以勢、以德服之，使敵自服而無需交鋒。河上公以為：善勝敵者，不與敵人言語交構、不與校力角技也。觀[[善陳者不戰]]之意，正與此合。聖人制敵以不爭為上，不戰而屈人之兵。</p><p><strong>所出</strong>：《老子河上公章句 · 配天》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
