    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 火齊湯</nav></header><main><article><h1>火齊湯</h1><p>倉公治病所用火煮之湯藥，可治湧疝、風癉客脬等疾。</p><p>齊郎中令循病，眾醫皆以為蹙入中，而刺之。臣意診之，曰：「湧疝也，令人不得前後溲。」循曰：「不得前後溲三日矣。」臣意飲以火齊湯，一飲得前溲，再飲大溲，三飲而疾愈。</p><p>齊王太后病，召臣意入診脈，曰：「風癉客脬，難於大小溲，溺赤。」臣意飲以火齊湯，一飲即前後溲，再飲病已，溺如故。</p><p><strong>所出</strong>：《史記 · 卷105》 — https://zh.wikisource.org/wiki/史記/卷105</p></article></main></div></div>
