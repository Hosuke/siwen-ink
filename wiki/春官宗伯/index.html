    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 春官宗伯</nav></header><main><article><h1>春官宗伯</h1><p>《周禮》六官之一，掌邦禮之官署。</p><p>《周禮》分天地春夏秋冬六官，春官以宗伯為長。宗伯者，主禮之官也。惟王建國，辨方正位，體國經野，設官分職，以為民極。乃立春官宗伯，使帥其屬而掌邦禮，以佐王和邦國。其屬有大宗伯、肆師、典瑞、典命、司服、典祀、守祧、世婦、內宗、外宗、大司樂、樂師、大師、典同、磬師、鐘師、笙師、大卜、龜人、大祝、司巫、大史、內史、外史、御史、巾車、典路、都宗人、家宗人之屬，員額繁夥，各有所掌，而總歸大宗伯統之。</p><p><strong>所出</strong>：《周禮 · 春官宗伯》 — https://zh.wikisource.org/wiki/周禮/春官宗伯</p></article></main></div></div>
