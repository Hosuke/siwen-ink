    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 吳楚反時得劇孟</nav></header><main><article><h1>吳楚反時得劇孟</h1><p>吳楚反時，條侯得劇孟，喜曰天下騷動宰相得之若得一敵國。</p><p>吳楚反時，條侯為太尉，乘傳車將至河南，得劇孟，喜曰：「吳楚舉大事而不求孟，吾知其無能為已矣。」天下騷動，宰相得之若得一敵國云。</p><p><strong>所出</strong>：《史記 · 卷124》 — https://zh.wikisource.org/wiki/史記/卷124</p></article></main></div></div>
