    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 廖沖</nav></header><main><article><h1>廖沖</h1><p>梁大通間辭祿入道，歷嵩華，過荊渚伏妖，於祝融頂受太平真君道要，後以虎蛇還鄉，先天中上昇。</p><p>廖沖字清虛，樑武帝大通三年居連山郡，以才德見稱，為本郡主簿。後辭其印綬，遊探道要，居嵩高山。</p><p>久之，過荊渚公安，二神作妖，起風浪阻船。因除伏之，令護船而渡。至南嶽，於祝融頂遇太平真君傳道要。</p><p>復謂二神曰：「吾居椰陽作丹，可為吾守爐，他日丹就，汝亦有分。」丹成歸鄉。常乘一虎，執蛇為鞭。年一百餘，唐睿宗先天二年，風雲晦冥而昇。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 33》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/33</p></article></main></div></div>
