    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 禮云禮云</nav></header><main><article><h1>禮云禮云</h1><p>禮之所貴，不在玉帛鐘鼓之文，在其敬心也。</p><p>孔子曰：「禮云禮云，玉帛云乎哉？樂云樂云！鐘鼓云乎哉？」</p><p>聖人觀於當時之世，徒飾儀文而遺其本，慨然而嘆。玉帛鐘鼓，特禮樂之器與數耳，非禮樂之本也。本者在敬，敬者禮之所以立，樂之所以成也。苟無敬心以將之，則玉帛將焉用之？故聖人貴意不貴象，貴本不貴末，豈可以區區器數為禮樂哉！</p><p><strong>所出</strong>：《論語 · 陽貨第十七》 — https://zh.wikisource.org/wiki/論語/陽貨第十七</p></article></main></div></div>
