    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 太極生兩儀</nav></header><main><article><h1>太極生兩儀</h1><p>太極動而生陽靜而生陰，兩儀立而八卦成。</p><p>易有太極，是生兩儀。兩儀者，陰陽也。陰陽生四象，四象生八卦。八卦既定，而吉凶生，吉凶生，而大業成矣。是故天地之始，肇於太極；陰陽之端，始於動靜。聖人觀此以為萬物之宗，而易道之所以盡神也。</p><p><strong>所出</strong>：《周易 · 繫辭上》 — https://zh.wikisource.org/wiki/易傳/繫辭上</p></article></main></div></div>
