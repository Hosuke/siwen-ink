    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大隱居廛市</nav></header><main><article><h1>大隱居廛市</h1><p>修真在塵市中用功，不必避世離俗</p><p>大隱居廛市者，修道在人類中而修，在市塵中而作，大機大用，真著實行之功，非空空無為寂滅之學也。是道也，晝夜火候，暗合天樞，勿忘勿助，日乾夕惕，溫養十月，天仙可冀，何必深山守靜孤哉。</p><p><strong>所出</strong>：《悟真直指 · 卷一》 — https://zh.wikisource.org/wiki/悟真直指/卷一</p></article></main></div></div>
