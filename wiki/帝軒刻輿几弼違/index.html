    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 帝軒刻輿几以弼違</nav></header><main><article><h1>帝軒刻輿几以弼違</h1><p>軒轅帝刻言於輿几，用以輔正過失。</p><p>昔帝軒刻輿几以弼違。劉勰述銘體之起，首稱此例。輿，几，皆日常器用；刻言於上，仰觀即警，俯察即悟，所謂弼違者，輔助以糾正其愆過也。帝軒之聖，見於微而戒於著，此銘學之源遠矣。</p><p><strong>所出</strong>：《文心雕龍 · 銘箴》 — https://zh.wikisource.org/wiki/文心雕龍/銘箴</p></article></main></div></div>
