    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 虛皇前</nav></header><main><article><h1>虛皇前</h1><p>紫霞虛皇，上清之帝，居乎太上大道之前。</p><p>紫霞虛皇，上清之帝，位乎太上大道玉晨君之前。修煉《黃庭》之士，神遊紫霞之境，禮虛皇之前，是為內觀之極功。</p><p><strong>所出</strong>：《黃庭內景經 · 上清章第一》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/上清章第一</p></article></main></div></div>
