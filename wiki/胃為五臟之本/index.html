    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 胃為五臟之本</nav></header><main><article><h1>胃為五臟之本</h1><p>平人之常氣稟於胃，無胃氣曰逆，脈得胃氣者生，不得者死。</p><p>「平人之常氣稟於胃，胃者平人之常氣也，人無胃氣曰逆，逆者死。」胃之大絡名曰虛里，貫鬲絡肺，出於左乳下，其動應衣，脈宗氣也。</p><p>又云：「人以水穀為本，故人絕水穀則死，脈無胃氣亦死。所謂無胃氣者，但得真藏脈不得胃氣也。」所謂脈不得胃氣者，肝不弦腎不石也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第五卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第五卷</p></article></main></div></div>
