    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 至誠盡性</nav></header><main><article><h1>至誠盡性</h1><p></p><p><strong>至誠盡性</strong>，儒家重要義理，出於《[[中庸]]》第二十二章。</p><p>其文云：「唯天下至誠，為能盡其性。能盡其性，則能盡人之性。能盡人之性，則能盡物之性。可以贊天地之化育，則可以與天地參矣。」</p><p>此章所述，為至誠之功：至誠則能盡己之性；盡己之性，則能盡人之性；盡人之性，則能盡物之性；繼而贊助天地之化育，與天地鼎立而三。是故至誠盡性，乃《中庸》所示之極功，成己成物，貫通天人者也。</p></article></main></div></div>
