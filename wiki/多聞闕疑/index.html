    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 多聞闕疑</nav></header><main><article><h1>多聞闕疑</h1><p>多聞而闕其疑，慎言其餘，則寡過。</p><p>《論語》載子張學干祿，孔子曰：「多聞闕疑，慎言其餘，則寡尤；多見闕殆，慎行其餘，則寡悔。言寡尤，行寡悔，祿在其中矣。」言博學而闕疑，詳見而闕殆，言其所知而行其所安，如此則無尤无悔，祿位自隨之也。</p><p><strong>所出</strong>：《論語 · 爲政第二》 — https://zh.wikisource.org/wiki/論語/爲政第二</p></article></main></div></div>
