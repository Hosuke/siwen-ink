    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 德合无疆</nav></header><main><article><h1>德合无疆</h1><p>坤德厚重，與地之无疆相合。</p><p>坤彖辭曰：「坤厚載物，德合无疆。」</p><p>言坤以厚德承載萬物，其德與地之无疆者相合。此坤之所以配乾者也。</p><p><strong>所出</strong>：《周易 · 坤》 — https://zh.wikisource.org/wiki/周易/坤</p></article></main></div></div>
