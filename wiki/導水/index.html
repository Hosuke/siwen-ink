    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 導水</nav></header><main><article><h1>導水</h1><p>順水性以入海</p><p>導水者，順水之性而歸諸海也。弱水西流以入流沙，黑水三危入南海。河自積石龍門，南至華陰，東過洛汭，至于大伾，又播為九河以入海。漢水自嶓冢東流，入江以歸彭蠡。江水自岷山東流，入於江，別為沱，又至於東陵，會於匯為中江。淮水自桐柏東會泗沂以入海。渭水自鳥鼠同穴東會灃，又會涇漆沮以入河。洛水自熊耳東北會澗瀍伊以入河。九水各有攸歸，不相侵奪。</p><p><strong>所出</strong>：《尚書 · 禹貢》 — https://zh.wikisource.org/wiki/尚書/禹貢</p></article></main></div></div>
