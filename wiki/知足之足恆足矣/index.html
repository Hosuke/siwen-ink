    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 知足之足恆足矣</nav></header><main><article><h1>知足之足恆足矣</h1><p>知足者，常足而無匱乏之患</p><p>上文云「故知足之足，恆足矣」。知足者，不妄求，不貪得，安於所得，則無不足之患。是以[[知足之足]]者，常足而無匱乏，[[名與身孰親]]、利害之辨明，則[[知足者富]]之旨亦在其中矣。</p><p>此章以「知足」名篇，實貫通三義：戒[[罪莫大於可欲]]、戒[[咎莫憯於欲得]]、歸於[[知足之足恆足矣]]，所謂「罪莫大於可欲」為因，「咎莫憯於欲得」為果，「知足之足恆足矣」為救弊之方也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第九章 知足》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
