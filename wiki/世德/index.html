    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 世德作求</nav></header><main><article><h1>世德作求</h1><p>世代積德，以配先祖。</p><p>「王配于京，世德作求」，[[詩經·下武]]之辭也。言武王居鎬京，配天而王天下；其所以配之者，以世世累德，求以當先祖之德也。[[求]]者，當也；言後王之德，常求其當乎前王之德。</p><p>周家積累深厚，[[三后在天]]而[[哲王]]世出，此之[[積善成德]]者也。德不可以已也，代有君子以繩其武，則周命萬年，[[受天之祜]]。</p><p><strong>所出</strong>：《詩經 · 下武》 — https://zh.wikisource.org/wiki/詩經/下武</p></article></main></div></div>
