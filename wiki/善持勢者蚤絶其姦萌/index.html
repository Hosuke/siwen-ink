    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 善持勢者蚤絶其姦萌</nav></header><main><article><h1>善持勢者蚤絶其姦萌</h1><p>姦者行久成積，明主當蚤絶之</p><p>子夏曰：「《春秋》之記臣殺君、子殺父者，以十數矣。皆非一日之積也，有漸而以至矣。」</p><p>凡姦者，行久而成積，積成而力多，力多而能殺，故[[善持勢者蚤絶其姦萌]]。</p><p>今田常之為亂，有漸見矣，而君不誅。晏子不使其君禁侵陵之臣，而使其主行惠，故[[田常弒簡公]]受其禍。</p><p>此[[堯欲傳天下於舜]]誅鯀之義也。明主欲行賞罰，必先[[賞罰以信]]，而後姦無所容。</p><p><strong>所出</strong>：《韓非子 · 外儲說右上》 — https://zh.wikisource.org/wiki/韓非子/外儲說右上</p></article></main></div></div>
