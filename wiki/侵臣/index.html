    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 侵臣</nav></header><main><article><h1>侵臣</h1><p>侵官事小察以折法令，好佼反而行私請。</p><p>侵臣者，事小察以折法令，好佼反而行私請。私道行則法度侵，刑法繁則姦不禁。掠人之事以為己功，窺主之怒以行其私，上之法度由此壞矣。</p><p><strong>所出</strong>：《管子 · 第52篇七主七臣》 — https://zh.wikisource.org/wiki/管子/第52篇七主七臣</p></article></main></div></div>
