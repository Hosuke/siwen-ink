    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 壹山澤</nav></header><main><article><h1>壹山澤</h1><p>統一管控山林川澤</p><p>壹山澤，則惡農慢惰倍欲之民無所於食；無所於食則必農，農則草必墾矣。山林川澤，國之資源也。禁民私擅樵採捕獵，使惰民無隙可乘，不得不歸於農業，則地闢而國富。</p><p><strong>所出</strong>：《商君書 · 卷一》 — https://zh.wikisource.org/wiki/商君書/卷一</p></article></main></div></div>
