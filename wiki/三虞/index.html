    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三虞</nav></header><main><article><h1>三虞</h1><p>葬後三日，行三次虞祭以安神。</p><p>乃反哭，入，升自西階，東面。遂適殯宮，皆如啟位，拾踊三。兄弟出，主人拜送。三虞者，葬後安神之意，所以定其處也。</p><p><strong>所出</strong>：《儀禮 · 既夕禮》 — https://zh.wikisource.org/wiki/儀禮/既夕禮</p></article></main></div></div>
