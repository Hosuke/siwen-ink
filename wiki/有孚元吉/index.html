    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 有孚元吉</nav></header><main><article><h1>有孚元吉</h1><p>心存誠信則大吉，井道之成在於有孚。</p><p>上六之辭曰：「井收勿幕，有孚元吉。」[[井收勿幕]]者，井道成而廣被天下也。夫成而不私，廣而不吝，是有孚也。有孚則[[元吉]]，无孚則凶。《易》以[[有孚]]為善行之本，[[元吉]]為成德之極。[[井冽寒泉]]，中之孚也；[[井收勿幕]]，成之孚也。君子觀井之象，知為政者以誠信為本，信立則民歸之，如水之就下然。此[[井之常道]]也。</p><p><strong>所出</strong>：《周易 · 井》 — https://zh.wikisource.org/wiki/周易/井</p></article></main></div></div>
