    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 太史公曰過大梁之墟</nav></header><main><article><h1>太史公曰過大梁之墟</h1><p>太史公過大梁夷門，論信陵君接巖穴隱者不恥下交。</p><p>太史公曰：吾過大梁之墟，求問其所謂夷門。夷門者，城之東門也。天下諸公子亦有喜士者矣，然信陵君之接岩穴隱者，不恥下交，有以也。名冠諸侯，不虛耳。高祖每過之而令民奉祠不絕也。</p><p><strong>所出</strong>：《史記 · 卷077》 — https://zh.wikisource.org/wiki/史記/卷077</p></article></main></div></div>
