    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 賈誼吊屈</nav></header><main><article><h1>賈誼吊屈</h1><p>賈誼渡湘發憤以吊屈原，體同事覈，辭清理哀，首出之作。</p><p>自賈誼浮湘，發憤吊屈，體同而事覈，辭清而理哀，蓋首出之作也。</p><p>及相如之吊二世，全為賦體；桓譚以為其言惻愴，讀者歎息。及平章要切，斷而能悲也。</p><p>揚雄吊屈，思積功寡，意深文略，故辭韻沈膇。班彪蔡邕，並敏于致語，然影附賈氏，難為並驅耳。</p><p><strong>所出</strong>：《文心雕龍 · 哀弔》 — https://zh.wikisource.org/wiki/文心雕龍/哀弔</p></article></main></div></div>
