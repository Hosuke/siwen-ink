    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 楚武王荊尸</nav></header><main><article><h1>楚武王荊尸</h1><p>楚武王授師孑以伐隨，臨陣心蕩，乃知天命將終，遂卒於樅木之下。</p><p>四年春，王三月，楚武王荊尸，授師孑焉，以伐隨，將齊，入告夫人鄧曼曰：「余心蕩。」鄧曼歎曰：「王祿盡矣。盈而蕩，天之道也。先君其知之矣，故臨武事，將發大命，而蕩王心焉。若師徒無虧，王薨于行，國之福也。」王遂行，卒於樅木之下。</p><p>令尹鬥祁、莫敖屈重除道、梁溠，營軍臨隨。隨人懼，行成。莫敖以王命入盟隨侯，且請爲會於漢汭，而還。濟漢而後發喪。</p><p><strong>所出</strong>：《春秋左氏傳 · 莊公》 — https://zh.wikisource.org/wiki/春秋左氏傳/莊公</p></article></main></div></div>
