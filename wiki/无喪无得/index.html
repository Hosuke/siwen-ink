    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 无喪无得</nav></header><main><article><h1>无喪无得</h1><p>井水不以取而竭，不以不用而盈，其德不爽。</p><p>「无喪无得。」言井之水，往者取之而不見其少，是无喪也；來者不取而亦不見其多，是无得也。水在井中，其量有常，取者自取之，井不之惜；盈者自盈之，井不之加。此[[井之常道]]也。君子之德亦猶是焉，利人而不有其功，育人而不矜其能，此所以為盛德也。[[井冽寒泉]]，其德清也；[[井養而不窮]]，其施博也。</p><p><strong>所出</strong>：《周易 · 井》 — https://zh.wikisource.org/wiki/周易/井</p></article></main></div></div>
