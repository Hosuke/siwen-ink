    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 脩我戈矛</nav></header><main><article><h1>脩我戈矛</h1><p>聞命即修兵器，積蓄以待用，軍旅急迫之象。</p><p>《秦風·無衣》：「王於興師，脩我戈矛，與子同仇。」</p><p>「脩我戈矛」，言整治其兵仗以待用也。天子有命興師，則臣下急治兵甲，不敢少懈。戈、矛皆長兵，脩之所以備格闘也。詩人言「脩我戈矛」，見其聞命即行，不俟終日，秦人尚武之俗於此可見。</p><p><strong>所出</strong>：《詩經 · 無衣》 — https://zh.wikisource.org/wiki/詩經/無衣</p></article></main></div></div>
