    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 含氣養精口如朱</nav></header><main><article><h1>含氣養精口如朱</h1><p>含育元氣以養精華，口唇自然紅潤。</p><p>含氣養精口如朱。</p><p>修真之人，含吐陰陽之氣，烹煉五臟之精。精華凝結，自然發見於面目，而口若含朱砂之鮮赤。蓋[[含精養神]]之道充，則[[仙藥-之|仙藥]]之效著，非妝飾之可比也。</p><p><strong>所出</strong>：《黃庭內景經 · 隱景章第二十四》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/隱景章第二十四</p></article></main></div></div>
