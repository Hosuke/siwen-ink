    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 泥竭火滅</nav></header><main><article><h1>泥竭火滅</h1><p>山澤之氣相蒸，興雲雨；泥竭成塵，火滅化土，喻物化之自然。</p><p>山澤炁相蒸兮，興雲而為雨。泥竭遂成塵兮，火滅化為土。</p><p>山澤之氣相感，蒸而為雲雨；泥遇火而竭成塵；火遇水而滅化土。物各從其類而化，非有所強致。此喻丹道藥物之性，必循自然之理，不可違也。</p><p><strong>所出</strong>：《周易參同契 · 32章》 — https://zh.wikisource.org/wiki/周易參同契/32章</p></article></main></div></div>
