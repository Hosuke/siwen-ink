    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 孟夏行春令</nav></header><main><article><h1>孟夏行春令</h1><p>孟夏行春令則蟲蝗敗國</p><p>孟夏行春令，則蟲蝗為敗，暴風來格，秀草不實。</p><p>[[孟夏行秋令]]記苦雨不滋，[[孟夏行冬令]]記草枯水敗，皆以節令失序致災。孟夏之時，當循火德，繼長增高，無起土功，無發大眾。此時農事方興，天子始絺，命野虞出行田原，[[敬時愛日]]之義也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷四》 — https://zh.wikisource.org/wiki/呂氏春秋/卷四</p></article></main></div></div>
