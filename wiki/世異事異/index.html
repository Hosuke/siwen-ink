    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 世異則事異</nav></header><main><article><h1>世異則事異</h1><p>時代不同則行事當異；古之仁義可王天下，今之仁義適足以亡國。</p><p>古者文王處豐、鎬之間，地方百里，行仁義而懷西戎，遂王天下。徐偃王處漢東，地方五百里，行仁義，割地而朝者三十有六國。荆文王恐其害己也，舉兵伐徐，遂滅之。故文王行仁義而王天下，偃王行仁義而喪其國，是仁義用於古不用於今也。故曰：世異則事異。</p><p><strong>所出</strong>：《韓非子 · 五蠹》 — https://zh.wikisource.org/wiki/韓非子/五蠹</p></article></main></div></div>
