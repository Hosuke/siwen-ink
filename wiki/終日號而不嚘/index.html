    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 終日號而不嚘</nav></header><main><article><h1>終日號而不嚘</h1><p>和之至也。</p><p>赤子終日號哭，而喉不嚘。嚘者，嘶啞之聲也。成人號哭則傷氣損聲，赤子終日號而無損者，以其神氣渾全，和之至也。</p><p>此喻歸根復命者，聲名不入於耳，嗜欲不擾其心，外物不能傷其內，與[[和實生物]]之義相發。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第十八章 含德》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
