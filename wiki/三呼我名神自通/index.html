    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三呼我名神自通</nav></header><main><article><h1>三呼我名神自通</h1><p>存思脾神三呼其名，則神應自通，不必外求。</p><p>三呼我名神自通者，存思脾神、呼其名號之功法也。修煉之人端坐澄心，存想脾神真形，三呼其名，則我之心與神感應相通，神炁自來洽我，不假外求而自然靈通。呼名感神之理，在乎心誠則名與神一，神一則無所不達，是謂感而遂通者也。</p><p><strong>所出</strong>：《黃庭內景經 · 脾長章第十五》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/脾長章第十五</p></article></main></div></div>
