    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 係丈夫志舍下</nav></header><main><article><h1>係丈夫志舍下</h1><p>從求君子，志在兼善，捨去小人。</p><p>六三：「係丈夫，失小子。隨，有求得利，居貞。」象曰：「係丈夫，志舍下也。」</p><p>丈夫者，君子之稱。從求丈夫，志在兼善，則小子之失，非君子之咎。蓋小大之分既定，取舍之際不可以含糊，志在大善，則小失不足計也。</p><p><strong>所出</strong>：《周易 · 隨》 — https://zh.wikisource.org/wiki/周易/隨</p></article></main></div></div>
