    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 思而不止</nav></header><main><article><h1>思而不止</h1><p>思之深切，不能自已；情之專者，雖遠弗渝。</p><p>毛詩序言宋襄公母「思而不止」，此《河廣》之所以作也。夫歸寧之念，觸事而發，歷久彌摯，不以境隔而渝，不以時移而替。凡情之專者，皆「思而不止」之謂。</p><p><strong>所出</strong>：《詩經 · 河廣》 — https://zh.wikisource.org/wiki/詩經/河廣
===終:::</p></article></main></div></div>
