    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 道弘大無形</nav></header><main><article><h1>道弘大無形</h1><p>道弘大而無形，德核理而普至</p><p>夫道者，弘大而無形；德者，核理而普至。至於群生，斟酌用之，萬物皆盛，而不與其寧。道者，下周於事，因稽而命，與時生死。參名異事，通一同情。</p><p><strong>所出</strong>：《韓非子 · 揚榷》 — https://zh.wikisource.org/wiki/韓非子/揚榷</p></article></main></div></div>
