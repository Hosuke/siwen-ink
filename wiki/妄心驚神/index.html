    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 妄心驚神</nav></header><main><article><h1>妄心驚神</h1><p>妄心一生，驚其神，著萬物，生貪求，起煩惱，流浪生死</p><p>眾生所以不得真道者，為有妄心。既有妄心，即驚其神；既驚其神，即著萬物；既著萬物，即生貪求；既生貪求，即是煩惱；煩惱妄想，憂苦身心；便遭濁辱，流浪生死，常沉苦海，永失真道。</p><p>[[上士無爭|上士無爭]]，無妄心故神不驚；下士有妄心，一念之差，遂至流浪生死，無有出期。</p><p><strong>所出</strong>：《太上老君說常清靜經》 — https://zh.wikisource.org/wiki/太上老君說常清靜經</p></article></main></div></div>
