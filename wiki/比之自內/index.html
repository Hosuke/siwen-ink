    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 比之自內</nav></header><main><article><h1>比之自內</h1><p>自內心親附，守正而吉。</p><p>比之自內，謂自內心親附於人也。《比》六二象曰「比之自內，不自失也」，言六二居內卦之中，上應九五，能自內心親附於上，不失己之正道，故貞而吉。貴乎發心之正，不由外鑠也。</p><p><strong>所出</strong>：《周易 · 比》 — https://zh.wikisource.org/wiki/周易/比</p></article></main></div></div>
