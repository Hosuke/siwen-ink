    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 春秋五例</nav></header><main><article><h1>春秋五例</h1><p>《春秋》書法之五種義例</p><p>《春秋》五例，乃聖人書法之義例也。義既極乎性情，辭亦匠於文理。《春秋》辨理，一字見義。如五石六鷁，以詳備成文；雉門兩觀，以先後顯旨；婉章志晦，諒以邃矣。觀辭立曉，而訪義方隱，此聖文之殊致，表裏之異體者也。</p><p><strong>所出</strong>：《文心雕龍 · 宗經》 — https://zh.wikisource.org/wiki/文心雕龍/宗經</p></article></main></div></div>
