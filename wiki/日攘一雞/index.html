    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 日攘一雞</nav></header><main><article><h1>日攘一雞</h1><p>已知其非義而不能速改，但欲漸減以俟來年，孟子深譏之。</p><p>戴盈之曰：「什一，去關市之征，今茲未能。請輕之，以待來年，然後已，何如？」孟子曰：「今有人日攘其鄰之雞者，或告之曰：『是非君子之道。』曰：『請損之，月攘一雞；以待來年，然後已。』如知其非義，斯速已矣，何待來年？」</p><p><strong>所出</strong>：《孟子 · 滕文公下》 — https://zh.wikisource.org/wiki/孟子/滕文公下</p></article></main></div></div>
