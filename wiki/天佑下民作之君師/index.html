    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天佑下民，作之君、作之師</nav></header><main><article><h1>天佑下民，作之君、作之師</h1><p>天生烝民而立之君師，使之相輔以安四方。</p><p>天佑下民，作之君、作之師。惟其克相上帝，寵綏四方。</p><p>此言天命之旨。天佑助下民，非民所能自定也，故為之立君以治之，立師以教之。君師之職，在輔相上帝，寵綏四方，使民各安其居也。</p><p><strong>所出</strong>：《尚書 · 泰誓上》 — https://zh.wikisource.org/wiki/尚書/泰誓上</p></article></main></div></div>
