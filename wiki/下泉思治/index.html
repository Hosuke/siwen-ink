    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 下泉思治</nav></header><main><article><h1>下泉思治</h1><p>曹人疾共公之虐，思明王賢伯以為庇也。</p><p>《曹風 · 下泉》，毛《序》云「曹人疾共公侵刻下民，不得其所，憂而思明王賢伯也」。共公之事，史傳無詳，然詩之義明矣：下民困於虐政，深夜無寐，念周京之盛、思郇伯之賢，以為生當有道在上，則天下何患不平。此[[防民之口甚於防川]]之反義，皆以民心驗政治得失也。</p><p><strong>所出</strong>：《詩經 · 下泉》 — https://zh.wikisource.org/wiki/詩經/下泉</p></article></main></div></div>
