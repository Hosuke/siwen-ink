    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 股肱相賴</nav></header><main><article><h1>股肱相賴</h1><p>君臣如一身，尊卑雖殊，實為一體。</p><p>昔在唐虞，君必度能而授，臣必量才而受。喻之[[元首]]方之股肱，雖有尊卑之殊，邈實若一體之相賴也。君為元首，臣為股肱，股肱不忠，則一身廢；股肱有病，則元首危。此自然之勢，理之固然者矣。</p><p><strong>所出</strong>：《抱朴子 · 卷06》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷06</p></article></main></div></div>
