    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 綏祭</nav></header><main><article><h1>綏祭</h1><p>祭祀將終，主人受佐食黍稷以祭先祖之禮。</p><p>綏祭者，祭祀將終之祭也。主人醋尸後，上佐食取四敦黍稷，下佐食取牢一切肺，以授上佐食，上佐食以綏祭。主人左執爵，右受佐食，坐祭之，又祭酒，不興，遂啐酒。祝與二佐食皆出盥洗，入，二佐食各取黍於一敦，上佐食兼受抟之，以授尸，尸執以命祝。祝受以東，北面於戶西，以嘏於主人。綏，緩也，所以綏安祖考，蓋祭末安神之意。</p><p><strong>所出</strong>：《儀禮 · 少牢饋食禮》 — https://zh.wikisource.org/wiki/儀禮/少牢饋食禮</p></article></main></div></div>
