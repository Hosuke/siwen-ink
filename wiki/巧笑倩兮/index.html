    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 巧笑倩兮</nav></header><main><article><h1>巧笑倩兮</h1><p>喻女子淺笑時酒窩動人，笑靨如花。</p><p>「巧笑倩兮」，《詩經·衞風·碩人》之句也。倩者，人笑而面生酒窩之貌。女子巧笑之時，兩頰現窩，動人至極。</p><p>全句云：「螓首蛾眉，巧笑倩兮，美目盻兮。」先狀其眉目之佳，再言其淺笑之美，末言其美目之神。迭進三層，無復加矣。此四字後世用為形容女子笑容嬌媚之典。</p><p><strong>所出</strong>：《詩經 · 碩人》 — https://zh.wikisource.org/wiki/詩經/碩人</p></article></main></div></div>
