    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大洞命門桃君消魔玉符</nav></header><main><article><h1>大洞命門桃君消魔玉符</h1><p>命門桃君之符，硃書黃繒佩之，存呼內諱，鎮守臍關，斷絕死根。</p><p>硃書黃繒以為符，佩於身。存呼桃君孩道康之內諱名字，鎮我臍中之關，守固胞根，斷絕死炁。誦者當叩齒九通，咽液三過。符以硃書黃繒，取其硃火之色配命門之陽神，黃繒之黃配中黃之炁，二者混合，以成其符命之功。</p><p><strong>所出</strong>：《上清大洞真經 · 7章》 — https://zh.wikisource.org/wiki/上清大洞真經/7章</p></article></main></div></div>
