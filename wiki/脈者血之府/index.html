    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 脈者血之府</nav></header><main><article><h1>脈者血之府</h1><p>脈為血之府，觀脈之長短、數大、滑濇，可知氣之盛衰與病之進退。</p><p>「夫脈者，血之府也。」此一言總脈象之大義。其後分疏之曰：長則氣治，短則氣病，數則煩心，大則病進，上盛則氣高，下盛則氣脹，代則氣衰，細則氣少，濇則心痛。又特別渾渾革至如涌泉者為病進色弊，去如弦絕者為死。蓋脈象之變化，悉本於氣血之虛實，而為死生之決也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第五卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第五卷</p></article></main></div></div>
