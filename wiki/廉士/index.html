    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 廉士</nav></header><main><article><h1>廉士</h1><p>晏子退而窮處，君子稱其盡忠不豫交、不用不懷祿，可謂廉矣。</p><p>君子稱晏子之言曰：「盡忠不豫交，不用不懷祿，晏子可謂廉矣。」</p><p><strong>所出</strong>：《晏子春秋 · 卷三》 — https://zh.wikisource.org/wiki/晏子春秋/卷三</p></article></main></div></div>
