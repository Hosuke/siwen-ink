    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 剛中</nav></header><main><article><h1>剛中</h1><p>陽剛居中，卦之所以正而吉。</p><p>剛中，謂陽剛居中正之位也。《比》彖辭云「原筮元永貞，无咎，以剛中也」，言九五一陽居上卦之中，五陽爻得位，以剛德輔佐天下而無過咎。剛者，陽也；中者，不偏不倚之謂。九五以剛健之德居尊位之中，是以其比天下者，光明正大而无私曲也。</p><p><strong>所出</strong>：《周易 · 比》 — https://zh.wikisource.org/wiki/周易/比</p></article></main></div></div>
