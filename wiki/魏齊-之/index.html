    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 魏齊-之</nav></header><main><article><h1>魏齊-之</h1><p></p><p>魏齊聞范睢相秦，必欲得其頭，恐而亡走趙，匿平原君所。秦昭王聞之，遺平原君書，稱願與為布衣之友，請平原君過秦。平原君入秦，昭王欲得魏齊頭，不與，則不出之關。趙王發卒圍平原君家，魏齊夜亡出，見趙相虞卿。虞卿度趙王終不可說，乃解其相印，與魏齊亡，間行，欲因信陵君以走楚。信陵君聞之，猶豫未肯見。魏齊聞信陵君之初難見之，怒而自剄。趙王卒取其頭予秦。</p><p>  <strong>所出</strong>：《史記 · 卷079》 — https://zh.wikisource.org/wiki/史記/卷079</p></article></main></div></div>
