    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 民信親而死利</nav></header><main><article><h1>民信親而死利</h1><p>萬民皆信愛其親而必死於利，治者當順此情。</p><p>夫民者信親而死利，海內皆然。民予則喜，奪則怒，民情皆然。先王知其然，故見予之形，不見奪之理。故民愛可洽於上也。</p><p><strong>所出</strong>：《管子 · 第73篇國蓄》 — https://zh.wikisource.org/wiki/管子/第73篇國蓄</p></article></main></div></div>
