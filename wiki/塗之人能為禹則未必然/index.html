    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 塗之人能為禹則未必然</nav></header><main><article><h1>塗之人能為禹則未必然</h1><p>可為者理也，能為者行也，知行不相若。</p><p>[[塗之人可以為禹]]則然，塗之人能為禹則未必然也。[[可以為未必能]]，知之與能之辨也。[[工匠農賈]]未嘗不可以相為事，然而未嘗能相為事。[[能群]]而不能使，[[知之而不肯為]]，皆此理也。故[[為學]]貴在積善不息，使知化為能，否則塗之人終為塗之人，而不可以為禹也。</p><p><strong>所出</strong>：《荀子 · 性惡篇》 — https://zh.wikisource.org/wiki/荀子/性惡篇</p></article></main></div></div>
