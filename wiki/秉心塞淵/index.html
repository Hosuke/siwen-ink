    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 秉心塞淵</nav></header><main><article><h1>秉心塞淵</h1><p>本文阐释了《诗经·定之方中》中“秉心塞淵”的深意，指出</p><p>又見於《詩·鄘風·定之方中》：</p><p>  「靈雨既零，命彼倌人，星言夙駕，說于桑田，匪直也人，秉心塞淵，騋牝三千。」</p><p>  匪直也人，言文公非直庸常之人也，其心充實而深遠，故能成興復之功。塞者充實之貌，淵者深遠之象。秉心塞淵，猶《易》所言「剛健篤實」，言文公存心充實、深遠不竭，故能懷保小民，致國家殷富，騋牝三千，非偶然也。賢臣之心，當如淵之深，如塞之充，然後可以任天下之重。</p><p>  <strong>所出</strong>：《詩經 · 定之方中》 — https://zh.wikisource.org/wiki/詩經/定之方中</p></article></main></div></div>
