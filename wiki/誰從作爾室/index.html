    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 誰從作爾室</nav></header><main><article><h1>誰從作爾室</h1><p>昔人出居，誰為之立家室，喻君臣離散，無可依怙也。</p><p>「昔爾出居，誰從作爾室？」出居者，離其居也。詩人詰之云：昔爾大夫出居王都之時，是誰從而為爾作室乎？言其初去之時，無有附益之者，今更欲反故都，亦無有肯迎致之者也。室家之無，見賢者之無所容身。詩人自傷其言既不能達，而欲歸亦無所歸也。</p><p><strong>所出</strong>：《詩經 · 雨無正》 — https://zh.wikisource.org/wiki/詩經/雨無正</p></article></main></div></div>
