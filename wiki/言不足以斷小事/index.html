    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 言不足以斷小事</nav></header><main><article><h1>言不足以斷小事</h1><p>言語不足以斷定細事，唯知言之謂者乃可為之。</p><p>形名不相當，聖人之所察也，萇弘則審矣。故言不足以斷小事，唯知言之謂者可為。[[不言之聽]]，[[言意相離]]之戒，皆由此義而出也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十八》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十八</p></article></main></div></div>
