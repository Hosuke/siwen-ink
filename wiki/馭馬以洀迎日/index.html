    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 馭馬以洀迎日</nav></header><main><article><h1>馭馬以洀迎日</h1><p>乗駮馬洀桓迎日而馳，乃象所見之物，知其一則可推其餘。</p><p>桓公乘馬而虎伏，管仲知其乘駮馬迎日而馳。駮象也，駮食虎豹，故虎疑而不前。以小知大，聖人之道也。</p><p><strong>所出</strong>：《管子 · 第51篇小問》 — https://zh.wikisource.org/wiki/管子/第51篇小問</p></article></main></div></div>
