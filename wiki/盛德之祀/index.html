    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 盛德之祀</nav></header><main><article><h1>盛德之祀</h1><p>舜禹盛德，必及百世，其後裔陳杞相繼受封。</p><p>且盛德之後，必百世祀。虞之世未也，其在齊乎？</p><p>又「索隱述贊」云：「盛德之祀，必及百世。舜、禹餘烈，陳、杞是繼。」</p><p><strong>所出</strong>：《史記 · 卷036》 — https://zh.wikisource.org/wiki/史記/卷036</p></article></main></div></div>
