    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 轒轀</nav></header><main><article><h1>轒轀</h1><p>古代攻城之覆車，可用以運兵渡水。</p><p>轒轀者，古代攻城之覆車也。《墨子·備水》述其用法：「並船以為十臨，臨三十人，人擅弩，計四有方，必善以船為轒轀。」蓋以船載車，濟水攻城，兵藏車中，矢不能傷，居高射敵以為掩護。</p><p>《備城門》篇亦有述及：「疏足之城，五十步一轒轀。」是知其為城守要具。其制以木為框架，覆以濕牛皮及泥土，防火矢；四輪轉動，便於推引。攻城之時，士卒匿於其下，掘城垣、填壕塹，敵矢不能害也。</p><p>此與 [[五兵]] 中之攻城械具有關，[[蛾傅]] 攻城之法，亦賴此車為前導。</p></article></main></div></div>
