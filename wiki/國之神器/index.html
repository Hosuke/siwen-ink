    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 刑之為物，國之神器，君所自執，不可假人</nav></header><main><article><h1>刑之為物，國之神器，君所自執，不可假人</h1><p>刑罰為國家重器，君主不可假手於人</p><p>故明君治難於其易，去惡於其微，不伐善以長亂，不操柯而猶豫焉。然則刑之為物，國之神器，君所自執，不可假人，猶長劍不可倒捉，巨魚不可脫淵也。乃崇替之所由，安危之源本也。</p><p><strong>所出</strong>：《抱朴子 · 卷14》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷14</p></article></main></div></div>
