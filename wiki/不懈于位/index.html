    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不懈于位</nav></header><main><article><h1>不懈于位</h1><p>君子各盡其職，不敢懈怠，以安百姓。</p><p>「不解于位」，語出《假樂》，言百辟卿士各安其位、恪盡厥職，不敢懈怠也。</p><p>位者，職之分也。燕及朋友，媚于天子，而終之以不解于位者，言上下一心，各守其分也。上有明君，則下有賢臣；臣不懈位，則民之攸塈矣。是故不懈者，治道之本也。</p><p><strong>所出</strong>：《詩經 · 假樂》 — https://zh.wikisource.org/wiki/詩經/假樂</p></article></main></div></div>
