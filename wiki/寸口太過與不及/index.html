    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 寸口太過與不及</nav></header><main><article><h1>寸口太過與不及</h1><p>寸口脈浮沉滑濇之變，辨病在外在內、新病久病及陰陽逆從。</p><p>「欲知寸口太過與不及。」寸口脈中手短者曰頭痛，長者曰足脛痛，促上擊者曰肩背痛；沈而堅者病在中，浮而盛者病在外；沈而弱為寒熱及疝瘕少腹痛，沈而橫為胠下有積，沈而喘為寒熱。</p><p>又脈盛滑堅者病在外，小實而堅者病在內；小弱以濇者久病，滑浮而疾者新病；緩而滑曰熱中，盛而緊曰脹。又言：「脈從陰陽，病易已；脈逆陰陽，病難已。」</p><p><strong>所出</strong>：《黃帝內經 · 素問第五卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第五卷</p></article></main></div></div>
