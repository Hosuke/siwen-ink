    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 段干木</nav></header><main><article><h1>段干木</h1><p>賢者讓祿遠勢，不以己易寡人。</p><p>段干木者，魏之賢士也。寡人光乎地，干木光乎德；寡人富乎財，干木富乎義。魏文侯過其閭而軾焉，欲相之，干木不肯受。於是文侯致祿百萬，時往館之。國人誦之曰：「吾君好正，干木之敬；吾君好忠，干木之隆。」後秦欲攻魏，司馬唐諫曰：「段干木賢者也，魏禮之，天下莫不聞，無乃不可加兵乎！」秦君以為然，乃止不攻。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十一》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十一</p></article></main></div></div>
