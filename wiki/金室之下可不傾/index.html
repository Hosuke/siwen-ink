    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 金室之下可不傾</nav></header><main><article><h1>金室之下可不傾</h1><p>金室喻身中丹田，守之則形神不傾。</p><p>金室者，丹田之異名，藏丹之府也。守而不傾，則丹有所居、神有所宅，形神永固。</p><p><strong>所出</strong>：《黃庭內景經 · 呼吸章第二十》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/呼吸章第二十</p></article></main></div></div>
