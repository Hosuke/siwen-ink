    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天助</nav></header><main><article><h1>天助</h1><p>秦并天下，非必險固形勢，天實助之。</p><p>太史公論秦之所以并天下曰：秦始小國僻遠，諸夏賓之，比於戎翟。然卒并天下，非必險固便形勢利也，蓋若天所助焉。夫德義不如魯衛，兵力不如三晉，而能成一統之功者，天時、地利、人和之外，又有天命存焉。是以聖人論興亡，必歸之於天，非虛言也。</p><p><strong>所出</strong>：《史記 · 卷015》 — https://zh.wikisource.org/wiki/史記/卷015</p></article></main></div></div>
