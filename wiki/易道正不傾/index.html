    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 易道正不傾</nav></header><main><article><h1>易道正不傾</h1><p>易道以正為本，正則無傾，龍虎合而成丹亦若是。</p><p>《易》之道貴正，正者不偏不倚，無過不及之謂也。[[火計]]以正為宗，[[演易以明之]]，使火候有準，斤兩有度，不偏於一端，故[[龍虎兩弦]]之功成而無傾敗之患。</p><p>[[二八應一斤]]者，正之數也；[[乾坤體乃成]]者，正之效也。若失其正，則[[上弦兌數八下弦艮亦八]]之火候有過不及之差，龍虎不相得，精無所合，丹亦隨之而傾矣。</p><p><strong>所出</strong>：《周易參同契 · 09章》 — https://zh.wikisource.org/wiki/周易參同契/09章</p></article></main></div></div>
