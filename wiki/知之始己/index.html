    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 知之始己</nav></header><main><article><h1>知之始己</h1><p>知人者先自知，自知而後可以知人。</p><p>知之始己，自知而後知人也。其相知也，若比目之魚；見形也，若光之與影。其察言也不失，若磁石之取鈰，舌之取燔骨。</p><p><strong>所出</strong>：《鬼谷子 · 卷01》 — https://zh.wikisource.org/wiki/鬼谷子/卷01</p></article></main></div></div>
