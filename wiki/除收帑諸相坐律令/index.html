    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 除收帑諸相坐律令</nav></header><main><article><h1>除收帑諸相坐律令</h1><p>孝文廢連坐之法，以為父母妻子同產坐之，非治之正。</p><p>十二月，上曰：「法者，治之正也，所以禁暴而率善人也。今犯法已論，而使毋罪之父母妻子同產坐之，及為收帑，朕甚不取。其議之。」有司皆曰：「民不能自治，故為法以禁之。相坐坐收，所以累其心，使重犯法，所從來遠矣。如故便。」上曰：「朕聞法正則民愨，罪當則民從。且夫牧民而導之善者，吏也。其既不能導，又以不正之法罪之，是反害於民為暴者也。」有司皆曰：「請奉詔書，除收帑諸相坐律令。」</p><p><strong>所出</strong>：《史記 · 卷010》 — https://zh.wikisource.org/wiki/史記/卷010</p></article></main></div></div>
