    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 羽服八風驅</nav></header><main><article><h1>羽服八風驅</h1><p>羽衣禦風，八方自在。</p><p>羽服一整八風驅。</p><p>羽服，仙人之服，以羽為衣也。八風者，八方之風。仙人整此羽服，則能馭八風而行天下，[[起鴻乘風|起鴻乘風]]之謂也。</p><p><strong>所出</strong>：《黃庭內景經 · 隱景章第二十四》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/隱景章第二十四</p></article></main></div></div>
