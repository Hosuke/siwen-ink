    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 道無我聖人無己</nav></header><main><article><h1>道無我聖人無己</h1><p>道不在我，故聖人不見己之進退。</p><p>道無人而聖人不見甲是道乙非道。道無我而聖人不見己進道己退道。以不有道，故不無道；以不得道，故不失道。</p><p><strong>所出</strong>：《關尹子 · 1》 — https://zh.wikisource.org/wiki/關尹子/1</p></article></main></div></div>
