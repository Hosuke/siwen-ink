    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五行錯王</nav></header><main><article><h1>五行錯王</h1><p>言五行迭王，剛柔相制之理。</p><p>五行錯王，相據以生，火性銷金，金伐木榮。</p><p>五行相慰相制，如錯然往來。火能銷金，金乃伐木，木榮者金之功。此言物性迭王，不可偏廢也。善煉丹者，必順五行之性，乘其王時，用其忌日，使剛柔相制，而後藥成。</p><p><strong>所出</strong>：《周易參同契 · 24章》 — https://zh.wikisource.org/wiki/周易參同契/24章</p></article></main></div></div>
