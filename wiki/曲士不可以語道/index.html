    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 曲士不可以語道</nav></header><main><article><h1>曲士不可以語道</h1><p>束於教化之偏士，不可以語大道。與[[井蛙不可以語海]]對舉，喻見限之蔽。</p><p>北海若釋三不可語之故：「井蛙不可以語於海者，拘於虛也；夏蟲不可以語於冰者，篤於時也；曲士不可以語於道者，束於教也。」曲士者，偏執一端之儒生也。</p><p><strong>所出</strong>：《莊子 · 秋水》 — https://zh.wikisource.org/wiki/莊子/秋水</p></article></main></div></div>
