    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 參功</nav></header><main><article><h1>參功</h1><p>參攻城野戰之功，下二國縣一百二十二。</p><p>參功曰：凡下二國，縣一百二十二；得王二人，相三人，將軍六人，大莫敖、郡守、司馬、候、御史各一人。司馬遷曰：「曹相國參攻城野戰之功所以能多若此者，以與淮陰侯俱。及信已滅，而列侯成功，唯獨參擅其名。」言參之功，多賴韓信之輔；信亡之後，獨參以功名顯於世也。</p><p><strong>所出</strong>：《史記 · 卷054》 — https://zh.wikisource.org/wiki/史記/卷054</p></article></main></div></div>
