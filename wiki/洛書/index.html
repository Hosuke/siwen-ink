    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 洛書</nav></header><main><article><h1>洛書</h1><p>洛書是天赐的神圣图符，或自然显现或由神鸟携带，旨在补足古代圣贤的不足，记载于《太平经·09》。</p><p>河圖洛書，上天所降神聖之圖書也。有神文書自然而出者，有神鳥所持而來者，吐文積累，種類非一。</p><p>  然天出河圖洛書，非偶然也。聖賢各長其一，未能大全，故天遣之以備闕。</p><p>  <strong>所出</strong>：《太平經 · 09》 — https://zh.wikisource.org/wiki/太平經/09</p></article></main></div></div>
