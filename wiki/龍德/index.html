    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 龍德</nav></header><main><article><h1>龍德</h1><p>君子之德以龍為象，隱見各以其時。</p><p>文言釋六爻，皆以龍德言之。龍德而隱，潛龍之謂也；龍德而正中，見龍之謂也；重剛而不中，上下之間，乾乾惕厲者，進德之君子也；上下無常，進退無恒，或躍自試者，君子欲及時也；大人者，與天地合德，此飛龍之大人也；知進退存亡而不失其正者，聖人之上九也。</p><p>龍之為物，潛則深淵，見則在田，躍則在淵，飛則在天。君子之德亦猶是焉，時隱而隱，時見而見，時動而動，時舍而舍，非固執一節也。</p><p><strong>所出</strong>：《周易 · 乾》 — https://zh.wikisource.org/wiki/周易/乾</p></article></main></div></div>
