    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 楚懷王入秦</nav></header><main><article><h1>楚懷王入秦</h1><p>懷王不聽屈原之諫，入武關赴秦之會，竟為秦伏兵所留，卒死於秦。</p><p>時秦昭王與楚婚，欲與懷王會。懷王欲行，屈平曰：「秦虎狼之國，不可信，不如毋行。」懷王稚子子蘭勸王行：「奈何絕秦歡？」懷王卒行。入武關，秦伏兵絕其後，因留懷王，以求割地。懷王怒，不聽。亡走趙，趙不內。復之秦，竟死於秦而歸葬。</p><p><strong>所出</strong>：《史記 · 卷084》 — https://zh.wikisource.org/wiki/史記/卷084</p></article></main></div></div>
