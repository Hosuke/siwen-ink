    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 射器</nav></header><main><article><h1>射器</h1><p>記大射所用弓矢、侯、乏、楅、中、扑之制。</p><p>大射射器有定數。君之弓矢適東堂，賓之弓矢與中、籌、豐皆止于西堂下，衆弓矢不挾。侯凡三等：大侯九十獲，參侯七十獲，干侯五十獲。乏去侯西十、北十，皆用革。楅設于兩楹之間，疏數容弓，若丹若墨，度尺而午。司宮埽所畫物。射器皆入後，工人、士與梓人升自北階，兩楹之間畫之。司射立于所設中之西南，東面。司射去扑，倚于階西；作射則搢扑；徹射則去扑，襲，反位。</p><p><strong>所出</strong>：《儀禮 · 大射》 — https://zh.wikisource.org/wiki/儀禮/大射</p></article></main></div></div>
