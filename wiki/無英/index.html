    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無英</nav></header><main><article><h1>無英</h1><p>肝中之真神，百疴所聚，必存之使充盈。</p><p>無英，肝中之真宰也。藏在深隱，故曰「無」；精明不昧，故曰「英」。百疴所鍾者，人身百疾皆歸聚于此，以其為生氣之根，神明之本也。必存而養之，使其充盈不竭，則百疾無從而入。《[[魂魄]]》篇云「和制魂魄津液平」，正所以養此無英云。</p><p><strong>所出</strong>：《黃庭內景經 · 肝部章第十一》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/肝部章第十一</p></article></main></div></div>
