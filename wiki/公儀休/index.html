    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 公儀休</nav></header><main><article><h1>公儀休</h1><p>魯相公儀休，奉法循理，不與民爭利</p><p>公儀休者，魯博士也。以高弟爲魯相。奉法循理，無所變更，百官自正。使食祿者不得與下民爭利，受大者不得取小。</p><p>客有遺相魚者，相不受。客曰：「聞君嗜魚，遺君魚，何故不受也？」相曰：「以嗜魚，故不受也。今爲相，能自給魚；今受魚而免，誰復給我魚者？吾故不受也。」</p><p>食茹而美，拔其園葵而棄之。見其家織布好，而疾出其家婦，燔其機，云：「欲令農士工女安所讎其貨乎」？</p><p><strong>所出</strong>：《史記 · 卷119》 — https://zh.wikisource.org/wiki/史記/卷119</p></article></main></div></div>
