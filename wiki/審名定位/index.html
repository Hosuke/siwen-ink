    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 審名定位</nav></header><main><article><h1>審名定位</h1><p>審名以定其位，明分以辯其類</p><p>凡聽之道，以其所出，反以為之入。故審名以定位，明分以辯類。聽言之道，溶若甚醉。脣乎齒乎，吾不為始乎。</p><p><strong>所出</strong>：《韓非子 · 揚榷》 — https://zh.wikisource.org/wiki/韓非子/揚榷</p></article></main></div></div>
