    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 刺中要害死期</nav></header><main><article><h1>刺中要害死期</h1><p>誤刺臟腑要害，各有死期，其動為某癥。</p><p>刺中心，一日死，其動為噫；刺中肝，五日死，其動為語；刺中腎，六日死，其動為嚏；刺中肺，三日死，其動為欬；刺中脾，十日死，其動為吞；刺中膽，一日半死，其動為嘔。</p><p><strong>所出</strong>：《黃帝內經 · 素問第十四卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十四卷</p></article></main></div></div>
