    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 孟孫才善喪</nav></header><main><article><h1>孟孫才善喪</h1><p>孟孫氏不知生死，不就先後，若化為物以待不知之化，是真知喪者。</p><p>顔回問仲尼曰：「孟孫才，其母死，哭泣无涕，中心不慼，居喪不哀。无是三者，以善喪蓋魯國。」仲尼曰：「夫孟孫氏，盡之矣，進於知矣。唯簡之而不得，夫已有所簡矣。孟孫氏不知所以生，不知所以死；不知就先，不知就後；若化爲物，以待其所不知之化已乎！且彼有駭形而无損心，有旦宅而无情死。安排而去化，乃入於寥天一。」</p><p><strong>所出</strong>：《莊子 · 大宗師》 — https://zh.wikisource.org/wiki/莊子/大宗師</p></article></main></div></div>
