    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 履道坦坦</nav></header><main><article><h1>履道坦坦</h1><p>履於正道，坦然無礙。</p><p>九二：履道坦坦，幽人貞吉。</p><p>道出於正，則坦坦平易，無所艱阻。[[履道坦坦]]者，行乎光明正大之途，坦然蕩蕩，無險巇之象。幽人貞吉者，守正自晦，不溷於世，而吉在是焉。</p><p><strong>所出</strong>：《周易 · 履》 — https://zh.wikisource.org/wiki/周易/履</p></article></main></div></div>
