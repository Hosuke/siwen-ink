    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 子帥以正孰敢不正</nav></header><main><article><h1>子帥以正孰敢不正</h1><p>為政者以身作則，則天下自正。</p><p>季康子問政於孔子。孔子對曰：「政者，正也。子帥以正，孰敢不正？」</p><p>[[正名]]之義，推之於外政也。帥，正也；正者，正人之不正。為政者先正其身，則風行草偃，誰敢不正？</p><p><strong>所出</strong>：《論語 · 顏淵第十二》 — https://zh.wikisource.org/wiki/論語/顏淵第十二</p></article></main></div></div>
