    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 伯樂相踶馬</nav></header><main><article><h1>伯樂相踶馬</h1><p>智者在觀人，知其然亦知其所以然。</p><p>伯樂教二人相踶馬，相與之簡子廐觀馬。一人舉踶馬，其一人從後而循之，三撫其尻而馬不踶。此自以為失相。其一人曰：「子非失相也。此其為馬也，踒肩而腫膝。夫踶馬也者，舉後而任前，腫膝不可任也，故後不舉。子巧於相踶馬而拙於任腫膝。」夫事有所必歸，而以有所腫膝而不任，智者之所獨知也。</p><p><strong>所出</strong>：《韓非子 · 說林下》 — https://zh.wikisource.org/wiki/韓非子/說林下</p></article></main></div></div>
