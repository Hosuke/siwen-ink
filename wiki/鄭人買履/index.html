    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鄭人買履</nav></header><main><article><h1>鄭人買履</h1><p>喻泥古不知變通，寧信度而不自信</p><p>鄭人有且置履者，先自度其足而置之其坐，至之市而忘操之。已得履，乃曰：「吾忘持度。」反歸取之。及反，市罷，遂不得履。人曰：「何不試之以足？」曰：「寧信度，無自信也。」此喻世人泥古不化，寧守死法而不敢自用量度，豈不陋哉？</p><p><strong>所出</strong>：《韓非子 · 外儲說左上》 — https://zh.wikisource.org/wiki/韓非子/外儲說左上</p></article></main></div></div>
