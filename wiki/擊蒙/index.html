    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 擊蒙</nav></header><main><article><h1>擊蒙</h1><p>以威嚴震動蒙昧，使去其染習而歸於正。</p><p>上九：擊蒙，不利為寇，利禦寇。</p><p>擊蒙者，震動蒙昧、去其染習也。不利為寇者，不可以暴取之也。利禦寇者，以正道防之、止之也。夫蒙而不化者不可以文告，必有雷霆之威以震動之，然所以震動之者，非以虐之，乃所以救之也。</p><p><strong>所出</strong>：《周易 · 蒙》 — https://zh.wikisource.org/wiki/周易/蒙</p></article></main></div></div>
