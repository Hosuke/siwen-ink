    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 眉號華蓋覆明珠</nav></header><main><article><h1>眉號華蓋覆明珠</h1><p>眉如華蓋，護明於目</p><p>眉之在人，號曰[[華蓋]]，若天象之有覆護焉。其下有明珠，則目之精明是也。言此華蓋常覆明珠之光，令不外馳，則九幽之內日月洞照，虛元朗現矣。</p><p><strong>所出</strong>：《黃庭內景經 · 天中章第六》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/天中章第六</p></article></main></div></div>
