    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 衣與繆與不女聊</nav></header><main><article><h1>衣與繆與不女聊</h1><p>孝親在於敬而非物養，古人衣之以敬，聊以為孝。</p><p>古之人有言曰：「衣與，繆與，不女聊。」</p><p>此古人之所以戒也。服飾之奉、飲食之養，非不重，然若失恭敬之心，則物養之外更無所以聊賴者。孝子之事親，不在衣服之盛、耕耘之勤，而在身敬、辭遜、色順。三者既闕，雖竭力奉養，終無孝名。</p><p><strong>所出</strong>：《荀子 · 子道篇》 — https://zh.wikisource.org/wiki/荀子/子道篇</p></article></main></div></div>
