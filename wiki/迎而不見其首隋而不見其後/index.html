    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 迎而不見其首隋而不見其後</nav></header><main><article><h1>迎而不見其首隋而不見其後</h1><p>道之前後皆不可得而見。</p><p>老子以道之不可把握喻之：前以迎之，不見其首；後以隋之，不見其後。言道超乎形相，先後不能得其端倪。</p><p><strong>所出</strong>：《老子 (帛書本) · 章十四》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
