    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 昭考</nav></header><main><article><h1>昭考</h1><p>對已故父親之美稱。宗廟祭祀，臣工稱考也。</p><p>昭考，美稱已故之父也。昭，光明之義；考，父親之稱。子事父于宗廟，不敢斥言，故以昭考稱之。</p><p>《載見》言「率見昭考」，成王帥諸侯朝于武王之廟，率之者成王，所見者武王之靈也。詩以「昭」美之，見武王功德昭著于天下，實為後世子孫所當率由而繼承者已。</p><p><strong>所出</strong>：《詩經 · 載見》 — https://zh.wikisource.org/wiki/詩經/載見</p></article></main></div></div>
