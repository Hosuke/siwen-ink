    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 玉巵無當</nav></header><main><article><h1>玉巵無當</h1><p>人主漏群臣之言，猶玉巵無底，無以盛水。</p><p>[[堂谿公]]謂[[昭侯]]曰：「今有千金之玉巵，通而無當，可以盛水乎？」昭侯曰：「不可。」「有瓦器而不漏，可以盛酒乎？」昭侯曰：「可。」對曰：「夫瓦器，至賤也，不漏，可以盛酒。雖有乎千金之玉巵，至貴而無當，漏，不可盛水，則人孰注漿哉？今為人之主而漏其群臣之語，是猶無當之玉巵也。雖有聖智，莫盡其術，為其漏也。」昭侯聞之，自此之後，欲發天下之大事，未嘗不獨寝，恐夢言而使人知其謀也。</p><p><strong>所出</strong>：《韓非子 · 外儲說右上》 — https://zh.wikisource.org/wiki/韓非子/外儲說右上</p></article></main></div></div>
