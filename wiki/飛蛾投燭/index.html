    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 飛蛾投燭</nav></header><main><article><h1>飛蛾投燭</h1><p>天下賢愚營營若飛蛾之投夜燭，不知往而返、知進而退，卒以自焚。</p><p>天下賢愚，營營然若飛蛾之投夜燭，蒼蠅之觸曉窗。知往而不知返，知進而不知退。而但知避害而就利，不知聚利而就害。夫賢於人而不賢於身，何賢之謂也？博於物而不博於己，何博之謂也？是以大人利害俱忘，何往不臧？</p><p><strong>所出</strong>：《化書 · 卷三》 — https://zh.wikisource.org/wiki/化書/卷三</p></article></main></div></div>
