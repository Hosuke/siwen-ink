    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 高第試以對策</nav></header><main><article><h1>高第試以對策</h1><p>良將高第尚須試以對策，況文士乎！</p><p>[[抱朴子]]駁「能言不必能行」之說-{云}-：「良將高第取其膽武，猶復試之以對策，況文士乎？假令不能必盡得賢能，要必愈於了不試也。」夫對策之設，非徒文具，乃所以驗其學識、察其識見。將猶需試，文士豈可獨免？[[試經取人]]之義，於斯益明矣。</p><p><strong>所出</strong>：《抱朴子 · 卷15》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷15</p></article></main></div></div>
