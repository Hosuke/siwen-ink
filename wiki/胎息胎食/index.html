    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 胎息胎食</nav></header><main><article><h1>胎息胎食</h1><p>閉炁吞之胎食漱咽之</p><p>王真受胎息胎食之法。泥丸，腦也。天門，口也。習閉炁而吞之，名曰胎息。習漱舌下泉而咽之，名曰胎食。行之勿休，二百餘年，肉色光美，力兼數人。</p><p><strong>所出</strong>：《神仙傳 · 卷六》 — https://zh.wikisource/wiki/神仙傳/卷六</p></article></main></div></div>
