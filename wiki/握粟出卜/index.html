    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 握粟出卜</nav></header><main><article><h1>握粟出卜</h1><p>持粟占卜，以問吉凶。</p><p>握粟出卜，《小宛》述困乏之人問卜之事也。詩言「哀我填寡，宜岸宜獄」，民遭困厄、無以自存，乃握粟以占，問：「自何能穀？」蓋古人遇事不能決，則以粟卜問神祇，求示趨避之道。此見詩人體恤民隱，亦見古人以卜筮決疑之俗焉。</p><p><strong>所出</strong>：《詩經 · 小宛》 — https://zh.wikisource.org/wiki/詩經/小宛</p></article></main></div></div>
