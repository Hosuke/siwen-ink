    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大宰</nav></header><main><article><h1>大宰</h1><p>天官之長，卿一人，掌建邦六典以佐王治邦國</p><p>大宰，卿一人，天官之長也。</p><p>掌建邦之六典，以佐王治邦國：一曰治典，二曰教典，三曰禮典，四曰政典，五曰刑典，六曰事典。</p><p>以八法治官府，以八則治都鄙，以八柄詔王馭群臣，以八統詔王馭萬民。</p><p>以九職任萬民，以九賦斂財賂，以九式均節財用，以九貢致邦國之用，以九兩系邦國之民。</p><p>歲終令百官府各正其治，三歲大計群吏之治而誅賞之。</p><p><strong>所出</strong>：《周禮 · 天官冢宰》 — https://zh.wikisource.org/wiki/周禮/天官冢宰</p></article></main></div></div>
