    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 木雞</nav></header><main><article><h1>木雞</h1><p>鬬雞至於無變若木雞者，其德全矣，異雞无敢應者。</p><p>紀渻子為王養鬬雞。十日而問，曰：「未也，方虛憍而恃氣。」十日又問，曰：「未也，猶應嚮景。」十日又問，曰：「未也，猶疾視而盛氣。」十日又問，曰：「幾矣，雞雖有鳴者，已无變矣，望之似木雞矣，其德全矣。異雞无敢應者，反走矣。」</p><p><strong>所出</strong>：《莊子 · 達生》 — https://zh.wikisource.org/wiki/莊子/達生</p></article></main></div></div>
