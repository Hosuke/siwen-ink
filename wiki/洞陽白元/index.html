    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 洞陽白元</nav></header><main><article><h1>洞陽白元</h1><p>洞陽宮白元君，主魂魄上登之號也。</p><p>洞陽白元，上清大洞真經第八章所言神真之名也。</p><p>經云：「洞陽白元銜籍，號曰鬱靈白元君。」白元君主洞陽宮之籍，掌魂魄上登之事，與上清三元君、泥丸天帝君同為人身上焦之真神。</p><p>修是經者，存思洞陽白元之炁，令魂魄固守，以成上登之功。</p><p><strong>所出</strong>：《上清大洞真經 · 8章》 — https://zh.wikisource.org/wiki/上清大洞真經/8章</p></article></main></div></div>
