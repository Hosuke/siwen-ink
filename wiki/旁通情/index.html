    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 旁通情</nav></header><main><article><h1>旁通情</h1><p>六爻變動，旁通萬物之情，乾道之妙用也。</p><p>文言曰：六爻發揮，旁通情也。</p><p>夫六爻者，初、二、三、四、五、上，各有其位，各有其時。陽變陰化，迭相推蕩，而情之通也，無有窒礙，是之謂旁通。時乘六龍以御天，雲行雨施，天下平也。旁通者，情之通也，非情之偏也，萬物之情皆得遂焉。</p><p><strong>所出</strong>：《周易 · 乾》 — https://zh.wikisource.org/wiki/周易/乾</p></article></main></div></div>
