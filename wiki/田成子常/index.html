    <meta property="og:description" content="田成子常以大斗斛出貸、小斗斛收之，取民心而盜全齊——見景公不知用勢之篇。 不殺其狗則酒酸：田成氏之德，正姦臣任譽姦之鼠夫國亦有狗之術也。景公賞罰以信不行，故善持勢者蚤絶其姦萌之道失，而田氏卒有齊國。 所出：《韓非子 · 外儲說右上》 — https://zh.wikisource.org/wiki/…" />

    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 田成子常</nav></header><main><article><h1>田成子常</h1><p></p><p>[[田成子常]]以大斗斛出貸、小斗斛收之，取民心而盜全齊——見[[景公不知用勢]]之篇。</p><p>[[不殺其狗則酒酸]]：田成氏之德，正姦臣[[任譽姦之鼠]][[夫國亦有狗]]之術也。景公[[賞罰以信]]不行，故[[善持勢者蚤絶其姦萌]]之道失，而田氏卒有齊國。</p><p><strong>所出</strong>：《韓非子 · 外儲說右上》 — https://zh.wikisource.org/wiki/韓非子/外儲說右上</p></article></main></div></div>
