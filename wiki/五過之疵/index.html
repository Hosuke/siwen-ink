    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五過之疵</nav></header><main><article><h1>五過之疵</h1><p>司法者有五過，犯者與罪人同罪。</p><p>五過者，司法之弊也：惟官、惟反、惟內、惟貨、惟來。挾此而行，則輕重失當，咎實自貽。</p><p><strong>所出</strong>：《尚書 · 呂刑》 — https://zh.wikisource.org/wiki/尚書/呂刑</p></article></main></div></div>
