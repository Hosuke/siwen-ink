    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 摯</nav></header><main><article><h1>摯</h1><p>士大夫相見時所執之贄物也。</p><p>摯者，相見時所執之物以為信也。士相見，冬用雉，夏用腒。左頭奉之，口稱願見之意。主人辭讓再三，賔亦固請，卒不得命，乃出迎答拜。</p><p>下大夫相見以鴈，布裹其身，索維其足，執之如執雉之儀。上大夫相見以羔，布飾之，四維之繩結於胸前，左頭持之，如人執麛然。</p><p>若主人欲還摯，則於賔再見時以摯歸之，賔亦辭讓而後受。若甞為臣者相見，主人得辭其摯而卒受之，蓋恩義之別也。</p><p><strong>所出</strong>：《儀禮 · 士相見禮》 — https://zh.wikisource.org/wiki/儀禮/士相見禮</p></article></main></div></div>
