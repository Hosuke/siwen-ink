    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 神理</nav></header><main><article><h1>神理</h1><p>神理者，道之精微，聖人所以設教之本。</p><p>[[太極|太極]]幽贊，[[神理]]生焉。神理者，[[道沿聖以垂文|道]]之精微，視之不見而能生成萬物者也。《淮南子·原道訓》注云：「本道根真，包裹天地，以歷萬物。」此之謂也。[[聖人]]觀[[神理]]以設教，取象乎《河》《洛》，問數乎蓍龜，察[[人文|人文]]以成化——皆本此神理以為文也。《易》道即神理之說，所謂「一陰一陽之謂道」，神而明之，存乎其人。神理無形，而[[人文|文]]有象；[[聖人]]之功，在於以有象之文，發無形之神理，使天下曉然於道之所在也。</p><p><strong>所出</strong>：《文心雕龍 · 原道》 — https://</p></article></main></div></div>
