    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 隱景藏形</nav></header><main><article><h1>隱景藏形</h1><p>隱身遠世，藏形絕俗。</p><p>隱景藏形與世殊。</p><p>修真之上士，韜光晦迹，不現於世。景者，光也容也；藏形者，不使世人知之也。夫道高則人忌，名顯則身危，故聖人垂衣裳而天下治，功成而身退。隱景藏形，乃全真保性之要道歟。</p><p><strong>所出</strong>：《黃庭內景經 · 隱景章第二十四》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/隱景章第二十四</p></article></main></div></div>
