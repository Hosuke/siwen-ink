    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 持滿者與天</nav></header><main><article><h1>持滿者與天</h1><p>明主法天之虛靜，故能長守富貴而不失。</p><p>天之道，滿而不溢，盛而不衰。明主法象天道，故貴而不驕，富而不奢，行理而不惰，故能長守貴富，久有天下而不失也。故曰：「持滿者與天。」</p><p>天道之用在於不盈不缺，虛而不屈，動而愈出。明主治天下者，法天之虛而不盈，矜而不驕，守而不縱，方可持盈保泰，久有其位。管子以天象喻人事，欲人主以天為法，持盈守滿，不至於溢，方可長保富貴。</p><p><strong>所出</strong>：《管子 · 第64篇形勢解》 — https://zh.wikisource.org/wiki/管子/第64篇形勢解</p></article></main></div></div>
