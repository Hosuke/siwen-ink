    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鵲巢</nav></header><main><article><h1>鵲巢</h1><p>詩經國風召南首篇，以鵲鳩比君后，言昏禮之正。</p><p>《鵲巢》，國風召南之首篇也。</p><p>詩以鵲鳩起興。鵲，陽鳥，性好疇材而巢；鳩，鳲鳩也，一名鴝鵒，性均一而仁。鵲巢而鳩居之，此造化之象也。詩人借以喻昏禮：國君積行累功以致爵位，夫人起家而居有之。德如鳲鳩，乃可以配焉。</p><p>三章皆以「維鵲有巢，維鳩居之」發端，而以「之子于歸，百兩」終之。鵲以建，鳩以居；君以功立，后以德配。此詩之所以為昏禮之正，而列於國風之始歟。</p><p><strong>所出</strong>：《詩經 · 鵲巢》 — https://zh.wikisource.org/wiki/詩經/鵲巢</p></article></main></div></div>
