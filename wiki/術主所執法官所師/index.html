    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 術主所執法官所師</nav></header><main><article><h1>術主所執法官所師</h1><p>術為君主所執之法，法為官府所師之則。</p><p>凡術也者，主之所執也；法也者，官之所師也。然使郎中日聞道於郎門之外，以至於境內日見法，又非其難者也。</p><p><strong>所出</strong>：《韓非子 · 說疑》 — https://zh.wikisource.org/wiki/韓非子/說疑</p></article></main></div></div>
