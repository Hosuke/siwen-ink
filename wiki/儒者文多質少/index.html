    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 儒者文多質少</nav></header><main><article><h1>儒者文多質少</h1><p>儒者多文辭而少質實。</p><p>皇太后以為：「儒者文多質少，今萬石君家不言而躬行，乃以長子建為郎中令，少子慶為內史。」言儒者務文飾而忽踐履，[[萬石君]]家則躬行實踐，不待言說。此[[不言而躬行]]之效也。</p><p><strong>所出</strong>：《史記 · 卷103》 — https://zh.wikisource.org/wiki/史記/卷103</p></article></main></div></div>
