    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蜾蠃負之</nav></header><main><article><h1>蜾蠃負之</h1><p>蜾蠃銜負螟蛉以養，比善人之能成其子。</p><p>蜾蠃負之，謂蜾蠃銜負螟蛉之子也。《小宛》之詩以蜾蠃養子為喻，言人當如蜾蠃之能成其物，教誨爾子，使式穀似之，善承祖德。蓋詩人借昆蟲之事，以明教子之義，非徒言物性，實勉人以善導後嗣也。</p><p><strong>所出</strong>：《詩經 · 小宛》 — https://zh.wikisource.org/wiki/詩經/小宛</p></article></main></div></div>
