    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 汔至亦未繘井</nav></header><main><article><h1>汔至亦未繘井</h1><p>幾乎至井而未下繘，功虧一簣之象。</p><p>「汔至亦未繘井。」汔至者，幾至也；繘者，綆也；未繘井者，井未有綆而下之也。行者至井旁，幾欲得水，然未有汲器以取之，終不得食。此象人欲有功，而功不就也。夫井在焉，水在焉，而不得其器，是猶有其德而無其用也。[[井渫不食]]者，水已清而人不食；汔至未繘者，器未備而功不成。功垂成而敗之，[[羸其瓶]]之凶也。</p><p><strong>所出</strong>：《周易 · 井》 — https://zh.wikisource.org/wiki/周易/井</p></article></main></div></div>
