    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 體慢於三代</nav></header><main><article><h1>體慢於三代</h1><p>《楚辭》體製遜於三代之雅正，而風雅則承戰國之風。</p><p>固知《楚辭》者，體慢於三代，而風雅於戰國，乃《雅》、《頌》之博徒，而詞賦之英傑也。</p><p><strong>所出</strong>：《文心雕龍 · 辨騷》 — https://zh.wikisource.org/wiki/文心雕龍/辨騷</p></article></main></div></div>
