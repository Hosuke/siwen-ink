    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 中心愿</nav></header><main><article><h1>中心愿</h1><p>誠發於心，出於自然，非有待而後應。</p><p>象傳云九二「中心愿也」。鶴鳴子和，出於中心之所願，非有所為而為，誠之至也。</p><p><strong>所出</strong>：《周易 · 中孚》 — https://zh.wikisource.org/wiki/周易/中孚</p></article></main></div></div>
