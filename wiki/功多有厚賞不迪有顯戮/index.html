    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 功多有厚賞不迪有顯戮</nav></header><main><article><h1>功多有厚賞不迪有顯戮</h1><p>賞罰之典，功多者厚賞，不從者顯戮。</p><p>文
誓師以賞罰曉眾，曰：「功多有厚賞，不迪有顯戮。」言功多者當厚加賞賚以褒其忠，不迪王命者當顯其罪以戮之。賞罰昭章，三軍乃可以用命。</p><p><strong>所出</strong>：《尚書 · 泰誓下》 — https://zh.wikisource.org/wiki/尚書/泰誓下</p></article></main></div></div>
