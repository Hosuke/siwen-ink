    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 觀我朵頤</nav></header><main><article><h1>觀我朵頤</h1><p>觀人貪食而動，其志已賤。</p><p>初九陽居陽位，躁動不正。舍己之靈龜而觀人之朵頤，是棄自養之道而慕外物之奉。《象》曰：「觀我朵頤，亦不足貴也。」言其慕人之欲而動，失己之正，賤莫大焉。</p><p><strong>所出</strong>：《周易 · 頤》 — https://zh.wikisource.org/wiki/周易/頤</p></article></main></div></div>
