    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 孝養厥父母</nav></header><main><article><h1>孝養厥父母</h1><p>百姓盡力農商，致孝養父母，祭祀時乃許用酒。</p><p>孝養厥父母者，百姓本分之事也。原文云：「肇牽車牛，遠服賈用，孝養厥父母；厥父母慶，自洗腆，致用酒。」言民人盡力於農事商賈，致奉養父母，以盡人子之道。父母喜慶之時，自備腆厚之饌，乃許用酒。是則酒之用，節之於孝養之後，非縱之於本分之外也。</p><p><strong>所出</strong>：《尚書 · 酒誥》 — https://zh.wikisource.org/wiki/尚書/酒誥</p></article></main></div></div>
