    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聞道者日云</nav></header><main><article><h1>聞道者日云</h1><p>道之於心，日損日簡。</p><p>聞道者日損。聞道之初，尚有聞見；及夫浸久，則損之又損，以至於無為。無為則无事，无事則可以取天下矣。損之至於無，正與「取天下恆无事」相發。學者益而不已，適以害道；聞道損而不已，乃合於常。</p><p><strong>所出</strong>：《老子 (帛書本) · 章四十八》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
