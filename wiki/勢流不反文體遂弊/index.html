    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 勢流不反，文體遂弊</nav></header><main><article><h1>勢流不反，文體遂弊</h1><p>趨奇之勢若流而不返，文體必至於弊壞。</p><p>夫通衢夷坦，而多行捷徑者，趨近故也；正文明白，而常務反言者，適俗故也。然密會者以意新得巧，苟異者以失體成怪。舊練之才，則執正以馭奇；新學之銳，則逐奇而失正；勢流不反，則文體遂弊。</p><p>大路平坦而人多行捷徑者，取近便也；正文明白而故作反言者，適世俗也。然趨奇之勢若流而不返，文體必至於弊壞，不可不戒也。</p><p><strong>所出</strong>：《文心雕龍 · 定勢》 — https://zh.wikisource.org/wiki/文心雕龍/定勢</p></article></main></div></div>
