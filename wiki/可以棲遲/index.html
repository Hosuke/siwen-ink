    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 可以棲遲</nav></header><main><article><h1>可以棲遲</h1><p>居於簡陋亦可安止，喻賢者知止足也。</p><p>衡門之下，可以棲遲。</p><p>棲遲，止息也。言衡門之下雖甚簡陋，亦可以棲止遲留。賢者不以居處之陋而改其志，反以安於是為樂。詩人所以言此者，明知足者無往不宜，簡陋之居不足以動其心也。[[棲遲偃仰]]之義略同，此特取棲遲二字，以見賢者安止之意。</p><p><strong>所出</strong>：《詩經 · 衡門》 — https://zh.wikisource.org/wiki/詩經/衡門</p></article></main></div></div>
