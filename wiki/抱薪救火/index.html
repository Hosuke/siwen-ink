    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 抱薪救火</nav></header><main><article><h1>抱薪救火</h1><p>以地事秦，譬如抱薪救火，薪不盡，火不滅。</p><p>魏將段-{干}-子請予秦南陽以和。蘇代謂魏王曰：「欲璽者段-{干}-子也，欲地者秦也。今王使欲地者制璽，使欲璽者制地，魏氏地不盡則不知已。且夫以地事秦，譬猶抱薪救火，薪不盡，火不滅。」</p><p>王曰：「是則然也。雖然，事始已行，不可更矣。」</p><p>蘇代言，以割地求和，非止戈之策，實乃助火之薪也。</p><p><strong>所出</strong>：《史記 · 魏世家》 — https://zh.wikisource.org/wiki/史記/魏世家</p></article></main></div></div>
