    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 繁華日韡曄</nav></header><main><article><h1>繁華日韡曄</h1><p>文章有二途：繁華者光耀於時，沈微者深藏於世；各有所用，不可偏執。</p><p>繁華日韡曄，則並七曜以高麗；沈微淪妙，則儕玄淵之無測。人事靡細而不浹，王道無微而不憊，故能身賤而言貴，千載彌彰焉。其英異宏逸者，則網羅乎玄黃之表；其拘束齷齪者，則羈紲於籠罩之內。振翅有利鈍，則翔集有高卑；騁跡有遲迅，則進趨有遠近。[[屬筆之家各有病]]之言過者，繁華之病也；其不及者，沈微之病也。然[[五味舛而並甘]]，各有所長，不可執一而言也。</p><p><strong>所出</strong>：《抱朴子 · 卷40》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷40</p></article></main></div></div>
