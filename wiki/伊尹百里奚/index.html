    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 伊尹百里奚</nav></header><main><article><h1>伊尹百里奚</h1><p>伊尹為宰、百里奚為虜，皆聖人，猶以役身而進。</p><p>伊尹為宰，百里奚為虜，皆所以干其上也。此二人者，皆聖人也；然猶不能無役身以進，如此其汙也！今以吾言為宰虜，而可以聽用而振世，此非能仕之所恥也。</p><p><strong>所出</strong>：《韓非子 · 說難》 — https://zh.wikisource.org/wiki/韓非子/說難</p></article></main></div></div>
