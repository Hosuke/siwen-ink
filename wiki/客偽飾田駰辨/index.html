    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 客偽飾田駰辨</nav></header><main><article><h1>客偽飾田駰辨</h1><p>述田駰窺破來客之偽飾。</p><p>客有見田駰者，被服中法，進退中度，趨翔閑雅，辭令遜敏。田駰聽之畢而辭之，送之以目。弟子問：「客，士歟？」田駰曰：「殆乎非士也。今者客所弇斂，士所術施也；士所弇斂，客所術施也。客殆乎非士也。」故火燭一隅，則室偏無光；骨節蚤成，空竅哭歷，身必不長；眾無謀方，乞謹視見，多故不良；志必不公，不能立功；好得惡予，國雖大不為王；禍災日至。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十六》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十六</p></article></main></div></div>
