    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 青童神公子</nav></header><main><article><h1>青童神公子</h1><p>肝神之名，主諸竅，聰明之所由生。</p><p>青童神公子，肝臟之主神也。居於肝部之宮翠重之裏，主諸關鏡，言乎竅穴之通塞、鏡鑒之明晦也。聰明始者，耳目之聽視，皆稟此神之令。服青錦之裳而佩玉鈴，和制魂魄，平壹津液，使形神相保。修煉家存思此神，務令其安其居而不外馳，則智識清明，百體調適矣。</p><p><strong>所出</strong>：《黃庭內景經 · 肝部章第十一》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/肝部章第十一</p></article></main></div></div>
