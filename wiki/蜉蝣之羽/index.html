    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蜉蝣之羽</nav></header><main><article><h1>蜉蝣之羽</h1><p>以蜉蝣羽翼之美，興人生危脆之歎。</p><p>《蜉蝣》之卒章曰「蜉蝣之羽，衣裳楚楚」，以蜉蝣羽翼之華美，比人之衣裳整飭。蜉蝣朝生暮死，其羽翼僅存須臾，而光彩煥然，旋即消亡。詩人見此，因念己身之微命、國事之無常，心焉憂之，不知所屆，而-{云}-「於我歸處」。蓋美物之不能久恃，猶《小雅·頍弁》所-{云}-「樂酒今夕」，亦一時之盛爾。旨趣與 [[心之憂矣]] 相通，皆詩人之深憂也。</p><p><strong>所出</strong>：《詩經 · 蜉蝣》 — https://zh.wikisource.org/wiki/詩經/蜉蝣</p></article></main></div></div>
