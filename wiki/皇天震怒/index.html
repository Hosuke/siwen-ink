    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 皇天震怒</nav></header><main><article><h1>皇天震怒</h1><p>天鑒在上，見商王暴虐，故震怒以命周伐商。</p><p>皇天震怒，命我文考，肅將天威，大勳未集。</p><p>商王受沈緬冒色，敢行暴虐，罪人以族，官人以世。皇天鑒其罪惡，故震動而怒，命文王敬將天威，以誅有罪。然文考之志未遂，大勳未集於其身也。</p><p><strong>所出</strong>：《尚書 · 泰誓上》 — https://zh.wikisource.org/wiki/尚書/泰誓上</p></article></main></div></div>
