    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 至德之世</nav></header><main><article><h1>至德之世</h1><p>至德之世，山無蹊隧，澤無舟梁，萬物羣生，禽獸可羈而遊，鳥鵲之巢可攀援而闚。</p><p>當是時也，山无蹊隧，澤无舟梁；萬物羣生，連屬其鄉；禽獸成羣，草木遂長。是故禽獸可係羈而遊，鳥鵲之巢可攀援而闚。</p><p><strong>所出</strong>：《莊子 · 馬蹄》 — https://zh.wikisource.org/wiki/莊子/馬蹄</p></article></main></div></div>
