    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不以微薄廢禮</nav></header><main><article><h1>不以微薄廢禮</h1><p>物雖菲薄，禮不可闕。</p><p>《瓠葉》之旨，在諷幽王之廢禮。幽王當艱難之世，牲牢饔餼具在，而不肯用之。詩人乃稱古之君子，采瓠葉、烹兔首，行獻酬之禮，是不以物之微薄而廢升降揖讓之儀也。蓋禮者心存乎敬，非以待物之豐儉為隆殺也。</p></article></main></div></div>
