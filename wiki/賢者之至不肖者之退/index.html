    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 賢者之至不肖者之退</nav></header><main><article><h1>賢者之至不肖者之退</h1><p>賢士來集而不肖自退，此明主之效也。</p><p>人主之害，不在乎不言用賢，而在乎誠必用賢。夫言用賢者口也，卻賢者行也，口行相反而欲賢者之至、不肖者之退也，不亦難乎！[[招賢用者人主之要務]]，此之謂也。</p><p><strong>所出</strong>：《荀子 · 致士篇》 — https://zh.wikisource.org/wiki/荀子/致士篇</p></article></main></div></div>
