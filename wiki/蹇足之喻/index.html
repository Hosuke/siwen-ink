    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蹇足之喻</nav></header><main><article><h1>蹇足之喻</h1><p>以蹇足斥鷃焦冥鼷鼬比況力小任重之失，比知人論世而無益於時。</p><p>《抱朴子》評郭林宗之無益於世，以四喻盡之，曰：蹇足之尋龍騏，斥鷃之逐鴻鵠，焦冥之方雲鵬，鼷鼬之比巨象。言林宗既有知人之名，而無救世之實，欲匡時弊而才力不逮，猶跛者欲追龍驤，斥鷃欲逐鴻雁，微蟲欲比大象，終無所成也。以此為憂世念國，希擬素王，不亦遠乎！</p><p><strong>所出</strong>：《抱朴子 · 卷46》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷46</p></article></main></div></div>
