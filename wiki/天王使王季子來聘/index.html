    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天王使王季子來聘</nav></header><main><article><h1>天王使王季子來聘</h1><p>天子使王子而稱子，尊之也；問名通好，禮之正</p><p>天王使王季子來聘。</p><p>穀梁氏曰：「其曰王季，王子也。其曰子，尊之也。聘，問也。」</p><p>周室王子出仕諸侯者，或以官職尊稱之。此稱「王季子」者，明其為王子，而加「子」以示優禮。來聘者，問於侯國，脩外交之好也。</p><p><strong>所出</strong>：《春秋穀梁傳 · 宣公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/宣公</p></article></main></div></div>
