    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 施厚者其報美</nav></header><main><article><h1>施厚者其報美</h1><p>施惠厚者報美，畜怨者禍深，薄施厚望者自古未之有。</p><p>其施厚者，其報美；其怨大者，其禍深。薄施而厚望，畜怨而無患者，古今未之有也。是以聖人察其所以往，則知其所以來者矣。</p><p><strong>所出</strong>：《淮南子 · 繆稱訓》 — https://zh.wikisource.org/wiki/淮南子/繆稱訓</p></article></main></div></div>
