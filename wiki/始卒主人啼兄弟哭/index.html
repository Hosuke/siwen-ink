    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 始卒主人啼兄弟哭</nav></header><main><article><h1>始卒主人啼兄弟哭</h1><p>人始死，主人啼，兄弟哭，婦人大哭而踴，哭之異情因親疏而殊。</p><p>始卒，主人啼，兄弟哭，妇人哭踊。既正尸，子坐於東方，卿大夫父兄子姓立於東方，有司庶士哭於堂下北面；夫人坐於西方，內命婦姑姊妹子姓立於西方，外命婦率外宗哭於堂上北面。大夫之喪，主人坐於東方，主婦坐於西方，其有命夫命婦則坐，無則皆立。士之喪，主人父兄子姓皆坐於東方，主婦姑姊妹子姓皆坐於西方。凡哭尸於室者，主人二手承衾而哭。</p><p><strong>所出</strong>：《禮記 · 喪大記》 — https://zh.wikisource.org/wiki/禮記/喪大記</p></article></main></div></div>
