    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 堯舜之與桀跖，其性一也</nav></header><main><article><h1>堯舜之與桀跖，其性一也</h1><p>聖凡善惡之別，不在性之分，而在為之積。</p><p>凡堯、舜之與桀、跖，其性一也；君子之與小人，其性一也。將以為堯、舜與桀、跖無別乎？曰：不然。其別在僞不在性。堯舜之所以為聖，以其化性起僞、積善成德也；桀跖之所以為惡，以其從其性、順其情、安恣睢也。[[厚德載物]]，[[德厚者流光]]，皆積僞之功也。</p><p><strong>所出</strong>：《荀子 · 性惡篇》 — https://zh.wikisource.org/wiki/荀子/性惡篇</p></article></main></div></div>
