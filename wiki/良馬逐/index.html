    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 良馬逐</nav></header><main><article><h1>良馬逐</h1><p>良馬馳逐，艱貞以行，利有攸往。</p><p>九三「良馬逐，利艱貞」，陽居剛位，剛健而得上之應，故如良馬之馳逐。然涉世之途多艱，當艱難中守正乃利。「曰閑輿衛，利有攸往」，又當嫻習車馬防衛之事，以備不測，乃可利有所往。此聖人畜德既成、勇於赴義之象也。</p><p><strong>所出</strong>：《周易 · 大畜》 — https://zh.wikisource.org/wiki/周易/大畜</p></article></main></div></div>
