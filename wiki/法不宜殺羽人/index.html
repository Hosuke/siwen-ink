    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 法不宜殺羽人</nav></header><main><article><h1>法不宜殺羽人</h1><p>景公欲誅視己之羽人，晏子以法諫止之。</p><p>景公蓋姣，有羽人視景公僣者。公謂左右曰：「問之，何視寡人之僣也？」羽人對曰：「言亦死，而不言亦死，竊姣公也。」公曰：「合色寡人也！殺之。」晏子不時而入見曰：「蓋聞君有所怒羽人。」公曰：「然。色寡人，故將殺之。」晏子對曰：「嬰聞拒欲不道，惡愛不祥，雖使色君，於法不宜殺也。」公曰：「惡，然乎！若使沐浴，寡人將使抱背。」</p><p><strong>所出</strong>：《晏子春秋 · 卷八》 — https://zh.wikisource.org/wiki/晏子春秋/卷八</p></article></main></div></div>
