    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 孟秋行冬令</nav></header><main><article><h1>孟秋行冬令</h1><p>孟秋行冬令則陰氣大勝，介蟲敗穀，戎兵乃來。</p><p>孟秋行冬令，則陰氣大勝，介蟲敗穀，戎兵乃來。行春令，則其國乃旱，陽氣復還，五穀無實。行夏令，則國多火災，寒熱不節，民多瘧疾。</p><p><strong>所出</strong>：《禮記 · 月令》 — https://zh.wikisource.org/wiki/禮記/月令</p></article></main></div></div>
