    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 周趮與宫他</nav></header><main><article><h1>周趮與宫他</h1><p>為人有所求者，當使人見其有，不示以無。</p><p>周趮謂宫他曰：「為我謂齊王曰：以齊資我於魏，請以魏事王。」宫他曰：「不可，是示之無魏也。齊王必不資於無魏者，而以怨有魏者。公不如曰：『以王之所欲，臣請以魏聽王。』齊王必以公為有魏也，必因公。是公有齊也，因以有齊、魏矣。」</p><p><strong>所出</strong>：《韓非子 · 說林下》 — https://zh.wikisource.org/wiki/韓非子/說林下</p></article></main></div></div>
