    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 索隱述贊吳世家</nav></header><main><article><h1>索隱述贊吳世家</h1><p>索隱贊語總括吳國興亡之要</p><p>【索隱述贊】太伯作吳，高讓雄圖。周章受國，別封於虞。壽夢初霸，始用兵車。三子遞立，延陵不居。光既篡位，是稱闔閭。王僚見殺，賊由專諸。夫差輕越，取敗姑蘇。甬東之恥，空慚伍胥。</p><p><strong>所出</strong>：《史記 · 卷031》 — https://zh.wikisource.org/wiki/史記/卷031</p></article></main></div></div>
