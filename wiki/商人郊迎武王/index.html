    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 商人郊迎武王</nav></header><main><article><h1>商人郊迎武王</h1><p>武王入商，商國百姓咸待於郊，稽首迎之。</p><p>武王馳之，紂兵皆崩畔紂。紂走，反入登于鹿臺之上，蒙衣其殊玉，自燔于火而死。武王持大白旗以麾諸侯，諸侯畢拜武王，武王乃揖諸侯，諸侯畢從。武王至商國，商國百姓咸待於郊。於是武王使群臣告語商百姓曰：「上天降休！」商人皆再拜稽首，武王亦答拜。</p><p><strong>所出</strong>：《史記 · 卷004》 — https://zh.wikisource.org/wiki/史記/卷004</p></article></main></div></div>
