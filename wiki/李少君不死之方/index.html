    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 李少君不死之方</nav></header><main><article><h1>李少君不死之方</h1><p>臣已食之逮先師授臣口傳</p><p>少君言：「臣逮先師安期先生授臣口偃方。寶蓋之棗大如瓜，鍾山之李大如瓶，臣已食之。」「若按節奉法，可度世也。」</p><p><strong>所出</strong>：《神仙傳 · 卷六》 — https://zh.wikisource/wiki/神仙傳/卷六</p></article></main></div></div>
