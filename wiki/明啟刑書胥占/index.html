    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 明啟刑書胥占</nav></header><main><article><h1>明啟刑書胥占</h1><p>斷獄之時，當明啟刑書，與眾共占之。</p><p>刑書者，國家之成法也。獄成之前，宜明白揭示其法，使人咸知；又當會集眾人，共占其義，務合於正。</p><p><strong>所出</strong>：《尚書 · 呂刑》 — https://zh.wikisource.org/wiki/尚書/呂刑</p></article></main></div></div>
