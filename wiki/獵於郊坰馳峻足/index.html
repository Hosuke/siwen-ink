    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 獵於郊坰馳峻足</nav></header><main><article><h1>獵於郊坰馳峻足</h1><p>批判貴族馳獵無度，置機事賞罰於不顧，歷年累月而不厭。</p><p>或建翠翳之青蔥，或射勇禽於郊坰，馳輕足於崄峻之上，暴僚隸於盛日之下，舉火而往，乘星而返，機事廢而不修，賞罰棄而不治。</p><p><strong>所出</strong>：《抱朴子 · 卷04》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷04</p></article></main></div></div>
