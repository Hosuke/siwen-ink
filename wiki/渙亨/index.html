    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 渙，亨</nav></header><main><article><h1>渙，亨</h1><p>渙而能通，剛柔往來以成亨</p><p>「渙，亨。剛來而不窮，柔得位乎外而上同」。</p><p>渙之所以亨者，九二剛爻來居坎中而不困窮，柔爻六四得位乎外而上同乎九五之君。剛柔交濟，渙而不散，故亨也。</p><p>王假有廟者，「王乃在中也」，君王居廟之中，凝聚人心之散也。利涉大川者，「乘木有功也」，風行水上，有舟楫之象，涉險濟難之功成也。</p><p><strong>所出</strong>：《周易 · 渙》 — https://zh.wikisource.org/wiki/周易/渙</p></article></main></div></div>
