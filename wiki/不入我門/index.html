    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不入我門</nav></header><main><article><h1>不入我門</h1><p>相知之人過門不入，以喻見拒而不相容。</p><p>相知之人過其梁、入其陳，竟不入己之門庭也。詩中具言胡逝我梁不入我門、胡逝我陳不入唁我，二者皆斥暴公之辭。梁以喻利，陳以喻近，門以喻心之疆域。入梁而不入陳，過陳而不入門，是有隙而不相恤也。唁以問疾，入門以修好，二者皆闕，此所以為譖害之驗也。後世「閉門不納」「拒之門外」之語，實濫觴於此。</p><p><strong>所出</strong>：《詩經 · 何人斯》 — https://zh.wikisource.org/wiki/詩經/何人斯</p></article></main></div></div>
