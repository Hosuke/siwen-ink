    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 清靜為治</nav></header><main><article><h1>清靜為治</h1><p>參為齊相，用黃老術，貴清靜而民自定。</p><p>參之相齊，聞膠西有蓋公，善治黃老言。見之，蓋公為言治道貴清靜而民自定。參遂避正堂舍之，用其術以治齊。九年之間，齊國安集，大稱賢相。夫清靜者，非無為也，去擾民之政，使民自化而已。</p><p><strong>所出</strong>：《史記 · 卷054》 — https://zh.wikisource.org/wiki/史記/卷054</p></article></main></div></div>
