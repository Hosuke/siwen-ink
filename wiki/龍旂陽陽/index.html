    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 龍旂陽陽</nav></header><main><article><h1>龍旂陽陽</h1><p>龍旗之盛，在風而揚。寫王朝威儀之赫也。</p><p>龍旂，畫龍之旗。陽陽，車馬旗幟和陽之貌。言龍旂之盛，在風以揚，見王朝威儀之赫奕也。詩以此起興，見天下諸侯所以畢至者，無他，以王有赫赫之德威故耳。</p><p>《載見》詠武王廟祭禮，而以龍旂之盛開其端，見禮器之美與祖德之隆，內外交相映發也已。</p><p><strong>所出</strong>：《詩經 · 載見》 — https://zh.wikisource.org/wiki/詩經/載見</p></article></main></div></div>
