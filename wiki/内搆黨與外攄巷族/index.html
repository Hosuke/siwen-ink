    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 内搆黨與外攄巷族</nav></header><main><article><h1>内搆黨與外攄巷族</h1><p>姦臣内外勾結，内黨與而劫弑其君，外借諸侯之權以易其國。</p><p>故内搆黨與，外攄巷族，觀時發事，一舉而取國家。且夫内以黨與劫弑其君，外以諸侯之權矫易其國，隱正道，持私曲，上禁君，下撓治者，不可勝數也。是何也？則不明於擇臣也。</p><p><strong>所出</strong>：《韓非子 · 說疑》 — https://zh.wikisource.org/wiki/韓非子/說疑</p></article></main></div></div>
