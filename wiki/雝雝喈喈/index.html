    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 雝雝喈喈</nav></header><main><article><h1>雝雝喈喈</h1><p>鳳凰和鳴，上下相應。</p><p>菶菶萋萋，雝雝喈喈。言鳳凰鳴於朝陽之和風，萬物應之而暢達，喻君臣相得，治道和成也。</p><p><strong>所出</strong>：《詩經 · 卷阿》 — https://zh.wikisource.org/wiki/詩經/卷阿</p></article></main></div></div>
