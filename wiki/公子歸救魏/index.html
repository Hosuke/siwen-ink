    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 公子歸救魏</nav></header><main><article><h1>公子歸救魏</h1><p>秦伐魏急，毛公薛公以大義責公子，公子變色急歸。</p><p>公子留趙十年不歸。秦聞公子在趙，日夜出兵東伐魏。魏王患之，使使往請公子。公子恐其怒之，乃誡門下：「有敢為魏王使通者，死。」賓客皆背魏之趙，莫敢勸公子歸。</p><p>毛公、薛公兩人往見公子曰：「公子所以重於趙，名聞諸侯者，徒以有魏也。今秦攻魏，魏急而公子不恤，使秦破大梁而夷先王之宗廟，公子當何面目立天下乎？」</p><p>語未及卒，公子立變色，告車趣駕歸救魏。</p><p><strong>所出</strong>：《史記 · 卷077》 — https://zh.wikisource.org/wiki/史記/卷077</p></article></main></div></div>
