    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 教學為先</nav></header><main><article><h1>教學為先</h1><p>建國君民，以教學為首務。</p><p>古之王者建國君民，必以教學為先務。《記》曰：「建國君民，教學為先。」蓋國之治亂，系乎民之善惡；民之善惡，本乎風俗之美惡；風俗之美惡，端賴教化之得失。使天下之人皆知學、好學、力學，則風俗移易，綱紀可張，雖至亂之世，亦可以漸致治也。故君子化民成俗，未有不由此者。</p><p>玉不琢則不成器，人不學則不知道。器之美惡，在乎琢磨之勤惰；道之明昧，在乎問學之深淺。是以聖人雖有治天下之大業，不敢舍教學而他圖也。</p><p><strong>所出</strong>：《禮記 · 學記》 — https://zh.wikisource.org/wiki/禮記/學記</p></article></main></div></div>
