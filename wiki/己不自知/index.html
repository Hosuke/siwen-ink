    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 己不自知</nav></header><main><article><h1>己不自知</h1><p>人難自知，雖父兄不必盡知子弟，己身尚不能比况古人，況欲評定他人。</p><p>洪答譏者曰：「我身在我者也，法當易知。設令有人問我，使自比古人，及同時令我自求輩，則我實不能自知，可與誰為匹也。況非我，安可為取而評定之耶？</p><p>且人之未易知也，雖父兄不必盡子弟也，同乎我者遽是乎？異於我者遽非乎？或有始無卒，唐堯、公旦、仲尼、季札，皆有不全得之恨。無以近人信其嘍嘍管見熒燭之明，而輕評人物。」</p><p><strong>所出</strong>：《抱朴子 · 卷52》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷52</p></article></main></div></div>
