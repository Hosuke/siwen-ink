    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 內和理而後家可長久</nav></header><main><article><h1>內和理而後家可長久</h1><p>婦順備，則內和理；內和理，則家可長久。此聖王所以重昏禮也。</p><p>是故婦順備，而後內和理；內和理，而後家可長久也。故聖王重之。</p><p><strong>所出</strong>：《禮記 · 昏義》 — https://zh.wikisource.org/wiki/禮記/昏義</p></article></main></div></div>
