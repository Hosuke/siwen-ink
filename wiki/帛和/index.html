    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 帛和</nav></header><main><article><h1>帛和</h1><p></p><p>帛和，字仲理，師董先生行炁[[斷谷術]]，又詣西城山師王君。君謂曰：「大道之緒非可卒得，吾暫往瀛洲，汝於石室熟視石壁，見文字則讀之，得道矣。」和視之一年無所見，二年有文字，三年見太清中經、神丹方、三皇文、五嶽圖，誦之上口。王君曰：「子得之矣。」乃作神丹，服半劑，延年無極，以半劑作黃金五十斤，救惠貧病。</p><p><strong>所出</strong>：《神仙傳 · 卷七》 — https://zh.wikisource/wiki/神仙傳/卷七</p></article></main></div></div>
