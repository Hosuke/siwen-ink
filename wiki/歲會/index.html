    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 歲會</nav></header><main><article><h1>歲會</h1><p>歲運與年支五行之氣相會合也。歲半之前天氣主之，歲半之後地氣主之。</p><p>歧伯述歲半之義曰：數之始，起於上而終於下，歲半之前，天氣主之；歲半之後，地氣主之。上下交互，氣交主之，歲紀畢矣。故曰位明氣月可知乎，所謂氣也。</p><p>蓋歲運與年支所屬五行之氣相會合者，是為歲會。其法以歲運為主，視年支之五行所屬，會合則為歲會。歲半之前，天之六氣主事；歲半之後，地之六氣主事。上下之氣相交之處，謂之氣交，乃民病所由生也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第二十一卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第二十一卷</p></article></main></div></div>
