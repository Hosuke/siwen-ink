    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 似鄙</nav></header><main><article><h1>似鄙</h1><p>聖人無為，俗以為鄙而實全道。</p><p>我獨無為，似鄙不逮。</p><p>無為之治，俗目以為野鄙、不能及人，其實無所不及。聖人若鄙若拙，泊淡無競，而萬物自化成也。不逮者，不及俗情，非不及道也。</p><p><strong>所出</strong>：《老子河上公章句 · 異俗》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
