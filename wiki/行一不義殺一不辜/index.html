    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 行一不義殺一不辜</nav></header><main><article><h1>行一不義殺一不辜</h1><p>得百里之地而君之，皆能朝諸侯有天下；然行一不義、殺一不辜而得天下，皆不為也。</p><p>曰：「有。得百里之地而君之，皆能以朝諸侯，有天下。行一不義、殺一辜而得天下，皆不為也。是則同。」</p><p><strong>所出</strong>：《孟子 · 公孫丑上》 — https://zh.wikisource.org/wiki/孟子/公孫丑上</p></article></main></div></div>
