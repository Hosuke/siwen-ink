    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 有豕白蹢</nav></header><main><article><h1>有豕白蹢</h1><p>野豬白蹄涉水而流，天象異常之喻。</p><p>「有豕白蹢」者，第三章之首句也。蹢，蹄也。詩言有野豕白蹄，眾而涉波，見於水涯。</p><p>古占者以野豕群涉之象為水災之驗，與「月離于畢」同為天象示警之意。幽王之世，天災人禍並臻，詩人引此以見征役之際，天又雨潦為祟，東征之苦加甚也。豕之涉波，與人之涉危，正相映發。</p><p><strong>所出</strong>：《詩經 · 漸漸之石》 — https://zh.wikisource.org/wiki/詩經/漸漸之石</p></article></main></div></div>
