    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 治之本</nav></header><main><article><h1>治之本</h1><p>本末一體，先本後末，治以仁義為本，法度為末。</p><p>治之本，在仁義；其末，在法度。人之所生者，本也；其所不生者，末也。本末，一體也，其兩愛之，性也。先本後末，謂之君子；先末後本，謂之小人。故事不本於道德者，不可以為經；言不合於先王者，不可以為道。</p><p><strong>所出</strong>：《文子 · 卷十一》 — https://zh.wikisource.org/wiki/文子/卷十一</p></article></main></div></div>
