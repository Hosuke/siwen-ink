    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 守圍之本</nav></header><main><article><h1>守圍之本</h1><p>守國之根本，在鹽之獨重。</p><p>管子論鹽政曰：「惡食無鹽則腫。守圍之本，其用鹽獨重。」鹽為民食所必需，無鹽則民病，無民則國亡。故善治國者，必重鹽利。以鹽挾天下之衆，雖不服而民自歸，此守圍之要道也。</p><p><strong>所出</strong>：《管子 · 第77篇地數》 — https://zh.wikisource.org/wiki/管子/第77篇地數</p></article></main></div></div>
