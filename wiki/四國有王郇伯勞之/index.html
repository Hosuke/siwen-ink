    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 四國有王郇伯勞之</nav></header><main><article><h1>四國有王郇伯勞之</h1><p>四方有王，賢伯撫之，百姓安而無侵刻也。</p><p>末章下文云「四國有王，郇伯勞之」。四國者，天下四方之國也；有王者，有天子在上也；郇伯，賢諸侯也；勞之者，撫綏安定之也。蓋曹人疾共公之虐，故思明王賢伯之治，以為有王在上、賢伯撫下，則天下太平，而民得其所矣。此[[堯舜之治]]所謂「匹夫匹婦有不被堯舜之澤者，若己推而納之溝中」之意也。</p><p><strong>所出</strong>：《詩經 · 下泉》 — https://zh.wikisource.org/wiki/詩經/下泉</p></article></main></div></div>
