    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 師干之試</nav></header><main><article><h1>師干之試</h1><p>軍士禦敵之本，陳兵教戰之義。</p><p>師，衆也；干，扞也，謂扞禦也；試，用也。師干之試，言軍衆皆有扞禦之用也。《采芑》首章云：「方叔涖止，其車三千，師干之試。」《毛詩正義》曰：「師，衆；干，扞；試，用也。言士衆皆有禦敵之用。」蓋兵戎大事，以得有勇有謀之衆為本，故詩以師干之試與車三千並言，以見軍容之盛，士氣之厲也。</p><p><strong>所出</strong>：《詩經 · 采芑》 — https://zh.wikisource.org/wiki/詩經/采芑</p></article></main></div></div>
