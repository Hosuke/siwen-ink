    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 議獄緩死</nav></header><main><article><h1>議獄緩死</h1><p>君子以誠恤刑，議其罪緩其罰，慎用殺也。</p><p>象傳云「君子以議獄緩死」。中孚之世，君子法風澤之感，以誠心議獄，緩其死刑，慎之至也。恩及豚魚，則刑罰亦當寬恤。</p><p><strong>所出</strong>：《周易 · 中孚》 — https://zh.wikisource.org/wiki/周易/中孚</p><hr><p>死為刑之大者，不可不慎。當廣納眾議，反覆推求，務得其情實而後加之。</p><p><strong>所出</strong>：《尚書 · 呂刑》 — https://zh.wikisource.org/wiki/尚書/呂刑</p></article></main></div></div>
