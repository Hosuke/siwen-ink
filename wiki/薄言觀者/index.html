    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 薄言觀者</nav></header><main><article><h1>薄言觀者</h1><p>欣喜而觀之，急詞言其情也。</p><p>薄言觀者，急詞也。詩人想像與君子同觀其所釣，以為娛樂。魴鱮之魚不足貴，所貴者與君子偕遊共觀耳。《采綠》四章，終之以「薄言觀者」，是怨曠之極而思樂之深也。</p><p><strong>所出</strong>：《詩經 · 采綠》 — https://zh.wikisource.org/wiki/詩經/采綠</p></article></main></div></div>
