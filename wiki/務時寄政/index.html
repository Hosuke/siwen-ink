    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 務時寄政</nav></header><main><article><h1>務時寄政</h1><p>聖王因時而立政，因事而寄教，因神而寓德。</p><p>是故聖王務時而寄政焉，作教而寄武焉，作祀而寄德焉。此三者，聖王所以合於天地之行也。</p><p><strong>所出</strong>：《管子 · 第40篇四時》 — https://zh.wikisource.org/wiki/管子/第40篇四時</p></article></main></div></div>
