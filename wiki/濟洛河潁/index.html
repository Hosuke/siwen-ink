    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 濟洛河潁</nav></header><main><article><h1>濟洛河潁</h1><p>河、濟、洛、潁之間，乃王室子男之國可守之地。</p><p>史伯告桓公，謂王室將卑，若欲避死，其在濟、洛、河、潁之間。是其子男之國，虢、鄶為大，號稱險要。桓公若以成周之眾，奉辭伐罪，取其二邑，則鄔、弊、補、舟、歷、華，皆君之土也。若前華後河，右洛左濟，修典刑以守之，是可以少固。</p><p><strong>所出</strong>：《國語 · 卷16》 — https://zh.wikisource.org/wiki/國語/卷16</p></article></main></div></div>
