    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 虛無一氣</nav></header><main><article><h1>虛無一氣</h1><p>道自虛無生一氣，一氣生陰陽，陽生三體，三體生萬物。</p><p>性命之道，造化之道，生生不息之道。推其源，自虛無中而生一氣，自一氣而生天生地產陰陽，陰陽再合含一氣而成三體。三體既成，一氣運動，陰而陽、陽而陰，萬物生矣。如草木之生，始而地中生一芽，是自虛無生一氣也；出地開兩瓣，是從一氣產陰陽也；兩瓣之中抽一莖，是陰陽再合成三體也；從此分枝生葉，是三體重生萬物張也。修道者若知順行造化，逆而修之，歸萬而三，歸三而二，歸二而一，歸一於虛，則無聲無臭至矣。</p><p><strong>所出</strong>：《悟真直指 · 卷二》 — https://zh.wikisource.org/wiki/悟真直指/卷二</p></article></main></div></div>
