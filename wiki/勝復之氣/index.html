    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 勝復之氣</nav></header><main><article><h1>勝復之氣</h1><p>五運之氣，勝已者必有復之，災眚所至，候也。</p><p>黃帝問勝復之氣，歧伯對曰：勝復之氣，其常在也，災眚時至候也奈何。又曰：非氣化者，是謂災也。</p><p>夫五運之化，有勝有復。勝者，某氣偏盛，淫於氣交；復者，勝氣既過，所不勝之氣來報。勝與復迭相勝制，以平其偏，是為正紀。若勝而不復，或復而太過，則為災眚。陽明之政，介蟲迺殃；厥陰之政，熱病行於下，風病行於上，風燥勝復形於中，皆勝復之變也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第二十一卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第二十一卷</p></article></main></div></div>
