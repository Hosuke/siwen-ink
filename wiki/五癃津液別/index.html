    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五癃津液別</nav></header><main><article><h1>五癃津液別</h1><p>津液別為五：溺、氣、汗、泣、唾，逆順失常則為水脹。</p><p>水穀入於口，輸於腸胃，其液別為五：天寒衣薄，則為溺與氣；天熱衣厚，則為汗；悲哀氣并，則為泣；中熱胃緩，則為唾；邪氣內逆，則氣閉不行，而為水脹。</p><p>津液和合為膏者，內滲入骨空，補益腦髓，下流於陰。若陰陽不和，液溢而下流於陰，髓液皆減，下過度則虛，故腰背痛而脛痠。陰陽氣道不通，四海塞閉，三焦不寫，津液不化，水穀并於腸胃，不得滲膀胱，則為水脹。此津液五別之逆順也。</p><p><strong>所出</strong>：《黃帝內經 · 靈樞第六卷》 — https://zh.wikisource.org/wiki/黃帝內經/靈樞第六卷</p></article></main></div></div>
