    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 上聖兼策載馳</nav></header><main><article><h1>上聖兼策載馳</h1><p>聖主馭國，常懷戒懼，不敢懈怠。</p><p>上聖兼策載馳，猶懼不逮前；而庸主緩步按轡，而自以為過之。或於安而思危，或在崄而自逸。</p><p><strong>所出</strong>：《抱朴子 · 卷05》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷05</p></article></main></div></div>
