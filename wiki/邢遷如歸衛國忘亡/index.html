    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 邢遷如歸衛國忘亡</nav></header><main><article><h1>邢遷如歸衛國忘亡</h1><p></p><p>僖之元年，齊桓公遷邢于夷儀。二年，封衛于楚丘。邢遷如歸，衛國忘亡。言邢人播遷，而齊桓公遷之如歸，無有怨咨也；衛人久經離散，而一旦得所安，慶其亡而復存也。</p><p>夫桓公之霸，存亡國、繼絕世，功德施於天下如此。邢、衛皆被發左衽之餘，而能復其宗廟社稷，蓋齊侯之功，亦聖王之遺意也。</p><p><strong>所出</strong>：《春秋左氏傳 · 閔公》 — https://zh.wikisource.org/wiki/春秋左氏傳/閔公</p></article></main></div></div>
