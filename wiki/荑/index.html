    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 荑</nav></header><main><article><h1>荑</h1><p>牧野之草，靜女致之，以為情之信也。</p><p>自牧歸荑，洵美且異。荑，牧野初生之嫩草，柔而美。靜女自牧所歸，采荑以貽所歡。</p><p>洵，信也；異，殊也。言此荑誠然美麗而殊常，非尋常之物可比。匪女之為美，美人之貽。草之可愛，非草本身可愛，乃因美人所貽故也。</p><p>荑在古詩中為柔美之物，象徵情意之初萌。以尋常之物為情信，視之逾於金玉，此靜女之情也。</p><p><strong>所出</strong>：《詩經 · 靜女》 — https://zh.wikisource.org/wiki/詩經/靜女</p></article></main></div></div>
