    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 凉風</nav></header><main><article><h1>凉風</h1><p>凉風居西南維，主地氣沈奪，八月律中南呂。</p><p>凉風居西南維，主地。地者，沈奪萬物氣也。北至於罰。罰者，言萬物氣奪可伐也。北至於參。參者，驗也，言萬物可別驗也。氣之賊萬物也。其於十二子為申。申者，言陰用事，申賊萬物，故曰申。北至於濁。濁者，觸也，言萬物皆觸死也，故曰濁。北至於留。留者，言陽氣之稽留也，故曰留。八月也，律中南呂。</p><p>西南之風，主肅殺之氣。秋涼之風，使萬物凋零，其氣沈降，奪物之華。八月陰氣漸盛，律中南呂，萬物之氣至此收引。</p><p><strong>所出</strong>：《史記 · 卷025》 — https://zh.wikisource.org/wiki/史記/卷025</p></article></main></div></div>
