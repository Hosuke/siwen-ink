    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 管仲遺命去四子</nav></header><main><article><h1>管仲遺命去四子</h1><p>管仲臨終遺命桓公遠易牙、豎刁、堂巫、公子開方，言四子皆不可信。</p><p>管仲病，桓公往問之。仲對曰：「臣願君之遠易牙、豎刁、堂巫、公子開方。」易牙以調和事公，公曰惟烝嬰兒之未嘗，於是烝其首子而獻之。管仲以為人情非不愛其子，於子之不愛，將何有於公？豎刁自刑而為公治內，人情非不愛其身，於身之不愛，將何有於公？公子開方事公十五年，不歸視其親。臣聞之：「務為不久，蓋虛不長。其生不長者，其死必不終。」</p><p><strong>所出</strong>：《管子 · 第32篇小稱》 — https://zh.wikisource.org/wiki/管子/第32篇小稱</p></article></main></div></div>
