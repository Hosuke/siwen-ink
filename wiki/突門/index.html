    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 突門</nav></header><main><article><h1>突門</h1><p></p><p><strong>突門</strong>，城牆上每隔百步所設之隱蔽門戶也。見於《墨子》〈備突〉篇。</p><p>突門之設，用意有二：其一，便於守軍潛師出擊，襲擊圍城之敵，免暴露正門；其二，可設伏兵，使敵誤判城防之虛實。然而此門藏於牆中，若無戒備，反可為敵人所乘。《墨子》云：「突門各為窖竈」，謂每門皆當置窖竈於門內四五尺處，「門上瓦屋」以防水浸。</p><p>由此可見古代城邑建造之巧思：分散設置隱蔽出口，使守軍得以迅速應對牆垣任一點之攻勢，而仍保持城池之整體防禦功能。突門之制，與[[守城之十四者]]所論之城防要務相表裡，亦見於[[備城門]]篇所述之門守技法。</p></article></main></div></div>
