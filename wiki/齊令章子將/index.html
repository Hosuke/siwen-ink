    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 齊令章子將</nav></header><main><article><h1>齊令章子將</h1><p>章子知將之分，以水淺深審敵虛實，夜襲殺敵將，是知將本者也。</p><p>齊令章子將而與韓、魏攻荊，荊令唐篾將而拒之。軍相當，六月而不戰。章子令人視水可絕者，荊人射之，水不可得近。有芻水旁者，告齊候者，曰：「水淺深易知。荊人所盛守，盡其淺者也；所簡守，皆其深者也。」候者載芻者與見章子，章子甚喜，因練卒以夜奄荊人之所盛守，果殺唐篾。章子可謂知將分矣。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十五》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十五</p></article></main></div></div>
