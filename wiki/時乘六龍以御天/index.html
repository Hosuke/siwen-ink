    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 時乘六龍以御天</nav></header><main><article><h1>時乘六龍以御天</h1><p>聖人法天，乘時而動，如御六龍以馭天行。</p><p>時乘六龍以御天。</p><p>天有六龍，指六位之陽爻，升降有序，各得其時。聖人觀此象，知進退出處當乘時而行，如御者之轡六龍，馭天行之正。此御非力制也，乃因其自然而順之也。時者，天之節；乘者，人之智；御者，用天而不戾天也。聖人所以參天地而立治者，正在乎乘其時、御其道爾。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷01》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷01</p></article></main></div></div>
