    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 歌舞</nav></header><main><article><h1>歌舞</h1><p>貴不我得，肥不我有，大人非樂寒賤而甘委棄。</p><p>能歌者不能者聽之，能舞者觀之，巧者不巧者辯之，賢者不賢者任之。夫養木者必將伐之，待士者必將死之。綱之以冠冕，釣之以爵祿。若馬駕車輅，貴不我得；彘食糟糠，肥不我有。是以大人道不虛貴，德不虛守；貧有所倚，進有所恃。退者非樂寒賤，而甘委棄。</p><p><strong>所出</strong>：《化書 · 卷四》 — https://zh.wikisource.org/wiki/化書/卷四</p></article></main></div></div>
