    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 觿解不可解，而后解</nav></header><main><article><h1>觿解不可解，而后解</h1><p>善解事者，必待其不可解之時而後解之。</p><p>事，有適而無適，若有適。觿，解不可解，而后解。故善舉事者，國人莫知其解。</p><p><strong>所出</strong>：《管子 · 第38篇白心》 — https://zh.wikisource.org/wiki/管子/第38篇白心</p></article></main></div></div>
