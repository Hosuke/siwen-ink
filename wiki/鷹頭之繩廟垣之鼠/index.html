    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鷹頭之繩廟垣之鼠</nav></header><main><article><h1>鷹頭之繩廟垣之鼠</h1><p>竊位之臣，猶繩索之制鷹、鼠之穿廟垣，害將及己。</p><p>器盈誌溢，態發病出，黨成交廣，道通步高。清論所不能復制，繩墨所不能復彈，遂成鷹頭之繩，廟垣之鼠。</p><p>夫鷹有搏擊之能，而受制於繩者，以其有欲也；鼠處廟垣之中，穿穴竊食，終必見誅。彼竊位之臣亦然，恃寵而驕，挾勢而横，一旦失勢，其禍可立待也。</p><p><strong>所出</strong>：《抱朴子 · 卷25》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷25</p></article></main></div></div>
