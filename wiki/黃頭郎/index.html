    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 黃頭郎</nav></header><main><article><h1>黃頭郎</h1><p>為皇帝操舟之官，服黃帽，故名</p><p>鄧通以濯舩為黃頭郎。黃頭郎者，為皇帝操舟之官，以戴黃帽得名也。《漢舊儀》云「習船者為黃頭郎」，蓋水上卒伍之賤者。通本此官，因夢兆見幸，遂至大夫，可見微賤之位亦可致顯要，視遇合何如耳。</p><p><strong>所出</strong>：《史記 · 卷125》 — https://zh.wikisource.org/wiki/史記/卷125</p></article></main></div></div>
