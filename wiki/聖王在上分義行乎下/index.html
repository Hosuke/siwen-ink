    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖王在上分義行乎下</nav></header><main><article><h1>聖王在上分義行乎下</h1><p>聖王居上位而分義明於下，則天下有恥而姦亂不作。</p><p>聖王在上，則分義行乎下。分義既定，則士大夫無流淫之行，百吏官人無怠慢之事，衆庶百姓無姦怪之俗，無盜賊之罪，莫敢犯上之大禁。天下曉然皆知盜竊不可以為富，賊害不可以為壽，犯上之禁不可以為安。賞罰明而威行如流，故姦者莫不服罪而請，不敢逃刑。</p><p><strong>所出</strong>：《荀子 · 君子篇》 — https://zh.wikisource.org/wiki/荀子/君子篇</p></article></main></div></div>
