    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 樂只君子</nav></header><main><article><h1>樂只君子</h1><p>樂只君子，迭詠三章，頌君子逮下之福。</p><p>「樂只君子」，詩文助詞之疊用也。迭見於三章之首，而義各有所承。</p><p>唯君子能逮下，故下之人樂之。樂者，葛藟之附木而得上蔭也。君子之下逮，而葛藟之所以樂也。</p><p>「只」為語助，無實義，而聲韻婉轉，以見其愛慕之情。</p><p><strong>所出</strong>：《詩經 · 樛木》 — https://zh.wikisource.org/wiki/詩經/樛木</p></article></main></div></div>
