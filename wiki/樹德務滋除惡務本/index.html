    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 樹德務滋除惡務本</nav></header><main><article><h1>樹德務滋除惡務本</h1><p>立德當廣，除惡當絕，二者治之本也。</p><p>文
王伐紂，誓師以明德義，曰：「樹德務滋，除惡務本。」言德化當廣布漸潤，惡類當芟剃根本。滋之使盛，絕之使盡，此王者之所以正天下也。</p><p><strong>所出</strong>：《尚書 · 泰誓下》 — https://zh.wikisource.org/wiki/尚書/泰誓下</p></article></main></div></div>
