    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 從一而終</nav></header><main><article><h1>從一而終</h1><p>妇人守贞，从一夫而终；夫子制义，不可偏从。</p><p>六五：「恆其德，貞，妇人吉，夫子凶。」</p><p>六五柔中得位，恆守其德，然男女之義異焉。妇人吉者，從一而終也，柔順得正，從夫以恆，故吉。夫子凶者，男子當自裁制事宜，不可但從婦道也。《象》曰：「妇人貞吉，从一而终也。夫子制义，从妇凶也。」</p><p>是故恆德之用，男女有別：女子之恆，在乎專一；男子之恆，在乎裁義。偏失其宜，雖正亦凶。</p><p><strong>所出</strong>：《周易 · 恒》 — https://zh.wikisource.org/wiki/周易/恒</p></article></main></div></div>
