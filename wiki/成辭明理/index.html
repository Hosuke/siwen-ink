    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 成辭明理</nav></header><main><article><h1>成辭明理</h1><p>全引成辭以明理</p><p>成辭明理者，全引古聖先賢之言，以明義理也。如《書》之胤征羲和，陳政典之訓；盤庚誥民，敘遲任之言。皆是全引成辭，以明理者也。</p><p>故明理引乎成辭，此聖賢鴻謨，經籍通矩。文章欲明義理，當先取法聖賢成言，不可臆說也。</p><p><strong>所出</strong>：《文心雕龍 · 事類》 — https://zh.wikisource.org/wiki/文心雕龍/事類</p></article></main></div></div>
