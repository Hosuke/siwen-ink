    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 治亂務分刑賞</nav></header><main><article><h1>治亂務分刑賞</h1><p>治亂之理，賞罰分明乃急務。</p><p>治亂之理，宜務分刑賞為急。治國者莫不有法，然而有存有亡；亡者，其制刑賞不分也。</p><p>治與亂之分，不在法之有無，而在賞罰之分與不分。賞罰不明，則姦者受賞、賢者受刑，國之亡也忽焉。賞罰分明，則民知所趨避，禁令乃得而行。故治亂之要，在乎刑賞之分際分明，此為治國之第一急務也。</p><p><strong>所出</strong>：《韓非子 · 制分》 — https://zh.wikisource.org/wiki/韓非子/制分</p></article></main></div></div>
