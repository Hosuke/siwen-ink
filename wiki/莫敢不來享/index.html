    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 莫敢不來享</nav></header><main><article><h1>莫敢不來享</h1><p>諸侯朝貢，不敢不至。</p><p>莫敢不來享，莫敢不來王，曰商是常。</p><p>享，獻也；王，朝見也；常，法則也。言荊楚之屬，莫敢不來獻方物，莫敢不來朝見，皆以商王為天下常法也。</p><p>[[殷武]]第二章言商王威德所加，荊楚暨氐羌莫敢不來享獻、不來朝王。商者，天下之常也。此正[[四方攸同]]之義。</p><p><strong>所出</strong>：《詩經 · 殷武》 — https://zh.wikisource.org/wiki/詩經/殷武</p></article></main></div></div>
