    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 詳問詳對</nav></header><main><article><h1>詳問詳對</h1><p>景公問東海水赤棗華之故，晏子以秦繆公故事答之，並釋所以然。</p><p>景公謂晏子曰：「東海之中，有水而赤，其中有棗，華而不實，何也？」晏子對曰：「昔者秦繆公，乘龍舟而理天下，以黃布裹烝棗，至東海而捐其布，彼黃布，故水赤；烝棗，故華而不實。」公曰：「吾詳問子，何為對？」晏子對曰：「嬰聞之，詳問者亦詳對之也。」</p><p><strong>所出</strong>：《晏子春秋 · 卷八》 — https://zh.wikisource.org/wiki/晏子春秋/卷八</p></article></main></div></div>
