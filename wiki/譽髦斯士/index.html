    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 譽髦斯士</nav></header><main><article><h1>譽髦斯士</h1><p>美譽成就俊士，言教化育成人材，聖人之功在於長善救失。</p><p>《思齊》卒章云「古之人無斁，譽髦斯士」。譽，獎譽也。髦，俊也。言古人行道不倦，故能美譽成就俊拔之材。</p><p>此言教化之功：聖人恒久行道，化民成俗，天下俊士聞風而起，皆受教育而成就令名。育人者無倦，被育者方能成材也。</p><p><strong>所出</strong>：《詩經 · 思齊》 — https://zh.wikisource.org/wiki/詩經/思齊</p></article></main></div></div>
