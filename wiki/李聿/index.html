    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 李聿</nav></header><main><article><h1>李聿</h1><p>唐宗室，為鼈所祟，公遠飛符誅鼈還魂，乃入青城山學道。</p><p>李聿，唐宗室也。羅公遠於明皇燕間講論道妙，出入含元殿，曾試之。後授歙州刺史，與家屬之官，甫過大江，乃為鼈所祟，拘聿之魂而附其形，自其家赴任。</p><p>一日公遠校錄水府，見之，飛符誅鼈，而還聿之魂。聿乃棄官，入青城山太一洞，請符以救其室。遂依公遠學道，後證仙果，今列侍左右。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 39》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/39</p></article></main></div></div>
