    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 對句之駢枝</nav></header><main><article><h1>對句之駢枝</h1><p>重出之對句，如駢拇枝指，冗赘無用者也。</p><p>若斯重出，即對句之駢枝也。張華詩稱：「游雁比翼翔，歸鴻知接翮。」劉琨詩言：「宣尼悲獲麟，西狩泣孔丘。」若斯重出，即對句之駢枝也。麗辭貴精不貴多，重出則失其巧矣。</p><p><strong>所出</strong>：《文心雕龍 · 麗辭》 — https://zh.wikisource.org/wiki/文心雕龍/麗辭</p></article></main></div></div>
