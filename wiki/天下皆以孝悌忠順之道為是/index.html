    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天下皆以孝悌忠順之道為是</nav></header><main><article><h1>天下皆以孝悌忠順之道為是</h1><p>批判世俗不察孝悌忠順之理而盲從，反以致亂。</p><p>天下之人皆以孝悌忠順之道為是，然而莫知察其理之可否而審行之，是以卒致天下之亂。孝悌忠順，本非無用，然行之不得其道，則反為害。</p><p>堯舜之治天下，非以孝悌為法，乃因其能明法度、治官職，以畜其臣、戴其君也。今世俗但知誦說堯舜之美名，而不明其所以然，是猶適燕而南轅，愈勤而愈遠也。</p><p><strong>所出</strong>：《韓非子 · 忠考》 — https://zh.wikisource.org/wiki/韓非子/忠考</p></article></main></div></div>
