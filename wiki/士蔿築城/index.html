    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 士蔿築城</nav></header><main><article><h1>士蔿築城</h1><p>士蔿為二公子築蒲與屈，不慎焉。</p><p>晉侯使士蔿為二公子築蒲與屈。不慎，寘薪焉。夷吾訴之，公使讓之。士蔿稽首而對曰：「臣聞之：無喪而慼，憂必讎焉；無戎而城，讎必保焉。寇讎之保，又何慎焉？守官廢命，不敬；固讎之保，不忠。失忠與敬，何以事君？」退而賦曰：「狐裘尨茸，一國三公，吾誰適從？」夫士蔿之言，蓋知城郭之守，不在於疆域之廣，而在於民志之固也。</p><p><strong>所出</strong>：《春秋左氏傳 · 僖公》 — https://zh.wikisource.org/wiki/春秋左氏傳/僖公</p></article></main></div></div>
