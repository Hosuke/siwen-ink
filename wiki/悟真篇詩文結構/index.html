    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 悟真篇詩文結構</nav></header><main><article><h1>悟真篇詩文結構</h1><p>篇分七言四韻十六首、七言絕句六十四首、五言一首、西江月十二首，及歌頌樂府雜言。</p><p>[[悟真篇]]凡九九八十一首詩文。內七言四韻一十六首，以表二八之數；七言絕句六十四首，按《周易》諸卦；五言一首，以象太乙；續添《西江月》一十二首，以周歲律。其後又作歌頌、樂府及雜言等，附之卷末。末有序說一篇，述作者得道因緣及著述旨趣。全書以詩文闡丹道，隱而不泄，讀者當以意逆志。</p><p><strong>所出</strong>：《悟真篇》 — https://zh.wikisource.org/wiki/悟真篇</p></article></main></div></div>
