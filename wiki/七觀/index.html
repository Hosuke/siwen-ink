    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 七觀</nav></header><main><article><h1>七觀</h1><p>善政之效，百姓自然嚮化。</p><p>期而致，使而往，百姓舍己，以上爲心者，教之所期也。始於不足見，終於不可及，一人服之，萬人從之，訓之所期也。未之令而爲，未之使而往，上不加勉而民自盡竭，俗之所期也。好惡形於心，百姓化于下，罰未行而民畏恐，賞未加而民勸勉，誠信之所期也。爲而無害，成而不議，得而莫之能爭，天道之所期也。爲之而成，求之而得，上之所欲，小大必舉，事之所期也。令則行，禁則止，憲之所及，俗之所被，如百體之從心，政之所期也。</p><p><strong>所出</strong>：《管子 · 第04篇立政》 — https://zh.wikisource.org/wiki/管子/第04篇立政</p></article></main></div></div>
