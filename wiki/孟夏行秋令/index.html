    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 孟夏行秋令</nav></header><main><article><h1>孟夏行秋令</h1><p>孟夏行秋令則苦雨數來五穀不滋，行冬令則草木蚤枯，行春令則蟲蝗為災。</p><p>孟夏行秋令，則苦雨數來，五穀不滋，四鄙入保。</p><p>孟夏當令之節，而行秋令，是五行相勝之失序也。秋氣肅殺，在孟夏則金氣早行，木德受制，故苦雨數至，嘉穀不生。聖人治世，必順[[四時之紀]]，[[敬時愛日]]，不敢渝節。此與[[仲夏行春令]]之義相發，皆明[[節令]]不可以混亂也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷四》 — https://zh.wikisource.org/wiki/呂氏春秋/卷四</p></article></main></div></div>
