    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 高后稱制</nav></header><main><article><h1>高后稱制</h1><p>記呂后臨朝置相分封諸呂之事</p><p>高后元年至八年，孝惠崩，太后臨朝稱制。先是，用張辟彊計，以呂台為呂王，呂祿為趙王，呂產為呂王，分王諸呂以處其權。又行八銖錢，置左右丞相，以審食其為左丞相。八年七月，高后崩，諸呂用事，欲為亂，大臣誅之，迎代王而立，是為孝文皇帝。</p><p><strong>所出</strong>：《史記 · 卷022》 — https://zh.wikisource.org/wiki/史記/卷022</p></article></main></div></div>
