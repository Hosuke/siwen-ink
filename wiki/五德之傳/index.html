    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五德之傳</nav></header><main><article><h1>五德之傳</h1><p>鄒衍明五德終始之傳，以解王朝更迭之運。</p><p>其後戰國并爭，在於彊國禽敵，救急解紛而已，豈遑念斯哉！是時獨有鄒衍，明於五德之傳，而散消息之分，以顯諸侯。而亦因秦滅六國，兵戎極煩，又升至尊之日淺，未暇遑也。而亦頗推五勝，而自以為獲水德之瑞，更名河曰「德水」，而正以十月，色上黑。然曆度閏餘，未能睹其真也。</p><p><strong>所出</strong>：《史記 · 卷026》 — https://zh.wikisource.org/wiki/史記/卷026</p></article></main></div></div>
