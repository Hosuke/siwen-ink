    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 偏將軍居左上將軍居右</nav></header><main><article><h1>偏將軍居左上將軍居右</h1><p>行師之位，偏將軍居左，上將軍居右。</p><p>古之軍制，吉事尚左，凶事尚右。偏將軍主哀，故居左；上將軍主殺，故居右。[[吉事尚左]]之義，於師旅亦然。所以然者，用兵本非美事，殺人雖勝，猶以悲哀處之，與[[殺人眾以哀悲泣之]]之旨相合。</p><p>《老子》此章，明軍中位次之禮。偏將居左，上將居右，非以權位崇卑，乃以喪禮定其序也。師旅之起，本於不得已；戰勝而哀，與[[戰勝以喪禮處之]]互發其義。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第七十五章 貴左》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
