    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 二十五變</nav></header><main><article><h1>二十五變</h1><p>病有五，傳化乘之，變生二十五類。</p><p>然其卒發者，不必治於傳，或其傳化有不以次者。憂恐悲喜怒，令不得以其次，故令人有大病。</p><p>因而喜大虛則腎氣乘，怒則肝氣乘，悲則肺氣乘，恐則脾氣乘，憂則心氣乘。此其道也。故病有五，五五二十五變，及其傳化。傳，乘之名也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第六卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第六卷</p></article></main></div></div>
