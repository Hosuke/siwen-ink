    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 守成理，因自然</nav></header><main><article><h1>守成理，因自然</h1><p>聖人守道法之成理，因循自然之勢，不強作為。</p><p>守成理，因自然。</p><p>[[道法]]者，萬物之紀也。聖人守此成理，不以私智穿鑿，不以人為乖自然。[[道在不可見|道在不可見，用在不可知]]，故能成大體。[[不測之淵起於汀瀅|萬物之起，必有待於自然]]，治道亦然。</p><p><strong>所出</strong>：《韓非子 · 大體》 — https://zh.wikisource.org/wiki/韓非子/大體</p></article></main></div></div>
