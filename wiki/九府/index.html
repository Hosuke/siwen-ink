    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 九府</nav></header><main><article><h1>九府</h1><p>九府胎仙，玉華結絡所成。</p><p>九府者，上清[[存思]]功滿之後，玉華結絡，九府皆通，[[胎仙]]以成。[[上清大洞真經]]脾中五真章，佩[[消魔玉符]]，叩齒五通、咽液五過，可達此境。</p><p><strong>所出</strong>：《上清大洞真經 · 15章》 — https://zh.wikisource.org/wiki/上清大洞真經/15章</p></article></main></div></div>
