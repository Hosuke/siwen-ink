    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 位卑而言高，罪也</nav></header><main><article><h1>位卑而言高，罪也</h1><p>孟子明仕者當稱其位，位卑而言高，是為罪也。</p><p>孟子言「位卑而言高，罪也」。為貧者辭尊居卑，辭富居貧，宜乎抱關擊柝。孔子嘗為委吏，曰會計當而已；嘗為乘田，曰牛羊茁壯長而已。位如此，言亦如彼，各稱其分也。若[[立乎人之本朝而道不行]]，則[[恥也]]。是故[[恭]]者交際之本，而稱位者仕之義也。</p><p><strong>所出</strong>：《孟子 · 萬章下》 — https://zh.wikisource.org/wiki/孟子/萬章下</p></article></main></div></div>
