    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三奇靈</nav></header><main><article><h1>三奇靈</h1><p>精氣神為三奇，靈根所本</p><p>三奇靈者，精、氣、神為三奇，靈根之所以立也。</p><p>經云：「志遊神三奇靈」，又云「無事心太平」，言精氣神三者諧和，則心神安定，三奇之靈全，而長生有望。</p><p><strong>所出</strong>：《黃庭外景經》 — https://zh.wikisource.org/wiki/黃庭外景經</p><hr><p>道有三奇：第一之奇《大洞真經三十九章》，第二之奇《五老雌一寶經》，第三之奇《素靈大有妙經》。故三十九章者，乃九天之奇呪，上元太素君金書之首經也。</p><p><strong>所出</strong>：《上清大洞真經 · 序》 — https://zh.wikisource.org/wiki/上清大洞真經/序</p></article></main></div></div>
