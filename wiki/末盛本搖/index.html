    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 末盛本搖</nav></header><main><article><h1>末盛本搖</h1><p>述工商末業興則農業廢。</p><p>若民不力田，墨乃家畜，國家難治，三疑乃極，是謂背本反則，失毀其國。凡民自七尺以上，屬諸三官。農攻粟，工攻器，賈攻貨。時事不共，是謂大凶。奪之以土功，是謂稽，不絕憂唯，必喪其秕。奪之以水事，是謂籥，喪以繼樂，四鄰來虛。奪之以兵事，是謂厲，禍因胥歲，不舉銍艾。數奪民時，大饑乃來。野有寑耒，或談或歌，旦則有昏，喪粟甚多。皆知其末，莫知其本，真。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十六》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十六</p></article></main></div></div>
