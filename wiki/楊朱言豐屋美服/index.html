    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 豐屋美服</nav></header><main><article><h1>豐屋美服</h1><p>楊朱以為豐屋、美服、厚味、姣色有此四者何求於外；無厭之性乃陰陽之蠹。</p><p>楊朱曰：「豐屋、美服、厚味、姣色，有此四者，何求於外？有此而求外者，無厭之性。無厭之性，陰陽之蠹也。忠不足以安君，適足以危身；義不足以利物，適足以害生。安上不由於忠，而忠名滅焉；利物不由於義，而義名絕焉。君臣皆安，物我兼利，古之道也。」</p><p><strong>所出</strong>：《列子 · 楊朱篇》 — https://zh.wikisource.org/wiki/列子/楊朱篇</p></article></main></div></div>
