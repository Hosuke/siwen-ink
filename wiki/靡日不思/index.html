    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 靡日不思</nav></header><main><article><h1>靡日不思</h1><p>無日不思，思念之切也。</p><p>有懷于衞，靡日不思。言衞女心懷故土，無一日而不思念也。靡者，無也。思念之切，至於日日不忘，蓋父母既終，歸寧之念愈切矣。</p><p><strong>所出</strong>：《詩經 · 泉水》 — https://zh.wikisource.org/wiki/詩經/泉水</p></article></main></div></div>
