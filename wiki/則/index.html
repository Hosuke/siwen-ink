    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 則</nav></header><main><article><h1>則</h1><p>法象之總名，天地萬物固有之理，雖變不失其常也。</p><p>則者，根天地之氣，寒暑之和，水土之性，人民鳥獸草木之生物，雖不甚多，皆均有焉，而未嘗變也，謂之則。</p><p>《管子》以為，不明於則而欲出號令，猶立朝夕於鉈均之上，檐竿而欲定其末。錯儀畫制，不知則不可。</p><p><strong>所出</strong>：《管子 · 七法》 — https://zh.wikisource.org/wiki/管子/七法/七法</p></article></main></div></div>
