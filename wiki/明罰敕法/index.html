    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 明罰敕法</nav></header><main><article><h1>明罰敕法</h1><p>刑罰當明，法令當肅。</p><p>噬嗑之象，取法雷電。電以照幽，雷以震威，故先王法之，以明罰敕法，明罰以示民，敕法以正民，使民知所避而不敢犯也。</p><p>  <strong>所出</strong>：《周易 · 噬嗑》 — https://zh.wikisource.org/wiki/周易/噬嗑</p><hr><p>齊靈公入晉師圍臨菑，晏嬰止之不聽。此明罰敕法之不行，致有覆軍之敗也。</p><p>  <strong>所出</strong>：《史記 · 卷032》 — https://zh.wikisource.org/wiki/史記/卷032</p></article></main></div></div>
