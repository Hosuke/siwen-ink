    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 人貌榮名</nav></header><main><article><h1>人貌榮名</h1><p>人之貌不足以定榮名，榮名既立，天下慕之，俠者之聲，足貴也。</p><p>太史公曰：吾視郭解，狀貌不及中人，言語不足採者。然天下無賢與不肖，知與不知，皆慕其聲，言俠者皆引以為名。諺曰：「人貌榮名，豈有既乎！」</p><p><strong>所出</strong>：《史記 · 卷124》 — https://zh.wikisource.org/wiki/史記/卷124</p></article></main></div></div>
