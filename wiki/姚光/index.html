    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 姚光</nav></header><main><article><h1>姚光</h1><p>姚光得神丹之道，火不能焦，刀不能傷。</p><p>姚光，不知何許人。得神丹之道，能分形散影，坐在立亡，火之不焦，刀之不能傷。吳主試之，積荻數千束，令光坐其中，四面發火焚之。煙焰翳日，觀者盈都，咸謂光為煨燼。火息，見光從灰中振衣而起，神容晏如。手把一卷書，吳主讀不能解。後不知所之。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 16》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/16</p></article></main></div></div>
