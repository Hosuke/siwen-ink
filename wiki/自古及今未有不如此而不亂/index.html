    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 自古及今未有不如此而不亂</nav></header><main><article><h1>自古及今未有不如此而不亂</h1><p>不任賢才而親不肖，必致禍亂</p><p>今人主有大患：使賢者為之，則與不肖者規之；使知者慮之，則與愚者論之；使脩士行之，則與汙邪之人疑之，雖欲成功，得乎哉！</p><p>人主不能論此三材者，不知道此道，安值將卑埶出勞，併耳目之樂，而親自貫日而治詳，一日而曲辨之，慮與臣下爭小察而綦偏能，自古及今，未有如此而不亂者也。是所謂視乎不可見，聽乎不可聞，為乎不可成，此之謂也。</p><p><strong>所出</strong>：《荀子 · 君道篇》 — https://zh.wikisource.org/wiki/荀子/君道篇</p></article></main></div></div>
