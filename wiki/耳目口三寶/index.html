    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 耳目口三寶</nav></header><main><article><h1>耳目口三寶</h1><p>內丹以耳目口為三寶，閉塞勿通，以護真人</p><p>耳目口三者，人之與物接者也。聖人視聽言動，必反求諸己，不以聲色臭味搖其心。《參同契》云「耳目口三寶，閉門無發通」，是閉塞三關，勿令外馳，以保守我之真炁。此乃修真之要務，猶坤之含弘，以靜為主也。</p><p><strong>所出</strong>：《周易參同契 · 22章》 — https://zh.wikisource.org/wiki/周易參同契/22章</p></article></main></div></div>
