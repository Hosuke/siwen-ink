    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 昔我往矣</nav></header><main><article><h1>昔我往矣</h1><p>征人離國之時，楊柳方春，以興戍役之始。</p><p>「昔我往矣，[[楊柳依依]]」，《采薇》末章之首二句也。往，指出征也。昔，往昔，指當年離別之時。楊柳依依，狀春風中柳枝輕盈之態，以興離別之情。《經》云「昔我往矣」而下接「今我來思」，今昔對舉，以見歲月之久、征戍之長、物候之變，由春而冬，由歸思而歸蹤，情隨景移，辭約義深。</p><p><strong>所出</strong>：《詩經 · 采薇》 — https://zh.wikisource.org/wiki/詩經/采薇</p></article></main></div></div>
