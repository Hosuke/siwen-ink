    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 樂子長</nav></header><main><article><h1>樂子長</h1><p>服巨勝赤松散，百八十歲如少女，入劳盛山昇仙。</p><p>潛山真君樂子長，齊人。少好道，到霍林遇仙人[[韓衆]]，受[[靈寶符]]，傳巨勝、赤松散。子長服之，年一百八十歲，色如少女。妻子九人皆服此藥。入劳盛山昇仙，住方丈之室。於神州受[[太玄生錄]]，以五芝為糧。太上補為修門郎，位亞神次。唐玄宗夢二十八仙，內子長為星宿，於潛山得道，號潛山真君。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 34》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/34</p></article></main></div></div>
