    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大臣官人與下先謀比周</nav></header><main><article><h1>大臣官人與下先謀比周</h1><p>大臣與屬下先謀結黨，則威利在下，主卑臣重。</p><p>大臣官人，與下先謀比周，雖不法行，威利在下，則主卑而大臣重矣。</p><p>夫卑名危位者，必下之不從法令、有二心務私學反逆世者也，而不禁其行、不破其羣以散其黨，又從而尊之，用事者過矣。</p><p><strong>所出</strong>：《韓非子 · 詭使》 — https://zh.wikisource.org/wiki/韓非子/詭使</p></article></main></div></div>
