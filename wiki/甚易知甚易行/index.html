    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 甚易知甚易行</nav></header><main><article><h1>甚易知甚易行</h1><p>道之言易知易行，而天下莫能行者。</p><p>吾言甚易知，甚易行。天下莫能知，莫能行。</p><p>此章首句。老子謂己之言簡而要，順其自然，固易知易行也；而天下之眾，乃不能知、不能行者，何哉？蓋世俗馳騖於智巧，離道日遠，反以難得為貴、淺近為賤耳。是以知之者希，行之者寡，良有以也。</p><p>夫唯無知，是以不我知。此正言世俗之無知也。不知者，以有知自眩，而不復能知彼之真知。[[言不可以不察]]之義，於斯益驗。</p><p><strong>所出</strong>：《道德經 (王弼本) · 七十章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
