    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 姜嬴其孰興</nav></header><main><article><h1>姜嬴其孰興</h1><p>姜、嬴之國，大而有德者近興。</p><p>桓公問諸姬既興之後，姜、嬴其孰興。史伯對曰：「夫國大而有德者近興，秦仲、齊侯，姜、嬴之雋也，且大，其將興乎？」秦為嬴姓，齊為姜姓，皆有聖賢之裔。伯夷能禮於神以佐堯，伯翳能議百物以佐舜，其後皆不失祀而未有興者，至是將興也。</p><p><strong>所出</strong>：《國語 · 卷16》 — https://zh.wikisource.org/wiki/國語/卷16</p></article></main></div></div>
