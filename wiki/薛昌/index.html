    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 薛昌</nav></header><main><article><h1>薛昌</h1><p>商陸酒一飲，耳鼻血流，形骸再造，洞見遠近。</p><p>道士薛昌，幽薊人。唐天寶間棲止蜀青城洞天觀。忽得商陸酒飲之，耳鼻血流死。經三日，蹙然而蘇，肌膚潔白，容狀頓少，身輕目明，勢欲飛舉。數日之外，洞見遠近，雖山林崖矍，不隔視聽。時玄宗尚道，節度使延致，欲送京，倏失所在。或有大面山見之者。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 37》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/37</p></article></main></div></div>
