    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 吳子近刑人</nav></header><main><article><h1>吳子近刑人</h1><p>吳子輕身輕出，卒於閽人之手，君子以為近刑人而自取之也。</p><p>吳子謁伐楚門于巢，卒。以伐楚之事門于巢，卒也。吳子近刑人也。</p><p>吳子好大喜功，輕身而出，入他人之門，被閽人之箭而死。夫閽者，賤人也，非有怨於吳子，乃吳子自致之耳。輕犯非其地而死，是自輕而忘戒也。君子以吳子之死為「近刑人」之戒，蓋閽守門之人，與刑徒相類，近之則危矣。吳子不謹，故及焉。</p><p><strong>所出</strong>：《春秋穀梁傳 · 襄公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/襄公</p></article></main></div></div>
