    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 臣請當之</nav></header><main><article><h1>臣請當之</h1><p>子罕辭賞讓怨，而宋君竟失國</p><p>子罕相宋，請以賞罰分授：君行賞，臣掌刑。國人知殺戮之專在子罕，恭親畏之。期年，子罕遂卻宋君而專政。此[[魚不可脫於淵]]之驗也。</p><p><strong>所出</strong>：《淮南子 · 道應訓》 — https://zh.wikisource.org/wiki/淮南子/道應訓</p></article></main></div></div>
