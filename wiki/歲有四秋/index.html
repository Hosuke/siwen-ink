    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 歲有四秋</nav></header><main><article><h1>歲有四秋</h1><p>歲有四秋，分屬四時，因時發令，物之輕重相什而相伯。</p><p>管子言：夫歲有四秋，而分有四時。</p><p>春之秋：農事且作，請以什伍農夫賦耜鐵。
夏之秋：大夏且至，絲纊之所作。
秋之秋：大秋成，五穀之所會。
冬之秋：大冬營室中，女事紡績緝縷之所作。</p><p>歲有四秋，而分有四時。已有四者之序，發號出令，物之輕重相什而相伯。故物不得有常固，衡無數也。</p><p><strong>所出</strong>：《管子 · 第81篇輕重乙》 — https://zh.wikisource.org/wiki/管子/第81篇輕重乙</p></article></main></div></div>
