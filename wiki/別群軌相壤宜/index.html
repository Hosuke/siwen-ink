    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 別群軌相壤宜</nav></header><main><article><h1>別群軌相壤宜</h1><p>別土宜以定籍使民不移。</p><p>管子言土地有四等之別：莞蒲之壤、竹前檀柘之壤、氾下漸澤之壤、水潦魚鼈之壤。善治者辨其宜而官守之，則地利可盡，而民各安其土，不相移徙，此別群軌相壤宜之旨也。</p><p><strong>所出</strong>：《管子 · 第74篇山國軌》 — https://zh.wikisource.org/wiki/管子/第74篇山國軌</p></article></main></div></div>
