    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 黔首</nav></header><main><article><h1>黔首</h1><p>秦始皇更名天下之民曰黔首。</p><p>始皇三十四年，淳于越進諫言封子弟功臣，李斯上書非之，以為「棄黔首以資敵國，卻賓客以業諸侯，使天下之士退而不敢西向」。黔首，秦時賤稱百姓之辭。</p><p><strong>所出</strong>：《史記 · 卷087》 — https://zh.wikisource.org/wiki/史記/卷087</p></article></main></div></div>
