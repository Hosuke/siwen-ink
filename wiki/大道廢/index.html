    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大道廢</nav></header><main><article><h1>大道廢</h1><p>道廢而後仁義知慧大偽孝慈忠臣見</p><p>，老子所以歎治世之失道也。當此之時，民朴不散，姦宄不生，上無為以正，下自化以淳，則何所用其仁義知慧者？惟夫在上者去道而自為，在下者失德而相賊，於是仁義為之名，知慧為之術，而大偽起焉；六親不和焉，邦家昏亂焉，然後孝茲、貞臣之名始立。此[[有無相生]]之義、對待之理也。老氏之旨，在使人返觀乎大本，奈何大道既隱，枝末隨生，亦可悲也已。</p><p><strong>所出</strong>：《老子 (帛書本) · 章十八》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
