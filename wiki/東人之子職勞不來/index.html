    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 東人之子，職勞不來</nav></header><main><article><h1>東人之子，職勞不來</h1><p>東方之子，專掌勤勞而無慰問</p><p>東人之子，東土之子弟也。職，主也。來，慰問也。言東人之子弟，主掌勤勞之事，而無有來至者以慰問之。相對而言之，則西人之子粲粲衣服，其厚薄之差不亦遠乎。此東人之所以怨也。</p><p><strong>所出</strong>：《詩經 · 大東》 — https://zh.wikisource.org/wiki/詩經/大東</p></article></main></div></div>
