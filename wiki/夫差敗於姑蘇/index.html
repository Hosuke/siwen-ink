    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 夫差敗於姑蘇</nav></header><main><article><h1>夫差敗於姑蘇</h1><p>吳王闔廬伐越，傷指而死，囑夫差報仇</p><p>十九年夏，吳伐越，越王句踐迎擊之槜李。越使死士挑戰，三行造吳師，呼，自剄。吳師觀之，越因伐吳，敗之姑蘇，傷吳王闔廬指，軍卻七里。吳王病傷而死。</p><p>闔廬使立太子夫差，謂曰：「爾而忘句踐殺汝父乎？」對曰：「不敢！」三年，乃報越。</p><p><strong>所出</strong>：《史記 · 卷031》 — https://zh.wikisource.org/wiki/史記/卷031</p></article></main></div></div>
