    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 有事不足以取天下</nav></header><main><article><h1>有事不足以取天下</h1><p>肆其有事，不足以取天下。</p><p>肆其有事，不足以取天下。有事者，有所作為、矜持用智之謂也。聖人觀此二端，乃知有事之不可以有天下，猶有餘災。是以執無為之道，去有事故也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章四十八》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p><hr><p>及其好有事，政教煩苛，民不安泰，不足以治天下。與[[取天下常以無亊]]之義相對。</p><p><strong>所出</strong>：《老子河上公章句 · 忘知》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
