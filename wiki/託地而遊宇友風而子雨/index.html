    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 託地而遊宇，友風而子雨</nav></header><main><article><h1>託地而遊宇，友風而子雨</h1><p>狀雲之德，以風為友，以雨為子，廣大無私。</p><p>雲之為物，託地以遊乎宇宙，友風而子雨。冬日作寒，夏日作暑。功被天下而不私置。其德廣大，其用無方，無物可以塞之，無時不可以成之。荀卿以雲為天下之象，其無所不容，無所偏倚，君子之德似之。</p><p><strong>所出</strong>：《荀子 · 賦篇》 — https://zh.wikisource.org/wiki/荀子/賦篇</p></article></main></div></div>
