    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 係小子弗兼與</nav></header><main><article><h1>係小子弗兼與</h1><p>係附小人，必失君子，不可兼顧。</p><p>六二：「係小子，失丈夫。」象曰：「係小子，弗兼與也。」</p><p>小子者，才低位卑之小人。丈夫者，德厚位高之君子。有所係附於小子，則必失丈夫，不可兼顧而兩得之。君子之於從人，審於取舍，其志不可以不慎也。</p><p><strong>所出</strong>：《周易 · 隨》 — https://zh.wikisource.org/wiki/周易/隨</p></article></main></div></div>
