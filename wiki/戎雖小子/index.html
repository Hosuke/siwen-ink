    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 戎雖小子</nav></header><main><article><h1>戎雖小子</h1><p>王自稱小子，謙也。</p><p>小子者，王之自稱也。厲王以武力自雄，而詩人稱之為「小子」，是譏之也。然「小子」亦古者王之自稱，謙辭也。詩云「戎雖小子，而式弘大」，言王年尚幼，其責任何其重大也。</p><p><strong>所出</strong>：《詩經 · 民勞》 — https://zh.wikisource.org/wiki/詩經/民勞</p></article></main></div></div>
