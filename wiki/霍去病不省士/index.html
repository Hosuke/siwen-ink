    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 霍去病不省士</nav></header><main><article><h1>霍去病不省士</h1><p>霍去病年少顯貴，不懂體恤士卒，軍中乏粮而猶穿域蹋鞠。</p><p>然少而侍中，貴，不省士。其從軍，天子為遣太官齎數十乘，既還，重車餘棄粱肉，而士有饑者。其在塞外，卒乏糧，或不能自振，而驃騎尚穿域蹋鞠。</p><p><strong>所出</strong>：《史記 · 卷111》 — https://zh.wikisource.org/wiki/史記/卷111</p></article></main></div></div>
