    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 菶菶萋萋</nav></header><main><article><h1>菶菶萋萋</h1><p>草木蕃盛，陰陽和暢。</p><p>菶菶萋萋，雝雝喈喈。言梧桐之葉茂盛，鳳皇之鳴和諧，此天地之和，陰陽之氣暢達，治世之象也。</p><p><strong>所出</strong>：《詩經 · 卷阿》 — https://zh.wikisource.org/wiki/詩經/卷阿</p></article></main></div></div>
