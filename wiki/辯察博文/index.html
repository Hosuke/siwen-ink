    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 辯察博文</nav></header><main><article><h1>辯察博文</h1><p>亂世之風，視難知為明察，以博學多文為善辯。</p><p>亂世之聽言也，以難知為察，以博文為辯。夫博學多文，本非罪惡；然不以功用為的，而徒以難知博聞為尚，則是眩惑而非明察，馳騖而非善辯。此亂世所以多文學，而法術之士不得進也。</p><p><strong>所出</strong>：《韓非子 · 問辯》 — https://zh.wikisource.org/wiki/韓非子/問辯</p></article></main></div></div>
