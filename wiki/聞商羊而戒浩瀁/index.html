    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聞商羊而戒浩瀁</nav></header><main><article><h1>聞商羊而戒浩瀁</h1><p>聖人博聞廣識，見微知著，學而已矣。</p><p>《抱朴子》言博學之效：「且夫聞商羊而戒浩瀁，訪鳥砮而洽東肅，諮萍實而言色味，訊土狗而識[<strong>坟羊</strong>]，披《靈寶》而知山隱，因折俎而說專車，瞻離畢而分陰陽之候，由冬螽而覺閏余之錯，何神之有？學而已矣。」</p><p>夫[[六經之教]]所以[[博學詳說]]，聖人之所以[[察往知來]]者，無他，學而已矣。童謠猶助聖人之耳目，況[[聖人與仙人之辨|聖人]]之學乎！</p><p><strong>所出</strong>：《抱朴子 · 卷03》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷03</p></article></main></div></div>
