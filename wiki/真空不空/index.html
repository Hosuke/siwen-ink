    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 真空不空</nav></header><main><article><h1>真空不空</h1><p>真空非頑空，妙有光明，含容萬象。</p><p>真空之性，非寂滅頑空。真空不空，乃是妙有光明，含容萬象，遍照三千。譬如谷應乎響，因空而有，非空無聲，乃空而妙有聲也。若空而不妙，即是寂滅頑空，何能遍河沙乎？如來真空之體，常空常有，常有常空，妙而不空，空而能照，諸境皆不能礙。</p><p><strong>所出</strong>：《悟真直指 · 卷四》 — https://zh.wikisource.org/wiki/悟真直指/卷四</p></article></main></div></div>
