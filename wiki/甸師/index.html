    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 甸師</nav></header><main><article><h1>甸師</h1><p>下士二人，掌帥耕耨王藉共粢盛</p><p>甸師，下士二人；府一人，史二人，胥三十人，徒三百人。</p><p>掌帥其屬而耕耨王藉，以時入之，以共粢盛。祭祀，共蕭茅，共野果蓏之薦。</p><p>喪事，代王受眚災。王之同姓有罪，則死刑焉。帥其徒以薪蒸役外、內饔之事。</p><p><strong>所出</strong>：《周禮 · 天官冢宰》 — https://zh.wikisource.org/wiki/周禮/天官冢宰</p></article></main></div></div>
