    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 決嫌疑定是非</nav></header><main><article><h1>決嫌疑定是非</h1><p>辯治官、使百姓無怨心，此智略之正也，非特武力攻城。</p><p>任安對曰：「夫決嫌疑，定是非，辯治官，使百姓無怨心，安不及仁也。」</p><p><strong>所出</strong>：《史記 · 卷104》 — https://zh.wikisource.org/wiki/史記/卷104</p></article></main></div></div>
