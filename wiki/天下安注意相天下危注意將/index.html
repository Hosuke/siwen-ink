    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天下安注意相，天下危注意將</nav></header><main><article><h1>天下安注意相，天下危注意將</h1><p>陸賈論將相與國勢之關係。</p><p>呂太后時，諸呂擅權，欲劫少主，危劉氏。右丞相陳平患之。陸生往見，深念不已。陸生曰：「天下安，注意相；天下危，注意將。將相和調，則士務附；士務附，天下雖有變，即權不分。為社稷計，在兩君掌握耳。」</p><p>陳平納其計，以五百金為絳侯壽，厚具樂飲；太尉亦報如之。兩人深相結，則呂氏謀益衰。</p><p><strong>所出</strong>：《史記 · 卷097》 — https://zh.wikisource.org/wiki/史記/卷097</p></article></main></div></div>
