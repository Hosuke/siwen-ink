    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 毋起大眾</nav></header><main><article><h1>毋起大眾</h1><p>孟春、季夏之月，禁起大眾，以妨農事、搖養氣。</p><p>孟春不可以稱兵，稱兵必天殃。又命大史守典奉法，毋失經紀。是月也，命野虞出行田原，毋起土功，毋發大眾。季夏之月，不可以興土功，不可以合諸侯，不可以起兵動眾，毋舉大事，以搖養氣。毋發令而待，以妨神農之事也。</p><p><strong>所出</strong>：《禮記 · 月令》 — https://zh.wikisource.org/wiki/禮記/月令</p></article></main></div></div>
