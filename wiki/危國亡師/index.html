    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 危國亡師</nav></header><main><article><h1>危國亡師</h1><p>進不以禮、退不以道，為危國亡師之本。</p><p>《清人》之《序》曰：「公子素惡高克，進之不以禮，文公退之不以道，危國亡師之本。」</p><p>進之以禮者，審其才德而後用之，不以私意濫加恩禮；退之以道者，明其罪愆而後去之，不以非義驅迫之出。二者皆失，則小人進而君子退，政事日紊，師旅日弛，國之危亡隨之。公子素知此為危亡之本，故作詩以刺文公之不明、嗟高克之不才，而歎夫進退之道不可一日忽也。</p><p><strong>所出</strong>：《詩經 · 清人》 — https://zh.wikisource.org/wiki/詩經/清人</p></article></main></div></div>
