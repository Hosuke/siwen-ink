    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 泉雨五尺</nav></header><main><article><h1>泉雨五尺</h1><p>霖雨過盈則君必辱，待五穀者衆則國可立。</p><p>管子曰：「泉雨五尺，其君必辱。食稱之國必亡。待五穀者衆也。故樹木之勝霜露者，不受令於天。家足其所者，不從聖人。故奪然後予，高然後下，喜然後怒，天下可舉。」</p><p><strong>所出</strong>：《管子 · 第81篇輕重乙》 — https://zh.wikisource.org/wiki/管子/第81篇輕重乙</p></article></main></div></div>
