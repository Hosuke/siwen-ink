    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 述經敘理</nav></header><main><article><h1>述經敘理</h1><p>論之為文，在於依據經典，闡述義理。</p><p>聖哲彝訓曰經，述經敘理曰論。[[經]]者，聖賢垂教之典；[[論]]者，據經而立義、推理成章之文也。經以垂範為本，論以闡述為用，二者體異而義相資。</p><p><strong>所出</strong>：《文心雕龍 · 論說》 — https://zh.wikisource.org/wiki/文心雕龍/論說</p></article></main></div></div>
