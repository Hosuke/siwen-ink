    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三亡</nav></header><main><article><h1>三亡</h1><p>以亂、以邪、以逆攻敵，必至於亡。</p><p>臣竊聞之：「以亂攻治者亡，以邪攻正者亡，以逆攻順者亡。」今天下之府庫不盈，囷倉空虛，悉其士民，張軍數十百萬，其頓首戴羽為將軍斷死於前者不至千人，皆以言死。白刃在前，斧鑕在後，而卻走不能死也，非其士民不能死也，上不能故也。言賞則不與，言罰則不行，賞罰不信，故士民不死也。</p><p><strong>所出</strong>：《韓非子 · 初見秦》 — https://zh.wikisource.org/wiki/韓非子/初見秦</p></article></main></div></div>
