    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 徒御不驚</nav></header><main><article><h1>徒御不驚</h1><p>步卒車乘皆有紀律，肅然無譁也。</p><p>「徒御不驚」，言車之御者、步之徒卒，皆有常度，不喧譁，不驚擾，[[蕭蕭馬鳴]]，[[悠悠斾旌]]，整然而不亂也。大軍之動，肅穆如此，故能佐王功、成大獵。《車攻》終章言此，以見宣王師旅訓練之功。</p><p><strong>所出</strong>：《詩經 · 車攻》 — https://zh.wikisource.org/wiki/詩經/車攻</p></article></main></div></div>
