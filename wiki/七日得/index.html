    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 七日得</nav></header><main><article><h1>七日得</h1><p>六二爻辭，言失物不逐，七日自復，以況守中待時之義。</p><p>六二：「婦喪其茀，勿逐，七日得。」[[象曰]]：「七日得，以中道也。」喪失其物，不汲汲以求，靜以待之，七日之間自然復得。守持中道，不妄作為，時至自有獲也。</p><p><strong>所出</strong>：《周易 · 既濟》 — https://zh.wikisource.org/wiki/周易/既濟</p></article></main></div></div>
