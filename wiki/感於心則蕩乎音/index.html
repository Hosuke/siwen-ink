    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 感於心則蕩乎音</nav></header><main><article><h1>感於心則蕩乎音</h1><p>心動則音動，外音乃內心之感發。</p><p>感於心則蕩乎音，音成於外而化乎內。樂之和者，生於人心之感觸，而發為聲音以動人也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷六》 — https://zh.wikisource.org/wiki/呂氏春秋/卷六</p></article></main></div></div>
