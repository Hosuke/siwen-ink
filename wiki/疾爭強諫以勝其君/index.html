    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 疾爭強諫以勝其君</nav></header><main><article><h1>疾爭強諫以勝其君</h1><p>強諫之臣以師徒之勢陵脅其君，雖死不辭。</p><p>若夫關龍逄、王子比干、隨季梁、陳泄冶、楚申胥、吳子胥，此六人者，皆疾爭強諫以勝其君。言聽事行，則如師徒之勢；一言而不聽，一事而不行，則陵其主以語，待之以其身，雖身死家破，要領不屬，手足異處，不難為也。</p><p><strong>所出</strong>：《韓非子 · 說疑》 — https://zh.wikisource.org/wiki/韓非子/說疑</p></article></main></div></div>
