    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 遺秉滯穗</nav></header><main><article><h1>遺秉滯穗</h1><p>收者失拾之穗，利及寡婦</p><p>彼有不獲穉，此有不斂穧。彼有遺秉，此有滯穗，伊寡婦之利。言收田之時，或有不盡斂者，其遺秉、滯穗，留以待寡婦之取也。詩人美其澤下及於無告之民，亦先王餘惠之遺意。</p><p><strong>所出</strong>：《詩經 · 大田》 — https://zh.wikisource.org/wiki/詩經/大田</p></article></main></div></div>
