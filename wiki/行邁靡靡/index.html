    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 行邁靡靡</nav></header><main><article><h1>行邁靡靡</h1><p>步行遲緩而無力。</p><p>詩三章皆云「行邁靡靡」。行邁者，行道而去也；靡靡者，遲緩貌。詩人步履遲重，不欲前進，非力不足，乃心之不忍去也。蓋見故都丘墟，傷心惨目，雖欲亟去以避其悲，而足下遲遲，若有所戀。是情見乎辭，行止之間而悲可知已。</p><p><strong>所出</strong>：《詩經 · 黍離》 — https://zh.wikisource.org/wiki/詩經/黍離</p></article></main></div></div>
