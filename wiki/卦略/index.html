    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 卦略</nav></header><main><article><h1>卦略</h1><p>撮述諸卦大旨，以明觀象求義之法。</p><p>總論一卦之體者曰象，各辯一爻之義者亦曰象。統論卦體，象各明一爻之義。屯此一卦皆陰爻求陽，弱者不能自濟必依於強。蒙陰爻亦先求陽，闇者求明，明者不諮於闇。履皆以陽處陰為美。臨剛長之卦，柔有其德乃得免咎。觀以所見為美，近尊為尚。之大過棟橈之世，本末皆弱，陽爻皆以居陰位為美。遯小人浸長，亨在於外。大壯未有違謙越禮能全其壯。睽者睽而通，觀之義最見。豐明以動，尚於光顯，不應陰為美。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷10》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷10</p></article></main></div></div>
