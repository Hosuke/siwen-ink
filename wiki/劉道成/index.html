    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 劉道成</nav></header><main><article><h1>劉道成</h1><p>學黃老術，全家白日昇天。</p><p>劉道成，豫章新昊人也，學黃老術。晉懷帝永嘉中，以明經入仕，累遷陳州刺史。後歸鄉里，精持香火，奉大羅真符。後數十年，全家白日昇天。</p><p>徐鉉作開業觀碑云：「永嘉二年八月十五日，舉族上昇，裏中數千人望雲送別。」</p><p>梁武帝大同中，立宅為開業觀，今名昭德，去縣治百餘步。白玉蟾訪昭德，陳靈寶詩云：「我見鄉仙不是誇，面顏玉鍊燦丹霞。新開天上圖書府，舊是雲中鸚犬家。三十七年心勝鐵，百千萬事眼無花。」</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 31》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/31</p></article></main></div></div>
