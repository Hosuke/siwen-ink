    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 令不虛行</nav></header><main><article><h1>令不虛行</h1><p>國不虛重，兵不虛勝，民不虛用，令不虛行。</p><p>故國不虛重，兵不虛勝，民不虛用，令不虛行。</p><p>凡國之重也，必待兵之勝也，而國乃重。凡兵之勝也，必待民之用也，而兵乃勝。凡民之用也，必待令之行也，而民乃用。</p><p><strong>所出</strong>：《管子 · 第15篇重令》 — https://zh.wikisource.org/wiki/管子/第15篇重令</p></article></main></div></div>
