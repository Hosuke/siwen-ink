    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 觀其所感</nav></header><main><article><h1>觀其所感</h1><p>觀感通之理，可見天地萬物之情</p><p>觀其所感，而天地萬物之情可見矣。</p><p>聖人觀天之感地，地之感天，知陰陽之相交也；觀人之相感，心之相通，知善惡之所由也；觀物之相感，類之相從，知進退之有時也。是故觀感之道，可以知幽明之故，可以見生死之說，可以通鬼神之情。</p><p>感通萬物之道，見天地之情。以此修身，則能感通天下。</p><p><strong>所出</strong>：《周易 · 咸》 — https://zh.wikisource.org/wiki/周易/咸</p></article></main></div></div>
