    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 開國承家</nav></header><main><article><h1>開國承家</h1><p>大君有命，成功受封，建國承家；然小人不可用。</p><p>上六大君有命，開國承家。師還受賞，大君命之，開邦建國，承襲家業，此功成名遂之時也。然小人勿用，用之必亂邦。象曰：「大君有命，以正功也。小人勿用，必亂邦也。」</p><p><strong>所出</strong>：《周易 · 師》 — https://zh.wikisource.org/wiki/周易/師</p></article></main></div></div>
