    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 狼跋</nav></header><main><article><h1>狼跋</h1><p>以狼之行蹌躙而喻聖人處變不失其度</p><p>《狼跋》，《詩經·國風》之篇也。凡二章，章四句。</p><p>詩言：「狼跋其胡，載疐其尾。公孫碩膚，赤舄几几。狼疐其尾，載跋其胡。公孫碩膚，德音不瑕。」</p><p>《毛詩序》云：「周公也。周公攝政，遠則四國流言，近則王不知周，大夫美其不失其聖也。」</p><p>夫狼之行也，跋則躙其胡，疐則躓其尾，蓋狀其蹌躙之態。然詩人取以為喻，謂公孫（即周公）碩大而美，履赤舄，佩几几，雖遇艱屯，不失威儀。是知聖人涉世，雖有跋疐之虞，而其德音昭然，無瑕可指也。</p><p><strong>所出</strong>：《詩經 · 狼跋》 — https://zh.wikisource.org/wiki/詩經/狼跋</p></article></main></div></div>
