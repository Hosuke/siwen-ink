    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 臣有德益祿</nav></header><main><article><h1>臣有德益祿</h1><p>晏子以德祿相應之理，辭景公增封之邑。</p><p>晏子相齊，衣十升之布，食脫粟之食，五卵、苔菜而已。公為之封邑，使田無宇致之。晏子辭曰：「昔吾先君太公受之營丘，為地五百里，為世國長。自太公至於公之身，有數十公矣，苟能說其君以取邑，不至公之身，趣齊搏以求升土，不得容足而寓焉。」遂不受。</p><p>德盛而祿加，德薄而祿退，此天道也。晏子之不受，非徒廉也，實畏天道之盈也。</p><p><strong>所出</strong>：《晏子春秋 · 卷六》 — https://zh.wikisource.org/wiki/晏子春秋/卷六</p></article></main></div></div>
