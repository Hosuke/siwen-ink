    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 子桑歌</nav></header><main><article><h1>子桑歌</h1><p>子桑貧病，歌於門，詰父母天地皆非私我，至此極者命也夫。</p><p>子桑户、孟子反、子琴張三人相與友。子桑户死，子輿裹飯而往食之。至子桑之門，則若歌若哭，鼓琴曰：「父邪，母邪？天乎，人乎？」有不任其聲而趨舉其詩焉。子輿入，曰：「子之歌詩，何故若是？」曰：「吾思夫使我至此極者而弗得也。父母豈欲吾貧哉？天无私覆，地无私載，天地豈私貧我哉？求其爲之者而不得也。然而至此極者，命也夫！」</p><p><strong>所出</strong>：《莊子 · 大宗師》 — https://zh.wikisource.org/wiki/莊子/大宗師</p></article></main></div></div>
