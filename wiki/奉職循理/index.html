    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 奉職循理</nav></header><main><article><h1>奉職循理</h1><p>居官奉職、循理行事，可以爲治</p><p>太史公序循吏曰：「奉職循理，亦可以爲治，何必威嚴哉？」言爲官者但能奉其職業、循其事理，則無需威刑迫脇，而民自化之。此循吏之本旨也。</p><p><strong>所出</strong>：《史記 · 卷119》 — https://zh.wikisource.org/wiki/史記/卷119</p></article></main></div></div>
