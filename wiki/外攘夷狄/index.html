    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 外攘夷狄</nav></header><main><article><h1>外攘夷狄</h1><p>宣王整飭軍旅，以抗禦外患。</p><p>厲王失德，戎狄內侵，諸侯離心。宣王承弊，起而振之，外攘夷狄，脩車馬，備器械，征討不庭。此王者之武功，所以安內而攘外者也。詩序稱宣王「外攘夷狄」，與[[內脩政事]]相表裏，內修則外治，武功成則文治備。</p><p><strong>所出</strong>：《詩經 · 車攻》 — https://zh.wikisource.org/wiki/詩經/車攻</p></article></main></div></div>
