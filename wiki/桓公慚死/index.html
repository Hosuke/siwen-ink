    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 桓公慚死</nav></header><main><article><h1>桓公慚死</h1><p>桓公不能用仲言，卒遭四子作難，援素幭裹首而絕，死後蟲出於戶。</p><p>管仲死後，桓公憎四子，廢之官，逐之。已而四子作難，圍公一室，不得出。有一妇人從竇入，告以飢渴不可得，蓋易牙、豎刁、堂巫、公子開方四人分齊國，塗十日不通矣。桓公歎曰：「聖人之言長乎哉！死者無知則已，若有知，吾何面目以見仲父於地下？」乃援素幭以裹首而絕。死十一日，蟲出於戶。桓公之所以身死而不收，以不終用賢也。</p><p><strong>所出</strong>：《管子 · 第32篇小稱》 — https://zh.wikisource.org/wiki/管子/第32篇小稱</p></article></main></div></div>
