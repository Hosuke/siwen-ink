    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 連環可解</nav></header><main><article><h1>連環可解</h1><p>連環無端，動則有解也。</p><p>惠施歷物之意，曰：「南方无窮而有窮，今日適越而昔來。<strong>連環可解也</strong>。我知天之中央，燕之北越之南是也。」</p><p><strong>所出</strong>：《莊子 · 天下》 — https://zh.wikisource.org/wiki/莊子/天下</p></article></main></div></div>
