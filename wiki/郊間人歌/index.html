    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 郊間人歌</nav></header><main><article><h1>郊間人歌</h1><p>巾金巾入天門之術</p><p>郊間人，周宣王時郊間采薪者也。歌曰：「巾金巾，入天門，呼長精，噓玄泉，鳴天鼓，養泥丸。」柱下史云：「活國中人，秘矣。八百歲人目瞳正方，千歲人目理從。采薪者千歲人。」</p><p><strong>所出</strong>：《神仙傳 · 卷六》 — https://zh.wikisource.org/wiki神仙傳/卷六</p></article></main></div></div>
