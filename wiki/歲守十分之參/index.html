    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 歲守十分之參</nav></header><main><article><h1>歲守十分之參</h1><p>王者歲藏十分之三，以待凶年而民不知荒。</p><p>王者歲守十分之參，三年與少半成歲，三十一年而藏十一年，與少半藏參之。以此守粟，一不足以傷民，而農夫敬事力作，故天毀埊凶旱水泆之歲，民無入於溝壑乞請者。藏之於未匱，用之於不匱，此守時以待天權之道也。</p><p><strong>所出</strong>：《管子 · 第75篇山權數》 — https://zh.wikisource.org/wiki/管子/第75篇山權數</p></article></main></div></div>
