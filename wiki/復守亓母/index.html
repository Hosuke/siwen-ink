    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 復守亓母</nav></header><main><article><h1>復守亓母</h1><p>歸本返始，守道不渝</p><p>「既得亓母，以知亓子，復守亓母。」言[[既得亓母]]之後，更當歸而守之，不可以既得而忘返。[[以知亓子]]是智之用，[[復守亓母]]是守之實。智用以觀物，守母以保真；觀物而不返，則逐物忘本；守母而不已，則沒身不殆。《[[老子 (帛書校勘版)]]》此言與王弼本「既得其母，以知其子；復守其母，沒身不殆」義同，而文字小異，旨歸一揆。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第十五章 守母》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
