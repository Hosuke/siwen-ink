    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 伏煉九鼎</nav></header><main><article><h1>伏煉九鼎</h1><p>聖賢伏以真火，煉九鼎之精，以成仙道。</p><p>惟昔聖賢，懷玄抱真，伏煉九鼎，化跡隱淪。</p><p>九鼎者，藥物之象，陰陽之樞。聖賢伏以真火，烹煉精華，則形跡隱沒，而與造化合焉。</p><p><strong>所出</strong>：《周易參同契 · 31章》 — https://zh.wikisource.org/wiki/周易參同契/31章</p></article></main></div></div>
