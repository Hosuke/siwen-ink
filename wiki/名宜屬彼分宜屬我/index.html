    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 名宜屬彼分宜屬我</nav></header><main><article><h1>名宜屬彼分宜屬我</h1><p>名與分各有歸屬，不可混亂</p><p>名稱者，何彼此而檢虛實者也。自古至今，莫不用此而得，用彼而失。失者，由名分混；得者，由名分察。今親賢而疏不肖，賞善而罰惡，賢、不肖、善、惡之名，宜在彼，親、疏、賞、罰之稱宜屬我。我之與彼，各得一名，名之察者也。名賢不肖為親疏，名善惡為賞罰，合彼我之一稱，而不別之，名之混者也。</p><p><strong>所出</strong>：《尹文子 · 大道上》 — https://zh.wikisource.org/wiki/尹文子/大道上</p></article></main></div></div>
