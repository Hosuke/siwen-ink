    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 臣重則擅主</nav></header><main><article><h1>臣重則擅主</h1><p>臣重之實，擅主也；有擅主之臣，則君令不下究，臣情不上通。</p><p>「或曰」論管仲之失曰：桓公所以身死蟲流出户不葬者，是臣重也。臣重之實，擅主也。有擅主之臣，則君令不下究，臣情不上通。一人之力能隔君臣之間，使善敗不聞，禍福不通，故有不葬之患也。</p><p>明主之道：一人不兼官，一官不兼事；卑賤不待尊貴而進，大臣不因左右而見；百官脩通，羣臣輻湊；有賞者君見其功，有罰者君知其罪。見知不悖於前，賞罰不弊於後，安有不葬之患？</p><p><strong>所出</strong>：《韓非子 · 難一》 — https://zh.wikisource.org/wiki/韓非子/難一</p></article></main></div></div>
