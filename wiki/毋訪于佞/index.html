    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 毋訪于佞</nav></header><main><article><h1>毋訪于佞</h1><p>治國當遠佞人、諂者、暴者、讒者，四者用則君義亡。</p><p>「毋訪于佞」，言毋用佞人也，用佞人則私多行；「毋蓄于諂」，言毋聽諂，聽諂則欺上；「毋育于凶」，言毋使暴，使暴則傷民；「毋監于讒」，言毋聽讒，聽讒則失士。夫行私、欺上、傷民、失士，此四者用，所以害君義失正也。</p><p><strong>所出</strong>：《管子 · 第11篇宙合》 — https://zh.wikisource.org/wiki/管子/第11篇宙合</p></article></main></div></div>
