    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 執無兵</nav></header><main><article><h1>執無兵</h1><p>持兵若未持，器之形不露。</p><p>[[行無行]] 攘無臂 執無兵三義相承，皆言聖人用兵之妙在於无形。執兵者，人得而見之；執無兵者，人不得而窺之。兵之形不露，則敵無從測我淺深；形不見而威自加，此聖人所以無敵也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第三十四章 用兵》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)
===</p><hr><p><strong>所出</strong>：《老子河上公章句 · 玄用》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
