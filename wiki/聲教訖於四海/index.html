    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聲教訖於四海</nav></header><main><article><h1>聲教訖於四海</h1><p>德化廣被，無遠弗屆</p><p>東漸于海，西被于流沙，朔南暨聲教，訖于四海。禹功既成，玄圭以錫。天子之德，無遠弗屆；萬邦之民，咸被堯舜之化。是以車書同軌，衡運無遺，萬國來同，九州清晏。聖人之所以參天地、贊化育者，於斯驗矣。</p><p><strong>所出</strong>：《尚書 · 禹貢》 — https://zh.wikisource.org/wiki/尚書/禹貢</p></article></main></div></div>
