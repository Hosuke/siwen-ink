    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 政貴有恆</nav></header><main><article><h1>政貴有恆</h1><p>為政貴在恆久，不屢變也。</p><p>王戒畢公「政貴有恆」。為政之道貴在恆常，守而不變；若屢有更張，民不知所從，治道隳矣。</p><p><strong>所出</strong>：《尚書 · 畢命》 — https://zh.wikisource.org/wiki/尚書/畢命</p></article></main></div></div>
