    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 征有扈</nav></header><main><article><h1>征有扈</h1><p>啟立，有扈不服，啟誓師以伐之，稱共行天罰，遂滅有扈，天下咸朝。</p><p>啟伐有扈，大戰於甘。將戰，作甘誓，乃召六卿申之。曰：「威侮五行，怠棄三正，天用勦絕其命。今予維共行天之罰。左不攻于左，右不攻于右，女不共命。御非其馬之政，女不共命。用命，賞于祖；不用命，僇于社，予則帑僇女。」遂滅有扈。天下咸朝。</p><p><strong>所出</strong>：《史記 · 卷002》 — https://zh.wikisource.org/wiki/史記/卷002</p></article></main></div></div>
