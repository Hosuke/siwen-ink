    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 夷床馔于阶间</nav></header><main><article><h1>夷床馔于阶间</h1><p>夷床陳于兩階之間以居柩。</p><p>夷床馔于階間。夷床，空床也。所以載柩，正之于兩楹之間。先時用于殯，此時用于祖廟也。</p><p><strong>所出</strong>：《儀禮 · 既夕禮》 — https://zh.wikisource.org/wiki/儀禮/既夕禮</p></article></main></div></div>
