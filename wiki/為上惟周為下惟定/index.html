    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 為上惟周為下惟定</nav></header><main><article><h1>為上惟周為下惟定</h1><p>君道貴周遍無遺，臣道貴安定有常，二者合而成大禮。</p><p>文王問君臣之禮，太公曰：「為上惟臨，為下惟沉。臨而無遠，沉而無隱。為上惟周，為下惟定。周，則天也；定，則地也。或天或地，大禮乃成。」</p><p>又論主位、主聽、主明：「主位當安徐而靜，柔節先定，善與而不爭，虛心平志，待物以正。主聽當勿妄而許，勿逆而拒。主明當目貴明，耳貴聰，心貴智。以天下之目視，則無不見；以天下之耳聽，則無不聞；以天下之心慮，則無不知。輻輳並進，則明不蔽矣。」</p><p><strong>所出</strong>：《六韜》 — https://zh.wikisource.org/wiki/六韜</p></article></main></div></div>
