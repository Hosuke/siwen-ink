    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 與天為徒-之</nav></header><main><article><h1>與天為徒-之</h1><p></p><p>又仲尼語顏回曰：「然則我內直而外曲，成而上比。內直者，與天爲徒。與天爲徒者，知天子之與己皆天之所子，而獨以己言蘄乎而人善之，蘄乎而人不善之邪？若然者，人謂之童子，是之謂與天爲徒。」</p><p>  <strong>所出</strong>：《莊子 · 人間世》 — https://zh.wikisource.org/wiki/莊子/人間世</p></article></main></div></div>
