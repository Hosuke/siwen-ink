    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 籍少公出解</nav></header><main><article><h1>籍少公出解</h1><p>籍少公素不知郭解，解冒求出關，少公竟自殺以絕其蹤。</p><p>解亡，置其母家室夏陽，身至臨晉。臨晉籍少公素不知解，解冒，因求出關。籍少公已出解，解轉入太原，所過輒告主人家。吏逐之，跡至籍少公。少公自殺，口絕。</p><p><strong>所出</strong>：《史記 · 卷124》 — https://zh.wikisource.org/wiki/史記/卷124</p></article></main></div></div>
