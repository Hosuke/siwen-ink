    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五里</nav></header><main><article><h1>五里</h1><p>迎之五里，中道而止，五至而已，五往而藏之氣盡矣，奪其天氣者也。</p><p>迎之五里，中道而止，五至而已，五往而藏之氣盡矣。故五五二十五，而竭其輸矣。此所謂奪其天氣者也，非能絕其命而傾其壽者也。</p><p><strong>所出</strong>：《黃帝內經 · 靈樞第九卷》 — https://zh.wikisource.org/wiki/黃帝內經/靈樞第九卷</p></article></main></div></div>
