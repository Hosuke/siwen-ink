    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 秦襄公始作西畤祠白帝</nav></header><main><article><h1>秦襄公始作西畤祠白帝</h1><p>記襄公居西垂，自謂主少皞之神，作畤祠白帝，用騮黃羝各一。</p><p>秦襄公既列為諸侯，居西垂，自以為主少皞之神，乃作西畤，祠白帝。其牲用騮駒、黃牛、羝羊各一雲。</p><p><strong>所出</strong>：《史記 · 卷028》 — https://zh.wikisource.org/wiki/史記/卷028</p></article></main></div></div>
