    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 陽侯之波</nav></header><main><article><h1>陽侯之波</h1><p>陽侯之波，因人主之志而逆流或止，喻天地之應出於心誠。</p><p>武王伐紂，渡于孟津，陽侯之波逆流而擊，疾風晦冥，人馬不相見。[[武王伐紂]]，左操黃鉞，右秉白旄，瞋目而捴之曰：「余任天下，誰敢害吾意者！」於是風濟而波罷。陽侯之波本自變動，聽命於意志如此。</p><p><strong>所出</strong>：《淮南子 · 覽冥訓》 — https://zh.wikisource.org/wiki/淮南子/覽冥訓</p></article></main></div></div>
