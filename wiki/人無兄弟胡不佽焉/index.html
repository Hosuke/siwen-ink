    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 人無兄弟胡不佽焉</nav></header><main><article><h1>人無兄弟胡不佽焉</h1><p>以無兄弟之切，望人相佽助。</p><p>「人無兄弟，胡不佽焉」，出自《詩經·杕杜》。詩人自言無兄弟可以相依，而望他人以兄弟之道相助。佽，助也。言己已無兄弟，更望道傍之人以相助之道待我。語辭迫切，所以望人之恤己者切也。</p><p><strong>所出</strong>：《詩經 · 杕杜》 — https://zh.wikisource.org/wiki/詩經/杕杜</p></article></main></div></div>
