    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 玄液</nav></header><main><article><h1>玄液</h1><p>玄元之液，除臭去香，治蕩髮齒。</p><p>玄液者，玄元之精華，腎水之英華也。在人身為精為唾為涎為涕為汗，總名玄液。玄者幽遠之稱，液者水穀之精。</p><p>《肝氣章》言「玄液雲行去臭香」，言玄液在身中流行，如雲之布雨，去臭而去香，除垢穢而歸清純。臭者濁，香者染，玄液之行，能滌五方之穢，使臟腑清明，神明通暢。</p><p>「治蕩髮齒」者，治五臟以蕩滌之，髮齒得所養而長固不衰。玄液週流，則齒堅髮烏，骨正筋柔，此保身之要道也。</p><p><strong>所出</strong>：《黃庭內景經 · 肝氣章第三十三》 — https://zh.wikisource/wiki/太上黃庭內景玉經/肝氣章第三十三</p></article></main></div></div>
