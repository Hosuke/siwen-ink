    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無求於民</nav></header><main><article><h1>無求於民</h1><p>聖人之政，不以號令苛擾於民。</p><p>[[以時行]]之道既行，則開闔皆在上，無求於民。朝國守，分上分下，游於分之閒而用足。夫民之用有限，上之取有節，此府庫充盈而民不知乏之術也。管子以「無求」為王國之的要，非不治也，乃不妄取耳。</p><p><strong>所出</strong>：《管子 · 第69篇乘馬數》 — https://zh.wikisource.org/wiki/管子/第69篇乘馬數</p></article></main></div></div>
