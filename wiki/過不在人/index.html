    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 過不在人</nav></header><main><article><h1>過不在人</h1><p>身有過患，莫患人莫己知；民之觀察至明，不可遁逃。</p><p>管子以為，人之患在於己之不善，不在於人莫己知也。丹青在山，民知而取；美珠在淵，民知而取。民之視己，灼然明察，不可遁逃。己有過為，民輒過命。是故我有善則人譽我，我有過則人毀我。先王之所以畏民，正以其觀察之明也。</p><p><strong>所出</strong>：《管子 · 第32篇小稱》 — https://zh.wikisource.org/wiki/管子/第32篇小稱</p></article></main></div></div>
