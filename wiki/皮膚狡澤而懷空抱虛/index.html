    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 皮膚狡澤而懷空抱虛</nav></header><main><article><h1>皮膚狡澤而懷空抱虛</h1><p>輕薄之人外貌華美，內心空乏，無學術之實。</p><p>凡彼輕薄之徒，雖便辟偶俗，廣結伴流，更相推揚，取達速易，然率皆皮膚狡澤，而懷空抱虛。有似蜀人瓠壺之喻，胸中無一紙之誦，所識不過酒炙之事。</p><p>夫學所以致知，業所以廣才。今輕薄之徒，不修學業，不讀詩書，徒以交遊馳逐為能事。及其問以[[言有壇宇行有防表]]之義，則怳悸自失，矇矇不知所對，此所以敗也。</p><p><strong>所出</strong>：《抱朴子 · 卷25》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷25</p></article></main></div></div>
