    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 趙殺范痤</nav></header><main><article><h1>趙殺范痤</h1><p>魏以地殺賢臣，適足以資敵。</p><p>趙使人謂魏王曰：「爲我殺范痤，吾請獻七十里之地。」魏王使吏捕范痤，圍而未殺。</p><p>范痤上屋騎危，謂使者曰：「與其以死痤市，不如以生痤市。有如痤死，趙不予王地，則王將柰何？故不若與先定割地，然後殺痤。」魏王善之。</p><p>范痤又因上書信陵君曰：「痤故魏之免相也，趙以地殺痤而魏王聽之，有如彊秦亦將襲趙之欲，則君且柰何？」信陵君言於魏王，乃出范痤。</p><p>此事言以地易人者，非策之上也。</p><p><strong>所出</strong>：《史記 · 魏世家》 — https://zh.wikisource.org/wiki/史記/魏世家</p></article></main></div></div>
