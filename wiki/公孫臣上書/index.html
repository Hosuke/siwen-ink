    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 公孫臣上書</nav></header><main><article><h1>公孫臣上書</h1><p>孝文時公孫臣言漢當更元改正朔，以土德受命。</p><p>孝文時，魯人公孫臣以終始五德上書，言「漢得土德，宜更元，改正朔，易服色。當有瑞，瑞黃龍見」。事下丞相張蒼，張蒼亦學律曆，以為非是，罷之。其後黃龍見成紀，張蒼自黜，所欲論著不成。而新垣平以望氣見，頗言正曆服色事，貴幸，後作亂，故孝文帝廢不復問。</p><p><strong>所出</strong>：《史記 · 卷026》 — https://zh.wikisource.org/wiki/史記/卷026</p></article></main></div></div>
