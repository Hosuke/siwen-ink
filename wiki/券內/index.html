    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 券內</nav></header><main><article><h1>券內</h1><p>券內者行乎无名，券外者志乎期費；行乎无名者唯庸有光。</p><p>券內者，行乎无名；券外者，志乎期費。行乎无名者，唯庸有光；志乎期費者，唯賈人也。人見其跂，猶之魁然。與物窮者，物入焉；與物且者，其身之不能容，焉能容人！不能容人者无親，无親者盡人。</p><p><strong>所出</strong>：《莊子 · 庚桑楚》 — https://zh.wikisource.org/wiki/莊子/庚桑楚</p></article></main></div></div>
