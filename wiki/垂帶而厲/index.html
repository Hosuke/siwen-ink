    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 垂帶而厲</nav></header><main><article><h1>垂帶而厲</h1><p>帶垂於身而有威儀</p><p>彼都人士，垂帶而厲。</p><p>語出《詩經·小雅·都人士》。厲，垂帶之貌。都人士之衣帶，垂然而下，自有威儀，非若後世衣服之無常也。帶之垂厲，乃從容有常之意，正與前「衣服不貳，從容有常」之義相發明焉。</p><p><strong>所出</strong>：《詩經 · 都人士》 — https://zh.wikisource.org/wiki/詩經/都人士</p></article></main></div></div>
