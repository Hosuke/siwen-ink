    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 言行相詭</nav></header><main><article><h1>言行相詭</h1><p></p><p>《墨子·魯問》載魯君問其二子孰可以為太子：「一人者好學，一人者好分人財。」子墨子曰：「未可知也，或所為賞與為是也。魡者之恭，非為魚賜也；餌鼠以蟲，非愛之也。吾願主君之合其志功而觀焉。」</p><p>此節闡明觀人之要：在合[[志功而觀]]。魡者之恭，非愛魚也，乃為求魚；餌鼠以蟲，非愛鼠也，乃為得鼠。學者好學，或為邀賞；分人財者，或為求名。不可但觀其行，必察其志；亦不可但聽其言，必考其功。[[言行相詭]]之事，世多有之，故聖人貴「合志功而觀」也。</p></article></main></div></div>
