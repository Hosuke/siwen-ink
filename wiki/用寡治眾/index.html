    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 用寡治眾</nav></header><main><article><h1>用寡治眾</h1><p>寡眾各有其道，用之得其宜則無不勝。</p><p>凡戰之道：用寡固，用眾治。寡利煩，眾利正。用眾進止，用寡進退。</p><p>眾以合寡，則遠裹而闕之；若分而迭擊，寡以待眾。若眾疑之，則自用之。擅利則釋旗，迎而反之。敵若眾則相聚而受裹。敵若寡若畏，則避之開之。</p><p>又有觀變之道：眾寡以觀其變，進退以觀其固，危而觀其懼，靜而觀其怠，動而觀其疑，襲而觀其治。擊其疑，加其卒，致其屈，襲其規，因其不避，阻其圖，奪其慮，乘其懼。</p><p><strong>所出</strong>：《司馬法》 — https://zh.wikisource.org/wiki/司馬法</p></article></main></div></div>
