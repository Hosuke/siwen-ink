    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鳥飛准繩</nav></header><main><article><h1>鳥飛准繩</h1><p>大人行事，不拘小節，唯取大意；若鳥之南北，委曲皆合繩。</p><p>「鳥飛准繩」，此言大人之義也。夫鳥之飛也，必還山集谷，不還山則困，不集谷則死。山與谷之處也，不必正直，而還山集谷，曲則曲矣，而名繩焉。以為鳥起于北，意南而至于南；起于南，意北而至于北。苟大意得，不以小缺為傷。故聖人美而著之曰：「千里之路，不可扶以繩。萬家之都，不可平以准。」言大人之行，不必以先，帝常義立之謂賢。</p><p><strong>所出</strong>：《管子 · 第11篇宙合》 — https://zh.wikisource.org/wiki/管子/第11篇宙合</p></article></main></div></div>
