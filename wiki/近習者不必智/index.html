    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 近習者不必智</nav></header><main><article><h1>近習者不必智</h1><p>近君主之臣未必有智，人主聽之則智塞。</p><p>今近習者不必智，人主之於人或有所知而聽之，入因與近習論其言，聽近習而不計其智，是與愚論智也。</p><p><strong>所出</strong>：《韓非子 · 人主》 — https://zh.wikisource.org/wiki/韓非子/人主</p></article></main></div></div>
