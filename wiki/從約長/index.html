    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 從約長</nav></header><main><article><h1>從約長</h1><p>六國合從之首腦，蘇秦為之。</p><p>蘇秦約六國從親，佩六國相印，為[[從約長]]，令秦兵不敢出函谷關。</p><p><strong>所出</strong>：《史記 · 卷069》 — https://zh.wikisource.org/wiki/史記/卷069</p></article></main></div></div>
