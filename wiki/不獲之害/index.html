    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不獲之害</nav></header><main><article><h1>不獲之害</h1><p>宜獲而不獲，風雨敗穀，民將零落。</p><p>宜獲而不獲，風雨將作，五穀以削，士民零落，不獲之害也。</p><p>言秋收之不可失也。及時而獲，則穀成入倉；若失此時，則風雨之作足以敗穀，五穀日削，士民之食不足，皆流散零落矣。</p><p><strong>所出</strong>：《管子 · 第85篇輕重己》 — https://zh.wikisource.org/wiki/管子/第85篇輕重己</p></article></main></div></div>
