    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鼎顛趾</nav></header><main><article><h1>鼎顛趾</h1><p>鼎倒趾悖，因得去故而納新。</p><p>初六爻辭：「鼎顛趾，利出否，得妾以其子，无咎。」鼎顛而趾向天，其用在革。利在排出污穢之物，納清新之實。猶[[得妾以其子]]，由賤而貴，因事而成，亦无咎也。</p><p>象曰：「鼎顛趾，未悖也。利出否，以從貴也。」</p><p><strong>所出</strong>：《周易 · 鼎》 — https://zh.wikisource.org/wiki/周易/鼎</p></article></main></div></div>
