    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 沌沌</nav></header><main><article><h1>沌沌</h1><p>渾淪無別，聖人守一不析。</p><p>沌沌兮，無所分別。</p><p>混沌者，無清濁之析、無是非之別也。世俗之人分析馳求，聖人沌沌若此，無可分之善惡、無可別之可否，守一而不歧，故無所折。</p><p><strong>所出</strong>：《老子河上公章句 · 異俗》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
