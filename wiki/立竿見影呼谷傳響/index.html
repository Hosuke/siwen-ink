    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 立竿見影呼谷傳響</nav></header><main><article><h1>立竿見影呼谷傳響</h1><p>喻道之靈驗如影隨形響應山谷</p><p>立竿見影，呼谷傳響。竿立而影生，谷呼而響應，此道之驗也。修煉功深，捷於影響，豈不靈哉！此天地至象，聖人觀之，以喻金丹成道之速。</p><p><strong>所出</strong>：《周易參同契 · 25章》 — https://zh.wikisource.org/wiki/周易參同契/25章</p></article></main></div></div>
