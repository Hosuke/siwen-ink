    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 報怨以德</nav></header><main><article><h1>報怨以德</h1><p>以恩德報怨讎，恕之至也。</p><p>報怨以德者，聖人遇怨不以怨報，而以恩德報之也。世人以怨報怨，怨終不解；聖人以德報怨，怨自消亡。河上公章句云：「大小多少，報怨以德。」蓋恩始於是以德懷人，而怨化為德矣。夫恩之始，在於以德為先，不念舊惡，此聖人之道、霸王之原也。</p><p><strong>所出</strong>：《老子河上公章句 · 恩始》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
