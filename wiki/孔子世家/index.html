    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 孔子世家</nav></header><main><article><h1>孔子世家</h1><p>孔子生平事跡的總述。</p><p>《史記·孔子世家》詳載孔子生平，自魯昌平鄉陬邑生，至周遊列國，卒返魯國整理六藝。其本卷所述，為世家之一部分，與《論語》相表裏，皆聖人之遺訓也。</p><p><strong>所出</strong>：《史記 · 卷047》 — https://zh.wikisource.org/wiki/史記/卷047</p></article></main></div></div>
