    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 吳敗雞父</nav></header><main><article><h1>吳敗雞父</h1><p>吳敗頓、胡、沈、蔡、陳、許之師于雞父，荊蠻之勢浸盛。</p><p>吳敗頓、胡、沈、蔡、陳、許之師于雞甫。胡子髡、沈子盈滅。</p><p>傳曰：「中國不言敗，此其言敗，何也？中國不敗，胡子髡、沈子盈，其滅乎？其言敗，釋其滅也。」又曰：「獲者，非與之辭也，上下之稱也。」吳敗中國之師，諸侯覆沒，而《春秋》書「敗」者，以為諸侯若能自強，不至於亡，特以釋其滅亡之辭也。</p><p><strong>所出</strong>：《春秋穀梁傳 · 昭公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/昭公</p></article></main></div></div>
