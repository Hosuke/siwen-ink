    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 應龍螻蟻</nav></header><main><article><h1>應龍螻蟻</h1><p>應龍凌雲，螻蟻怪其無階而高致；大才之境，非小智所能測。</p><p>應龍徐舉，顧眄而淩雲；汗血緩步，呼吸而千里。故螻蟻怪其無階而高致，駑蹇驚過己之不漸。言大才與小智，境界懸隔，猶天壤之別。《[[應龍螻蟲之喻]]》取義相近，而此以淩雲之龍、千里之馬為喻，彼以神龍、蟲蟻並陳，義相發明。</p><p><strong>所出</strong>：《抱朴子 · 卷45》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷45</p></article></main></div></div>
