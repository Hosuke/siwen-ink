    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 戎狄是膺</nav></header><main><article><h1>戎狄是膺</h1><p>征伐戎狄荊舒以懲創之，威武莫敢當。</p><p>詩云「戎狄是膺，荊舒是懲，則莫我敢承」，又云「公車千乘，朱英綠縢，二矛重弓。公徒三萬，貝冑朱綅，烝徒增增」。</p><p>此述魯國兵力之盛也。公車千乘，每乘步卒七十五人，總計七萬五千人；公徒三萬，言其兵車之屬步卒也。戎狄、荊舒，皆外患也。膺者，擊也。懲者，戒也。魯國征伐戎狄，懲創荊舒，威名遠播，莫敢抵禦。</p><p><strong>所出</strong>：《詩經 · 閟宮》 — https://zh.wikisource.org/wiki/詩經/閟宮</p></article></main></div></div>
