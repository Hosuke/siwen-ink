    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 竪刁身之不愛</nav></header><main><article><h1>竪刁身之不愛</h1><p>管仲以狗喻警示桓公：竪刁自宮以媚，焉能愛君？</p><p>北郭有狗嘊嘊，旦暮欲齧，我猳而不使也。今夫竪刁，其身之不愛，焉能愛君？君必去之。</p><p><strong>所出</strong>：《管子 · 第26篇戒》 — https://zh.wikisource.org/wiki/管子/第26篇戒</p></article></main></div></div>
