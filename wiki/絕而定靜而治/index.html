    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 絕而定靜而治</nav></header><main><article><h1>絕而定靜而治</h1><p>聖王之道，在乎簡靜不擾。</p><p>故曰：絕而定，靜而治，安而尊，舉錯而不變者，聖王之道也。</p><p><strong>所出</strong>：《管子 · 第14篇法禁》 — https://zh.wikisource.org/wiki/管子/第14篇法禁</p></article></main></div></div>
