    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 一朝兩城下</nav></header><main><article><h1>一朝兩城下</h1><p>德行無積而驟勝，亡且及之</p><p>趙襄子攻翟取二城，有憂色，曰：「江河之大不過三日，飄風暴雨，日中不須臾。今趙氏之德行無所積，今一朝兩城下，亡其及我乎！」孔子聞之曰：「趙氏其昌乎！」夫憂者所以為昌，喜者所以為亡。賢主持勝，故福及後世。</p><p><strong>所出</strong>：《淮南子 · 道應訓》 — https://zh.wikisource.org/wiki/淮南子/道應訓</p></article></main></div></div>
