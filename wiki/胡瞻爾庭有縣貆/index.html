    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 胡瞻爾庭有縣貆</nav></header><main><article><h1>胡瞻爾庭有縣貆</h1><p>庭中懸掛之物皆民力所出，在位者何功而享之。</p><p>胡瞻爾庭有縣貆，胡瞻爾庭有縣特，胡瞻爾庭有縣鶉。貆，獾也；特，三歲之獸也；鶉，鳥也。皆言田獵所獲，懸之於庭。庭有縣獸，是不狩不獵而自有者也。</p><p>詩人以此刺在位者之無功受享，正與上文「不素餐」「不素食」「不素飧」相呼應。</p><p><strong>所出</strong>：《詩經 · 伐檀》 — https://zh.wikisource.org/wiki/詩經/伐檀</p></article></main></div></div>
