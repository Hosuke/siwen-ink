    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 梁車刖姊</nav></header><main><article><h1>梁車刖姊</h1><p>法不避親</p><p>梁車新爲鄴令，其姊往看之，暮而後，門閉，因踰郭而入。車遂刖其足。趙成侯以爲不慈，奪之璽而免之令。</p><p>梁車新爲令，依法而行，雖其姊犯法亦刖之。此法不避親之例也。</p><p><strong>所出</strong>：《韓非子 · 外儲說左下》 — https://zh.wikisource.org/wiki/韓非子/外儲說左下
===孫叔敖===</p></article></main></div></div>
