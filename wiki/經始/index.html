    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 經始</nav></header><main><article><h1>經始</h1><p>測度策劃，以起大事也。</p><p>經始者，測度方向，規劃規制，以起事端也。</p><p>《詩》曰「經始靈臺」，言文王以神聖之德，受天之命，建臺以望氣象、習禮樂焉。[[經綸]]之義，[[正經子書相輔|正]]而[[經綸|綸]]之，裁制規制，以成天下之功也。</p><p>[[經典規戒弗聞弗覽|聖人經始]]，皆所以立極垂範，[[明堂]]辟雍，其遺制也。</p><p><strong>所出</strong>：《詩經 · 靈臺》 — https://zh.wikisource.org/wiki/詩經/靈臺</p></article></main></div></div>
