    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五老翁</nav></header><main><article><h1>五老翁</h1><p>斗中五真之神，逡巡守護</p><p>五老翁，大洞經所言斗中天真內景也。</p><p>經云「逡巡五老翁」，言五老翁居斗中，逡巡守護。誦經存想時，五老翁在斗中護持，是為存思之要義也。</p><p><strong>所出</strong>：《上清大洞真經 · 22章》 — https://zh.wikisource.org/wiki/上清大洞真經/22章</p></article></main></div></div>
