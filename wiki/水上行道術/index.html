    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 水上行道術</nav></header><main><article><h1>水上行道術</h1><p>習閉氣或服蔥涕桂丸，可步行水上；通天犀角亦能辟水。</p><p>抱朴子答問水上行道之術：「以蔥涕和桂，服如梧桐子大七丸，日三服，至三年，則能行水上也。鄭君言但習閉氣至千息，久久則能居水中一日許。得真通天犀角三寸以上，刻以為魚，而銜之以入水，水常為人開，方三尺，可得炁息水中。又通天犀角有一赤理如綖，有自本徹末，以角盛米置群雞中，雞欲啄之，未至數寸，即驚卻退。故南人或名通天犀為駭雞犀。以此犀角著米及雞，魚皆驚。」</p><p><strong>所出</strong>：《抱朴子 · 卷17》 — https://zh.wikisource.org/wiki/抱朴子/卷17</p></article></main></div></div>
