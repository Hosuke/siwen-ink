    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 使人臣如手</nav></header><main><article><h1>使人臣如手</h1><p>臣為君之股肱，如手足之於身，各有所司。</p><p>為人臣者，譬之若手，上以脩頭，下以脩足。清暖寒熱，不得不救；鏌鋣傅體，不敢弗搏。無私賢哲之臣，無私事能之士。臣之於君，亦猶手足之於頭目，各盡其職，不敢有所私蔽。此先王所以使臣之意也。</p><p><strong>所出</strong>：《韓非子 · 有度》 — https://zh.wikisource.org/wiki/韓非子/有度</p></article></main></div></div>
