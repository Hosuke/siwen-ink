    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 壽考不亡</nav></header><main><article><h1>壽考不亡</h1><p>祝君子壽考，功德不亡。</p><p>佩玉將將，壽考不亡。君子至止，黻衣繡裳，佩玉將將，其德充於內而形於外，故能壽考不亡。壽考者，長壽也；不亡者，德澤流傳而不滅也。此詩之美秦襄公，期其能保守其位、功德永傳也。</p><p><strong>所出</strong>：《詩經 · 終南》 — https://zh.wikisource.org/wiki/詩經/終南</p></article></main></div></div>
