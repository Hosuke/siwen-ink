    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 代秦鄭衛</nav></header><main><article><h1>代秦鄭衛</h1><p>四國之樂皆備，音律之和美。</p><p>代秦鄭衛，鳴竽張只。伏戲駕辯，楚勞商只。謳和揚阿，趙簫倡只。魂乎歸徠，定空桑只！</p><p>文舉代、秦、鄭、衛四國之樂，以見音律之盛。代地之聲、秦箏之曲、鄭衞之音，各擅其妙。伏戲所製〈駕辯〉、楚地之〈勞商〉，亦皆可歌。趙簫倡導，〈揚阿〉之和，音律相諧如是。魂歸而聽之，乃可定其情於空桑也。</p><p><strong>所出</strong>：《楚辭 · 大招》 — https://zh.wikisource.org/wiki/楚辭/大招</p></article></main></div></div>
