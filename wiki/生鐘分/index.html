    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 生鐘分</nav></header><main><article><h1>生鐘分</h1><p>以三分損益之術，遞算十二辰之數。</p><p>生鐘分：</p><p>丑三分二。寅九分八。辰八十一分六十四。巳二百四十三分一百二十八。午七百二十九分五百一十二。未二千一百八十七分一千二十四。申六千五百六十一分四千九十六。酉一萬九千六百八十三分八千一百九十二。戌五萬九千四十九分三萬二千七百六十八。亥十七萬七千一百四十七分六萬五千五百三十六。</p><p>以黃鐘之實為一，三分去一、二分益一，迭遞而生各律之實。自丑至亥，數皆三倍而增。</p><p><strong>所出</strong>：《史記 · 卷025》 — https://zh.wikisource.org/wiki/史記/卷025</p></article></main></div></div>
