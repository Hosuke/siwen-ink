    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 晉如，愁如，貞吉</nav></header><main><article><h1>晉如，愁如，貞吉</h1><p>六二欲進而愁，守正則受福於王母</p><p>六二居中得正，上應九五。然進而有愁如之象者，蓋所遇非其時歟？貞吉者，言守正則吉。受茲介福，于其王母。象曰：「受茲介福，以中正也。」言六二居中得正，上應尊位，故能受此大福於王母。母者陰之尊稱，王母猶言先祖之蔭也。</p><p><strong>所出</strong>：《周易 · 晉》 — https://zh.wikisource.org/wiki/周易/晉</p></article></main></div></div>
