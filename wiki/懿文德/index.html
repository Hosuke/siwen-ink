    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 懿文德</nav></header><main><article><h1>懿文德</h1><p>法風行天上以修美文章道德。</p><p>懿文德，周易小畜象辭也。象曰「風行天上，小畜，君子以懿文德」。言風行於天，未洽於地，君子觀此，當修美其文章道德，涵養以待時，不以未遇而懈也。</p><p><strong>所出</strong>：《周易 · 小畜》 — https://zh.wikisource.org/wiki/周易/小畜</p></article></main></div></div>
