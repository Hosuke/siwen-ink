    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 應變而動</nav></header><main><article><h1>應變而動</h1><p>事者應變而動，知時者無常行</p><p>徐馮謂王壽曰：「事者，應變而動，變生於時，故知時者無常行。書者，言之所出也；言出於知者，知者藏書。」書為知者之糟粕，非道之全也。[[聖人之糟粕]]之義。</p><p><strong>所出</strong>：《淮南子 · 道應訓》 — https://zh.wikisource.org/wiki/淮南子/道應訓</p></article></main></div></div>
