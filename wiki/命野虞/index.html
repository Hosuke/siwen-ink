    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 命野虞</nav></header><main><article><h1>命野虞</h1><p>季春之月，命野虞循行原野，修利隄防，道達溝瀆，以備農事。</p><p>季春之月，命司空曰：「時雨將降，下水上騰，循行國邑，周視原野，修利隄防，道達溝瀆，開通道路，毋有障塞。田獵、罝罘、羅罔、畢翳、餧獸之藥，毋出九門。」</p><p><strong>所出</strong>：《禮記 · 月令》 — https://zh.wikisource.org/wiki/禮記/月令</p></article></main></div></div>
