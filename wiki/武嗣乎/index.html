    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 武嗣乎</nav></header><main><article><h1>武嗣乎</h1><p>應、韓不在而在晉，武王之子其能嗣興乎。</p><p>桓公問若周衰，諸姬其孰興。史伯對曰：「臣聞之，武實昭文之功，文之祚盡，武其嗣乎！武王之子，應、韓不在，其在晉乎！距險而鄰於小，若加之以德，可以大啟。」言晉為武王之裔，地險兵強，若能用德，必能嗣興周之大業者也。</p><p><strong>所出</strong>：《國語 · 卷16》 — https://zh.wikisource.org/wiki/國語/卷16</p></article></main></div></div>
