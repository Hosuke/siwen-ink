    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 桃氏為劍</nav></header><main><article><h1>桃氏為劍</h1><p>劍制分上中下三等，以莖長分尊卑，士皆服之。</p><p>桃氏為劍。臘廣二寸有半寸，兩從半之。以其臘廣為之莖圍，長倍之。中其莖，設其後。叄分其臘廣，去一以為首廣而圍之。</p><p>身長五其莖長，重九鋝，謂之上制，上士服之。身長四其莖長，重七鋝，謂之中制，中士服之。身長三其莖長，重五鋝，謂之下制，下士服之。</p><p><strong>所出</strong>：《周禮 · 冬官考工記》 — https://zh.wikisource.org/wiki/周禮/冬官考工記</p></article></main></div></div>
