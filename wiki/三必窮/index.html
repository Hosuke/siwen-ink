    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三必窮</nav></header><main><article><h1>三必窮</h1><p>不能愛下、非其上、不仁知不明，人之三必窮也。</p><p>人有三必窮：為上則不能愛下，為下則好非其上，是人之一必窮也；鄉則不若，倍則謾之，是人之二必窮也；知行淺薄，曲直相縣，然而仁人不能推，知士不能明，是人之三必窮也。夫不能愛下，則無以得民；好非其上，則無以全上交；知行淺薄，則無以成事。有此三數行者，以為上則必危，為下則必滅。</p><p><strong>所出</strong>：《荀子 · 非相篇》 — https://zh.wikisource.org/wiki/荀子/非相篇</p></article></main></div></div>
