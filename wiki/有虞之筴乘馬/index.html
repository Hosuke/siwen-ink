    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 有虞之筴乘馬</nav></header><main><article><h1>有虞之筴乘馬</h1><p>虞國以穀斂散之法，國器皆資而民不知</p><p>虞國得筴乘馬之數。其法：春資農夫以幣，使行播種；秋成則斂穀以準幣，國之分在上；待其貴也，散之以準器，國之櫎一切什九。是術也，還穀而應穀，無需加諸民，而國器皆備焉。</p><p><strong>所出</strong>：《管子 · 第68篇巨乘馬》 — https://zh.wikisource.org/wiki/管子/第68篇巨乘馬</p></article></main></div></div>
