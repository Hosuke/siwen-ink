    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三才參合</nav></header><main><article><h1>三才參合</h1><p>天、地、人三者相參，乃可以定法度、施教化。</p><p>上察[[河圖地形|河文]]，下序地形流，中稽于人心，此三者參合，而後可以定法度。動則循卦節，靜則因彖辭，[[乾坤]]用施行，天下然後治。</p><p>[[七八十五]]之數，[[八卦布列曜]]之象，皆本于此參合之道以成者也。</p><p><strong>所出</strong>：《周易參同契 · 04章》 — https://zh.wikisource.org/wiki/周易參同契/04章</p></article></main></div></div>
