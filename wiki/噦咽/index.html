    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 噦咽</nav></header><main><article><h1>噦咽</h1><p>臭腐虛而噦不止，知此理者可以齊奢儉外榮辱忘禍福。</p><p>有言臭腐之狀，則輒有所噦；聞珍羞之名，則妄有所咽。臭腐了然虛，珍羞必然無，而噦不能止，咽不能已。有懼菽醬若蝤蠐者，有愛鮑魚若鳳膏者。知此理者，可以齊奢儉，外榮辱，黜是非，忘禍福。</p><p><strong>所出</strong>：《化書 · 卷一》 — https://zh.wikisource.org/wiki/化書/卷一</p></article></main></div></div>
