    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 口可以食不可以言</nav></header><main><article><h1>口可以食不可以言</h1><p>口可進食而不可妄言，衆口可以鑠金，言有曲故。</p><p>口可以食不可以言者，[[鬼谷子]]戒妄言也。</p><p>口者機關也，所以關閉情意。耳目者，心之佐助也，所以窺覸姦邪。[[鬼谷子]]以為：口可以食，不可以言。言者有諱忌，衆口鑠金，言有曲故。</p><p>人之情，出言則欲聽，舉事則欲成。是以智者不用其所短，而用愚人之所長；不用其所拙，而用愚人之所工。言其有利者從其所長，言其有害者避其所短，故不困也。</p><p><strong>所出</strong>：《鬼谷子 · 卷02》 — https://zh.wikisource.org/wiki/鬼谷子/卷02</p></article></main></div></div>
