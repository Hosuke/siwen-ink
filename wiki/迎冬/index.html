    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 迎冬</nav></header><main><article><h1>迎冬</h1><p>立冬之日，天子帥百官迎冬於北郊，還反賞死事恤孤寡。</p><p>孟冬以立冬為先。立冬三日，大史謁之天子曰：「某日立冬，盛德在水。」天子乃齊。立冬之日，天子親帥三公、九卿、大夫以迎冬於北郊。還反，賞死事，恤孤寡。</p><p><strong>所出</strong>：《禮記 · 月令》 — https://zh.wikisource.org/wiki/禮記/月令</p></article></main></div></div>
