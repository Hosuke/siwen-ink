    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 胎病</nav></header><main><article><h1>胎病</h1><p>母腹受驚，精氣並居，子發癲疾。</p><p>胎病者，人生而有病癲疾也。此得之在母腹中時，其母有所大驚，氣上而不下，精氣並居，故令子發為癲疾也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第十三卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十三卷</p></article></main></div></div>
