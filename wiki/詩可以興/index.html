    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 詩可以興</nav></header><main><article><h1>詩可以興</h1><p>《詩》之用大矣，可以興、觀、群、怨，近可事父，遠可事君。</p><p>孔子曰：「小子！何莫學夫《詩》？《詩》可以興，可以觀，可以群，可以怨；邇之事父，遠之事君；多識於鳥獸草木之名。」</p><p>《詩》之為教，功用弘多。興以感發志意，觀以考見得失，群以和而不流，怨以怨而不怒。脩之於家，可以事父；推之於國，可以事君。至於鳥獸草木之名，多識而博聞，亦學詩之餘事也。聖人以此誨人，欲其通達人情物理，而識名物之變也。</p><p><strong>所出</strong>：《論語 · 陽貨第十七》 — https://zh.wikisource.org/wiki/論語/陽貨第十七</p></article></main></div></div>
