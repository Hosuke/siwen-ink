    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以有涯隨無涯</nav></header><main><article><h1>以有涯隨無涯</h1><p>生命有限而知識無涯，以有限逐無限則危殆矣</p><p>「吾生也有涯，而知也无涯。以有涯隨无涯，殆已。已而為知者，殆而已矣。」</p><p>夫生有時而盡，知無邊可窮。以有盡之生，迫而逐無涯之知，譬如以寸晷之光，逐滄海之廣，無乃危乎！知止則不殆，知足則不辱。養生之要，在乎知止知足，不以無涯之事縻有涯之生也。</p><p><strong>所出</strong>：《莊子 · 養生主》 — https://zh.wikisource.org/wiki/莊子/養生主</p></article></main></div></div>
