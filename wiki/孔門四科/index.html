    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 孔門四科</nav></header><main><article><h1>孔門四科</h1><p>德行、言語、政事、文學，夫子教人之分科也。</p><p>子曰：「從我於陳蔡者，皆不及門也。」德行：顏淵、閔子騫、冉伯牛、仲弓。言語：宰我、子貢。政事：冉有、季路。文學：子游、子夏。</p><p>孔門弟子從夫子厄於陳蔡者，後皆散去不及門。夫子乃總述其人之所長，分為四科：德行為上，言語次之，政事又次之，文學又次之。此孔門教育之分科也。</p><p><strong>所出</strong>：《論語 · 先進第十一》 — https://zh.wikisource.org/wiki/論語/先進第十一</p></article></main></div></div>
