    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 民智之不可用</nav></header><main><article><h1>民智之不可用</h1><p>民智淺薄，如嬰兒之昧於利害，不可輕信。</p><p>民智之不可用，猶嬰兒之心也。夫嬰兒不剔首則腹痛，不㨽痤則寖益。剔首、揊痤，必一人抱之，慈母治之，然猶啼呼不止，嬰兒子不知犯其所小苦、致其所大利也。</p><p><strong>所出</strong>：《韓非子 · 顯學》 — https://zh.wikisource.org/wiki/韓非子/顯學</p></article></main></div></div>
