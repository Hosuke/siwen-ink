    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 樂成侯</nav></header><main><article><h1>樂成侯</h1><p>樂成侯上書言欒大，欒大遂見天子，拜為五利將軍。</p><p>其春，[[樂成侯]]上書言[[欒大]]。欒大，膠東宮人，故嘗與[[文成將軍]]同師，已而為膠東王尚方。而樂成侯姊為康王后，康后有淫行與王不相中。康后聞文成已死，而欲自媚於上，乃遣欒大因樂成侯求見言方。</p><p><strong>所出</strong>：《史記 · 卷012》 — https://zh.wikisource.org/wiki/史記/卷012</p></article></main></div></div>
