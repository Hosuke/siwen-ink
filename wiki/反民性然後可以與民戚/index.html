    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 反民性然後可以與民戚</nav></header><main><article><h1>反民性然後可以與民戚</h1><p>聖人治國必先反其民性</p><p>「為國者，反民性然後可以與民戚。民欲佚而教以勞，民欲生而教以死。」民性佚樂，而聖人教之以勤勞；民性惡死，而聖人教之以必死。勞教定而國富，死教定而威行。聖人者陰陽理，故平外而險中。信其情者傷其神，美其質者傷其文。化之美者應其名，變其美者應其時，不能兆其端者菑及之。</p><p><strong>所出</strong>：《管子 · 第35篇侈靡》 — https://zh.wikisource.org/wiki/管子/第35篇侈靡</p></article></main></div></div>
