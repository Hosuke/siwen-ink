    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 繼弒君不言即位</nav></header><main><article><h1>繼弒君不言即位</h1><p>先君不以道終，嗣君不忍即位，以正繼承之義。</p><p>繼弒君不言即位，正也。繼弒君不言即位之為正，何也？曰：先君不以其道終，則子不忍即位也。</p><p>繼承之事，貴得其正。若先君遇弒而崩，是死非其道也。嗣君心有不忍，故不敢以即位之禮自居，亦不敢受臣子之朝賀，此所謂正也。穀梁傳以為，不言即位，非闕文也，乃聖人所以正父子之恩、明繼承之義焉。</p><p><strong>所出</strong>：《春秋穀梁傳 · 莊公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/莊公</p></article></main></div></div>
