    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 奇器生萬象</nav></header><main><article><h1>奇器生萬象</h1><p>八卦甲子、神機鬼藏，昭昭乎象矣。</p><p>爰有奇器，是生萬象；八卦甲子，神機鬼藏。</p><p>六癸為天藏，可以伏藏也。奇器者，聖智也。天垂象，聖人則之。推甲子、畫八卦、考蓍龜、稽律歷，則鬼神之情、陰陽之理昭著乎象，無不盡矣。</p><p>萬生萬象者，心也。合藏陰陽之術、日月之數，昭昭乎在人心矣。廣成子曰「甲子合陽，九之數也」。卦象出師眾之法，出師以律動合鬼神，順天應時而用，鬼神之道也。</p><p><strong>所出</strong>：《陰符經》 — https://zh.wikisource.org/wiki/七注陰符經</p></article></main></div></div>
