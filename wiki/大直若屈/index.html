    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大直若屈</nav></header><main><article><h1>大直若屈</h1><p>修道法度正直如一而不與俗爭</p><p>大直若屈。</p><p>河上公曰：「大直，謂修道法度正直如一也。若屈者，不與俗人爭，若可屈折。」</p><p>直者，正也。聖人之直若屈而不折，若[[大巧若拙]] 若拙而不用 [[大辯若訥]] 若訥而不辨，則道法明而身正，是謂大直。屈而不爭，此聖人之守柔也。[[大成若缺]] [[大盈若沖]] 皆虛中之道，[[大直若屈]] 屈而不失其直，屈者應世之智，直者守道之心也。</p><p><strong>所出</strong>：《老子河上公章句 · 洪德》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
