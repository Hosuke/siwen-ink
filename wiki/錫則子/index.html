    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 錫則子</nav></header><main><article><h1>錫則子</h1><p>商湯時降潛山，說《長生經》，教以恭愛之道。</p><p>錫則子，在商湯之時降於潛山，說《長生經》，教以恭愛之道。今潛山天祚宮前龍堂之址，即其所也。一號錫壽子，或稱戒子肯，作《道元經》七十卷。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 2》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/2</p></article></main></div></div>
