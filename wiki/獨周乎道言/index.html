    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 獨周乎道言</nav></header><main><article><h1>獨周乎道言</h1><p>君主當不被羣臣之議、民萌之誹所動，方能行法術之道。</p><p>人主非能倍大臣之議，越民萌之誹，獨周乎道言也，則法術之士雖至死亡，道必不論矣。</p><p>倍大臣之議者，違背大臣之言也；越民萌之誹者，超過民衆之謗也；獨周乎道言者，獨得與道相合也。夫大臣欲擅權，必不以法術為然；民萌溺於俗，亦不以改革為便。人主若不能獨立守道，則法術之士言不見聽，道不獲論，雖死不售其術。</p><p><strong>所出</strong>：《韓非子 · 和氏》 — https://zh.wikisource.org/wiki/韓非子/和氏</p></article></main></div></div>
