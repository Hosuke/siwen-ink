    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 得民之心不可以為治</nav></header><main><article><h1>得民之心不可以為治</h1><p>得民心者未必能治，蓋民智不足師用也。</p><p>今不知治者必曰「得民之心」。欲得民之心而可以為治，則是伊尹、管仲無所用也，將聽民而已矣。民智之不可用，猶嬰兒之心也。</p><p><strong>所出</strong>：《韓非子 · 顯學》 — https://zh.wikisource.org/wiki/韓非子/顯學</p></article></main></div></div>
