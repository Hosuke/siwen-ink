    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 閔子侍側</nav></header><main><article><h1>閔子侍側</h1><p>閔子、子路、冉有、子貢，各有氣象，夫子樂之。</p><p>閔子侍側，誾誾如也；子路，行行如也；冉有、子貢，侃侃如也。子樂。「若由也，不得其死然！」</p><p>閔子之貌，誾誾，和悅而諍；子路之行行，強梁之狀；冉有、子貢之侃侃，和樂而中節。夫子見而樂之，然又憂子路之過剛，恐不得其死，言出於愛之深也。</p><p><strong>所出</strong>：《論語 · 先進第十一》 — https://zh.wikisource.org/wiki/論語/先進第十一</p></article></main></div></div>
