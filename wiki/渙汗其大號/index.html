    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 渙汗其大號</nav></header><main><article><h1>渙汗其大號</h1><p>號令渙發如汗，不擁滯於一身</p><p>「九五：渙汗其大號，渙王居，无咎」。</p><p>汗者，人身之津液，蘊於中而發於表，號令之出亦猶是也。大號者，天子號令。四肢百骸之汗，出而不返，號令亦一出而天下奉行，不可以私意留住。渙王居者，散其所居之積，聚以分之天下也。九五陽剛中正，居尊位而能渙，故无咎。</p><p><strong>所出</strong>：《周易 · 渙》 — https://zh.wikisource.org/wiki/周易/渙</p></article></main></div></div>
