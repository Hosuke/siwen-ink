    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 參代何為相</nav></header><main><article><h1>參代何為相</h1><p>參與蕭何有隙，何且死推賢唯參，參代何為漢相國。</p><p>參始微時，與蕭何善；及為將相，有隙。何且死，所推賢唯參。參代何為漢相國，舉事無所變更，一遵蕭何約束。夫將相之和，同功者也，而終以相推讓；將相之隙，國之大事，而卒以國事為先。何之讓參，以其賢也；參之循何，以其法也。功名之際，君子不以私害公如此。</p><p><strong>所出</strong>：《史記 · 卷054》 — https://zh.wikisource.org/wiki/史記/卷054</p></article></main></div></div>
