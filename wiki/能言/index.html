    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 能言</nav></header><main><article><h1>能言</h1><p>巧言者得身安，能言者招禍患，賢否之辨也。</p><p>「哀哉不能言，匪舌是出，維躬是瘁。哿矣能言，巧言如流，俾躬處休。」不能言者，非舌不能出也，言出而獲罪，故惟躬自病瘁。匪舌是出者，舌固無恙，言不得伸也。能言者則不然，巧言如水之流，左右逢源，身獲安逸。哿，可也。言世之巧佞者，以言取媚，終身蒙休；正直者不能言，故躬瘁而無救於時也。</p><p><strong>所出</strong>：《詩經 · 雨無正》 — https://zh.wikisource.org/wiki/詩經/雨無正</p></article></main></div></div>
