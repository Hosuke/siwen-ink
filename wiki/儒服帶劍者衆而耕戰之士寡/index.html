    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 儒服、帶劍者衆，而耕戰之士寡</nav></header><main><article><h1>儒服、帶劍者衆，而耕戰之士寡</h1><p>亂世在上者重文藝俠行，致農戰之務廢，耕者、戰者日少。</p><p>亂世之聽言也，以難知為察，以博文為辯；其觀行也，以離群為賢，以犯上為抗。人主悅辯察之言，尊賢抗之行，故夫作法術之人，立取舍之行，別辭爭之論，而莫為之正。是以儒服、帶劍者衆，而耕戰之士寡；堅白、無厚之詞章，而憲令之法息。</p><p><strong>所出</strong>：《韓非子 · 問辯》 — https://zh.wikisource.org/wiki/韓非子/問辯</p></article></main></div></div>
