    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 董叔欲為繫援</nav></header><main><article><h1>董叔欲為繫援</h1><p>欲以婚姻攀附富室，卒取怨焉</p><p>董叔將娶於范氏，叔向曰：「范氏富，盍已乎！」曰：「欲為繫援焉。」他日，董祁愬於范獻子曰：「不吾敬也。」獻子執而紡於庭之槐，叔向過之，曰：「子盍為我請乎？」叔向曰：「求繫，既繫矣；求援，既援矣。欲而得之，又何請焉？」</p><p><strong>所出</strong>：《國語 · 卷15》 — https://zh.wikisource.org/wiki/國語/卷15</p></article></main></div></div>
