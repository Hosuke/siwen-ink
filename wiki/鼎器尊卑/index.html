    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鼎器尊卑</nav></header><main><article><h1>鼎器尊卑</h1><p>鼎器有尊卑上下之分，不可混淆，此成丹之要。</p><p>[[悟真篇]]自序云：「其如鼎器尊卑、藥物斤兩、火候進退、主客後先，存亡有無、吉凶悔吝，悉備其中矣。」詩云：「安爐立鼎法乾坤，煅煉精華制魄魂。聚散絪緼成變化，敢將玄妙等閒論。」鼎器之設，必合法度，方能煉精化氣，煉氣化神，神化虛空。</p><p><strong>所出</strong>：《悟真篇》 — https://zh.wikisource.org/wiki/悟真篇</p></article></main></div></div>
