    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 正一</nav></header><main><article><h1>正一</h1><p>太虛太神太氣太形命之則四根之則一，守之不得舍之不失是謂正一。</p><p>世人皆知莧菹可以剖鱉，而不知朱草可以剖人。小人由是知神可以分，氣可以泮，形可以散。散而為萬，不謂之有餘；聚而為一，不謂之不足。若狂風飄髮，魂魄夢飛；屐齒斷蚓，首尾皆動。夫何故？太虛，一虛也；太神，一神也；太氣，一氣也；太形，一形也。命之則四，根之則一。守之不得，舍之不失，是謂正一。</p><p><strong>所出</strong>：《化書 · 卷一》 — https://zh.wikisource.org/wiki/化書/卷一</p></article></main></div></div>
