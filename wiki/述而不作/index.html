    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 述而不作</nav></header><main><article><h1>述而不作</h1><p>傳述古道，不自創作。</p><p>孔子自言傳述往聖之道，而無所作為；又好信古道，自比老彭。蓋聖人宗主堯舜周公之緒業，以傳承為己任，非敢自我作古也。[[述而不作]]之旨，在於法古信道，而非矜奇立異。</p><p><strong>所出</strong>：《論語 · 述而第七》 — https://zh.wikisource.org/wiki/論語/述而第七</p></article></main></div></div>
