    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 齊厲王</nav></header><main><article><h1>齊厲王</h1><p>悼惠王子，不愛紀后，與姊翁主姦，主父偃相齊，懼罪飲藥死。</p><p>厲王名將閭，其母曰紀太后。太后取其弟紀氏女為王后，王不愛之。太后令長女紀翁主入宮正其後宮，毋令近王，欲令愛紀氏女。王反與其姊翁主姦。及主父偃相齊，窮治後宮，王年少懼大罪為吏所執誅，乃飲藥自殺。絕無後，國入于漢。</p><p><strong>所出</strong>：《史記 · 卷052》 — https://zh.wikisource.org/wiki/史記/卷052</p></article></main></div></div>
