    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 魯人身善織屨，欲徙於越</nav></header><main><article><h1>魯人身善織屨，欲徙於越</h1><p>技無所用，遊於不用之國，欲使無窮，不可得也</p><p>魯人身善織屨，妻善織縞，而欲徙於越。或謂之曰：「子必窮矣。」魯人曰：「何也？」曰：「屨爲履之也，而越人跣行；縞爲冠之也，而越人被髪。以子之所長，游於不用之國，欲使無窮，其可得乎？」</p><p><strong>所出</strong>：《韓非子 · 說林上》 — https://zh.wikisource.org/wiki/韓非子/說林上</p></article></main></div></div>
