    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無忝皇祖</nav></header><main><article><h1>無忝皇祖</h1><p>不辱先祖，救其子孫</p><p>無忝皇祖，式救爾後。朱熹云：「忝，辱也。式，用也。」詩人以此祈天之言。言上天若念周之先祖，勿使羞辱焉；宜救其後嗣，使免於亡國之難。此詩末章，詩人寄望於天命，冀祖宗之德尚可感天，子孫之祀尚可延續也。</p><p><strong>所出</strong>：《詩經 · 瞻卬》 — https://zh.wikisource.org/wiki/詩經/瞻卬</p></article></main></div></div>
