    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 祠于高禖</nav></header><main><article><h1>祠于高禖</h1><p>仲春之月，玄鳥至，天子以太牢祠於高禖，以求子嗣。</p><p>仲春之月，玄鳥至。至之日，以大牢祠于高禖。天子親往，后妃帥九嬪御。乃禮天子所御，帶以弓韣，授以弓矢，於高禖之前。</p><p><strong>所出</strong>：《禮記 · 月令》 — https://zh.wikisource.org/wiki/禮記/月令</p></article></main></div></div>
