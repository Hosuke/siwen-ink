    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 上下順</nav></header><main><article><h1>上下順</h1><p>上下以正道相應，則無所不利。</p><p>利禦寇，上下順也。</p><p>上下順者，言在上者以正道防之，在下者以正道應之也。夫寇之來也，必待上下同力而後可以卻之。上下皆以正道相合，則奸邪無所容，故利也。</p><p><strong>所出</strong>：《周易 · 蒙》 — https://zh.wikisource.org/wiki/周易/蒙</p></article></main></div></div>
