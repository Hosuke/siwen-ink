    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 干旌</nav></header><main><article><h1>干旌</h1><p>旗名。以鳥羽飾竿以象之，侯伯所建。</p><p>干旌，旗幟之名也。《干旄》三章言「孿孿干旌，在浚之城」，置於城中也。《周禮》言：「交龍為旂，鳥隼為旟，龜蛇為旐，全羽為旞，析羽為旌。」干旌者，以鳥羽飾竿，象其文也。</p><p>詩中三章各言干旄、干旟、干旌，皆諸侯大夫出行之旗。旄為大夫，旟為次卿，旌為侯伯。干旌居第三章，言「在浚之城」，其位最尊，其禮亦最隆。賢者之來，旌旗以先之，見其敬也。</p><p><strong>所出</strong>：《詩經 · 干旄》 — https://zh.wikisource.org/wiki/詩經/干旄</p></article></main></div></div>
