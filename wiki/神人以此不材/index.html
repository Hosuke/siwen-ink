    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 神人以此不材</nav></header><main><article><h1>神人以此不材</h1><p>不材者乃得大用</p><p>南伯子綦遊乎商之丘，見大木焉，有異，結駟千乘，隱將芘其所藾。仰而視其細枝，則拳曲而不可以爲棟梁；俯而視其大根，則軸解而不可以爲棺槨；咶其葉，則口爛而爲傷；嗅之，則使人狂酲三日而不已。子綦曰：「此果不材之木也，以至於此其大也。嗟乎，神人以此不材！」</p><p><strong>所出</strong>：《莊子 · 人間世》 — https://zh.wikisource.org/wiki/莊子/人間世</p></article></main></div></div>
