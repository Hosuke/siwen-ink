    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 清者福集</nav></header><main><article><h1>清者福集</h1><p>清儉者福自來集，奢靡者禍必相赴，理之必然。</p><p>潛居先生論福禍之辨曰：「清者，福之所集也；奢者，禍之所赴也。福集，則雖微可著，雖衰可興焉；禍赴，則雖強可弱，雖存可亡焉。此不期而必會，不招而自來者也。」是以君子居塉土而樂，處膏腴而憂，非以求福也，避禍之道耳。</p><p><strong>所出</strong>：《抱朴子 · 卷35》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷35</p></article></main></div></div>
