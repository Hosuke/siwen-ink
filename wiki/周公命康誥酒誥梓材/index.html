    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 周公命康誥酒誥梓材</nav></header><main><article><h1>周公命康誥酒誥梓材</h1><p>周公告康叔以紂亡殷興之故，作康誥、酒誥、梓材，命之治衞。</p><p>周公旦懼康叔齒少，乃申告康叔曰：「必求殷之賢人君子長者，問其先殷所以興，所以亡，而務愛民。」告以紂所以亡者以淫於酒，酒之失，婦人是用，故紂之亂自此始。為梓材，示君子可法則。故謂之《康誥》、《酒誥》、《梓材》以命之。</p><p><strong>所出</strong>：《史記 · 卷037》 — https://zh.wikisource.org/wiki/史記/卷037</p></article></main></div></div>
