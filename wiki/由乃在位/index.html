    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 由乃在位</nav></header><main><article><h1>由乃在位</h1><p>正法度於在位之臣。</p><p>盤庚斆于民，由乃在位，以常舊服，正法度。</p><p>盤庚以[[常舊服]]之故事，教誨臣民，而歸義於在位之大臣。[[由乃在位]]者，由而在位者以[[正法度]]之義，率之以身[[正法度]]，使下有所矜式也。此[[尚書]]所述王敕臣工之辭。</p><p><strong>所出</strong>：《尚書 · 盤庚上》 — https://zh.wikisource.org/wiki/尚書/盤庚上</p></article></main></div></div>
