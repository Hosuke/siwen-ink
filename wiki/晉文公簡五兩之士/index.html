    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 晉文公簡五兩之士</nav></header><main><article><h1>晉文公簡五兩之士</h1><p>文公造五兩之士五乘，銳卒千人，先以接敵，諸侯莫之能難。</p><p>晉文公造五兩之士五乘，銳卒千人，先以接敵，諸侯莫之能難，反鄭之埤，東衛之畝，尊天子於衡雍。</p><p><strong>所出</strong>：《呂氏春秋 · 卷八》 — https://zh.wikisource.org/wiki/呂氏春秋/卷八</p></article></main></div></div>
