    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 非吾儀，雖利不爲</nav></header><main><article><h1>非吾儀，雖利不爲</h1><p>道有定儀，不可苟利而為。</p><p>非吾儀，雖利不爲。非吾當，雖利不行。非吾道，雖利不取。上之隨天，其次隨人。</p><p><strong>所出</strong>：《管子 · 第38篇白心》 — https://zh.wikisource.org/wiki/管子/第38篇白心</p></article></main></div></div>
