    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 抱薪趨火</nav></header><main><article><h1>抱薪趨火</h1><p>物類相應，勢之自然，譬如抱薪趣火，燥者先然。</p><p>抱薪趣火者，[[鬼谷子]]所言物類相應之喻也。</p><p>情合者聽，物歸類，抱薪趣火，燥者先然；平地注水，濕者先濡。此物類相應於勢，譬猶是也。</p><p>內符之應，外摩也如是。摩之以其類，有不相應者；摩之以其欲，有不聽者。獨行之道，不在強合，而在順其自然之勢。此聖人之所以成事而不自知也。</p><p><strong>所出</strong>：《鬼谷子 · 卷02》 — https://zh.wikisource.org/wiki/鬼谷子/卷02</p></article></main></div></div>
