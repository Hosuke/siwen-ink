    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 經典規戒弗聞弗覽</nav></header><main><article><h1>經典規戒弗聞弗覽</h1><p>荒怠之君，輕忽典誡，耽於玩樂。</p><p>又經典規戒，弗聞弗覽，玩弄褻宴，是耽是務。高樓觀而下道德，廣苑囿而狹招納，深池沼而淺恩信。</p><p><strong>所出</strong>：《抱朴子 · 卷05》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷05</p></article></main></div></div>
