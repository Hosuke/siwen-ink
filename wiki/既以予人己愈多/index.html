    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 既以予人己愈多</nav></header><main><article><h1>既以予人己愈多</h1><p>施之於人者，其德日充</p><p>既以予人，己愈多。</p><p>言聖人施予於天下而不以為費，百姓懷其德而歸之，則天下之心皆聖人之心，其德充周而愈多也。老子以「予」字代「為人」，見施予之無私也。世人私其所積，愈積而愈狹；聖人虛懷蕩無，愈予而愈充。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第三十一章 不積》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
