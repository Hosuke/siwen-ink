    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 反本與化為一</nav></header><main><article><h1>反本與化為一</h1><p>聖人返本末生之時，與化為一體，死生無變於己。</p><p>清目而不以視，靜耳而不以聽，鉗口而不以言，委心而不以慮。棄聰明而反太素，休精神而棄知故，覺而若昧，以生而若死，終則反本末生之時，而與化為一體。死之與生，一體也。</p><p><strong>所出</strong>：《淮南子 · 精神訓》 — https://zh.wikisource.org/wiki/淮南子/精神訓</p></article></main></div></div>
