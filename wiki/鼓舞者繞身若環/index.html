    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鼓舞者繞身若環</nav></header><main><article><h1>鼓舞者繞身若環</h1><p>舞者之妙，非柔縱；木熙之技，非眇勁，乃積習所成。</p><p>今鼓舞者，繞身若環，曾撓摩地，扶旋猗那，動容轉曲，便媚擬神。身若秋藥被風，發若結旌，騁馳若騖；木熙者，舉梧檟，據句枉，蝯自縱，好茂葉，龍夭嬌，燕枝拘，援豐條，舞扶疏，龍從鳥集，搏援攫肆，蔑蒙踴躍。且夫觀者莫不為之損心酸足，彼乃始徐行微笑，被衣修擢。</p><p>夫[[盲者目不能別晝夜|鼓舞者非柔縱，而木熙者非眇勁]]，淹浸而發遲。</p><p><strong>所出</strong>：《淮南子 · 脩務訓》 — https://zh.wikisource.org/wiki/淮南子/脩務訓</p></article></main></div></div>
