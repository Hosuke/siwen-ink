    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 用臣有術</nav></header><main><article><h1>用臣有術</h1><p>君主用臣，當視其材；一偏則危，兼用則安。</p><p>魏兩用樓翟、吳起而亡西河，湣王專用淖齒而死于東廟，無術以御之也。文王兩用呂望、召公奭而王，楚莊王專任孫叔敖而霸，有術以御之也。</p><p>用臣之道，在乎兼聽而善馭，非一偏之可恃也。</p><p><strong>所出</strong>：《淮南子 · 氾論訓》 — https://zh.wikisource.org/wiki/淮南子/氾論訓</p></article></main></div></div>
