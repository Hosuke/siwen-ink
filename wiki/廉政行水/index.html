    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 廉政行水</nav></header><main><article><h1>廉政行水</h1><p>廉政而長久者，其行如水。水清清，其濁無不雩途，其清無不灑除，是以長久。</p><p>景公問廉政而長久之道，晏子對以水。水之為物，美哉清清，其濁無不雩途，其清無不灑除，是以長久。廉政亦然。流水不腐，戶樞不蠹，能與時推移、因物曲折者，其德久長。</p><p>若夫廉政而速亡者，晏子以石為喻。堅哉石乎落落，視之則堅，循之則堅，內外皆堅，無以為久，是以速亡也。水善利萬物而不爭，故能長久；石剛而無變，終至於摧折。廉政之要在於便民利民，非剛峭以傷物也。</p><p><strong>所出</strong>：《晏子春秋 · 卷四》 — https://zh.wikisource.org/wiki/晏子春秋/卷四</p></article></main></div></div>
