    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 匹夫私便人主公利</nav></header><main><article><h1>匹夫私便人主公利</h1><p>匹夫私便在不作而養足、不仕而名顯；人主公利在息文學明法度、塞私便一功勞。</p><p>韓非子以為，匹夫有私便，人主有公利。不作而養足，不仕而名顯，此私便也；息文學而明法度，塞私便而一功勞，此公利也。錯法以道民也，而又貴文學，則民之所師法也疑；賞功以勸民也，而又尊行修，則民之産利也惰。[[貴文學以疑法，尊行修以貳功]]，欲求國之富強，不可得也。</p><p><strong>所出</strong>：《韓非子 · 八說》 — https://zh.wikisource.org/wiki/韓非子/八說</p></article></main></div></div>
