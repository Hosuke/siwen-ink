    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 明理</nav></header><main><article><h1>明理</h1><p></p><p>《呂氏春秋 · 卷六》又論世治之道，以為五帝三王之於樂盡之，亂國之主未嘗知樂。有天賞得主之名而無得主之實，正坐夕室，所謂正乃不正矣。</p><p>  眾正之所積，其福無不及；眾邪之所積，其禍無不逮。風雨不適，甘雨不降，霜雪不時，寒暑不當，陰陽失次，四時易節，人民淫爍不固，禽獸胎消不殖，草木庳小不滋，五穀敗不成。</p><p>  亂世之化，君臣相賊，長少相殺，父子相忍，弟兄相誣，知交相倒，夫妻相冒，日以相危，失人之紀，心若禽獸，長邪苟利，不知義理。</p><p>  <strong>所出</strong>：《呂氏春秋 · 卷六》 — https://zh.wikisource.org/wiki/呂氏春秋/卷六</p></article></main></div></div>
