    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 番禺負山</nav></header><main><article><h1>番禺負山</h1><p>任囂謂番禺據嶺海之勝，足建國以觀天下之變。</p><p>南海尉任囂病且死，召龍川令趙佗語曰：「且番禺負山險，阻南海，東西數千里，頗有中國人相輔，此亦一州之主也，可以立國。」</p><p><strong>所出</strong>：《史記 · 卷113》 — https://zh.wikisource.org/wiki/史記/卷113</p></article></main></div></div>
