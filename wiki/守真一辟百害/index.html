    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 守真一辟百害</nav></header><main><article><h1>守真一辟百害</h1><p>守真一可辟鬼魅犯侵，此長生之要務也。</p><p>抱朴子曰：若為鬼所冒犯，或為大山神之所輕淩，或為精魅所侵犯，唯有守真一，可以一切不畏此輩。次則有帶神符。</p><p>若了不知此二事以求長生，危矣哉。四門而閉其三，盜猶得入，況盡開者邪？</p><p><strong>所出</strong>：《抱朴子 · 卷18》 — https://zh.wikisource.org/wiki/抱朴子/卷18</p></article></main></div></div>
