    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 致輿無輿</nav></header><main><article><h1>致輿無輿</h1><p>致譽者無譽，求榮者反辱，不爭乃全，不取乃得。</p><p>故致數與無與，是故不欲[[不欲如玉若石|如玉硌若石]]。</p><p>「致數輿無輿」，帛書本異文作「致數與無與」。致，求也。求譽於無譽之域，是乃真譽；求祿於無祿之境，是乃真祿。反是而求之，[[物極則反|物極則反]]，[[名與身孰親|名盛則辱隨]]。聖人[[虛靜恬淡寂漠無為|虛靜恬淡]]，無求而萬物自歸。此[[老子]]「夫唯不爭故天下莫能與之爭」之旨也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章三十九》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
