    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖胎</nav></header><main><article><h1>聖胎</h1><p>性情合一凝結之胎，修丹之極功</p><p>聖胎者，龍虎交會，性情合一，入於中央，先天之氣自虛無中來，凝而為一粒黍珠之象也，亦謂之穀神。陽玄即虎情，陰牝即龍性。性情合而聖胎結，元牝立而穀神生。到此地位，有為事畢，無為事彰，不必再為造作，聽其自然，果生枝上，終有成熟之日焉。十月溫養，脫去後天爻卦，氣足神全，身外有身，功成名遂，天仙矣。</p><p><strong>所出</strong>：《悟真直指 · 卷一》 — https://zh.wikisource.org/wiki/悟真直指/卷一</p></article></main></div></div>
