    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 氣與目為利</nav></header><main><article><h1>氣與目為利</h1><p>在於身者孰為利？氣與目為利；聖人得利而託焉，民重而名遂。</p><p>管子言：「在於身者孰為利？氣與目為利。聖人得利而託焉，故民重而名遂，我亦託焉。」耳目者，人之所以接物者也。聖人得其正，則名實相副；凡人失其正，則[[毛嬙西施]]之歎生矣。</p><p><strong>所出</strong>：《管子 · 第32篇小稱》 — https://zh.wikisource.org/wiki/管子/第32篇小稱</p></article></main></div></div>
