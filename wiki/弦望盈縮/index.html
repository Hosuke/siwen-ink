    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 弦望盈縮</nav></header><main><article><h1>弦望盈縮</h1><p>月之弦時望時，盈縮乖變，則刑罰失中，凶咎隨之。</p><p>弦望盈縮，乖變凶咎。執法刺譏，詰過貽主。</p><p>月之弦望盈縮，天道之常度也。[[四七乖戾]]，則[[五緯錯順]]之序乖；[[弦望盈縮]]乖其常，則刑罰失中而凶咎生。執法者刺譏詰過，皆乖度之所致。[[辰極受正]]，則[[明堂布政]]得其序，而弦望不失其節。</p><p><strong>所出</strong>：《周易參同契 · 05章》 — https://zh.wikisource.org/wiki/周易參同契/05章</p></article></main></div></div>
