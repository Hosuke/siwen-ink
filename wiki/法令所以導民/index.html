    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 法令所以導民</nav></header><main><article><h1>法令所以導民</h1><p>法令所以引導民衆，刑罰所以禁絕姦邪</p><p>太史公序曰：「法令所以導民也，刑罰所以禁姦也。」言法令非徒以禁制，亦所以誘導民俗；刑罰非徒以誅罰，亦所以禁絕姦邪。循吏之職，在使民不犯，而非以刑罰威民也。</p><p><strong>所出</strong>：《史記 · 卷119》 — https://zh.wikisource.org/wiki/史記/卷119</p></article></main></div></div>
