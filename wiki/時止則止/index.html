    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 時止則止</nav></header><main><article><h1>時止則止</h1><p>動止不失其時，道乃光明</p><p>時止則止，時行則行，動靜不失其時，其道光明：此艮彖辭之要旨也。止非徒靜，在有其時；行非徒動，在不失時。時止則止，時行則行，動靜皆合乎時，道之所以光明也。</p><p><strong>所出</strong>：《周易 · 艮》 — https://zh.wikisource.org/wiki/周易/艮</p></article></main></div></div>
