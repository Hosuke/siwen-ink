    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 道大天大地大王亦大</nav></header><main><article><h1>道大天大地大王亦大</h1><p>道與天地王並列四大，人當法地以歸於道。</p><p>老子明四大之位曰：「道大，天大，地大，王亦大。」王所以特大者，以其配天地宰萬物也。[[國中有四大而王居一]]即此義。域中有四大，而王居其一，人之於道，亦若是焉爾。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第六十九章 昆成》 — https://zh.wikisource.org/wiki/老子_(帛書校勘版)</p></article></main></div></div>
