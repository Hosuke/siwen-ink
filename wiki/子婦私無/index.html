    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 子婦私無</nav></header><main><article><h1>子婦私無</h1><p>子婦無私貨畜器，不敢私假私與</p><p>子婦無私貨，無私畜，無私器，不敢私假，不敢私與。</p><p>適子庶子只事宗子宗婦，雖貴富，不敢以貴富入宗子之家。</p><p><strong>所出</strong>：《禮記 · 內則》 — https://zh.wikisource.org/wiki/禮記/內則</p></article></main></div></div>
