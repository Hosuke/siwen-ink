    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 博者不知</nav></header><main><article><h1>博者不知</h1><p>博聞多識者非真知。</p><p>博者不知，知者不博。博者，求知於外也；知者，反照於內也。外馳者汨沒於紛華，內觀者冥契於大全。[[知者不博]] 老氏言此，非賤學問，正以明外馳之弊也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 八十一章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
