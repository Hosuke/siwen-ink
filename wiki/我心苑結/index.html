    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 我心苑結</nav></header><main><article><h1>我心苑結</h1><p>愁思鬱積，如草木之叢聚</p><p>我不見兮，我心苑結。</p><p>語出《詩經·小雅·都人士》。言我不見彼都人士，心中愁思，鬱積不解，如草木之苑然而叢聚也。詩人思慕古之賢士而不可得，故心懷糾結，抑塞不通。</p><p>後世以「苑結」形容心事縈繞，愁思難解。</p><p><strong>所出</strong>：《詩經 · 都人士》 — https://zh.wikisource.org/wiki/詩經/都人士</p></article></main></div></div>
