    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 衰亂之俗微</nav></header><main><article><h1>衰亂之俗微</h1><p>世道衰弊之風漸見消弭，言政治教化之效。</p><p>「衰亂之俗微」，《詩經·行露》毛詩序之言也。序云：「《行露》，召伯聽讼也。衰亂之俗微，貞信之教興，彊暴之男不能侵陵貞女也。」</p><p>[[衰亂之俗微]]，與[[貞信之教興]]相對成文。衰亂之俗消弭，則[[彊暴之男不能侵陵貞女]]。此[[召伯聽讼]]之效也。天下之治，由近及遠；一方之治，由分而積。此序之所以明本詩之義也。</p><p><strong>所出</strong>：《詩經 · 行露》 — https://zh.wikisource.org/wiki/詩經/行露</p></article></main></div></div>
