    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 遠條且</nav></header><main><article><h1>遠條且</h1><p>椒香遠聞，感歎祝頌之辭。</p><p>遠條，謂香氣遠聞也。《詩》末云：「椒聊且！遠條且！」</p><p>條者，枝條之謂。遠條者，椒之香氣飄溢，達於遠枝也。且，語辭。詩人見椒聊之蕃衍盈升，感而歎之曰：椒聊且，其香遠條且。以興子孫之盛大，必將聞於遠方也。</p><p>疊言之者，嗟歎之情深且摯，辭繁而不厭。《唐風》之體，多慷慨悲涼，此詩則祝頌之意為多，故其辭舒而長，音節和而美焉。</p><p><strong>所出</strong>：《詩經 · 椒聊》 — https://zh.wikisource.org/wiki/詩經/椒聊</p></article></main></div></div>
