    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 飛鳥之舉</nav></header><main><article><h1>飛鳥之舉</h1><p>飛鳥之舉，輕也。師輕其行，則能逾險阻而無所困。</p><p>飛鳥之舉，言師之行止輕捷，如飛鳥翔集，無有阻礙。</p><p>其文曰：「飛鳥之舉者，輕也。」「有飛鳥之舉，故能不險山河矣。」</p><p>師輕則利足，無重載之累；行輕則迅疾，無山川之阻。此[[風雨之行]]之所以能不遠道里，[[金城之守]]之所以能威服遠國也。</p><p><strong>所出</strong>：《管子 · 選陳》 — https://zh.wikisource.org/wiki/管子/七法/選陳</p></article></main></div></div>
