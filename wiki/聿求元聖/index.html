    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聿求元聖，與之戮力</nav></header><main><article><h1>聿求元聖，與之戮力</h1><p>湯求大聖，與之並力以救民。</p><p>湯聿求元聖，與之戮力，以與爾有眾請命。上天孚佑下民，罪人黜伏，天命弗僭。</p><p><strong>所出</strong>：《尚書 · 湯誥》 — https://zh.wikisource.org/wiki/尚書/湯誥</p></article></main></div></div>
