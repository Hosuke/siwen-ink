    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 吾家耄遜于荒</nav></header><main><article><h1>吾家耄遜于荒</h1><p>年老當隱，不與暴君同居</p><p>微子自念衰耄，問父師曰：「吾家耄遜于荒？」言我年已老耄，當隱遯於荒野，不當與暴君同居也。蓋明知殷之必亡，而猶豫未決，故以衰老自解，冀得全身遠害。</p><p><strong>所出</strong>：《尚書 · 微子》 — https://zh.wikisource.org/wiki/尚書/微子</p></article></main></div></div>
