    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 朋黨比周以事其君</nav></header><main><article><h1>朋黨比周以事其君</h1><p>亂國之臣朋黨比周，隱正道而行私曲，上偪君而下亂治。</p><p>若夫齊田恒、宋子罕、魯季孫意如、晉僑如、衛子南勁、鄭太宰欣、楚白公、周單荼、燕子之，此九人者之為其臣也，皆朋黨比周以事其君，隱正道而行私曲，上偪君，下亂治，援外以撓内，親下以謀上，不難為也。</p><p><strong>所出</strong>：《韓非子 · 說疑》 — https://zh.wikisource.org/wiki/韓非子/說疑</p></article></main></div></div>
