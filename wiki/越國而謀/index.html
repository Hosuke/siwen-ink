    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 越國而謀</nav></header><main><article><h1>越國而謀</h1><p>衛孔達伐晉，陳共公教之，反覆為辭，是為越國而謀，古者所譏。</p><p>衛人使告于陳，陳共公曰：「更伐之，我辭之。」衛孔達帥師伐晉。君子以為古，古者越國而謀。</p><p><strong>所出</strong>：《春秋左氏傳 · 文公》 — https://zh.wikisource.org/wiki/春秋左氏傳/文公</p></article></main></div></div>
