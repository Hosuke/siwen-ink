    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 燕姞夢蘭</nav></header><main><article><h1>燕姞夢蘭</h1><p>文公賤妾燕姞夢天授蘭而生穆公蘭</p><p>文公之賤妾曰燕姞，夢天與之蘭，曰：「余為伯鯈，余，爾祖也。以是為而子，蘭有國香。」以夢告文公，文公幸之，而予之草蘭為符。遂生子，名曰蘭。</p><p><strong>所出</strong>：《史記 · 卷042》 — https://zh.wikisource.org/wiki/史記/卷042</p></article></main></div></div>
