    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 何校滅耳</nav></header><main><article><h1>何校滅耳</h1><p>荷校械於首，刑及其上，凶莫甚焉</p><p>上九之爻，辭曰「何校滅耳，凶」。何者，荷也，負荷之義。校者，枷械也。滅耳者，械加於首，沒其耳也。</p><p>初九以校滅趾，趾在下，刑之輕者，小罪也，故无咎。上九荷校而滅耳，耳在上，刑之極者，大罪也，故凶。噬嗑之卦，教聖人明罰敕法，刑用於將過，而上九之凶，則罪已成而不可救，其聰不明，聽諫而不聞，積惡至於斯極，故凶也。聖人取象以為戒，欲人慎始於微，毋至於大惡而後噬之也。</p><p><strong>所出</strong>：《周易 · 噬嗑》 — https://zh.wikisource.org/wiki/周易/噬嗑</p></article></main></div></div>
