    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 酒禁不行</nav></header><main><article><h1>酒禁不行</h1><p>禁令之行，在上者當自節於心，否則法禁不行。</p><p>抱朴子述酒禁之弊，有三難：其一，民好之者篤，犯禁者多，雖嚴令重申而至「穴地而釀，油囊懷酒」；其二，「臨民者雖設其法，而不能自斷斯物」，緩己急人而令不行；其三，有勢者擅市，官吏不敢問，法輕利重，禁安得止？是以禁令之設，必本於上行下效，而非徒恃刑罰。</p><p><strong>所出</strong>：《抱朴子 · 卷24》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷24</p></article></main></div></div>
