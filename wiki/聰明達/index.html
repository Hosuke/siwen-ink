    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聰明達</nav></header><main><article><h1>聰明達</h1><p>君閉聰明，令臣下各盡其言，以辨賢愚。</p><p>君所以必居戶內自閉，而使言者居戶外乎？夫人將聞密言者，必心不自知前也。頭面相近，傍人知之，令為言者得害矣。夫為人君長，受人聰明，後使其人得害，名為中傷忠信賢良股肱，後無肯復言者也。聰明閉絕，其政亂危者矣。又君者陽也，居陰中；臣者陰也，處陽中也；陰陽相得者，使人悅，所言進必盡信也，此天自然之法也。</p><p><strong>所出</strong>：《太平經 · 03》 — https://zh.wikisource.org/wiki/太平經/03</p></article></main></div></div>
