    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 國士之容若鍾玉陵木</nav></header><main><article><h1>國士之容若鍾玉陵木</h1><p>以玉、木喻君子之德。</p><p>故君子之容，純乎其若鍾山之玉，桔乎其若陵上之木。淳淳乎慎謹畏化，而不肯自足；乾乾乎取舍不悅，而心甚素樸。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十六》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十六</p></article></main></div></div>
