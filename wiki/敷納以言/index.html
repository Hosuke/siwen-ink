    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 敷納以言</nav></header><main><article><h1>敷納以言</h1><p>廣納諫言，俾下情上通。</p><p>「惟帝時舉，敷納以言」，言帝堯當時進用賢才，廣納臣民之言也。敷者，廣也。言即敷納之，俾四方之遠、近之微，莫不達於上。上之所以知人者，在是矣。</p><p><strong>所出</strong>：《尚書 · 皐陶謨》 — https://zh.wikisource.org/wiki/尚書/皐陶謨</p></article></main></div></div>
