    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以中制外</nav></header><main><article><h1>以中制外</h1><p>以心制物，則百事不廢。</p><p>以中制外，百事不廢；中能得之，則外能收之。中之得者，五藏寧，思慮平，筋力勁強，耳目聰明。聖人內修其本，不外飾其末；保其精神，偃其智故。是以心澄則氣定，氣定則神明。神明則物至之時無不應，萬事之來無不當。譬如執鏡者明，執秤者正，執道之要者，萬物皆備於我矣。</p><p><strong>所出</strong>：《淮南子 · 原道訓》 — https://zh.wikisource.org/wiki/淮南子/原道訓</p></article></main></div></div>
