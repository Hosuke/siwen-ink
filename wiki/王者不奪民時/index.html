    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 王者不奪民時</nav></header><main><article><h1>王者不奪民時</h1><p>不侵農時則五穀興，五穀興則國治</p><p>王者之治，不奪民時。時不奪，則五穀興豐；五穀興，則士不較祿而民不較賞，國自安定。是故善為國者，必使民力歸上、女功歸府，而不失其時，此高下之筴，不得不然之理也。</p><p><strong>所出</strong>：《管子 · 第68篇巨乘馬》 — https://zh.wikisource.org/wiki/管子/第68篇巨乘馬</p></article></main></div></div>
