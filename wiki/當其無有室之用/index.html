    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 當其無有室之用</nav></header><main><article><h1>當其無有室之用</h1><p>鑿戶牖以為室，室之所以居人者，空虛之處也。</p><p>鑿戶牖以為室。戶，門也；牖，窗也。鑿門開窗，以成居室。</p><p>當其無有室之用。室之用，在於能庇風雨、能居人。能居人者，非牆壁之實，乃室中之空也。苟無其空，雖四面有牆，亦不得為室。是故[[當其無有車之用]]、[[當其無有器之用]]、當其無有室之用，異事同情，其義一也。</p><p><strong>所出</strong>：《老子河上公章句 · 無用》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
