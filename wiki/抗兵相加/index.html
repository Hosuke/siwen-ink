    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 抗兵相加</nav></header><main><article><h1>抗兵相加</h1><p>兩軍相當，勢均力敵之謂也。</p><p>[[扔無敵]]之後，兩師相遇，抗然相持，故云「相加」。[[哀者勝]]之義，正於此際見之。兩軍對壘，智力相埒，非獨以力相角，必也哀愍之心動人，天道乃傾於其一焉。</p><p><strong>所出</strong>：《道德經 (王弼本) · 六十九章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p><hr><p><strong>所出</strong>：《老子河上公章句 · 玄用》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
