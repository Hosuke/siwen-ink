    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 承負之責</nav></header><main><article><h1>承負之責</h1><p>人生有承負，死後魂神受考</p><p>[[人之生，稟天地正氣，四時五行，來合為人]]。[[身體，或居天地四時五行]]。</p><p>[[先人之身，常樂善無憂，反復傳生，後世不肖，反久苦天地四時五行之身，令使更自冤死]]，尚愁其魂魄。</p><p>[[魂魄居地下，為其復見樂]]。</p><p>地下[[新死之人]]，[[悉問其生時所作為所更，以是生時可為，定名籍，因其事而責之]]。</p><p>[[故事不可不豫防，安危皆其身自得之也]]。</p><p><strong>所出</strong>：《太平經 · 08》 — https://zh.wikisource.org/wiki/太平經/08</p></article></main></div></div>
