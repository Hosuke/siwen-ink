    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 耳目之實</nav></header><main><article><h1>耳目之實</h1><p>衆之所聞見者，乃辨鬼神之實有與無的準。</p><p>天下之所以察知有與無之道者，必以衆之耳目之實，知有與亡爲儀者也。請惑聞之見之，則必以爲有；莫聞莫見，則必以爲無。</p><p>夫天下之爲聞見鬼神之物者，不可勝計也。然察知有與無之道，必以衆之耳目之實知有與亡爲儀。</p><p><strong>所出</strong>：《墨子 · 明鬼下》 — https://zh.wikisource.org/wiki/墨子/明鬼下</p></article></main></div></div>
