    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 輶車鸞鑣</nav></header><main><article><h1>輶車鸞鑣</h1><p>頌輕車之飾，鸞鈴鏘鏘，馬嚼雕鏤也。</p><p>遊于北園，四馬既閑。輶車鸞鑣，載獫歇驕。輶車者，輕小之獵車也；鸞，車衡之鈴也；鑣，馬銜也。《詩經·駟驖》：「輶車鸞鑣，載獫歇驕。」言田狩既畢，遊于北園，馭輕車以鸞鈴為節，馬口銜勒以金為飾，車中載獫犬、歇驕，皆田犬也。鸞鳴鏘鏘，車馬威儀，見秦君遊息之樂也。
<strong>所出</strong>：《詩經 · 駟驖》 — https://zh.wikisource.org/wiki/詩經/駟驖</p></article></main></div></div>
