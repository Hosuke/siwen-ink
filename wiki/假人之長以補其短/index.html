    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 假人之長以補其短</nav></header><main><article><h1>假人之長以補其短</h1><p>善學者假人之長以補其短</p><p>物固莫不有長，莫不有短。人亦然。故善學者，假人之長以補其短，故假人者遂有天下。</p><p>無醜不能，無惡不知。醜不能、惡不知，病矣；不醜不能、不惡不知，尚矣。雖桀、紂猶有可畏可取者，而況於賢者乎？</p><p>[[用眾]]之道，在於知所短而假人之長；《[[大學]]》[[格物致知]]之義，亦自知其所不知始。故[[學不可以已]]，非徒守其一長，乃廣取眾善以成[[聖人之道]]也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷四》 — https://zh.wikisource.org/wiki/呂氏春秋/卷四</p></article></main></div></div>
