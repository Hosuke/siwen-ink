    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 刑與政</nav></header><main><article><h1>刑與政</h1><p>刑以弊民，政以命民，功用各異。</p><p>刑以弊之，毋失民命；令之以終其欲，明之毋徑。</p><p>政以命之，號令是也；必嚴其令，而民則之。</p><p><strong>所出</strong>：《管子 · 第43篇正》 — https://zh.wikisource.org/wiki/管子/第43篇正</p></article></main></div></div>
