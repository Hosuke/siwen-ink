    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 實腹</nav></header><main><article><h1>實腹</h1><p>懷道抱一，守五藏之神，使腹充實。</p><p>實其腹者，懷道抱一，守五神也。腹實則精足，精足則骨強。</p><p>此與[[虛心]]對舉，心虛腹實，聖人治身之要。</p><p><strong>所出</strong>：《老子河上公章句 · 安民》 — https://zh.wikisource/wiki/老子河上公章句/上</p></article></main></div></div>
