    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 使法擇人不自舉</nav></header><main><article><h1>使法擇人不自舉</h1><p>先王治國，使法擇人不自舉</p><p>明主之擇賢人也，言勇者試之以軍，言智者試之以官。試於軍而有功者則舉之，試於官而事治者則用之。以戰功之事定勇怯，以官職之治定愚智。專任法，不自舉焉。
<strong>所出</strong>：《管子 · 第67篇明法解》 — https://zh.wikisource.org/wiki/管子/第67篇明法解</p></article></main></div></div>
