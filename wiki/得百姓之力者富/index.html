    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 得百姓之力者富</nav></header><main><article><h1>得百姓之力者富</h1><p>得民之力、死、譽，為國之根本。</p><p>用國者，得百姓之力者富，得百姓之死者彊，得百姓之譽者榮。三得者具而天下歸之，三得者亡而天下去之；天下歸之之謂王，天下去之之謂亡。湯武者，修其道，行其義，興天下同利，除天下同害，故厚德音以先之，明禮義以道之，致忠信以愛之，賞賢使能以次之。亂世則汙漫突盜以先之，權謀傾覆以示之，百姓賤之如尪，惡之如鬼，日欲司間而相與投藉之。</p><p><strong>所出</strong>：《荀子 · 王霸篇》 — https://zh.wikisource.org/wiki/荀子/王霸篇</p></article></main></div></div>
