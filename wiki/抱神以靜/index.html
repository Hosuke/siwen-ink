    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 抱神以靜</nav></header><main><article><h1>抱神以靜</h1><p>守護精神使之虛靜，則形體自正，長生可期。</p><p>廣成子語黃帝以治身之要曰：「慎汝內，閉汝外，多知為敗。」目無所見，耳無所聞，心無所知，則神將守形，形乃長生。此所謂抱神以靜，形將自正。必靜必清，無勞汝形，無搖汝精，乃可以長生。廣成子又言：「我為汝遂於大明之上矣，至彼至陽之原；為汝入於窈冥之門矣，至彼至陰之原。」天地有官，陰陽有藏，慎守汝身，物將自壯。守其一以處其和，則形神俱妙，長生久視。</p><p><strong>所出</strong>：《莊子 · 在宥》 — https://zh.wikisource.org/wiki/莊子/在宥</p></article></main></div></div>
