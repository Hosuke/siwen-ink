    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 德不二，動不凶</nav></header><main><article><h1>德不二，動不凶</h1><p>德若二三，舉動皆凶；德唯一純，舉動皆吉。</p><p>德者，天下之本也。純則吉，雜則凶，自然之理也。德一則無私，動無不宜；德二三則乖舛，舉必招咎。吉凶不僭在人，而天之降祥降災，悉視德之純駁以為差等。嗣王新服厥命，當以終始唯一為日新之功，不可使德有二三之患也。</p><p>德惟一，動罔不吉；德二三，動罔不凶。惟吉凶不僭在人，惟天降災祥在德。</p><p><strong>所出</strong>：《尚書 · 咸有一德》 — https://zh.wikisource.org/wiki/尚書/咸有一德</p></article></main></div></div>
