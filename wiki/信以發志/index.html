    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 信以發志</nav></header><main><article><h1>信以發志</h1><p>孚信感通，善志乃彰。</p><p>六五「厥孚交如」，《象》傳釋之曰「信以發志」。言六五以柔居尊，下應九二，孚信往來，交接於人。夫有其德者，必有其志；有其志者，必發於言動之間。信者，志之所成也。唯信積於中，是以志發於外，而威儀自然成也。</p><p><strong>所出</strong>：《周易 · 大有》 — https://zh.wikisource.org/wiki/周易/大有</p></article></main></div></div>
