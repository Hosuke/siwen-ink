    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 善人</nav></header><main><article><h1>善人</h1><p>善人不行聖跡，不能入室；聖人則不然。</p><p>子張問「善人」之道。子曰：「不踐跡，亦不入於室。」</p><p>善人質美而不學，不知踐聖人之跡，故不能入於道室。夫子言此，以見學之不可已也。</p><p><strong>所出</strong>：《論語 · 先進第十一》 — https://zh.wikisource.org/wiki/論語/先進第十一</p><hr><p>《孟子·公孫丑上》稱伯夷、伊尹皆古聖人，而皆不及孔子。宰我言孔子「賢於堯、舜遠矣」，有若言「自生民以來，未有盛於孔子」。是聖人與善人，固有等差之別。</p></article></main></div></div>
