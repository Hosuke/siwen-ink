    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 智大量遠者</nav></header><main><article><h1>智大量遠者</h1><p>智量宏遠之人，如山峙而不動；志小器近之人，如萍浮而流易。</p><p>抱朴子曰：「夫智大量遠者，盤桓以山峙；器小誌近者，蓬飛而萍浮。夫唯山峙，故莫之能動焉；夫唯萍浮，故流而不滯焉。」</p><p><strong>所出</strong>：《抱朴子 · 卷20》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷20</p></article></main></div></div>
