    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 叔向論比而不別</nav></header><main><article><h1>叔向論比而不別</h1><p>君子比德贊事，不別則引黨封己。</p><p>叔向見司馬侯之子，撫而泣之，曰：「自此其父之死，吾蔑與比而事君矣！昔者此其父始之，我終之，我始之，夫子終之，無不可。」</p><p>籍偃在側，曰：「君子有比乎？」叔向曰：「君子比而不別。比德以贊事，比也引黨以封己，利己而忘君，別也。」</p><p><strong>所出</strong>：《國語 · 卷14》 — https://zh.wikisource.org/wiki/國語/卷14</p></article></main></div></div>
