    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 奔奔</nav></header><main><article><h1>奔奔</h1><p>鳥居室匹耦有常，指鶉鵲匹配之貌。</p><p>「奔奔」，《詩經》疊言也。單言之則「奔」，疊言之則「奔奔」，狀鳥之匹耦有常、居室不移。《詩·鵲之奔奔》首句「鶉之奔奔」，言鵪鶉匹配，奔逸有常，以興人之無良不如鳥也。</p><p>後世用之者少，唯「奔奔」一詞見此詩，後來引申為往來不絕之意，蓋取其迭迭奔赴之貌，然要之本義，當以詩說為正。</p><p><strong>所出</strong>：《詩經 · 鵲之奔奔》 — https://zh.wikisource.org/wiki/詩經/鵲之奔奔</p></article></main></div></div>
