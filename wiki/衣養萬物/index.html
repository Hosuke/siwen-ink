    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 衣養萬物</nav></header><main><article><h1>衣養萬物</h1><p>道衣被涵養萬物而不為主</p><p>道衣被萬物，涵養之如衣之于身；萬物之生，咸賴其養。然衣之於身，衣不自尊而身受其益；道之於物，道不自大而物蒙其利。功成而不名，化育而不宰，常無欲，可名於小。聖人體此，亦當衣養百姓而不居其尊。</p><p><strong>所出</strong>：《道德經 (王弼本) · 三十四章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
