    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 虧盈益謙</nav></header><main><article><h1>虧盈益謙</h1><p>天道減盈增謙，謙者受益。</p><p>《彖》曰「天道虧盈而益謙」，言天之道，減損盈滿者而增益謙抑者。謙者有功而不居，有能而不矜，故天福之而益其謙。</p><p><strong>所出</strong>：《周易 · 謙》 — https://zh.wikisource.org/wiki/周易/謙</p></article></main></div></div>
