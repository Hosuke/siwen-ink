    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天子之冬禁</nav></header><main><article><h1>天子之冬禁</h1><p>冬禁尚藏，天子戒大耗以守令。</p><p>以秋日至始，數四十六日，秋盡而冬始。天子服黑絻黑而靜處，朝諸侯卿大夫列士，循於百姓，發號出令曰：「毋行大火，毋斬大山，毋塞大水，毋犯天之隆。」</p><p>言冬禁之要，在於閉藏。冬者萬物斂藏之候，天子靜處，服色尚黑，發令戒大興大耗之事。禁行大火以防火，禁斬大山以存資源，禁塞大水以通水氣，禁犯天之隆以循天令，皆所以斂藏生息以待來歲也。</p><p><strong>所出</strong>：《管子 · 第85篇輕重己》 — https://zh.wikisource.org/wiki/管子/第85篇輕重己</p></article></main></div></div>
