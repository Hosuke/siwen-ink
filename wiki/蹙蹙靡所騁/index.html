    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蹙蹙靡所騁</nav></header><main><article><h1>蹙蹙靡所騁</h1><p>四方無可馳騁之地的困境</p><p>詩末云「駕彼四牡，四牡項領。我瞻四方，蹙蹙靡所騁。」四牡項領，壯馬昂首而不得馳。蹙蹙，窘迫貌。言我駕彼壯馬，馬之項領皆已壯大，然我瞻望四方，局促無所施展。亂世之際，賢者欲有為而無路，詩人之自歎至深切矣。</p><p><strong>所出</strong>：《詩經 · 節南山》 — https://zh.wikisource.org/wiki/詩經/節南山</p></article></main></div></div>
