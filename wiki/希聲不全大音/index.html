    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 希聲不全大音</nav></header><main><article><h1>希聲不全大音</h1><p>希聲者，不以音聲自炫；不全大音，謙以俟知音。</p><p>玄泊先生答門人之疑曰：「吾特收遠名於萬代，求知己於將來，豈能競見知於今日，標格於一時乎？陶甄以盛酒，雖美不見酣；身卑而言高，雖是不見信。徒卷舌而竭聲，將何救於流遁？」又云：「<strong>未若希聲不全大音，約說以俟識者矣</strong>。」言淺近之徒辯虛無、爭細事、誦非聖之書，損教益惑，不若斂鋒以待知者。</p><p><strong>所出</strong>：《抱朴子 · 卷51》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷51</p></article></main></div></div>
