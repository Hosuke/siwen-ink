    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 壯者無怠</nav></header><main><article><h1>壯者無怠</h1><p>壯者無怠，老者無偷，皆當順天善終。</p><p>[[桓公]]欲一朝安[[管仲]]，[[管仲]]對曰：「臣聞壯者無怠，老者無偷，順天之道，必以善終者也。三王失之也，非一朝之萃，君奈何其偷乎！」</p><p><strong>所出</strong>：《管子 · 第19篇中匡》 — https://zh.wikisource.org/wiki/管子/第19篇中匡</p></article></main></div></div>
