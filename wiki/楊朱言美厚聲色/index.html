    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 楊朱言美厚聲色</nav></header><main><article><h1>楊朱言美厚聲色</h1><p>楊朱以為美厚復不可常厭足，聲色不可常翫聞，而世人反為刑賞名法所禁，乃竟失當年之至樂。</p><p>（見 [[百年壽之大齊]] 條）</p><p><strong>所出</strong>：《列子 · 楊朱篇》 — https://zh.wikisource.org/wiki/列子/楊朱篇</p></article></main></div></div>
