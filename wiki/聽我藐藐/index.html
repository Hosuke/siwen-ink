    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聽我藐藐</nav></header><main><article><h1>聽我藐藐</h1><p>教者諄諄，聽者藐藐，[[學不可以已]]而聞道者希之歎也。</p><p>「誨爾諄諄，聽我藐藐。」[[匪面命之|面命之]]而[[言提其耳]]者，誨之諄諄也；[[借曰未知]]而不受者，聽之藐藐也。[[非長生難聞道難]]-{云}-「非長生難，聞道難」，[[聞善相告]]而[[不善問者如攻堅木|不善問者]]猶是。[[學不可以已]]，聞道者希，此[[聖人退而使自己明志|聖人]]所以[[見善必自存]]而不能已也。</p><p><strong>所出</strong>：《詩經 · 抑》 — https://zh.wikisource.org/wiki/詩經/抑</p></article></main></div></div>
