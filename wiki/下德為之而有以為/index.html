    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 下德為之而有以為</nav></header><main><article><h1>下德為之而有以為</h1><p>下德據法有為，非自然無為</p><p>下德為之而有以為者，言下德之人據法施為，有心而有為也。王弼注云：「下德求而得之，為而成之，則立善以治物，故德名有焉。求而得之必有失焉，為而成之必有敗焉。」下德不及上德之無為，徒據法度以為治，是有以為之也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 三十八章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
