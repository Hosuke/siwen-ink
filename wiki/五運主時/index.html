    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五運主時</nav></header><main><article><h1>五運主時</h1><p>五運各主歲，非獨主一時；六氣六期為備，五運五歲為周。</p><p>五氣運行，各終期日，非獨主時也。</p><p>天以六為節，地以五為制。周天氣者，六期為一備；終地紀者，五歲為一周。</p><p>君火以明，相火以位。五六相合而七百二十氣為一紀，凡三十歲；千四百四十氣為一周，凡六十歲，而不及太過斯皆見矣。</p><p><strong>所出</strong>：《黃帝內經 · 素問第十九卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十九卷</p></article></main></div></div>
