    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 繁略適分</nav></header><main><article><h1>繁略適分</h1><p>繁與略各有所宜，當視才思之長短與文體之所需，酌而用之也</p><p><strong>文</strong></p><p>昔謝艾王濟，西河文士，張駿以為艾繁而不可刪，濟略而不可益，若二子者，可謂練鎔裁而曉繁略矣。至如士衡才優，而綴辭尤繁；士龍思劣，而雅好清省。及雲之論機，亟恨其多，而稱清新相接，不以為病；蓋崇友于耳。</p><p>夫美錦製衣，脩短有度，雖翫其采，不倍領袖，巧猶難繁，况在乎拙。而《文賦》以為榛楛勿翦，庸音足曲，其識非不鑒，乃情苦芟繁也。</p><p><strong>所出</strong>：《文心雕龍 · 鎔裁》 — https://zh.wikisource.org/wiki/文心雕龍/鎔裁</p></article></main></div></div>
