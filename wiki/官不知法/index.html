    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 官不知法</nav></header><main><article><h1>官不知法</h1><p>居官者悉不知法，何以決獄、牧民？</p><p>[[抱朴子]]痛言當時在職之弊曰：「案四科亦有明解法令之狀，今在職之人，官無大小，悉不知法令。或有微言難曉，而小吏多頑，而使之決獄，無以死生委之，以輕百姓之命，付無知之人也。作官長不知法，為下吏所欺而不知，又決其口筆者，憤憤不能知食法，與不食不問，不以付主者。」夫為政者不明法令，則百姓之命輕於鴻毛，此為政之大患也。</p><p><strong>所出</strong>：《抱朴子 · 卷15》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷15</p></article></main></div></div>
