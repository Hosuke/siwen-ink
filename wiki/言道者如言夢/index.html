    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 言道者如言夢</nav></header><main><article><h1>言道者如言夢</h1><p>言道如言夢，能言而不能與，能聞而不能受，惟善聽者不泥不辨。</p><p>言道者如言夢。夫言夢者曰如此金玉、如此器皿、如此禽獸，言者能言之，不能取而與之；聽者能聞之，不能受而得之。惟善聽者，不泥不辨。</p><p><strong>所出</strong>：《關尹子 · 9》 — https://zh.wikisource.org/wiki/關尹子/9</p></article></main></div></div>
