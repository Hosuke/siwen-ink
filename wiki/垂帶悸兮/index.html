    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 垂帶悸兮</nav></header><main><article><h1>垂帶悸兮</h1><p>垂帶顫動貌，狀驕矜之人舉止失度。</p><p>「垂帶悸兮」。</p><p>悸，動也。帶垂而下，顫搖不定。詩言童子佩觿，容儀既盛，而垂帶猶悸，見其矜持太甚而中心不定，徒有其表而無充實之德。詩人以此刺惠公之驕：雖衣冠整肅，而威儀不足，心存矜泰而形於外者如此。後世用「帶礪」「帶懸」皆本此義。</p><p><strong>所出</strong>：《詩經 · 芄蘭》 — https://zh.wikisource.org/wiki/詩經/芄蘭</p></article></main></div></div>
