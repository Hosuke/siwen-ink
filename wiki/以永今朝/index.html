    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以永今朝</nav></header><main><article><h1>以永今朝</h1><p>欲留賢人於目前，使歡娛長在。</p><p>「以永今朝」，詩《白駒》之首章句也。言皎皎白馬來食我圃苗，主人縶維之以待，欲延今日之會，使賢人不在朝已逝也。《毛詩正義》以「永」為「延長」之義，蓋主人戀賢，故縛馬以留。後世言留賢致飾者，多本此義。</p><p><strong>所出</strong>：《詩經 · 白駒》 — https://zh.wikisource.org/wiki/詩經/白駒</p></article></main></div></div>
