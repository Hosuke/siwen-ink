    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 樂由中出</nav></header><main><article><h1>樂由中出</h1><p>樂生於心，禮生於外。</p><p>樂由中出，禮自外作。樂由中出故靜，禮自外作故文。大樂必易，大禮必簡。樂至則無怨，禮至則不爭。揖讓而治天下者，禮樂之謂也。</p><p>樂者，天地之和也；禮者，天地之序也。和故百物皆化；序故群物皆別。樂由天作，禮以地制。過制則亂，過作則暴。明於天地，然後能興禮樂也。</p><p>樂者非謂黃鐘大呂弦歌干揚也，樂之末節也；故童者舞之。鋪筵席，陳尊俎，列籩豆，以升降為禮者，禮之末節也。</p><p><strong>所出</strong>：《禮記 · 樂記》 — https://zh.wikisource.org/wiki/禮記/樂記</p></article></main></div></div>
