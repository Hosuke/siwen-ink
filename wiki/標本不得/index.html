    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 標本不得</nav></header><main><article><h1>標本不得</h1><p>病為本，工為標，標本不相得，邪氣不服。</p><p>標本不得之義，出[[湯液醪醴論]]。</p><p>岐伯曰：「病為本，工為標。標本不得，邪氣不服。此之謂也。」</p><p>病者，病人之本也；工者，醫工之標也。治病之道，必病人之神氣足以應醫工之法，方可得其效。若病人精氣已敗，志意已散，雖醫工得其法、守其數，終不能取效。標本相得，邪氣乃服；標本不得，神去不救。</p><p><strong>所出</strong>：《黃帝內經 · 素問第四卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第四卷</p></article></main></div></div>
