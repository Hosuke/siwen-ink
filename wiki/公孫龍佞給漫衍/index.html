    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 公孫龍佞給漫衍</nav></header><main><article><h1>公孫龍佞給漫衍</h1><p>樂正子輿譏公孫龍佞給不中、漫衍無家、好怪妄言，欲惑人心、屈人口。</p><p>樂正子輿譏公孫龍曰：「公孫龍之爲人也，行無師，學無友，佞給而不中，漫衍而無家，好怪而妄言，欲惑人之心，屈人之口，與韓檀等肄之。」</p><p><strong>所出</strong>：《公孫龍子 · 原序》 — https://zh.wikisource.org/wiki/公孫龍子/原序</p></article></main></div></div>
