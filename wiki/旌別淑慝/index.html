    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 旌別淑慝</nav></header><main><article><h1>旌別淑慝</h1><p>表異善者，彰明其里居，使風聲示於天下。</p><p>王命畢公「旌別淑慝，表厥宅里，彰善癉惡，樹之風聲」。言當識別民之善惡，善者旌表之，居其里門之上，俾四方知勸；惡者顯斥之，使無所容。善惡既明，風聲自立，化民成俗，莫急於此。</p><p><strong>所出</strong>：《尚書 · 畢命》 — https://zh.wikisource.org/wiki/尚書/畢命</p></article></main></div></div>
