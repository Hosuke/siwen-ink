    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 四窮</nav></header><main><article><h1>四窮</h1><p>人之生，有四困厄不可免</p><p>人生於世，有四困厄，聖人亦不能免：</p><p>一厄，生於父母，既生之後，年少思戀父母而不能去，是為幼困。</p><p>二厄，及長情欲熾盛，男婚女嫁，相愛不能離，是為欲困。</p><p>三厄，既成夫婦，生子育兒，衰老相繼，是為家困。</p><p>四厄，子既成長，反得我老不能行，是為老困。</p><p>四困既過，乃可希聖求道矣。</p><p><strong>所出</strong>：《太平經 · 08》 — https://zh.wikisource.org/wiki/太平經/08</p></article></main></div></div>
