    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 晝夜不寐乃成真</nav></header><main><article><h1>晝夜不寐乃成真</h1><p>晝夜修煉不怠，方可成真。</p><p>成真者，道家[[修真]]之極功也。[[黃庭]]云「審能修之登廣寒，晝夜不寐乃成真」，言煉養之道，非一曝十寒之所能得。必也晝夜勤行，[[漱咽靈液]]以滋其源，[[卻滅百邪]]以清其宅，[[玉煉顏]]以全其形，如是而不怠者，方有[[登廣寒]]之驗，而臻成真之域。《[[陰符經]]》言「盜機」，[[修真]]者貴乎密用；此言晝夜不寐，蓋專心致志之謂也。</p><p><strong>所出</strong>：《黃庭內景經 · 口為章第三》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/口為章第三</p></article></main></div></div>
