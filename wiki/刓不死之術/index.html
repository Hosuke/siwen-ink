    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 刓不死之術</nav></header><main><article><h1>刓不死之術</h1><p>刪定不死之術，撰長生之方</p><p>[[後聖李君]]七十之歲，定無極之壽，適隱顯之宜，[[刓不死之術]]，撰[[神仙不死|長生之方]]。</p><p>寶經符圖，三古妙法，秘之玉函，侍以神吏，傳受有科，行藏有候，垂謨立典，施之[[種民]]。不能行者，非種民也。</p><p>[[真人]]備《[[靈書紫文]]》二十四，[[神仙不死|變化無窮，超淩三界之外]]，位極道宗。</p><p><strong>所出</strong>：《太平經 · 01》 — https://zh.wikisource.org/wiki/太平經/01</p></article></main></div></div>
