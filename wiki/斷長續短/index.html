    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 斷長續短</nav></header><main><article><h1>斷長續短</h1><p>禮之為用，損有餘益不足，以成美善之行義。</p><p>禮者、斷長續短，損有餘，益不足，達愛敬之文，而滋成行義之美者也。故文飾、麤惡，聲樂、哭泣，恬愉、憂戚；是反也；然而禮兼而用之，時舉而代御。故文飾、聲樂、恬愉，所以持平奉吉也；麤惡、哭泣、憂戚，所以持險奉凶也。故其立文飾也，不至於窕冶；其立麤惡也，不至於瘠棄；其立聲樂、恬愉也，不至於流淫、惰慢；其立哭泣、哀戚也，不至於隘懾傷生，是禮之中流也。</p><p><strong>所出</strong>：《荀子 · 禮論篇》 — https://zh.wikisource.org/wiki/荀子/禮論篇</p></article></main></div></div>
