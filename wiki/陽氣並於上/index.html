    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 陽氣並於上</nav></header><main><article><h1>陽氣並於上</h1><p>陰陽逆亂，陽氣並於上則火獨光，陰氣並於下則足寒脹，一水不勝五火，故目眥盲。</p><p>帝論厥之證曰：</p><p>夫人厥則陽氣並於上，陰氣並於下。陽並於上則火獨光也，陰並於下則足寒，足寒則脹也。夫一水不勝五火，故目眥盲。</p><p>是以衝風，泣下而不止。夫風之中目也，陽氣內守於精，是火氣燔目，故見風則泣下也。</p><p>此陰陽上下相逆之病機也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第二十四卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第二十四卷</p></article></main></div></div>
