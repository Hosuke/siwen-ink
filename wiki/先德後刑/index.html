    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 先德後刑</nav></header><main><article><h1>先德後刑</h1><p>治世以德為本、刑為末，先德後刑，乃順天之道也。</p><p>賢者誠信以仁之，慈惠以愛之。端政象，不敢以先人。中靜不留，裕德無求。其所處者，柔安靜樂，行德而不爭，以待天下之濆作也。</p><p>是先德後刑，順於天，微度人。賢者安徐正靜，柔節先定。行於不敢，而立於不能，守弱節而堅處之。不犯天時，不亂民功，秉時養人。</p><p><strong>所出</strong>：《管子 · 勢》 — https://zh.wikisource.org/wiki/管子/勢</p></article></main></div></div>
