    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蟡</nav></header><main><article><h1>蟡</h1><p>蟡為涸川之精，一頭兩身，狀若蛇，呼其名可取魚鼈。</p><p>涸川之精者生於蟡。蟡者，一頭而兩身，其形若虵，其長八尺。以其名呼之，可以取魚鼈。此涸川水之精也。</p><p>蟡與慶忌皆或世見、或世不見者。</p><p><strong>所出</strong>：《管子 · 第39篇水地》 — https://zh.wikisource.org/wiki/管子/第39篇水地</p></article></main></div></div>
