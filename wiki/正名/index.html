    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 正名</nav></header><main><article><h1>正名</h1><p>正名者，正其實以正其名。</p><p>名者，所以指實也。正名者，非徒正其名之文字聲音，乃正其所實。[[正名]]者，正其所實也；正其所實者，正其名也。其名正，則唯乎其彼此。謂彼而彼，不唯乎彼，則彼謂不行。謂此而此，不唯乎此，則此謂不行。彼此當乎彼此，是之謂正。</p><p>故彼彼當乎彼，則唯乎彼；此此當乎此，則唯乎此。正者，以當而當也。彼此止於彼此，可；彼此而彼且此，此彼而此且彼，不可。</p><p><strong>所出</strong>：《公孫龍子 · 6》 — https://zh.wikisource.org/wiki/公孫龍子/6</p></article></main></div></div>
