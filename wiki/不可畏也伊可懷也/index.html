    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不可畏也伊可懷也</nav></header><main><article><h1>不可畏也伊可懷也</h1><p>故里荒涼固可畏，然究為人所當懷念。</p><p>「不可畏也，伊可懷也」，歸人自解之辭也。故里荒廢，幽明淆雜，看似可畏，然終是故土，實可懷念。以反問之語，見其思戀之深，不以荒陋而替也。愛鄉之心，終勝於畏譴之情。</p><p><strong>所出</strong>：《詩經 · 東山》 — https://zh.wikisource.org/wiki/詩經/東山</p></article></main></div></div>
