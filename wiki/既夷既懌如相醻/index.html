    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 既夷既懌如相醻</nav></header><main><article><h1>既夷既懌如相醻</h1><p>頃刻交惡而旋和解之喻</p><p>「方茂爾惡，相爾矛矣。既夷既懌，如相醻矣。」言方盛其怨惡，則相視如矛戈；及其已平既悅，則復相交酬如舊。醻，同「酬」。以飲食相酬答喻人情之反覆，見其無常也。表面之和解，未必真有素情。</p><p><strong>所出</strong>：《詩經 · 節南山》 — https://zh.wikisource.org/wiki/詩經/節南山</p></article></main></div></div>
