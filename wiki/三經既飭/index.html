    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三經既飭</nav></header><main><article><h1>三經既飭</h1><p>治國有三綱，綱舉目張，三者既理，君主乃有國。</p><p>三經者，天植、風雨、遠近高下之得其嗣也。三者既飭，則君乃有國。譬如網罟，綱既張則目自舉；譬如鐘鼓，繩既正則音自諧。治國者亦然，心正、令行、民安，三者備而國基固矣。</p><p><strong>所出</strong>：《管子 · 第07篇版法》 — https://zh.wikisource.org/wiki/管子/第07篇版法</p></article></main></div></div>
