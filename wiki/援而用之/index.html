    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 援而用之</nav></header><main><article><h1>援而用之</h1><p>聖人之道援而用之，歿世不亡，與時變而不化。</p><p>聖人之道，若存若亡。援而用之，歿世不亡，與時變而不化；應物而不移，日用之而不化。</p><p>夫道之在天下，其用在人，人用之則存，不用則亡。聖人之道，上與天游，下與物接，昭昭乎若存，昧昧乎若亡，似不可得而執也。然而古之聖人既沒，而其道猶存者，以後之人援引而用之故也。</p><p>且也道不變於時，時自變而道不變；物自移而道不移。日用尋常之間，皆道之所在而不自知，非道有加損也。</p><p><strong>所出</strong>：《管子 · 第37篇心術下》 — https://zh.wikisource.org/wiki/管子/第37篇心術下</p></article></main></div></div>
