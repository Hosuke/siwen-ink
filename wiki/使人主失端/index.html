    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 使人主失端</nav></header><main><article><h1>使人主失端</h1><p>姦臣漸蝕其君，如地形漸往，使人主失端而不自知。</p><p>夫人臣之侵其主也，如地形焉，即漸以往，使人主失端，東西易面而不自知。故先王立司南以端朝夕，立法度以端朝政。姦邪之臣安利於無功，忠臣危死於非罪，此亡之本也。明主不親觀聽而制斷在下，使群臣不遊意於法之外，不為惠於法之内，動無非法，則姦無所匿。</p><p><strong>所出</strong>：《韓非子 · 有度》 — https://zh.wikisource.org/wiki/韓非子/有度</p></article></main></div></div>
