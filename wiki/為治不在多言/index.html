    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 為治不在多言</nav></header><main><article><h1>為治不在多言</h1><p>治國者當躬行力踐，不在空言。</p><p>申公見天子，天子問治亂之事。時申公年八十餘，对曰：「為治者不在多言，顧力行何如耳。」</p><p>[[為治者不在多言]] 此言切中儒者之要。治道之要，在躬行，不在騰口說也。</p><p><strong>所出</strong>：《史記 · 卷121》 — https://zh.wikisource.org/wiki/史記/卷121</p></article></main></div></div>
