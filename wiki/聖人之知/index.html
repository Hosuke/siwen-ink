    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖人之知</nav></header><main><article><h1>聖人之知</h1><p>聖人之知，多言文而類，終日議其所以，言之千舉萬變而統類一。</p><p>有聖人之知者，有士君子之知者，有小人之知者，有役夫之知者。多言則文而類，終日議其所以，言之千舉萬變，其統類一也，是聖人之知也。少言則徑而省，論而法，若佚之以繩，是士君子之知也。其言也謏，其行也悖，其舉事多悔，是小人之知也。[[言必立儀]]，聖人則統類不忒，此之謂大智。</p><p><strong>所出</strong>：《荀子 · 性惡篇》 — https://zh.wikisource.org/wiki/荀子/性惡篇</p></article></main></div></div>
