    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天性人心</nav></header><main><article><h1>天性人心</h1><p>天性在人，人心有機，機者善惡之樞。</p><p>天性，人也。人心，機也。立天之道，以定人也。</p><p>天之性，在人即為性；天之道在人，即在人之心。心有巧拙，巧者趨機以成事，拙者昧機以敗事。機者，天人善惡之所以分也。聖人立天之道以定人心，使機伏而不發，則性全而命立。</p><p><strong>所出</strong>：《黃帝陰符經集註》 — https://zh.wikisource.org/wiki/黃帝陰符經集註</p></article></main></div></div>
