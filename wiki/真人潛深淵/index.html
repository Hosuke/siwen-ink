    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 真人潛深淵</nav></header><main><article><h1>真人潛深淵</h1><p>真人沉潛深淵，浮游守中，為修真之極致</p><p>真人者，純素抱樸、與道合真之人也。《參同契》云「真人潛深淵，浮游守規中」，言真人沉潛乎坎水之淵，浮游乎規矩之中，動靜合道，樞轄不失。旋曲以視聽，開闔皆合同，蓋心專不縱橫，神與之守，故能隱顯自如，常居未發之地也。</p><p><strong>所出</strong>：《周易參同契 · 22章》 — https://zh.wikisource.org/wiki/周易參同契/22章</p></article></main></div></div>
