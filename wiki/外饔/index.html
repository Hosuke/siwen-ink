    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 外饔</nav></header><main><article><h1>外饔</h1><p>中士四人，掌外祭祀割亨與賓客饗食之事</p><p>外饔，中士四人，下士八人；府二人，史四人，胥十人，徒百人。</p><p>掌外祭祀之割亨，共其脯、修、刑、膴，陳其鼎俎，實之牲體、魚、臘。凡賓客之饔饗、食之事，亦如之。</p><p>邦饗耆老、孤子，則掌其割亨之事；饗士庶子，亦如之。師役，則掌共其獻賜脯肉之事。</p><p><strong>所出</strong>：《周禮 · 天官冢宰》 — https://zh.wikisource.org/wiki/周禮/天官冢宰</p></article></main></div></div>
