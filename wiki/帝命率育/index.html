    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 帝命率育</nav></header><main><article><h1>帝命率育</h1><p>天帝命后稷率天下萬物遂其生。</p><p>帝命，謂天帝之命也。率育，率天下萬物而育之。帝堯命后稷率天下萬物，使各遂其生。后稷奉帝命以養民，故能率育天下。</p><p><strong>所出</strong>：《詩經 · 思文》 — https://zh.wikisource.org/wiki/詩經/思文</p></article></main></div></div>
