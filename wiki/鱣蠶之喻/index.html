    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鱣蠶之喻</nav></header><main><article><h1>鱣蠶之喻</h1><p>利之所在，雖危趨之，若賁諸之於利。</p><p>鱣似蛇，蠶似蠋。人見蛇則驚駭，見蠋則毛起。漁者持鱣，婦人拾蠶，利之所在，皆為賁、諸。</p><p><strong>所出</strong>：《韓非子 · 說林下》 — https://zh.wikisource.org/wiki/韓非子/說林下</p></article></main></div></div>
