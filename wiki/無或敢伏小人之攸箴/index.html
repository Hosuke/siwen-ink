    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無敢伏箴</nav></header><main><article><h1>無敢伏箴</h1><p>禁令既布，小人箴言不得抑。</p><p>盤庚斆于民，由乃在位，以常舊服，正法度。曰：「無或（有）敢伏小人之攸箴。」</p><p>盤庚正法度於在位之臣，禁止其[[伏小人之攸箴]]。言法度既正，令既頒布，有敢抑伏小人箴諫者，罪之不赦也。此[[尚書]]所述[[正法度]]之令。</p><p><strong>所出</strong>：《尚書 · 盤庚上》 — https://zh.wikisource.org/wiki/尚書/盤庚上</p></article></main></div></div>
