    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 俗人昭昭我獨昏昏</nav></header><main><article><h1>俗人昭昭我獨昏昏</h1><p>俗眾明察，聖人悶默；光照則勞，晦藏乃全。</p><p>昭昭者，矜尚智察也。昏昏者，澹然無見也。俗人昭昭以眩世，我獨昏昏以守道。察察為明，物斯役之；昏昏若闇，道乃玄同。</p><p><strong>所出</strong>：《道德經 (王弼本) · 二十章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
