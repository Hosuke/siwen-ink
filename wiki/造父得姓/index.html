    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 造父得姓</nav></header><main><article><h1>造父得姓</h1><p>造父為周繆王御，取良馬以獻，平徐偃王之亂，繆王賜以趙城，趙氏始著。</p><p>造父幸於周繆王。造父取驥之乘匹，與桃林盜驪、驊騮、綠耳，獻之繆王。繆王使造父御，西巡狩，見西王母，樂之忘歸。而徐偃王反，繆王日馳千里馬，攻徐偃王，大破之。乃賜造父以趙城，由此為趙氏。</p><p><strong>所出</strong>：《史記 · 卷043》 — https://zh.wikisource.org/wiki/史記/卷043</p></article></main></div></div>
