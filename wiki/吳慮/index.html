    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 吳慮</nav></header><main><article><h1>吳慮</h1><p></p><p>《墨子·魯問》載魯之南鄙人吳慮，冬陶夏耕，自比於舜。吳慮謂子墨子曰：「義耳義耳，焉用言之哉？」墨子問其是否有力以勞人、有財以分人，吳慮皆言有之。</p><p>墨子遂計算之：一人之力耕作，不過一農之分；分諸天下，不能人得一升粟。一人之力紡織，不過一婦之分；分諸天下，不能人得尺布。一人披堅執銳，不過一夫之分；不能當三軍之禦。</p><p>墨子自謂其道不然：誦先王之道，通聖人之言，上說王公大人，次說匹夫徒步之士。王公大人用吾言，國必治；匹夫徒步之士用吾言，行必脩。雖不耕而食飢，不織而衣寒，功賢於耕而食之、織而衣之者。此[[義]]之功用，非獨善其身，乃[[兼愛]]天下之大道也。</p></article></main></div></div>
