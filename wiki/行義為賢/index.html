    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 行義為賢</nav></header><main><article><h1>行義為賢</h1><p>船能浮者為賢，人能行義者為賢。</p><p>今行者見大樹，必解衣縣冠倚劍而寢其下。大樹非人之情親知交也，而安之若此者信也。陵上巨木，人以為期，易知故也。又況於士乎？[[士義可知故也，則期為必矣。又況彊大之國？彊大之國誠可知，則其王不難矣。]]</p><p>人之所乘船者，[[為其能浮而不能沈也；世之所以賢君子者，為其能行義而不能行邪辟也。]]</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十二》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十二</p></article></main></div></div>
