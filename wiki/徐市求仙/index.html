    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 徐市求仙</nav></header><main><article><h1>徐市求仙</h1><p>秦始皇遣徐市率童男女數千人入海求神山不死之藥。</p><p>既已，齊人徐市等上書，言海中有三神山，名曰蓬萊、方丈、瀛洲，僊人居之。請得齋戒，與童男女求之。於是遣徐市發童男女數千人，入海求僊人。</p><p>三十二年，始皇之碣石，使燕人盧生求羨門、高誓。刻碣石門。因使韓終、侯公、石生求僊人不死之藥。</p><p><strong>所出</strong>：《史記 · 卷006》 — https://zh.wikisource.org/wiki/史記/卷006</p></article></main></div></div>
