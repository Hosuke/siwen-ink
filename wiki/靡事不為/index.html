    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 靡事不為</nav></header><main><article><h1>靡事不為</h1><p>言事無大小，莫不親力而為。</p><p>「或靡事不為」，[[詩經·北山]]之句。言人勤勉任事，無所不為，與「出入風議」者相對。詩人借此刺賢者之多勞，示世道之不公也。</p><p><strong>所出</strong>：《詩經 · 北山》 — https://zh.wikisource.org/wiki/詩經/北山</p></article></main></div></div>
