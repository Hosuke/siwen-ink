    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 殃民非樂</nav></header><main><article><h1>殃民非樂</h1><p>四面兵革之憂而日事歌舞，非樂也，殃民之哀也。</p><p>桓公、宋伐杞、狄伐邢衛，不救，縣鍾磬之榬，日殺牛數十，陳歌舞之樂。管仲進諫曰：「古者之言樂於鍾磬之間者，不如此。言脫於口，而令行乎天下，游鍾磬之間，而無四面兵革之憂。今君之事，言脫於口，令不得行於天下，在鍾磬之間，而有四面兵革之憂。此臣之所謂哀，非樂也。」蓋賢者之樂，在乎令行禁止、天下悅服，非在區區鐘鼓之聲也。</p><p><strong>所出</strong>：《管子 · 第22篇霸形》 — https://zh.wikisource.org/wiki/管子/第22篇霸形</p></article></main></div></div>
