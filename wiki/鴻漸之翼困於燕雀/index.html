    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鴻漸之翼困於燕雀</nav></header><main><article><h1>鴻漸之翼困於燕雀</h1><p>鴻鵠之志，本當漸翔萬里，乃困於燕雀之間。喻賢才未遇，志不得伸也。</p><p>太史公曰：公孫弘行義雖修，然亦遇時。漢興八十餘年矣，上方鄉文學，招俊乂，以廣儒墨，弘為舉首。主父偃當路，諸公皆譽之，及名敗身誅，士爭言其惡。悲夫！</p><p>班固稱曰：公孫弘、卜式、兒寬皆以鴻漸之翼困於燕雀，遠跡羊豕之閒，非遇其時，焉能致此位乎？</p><p><strong>所出</strong>：《史記 · 卷112》 — https://zh.wikisource.org/wiki/史記/卷112</p></article></main></div></div>
