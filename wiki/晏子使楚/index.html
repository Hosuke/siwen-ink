    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 晏子使楚</nav></header><main><article><h1>晏子使楚</h1><p>晏子</p><p>晏子之使楚，二辱而皆屈之。小門之對，折楚人之無禮；橘柚之剖，辯齊人之善盜。一言而霸，辭令之妙，無以加焉。[[使狗國者入狗門]]及[[橘化為枳]]皆本此。</p><p>  <strong>所出</strong>：《晏子春秋 · 卷六》 — https://zh.wikisource.org/wiki/晏子春秋/卷六</p></article></main></div></div>
