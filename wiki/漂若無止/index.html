    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 漂若無止</nav></header><main><article><h1>漂若無止</h1><p>聖心若水之漂，志在神域無所底止。</p><p>我獨漂漂，若飛若揚，無所止也，志意在神域。</p><p>漂，浮也。聖人若水上浮物，無所係著；若飛若揚，志在神域，無止無底。世俗逐物而馳，聖人遊心於淡，無止止之累。</p><p><strong>所出</strong>：《老子河上公章句 · 異俗》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
