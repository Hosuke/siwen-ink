    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 秦德公都雍及伏祠磔狗</nav></header><main><article><h1>秦德公都雍及伏祠磔狗</h1><p>記德公卜居雍，子孫飲馬於河，遂都雍，諸祠自此興，用三百牢於鄜畤，作伏祠，磔狗邑四門以御蠱菑。</p><p>作鄜畤後七十八年，秦德公既立，卜居雍，「後子孫飲馬於河」，遂都雍。雍之諸祠自此興，用三百牢於鄜畤。作伏祠。磔狗邑四門，以御蠱菑。</p><p><strong>所出</strong>：《史記 · 卷028》 — https://zh.wikisource.org/wiki/史記/卷028</p></article></main></div></div>
