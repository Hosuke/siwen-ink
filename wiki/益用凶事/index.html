    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 益用凶事</nav></header><main><article><h1>益用凶事</h1><p>凶事亦可為益，固有之也；在於以誠信行中道。</p><p>六三辭曰：「益之用凶事，无咎。」遇凶咎之事，以誠信之心行救恤之義，雖其事凶，其心正，故无咎也。《小象》申之曰「固有之也」，言凶事之有益，乃其事理本有，非人故欲用之也。用之之道，在有孚中行，告公用圭，此[[中行|中行]]之義也。</p><p><strong>所出</strong>：《周易 · 益》 — https://zh.wikisource.org/wiki/周易/益</p></article></main></div></div>
