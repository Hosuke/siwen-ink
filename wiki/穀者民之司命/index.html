    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 穀者民之司命</nav></header><main><article><h1>穀者民之司命</h1><p>穀為民命，智為民輔；民智而君愚，下富而君貧。</p><p>管子曰：「穀者，民之司命也。智者，民之輔也。」民智而君愚，則下富而君貧；下貧而君富，則上下失序。穀者，民之所以為生；智者，國之所以為治。二者相須，而以穀為本。</p><p><strong>所出</strong>：《管子 · 第75篇山權數》 — https://zh.wikisource.org/wiki/管子/第75篇山權數</p></article></main></div></div>
