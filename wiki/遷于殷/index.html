    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 遷于殷</nav></header><main><article><h1>遷于殷</h1><p>盤庚遷都，以延國脈。</p><p>民不適有居，率籲眾戚出矢言，共謀遷于殷。</p><p>盤庚之遷，承先王五邦之轍，稟天命而謀永命者也。殷有新邑，可以延國脈、安民生。民既不適舊居，王乃率眾戚而出矢言，相與定遷都之計。此[[尚書]]所述盤庚遷殷之事，而為全篇之始。</p><p><strong>所出</strong>：《尚書 · 盤庚上》 — https://zh.wikisource.org/wiki/尚書/盤庚上</p></article></main></div></div>
