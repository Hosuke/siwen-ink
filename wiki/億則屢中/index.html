    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 億則屢中</nav></header><main><article><h1>億則屢中</h1><p>謂料事揣時，屢中的也。</p><p>《史記》述端木賜之事，云其「不受命而貨殖焉，億則屢中」。</p><p>「億」讀若「臆」，揣度也。言端木賜未嘗稟命於人，而能私自興殖貨利，揣度時機，未嘗失準。</p><p>後世因以「億則屢中」為料事如神、屢測屢中之喻。</p><p><strong>所出</strong>：《史記 · 卷六七》 — https://zh.wikisource.org/wiki/史記/卷067</p></article></main></div></div>
