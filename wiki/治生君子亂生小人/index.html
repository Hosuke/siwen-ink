    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 治生乎君子亂生於小人</nav></header><main><article><h1>治生乎君子亂生於小人</h1><p>治世本於君子，亂世起於小人。</p><p>亂弱者亡，人之性也；治强者王，古之道也。魏方明《立辟》之時，强匡天下；法慢而國削。趙方明《國律》之時，人衆兵强；律慢而日削。燕方明《奉法》之時，辟地南盡中山；法亡而兵弱地削。</p><p>故曰：明法者强，慢法者弱。强弱如是其明矣，而世主弗為，國亡宜矣。</p><p><strong>所出</strong>：《韓非子 · 飾邪》 — https://zh.wikisource.org/wiki/韓非子/飾邪</p></article></main></div></div>
