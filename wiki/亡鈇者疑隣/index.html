    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 亡鈇者疑隣</nav></header><main><article><h1>亡鈇者疑隣</h1><p>人有疑心，則視人之行皆若竊己。</p><p>人有亡鈇者，意其鄰之子，視其行步竊鈇也，顏色竊鈇也，言語竊鈇也，動作態度無為而不竊鈇也。相其谷而得其鈇，他日復見其鄰之子，動作態度無似竊鈇者。其鄰之子非變也，己則變矣。變也者無他，有所尤也。</p><p>夫尤也者，蔽於一偏之謂也。東面望者不見西牆，南鄉視者不睹北方，意有所在則視有所偏，視有所偏則情有所蔽。故聽言不可不察，不察則善不善不分，亂莫大焉。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十三》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十三</p></article></main></div></div>
