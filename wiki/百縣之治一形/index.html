    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 百縣之治一形</nav></header><main><article><h1>百縣之治一形</h1><p>政令歸一，縣治不異</p><p>百縣之治一形，則迂者不飾，代者不敢更其制，過而廢者不能匿其舉。過舉不匿，則官無邪人。迂者不飾，代者不更，則官屬少而民不勞。官無邪則民不敖，民不敖則業不敗。官屬少則徵不煩，民不勞則農多日。政令一形，則姦邪無所匿跡，官民皆得其所，墾闢之功成矣。</p><p><strong>所出</strong>：《商君書 · 卷一》 — https://zh.wikisource.org/wiki/商君書/卷一</p></article></main></div></div>
