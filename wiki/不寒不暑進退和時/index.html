    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不寒不暑進退和時</nav></header><main><article><h1>不寒不暑進退和時</h1><p>脩煉以和為貴，與時推移，各得其宜。</p><p>不寒不暑進退和時者，言脩煉之法貴乎中和也。寒則凝滯，暑則燥妄，二者皆失其正。惟不寒不暑，乃溫涼適中之候，進退合宜，吐納有度，則日月之精、坎離之氣，各吐政符，循其自然之序而成功。故聖人御世治身，其理一也：不失其時，不乖其節，動止有常，乃能和於天地。</p><p><strong>所出</strong>：《周易參同契 · 27章》 — https://zh.wikisource.org/wiki/周易參同契/27章</p></article></main></div></div>
