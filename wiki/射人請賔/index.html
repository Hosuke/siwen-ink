    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 射人請賔</nav></header><main><article><h1>射人請賔</h1><p>射人請賔命某為賔，賔辭讓許諾</p><p>射人請賔。公曰：「命某為賔。」射人命賔，賔少進，禮辭。反命。又命之，賔再拜稽首，許諾，射人反命。賔出立于門外，東面。公揖卿大夫，乃升就席。</p><p><strong>所出</strong>：《儀禮 · 燕禮》 — https://zh.wikisource.org/wiki/儀禮/燕禮</p></article></main></div></div>
