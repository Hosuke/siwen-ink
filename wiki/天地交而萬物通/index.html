    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天地交而萬物通</nav></header><main><article><h1>天地交而萬物通</h1><p>上下相通，則志同道合，萬物遂其生也。</p><p>天地交而萬物通，上下交而其志同。天地之氣相交，萬物暢茂；君臣之志相通，政教淳和。否則反是。
<strong>所出</strong>：《周易註 (王弼) · 卷02》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷02</p></article></main></div></div>
