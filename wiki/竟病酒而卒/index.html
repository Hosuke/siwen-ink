    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 竟病酒而卒</nav></header><main><article><h1>竟病酒而卒</h1><p>信陵君未免於讒毀，謝病不朝，日夜酣飲，四歲而卒。</p><p>秦王患之，乃行金萬斤於魏，求晉鄙客，令毀公子於魏王曰：「公子亡在外十年矣，今為魏將，諸侯將皆屬，諸侯徒聞魏公子，不聞魏王。公子亦欲因此時定南面而王，諸侯畏公子之威，方欲共立之。」</p><p>秦數使反間，偽賀公子得立為魏王未也。魏王日聞其毀，不能不信，後果使人代公子將。公子自知再以毀廢，乃謝病不朝，與賓客為長夜飲，飲醇酒，多近婦女。日夜為樂飲者四歲，竟病酒而卒。</p><p><strong>所出</strong>：《史記 · 卷077》 — https://zh.wikisource.org/wiki/史記/卷077</p></article></main></div></div>
