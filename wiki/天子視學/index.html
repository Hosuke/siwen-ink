    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天子視學</nav></header><main><article><h1>天子視學</h1><p>天子親視太學，警眾養老，以成教化。</p><p>天子視學，大昕鼓徵，所以警眾也。眾至，然後天子至。乃命有司行事。興秩節，祭先師先聖焉。有司卒事，反命。始之養也：適東序，釋奠於先老，遂設三老五更群老之席位焉。適饌省醴，養老之珍，具；遂發詠焉，退修之以孝養也。</p><p><strong>所出</strong>：《禮記 · 文王世子》 — https://zh.wikisource.org/wiki/禮記/文王世子</p></article></main></div></div>
