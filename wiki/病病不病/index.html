    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 病病不病</nav></header><main><article><h1>病病不病</h1><p>聖人自知其病而以病為病，故不入於病。</p><p>聖人之所以不病者，以其病病故也。夫人之有病，必諱之而不肯以為病；及其病深久，則不可救治。聖人則反之：見己之有闕，即以為闕而不文；察己之有失，即以為失而不匿。如病者之求醫，懼焉而早治之，故病無所乘、邪無所入。眾人則不然，以無病自處，及其病發乃始慌遽，此所以病而不自知也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 七十一章》 — https://zh.wikisource.org/wiki/道德經_(王弼本)</p></article></main></div></div>
