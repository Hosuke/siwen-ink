    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 用意參焉</nav></header><main><article><h1>用意參焉</h1><p>智者當審思其義，用心參悟，以求深造。</p><p>智者審思，用意參焉。</p><p>[[用意參焉]]者，智者當詳加審思，用心參究，方能默契道妙也。</p><p><strong>所出</strong>：《周易參同契 · 31章》 — https://zh.wikisource.org/wiki/周易參同契/31章</p></article></main></div></div>
