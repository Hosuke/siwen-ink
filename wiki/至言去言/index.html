    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 至言去言</nav></header><main><article><h1>至言去言</h1><p>至妙之言不言，至為之行事不為。</p><p>至言去言，至為無為。言者，謂之屬也。求魚者濡，爭獸者趨，非樂之也。白公問於孔子曰：「人可與微言乎？」孔子不應。白公曰：「若以石投水奚若？」孔子曰：「沒人能取之。」白公曰：「若以水投水奚若？」孔子曰：「淄、澠之合者，易牙嘗而知之。」白公曰：「然則人不可與微言乎？」孔子曰：「胡為不可？唯知言之謂者為可耳。」白公弗得也。知謂則不以言矣。是故至言去言，得意而舍其言也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十八》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十八</p></article></main></div></div>
