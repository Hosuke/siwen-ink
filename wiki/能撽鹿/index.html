    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 能撽鹿</nav></header><main><article><h1>能撽鹿</h1><p>衆忌其能，因以自見；善用嫉忌之心，可以成事。</p><p>有欲以御見荆王者，衆騶妬之。因曰：「臣能撽鹿。」見王。王爲禦，不及鹿；自御，及之。王善其御也，乃言衆騶妬之。</p><p><strong>所出</strong>：《韓非子 · 說林下》 — https://zh.wikisource.org/wiki/韓非子/說林下</p></article></main></div></div>
