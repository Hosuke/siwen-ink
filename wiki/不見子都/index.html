    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不見子都</nav></header><main><article><h1>不見子都</h1><p>詩人欲見美士而不得，反遇狂且，以寓所美非美之歎。</p><p>[[山有扶蘇]]云「不見子都，乃見狂且」。子都，美士之稱；狂且，醜人之稱。詩人本欲見子都之美，而適得其反，所遇者狂且爾。此句為一篇之主，言企慕之美不可得，而醜陋之人常在目前。欲避無由，故嗟且怨也。</p><p><strong>所出</strong>：《詩經 · 山有扶蘇》 — https://zh.wikisource.org/wiki/詩經/山有扶蘇</p></article></main></div></div>
