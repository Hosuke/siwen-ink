    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 在陸</nav></header><main><article><h1>在陸</h1><p>賢者考磐之地，在於高原。</p><p>「在陸」者，高平之地也，[[考磐]]末章言賢者[[考磐]]之地。《[[考磐]]》以[[在澗]]始，以[[在阿]]繼，以在陸終，言賢者居所漸次開廣，而隱志愈堅，[[永矢弗告]]以終焉。</p><p><strong>所出</strong>：《詩經 · 考磐》 — https://zh.wikisource.org/wiki/詩經/考磐</p></article></main></div></div>
