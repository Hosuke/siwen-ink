    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 與心徘徊</nav></header><main><article><h1>與心徘徊</h1><p>寫物圖貌，隨物宛轉而心亦縈迴。</p><p>詩人感物，聯類不窮，流連萬象之間，沈吟視聽之區。寫物之氣、圖物之貌，既隨物以宛轉；屬采之辭、附聲之藻，亦與心而徘徊。蓋外境非徒形似而已，必有待於心之觀照；而心亦非孤出其意，必因物以展其情。二者相遭，如響之應，如影之隨，所謂「與心徘徊」者，正此心物交融之謂也。故灼灼桃花、依依楊柳、杲杲日出、喈喈黃鳥，皆以少總多，情貌無遺，詩人之妙，在是矣。</p><p><strong>所出</strong>：《文心雕龍 · 物色》 — https://zh.wikisource.org/wiki/文心雕龍/物色</p></article></main></div></div>
