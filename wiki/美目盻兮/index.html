    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 美目盻兮</nav></header><main><article><h1>美目盻兮</h1><p>喻女子美目黑白分明，傳神動人。</p><p>「美目盻兮」，《詩經·衞風·碩人》之句也。盻者，目之美也，黑白分明之貌。詩言莊姜美目一盼，黑白了然，神采煥發。</p><p>全句云：「巧笑倩兮，美目盻兮。」上句狀其笑，下句狀其眸。笑倩眸盻，相得益彰。此二字寫目之傳神，為後世文學形容美目之祖。</p><p><strong>所出</strong>：《詩經 · 碩人》 — https://zh.wikisource.org/wiki/詩經/碩人</p></article></main></div></div>
