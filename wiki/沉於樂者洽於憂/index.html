    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 沉於樂者洽於憂</nav></header><main><article><h1>沉於樂者洽於憂</h1><p>沉溺於樂者必近於憂，厚重於味者薄於德。</p><p>[[管仲]]趨出，[[桓公]]怒而問故。鮑叔、隰朋告以[[管仲]]之所以敢出者：「沉於樂者洽於憂，厚於味者薄於行，慢於朝者緩於政，害於國家者危於社稷。」臣是以敢出也。</p><p><strong>所出</strong>：《管子 · 第19篇中匡》 — https://zh.wikisource.org/wiki/管子/第19篇中匡</p></article></main></div></div>
