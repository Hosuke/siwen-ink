    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 愚人知利而病</nav></header><main><article><h1>愚人知利而病</h1><p>聖人知病之為利，愚人反是；利害之反，禍福之門也。</p><p>夫孫叔敖之請有寑之丘，沙石之地，所以累世不奪也。晉厲公之合諸侯於嘉陵，所以身死於匠驪氏也。眾人皆知利利而病病也，唯聖人知病之若是利，知利之為病也。夫再實之木根必傷，掘藏之家必有殃，以言大利而反為害也。</p><p>孔子讀易至損、益，未嘗不憤然而歎，曰：「益損者，其王者之事與！事或欲以利之，適足以害之；或欲害之，乃反以利之。利害之反，禍福之門戶，不可不察也。」</p><p><strong>所出</strong>：《淮南子 · 人間訓》 — https://zh.wikisource.org/wiki/淮南子/人間訓</p></article></main></div></div>
