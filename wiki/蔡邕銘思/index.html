    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蔡邕銘思</nav></header><main><article><h1>蔡邕銘思</h1><p>蔡邕銘文之思，古今獨冠。</p><p>蔡邕銘思，獨冠古今。劉勰論兩漢銘文，橋公之鉞，吐納典謨；朱穆之鼎，全成碑文，溺所長也。言各有當，而蔡邕則思深辭雅，體備義宏，故劉勰許以古今之冠，非偶然也。</p><p><strong>所出</strong>：《文心雕龍 · 銘箴》 — https://zh.wikisource.org/wiki/文心雕龍/銘箴</p></article></main></div></div>
