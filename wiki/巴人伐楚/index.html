    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 巴人伐楚</nav></header><main><article><h1>巴人伐楚</h1><p>荊國內亂，巴人乘之，遂伐荊師。</p><p>初，[[楚武王]]克權，使闘緡尹之，以叛，[[閻敖]]遊湧而逸。楚子殺之，其族為亂。冬，[[巴人]]因是以伐楚。巴本與荊友善者也，及楚文王與巴人伐申，而巴人叛。巴人乘荊國之亂，起兵伐之，取那處，遂門于楚。先是閻敖一族作亂，楚內有不靖之釁；巴人窺伺而動，因亂以伐，此所以記之也。[[巴人伐楚]]之故，內亂召外侮，君子是以慎所以養民也。</p><p><strong>所出</strong>：《春秋左氏傳 · 十八年》 — https://zh.wikisource.org/wiki/春秋左氏傳/莊公/十八年</p></article></main></div></div>
