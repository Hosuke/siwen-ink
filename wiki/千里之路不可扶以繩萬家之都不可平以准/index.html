    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 千里之路不可扶以繩萬家之都不可平以准</nav></header><main><article><h1>千里之路不可扶以繩萬家之都不可平以准</h1><p>大人之行，貴在大意得，不拘小缺；繩准之喻，示不可泥於一端。</p><p>聖人美而著之曰：「千里之路，不可扶以繩。萬家之都，不可平以准。」言大人之行，不必以先，帝常義立之謂賢。故為上者之論其下也，不可以失此術也。</p><p><strong>所出</strong>：《管子 · 第11篇宙合》 — https://zh.wikisource.org/wiki/管子/第11篇宙合</p></article></main></div></div>
