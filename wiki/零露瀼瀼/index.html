    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 零露瀼瀼</nav></header><main><article><h1>零露瀼瀼</h1><p>露盛貌，以喻恩澤深厚。</p><p>「零露瀼瀼。」</p><p>毛亨《傳》：「瀼瀼，露蕃貌。」鄭玄《箋》：「瀼瀼，露盛貌。」孔穎達《正義》：「露在蕭上，瀼瀼然蕃盛，以興王之恩澤深厚也。」</p><p>《說文》：「瀼，露貌。从水襄聲。」段注引《詩》此句，據《說文》「露貌」之義，謂露之盛也。《玉篇》亦云：「瀼瀼，露盛貌。」</p><p>「瀼瀼」與首章「湑兮」義近，而加甚焉。首章言「湑」，露初降之貌；此章言「瀼瀼」，露益盛之貌。以見恩澤之由淺而深，諸侯愈蒙眷遇也。</p><p><strong>所出</strong>：《詩經 · 蓼蕭》 — https://zh.wikisource.org/wiki/詩經/蓼蕭</p></article></main></div></div>
