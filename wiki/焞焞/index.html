    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 焞焞</nav></header><main><article><h1>焞焞</h1><p>車馬衆盛之貌，疊言以狀軍容之盛。</p><p>焞焞，疊字，車馬衆盛之貌也。《采芑》四章言：「戎車嘽嘽，嘽嘽焞焞，如霆如雷。」毛《傳》云：「焞焞，盛也。」言戎車之多，聲勢之盛，焞焞然若雷霆之鳴，以狀[[方叔涖止]]軍容之赫赫然也。</p><p><strong>所出</strong>：《詩經 · 采芑》 — https://zh.wikisource.org/wiki/詩經/采芑</p></article></main></div></div>
