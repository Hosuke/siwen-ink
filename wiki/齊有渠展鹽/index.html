    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 齊有渠展鹽</nav></header><main><article><h1>齊有渠展鹽</h1><p>齊以渠展鹽利制衡天下之術</p><p>管子言：「今齊有渠展之鹽，請君伐菹薪，煮沸火為鹽，正而積之。」十月始正，至於正月，成鹽三萬六千鍾。孟春既至，大夫無得繕冢墓、理宮室、立臺榭、築牆垣；北海之衆無得聚庸而煑鹽。若此，則鹽必坐長而十倍。</p><p>乃以令糶之梁、趙、宋、衞、濮陽。彼盡饋食之也，國無鹽則腫，守圉之國用鹽獨甚。故得成金萬壹千餘斤。金坐長而百倍，運金之重以衡萬物，盡歸於君，此陰王之業也。</p><p><strong>所出</strong>：《管子 · 第80篇輕重甲》 — https://zh.wikisource.org/wiki/管子/第80篇輕重甲</p></article></main></div></div>
