    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 官有渝</nav></header><main><article><h1>官有渝</h1><p>官守有變，渝而不失其正，則吉。</p><p>初九：「官有渝，貞吉。」象曰：「官有渝，從正吉也。」</p><p>官者，職守也。渝者，變也。世事無常，職守亦常有遷易。唯其渝也，以正為本，不失其貞，則可以獲吉。出門而交，廣結善類，其功自成。君子觀此，知進退出處之際，當以正自守，變而不失其守者也。</p><p><strong>所出</strong>：《周易 · 隨》 — https://zh.wikisource.org/wiki/周易/隨</p></article></main></div></div>
