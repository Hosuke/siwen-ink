    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 勇若此不若無勇</nav></header><main><article><h1>勇若此不若無勇</h1><p>齊之二勇士相遇，以肉相啖至死，此假勇也，不若無勇。</p><p>齊之好勇者，其一人居東郭，其一人居西郭，卒然相遇於塗曰：「姑相飲乎？」觴數行，曰：「姑求肉乎？」一人曰：「子肉也？我肉也？尚胡革求肉而為？」於是具染而已，因抽刀而相啖，至死而止。</p><p>夫勇者，非血氣之謂也，義之所存爾。二子徒以好勇聞，邂逅即以刃相加，食人之肉而不恤，此所謂不仁之勇也。行義不以其道，勇而無禮，與無勇等耳。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十一》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十一</p></article></main></div></div>
