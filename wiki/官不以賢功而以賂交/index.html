    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 官不以賢功</nav></header><main><article><h1>官不以賢功</h1><p>亂世之君不課賢不肖，不論有功勞，用人之賂遺請謁，因以敗政。</p><p>今則不然，不課賢不肖，不論有功勞，用諸侯之重，聽左右之謁，父兄大臣上請爵禄於上，而下賣之以收財利及以樹私黨。故財利多者買官以爲貴，有左右之交者請謁以成重。功勞之臣不論，官職之遷失謬。是以吏偷官而外交，弃事而親財。是以賢者懈怠而不勸，有功者隳而簡其業，此亡國之風也。</p><p><strong>所出</strong>：《韓非子 · 八姦》 — https://zh.wikisource.org/wiki/韓非子/八姦</p></article></main></div></div>
