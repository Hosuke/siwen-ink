    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 孝子敬父母</nav></header><main><article><h1>孝子敬父母</h1><p>父母嘗之而後退，不敢先食</p><p>問所欲而敬進之，柔色以溫之，饘酏、酒醴、芼羹、菽麥、蕡稻、黍粱、秫唯所欲，棗、栗、飴、蜜以甘之，堇、荁、枌、榆免槁薧滫以滑之，脂膏以膏之。父母舅姑必嘗之而後退。</p><p><strong>所出</strong>：《禮記 · 內則》 — https://zh.wikisource.org/wiki/禮記/內則</p></article></main></div></div>
