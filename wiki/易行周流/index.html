    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 易行周流</nav></header><main><article><h1>易行周流</h1><p>易道周遍流通，屈伸往來，終始迭運而無已。</p><p>易行周流，屈伸反覆。</p><p>易之道，無方無體，周遍乎天地之間，流轉乎四時之中。屈者，斂也；伸者，發也；反覆者，往來迭運之謂也。[[五行守界]]而剛柔正，[[四時順宜]]而與炁相得，則[[動靜有常]]，奉其繩墨，而[[易]]之所以行乎天地者，週流而不息，屈伸以成化矣。</p><p><strong>所出</strong>：《周易參同契 · 17章》 — https://zh.wikisource.org/wiki/周易參同契/17章</p></article></main></div></div>
