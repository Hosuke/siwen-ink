    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 富貴不歸故鄉</nav></header><main><article><h1>富貴不歸故鄉</h1><p>項羽欲東歸，視富貴顯榮而不返鄉里為無益之事。</p><p>項王見秦宮皆以燒殘破，又心懷思欲東歸，曰：「富貴不歸故鄉，如衣繡夜行，誰知之者！」此言既出，說者以為楚人徒具威儀而無遠略。後世以「衣繡夜行」喻榮耀不為人知，亦以「富貴不歸故鄉」諷居功自矜、目光短淺之輩。</p><p><strong>所出</strong>：《史記 · 卷007》 — https://zh.wikisource.org/wiki/史記/卷007</p></article></main></div></div>
