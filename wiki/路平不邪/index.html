    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 路平不邪</nav></header><main><article><h1>路平不邪</h1><p>和而隨從，則路平無邪，治身治國，其理相通。</p><p>和則隨從，路平不邪者，言陰陽相和，則物皆隨從，道途平坦而無邪曲。[[邪道險阻，傾危國家]]，反此則危。治身以和為本，治國亦以和為要，理一而已。</p><p><strong>所出</strong>：《周易參同契 · 16章》 — https://zh.wikisource.org/wiki/周易參同契/16章</p></article></main></div></div>
