    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 河廣</nav></header><main><article><h1>河廣</h1><p>《詩經》衞風之篇，言河狹易渡，以寓思歸之情。</p><p>《河廣》為《詩經·國風·衞風》之一篇，二章，章四句，凡八句。詩人以黃河之廣、宋國之遠為問，而以一葦可航、跂足可望、崇朝可至作答。辭若達觀，而實深於思。鄭玄以為宋襄公母歸於衞而思子所作，後世說詩者多從之。</p><p><strong>所出</strong>：《詩經 · 河廣》 — https://zh.wikisource.org/wiki/詩經/河廣</p></article></main></div></div>
