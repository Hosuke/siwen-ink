    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 晏子伏莊公尸哭之</nav></header><main><article><h1>晏子伏莊公尸哭之</h1><p>晏子伏尸而哭，成禮然後去，此見義而勇為者也。</p><p>太史公論晏子曰：「方晏子伏莊公尸哭之，成禮然後去，豈所謂『見義不為無勇』者邪？」</p><p><strong>所出</strong>：《史記 · 卷062》 — https://zh.wikisource.org/wiki/史記/卷062</p></article></main></div></div>
