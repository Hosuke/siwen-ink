    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 道者萬物之奧</nav></header><main><article><h1>道者萬物之奧</h1><p>道為萬物之庇護與根本</p><p>道者，萬物之奧。奧者，藏也，庇也。萬物皆稟道而生，道居萬物之中，如樞機之在戶，莫之能外。善人寶之，不善人賴是以存。此[[道隱無名|道之貴]]也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 六十二章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
