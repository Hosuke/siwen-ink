    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 服虎不以柙，禁姦不以法，塞偽不以符</nav></header><main><article><h1>服虎不以柙，禁姦不以法，塞偽不以符</h1><p>聖人貴道不貴術，必有以服之，而不可幸恃其名。</p><p>人主甘服於玉堂之中，而無瞋目切齒傾取之患；人臣垂拱於金城之內，而無扼捥聚脣嗟唶之禍。服虎而不以柙，禁姦而不以法，塞偽而不以符，此賁、育之所患，堯、舜之所難也。</p><p><strong>所出</strong>：《韓非子 · 守道》 — https://zh.wikisource.org/wiki/韓非子/守道</p></article></main></div></div>
