    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不食而死</nav></header><main><article><h1>不食而死</h1><p>淮南王長以驕致禍，絕食以死明志。</p><p>淮南王長既被徙，王乃謂侍者曰：「誰謂乃公勇者？吾安能勇！吾以驕故不聞吾過至此。人生一世閒，安能邑邑如此！」乃不食死。</p><p>王之行也，先既[[白起|矜悍不遜]]，後乃自知其非而羞見削地，然終不肯屈節以全軀命，反以一死不食終焉。嗚呼！其始也驕，其卒也烈；以暴終者，復以暴斃，固其所也。</p><p><strong>所出</strong>：《史記 · 卷118》 — https://zh.wikisource.org/wiki/史記/卷118</p></article></main></div></div>
