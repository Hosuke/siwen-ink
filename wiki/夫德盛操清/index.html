    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 德盛操清</nav></header><main><article><h1>德盛操清</h1><p>德行高潔者，雖自抑退，人猶貴之。</p><p>夫德盛操清，則雖深自挹降，而人猶貴之。若履蹈不高，則雖行淩暴，而人猶不敬。</p><p>昔莊生未食，趙王側立；騶衍入疆，燕君擁篲；康成之裏，逆虜望拜；林宗之庭，莫不卑肅。非力之所服也。</p><p>夫以抄盜致財，雖巨富不足嘉，凶德脅人，雖見憚不足榮也。是以君子貴乎德，不貴乎力；重乎操，不重乎勢。</p><p><strong>所出</strong>：《抱朴子 · 卷25》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷25</p></article></main></div></div>
