    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 湯兼桀天下</nav></header><main><article><h1>湯兼桀天下</h1><p>湯以仁義得民心而取桀之天下</p><p>桓公問湯以七十里之薄，兼桀之天下，其故何也。管子對曰：桀者，冬不爲杠，夏不束柎，以觀凍溺。㢮牝虎充市，以觀其驚駭。至湯而不然，夷競而積粟，飢者食之，寒者衣之，不𠸆者振之，天下歸湯若流水。此桀之所以失其天下也。</p><p>管子又言湯之陰謀：「女華者，桀之所愛也，湯事之以千金。曲逆者，桀之所善也，湯事之以千金。內則有女華之陰，外則有曲逆之陽，陰陽之議合，而得成其天子。」是兼恩義與詭道而言之。</p><p><strong>所出</strong>：《管子 · 第80篇輕重甲》 — https://zh.wikisource.org/wiki/管子/第80篇輕重甲</p></article></main></div></div>
