    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 遇合</nav></header><main><article><h1>遇合</h1><p>凡相遇者，必有待乎時；時不合，雖聖智莫能行。</p><p>凡遇，合也。時不合，必待合而後行。故比翼之鳥死乎木，比目之魚死乎海。</p><p>聖人之所以貴遇者，非苟然也。孔子周流海內，再干世主，如齊至衛，所見八十餘君，委質為弟子者三千人，達徒七十人。七十人者，萬乘之主得一人用可為師，不為無人以為至此。及其不合，雖聖智若無所用焉。</p><p>故遇者，天人之會也。有湯武之賢而無桀紂之時，不成；有桀紂之時而無湯武之賢，亦不成。時與遇相須以成，而不可以偏廢也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十四》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十四</p></article></main></div></div>
