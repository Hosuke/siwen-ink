    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 恪謹天命</nav></header><main><article><h1>恪謹天命</h1><p>先王循服天命，不敢怠寧。</p><p>先王有服，恪謹（勤）天命；茲猶（由）不常寧，不常厥邑，于今五邦。</p><p>[[先王有服]]，循其典常，不敢怠寧於天命，故能底綏四方。盤庚引先王之事，以見[[恪謹天命]]之義。先王不常厥邑者五，非變舊章，乃承天命以遷都耳。此[[尚書]]所述敬天之義。</p><p><strong>所出</strong>：《尚書 · 盤庚上》 — https://zh.wikisource.org/wiki/尚書/盤庚上</p></article></main></div></div>
