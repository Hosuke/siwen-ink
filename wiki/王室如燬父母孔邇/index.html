    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 王室如燬　父母孔邇</nav></header><main><article><h1>王室如燬　父母孔邇</h1><p>王室危迫而父母在近，政事之遐不及養親之邇。</p><p>末章云「魴魚赬尾，王室如燬」，赬，赤也；燬，烈火也。魴魚勞則尾赤，王室迫則如火。以魚之勞況王室之迫，皆以為不可久也。「雖則如燬，父母孔邇」，孔，甚也；邇，近也。言王室雖危迫若是，然父母之養近在目前，不可以政事之遐遠而忘之也。夫忠於國者不可不勤，而孝於親者尤不可緩；燬遠而邇近，理勢然也。婦以此勗其夫，可謂知所本矣。毛詩序云「勉之以正」，正此之謂與。</p><p><strong>所出</strong>：《詩經 · 汝坟》 — https://zh.wikisource.org/wiki/詩經/汝坟</p></article></main></div></div>
