    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 由頤厲吉</nav></header><main><article><h1>由頤厲吉</h1><p>因頤而厲，厲則終吉。</p><p>上九陽居卦極，萬物皆由之以養。厲吉者，言居高位而行養人之事，雖危厲而終吉也。《象》曰：「由頤厲吉，大有慶也。」以陽剛之德任養天下之責，危而有慶，[[利涉大川]]之占也。</p><p><strong>所出</strong>：《周易 · 頤》 — https://zh.wikisource.org/wiki/周易/頤</p></article></main></div></div>
