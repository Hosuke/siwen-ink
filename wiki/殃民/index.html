    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 殃民</nav></header><main><article><h1>殃民</h1><p>不教民而用之，謂之殃民，殃民者不容於堯舜之世。</p><p>不教民而用之，謂之殃民，殃民者，不容於堯舜之世。</p><p>慎子欲為將軍取南陽，孟子以為未可。孟子之言有二：一則[[教民]]，二則[[君子不由]]。未教民而驅之戰，是殃民也，堯舜之世所不容也。一戰勝齊遂有南陽，然且不可況乎？</p><p>故君子之事君，務引其君以當道，志於仁而已。非引之殺伐以廣地也，非驅不教之民以赴死也。</p><p><strong>所出</strong>：《孟子 · 告子下》 — https://zh.wikisource.org/wiki/孟子/告子下</p></article></main></div></div>
