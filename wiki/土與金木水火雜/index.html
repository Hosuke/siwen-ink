    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 土與金木水火雜</nav></header><main><article><h1>土與金木水火雜</h1><p>萬物皆五行相雜而成。</p><p>史伯述先王之治，云：「故先王以土與金木水火雜，以成百物。」是以和五味以調口，剛四支以衛體，和六律以聰耳，正七體以役心，平八索以成人，建九紀以立純德，合十數以訓百體。陰陽相雜，五行相成，萬物於是生焉。此國語中言五行之要義也。</p><p><strong>所出</strong>：《國語 · 卷16》 — https://zh.wikisource.org/wiki/國語/卷16</p></article></main></div></div>
