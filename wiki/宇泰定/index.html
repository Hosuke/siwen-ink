    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 宇泰定</nav></header><main><article><h1>宇泰定</h1><p>宇泰定者發乎天光，人有脩者乃今有恆，天民天助皆出於此。</p><p>宇泰定者，發乎天光。發乎天光者，人見其人，物見其物。人有脩者，乃今有恆；有恆者，人舍之，天助之。人之所舍，謂之天民；天之所助，謂之天子。</p><p><strong>所出</strong>：《莊子 · 庚桑楚》 — https://zh.wikisource.org/wiki/莊子/庚桑楚</p></article></main></div></div>
