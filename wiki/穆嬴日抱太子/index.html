    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 穆嬴日抱太子</nav></header><main><article><h1>穆嬴日抱太子</h1><p>穆嬴抱太子朝夕於朝及趙氏，頓首告趙宣子，以先君屬之子不可以外求。</p><p>秦康公送公子雍于晉，曰：「文公之入也，無衛，故有呂郤之難。」穆嬴日抱太子以啼于朝，曰：「先君何罪，其嗣亦何罪，舍適嗣不立，而外求君，將焉寘此？」出朝則抱以適趙氏，頓首於宣子曰：「先君奉此子也，而屬諸子曰，此子也才，吾受子之賜；不才，吾唯子之怨。今君雖終，言猶在耳，而棄之，若何？」</p><p><strong>所出</strong>：《春秋左氏傳 · 文公》 — https://zh.wikisource.org/wiki/春秋左氏傳/文公</p></article></main></div></div>
