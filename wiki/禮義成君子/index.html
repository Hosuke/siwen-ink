    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 禮義成君子</nav></header><main><article><h1>禮義成君子</h1><p>禮義招賢而寡得，名利治小人而多得</p><p>今天地之間，不肖實眾，仁賢實寡。趨利之情，不肖特厚；廉恥之情，仁賢偏多。今以禮義招仁賢，所得仁賢者，萬不一焉；以名利招不肖，所得不肖者，觸地是焉。故曰：禮義成君子，未必須禮義；名利治小人，小人不可無名利。</p><p><strong>所出</strong>：《尹文子 · 大道上》 — https://zh.wikisource.org/wiki/尹文子/大道上</p></article></main></div></div>
