    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖人四無為</nav></header><main><article><h1>聖人四無為</h1><p>聖人無為好靜無事事欲，而民自化自正自富自朴。</p><p>故聖人云： 聖人者，體道之君也，其言可以為萬世法。</p><p>我無為而民自化。 聖人無為，因民之自然而化之。</p><p>我好靜而民自正。 聖人好靜，不擾民，民自正於善。</p><p>我無事而民自富。 聖人不興事功，不奪民時，故民家給人足，自然富有。</p><p>我無欲而民自朴。 聖人無欲，不貴難得之貨，故民亦化之，自然淳朴也。</p><p><strong>所出</strong>：《老子河上公章句 · 淳風》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
