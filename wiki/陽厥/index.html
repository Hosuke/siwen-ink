    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 陽厥</nav></header><main><article><h1>陽厥</h1><p>陽氣暴折難決，故善怒發狂，生鐵洛可下氣。</p><p>陽厥之病，生於陽也。陽氣者因暴折而難決，故善怒也。陽明者常動，巨陽少陽不動，不動而動大疾，此其候也。治之奪其食即已，使之服以生鐵洛為飲，夫生鐵洛者，下氣疾也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第十三卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十三卷</p></article></main></div></div>
