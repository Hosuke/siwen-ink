    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 教數</nav></header><main><article><h1>教數</h1><p>明農、育畜、樹藝、樹瓜瓠、已疾病、知時、通蠶桑，皆賞黃金一斤直食八石。</p><p>管子設教數以興民利：民之能明於農事者、蕃育六畜者、樹藝者、樹瓜瓠葷菜百果使蕃袬者、已民疾病者、知時而預言歲且阨某穀不登某穀豐者、通於蠶桑使蠶不疾病者，皆置之黃金一斤，直食八石。謹聽其言而藏之官，使師旅之事無所與，此國筴之者也。國用相靡而足，相因揲而𠸆，然後置四限高下，令之徐疾，敺屏萬物，守之以筴。</p><p><strong>所出</strong>：《管子 · 第75篇山權數》 — https://zh.wikisource.org/wiki/管子/第75篇山權數</p></article></main></div></div>
