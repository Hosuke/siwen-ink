    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 廖氏世壽</nav></header><main><article><h1>廖氏世壽</h1><p>廖氏世世壽考，由宅中井水得古人丹砂之故。</p><p>余亡祖鴻臚少卿曾為臨沅令，雲此縣有廖氏家，世世壽考，或出百歲，或八九十，後徙去，子孫轉多夭折。他人居其故宅，複如舊，後累世壽考。由此乃覺是宅之所為，而不知其何故，疑其井水殊赤，乃試掘井左右，得古人埋丹砂數十斛，去井數尺，此丹砂汁因泉漸入井，是以飲其水而得壽，況乃餌煉丹砂而服之乎？</p><p><strong>所出</strong>：《抱朴子 · 卷11》 — https://zh.wikisource.org/wiki/抱朴子/卷11</p></article></main></div></div>
