    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 善者善之</nav></header><main><article><h1>善者善之</h1><p>聖人待善不善，其德一也。</p><p>聖人之心，無善不善之別。見善者善之，見不善者亦善之。善者善之，是因其本善而善之；不善者亦善之，非以其不善而棄之，乃以善道化之、容之、待之。此聖人之德溥博，不以善不善二其心、不以能不能易其志。夫善與不善皆百姓也，善者善之，是順其情；不善者亦善之，是正其性。善不善之名，待之如一，所謂德善者，善出於心之自然，非揀擇於外也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第十二章 德善》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
