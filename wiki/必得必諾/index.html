    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 必得必諾</nav></header><main><article><h1>必得必諾</h1><p>必得之事不足賴，必諾之言不足信；小謹不大立，訾食不肥體。</p><p>必得之事不足賴也，必諾之言不足信也。小謹者不大立，訾食者不肥體。有無棄之言者，必參於天地也。夫輕諾者必寡信，多言者必寡功。區區於小謹者，不能建大功；區區於小信者，不能成大義。是故聖人之於天下，不求必得，不責必諾，唯視其所行是否符合天地之道而已。能參於天地者，其言為無棄之言，其行為無弊之行也。</p><p><strong>所出</strong>：《管子 · 第02篇形勢》 — https://zh.wikisource.org/wiki/管子/第02篇形勢</p></article></main></div></div>
