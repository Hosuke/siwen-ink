    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以季孟之間待之</nav></header><main><article><h1>以季孟之間待之</h1><p>齊景公以中等禮遇對待孔子。</p><p>景公止孔子曰：「奉子以季氏，吾不能。」以季孟之間待之。蓋景公欲厚禮孔子而不能用，故以中等之禮待之。</p><p><strong>所出</strong>：《史記 · 卷047》 — https://zh.wikisource.org/wiki/史記/卷047</p></article></main></div></div>
