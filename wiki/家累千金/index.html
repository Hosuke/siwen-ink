    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 家累千金</nav></header><main><article><h1>家累千金</h1><p>商賈之富，至於千金之積，蓋言其貲財之厚。</p><p>呂不韋者，陽翟大賈，往來販賤賣貴，家累千金。</p><p>千金之積，在商賈中已稱巨富。然不韋之志不止於此。其見子楚，復傾所有以圖之：五百金予子楚為進用、結賓客，又以五百金市奇物玩好西游秦國。千金散盡，略無吝色。卒之家累千金者，不若以千金博萬乘之國者之為大也。</p><p><strong>所出</strong>：《史記 · 卷085》 — https://zh.wikisource.org/wiki/史記/卷085</p></article></main></div></div>
