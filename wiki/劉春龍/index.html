    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 劉春龍</nav></header><main><article><h1>劉春龍</h1><p>先世有陰德，遁化練景，入華陽易遷宮。</p><p>劉春龍、郭叔香，並不知何許人也。以其先世有陰德，故皆得遁化練景，入華陽易遷宮中。劉春龍、竇瓊英、韓太華、李奚子，並天姿嚴麗，儀冠駭眾，才識偉鑠，皆得為明晨侍郎，以居洞中侍郎之任，以良才舉之，不限男女也。</p><p><strong>所出</strong>：《墉城集仙錄 · 卷07》 — https://zh.wikisource.org/wiki/墉城集仙錄/卷07</p></article></main></div></div>
