    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鴻鵠春北秋南</nav></header><main><article><h1>鴻鵠春北秋南</h1><p>桓公以鴻鵠自況，歎己之不得意於天下。</p><p>今夫鴻鵠，春北而秋南，而不失其時。夫唯有羽翼以通其意於天下乎？今孤之不得意於天下，非皆二子之憂也。</p><p><strong>所出</strong>：《管子 · 第26篇戒》 — https://zh.wikisource.org/wiki/管子/第26篇戒</p></article></main></div></div>
