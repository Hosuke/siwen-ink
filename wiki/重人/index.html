    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 重人</nav></header><main><article><h1>重人</h1><p>竊柄專權、虧法利私之大臣。</p><p>重人也者，無令而擅爲，虧法以利私，耗國以便家，力能得其君，此所爲重人也。</p><p>重人擅權用事，外內皆為之用。諸侯不因，則事不應；百官不因，則業不進；郎中不因，則不得近主；學士不因，則養禄薄禮卑。此四助者，邪臣之所以自飾也。</p><p>重人不能忠主而進其仇，人主不能越四助而燭察其臣，故人主愈弊而大臣愈重。</p><p><strong>所出</strong>：《韓非子 · 孤憤》 — https://zh.wikisource.org/wiki/韓非子/孤憤</p></article></main></div></div>
