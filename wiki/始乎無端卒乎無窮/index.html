    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 始乎無端卒乎無窮</nav></header><main><article><h1>始乎無端卒乎無窮</h1><p>道始於無端，德終於無窮，以德畜民則民合而不乖。</p><p>始乎無端，道也；卒乎無窮，德也。道不可量，德不可數。不可量則衆强不能圖，不可數則姦偽不敢鄉。畜之以道則民和，養之以德則民合，故能習，習故能偕，偕習以悉，莫能傷也。</p><p><strong>所出</strong>：《管子 · 第08篇幼官》 — https://zh.wikisource.org/wiki/管子/第08篇幼官</p></article></main></div></div>
