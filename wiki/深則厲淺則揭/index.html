    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 深則厲淺則揭</nav></header><main><article><h1>深則厲淺則揭</h1><p>涉水者因地制宜，深則解衣而渡，淺則揭衣而行。</p><p>「深則厲，淺則揭」，《匏有苦葉》之首章句也。言涉濟水之術：水深則解衣以渡，曰厲；水淺則衣裳而過，曰揭。聖賢取此義，以喻行事貴乎達權，因時制宜，不可執一而廢變也。《論語》稱「君子之於天下也，無適也，無莫也」，義與此通。</p><p><strong>所出</strong>：《詩經 · 匏有苦葉》 — https://zh.wikisource.org/wiki/詩經/匏有苦葉</p></article></main></div></div>
