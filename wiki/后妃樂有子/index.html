    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 后妃樂有子</nav></header><main><article><h1>后妃樂有子</h1><p>后妃以和平之德，樂於有子，是為后妃之美。</p><p>《毛詩序》云：「《芣苢》，后妃之美也。和平，則妇人樂有子矣。」蓋言后妃躬行德化，心氣和平，則天下有子之望從之而生。此詩詠采芣苢之樂，實則託物言志，以見后妃之美。</p><p><strong>所出</strong>：《詩經 · 芣苢》 — https://zh.wikisource.org/wiki/詩經/芣苢</p></article></main></div></div>
