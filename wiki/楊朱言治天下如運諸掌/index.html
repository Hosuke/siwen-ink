    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 楊朱言治天下如運諸掌</nav></header><main><article><h1>楊朱言治天下如運諸掌</h1><p>楊朱對梁王言治天下如運諸掌，以堯舜不能治一小官為喻，明治大者不治細。</p><p>楊朱見梁王，言治天下如運諸掌。梁王曰：「先生有一妻一妾而不能治，三畝之園而不能芸，而言治天下如運諸掌，何也？」對曰：「君見其牧羊者乎？百羊而羣，使五尺童子荷箠而隨之，欲東而東，欲西而西。使堯牽一羊，舜荷箠而隨之，則不能前矣。且臣聞之：吞舟之魚，不游枝流；鴻鵠高飛，不集汙池。將治大者不治細，成大功者不成小，此之謂矣。」</p><p><strong>所出</strong>：《列子 · 楊朱篇》 — https://zh.wikisource.org/wiki/列子/楊朱篇</p></article></main></div></div>
