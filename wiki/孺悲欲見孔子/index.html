    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 孺悲欲見孔子</nav></header><main><article><h1>孺悲欲見孔子</h1><p>辭以疾者，非真有疾也，使之聞之，所以教之也。</p><p>孺悲欲見孔子，孔子辭以疾。將命者出戶，取瑟而歌，使之聞之。</p><p>孺悲有過焉，孔子辭以疾而不見，然又取瑟而歌，使其聞之，是終不得見也。此聖人之教有所以然者：辭而不納，使自悟其非，歌以發之，使知聖人之非果不可得而見也。欲見而不得見，不言之教深入其心，此聖人所以為聖也。</p><p><strong>所出</strong>：《論語 · 陽貨第十七》 — https://zh.wikisource.org/wiki/論語/陽貨第十七</p></article></main></div></div>
