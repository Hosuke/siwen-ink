    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 同寅協恭和衷</nav></header><main><article><h1>同寅協恭和衷</h1><p>君臣同敬同事、和衷共濟。</p><p>「同寅協恭和衷哉」，言君臣當共敬厥事、志同道合也。寅者，敬也。協，合也。恭者，敬之著於外；衷者，心之存乎中。上下敬恭，則心和；心和，則事成。推而至於百僚，無不和衷而熙事矣。</p><p><strong>所出</strong>：《尚書 · 皐陶謨》 — https://zh.wikisource.org/wiki/尚書/皐陶謨</p></article></main></div></div>
