    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 朝徹見獨</nav></header><main><article><h1>朝徹見獨</h1><p>外天下、外物、外生，而後朝徹，見獨，超乎古今，入不死不生。</p><p>女偊告南伯子葵以聞道之序：參日而後能外天下，七日而後能外物，九日而後能外生；已外生矣，而後能朝徹；朝徹而後能見獨，見獨而後能无古今，无古今而後能入於不死不生。殺生者不死，生生者不生。</p><p><strong>所出</strong>：《莊子 · 大宗師》 — https://zh.wikisource.org/wiki/莊子/大宗師</p></article></main></div></div>
