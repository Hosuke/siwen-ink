    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 行僻自用亡身之至</nav></header><main><article><h1>行僻自用亡身之至</h1><p>乖僻自用，慢待諸侯，必亡其身。</p><p>楚靈王為申之會，宋太子後至，執而囚之；狎弄徐君；拘齊慶封。中射士諫曰：「合諸侯，不可無禮。昔者桀為有戎之會而有緡叛之，紂為黎丘之蒐而戎狄叛之，皆由無禮也。」靈王不聽，遂行其意。居未期年，靈王南遊，羣臣從而劫之，靈王餓而死乾溪之上。</p><p>故[[靈王餓死]]之禍，肇於行僻自用，慢諸侯而無禮者也。</p><p><strong>所出</strong>：《韓非子 · 十過》 — https://zh.wikisource.org/wiki/韓非子/十過</p></article></main></div></div>
