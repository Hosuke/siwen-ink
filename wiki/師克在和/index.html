    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 師克在和</nav></header><main><article><h1>師克在和</h1><p>師之克敵，在於將帥和輯，非恃兵眾。</p><p>師之克敵，在於將帥和輯，不在兵眾之多。商、周之際，師以一出而亡戎師，況大國不能用其兵乎。</p><p>楚伐隨，隨將戰。楚子欲速戰，季梁止之，弗聽，師敗績。鬬伯比言於楚子曰：「師克在和，不在眾。商、周之不敵，君之所聞也。」成軍以出，又何濟焉。</p><p><strong>所出</strong>：《春秋左氏傳 · 桓公》 — https://zh.wikisource.org/wiki/春秋左氏傳/桓公</p></article></main></div></div>
