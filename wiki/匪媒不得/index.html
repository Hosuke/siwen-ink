    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 匪媒不得</nav></header><main><article><h1>匪媒不得</h1><p>娶妻無媒則不得成，喻禮法之不可闕</p><p>《南山》四章云：「取妻如之何？匪媒不得。」言娶妻而無媒人，則無由成昏姻之禮。[[昏禮者禮之本]]，媒妁通言，乃昏禮之一義。詩人以此為戒，蓋婚姻之大事，必有待於禮儀，斷無私相苟合之理。一章言「必告父母」，一章言「匪媒不得」，皆明昏姻之不可悖禮而行也。</p><p><strong>所出</strong>：《詩經 · 南山》 — https://zh.wikisource.org/wiki/詩經/南山</p></article></main></div></div>
