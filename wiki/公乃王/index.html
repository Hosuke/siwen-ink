    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 公乃王</nav></header><main><article><h1>公乃王</h1><p>公則天下歸之，是為王。</p><p>知常容，容乃公，公乃王，王乃天，天乃道，道乃久，沒身不殆。</p><p>容者，無所不納。公者，無私之至。公則王，天下往之。再進則與天合，天與道一。道久而不已，終身無危。</p><p>此五者遞進：容而公、公而王、王而天、天而道。公心充周，終躋天德，是為循道之全程也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第六十章 歸根》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
