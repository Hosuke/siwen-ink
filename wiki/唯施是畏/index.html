    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 唯施是畏</nav></header><main><article><h1>唯施是畏</h1><p>行道之人，以施設為可畏，慎其所施不敢妄施也</p><p>唯施是畏者，人主行道之時，所當戒慎者莫大於施之妄作也。施者，政令賞罰、威福干擾皆是也。</p><p>老子以為，大道之要，在清靜無為。苟有所知而行大道，則知所畏者惟在施之一途。何也？施之不當，則民心離怨；施之太過，則邦本凋敝。觀五十三章所陳「服文綵，帶利劍，厭飲食，財貨有餘」，皆施之失也、威福之濫也。</p><p>故聖人不敢以一人之私心，加於萬民之上。施之不敢，正所以全大道之夷、保蒼生之遂也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 五十三章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
