    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 私讎不及公</nav></header><main><article><h1>私讎不及公</h1><p>張柳朔謂私讎不害公義，為主而死，不可以僭。</p><p>范氏之臣王生，惡張柳朔，言諸昭子，使為柏人。昭子曰：「夫非而讎乎？」對曰：「私讎不及公，好不廢過，惡不去善，義之經也，臣敢違之。」及范氏出，張柳朔謂其子：「爾從主，勉之。我將止死，主生授我矣，吾不可以僭之。」遂死於柏人。</p><p><strong>所出</strong>：《春秋左氏傳 · 哀公五年》 — https://zh.wikisource.org/wiki/春秋左氏傳/哀公</p></article></main></div></div>
