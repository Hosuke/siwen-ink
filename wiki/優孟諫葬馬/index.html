    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 優孟諫葬馬</nav></header><main><article><h1>優孟諫葬馬</h1><p>優孟以反言激切，止楚莊王欲厚葬愛馬之舉。</p><p>優孟者，楚之俳優也。楚莊王欲以大夫之禮葬愛馬，左右莫能諫。優孟入殿，仰天大哭，王問其故，對曰：「馬者，王之所愛也。以楚國之大，何求而不得？而以大夫禮葬之，薄矣。請以人君之禮葬之，祀以太牢，奉以萬乘。」王悟而改之。夫優孟之言，反說以激，故[[文心雕龍 · 諧讔]]稱其「譎辭飾說，抑止昏暴」，辭傾意正，功在止諫。</p><p><strong>所出</strong>：《文心雕龍 · 諧讔》 — https://zh.wikisource.org/wiki/文心雕龍/諧讔</p></article></main></div></div>
