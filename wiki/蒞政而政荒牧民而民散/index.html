    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蒞政而政荒，牧民而民散</nav></header><main><article><h1>蒞政而政荒，牧民而民散</h1><p>用人不當則政散民離</p><p>選之者既不為官擇人，而求之者又不自謂不任，於是蒞政而政荒，牧民而民散，或有穢濁驕奢而困百姓者矣，或有苛虐酷烈而多怨判者矣，或有暗塞退愦而庶事亂者矣，或有潦倒疏緩而致馳壞者矣，或有好興不急而疲人力者矣，或有藏養逋逃而行淩暴者矣，或有不曉法令而受欺弄者矣，或有以音聲酒色而致荒湎者矣，或有圍棋樗蒲而廢政務者矣，或有田獵遊飲而忘庶事者矣，或有不省辭獄而刑獄亂者矣。</p><p><strong>所出</strong>：《抱朴子 · 卷28》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷28</p></article></main></div></div>
