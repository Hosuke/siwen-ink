    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 朱家田仲劇孟郭解</nav></header><main><article><h1>朱家田仲劇孟郭解</h1><p>漢興游俠四大家：朱家、田仲、劇孟、郭解，皆以俠聞而私義廉絜。</p><p>以余所聞，漢興有朱家、田仲、王公、劇孟、郭解之徒，雖時扞當世之文罔，然其私義廉絜退讓，有足稱者。名不虛立，士不虛附。</p><p><strong>所出</strong>：《史記 · 卷124》 — https://zh.wikisource.org/wiki/史記/卷124</p></article></main></div></div>
