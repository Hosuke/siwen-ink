    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天有缺陷地有偏勝</nav></header><main><article><h1>天有缺陷地有偏勝</h1><p>喻天地萬物皆有偏至之性，無能全備者。</p><p>天不能平其西北，地不能隆其東南，日月不能摛光於曲穴，沖風湧揚波於井底。此天地之勢，自然之理，無能全備者也。</p><p><strong>所出</strong>：《抱朴子 · 卷17》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷17</p></article></main></div></div>
