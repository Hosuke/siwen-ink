    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 張惠明</nav></header><main><article><h1>張惠明</h1><p>趙郡人，師混元子得高奔之道，後受右英夫人三五混合之要，一紀而尸解。</p><p>張惠明，趙郡人。結廬於中條山，受法於元真觀。常行呪禁，驅馳精魅。</p><p>後往長安，遇混元子，受高奔之道。行之，功濟德備，道學超群。凡諸就席，皆章甫之徒。</p><p>唐太宗韶之內殿，致醮有感。後乞歸山林，上允軟住南嶽，封妙濟大師。忽州夕遇南嶽右英夫人，傳抱一守真、三五混合之要。行之一紀，復韶之西徹，以便問事。復尸解。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 33》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/33</p></article></main></div></div>
