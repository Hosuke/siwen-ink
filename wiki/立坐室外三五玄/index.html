    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 立坐室外三五玄</nav></header><main><article><h1>立坐室外三五玄</h1><p>動止之間，皆合三五之玄妙。</p><p>三五者，天地人與陰陽之精之合也。立則應之，坐亦應之，動靜之間無不合於玄妙之理。言修真者動靜皆道，非枯坐一途之謂。</p><p><strong>所出</strong>：《黃庭內景經 · 治生章第二十三》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/治生章第二十三</p></article></main></div></div>
