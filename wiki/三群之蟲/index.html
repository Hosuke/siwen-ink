    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三群之蟲</nav></header><main><article><h1>三群之蟲</h1><p>食材各隨其性，烹治者當知其所以然。</p><p>夫三群之蟲，水居者腥，肉玃者臊，草食者羶，臭惡猶美，皆有所以。</p><p>是故善烹者，必知腥臊羶之所自來，而後能滅之、去之、除之，以火為紀，以時為節，變化九沸，而不失其理。若此，則天下之至味備矣。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十四》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十四</p></article></main></div></div>
