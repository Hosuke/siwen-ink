    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 美惡相飾</nav></header><main><article><h1>美惡相飾</h1><p>美與惡相為掩飾，吉凶成敗迭相循轉。</p><p>美惡相飾，命曰復周，物極則反，命曰環流。積往生跂，工以為師；積毒成藥，工以為醫。是故有人將，得一人氣吉，有家將，得一家氣吉，有國將，得一國氣吉。其將兇者反此。同之謂一，異之謂道；相勝之謂埶，吉兇之謂成敗。賢者萬舉而一失，不肖者萬舉而一得，其冀善一也。知一之不可一也，故貴道。</p><p><strong>所出</strong>：《鶡冠子》 — https://zh.wikisource.org/wiki/鶡冠子</p></article></main></div></div>
