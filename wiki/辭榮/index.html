    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 辭榮</nav></header><main><article><h1>辭榮</h1><p>賢者辭祿不仕，以全其志。</p><p>洪頻為節將見邀用，皆不就。永惟富貴可以漸得而不可頓合，其間屑屑亦足以勞人。且榮位勢利，譬如寄客，既非常物，又其去不可得留也。隆隆者絕，赫赫者滅，有若春華，須臾凋落。得之不喜，失之安悲？</p><p>且自度性篤懶而才至短，以篤懶而禦短才，雖翕肩屈膝，趨走風塵，猶必不辦大致名位而免患累，況不能乎？未若修松喬之道，在我而已，不由於人焉。</p><p><strong>所出</strong>：《抱朴子 · 卷52》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷52</p></article></main></div></div>
