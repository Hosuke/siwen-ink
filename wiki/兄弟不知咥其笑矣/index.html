    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 兄弟不知咥其笑矣</nav></header><main><article><h1>兄弟不知咥其笑矣</h1><p>兄弟不察女之情狀，反從而嗤笑，極寫被棄之孤。</p><p>「兄弟不知，咥其笑矣」，語出《詩經·衞風·氓》第五章。言女子歸寧娘家，而兄弟不知其被棄之苦，反從而笑之也。</p><p>女子被棄而歸，處境悲涼。昔者嫁時，兄弟送往迎來，以為得所；今焉被遣，無顏以對。靜言思之，躬自悼矣，而兄弟不但不見憐恤，且咥咥然笑之。此何情也？蓋世之常人但觀其表面，不察其隱衷；徒見其被遣而歸，不知其夫之暴行。人心之涼薄，兄弟亦不能免，而女子之孤苦益甚矣。</p><p><strong>所出</strong>：《詩經 · 氓》 — https://zh.wikisource.org/wiki/詩經/氓</p></article></main></div></div>
