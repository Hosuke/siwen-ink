    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 是者常是非者常非</nav></header><main><article><h1>是者常是非者常非</h1><p>是非之理不同，更興廢而歸我用</p><p>凡天下萬里，皆有是非，吾所不敢誣，是者常是，非者常非，亦吾所信。然是雖常是，有時而不用；非雖常非，有時而必行。故用是而失有矣，行非而得有矣。是非之理不同，而更興廢，翻為我用，則是非焉在哉？</p><p><strong>所出</strong>：《尹文子 · 大道上》 — https://zh.wikisource.org/wiki/尹文子/大道上</p></article></main></div></div>
