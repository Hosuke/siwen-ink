    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 王玄甫</nav></header><main><article><h1>王玄甫</h1><p>師白雲上真得道，號華陽真人，傳道與鍾離權。</p><p>王玄甫，沛人。與昊人[[鄧伯元]]同學道於赤城、霍山，受服[[青精石飯]]、吞日精丹景之法，內思洞房，積三十四年，乃內見五藏，冥夜中能書。晉穆帝永和元年正月十五日，大帝遣羽車迎之，玄甫與伯元乘雲駕龍，白日昇天。今在北玄圃臺，受書為中嶽真人。</p><p>  <strong>所出</strong>：《歷世真仙體道通鑑 · 34》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/34</p></article></main></div></div>
