    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 介於石</nav></header><main><article><h1>介於石</h1><p>中正自守，見幾而作，不溺於豫。</p><p>六二以陰居陰，中正自守，介然如石，堅定不搖。當豫之時，眾皆溺於逸樂，唯六二見幾而作，不待終日，速即退去，是能守正而不失其操者也。故《象》曰「不終日，貞吉；以中正也」。後世言見幾知微、不溺富貴者，必稱介於石。</p><p><strong>所出</strong>：《周易 · 豫》 — https://zh.wikisource.org/wiki/周易/豫</p></article></main></div></div>
