    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 飂兮若無止</nav></header><main><article><h1>飂兮若無止</h1><p>聖人行世若風，無所係著。</p><p>飂者，高風急行之貌。言聖人遊於天地，若風之無所底止，無欲則剛，無物則清，往來天地之間而無滯礙。</p><p><strong>所出</strong>：《道德經 (王弼本) · 二十章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
