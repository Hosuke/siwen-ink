    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不妬忌</nav></header><main><article><h1>不妬忌</h1><p>后妃逮下之德，子孫衆多之本。</p><p>毛詩序云：「《螽斯》，后妃子孫衆多也。言若螽斯，不妬忌，則子孫衆多也。」妬忌者，嫉人之能而欲專寵之私心也。不妬忌者，后妃不以己之專房為私，而能逮下惠及衆妾，使皆得有子。由是子孫衆多，室家大和。詩以螽斯之羽翼薨薨興后妃之德被無私，正見「不妬忌」三字之義，為子孫繁盛之本原。</p><p>所出：《詩經 · 螽斯》 — https://zh.wikisource.org/wiki/詩經/螽斯</p></article></main></div></div>
