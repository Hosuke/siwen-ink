    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 身非汝有天地之委形</nav></header><main><article><h1>身非汝有天地之委形</h1><p>舜問烝以道，身非汝有，乃天地之委形、委和、委順、委蛻。</p><p>舜問乎烝曰：「道可得而有乎？」曰：「汝身非汝有也，汝何得有夫道？」舜曰：「吾身非吾有，孰有之哉？」曰：「是天地之委形也。生非汝有，是天地之委和也。性命非汝有，是天地之委順也。孫子非汝有，是天地之委蛻也。故行不知所往，處不知所持，食不知所以。天地強陽，氣也；又胡可得而有邪？」</p><p><strong>所出</strong>：《列子 · 天瑞篇》 — https://zh.wikisource.org/wiki/列子/天瑞篇</p></article></main></div></div>
