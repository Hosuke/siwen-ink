    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 毒而無怒怨而無言欲而無謀</nav></header><main><article><h1>毒而無怒怨而無言欲而無謀</h1><p>止忿速，濟沒法，慎言密謀，所以全身遠害。</p><p>「毒而無怒」，此言止忿速，濟沒法也；「怨而無言」，言不可不慎也，言不周密，反傷其身。故曰：「欲而無謀。」言謀不可以泄，謀泄菑極。夫行忿速，遂沒法，賊發言，輕謀泄，菑必及於身。</p><p><strong>所出</strong>：《管子 · 第11篇宙合》 — https://zh.wikisource.org/wiki/管子/第11篇宙合</p></article></main></div></div>
