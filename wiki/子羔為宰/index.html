    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 子羔為宰</nav></header><main><article><h1>子羔為宰</h1><p>子路使子羔為費宰，夫子以為賊夫人之子。</p><p>子路使子羔爲費宰。子曰：「賊夫人之子。」子路曰：「有民人焉，有社稷焉；何必讀書，然後爲學？」子曰：「是故惡夫佞者。」</p><p>子羔未學而使之宰，是戕賊之也。子路以為治民即學，夫子非之，以為佞者巧言飾非如此。</p><p><strong>所出</strong>：《論語 · 先進第十一》 — https://zh.wikisource.org/wiki/論語/先進第十一</p></article></main></div></div>
