    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 玄充神名元素炁</nav></header><main><article><h1>玄充神名元素炁</h1><p>無英玄充神名，元素之炁。</p><p>玄充叔者，左無英公子之[^1]內諱[^2]名字也。其名兼[^3]玄、元、元素三義，炁[^4]充於左腋之門而為之[^5]守。與混離子同出大洞玉經，而玄充為[^6]神[^7]名元素炁之[^8]別號。修煉存思之時，稱名而[^9]守之，則[^10]玉光[^11]引[^12]神明[^13]上[^14]入[^15]兩[^16]眼[^17]中[^18]矣。</p><p>  <strong>所出</strong>：《上清大洞真經 · 4章》 — https://zh.wikisource.org/wiki/上清大洞真經/4章</p></article></main></div></div>
