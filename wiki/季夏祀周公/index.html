    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 季夏祀周公</nav></header><main><article><h1>季夏祀周公</h1><p>魯以季夏禘禮祀周公於大廟，用天子之禮。</p><p>季夏六月，以禘禮祀周公於大廟，牲用白牡；尊用犧象山罍；郁尊用黃目；灌用玉瓚大圭；薦用玉豆雕篹；爵用玉琖，仍雕，加以璧散璧角；俎用梡嶡；升歌《清廟》，下管《象》；朱干玉戚，冕而舞《大武》；皮弁素積，裼而舞《大夏》。</p><p><strong>所出</strong>：《禮記 · 明堂位》 — https://zh.wikisource.org/wiki/禮記/明堂位</p></article></main></div></div>
