    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 賢人歸富</nav></header><main><article><h1>賢人歸富</h1><p>賢人深謀於廊廟，論議朝廷，守信死節隱居巖穴，皆歸於富厚。</p><p>由此觀之，賢人深謀於廊廟，論議朝廷，守信死節隱居巖穴之士設為名高者安歸乎？歸於富厚也。是以廉吏久，久更富，廉賈歸富。富者，人之情性，所不學而俱欲者也。</p><p><strong>所出</strong>：《史記 · 卷129》 — https://zh.wikisource.org/wiki/史記/卷129</p></article></main></div></div>
