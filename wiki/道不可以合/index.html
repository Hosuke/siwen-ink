    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 道不可以合</nav></header><main><article><h1>道不可以合</h1><p>道超言象，不可析，不可合。</p><p>古之善[[揲蓍灼龜]]者，能於今中示古，古中示今，高中示下，下中示高，小中示大，大中示小，一中示多，多中示一，人中示物，物中示人，我中示彼，彼中示我。</p><p>是道也，其來無今，其往無古，其高無蓋，其低無載，其大無外，其小無內，其外無物，其內無人，其近無我，其遠無彼。不可析，不可合，不可喻，不可思。惟其渾淪，所以為道。</p><p><strong>所出</strong>：《關尹子 · 8》 — https://zh.wikisource.org/wiki/關尹子/8</p></article></main></div></div>
