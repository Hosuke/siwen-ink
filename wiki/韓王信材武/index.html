    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 韓王信材武</nav></header><main><article><h1>韓王信材武</h1><p>高祖以信材武，徙王太原北近匈努之地。</p><p>明年春，上以韓信材武，所王北近鞏、洛，南迫宛、葉，東有淮陽，皆天下勁兵處，乃詔徙韓王信王太原以北，備御胡，都晉陽。信上書曰：「國被邊，匈奴數入，晉陽去塞遠，請治馬邑。」上許之，信乃徙治馬邑。秋，匈奴冒頓大圍信，信數使使胡求和解。漢發兵救之，疑信數閒使，有二心，使人責讓信。信恐誅，因與匈奴約共攻漢，反，以馬邑降胡，擊太原。</p><p><strong>所出</strong>：《史記 · 卷093》 — https://zh.wikisource.org/wiki/史記/卷093</p></article></main></div></div>
