    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 知者慮義者行仁者守</nav></header><main><article><h1>知者慮義者行仁者守</h1><p>論為會之三備：智者慮，義者行，仁者守。</p><p>桓公薨于齊，魯大夫會葬。穀梁子述其義云：「知者慮，義者行，仁者守。有此三者備，然後可以會矣。」</p><p>「知者慮」者，預燭幾微，審得失也；「義者行」者，果斷而有為，不失其宜也；「仁者守」者，懷保小民，不搖其本也。三者缺一，則不可以主盟會而臨邦國。</p><p>觀桓公之會濼也，既有知之慮、義之行、仁之守，故能與齊侯抗禮而不失其度。其卒也，諸侯致送，葬而加謚，亦此義之驗也。</p><p><strong>所出</strong>：《春秋穀梁傳 · 桓公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/桓公</p></article></main></div></div>
