    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 周易小象</nav></header><main><article><h1>周易小象</h1><p>釋六爻象辭之傳也。</p><p>《小象》者，《易傳》第七篇，解《周易》六十四卦三百八十四爻之象辭者也。象者，像也。像其卦象爻位，以明人事吉凶。其辭簡而義深，多以一字至數語括一爻之旨。如「陽在下也」「德施普也」「反復道也」「盈不可久也」，皆觀象玩辭之要樞。孔子作《彖傳》釋卦辭，作《象傳》釋爻辭，而《小象》專釋爻義，與《大象》別流。學者讀《易》，當細心玩味《小象》，以求聖人設辭之微意焉。</p><p><strong>所出</strong>：《周易 · 小象》 — https://zh.wikisource.org/wiki/周易/小象</p></article></main></div></div>
