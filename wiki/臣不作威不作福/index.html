    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 臣不作威不作福</nav></header><main><article><h1>臣不作威不作福</h1><p>廣陵王策引《書》以誡，言臣下不作威福，則無後羞。</p><p>《書》云：「臣不作威，不作福，靡有後羞。」</p><p>廣陵王策引之以誡曰：「悉爾心，戰戰兢兢，乃惠乃順，毋侗好軼，毋邇宵人，維法維則。」</p><p><strong>所出</strong>：《史記 · 卷060》 — https://zh.wikisource.org/wiki/史記/卷060</p></article></main></div></div>
