    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 強臺之樂</nav></header><main><article><h1>強臺之樂</h1><p>聖王薄德，不當大樂</p><p>令尹子佩請飲莊王，莊王辭之，曰：「吾聞子具於強臺。強臺者，南望料山，左江右淮，其樂忘死。若吾薄德之人，不可以當此樂也。」此[[不見可欲]]之義。</p><p><strong>所出</strong>：《淮南子 · 道應訓》 — https://zh.wikisource.org/wiki/淮南子/道應訓</p></article></main></div></div>
