    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 刑范正，金錫美</nav></header><main><article><h1>刑范正，金錫美</h1><p>治國如冶劍，必有砥厲之功；國家之砥厲，在禮義節奏。</p><p>刑范正，金錫美，工冶巧，火齊得，剖刑而莫邪已。然而不剝脫，不砥厲，則不可以斷繩。剝脫之，砥厲之，則劙盤盂，刎牛馬，忽然耳。</p><p>彼國者，亦彊國之剖刑已。然而不教誨，不調一，則入不可以守，出不可以戰。教誨之，調一之，則兵勁城固，敵國不敢嬰也。彼國者亦有砥厲，禮義節奏是也。</p><p>故人之命在天，國之命在禮。人君者，隆禮尊賢而王，重法愛民而霸，好利多詐而危，權謀傾覆幽險而亡。</p><p><strong>所出</strong>：《荀子 · 彊國篇》 — https://zh.wikisource.org/wiki/荀子/彊國篇</p></article></main></div></div>
