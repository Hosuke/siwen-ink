    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 馬匹亡</nav></header><main><article><h1>馬匹亡</h1><p>絕其匹類，專心上應，無咎之道。</p><p>六四爻辭「月几望，馬匹亡，无咎」。月幾望者，柔德將盛也。馬匹亡者，絕其類以從上也。象傳云「絕類上也」，言專心上應，不累於私，故无咎。</p><p><strong>所出</strong>：《周易 · 中孚》 — https://zh.wikisource.org/wiki/周易/中孚</p></article></main></div></div>
