    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 權者聖人之所獨見</nav></header><main><article><h1>權者聖人之所獨見</h1><p>聖人知權，屈伸應變，不膠於常；直躬之信，尾生之信，非聖人之所貴。</p><p>唯聖人為能知權。言而必信，期而必當，天下之高行也。直躬其父攘羊而子證之，尾生與婦人期而死之。直而證父，信而溺死，雖有直信，孰能貴之！</p><p>夫君臣之接，屈膝卑拜，以相尊禮也；至其迫於患也，則舉足躋其體，天下莫能非也。是故忠之所在，禮不足以難之也。故孔子曰：「可以共學矣，而未可以適道也。可與適道，未可以立也。可以立，未可與權。」權者，聖人之所獨見也。</p><p><strong>所出</strong>：《淮南子 · 氾論訓》 — https://zh.wikisource.org/wiki/淮南子/氾論訓</p></article></main></div></div>
