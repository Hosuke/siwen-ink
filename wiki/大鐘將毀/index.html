    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大鐘將毀</nav></header><main><article><h1>大鐘將毀</h1><p>景公鑄大鐘，晏子、仲尼、柏常騫皆知將毀，而論毀之因各異。</p><p>景公為大鐘，將縣之，晏子、仲尼、柏常騫三人朝，俱曰：「鐘將毀。」沖之，果毀。公召三子者而問之，晏子對曰：「鐘大，不祀先君而以燕，非禮，是以曰鐘將毀。」仲尼曰：「鐘大而縣下，沖之，其氣下回而上薄，是以曰鐘將毀。」柏常騫曰：「今庚申，雷日也，音莫勝於雷，是以曰鐘將毀也。」</p><p><strong>所出</strong>：《晏子春秋 · 卷八》 — https://zh.wikisource.org/wiki/晏子春秋/卷八</p></article></main></div></div>
