    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 啟明蕭刅</nav></header><main><article><h1>啟明蕭刅</h1><p>白素右元君之內諱，修誦此章當存呼以鎮下關。</p><p>啟明蕭刅，白素右元君之內諱也。修誦大洞第二十四章者，存思其名，誦其呪，以為通神固魄之術。其名姓秘而不泄，故稱內諱。持誦之時，當書符佩身，存呼是名，則下關之境有賴以清，祖殃由茲以散矣。</p><p><strong>所出</strong>：《上清大洞真經 · 24章》 — https://zh.wikisource.org/wiki/上清大洞真經/24章</p></article></main></div></div>
