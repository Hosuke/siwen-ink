    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 朔月奠</nav></header><main><article><h1>朔月奠</h1><p>朔月奠者，月朔之奠也。</p><p>朔月奠，士虞之奠也。奠用特豚。俎實肩、臂、膈、肫、胳。祝受巾，巾俎，如闔牖。徹俎，先取醴酒，其餘取先設者。敦啟会，却諸其南。祝與執豆者巾，乃出。主人要節而踊，皆如朝夕哭之儀。月半不殷奠。有荐新，如朔奠。徹朔奠，先取醴酒，其餘取先設者。敦啟会，面足。序出，如入。其設於外，如於室。</p><p><strong>所出</strong>：《儀禮 · 士喪禮》 — https://zh.wikisource.org/wiki/儀禮/士喪禮</p></article></main></div></div>
