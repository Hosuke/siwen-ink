    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 暴政如風</nav></header><main><article><h1>暴政如風</h1><p>暴政虐民，譬如北風肅殺，國將傾而民必去。</p><p>暴政之虐國，無異北風之害物。北方之風，其性肅殺，霜雪隨之，萬物凋零，生物絕跡。國家遭逢威虐之政亦然：刑罰無度，賦斂繁興，百姓無所恃庇，莫不相率而去，國亦隨之覆亡。詩人睹北風之暴，乃知虐政之必至於傾也。</p><p><strong>所出</strong>：《詩經 · 北風》 — https://zh.wikisource.org/wiki/詩經/北風</p></article></main></div></div>
