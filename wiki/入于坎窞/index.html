    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 入于坎窞</nav></header><main><article><h1>入于坎窞</h1><p>陷入深窪之險，比喻初與六三居險極而不能出。</p><p>初六曰「習坎，入于坎窞，凶」。窞者，坎之深者也。初六陰柔居坎下，重險之上，無援無應，是自投於深窪之中，故凶。</p><p>六三亦曰「入于坎窞，勿用」。六三以陰居陽，不中不正，來往皆坎，無由出險，故戒之以勿用。</p><p><strong>所出</strong>：《周易 · 坎》 — https://zh.wikisource.org/wiki/周易/坎</p></article></main></div></div>
