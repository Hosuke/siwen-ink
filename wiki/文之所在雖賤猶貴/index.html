    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 文之所在雖賤猶貴</nav></header><main><article><h1>文之所在雖賤猶貴</h1><p>文章之所在，雖賤猶貴，犬羊之鞟不得比。</p><p>抱朴子暢其旨曰：「且夫上天之所以垂象，唐虞之所以為稱，大人虎炳，君子豹蔚，昌旦定聖謚於一字，仲尼從周之郁，莫非文也。八卦生鷹隼之所被，六甲出靈龜之所負，文之所在，雖賤猶貴，犬羊之鞟，未得比焉。」</p><p><strong>所出</strong>：《抱朴子 · 卷32》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷32</p></article></main></div></div>
