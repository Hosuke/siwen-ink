    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 候邪不審</nav></header><main><article><h1>候邪不審</h1><p>候邪不審則真氣已脫，邪復至而病益蓄；早遏其路，乃刺法之要。</p><p>此說出[[離合真邪論]]，明候邪早遏之義。</p><p>岐伯曰：「候邪不審，大氣已過，寫之則真氣脫，脫則不復，邪氣復至，而病益蓄。」</p><p>又云：「夫邪去絡入於經也，舍於血脈之中，其寒溫未相得，如涌波之起也，時來時去，故不常在。故曰：方其來也，必按而止之，止而取之，無逢其衝而寫之。」</p><p>真氣太虛，來不可逢，往不可追，皆示人候邪之要，在乎審時度勢，早遏其路，不可失之毫釐也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第八卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第八卷</p></article></main></div></div>
