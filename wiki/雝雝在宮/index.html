    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 雝雝在宮</nav></header><main><article><h1>雝雝在宮</h1><p>宮中和悅，廟中肅敬，言文王動靜語默皆有常度，無時不然。</p><p>《思齊》三章云「雝雝在宮，肅肅在廟」。雝雝，和悅之貌；肅肅，恭敬之貌。宮者燕私之處，廟者祭祀之所。文王於燕私之和悅與祭祀之恭敬，皆得其宜。</p><p>《中庸》雲「君子之所不可及者，其惟人之所不見乎」，此之謂也。</p><p><strong>所出</strong>：《詩經 · 思齊》 — https://zh.wikisource.org/wiki/詩經/思齊</p></article></main></div></div>
