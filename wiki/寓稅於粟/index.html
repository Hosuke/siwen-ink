    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 寓稅於粟</nav></header><main><article><h1>寓稅於粟</h1><p>穀有常價，寓稅於其中，不顯而民自服。</p><p>故天子籍於幣，諸侯籍於食。中歲之穀，糶石十錢。大男食四石，月有四十之籍；大女食三石，月有三十之籍。吾子食二石，月有二十之籍。</p><p>歲凶穀貴，糴石二十錢，則大男有八十之籍，大女有六十之籍，吾子有四十之籍。是人君非發號令收穡而戶籍也，彼人君守其本委謹，而男女諸君吾子無不服籍者也。</p><p><strong>所出</strong>：《管子 · 第73篇國蓄》 — https://zh.wikisource.org/wiki/管子/第73篇國蓄</p></article></main></div></div>
