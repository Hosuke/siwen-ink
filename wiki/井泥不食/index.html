    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 井泥不食</nav></header><main><article><h1>井泥不食</h1><p>井底淤泥則水濁不可食，人德不修則无以感人。</p><p>初六之辭曰：「井泥不食，舊井无禽。」泥者在下，泉水不上，則井底淤塞，水味變惡，不可食也。此象人之德不修，則無以感人。舊井無禽者，井久廢不用，水竭泥乾，禽亦不飲。言人而不修其德，如舊井之無水，無以利物，則人禽皆離之。君子觀此，當自省焉，修德以潔其身，如[[井甃]]之防泥，如[[井冽]]之清寒。</p><p><strong>所出</strong>：《周易 · 井》 — https://zh.wikisource.org/wiki/周易/井</p></article></main></div></div>
