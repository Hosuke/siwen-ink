    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 緣督以為經</nav></header><main><article><h1>緣督以為經</h1><p>順中道而行以為常法，乃養生之綱領也</p><p>「為善无近名，為惡无近刑，緣督以為經，可以保身，可以全生，可以養親，可以盡年。」</p><p>夫督者，中也、虛也。善而至於近名，則為名累；惡而至於近刑，則為法加。唯緣中道而行，不偏於善，不溺於惡，順自然之理以為常法，乃可全生而不傷。緣督者，不逆其理、不拂其性，以虛待物，以順應天，此養生之經也。</p><p><strong>所出</strong>：《莊子 · 養生主》 — https://zh.wikisource.org/wiki/莊子/養生主</p></article></main></div></div>
