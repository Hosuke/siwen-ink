    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 過載者沈其舟</nav></header><main><article><h1>過載者沈其舟</h1><p>舟載過重則沈，人知進退而不失其正者昌，貪得無厭者亡。</p><p>過載者沈其舟，欲勝者殺其生。物忌太盛，過則反焉。[[藏多者亡厚，好謙者忌盈]]，理之常也。造舟以渡，負荷有其限量；為人處世，嗜欲有其節制。知足不辱，知止不殆，此聖人之所貴也。</p><p><strong>所出</strong>：《抱朴子 · 卷36》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷36</p></article></main></div></div>
