    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 昏棄厥肆祀</nav></header><main><article><h1>昏棄厥肆祀</h1><p>怠慢祭祀，荒廢祖德，亡國之兆。</p><p>「昏棄厥肆祀，弗答。」言獨夫受怠慢先祖之祀，不敬鬼神，不答祭祀之典。祭祀者[[祀典]]之本，敬祖所以合族，[[昏棄厥肆祀]]則[[惟婦言是用]]之荒淫可知，故[[商罪貫盈]]而[[湯武誅暴]]之師起。</p><p><strong>所出</strong>：《尚書 · 牧誓》 — https://zh.wikisource.org/wiki/尚書/牧誓</p></article></main></div></div>
