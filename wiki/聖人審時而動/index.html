    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖人審時而動</nav></header><main><article><h1>聖人審時而動</h1><p>聖人能和陰陽、應時變，因資而立功，終身行之無所困。</p><p>是故聖人者，能陰能陽，能弱能彊，隨時而動靜，因資而立功，物動而知其反，事萌而察其變，化則為之象，運則為之應，是以終身行而無所困。</p><p><strong>所出</strong>：《淮南子 · 氾論訓》 — https://zh.wikisource.org/wiki/淮南子/氾論訓</p></article></main></div></div>
