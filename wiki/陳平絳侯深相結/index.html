    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 陳平絳侯深相結</nav></header><main><article><h1>陳平絳侯深相結</h1><p>陸賈獻策，陳平以五百金交絳侯，呂氏之謀由此益衰。</p><p>陳平患諸呂，用陸生計，乃以五百金為絳侯壽，厚具樂飲；太尉亦報如之。此兩人深相結，則呂氏謀益衰。陳平乃以奴婢百人，車馬五十乘，錢五百萬，遺陸生為飲食費。陸生以此游漢廷公卿閒，名聲藉甚。</p><p><strong>所出</strong>：《史記 · 卷097》 — https://zh.wikisource.org/wiki/史記/卷097</p></article></main></div></div>
