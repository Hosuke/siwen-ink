    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 儒分為八　墨離為三</nav></header><main><article><h1>儒分為八　墨離為三</h1><p>孔墨之後，徒裔分流，各執一是，莫衷一是。</p><p>孔子既沒，儒分為八：子張之儒、子思之儒、顔氏之儒、孟氏之儒、漆雕氏之儒、仲良氏之儒、孫氏之儒、樂正氏之儒。墨子既沒，墨離為三：相里氏之墨、相夫氏之墨、鄧陵氏之墨。取舍相反不同，而皆自謂真孔、真墨。孔、墨不可復生，將誰使定世之學乎？</p><p><strong>所出</strong>：《韓非子 · 顯學》 — https://zh.wikisource.org/wiki/韓非子/顯學</p></article></main></div></div>
