    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 自勝者強</nav></header><main><article><h1>自勝者強</h1><p>克己之私，方為真強。</p><p>勝人者有力，力可以敵萬人。自勝者強，制其欲、遏其私，勇於內克之謂也。夫外勝出於力，內勝出於志。志不勝欲，雖有匹夫之勇，無以持之久。故強不在於陵人，而在於勝己。能制心制行者，是謂至強。</p><p><strong>所出</strong>：《老子河上公章句 · 辯德》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
