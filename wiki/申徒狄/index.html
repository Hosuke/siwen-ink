    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 申徒狄</nav></header><main><article><h1>申徒狄</h1><p>懷石投河之行難者，君子以其非禮義之中而不貴。</p><p>申徒狄，懷石投河，以求必死之行，世人以為難能。然君子不貴之者，以其不合禮義之中道也。</p><p><strong>所出</strong>：《荀子 · 不苟篇》 — https://zh.wikisource.org/wiki/荀子/不苟篇</p></article></main></div></div>
