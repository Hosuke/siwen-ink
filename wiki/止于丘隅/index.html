    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 止于丘隅</nav></header><main><article><h1>止于丘隅</h1><p>黃鳥止於丘隅，詩以喻人當知所止。</p><p>《緜蠻》首章云「緜蠻黃鳥，止于丘隅」。朱熹《集傳》曰：「丘隅，丘之一隅也。」鳥有所止，人亦當知止。君子之於道義，亦若是焉。止者，非徒止息之謂，乃安於所當然之位，而不妄動也。《大學》云「止於至善」，亦此意也。</p><p><strong>所出</strong>：《詩經 · 緜蠻》 — https://zh.wikisource.org/wiki/詩經/緜蠻</p></article></main></div></div>
