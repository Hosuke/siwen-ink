    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 耳目者日月，血氣者風雨</nav></header><main><article><h1>耳目者日月，血氣者風雨</h1><p>耳目象日月，血氣象風雨，故五臟與天地相參，心為之主。</p><p>故膽為雲，肺為氣，肝為風，腎為雨，脾為雷，以與天地相參也，而心為之主。是故耳目者，日月也；血氣者，風雨也。日中有踆烏，而月中有蟾蜍。日月失其行，薄蝕無光；風雨非其時，毀折生災；五星失其行，州國受殃。</p><p><strong>所出</strong>：《淮南子 · 精神訓》 — https://zh.wikisource.org/wiki/淮南子/精神訓</p></article></main></div></div>
