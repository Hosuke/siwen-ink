    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 善名命善</nav></header><main><article><h1>善名命善</h1><p>名以善惡分，聖賢頑嚚各有定命</p><p>善名命善，惡名命惡，故善有善名，惡有惡名。聖賢仁智，命善者也；頑嚚凶愚，命惡者也。今即聖賢仁智之名，以求聖賢仁智之實，未之或盡也；即頑嚚凶愚之名，以求頑嚚凶愚之實，亦未或盡也。使善惡盡然有分，雖未能盡物之實，猶不患其差也。</p><p><strong>所出</strong>：《尹文子 · 大道上》 — https://zh.wikisource.org/wiki/尹文子/大道上</p></article></main></div></div>
