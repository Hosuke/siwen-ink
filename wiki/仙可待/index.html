    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 仙可待</nav></header><main><article><h1>仙可待</h1><p>天下聞真道，翕然往輔有德之君。</p><p>[[守一明法]]者，活人法也。[[治百萬人仙可待]]：言天下聞之，真道翕然悉出，往輔佐有德之君，故言[[仙可待]]也。</p><p><strong>所出</strong>：《太平經 · 07》 — https://zh.wikisource.org/wiki/太平經/07</p></article></main></div></div>
