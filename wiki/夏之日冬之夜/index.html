    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 夏之日冬之夜</nav></header><main><article><h1>夏之日冬之夜</h1><p>日夜迭更，相思無已。</p><p>夏之日，冬之夜。百歲之後，歸于其居。</p><p>冬之夜，夏之日。百歲之後，歸于其室。</p><p>四章言夏日冬夜之漫漫，五章言冬夜夏日之漫漫，互文見義，總言歲月悠長、孤枕難度。日夜更迭，無時能已，唯待百歲之後，方得與亡者同歸居室。此詩之大旨也。</p><p><strong>所出</strong>：《詩經 · 葛生》 — https://zh.wikisource.org/wiki/詩經/葛生</p></article></main></div></div>
