    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 六事之人</nav></header><main><article><h1>六事之人</h1><p>軍中六卿，各主一事。</p><p>禹誓稱聽者為「六事之人」。《司馬法》曰：「凡制軍，軍有卿，卿有左右，皆有什己以衛其上。」六事者，或即六卿之屬，分掌軍政者也。禹大戰于三苗，命左右六人下聽誓于中軍，是將有事于戎機，必先戒飭六官也。</p><p><strong>所出</strong>：《尚書 · 禹誓》 — https://zh.wikisource.org/wiki/尚書/禹誓</p></article></main></div></div>
