    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 使君之年長於胡</nav></header><main><article><h1>使君之年長於胡</h1><p>麥丘封人三祝景公，末祝「使君無得罪於民」，晏子稱善。</p><p>景公遊麥丘，問封人年幾何。封人八十五矣，，祝景公三事：一使君之年長於胡，二使君之嗣皆若己年，三使君無得罪於民。景公以前二祝為善，第三祝則曰：「安有君得罪於民者乎？」晏子諫曰：「君過矣，彼疏者有罪，戚者治之；賤者有罪，貴者治之；君得罪於民，誰將治之？敢問桀紂，君誅乎？民誅乎？」景公悟而善之。晏子之義，以為君不當得罪於民，而治民者當以法，不以貴賤異也。</p><p><strong>所出</strong>：《晏子春秋 · 卷一》 — https://zh.wikisource.org/wiki/晏子春秋/卷一</p></article></main></div></div>
