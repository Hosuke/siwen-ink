    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 端愨順弟</nav></header><main><article><h1>端愨順弟</h1><p>端愨遜敏者為善少，加勉可為君子。</p><p>端愨順弟，則可謂善少者矣；加好學遜敏焉，則有鈞無上，可以爲君子者矣。偷儒憚事，無廉恥而嗜乎飲食，則可謂惡少者矣；加愓悍而不順，險賊而不弟焉，則可謂不詳少者矣，雖陷刑戮可也。老老而壯者歸焉，不窮窮而通者積焉，行乎冥冥而施乎無報，而賢不肖一焉。人有此三行，雖有大過，天其不遂乎。</p><p><strong>所出</strong>：《荀子 · 修身篇》 — https://zh.wikisource.org/wiki/荀子/修身篇</p></article></main></div></div>
