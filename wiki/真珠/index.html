    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 真珠</nav></header><main><article><h1>真珠</h1><p>真珠徑一寸以上服之可以長久，絕穀則不死而長生。</p><p>又真珠徑一寸以上可服，服之可以長久，酪漿漬之皆化如水銀，亦可以浮石水蜂窠化，包彤蛇黃合之，可引長三四尺，丸服之，絕穀服之，則不死而長生也。</p><p><strong>所出</strong>：《抱朴子 · 卷11》 — https://zh.wikisource.org/wiki/抱朴子/卷11</p></article></main></div></div>
