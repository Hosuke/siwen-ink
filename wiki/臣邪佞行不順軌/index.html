    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 臣邪佞行不順軌</nav></header><main><article><h1>臣邪佞行不順軌</h1><p>臣行邪佞，不循軌轍，則詰責不行，政教荒怠。</p><p>或臣邪佞，行不順軌。</p><p>[[詰責台輔]]不行，則[[文昌統錄]]之柄弛；[[臣邪佞行不順軌]]，則[[明堂布政]]之令塞。[[存亡之緒]]之乖，上由君亢，下由臣佞。[[執法刺譏]]之官，於此而不設；[[五緯錯順]]之天象，於此而不應矣。</p><p><strong>所出</strong>：《周易參同契 · 05章》 — https://zh.wikisource.org/wiki/周易參同契/05章</p></article></main></div></div>
