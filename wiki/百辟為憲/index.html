    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 百辟為憲</nav></header><main><article><h1>百辟為憲</h1><p>君子為諸侯所法。</p><p>[[百辟為憲]]出自《桑扈》，言君子之德行，可為百辟諸侯之法則。</p><p>詩云：「之屏之翰，百辟為憲。」辟，君也。言君子為國之屏障、棟樑，諸侯皆取法焉。</p><p><strong>所出</strong>：《詩經 · 桑扈》 — https://zh.wikisource.org/wiki/詩經/桑扈</p></article></main></div></div>
