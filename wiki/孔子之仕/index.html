    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 孔子之仕</nav></header><main><article><h1>孔子之仕</h1><p>孟子記孔子出處之節，以見聖人行道有時，去魯遲遲，仕魯獵較，皆有其義。</p><p>孟子述[[孔子]]之去齊，接淅而行；去魯，遲遲吾行。此去父母國之道也。孔子之仕也，有見行可之仕，有際可之仕，有公養之仕。於[[季桓子]]，見行可之仕也；於[[衛靈公]]，際可之仕也；於衛孝公，公養之仕也。孔子先簿正祭器，不以四方之食供簿正，乃所以行其道也。是以未嘗有[[終三年淹]]者，見不可則去，道不行則行也。</p><p><strong>所出</strong>：《孟子 · 萬章下》 — https://zh.wikisource.org/wiki/孟子/萬章下</p></article></main></div></div>
