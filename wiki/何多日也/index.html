    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 何多日也</nav></header><main><article><h1>何多日也</h1><p>責衞臣遲久不來救</p><p>「何多日也」者，《詩·旄丘》首章之辭也。</p><p>《旄丘》首章：「旄丘之葛兮，何誕之節兮，叔兮伯兮，何多日也。」言葛生旄丘，其蔓延之節日延日廣，而己之寓居於衞亦已日久。叔伯之臣何為遲遲不來拯救乎？</p><p>「多日」者，責其延誤也。黎人流離而望衞之救，日復一日，而救兵不至，故言之反覆而不已。</p><p><strong>所出</strong>：《詩經 · 旄丘》 — https://zh.wikisource.org/wiki/詩經/旄丘</p></article></main></div></div>
