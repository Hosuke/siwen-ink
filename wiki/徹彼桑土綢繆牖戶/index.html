    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 徹彼桑土綢繆牖戶</nav></header><main><article><h1>徹彼桑土綢繆牖戶</h1><p>綢繆牖戶以備風雨，喻防患未然、預為戒備。</p><p>「迨天之未陰雨，徹彼桑土，綢繆牖戶」，出《詩經·鴟鴞》第二章。言鳥於天未陰雨之時，先取桑根之土，纏綿其牖戶以備風雨。此以鳥之遠慮，比己之防患於未然也。</p><p>後世以「綢繆」比喻事前防備、「未雨綢繆」之義遂為常用成語，皆本此詩。</p><p><strong>所出</strong>：《詩經 · 鴟鴞》 — https://zh.wikisource.org/wiki/詩經/鴟鴞</p></article></main></div></div>
