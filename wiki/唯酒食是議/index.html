    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 唯酒食是議</nav></header><main><article><h1>唯酒食是議</h1><p>女子之職，議在酒食。</p><p>[[唯酒食是議]]者，言女子所當議者，唯酒食之事而已。此見古禮嚴男女之別，女子主中饋，掌酒食祭祀之務，其餘是非曲直，不預聞也。此詩言女子之職守，以別男女之分工。</p><p><strong>所出</strong>：《詩經 · 斯干》 — https://zh.wikisource.org/wiki/詩經/斯干</p></article></main></div></div>
