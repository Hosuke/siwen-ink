    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 芃芃棫樸</nav></header><main><article><h1>芃芃棫樸</h1><p>草木茂盛，比君子之德盛。</p><p>《詩經·大雅·棫樸》首章云：「芃芃棫樸，薪之槱之。」毛傳：「興也。芃芃，木盛貌。」鄭箋：「杞也，棫也，朴也。」此以山木之芃芃然盛多，起興君子之德盛、人才之众多也。</p><p><strong>所出</strong>：《詩經 · 棫樸》 — https://zh.wikisource.org/wiki/詩經/棫樸</p></article></main></div></div>
