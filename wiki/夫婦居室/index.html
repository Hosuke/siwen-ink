    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 夫婦居室</nav></header><main><article><h1>夫婦居室</h1><p>夫婦之禮，唯及七十同藏無間</p><p>禮始於謹夫婦，為宮室，辨外內。</p><p>故妾雖老，年未滿五十，必與五日之御。將御者，齊，漱浣，慎衣服，櫛繋笄，總角，拂髦，衿纓綦屨。雖婢妾，衣服飲食必後長者。妻不在，妾御莫敢當夕。</p><p>夫婦之禮，唯及七十，同藏無間。故妾雖老，年未滿五十，必與五日之御。</p><p><strong>所出</strong>：《禮記 · 內則》 — https://zh.wikisource.org/wiki/禮記/內則</p></article></main></div></div>
