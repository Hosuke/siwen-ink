    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以樂卻災</nav></header><main><article><h1>以樂卻災</h1><p>樂能合陰陽通神明，致太平之要道</p><p>以樂治身守形、順念致思卻災。夫樂於道何為者也？樂乃可和合陰陽，凡事默作也，使人得道本也。故元氣樂，即生大昌；自然樂，則物強；天樂，即三光明；地樂，則成有常；五行樂，則不相傷；四時樂，則所生王；王者樂，則天下無病；行人樂，則不相害傷；萬物樂，則守其常；人樂，則不愁易心腸；鬼神樂，即利帝王。故樂者，天地之善氣精為之，以致神明。故靜以生光明，光明所以候神也。能通神明，有以道為鄰，且得長生久存。</p><p><strong>所出</strong>：《太平經 · 02》 — https://zh.wikisource.org/wiki/太平經/02</p></article></main></div></div>
