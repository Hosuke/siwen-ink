    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 其政察察</nav></header><main><article><h1>其政察察</h1><p>政令繁苛，民情乖隔。</p><p>察察者，[[其政悶悶|悶悶]]之反。言政令峻急，[[其民缺缺|民日以缺]]。決辭於口，聽決於耳，[[知下|察察]]之政，非聖人所以化民也。
<strong>所出</strong>：《老子河上公章句 · 順化》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
