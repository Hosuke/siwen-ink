    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 西南</nav></header><main><article><h1>西南</h1><p>坤方月沒復蘇之處，真陽發動之鄉，丹法取象為藥生之地</p><p>西南者，坤方也。為月晦極復蘇、陰極生陽之地，在人為靜極初動之時。這個靜極之動，即是大藥發現之時。動非外來客氣情欲之動，亦非內裏心意念頭之動，乃天心良知之動、道心真知之動。動從靜生，如川之有源，故取象為藥生川源之處。</p><p><strong>所出</strong>：《悟真直指 · 卷一》 — https://zh.wikisource.org/wiki/悟真直指/卷一</p></article></main></div></div>
