    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 陳涉起兵</nav></header><main><article><h1>陳涉起兵</h1><p>陳涉首難，天下從風，秦祚遂傾。</p><p>秦二世元年七月，楚隱王陳涉起兵入秦，天下響應。涉將葛嬰徇九江，立襄彊為楚王。九月，楚兵至戲。周文兵至戲而敗。葛嬰聞涉已王，即殺彊。十二月，陳涉死。楚兵雖敗，而秦之滅亡實胚胎於此。天下苦秦久矣，一夫怒吼，豪傑並起，秦是以亡。</p><p><strong>所出</strong>：《史記 · 卷016》 — https://zh.wikisource.org/wiki/史記/卷016</p></article></main></div></div>
