    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 玉泉</nav></header><main><article><h1>玉泉</h1><p>漱液吞之琢齒，煉精長生</p><p>劉京別傳其法：「治身之要，當朝朝服[[玉泉]]，使人丁壯有顏色，去三蟲而堅齒。[[玉泉]]者，口中液也。朝起，漱液滿口，乃吞之，琢齒二七過，如此者三止，名曰煉精，使人長生。</p><p><strong>所出</strong>：《神仙傳 · 卷七》 — https://zh.wikisource.org/wiki/神仙傳/卷七</p></article></main></div></div>
