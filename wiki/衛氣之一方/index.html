    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 衛氣之一方</nav></header><main><article><h1>衛氣之一方</h1><p>善養文氣者，猶善衛護人身之正氣。</p><p>劉勰論為文之道，以為使刃發如新、腠理無滯者，雖非胎息之邁術，斯亦衛氣之一方。蓋人之氣血貴流通，文之思理亦貴通暢。胎息乃道家長生之術，其效遠矣；而為文養氣之法，亦如醫家衛護正氣，使邪不得侵。是以文士當知所調攝，使神清氣朗，則文思自然充沛，不至枯竭。此固非小術也，乃為文者所當知之要道。</p><p><strong>所出</strong>：《文心雕龍 · 養氣》 — https://zh.wikisource.org/wiki/文心雕龍/養氣</p></article></main></div></div>
