    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無惡無斁</nav></header><main><article><h1>無惡無斁</h1><p>賢者在位，化及四方，無有怨惡，亦無厭斁。</p><p>「在彼無惡，在此無斁」，言賢者之於其國，則國人化之，無有怨惡；來至於此，則此土之人亦欣然慕悅，無有厭斁也。蓋賢德之人，上下皆化，無往不宜焉。</p><p><strong>所出</strong>：《詩經 · 振鷺》 — https://zh.wikisource.org/wiki/詩經/振鷺</p></article></main></div></div>
