    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 攻乎異端</nav></header><main><article><h1>攻乎異端</h1><p>攻治異端邪說之書，害莫大焉。</p><p>《論語》載孔子之言曰：「攻乎異端，斯害也已。」言學者若攻治異端之說，是自取其害也。異端者，非聖人之道而別爲一端者也。聖人之道，中正和平，不偏不倚。舍此而攻彼，適足爲害也已。</p><p><strong>所出</strong>：《論語 · 爲政第二》 — https://zh.wikisource.org/wiki/論語/爲政第二</p></article></main></div></div>
