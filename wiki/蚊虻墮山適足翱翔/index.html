    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蚊虻墮山，適足翱翔</nav></header><main><article><h1>蚊虻墮山，適足翱翔</h1><p>大物不可失所，小物各適其宜，威福加於人主者尤當戒慎。</p><p>抱樸子曰：「蚊虻墮山，適足翱翔；兕虎之墜，碎而為齏。」此言大物，不可失所也。蚊虻本以飛翔為事，居於山林則安，設或墮地，亦復能翔；虎兕以搏噬為用，據於深山大澤則威，一朝失所，粉身碎骨，無所用之。是以高爵厚祿之於人，恩澤賞譽之加於臣，亦若是焉。當其盛也，崇軒廣廈，耳目娛心，似無不可；及其衰也，冰山易坼，炎火易灰，悔之無及。位高者可不戒諸！</p><p><strong>所出</strong>：《抱朴子 · 卷49》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷49</p></article></main></div></div>
