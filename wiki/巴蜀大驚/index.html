    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 巴蜀民大驚恐</nav></header><main><article><h1>巴蜀民大驚恐</h1><p>唐蒙略通夜郎西僰，發巴蜀吏卒郡人，興法誅渠帥，巴蜀之民大驚恐。</p><p>會唐蒙使略通夜郎西僰中，發巴蜀吏卒千人，郡又多為發轉漕萬餘人，用興法誅其渠帥，巴蜀民大驚恐。上聞之，乃使相如責唐蒙，因喻告巴蜀民以非上意。</p><p><strong>所出</strong>：《史記 · 卷117》 — https://zh.wikisource.org/wiki/史記/卷117</p></article></main></div></div>
