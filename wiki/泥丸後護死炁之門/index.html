    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 泥丸後護死炁之門</nav></header><main><article><h1>泥丸後護死炁之門</h1><p>太一尊神守護泥丸以隔死炁之門。</p><p>泥丸後護死炁之門者，上清存思之要義也。太一尊神務猂收常守兆玉枕之下，彌綸泥丸之後戶，以固護為職，使死炁不得侵陵，而生真之炁自然入於泥丸，凝而為丹。若是則七祖受玄更生，兆身列於玉皇，華履重光矣。</p><p><strong>所出</strong>：《上清大洞真經 · 2章》 — https://zh.wikisource.org/wiki/上清大洞真經/2章</p></article></main></div></div>
