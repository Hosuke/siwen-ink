    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 首尾相援</nav></header><main><article><h1>首尾相援</h1><p>首尾相應而相援，附會之體無以加焉。</p><p>若首唱榮華而媵句憔悴，則遺勢鬱湮，餘風不暢。此《周易》所謂臋無膚，其行次且也。惟首尾相援，則附會之體，固亦無以加於此矣。</p><p><strong>所出</strong>：《文心雕龍 · 附會》 — https://zh.wikisource.org/wiki/文心雕龍/附會</p></article></main></div></div>
