    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 茹藘</nav></header><main><article><h1>茹藘</h1><p>草名，可以染絳，以興所思之人。</p><p>茹藘在坂。</p><p>茹藘，今之紡織娘，一名茅蒐，可染絳色。詩人行至東門之墠，見坂上之茹藘，因以起興。</p><p>草在坂上，望去分明的歷；所思之人，居處非遙，而情則阻隔。詩人觸物生感，故借之以興其思慕之意。此興也，非徒詠物，乃寓情於景，以草木之聯類，興人情之縈懷也。</p><p><strong>所出</strong>：《詩經 · 東門之墠》 — https://zh.wikisource.org/wiki/詩經/東門之墠</p></article></main></div></div>
