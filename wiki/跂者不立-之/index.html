    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 跂者不立-之</nav></header><main><article><h1>跂者不立-之</h1><p></p><p>河上公注「跂者不立」之義，兼及「跨者不行」。跂者，進也。貪權慕名，進取功榮，則不可久立行道。跨者，自以為貴而跨於人，眾共蔽之，使不得行。自見、自是、自伐、自矜，皆非修身之道。見利則忘義，矜名則失實，是以聖人法道而不貴功、尚德而不居位也。</p><p>  <strong>所出</strong>：《老子河上公章句 · 苦恩》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
