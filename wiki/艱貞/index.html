    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 艱貞</nav></header><main><article><h1>艱貞</h1><p>居艱難之時，守正而不渝</p><p>九四一爻，噬乾胏得金矢，辭曰「利艱貞，吉」。乾胏，肉之帶骨者，噬之甚艱；金矢，剛直之物，又艱而又難也。</p><p>當此之時，所遇者艱，所守者正，故曰艱貞。艱者，外境之困；貞者，內心之守。處艱而不渝其正，守正而不避其艱，此聖賢之操也。故利在艱貞，而終得吉。</p><p><strong>所出</strong>：《周易 · 噬嗑》 — https://zh.wikisource.org/wiki/周易/噬嗑</p></article></main></div></div>
