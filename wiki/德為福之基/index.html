    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 德為福之基</nav></header><main><article><h1>德為福之基</h1><p>天道無親，唯德是授；無德之福，如無基之墉，壞亡無日。</p><p>范文子戒厲公以德為本。鄢陵之役，荊師退屯，晉將饗功，文子立於戎馬之前，辭其福而歸之於天，曰：「君幼弱，諸臣不佞，吾何福以及此！吾聞之，『天道無親，唯德是授。』吾庸知天之不授晉且以勸楚乎，君與二三臣其戒之！夫德，福之基也，無德而福隆，猶無基而厚墉也，其壞也無日矣。」</p><p>是以君子居安思危，據德以待命，不以功烈自矜。福之來也，必驗之於德；德之薄也，雖有福而難久。</p><p><strong>所出</strong>：《國語 · 卷12》 — https://zh.wikisource.org/wiki/國語/卷12</p></article></main></div></div>
