    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 子之所慎：齊、戰、疾</nav></header><main><article><h1>子之所慎：齊、戰、疾</h1><p>聖人謹慎之事。</p><p>[[孔子]]所慎者三：[[齊]]者，齋戒所以交神明；[[戰]]者，興師所以危邦國；[[疾]]者，養身所以存性命。此三者事關生死、存亡、治亂，故聖人尤加謹慎。</p><p><strong>所出</strong>：《論語 · 述而第七》 — https://zh.wikisource.org/wiki/論語/述而第七</p></article></main></div></div>
