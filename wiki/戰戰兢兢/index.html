    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 戰戰兢兢</nav></header><main><article><h1>戰戰兢兢</h1><p>惶恐戰慄、戒慎戒懼之貌。</p><p>戰戰兢兢，形容人惶恐戰慄之貌也。《小宛》以戰戰兢兢、如履薄冰並言，極言戒懼之至。蓋恭人於安樂之時，常懷危懼之心；居高位者，當如履薄冰，不敢有輕忽之意。詩人借此以戒子弟：治世不忘亂，居安常思危，此修身之要道也。</p><p><strong>所出</strong>：《詩經 · 小宛》 — https://zh.wikisource.org/wiki/詩經/小宛</p></article></main></div></div>
