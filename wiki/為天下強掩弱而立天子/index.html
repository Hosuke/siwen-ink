    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 為天下強掩弱而立天子</nav></header><main><article><h1>為天下強掩弱而立天子</h1><p>天子之立，非奉養己欲，乃為齊一天下。</p><p>且古之立帝王者，非以奉養其欲也；聖人踐位者，非以逸樂其身也。為天下強掩弱，眾暴寡，詐欺愚，勇侵怯，懷知而不以相教，積財而不以相分，故立天子以齊一之。為一人聰明而不足以遍照海內，故立三公九卿以輔翼之。絕國殊俗、僻遠幽間之處，不能被德承澤，故立諸侯以教誨之。是以地無不任，時無不應，官無隱事，國無遺利。所以衣寒食饑，養老弱而息勞倦也。</p><p><strong>所出</strong>：《淮南子 · 脩務訓》 — https://zh.wikisource.org/wiki/淮南子/脩務訓</p></article></main></div></div>
