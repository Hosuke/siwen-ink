    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 存七元</nav></header><main><article><h1>存七元</h1><p>存思七元，精思不怠，以為長生之本。</p><p>七元者，日月五星之精華在人者，又或以為七竅之元神。存思七元，精專不怠，修之可以延年。</p><p>《肝氣章》云「要復精思存七元」，言肝氣既衰，欲其週流，端賴精思存守，不怠不忽。精思者，心專一而不散；存七元者，守而不失。煉丹之要，在于一念不散，念念相續，七元常存。</p><p>存七元非一朝一夕之功，必久久行之，庶幾有效。日月之華以救老殘，肝氣週流以保長生，精思不忘，長生可冀。</p><p><strong>所出</strong>：《黃庭內景經 · 肝氣章第三十三》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/肝氣章第三十三</p></article></main></div></div>
