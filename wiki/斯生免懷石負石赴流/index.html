    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 懷石負石，赴流魚葬</nav></header><main><article><h1>懷石負石，赴流魚葬</h1><p>賢者不堪與濁世同流，寧赴水而死，以見守志之烈。</p><p>抱朴子悲時弊之甚，引古人以為況：「此古人之所以懷沙負石，赴流魚葬，而不堪與之同世也。已矣！悲夫！」</p><p><strong>所出</strong>：《抱朴子 · 卷20》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷20</p></article></main></div></div>
