    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 肅肅宵征</nav></header><main><article><h1>肅肅宵征</h1><p>敬慎夜行，以喻奉公之勤。</p><p>肅肅，恭敬之貌。宵，夜也。征，行也。[[肅肅宵征]]，言敬慎以夜行也。</p><p>詩人感念身世，深夜疾行，早暮皆在公所，無暇自逸。肅肅者，敬也；宵征者，不遑寢處也。一說「夙夜在公」，指早起與晚臥皆在公門。又說「夙夜」指凌晨，兼指早晚。各家之見稍有不同。</p><p>觀此一字，見行道者之恭，與「小星」微者相映，益知命分之差矣。</p><p><strong>所出</strong>：《詩經 · 小星》 — https://zh.wikisource.org/wiki/詩經/小星</p></article></main></div></div>
