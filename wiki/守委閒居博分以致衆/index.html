    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 守委閒居博分以致衆</nav></header><main><article><h1>守委閒居博分以致衆</h1><p>聖王禁以財買譽、聚衆行私。</p><p>守委閒居，博分以致衆；勤身遂行，說人以貨財，濟人以買譽，其身甚靜而使人求者，聖王之禁也。</p><p><strong>所出</strong>：《管子 · 第14篇法禁》 — https://zh.wikisource.org/wiki/管子/第14篇法禁</p></article></main></div></div>
