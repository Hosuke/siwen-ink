    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 黃帝遊赤水遺玄珠</nav></header><main><article><h1>黃帝遊赤水遺玄珠</h1><p>黃帝遣智、離朱、詬詬皆不得玄珠，象罔得之，以況道在恍惚無形。</p><p>黃帝遊乎赤水之北，登乎崐崙之丘而南望，還歸，遺其玄珠。使知索之而不得，使離朱索之而不得，使詬詬索之而不得也，乃使象罔。象罔得之。</p><p>黃帝曰：「異哉，象罔乃可以得之乎！」</p><p><strong>所出</strong>：《莊子 · 天地》 — https://zh.wikisource.org/wiki/莊子/天地</p></article></main></div></div>
