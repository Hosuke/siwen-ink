    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 卜短龜長</nav></header><main><article><h1>卜短龜長</h1><p>卜法龜為長，筮法為短，當從長者。</p><p>晉獻公欲以驪姬為夫人，卜之不吉，筮之吉。公曰：「從筮。」卜人曰：「筮短龜長，不如從長。且其繇曰：『專之渝，攘公之羭。一薰一蕕，十年尚猶有臭。』必不可。」弗聽，立之。夫龜象百世之吉凶，其道為長；筮決一時之事疑，其法為短。聖人設卜筮，亦使人知戒慎於未形，豈徒決疑惑而已哉。</p><p><strong>所出</strong>：《春秋左氏傳 · 僖公》 — https://zh.wikisource.org/wiki/春秋左氏傳/僖公</p></article></main></div></div>
