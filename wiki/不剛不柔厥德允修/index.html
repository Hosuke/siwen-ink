    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不剛不柔厥德允修</nav></header><main><article><h1>不剛不柔厥德允修</h1><p>為政寬猛相濟，剛柔得中，德乃成也。</p><p>王言「不剛不柔，厥德允修」。[[惟克天德]]者，在乎剛柔之中。過剛則民不堪，過柔則法不行；惟寬猛合宜，德乃可修。</p><p><strong>所出</strong>：《尚書 · 畢命》 — https://zh.wikisource.org/wiki/尚書/畢命</p></article></main></div></div>
