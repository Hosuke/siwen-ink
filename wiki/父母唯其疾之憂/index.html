    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 父母唯其疾之憂</nav></header><main><article><h1>父母唯其疾之憂</h1><p>孝子之事父母，使父母唯以其疾爲憂。</p><p>《論語》載孟武伯問孝，孔子答曰：「父母，唯其疾之憂。」言孝子之道，當使父母安樂無虞，唯疾病不可以人力免，故父母常以此爲憂也。餘事皆能盡心，不使父母操心，可謂孝矣。</p><p><strong>所出</strong>：《論語 · 爲政第二》 — https://zh.wikisource.org/wiki/論語/爲政第二</p></article></main></div></div>
