    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 淫聲諂耳</nav></header><main><article><h1>淫聲諂耳</h1><p>淫聲諂耳、淫觀諂目，耳目之所好諂心，心之所好傷民。</p><p>何以知其然也？曰：淫聲諂耳，淫觀諂目，耳目之所好諂心，心之所好傷民，民傷而身不危者，未之嘗聞也。</p><p><strong>所出</strong>：《管子 · 第10篇五輔》 — https://zh.wikisource.org/wiki/管子/第10篇五輔</p></article></main></div></div>
