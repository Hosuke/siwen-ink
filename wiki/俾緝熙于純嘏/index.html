    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 俾緝熙于純嘏</nav></header><main><article><h1>俾緝熙于純嘏</h1><p>使臣繼續光明，承受大福。祝先王功德永垂，後嗣蒙庥也。</p><p>「俾緝熙于純嘏」，祭祀武王之廟時所頌之祝辭也。俾，使也。緝，繼續也。熙，光明也。純，大也。嘏，福也。言使先王之德業得以繼續光明，承受無疆之大福也。</p><p>緝熙者，緝其已然之光明；純嘏者，享其固有之福澤。詩以此為卒章顯志之語，見祭祀之本意，在祈天永命，傳緒于無疆也。</p><p><strong>所出</strong>：《詩經 · 載見》 — https://zh.wikisource.org/wiki/詩經/載見</p></article></main></div></div>
