    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 主周</nav></header><main><article><h1>主周</h1><p>居上者當周密無遺</p><p>人主不可不周。不周，則群臣下亂。寂乎其無端，外內不通，安知所怨？[[闗閈不開，善否無原]]。周者，兼覆無遺之謂也。上無所遺漏，則下無所隱慝，[[察姦之道]]備矣。</p><p><strong>所出</strong>：《管子 · 第55篇九守》 — https://zh.wikisource.org/wiki/管子/第55篇九守</p></article></main></div></div>
