    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 昭事上帝</nav></header><main><article><h1>昭事上帝</h1><p>昭明以事天帝，求福于神。</p><p>維此文王，小心翼翼。昭事上帝，聿懷多福。厥德不回，以受方國。</p><p>昭，明也。聿，述也。懷，來也。言文王小心翼翼，昭明以奉事上帝，述所以求福也多也。[[明明在下赫赫在上]]言天命之在人者，文王明德上應乎天；此言文王下事乎上帝，二者相應，故[[厥德不回|德不回]]而受方國之歸也。</p><p><strong>所出</strong>：《詩經 · 大明》 — https://zh.wikisource.org/wiki/詩經/大明</p></article></main></div></div>
