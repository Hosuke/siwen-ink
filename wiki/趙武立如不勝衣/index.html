    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 趙武立如不勝衣</nav></header><main><article><h1>趙武立如不勝衣</h1><p>荐賢不以其人</p><p>平公問叔向曰：「羣臣孰賢？」曰：「趙武。」公曰：「子黨於師人。」向曰：「武立如不勝衣，言如不出口，然所舉士也數十人，皆得其意，而公家甚賴之。及武子之生也不利於家，死不託於孤，臣敢以爲賢也。」</p><p>趙武立如不勝衣，言如不出口，而所舉士數十人皆得其意。叔向以爲賢，蓋荐賢不以其人，[[外舉不避讎]]之意也。</p><p><strong>所出</strong>：《韓非子 · 外儲說左下》 — https://zh.wikisource.org/wiki/韓非子/外儲說左下
===孫叔敖===</p></article></main></div></div>
