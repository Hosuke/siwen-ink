    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 為政在於得人</nav></header><main><article><h1>為政在於得人</h1><p>為政之要，在使民不患勞、不患飢、不患死。</p><p>昔先王之理人也，蓋人有患勞，而上使之以時，則人不患勞也。人患飢，而上薄斂焉，則人不患飢矣。人患死，而上寬刑焉，則人不患死矣。</p><p><strong>所出</strong>：《管子 · 第26篇戒》 — https://zh.wikisource.org/wiki/管子/第26篇戒</p></article></main></div></div>
