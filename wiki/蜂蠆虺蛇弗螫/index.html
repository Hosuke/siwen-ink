    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蜂蠆虺蛇弗螫</nav></header><main><article><h1>蜂蠆虺蛇弗螫</h1><p>德厚者物不害。</p><p>蜂蠆虺蛇皆能為毒，而含德之厚者不犯其怒，故弗螫。鳥孟獸弗搏，亦同理。赤子骨弱筋柔而握固，蟲蛇猛獸不加害焉，以其純氣未漓、物莫之犯也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章五十五》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
