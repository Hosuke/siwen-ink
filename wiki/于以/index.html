    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 于以</nav></header><main><article><h1>于以</h1><p>語詞，無實義，問所為之事。</p><p>「于以采蘩」之「于以」，按馬瑞辰考證，即「爰以」「粵以」，乃語詞，別無意義，特用於疑問之句首耳。</p><p>毛詩傳箋舊解，誤訓「于以」為「往以」，訓詁未確。馬氏發其義，明「于以」乃發問之詞，問往何處、為何事也。</p><p>《采蘩》首章「于以采蘩，于沚」，正用此義，問之曰：往何處采蘩邪？于沚也。</p><p><strong>所出</strong>：《詩經 · 采蘩》 — https://zh.wikisource.org/wiki/詩經/采蘩</p></article></main></div></div>
