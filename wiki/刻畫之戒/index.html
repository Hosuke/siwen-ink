    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 刻畫之戒</nav></header><main><article><h1>刻畫之戒</h1><p>始制作於我，又要敬於我，又要禍於我；機貴乎明，險貴乎平，功貴乎無狀，法貴乎無象。</p><p>畫者不敢易於圓象，茍易之，必有咎。刻者不敢侮於本偶，茍侮之，必貽禍。始制作於我，又要敬於我，又要禍於我。是故張機者用於機，設險者死於險，建功者辱於功，立法者懼於法。動一窮則百窮相會，舉一事則萬事有害。所以機貴乎明，險貴乎平，功貴乎無狀，法貴乎無象。能出刻書者，可以名之為大象。</p><p><strong>所出</strong>：《化書 · 卷三》 — https://zh.wikisource.org/wiki/化書/卷三</p></article></main></div></div>
