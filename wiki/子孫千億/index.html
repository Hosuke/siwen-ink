    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 子孫千億</nav></header><main><article><h1>子孫千億</h1><p>君子積德，慶及後嗣，子孫繁盛至於千億。</p><p>「子孫千億」，語出《假樂》，言君子積德深厚，慶流後嗣，子孫之眾至於千億也。</p><p>干祿百福，言其受福之多；子孫千億，言其傳世之遠。君子不愆不忘，率由舊章，則天之錫祿，不止於一身，必延及其後。故曰：「干祿百福，子孫千億。」言其德澤之厚，有以受天之多福也多。</p><p><strong>所出</strong>：《詩經 · 假樂》 — https://zh.wikisource.org/wiki/詩經/假樂</p></article></main></div></div>
