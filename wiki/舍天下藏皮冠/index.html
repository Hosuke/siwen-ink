    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 舍天下藏皮冠</nav></header><main><article><h1>舍天下藏皮冠</h1><p>知己者聖，忘己者俗；皮冠在而不知許由，是未嘗知堯者也。</p><p>堯以天下讓許由，許由逃之，舍於家人，家人藏其皮冠。夫弃天下而家人藏其皮冠，是不知許由者也。</p><p><strong>所出</strong>：《韓非子 · 說林下》 — https://zh.wikisource.org/wiki/韓非子/說林下</p></article></main></div></div>
