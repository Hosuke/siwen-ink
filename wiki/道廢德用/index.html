    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 道廢而德用</nav></header><main><article><h1>道廢而德用</h1><p>道滅而德用，德衰而仁義生，此世道之序也。</p><p>道者，物之所導也；德者，性之所扶也；仁者，積恩之見證也；義者，比于人心而合於眾適者也。故道滅而德用，德衰而仁義生。故上世體道而不德，中世守德而弗壞也，末世繩繩乎唯恐失仁義。</p><p><strong>所出</strong>：《淮南子 · 繆稱訓》 — https://zh.wikisource.org/wiki/淮南子/繆稱訓</p></article></main></div></div>
