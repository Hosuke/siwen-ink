    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 諂淫</nav></header><main><article><h1>諂淫</h1><p>姦民以淫辭、淫巧諂上惑下，為亂之首。</p><p>若民有淫行邪性，樹爲淫辭，作爲淫巧，以上諂君上，而下惑百姓，移國動衆，以害民務者，其刑死流。</p><p><strong>所出</strong>：《管子 · 第10篇五輔》 — https://zh.wikisource.org/wiki/管子/第10篇五輔</p></article></main></div></div>
