    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五民</nav></header><main><article><h1>五民</h1><p>談說、處士、勇士、技藝、商賈五者，加於國用則田荒而兵弱</p><p>談說之士資在於口，處士資在於意，勇士資在於氣，技藝之士資在於手，商賈之士資在於身。故天下一宅，而圜身資民；資重於身，而偏託勢於外。挾重資，歸偏家，堯舜之所難也；故湯武禁之，則功立而名成。</p><p>今世巧而民淫，方倣湯武之時而行神農之事，以隨世禁，故千乘惑亂。</p><p><strong>所出</strong>：《商君書 · 卷二》 — https://zh.wikisource.org/wiki/商君書/卷二</p></article></main></div></div>
