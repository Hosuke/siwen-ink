    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 外其身</nav></header><main><article><h1>外其身</h1><p>薄己厚人，身反得存。</p><p>聖人外其身，薄己而厚人也。</p><p>河上公曰：百姓愛之如父母，神明祐之若赤子，故身常存。夫爭者亡，讓者存。求厚己者薄，求利人者廣。外身非無身也，忘身而身存，薄己而德溥。聖人自視若無功，而功用之施遍天下；自視若不才，而人戴之以為長。</p><p><strong>所出</strong>：《老子河上公章句 · 韜光》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
