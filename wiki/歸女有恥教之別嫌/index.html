    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 歸女有恥教之別嫌</nav></header><main><article><h1>歸女有恥教之別嫌</h1><p>男女有別，聖人制禮以防微杜漸。</p><p>《詩》美睢鳩，貴其有別。在禮，男女無行媒，不相見，不雜坐，不通問，不同衣物，不得親授，姊妹出適而反，兄弟不共席而坐，外言不入，內言不出，婦人送迎不出門，行必擁蔽其面，道路男由左，女由右，此聖人重別杜漸之明制也。</p><p>[[男女有別]]，國之大節。別嫌明微，禮之所貴。是以[[男女之別國之大節]]，[[禮坊止水]]之意，聖人防之於未然也。</p><p><strong>所出</strong>：《抱朴子 · 卷25》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷25</p></article></main></div></div>
