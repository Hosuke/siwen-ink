    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 后克艱厥后，臣克艱厥臣</nav></header><main><article><h1>后克艱厥后，臣克艱厥臣</h1><p>君臣皆當知治道之艱，而後政事可理。</p><p>禹敷政於四海，承事上帝，乃曰：「后克艱厥后，臣克艱厥臣，政乃乂，黎民敏德。」</p><p>言人君當知為君之艱，人臣當知為臣之艱。知其艱，則不敢怠忽，政事於是乂理，黎民於是敏於德化矣。</p><p>後世之論治者，必本此義。蓋不知艱者，必輕其事；輕其事者，必敗其功。[[后克艱厥后]]之訓，乃千古君臣之龜鑑也。</p><p><strong>所出</strong>：《尚書 · 大禹謨》 — https://zh.wikisource.org/wiki/尚書/大禹謨</p></article></main></div></div>
