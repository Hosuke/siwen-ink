    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 經傳之體</nav></header><main><article><h1>經傳之體</h1><p>劉勰別經與傳之體，經出言為文，傳則入筆。</p><p>世人論文章，常分文與筆為二，以為有韻者文、無韻者筆。顏延年以為筆之為體，乃言之文；經典則言而非筆，傳記則筆而非言。劉勰駁之曰：「易之文言，豈非言文；若筆不言文，不得云經典非筆矣。」</p><p>劉勰自定其義曰：「發口為言，屬筆曰翰，常道曰經，述經曰傳。」經傳之體，出言入筆，筆為言使，可強可弱。分經以典奧為不刊，非以言筆為優劣也。是故經與傳、言與筆，體異而功殊，不可執一端以論高下。</p><p><strong>所出</strong>：《文心雕龍 · 總術》 — https://zh.wikisource.org/wiki/文心雕龍/總術</p></article></main></div></div>
