    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 道殷無名</nav></header><main><article><h1>道殷無名</h1><p>道至博厚，反若無名，以明道隱无名之義。</p><p>道殷無名，[[道恆無名]]之別解也。殷，大也；道至大無外，而[[聞道日損以至於無]]，故無名可名。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第三章 聞道》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
