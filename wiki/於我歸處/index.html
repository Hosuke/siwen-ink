    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 於我歸處</nav></header><main><article><h1>於我歸處</h1><p>不知所歸之憂歎。</p><p>「於我歸處」，言我將何所歸乎。毛傳-{云}-「歸其居舍」，未知然否。實則詩人見蜉蝣朝生暮死，美而不能久，心生憂懼，不知己身終歸何處。此與 [[心之憂矣]] 互文足義，-{云}-「歸處」「歸息」「歸說」，辭異而義同，皆言歸宿未定，見生人之無所依也。國小而迫者，其心亦若是矣。</p><p><strong>所出</strong>：《詩經 · 蜉蝣》 — https://zh.wikisource.org/wiki/詩經/蜉蝣</p></article></main></div></div>
