    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 修德而道不行，藏器而時不會</nav></header><main><article><h1>修德而道不行，藏器而時不會</h1><p>德行修飾而道術不行，懷藏利器而時機不遇。</p><p>「蓋修德而道不行，藏器而時不會，或俟河清而齒已沒，或竭忠勤而不見知，遠行不騁於一世，勛澤不加於生民。」此言賢人修德立道，懷藏才能，而時命不佑，終不能行其志也。</p><p><strong>所出</strong>：《抱朴子 · 卷50》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷50</p></article></main></div></div>
