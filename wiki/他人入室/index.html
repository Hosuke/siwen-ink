    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 他人入室</nav></header><main><article><h1>他人入室</h1><p>死後家業盡為他人所據。</p><p>山有漆，隰有栗。子有酒食，何不日鼓瑟？且以喜樂，且以永日。宛其死矣，他人入室。</p><p>入室，據有其居也。詩三章末句各異：「他是愉」「他是保」「他人入室」，漸言其甚，以刺晉昭公之不能自用其有，終致危亡。</p><p><strong>所出</strong>：《詩經 · 山有樞》 — https://zh.wikisource.org/wiki/詩經/山有樞</p></article></main></div></div>
