    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 予臨兆民，凜乎若朽索之馭六馬</nav></header><main><article><h1>予臨兆民，凜乎若朽索之馭六馬</h1><p>馭民若朽索馭六馬，臨深履薄，不可不敬。</p><p>人君臨兆民之眾，當懷危懼之心，如以腐朽之索馭六馬，稍一不慎，車覆人亡。此[[五子之歌]]所述皇祖之戒，示人主當敬慎以御民，不可逸豫怠忽也。</p><p>其一云：「予臨兆民，懍乎若朽索之馭六馬。為人上者，柰何不敬！」</p><p><strong>所出</strong>：《尚書 · 五子之歌》 — https://zh.wikisource.org/wiki/尚書/五子之歌</p></article></main></div></div>
