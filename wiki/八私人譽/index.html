    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 八私人譽</nav></header><main><article><h1>八私人譽</h1><p>韓非子以八事為匹夫之私譽，實人主之大敗。</p><p>為故人行私，吏有姦也；[[以公財分施]]，公財損也；輕禄重身，民難使也；[[枉法曲親]]，法制毁也；[[弃官寵交]]，官職曠也；離世遁上，民不事也；[[交争逆令]]，令不行也；[[行惠取衆]]，君上孤也。此八者，匹夫之私譽，人主之大敗也。反此八者，匹夫之私毁，人主之公利也。</p><p>韓非子以為，人主若不察[[社稷]]之利害，而用匹夫之私譽，欲求國之無危亂，不可得矣。</p><p><strong>所出</strong>：《韓非子 · 八說》 — https://zh.wikisource.org/wiki/韓非子/八說</p></article></main></div></div>
