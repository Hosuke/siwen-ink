    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 袞職</nav></header><main><article><h1>袞職</h1><p>天子之位有闕，賢臣補之。</p><p>袞職有闕，維仲山甫補之。</p><p>袞，天子之服。職亦闕也。袞職，天子之位也。天子之位猶有所闕，必待賢臣以補之。言仲山甫能匡君之失，正王之闕也。</p><p><strong>所出</strong>：《詩經 · 烝民》 — https://zh.wikisource.org/wiki/詩經/烝民</p></article></main></div></div>
