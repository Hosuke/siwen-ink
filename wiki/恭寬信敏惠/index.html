    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 恭寬信敏惠</nav></header><main><article><h1>恭寬信敏惠</h1><p>仁者行於天下之道，在恭、在寬、在信、在敏、在惠。</p><p>子張問仁於孔子。孔子曰：「能行五者於天下，爲仁矣。」「請問之？」曰：「恭、寬、信、敏、惠。恭則不侮，寬則得眾，信則人任焉，敏則有功，惠則足以使人。」</p><p>恭以持己，則人不敢慢；寬以待人，則眾自歸附；信以行諾，則人信賴焉；敏以任事，則功自成焉；惠以濟眾，則人樂為用。此五者相須為用，乃仁者之所以為仁也。孔子以是告子張，欲其脩己以安百姓，非獨善其身而已。</p><p><strong>所出</strong>：《論語 · 陽貨第十七》 — https://zh.wikisource.org/wiki/論語/陽貨第十七</p></article></main></div></div>
