    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 忠信之泊</nav></header><main><article><h1>忠信之泊</h1><p>禮者，忠信衰薄之所致，亂之首也。</p><p>夫禮者，忠信之泊也而亂之首也。</p><p>泊，薄也。禮之興，以忠信既薄之後，故曰「忠信之泊」。及夫禮行，而爭攘攘臂，則亂之首也。是故上德不德，以無為為德；上仁為之而無以為，忠信未薄也；上義有以為，忠信又降焉；及乎上禮，忠信已泊，强抑攘臂，爭扔而不已，則亂之作也。</p><p>故聖人務反本，絕聖棄智，使忠信自厚，不使泊焉。泊者，德之竭而亂之原也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章三十八》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
