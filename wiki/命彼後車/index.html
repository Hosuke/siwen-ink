    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 命彼後車</nav></header><main><article><h1>命彼後車</h1><p>使副車緩行以待，言在上者體恤臣下之困。</p><p>《緜蠻》二章云「命彼後車，謂之載之」。後車者，副車也。當旅人困於力竭之時，在上者命副車載之，使免於顛躓。此見在上者之體下情也。《論語》[[過而不聽忠臣獨行其意]]言臣有過則當聽諫，此則言上之有恩以逮下，事異而同情。</p><p><strong>所出</strong>：《詩經 · 緜蠻》 — https://zh.wikisource.org/wiki/詩經/緜蠻</p></article></main></div></div>
