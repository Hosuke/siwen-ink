    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 后土祠</nav></header><main><article><h1>后土祠</h1><p>孝武東巡，立后土祠於汾陰脽上，親望拜如上帝禮。</p><p>其冬，天子郊雍，議曰：「今上帝朕親郊，而后土毋祀，則禮不答也。」有司與太史公、祠官寬舒等議立后土祠汾陰脽上，如寬舒等議。上親望拜，如上帝禮。禮畢，天子遂至滎陽而還。</p><p><strong>所出</strong>：《史記 · 卷012》 — https://zh.wikisource.org/wiki/史記/卷012</p></article></main></div></div>
