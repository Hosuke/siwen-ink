    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 宣太后</nav></header><main><article><h1>宣太后</h1><p>秦昭王之母，姓羋氏，楚人出身，臨朝稱制，內倚太后，外輔昭王。</p><p>宣太后非武王母。武王母號曰惠文后，先武王死。昭王母故號為羋八子，及昭王即位，羋八子號為宣太后。</p><p>昭王少，宣太后自治，任魏冉為政。范睢言宣太后專制，穰侯擅權於諸侯，涇陽君、高陵君之屬太侈，富於王室。</p><p><strong>所出</strong>：《史記 · 卷072》 — https://zh.wikisource.org/wiki/史記/卷072</p></article></main></div></div>
