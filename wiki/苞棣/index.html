    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 苞棣</nav></header><main><article><h1>苞棣</h1><p>叢生之棠棣，以興賢者之在野。</p><p>山有苞棣。</p><p>苞棣，唐棣之屬也。苞，叢生之義；棣，唐棣也。</p><p>詩以山有此木，與首章「山有苞櫟」同意，反興君子之未見於朝也。</p><p><strong>所出</strong>：《詩經 · 晨風》 — https://zh.wikisource.org/wiki/詩經/晨風</p></article></main></div></div>
