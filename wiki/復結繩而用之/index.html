    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 復結繩而用之</nav></header><main><article><h1>復結繩而用之</h1><p>返太古之樸，使民用法簡約</p><p>復結繩而用之者，治尚太古，使民返結繩記事之風也。上古之世，文書未興，結繩以記，及其後也，書契滋起，機巧日生。令小國寡民之世，反淳樸之俗，約之以繩，使民各安其分，無假繁文，以復結繩為用，此返樸之要道也。</p><p><strong>所出</strong>：《老子河上公章句 · 獨立》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
