    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 匪其彭</nav></header><main><article><h1>匪其彭</h1><p>盛大而不矜，知止以遠害。</p><p>九四「匪其彭」，《易》之言彭者，盛也，大也。《大有》之世，萬物盛長，然盛大之至，則有盈滿之憂。九四能「匪其彭」者，不以盛大自矜，知進退之分，故得无咎也。《象》以「明辨晰」釋之，見其智之能審時度勢，不失其正焉。</p><p><strong>所出</strong>：《周易 · 大有》 — https://zh.wikisource.org/wiki/周易/大有</p></article></main></div></div>
