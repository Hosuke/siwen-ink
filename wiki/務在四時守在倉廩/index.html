    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 務在四時守在倉廩</nav></header><main><article><h1>務在四時守在倉廩</h1><p>治國之本，在順四時之節，守護倉儲之積。</p><p>凡有地牧民者，務在四時，守在倉廩。國多財則遠者來，地辟舉則民留處。倉廩實則知禮節，衣食足則知榮辱。不務天時則財不生，不務地利則倉廩不盈。</p><p><strong>所出</strong>：《管子 · 第01篇牧民》 — https://zh.wikisource.org/wiki/管子/第01篇牧民</p></article></main></div></div>
