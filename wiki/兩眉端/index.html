    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 兩眉端</nav></header><main><article><h1>兩眉端</h1><p>雙眉盡頭之處，日月精光聚會之所。</p><p>兩眉端者，眉之盡頭也。《經》曰「借問何在兩眉端」，黃裳子丹之氣頻煩，借問其所出之處，答以兩眉端。蓋眉端在目之上，當面之中央，日月精光往來之塗、上清真氣交會之所。存思此處，可令目明心朗、神炁和暢，上接日月之華，下通臟腑之氣。修煉家往往於眉心間下功，欲令神光內凝、外照無礙，是內外交養之機也。</p><p><strong>所出</strong>：《黃庭內景經 · 靈臺章第十七》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/靈臺章第十七</p></article></main></div></div>
