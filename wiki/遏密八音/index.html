    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 遏密八音</nav></header><main><article><h1>遏密八音</h1><p>聖王之喪，萬物肅穆，音樂不行。</p><p>堯崩之後，三載，四海遏密八音。遏者，止也；密者，靜也；八音者，金、石、絲、竹、匏、土、革、木也。聖人在上，則下民和樂；聖人亡，則天地失常。是以君子哀而不傷，樂而不荒。</p><p><strong>所出</strong>：《尚書 · 舜典》 — https://zh.wikisource.org/wiki/尚書/舜典</p></article></main></div></div>
