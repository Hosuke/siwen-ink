    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 反者道之驗</nav></header><main><article><h1>反者道之驗</h1><p>復反而驗道，弱而為德之柄，此修道之驗也</p><p>物之反者，乃道之驗也。《參同契》云「反者道之驗，弱者德之枘」，言修煉之道，以損為益，以退為進。眾陰邪既排，正陽既立，則濁者化而清，昏者久而昭明。弱之為枘，正以柔制剛、以弱勝強之意，此道之自然驗於吾身者爾。</p><p><strong>所出</strong>：《周易參同契 · 22章》 — https://zh.wikisource.org/wiki/周易參同契/22章</p></article></main></div></div>
