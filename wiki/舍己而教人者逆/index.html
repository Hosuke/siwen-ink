    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 舍己而教人者逆</nav></header><main><article><h1>舍己而教人者逆</h1><p>舍己教人者逆理，正己化人者順道；逆者亂之招，順者治之要。</p><p>舍己而教人者逆，正己而化人者順。逆者，亂之招；順者，治之要。</p><p>聖人君子，明盛衰之源，通成敗之端，審治亂之機，知去就之節。雖窮，不處亡國之位；雖貧，不食亂邦之祿。潛名抱道者，時至而動，則極人臣之位；德合於己，則建殊絕之功。故其道高，而名揚於後世。</p><p><strong>所出</strong>：《三略》 — https://zh.wikisource.org/wiki/三略</p></article></main></div></div>
