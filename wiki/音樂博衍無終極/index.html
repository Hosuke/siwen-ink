    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 音樂博衍無終極</nav></header><main><article><h1>音樂博衍無終極</h1><p>音樂感通天地無有止極</p><p>張咸池奏承雲兮，二女御九韶歌。使湘靈鼓瑟兮，令海若舞馮夷。玄螭蟲象並出進兮，形蟉虯而逶蛇。雌蜺便娟㠯增撓兮，鸞鳥軒翥而翔飛。音樂博衍無終極兮，焉乃逝以俳佪。言仙人宮中有咸池、承雲、九韶之樂，湘靈、海若、馮夷之神皆來奏舞，音樂之妙感通天地，無有終極。此[[樂與天地同和]]之說也。</p><p><strong>所出</strong>：《楚辭 · 遠遊》 — https://zh.wikisource.org/wiki/楚辭/遠遊</p></article></main></div></div>
