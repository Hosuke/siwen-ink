    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蒞眾</nav></header><main><article><h1>蒞眾</h1><p>君子以蒞眾，用晦而明，不以察察為明。</p><p>「君子以蒞眾，用晦而明。」蒞，臨也；眾，兆民也。君子之蒞眾也，不以其明察為能，而以其晦昧為用。苟明察過甚，則民無所逃；晦而含之，乃能和輯。[[用晦而明]]，此之謂也。象辭以為君子蒞眾之道，莫善於此，蓋明夷之世的用也。</p><p><strong>所出</strong>：《周易 · 明夷》 — https://zh.wikisource.org/wiki/周易/明夷</p></article></main></div></div>
