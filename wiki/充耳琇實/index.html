    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 充耳琇實</nav></header><main><article><h1>充耳琇實</h1><p>冠飾之美，喻君子德盛</p><p>彼都人士，充耳琇實。</p><p>語出《詩經·小雅·都人士》。充耳，冠旁垂於兩耳之飾；琇實，美石之名。言彼都人士之冠飾，以美石為之，溫潤充實。觀人之服飾，可知其德；充耳以琇實，喻君子德容之美，充實於內而見於外也。</p><p><strong>所出</strong>：《詩經 · 都人士》 — https://zh.wikisource.org/wiki/詩經/都人士</p></article></main></div></div>
