    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 夏至陰乘陽，冬至陽乘陰</nav></header><main><article><h1>夏至陰乘陽，冬至陽乘陰</h1><p>夏至則陰乘陽而萬物就死，冬至則陽乘陰而萬物仰生。</p><p>夏日至則陰乘陽，是以萬物就而死；冬日至則陽乘陰，是以萬物仰而生。晝者陽之分，夜者陰之分，是以陽氣勝則日修而夜短，陰氣勝則日短而夜修。</p><p><strong>所出</strong>：《淮南子 · 天文訓》 — https://zh.wikisource.org/wiki/淮南子/天文訓</p></article></main></div></div>
