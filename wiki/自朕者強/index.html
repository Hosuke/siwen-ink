    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 自朕者強</nav></header><main><article><h1>自朕者強</h1><p>強於自勝，乃真強。</p><p>自朕者強也。朕者，克己之謂。天下之至柔馳騁天下之至堅，攻城掠地非真強也，克己之私、勝己之欲者，乃真強耳。外強而內弱者，強斯弱矣；外弱而內守者，弱斯強矣。是以強梁者不得其死，而自朕者可以全生。強不在筋骨之壯，而在心志之克。</p><p><strong>所出</strong>：《老子 (帛書本) · 章三十三》 — https://zh.wikisource/wiki/老子 (帛書本)</p></article></main></div></div>
