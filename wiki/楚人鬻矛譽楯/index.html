    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 楚人鬻矛譽楯</nav></header><main><article><h1>楚人鬻矛譽楯</h1><p>矛盾相詆，則無由俱售，兼偏之失也。</p><p>若雅鄭而共篇，則總一之勢離，是楚人鬻矛譽楯，兩難得而俱售也。</p><p>雅樂與鄭聲共列一篇，則一體之勢散矣，譬如楚人鬻矛而譽盾，矛盾相攻，莫能兩售。以此喻文，雅鄭不可同篇，偏執亦不可成體也。</p><p><strong>所出</strong>：《文心雕龍 · 定勢》 — https://zh.wikisource.org/wiki/文心雕龍/定勢</p></article></main></div></div>
