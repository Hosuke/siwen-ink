    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 仁人絀約，敖暴擅彊</nav></header><main><article><h1>仁人絀約，敖暴擅彊</h1><p>刺世之言，謂仁人被廢，暴人得志。</p><p>亂世之時，忠臣危殆，讒人服矣。仁人見絀而約，敖暴擅彊而無忌。以盲為明，以聾為聰，以危為安，以吉為凶。天下之是非、好醜、賞罰，舉反其常。此莊子所謂「聖人不死，大盜不止」，而屈子所以行吟澤畔、顦悴自沉者歟？</p><p><strong>所出</strong>：《荀子 · 賦篇》 — https://zh.wikisource.org/wiki/荀子/賦篇</p></article></main></div></div>
