    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 那琉</nav></header><main><article><h1>那琉</h1><p>周封史，行氣煉形，煮石髓服之，數百年，往來太室山中。</p><p>那琉者，周封史也。能行氣煉形，煮石髓而服之，謂之石鍾乳，至數百年。往來入太室山中，有臥石狀枕焉。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 3》 — https://zh.wikisource/wiki/歷世真仙體道通鑑/3</p></article></main></div></div>
