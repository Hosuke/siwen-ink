    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 惟朕文考無罪</nav></header><main><article><h1>惟朕文考無罪</h1><p>伐紂之師，非以力競，乃以義鳴。</p><p>文
王師誓畢，復自明心志曰：「予克受，非予武，惟朕文考無罪。受克予，非朕文考有罪，惟予小子無良。」言若克受，非我之武勇，乃我父文王積德無愆，天命所歸；若受反克我，亦非我父之罪，乃我小子德薄之故。蓋以義伐暴，非私敵也。</p><p><strong>所出</strong>：《尚書 · 泰誓下》 — https://zh.wikisource.org/wiki/尚書/泰誓下</p></article></main></div></div>
