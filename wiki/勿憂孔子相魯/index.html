    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 勿憂孔子相魯</nav></header><main><article><h1>勿憂孔子相魯</h1><p>晏子獻策以鄰國聖人為憂，設計使孔子去魯。</p><p>仲尼相魯，景公患之，謂晏子曰：「鄰國有聖人，敵國之忧也。今孔子相魯，若何？」晏子對曰：「君其勿憂。彼魯君，弱主也；孔子，聖相也。君不如陰重孔子，設以相齊。孔子強諫而不聽，必驕魯而有齊，君勿納也。夫絕于魯，無主于齊，孔子困矣。」居期年，孔子去魯之齊，景公不納，故困于陳蔡之間。</p><p><strong>所出</strong>：《晏子春秋 · 卷八》 — https://zh.wikisource.org/wiki/晏子春秋/卷八</p></article></main></div></div>
