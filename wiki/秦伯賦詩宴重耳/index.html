    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 秦伯賦詩宴重耳</nav></header><main><article><h1>秦伯賦詩宴重耳</h1><p>秦伯享重耳以國君之禮，賦詩明志，子餘相賓。</p><p>秦伯將享公子，使子犯從。子犯曰：「吾不如衰之文也，請使衰從。」遂使子餘從。如享國君之禮，子餘相如賓。卒事，秦伯謂大夫曰：「為禮而不終，恥也。」明日宴，秦伯賦《采菽》，子餘使公子降拜。又賦《鳩飛》，《河水》。秦伯賦《六月》，子餘使公子降拜，對曰：「君稱所以佐天子匡王國者以命重耳，重耳敢不從德？」秦伯嘆曰：「是子將有焉，豈專在寡人乎！」</p><p><strong>所出</strong>：《國語 · 卷10》 — https://zh.wikisource.org/wiki/國語/卷10</p></article></main></div></div>
