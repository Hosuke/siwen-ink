    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 噬臘肉遇毒</nav></header><main><article><h1>噬臘肉遇毒</h1><p>噬不可噬之物而遭其害，位不當故也</p><p>六三之爻，噬臘肉，遇毒。臘肉者，乾肉之難噬者；毒者，物之有害者也。</p><p>六三位不當，以陰居陽，以柔居剛，其德不中不正。噬其所不當噬，而遇毒以害之。然小吝而无咎者，吝於己而未至於大害也。聖人戒之，位不當而妄用刑者，適足以自害耳。</p><p><strong>所出</strong>：《周易 · 噬嗑》 — https://zh.wikisource.org/wiki/周易/噬嗑</p></article></main></div></div>
