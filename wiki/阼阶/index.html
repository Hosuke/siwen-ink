    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 升自阼阶</nav></header><main><article><h1>升自阼阶</h1><p>升堂由東階，主人之行。</p><p>彻者升自阼階，降自西階。乃奠如初，升降自西階。阼階，東階也，主人在是焉。升自阼階者，主人行禮之常。</p><p><strong>所出</strong>：《儀禮 · 既夕禮》 — https://zh.wikisource.org/wiki/儀禮/既夕禮</p></article></main></div></div>
