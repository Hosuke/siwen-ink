    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 美者自美</nav></header><main><article><h1>美者自美</h1><p>美人自矜其美，人反不知其美；醜者自知其醜，人反貴之。</p><p>陽子宿於逆旅，逆旅人有妾二人，其一人美，其一人惡。陽子問其故，逆旅小子對曰：「其美者自美，吾不知其美也；其惡者自惡，吾不知其惡也。」</p><p>陽子悟而告弟子：「行賢而去自賢之行，安往而不愛哉！」自矜者人輕之，自知者人敬之，此之謂也。</p><p><strong>所出</strong>：《莊子 · 山木》 — https://zh.wikisource.org/wiki/莊子/山木</p></article></main></div></div>
