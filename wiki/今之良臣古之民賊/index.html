    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 今之良臣古之民賊</nav></header><main><article><h1>今之良臣古之民賊</h1><p>能闢土地充府庫之臣，實古之所謂民賊也。</p><p>今之所謂良臣，古之所謂民賊也。</p><p>孟子曰：「今之事君者，皆曰我能為君闢土地、充府庫。今之所謂良臣，古之所謂民賊也。君不鄉道、不志於仁，而求富之，是富桀也。」又曰：「我能為君約與國、戰必克。今之所謂良臣，古之所謂民賊也。君不鄉道、不志於仁，而求為之強戰，是輔桀也。」</p><p>由今之道，無變今之俗，雖與之天下，不能一朝居也。是故真良臣者，非以功利輔君，乃以仁義導君，使君不失於桀也。</p><p><strong>所出</strong>：《孟子 · 告子下》 — https://zh.wikisource.org/wiki/孟子/告子下</p></article></main></div></div>
