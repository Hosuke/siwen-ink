    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 安術有七，危道有六</nav></header><main><article><h1>安術有七，危道有六</h1><p>治國之法有安穩之道七、危亡之道六，分別言之，以明取捨。</p><p>治國之術有七，安而可久；危亡之道有六，慎勿蹈之。韓非子首揭此綱，以為[[賞罰隨是非]]、 [[死生隨法度]]之屬，皆安術也；若[[斵削於繩之内]]、 [[危人於所安]]之屬，皆危道也。明主當察此以為取捨之準。</p><p><strong>所出</strong>：《韓非子 · 安危》 — https://zh.wikisource.org/wiki/韓非子/安危</p></article></main></div></div>
