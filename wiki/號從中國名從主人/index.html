    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 號從中國名從主人</nav></header><main><article><h1>號從中國名從主人</h1><p>地名之稱，中原從其號，外夷從其主，號從主人，不可紊也。</p><p>晉荀吳帥師敗狄于太原。</p><p>傳曰：「中國曰太原，夷狄曰太鹵。號從中國，名從主人。」蓋地名之稱，中原各國所用者為號，外夷自有其名，則從其主而言，不可混也。</p><p><strong>所出</strong>：《春秋穀梁傳 · 昭公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/昭公</p></article></main></div></div>
