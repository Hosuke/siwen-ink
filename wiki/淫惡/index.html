    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 淫惡</nav></header><main><article><h1>淫惡</h1><p>萬惡淫為首，天鑒昭昭，犯必受殃。</p><p>萬惡淫為首。淫報種種：或誘人妻而巳妻為人誘，或摟人女而巳女為人摟，或以姦殺身，或以姦絕後，或傾家業財，或奪功名壽，或生子孫賤，或隨誑騙走。勸世人未見不可思，旣見不可亂。遇人妻妾女，當作姊妹看。勿汚婢奴，勿狹妓旦。[[天無恩大恩]]，天鑒不容惰。戒淫是正人端相之本，亦是大豪傑之事。</p><p><strong>所出</strong>：《張三丰先生全集 · 卷6》 — https://zh.wikisource.org/wiki/張三丰先生全集/卷6</p></article></main></div></div>
