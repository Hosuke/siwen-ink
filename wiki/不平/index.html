    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不平</nav></header><main><article><h1>不平</h1><p>不肖者僥倖而亨，賢者困厄而窮，天理未必昭昭也。</p><p>太史公曰：「不平，不肖者之幸也；不平，賢者之困也。」夫不肖者席榮利而優游，賢者秉義操而蹉跌，天之於人，往往有不平者。然聖賢不以此渝節：得志則行道於天下，不得志則守義於一身。富貴非賢者之所必取，困窮非不肖者之所終免。太史公借此以歎季布之屈、欒布之伸，感慨深矣。</p><p><strong>所出</strong>：《史記 · 卷100》 — https://zh.wikisource.org/wiki/史記/卷100</p></article></main></div></div>
