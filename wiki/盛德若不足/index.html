    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 盛德若不足</nav></header><main><article><h1>盛德若不足</h1><p>德盛者不以德自滿，常若有所不足，此聖人之道也。</p><p>老子戒[[陽子居]]曰：「大白若辱，盛德若不足。」此言德愈盛而心愈下，若無所增益然。[[寓言]]之旨，欲人悟謙德之益也。</p><p><strong>所出</strong>：《莊子 · 寓言》 — https://zh.wikisource.org/wiki/莊子/寓言</p></article></main></div></div>
