    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天王入于成周</nav></header><main><article><h1>天王入于成周</h1><p>周有入而無出，天王入于成周，是為周衰之象。</p><p>天王入于成周。</p><p>傳曰：「周有入無出也。」天王入于成周，言周衰而天王僅得入居而已，無力征伐出師，故有入而無出，示周室不振也。</p><p><strong>所出</strong>：《春秋穀梁傳 · 昭公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/昭公</p></article></main></div></div>
