    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 朱庫</nav></header><main><article><h1>朱庫</h1><p>久服石春辟穀，白鶴來迎，蛻殼登真。</p><p>朱庫者，不知何許人也。久服石春辟穀符水，不飢不渴，強壯不老。</p><p>庫忽云：「應得仙，剋日發。」與親舊別云：「當有迎者。」單衣白韈。須臾有兩黃鶴下中庭，庫便度世。中庭仍有三黃鶴相隨，飛向東郭外。三黃衣道士擁手束行，因鄉人附書與家人。家人看屍，惟有空殼。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 22》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/22</p></article></main></div></div>
