    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 塞朋黨</nav></header><main><article><h1>塞朋黨</h1><p>朋黨比周，則賢否混淆；欲正士風，必塞其源。</p><p>[[抱朴子]]論朋黨之害-{云}-：「舉任並謬，則群賢括囊；群賢括囊，則兇邪相引；兇邪相引，則小人道長；小人道長，則梼杌比肩。頌聲所以不作，怨嗟所以嗷嗷也。」夫[[賢智之士奚時得用]]，惟在塞朋黨之源。朋黨之結，由於用人之權不在君而在臣；臣挾私以植黨，則國之棟樑日傾，而邪佞盈庭矣。</p><p><strong>所出</strong>：《抱朴子 · 卷15》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷15</p></article></main></div></div>
