    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 觳土</nav></header><main><article><h1>觳土</h1><p>五觳之土婁婁然，不忍水旱，種大菽細菽多白實，為下土之劣者。</p><p>夫觳土者，五觳之土，婁婁然，不忍水旱。其種大菽、細菽，多白實。蓄殖果木，不如三土以十分之六。</p><p>觳土之病，在於土性浮脆，既不耐旱，亦不耐澇。旱則易裂，澇則易陷，無以蓄養根苗。作物之中，唯豆類稍宜，然其效已遜於上土遠甚。民之居此者，雖勤耕作，終歲所獲有限，此下土之不可以力強也。</p><p><strong>所出</strong>：《管子 · 第58篇地員》 — https://zh.wikisource.org/wiki/管子/第58篇地員</p></article></main></div></div>
