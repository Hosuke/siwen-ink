    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖人居無為之事</nav></header><main><article><h1>聖人居無為之事</h1><p>聖人行不言之教，以無為治天下。</p><p>是以聖人居無為之事，行不言之教，萬物昔而弗始，為而弗志也，成功而弗居也。</p><p>聖人抱樸守素，居無為之地，行不言之教，使萬物自化而不主其始，有為而不存其志，功成而不居其位。此所以道德通而天下治也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章二》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
