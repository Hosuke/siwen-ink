    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 柔履剛</nav></header><main><article><h1>柔履剛</h1><p>柔者承剛，以悅應健，危而不傷。</p><p>彖曰：履，柔履剛也。說而應乎乾，是以履虎尾，不咥人，亨。</p><p>[[柔履剛]]者，卦以兌柔履乾剛。柔者卑下，剛者尊顯，卑以承尊，柔以行健。悅而應乎乾，則無忤於上，故履危而亨。</p><p><strong>所出</strong>：《周易 · 履》 — https://zh.wikisource.org/wiki/周易/履</p></article></main></div></div>
