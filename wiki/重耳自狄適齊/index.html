    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 重耳自狄適齊</nav></header><main><article><h1>重耳自狄適齊</h1><p>狐偃勸重耳去狄適齊，蓄力遠圖。</p><p>狐偃言於重耳曰：「奔而易達，困而有資，休以擇利。」勸之速行，云：「蓄力一紀，可以遠矣。齊侯長矣，而欲親晉。管仲歿矣，多讒在側。茲可以親。」公子從之，乞食於五鹿，野人舉塊以與。子犯曰：「天賜也。」再拜受土而去。</p><p><strong>所出</strong>：《國語 · 卷10》 — https://zh.wikisource.org/wiki/國語/卷10</p></article></main></div></div>
