    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 少君尸解</nav></header><main><article><h1>少君尸解</h1><p>棺中無所復有唯履在耳</p><p>少君死，斂之，棺中無所復有，釘亦不脫，唯履在耳。百餘日，人見之於河東蒲阪市，乘青騾。</p><p><strong>所出</strong>：《神仙傳 · 卷六》 — https://zh.wikisource.org/wiki/神仙傳/卷六</p></article></main></div></div>
