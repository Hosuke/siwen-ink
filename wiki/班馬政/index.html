    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 班馬政</nav></header><main><article><h1>班馬政</h1><p>季秋之月，大合樂、班馬政，田獵以習五戎。</p><p>季秋之月，大合樂，天子乃率三公、九卿、諸侯、大夫親往視之。乃合累牛、騰馬，遊牝於牧。犧牲、駒、犢，舉，書其數。又大饗帝，嘗犧牲告備于天子。合諸侯，制百縣，來歲受朔日。天子乃教於田獵，以習五戎，班馬政。</p><p><strong>所出</strong>：《禮記 · 月令》 — https://zh.wikisource.org/wiki/禮記/月令</p></article></main></div></div>
