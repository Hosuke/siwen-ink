    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 劉益</nav></header><main><article><h1>劉益</h1><p>京兆藍田隱者，居直庵六十年，肌如玉，宣和初應召，不樂還山，後尸解。</p><p>劉益，京兆藍田人也，隱居子直庵廬六十年，膚如玉，面有壯容。飲酒數斗不亂，上下峻皈若履夷途。</p><p>宋宣和初，京兆以聞，徽宗遣使召之。方秋劇雨，泥悼沒踝，益徒步而使者騎不能及。既至東都，徽宗禮之厚，然非所樂也，力求還山。常止於華嚴川浮屠精舍。</p><p>宣和末告其徒曰山川草木何腥羶之甚耶？吾惡之。遂尸解去。將葬，體如蛻焉。已而戎難作，其徒始異其言。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 52》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/52</p></article></main></div></div>
