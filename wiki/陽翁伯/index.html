    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 陽翁伯</nav></header><main><article><h1>陽翁伯</h1><p>記陽翁伯孝親感神、種玉得妻、俱昇仙之事。</p><p>陽翁伯事親孝，葬父母，神感之，泉出墓側。有飲馬者，以白石一升與之，令種，生美玉。一日，有青童引至海山，仙人曰：「汝孝於親，當夫婦仙。」後徐氏有女，以白璧成婚。數年，夫婦俱昇天。</p><p>又《搜神記》雲：陽翁伯常以�蹟給行旅，一日有人飲訖，懷中出白子一升與之，曰：「種生美玉，並得好婦。」如言種之。有徐氏女極美，求之，徐公曰：「得美玉一雙即可。」以所種得玉璧，遂妻之。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 15》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/15</p></article></main></div></div>
