    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 崇高邑</nav></header><main><article><h1>崇高邑</h1><p>登中嶽太室，從官聞「萬歲」聲，因封三百戶奉祠，命曰崇高邑。</p><p>三月，遂東幸緱氏，禮登中嶽太室。從官在山下聞若有言「萬歲」云。問上，上不言；問下，下不言。於是以三百戶封太室奉祠，命曰崇高邑。東上[[泰山]]，山之草木葉未生，乃令人上石立之泰山顛。</p><p><strong>所出</strong>：《史記 · 卷012》 — https://zh.wikisource.org/wiki/史記/卷012</p></article></main></div></div>
