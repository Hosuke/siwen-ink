    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 龍生於水</nav></header><main><article><h1>龍生於水</h1><p>龍生於水，被五色而游，能小能大，變化無時，謂之神。</p><p>龍生於水，被五色而游，故神。欲小則化如蠶蠋，欲大則藏於天下，欲上則凌於雲氣，欲下則入於深泉。變化無日，上下無時，謂之神。</p><p>龍與龜皆伏闇能存而能亡者也。</p><p><strong>所出</strong>：《管子 · 第39篇水地》 — https://zh.wikisource.org/wiki/管子/第39篇水地</p></article></main></div></div>
