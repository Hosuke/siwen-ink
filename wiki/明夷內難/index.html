    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 明夷內難</nav></header><main><article><h1>明夷內難</h1><p>明夷為闇之主，初最逺故君子于行，五最近而難不能溺。</p><p>明夷為闇之主在於上六，初最逺之故曰君子于行，五最近之而難不能溺故謂之箕子之貞，明不可息也。三處明極而征至闇，故曰南狩其大首也。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷10》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷10</p></article></main></div></div>
