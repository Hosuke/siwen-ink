    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 其室則邇，其人甚遠</nav></header><main><article><h1>其室則邇，其人甚遠</h1><p>居室相近而情疏，物理之近不足以當人心之遠。</p><p>其室則邇，其人甚遠。</p><p>居室相近，而其所思之人則邈不可即。此以物理之近，喻人情之遠也。近者莫如室，而遠者莫如其人，詩人所以深感而歎者，正以咫尺天涯，徒增其思耳。</p><p>後世言人情之疏者，多用此意。</p><p><strong>所出</strong>：《詩經 · 東門之墠》 — https://zh.wikisource.org/wiki/詩經/東門之墠</p></article></main></div></div>
