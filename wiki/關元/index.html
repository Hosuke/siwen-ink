    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 關元</nav></header><main><article><h1>關元</h1><p>丹田之異名，藏精之淵府</p><p>關元在人身上下之際，下丹田之正位也。魂靈在上，關元在下，上下相望，表裏相通。《太上黃庭內景經》以「下關元」為存思之要穴。關元者，元炁所聚，性命之關，內脩以此為封固一身元陽之本，守之則精不外泄，養之則炁自長存。</p><p><strong>所出</strong>：《黃庭內景經 · 上有章第二》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/上有章第二</p></article></main></div></div>
