    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 牝牡相從</nav></header><main><article><h1>牝牡相從</h1><p>陰陽相配，雌雄相合，萬化之根也。</p><p>牝牡相從，乃[[晦朔合符]]之實義。陰者牝，陽者牡，相從而不相離。[[滋液潤澤]]，[[施化流通]]，莫非牝牡相從之所變化。天地神明皆本此道，修煉者效法天地，亦必以此為根宗。[[混沌鴻蒙]]之中，牝牡未分；晦朔之際，牝牡始交。魏伯陽以牝牡喻身中水火、龍虎、鉛汞之相配，以成還丹之功。《參同契》全書之旨，不外牝牡相從四字而已。</p><p><strong>所出</strong>：《周易參同契 · 18章》 — https://zh.wikisource.org/wiki/周易參同契/18章</p></article></main></div></div>
