    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 合志同方營道同術</nav></header><main><article><h1>合志同方營道同術</h1><p>儒者交友，以志同道合為基礎，道不同則相與退。</p><p>儒有合志同方，營道同術：並立則樂，相下不厭；久不相見，聞流言不信。其行本方立義：同而進，不同而退。</p><p>合志同方者，志既相合，道亦相向也。並立而樂，相下不厭，交道之正也；久別而流言不入，信任之篤也；本方立義，合則共進，不合則共退，交友之義明矣。《易》「同心之言，其臭如蘭」，此之謂也。</p><p><strong>所出</strong>：《禮記 · 儒行》 — https://zh.wikisource.org/wiki/禮記/儒行</p></article></main></div></div>
