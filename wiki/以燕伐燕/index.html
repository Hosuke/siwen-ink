    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以燕伐燕</nav></header><main><article><h1>以燕伐燕</h1><p>誅暴伐無道，必待天吏；若以燕伐燕，是同類相殘，不足為義師。</p><p>沈同以私問燕可伐與，孟子答以可，蓋子噲不得與人燕，子之不得受燕於子噲，禪讓失序故也。齊人伐燕後，人問孟子是否勸伐，孟子辯之曰：彼問可伐與，吾應之可，彼遂伐之爾。然吾所謂可伐者，謂天吏可以伐之；今以燕伐燕，則是同類相殘，與殺人者問可殺否而答以可，實無異也。誅暴禁亂，必有道焉；非其罪而伐之，不可以為義。</p><p><strong>所出</strong>：《孟子 · 公孫丑下》 — https://zh.wikisource.org/wiki/孟子/公孫丑下
===終::</p></article></main></div></div>
