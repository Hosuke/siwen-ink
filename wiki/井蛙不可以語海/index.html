    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 井蛙不可以語海</nav></header><main><article><h1>井蛙不可以語海</h1><p>拘於虛者，不可以語於大海。喻見識受限之人難曉大道。</p><p>北海若曰：「井蛙不可以語於海者，拘於虛也；夏蟲不可以語於冰者，篤於時也；曲士不可以語於道者，束於教也。今爾出於崖涘，觀於大海，乃知爾醜，爾將可與語大理矣。」</p><p><strong>所出</strong>：《莊子 · 秋水》 — https://zh.wikisource.org/wiki/莊子/秋水</p></article></main></div></div>
