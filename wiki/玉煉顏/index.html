    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 玉煉顏</nav></header><main><article><h1>玉煉顏</h1><p>以道煉形，顏如[[玉]]潤。</p><p>玉煉顏者，以道法修煉其形，使顏色溫潤如[[玉]]也。《[[黃庭經]]》以[[口為玉池]]，漱咽滋潤則灾不干，光華生而香蘭發，由是[[卻滅百邪]]，玉煉其顏而成[[成真]]之基。此煉非外飾，乃[[修真]]積久之效，自然而然，不假人為。[[體生光華]]者，玉煉顏之驗也。</p><p><strong>所出</strong>：《黃庭內景經 · 口為章第三》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/口為章第三</p></article></main></div></div>
