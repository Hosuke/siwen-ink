    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 其出彌遠，其知彌少</nav></header><main><article><h1>其出彌遠，其知彌少</h1><p>外馳者智損，內觀者知全。</p><p>聖人不行而出戶，不窺而審於牖，而天下之事萬物之理，無不周知矣。夫道在邇而求諸遠，事在易而索諸難；知在內而窺諸外者，失其本也。馳騁田獵、涉遠遊觀，非所以益知也，去道益遠，離性益久，其智以是而彌寡矣。</p><p>蓋聞道者觀諸近而萬物備，慕外者謀於遠而本先迷。彼方內之知不待外求，此聖人所以不行而曉、不見而名、不為而成也。是以知道之士，守其根於內，不馳騁於外；去彼取此，是謂玄德。</p><p><strong>所出</strong>：《老子 (帛書本) · 章四十七》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
