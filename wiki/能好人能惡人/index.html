    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 惟仁者能好人能惡人</nav></header><main><article><h1>惟仁者能好人能惡人</h1><p>仁者能正以好惡，不徇私情。</p><p>惟仁者能好人，能惡人。不好不惡，是無善惡之分也。仁者之心正，其情真，故能好善而惡不善。好惡本於義理，非挾私意以行之也。</p><p><strong>所出</strong>：《論語 · 里仁第四》 — https://zh.wikisource.org/wiki/論語/里仁第四</p></article></main></div></div>
