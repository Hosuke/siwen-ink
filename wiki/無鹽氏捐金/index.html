    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無鹽氏捐金</nav></header><main><article><h1>無鹽氏捐金</h1><p>無鹽氏出捐千金貸吳楚七國，一歲之中息什倍，富埒關中。</p><p>吳楚七國兵起時，長安中列侯封君行從軍旅，齎貸子錢，子錢家以為侯邑國在關東，關東成敗未決，莫肯與。唯無鹽氏出捐千金貸，其息什之。三月，吳楚平，一歲之中，則無鹽氏之息什倍，用此富埒關中。</p><p><strong>所出</strong>：《史記 · 卷129》 — https://zh.wikisource.org/wiki/史記/卷129</p></article></main></div></div>
