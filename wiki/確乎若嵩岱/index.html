    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 確乎若嵩岱</nav></header><main><article><h1>確乎若嵩岱</h1><p>君子之德如嵩山巍峨，深不可測，以喻賢者器度之宏遠。</p><p>抱朴子論大賢器量云：「確乎若嵩岱，銓衡所不能測也；浩乎若滄海，斗斛所不能校也。峻其重仞之高，隱其百官之富。觀彼佻竊，若草莽也。」</p><p><strong>所出</strong>：《抱朴子 · 卷20》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷20</p></article></main></div></div>
