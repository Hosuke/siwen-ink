    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 交媾定置始先</nav></header><main><article><h1>交媾定置始先</h1><p>生死之形，定於交合之始</p><p>本在交媾，定置始先。言[[胞胎受氣之初]]，[[男生而伏]][[女偎其軀]]之形，皆於父母[[雌雄交媾]]之時已定，非後所能易也。生死之別，剛柔之稟，莫不由此。</p><p><strong>所出</strong>：《周易參同契 · 26章》 — https://zh.wikisource.org/wiki/周易參同契/26章</p></article></main></div></div>
