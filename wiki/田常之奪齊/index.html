    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 田常之奪齊，六卿之分晉，趙高之弒秦，王莽之篡漢</nav></header><main><article><h1>田常之奪齊，六卿之分晉，趙高之弒秦，王莽之篡漢</h1><p>權臣篡弒之禍，起於威刑不立</p><p>田常之奪齊，六卿之分晉，趙高之弒秦，王莽之篡漢，履霜逮冰，由來漸矣。或永嘆於海濱，或拊心乎望夷，禍延宗祧，作戒將來者，由乎慕虛名於往古，忘實禍於當己也。</p><p><strong>所出</strong>：《抱朴子 · 卷14》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷14</p></article></main></div></div>
