    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 學以清澄性理</nav></header><main><article><h1>學以清澄性理</h1><p>學者所以清澄性理，啟導聰明，備人事王道。</p><p>《抱朴子》曰：「夫學者所以清澄性理，簸揚埃穢，雕鍛礦璞，礱煉屯鈍，啟導聰明，飾染質素，察往知來，博涉勸戒，仰觀俯察，於是乎在，人事王道，於是乎備。進可以為國，退可以保己。」</p><p>是故聖賢孜孜勤學，命盡日中而釋，饑寒危困而不廢，非有求於當世，誠樂之自然也。</p><p><strong>所出</strong>：《抱朴子 · 卷03》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷03</p></article></main></div></div>
