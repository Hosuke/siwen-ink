    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 坤文言　黃裳之義</nav></header><main><article><h1>坤文言　黃裳之義</h1><p>黃中通理，美之至也。</p><p>坤文言解六五「黃裳」曰：「君子黃中通理，正位居體，美在其中，而暢於四支，發於事業，美之至也。」</p><p>言黃中者，心中之德，文理通徹，居中正之位，其美充實於中，發見於外，至美之極也。</p><p><strong>所出</strong>：《周易 · 坤》 — https://zh.wikisource.org/wiki/周易/坤</p></article></main></div></div>
