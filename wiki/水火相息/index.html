    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 水火相息</nav></header><main><article><h1>水火相息</h1><p>水火相滅，喻事物對立而相成，此革之義也。</p><p>彖傳云：「革，水火相息」，言水火之性相滅，離火在下而兌澤在上，其氣相薄，故成革象。凡物之相息者，必有一方變化而後另一方定，是以對立之物相摩相蕩，乃生變革之功。此聖人取象之深意，以明天下之變動無常，唯相息而後有成。</p><p><strong>所出</strong>：《周易 · 革》 — https://zh.wikisource.org/wiki/周易/革</p></article></main></div></div>
