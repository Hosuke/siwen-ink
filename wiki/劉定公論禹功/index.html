    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 劉定公論禹功</nav></header><main><article><h1>劉定公論禹功</h1><p>微禹之功，則人將為魚，因以勉趙孟遠績利民。</p><p>天王使劉定公勞趙孟於潁，館於雒汭。劉子曰：「美哉禹功！明德遠矣。微禹，吾其魚乎！吾與子弁冕端委以治民臨諸侯，禹之力也。子盍亦遠績禹功而大庇民乎？」對曰：「老夫罪戾是懼，焉能恤遠。吾儕偷食，朝不謀夕，何其長也。」劉子歸以語王曰：「諺所為『老將知而耄及之』者，其趙孟之謂乎。為晉正卿，以主諸侯，而儕於隸人，朝不謀夕，棄神人矣。」</p><p><strong>所出</strong>：《春秋左氏傳 · 昭公》 — https://zh.wikisource.org/wiki/春秋左氏傳/昭公</p></article></main></div></div>
