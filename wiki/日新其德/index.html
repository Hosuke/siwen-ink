    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 日新其德</nav></header><main><article><h1>日新其德</h1><p>剛健笃實，光輝日日增新。</p><p>彖辭言「剛健篤實輝光，日新其德」，言大畜之德，剛健而不已，篤實而不偽，光輝自然發越，日日增新而不已也。君子畜德之功，亦當如是，汲汲不息，日日有進，是之謂日新。</p><p><strong>所出</strong>：《周易 · 大畜》 — https://zh.wikisource.org/wiki/周易/大畜</p></article></main></div></div>
