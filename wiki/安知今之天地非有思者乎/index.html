    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 安知今之天地非有思者乎</nav></header><main><article><h1>安知今之天地非有思者乎</h1><p>萬物皆思以成，天地亦有大心</p><p>天下之人蓋不可以億兆計，人人之夢各異，夜夜之夢各異。有天有地，有人有物，皆思成之，蓋不可以塵計，安知今之天地非有思者乎。</p><p>[[安知今之天地非有思者乎]] 人夢各異，物物殊象，莫非心有所思而後成。然而億兆之人，其思各異，而天地上下昭然不移，是天地亦有思焉。萬物皆思以成其形，天地亦一大思者也。聖人知此，故不以區識局天地，而天地亦不以成毀累聖人。</p><p><strong>所出</strong>：《關尹子 · 2》 — https://zh.wikisource.org/wiki/關尹子/2</p></article></main></div></div>
