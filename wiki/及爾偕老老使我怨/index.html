    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 及爾偕老老使我怨</nav></header><main><article><h1>及爾偕老老使我怨</h1><p>昔約偕老，今成怨耦，恩情之薄古今所同慨。</p><p>「及爾偕老，老使我怨」，語出《詩經·衞風·氓》第六章。</p><p>詩人追述昔日嫁時之約：「秋以為期」，固已期之矣；及其嫁後，三歲食貧，勤苦不辭，心猶以偕老為望也。不圖桑黃隕落、容顏凋零之後，男子之心遂移，言既遂而至於暴。女子念及昔時偕老之約，豈意今日之若是也？淇有岸，隰有泮，而人情之無極，過於洪水、廣隰，怨從中來，誰則知之？此詩人之所以默然而自悼者也。</p><p><strong>所出</strong>：《詩經 · 氓》 — https://zh.wikisource.org/wiki/詩經/氓</p></article></main></div></div>
