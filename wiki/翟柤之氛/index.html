    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 翟柤之氛</nav></header><main><article><h1>翟柤之氛</h1><p>翟柤有氛象，獻公見之而不寐，因伐之。</p><p>獻公田，見翟柤之氛，歸寑不寐。郤叔虎朝而問之，公以翟柤對。叔虎力陳翟柤之君可伐之狀，士蒍以告，公悅，乃伐翟柤。郤叔虎被羽先登，遂克之。</p><p><strong>所出</strong>：《國語 · 卷07》 — https://zh.wikisource.org/wiki/國語/卷07</p></article></main></div></div>
