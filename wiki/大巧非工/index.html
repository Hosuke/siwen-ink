    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大巧非工</nav></header><main><article><h1>大巧非工</h1><p>天地之巧，非工師所能及也。</p><p>天地所包，陰陽所嘔，雨露所濡，化生萬物，瑤碧玉珠，翡翠玳瑁，文彩明朗，潤澤若濡，摩而不玩，外而不渝，奚仲不能旅，魯般不能造，此謂之大巧。宋人有以象為其君為楮葉者，三年而成，莖柯豪芒，鋒殺顏澤，亂之楮葉之中而不可知也。列子曰：「使天地三年而成一葉，則萬物之有葉者寡矣。」</p><p>大巧非工師所能及也。天設日月，列星辰，調陰陽，張四時，其生物也，莫見其所養而物長；其殺物也，莫見其所喪而物亡。此之謂神明。</p><p><strong>所出</strong>：《淮南子 · 泰族訓》 — https://zh.wikisource.org/wiki/淮南子/泰族訓</p></article></main></div></div>
