    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 禮者治之治</nav></header><main><article><h1>禮者治之治</h1><p>禮者，即事之治也。治國而無禮，則無以相也。</p><p>子曰：「禮者何也？即事之治也。君子有其事，必有其治。治國而無禮，譬猶瞽之無相與？倀倀乎其何之？譬如終夜有求於幽室之中，非燭何見？若無禮則手足無所錯，耳目無所加，進退揖讓無所製。」</p><p><strong>所出</strong>：《禮記 · 仲尼燕居》 — https://zh.wikisource.org/wiki/禮記/仲尼燕居</p></article></main></div></div>
