    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 善賞一人</nav></header><main><article><h1>善賞一人</h1><p>襄子賞高赫一人而天下莫敢失禮，此善賞也。</p><p>襄子圍於晉陽中，出圍，賞有功者五人，高赫爲賞首。張孟談曰：「赫無大功，今爲賞首，何也？」襄子曰：「晉陽之事，寡人國家危，社稷殆矣。吾羣臣無有不驕侮之意者，惟赫子不失君臣之禮，是以先之。」仲尼聞之曰：「善賞哉！襄子賞一人而天下爲人臣者莫敢失禮矣。」</p><p><strong>所出</strong>：《韓非子 · 難一》 — https://zh.wikisource.org/wiki/韓非子/難一</p></article></main></div></div>
