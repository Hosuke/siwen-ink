    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 尺脈三部診法</nav></header><main><article><h1>尺脈三部診法</h1><p>尺脈分三部，候季脅、腎、腹、肝、鬲、胃、脾、肺、胸中、心、膻中，以斷上下前後病位。</p><p>「尺內兩傍，則季肋也。」其法：尺外以候腎，尺裏以候腹；中附上，左外以候肝，內以候鬲，右外以候胃，內以候脾；上附上，右外以候肺，內以候胸中，左外以候心，內以候膻中。前以候前，後以候後。上竟上者胸喉中事也，下竟下者少腹腰股膝脛足中事也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第五卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第五卷</p></article></main></div></div>
