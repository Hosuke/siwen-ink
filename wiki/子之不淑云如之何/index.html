    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 子之不淑，云如之何</nav></header><main><article><h1>子之不淑，云如之何</h1><p>責夫人有服飾而無德行</p><p>「子之不淑，云如之何」，見於《詩經·君子偕老》。言夫人雖有盛服，而德行不淑，將如之何邪？呂氏注曰：「首章之末云『子之不淑，云如之何』，責之也。」蓋詩人見夫人服飾之美而歎其德之不稱，故以此責之。</p><p><strong>所出</strong>：《詩經 · 君子偕老》 — https://zh.wikisource.org/wiki/詩經/君子偕老</p></article></main></div></div>
