    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 國有十年之蓄</nav></header><main><article><h1>國有十年之蓄</h1><p>國家積十年之蓄，乃能富勝貧、勇勝怯、智勝愚。</p><p>管仲以為，[[歲藏一]]、縣時積累，則「國有十年之蓄」。有此蓄積，則可致十勝：富勝貧、勇勝怯、智勝愚、微勝不微、有義勝無義、練士勝歐眾。具此十勝，發如風雨，動如雷霆，獨出獨入，莫之能禁，不待權輿而天下可定。</p><p><strong>所出</strong>：《管子 · 第71篇事語》 — https://zh.wikisource.org/wiki/管子/第71篇事語</p></article></main></div></div>
