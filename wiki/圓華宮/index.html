    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 圓華宮</nav></header><main><article><h1>圓華宮</h1><p>太張之上黃素之字所居，玉壽靈山之別名也。</p><p>圓華宮，太張上黃素字所居之宮名，在玉壽靈山之中。行道者存思此宮，可令五藏生華光焉。</p><p><strong>所出</strong>：《上清大洞真經 · 19章》 — https://zh.wikisource.org/wiki/上清大洞真經/19章</p></article></main></div></div>
