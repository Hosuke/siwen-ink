    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 敝而不成</nav></header><main><article><h1>敝而不成</h1><p>不欲盈滿，故能保守而成。</p><p>敝而不成者，《帛書》老子云：「葆此道不欲盈，夫唯不欲盈，是以能敝而不成。」</p><p>言修道之人，保守此道，不求盈滿；惟其不求盈滿，故能保守節儉而不自滿，不自矜成。盈者必溢，滿者必傾，唯不盈乃可長守不失。此與 [[不欲盈]] 之義相發明也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第五十九章 不盈》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
