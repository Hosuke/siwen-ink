    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 美其德</nav></header><main><article><h1>美其德</h1><p>稱美其德。言詩人作詩以美之也。</p><p>美，稱美也。德者，得也。行道而有得於心之謂德。《緇衣》之詩，美武公之德也。</p><p>序云「《緇衣》，美武公也」，又云「故美其德，以明有國[[善善之功]]」。夫美其德者，豈徒然哉？所以勸天下之為人上者，使之知好善之有功也。詩人美之，序詩者明之，皆所以教戒後世之意也。</p><p><strong>所出</strong>：《詩經 · 緇衣》 — https://zh.wikisource.org/wiki/詩經/緇衣</p></article></main></div></div>
