    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大饗有四</nav></header><main><article><h1>大饗有四</h1><p>禮猶有九焉，大饗有四；苟知此矣，雖在畎畝之中事之，聖人已。</p><p>子曰：「慎聽之！女三人者，吾語女，禮猶有九焉。大饗有四焉。苟知此矣，雖在畎畝之中事之，聖人已。兩君相見，揖讓而入門，入門而縣興，揖讓而升堂，升堂而樂闋。下管《象》《武》《夏》籥序興。陳其薦俎，序其禮樂，備其百官。如此，而後君子知仁焉。」</p><p><strong>所出</strong>：《禮記 · 仲尼燕居》 — https://zh.wikisource.org/wiki/禮記/仲尼燕居</p></article></main></div></div>
