    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 八寶垂訓</nav></header><main><article><h1>八寶垂訓</h1><p>許遜垂教弟子，以忠孝廉謹寬裕容忍為八寶，修身治德之要言。</p><p>八寶垂訓曰：「忠孝廉謹，寬裕容忍。忠則不欺，孝則不悖，廉而罔貪，謹而勿失，修身如此，可以成德。寬則得衆，裕然有餘，容而翕受，忍則安舒，接人以此，怨咎滌除。凡我法子，動靜勤篤，念茲在茲，常守其獨。有爽厥心，三官考戮。」</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 26》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/26</p></article></main></div></div>
