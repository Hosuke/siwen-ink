    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 從命</nav></header><main><article><h1>從命</h1><p>臣之事君，以利君與否分順諂，以利君與否分忠篡。</p><p>從命而利君謂之[[順]]，從命而不利君謂之[[諂]]；逆命而利君謂之[[忠]]，逆命而不利君謂之[[篡]]。不卹君之榮辱，不卹國之臧否，偷合苟容，以持禄養交而已耳，謂之[[國賊]]。</p><p><strong>所出</strong>：《荀子 · 臣道篇》 — https://zh.wikisource.org/wiki/荀子/臣道篇</p></article></main></div></div>
