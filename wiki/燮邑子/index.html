    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 燮邑子</nav></header><main><article><h1>燮邑子</h1><p>周時降岐山之陽說《赤精經》，教以仁信之道，西伯聞之召為守藏史。</p><p>燮邑子，亦稱赤精子，降於岐山之陽，說《赤精經》，教以仁信之道。西伯聞之，召為守藏史。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 2》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/2</p></article></main></div></div>
