    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 變體之失</nav></header><main><article><h1>變體之失</h1><p>班傅北征西巡變為序引，馬融廣成上林雅而似賦，皆失頌之正體</p><p>至於班傅之《北征》《西巡》，變為序引，豈不褒過而謬體哉！馬融之《廣成》《上林》，雅而似賦，何弄文而失質乎！又崔瑗《文學》，蔡邕《樊渠》，並致美於序，而簡約乎篇；摯虞品藻，頗為精覈，至云雜以風雅，而不變旨趣，徒張虛論，有似黃白之偽說矣。</p><p><strong>所出</strong>：《文心雕龍 · 頌讚》 — https://zh.wikisource.org/wiki/文心雕龍/頌讚</p></article></main></div></div>
