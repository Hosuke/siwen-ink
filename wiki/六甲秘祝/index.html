    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 六甲秘祝</nav></header><main><article><h1>六甲秘祝</h1><p>述入山密祝之辭與寶日義日之義。</p><p>抱朴子曰：「入名山，以甲子開除日，以五色繒各五寸，懸大石上，所求必得。」</p><p>又曰：「入山宜知六甲秘祝。祝曰：『臨兵鬥者，皆陣列前行。』凡九字，常當密祝之，無所不辟。要道不煩，此之謂也。」</p><p><strong>所出</strong>：《抱朴子 · 卷17》 — https://zh.wikisource.org/wiki/抱朴子/卷17</p></article></main></div></div>
