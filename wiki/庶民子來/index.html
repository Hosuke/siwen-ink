    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 庶民子來</nav></header><main><article><h1>庶民子來</h1><p>民感君德，如子趨事其親，不待督責而自至。</p><p>「經始勿亟，庶民子來。」</p><p>亟，急也。言文王未嘗急於觀成，而庶民之來，若孝子之事父母，欣然趨事，不召而自至也。</p><p>蓋上有仁德，則下懷其上，[[民之洽矣]]，民心既洽，則不待驅迫而人自盡其力。此[[文王受命]]，民樂其[[靈王餓死|靈德]]，[[魚水之喻|如魚之就水]]者然也。</p><p>詩人美文王之得民心，以為[[愛民而安好士而榮|愛民而安]]之效，而後世明主治道，莫不以得民心為本焉。</p><p><strong>所出</strong>：《詩經 · 靈臺》 — https://zh.wikisource.org/wiki/詩經/靈臺</p></article></main></div></div>
