    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 煥若星經</nav></header><main><article><h1>煥若星經</h1><p>丹道煥然若星之經天、水之宗海。</p><p>煥若星經漢兮，昃如水宗海。</p><p>丹道既成，光明煥發，若星辰之經乎河漢，浩渺若水之宗於四海。言其象之廣大、其道之昭明也。</p><p><strong>所出</strong>：《周易參同契 · 32章》 — https://zh.wikisource.org/wiki/周易參同契/32章</p></article></main></div></div>
