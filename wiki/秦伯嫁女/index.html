    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 秦伯嫁女</nav></header><main><article><h1>秦伯嫁女</h1><p>喻為文害用，辭華而失實</p><p>秦伯嫁其女於晉公子，令晉為之飾裝，從衣文之媵七十人。至晉，晉人愛其妾而賤公女。此可謂善嫁妾，而未可謂善嫁女也。楚人有賣其珠於鄭者，為木蘭之櫝，薰以桂椒，綴以珠玉，飾以玫瑰，輯以翡翠。鄭人買其櫝而還其珠。此可謂善賣櫝矣，未可謂善鬻珠也。{{墨子}}之說，傳先王之道，論聖人之言，以宣告人。若辯其辭，則恐人懷其文忘其直，以文害用也。</p><p><strong>所出</strong>：《韓非子 · 外儲說左上》 — https://zh.wikisource.org/wiki/韓非子/外儲說左上</p></article></main></div></div>
