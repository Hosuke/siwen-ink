    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 春秋之義-之</nav></header><main><article><h1>春秋之義-之</h1><p></p><p>宣公十五年，王札子殺召伯、毛伯，《春秋》書之，以明以王命殺之義。為天下主者天也，繼天者君也，君之所存者命也。臣侵君命而用之，是不臣也；君失其命，是不君也。君不君，臣不臣，此天下所以傾。弒君之罪，趙盾與聞而書盾；殺大夫之罪，王札以尊命加乎下，而上下之義遂亡。《春秋》之法，誅意不誅事，正名以防微。</p><p>  <strong>所出</strong>：《春秋穀梁傳 · 宣公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/宣公</p></article></main></div></div>
