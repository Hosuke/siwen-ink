    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 飲食與治亂</nav></header><main><article><h1>飲食與治亂</h1><p>飲食者，萬民之命也；一七日不食，國亡種滅，先王重之。</p><p>得之必生，失之必死者，何也？唯無得之，堯、舜、禹、湯、文、武、孝己斯待以成，天下必待以生，故先王重之。一日不食比歲歉，三日不食比歲飢，五日不食比歲荒，七日不食無國土，十日不食無疇類，盡死矣。先王貴誠信，誠信者，天下之結也。賢大夫不恃宗至，士不恃外權，坦坦之利不以功，坦坦之備不為用，故存國家，定社稷，在卒謀之間耳。</p><p><strong>所出</strong>：《管子 · 第12篇樞言》 — https://zh.wikisource.org/wiki/管子/第12篇樞言</p></article></main></div></div>
