    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 世選爾勞</nav></header><main><article><h1>世選爾勞</h1><p>選用臣功，不掩其善。</p><p>世選（纂）爾勞，予不掩爾善。</p><p>盤庚嘉獎臣民之功。言[[世選爾勞]]，歷世選用汝之功勞；予亦不掩[[爾善]]，明以獎善勸功也。功必錄而善必彰，此[[尚書]]所述用人賞功之道。</p><p><strong>所出</strong>：《尚書 · 盤庚上》 — https://zh.wikisource.org/wiki/尚書/盤庚上</p></article></main></div></div>
