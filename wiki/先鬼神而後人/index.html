    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 先鬼神而後人</nav></header><main><article><h1>先鬼神而後人</h1><p>聖王治天下，必先敬鬼神，而後及人。</p><p>故古聖王治天下也，故必先鬼神而後人者，此也。</p><p>古者聖王必以鬼神爲其務，又恐後世子孫不能知也，故書之竹帛，傳遺後世子孫。</p><p><strong>所出</strong>：《墨子 · 明鬼下》 — https://zh.wikisource.org/wiki/墨子/明鬼下</p></article></main></div></div>
