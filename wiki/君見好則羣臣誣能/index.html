    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 君見好則羣臣誣能</nav></header><main><article><h1>君見好則羣臣誣能</h1><p>君有所好，臣即飾其能以迎合之</p><p>[[韓非子]]察人情之變，見君臣交接之機。</p><p>曰：「君見惡，則羣臣匿端；君見好，則羣臣誣能。」</p><p>夫君有好，臣則揣摩而迎合之，飾其所不能以為能，飾其所不敢以為敢。姦臣揣摩上意之深，而[[賞罰]]之柄失其所賞，非功受賞、非罪受刑矣。</p><p>故[[羣臣見素]]之道，在乎[[去好去惡]]。好惡不形，則姦無所施，[[賞罰]]一準於[[刑德|刑賞之柄]]，而[[審合刑名|名實可考]]矣。</p><p><strong>所出</strong>：《韓非子 · 二柄》 — https://zh.wikisource.org/wiki/韓非子/二柄</p></article></main></div></div>
