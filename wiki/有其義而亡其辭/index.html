    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 有其義而亡其辭</nav></header><main><article><h1>有其義而亡其辭</h1><p>義理猶存而辭章已逸。</p><p>《由儀》篇末云「有其義而亡其辭」。</p><p>言此詩之名序尚在，而六義之篇章辭句已亡逸不存也。[[由儀]]之旨——萬物各得其宜——猶賴毛詩序說以傳，然其歌詩本文則不可復見矣。</p><p>古書之闕佚多矣，有義存而辭亡者，亦有辭存而義隱者。《由儀》屬前者，與[[亡鈇者疑鄰]]之「亡」字義異，彼言遺失，此言亡佚。學者循義以求，往往可以窺古詩之旨於萬一也。</p><p><strong>所出</strong>：《詩經 · 由儀》 — https://zh.wikisource.org/wiki/詩經/由儀</p></article></main></div></div>
