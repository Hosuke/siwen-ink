    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 見群龍无首</nav></header><main><article><h1>見群龍无首</h1><p>天德不可為首，剛柔相濟，天下治也。</p><p>用九：見群龍无首，吉。</p><p>象曰：用九，天德不可為首也。
文言曰：「乾元用九」，天下治也。又曰：乃見天則。</p><p>乾元用九者，剛健之中有謙退之義焉。天德至剛，然不可為首，首則有亢之悔。聖人用九，剛而能柔，進而能退，如群龍各有其位，無為首者，此天之則也。天下治者，六爻發揮，旁通情也。</p><p><strong>所出</strong>：《周易 · 乾》 — https://zh.wikisource.org/wiki/周易/乾</p></article></main></div></div>
