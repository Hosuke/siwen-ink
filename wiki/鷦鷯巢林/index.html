    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鷦鷯巢林</nav></header><main><article><h1>鷦鷯巢林</h1><p>物各有適，不求盈滿，知足者不以天下為累。</p><p>堯讓天下於許由，許由辭之，曰：「鷦鷯巢於深林，不過一枝；偃鼠飲河，不過滿腹。歸休乎君，予無所用天下為！」</p><p>物之所需，一枝足矣，一腹滿矣。世人貪求盈滿，不知止足，是以累於物而不得逍遙。許由辭天下，正以其無用於己也。</p><p><strong>所出</strong>：《莊子 · 逍遙遊》 — https://zh.wikisource.org/wiki/莊子/逍遙遊</p></article></main></div></div>
