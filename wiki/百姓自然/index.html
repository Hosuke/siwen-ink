    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 百姓自然</nav></header><main><article><h1>百姓自然</h1><p>民自以為自然，不知上化之功。</p><p>百姓皆謂我自然者，上德之化至矣。功用既成，化行俗美，而民莫知其所自來，以為己之當然。《[[道法自然治]]》云「道法自然」，此之謂也。上化無形而下稱自得，太上之功，所以為不可名也。</p><p><strong>所出</strong>：《老子河上公章句 · 淳風》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
