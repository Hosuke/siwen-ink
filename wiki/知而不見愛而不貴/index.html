    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 知而不見愛而不貴</nav></header><main><article><h1>知而不見愛而不貴</h1><p>聖人自知而不自見，自愛而不自貴</p><p>是以聖人，自知而不自見也，自愛而不自貴也，故去彼取此。</p><p>自知者，內照神明，不眩於外也；不自見者，不以所長形於人。自愛者，養其真性，不虧於己也；不自貴者，不以所能驕於物。去彼之自見自貴，取此之自知自愛，此聖人之所以全其德也。是以去彼取此，辭貴取賤，辭見取默，道之善也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第三十七章 畏畏》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
