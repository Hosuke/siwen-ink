    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 維其傷矣</nav></header><main><article><h1>維其傷矣</h1><p>中心憂傷無有已時</p><p>苕之華，芸其黃矣。心之憂矣，維其傷矣。</p><p>「傷」者，創痛之甚於「憂」也。首句言「心之憂矣」，已見其愁；第二句言「維其傷矣」，則愁之上又有愁，傷之上又有傷，層層加深，無有已時。周室之亡，詩人非不知之也，知之而無可如何，則心之憂者，轉而為心之傷；心之傷者，益增其心之憂。迨於末章，乃以[[人可以食鮮可以飽]]一語收之，所傷者大，而所憂者深矣。</p><p><strong>所出</strong>：《詩經 · 苕之華》 — https://zh.wikisource.org/wiki/詩經/苕之華</p></article></main></div></div>
