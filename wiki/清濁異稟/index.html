    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 清濁異稟</nav></header><main><article><h1>清濁異稟</h1><p>人之稟受各有淺深，不能以一概全，才有清濁，思有修短。</p><p>洪之為人，體純性駑，寡所玩好。自總發垂髫，未嘗鬪雞鶩、走狗馬。見人博戲，了不目眄。是以至今不知棋局上有幾道樗蒲齒名。</p><p>洪少有定志，決不出身，每覽巢許、子州、北人石戶、二姜、兩袁、法真、子龍之傳，慕其為人。念精治五經，著一部子書，令後世知其為文儒而已。</p><p>洪又言：「才有清濁，思有修短。」蓋稟受各有深淺，不能強齊也。</p><p><strong>所出</strong>：《抱朴子 · 卷52》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷52</p></article></main></div></div>
