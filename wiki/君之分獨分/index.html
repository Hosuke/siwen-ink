    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 君之分獨分</nav></header><main><article><h1>君之分獨分</h1><p>刑賞之分，唯君獨專，乃為真分。</p><p>治國者，其刑賞莫不有分：有持異以為分，不可謂分；至於察君之分，獨分也。是以其民重法而畏禁，願毋抵罪而不敢胥賞。</p><p>刑賞之分，非徒有其名，必也君自專之。君主與臣下共分之，則異說紛起，賞罰失其準的。唯君王獨操賞罰之柄，不為異論所奪，乃為真分。分定於一，則賞必信、刑必嚴，民知所懼而不敢犯上也。</p><p><strong>所出</strong>：《韓非子 · 制分》 — https://zh.wikisource.org/wiki/韓非子/制分</p></article></main></div></div>
