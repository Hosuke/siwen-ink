    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 女歸吉</nav></header><main><article><h1>女歸吉</h1><p>漸之進以女歸為象，守正則吉</p><p>漸：女歸吉，利貞。</p><p>彖曰：「漸之進也，女歸吉也。進得位，往有功也。進以正，可以正邦也。其位剛，得中也。止而巽，動不窮也。」</p><p>女歸者，嫁也。嫁女之家，行禮有漸，必待納采、問名、納吉、納徵、請期、親迎，循序而行，故-{云}-漸。卦以艮下巽上為象，止而後巽，動而不窮。進以正道，則可以正邦家，故吉。唯利在守正，苟失其正，則進反為躓矣。</p><p><strong>所出</strong>：《周易 · 漸》 — https://zh.wikisource.org/wiki/周易/漸</p></article></main></div></div>
