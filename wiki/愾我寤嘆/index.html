    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 愾我寤嘆</nav></header><main><article><h1>愾我寤嘆</h1><p>深夜思治，寤而起嘆，念王室之盛也。</p><p>「愾我寤嘆」者，詩人深夜思亂，未嘗入睡，慨然長嘆也。愾，歎息之意。[[閔馬父笑子服景伯]]載古人感時之歎，《下泉》則以「寤嘆」見賢者念王室之切。三章迭言「愾我寤嘆，念彼周京」，「念彼京周」，「念彼京師」，辭漸加密，愁思益深。</p><p><strong>所出</strong>：《詩經 · 下泉》 — https://zh.wikisource.org/wiki/詩經/下泉</p></article></main></div></div>
