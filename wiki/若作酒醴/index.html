    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 若作酒醴</nav></header><main><article><h1>若作酒醴</h1><p>臣之輔君，猶麴糵之成酒醴，不可闕一。</p><p>王曰：「若作酒醴，爾惟麴糵；若作和羹，爾惟鹽梅。」言酒醴非麴糵不成，羹非鹽梅不和；人君亦必資臣工以成治功，猶是理也。[[股肱惟人]]之義，此其具體言之者。</p><p><strong>所出</strong>：《尚書 · 說命下》 — https://zh.wikisource.org/wiki/尚書/說命下</p></article></main></div></div>
