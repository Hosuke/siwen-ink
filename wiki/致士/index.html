    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 致士</nav></header><main><article><h1>致士</h1><p>致，求也；士，賢士也。言招致賢士之道，明治國之本在得人。</p><p>《致士》篇箸治國之要，在於得賢。篇中敷陳聽言、用人、師道、賞刑之術，剖析川淵歸物之理，以喻君子為道法之摠要，明治亂生於君子小人，首尾相應，歸本於禮義與君子。</p><p><strong>所出</strong>：《荀子 · 致士篇》 — https://zh.wikisource.org/wiki/荀子/致士篇</p></article></main></div></div>
