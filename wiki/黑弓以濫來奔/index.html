    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 黑弓以濫來奔</nav></header><main><article><h1>黑弓以濫來奔</h1><p>賢者子孫宜有地，公羊傳因而通濫。</p><p>昭公三十一年冬，黑弓以濫來奔。</p><p>公羊傳云：「文何以無邾婁？通濫也。曷爲通濫？賢者子孫宜有地也。賢者孰謂？謂叔術也。」</p><p>傳又述其詳：當邾婁顏淫九公子于宮中，臧氏之母抱孝公以逃。叔術為之殺殺顏者而立為妻，遂讓國于夏父，三分之、四分之、五分之而後受之。公扈子以為讓國之賢，誅顏之時天子死，叔術起而致國于夏父。天下未有濫，而大夫之義不得世，故推而通之。</p><p><strong>所出</strong>：《春秋公羊傳 · 昭公》 — https://zh.wikisource.org/wiki/春秋公羊傳/昭公</p></article></main></div></div>
