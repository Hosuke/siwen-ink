    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不怨天，不尤人</nav></header><main><article><h1>不怨天，不尤人</h1><p>君子之於得失，歸諸天命，不歸咎於人。</p><p>充虞路問，疑孟子去齊有憂色。孟子答以「彼一時，此一時」，引曾子「君子不怨天，不尤人」之言，實則以「五百年必有王者興」之信念自處。蓋君子之於際遇，歸諸天命之數，不以不遇而怨天，不以人之不我知而尤人。進退出處，一循乎義，無所往而不自得也。</p><p><strong>所出</strong>：《孟子 · 公孫丑下》 — https://zh.wikisource.org/wiki/孟子/公孫丑下</p></article></main></div></div>
