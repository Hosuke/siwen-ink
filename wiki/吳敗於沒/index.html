    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 吳敗於沒</nav></header><main><article><h1>吳敗於沒</h1><p>越再敗吳師於沒也。</p><p>吳師既敗於囿，越人乘勝進兵，又敗之於沒。沒者，地名也。吳師再北，國力益耗。</p><p><strong>所出</strong>：《國語 · 卷20》 — https://zh.wikisource.org/wiki/國語/卷20</p></article></main></div></div>
