    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 稱名也小取類也大</nav></header><main><article><h1>稱名也小取類也大</h1><p>興之用，取區區之名物，而包廣大之義類，其旨弘遠矣。</p><p>此語本諸《易傳》，劉勰移以論詩也。興之託諭，稱名也小，取類也大。觀夫《關雎》有別，以喻-{后}-妃之德；《尸鳩》貞一，以象夫人之義。名物至微，而義類至博，此興之體所以立也。學《詩》者不可以辭害意，宜因其小名而窺其大義焉。</p><p><strong>所出</strong>：《文心雕龍 · 比興》 — https://zh.wikisource.org/wiki/文心雕龍/比興</p></article></main></div></div>
