    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 仲孫來</nav></header><main><article><h1>仲孫來</h1><p>齊仲孫來聘，魯因以定。</p><p>閔公元年，「冬，齊仲孫來」。</p><p>  穀梁子釋之云：「其曰齊仲孫，外之也。其不目而曰仲孫，疏之也。其言齊，以累桓也。」</p><p>  齊仲孫者，高子也。齊內亂，仲孫出觀魯政而歸。《春秋》不書其名而稱仲孫，是疏遠之也；冠以齊，是累及齊桓也。蓋桓公為霸主，其大夫來聘，義當謹敬，今仲孫之名不達於魯，《春秋》以外之而疏之。</p><p>  <strong>所出</strong>：《春秋穀梁傳 · 閔公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/閔公</p></article></main></div></div>
