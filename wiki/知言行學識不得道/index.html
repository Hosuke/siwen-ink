    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 知言行學識不得道</nav></header><main><article><h1>知言行學識不得道</h1><p>以言、行、學、識求道，互相輾轉，無有得時。</p><p>若以言行學識求道，互相輾轉，無有得時。知言如泉鳴，知行如禽飛，知學如擷影，知識如計夢，一息不存，道將來契。</p><p><strong>所出</strong>：《關尹子 · 1》 — https://zh.wikisource.org/wiki/關尹子/1</p></article></main></div></div>
