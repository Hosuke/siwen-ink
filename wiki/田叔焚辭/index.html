    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 田叔焚辭</nav></header><main><article><h1>田叔焚辭</h1><p>田叔悉焚梁反辭，但空還以報景帝。</p><p>遣田叔、呂季主往治之。此二人皆通經術，知大禮。來還，至霸昌廄，取火悉燒梁之反辭，但空手來對景帝。</p><p>景帝曰：「何如？」對曰：「言梁王不知也。造為之者，獨其幸臣羊勝、公孫詭之屬為之耳。謹以伏誅死，梁王無恙也。」</p><p>景帝喜說，曰：「急趨謁太后。」太后聞之，立起坐湌，氣平復。故曰，不通經術知古今之大禮，不可以為三公及左右近臣。少見之人，如從管中闚天也。</p><p><strong>所出</strong>：《史記 · 卷058》 — https://zh.wikisource.org/wiki/史記/卷058</p></article></main></div></div>
