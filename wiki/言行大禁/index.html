    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 言行大禁</nav></header><main><article><h1>言行大禁</h1><p>言不可復，行不可再，君主之大禁也。</p><p>日月不明，天不易也。山高而不見，地不易也。言而不可復者，君不言也。行而不可再者，君不行也。凡言而不可復，行而不可再者，有國者之大禁也。夫日月有晦明，山川有隱顯，此天地之常也。君有言行，如天地之有日月山川，一發而不可改。故聖人言之不敢不慎，行之不敢不敬。一言既出，兆民聽之；一行既作，萬邦法之。可不慎哉！</p><p><strong>所出</strong>：《管子 · 第02篇形勢》 — https://zh.wikisource.org/wiki/管子/第02篇形勢</p></article></main></div></div>
