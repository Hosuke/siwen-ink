    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 太史伯對</nav></header><main><article><h1>太史伯對</h1><p>太史伯論王室多故可居之地</p><p>王室多故之時，桓公問太史伯避死之地。伯對曰：「獨雒之東土，河濟之南可居。」又詳陳虢、鄶之君貪好利，百姓不附，請居之則民皆化之理。并論及四國將興：齊，伯夷之後；秦，伯翳之後；楚，祝融之裔；晉，成王封叔虞之後。終言：「夫齊、秦、晉、楚，嘗有功於天下，而周衰并，亦必興矣。」</p><p><strong>所出</strong>：《史記 · 卷042》 — https://zh.wikisource.org/wiki/史記/卷042</p></article></main></div></div>
