    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 君子遠庖廚</nav></header><main><article><h1>君子遠庖廚</h1><p>見其生不忍見其死，聞其聲不忍食其肉</p><p>孟子言仁術之發端：君子之於禽獸也，見其生，不忍見其死；聞其聲，不忍食其肉。是以君子遠庖廚也。言惻隱之心，人皆有之，苟能充之，不忍一牛之觳觫，則可以王天下矣。</p><p><strong>所出</strong>：《孟子 · 梁惠王上》 — https://zh.wikisource.org/wiki/孟子/梁惠王上</p></article></main></div></div>
