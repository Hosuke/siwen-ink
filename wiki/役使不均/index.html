    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 役使不均</nav></header><main><article><h1>役使不均</h1><p>刺在上者遣役不平，苦樂懸隔。</p><p>《北山》之旨，在刺役使不均。詩人言己勤於王事而不得終養父母，以下大夫遣役不平，六章之中對比成辭，見苦樂之懸隔也。</p><p><strong>所出</strong>：《詩經 · 北山》 — https://zh.wikisource.org/wiki/詩經/北山</p></article></main></div></div>
