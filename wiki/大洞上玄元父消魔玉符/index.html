    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大洞上玄元父消魔玉符</nav></header><main><article><h1>大洞上玄元父消魔玉符</h1><p>青書白繒佩之，存呼元父內諱，叩齒咽液，所以鎮本命之根者也。</p><p>大洞上玄元父消魔玉符者，此章之符圖也。</p><p>經云：「大洞上玄元父消魔玉符。」「當青書白繒佩之，存呼元父內諱名字，鎮我本命之根。乃叩齒七通，咽液七過。」</p><p>又附口祝云：「天上內音，盈劫連，邕玉昇。地上外音，車離苦，去百毒。」</p><p>此符以青書於白繒，佩之於身，存呼上玄元父之內諱高同生、字左回明，叩齒七通、咽液七過，所以鎮胞胎大結、去百毒障礙者也。</p><p><strong>所出</strong>：《上清大洞真經 · 35章》 — https://zh.wikisource.org/wiki/上清大洞真經/35章</p></article></main></div></div>
