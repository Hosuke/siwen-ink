    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 一法而不求智固術而不慕信</nav></header><main><article><h1>一法而不求智固術而不慕信</h1><p>明主行法不求人智，守術不慕虛信，法度昭然，羣臣自不敢姦欺。</p><p>故明主之道，一法而不求智，固術而不慕信，故法不敗，而羣官無姦詐矣。</p><p><strong>所出</strong>：《韓非子 · 五蠹》 — https://zh.wikisource.org/wiki/韓非子/五蠹</p></article></main></div></div>
