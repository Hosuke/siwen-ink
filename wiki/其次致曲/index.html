    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 其次致曲</nav></header><main><article><h1>其次致曲</h1><p>致曲之誠亦能形著明動變化焉。</p><p>其次致曲，曲能有誠，誠則形，形則著，著則明，明則動，動則變，變則化，唯天下至誠為能化。</p><p><strong>所出</strong>：《中庸 · 中庸章句》 — https://zh.wikisource.org/wiki/四書章句集註/中庸章句</p></article></main></div></div>
