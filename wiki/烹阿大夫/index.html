    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 烹阿大夫</nav></header><main><article><h1>烹阿大夫</h1><p>威王明察治狀，烹不善治而譽日至之阿大夫，並誅其左右譽者。</p><p>威王召阿大夫，語之曰：「自子之守阿，譽言日聞。然使使視阿，田野不辟，民貧苦。昔日趙攻甄，子弗能救。衛取薛陵，子弗知。是子以幣厚吾左右以求譽也。」是日，烹阿大夫，及左右嘗譽者皆並烹之。遂起兵西擊趙、衛，敗魏於濁澤而圍惠王。</p><p><strong>所出</strong>：《史記 · 卷046》 — https://zh.wikisource.org/wiki/史記/卷046</p></article></main></div></div>
