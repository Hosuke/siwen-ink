    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 重祿重賞</nav></header><main><article><h1>重祿重賞</h1><p>以厚祿重賞激勵士卒致死之術</p><p>管子言：「湩然擊鼓，士忿怒。鎗然擊金，士帥然。筴桐鼓從之，輿死扶傷，爭進而無止。口滿用，手滿錢，非大父母之仇也，重祿重賞之所使也。」</p><p>軒冕立於朝，爵祿不隨，臣不爲忠；中軍行戰，委予之賞不隨，士不死其列陳。然則大臣執於朝，列陳之士執於賞。唯重祿重賞爲然耳，故能威絕域之民，不險山川而能服有恃之固，發若雷霆，動若風雨，獨出獨入，莫之能圉。</p><p><strong>所出</strong>：《管子 · 第80篇輕重甲》 — https://zh.wikisource.org/wiki/管子/第80篇輕重甲</p></article></main></div></div>
