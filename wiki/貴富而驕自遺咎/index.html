    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 貴富而驕自遺咎</nav></header><main><article><h1>貴富而驕自遺咎</h1><p>驕慢奢侈，必取覆亡。</p><p>貴富而驕，自遺咎也。言人處尊位據厚利，矜伐自恣，慢上陵物，咎殃所自招也。[[富貴而驕]]之謂已。戒在得志而行、不知收斂者也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章九》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
