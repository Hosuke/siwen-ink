    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蕭何為文終侯</nav></header><main><article><h1>蕭何為文終侯</h1><p>蕭何卒，諡為文終侯，子孫四世以罪失侯，天子複求其後封之。</p><p>孝惠二年，相國何卒，諡為文終侯。後嗣以罪失侯者四世，絕，天子輒複求何後，封續酇侯，功臣莫得比焉。夫蕭何功冠群臣，而子孫不能世守，數絕而複續，亦見漢室不忘元勳之德矣。</p><p><strong>所出</strong>：《史記 · 卷053》 — https://zh.wikisource.org/wiki/史記/卷053</p></article></main></div></div>
