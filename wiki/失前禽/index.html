    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 失前禽</nav></header><main><article><h1>失前禽</h1><p>舍逆取順，不追既往。</p><p>失前禽，謂放走在前之禽獸也。《比》九五「王用三驅，失前禽」，言天子田獵，三面驅圍，闕其一面，任禽自去。來者取之，去者不追。此象聖王之治天下，舍逆取順，不強致也。象辭云「舍逆取順，失前禽也」，逆者不來，順者自歸，不強取也。邑人不誡，亦由此來。</p><p><strong>所出</strong>：《周易 · 比》 — https://zh.wikisource.org/wiki/周易/比</p></article></main></div></div>
