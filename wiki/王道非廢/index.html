    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 王道非廢</nav></header><main><article><h1>王道非廢</h1><p>王道不廢，而天下莫敢窺者，以其正也。</p><p>王道非廢也，而天下莫敢窺者，王者之正也。衡庫者，天子之禮也。夫正者，秉公絕私，不偏不倚，故天下曆然莫敢犯焉。</p><p><strong>所出</strong>：《管子 · 爲兵之數》 — https://zh.wikisource.org/wiki/管子/七法/爲兵之數</p></article></main></div></div>
