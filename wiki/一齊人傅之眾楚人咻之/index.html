    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 一齊人傅之眾楚人咻之</nav></header><main><article><h1>一齊人傅之眾楚人咻之</h1><p>環境浸染之力，一人教之而眾咻之，雖日撻而求其齊，不可得也。</p><p>孟子謂戴不勝曰：「子欲子之王之善與？我明告子：有楚大夫於此，欲其子之齊語也，則使齊人傅諸？使楚人傅諸？」曰：「使齊人傅之。」曰：「一齊人傅之，眾楚人咻之，雖日撻而求其齊也，不可得矣。引而置之莊岳之間數年，雖日撻而求其楚，亦不可得矣。」</p><p><strong>所出</strong>：《孟子 · 滕文公下》 — https://zh.wikisource.org/wiki/孟子/滕文公下</p></article></main></div></div>
