    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 脣吻不滯</nav></header><main><article><h1>脣吻不滯</h1><p>文辭暢達，朗讀通暢，無礙口也。</p><p>繁約得正，華實相勝，脣吻不滯，則中律矣。文辭之美，不僅在意，亦在於聲。朗讀之際，脣吻之間，暢通無滯，斯為合法。律者，音律之法度也。</p><p><strong>所出</strong>：《文心雕龍 · 章表》 — https://zh.wikisource.org/wiki/文心雕龍/章表</p></article></main></div></div>
