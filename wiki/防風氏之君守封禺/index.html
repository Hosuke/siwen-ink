    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 防風氏之君守封禺</nav></header><main><article><h1>防風氏之君守封禺</h1><p>孔子言汪罔氏之君守封禺之山。</p><p>吳客曰：「防風何守？」仲尼曰：「汪罔氏之君守封、禺之山，為釐姓。在虞、夏、商為汪罔，於周為長翟，今謂之大人。」此孔子言古代汪罔氏之世系也。</p><p><strong>所出</strong>：《史記 · 卷047》 — https://zh.wikisource.org/wiki/史記/卷047</p></article></main></div></div>
