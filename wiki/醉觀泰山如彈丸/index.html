    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 醉觀泰山如彈丸</nav></header><main><article><h1>醉觀泰山如彈丸</h1><p>醉甚則視泰山如彈丸，見滄海如盤盂，比言酒亂心志之甚。</p><p>抱朴子詳述醉態之害，有云：「及其悶亂，若存若亡，視泰山如彈丸，見滄海如盤盂，仰噱天墮，俯呼地陷，臥待虎狼，投井赴火，而不謂惡也。」醉者神昏智亂，是非倒置，故以泰山之大而觀之若彈丸，以滄海之深而視之若盤盂，其害至於此。夫以視泰山如彈丸之頃，安能惜敬恭之禮、護喜怒之失哉？</p><p><strong>所出</strong>：《抱朴子 · 卷24》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷24</p></article></main></div></div>
