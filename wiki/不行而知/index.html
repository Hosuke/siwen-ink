    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不行而知</nav></header><main><article><h1>不行而知</h1><p>聖人不待外涉，內觀而周知。</p><p>老子云「聖人不行而知」。言聖人循道以居，虛靜內觀，天下之理不待遠涉而自知。蓋道之在人心，明燭萬物，本無待於行跡之廣。世人昧此，徒以足躒為知，故出彌遠而知彌少；聖人守其本，樞紐自理，所謂「不出戶，知天下」者，此之謂也。</p><p>[[其出彌遠其知彌少]]，乃常人之所以困；[[不出戶知天下]]，乃聖人之所以聖。不行而知，非閉塞於外，乃與道為體、與天為徒也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 四十七章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
