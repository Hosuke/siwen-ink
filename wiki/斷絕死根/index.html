    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 斷絕死根</nav></header><main><article><h1>斷絕死根</h1><p>斷死戶之根，上生玉房受位金仙</p><p>斷絕死根，大洞祝詞所言解脫死籍之法也。</p><p>高上玉清王祝云「斷絕死根」，言學者存思天真，斷絕死戶之根株，使不侵擾，則上生玉房，受位金仙，長守命戶，不入死門。</p><p><strong>所出</strong>：《上清大洞真經 · 22章》 — https://zh.wikisource.org/wiki/上清大洞真經/22章</p><hr><p>《瓊室章》言「忽之禍鄉三靈歿」，又言「斷絕死根」，皆以精亡液漏為死根，守一閉景乃可絕之。</p><p>  <strong>所出</strong>：《黃庭內景經 · 瓊室章第二十一》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/瓊室章第二十一</p></article></main></div></div>
