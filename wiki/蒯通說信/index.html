    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蒯通說信</nav></header><main><article><h1>蒯通說信</h1><p>蒯通以計說韓信襲齊，以亂齊驕淮陰。</p><p>太史公曰：「甚矣蒯通之謀，亂齊驕淮陰，其卒亡此兩人！」蒯通者，善為長短說，論戰國之權變，為八十一首。通善齊人安期生，安期生嘗干項羽，項羽不能用其筴。已而項羽欲封此兩人，兩人終不肯受，亡去。</p><p>蒯通說韓信襲齊，遂破田橫，烹酈生，又驕淮陰侯以激怒之。亂齊之謀，出自蒯通，故太史公深歎其智計之妙。</p><p><strong>所出</strong>：《史記 · 卷094》 — https://zh.wikisource.org/wiki/史記/卷094</p></article></main></div></div>
