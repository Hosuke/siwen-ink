    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 徵聖宗經</nav></header><main><article><h1>徵聖宗經</h1><p>文以聖人為準，聖人之心見乎經，故為文必宗經也。</p><p>《征聖》云：「論文必徵於聖，窺聖必宗於經。」徵於聖者，取聖人為標準也；宗於經者，求聖意之歸宿也。《易》稱「辨物正言」，《書》云「辭尚體要」——正言者，所以立辯也；體要者，所以成辭也。辭成無好異之尤，辯立有斷辭之義。體要與微辭偕通，正言共精義並用——此聖人文章之全也。學者欲窺聖人之文，舍經何從哉？</p><p><strong>所出</strong>：《文心雕龍 · 征聖》 — https://zh.wikisource.org/wiki/文心雕龍/徵聖</p></article></main></div></div>
