    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 陶冶有法度</nav></header><main><article><h1>陶冶有法度</h1><p>修煉陶鑄自有法度，未可悉陳，聊述綱紀枝條。</p><p>陶冶有法度，未可悉陳敷。略述其綱紀，枝條見扶疏。</p><p>陶冶者，修煉之功；法度者，火候節次之準則也。其道至妙，未可以言辭盡陳，唯略述大要以示津涯，使學者得由枝條而窺根本。[[火記]]所趣，正在乎此。</p><p><strong>所出</strong>：《周易參同契 · 13章》 — https://zh.wikisource.org/wiki周易參同契/13章</p></article></main></div></div>
