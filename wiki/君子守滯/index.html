    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 君子守滯</nav></header><main><article><h1>君子守滯</h1><p>君子懷抱正道，寧居陋巷而不肯屈身苟合。</p><p>抱朴子述體道合真之士曰：「所以體道合真，嶷然特立，才遠量逸，懷霜履冰，思綿天地，器兼元凱，執經衡門，淵渟嶽立。寧潔身以守滯，恥脅肩以茍合。樂饑陋巷，以勵高尚之節；藏器全真，以待天年之盡。」</p><p><strong>所出</strong>：《抱朴子 · 卷20》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷20</p></article></main></div></div>
