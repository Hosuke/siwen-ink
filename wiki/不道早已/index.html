    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不道早已</nav></header><main><article><h1>不道早已</h1><p>不合於道者，速滅而已。</p><p>物壯而老，是謂之不道，不道蚤已。「[[物壯則老]]」言物至壯大必趨於老；帛書作「壯而老」，辭氣更峻。「不道」者，失道之物也；[[不道早已]]言其亡無日也。[[物壯而老]]言其始，不道早已言其終：始壯而老，終違道速亡，二義相承，以戒逞強者。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第七十四章 不強》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
