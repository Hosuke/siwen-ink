    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天道之極</nav></header><main><article><h1>天道之極</h1><p>天道至公，遠者自親；人事至私，近則造怨。</p><p>天道之極，遠者自親；人事之起，近親造怨。天之道，無私於物，無遠近之別也。巧者有餘，拙者不足，皆自然而然，非有私也。順天者天助之，逆天者天圍之。天之所助，雖小必大；天之所圍，雖成必敗。萬物之於人也，無私近也，無私遠也。此天道之極也。人事則反是，親者或致怨，密者或生嫌，故曰近親造怨。所以然者，人以私害公，以利破義也。</p><p><strong>所出</strong>：《管子 · 第02篇形勢》 — https://zh.wikisource.org/wiki/管子/第02篇形勢</p></article></main></div></div>
