    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 經脈者所以決死生</nav></header><main><article><h1>經脈者所以決死生</h1><p>經脈之要，在乎決死生、處百病、調虛實，不可不通。</p><p>黃帝告雷公曰：「經脈者，所以能決死生，處百病，調虛實，不可不通。」此一言，為十二經脈之總義。經脈乃氣血運行之路，人之生，病之成，人之治，病之起，靡不系焉。粗工以為易，上工以為難，故學者必始於此，工者必止於此。</p><p><strong>所出</strong>：《黃帝內經 · 靈樞第三卷》 — https://zh.wikisource.org/wiki/黃帝內經/靈樞第三卷</p></article></main></div></div>
