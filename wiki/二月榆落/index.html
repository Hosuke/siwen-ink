    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 二月榆落</nav></header><main><article><h1>二月榆落</h1><p>言仲春之月榆莢隕落，刑德會卯之象。</p><p>二月榆落，魁臨于卯。</p><p>卯仲春之月。仲春之時，陽德方盛，榆莢隕落，是陰刑之氣受制而不為災也。魁者北斗之宿，斗柄指卯，則刑德之位定矣。</p><p><strong>所出</strong>：《周易參同契 · 29章》 — https://zh.wikisource.org/wiki/周易參同契/29章</p></article></main></div></div>
