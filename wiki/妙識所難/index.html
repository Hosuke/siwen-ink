    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 妙識所難</nav></header><main><article><h1>妙識所難</h1><p>詩之道，妙識其難則易至，忽以為易則難來也。</p><p>「若妙識所難，其易也將至；忽以為易，其難也方來。」作詩之道，深知其難而謹慎趨之，則化難為易；輕忽其難而妄行之，則難關難越。此劉勰論詩藝之要語也。</p><p><strong>所出</strong>：《文心雕龍 · 明詩》 — https://zh.wikisource.org/wiki/文心雕龍/明詩</p></article></main></div></div>
