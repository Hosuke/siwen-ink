    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 狀列辭諺</nav></header><main><article><h1>狀列辭諺</h1><p>狀列辭諺，書記之一體，萬民達志之書。</p><p>書記廣大，萬民達志，則有[[狀列辭諺]]。</p><p>狀者，貌也。體貌本原，取其事實，先賢表謚，並有行狀，狀之大者也。列者，陳也。陳列事情，昭然可見也。辭者，舌端之文，通己於人。[[子產]]有辭，諸侯所賴，不可已也。諺者，直語也。喪言亦不及文，故弔亦稱諺。廛路淺言，有實無華。[[鄒穆公]]-{云}-「囊漏儲中」，皆其類也。</p><p>夫文辭鄙俚，莫過於諺，而聖賢詩書，採以為談，況逾於此，豈可忽哉！</p><p><strong>所出</strong>：《文心雕龍 · 書記》 — https://zh.wikisource.org/wiki/文心雕龍/書記</p></article></main></div></div>
