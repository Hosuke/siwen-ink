    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 采采芣苢</nav></header><main><article><h1>采采芣苢</h1><p>反覆詠采芣苢之樂，詩意在聲調，不在語義。</p><p>《芣苢》三章，章四句，全詩皆疊「采采芣苢」之辭，反覆詠唱。詩意不在語義之層面，而在輕快之和聲。古人云：「采芣苢呀采芣苢，採呀採，採芣苢收起來。」蓋其旨以聲韻之和，見性情之正，與[[后妃樂有子]]相終始也。</p><p><strong>所出</strong>：《詩經 · 芣苢》 — https://zh.wikisource.org/wiki/詩經/芣苢</p></article></main></div></div>
