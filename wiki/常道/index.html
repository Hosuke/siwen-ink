    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 常道</nav></header><main><article><h1>常道</h1><p>仁義忠信廉潔財辯，用之不得其術，皆足以亡國、獲罪、暴民、罹禍。</p><p>仁義者常行之道，行之不得其術，以至於亡國。忠信者常用之道，用之不得其術，以至於護罪。廉潔者常守之道，守之不得其術，以至於暴民。財辯者常禦之道，禦之不得其術，以至於罹禍。蓋拙在用於人，巧在用於身。使民親稼則怨，誡民輕食則怒。夫餌者魚之嗜，膻者蟻之慕，以餌投魚魚必以懼，以膻投蟻蟻必去，由不得化之道。</p><p><strong>所出</strong>：《化書 · 卷三》 — https://zh.wikisource.org/wiki/化書/卷三</p></article></main></div></div>
