    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 孰能濁以靜之，徐清</nav></header><main><article><h1>孰能濁以靜之，徐清</h1><p>靜以澄濁，濁去則清自來。</p><p>孰能濁以靜之，徐清。夫濁者，世之情偽也；靜者，聖人之持守也。以靜澄濁，則濁之既澄，清乃徐至，所謂無為之清虛者也。</p><p><strong>所出</strong>：《老子河上公章句 · 顯德》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
