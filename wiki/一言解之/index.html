    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 一言解之</nav></header><main><article><h1>一言解之</h1><p>聖人一言之解，上察於天，下察於地，萬物備矣。</p><p>是故聖人一言解之，上察於天，下察於地。</p><p>夫聖人之所以能一言而解萬事者，以其心與天地相通也。上之天也，無私覆焉；下之地也，無私載焉。聖人之心，上法天之虛，下法地之靜，其視萬物，猶吾心之發也。其言一出，而天地之理以明，萬物之宜以定，此所以為聖人之言也。</p><p>德蕩乎名乎。</p><p><strong>所出</strong>：《管子 · 第37篇心術下》 — https://zh.wikisource.org/wiki/管子/第37篇心術下</p></article></main></div></div>
