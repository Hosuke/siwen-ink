    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 玄冥</nav></header><main><article><h1>玄冥</h1><p>北方水神，張衡羽獵困玄冥於朔野，夸飾失實</p><p>玄冥，北方水神也。[[張衡]]《羽獵》云「困玄冥於朔野」，以玄冥為可困之人，是夸飾之失實者也。水神不可以力困，而困之者非實事，此[[名實兩乖]]之例也。</p><p><strong>所出</strong>：《文心雕龍 · 夸飾》 — https://zh.wikisource.org</p></article></main></div></div>
