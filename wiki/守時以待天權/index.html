    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 守時以待天權</nav></header><main><article><h1>守時以待天權</h1><p>王者歲守十分之三，凶旱水泆，民無入溝壑者。</p><p>湯七年旱，禹五年水，民無𥼷而賣子。湯以莊山之金、禹以歷山之金鑄幣贖之，而歸咎於「天權失」。是以王者歲守十分之參，三年與少半成歲，三十一年而藏十一年，與少半藏參之，一不足以傷民，而農夫敬事力作，故天毀埊凶旱水泆，民無入於溝壑乞請者。此守時以待天權之道，治國之要也。</p><p><strong>所出</strong>：《管子 · 第75篇山權數》 — https://zh.wikisource.org/wiki/管子/第75篇山權數</p></article></main></div></div>
