    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 誦詩書者期於通道略物</nav></header><main><article><h1>誦詩書者期於通道略物</h1><p>讀書貴在通曉大道、明辨物理，不在泥古。</p><p>[[通人則不然]]云：「通人則不然。服劍者期於銛利，而不期於墨陽、莫邪；乘馬者期於千里，而不期於騏驥、綠耳；鼓琴者期於鳴廉修營，而不期於濫肋、號鍾；誦詩書者期於通道略物，而不期於洪範、商頌。」</p><p>聖人見是非，若白黑之於目辨，清濁之於耳聽。眾人則不然。中無主以受之，譬若遺腹子之上隴，以禮哭泣之，而無所歸心。</p><p><strong>所出</strong>：《淮南子 · 脩務訓》 — https://zh.wikisource.org/wiki淮南子/脩務訓</p></article></main></div></div>
