    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 辟言不信</nav></header><main><article><h1>辟言不信</h1><p>正言合法而不见信，枉道事人者得進也。</p><p>「如何昊天，辟言不信？」辟言者，法度之言、正辟之言也。詩人仰天而歎，謂昊天何為如此，使正法之言不得見信於世耶？言幽王虐政，天示之象，而王不知戒；臣有法度之言以諫者，王皆不聽也。下云「如彼行邁，則靡所臻」，以行為喻，言使我如彼行道之人，不知所至也。</p><p><strong>所出</strong>：《詩經 · 雨無正》 — https://zh.wikisource.org/wiki/詩經/雨無正</p></article></main></div></div>
