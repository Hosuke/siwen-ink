    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 胞胎受氣之初</nav></header><main><article><h1>胞胎受氣之初</h1><p>形稟之始，定於交合</p><p>胞胎受氣之初，男女之形已定。言[[交媾定置始先]]，此之謂也。[[男生而伏]][[女偎其軀]]，生死不易其稟，皆於父母交合之始而定焉。</p><p><strong>所出</strong>：《周易參同契 · 26章》 — https://zh.wikisource.org/wiki/周易參同契/26章</p></article></main></div></div>
