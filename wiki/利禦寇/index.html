    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 利禦寇</nav></header><main><article><h1>利禦寇</h1><p>夫婦失道之時宜以順德相保守</p><p>九三：鴻漸-{于}-陸，夫征不復，婦孕不育，凶；利禦寇。</p><p>象曰：「利用禦寇，順相保也。」</p><p>夫行而不返，婦有孕而不能育，此夫婦失道之象也。然六三處下卦之上，與上九為正應，其-{間}-有寇焉。九三以陽居陽，剛而得位，足以-{禦}-之。象-{云}-順相保者，夫婦以順道相保守，則寇不能侵也。</p><p><strong>所出</strong>：《周易 · 漸》 — https://zh.wikisource.org/wiki/周易/漸</p></article></main></div></div>
