    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 舜焚廩穿井</nav></header><main><article><h1>舜焚廩穿井</h1><p>瞽瞍與象數欲殺舜，舜以智脫難。</p><p>瞽瞍尚復欲殺之，使舜上塗廩，瞽瞍從下縱火焚廩。舜乃以兩笠自扞而下，去，得不死。後又使舜穿井，井爲匿空旁出。既入深，舜與象共下土實井，舜從匿空出，去。瞽瞍、象喜，以爲己死。舜曰：「本謀者象。」與其父母分，於是曰：「妻二女與琴，取之；牛羊倉廩，予父母。」乃止宮居，鼓其琴。往見之，象鄂不懌，曰：「我思正鬱陶！」舜曰：「然，爾其庶矣！」</p><p><strong>所出</strong>：《史記 · 卷001》 — https://zh.wikisource.org/wiki/史記/卷001</p></article></main></div></div>
