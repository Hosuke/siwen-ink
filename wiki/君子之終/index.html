    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 君子之終</nav></header><main><article><h1>君子之終</h1><p>君子以謙德而得善終。</p><p>《彖》曰「君子之終也」，承上文而言。謙者，天道福之，鬼神祐之，人心歸之，故君子守謙，則有始有終而善保其身。</p><p><strong>所出</strong>：《周易 · 謙》 — https://zh.wikisource.org/wiki/周易/謙</p></article></main></div></div>
