    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 士見大夫</nav></header><main><article><h1>士見大夫</h1><p>士之於大夫，終辭其摯，但受其辱拜之禮。</p><p>士之於大夫，位卑不敢受其摯，故終辭之。然於大夫之入，必一拜其辱，示敬也。賔退，主人送再拜。此所以別尊卑、序交際者也。</p><p>若甞為臣者見主人，則恩義又有別焉。主人辭摯，曰：「某也辭，不得命，不敢固辭。」賔入，奠摯，再拜。主人答以一拜而已，不答再拜，蓋厚於舊臣之恩，而殺其拜數也。</p><p><strong>所出</strong>：《儀禮 · 士相見禮》 — https://zh.wikisource.org/wiki/儀禮/士相見禮</p></article></main></div></div>
