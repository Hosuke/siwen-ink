    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 王仲甫</nav></header><main><article><h1>王仲甫</h1><p>吸景餐霞四十年無益，因病治身，十八年仙去。</p><p>王仲甫，不知何所人。少好意事神明，常吸二景餐霞之法。四十餘年，都不覺益。其子亦服之，足十八年白日昇天。後[[南嶽真人]]降而教之曰：「子所以不得昇度者，子身有大病，腦宮虧臟，筋液不注，靈津赤溢。雖復接景餐霞，故未為身益。」仲甫遂依教服藥治病，兼修其事。又十八年，白日昇天，今在玄洲，受書為[[中嶽真人]]。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 34》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/34</p></article></main></div></div>
