    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 曾不崇朝</nav></header><main><article><h1>曾不崇朝</h1><p>不及半日可至；言路近而事易，無待遠求。</p><p>崇朝者，一早晨也。詩言宋遠，而一崇朝可至者，以其志不在遠故也。夫欲歸之心切，則咫尺若天涯；欲見之心誠，則跬步如千里。崇朝之近，正詩人歸思之殷也。</p><p><strong>所出</strong>：《詩經 · 河廣》 — https://zh.wikisource.org/wiki/詩經/河廣</p></article></main></div></div>
