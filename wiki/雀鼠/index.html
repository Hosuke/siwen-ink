    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 雀鼠</nav></header><main><article><h1>雀鼠</h1><p>言上下各有所切，相奪相怨，終至於相讎。</p><p>人所以惡雀鼠者，謂其有攘竊之行；雀鼠所以疑人者，謂其懷盜賊之心。夫上以食而辱下，下以食而欺上，上下得不惡下，下不得不疑上，各有所切也。</p><p>夫剜其肌、啖其肉，不得不哭；扼其喉、奪其哺，不得不怒。民之瘠也由剜其肌，民之餒也由奪其哺。嗚呼，惜哉！</p><p>言上以威奪下，下以巧欺上，上下交怨，而民之瘠餒，實由上之剜肌奪哺也。</p><p><strong>所出</strong>：《化書 · 卷五》 — https://zh.wikisource.org/wiki/化書/卷五</p></article></main></div></div>
