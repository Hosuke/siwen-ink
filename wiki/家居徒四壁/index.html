    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 家居徒四壁</nav></header><main><article><h1>家居徒四壁</h1><p>相如與文君歸成都，家中空虛，唯四壁而已，極言其貧。</p><p>文君夜亡奔相如，相如乃與馳歸成都。家居徒四壁立。</p><p><strong>所出</strong>：《史記 · 卷117》 — https://zh.wikisource.org/wiki/史記/卷117</p></article></main></div></div>
