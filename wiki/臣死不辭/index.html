    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 臣死不辭</nav></header><main><article><h1>臣死不辭</h1><p>樊噲言事急之際，死且不避，況卮酒乎。</p><p>項羽壯其人，賜之卮酒彘肩。樊噲既飲酒，拔劍切肉食，盡之。項羽曰：「能復飲乎？」噲曰：「臣死且不辭，豈特卮酒乎！」</p><p>樊噲言「臣死且不辭」，蓋以[[沛公先入定咸陽|沛公暴師霸上]]以待項羽，斥其隙之非，詞氣慷慨，有卻敵折衝之風。</p><p><strong>所出</strong>：《史記 · 卷095》 — https://zh.wikisource.org/wiki/史記/卷095</p></article></main></div></div>
