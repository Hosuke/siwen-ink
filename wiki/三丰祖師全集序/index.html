    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三丰祖師全集序</nav></header><main><article><h1>三丰祖師全集序</h1><p>汪錫齡序，言隱見之道，丹經詩文之由來。</p><p>古來一隱一見，而不失其正道者，其惟至人乎？能隱而不能見，則閒冷之意深，於世無益也；能見而不能隱，則消磨之日甚，於己無成也。</p><p>雖然，出而霖雨，入而煙霞，豈遂枯寂無爲乎？抑非也？上眞隱世復度世，見人不附人，是又隱見之神奇者耳。</p><p>我[[三丰祖師]]，具知幾之明，存正誼之理。其爲[[儒]]道也，身可進亦可退；其爲[[仙]]道也，身能飛亦能濳。進退飛濳之間，卽猶龍之大道也。</p><p><strong>所出</strong>：《張三丰先生全集 · 卷1》 — https://zh.wikisource.org/wiki/張三丰先生全集/卷1</p></article></main></div></div>
