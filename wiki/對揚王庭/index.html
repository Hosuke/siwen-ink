    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 對揚王庭</nav></header><main><article><h1>對揚王庭</h1><p>章表之用，在於對答君命，昭明心曲。</p><p>原夫章表之為用也，所以對揚王庭，昭明心曲。既其身文，且亦國華。臣之事君，陳情述事，非徒宣之於口，必書之於簡策，以章以表，達於朝廷者也。</p><p><strong>所出</strong>：《文心雕龍 · 章表》 — https://zh.wikisource.org/wiki/文心雕龍/章表</p></article></main></div></div>
