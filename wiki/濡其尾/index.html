    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 濡其尾</nav></header><main><article><h1>濡其尾</h1><p>初九爻辭，言狐涉水濡尾而不能登陸，以況初始行事者貴在慎終。</p><p>又見於未濟卦：「小狐汔濟，濡其尾，無攸利。」象曰：「濡其尾，亦不知極也。」極者，終也，限度也。小狐之濡尾，以其不知止止之時，不能忖度深淺而進退有節。《[[知進退存亡而不失其正]]》者，乃聖人之操。《[[濡首]]》之戒，亦此意也。</p><p>  <strong>所出</strong>：《周易 · 未濟》 — https://zh.wikisource.org/wiki/周易/未濟</p></article></main></div></div>
