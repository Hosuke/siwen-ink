    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 守法之臣為釜鬵之行</nav></header><main><article><h1>守法之臣為釜鬵之行</h1><p>守法之臣若行姦，則法在胸中而禁姦之具失矣。</p><p>今夫水之勝火亦明矣，然而釜鬵間之，水煎沸竭盡其上，而火得熾盛焚其下，水失其所以勝者矣。今夫治之禁姦又明於此，然守法之臣為釜鬵之行，則法獨明於胷中，而已失其所以禁姦者矣。</p><p><strong>所出</strong>：《韓非子 · 備內》 — https://zh.wikisource.org/wiki/韓非子/備內</p></article></main></div></div>
