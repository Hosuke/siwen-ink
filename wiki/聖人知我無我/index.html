    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖人知我無我</nav></header><main><article><h1>聖人知我無我</h1><p>聖人知五者之無我，乃以仁義禮智信同之。</p><p>聖人知我無我，故同之以仁；知事無我，故權之以義；知心無我，故戒之以禮；知識無我，故照之以智；知言無我，故守之以信。</p><p><strong>所出</strong>：《關尹子 · 3》 — https://zh.wikisource.org/wiki/關尹子/3</p></article></main></div></div>
