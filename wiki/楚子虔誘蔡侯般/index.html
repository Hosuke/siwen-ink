    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 楚子虔誘蔡侯般</nav></header><main><article><h1>楚子虔誘蔡侯般</h1><p>楚子虔誘殺蔡侯般于申，蔡遂為楚所圍。</p><p>楚子虔誘蔡侯般，殺之于申。</p><p>傳曰：「何為名之也？夷狄之君，誘中國之君而殺之，故謹而名之也。稱時、稱月、稱日、稱地，謹之也。」楚以詭道劫殺蔡君，非正刑討罪，故聖人謹而名之，以著其惡。</p><p><strong>所出</strong>：《春秋穀梁傳 · 昭公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/昭公</p></article></main></div></div>
