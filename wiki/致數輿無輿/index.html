    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 致數輿無輿</nav></header><main><article><h1>致數輿無輿</h1><p>求譽反無譽，不欲如玉當如石</p><p>故致數輿無輿，不欲琭琭如玉，珞珞如石。</p><p>[[致數輿無輿]]，言世人競求譽譽而反無譽。聖人則不欲琭琭如玉之璀璨可貴，寧若珞珞如石之堅確不渝。是以賤為本、樸為貴，與物無競也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 三十九章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
