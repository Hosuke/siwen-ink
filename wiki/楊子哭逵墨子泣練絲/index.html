    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 楊子哭逵墨子泣練絲</nav></header><main><article><h1>楊子哭逵墨子泣練絲</h1><p>楊朱見歧路而悲，墨翟見練絲而泣，懼其亂也。</p><p>楊子見逵路而哭之，為其可以南可以北；墨子見練絲而泣之，為其可以黃可以黑。</p><p>夫物之變化，歧者不可以妄趨，絲之染者不可以妄受。聖人觀此而立行，故能不惑於所往。</p><p><strong>所出</strong>：《淮南子 · 說林訓》 — https://zh.wikisource.org/wiki/淮南子/說林訓</p></article></main></div></div>
