    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 辯是中非</nav></header><main><article><h1>辯是中非</h1><p>襍物撰德辯是與非，非其中爻莫之備。</p><p>故襍物撰德辯是與非，則非其中爻莫之備矣。云[[有孚窒惕中吉剛來而得中]]，[[困云貞大人吉以剛中]]之例是也。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷10》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷10</p></article></main></div></div>
