    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 小過</nav></header><main><article><h1>小過</h1><p>卦名。艮下震上，象小山上有雷聲，論小有過失之義。</p><p>小過，震上艮下。山上雷聲，過而不暴，故名小過。卦辭曰：「亨。利貞。可小事，不可大事。飛鳥遺之音，不宜上宜下，大吉。」蓋小事可成，大事難舉。柔得中位，故小事吉；剛失位不中，故大事凶。飛鳥之象，逆而上則凶，順而下則吉。是以君子法之，行過乎恭，喪過乎哀，用過乎儉，皆小過之美，非大過之愆也。</p><p><strong>所出</strong>：《周易 · 小過》 — https://zh.wikisource.org/wiki/周易/小過</p></article></main></div></div>
