    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 琴高</nav></header><main><article><h1>琴高</h1><p>趙人，能鼓琴，行涓彭之術，浮遊二百餘年，後入涿水取龍子，與弟子期，乘赤鯉來祠中。</p><p>琴高，趙人。能鼓琴，為宋康王舍人。行涓、彭之術浮遊冀州涿一作碼郡問二百餘年，後辭，入涿水取龍子。</p><p>與諸弟子期，期日皆齋潔待於水傍，設祀果，乘赤鯉來至祠中，且有萬人觀之，留一月入水去。今宣州有琴高釣臺。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 3》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/3</p></article></main></div></div>
