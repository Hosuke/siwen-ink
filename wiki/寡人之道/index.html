    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 寡人之道</nav></header><main><article><h1>寡人之道</h1><p>當世為政者厚斂久師，使民凍餓離散，此乃減人之道，非治國之術。</p><p><strong>寡人之道</strong>者，墨子批判當世為政者之辭也。聖王為法，欲民之蕃；當世為政，適得其反。</p><p>墨子言其弊端：「其使民勞，其籍斂厚，民財不足，凍餓死者不可勝數。」又言：「大人惟毋興師以攻伐鄰國，久者終年，速者數月，男女久不相見，此所以寡人之道也。」居處不安、飲食不時、作疾病死者，攻城野戰死者，皆不可勝數。</p><p>此皆當世為政者所以「寡人之道數術而起」者也。與聖王之[[嫁娶之法]]、去無用之務相反，乃人口減少之根由。墨子以此見當世之非，欲人君去無用之務，行聖王之道，以興天下之大利焉。</p></article></main></div></div>
