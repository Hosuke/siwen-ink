    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 善與惡之分</nav></header><main><article><h1>善與惡之分</h1><p>善者正理平治，惡者偏險悖亂。</p><p>凡古今天下之所謂善者，正理平治也；所謂惡者，偏險悖亂也。是善惡之分也已。今誠以人之性固正理平治邪？則有惡用聖王，惡用禮義哉！今不然，人之性惡。故古者聖人以人之性惡，以為偏險而不正、悖亂而不治，故為之立君上之埶以臨之，明禮義以化之，起法正以治之，重刑罰以禁之，使天下皆出於治，合於善也。[[正理平治]]與[[偏險悖亂]]，善惡之辨明矣。</p><p><strong>所出</strong>：《荀子 · 性惡篇》 — https://zh.wikisource.org/wiki/荀子/性惡篇</p></article></main></div></div>
