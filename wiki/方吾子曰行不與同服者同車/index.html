    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 方吾子論同服不同車</nav></header><main><article><h1>方吾子論同服不同車</h1><p>君子之行施有等，人君不可以權勢假人。</p><p>方吾子曰：「吾聞之古禮：行不與同服者同車，不與同族者共家，而況君人者乃借其權而外其勢乎！」此言古人於行止、衣服、車乘、居室皆有差等，不可紊亂。況人主之權勢乎？借之於人，是以外之也。外之則威褻，威褻則下侵其上，而國柄失矣。[[威勢者君之筋力]]，以是不能假人。《說文》有「借」字，蓋假借之義，正與此相發明也。</p><p><strong>所出</strong>：《韓非子 · 外儲說右下》 — https://zh.wikisource.org/wiki/韓非子/外儲說右下</p></article></main></div></div>
