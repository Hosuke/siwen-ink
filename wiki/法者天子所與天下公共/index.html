    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 法者天子所與天下公共</nav></header><main><article><h1>法者天子所與天下公共</h1><p>張釋之論法為天下公器，天子不得以私意輕重之。</p><p>一人犯蹕，當罰金。文帝怒曰：「此人親驚吾馬，吾馬賴柔和，令他馬，固不敗傷我乎？而廷尉乃當之罰金！」釋之曰：「法者，天子所與天下公共也。今法如此而更重之，是法不信於民也。且方其時，上使立誅之則已。今既下廷尉，廷尉，天下之平也，一傾而天下用法皆為輕重，民安所錯其手足？唯陛下察之。」良久，上曰：「廷尉當是也。」</p><p><strong>所出</strong>：《史記 · 卷102》 — https://zh.wikisource.org/wiki/史記/卷102</p></article></main></div></div>
