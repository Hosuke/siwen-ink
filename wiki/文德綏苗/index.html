    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 文德綏苗</nav></header><main><article><h1>文德綏苗</h1><p>征伐不服恃威，而感化有苗在修德，不在力征。</p><p>禹之征有苗也，三旬而不服。益贊於禹，申[[得眾動天]]之義。禹拜昌言，班師振旅。</p><p>帝舜[[無怠無荒|誕敷文德]]，舞干羽於兩階。七旬而有苗格。</p><p>[[文德綏苗]]者，言修德以來遠人，不恃威力也。有苗之不庭，始以征伐，終以文德。干羽之舞，非示之以威，乃化之以德也。</p><p>是故[[無怠無荒|有苗之格]]，不在三旬之兵，在七十日之文德。善政之效，豈一朝一夕之功哉。</p><p><strong>所出</strong>：《尚書 · 大禹謨》 — https://zh.wikisource.org/wiki/尚書/大禹謨</p></article></main></div></div>
