    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 旅瑣瑣</nav></header><main><article><h1>旅瑣瑣</h1><p>羈旅之人行止卑賤，自貽伊戚。</p><p>旅瑣瑣，斯其所取災。象曰：「志窮災也。」初六陰柔失位，當旅之初，行止瑣細卑賤，以斯者如此，其取災也宜矣。</p><p><strong>所出</strong>：《周易 · 旅》 — https://zh.wikisource.org/wiki/周易/旅</p></article></main></div></div>
