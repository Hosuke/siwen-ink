    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 魄以鈐魂</nav></header><main><article><h1>魄以鈐魂</h1><p>魄制魂而不淫，魂馭魄而不散，二者相制乃成真人之道。</p><p>魄以鈐魂者，魂動而魄制之之謂也。魄屬陰，魂屬陽，魂易飛而魄易滯，故魄以鈐魂，使不得淫奢。脩煉之士，魂魄相守，魂不遊於外，魄不溺於欲，則精神凝一，可以長生。若魂魄相離，則魂馳魄散，奚望長久之功。此章言「魄以鈐魂」者，示內脩之法，當使魄制魂而不使魂淫，二者各得其和，乃為善也。</p><p><strong>所出</strong>：《周易參同契 · 27章》 — https://zh.wikisource.org/wiki/周易參同契/27章</p></article></main></div></div>
