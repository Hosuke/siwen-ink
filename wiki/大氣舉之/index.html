    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大氣舉之</nav></header><main><article><h1>大氣舉之</h1><p>地為人之下，太虛之中，大氣舉之，燥暑風濕寒火六氣迭主。</p><p>地者，人之之下，太虛之中者也。大氣舉之也。</p><p>燥以乾之，暑以蒸之，風以動之，濕以潤之，寒以堅之，火以溫之。</p><p>故風寒在下，燥熱在上，濕氣在中，火遊行其間，寒暑六入，故令虛而生化也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第十九卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十九卷</p></article></main></div></div>
