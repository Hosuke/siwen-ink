    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 厚葬非慈親孝子之心</nav></header><main><article><h1>厚葬非慈親孝子之心</h1><p>葬所愛所重而以生者之所甚欲，非慈親孝子之心也。</p><p>今世俗大亂之主愈侈，其葬則心非為乎死者慮也，生者以相矜尚也。侈靡者以為榮，節儉者以為陋，不以便死為故，而徒以生者之誹譽為務，此非慈親孝子之心也。</p><p>父雖死，孝子之重之不怠；子雖死，慈親之愛之不懈。夫葬所愛所重，而以生者之所甚欲，其以安之也，若之何哉？</p><p><strong>所出</strong>：《呂氏春秋 · 卷十》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十</p></article></main></div></div>
