    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蒲人止孔子</nav></header><main><article><h1>蒲人止孔子</h1><p>蒲地人阻止孔子去衞。</p><p>過蒲，會公叔氏以蒲畔，蒲人止孔子。弟子有公良孺者，以私車五乘從孔子……蒲人懼，謂孔子曰：「苟毋適衞，吾出子。」與之盟，出孔子東門。孔子遂適衞。此孔子過蒲被阻之事也。</p><p><strong>所出</strong>：《史記 · 卷047》 — https://zh.wikisource.org/wiki/史記/卷047</p></article></main></div></div>
