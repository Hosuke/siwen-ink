    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 堯舜湯文之舉賢</nav></header><main><article><h1>堯舜湯文之舉賢</h1><p>聖王能拔奇才於卑賤，故能成一代之功。</p><p>抱朴子贊明主之效云：「故能勛業隆濟，拓境服遠，取威定功，垂統長世也。」又言堯舜湯文能「舉賢」。</p><p><strong>所出</strong>：《抱朴子 · 卷20》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷20</p></article></main></div></div>
