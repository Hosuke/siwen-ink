    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 七玄</nav></header><main><article><h1>七玄</h1><p>七玄英華，開命門而通天根。</p><p>七玄者，七竅之神玄也。目為肝竅，耳為腎竅，鼻為肺竅，舌為心竅，口為脾竅，身為形竅，意為神竅。玄者幽微難測之謂，七竅通明則神玄自現。</p><p>《肝氣章》云「七玄英華開命門」，言肝氣充盈則七竅煥明，命門洞開，天道通利，玄根可存。命門者，兩腎之間，藏精之所；玄根者，元始之根，神明之原。</p><p>存思七玄，閉目內眄，使心神還崇，各返其根，七竅通暢，則精華內斂，命門洞朗，天道不遠，此長生之要道也。</p><p><strong>所出</strong>：《黃庭內景經 · 肝氣章第三十三》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/肝氣章第三十三</p></article></main></div></div>
