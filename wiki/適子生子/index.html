    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 適子生子</nav></header><main><article><h1>適子生子</h1><p>胎教之方及三日負子之禮</p><p>妻將生子，及月辰，居側室。夫使人日再問之。</p><p>子生，男子設弧於門左，女子設帨於門右。三日，始負子，男射女否。</p><p>三月之末，擇日剪髮為鬌，男角女羈。妻以子見於父，父執子之右手，咳而名之。</p><p>由命士以上及大夫之子，旬而見。冢子未食而見，必執其右手；適子庶子已食而見，必循其首。</p><p><strong>所出</strong>：《禮記 · 內則》 — https://zh.wikisource.org/wiki/禮記/內則</p></article></main></div></div>
