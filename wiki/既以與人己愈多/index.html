    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 既以與人己愈多</nav></header><main><article><h1>既以與人己愈多</h1><p>聖人施之彌廣，其得彌大。</p><p>既以與人己愈多。施者，聖人之所急也；受者，天下之所得也。施之廣者不匱，予之多者反贏，此[[既以為人己愈有]]之再申，而見聖人之道無私於物、物自歸之也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 八十一章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p><hr><p>既以財賄布施與人，而財益多，如日月之光，無有盡時。與 [[既以為人己愈有]] 義相成。</p><p><strong>所出</strong>：《老子河上公章句 · 顯質》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
