    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 无咎</nav></header><main><article><h1>无咎</h1><p>免於過咎，善補過之謂。</p><p>无咎者，過而不免之謂也。《比》卦辭「原筮元永貞，无咎」，言人若能以至善之心、恆久之志卜筮自省，則可免於過咎。《易》之无咎，非全無過患，乃貴乎能補過也。六二「比之自內，貞吉」，四「外比之，貞吉」，皆以无咎為善補過之驗。</p><p><strong>所出</strong>：《周易 · 比》 — https://zh.wikisource.org/wiki/周易/比</p></article></main></div></div>
