    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 立功成名-之</nav></header><main><article><h1>立功成名-之</h1><p></p><p>韓非子又立明君立功成名四要素之說：必得天時、人心、技能、勢位，四者兼備，而功名自成。然其中「勢」字最為緊要——有材無勢，雖賢不能制不肖；得勢位，則不推進而名自成。是故堯為匹夫不能正三家，桀為天子能制天下，非賢與不肖之異，位之高低、勢之轻重使然也。聖人功名之成，又賴乎眾助：近者結之以成，遠者譽之以名，尊者載之以勢。太山之功所以長立、日月之名所以久著，胥是道焉。</p><p>  <strong>所出</strong>：《韓非子 · 功名》 — https://zh.wikisource.org/wiki/韓非子/功名</p></article></main></div></div>
