    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 孌彼諸姬</nav></header><main><article><h1>孌彼諸姬</h1><p>美好之諸姬，泛指同嫁之女子也。</p><p>孌彼諸姬，聊與之謀。孌，美好之貌；諸姬，指同姓之美女。衞女與同嫁之諸姬共處，皆美好之人，乃相與謀劃。言「孌彼」者，贊其容色，亦見其所與謀者非庸常之人也。</p><p><strong>所出</strong>：《詩經 · 泉水》 — https://zh.wikisource.org/wiki/詩經/泉水</p></article></main></div></div>
