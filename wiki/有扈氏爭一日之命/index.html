    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 有扈氏爭一日之命</nav></header><main><article><h1>有扈氏爭一日之命</h1><p>恭行天罰，不緩斯須。</p><p>禹誓言「日中日，今予與有扈氏爭一日之命」。一日之命者，頃刻之期也。天討不緩，恭行以亟。伐有扈之遲速，即天命去就之幾微。禹欲速戰以決，不欲久稽師期也。觀「日中」之語，是詰朝誓師，期以今日之內也。</p><p><strong>所出</strong>：《尚書 · 禹誓》 — https://zh.wikisource.org/wiki/尚書/禹誓</p></article></main></div></div>
