    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 唯君之節</nav></header><main><article><h1>唯君之節</h1><p>君王當如日月，無私普照。</p><p>御民之轡，在上之所貴。道民之門，在上之所先。召民之路，在上之所好惡。故君求之則臣得之，君嗜之則臣食之，君好之則臣服之，君惡之則臣匿之。如地如天，何私何親？如月如日，唯君之節。</p><p><strong>所出</strong>：《管子 · 第01篇牧民》 — https://zh.wikisource.org/wiki/管子/第01篇牧民</p></article></main></div></div>
