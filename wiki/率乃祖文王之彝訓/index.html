    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 率乃祖文王之彝訓</nav></header><main><article><h1>率乃祖文王之彝訓</h1><p>率循祖德，恪守先王常典。</p><p>爾尚蓋前人之愆，惟忠惟孝；爾乃邁跡自身，克勤無怠，以垂憲乃後；率乃祖文王之彝訓，無若爾考之違王命。</p><p>言為臣當追祖德，為子當法先王，循其彝常之訓，無蹈其父違命之愆。此[[啟佑]]之義，亦[[監于先王成憲]]之意也。</p><p><strong>所出</strong>：《尚書 · 蔡仲之命》 — https://zh.wikisource.org/wiki/尚書/蔡仲之命</p></article></main></div></div>
