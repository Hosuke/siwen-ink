    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 明主不羞其卑賤</nav></header><main><article><h1>明主不羞其卑賤</h1><p>明主選賢不羞卑賤，唯其能明法利國便民。</p><p>其在記曰：堯有丹朱，而舜有商均，啓有五觀，商有太甲，武王有管、蔡。五王之所誅者，皆父兄子弟之親也，而所殺亡其身、殘破其家者何也？以其害國傷民敗法類也。觀其所舉，或在山林藪澤巖穴之間，或在囹圄緤紲纏索之中，或在割烹芻牧飯牛之事。然明主不羞其卑賤也，以其能為可以明法不便國利民，從而舉之，身安名尊。</p><p><strong>所出</strong>：《韓非子 · 說疑》 — https://zh.wikisource.org/wiki/韓非子/說疑</p></article></main></div></div>
