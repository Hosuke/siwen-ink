    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 善結無繩約</nav></header><main><article><h1>善結無繩約</h1><p>善結者無可解之繩，心約於道，則天下莫能解。</p><p>善結者無繩約而不可解也。言善於約結者，不以繩索為束，而以道心相維，使相結者志同道合，莫能離散，是以不可解也。《老子》假此以明聖人之治：夫聖人與民心結，不以刑賞繩之，而以道化之，使民自正、自化、自相結，是以其固莫解。五善之旨皆一貫：無恃乎外而成乎内，此之謂也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章二十七》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
