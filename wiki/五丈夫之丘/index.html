    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五丈夫之丘</nav></header><main><article><h1>五丈夫之丘</h1><p>景公夢見五人稱冤，晏子知其為昔日獵殺之五丈夫，請厚葬以廣君之惠。</p><p>景公敗於梧丘。夜猶早，公姑坐睡，而夢有五丈夫，北面韋廬稱無罪焉。公覺，召晏子而告其所瞢。晏子對曰：「昔者先君靈公畋，有五丈夫來駭獸，故並斷其頭而葬之，命曰五丈夫之丘，此其地邪？」公令人掘而求之，則五頭同穴而存焉。公命吏厚葬之。國人不知其夢也，曰：「君憫白骨，而況於生者乎。」故曰人君之為善易矣。</p><p><strong>所出</strong>：《晏子春秋 · 卷六》 — https://zh.wikisource.org/wiki/晏子春秋/卷六</p></article></main></div></div>
