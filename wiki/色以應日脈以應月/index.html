    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 色以應日脈以應月</nav></header><main><article><h1>色以應日脈以應月</h1><p>色象應日，脈象應月，色脈合參，乃知神機之要。</p><p>色以應日、脈以應月，出[[移精變氣論]]。</p><p>岐伯曰：「色以應日，脈以應月；常求其要，則其要也。」</p><p>日者，陽之精，光明昭著，故面之色澤以日為準，觀色之明晦，可知陽氣之盛衰。月者，陰之精，盈虧有常，故脈之象以月為準，察脈之至數，可知陰血之虛實。色脈合參，乃得上帝之所貴，合於神明，所以遠死而近生也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第四卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第四卷</p></article></main></div></div>
