    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 濟濟多士</nav></header><main><article><h1>濟濟多士</h1><p>助祭之臣甚多，咸秉德以事上也。</p><p>「濟濟多士」，[[詩經]]之句也。濟濟，眾盛之貌；多士，助祭之臣也。[[清廟]]之詩美[[文王]]之德，而歸美乎助祭之多士，言其咸秉文之德，共成祀事也。與[[顯相]]相應，明廟祀之盛，在乎臣工之賢。</p><p><strong>所出</strong>：《詩經 · 清廟》 — https://zh.wikisource.org/wiki/詩經/清廟</p></article></main></div></div>
