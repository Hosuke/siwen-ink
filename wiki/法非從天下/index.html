    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 法非從天下</nav></header><main><article><h1>法非從天下</h1><p>文子論法之源，謂法生於義、義生於眾適，非從天降、非從地出，發乎人間、反己自正。</p><p>文子問曰：「法安所生？」老子曰：「法生於義，義生於眾適，眾適合乎人心，此治之要也。」法非從天下也，非從地出也，發乎人間，反己自正。誠達其本，不亂於末；知其要，不惑於疑；有諸己，不非於人；無諸己，不責於所立。故人主之制法也，先以自為檢式，故禁勝於身，即令行於民。</p><p><strong>所出</strong>：《文子 · 卷十一》 — https://zh.wikisource.org/wiki/文子/卷十一</p></article></main></div></div>
