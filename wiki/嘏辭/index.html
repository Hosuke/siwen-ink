    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 嘏辭</nav></header><main><article><h1>嘏辭</h1><p>祝代尸以降福於主人之祝辭。</p><p>嘏辭者，祝承尸之命以福授主人之祝辭也。辭曰：「皇尸命工祝，承致多福無疆于女孝孫。來女孝孫，使女受祿于天，宜稼于田，眉壽萬年，勿替引之。」主人坐奠爵，再拜稽首，受黍，坐振祭哜之，詩懷之，實於左袂，挂於季指，執爵以興，坐卒爵拜，尸答拜。受嘏之後，宰夫以籩受嗇黍，主人嘗之，納諸內。此為祭禮最終之惠福，所謂「子子孫孫，勿替引之」者也。</p><p><strong>所出</strong>：《儀禮 · 少牢饋食禮》 — https://zh.wikisource.org/wiki/儀禮/少牢饋食禮</p></article></main></div></div>
