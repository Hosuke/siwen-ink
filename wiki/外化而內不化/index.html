    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 外化而內不化</nav></header><main><article><h1>外化而內不化</h1><p>聖人與物俱化而內心不移。</p><p>顏淵問乎仲尼曰：「回嘗聞諸夫子曰：『无有所將，无有所迎。』回敢問其遊。」仲尼曰：「古之人，外化而內不化；今之人，內化而外不化。與物化者，一不化者也。安化安不化，安與之相靡，必與之莫多。」</p><p>夫聖人與時俱化，而心無所係；世俗之人馳騖於外，而精神反失其守。唯有道者，能隨物宛轉而歸於一貫。</p><p><strong>所出</strong>：《莊子 · 知北遊》 — https://zh.wikisource.org/wiki/莊子/知北遊</p></article></main></div></div>
