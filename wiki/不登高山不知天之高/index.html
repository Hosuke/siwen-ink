    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不登高山，不知天之高</nav></header><main><article><h1>不登高山，不知天之高</h1><p>君子必遊於方內之賢士，觀於先王之遺言，乃知學問之大。</p><p>故不登高山，不知天之高也；不臨深谿，不知地之厚也；不聞先王之遺言，不知學問之大也。干、越、夷、貉之子，生而同聲，長而異俗，教使之然也。</p><p><strong>所出</strong>：《荀子 · 勸學篇》 — https://zh.wikisource.org/wiki/荀子/勸學篇</p></article></main></div></div>
