    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不動而疾</nav></header><main><article><h1>不動而疾</h1><p>德之為德，在無為而萬物自化，非積漸所能致。</p><p>不動而疾，不相告而知，不為而成，不召而至，是德也。故天不動，四時云下而萬物化。君不動，政令陳下而萬功成。心不動，使四肢耳目而萬物情。</p><p><strong>所出</strong>：《管子 · 第26篇戒》 — https://zh.wikisource.org/wiki/管子/第26篇戒</p></article></main></div></div>
