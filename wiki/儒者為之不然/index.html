    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 儒者為之不然</nav></header><main><article><h1>儒者為之不然</h1><p>儒者治國，必將曲辨，隆禮義而審貴賤。</p><p>傷國者如是。儒者為之不然，必將曲辨：朝廷必將隆禮義而審貴賤，士大夫莫不敬節死制；百官將齊其制度，重其官秩，莫不畏法而遵繩；關市幾而不征，質律禁止而不偏，商賈莫不敦愨而無詐；百工將時斬伐，利其巧任，莫不忠信而不楛；縣鄙將輕田野之稅，省刀布之斂，罕舉力役，無奪農時，農夫莫不朴力而寡能。如是，政令行，風俗美，以守則固，以征則彊，居則有名，動則有功。</p><p><strong>所出</strong>：《荀子 · 王霸篇》 — https://zh.wikisource.org/wiki/荀子/王霸篇</p></article></main></div></div>
