    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 範圍天地</nav></header><main><article><h1>範圍天地</h1><p>聖人範圍天地之化而不過，曲成萬物而不遺，通乎晝夜之道而无體。</p><p>故能範圍天地之化而不過，曲成萬物而不遺，通乎晝夜之道而无體，一陰一陽而无窮。非天下之至變，孰能與於此。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷10》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷10</p></article></main></div></div>
