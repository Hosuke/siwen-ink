    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大衍之數</nav></header><main><article><h1>大衍之數</h1><p>大衍之數五十，揲之以四，象四時，歸奇於扐以象閏。</p><p>大衍之數五十，其用四十有九。分而為二以象兩，掛一以象三，揲之以四以象四時，歸奇於扐以象閏，五歲再閏，故再扐而後掛。乾之策二百一十有六，坤之策百四十有四，凡三百有六十，當期之日。二篇之策萬有一千五百二十，當萬物之數也。是故四營而成易，十有八變而成卦，八卦而小成；引而伸之，觸類而長之，天下之能事畢矣。顯道神德行，是故可與酬酢，可與祐神矣。子曰：知變化之道者，其知神之所為乎！</p><p><strong>所出</strong>：《周易 · 繫辭上》 — https://zh.wikisource.org/wiki/易傳/繫辭上</p></article></main></div></div>
