    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 日月暈圍於外其賊在内</nav></header><main><article><h1>日月暈圍於外其賊在内</h1><p>備其所憎，禍在所愛；真正之敵，常伏於左右，非在外也。</p><p>故日月暈圍於外，其賊在内，備其所憎，禍在所愛。是故明王不舉不參之事，不食非常之食；遠聽而近視以審內外之失，省同異之言以知朋黨之分，偶叄伍之驗以責陳言之實，執後以應前，按法以治衆，衆端以參觀；士無幸賞，無躙行，殺必當，罪不赦，則姦邪無所容其私。</p><p><strong>所出</strong>：《韓非子 · 備內》 — https://zh.wikisource.org/wiki/韓非子/備內</p></article></main></div></div>
