    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 君子者道法之摠要</nav></header><main><article><h1>君子者道法之摠要</h1><p>君子為道法之樞要，少頃不可闕；得之則治，失之則亂。</p><p>土之與人也，道之與法也者，國家之本作也；君子也者，道法之摠要也，不可少頃曠也。得之則治，失之則亂；得之則安，失之則危；得之則存，失之則亡。故有良法而亂者有之矣，有君子而亂者，自古及今，未嘗聞也。《傳》曰：「治生乎君子，亂生於小人。」[[君子者法之原]]，此之義也。</p><p><strong>所出</strong>：《荀子 · 致士篇》 — https://zh.wikisource.org/wiki/荀子/致士篇</p></article></main></div></div>
