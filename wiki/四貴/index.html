    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 四貴</nav></header><main><article><h1>四貴</h1><p>太后、穰侯、華陽君、涇陽君、高陵君，專秦之權者。</p><p>范睢說秦昭王，言秦之四貴：太后、穰侯、華陽君、高陵君、涇陽君。范睢以為：「為此四貴者下，乃所謂無王也。然則權安得不傾，令安得從王出乎？」又引《詩》曰：「木實繁者披其枝，披其枝者傷其心；大其都者危其國，尊其臣者卑其主。」遂言昭王廢太后、逐四貴。秦王用其計，四貴皆就國。</p><p><strong>所出</strong>：《史記 · 卷079》 — https://zh.wikisource.org/wiki/史記/卷079</p></article></main></div></div>
