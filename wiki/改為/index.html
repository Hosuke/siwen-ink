    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 改為</nav></header><main><article><h1>改為</h1><p>更造以新之。言衣敝而更作之。</p><p>改，更也。為，造作也。言衣敝，則更造以新之。</p><p>《緇衣》首章云「敝，予又改為兮」。緇衣之敝也，予於是乎更造而為之。[[改為]]者，非徒補苴而已，直改而新之，所以盡事賢之禮也。夫好賢者之待其人，豈獨衣之敝者為之改乎？凡可以厚之者，無所不用其至。此詩人微意所在，而序《詩》者所謂「美其德」者也。</p><p><strong>所出</strong>：《詩經 · 緇衣》 — https://zh.wikisource.org/wiki/詩經/緇衣</p></article></main></div></div>
