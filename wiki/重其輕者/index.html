    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 重其輕者</nav></header><main><article><h1>重其輕者</h1><p>行刑加重於輕罪，則輕者不犯而重者不來。</p><p>行刑，重其輕者，輕者不至，重者不來。輕罪重刑，則民有所戒，小罪不敢犯，則大罪無由生矣。</p><p><strong>所出</strong>：《韓非子 · 飭令》 — https://zh.wikisource.org/wiki/韓非子/飭令</p></article></main></div></div>
