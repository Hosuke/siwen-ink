    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 命門下一黃庭元王</nav></header><main><article><h1>命門下一黃庭元王</h1><p>命門下黃庭之元王，司兩胯死炁之門</p><p>命門下一黃庭元王，乃大洞經第十章所述身神也。姓始明精，字元陽昌。</p><p>常守兆兩胯之間、車軸之戶、死炁之門。使兆百血凝結，神炁不散，拔出地戶，超度八難。</p><p>修是經者，書符白繒佩之，存呼其內諱「始明精」，可鎮兩胯之間，內華朗耀，百神凝精，反色嬰童，翻然超升。</p><p><strong>所出</strong>：《上清大洞真經 · 10章》 — https://zh.wikisource.org/wiki/上清大洞真經/10章</p></article></main></div></div>
