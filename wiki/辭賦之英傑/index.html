    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 辭賦之英傑</nav></header><main><article><h1>辭賦之英傑</h1><p>十家辭賦之評述</p><p>辭賦之英傑十家：枚乘《菟園》舉要以會新，司馬相如《上林》繁類以成豔，賈誼《鵩鳥》致辨於情理，王襃《洞簫》窮變於聲貌，班固《兩都》明絢以雅贍，張衡《二京》迅發以宏富，揚雄《甘泉》構深瑋之風，王延壽《靈光》含飛動之勢。他若王粲靡密發端必遒，徐幹博通時逢壯采，左思潘岳策勳鴻規，成公綏張協底績流制，郭璞景純綺巧縟理有餘，袁宏彥伯梗概情韻不匱，亦並魏晉之賦首也。</p><p><strong>所出</strong>：《文心雕龍 · 詮賦》 — https://zh.wikisource.org/wiki/文心雕龍/詮賦</p></article></main></div></div>
