    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 民復之用離心</nav></header><main><article><h1>民復之用離心</h1><p>君怨民則民離心，上下相怨，其國必亡。</p><p>厥辟作怨於民，民復之用離心。言夏之君作怨於民，民亦以離心報之。怨出於上，報應於下。民之於上，順之則附，逆之則離。怨民者，民亦怨之；離民者，民亦離之。上下交怨，未有能國者也。此[[湯以寬亡|為政者]]所當深戒。</p><p><strong>所出</strong>：《尚書 · 尹誥》 — https://zh.wikisource.org/wiki/尚書/尹誥</p></article></main></div></div>
