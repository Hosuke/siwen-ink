    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 知希則貴</nav></header><main><article><h1>知希則貴</h1><p>知我者愈希，則我愈貴，以稀為貴也。</p><p>知我者希，則我貴矣。</p><p>物以稀為貴，人以知希為寶。天下滔滔皆不知者，而聖人獨知之；舉世茫茫皆不行者，而聖人獨行之。是故知我者愈希，則我之所以貴者愈著。</p><p>夫曲高者，和彌寡；道深者，行者彌少。是以聖人觀天下之莫我知也，而益知其貴。惟其貴，是以聖人抱其玉而不輕示，被其褐而不自傷。知我者希，非聖人之不幸，乃天下之不幸也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第三十五章 懷玉》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
