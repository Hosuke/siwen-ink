    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五華</nav></header><main><article><h1>五華</h1><p>五華者，五臟之精華，滋養靈根之本也。</p><p>五華者，五臟之精華也。肝華在爪，心華在脈，脾華在唇，肺華在毛，腎華在髮，五者皆精炁之敷榮。經云「灌溉五華植靈根」，言三素之炁以灌溉之，則五華日茂，靈根日固，而脩真之基以立焉。</p><p><strong>所出</strong>：《黃庭內景經 · 上有章第二》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/上有章第二</p></article></main></div></div>
