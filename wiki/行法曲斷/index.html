    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 行法曲斷</nav></header><main><article><h1>行法曲斷</h1><p>行法宜速決，遲則姦生。</p><p>韓非云「行法曲斷，以五里斷者王，以九里斷者强，宿治者削」。曲斷者，曲，旁也；於旁近之處即行裁斷之謂。令出於近，民易從也；事決於速，姦難作也。五里而決則速，故可以王；九里而決則稍緩，故止於強；若積壓不斷，則國削矣。此明治事貴近貴速，不貴遠貴遲也。</p><p><strong>所出</strong>：《韓非子 · 飭令》 — https://zh.wikisource.org/wiki/韓非子/飭令</p></article></main></div></div>
