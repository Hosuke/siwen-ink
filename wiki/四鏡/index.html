    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 四鏡</nav></header><main><article><h1>四鏡</h1><p>小人四鏡各見一曲，唯戒之如虎然後跡容廣躋三五。</p><p>小人常有四鏡：一名璧，一名珠，一名砥，一名盂。璧視者大，珠視者小，砥視者正，盂視者倒。觀彼之器，察我之形，由是無大小、無長短、無妍醜、無美惡。所以知形氣謏我，精魄賊我，奸臣貴我，禮樂尊我。是故心不得為之君心，王不得為之主。戒之如火，防之如虎。純儉不可襲，清靜不可侮，然後可以跡容廣而躋三五。</p><p><strong>所出</strong>：《化書 · 卷一》 — https://zh.wikisource.org/wiki/化書/卷一</p></article></main></div></div>
