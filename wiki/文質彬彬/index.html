    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 文質彬彬</nav></header><main><article><h1>文質彬彬</h1><p>君子文質相備</p><p>孔子曰：「質勝文則野，文勝質則史。文質彬彬，然後君子。」質勝於文，則野略而無文；文勝於質，則虛華而失本。唯文質相得，斯為君子。</p><p><strong>所出</strong>：《論語 · 雍也第六》 — https://zh.wikisource.org/wiki/論語/雍也第六</p></article></main></div></div>
