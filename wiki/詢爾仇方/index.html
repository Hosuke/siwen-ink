    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 詢爾仇方</nav></header><main><article><h1>詢爾仇方</h1><p>詢問友邦，會同伐怨也。</p><p>詢爾仇方，言文王伐崇之前，先詢問友邦，會合兄弟之國也。《皇矣》帝謂文王曰：「詢爾仇方。同爾兄弟，以爾鉤援，與爾臨衝，以伐崇墉。」仇方者，友邦也。言欲伐崇，必先詢之於可結之國，同爾兄弟之師，用攻城之具，以伐崇之國也。詩言文王之伐，不專用兵，必先結外援，興問罪之師，以行天罰也。</p><p><strong>所出</strong>：《詩經 · 皇矣》 — https://zh.wikisource.org/wiki/詩經/皇矣</p></article></main></div></div>
