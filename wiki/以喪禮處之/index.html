    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以喪禮處之</nav></header><main><article><h1>以喪禮處之</h1><p>戰勝以喪禮處之</p><p>以喪禮處之，老子言聖人用兵之終極也。[[殺人之眾，以哀悲泣之]]，[[戰勝]]，皆以喪禮處之。夫 [[兵者不祥之器]]，雖聖人不得已而用之，然[[恬淡為上]]，[[勝而不美]]，是以[[吉事尚左]][[凶事尚右]]，[[偏將軍居左上將軍居右]]，莫非寓此哀矜之意於制度之中。樂殺人者不可以得志，而以哀悲泣之者，庶幾近之矣。</p><p><strong>所出</strong>：《道德經 (王弼本) · 三十一章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
