    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 國無人不務尊君</nav></header><main><article><h1>國無人不務尊君</h1><p>國无人者，家與家務相益，不務尊君</p><p>明主使下盡力守法分，故羣臣務尊主而不敢顧其家。亂主法制廢而不行，故大臣各益其家。君臣無分，上下無別，羣臣得務相貴，此非朝臣少也，眾不為用也。
<strong>所出</strong>：《管子 · 第67篇明法解》 — https://zh.wikisource.org/wiki/管子/第67篇明法解</p></article></main></div></div>
