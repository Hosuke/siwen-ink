    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 情周辭運</nav></header><main><article><h1>情周辭運</h1><p>情思周匝而不繁，辭句運動而不濫，此文章之至境也</p><p><strong>文</strong></p><p>夫百節成體，共資榮衛，萬趣會文，不離辭情。若情周而不繁，辭運而不濫，非夫鎔裁，何以行之乎。</p><p><strong>所出</strong>：《文心雕龍 · 鎔裁》 — https://zh.wikisource.org/wiki/文心雕龍/鎔裁</p></article></main></div></div>
