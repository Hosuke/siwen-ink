    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 與道合真</nav></header><main><article><h1>與道合真</h1><p>形神俱妙，與道合真</p><p>左玄真人云：「然後玉符寶神，金液鍊形，形神俱妙，與道合真。」</p><p>[[持誦此經|持誦此經]]，遣[[遣慾澄心|慾]]澄[[觀空亦空|心]]，漸入[[真靜應物|真道]]，形神俱妙，與道合真，乃修煉之極致境界也。</p><p><strong>所出</strong>：《太上老君說常清靜經》 — https://zh.wikisource.org/wiki/太上老君說常清靜經</p></article></main></div></div>
