    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 先時者殺無赦</nav></header><main><article><h1>先時者殺無赦</h1><p>賞罰及時，不失其時</p><p>書曰：「先時者殺無赦，不逮時者殺無赦。」人習其事而固，人之百事，如耳目鼻口之不可以相借官也。</p><p><strong>所出</strong>：《荀子 · 君道篇》 — https://zh.wikisource.org/wiki/荀子/君道篇</p></article></main></div></div>
