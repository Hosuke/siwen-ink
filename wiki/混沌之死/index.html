    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 混沌之死</nav></header><main><article><h1>混沌之死</h1><p>倏忽為混沌鑿竅，七日而亡。寓人為之害自然也。</p><p>南海之帝為儵，北海之帝為忽，嘗相與遇於混沌之地。混沌待之甚善，儵與忽謀報其德，見人皆有七竅以視聽食息，而混沌獨無，乃日鑿一竅。七日，混沌死。</p><p>夫混沌者，自然之全也。七竅成而性命亡，機心用而本真喪。此寓言以明：人為之害甚於無為，有心之化反不如無心之天。帝王之治亦若是，強開知見，是非旋起，天下乃失其渾全矣。</p><p><strong>所出</strong>：《莊子 · 應帝王》 — https://zh.wikisource.org/wiki/莊子/應帝王</p></article></main></div></div>
