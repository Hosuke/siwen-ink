    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 竭澤而漁</nav></header><main><article><h1>竭澤而漁</h1><p>竭澤而漁，非不獲也，明年無魚</p><p>此[[梁惠王]]問政時所陳之意。梁惠王移民移粟，自謂盡心，而民不加多。孟子以為是[[五十步笑百步]]之比。然治國亦當知取物有節，不可竭澤而漁。不違農時，數罟不入洿池，斧斤以時入山林，皆取物以節之意也。</p><p><strong>所出</strong>：《孟子 · 梁惠王上》 — https://zh.wikisource.org/wiki/孟子/梁惠王上</p></article></main></div></div>
