    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 退而省其私</nav></header><main><article><h1>退而省其私</h1><p>顏回退而自省其私，亦足以發明聖人之道，不愚也。</p><p>《論語》載孔子之言曰：「吾與回言終日，不違如愚。退而省其私，亦足以發。回也不愚。」言顏回從孔子受教，終日無所違異，似若愚人；及其退而自省其所行，亦足以發明聖人之旨，是顏回非眞愚也，蓋默而識之者也。</p><p><strong>所出</strong>：《論語 · 爲政第二》 — https://zh.wikisource.org/wiki/論語/爲政第二</p></article></main></div></div>
