    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 賢臣以義去</nav></header><main><article><h1>賢臣以義去</h1><p>晏子見景公信用讒佞，知不可輔，遂以義去之。</p><p>景公信用讒佞，賞無功而罰不辜。晏子曰：「臣聞古者之士，可與得之，不可與失之；可與進之，不可與退之。」又曰：「臣請逃之矣。」遂鞭馬而出。公遣人追之，晏子遂返。其僕怪之，晏子曰：「非子之所知也，公之言至矣。」言至者，景公自知其失而反覆如此，不可以言去也。晏子之義，去就以道[[從義不從父]]，進退以[[道不可獻]]者也。</p><p><strong>所出</strong>：《晏子春秋 · 卷一》 — https://zh.wikisource.org/wiki/晏子春秋/卷一</p></article></main></div></div>
