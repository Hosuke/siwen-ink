    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 哀王</nav></header><main><article><h1>哀王</h1><p>齊悼惠王子劉襄嗣立，是為哀王。</p><p>哀王名襄，悼惠王之子。父卒嗣立。</p><p>哀王元年，孝惠帝崩，呂后稱制，天下事皆決於高后。二年，高后立其兄子酈侯呂臺為呂王，割齊之濟南郡為呂王奉邑。哀王三年，其弟章入宿衛，呂后封為朱虛侯，又封其弟興居為東牟侯。哀王八年，高后割齊瑯邪郡立營陵侯劉澤為瑯邪王。</p><p><strong>所出</strong>：《史記 · 卷052》 — https://zh.wikisource.org/wiki/史記/卷052</p></article></main></div></div>
