    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天賊</nav></header><main><article><h1>天賊</h1><p></p><p><strong>天賊</strong>者，[[墨子]]之術語，[[墨學]]核心範疇也。與[[天德]]相對。蓋行[[別]]道而反[[天之意]]者，則成天賊。</p><p>《天志下》云：「順天之意者，兼也；[[反天之意]]者，別也。」兼者，以義正人；別者，以力正人。天賊之行，大的攻小，强者侮弱，衆者賊寡，詐者欺愚，貴者傲賤，富者驕貧，壯者奪老。天下庶國以水火毒藥兵刃相賊害。三不利而無所利：上不利天，中不利鬼，下不利人。</p><p>昔者暴王[[桀]][[紂]][[幽]][[厲]]行別，賊害百姓，褻瀆鬼神，故天罰之，使其父子離散、國家滅亡。此天賊之明驗，天德之反面也。天賊與兼相反，天德與之亦由此分。</p></article></main></div></div>
