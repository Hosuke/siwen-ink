    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 利誠亂之始</nav></header><main><article><h1>利誠亂之始</h1><p>利為亂之根源，夫子所以罕言也。</p><p>太史公讀孟子書，至梁惠王問「何以利吾國」，未嘗不廢書而嘆也。曰：嗟乎，利誠亂之始也！夫子罕言利者，常防其原也。故曰「放於利而行，多怨」。自天子至於庶人，好利之弊，何以異哉！</p><p>蓋利之為物，人心之所趨，世變之所由生也。欲壑難填，則爭奪以起；爭奪以起，則亂亡隨之。聖人知其然，故不言利而言義，不求人之趨利，而使人知所守也。</p><p><strong>所出</strong>：《史記 · 卷074》 — https://zh.wikisource.org/wiki/史記/卷074</p></article></main></div></div>
