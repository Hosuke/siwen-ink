    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 趙簡子以晉陽為保鄣</nav></header><main><article><h1>趙簡子以晉陽為保鄣</h1><p>以晉陽為屏蔽，損戶以惠民</p><p>趙簡子使尹鐸為晉陽。請曰：「以為繭絲乎？抑為保鄣乎？」簡子曰：「保鄣哉！」尹鐸損其戶數。簡子誡襄子曰：「晉國有難，而無以尹鐸為少，無以晉陽為遠，必以為歸。」</p><p><strong>所出</strong>：《國語 · 卷15》 — https://zh.wikisource.org/wiki/國語/卷15</p></article></main></div></div>
