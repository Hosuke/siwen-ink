    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 焉逢攝提格</nav></header><main><article><h1>焉逢攝提格</h1><p>太初元年歲名，干支相配以紀年者。</p><p>其兩旁各有三星，鼎足句之，曰攝提。晉灼曰「如鼎之句曲」。元命包云「攝提之為言提攜也，言提斗攜角以接於下也」。</p><p>攝提六星夾大角，大臣之象，恆直斗杓所指，紀八節，察萬事者也。占：色溫溫不明而大者，人君恐；客星入之，聖人受制也。</p><p>攝提者，直斗杓所指，以建時節，故曰「攝提格」。</p><p><strong>所出</strong>：《史記 · 卷027》 — https://zh.wikisource.org/wiki/史記/卷027</p></article></main></div></div>
