    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 置酖兩卮</nav></header><main><article><h1>置酖兩卮</h1><p>太后置酖酒，欲以斃齊王。</p><p>孝惠與齊王燕飲太后前，孝惠以為齊王兄，置上坐，如家人之禮。太后怒，乃令酌兩卮酖，置前，令齊王起為壽。齊王起，孝惠亦起，取卮欲俱為壽。太后乃恐，自起泛孝惠卮。齊王怪之，因不敢飲，詳醉去。問，知其酖，齊王恐。乃上城陽之郡，尊公主為王太后，呂后喜。</p><p><strong>所出</strong>：《史記 · 卷009》 — https://zh.wikisource.org/wiki/史記/卷009</p></article></main></div></div>
