    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 若此</nav></header><main><article><h1>若此</h1><p>歎美前義之深切</p><p>天下之道，猶張弓者也。高者抑之，下者舉之，有餘者損之，不足者補之。聖人為而弗有，成功而弗居。若此，其不欲見賢也。</p><p>「若此」者，承上啟下之詞，歎美天道之均平，聖德之玄妙。以古文虛字觀之，「若」訓為「如此」，「此」指前所言天道聖人之事，蓋驚歎之辭也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第四十二章 天道》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
