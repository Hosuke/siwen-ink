    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 死不忘者壽</nav></header><main><article><h1>死不忘者壽</h1><p>死而不忘者，肉身滅而精神存，是真壽也。</p><p>死不忘者壽也。死之云者，形骸之終也；不忘之云者，德業言行為後人所記也。身死而名不亡，是[[死而不亡者壽]]之別言。[[死灰復燃]]者言名之再顯，此言名之永存，其義相通，皆以精神不死為真壽。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第七十七章 盡己》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
