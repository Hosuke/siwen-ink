    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 問者</nav></header><main><article><h1>問者</h1><p>設問以闡性惡之旨問答之體。</p><p>此篇多用問答之體。問者曰：「人之性惡，則禮義惡生？」應之曰：凡禮義者，是生於聖人之僞，非故生於人之性也。又問曰：「禮義積僞者，是人之性，故聖人能生之也。」應之曰：是不然。[[夫陶人埏埴而生瓦]]之喻，正破此問。荀子之文，善用問答以窮其說，反覆辨難，而性惡之旨愈明。</p><p><strong>所出</strong>：《荀子 · 性惡篇》 — https://zh.wikisource.org/wiki/荀子/性惡篇</p></article></main></div></div>
