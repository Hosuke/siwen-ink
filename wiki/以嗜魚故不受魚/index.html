    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以嗜魚故不受魚</nav></header><main><article><h1>以嗜魚故不受魚</h1><p>因嗜魚而不受魚，以遠嫌避禍</p><p>公儀休嗜魚而不受人之魚。客問故，對曰：「以嗜魚，故不受也。今受魚而免相位，誰復給我魚者？」言廉吏不受饋遺，以其能自給也；一受則失職，無以自存矣。</p><p><strong>所出</strong>：《史記 · 卷119》 — https://zh.wikisource.org/wiki/史記/卷119</p></article></main></div></div>
