    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 竇太后治黃老言</nav></header><main><article><h1>竇太后治黃老言</h1><p>竇太后崇黃老而抑儒術，案誅趙綰王臧，諸所興為者皆廢。</p><p>[[竇太后]]治黃老言，不好儒術，使人微得[[趙綰]]等姦利事，召案綰、臧，綰、臧自殺，諸所興為者皆廢。後六年，竇太后崩。</p><p><strong>所出</strong>：《史記 · 卷012》 — https://zh.wikisource.org/wiki/史記/卷012</p></article></main></div></div>
