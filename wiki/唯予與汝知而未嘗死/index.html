    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 唯予與汝知而未嘗死</nav></header><main><article><h1>唯予與汝知而未嘗死</h1><p>列子與髑髏之問答，謂未嘗死亦未嘗生，乃化人之觀也。</p><p>列子行食於道從，見百歲髑髏，攓蓬而指之曰：「唯予與汝知而未嘗死，未嘗生也。若果養乎？予果歡乎？」</p><p><strong>所出</strong>：《莊子 · 至樂》 — https://zh.wikisource.org/wiki/莊子/至樂</p></article></main></div></div>
