    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 仁者仁此義者分此</nav></header><main><article><h1>仁者仁此義者分此</h1><p>仁者以愛賢為仁，義者以分明為義，各有所守而成治道。</p><p>仁者仁此者，愛賢能也；義者分此者，分別尊卑貴賤也；節者死生此者，守節不渝也；忠者惄慎此者，忠誠不欺也。兼此四者而能之，備矣。備而不矜，一循乎善而不自見，是之謂聖。聖人之所以為天下貴者，非以力服人，乃以德化人也。</p><p><strong>所出</strong>：《荀子 · 君子篇》 — https://zh.wikisource.org/wiki/荀子/君子篇</p></article></main></div></div>
