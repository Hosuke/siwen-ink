    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以天下觀天下</nav></header><main><article><h1>以天下觀天下</h1><p>聖人觀天下之俗，驗之於天下。</p><p>以天下觀天下者，超乎邦國之上，以天下之公理觀天下之風俗。[[以邦觀邦|以邦觀邦]]之序至此而極，則知天下之所以然者在此，無復以遠求也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第十七章 善觀》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p><hr><p>以天下觀天下。</p><p>觀天下之治者，以天下之實觀之，不可以私意度也。去彼取此，則是非得失昭然。</p><p><strong>所出</strong>：《道德經 (王弼本) · 五十四章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
