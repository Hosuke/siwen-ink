    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 老老</nav></header><main><article><h1>老老</h1><p>敬老是政，惠施於耆老者也。</p><p>國有耆老，國家厚恤之。凡國都皆有掌老之官，專司其事。七十以上，一子無征，三月有饋肉；八十以上，二子無征，月有饋肉；九十以上，盡家無征，日有酒肉。及其死也，上共棺椁，勸子弟精膳食，問所欲，求所嗜。此之謂老老，使老者終身不匱、亡者葬祭有禮也。</p><p><strong>所出</strong>：《管子 · 第54篇入國》 — https://zh.wikisource.org/wiki/管子/第54篇入國</p></article></main></div></div>
