    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 其寐不夢其覺不憂</nav></header><main><article><h1>其寐不夢其覺不憂</h1><p>聖人用心杖神，內外相扶，則寐無夢而覺無憂</p><p>夫聖人用心，杖性依神，相扶而得終始，是故其寐不夢，其覺不憂。古之人有處混冥之中，神氣不蕩于外，萬物恬漠以愉靜，則精神內守、形神相保，自然無夢無憂，此聖人之所由成也。</p><p><strong>所出</strong>：《淮南子 · 俶真訓》 — https://zh.wikisource.org/wiki/淮南子/俶真訓</p></article></main></div></div>
