    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 下民卒癉</nav></header><main><article><h1>下民卒癉</h1><p>天災民病，皆由在上者失道</p><p>詩云「上帝板板，下民卒癉」，言天失常道，下民困病。板板，反常也；卒癉，盡病也。</p><p>蓋[[天之降罰]]之義，天心仁愛而譴告，人君失道則[[百川沸騰山冢崒崩]]，民受其殃。此[[天難忱斯]]之戒，亦[[天命不徹]]之懼也。[[畏天之威]]，王之所以保其邦也。</p><p><strong>所出</strong>：《詩經 · 板》 — https://zh.wikisource.org/wiki/詩經/板</p></article></main></div></div>
