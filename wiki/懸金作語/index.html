    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 懸金作語</nav></header><main><article><h1>懸金作語</h1><p>呂不韋懸金咸陽市門，求天下士增損其書一字。</p><p>呂不韋成《呂氏春秋》二十餘萬言，乃布之咸陽市門，懸千金其上。宣言：諸侯游士賓客有能增損一字者，予千金。</p><p>夫千金之賞，求一人之筆削，何其重也！蓋不韋意在以貨財動天下之口，而不知文章之是非，不在賞之輕重。及其免相就國，蜀道遷徙，則懸金之賞，終無一人應之者。可見獎誘之道，不可以威勢劫也。</p><p><strong>所出</strong>：《史記 · 卷085》 — https://zh.wikisource.org/wiki/史記/卷085</p></article></main></div></div>
