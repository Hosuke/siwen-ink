    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三神青衣</nav></header><main><article><h1>三神青衣</h1><p>玉華結作三神，一青衣、二侍立。</p><p>三神青衣者，存思玉華從兆泥丸中入，口吸神雲、咽津三過，結作三神：一神青衣，二神侍立，下布五藏之下、大胃上口。皆以青炁君之真炁凝化而成。</p><p><strong>所出</strong>：《上清大洞真經 · 31章》 — https://zh.wikisource.org/wiki/上清大洞真經/31章</p></article></main></div></div>
