    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 仲山父諫宣王料民</nav></header><main><article><h1>仲山父諫宣王料民</h1><p>料民於太原乃示少惡事，必招諸侯之避</p><p>仲山父諫曰：「民不可料也。古者不料民而知其少多，司民協孤終，司商協民姓，司徒協旅，司寇協姦，牧協職，工協革，場協入，廩協出，是則少多、死生、出入、往來者皆可知也。」言古有常法察民，不待普查。又言臨政示少則諸侯避之，治民示以惡事則無以為令。且無故料民，乃天之所惡，害於政而妨後嗣。王不聽，至幽王果廢滅。</p><p><strong>所出</strong>：《國語 · 卷01》 — https://zh.wikisource.org/wiki/國語/卷01</p></article></main></div></div>
