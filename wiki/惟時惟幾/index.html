    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 惟時惟幾</nav></header><main><article><h1>惟時惟幾</h1><p>記禹警戒舜慎在位之辭</p><p>舜讓于禹，禹曰：「惟時惟幾。」堯之時，洪水滔天。舜命禹平水土，言：「人心惟危，道心惟微，惟精惟一，允執厥中。」及舜在位，禹戒之曰：「帝，慎乃在位，安爾止。輔德，天下大應。清意以昭待上帝命，天其重命用休。」舜以告禹曰：「臣哉，臣哉！臣作朕股肱耳目。」又稱禹之功：「輔成五服，至于五千里，州十二師，外薄四海，咸建五長，各道有功。」</p><p><strong>所出</strong>：《史記 · 卷002》 — https://zh.wikisource.org/wiki/史記/卷002</p></article></main></div></div>
