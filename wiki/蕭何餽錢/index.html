    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蕭何餽錢</nav></header><main><article><h1>蕭何餽錢</h1><p>高祖嘗繇咸陽，吏皆送三錢，何獨送五錢，帝後以為增封之由。</p><p>高祖以吏繇咸陽，吏皆送奉錢三，何獨以五。其後益封何二千戶，以帝嘗繇咸陽時何送我獨贏錢二也。夫區區五錢之別，而高祖記之，豈非所謂「好而知其惡」者乎？抑亦見微知著者歟。</p><p><strong>所出</strong>：《史記 · 卷053》 — https://zh.wikisource.org/wiki/史記/卷053</p></article></main></div></div>
