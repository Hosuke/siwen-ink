    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 禁發有時</nav></header><main><article><h1>禁發有時</h1><p>山澤之利當順時禁絶，不可竭澤而取。</p><p>山林廣大，草木雖美，禁發必有時。大木不可獨伐，不可獨舉，不可獨運，亦不可加之薄墻之上。江海雖廣，池澤雖博，魚鱉雖多，罔罟必有正。舩網不可一財而成。先王禁山澤之作者，博民於生穀。彼民非穀不食，穀非地不生，地非民不動，民非作力毋以致財。天下之所生，生於用力；用力之所生，生於勞身。是以宮室必有度，禁發必有時，國雖充盈、金玉雖多，亦不可無節也。</p><p><strong>所出</strong>：《管子 · 第13篇八觀》 — https://zh.wikisource.org/wiki/管子/第13篇八觀</p></article></main></div></div>
