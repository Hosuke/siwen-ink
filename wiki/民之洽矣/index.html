    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 民之洽矣</nav></header><main><article><h1>民之洽矣</h1><p>辭令輯和，則民情浹洽</p><p>詩云「辭之輯矣，民之洽矣。辭之懌矣，民之莫矣」，言政令辭氣輯和，則民心浹洽；政令辭氣乖戾，則民心死亡。</p><p>[[王言如絲其出如綸]]，辭令者，王政之首也。辭輯則民[[愛民不疾]]，辭懌則[[民之父母]]之澤替矣。治世之音安以樂，亡世之音哀以思，亦此理也。</p><p><strong>所出</strong>：《詩經 · 板》 — https://zh.wikisource.org/wiki/詩經/板</p></article></main></div></div>
