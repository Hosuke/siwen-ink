    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 廣陵風俗</nav></header><main><article><h1>廣陵風俗</h1><p>廣陵在吳越，其民精而輕，故誡以慎法，勿近小人，遠佚樂。</p><p>夫廣陵在吳越之地，其民精而輕，故誡之曰「江湖之閒，其人輕心。楊州葆疆，三代之時，迫要使從中國俗服，不大及以政教，以意御之而已。無侗好佚，無邇宵人，維法是則。無長好佚樂馳騁弋獵淫康，而近小人。常念法度，則無羞辱矣」。三江、五湖有魚鹽之利，銅山之富，天下所仰。</p><p>故誡之曰「臣不作福」者，勿使行財幣，厚賞賜，以立聲譽，為四方所歸也。又曰「臣不作威」者，勿使因輕以倍義也。</p><p><strong>所出</strong>：《史記 · 卷060》 — https://zh.wikisource.org/wiki/史記/卷060</p></article></main></div></div>
