    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 偕偕士子</nav></header><main><article><h1>偕偕士子</h1><p>言士之強健者，終日勤事。</p><p>「偕偕士子，朝夕從事」，[[詩經·北山]]之句。言士之強健者，偕偕然健壯，朝夕從事王事，不得休息。以見賢者之勞也。</p><p><strong>所出</strong>：《詩經 · 北山》 — https://zh.wikisource.org/wiki/詩經/北山</p></article></main></div></div>
