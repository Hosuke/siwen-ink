    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 酌醴</nav></header><main><article><h1>酌醴</h1><p>田獵既畢，酌酒以燕饗。</p><p>「醴」，甜酒也。《周禮·酒正》言「醴齊」，祭祀與饗賓皆用之。田獵之終，天子與賓客共酌醴酒，此田事之終禮也。獵以奉上，宴以娛賓，恩禮備焉。</p><p>《吉日》之詩，以「以御賓客，且以酌醴」作結，見宣王田事非徒以為娛樂，亦所以睦諸侯、接賓客也。</p><p><strong>所出</strong>：《詩經 · 吉日》 — https://zh.wikisource.org/wiki/詩經/吉日</p></article></main></div></div>
