    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 安期授道</nav></header><main><article><h1>安期授道</h1><p>別師當迎汝六百年</p><p>安期先生將去，語少君：「我被玄洲召，當別。復六百年，當迎汝。」乃授神丹爐火飛雪之方誓約口畢。乘龍虎導引數百人迎之，羽車昇天。</p><p><strong>所出</strong>：《神仙傳 · 卷六》 — https://zh.wikisource.org/wiki/神仙傳/卷六</p></article></main></div></div>
