    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 德居外則物出，刑居外則物入</nav></header><main><article><h1>德居外則物出，刑居外則物入</h1><p>德主外則萬物出歸，刑主外則萬物入藏</p><p>從春分到秋分，德居外，萬物莫不出歸王外，蟄蟲出穴，人民出室；從秋分至春分，德在內，萬物莫不歸王內，蟄藏之物悉入穴，人民入室，是以德治之明效也。</p><p>從春分至秋分，刑在內治，萬物皆從出至外，內空，寂然獨居；從秋分至春分，刑居外治外，無物無氣，空無士眾，悉入從德，是者明刑不可以治之證也。</p><p><strong>所出</strong>：《太平經 · 12》 — https://zh.wikisource.org/wiki/太平經/12</p></article></main></div></div>
