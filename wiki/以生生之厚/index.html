    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以生生之厚</nav></header><main><article><h1>以生生之厚</h1><p>人之厚養其生，反趣死地；物之貪甘餌，亦入無生</p><p>人何以動之死地？以其生生之厚也。</p><p>王弼注云：「蚖蟺以淵為淺，而鑿穴其中；鷹鸇以山為卑，而增巢其上。矰繳不能及，網罟不能到，可謂處於無死地矣。然而卒以甘餌，乃入於無生之地。豈非生生之厚乎。」</p><p>是故萬物於世間，茍不以慾求離其本，不以渝其真，雖入軍而不害，陸行而不可犯。及其以生生之厚，而甘餌入於口，則無生之地隨之矣。養生者不可以厚養為也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 五十章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
