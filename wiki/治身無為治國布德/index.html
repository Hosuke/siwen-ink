    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 治身無為治國布德</nav></header><main><article><h1>治身無為治國布德</h1><p>治身者呼吸精氣無令耳聞，治國者布施惠德不令下知。</p><p>治身者[[呼吸精氣]]，[[無為]]，無令耳聞。治國者布施惠德，無令下知。[[清靜]]之治，不擾民聽；[[玄德]]之行，不形於言。</p><p><strong>所出</strong>：《老子河上公章句 · 能為》 — https://zh.wikisource/wiki/老子河上公章句/上</p></article></main></div></div>
