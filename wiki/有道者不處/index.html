    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 有道者不處</nav></header><main><article><h1>有道者不處</h1><p>體道之人，決不為矜伐之事。</p><p>有道者，見道之明而行道之力也。既有見於[[餘食赘行]]之病，又知[[物或惡之]]之理，則深自戒飭，不敢以自見、自是、自伐、自矜處身於世也。蓋聖人之所以為聖，正在乎虛其心，弱其志，不以一己之私害其自然之德。</p><p><strong>所出</strong>：《道德經 (王弼本) · 二十四章》 — https://zh.wikisource.org/wiki/道德經_(王弼本)</p></article></main></div></div>
