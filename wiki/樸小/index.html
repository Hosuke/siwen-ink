    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 樸雖小</nav></header><main><article><h1>樸雖小</h1><p>道之樸微而天下莫能臣之</p><p>樸雖小，天下莫能臣也。樸者，道之未散者也。雖小而不可析，雖微而莫之能制。侯王若能守之，萬物將自賓服矣。</p><p><strong>所出</strong>：《老子河上公章句 · 聖德》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
