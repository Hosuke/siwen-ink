    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 明目之道</nav></header><main><article><h1>明目之道</h1><p>述增明目力諸方。</p><p>抱朴子述明目之道云：能引三焦之昇景，召大火於南離，洗之以明石，慰之以陽光，及燒丙丁洞視符，以酒和洗之，古人曾以夜書也。</p><p>或以苦酒煮蕪菁子令熟，曝乾，末服方寸匕，日三，盡一斗，能夜視有所見矣。或以犬膽煎青羊、班鳩、石決明、充蔚百華散；或以雞舌香、黃連、乳汁煎注之。諸有百疾之在目者皆愈，而更加精明倍常。</p><p><strong>所出</strong>：《抱朴子 · 卷15》 — https://zh.wikisource.org/wiki/抱朴子/卷15</p></article></main></div></div>
