    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 傅御</nav></header><main><article><h1>傅御</h1><p>王之傅官與御史，掌王室家政，遷申伯私人。</p><p>「王命傅御，遷其私人」，言王命傅官、御官掌理王室家政，將申伯之家屬遷往謝地也。傅者，傅姆之官，掌教導王族；御者，御史之屬，掌文書法度。申伯以元舅之尊，遣傅御送往迎來，以成其建國之功。</p><p><strong>所出</strong>：《詩經 · 崧高》 — https://zh.wikisource.org/wiki/詩經/崧高</p></article></main></div></div>
