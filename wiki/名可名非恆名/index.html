    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 名可名非恆名</nav></header><main><article><h1>名可名非恆名</h1><p>可名之名非永恆之名，名因時而立，亦因時而廢。</p><p>名可名，非恆名也。名者，所以指實也。實既有矣，名斯生焉；實既變矣，名亦隨之。是故有名者，非恆名。及其無名，萬物之初，孰名之哉？道在未有物之先，不可以名舉；及其有物，而後名立。名立則有所分，分則有所局，局則非道之大全也已。</p><p><strong>所出</strong>：《老子 (帛書本) · 章一》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
