    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 改形免世厄</nav></header><main><article><h1>改形免世厄</h1><p>改形變化，脫離世網之厄，是為真人之驗。</p><p>老翁復丁壯，耆嫗成吒女。改形免世厄，號之曰真人。</p><p>「改形」者，還丹成就，形骸、神氣俱改故常也。老者返童，衰者成壯，此改形之驗也。世人厄於生死輪迴，汩於情欲世網，修煉者脫此二厄，形神俱化，是之謂「真人」。伯陽以還丹之實驗明真人之所以為真人，非空言也。</p><p><strong>所出</strong>：《周易參同契 · 11章》 — https://zh.wikisource.org/wiki/周易參同契/11章</p></article></main></div></div>
