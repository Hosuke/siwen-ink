    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 人自生至終大化有四</nav></header><main><article><h1>人自生至終大化有四</h1><p>人生大化四階段：嬰孩、少壯、老耄、死亡。</p><p>人自生至終，大化有四：嬰孩也，少壯也，老耄也，死亡也。其在嬰孩，氣專志一，和之至也；物不傷焉，德莫加焉。其在少壯，則血氣飄溢，欲慮充起；物所攻焉，德故衰焉。其在老耄，則欲慮柔焉；體將休焉，物莫先焉。雖未及嬰孩之全，方於少壯，間矣。其在死亡也，則之於息焉，反其極矣。</p><p><strong>所出</strong>：《列子 · 天瑞篇》 — https://zh.wikisource.org/wiki/列子/天瑞篇</p></article></main></div></div>
