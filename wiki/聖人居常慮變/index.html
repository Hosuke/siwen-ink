    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖人居常慮變</nav></header><main><article><h1>聖人居常慮變</h1><p>是非恩讎相化，聖人居常而豫防之。</p><p>天下之理，是或化為非，非或化為是，恩或化為讎，讎或化為恩，是以聖人居常慮變。</p><p>人之少也，當佩乎父兄之教；人之壯也，當達乎朋友之箴；人之老也，當警乎少壯之說。萬化雖移，不能厄我。</p><p>天下之理輕者易化，重者難化。譬如風雲須臾變滅，金玉之性歷久不渝。人之輕明者，能與造化俱化而不留，殆有未嘗化者存。</p><p>二幼相好，及其壯也，相遇則不相識；二壯相好，及其老也，相遇則不相識。如雀鴿鷹鳩之化，無昔無今。</p><p><strong>所出</strong>：《關尹子 · 7》 — https://zh.wikisource.org/wiki/關尹子/7</p></article></main></div></div>
