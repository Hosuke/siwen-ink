    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 主制滔赶</nav></header><main><article><h1>主制滔赶</h1><p>進退者主制，滔赶者主勞；方者執以固，圓者運以通</p><p>心道進退，而刑道滔赶。進退者主制，滔赶者主勞。主勞者方，主制者圓。圓者運，運者通，通則和。方者執，執者固，固則信。君以利和，臣以節信，則上下無邪矣。</p><p><strong>所出</strong>：《管子 · 第31篇君臣下》 — https://zh.wikisource.org/wiki/管子/第31篇君臣下</p></article></main></div></div>
