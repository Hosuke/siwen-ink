    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 壯于大輿之輹</nav></header><main><article><h1>壯于大輿之輹</h1><p>壯於大車之軸，喻力有所歸也。</p><p>九四：「藩決不羸，壯于大輿之輹。」貞吉悔亡者，以其藩決而不為所困也。壯于大輿之輹者，車軸壯固，可以任重致遠。夫力之用，貴有所歸。若壯于趾，則征凶；壯于大輿之輹，則無不利。以其力歸於正道大事，非妄施於纖悉也。</p><p><strong>所出</strong>：《周易 · 大壯》 — https://zh.wikisource.org/wiki/周易/大壯</p></article></main></div></div>
