    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 開金門</nav></header><main><article><h1>開金門</h1><p>知大道之真而後金門可開，高賢可見。</p><p>開金門，上清大洞登真之要路也。兆能知[[大道君]]之聖、霐之真，乃開金門。金門一開，左右忽見[[父寧在帝一]]與[[母精延帝一字]]，是為[[景中伯]]。景中伯與爾登[[玉晨]]，是為道成。金門之開，在知[[高上神霄玉清王]]之祝，[[紫房]]之所在，由[[明堂]]眉間一中而入。</p><p><strong>所出</strong>：《上清大洞真經 · 18章》 — https://zh.wikisource.org/wiki/上清大洞真經/18章</p></article></main></div></div>
