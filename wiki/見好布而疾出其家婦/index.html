    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 見好布而疾出其家婦</nav></header><main><article><h1>見好布而疾出其家婦</h1><p>見家織布美則逐其織婦，不與民爭利</p><p>公儀休見其家織布好，乃疾出其家婦，燔其機。言相國之家不當與民爭利，見其物美則毀之，使女工不得倚此爲業，此奉法循理之至也。</p><p><strong>所出</strong>：《史記 · 卷119》 — https://zh.wikisource.org/wiki/史記/卷119</p></article></main></div></div>
