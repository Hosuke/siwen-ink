    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 孔子去陳</nav></header><main><article><h1>孔子去陳</h1><p>孔子因晉楚爭陳而去。</p><p>孔子居陳三歲，會晉楚爭彊，更伐陳，及吳侵陳，陳常被寇。孔子曰：「歸與歸與！吾黨之小子狂簡，進取不忘其初。」於是孔子去陳。此孔子離陳之事也。</p><p><strong>所出</strong>：《史記 · 卷047》 — https://zh.wikisource.org/wiki/史記/卷047</p></article></main></div></div>
