    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 王真</nav></header><main><article><h1>王真</h1><p>上黨道士，行胎息斷穀，容若三十，實年四百歲。</p><p>王真者，上黨人也。年七十九乃學道，行胎息之術，斷穀三十餘年，容少而色美，行及走馬，力兼數人。</p><p>魏武帝聞之，召相見，似三十許人。帝疑其詐，驗問鄉里，皆異口同辭，多自兄童時見之者，真年已四百歲矣。帝乃信其道，甚加欽禮。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 21》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/21</p></article></main></div></div>
