    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 臣罔以寵利居成功</nav></header><main><article><h1>臣罔以寵利居成功</h1><p>臣子不可以寵利自居其功。</p><p>尹戒王：臣罔以寵利居成功。功臣顯賞，人情所豔；然臣而有功，是其分之所當為，非可以此要君市恩、據位自重也。苟以寵利居功，是奸臣之漸，邦其危矣。此[[賞罰必信]]之意而義尤切者。</p><p><strong>所出</strong>：《尚書 · 太甲下》 — https://zh.wikisource.org/wiki/尚書/太甲下</p></article></main></div></div>
