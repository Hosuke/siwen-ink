    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 國容不入軍</nav></header><main><article><h1>國容不入軍</h1><p>國之禮儀不入軍中，軍之威儀不入國中，各守其分。</p><p>古者國容不入軍，軍容不入國。軍容入國則民德廢，國容入軍則民德弱。</p><p>其在國也，言文而語溫，在朝恭以遜，修己以待人，不召不至，不問不言，難進而易退。</p><p>其在軍也，抗而立，在行遂而果，介者不拜，兵車不式，城上不趨，危事不齒。</p><p>故禮與法表裏也，文與武左右也。上下殊倫，動止異制，治亂之分由此而別。</p><p><strong>所出</strong>：《司馬法》 — https://zh.wikisource.org/wiki/司馬法</p></article></main></div></div>
