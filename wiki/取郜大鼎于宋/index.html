    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 取郜大鼎于宋</nav></header><main><article><h1>取郜大鼎于宋</h1><p>取亡國之器，公羊傳以為成宋亂之一端。</p><p>桓公二年，「夏，四月，取郜大鼎于宋。戊申，納于太廟。」</p><p>郜大鼎者，郜國之器，宋督弒君後取之以納于太廟。公羊傳以為成宋亂之舉。蓋[[宋督弒其君與夷]]，魯取其鼎，是助亂也。</p><p><strong>所出</strong>：《春秋公羊傳 · 桓公》 — https://zh.wikisource.org/wiki/春秋公羊傳/桓公</p></article></main></div></div>
