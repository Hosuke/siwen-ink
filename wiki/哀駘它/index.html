    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 哀駘它</nav></header><main><article><h1>哀駘它</h1><p>衛國醜丈夫，其德充而人悅之。</p><p>哀駘它，衛人也，容貌甚醜，然丈夫見之，思而不能去；妇人見之，請於父母曰「與為人妻，寧為夫子妾」，十數而未止。未嘗有所倡，常和人而已。無君人之位以濟人之死，無聚祿以望人之腹，又以惡駭天下，和而不唱，知不出乎四域，而雌雄合乎前。魯哀公召而觀之，果以惡駭天下；與相處，不至以月數，而哀公有意乎其為人；不及期年，而哀公信之。國無宰，哀公欲傳之以國，彼悶然而應，氾若而辭。竟不受而去。仲尼論之曰：是必才全而德不形者也。</p><p><strong>所出</strong>：《莊子 · 德充符》 — https://zh.wikisource.org/wiki/莊子/德充符</p></article></main></div></div>
