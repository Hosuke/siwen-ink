    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 信武侯</nav></header><main><article><h1>信武侯</h1><p>靳歙封信武侯，食邑四千六百户，定南郡，取楚王信。</p><p>信武侯靳歙，以中涓從起宛朐，擊秦軍、項籍，功最多。從定江陵，降柱國、大司馬以下八人，身得江陵王，生致之雒陽，因定南郡。從至陳，取楚王信，剖符世世勿絕，定食四千六百户，號信武侯。從擊代、韓信、黥布，益封定食五千三百户。高后五年卒，謚肃侯。子亭嗣，坐事國人過律，孝文後三年夺侯。</p><p><strong>所出</strong>：《史記 · 卷098》 — https://zh.wikisource.org/wiki/史記/卷098</p></article></main></div></div>
