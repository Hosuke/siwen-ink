    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 六書</nav></header><main><article><h1>六書</h1><p>周官保氏所掌漢字構造之六法。</p><p>六書者，周官保氏掌教之書法也。文心雕龍記漢初章律，明著厥法，太史學童，教試六體；又吏民上書，字謬輒劾。是以馬字缺畫，而石建懼死，雖-{云}-性慎，亦時重文也。</p><p><strong>所出</strong>：《文心雕龍 · 練字》 — https://zh.wikisource.org/wiki/文心雕龍/練字</p></article></main></div></div>
