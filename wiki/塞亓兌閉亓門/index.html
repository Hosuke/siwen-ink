    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 塞亓兌閉亓門</nav></header><main><article><h1>塞亓兌閉亓門</h1><p>閉塞感官，終身不苦</p><p>「塞亓兌，閉亓門，終身不堇。」言[[以為天下母]]之後，當塞其耳目口鼻之兌，閉其出入之門，使心不外馳，神不外散，則終身不為勤苦所困。不塞不閉，則馳騖於外，疲於應物，終身不勤而自勤。塞閉者，非杜絕耳目也，去其躁用，歸諸虛靜，使[[沒身不殆]]之要道也。帛書與王弼本「塞其兌，閉其門，終身不勤」義同，「堇」「勤」古通。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第十五章 守母》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
