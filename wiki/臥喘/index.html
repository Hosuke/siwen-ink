    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 臥喘</nav></header><main><article><h1>臥喘</h1><p>逆氣不得臥，水氣客之。</p><p>不得臥而息有音者，陽明之逆也。陽明者胃脈也，胃者六府之海，其氣亦下行，陽明逆不得從其道，故不得臥也。夫起居如故而息有音者，此肺之絡脈逆也。</p><p>不得臥臥則喘者，是水氣之客也。腎者水藏，主津液，主臥與喘也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第九卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第九卷</p></article></main></div></div>
