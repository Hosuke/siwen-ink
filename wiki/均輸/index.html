    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 均輸</nav></header><main><article><h1>均輸</h1><p>桑弘羊置均輸官於郡國，相灌輸而平物價。</p><p>弘羊以諸官各自市，相與爭，物故騰躍，而天下賦輸或不償其僦費，乃請置大農部丞數十人，分部主郡國，各往往縣置均輸鹽鐵官，令遠方各以其物貴時商賈所轉販者為賦，而相灌輸。置平準于京師，都受天下委輸。召工官治車諸器，皆仰給大農。大農之諸官盡籠天下之貨物，貴即賣之，賤則買之。如此，富商大賈無所牟大利，則反本，而萬物不得騰踴。故抑天下物，名曰「平準」。天子以為然，許之。</p><p><strong>所出</strong>：《史記 · 卷030》 — https://zh.wikisource.org/wiki/史記/卷030</p></article></main></div></div>
