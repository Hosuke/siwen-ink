    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五實五虛</nav></header><main><article><h1>五實五虛</h1><p>脈盛皮熱腹脹前後不通悶瞀為五實，脈細皮寒氣少泄利飲食不入為五虛，皆死候；而漿粥止泄、汗利後通者可以回生。</p><p>五實者：脈盛、皮熱、腹脹、前後不通、悶瞀。
五虛者：脈細、皮寒、氣少、泄利前後、飲食不入。</p><p>實者可以回生者：身汗得後利，則實者活。
虛者可以回生者：漿粥入胃，泄注止，則虛者活。</p><p><strong>所出</strong>：《黃帝內經 · 素問第六卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第六卷</p></article></main></div></div>
