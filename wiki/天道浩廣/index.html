    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天道浩廣</nav></header><main><article><h1>天道浩廣</h1><p>天道浩廣而無形，太玄虛寂不可以名象求之。</p><p>《參同契》曰：「天道其浩廣，太玄無形容，虛寂不可睹，匡廓以消亡。」此言道之本體不可以形器求也。天道廣大無垠，太玄虛靜無聲，非有方所形象之可見，亦非言說思量之可及。學者若以為可馳騁測度、臆揣臆度，是乃謬誤失緒，反自敗傷也。故修道者貴乎虛心內觀，與道合真，不可以區區言象求之。</p><p><strong>所出</strong>：《周易參同契 · 34章》 — https://zh.wikisource.org/wiki/周易參同契/34章</p></article></main></div></div>
