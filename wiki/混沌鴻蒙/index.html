    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 混沌鴻蒙</nav></header><main><article><h1>混沌鴻蒙</h1><p>天地未形之時，陰陽未分，狀若雞子，是為混沌。</p><p>混沌鴻蒙，喻未有天地之先，渾然一氣，未分清濁。牝牡相從，滋液潤澤，[[施化流通]]。此章以混沌喻[[晦朔合符]]之際，陰陽未判之狀。[[晦朔之間，合符行中]]，當此時也，鴻蒙之炁動而未形，牝者下而為根，牡者上而為蒂，二者相從而成氤氳。天地神明，不可度量，[[利用安身，隱形而藏]]，皆本乎此。伯陽以混沌象人身心未煉之時，修道者必先返此混沌，使[[牝牡相從]]而後，可以成丹。</p><p><strong>所出</strong>：《周易參同契 · 18章》 — https://zh.wikisource.org/wiki/周易參同契/18章</p></article></main></div></div>
