    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 為學者日益</nav></header><main><article><h1>為學者日益</h1><p>學日益博，道日損減。</p><p>為學者日益，聞道者日損。學者，外求諸物，日求其博；聞道者，內返諸己，日求其簡。學日益，智巧滋而離道遠；道日損，嗜欲去而歸於無。帛書本「損」作「云」，義可互通。學者日益，其益也有涯；聞道日損，其損也無已。</p><p><strong>所出</strong>：《老子 (帛書本) · 章四十八》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
