    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 輕則失臣</nav></header><main><article><h1>輕則失臣</h1><p>輕淫亡臣，治身淫佚失精</p><p>輕淫者失其臣，治身者淫佚則失其精。臣，民之輔；精，神之主。失精則神散，失臣則國危。與[[得道多助]]對觀：得道者多助，輕躁者失臣，理之相反也。[[靜為躁君]]失其令，[[輕則失臣]]喪其輔，上下相失，而國與身俱斃矣。</p><p><strong>所出</strong>：《老子河上公章句 · 重德》 — https://zh.wikisource.org/wiki/老子河上公章句/上
===</p></article></main></div></div>
