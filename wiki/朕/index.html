    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 朕</nav></header><main><article><h1>朕</h1><p>秦始皇定皇帝自稱為朕。</p><p>丞相綰等議曰：「臣等謹與博士議曰：『古有天皇，有地皇，有泰皇，泰皇最貴。』臣等昧死上尊號，王為『泰皇』。命為『制』，令為『詔』，天子自稱曰『朕』。」</p><p>王曰：「去『泰』，著『皇』，采上古『帝』位號，號曰『皇帝』。」</p><p>制曰：「朕聞太古有號毋謚，中古有號，死而以行為謐。如此，則子議父，臣議君也，甚無謂，朕弗取焉。自今已來，除謚法。朕為始皇帝。後世以計數，二世三世至于萬世，傳之無窮。」</p><p><strong>所出</strong>：《史記 · 卷006》 — https://zh.wikisource.org/wiki/史記/卷006</p></article></main></div></div>
