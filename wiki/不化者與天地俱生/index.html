    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不化者與天地俱生</nav></header><main><article><h1>不化者與天地俱生</h1><p>形有磨而神未嘗化，以不化應化，千變萬化而未始有極。</p><p>且人有戒形而無損於心，有綴宅而無耗精。夫癩者趨不變，狂者形不虧，神將有所遠徙，孰暇知其所為！故形有摩而神未嘗化者，以不化應化，千變萬化，而未始有極。化者，複歸於無形也；不化者，與天地俱生也。夫木之死也，青青去之也。夫使木生者豈木也？猶充形者之非形也。故生生者未嘗死也，其所生則死矣；化物者未嘗化也，其所化則化矣。</p><p><strong>所出</strong>：《淮南子 · 精神訓》 — https://zh.wikisource.org/wiki/淮南子/精神訓</p></article></main></div></div>
