    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 王餞于郿</nav></header><main><article><h1>王餞于郿</h1><p>王於郿地設宴餞行，申伯遂南歸謝土。</p><p>「申伯信邁，王餞于郿」，言申伯決意南行，王於郿地設宴以餞之也。郿，周地，在今陝西境。申伯南歸謝土，王親主餞禮，恩遇之隆，可謂至矣。</p><p><strong>所出</strong>：《詩經 · 崧高》 — https://zh.wikisource.org/wiki/詩經/崧高</p></article></main></div></div>
