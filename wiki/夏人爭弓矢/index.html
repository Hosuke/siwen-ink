    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 夏人爭弓矢</nav></header><main><article><h1>夏人爭弓矢</h1><p>執弓不可以射，執矢不可以發，偏一不可以成事。</p><p>若愛典而惡華，則兼通之理偏，似夏人爭弓矢，執一不可以獨射也。</p><p>好尚之偏，害理同然。愛典雅而惡華麗，則失兼通之理，譬如夏人爭弓爭矢，各執其一，皆不能射。弓矢相須，典華亦當並濟也。</p><p><strong>所出</strong>：《文心雕龍 · 定勢》 — https://zh.wikisource.org/wiki/文心雕龍/定勢</p></article></main></div></div>
