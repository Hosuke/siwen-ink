    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 審知生死</nav></header><main><article><h1>審知生死</h1><p>聖人獨決生死之義，養生安死，不以害之。</p><p>審知生，聖人之要也；審知死，聖人之極也。知生也者，不以害生，養生之謂也；知死也者，不以害死，安死之謂也。此二者，聖人之所獨決也。</p><p>凡生於天地之間，其必有死，所不免也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十</p></article></main></div></div>
