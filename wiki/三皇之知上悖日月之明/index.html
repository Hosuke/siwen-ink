    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三皇之知上悖日月之明</nav></header><main><article><h1>三皇之知上悖日月之明</h1><p>老子非三皇五帝之治，謂其知悖天地、亂莫甚焉。</p><p>老子曰：「余語汝三皇五帝之治天下。黃帝之治天下，使民心一，民有其親死不哭而民不非也。堯之治天下，使民心親。民有為其親殺其殺而民不非也。舜之治天下，使民心競……三皇之知，上悖日月之明，下睽山川之精，中墮四時之施。其知憯於𧓽蠆之尾，鮮規之獸，莫得安其性命之情者，而猶自以為聖人，不可恥乎？其無恥也？」</p><p><strong>所出</strong>：《莊子 · 天運》 — https://zh.wikisource.org/wiki/莊子/天運</p></article></main></div></div>
