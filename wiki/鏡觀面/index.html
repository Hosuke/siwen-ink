    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鏡觀面</nav></header><main><article><h1>鏡觀面</h1><p>人目不能自見，故借鏡以照；智者不能自知，故循道以正。</p><p>古之人目短於自見，故以鏡觀面；智短於自知，故以道正己。故鏡無見疵之罪，道無明過之怨。目失鏡，則無以正鬚眉；身失道，則無以知迷惑。</p><p><strong>所出</strong>：《韓非子 · 觀行》 — https://zh.wikisource.org/wiki/韓非子/觀行</p></article></main></div></div>
