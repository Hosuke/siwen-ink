    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 審明其計謀</nav></header><main><article><h1>審明其計謀</h1><p>聖人觀辭揆意，離合有守，審明同異以定計。</p><p>可與不可，審明其計謀，以原其同異。離合有守，先從其志。即欲捭之，貴周；即欲闘之，貴密。周密之貴㣲，而與道相追。</p><p><strong>所出</strong>：《鬼谷子 · 卷01》 — https://zh.wikisource.org/wiki/鬼谷子/卷01</p></article></main></div></div>
