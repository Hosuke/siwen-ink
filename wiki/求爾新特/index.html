    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 求爾新特</nav></header><main><article><h1>求爾新特</h1><p>詩人言夫別求新配，以喻昏姻之變也。</p><p>特，匹也，指新配之偶。[[求爾新特]]者，言夫不思舊姻，反求新人以為匹也。此與[[不思舊姻]]相承，皆言夫之負心，昏姻之道乖矣。</p><p><strong>所出</strong>：《詩經 · 我行其野》 — https://zh.wikisource.org/wiki/詩經/我行其野</p></article></main></div></div>
