    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 該之變而道之</nav></header><main><article><h1>該之變而道之</h1><p>郊牛有變，則記者該貫其變，而以正道引導之。</p><p>鼷鼠食郊牛角，改卜牛。穀梁子曰：「此該之變而道之也。」蓋郊牛已傷，不可再用；改卜者，所以應變也。然經之記載此事，非徒述其變，乃欲以正道引導後世。其說以為：郊牛日展觓角而知傷，展道盡矣。郊之禮，貴得其時，大其禮，養牲雖小，不備可也。又言卜郊之法：先以下辛卜正月上辛，不從則遞卜之，終至三月上辛，不從則不郊矣。此皆該貫其變而道之以正之義也。</p><p><strong>所出</strong>：《春秋穀梁傳 · 哀公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/哀公</p></article></main></div></div>
