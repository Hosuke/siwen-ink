    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 醇謹無他</nav></header><main><article><h1>醇謹無他</h1><p>醇厚而謹慎，別無旁騖。</p><p>建陵侯[[衞綰]]，「以戲車為郎，事文帝，功次遷為中郎將，醇謹無他」。[[直不疑]]亦「不好立名稱，稱為長者」。[[張歐]]為御史大夫，「自歐為吏，未嘗言案人，專以誠長者處官」。皆[[醇厚]]之臣，以[[恭謹無與比]]著稱，而無他腸異志者也。</p><p><strong>所出</strong>：《史記 · 卷103》 — https://zh.wikisource.org/wiki/史記/卷103</p></article></main></div></div>
