    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 梁孝王之薨</nav></header><main><article><h1>梁孝王之薨</h1><p>梁王北獵良山，獻牛足出背上，王惡之，遂病熱卒。</p><p>三十五年冬，復朝。上疏欲留，上弗許。歸國，意忽忽不樂。北獵良山，有獻牛，足出背上，孝王惡之。六月中，病熱，六日卒，謚曰孝王。</p><p>孝王未死時，財以巨萬計，不可勝數。及死，藏府餘黃金尚四十餘萬斤，他財物稱是。</p><p><strong>所出</strong>：《史記 · 卷058》 — https://zh.wikisource.org/wiki/史記/卷058</p></article></main></div></div>
