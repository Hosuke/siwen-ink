    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 苟亦無信</nav></header><main><article><h1>苟亦無信</h1><p>戒勿輕信浮言也。</p><p>苟亦無信，乃《采苓》首章之誡也。言聞人之為言，苟可以信之耶？無之也。戒人勿輕信浮言。</p><p>詩人以此為誡，意謂世間偽言滋多，若不加辨察而輕信之，未有不為其所誤者。《書》曰「小人怨汝詈汝，則皇自敬德」，亦此意也。</p><p><strong>所出</strong>：《詩經 · 采苓》 — https://zh.wikisource.org/wiki/詩經/采苓</p></article></main></div></div>
