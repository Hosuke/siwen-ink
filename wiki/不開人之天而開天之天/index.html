    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不開人之天，而開天之天</nav></header><main><article><h1>不開人之天，而開天之天</h1><p>啟發自然之天性則德生，啟發人為之智巧則賊生。</p><p>不開人之天，而開天之天，開天者德生，開人者賊生。不厭其天，不忽於人，民幾乎以其真！</p><p><strong>所出</strong>：《莊子 · 達生》 — https://zh.wikisource.org/wiki/莊子/達生</p></article></main></div></div>
