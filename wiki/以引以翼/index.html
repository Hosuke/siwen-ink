    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以引以翼</nav></header><main><article><h1>以引以翼</h1><p>導之前路，輔之兩翼。</p><p>有馮有翼，有孝有德，以引以翼。言賢才者，馮以為依，翼以為輔，孝德兼備，相引相翼，以成君子之功也。</p><p><strong>所出</strong>：《詩經 · 卷阿》 — https://zh.wikisource.org/wiki/詩經/卷阿</p></article></main></div></div>
