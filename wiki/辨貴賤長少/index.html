    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 辨貴賤長少</nav></header><main><article><h1>辨貴賤長少</h1><p>禮之為用，在於明貴賤之分，別長幼之序，使各得其宜也。</p><p>君子既得其養，又好其辨。辨者，貴賤有等，長少有差，貧富輕重皆有稱也。天子大路越席以養體，側載臭茝以養鼻，前有錯衡以養目，和鸞之聲以養耳，龍旂九斿以養信，寢兕持虎以養威。辨立而序明，序明而天下治。</p><p><strong>所出</strong>：《史記 · 卷023》 — https://zh.wikisource.org/wiki/史記/卷023</p></article></main></div></div>
