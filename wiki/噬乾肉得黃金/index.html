    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 噬乾肉得黃金</nav></header><main><article><h1>噬乾肉得黃金</h1><p>噬乾肉而得黃金，柔中而有剛德，終无咎</p><p>六五之爻，噬乾肉，得黃金。乾肉之噬，難於噬肤，而易於乾胏。黃金者，剛柔之中色，黃為土之中色，金為剛中之物也。</p><p>六五居尊而柔，噬乾肉者，以柔噬物也；得黃金者，柔中含剛，不失其正也。然貞厲者，居尊行刑，危之道也；无咎者，以柔中而能慎刑，故得无咎也。</p><p><strong>所出</strong>：《周易 · 噬嗑》 — https://zh.wikisource.org/wiki/周易/噬嗑</p></article></main></div></div>
