    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 和吉言</nav></header><main><article><h1>和吉言</h1><p>和暢善言於百姓，戒浮言。</p><p>汝克黜乃心，施實德于民，至于婚友；丕乃敢大言，汝有積德。乃不畏戎毒于遠邇；惰農自安，不昏作勞，不服田畝，越其罔有黍稷。汝不和（宣）吉言于百姓，惟汝自生毒。</p><p>盤庚告誡在位之臣。言汝既能[[黜乃心]]，[[施實德]]于民，至于婚友，則可大言有積德；苟[[不和吉言于百姓]]，而惟浮言是播，是自生其毒也。[[和吉言]]者，宣暢王德，使民曉然知上意，此[[尚書]]所述教化之義。</p><p><strong>所出</strong>：《尚書 · 盤庚上》 — https://zh.wikisource.org/wiki/尚書/盤庚上</p></article></main></div></div>
