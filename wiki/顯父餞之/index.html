    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 顯父餞之</nav></header><main><article><h1>顯父餞之</h1><p>顯父設宴餞行，清酒嘉殽，禮遇之隆也。</p><p>顯父餞韓侯于屠，清酒百壺，炰鼈鮮魚，筍蒲之蔌，乘馬路車之贈，籩豆有且，侯氏燕胥。言其餞送之禮備盡，恩誼之篤也。</p><p><strong>所出</strong>：《詩經 · 韓奕》 — https://zh.wikisource.org/wiki/詩經/韓奕</p></article></main></div></div>
