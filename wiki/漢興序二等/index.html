    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 漢興序二等</nav></header><main><article><h1>漢興序二等</h1><p>漢初封建，唯存王、侯二等，非劉氏及無功者不得王。</p><p>高祖既定天下，序二等之爵。末年立約：「非劉氏而王者，若無功上所不置而侯者，天下共誅之。」是時，高祖子弟同姓為王者九國，雖獨長沙異姓，而功臣侯者百有餘人。自是以還，諸侯王有親疏之別，而侯者以功受賞，王者以親傳封，等級分明，遂與周制異矣。</p><p><strong>所出</strong>：《史記 · 卷017》 — https://zh.wikisource.org/wiki/史記/卷017</p></article></main></div></div>
