    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 輶乘</nav></header><main><article><h1>輶乘</h1><p>武王以歌酬周公，稱其武勇可以靖難。</p><p>王夜爵酬周公，作歌一終曰《輶乘》：「輶乘既飭，人服余不胄。士奮，殹民之秀。方壯方武，克燮仇讎。嘉爵速飲，後爵乃復。」</p><p><strong>所出</strong>：《尚書 · 耆夜》 — https://zh.wikisource.org/wiki/尚書/耆夜</p></article></main></div></div>
