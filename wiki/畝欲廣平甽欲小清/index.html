    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 畝欲廣平甽欲小清</nav></header><main><article><h1>畝欲廣平甽欲小清</h1><p>述田疇之形制。</p><p>所謂今之耕也，營而無獲者：其蚤者先時，晚者不及時，寒暑不節，稼乃多菑，實。其為畝也，高而危則澤奪，陂則埒，見風則𠎮，高培則拔，寒則雕，熱則脩，一時而五六死，故不能為來。不俱生而俱死，虛稼先死，眾盜乃竊。望之似有餘，就之則虛。農夫知其田之易也，不知其稼之疏而不適也；知其田之際也，不知其稼居地之虛也；不除則蕪，除之則虛，此事之傷也。故畝欲廣以平，甽欲小以清；下得陰，上得陽，然後咸生。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十六》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十六</p></article></main></div></div>
