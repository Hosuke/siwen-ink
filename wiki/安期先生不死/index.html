    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 安期先生不死</nav></header><main><article><h1>安期先生不死</h1><p>安期先生已千歲，見秦始皇而不死；所受金璧阜鄉亭赤玉舄，乃仙蹟也。</p><p>安期先生者，賣藥於海邊，琅琊人傳世見之，計已千年。秦始皇請與語，三日三夜。其言高，其旨遠，博而有證，始皇異之，乃賜之金璧，可直數千萬，安期受而置之於阜鄉亭，以赤玉舄一量為報，留書曰：「複數千載，求我於蓬萊山。」如此，是為見始皇時已千歲矣，非為死也。</p><p><strong>所出</strong>：《抱朴子 · 卷13》 — https://zh.wikisource.org/wiki/抱朴子/卷13</p></article></main></div></div>
