    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五穀六仞</nav></header><main><article><h1>五穀六仞</h1><p>極言五穀之豐，菰粱之設，飲食之美。</p><p>五穀六仞，設菰粱只。鼎臑盈望，和致芳只。內鶬鴿鵠，味豺羹只。魂乎歸徠，恣所嘗只！</p><p>文極言物產之阜、食味之美。五穀堆積至六仞之量，菰粱錯設以為常饌，鼎中羹臑盈目，芳氣滿堂。飛禽走獸，鹹入烹調。言飲食之盛，欲招魂魄之速歸也。</p><p><strong>所出</strong>：《楚辭 · 大招》 — https://zh.wikisource.org/wiki/楚辭/大招</p></article></main></div></div>
