    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天子聽男教，后聽女順</nav></header><main><article><h1>天子聽男教，后聽女順</h1><p>天子理陽道而后治陰德，一陰一陽、相須而成，此盛德之要。</p><p>故曰：「天子聽男教，后聽女順；天子理陽道，后治陰德；天子聽外治，后聽內職。教順成俗，外內和順，國家理治。此之謂盛德。」</p><p><strong>所出</strong>：《禮記 · 昏義》 — https://zh.wikisource.org/wiki/禮記/昏義</p></article></main></div></div>
