    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 青夷宮</nav></header><main><article><h1>青夷宮</h1><p>五藏之一，主肝，與香風相扇者也</p><p>青夷宮者，上清五藏宮府之一，肝神之居也。肝屬木，配東方，其色青，故曰青夷。宮者，神明所舍之宅也。</p><p>《上清大洞真經》云「香風扇三寶，五藏映青夷宮名」，是則青夷宮稟香風之和氣，以扇護三寶；五藏皆各有宮，宮中神明映徹，乃得上通玉清也。肝藏魂，青象東方之德，夷者平也、治也，肝氣平和，則魂魄安定，眼目明朗。</p><p><strong>所出</strong>：《上清大洞真經 · 28章》 — https://zh.wikisource.org/wiki/上清大洞真經/28章</p></article></main></div></div>
