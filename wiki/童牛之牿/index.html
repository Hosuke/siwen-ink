    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 童牛之牿</nav></header><main><article><h1>童牛之牿</h1><p>畜止於初，大吉之象。</p><p>六四「童牛之牿，元吉」，童牛，犢也；牿，衡木也，施於牛角以止其牴觸。象曰「有喜也」。言治之於早，止之於初，未形之時先有以防制之，使其德性不流於邪，故大吉。此聖人杜漸防微之道也。</p><p><strong>所出</strong>：《周易 · 大畜》 — https://zh.wikisource.org/wiki/周易/大畜</p></article></main></div></div>
