    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蕭何填撫巴蜀</nav></header><main><article><h1>蕭何填撫巴蜀</h1><p>漢王東定三秦，何以丞相留守巴蜀，填撫諭告，使給軍食。</p><p>漢王引兵東定三秦，何以丞相留收巴蜀，填撫諭告，使給軍食。夫巴蜀之民，阻險而難制，撫之則可以給餉，擾之則適以生變。蕭何之留守，非茍焉而已，乃為大軍根本之地也。</p><p><strong>所出</strong>：《史記 · 卷053》 — https://zh.wikisource.org/wiki/史記/卷053</p></article></main></div></div>
