    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 春夏秋冬行政</nav></header><main><article><h1>春夏秋冬行政</h1><p>政令之施，各順其時；春夏秋冬，行各有當。</p><p>行春而用夏政，則風散而物落；行夏而用春政，則雷電妄作；行秋而用夏政，則葉枯而華耗；行冬而用秋政，則霧塞而蔽塞。唯春行冬政肅，夏行春政風，秋行夏政葉，冬行秋政霧，乃得五行之序，萬物以成。此聖人之治，必因時制宜，不逆五行之性者也。</p><p><strong>所出</strong>：《管子 · 第09篇幼官圖》 — https://zh.wikisource.org/wiki/管子/第09篇幼官圖</p></article></main></div></div>
