    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 武王八年征伐耆</nav></header><main><article><h1>武王八年征伐耆</h1><p>武王八年出兵征伐耆國，一舉戡定。</p><p>武王八年，興師伐耆，戎輿所指，耆師大潰。旋師告廟，行飲至之禮於文王太室。畢公、召公、周公、辛公甲、作策逸、呂尚父咸與宴享，班序有差，監禮以正。</p><p><strong>所出</strong>：《尚書 · 耆夜》 — https://zh.wikisource.org/wiki/尚書/耆夜</p></article></main></div></div>
