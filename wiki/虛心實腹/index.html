    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 虛心實腹</nav></header><main><article><h1>虛心實腹</h1><p>聖人治民，空其心而實其腹。</p><p>金丹之道，虛心實腹兩般事業。虛心者，虛人心，修性之事；實腹者，實道心，修命之事。若不分心之真假是非，一概虛之，不但不能了命，亦不能了性。若識其心，不須虛人心，先煉真鉛之道心以實其腹。腹實則集義而生，客氣自消，人心自虛。四象和，五行攅，金玉滿堂，命寶到手，可以虛人心而養道心，了其性宗，歸於無何有之鄉矣。</p><p><strong>所出</strong>：《悟真直指 · 卷二》 — https://zh.wikisource.org/wiki/悟真直指/卷二</p></article></main></div></div>
