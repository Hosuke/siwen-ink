    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 中者上不及堯舜下不為桀紂</nav></header><main><article><h1>中者上不及堯舜下不為桀紂</h1><p>言勢者取其中：中人抱法處勢，堯桀之至，皆可以治。</p><p>且夫堯舜、桀紂，千世而一出，是比肩隨踵而生也。世之治者不絶於中，吾所以言勢者，中也。中者，上不及堯舜，而下亦不為桀紂。</p><p>抱法處勢則治，背法去勢則亂。此[[勢治勢亂]]之要旨，非必待聖人而後治也。</p><p><strong>所出</strong>：《韓非子 · 難勢》 — https://zh.wikisource.org/wiki/韓非子/難勢</p></article></main></div></div>
