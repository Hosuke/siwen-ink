    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 帝顓頊</nav></header><main><article><h1>帝顓頊</h1><p>黃帝之孫，繼承帝位，北至于幽陵，南至于交趾，西至于流沙，東至于蟠木。</p><p>帝顓頊者，黃帝之孫而昌意之子也。靜淵以有謀，疏通而知事；養材以任地，載時以象天，依鬼神以制義，治氣以教化，絜誠以祭祀。北至于幽陵，南至于交趾，西至于流沙，東至于蟠木。動靜之物，大小之神，日月所照，莫不砥屬。</p><p>生子曰窮蟬。窮蟬崩，而帝嚳之孫立，是爲帝嚳。</p><p><strong>所出</strong>：《史記 · 卷001》 — https://zh.wikisource.org/wiki/史記/卷001</p></article></main></div></div>
