    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 筮宅冢人物土</nav></header><main><article><h1>筮宅冢人物土</h1><p>蔔筮以擇葬地。</p><p>蔔宅，冢人物土。蔔日吉，告從于主婦；主婦哭，妇人皆哭。啟之昕，外內不哭。蔔宅者，蔔問葬地之吉凶也。</p><p><strong>所出</strong>：《儀禮 · 既夕禮》 — https://zh.wikisource.org/wiki/儀禮/既夕禮</p></article></main></div></div>
