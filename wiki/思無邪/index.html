    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 思無邪</nav></header><main><article><h1>思無邪</h1><p>《詩》三百篇，可一言以蔽之，曰思無邪。</p><p>《論語》載孔子之言曰：「詩三百，一言以蔽之，曰思無邪。」言《詩》之義廣矣，然其要歸於一。詩者，吟詠情性也。情性得其正，則思無邪僻。故聖人刪《詩》以教人，使人溫柔敦厚而不流於邪也。</p><p><strong>所出</strong>：《論語 · 爲政第二》 — https://zh.wikisource.org/wiki/論語/爲政第二</p></article></main></div></div>
