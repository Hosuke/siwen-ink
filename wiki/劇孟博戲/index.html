    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 劇孟博戲</nav></header><main><article><h1>劇孟博戲</h1><p>劇孟行大類朱家，而好博，其母死，送喪蓋千乘，家無餘財。</p><p>劇孟行大類朱家，而好博，多少年之戲。然劇孟母死，自遠方送喪蓋千乘。及劇孟死，家無餘十金之財。</p><p><strong>所出</strong>：《史記 · 卷124》 — https://zh.wikisource.org/wiki/史記/卷124</p></article></main></div></div>
