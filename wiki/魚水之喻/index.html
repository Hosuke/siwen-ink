    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 魚水之喻</nav></header><main><article><h1>魚水之喻</h1><p>人在於道，若魚之在水；得水而生，失水而死。</p><p>抱朴子續此喻以言禮之於人，尤急於水之於魚。其言曰：「魚之失水，雖暫假息，然枯糜可必待也。人之棄禮，雖猶面見然，而禍敗之階也。」蓋水所以活魚，亦以全魚；禮所以容民，亦以衛國。失水則魚枯，廢禮則國亡，理勢然也。又引魯秉周禮而暴兵不加、魏式干木而銳冠旋旆，以證禮之為國之楨榦。若夫楚之振槁、秦之折柳，皆棄禮之本、喪根柢之召也已。</p><p>  <strong>所出</strong>：《抱朴子 · 卷26》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷26</p></article></main></div></div>
