    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 郭解往時之蹤</nav></header><main><article><h1>郭解往時之蹤</h1><p>郭解少時陰賊慨不快意，身所殺甚眾，及長乃折節為善。</p><p>解為人短小精悍，不飲酒。少時陰賊，慨不快意，身所殺甚眾。以軀借交報仇，藏命作姦剽攻，不休及鑄錢掘冢，固不可勝數。適有天幸，窘急常得脫，若遇赦。</p><p><strong>所出</strong>：《史記 · 卷124》 — https://zh.wikisource.org/wiki/史記/卷124</p></article></main></div></div>
