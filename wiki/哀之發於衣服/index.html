    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 哀之發於衣服</nav></header><main><article><h1>哀之發於衣服</h1><p>居喪衣服，視喪服之差而異其升數。</p><p>居喪之衣服，視服之輕重以為節。斬衰三升，齊衰四升五升六升，大功七升八升九升，小功十升十一升十二升，緦麻十五升去其半。有事其縷、無事其布曰緦。升者，布縷縷八十縷為升，升數愈多則布愈密，服亦愈重也。</p><p><strong>所出</strong>：《禮記 · 間傳》 — https://zh.wikisource.org/wiki/禮記/間傳</p></article></main></div></div>
