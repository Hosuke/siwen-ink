    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 取易辭也</nav></header><main><article><h1>取易辭也</h1><p>師而被取，是鄭、宋皆病，以其易言之。</p><p>宋皇瑗帥師取鄭師于雍丘，又取宋師于嵒。穀梁子皆曰：「取，易辭也。以師而易取，鄭病矣！」「以師而易取，宋病矣！」蓋「取」者，非大戰而敗之謂，乃以小而易大，以整而易散也。兩師相接，一方之師輕易為他所取，是彼之弱可知也。書「取」不言戰而言取，明其力之不敵，亦病其輕忽也。</p><p><strong>所出</strong>：《春秋穀梁傳 · 哀公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/哀公</p></article></main></div></div>
