    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 祝雞翁</nav></header><main><article><h1>祝雞翁</h1><p>洛人，居尸鄉北山下，養雞百餘年，有名千萬，暮栖樹上，後昇吳山。</p><p>祝雞翁，洛人，居尸鄉北山下。養雞百餘年，雞皆有名字，千餘草，暮栖樹上，晝放散之。欲引，呼名即種別而至。賣雞及子，得千餘萬錢，輒置錢去。</p><p>之昊，作養魚池，後昇昊山，白鶴孔雀，常止其傍。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 3》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/3</p></article></main></div></div>
