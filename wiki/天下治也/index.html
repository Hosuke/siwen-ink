    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天下治也</nav></header><main><article><h1>天下治也</h1><p>蠱有大通之德，能致天下治。</p><p>彖傳曰：「蠱，元亨，而天下治也。」蓋蠱之所以元亨者，以剛上柔下、巽而止之象，能撥亂反正，故大通而天下治。</p><p><strong>所出</strong>：《周易 · 蠱》 — https://zh.wikisource.org/wiki/周易/蠱</p></article></main></div></div>
