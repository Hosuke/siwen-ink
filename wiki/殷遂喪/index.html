    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 殷遂喪</nav></header><main><article><h1>殷遂喪</h1><p>殷邦之亡，已迫今日</p><p>微子悲殷之將亡，曰：「殷遂喪，越至于今。」言殷之亡，已及今日，無復可延。天既厭殷，淪喪之期迫矣。讀此可見殷之氣數已盡，雖欲扶持而不可得也。</p><p><strong>所出</strong>：《尚書 · 微子》 — https://zh.wikisource.org/wiki/尚書/微子</p></article></main></div></div>
