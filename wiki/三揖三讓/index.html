    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三揖三讓</nav></header><main><article><h1>三揖三讓</h1><p>主人與賔入廟升堂之際，揖三次讓三次之禮也。</p><p>主人迎賔，揖衆賔，入。主人與賔三揖，至于階，三讓，主人升，賔升。</p><p>入門之時，主人揖先入；賔厭介，入門左；介厭衆賔，入；衆賔皆入門左；北上。主人與賔至于楹閒，又三揖，循梠而行，至西階，主人三讓，俟賔先升，主人乃升。</p><p>是禮也，《曲禮》曰「主人與客讓，登主人先登」，今鄉飲酒禮略異，蓋主人先升，賔從之。</p><p><strong>所出</strong>：《儀禮 · 鄉飲酒禮》 — https://zh.wikisource.org/wiki/儀禮/鄉飲酒禮</p></article></main></div></div>
