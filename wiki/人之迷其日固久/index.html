    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 人之迷其日固久</nav></header><main><article><h1>人之迷其日固久</h1><p></p><p>老子既言禍福倚伏、正善迭化，乃歎世人迷於此理，其日已久。豈特今日然哉，蓋自往昔已然。昧於相代相奪之機，以形名為實、以耳目為真，執一是而廢百非，適以增其眩惑耳。</p><p>  <strong>所出</strong>：《道德經 (王弼本) · 五十八章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
