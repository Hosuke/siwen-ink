    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 伯樂之罪</nav></header><main><article><h1>伯樂之罪</h1><p>馬加衡扼月題而知介倪闉枙騺曼詭銜竊轡，是伯樂激之使然，故馬之知而能至盜者，伯樂之罪。</p><p>夫加之以衡扼，齊之以月題，而馬知介倪、闉枙、騺曼、詭銜、竊轡。故馬之知而能至盜者，伯樂之罪也。</p><p><strong>所出</strong>：《莊子 · 馬蹄》 — https://zh.wikisource.org/wiki/莊子/馬蹄</p></article></main></div></div>
