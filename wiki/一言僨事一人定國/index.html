    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 一言僨事一人定國</nav></header><main><article><h1>一言僨事一人定國</h1><p>一人言行，足以傾覆邦國或安定天下。</p><p>大學論治國之道，以為在上者之一言一行，關係天下之盛衰，所謂「一家仁，一國興仁；一家讓，一國興讓；一人貪利，一國作亂；其機如此」，此之謂「一言僨事，一人定國」。</p><p>蓋天子為萬民之表，仁讓則民從，貪利則民亂，其效立竿見影。是故治國者不可不慎也。</p><p><strong>所出</strong>：《禮記 · 大學 (證釋本)》 — https://zh.wikisource.org/wiki/禮記/大學 (證釋本)</p></article></main></div></div>
