    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 京師依</nav></header><main><article><h1>京師依</h1><p>公劉卜宅於京，依之以立朝廷、序宗族也。</p><p>篤公劉，于京斯依，蹌蹌濟濟，俾筵俾几。既登乃依，乃造其曹，執豕于牢，酌之用匏。食之飲之，君之宗之。</p><p>京師既定，公劉依之以立朝。蹌蹌濟濟，容貌威儀之盛也。俾筵俾几，設几席以待群臣也。既登乃依，既登筵而倚几也。乃造其曹，祭先卜也。執豕于牢，殺豚以享也。酌之用匏，儉以禮也。食之飲之，群臣饗宴也。君之宗之，為之君，為之宗，內外之分定焉。</p><p>是詩也，美公劉厚民，故依京師以居之，非以自奉，實以治民也。</p><p><strong>所出</strong>：《詩經 · 公劉》 — https://zh.wikisource.org/wiki/詩經/公劉</p></article></main></div></div>
