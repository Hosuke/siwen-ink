    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 政不可不慎</nav></header><main><article><h1>政不可不慎</h1><p>為政當慎，善政則王，惡政則亡。</p><p>不能爲政者，田疇荒而國邑虛，朝廷兇而官府亂，公法廢而私曲行，倉廩虛而囹圄實，賢人退而姦民進。</p><p>其君子上諂諛而下中正，其士民貴得利而賤武勇，其庶人好飲食而惡耕農，於是財用匱而食飲薪菜乏。</p><p>上彌殘苟而無解舍，下愈覆鷙而不聽從，上下交引而不和同。故處不安而動不威，戰不勝而守不固，是以小者兵挫而地削，大者身死而國亡。</p><p>故以此觀之，則政不可不慎也。</p><p><strong>所出</strong>：《管子 · 第10篇五輔》 — https://zh.wikisource.org/wiki/管子/第10篇五輔</p></article></main></div></div>
