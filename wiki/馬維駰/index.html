    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 馬維駰</nav></header><main><article><h1>馬維駰</h1><p>駰，雜色馬，以喻使臣才性各異皆堪用。</p><p>「我馬維駰」，見於《詩·小雅·皇皇者華》第五章。</p><p>「駰」者，馬之淺黑雜白者也；《說文》「駰，馬陰白雜毛也」。詩言使臣以駰為馬，六轡既均，既均者，六轡調適無偏之意。維駒、維騏、維駱、維駰，各有色異，而皆可馳驅；詩人以馬之異色，比臣之異才，而同為國用，此聖人取士不遺一類之義。</p><p><strong>所出</strong>：《詩經 · 皇皇者華》 — https://zh.wikisource.org/wiki/詩經/皇皇者華</p></article></main></div></div>
