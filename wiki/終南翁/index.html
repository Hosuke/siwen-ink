    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 終南山翁</nav></header><main><article><h1>終南山翁</h1><p>以竹葉置渭水，舟行歸江南，留詩以驗。</p><p>江南人陳季卿至長安十年不第，謁僧青龍寺不遇，壁上有寰瀛圖，歎曰：「得此歸不悔無成。」有終南山翁折階前竹葉置圖上渭水中，曰：「注目於此即到。」季卿熟視，波濤洶湧，遂登舟。行次禪窟寺題詩；明日次潼關又題；旬餘至家，兄弟妻子迎見甚喜。信宿復別妻，飄然而去，家人驚異。倏忽復至渭水，趨青龍寺，山翁尚在，所題詩皆在。經月，家人來，言始知其異。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 44》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/44</p></article></main></div></div>
