    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 山下有澤損</nav></header><main><article><h1>山下有澤損</h1><p>山下有澤，損之象也。</p><p>《象》曰：「山下有澤，損。」象以成卦。上《艸》為山，下《兌》為澤，澤浸潤乎山根，山以是而成其高，此損之象也。山高而澤深，相得而益。君子觀之，知身有過盛之情欲，若澤之浸山，當損而去之，以成其德。</p><p><strong>所出</strong>：《周易 · 損》 — https://zh.wikisource.org/wiki/周易/損</p></article></main></div></div>
