    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 靈公問兵陳</nav></header><main><article><h1>靈公問兵陳</h1><p>衞靈公問孔子兵戎之事，孔子不對。</p><p>他日，靈公問兵陳。孔子曰：「俎豆之事則嘗聞之，軍旅之事未之學也。」明日，與孔子語，見蜚鴈，仰視之，色不在孔子。孔子遂行，復如陳。此衞靈公問兵而孔子不對之事也。</p><p><strong>所出</strong>：《史記 · 卷047》 — https://zh.wikisource.org/wiki/史記/卷047</p></article></main></div></div>
