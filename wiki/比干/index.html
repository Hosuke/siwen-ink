    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 比干</nav></header><main><article><h1>比干</h1><p></p><p>[[微子]]數諫紂不聽。[[比干]]曰：「為人臣者，不得不以死爭。」乃強諫紂。紂怒曰：「吾聞聖人心有七竅。」遂剖[[帝辛|紂]]之心。[[箕子]]懼，乃詳狂為奴，紂又囚之。</p><p>  周武王克殷，封比干之墓。</p><p>  <strong>所出</strong>：《史記 · 卷003》 — https://zh.wikisource.org/wiki/史記/卷003</p></article></main></div></div>
