    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 恬愉長算</nav></header><main><article><h1>恬愉長算</h1><p>抑情以堤防，禦性以轡奔，內保永年，外免釁累。</p><p>抱朴子云：「智者嚴櫽括於性理，不肆神以逐物，檢之以恬愉，增之以長算。其抑情也，劇乎堤防之備決；其禦性也，過乎腐轡之乘奔。故能內保永年，外免釁累也。」恬愉者，安樂之德；長算者，久遠之計。抑情如堤防之防水，禦性如轡馬之制奔，此治身之要道也。[[養生以不傷為本]]，恬愉長算，乃養生之實功歟。</p><p><strong>所出</strong>：《抱朴子 · 卷24》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷24</p></article></main></div></div>
