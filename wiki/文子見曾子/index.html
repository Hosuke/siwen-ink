    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 文子見曾子</nav></header><main><article><h1>文子見曾子</h1><p>曾子知命不僇，正身於奧而不阿。</p><p>衛將軍文子見曾子，曾子不起而延於坐席，正身於奧。文子謂其御曰：「曾子，愚人也哉！以我為君子也，君子安可毋敬也？以我為暴人也，暴人安可侮也？曾子不僇，命也。」</p><p><strong>所出</strong>：《韓非子 · 說林下》 — https://zh.wikisource.org/wiki/韓非子/說林下</p></article></main></div></div>
