    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 在旁</nav></header><main><article><h1>在旁</h1><p>俳優近習窺伺移心之術</p><p>姦臣成姦之一術。優笑侏儒、左近之習，先意承旨，觀貌察色以先得主之心。俱進俱退，一辭同軌以移主心。內事金玉玩好，外為不法，使主日蔽，而姦遂行。[[八姦]]之二，[[同床]]之翼也。</p><p><strong>所出</strong>：《韓非子 · 八奸》 — https://zh.wikisource.org/wiki/韓非子/八奸</p></article></main></div></div>
