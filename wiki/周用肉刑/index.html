    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 周用肉刑，積祀七百；漢氏廢之，年代不如</nav></header><main><article><h1>周用肉刑，積祀七百；漢氏廢之，年代不如</h1><p>肉刑之存廢，以周漢對比為鑒</p><p>昔周用肉刑，積祀七百。漢氏廢之，年代不如。至於改以鞭笞，大多死者。外有輕刑之名，內有殺人之實也。</p><p><strong>所出</strong>：《抱朴子 · 卷14》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷14</p></article></main></div></div>
