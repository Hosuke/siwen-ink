    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 竇太后哭梁王薨</nav></header><main><article><h1>竇太后哭梁王薨</h1><p>太后聞梁王薨，哭極哀，不食。</p><p>孝王慈孝，每聞太后病，口不能食，居不安寢，常欲留長安侍太后。太后亦愛之。及聞梁王薨，竇太后哭極哀，不食，曰：「帝果殺吾子！」景帝哀懼，不知所為。</p><p>與長公主計之，乃分梁為五國，盡立孝王男五人為王，女五人皆食湯沐邑。於是奏之太后，太后乃說，為帝加壹湌。</p><p><strong>所出</strong>：《史記 · 卷058》 — https://zh.wikisource.org/wiki/史記/卷058</p></article></main></div></div>
