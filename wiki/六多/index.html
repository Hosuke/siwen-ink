    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 六多</nav></header><main><article><h1>六多</h1><p>人有六多，溝通天地，斡旋陰陽。</p><p>六月日至，是故人有六多，六多所以街天地也。天道以九制，地理以八制，人道以六制。以天為父，以地為母，以開乎萬物，以總一統。通乎九制、六府、三充而為明天子。</p><p><strong>所出</strong>：《管子 · 第41篇五行》 — https://zh.wikisource.org/wiki/管子/第41篇五行</p></article></main></div></div>
