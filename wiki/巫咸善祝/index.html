    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 巫咸善祝</nav></header><main><article><h1>巫咸善祝</h1><p>聖者必有待而成，巫咸不能自祓，秦醫不能自彈；自助者天亦無如之何。</p><p>[[管仲]]、鮑叔相謂曰：「君亂甚矣，必失國。齊國之諸公子其可輔者，非公子糾則小白也。與子人事一人焉，先達者相收。」管仲乃從公子糾，鮑叔從小白。國人果弑君。小白先入爲君，魯人拘管仲而效之，鮑叔言而相之。故諺曰：「巫咸雖善祝，不能自祓也；秦醫雖善除，不能自彈也。」以管仲之聖而待鮑叔之助，此鄙諺所謂「虜自賣裘而不售，士自譽辯而不信」者也。</p><p><strong>所出</strong>：《韓非子 · 說林下》 — https://zh.wikisource.org/wiki/韓非子/說林下</p></article></main></div></div>
