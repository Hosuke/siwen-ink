    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 六極五常</nav></header><main><article><h1>六極五常</h1><p>巫咸以六極五常為天道，順之則治，逆之則凶。</p><p>巫咸祒曰：「來，吾語女。天有六極五常，帝王順之則治，逆之則凶。九洛之事，治成德備，監照下土，天下戴之，此謂上皇。」</p><p><strong>所出</strong>：《莊子 · 天運》 — https://zh.wikisource.org/wiki/莊子/天運</p></article></main></div></div>
