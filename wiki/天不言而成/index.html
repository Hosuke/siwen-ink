    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天不言而成</nav></header><main><article><h1>天不言而成</h1><p>天不言而萬物化育，此之謂天功</p><p>列星隨旋，日月遞炤，四時代御，陰陽大化，風雨博施，萬物各得其和以生，各得其養以成，不見其事，而見其功，夫是之謂神。皆知其所以成，莫知其無形，夫是之謂天功。唯聖人為不求知天。</p><p><strong>所出</strong>：《荀子 · 天論篇》 — https://zh.wikisource.org/wiki/荀子/天論篇</p></article></main></div></div>
