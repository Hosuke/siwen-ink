    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 詩經·蘀兮</nav></header><main><article><h1>詩經·蘀兮</h1><p>《詩經·鄭風》篇名，二章，章四句，以風葉之喻刺君弱臣強。</p><p>《蘀兮》，《詩經·鄭風》第十六篇，凡二章，章四句。首章云「蘀兮蘀兮，風其吹女。叔兮伯兮，倡予和女」，末章云「蘀兮蘀兮，風其漂女。叔兮伯兮，倡予要女」。</p><p>其義以風吹枯葉為興，象在上者有所倡導，則在下者自然應和。詩序以為刺君弱臣強，不倡而和。[[風吹落葉]]之象，上令不行，下自為之，秩序所以紊也。兩章語義略同，反覆詠之，見詩人殷殷望治之意。</p><p><strong>所出</strong>：《詩經 · 蘀兮》 — https://zh.wikisource.org/wiki/詩經/蘀兮</p></article></main></div></div>
