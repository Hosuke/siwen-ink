    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 動而俞出</nav></header><main><article><h1>動而俞出</h1><p>橐籥虛而不屈，越動越出。</p><p>橐籥者，冶工鼓火之器也。及其空虛，屈而不撓；及其運動，風之所出，愈動而愈出，不竭之用也。此以喻道體虛無而妙用無窮，為而持滿，不盈乃久。</p><p><strong>所出</strong>：《老子 (帛書本) · 章五》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
