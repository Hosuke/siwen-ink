    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 父子並為周司徒</nav></header><main><article><h1>父子並為周司徒</h1><p>父與子相繼為周司徒。言世濟其美也。</p><p>司徒，周之卿官，掌土地人民之事。《緇衣》序云「父子並為周司徒」，言武公之父與武公相繼居此職也。</p><p>父子世濟其官，善於厥職，可謂難矣。序又云「善於其職，國人宜之」，是故美其德以明有國[[善善之功]]焉。言武公父子相承，皆能稱其職也。</p><p><strong>所出</strong>：《詩經 · 緇衣》 — https://zh.wikisource.org/wiki/詩經/緇衣</p></article></main></div></div>
