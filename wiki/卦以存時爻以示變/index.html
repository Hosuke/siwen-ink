    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 卦以存時爻以示變</nav></header><main><article><h1>卦以存時爻以示變</h1><p>卦之為時，爻之為變；吉凶從類，動静應用，唯變所適。</p><p>夫卦者時也，爻者適時之變者也。夫時有否泰，故用有行藏；卦有小大，故辭有險易。一時之制可反而用，一時之吉可反而凶。動静屈伸，唯變所適。尋名以觀其吉凶，舉時以觀其動静，則一體之變由斯見矣。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷10》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷10</p></article></main></div></div>
