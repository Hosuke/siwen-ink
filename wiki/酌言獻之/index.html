    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 酌言獻之</nav></header><main><article><h1>酌言獻之</h1><p>主人酌酒以獻於客。</p><p>獻者，主人酌酒進於客也。《瓠葉》四章迭言「酌言嘗之」「酌言獻之」「酌言酢之」「酌言醻之」，備言燕饗之節。嘗者主人先酌自飲，示酒之美惡；獻者主人進酒於客；酢者客受而報之；醻者主人又酌以勸客。是一燕之禮，再三行焉。</p></article></main></div></div>
