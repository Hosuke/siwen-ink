    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 代來即位施德惠</nav></header><main><article><h1>代來即位施德惠</h1><p>孝文從代來，即位二十三年，宮室苑囿狗馬服御無所增益。</p><p>孝文帝從代來，即位二十三年，宮室苑囿狗馬服御無所增益，有不便，輒弛以利民。嘗欲作露臺，召匠計之，直百金。上曰：「百金中民十家之產，吾奉先帝宮室，常恐羞之，何以臺為！」上常衣綈衣，所幸慎夫人，令衣不得曳地，幃帳不得文繡，以示敦樸，為天下先。治霸陵皆以瓦器，不得以金銀銅錫為飾，不治坟，欲為省，毋煩民。</p><p><strong>所出</strong>：《史記 · 卷010》 — https://zh.wikisource.org/wiki/史記/卷010</p></article></main></div></div>
