    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 郭解被族</nav></header><main><article><h1>郭解被族</h1><p>公孫弘議曰郭解布衣為任俠行權以睚眦殺人，罪甚於殺，竟族之。</p><p>窮治所犯，為解所殺，皆在赦前。軹有儒生侍使者坐，客譽郭解，生曰：「郭解專以姦犯公法，何謂賢！」解客聞，殺此生，斷其舌。吏以此責解，解實不知殺者。殺者亦竟絕，莫知為誰。吏奏解無罪。御史大夫公孫弘議曰：「解布衣為任俠行權，以睚眦殺人，解雖弗知，此罪甚於解殺之。當大逆無道。」遂族郭解翁伯。</p><p><strong>所出</strong>：《史記 · 卷124》 — https://zh.wikisource.org/wiki/史記/卷124</p></article></main></div></div>
