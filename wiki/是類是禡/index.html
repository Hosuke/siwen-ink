    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 是類是禡</nav></header><main><article><h1>是類是禡</h1><p>類者祭天，禡者祭社，皆師祭也。</p><p>是類是禡，言文王伐崇既勝，行師祭之禮以謝天也。《皇矣》曰：「執訊連連，攸馘安安。是類是禡，是致是附。四方以無侮。」類者，祭天於所征之地也；禡者，祭始造軍法者，蓋祭於社也。師出曰祠，兵者祀典之所重。文王伐崇，既克其國，執訊問狀，殺馘獻俘，遂行類禡之祭，告於天地鬼神。致者，招徠之也；附者，安集之也。言文王既以兵威加之，又以德義懷之，故四方無敢侮慢周室也。</p><p><strong>所出</strong>：《詩經 · 皇矣》 — https://zh.wikisource.org/wiki/詩經/皇矣</p></article></main></div></div>
