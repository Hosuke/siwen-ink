    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 歲大有年</nav></header><main><article><h1>歲大有年</h1><p>天反風後，禾復起，秋乃大熟，萬民無饑。</p><p>[[天反風]]，禾斯起，凡大木之所拔，二公命邦人盡復築之。歲大有年，秋則大獲。</p><p>言是歲風調雨順，五穀豐熟，百姓樂業，天所以報[[周公宅東|周公之忠]]、成王之悟也。</p><p><strong>所出</strong>：《尚書 · 周武王有疾周公所自以代王之志》 — https://zh.wikisource.org/wiki/尚書/周武王有疾周公所自以代王之志</p></article></main></div></div>
