    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聲名歸之君，禍災歸之身</nav></header><main><article><h1>聲名歸之君，禍災歸之身</h1><p>賢臣之義，功歸於上，罪歸於己。</p><p>古之善為人臣者，聲名歸之君，禍災歸之身，入則切磋其君之不善，出則高譽其君之德義，是以雖事惰君，能使垂衣裳，朝諸侯，不敢伐其功。</p><p>此言臣之分也。功與名皆歸於君，而過與殃皆歸於己。如是則君無忌臣之心，臣無市恩之跡，上下相諧，國乃可治。晏子以此諷景公，言己之所以能匡君者，正以此道耳。</p><p><strong>所出</strong>：《晏子春秋 · 卷二》 — https://zh.wikisource.org/wiki/晏子春秋/卷二</p></article></main></div></div>
