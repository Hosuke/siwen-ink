    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 書言如語</nav></header><main><article><h1>書言如語</h1><p>書之與言，其理相通，難易之辨非論優劣之根據。</p><p>抱朴子云：書猶言也，若入談語，故為知有，胡越之接，終不相解。以此教戒，人豈知之哉！若言以易曉為辨，則書何故以難知為好哉？書之難易，不足為高下之別，猶言有深淺，而理無古今也。</p><p><strong>所出</strong>：《抱朴子 · 卷30》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷30</p></article></main></div></div>
