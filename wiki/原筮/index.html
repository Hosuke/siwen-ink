    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 原筮</nav></header><main><article><h1>原筮</h1><p>初次卜筮，以定元善長永貞固。</p><p>原筮者，初次卜筮之謂也。《比》卦辭云「原筮元永貞，无咎」，言比人之道，當先以卜筮決其心，定其志之元善，守之長久，正固不渝，方可免咎。原者，本也；筮者，卜問也。言始問之際，當正其發心，繼之以恆久貞固之德，則无過咎之患矣。</p><p><strong>所出</strong>：《周易 · 比》 — https://zh.wikisource.org/wiki/周易/比</p></article></main></div></div>
