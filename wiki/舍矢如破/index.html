    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 舍矢如破</nav></header><main><article><h1>舍矢如破</h1><p>發矢必中，無有虛發也。</p><p>矢之出也，疾如電轉，直貫靶的，無所阻滯，故曰「如破」。《車攻》言射者「決拾既佽，弓矢既調」，弓與矢相得益彰，[[射夫既同]]，合力以取禽獸。及其發也，[[兩驂不猗]]，車不失馳，士卒環列而觀，矢無虛發，此武功之盛也。</p><p><strong>所出</strong>：《詩經 · 車攻》 — https://zh.wikisource.org/wiki/詩經/車攻</p></article></main></div></div>
