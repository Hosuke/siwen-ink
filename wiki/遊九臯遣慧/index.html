    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 遊九臯遣慧</nav></header><main><article><h1>遊九臯遣慧</h1><p>隱者以遠遊遣蕩智慧，絕去俗累，以全天真。</p><p>懷冰先生言其歸趣云：「遊九臯以含歡，遣智慧以絕俗。同屈尺蠖，藏光守樸；表拙示訥，知止常足。然後咀嚼芝芳，風飛雲浮；晞景九陽，附翼高遊；仰棲梧桐，俯集玄洲。」言智慧亦當遣去，不可留滯，與[[絕聖棄智]]之旨相通，而別出以神仙意象焉。</p><p><strong>所出</strong>：《抱朴子 · 卷01》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷01</p></article></main></div></div>
