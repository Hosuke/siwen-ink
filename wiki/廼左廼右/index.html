    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 廼左廼右</nav></header><main><article><h1>廼左廼右</h1><p>居室既定遂左右而拓展之也。</p><p>廼慰廼止，廼左廼右。</p><p>既止居於此，乃分之左右，定其方位，以廣居民。</p><p><strong>所出</strong>：《詩經 · 緜》 — https://zh.wikisource.org/wiki/詩經/緜</p></article></main></div></div>
