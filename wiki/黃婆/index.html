    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 黃婆</nav></header><main><article><h1>黃婆</h1><p>中央坤德之土，喻真意，為龍虎交合之媒。</p><p>[[悟真篇]]以黃婆喻真意、意念之和合。詩云：「華嶽山頭雄虎嘯，扶桑海底牝龍吟。黃婆日解相媒合，遣作夫妻共一心。」又云：「奼女遊從各有方，前行須短後須長。歸來卻入黃婆舍，嫁箇金翁作老郎。」黃婆者，真意之象，具坤德之柔和，故能撮合龍虎於中宮，使坎離交構而成丹。</p><p><strong>所出</strong>：《悟真篇》 — https://zh.wikisource.org/wiki/悟真篇</p></article></main></div></div>
