    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 風日守河恃源</nav></header><main><article><h1>風日守河恃源</h1><p>風日過河，河以為未始攖者，恃其源之往而不匱。</p><p>故曰，風之過河也有損焉，日之過河也有損焉。請只風與日相與守河，而河以為未始其攖也，恃源而往者也。故水之守土也審，影之守人也審，物之守物也審。</p><p><strong>所出</strong>：《莊子 · 徐無鬼》 — https://zh.wikisource.org/wiki/莊子/徐無鬼</p></article></main></div></div>
