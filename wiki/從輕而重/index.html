    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 從輕而重</nav></header><main><article><h1>從輕而重</h1><p></p><p><strong>從輕而重</strong>，語出《禮記·服問》，為喪服制度中一大原則，謂喪服之輕重可隨親屬關係之變化而升等。</p><p>《傳》曰：「有從輕而重，公子之妻為其皇姑。」此言公子之妻為其翁姑（即丈夫之父母）服喪，由輕而重。蓋未嫁之時，與夫家並無服屬；既嫁之後，則俨然為其家人，自當依禮制服三年之喪。此隨其身分之轉變，而服制因之升等也。</p><p>考《儀禮·喪服》之制，凡女子適人者，為父母期，而為舅姑功衰。此皆從輕而重之例。蓋未嫁在家，本無為舅姑之服；一旦適人，便生服屬，故服從而生也。</p><p>其對義為從重而輕，見下條。輕重之間，反映儒家喪禮視親屬關係為動態流變之特色，而非僵硬固定之條文。</p></article></main></div></div>
