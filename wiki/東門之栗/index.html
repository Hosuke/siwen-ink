    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 東門之栗</nav></header><main><article><h1>東門之栗</h1><p>以栗樹之見於東門，興起家室之思。</p><p>東門之栗，有踐家室。</p><p>栗，木名，東門之外有栗。詩人見栗而念及人家。「有踐家室」，行列整齊之室也。言栗之下，有此家室，因以起下文思人之意。</p><p>一章言墠、言茹藘，二章言栗、言家室，皆東門內外之所見也。觸目皆可興情，而思者卒不可得，故詩人怨之。</p><p><strong>所出</strong>：《詩經 · 東門之墠》 — https://zh.wikisource.org/wiki/詩經/東門之墠</p></article></main></div></div>
