    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 齊桓公柏寢</nav></header><main><article><h1>齊桓公柏寢</h1><p>少君識得古銅器為齊桓公十年陳於柏寢之物，一宮盡駭，以為神人。</p><p>少君見上，上有故銅器，問少君。少君曰：「此器[[齊桓公]]十年陳於柏寢。」已而案其刻，果齊桓公器。一宮盡駭，以少君為神，數百歲人也。</p><p><strong>所出</strong>：《史記 · 卷012》 — https://zh.wikisource.org/wiki/史記/卷012</p><hr><p>齊桓公之卒，屍床上六十七日，尸蟲出戶，慘不忍言。此與柏寢之華美相對照，示人以富貴不常、身后淒涼之戒也。</p><p>  <strong>所出</strong>：《史記 · 卷032》 — https://zh.wikisource.org/wiki/史記/卷032</p></article></main></div></div>
