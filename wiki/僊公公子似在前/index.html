    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 僊公公子似在前</nav></header><main><article><h1>僊公公子似在前</h1><p>仙人形象隱現眼前，以喻丹成有驗。</p><p>朱鳥吐縮、白石之源，仙公公子之象隱現於前，修煉者見此奇瑞，乃知丹道將成、仙真已近。</p><p><strong>所出</strong>：《黃庭內景經 · 呼吸章第二十》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/呼吸章第二十</p></article></main></div></div>
