    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 萬物並作吾以觀復</nav></header><main><article><h1>萬物並作吾以觀復</h1><p>聖人觀萬物之還歸</p><p>萬物競作，紛然並起，而聖人觀其歸復之機。物之生也勃然，物之歸也悠然。觀復者，觀其終則知其始，觀其往則知其來，[[觀復]]之義也。唯虛靜之心乃能見此還歸之理，若為物欲所蔽，則迷而不知返矣。</p><p><strong>所出</strong>：《道德經 (王弼本) · 十六章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
