    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 醯雞與</nav></header><main><article><h1>醯雞與</h1><p>目之所見有限，不知天地之大全。</p><p>孔子見老聃，，老子德配天地，猶假至言以修心。孔子出，以告顏回曰：「丘之於道也，其猶醯雞與！微夫子之發吾覆也，吾不知天地之大全也。」醯雞在甕中，不知甕外天之高大，以為甕中者全天也。</p><p><strong>所出</strong>：《莊子 · 田子方》 — https://zh.wikisource.org/wiki/莊子/田子方</p></article></main></div></div>
