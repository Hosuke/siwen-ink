    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 旗物尚青</nav></header><main><article><h1>旗物尚青</h1><p>東方之兵尚青，刑交寒害釱，器械不守，經不知而莫能應。</p><p>旗物尚青者，東方之兵制也。兵尚矛，刑則交寒害釱。器械不守，經不知，故莫能圉；發不意，故莫能應。動慎十號，明審九章，此用兵之要也。</p><p><strong>所出</strong>：《管子 · 第08篇幼官》 — https://zh.wikisource.org/wiki/管子/第08篇幼官</p></article></main></div></div>
