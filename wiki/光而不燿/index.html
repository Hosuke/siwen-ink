    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 光而不燿</nav></header><main><article><h1>光而不燿</h1><p></p><p>光者，明照遠燭也。聖人德耀昭朗，有以照世，而不自矜伐、不炫耀人。世人自有其光者，必欲炫而燿之，卒以物嫉而身危。聖人光矣，而晦焉若無，其光乃全。</p><p>  <strong>所出</strong>：《道德經 (王弼本) · 五十八章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
