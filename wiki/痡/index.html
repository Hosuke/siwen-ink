    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 痡</nav></header><main><article><h1>痡</h1><p>人疲病也。</p><p>痡，人疲病也。音扑。《卷耳》云「我僕痡矣」，僕，馭馬之從人也。馬瘏而僕痡，則道途之艱極矣。后妃知臣下之勤勞，於此見之。痡與瘏義同，皆疲病之名。</p><p><strong>所出</strong>：《詩經 · 卷耳》 — https://zh.wikisource.org/wiki/詩經/卷耳</p></article></main></div></div>
