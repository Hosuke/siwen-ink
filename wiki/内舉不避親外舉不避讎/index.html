    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 内舉不避親外舉不避讎</nav></header><main><article><h1>内舉不避親外舉不避讎</h1><p>聖王明君選賢，無間親讎，唯才是舉。</p><p>聖王明君則不然，内舉不避親，外舉不避讎。是在焉，從而舉之；非在焉，從而罰之。是以賢良遂進而姦邪並退，故一舉而能服諸侯。</p><p><strong>所出</strong>：《韓非子 · 說疑》 — https://zh.wikisource.org/wiki/韓非子/說疑</p></article></main></div></div>
