    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 令者，言最貴者也</nav></header><main><article><h1>令者，言最貴者也</h1><p>明主之國，令居言語之尊，法令為行事之準，二者並行而不悖。</p><p>明主之國，令者，言最貴者也；法者，事最適者也。言無二貴，法不兩適，故言行而不軌於法令者必禁。令與法並立，而令為言之所以貴，以其出於君上操縱賞罰之柄也。若其無法令而可以接詐、應變、生利、揣事者，上必采其言而責其實。言當則有大利，不當則有重罪。此明主馭言之術也。</p><p><strong>所出</strong>：《韓非子 · 問辯》 — https://zh.wikisource.org/wiki/韓非子/問辯</p></article></main></div></div>
