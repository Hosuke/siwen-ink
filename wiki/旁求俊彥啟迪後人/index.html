    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 旁求俊彥啟迪後人</nav></header><main><article><h1>旁求俊彥啟迪後人</h1><p>廣求賢才以教導後嗣，使德業不失也。</p><p>先王之德，不獨修於一身，又必求賢才以遺後嗣，伊尹述之曰「旁求俊彥，啟迪後人」。旁求者，不拘遠近、不限門戶，廣博以求之也。俊者，才之超出者也；彥者，德之秀異者也。既得之，又必開導之、啟發之，使明知前王之所以得天下者何在，後王之所以守天下者何在。啟迪之道，在乎循循善誘，因其材而授之方，非一概而施之也。祖宗以是而興，子孫以是而繼，其來尚矣。</p><p><strong>所出</strong>：《尚書 · 太甲上》 — https://zh.wikisource.org/wiki/尚書/太甲上</p></article></main></div></div>
