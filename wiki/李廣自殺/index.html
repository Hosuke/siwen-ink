    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 李廣自殺</nav></header><main><article><h1>李廣自殺</h1><p>前將軍李廣從大將軍出塞，失道後期，廣不願對刀筆之吏，自剄而死。</p><p>大將軍引還過幕南，乃得前將軍、右將軍。大將軍欲使使歸報，令長史簿責前將軍廣，廣自殺。</p><p><strong>所出</strong>：《史記 · 卷111》 — https://zh.wikisource.org/wiki/史記/卷111</p></article></main></div></div>
