    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 老子其猶龍邪</nav></header><main><article><h1>老子其猶龍邪</h1><p>孔子見老子，歎其乘風雲而上天，如龍之不可測。</p><p>孔子適周，將問禮於老子。歸謂弟子曰：「鳥，吾知其能飛；魚，吾知其能游；獸，吾知其能走。走者可以為罔，游者可以為綸，飛者可以為矰。至於龍，吾不能知其乘風雲而上天。吾今日見老子，其猶龍邪！」</p><p>後世稱述此事，以「猶龍」喻道行之高深莫測。</p><p><strong>所出</strong>：《史記 · 卷063》 — https://zh.wikisource.org/wiki/史記/卷063</p></article></main></div></div>
