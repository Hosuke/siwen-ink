    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 歸之于</nav></header><main><article><h1>歸之于</h1><p>歸于者罪未定，歸之于者罪已定。</p><p>執諸侯者有二義，辨于歸字之別。</p><p>僖公二十八年，晉人執衛侯歸之于京師。傳曰：「歸之于者何？歸于者何？歸之于者罪已定矣，歸于者罪未定也。罪未定，則何以得為伯執？歸之于者，執之于天子之側者也，罪定不定，已可知矣。歸于者，非執之于天子之側者也，罪定不定，未可知也。」蓋[[歸之于]]明言罪狀已定，付于天子法吏；[[歸于]]但言執還而已，猶可議罪也。</p><p><strong>所出</strong>：《春秋公羊傳 · 僖公》 — https://zh.wikisource.org/wiki/春秋公羊傳/僖公</p></article></main></div></div>
