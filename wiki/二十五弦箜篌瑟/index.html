    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 二十五弦箜篌瑟</nav></header><main><article><h1>二十五弦箜篌瑟</h1><p>塞南越後，用樂舞益召歌兒，作二十五弦及箜篌瑟。</p><p>既滅南越，上有嬖臣李延年以好音見。上善之，公卿議曰：「古者祀天地皆有樂。」或曰：「泰帝使素女鼓五十弦瑟，悲，帝禁不止，故破其瑟為二十五弦。」於是塞南越，禱祠[[泰一]]、后土，始用樂舞，益召歌兒，作二十五弦及箜篌瑟自此起。</p><p><strong>所出</strong>：《史記 · 卷012》 — https://zh.wikisource.org/wiki/史記/卷012</p></article></main></div></div>
