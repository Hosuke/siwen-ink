    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 參與昴</nav></header><main><article><h1>參與昴</h1><p>二星之名，以喻夜征者所見。</p><p>參、昴，皆星名。[[參與昴]]，二星宿之名也。</p><p>《毛詩》：「維參與昴。」上章言「三五在東」，此章則明指參、昴二星。詩人夜行，仰觀星象，見參宿在西，昴宿在北，時運不同，因歎命之不齊。</p><p>朱熹《詩集傳》云：「參、昴，北方之星。」二星在天，肅肅宵征之人在下，遙遙相望，而命之貴賤不同如此。</p><p><strong>所出</strong>：《詩經 · 小星》 — https://zh.wikisource.org/wiki/詩經/小星</p></article></main></div></div>
