    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 王假有家</nav></header><main><article><h1>王假有家</h1><p>王者以德感通天下，人自化之。</p><p>王假有家，[[周易 · 家人]]九五爻辭也。</p><p>「王假有家，勿恤，吉。」假，至也。言王者以至誠感通乎其家，不須憂恤，自然獲吉也。夫至誠感物，無遠弗屆。王者修其德於上，而民化於下；正其家於內，而天下應於外。一家之正，天下之表也。</p><p>勿恤者，言不必過慮也。蓋以德化民，不以威迫人；以其誠格之，不以其力制之。德之所至，人自歸之，何恤之有？</p><p><strong>所出</strong>：《周易 · 家人》 — https://zh.wikisource.org/wiki/周易/家人</p></article></main></div></div>
