    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 善周者明不能見</nav></header><main><article><h1>善周者明不能見</h1><p>善於周密者，明察亦不能窺其際；明者亦無能蔽之，此聖人之周、明相成也。</p><p>善周者，明不能見也。善明者，周不能蔽也。</p><p><strong>所出</strong>：《管子 · 勢》 — https://zh.wikisource.org/wiki/管子/勢</p></article></main></div></div>
