    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 峙乃芻茭</nav></header><main><article><h1>峙乃芻茭</h1><p>芻茭蓄積，以待軍用</p><p>「魯人三郊三遂，峙乃芻茭，無敢不多，汝則有大刑。」</p><p>「芻茭」，牛馬之食草也。「峙乃芻茭」，言宜廣儲草料，無敢不足。征伐之役，芻秣不可闕乏；牛馬無食則不能任重致遠。軍國之大事，必先利其芻茭，此師行物資之大者。蓄積不多，何以供軍？故有不逮，必加重刑以為戒也。</p><p><strong>所出</strong>：《尚書 · 費誓》 — https://zh.wikisource.org/wiki/尚書/費誓</p></article></main></div></div>
