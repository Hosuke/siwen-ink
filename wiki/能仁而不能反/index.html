    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 能仁而不能反</nav></header><main><article><h1>能仁而不能反</h1><p>各有所長亦各有所短，兼四子之有以易吾，吾弗許</p><p>子夏問[[孔子]]曰：「顏回之爲人奚若？」曰：「回之仁賢於丘也。」「子貢之爲人奚若？」曰：「賜之辯賢於丘也。」「子路之爲人奚若？」曰：「由之勇賢於丘也。」「子張之爲人奚若？」曰：「師之莊賢於丘也。」子夏問然則四子者何爲事夫子，孔子曰：「夫回能仁而不能反，賜能辯而不能訥，由能勇而不能怯，師能莊而不能同。兼四子之有以易吾，吾弗許也。此其所以事吾而不貳也。」</p><p><strong>所出</strong>：《列子 · 仲尼篇》 — https://zh.wikisource.org/wiki/列子/仲尼篇</p></article></main></div></div>
