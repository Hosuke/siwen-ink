    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 傷賢者殃及三世</nav></header><main><article><h1>傷賢者殃及三世</h1><p>傷賢者殃及後代，蔽賢嫉賢進賢各有所報；國當急於進賢。</p><p>《三略·下略》明言進賢退奸之義，其辭曰：</p><p>「傷賢者，殃及三世；蔽賢者，身受其害；嫉賢者，其名不全；進賢者，福流子孫。」</p><p>此四者，國之存亡所係也。賢人者，國之楨幹，善用之則政理，傷害之則國危。《下略》又言賢人去則國微，聖人去則國乖，微者危之階，乖者亡之徵。是以明主治世，必急於進賢，使賢者在位，能者在職，則國家安寧，祸患不作。</p><p><strong>所出</strong>：《三略》 — https://zh.wikisource.org/wiki/三略</p></article></main></div></div>
