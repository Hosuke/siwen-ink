    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 情往會悲文來引泣</nav></header><main><article><h1>情往會悲文來引泣</h1><p>哀辭之上品，能令哀者情歸於悲，讀者觀文而泣。</p><p>哀辭之道，必使情往會悲，文來引泣，乃為可貴。情往者，以真心赴之；文來者，以辭采感之。華過韻緩，則化而為賦，失其本意矣。</p><p><strong>所出</strong>：《文心雕龍 · 哀弔》 — https://zh.wikisource.org/wiki/文心雕龍/哀弔</p></article></main></div></div>
