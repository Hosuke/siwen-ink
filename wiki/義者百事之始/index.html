    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 義者百事之始</nav></header><main><article><h1>義者百事之始</h1><p>義為萬利之本，中智所不及；不利之利，唯知義者乃知。</p><p>[[先王之於論也極之矣，故義者百事之始也，萬利之本也，中智之所不及也。]]不及則不知，不知趨利。趨利固不可必也，公孫鞅、鄭平、續經、公孫竭是已。以義動則無曠事矣。</p><p>人臣與人臣謀為姦，猶或與之。又況乎人主與其臣謀為義，其孰不與者？非獨其臣也，天下皆且與之。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十二》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十二</p></article></main></div></div>
