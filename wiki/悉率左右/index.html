    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 悉率左右</nav></header><main><article><h1>悉率左右</h1><p>左右夾驅，悉聚禽獸以供射獵。</p><p>「悉率左右」者，盡驅之使趨於中也。《左傳》田獵之禮，有「啟」、「閉」之卒，蓋分左右翼以夾獸。此詩言「悉率左右」，正是左右合圍之義，使禽獸無得逸者。</p><p>此與《車攻》「拾以夫」之義相近，皆言驅獸之法，而此詩益言「以燕天子」，則見天子躬親射獵之樂。</p><p><strong>所出</strong>：《詩經 · 吉日》 — https://zh.wikisource.org/wiki/詩經/吉日</p></article></main></div></div>
