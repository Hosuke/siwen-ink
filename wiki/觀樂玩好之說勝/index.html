    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 觀樂玩好之說勝</nav></header><main><article><h1>觀樂玩好之說勝</h1><p>溺觀樂則府倉虛竭，姦人在上位，國危。</p><p>人君聽觀樂玩好之說，則宮室臺池、珠玉聲樂，費財傷國。府倉既虛，蓄積既竭，且姦人在上，壅遏賢者而不進。國適有患，則優倡侏儒起而議國事矣。如是則敺國而捐之也。故「觀樂玩好之說」一行，則姦人在上位，而國隨以傾。</p><p><strong>所出</strong>：《管子 · 第65篇立政九敗解》 — https://zh.wikisource.org/wiki/管子/第65篇立政九敗解</p></article></main></div></div>
