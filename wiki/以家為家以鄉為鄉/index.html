    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以家為家以鄉為鄉</nav></header><main><article><h1>以家為家以鄉為鄉</h1><p>各正其分，毋以家兼鄉、鄉兼國、國兼天下。</p><p>以家為鄉，鄉不可為也。以鄉為國，國不可為也。以國為天下，天下不可為也。以家為家，以鄉為鄉，以國為國，以天下為天下。毋曰不同生，遠者不聽。毋曰不同鄉，遠者不行。毋曰不同國，遠者不從。</p><p><strong>所出</strong>：《管子 · 第01篇牧民》 — https://zh.wikisource.org/wiki/管子/第01篇牧民</p></article></main></div></div>
