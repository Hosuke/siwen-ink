    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 至治之國</nav></header><main><article><h1>至治之國</h1><p>君臣相成如鼓桴車馬，各盡其才而天下治。</p><p>至治之國，君若桴，臣若鼓，技若車，事若馬。故人有餘力易於應，而技有餘巧便於事。</p><p><strong>所出</strong>：《韓非子 · 功名》 — https://zh.wikisource.org/wiki/韓非子/功名</p></article></main></div></div>
