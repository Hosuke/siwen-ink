    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 至誠如神</nav></header><main><article><h1>至誠如神</h1><p>至誠之道可以前知，其知與鬼神同也。</p><p>至誠之道，可以前知。國家將興，必有禎祥；國家將亡，必有妖孽；見乎蓍龜，動乎四體。禍福將至：善，必先知之；不善，必先知之。故至誠如神。</p><p><strong>所出</strong>：《中庸 · 中庸章句》 — https://zh.wikisource.org/wiki/四書章句集註/中庸章句</p></article></main></div></div>
