    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 致孝享</nav></header><main><article><h1>致孝享</h1><p>王假有廟，以孝奉祖考</p><p>《彖》曰「王假有廟，致孝享也」。假，格也，至也。王至廟以致其孝，奉享祖考，是為萃祖考之精神。</p><p><strong>所出</strong>：《周易 · 萃》 — https://zh.wikisource.org/wiki/周易/萃</p></article></main></div></div>
