    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不利有攸往</nav></header><main><article><h1>不利有攸往</h1><p>剝卦之占，不利有所往，犯勢而行必有凶。</p><p>《剝》卦辭：「不利有攸往。」</p><p>王弼注：「剝者，小人道长，君子道消之時也。君子當順而止之，不可有所往也。」</p><p>蓋時當小人勢盛，君子若輕進躁動，非徒無益，且致傾危。止而不往，守正待時，乃卦象所明示。往者，前行也；攸，所也。言無所利於行也。</p><p>彖傳申之曰：「不利有攸往，小人長也。」以見其時勢然耳。</p><p><strong>所出</strong>：《周易 · 剝》 — https://zh.wikisource.org/wiki/周易/剝</p></article></main></div></div>
