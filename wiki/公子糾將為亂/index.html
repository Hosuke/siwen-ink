    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 公子糾將為亂</nav></header><main><article><h1>公子糾將為亂</h1><p>觀人之笑樂視見，可占其心之邪正。</p><p>公子糾將為亂，桓公使使者視之。使者報曰：「笑不樂，視不見，必為亂。」乃使魯人殺之。</p><p><strong>所出</strong>：《韓非子 · 說林下》 — https://zh.wikisource.org/wiki/韓非子/說林下</p></article></main></div></div>
