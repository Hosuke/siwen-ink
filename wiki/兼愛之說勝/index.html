    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 兼愛之說勝</nav></header><main><article><h1>兼愛之說勝</h1><p>尚兼愛則無別，賢將外奔，軍敗覆國。</p><p>人君聽兼愛之說，視天下之民如其民，視國如吾國，如是則無并兼攘奪之心、無覆軍敗將之事。然射御勇力之士不厚祿，覆軍殺將之臣不貴爵，則勇士出在外矣。彼求地而予之，非吾所欲；不予而與戰，必不勝也。彼以教士，我以敺衆；彼以良將，我以無能，其敗必覆軍殺將。故「兼愛之說」一行，則士卒不戰，而國隨以敗。</p><p><strong>所出</strong>：《管子 · 第65篇立政九敗解》 — https://zh.wikisource.org/wiki/管子/第65篇立政九敗解</p></article></main></div></div>
