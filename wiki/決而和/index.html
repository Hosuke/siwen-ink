    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 決而和</nav></header><main><article><h1>決而和</h1><p>果斷以決之，終歸於和，剛柔相濟之道也。</p><p>《彖》曰：「健而說，決而和。」夫陽剛之氣健行不息，悅以接物，此聖人之德也。然剛者易折，決者易激，唯能和之，乃為盡善。決而能和者，非姑息養奸，非優游不斷，乃剛明果斷而濟以寬裕，故能決小人而不失君子之和也。觀夬之五陽尚有一陰未去，茲時也，剛長已盛，陽可決陰，然必以和為歸。</p><p><strong>所出</strong>：《周易 · 夬》 — https://zh.wikisource.org/wiki/周易/夬</p></article></main></div></div>
