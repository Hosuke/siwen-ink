    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 旱魃為虐</nav></header><main><article><h1>旱魃為虐</h1><p>旱魃肆虐為害，詩人用以狀旱災之甚。</p><p>旱魃者，相傳為旱神。詩言「旱魃為虐，如惔如焚」，狀旱神之肆虐，火熱如焚，心情之惶恐也。「我心憚暑，憂心如薰」，皆言旱魃為虐之害。</p><p><strong>所出</strong>：《詩經 · 雲漢》 — https://zh.wikisource.org/wiki/詩經/雲漢</p></article></main></div></div>
