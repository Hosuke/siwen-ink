    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 奪柄失位</nav></header><main><article><h1>奪柄失位</h1><p>君主以柄處人，則失位；令法不平，是奪柄失位之道。</p><p>藉人以其所操，命曰奪柄。藉人以其所處，命曰失位。奪柄失位，而求令之行，不可得也。法不平，令不全，是亦奪柄失位之道也。</p><p><strong>所出</strong>：《管子 · 第45篇任法》 — https://zh.wikisource.org/wiki/管子/第45篇任法</p></article></main></div></div>
