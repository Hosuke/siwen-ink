    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 德星昭衍</nav></header><main><article><h1>德星昭衍</h1><p>望氣者言建漢家封禪，天其報德星，天子郊拜泰一時贊饗之辭。</p><p>有星茀于東井，又茀于三能。望氣王朔言候獨見其星出如瓠。有司言：「陛下建漢家封禪，天其報德星雲。」其冬，郊雍還，拜祝祠[[泰一]]，贊饗曰：「德星昭衍，厥維休祥。壽星仍出，淵……」</p><p><strong>所出</strong>：《史記 · 卷012》 — https://zh.wikisource.org/wiki/史記/卷012</p></article></main></div></div>
