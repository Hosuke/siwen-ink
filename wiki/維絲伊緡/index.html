    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 維絲伊緡</nav></header><main><article><h1>維絲伊緡</h1><p>絲線為釣繩，以興匹偶之相得。</p><p>《何彼襛矣》三章云「其釣維何，維絲伊緡」。緡者，魚線也。言以絲線為釣繩，取魚以興匹配之事。伊、維皆語詞，無實義。詩以此起興，言齊侯之子與平王之孫之相配，如絲線之合而成繩然。</p></article></main></div></div>
