    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 耳目</nav></header><main><article><h1>耳目</h1><p>精神在我視聽在彼，耳目可妄設而神形有疣則皆為所役。</p><p>目所不見，設明鏡而見之；耳所不聞，設虛器而聞之。精神在我，視聽在彼。跰趾可以割，陷吻可以補，則是耳目可以妄設，形容可以偽置。既假又假，既惑又惑。所以知魂魄魅我，血氣醉我，七竅囚我，五根役我。惟神之有形，由形之有疣。茍無其疣，何所不可？</p><p><strong>所出</strong>：《化書 · 卷一》 — https://zh.wikisource.org/wiki/化書/卷一</p></article></main></div></div>
