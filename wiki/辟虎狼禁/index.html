    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 辟虎狼禁</nav></header><main><article><h1>辟虎狼禁</h1><p>述入山辟虎狼之禁術。</p><p>抱朴子述辟虎狼禁術。介先生法，到山中住，思作五色蛇各一頭，乃閉炁以青竹及小木板屈刺之，左徊禹步，思作吳蚣數千板以衣其身，乃去，終亦不逢蛇也。</p><p>辟山川百鬼又有仙人陳安世所授入山辟虎狼符，以丹書絹二符，各異之，常帶著所住之處各四枚，移涉當拔收之以去，大神秘也。</p><p>入山佩帶符三符，兼同著牛馬屋左右前後及豬欄上，亦辟虎狼也。</p><p><strong>所出</strong>：《抱朴子 · 卷17》 — https://zh.wikisource.org/wiki/抱朴子/卷17</p></article></main></div></div>
