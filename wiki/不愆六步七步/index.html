    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不愆六步七步</nav></header><main><article><h1>不愆六步七步</h1><p>師行有序，止則齊焉，軍律之要也。</p><p>「今日之事，不愆于六步、七步，乃止齊焉。夫子勖哉！不愆于四伐、五伐、六伐、七伐，乃止齊焉。」言師之進退，不可失其度。步伐有數，過則蹶，不及則怠；惟不愆其度，乃止而齊，此[[師克在和]]之意也。</p><p><strong>所出</strong>：《尚書 · 牧誓》 — https://zh.wikisource.org/wiki/尚書/牧誓</p></article></main></div></div>
