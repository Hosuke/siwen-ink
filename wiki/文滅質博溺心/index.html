    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 文滅質，博溺心</nav></header><main><article><h1>文滅質，博溺心</h1><p>文飾繁博之學，足以湮滅本質、沈溺心靈</p><p>心與心識知而不足以定天下，然後附之以文，益之以博。文滅質，博溺心，然後民始惑亂，无以反其性情而復其初。聖人知人心之不能相識，定天下不可以智識也，乃益之文博，是益蔽而已。</p><p><strong>所出</strong>：《莊子 · 繕性》 — https://zh.wikisource.org/wiki/莊子/缮性</p></article></main></div></div>
