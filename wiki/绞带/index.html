    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三日绞垂</nav></header><main><article><h1>三日绞垂</h1><p>既殯三日，絞帶下垂。</p><p>既殯，主人說髮。三日絞垂。冠六升，外縪，纓條屬，厭。衰三升。絞帶，喪服之帶也。絞，糾也。三日死者，除殯時之首服而改服也。</p><p><strong>所出</strong>：《儀禮 · 既夕禮》 — https://zh.wikisource.org/wiki/儀禮/既夕禮</p></article></main></div></div>
