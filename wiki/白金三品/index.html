    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 白金三品</nav></header><main><article><h1>白金三品</h1><p>漢武帝造銀錫合金為三等白金，分龍、馬、龜三品，面值各異。</p><p>又造銀錫為白金。以為天用莫如龍，地用莫如馬，人用莫如龜，故白金三品：其一曰重八兩，圜之，其文龍，名曰「白選」，直三千；二曰以重差小，方之，其文馬，直五百；三曰復小，撱之，其文龜，直三百。令縣官銷半兩錢，更鑄三銖錢，文如其重。盜鑄諸金錢罪皆死，而吏民之盜鑄白金者不可勝數。</p><p><strong>所出</strong>：《史記 · 卷030》 — https://zh.wikisource.org/wiki/史記/卷030</p></article></main></div></div>
