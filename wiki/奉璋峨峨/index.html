    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 奉璋峨峨</nav></header><main><article><h1>奉璋峨峨</h1><p>奉璋之容端莊，喻俊士各宜其位。</p><p>「奉璋峨峨，髦士攸宜。」峨峨者，莊嚴端正之貌。奉璋，捧持祭祀之玉器也。禮時王左右之大臣，手奉璋瓚，容儀盛大，是為英俊之士所宜者也。賢者在位，各安其分，朝廷之上，威儀整肅，以成治功。</p><p><strong>所出</strong>：《詩經 · 棫樸》 — https://zh.wikisource.org/wiki/詩經/棫樸</p></article></main></div></div>
