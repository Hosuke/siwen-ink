    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 網在綱</nav></header><main><article><h1>網在綱</h1><p>執綱馭網，有條不紊。</p><p>若網在綱，有條而不紊。</p><p>盤庚以網喻國政。網之有綱，則目隨之而理，條理不紊；國之有紀，則官守其職，政教有成。言王令既出，若[[網在綱]]，則下之從令，有條不紊，其斯之謂與。</p><p><strong>所出</strong>：《尚書 · 盤庚上》 — https://zh.wikisource.org/wiki/尚書/盤庚上</p></article></main></div></div>
