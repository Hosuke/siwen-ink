    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 餞</nav></header><main><article><h1>餞</h1><p>虞祭既成，送尸出門，行餞禮於廟門外也。</p><p>餞者，送尸之禮也。士虞禮《記》云：「獻畢，未徹，乃餞。」尊兩甒於廟門外之右，主人在門東少南，妇人出即位主人之北，皆西南哭不止。尸即席坐，主人洗廢爵酌獻尸，尸拜受。主人拜送，哭，複位。主婦亞獻，賓長三獻，亦如之。佐食取俎實於篚。尸謖，従者奉篚哭從之。祝前，哭者皆從，及大門內踊如初。尸出門，哭者止。賓出，主人送，拜稽顙。《記》又云：「無尸，則不餞。」</p><p><strong>所出</strong>：《儀禮 · 士虞禮》 — https://zh.wikisource.org/wiki/儀禮/士虞禮</p></article></main></div></div>
