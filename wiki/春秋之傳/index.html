    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 春秋之傳</nav></header><main><article><h1>春秋之傳</h1><p>左丘明而下，諸子踵《春秋》而別撰，咸有取於襃貶之旨。</p><p>左丘明懼弟子人人異端，各安其意，失其真，因孔子史記，具論其語，成[[左氏春秋]]。厥後[[鐸氏微]]、 [[虞氏春秋]]之屬，亦上採[[春秋]]、下觀近勢，各有成書。漢相張蒼推五德之運，大夫董仲舒研《春秋》之義，咸有論著。茲數家所述，皆孔子筆削之旨，而文辭不同，其流則一也。</p><p><strong>所出</strong>：《史記 · 卷014》 — https://zh.wikisource.org/wiki/史記/卷014</p></article></main></div></div>
