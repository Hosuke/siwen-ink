    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 君臣之間明別則易治</nav></header><main><article><h1>君臣之間明別則易治</h1><p>君臣高下如天之與地，明別則令行禁止</p><p>制羣臣、擅生殺，主之分也；縣令仰制，臣之分也。威勢尊顯，主之分也；卑賤畏敬，臣之分也。令行禁止，主之分也；奉法聽從，臣之分也。君臣之間明別，則下之從上如響之應聲，臣之法主如景之隨形。
<strong>所出</strong>：《管子 · 第67篇明法解》 — https://zh.wikisource.org/wiki/管子/第67篇明法解</p></article></main></div></div>
