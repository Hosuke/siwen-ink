    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 倏歘遊遨無遺憂</nav></header><main><article><h1>倏歘遊遨無遺憂</h1><p>倏忽之頃遨遊八表，無一毫之憂。</p><p>倏歘遊遨無遺憂。</p><p>倏歘，疾速之意。神仙之遊，倏忽之間，周遍八表。[[真人]]之出世，無復[[富貴不歸故鄉|世間之憂]]，亦無[[物至而能神應|死生之患]]。此 [[化形而仙]]之境界也。</p><p><strong>所出</strong>：《黃庭內景經 · 隱景章第二十四》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/隱景章第二十四</p></article></main></div></div>
