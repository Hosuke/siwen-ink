    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 辟四門</nav></header><main><article><h1>辟四門</h1><p>廣開賢路，招徠俊乂。</p><p>舜格于文祖，詢于四岳，闢四門，明四目，達四聰。闢者，開也。闢四門，則天下之賢無蔽也；明四目，則四方之事無隱也；達四聰，則萬民之言無塞也。聖人虛己以聽，故下情上通。</p><p><strong>所出</strong>：《尚書 · 舜典》 — https://zh.wikisource.org/wiki/尚書/舜典</p></article></main></div></div>
