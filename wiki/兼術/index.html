    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 兼術</nav></header><main><article><h1>兼術</h1><p>兼術者，兼容並蓄之道，賢愚博淺皆能容之。</p><p>兼術者，君子之所以容衆之道也。賢而能容罷，知而能容愚，博而能容淺，粹而能容雜，故能和衆成事。《詩》云「徐方既同，天子之功」，言天下之一也。夫能用兼術者，則四海之内無不可化之人矣。</p><p><strong>所出</strong>：《荀子 · 非相篇》 — https://zh.wikisource.org/wiki/荀子/非相篇</p></article></main></div></div>
