    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 義不食</nav></header><main><article><h1>義不食</h1><p>君子於行，不暇就食，以義為先。</p><p>「君子於行，義不食也。」初九當明夷之初，明見傷而垂翼遠去，行而不暇食者也。象辭言「義不食」，明君子之於行，不以食累義。義所在，雖三日不食無悔也。以義易食，見君子守義之決也。</p><p><strong>所出</strong>：《周易 · 明夷》 — https://zh.wikisource.org/wiki/周易/明夷</p></article></main></div></div>
