    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 立本</nav></header><main><article><h1>立本</h1><p>立本者，先錯法以成俗，成俗而用具，三者必行於境內，而後兵可出。</p><p>凡用兵，勝有三等：若兵未起而錯法，錯法而俗成，俗成而用具。此三者必行於境內，而後兵可出也。</p><p>強者必剛其鬥意：鬥則力盡，力盡則備，是故無敵於海內。賞壹則爵尊，爵尊則賞能利矣。故曰：兵生於治而異，俗生於法而萬轉，過勢本於心而飾於備勢。三者有論，故彊可立也。</p><p>治彊之道三：治、彊、富。治彊者必彊，富者必治。故曰治彊之道三，論其本也。</p><p><strong>所出</strong>：《商君書 · 卷三》 — https://zh.wikisource.org/wiki/商君書/卷三</p></article></main></div></div>
