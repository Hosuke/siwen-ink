    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 變形而仙</nav></header><main><article><h1>變形而仙</h1><p>積累長久，脫胎換骨，變形而登仙籍。</p><p>積累長久，變形而仙。</p><p>脫盡凡形，方成仙體。此道非一朝一夕之功，必俟積累之久，庶幾形化而登仙籍。</p><p><strong>所出</strong>：《周易參同契 · 31章》 — https://zh.wikisource.org/wiki/周易參同契/31章</p></article></main></div></div>
