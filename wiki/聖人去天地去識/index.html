    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖人去天地去識</nav></header><main><article><h1>聖人去天地去識</h1><p>夢鑑水之天地皆心所映，聖人離識不離天地</p><p>夢中鑑中水中，皆有天地存焉。欲去夢天地者寢不寐，欲去鑒天地者形不照，欲去水天地者盎不汲。彼之有無，在此不在彼。是以聖人不去天地去識。</p><p>[[聖人去天地去識]] 夢中有天地，鏡中有天地，水中亦有天地，然皆非真有天地，乃心識所映也。欲去夢者不可以寢，欲去鑒者不可以形，欲去水者不可以汲。聖人知此，故不去天地，去其所以知天地者；去識則物自物，天地自天地，而無容心焉。</p><p><strong>所出</strong>：《關尹子 · 2》 — https://zh.wikisource.org/wiki/關尹子/2</p></article></main></div></div>
