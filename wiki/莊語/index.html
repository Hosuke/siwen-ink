    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 莊語</nav></header><main><article><h1>莊語</h1><p>莊言正論，俟天下之清也。</p><p>以天下為沈濁，不可與<strong>莊語</strong>，以巵言為曼衍，以重言為真，以寓言為廣。</p><p>獨與天地精神往來而不敖倪於萬物，不譴是非，以與世俗處。</p><p><strong>所出</strong>：《莊子 · 天下》 — https://zh.wikisource.org/wiki/莊子/天下</p></article></main></div></div>
