    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 玄冥難測</nav></header><main><article><h1>玄冥難測</h1><p>玄冥幽深難測，不可畫圖，求之於心悟。</p><p>玄冥難測者，玄者幽深，冥者暗昧，精氣之變化幽微難知，不可形象求之，亦非筆墨所能圖寫。聖人[[揆度]]此理，參序以成其基業，必由心悟，非傳授之所能盡也。</p><p><strong>所出</strong>：《周易參同契 · 16章》 — https://zh.wikisource.org/wiki/周易參同契/16章</p></article></main></div></div>
