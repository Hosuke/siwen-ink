    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 亡君</nav></header><main><article><h1>亡君</h1><p>亡君非失其國，乃令出於臣而主失其權，實非己有。</p><p>則謂亡君者，非莫有其國也，而有之者，皆非己有也。令臣以外為制於內，則是君人者亡也。聽大國為救亡也，而亡亟於不聽，故不聽。群臣知不聽，則不外諸侯，諸侯知不聽，則不受臣之誣其君矣。</p><p>亡君者，非亡其國之謂也，國猶在也，而威福之柄不在己矣。姦臣竊命，政令由己出，則君雖名有之，實亡之矣。明主當絕其源，不受臣之蔽，不聽誣己之辭，令權歸於上，則君不失其為君也。</p><p><strong>所出</strong>：《韓非子 · 八奸》 — https://zh.wikisource.org/wiki/韓非子/八奸</p></article></main></div></div>
