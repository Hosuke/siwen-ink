    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 九流小說</nav></header><main><article><h1>九流小說</h1><p>文辭之有諧隱，譬九流之有小說，蓋稗官所采，以廣視聽。</p><p>《諧隱》論諧隱之地位，以為：「文辭之有諧隱，譬九流之有小說，蓋稗官所采，以廣視聽。」[[劉勰]]以九流比諧隱，明其非文學之主流，然亦不可廢也。</p><p>《小說家》者流，出於稗官，「街談巷語，道聽途說者之所造」，然而「亦可使為之名理」，有補於治。諧隱之於文章，亦猶是爾。會義適時，頗益諷誡；空戲滑稽，則德音大壞。得失之間，存乎作者之自擇焉。</p><p><strong>所出</strong>：《文心雕龍 · 諧隱》 — https://zh.wikisource.org/wiki/文心雕龍/諧隱</p></article></main></div></div>
