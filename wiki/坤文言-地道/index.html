    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 坤文言　地道无成</nav></header><main><article><h1>坤文言　地道无成</h1><p>地道柔順，无成代終。</p><p>坤文言解六三「含章」曰：「地道也，妻道也，臣道也。地道无成，而代有終也。」</p><p>此言地道之義，柔順无成，代替天以終萬物之事。地道與妻道、臣道相通，皆以柔順從陽，不敢居功，此坤德之要也。</p><p><strong>所出</strong>：《周易 · 坤》 — https://zh.wikisource.org/wiki/周易/坤</p></article></main></div></div>
