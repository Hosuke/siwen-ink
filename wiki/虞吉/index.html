    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 虞吉</nav></header><main><article><h1>虞吉</h1><p>安於虞樂，不妄他有，守正乃吉。</p><p>初九爻辭「虞吉，有他不燕」。虞者，安也。燕者，擾也。象傳云「志未變也」，言初九居卦始，志未變遷，安於其分，則吉。有他而不燕者，意不外騖也。</p><p><strong>所出</strong>：《周易 · 中孚》 — https://zh.wikisource.org/wiki/周易/中孚</p></article></main></div></div>
