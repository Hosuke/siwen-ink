    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 十月納禾稼</nav></header><main><article><h1>十月納禾稼</h1><p>十月斂禾登穀，入於倉廩也。</p><p>[[九月築場圃]]，[[十月納禾稼]]，黍稷重穋，禾麻菽麥，[[授衣]]之候畢，而歲功成焉。嗟我農夫，我稼既同，上入執宮功。</p><p><strong>所出</strong>：《詩經 · 七月》 — https://zh.wikisource.org/wiki/詩經/七月</p></article></main></div></div>
