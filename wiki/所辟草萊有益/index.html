    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 所辟草萊有益</nav></header><main><article><h1>所辟草萊有益</h1><p>問辟地墾田之功，以驗吏治之實效。</p><p>問執官都者，其位事幾何年矣？所辟草萊有益於家邑者幾何矣？夫[[吏者]]，民之所觀，[[治法]]之所在也。辟草萊、墾荒蕪，使地無遺利、人無失業者，此郡縣之吏所以報[[國家]]也。問其居位之年限，則治狀可考；問其辟地之功績，則[[賢否]]可知。地闢則民有所歸，[[食分]]則國有所恃。功多者賞之，功寡者黜之，此[[明主]]之所以[[勸功]]也。</p><p><strong>所出</strong>：《管子 · 第24篇問》 — https://zh.wikisource.org/wiki/管子/第24篇問</p></article></main></div></div>
