    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 詩者持也</nav></header><main><article><h1>詩者持也</h1><p>詩之功用，在持人情性使之歸正也。</p><p>詩者，持也，持人情性。「三百之蔽，義歸無邪，持之為訓，有符焉爾。」人稟七情，應物斯感，感物吟志，莫非自然。詩以持之，使不放逸，此聖人教化之微意也。</p><p><strong>所出</strong>：《文心雕龍 · 明詩》 — https://zh.wikisource.org/wiki/文心雕龍/明詩</p></article></main></div></div>
