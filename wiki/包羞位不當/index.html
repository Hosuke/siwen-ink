    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 包羞位不當</nav></header><main><article><h1>包羞位不當</h1><p>小人處不當之位，包容羞恥而不知返</p><p>包羞，位不當也。</p><p>六三爻辭「包羞」，象辭以為：小人無才而竊位，陽居陰位，剛居柔位，位皆不當，是以容受羞恥而不自知也。</p><p><strong>所出</strong>：《周易 · 否》 — https://zh.wikisource.org/wiki/周易/否</p><hr><p>彖傳曰：「征凶，位不當也。」歸妹之時，柔爻居陽位、剛爻居陰位，陽上陰下，秩序乖逆，故征進有凶。</p><p><strong>所出</strong>：《周易 · 歸妹》 — https://zh.wikisource.org/wiki/周易/歸妹</p></article></main></div></div>
