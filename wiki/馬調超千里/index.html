    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 馬調超千里</nav></header><main><article><h1>馬調超千里</h1><p>利器必待善任，否則無以致遠。</p><p>馬不調，造父不能超千里之跡；民不附，唐虞不能致同天之美。馬極則變態生，而傾僨惟憂矣；民困則多離叛，其禍必振矣。</p><p><strong>所出</strong>：《抱朴子 · 卷05》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷05</p></article></main></div></div>
