    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 仙公告誡四民</nav></header><main><article><h1>仙公告誡四民</h1><p>仙公告人以守一卻鬼延年之道也。</p><p>仙公云：「吾得真道，曾誦此經萬遍。吾昔受之於東華帝君，東華帝君受之於金闕帝君，金闕帝君受之於西王母，皆口口相傳，不記文字。吾今於世書而錄之。」</p><p>又云：「守一卻鬼，可以延年。守一明了，通見十方。」又云：「人可以守一，身死神去，但神不滅。宿福積重，昔願非今日，大羅真人降，仙聖含真出。」</p><p>又言：「功滿三千，白日昇天。修善有餘，坐降雲車。弘道不已，自致不死。」</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 23》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/23</p></article></main></div></div>
