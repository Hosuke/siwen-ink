    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 壅於言</nav></header><main><article><h1>壅於言</h1><p>人主為臣下所雍塞，不得聞直言。</p><p>人臣爲主設事而恐其非也，則先出說設言曰：「議是事者，妬事者也。」人主藏是言，不更聽羣臣；羣臣畏是言，不敢議事。二勢者用，則忠臣不聽而譽臣獨任。如是者謂之壅於言，壅於言者制於臣矣。</p><p><strong>所出</strong>：《韓非子 · 南面》 — https://zh.wikisource.org/wiki/韓非子/南面</p></article></main></div></div>
