    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 負子汲井之喻</nav></header><main><article><h1>負子汲井之喻</h1><p>見死不救，悖於人情。</p><p>子墨子設喻曰：「今有負其子而汲者，隊其子於井中，其母必從而道之。」</p><p>夫救其子於井，人情之所必然也。今歲凶、民飢、道饉，此疚重於隊其子，其可無察邪？</p><p>故為政者，必務使民免於飢饉，乃 [[厚作斂於百姓]] 之政所當先去者也。</p><p><strong>所出</strong>：《墨子 · 七患》 — https://zh.wikisource.org/wiki/墨子/七患</p></article></main></div></div>
