    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天靜以清，地定以寧</nav></header><main><article><h1>天靜以清，地定以寧</h1><p>天以清靜為德，地以安定為寧，萬物失之則死，法之則生。</p><p>天靜以清，地定以寧，萬物失之者死，法之者生。夫靜漠者，神明之定也；虛無者，道之所居也。是故或求之於外者，失之於內；有守之於內者，失之於外。譬猶本與末也，從本引之，千枝萬葉，莫不隨也。</p><p><strong>所出</strong>：《淮南子 · 精神訓》 — https://zh.wikisource.org/wiki/淮南子/精神訓</p></article></main></div></div>
