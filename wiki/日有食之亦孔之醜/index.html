    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 日有食之亦孔之醜</nav></header><main><article><h1>日有食之亦孔之醜</h1><p>日食為大凶之象，天象示警，人當戒懼</p><p>首章言「十月之交，朔月辛卯。日有食之，亦孔之醜」，記周幽王六年辛卯朔日日食之事。詩人以為日食較月食尤醜，以日象人君，月象臣妾，日食則君臣失序，為凶之大者。「彼月而微，此日而微」，月微猶可言，日微則人道乖矣，故下民亦孔之哀。此天戒之垂象，而幽王不能修省者也。</p><p><strong>所出</strong>：《詩經 · 十月之交》 — https://zh.wikisource.org/wiki/詩經/十月之交</p></article></main></div></div>
