    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 虺隤</nav></header><main><article><h1>虺隤</h1><p>馬疲極至病之謂。</p><p>虺隤，馬疲極至病之名也。虺音灰，隤音頹。《卷耳》云「我馬虺隤」，言馬行山道，疲病而不能進也。與下文「玄黃」「瘏」「痡」皆狀行役之苦，馬病則行者艱，寓意深矣。</p><p><strong>所出</strong>：《詩經 · 卷耳》 — https://zh.wikisource.org/wiki/詩經/卷耳</p></article></main></div></div>
