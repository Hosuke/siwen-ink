    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 舜禪天下</nav></header><main><article><h1>舜禪天下</h1><p>舜以天下禪禹，終不以天下之病而利一人。</p><p>堯崩，三年之喪畢，舜讓辟堯之子丹硃於南河之南。諸侯朝覲者不之堯之子而之舜，獄訴訟者不之堯之子而之舜，詃歌者不詃歌堯之子而詃歌舜。曰：「天也夫！」而後之中國踐天子位焉，是爲帝舜。</p><p><strong>所出</strong>：《史記 · 卷001》 — https://zh.wikisource.org/wiki/史記/卷001</p></article></main></div></div>
