    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 操術</nav></header><main><article><h1>操術</h1><p>君子操術然，故能以近知遠，以一人治天下。</p><p>君子位尊而志恭，心小而道大，所聽視者近而所聞見者遠。是何邪？則操術然也。</p><p>故千人萬人之情，一人之情是也；天地始者，今日是也；百王之道，後王是也。君子審後王之道而論百王之前，若端拜而議。推禮義之統，分是非之分，總天下之要，治海內之衆，若使一人，故操彌約而事彌大。五寸之矩，盡天下之方也。</p><p>故君子不下室堂而海內之情舉積此者，則操術然也。</p><p><strong>所出</strong>：《荀子 · 不苟篇》 — https://zh.wikisource.org/wiki/荀子/不苟篇</p></article></main></div></div>
