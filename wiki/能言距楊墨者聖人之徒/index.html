    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 能言距楊墨者聖人之徒</nav></header><main><article><h1>能言距楊墨者聖人之徒</h1><p>能以言論距楊朱、墨翟者，乃聖人之徒，孟子自任之。</p><p>楊墨之道不息，孔子之道不著，是邪說誣民、充塞仁義也。仁義充塞，則率獸食人，人將相食。吾為此懼，閒先聖之道，距楊墨、放淫辭，邪說者不得作。作於其心，害於其事；作於其事，害於其政。聖人復起，不易吾言矣。能言距楊墨者，聖人之徒也。</p><p><strong>所出</strong>：《孟子 · 滕文公下》 — https://zh.wikisource.org/wiki/孟子/滕文公下</p></article></main></div></div>
