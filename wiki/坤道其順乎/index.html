    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 坤道其順乎</nav></header><main><article><h1>坤道其順乎</h1><p>坤道之要，在於柔順，承天而時行。</p><p>坤文言曰：「坤道其順乎！承天而時行。」</p><p>言坤之為道，以順為貴。地道承天，依時而行，不先不後，柔順之至也。此坤德之綱領，與[[天行健]]之自強相對，示人法地之柔順也。</p><p><strong>所出</strong>：《周易 · 坤》 — https://zh.wikisource.org/wiki/周易/坤</p></article></main></div></div>
