    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 六佾</nav></header><main><article><h1>六佾</h1><p>天子用八，諸侯用六</p><p>秋九月，考仲子之宮，將萬焉。公問羽數於眾仲。</p><p>對曰：「天子用八，諸侯用六，大夫四，士二。夫舞，所以節八音，而行八風，故自八以下。」</p><p>公從之，于是初獻六羽，始用六佾也。</p><p><strong>所出</strong>：《春秋左氏傳 · 隱公》 — https://zh.wikisource.org/wiki/春秋左氏傳/隱公</p></article></main></div></div>
