    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三揖至于階</nav></header><main><article><h1>三揖至于階</h1><p>入廟行禮，揖讓之儀也</p><p>入廟之禮，三揖而至於階。賓自門入，公揖入，賓從；至于廟門，公又揖入；及階，三讓而後升。揖者，手之肅容；讓者，辭之至敬。公升二等，賓乃升堂。《周禮》所謂「朝、聘、食、饗，皆有三揖」者，此之謂也。蓋揖讓之儀，所以明主客之分、隆相交之敬焉。</p><p><strong>所出</strong>：《儀禮 · 公食大夫禮》 — https://zh.wikisource.org/wiki/儀禮/公食大夫禮</p></article></main></div></div>
