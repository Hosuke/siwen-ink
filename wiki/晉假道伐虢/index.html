    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 晉假道伐虢</nav></header><main><article><h1>晉假道伐虢</h1><p>晉以璧馬假道於虞，連滅虢、虞。</p><p>晉荀息請以屈產之乘、垂棘之璧，假道於虞以伐虢。虞公許之。宮之奇諫不聽，晉師遂伐虢。明年，晉復假道於虞，宮之奇再諫，仍不聽。八月甲午，晉侯圍上陽。冬十二月丙子朔，晉滅虢，虢公醜奔京師。師還，館于虞，遂襲虞，滅之。執虞公及其大夫井伯，以媵秦穆姬。晉人書曰「晉人執虞公」，罪虞且言易也。夫虞以一璧之賂，亡宗社之固，可不戒哉。</p><p><strong>所出</strong>：《春秋左氏傳 · 僖公》 — https://zh.wikisource.org/wiki/春秋左氏傳/僖公</p></article></main></div></div>
