    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 寄帑與賄</nav></header><main><article><h1>寄帑與賄</h1><p>桓公預為避禍，寄財賄於十邑。</p><p>桓公聞史伯之論，乃東寄帑與賄於虢、鄶，十邑皆有寄地。蓋王室將卑，預為避禍之計，使子孫有所托焉。後幽王弒而平王東遷，十邑之國果有其地，桓公之先見是矣。</p><p><strong>所出</strong>：《國語 · 卷16》 — https://zh.wikisource.org/wiki/國語/卷16</p></article></main></div></div>
