    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 路行不遇兕虎</nav></header><main><article><h1>路行不遇兕虎</h1><p>善攝生者遠乎害氣，故犀虎不加侵陵。</p><p>河上公章句云「路行不遇兾虎」，言善養生者行塗之間，犀兕與虎無由犯之。蓋精神內守，魂魄安居，神明營衛，害氣自遠，猛獸亦不敢犯。學道者當先固攝魂魄，則萬物之害不干其身。[[善攝生者]] [[無死地]]</p><p><strong>所出</strong>：《老子河上公章句 · 貴生》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
