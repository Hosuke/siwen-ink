    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 偃月爐</nav></header><main><article><h1>偃月爐</h1><p>初三微陽之候，道心光現，有象偃月。</p><p>偃月者，每月初三，坤方現一鉤之光，其光偃仰，故名。在人為至靜之中，有一點陽光透露，有象於偃月。在卦為震，所謂「初三日震出庚，曲江岸上月華瑩」者是也。這一點陽光，即是道心之光。丹道之所難得者道心，道心一現，天理昭彰，剛氣漸振，山河大地盡皆靈藥，信手拈來，頭頭是道。爐即此道心，天然造化之爐，真火自具，不假柴炭吹噓之功。</p><p><strong>所出</strong>：《悟真直指 · 卷二》 — https://zh.wikisource.org/wiki/悟真直指/卷二</p></article></main></div></div>
