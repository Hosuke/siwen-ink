    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 使我遂煉獲飛僊</nav></header><main><article><h1>使我遂煉獲飛僊</h1><p>煉成仙道飛昇天界</p><p>煉既成，則我可遂心而煉，形神俱妙，飛舉上昇，成為仙人。</p><p>[[飛仙]]者，煉形化炁、破質登真之謂也。此則修真之極功、黃庭之究竟也。</p><p><strong>所出</strong>：《黃庭內景經 · 玄元章第二十七》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/玄元章第二十七</p></article></main></div></div>
