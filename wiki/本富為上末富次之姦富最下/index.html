    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 本富為上末富次之姦富最下</nav></header><main><article><h1>本富為上末富次之姦富最下</h1><p>治生之道，本富為上，末富次之，姦富最下。</p><p>太史公曰：「是故本富為上，末富次之，姦富最下。無巖處奇士之行，而長貧賤，好語仁義，亦足羞也。」又曰：「凡編戶之民，富相什則卑下之，伯則畏憚之，千則役，萬則仆，物之理也。夫用貧求富，農不如工，工不如商，刺繡文不如倚市門，此言末業，貧者之資也。」</p><p><strong>所出</strong>：《史記 · 卷129》 — https://zh.wikisource.org/wiki/史記/卷129</p></article></main></div></div>
