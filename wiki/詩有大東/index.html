    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 《詩經》有〈大東〉一篇</nav></header><main><article><h1>《詩經》有〈大東〉一篇</h1><p>譚大夫憂國病民而作是詩</p><p>《詩經·小雅》有〈大東〉一篇，毛傳以為譚大夫所作。譚，東方小國也。詩之中述周道遍於天下，而東土之民職勞不來，杼柚其空，膏血竭於征求，而周京之貴族晏然無愧。終篇歷數天象，以維南之箕、維北之斗皆無實用，興「西柄之揭」之刺。蓋東人困於征徭，有羹之無隧飧，有匕而無可用，君子履周道而不得其所，小人視之而澘然出涕。七章皆怨詩之義，毛序所謂「告病」者，實民不堪命之歎也。</p><p><strong>所出</strong>：《詩經 · 大東》 — https://zh.wikisource.org/wiki/詩經/大東</p></article></main></div></div>
