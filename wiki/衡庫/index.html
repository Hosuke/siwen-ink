    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 衡庫</nav></header><main><article><h1>衡庫</h1><p>衡庫者，天子之禮，平衡財用以正天下之器。</p><p>衡庫者，天子之禮也。王道非廢，而天下莫敢窺者，以其正也。衡庫之設，所以在於均節財用，使天下無匱乏之憂，乃霸王之基。</p><p><strong>所出</strong>：《管子 · 爲兵之數》 — https://zh.wikisource.org/wiki/管子/七法/爲兵之數</p></article></main></div></div>
