    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不祥乃神人大祥</nav></header><main><article><h1>不祥乃神人大祥</h1><p>巫祝所謂不祥，正神人之大祥</p><p>宋有荆氏者，宜楸柏桑。其拱把而上者，求狙猴之杙者斬之；三圍四圍，求高名之麗者斬之；七圍八圍，貴人富商之家求禪傍者斬之。故未終其天年，而中道之夭於斧斤，此材之患也。故解之以牛之白顙者，與豚之亢鼻者，與人有痔病者，不可以適河，此皆巫祝以知之矣，所以爲不祥也，此乃神人之所以爲大祥也。</p><p><strong>所出</strong>：《莊子 · 人間世》 — https://zh.wikisource.org/wiki/莊子/人間世</p></article></main></div></div>
