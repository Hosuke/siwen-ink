    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不寒之道</nav></header><main><article><h1>不寒之道</h1><p>服符行氣，兼服諸藥，可令冬月不寒，然無益延年。</p><p>《抱朴子》述不寒之道數法：或以立冬之日服六丙六丁之符，或閉口行五火之炁千二百遍，則十二月中不寒；或服太陽酒，或服紫石英朱漆散，或服雄丸一後服雌丸二，亦可堪一日一夕不寒。雌丸用雌黃、曾青、礬石、磁石；雄丸用雄黃、丹砂、石膽。然抱朴子明言：此無益於延年之事也。</p><p>又有王仲都者，衣以重裘，曝之於夏日之中，周以十爐之火，口不稱熱，身不流汗，亦用此方。</p><p><strong>所出</strong>：《抱朴子 · 卷15》 — https://zh.wikisource.org/wiki/抱朴子/卷15</p></article></main></div></div>
