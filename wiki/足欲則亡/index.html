    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 足欲則亡</nav></header><main><article><h1>足欲則亡</h1><p>晏子以慶氏亡邑為戒，謂足欲則亡無日。</p><p>慶氏亡，分其邑，與晏子邶殿，其鄙六十，晏子勿受。子尾曰：「富者人之所欲也，何獨弗欲？」晏子對曰：「慶氏之邑足欲，故亡。吾邑不足欲也，益之以邶殿，乃足欲，足欲，亡無日矣。」又言：「且夫富，猶布帛之有幅焉。為之制度使無遷也。夫民生厚而用利，於是乎正德以幅之，使無黜慢，謂之幅利。利過則為敗，吾不敢貪多，所謂幅也。」</p><p>足欲者必至於亡，婓幅以為制度，使利有所限而不過。晏子之廉，可以為法矣。</p><p><strong>所出</strong>：《晏子春秋 · 卷六》 — https://zh.wikisource.org/wiki/晏子春秋/卷六</p></article></main></div></div>
