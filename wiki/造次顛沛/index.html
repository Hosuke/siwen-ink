    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 造次顛沛必於是</nav></header><main><article><h1>造次顛沛必於是</h1><p>君子於造次顛沛之間，不違仁也。</p><p>君子無終食之閒違仁。終食之頃且不可違，況造次之時乎？況顛沛之際乎？造次，急遽苟且之時；顛沛，艱難流離之際。唯君子於是二者之間，造次必於是，顛沛必於是，終食而不違，此其所以為君子也。</p><p><strong>所出</strong>：《論語 · 里仁第四》 — https://zh.wikisource.org/wiki/論語/里仁第四</p></article></main></div></div>
