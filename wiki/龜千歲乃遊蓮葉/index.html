    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 龜千歲乃遊蓮葉</nav></header><main><article><h1>龜千歲乃遊蓮葉</h1><p>龜壽千歲則體盈尺，蓍生百莖可決吉凶，皆神物也。</p><p>余至江南，觀其行事，問其長老，云龜千歲乃遊蓮葉之上，蓍百莖共一根。又其所生，獸無虎狼，草無毒螫。江傍家人常畜龜飲食之，以為能導引致氣，有益於助衰養老，豈不信哉！</p><p>傳曰：「天下和平，王道得，而蓍莖長丈，其叢生滿百莖。」方今世取蓍者，不能中古法度，不能得滿百莖長丈者，取八十莖已上，蓍長八尺，即難得也。人民好用卦者，取滿六十莖已上，長滿六尺者，既可用矣。</p><p><strong>所出</strong>：《史記 · 卷128》 — https://zh.wikisource.org/wiki/史記/卷128</p></article></main></div></div>
