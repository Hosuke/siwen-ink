    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不辭</nav></header><main><article><h1>不辭</h1><p>道生養萬物而不辭謝</p><p>道生萬物而不辭謝，化育群品而不以為功。其於萬物，無問大小，無別遠邇，覆之載之，養之成之。功既成矣，亦不有其名；物既成矣，亦不居其位。此聖人所以法道而立德也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 三十四章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
