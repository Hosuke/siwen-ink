    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 先迕而後合</nav></header><main><article><h1>先迕而後合</h1><p>聖人行事先逆後順，眾人先合後逆，故祸福之門不同。</p><p>老子曰：「聖人者先迕而後合，眾人先合而後迕，故禍福之門，利害之反，不可不察也。」</p><p>言聖人行事，不苟且順從，必先是而後成；眾人則急於求合，而終至乖違。是以明主觀人，不可不察其先迕、先合之跡矣。</p><p><strong>所出</strong>：《文子 · 卷七》 — https://zh.wikisource.org/wiki/文子/卷七</p></article></main></div></div>
