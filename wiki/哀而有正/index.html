    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 哀而有正</nav></header><main><article><h1>哀而有正</h1><p>哀辭與吊文皆當有正義，不可失其倫次。</p><p>固宜正義以繩理，昭德而塞違，割析褒貶，哀而有正，則無奪倫矣。</p><p><strong>所出</strong>：《文心雕龍 · 哀弔》 — https://zh.wikisource.org/wiki/文心雕龍/哀弔</p></article></main></div></div>
