    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 箕子之明夷</nav></header><main><article><h1>箕子之明夷</h1><p>殷有三仁，箕子以佯狂晦明而得正志。</p><p>「箕子之明夷，利貞。」六五曰箕子之明夷，利貞。彖辭申之曰：「內難而能正其志，箕子以之。」明夷之世，君子不能用其明，則有蒙難者，有晦藏者，有佯狂以全身者。箕子之事，殷有三仁之一也。明夷而利貞者，非以明得之，以晦得之也。佯狂而不失其正，此箕子所以為明夷也。</p><p><strong>所出</strong>：《周易 · 明夷》 — https://zh.wikisource.org/wiki/周易/明夷</p></article></main></div></div>
