    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 武丁祭成湯</nav></header><main><article><h1>武丁祭成湯</h1><p>武丁祭成湯，有飛雉登鼎耳，祖己戒以修政。</p><p>帝武丁祭成湯，明日，有飛雉登鼎耳而呴，武丁懼。祖己曰：「王勿憂，先修政事。」祖己乃訓王曰：「唯天監下典厥義，降年有永有不永，非天夭民，中絕其命。民有不若德，不聽罪，天既附命正厥德，乃曰其柰何。鳴呼！王嗣敬民，罔非天繼，常祀毋禮于棄道。」武丁修政行德，天下咸驩，殷道復興。</p><p><strong>所出</strong>：《史記 · 卷003》 — https://zh.wikisource.org/wiki/史記/卷003</p></article></main></div></div>
