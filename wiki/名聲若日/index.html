    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 名聲若日</nav></header><main><article><h1>名聲若日</h1><p>名聲昭昭如日，照被四海。</p><p>名聲若日，照四海只。德譽配天，萬民理只。</p><p>言聖王之名聲，昭昭若日之明，光照四海之廣；其德譽可配天地，萬民因而得治理也。魂乎歸徠，則見此治世之景，而樂歸之也。</p><p><strong>所出</strong>：《楚辭 · 大招》 — https://zh.wikisource.org/wiki/楚辭/大招</p></article></main></div></div>
