    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 孚于剝</nav></header><main><article><h1>孚于剝</h1><p>信任小人以剝削正人，危厲立至。</p><p>九五「孚于剝，有厲」。剝，小人剝君子之象也。九五陽居尊位，體剛中而履正，然密比上六陰柔之小人，信而任之，是「孚于剝」也。夫信任邪佞，正道日消，其厲宜矣。象曰「位正當」，言九五之位本正，乃不自重而信剝也。</p><p><strong>所出</strong>：《周易 · 兌》 — https://zh.wikisource.org/wiki/周易/兌</p></article></main></div></div>
