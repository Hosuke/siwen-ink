    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖人道雖虎變</nav></header><main><article><h1>聖人道雖虎變</h1><p>聖人道若虎變而事若鱉行，道若絲棼而事若棋布。</p><p>天下之理，夫者倡，婦者隨，牡者馳，牝者逐，雄者鳴，雌者應。是以聖人制言行，而賢人拘之。</p><p>聖人道雖虎變，事則鱉行，道雖絲棼，事則棋布。</p><p><strong>所出</strong>：《關尹子 · 3》 — https://zh.wikisource.org/wiki/關尹子/3</p></article></main></div></div>
