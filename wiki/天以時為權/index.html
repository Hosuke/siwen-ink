    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天以時為權</nav></header><main><article><h1>天以時為權</h1><p>天以時節為權柄，人當順時以待天權。</p><p>桓公問管子「權數」，管子對曰：「天以時爲權，地以財爲權，人以力爲權，君以令爲權。失天之權，則人地之權亡。」夫天者，萬物之覆也；時者，歲月之序也。湯七年旱，禹五年水，民無𥼷而賣子。天失其權，則民無以生。是以王者歲守十分之參，三年與少半成歲，三十一年而藏十一年，與少半藏參之，一不足以傷民，而農夫敬事力作。守時以待天權，此之謂也。</p><p><strong>所出</strong>：《管子 · 第75篇山權數》 — https://zh.wikisource.org/wiki/管子/第75篇山權數</p></article></main></div></div>
