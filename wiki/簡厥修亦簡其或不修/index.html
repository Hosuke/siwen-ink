    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 簡厥修</nav></header><main><article><h1>簡厥修</h1><p>辨賢否以為勸戒</p><p>王誡君陳曰：「簡厥修，亦簡其或不修；進厥良，以率其或不良。」治人之道，在乎明辨賢與不賢。修者進之，不修者退之；良者褒之，不良者糾之。簡，別也。別其賢而進之，別其否而退之，勸善而懲惡，則風俗成矣。</p><p><strong>所出</strong>：《尚書 · 君陳》 — https://zh.wikisource.org/wiki/尚書/君陳</p></article></main></div></div>
