    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 人身皮肉脈筋骨應自然</nav></header><main><article><h1>人身皮肉脈筋骨應自然</h1><p>人皮應天，人肉應地，人脈應人，人筋應時，人九竅三百六十五絡應野。</p><p>人皮應天，人肉應地，人脈應人，人筋應時，人聲應音，人陰陽合氣應律，人齒面目應星，人出入氣應風，人九竅三百六十五絡應野。</p><p><strong>所出</strong>：《黃帝內經 · 素問第十四卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十四卷</p></article></main></div></div>
