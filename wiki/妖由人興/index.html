    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 妖由人興</nav></header><main><article><h1>妖由人興</h1><p>妖孽之興，由人之失常；人棄常則妖作，故有妖。</p><p>鄭厲公自櫟侵鄭，及大陵，獲傅瑕。傅瑕曰：「苟舍我，吾請納君。」與之盟而赦之。六月甲子，傅瑕殺鄭子及其二子而納厲公。</p><p>初，內蛇與外蛇鬬于鄭南門中，內蛇死。六年而厲公入。公聞之，問于申繻曰：「猶有妖乎？」對曰：「人之所忌，其氣焰以取之，妖由人興也。人無釁焉，妖不自作。人棄常則妖興，故有妖。」</p><p><strong>所出</strong>：《春秋左氏傳 · 莊公》 — https://zh.wikisource.org/wiki/春秋左氏傳/莊公</p></article></main></div></div>
