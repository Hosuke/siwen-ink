    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 俾民心闋</nav></header><main><article><h1>俾民心闋</h1><p>君子施治則民心安定</p><p>「君子如屆，俾民心闋。」屆，至也。闋，止也。言君子之執政者若能俯降至下，則民心之憂虞可以止息。蓋上文云「昊天不傭，降此鞠訩」，民情愁怨，若君子循而至止，則民心之闋然而解。此以君子之治與天變相對，待人而挽天運也。</p><p><strong>所出</strong>：《詩經 · 節南山》 — https://zh.wikisource.org/wiki/詩經/節南山</p></article></main></div></div>
