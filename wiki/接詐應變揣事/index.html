    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 接詐、應變、生利、揣事</nav></header><main><article><h1>接詐、應變、生利、揣事</h1><p>無法令之時，苟能應對欺詐、權變機宜、生產利益、揣度事情者，亦可用之。</p><p>若其無法令而可以接詐、應變、生利、揣事者，上必采其言而責其實。此承上文言令法之貴而設為通變之辭。蓋令與法皆人為之具，而非一成不變；苟能應事機而成功利，雖不在令法之內，亦當采之。但采之非任之而已，必責其實效，以功用為驗也。</p><p><strong>所出</strong>：《韓非子 · 問辯》 — https://zh.wikisource.org/wiki/韓非子/問辯</p></article></main></div></div>
