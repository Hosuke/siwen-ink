    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 助詞之用</nav></header><main><article><h1>助詞之用</h1><p>句末助詞發端、送末，各有其用，巧者借之以彌縫文體，數句之外，得一字之助。</p><p>又詩人以兮字入於句限，《楚辭》用之，字出句外。尋兮字承句，乃語助餘聲。舜詠《南風》，用之久矣，而魏武弗好，豈不以無益文義耶！</p><p>至於夫惟蓋故者，發端之首唱；之而於以者，乃劄句之舊體；乎哉矣也，亦送末之常科。據事似閑，在用實切。巧者迴運，彌縫文體，將令數句之外，得一字之助矣。外字難謬，況章句歟！</p><p><strong>所出</strong>：《文心雕龍 · 章句》 — https://zh.wikisource.org/wiki/文心雕龍/章句</p></article></main></div></div>
