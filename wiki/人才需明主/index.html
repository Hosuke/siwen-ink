    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 人才需明主</nav></header><main><article><h1>人才需明主</h1><p>抱朴子言結綠玄黎需陶猗之市，千鈞之重需賁獲之抱，白雪之弦需靈素之徽，邁倫之才需明主之用。</p><p>夫結綠玄黎，非陶猗不能市也；千鈞之重，非賁獲不能抱也。《白雪》之弦，非靈素不能徽也；邁倫之才，非明主不能用也。</p><p><strong>所出</strong>：《抱朴子 · 卷18》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷18</p></article></main></div></div>
