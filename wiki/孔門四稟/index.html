    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 孔門四稟</nav></header><main><article><h1>孔門四稟</h1><p>柴也愚，參也魯，師也辟，由也喭，各稟異也。</p><p>柴也愚，參也魯，師也辟，由也喭。</p><p>高柴之愚，曾參之魯，子張之辟，子路之喭，皆稟性之偏。然四子者終皆學於聖門，成德達才，偏亦不妨也。</p><p><strong>所出</strong>：《論語 · 先進第十一》 — https://zh.wikisource.org/wiki/論語/先進第十一</p></article></main></div></div>
