    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 與人為善</nav></header><main><article><h1>與人為善</h1><p>大舜善與人同，樂取於人以為善，君子莫大乎與人為善。</p><p>孟子曰：「子路，人告之以有過則喜。禹聞善言則拜。大舜有大焉，善與人同，舍己從人，樂取於人以為善。自耕稼、陶、漁，以至為帝，無非取於人者。取諸人以為善，是與人為善者也。故君子莫大乎與人為善。」</p><p><strong>所出</strong>：《孟子 · 公孫丑上》 — https://zh.wikisource.org/wiki/孟子/公孫丑上</p></article></main></div></div>
