    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 善說者陳其勢言其方</nav></header><main><article><h1>善說者陳其勢言其方</h1><p>善說者陳其勢，言其方，見人之急，若自在危厄之中。</p><p>故善說者，陳其勢，言其方，見人之急也，若自在危厄之中，豈用彊力哉？彊力則鄙矣。說之不聽也，任不獨在所說，亦在說者。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十五》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十五</p></article></main></div></div>
