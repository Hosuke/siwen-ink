    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 睽</nav></header><main><article><h1>睽</h1><p>火澤相乖小事吉，異中求同睽乃通。</p><p>睽，《周易》第三十八卦，兌下離上。象曰「火動而上，澤動而下」，上下異趨，故稱睽。實則睽中有合，聖人教人於乖異之時，求其大同。卦辭曰「小事吉」，蓋柔得中而應乎剛，以和悅輔文明，小事可成；若大事則資剛健之力，非睽所宜也。</p><p>象復申之曰「天地睽而事同，男女睽而志通，萬物睽而事類」，明夫異者其形、同者其理，君子觀睽之象，當「同而異」，和而不流於汙，守正而不專於己。是以處睽之世，不可以孤立；必也遇合以信，交孚以誠，然後睽可解而事可成。</p><p><strong>所出</strong>：《周易 · 睽》 — https://zh.wikisource.org/wiki/周易/睽</p></article></main></div></div>
