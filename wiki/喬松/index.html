    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 喬松</nav></header><main><article><h1>喬松</h1><p>高大之松，生於山上，與隰中游龍相對，喻各得其宜。</p><p>喬松，高大之松也。喬者，高也。[[山有扶蘇]]次章云「山有喬松」，以松之生於山，喻高上之美；下接「隰有游龍」，以水草之生於下，喻卑濕之美。彼此相對，皆得其所。詩人以此興己之不得其人，寓怨刺之意焉。</p><p><strong>所出</strong>：《詩經 · 山有扶蘇》 — https://zh.wikisource.org/wiki/詩經/山有扶蘇</p></article></main></div></div>
