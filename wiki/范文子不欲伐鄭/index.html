    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 范文子不欲伐鄭</nav></header><main><article><h1>范文子不欲伐鄭</h1><p>得鄭憂滋長，焉用鄭；唯無諸侯乃可安，有諸侯則擾擾難息。</p><p>厲公將伐鄭，范文子不欲，曰：「若以吾意，諸侯皆叛，則晉可為也。唯有諸侯，故擾擾焉。凡諸侯，難之本也。得鄭憂滋長，焉用鄭！」郤至曰：「然則王者多憂乎？」文子曰：「我王者也乎哉？夫王者成其德，而遠人以其方賄歸之，故無憂。今我寡德而求王者之功，故多憂。子見無土而欲富者，樂乎哉？」</p><p><strong>所出</strong>：《國語 · 卷12》 — https://zh.wikisource.org/wiki/國語/卷12</p></article></main></div></div>
