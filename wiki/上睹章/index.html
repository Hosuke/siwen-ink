    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 上睹章</nav></header><main><article><h1>上睹章</h1><p>第十六章，專述上視三元、存神內守之道。</p><p>《上睹章第十六》為《太上黃庭內景玉經》之第十六章，專言上視三元、存守內皇、披服鳳衣虎符、昇虛無之義。修真者存思三元之光，魂魄內守，精還神全，則可輕舉上昇，與道合真。</p><p><strong>所出</strong>：《黃庭內景經 · 上睹章第十六》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/上睹章第十六</p></article></main></div></div>
