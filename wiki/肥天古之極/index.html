    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 肥天古之極</nav></header><main><article><h1>肥天古之極</h1><p>配天以德，古以為極。</p><p>肥天古之極。帛書本「肥」字，通行本作「配」。言聖人之德，配於天道，循此而行，乃古之至理也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章六十八》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
