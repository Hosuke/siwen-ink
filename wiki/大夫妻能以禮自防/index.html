    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大夫妻能以禮自防</nav></header><main><article><h1>大夫妻能以禮自防</h1><p>毛詩序此詩之旨，謂大夫妻能以禮義自律也。</p><p>《[[毛詩]]序》云：「《草蟲》，大夫妻能以禮自防也。」言此詩之義，在於大夫妻不以私情廢禮義。夫行役在外，妻子在家，非但不怨，且能以禮自持，登山采薇，望夫而守其分。此序說以為「禮自防」者，正夫婦之正道也。後世說詩者多從序義，謂詩旨主於閨門之正。</p><p><strong>所出</strong>：《詩經 · 草蟲》 — https://zh.wikisource.org/wiki/詩經/草蟲</p></article></main></div></div>
