    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大忠次忠下忠</nav></header><main><article><h1>大忠次忠下忠</h1><p>以德覆君、調君、諫非、竊祿，分臣之等為四。</p><p>有大忠者，有次忠者，有下忠者，有[[國賊]]者：以德覆君而化之，大忠也；以德調君而輔之，次忠也；以是諫非而怒之，下忠也；不卹君之榮辱，不卹國之臧否，偷合苟容，以持禄養交而已耳，國賊也。</p><p>若[[周公]]之於成王也，可謂大忠矣；若[[管仲]]之於桓公，可謂次忠矣；若[[子胥]]之於夫差，可謂下忠矣；若曹觸龍之於紂者，可謂國賊矣。</p><p><strong>所出</strong>：《荀子 · 臣道篇》 — https://zh.wikisource.org/wiki/荀子/臣道篇</p></article></main></div></div>
