    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 奇物滋起</nav></header><main><article><h1>奇物滋起</h1><p>民多知巧，則奇異之物日生。</p><p>老子云「人多知而奇物滋起」，知巧既多，則貪慕新奇之心日熾，奇物之所以日滋也。與[[民多利器]][[盜賊多有]]相承，皆言有為之害。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第二十章 治邦》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
