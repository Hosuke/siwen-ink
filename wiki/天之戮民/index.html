    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天之戮民</nav></header><main><article><h1>天之戮民</h1><p>親權者操之則慄舍之則悲，一無所鑒，是天之戮民。</p><p>老子曰：「以富為是者不能讓祿，以顯為是者不能讓名。親權者不能與人柄，操之則慄，舍之則悲，而一無所鑒，以闚其所不休者，是天之戮民也。」</p><p><strong>所出</strong>：《莊子 · 天運》 — https://zh.wikisource.org/wiki/莊子/天運</p></article></main></div></div>
