    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 域民不以封疆之界</nav></header><main><article><h1>域民不以封疆之界</h1><p>域民、固國、威天下，皆在得道，不在形勢之險。</p><p>域民不以封疆之界，固國不以山溪之險，威天下不以兵革之利。得道者多助，失道者寡助。</p><p>孟子言：封疆之界、山溪之阻、兵革之利，皆外物也，非治道之本。域民者在得民心，不在疆界之遠近；固國者在得人和，不在形勢之險夷；威天下者在行道義，不在甲兵之強弱。故明主務修其內，而不以形勢自恃也。</p><p><strong>所出</strong>：《孟子 · 公孫丑下》 — https://zh.wikisource.org/wiki/孟子/公孫丑下</p></article></main></div></div>
