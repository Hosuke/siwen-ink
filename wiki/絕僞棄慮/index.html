    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 絕僞棄慮</nav></header><main><article><h1>絕僞棄慮</h1><p>絕去巧偽，人返孝慈。</p><p>絕僞棄慮，民復孝茲。</p><p>言絕去一切偽飾與思慮之私，民乃復歸於孝，不待教戒而自成也。</p><p>夫偽者，外飾而內詐；慮者，多營而忘本。二者交作，則父子之恩薄，孝慈之風替。絕而棄之，則民返其天性，孝茲自成。茲者，此也。孝茲者，孝此固有之德也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第六十三章 樸素》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
