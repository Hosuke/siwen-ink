    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 有國之禮</nav></header><main><article><h1>有國之禮</h1><p>有國者疑貳於鬼神、欺惑於龜策、不信於天下，賞不足動、罰不足懼，國不足守。</p><p>有國之禮，享郊廟，敬鬼神也；亹龜策，占吉兇也。敬鬼神，信禍福之職也；占吉兇，信興亡之數也。柰何有大不信，窮民之力以為城郭，奪民之食為儲蓄？是福可以力取，是禍可以力敵；是疑貳於鬼神，是欺惑於龜策，是不信於天下之人。斯道也，賞不足動，罰不足懼，國不足守。</p><p><strong>所出</strong>：《化書 · 卷三》 — https://zh.wikisource.org/wiki/化書/卷三</p></article></main></div></div>
