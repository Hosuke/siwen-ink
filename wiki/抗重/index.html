    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 甸人抗重</nav></header><main><article><h1>甸人抗重</h1><p>甸人豎立重木于道左，以標神位。</p><p>甸人抗重。出自道，道左倚之。甸人，主田野之事者。抗，舉也。重，標神木也。所以表柩車所行之方，使魂神之有所依焉。</p><p><strong>所出</strong>：《儀禮 · 既夕禮》 — https://zh.wikisource.org/wiki/儀禮/既夕禮</p></article></main></div></div>
