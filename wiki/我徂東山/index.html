    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 我徂東山</nav></header><main><article><h1>我徂東山</h1><p>征人自言往赴東山，久而不歸，雨中始得歸途。</p><p>「我徂東山，慆慆不歸」，此征人自道也。往赴東山，歲月淹久。今我自東而還，零雨濛濛，道涂泥濘。其心則於東土言歸，而西望故鄉而悲。制彼裳衣，言去其戎裝也。蜎蜎者蠋，烝在桑野；敦彼獨宿，亦在車下。皆述征行之苦，而歸思之切也。四章皆以「我徂東山」發端，反覆詠歎。</p><p><strong>所出</strong>：《詩經 · 東山》 — https://zh.wikisource.org/wiki/詩經/東山</p></article></main></div></div>
