    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 徙豪富</nav></header><main><article><h1>徙豪富</h1><p>秦始皇徙天下豪富於咸陽十二萬戶以實京師。</p><p>徙天下豪富於咸陽十二萬戶。諸廟及章臺、上林皆在渭南。秦每破諸侯，寫放其宮室，作之咸陽北阪上，南臨渭，自雍門以東至涇、渭，殿屋複道周閣相屬。所得諸侯美人鐘鼓，以充入之。</p><p><strong>所出</strong>：《史記 · 卷006》 — https://zh.wikisource.org/wiki/史記/卷006</p></article></main></div></div>
