    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無作聰明亂舊章</nav></header><main><article><h1>無作聰明亂舊章</h1><p>戒逞私智以紊成法。</p><p>康濟小民，率自中，無作聰明亂舊章。</p><p>成法既定，不可妄更。君臣當守其常，毋以私智亂舊典。此[[監于先王成憲]]之義，而[[法不阿貴]]之戒也。</p><p><strong>所出</strong>：《尚書 · 蔡仲之命》 — https://zh.wikisource.org/wiki/尚書/蔡仲之命</p></article></main></div></div>
