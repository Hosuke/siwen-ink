    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 人文化成</nav></header><main><article><h1>人文化成</h1><p>觀人文之美，以教化天下。</p><p>《易》曰：「觀乎人文，以化成天下。」言聖人觀於禮樂文章之盛，考其得失，而施教化之功，使天下之人遷善遠罪，共趨於善也。文者，人之所以相接；化者，成之以變。天下之民視聴言動皆有以正，而王道成焉。</p><p><strong>所出</strong>：《周易 · 賁》 — https://zh.wikisource.org/wiki/周易/賁</p></article></main></div></div>
