    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蔌蔌</nav></header><main><article><h1>蔌蔌</h1><p>狀物之聚積也。</p><p>《正月》曰：「佌佌彼有屋，蔌蔌方有穀。」毛傳云：「蔌蔌，眾也。」言小人之聚穀者，稍稍蓄之，以為己有，然視君子之以財濟眾者，其量大小，相去萬萬也。蔌蔌者，狀其聚而不散，貪而不厭。詩人借此刺在位者之鄙瑣，以與下文「富人」相映，見贫富之懸殊，而歎小人得志之無足貴也。</p><p><strong>所出</strong>：《詩經 · 正月》 — https://zh.wikisource.org/wiki/詩經/正月</p></article></main></div></div>
