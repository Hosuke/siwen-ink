    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 視之不見</nav></header><main><article><h1>視之不見</h1><p>道超視聽，非耳目所及。</p><p>視之而弗見、聽之而弗聞、搏之而弗得者，視聽之所不及，而名之曰夷、曰希、曰微。夫此三者，不可致詰，故混而為一。一者，道之大全也，上無光下無昧，繩繩無端而不可名，卒復歸於無物。是為無狀之狀、無物之象，恍惚而不可定，指之而無可指也。迎之不見其首，隨之不見其後。古之道可以御今之有，知古始者，是謂道紀。</p><p><strong>所出</strong>：《道德經 (王弼本) · 十四章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
