    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 爭臣四等</nav></header><main><article><h1>爭臣四等</h1><p>大夫有爭臣則國不削，諸侯有爭臣則社稷不危。</p><p>昔萬乘之國有爭臣四人，則封疆不削；千乘之國有爭臣三人，則社稷不危；百乘之家有爭臣二人，則宗廟不毀；父有爭子，不行無禮；士有爭友，不為不義。</p><p>爭臣者，敢於抗顏直諫之臣也。國有諍臣，則君德不蔽；家有諍子，則父過可規；士有諍友，則德行不失。臣之事君，非徒從命，尤貴犯顏諫諍。此[[從道不從君]]之義，於治道尤切。</p><p><strong>所出</strong>：《荀子 · 子道篇》 — https://zh.wikisource.org/wiki/荀子/子道篇</p></article></main></div></div>
