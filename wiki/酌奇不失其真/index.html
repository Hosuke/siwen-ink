    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 酌奇不失其真</nav></header><main><article><h1>酌奇不失其真</h1><p>取法奇異而不失其本真，觀賞華美而不墜其實際，此創作之正道也。</p><p>若能憑軾以倚《雅》、《頌》，懸轡以馭楚篇，酌奇而不失其真，翫華而不墜其實，則顧盼可以驅辭力，欬唾可以窮文致，亦不復乞靈於長卿，假寵於子淵矣。</p><p><strong>所出</strong>：《文心雕龍 · 辨騷》 — https://zh.wikisource.org/wiki/文心雕龍/辨騷</p></article></main></div></div>
