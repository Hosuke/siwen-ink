    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 韓之信未可知</nav></header><main><article><h1>韓之信未可知</h1><p>秦使不通，則韓之信未可知；秦必釋趙之患而移兵於韓。</p><p>今使臣不通，則韓之信未可知也。夫秦必釋趙之患而移兵於韓，願陛下幸復察圖之，而賜臣報決。</p><p><strong>所出</strong>：《韓非子 · 存韓》 — https://zh.wikisource.org/wiki/韓非子/存韓</p></article></main></div></div>
