    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 司殺者</nav></header><main><article><h1>司殺者</h1><p>天道自然而司殺，非人所得代。</p><p>[[老子]]云「常有司殺者殺」，所謂司殺者，天道也、自然之運也。萬物生殺，各有其時，非人所得干預。夫代司殺者殺，是謂[[代大匠斲]]，強行其事而不量力，必至於傷。</p><p>故聖人無為，而民自化；聖人無私，而民自正。刑罰者，輔治之具，非治本也。本既失而專任刑，猶代匠而斫，豈能免傷乎手之患耶？此亦見[[無為之治]]、不[[恃刑罰]]之旨。</p><p><strong>所出</strong>：《道德經 (王弼本) · 七十四章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
