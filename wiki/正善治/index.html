    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 正善治</nav></header><main><article><h1>正善治</h1><p>上善之政若水之平，無為而治也。</p><p>「正善治」者，言上善治政若水之平，正己而不求，所謂「侯王得一以為天下正」者。水之平能照物以正形，聖人之正能正萬物之情。不設科條，不煩政令，因民之自然而治之，是為善治。</p><p><strong>所出</strong>：《老子 (帛書本) · 章八》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
