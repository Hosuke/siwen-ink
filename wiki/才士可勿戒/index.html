    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 才士可勿戒</nav></header><main><article><h1>才士可勿戒</h1><p>才士恃能而不自知，終蹈敗亡，不可不戒。</p><p>抱朴子論才士之蔽，既以必死之病、俞附越人為喻，又申言其蔽之由，曰：欲之而不能得，非能得而弗用者矣。於是斷之曰：於戲才士，可勿戒哉！</p><p>嵇生聞之，乃曰：「吾所惑者，衡之虛名也；子所論者，衡之實病也。敢不寤寐於指南，投杖於折中乎！」</p><p><strong>所出</strong>：《抱朴子 · 卷47》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷47</p></article></main></div></div>
