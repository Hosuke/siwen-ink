    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 高岸為谷，深谷為陵</nav></header><main><article><h1>高岸為谷，深谷為陵</h1><p>世事巨變，高下迭易，以喻政權之陵替</p><p>詩述「爗爗震電，不寧不令。百川沸騰，山冡崒崩」，乃天地失常之象。繼言「高岸為谷，深谷為陵」，以喻世道之劇變：崇高者忽陷於卑下，深窪者忽升而為陵阜。此天變之甚，亦人事失理之應也。</p><p><strong>所出</strong>：《詩經 · 十月之交》 — https://zh.wikisource.org/wiki/詩經/十月之交</p></article></main></div></div>
