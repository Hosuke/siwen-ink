    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 摹體以定習，因性以練才</nav></header><main><article><h1>摹體以定習，因性以練才</h1><p>摹仿典範以養正習，依循性情以磨練才力。</p><p>文之司南，在摹體以定習，因性以練才。蓋人之才性稟異，習亦不同。典雅者，學聖賢之文以定雅習；新奇者，競時尚之尚以養銳思。惟明乎八體之分，循其性之所近，則才可因而煉，習可摹而定。是故學者當先辨己性之所稟，再觀前修之體式，因性以練習，庶幾文道可成。</p><p><strong>所出</strong>：《文心雕龍 · 體性》 — https://zh.wikisource.org/wiki/文心雕龍/體性</p></article></main></div></div>
