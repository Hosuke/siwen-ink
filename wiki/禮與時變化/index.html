    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 禮與時變化</nav></header><main><article><h1>禮與時變化</h1><p>禮者因時世人情以為節文，不可泥古。</p><p>叔孫通欲起朝儀，高帝疑其難。叔孫通對曰：「五帝異樂，三王不同禮。禮者，因時世人情為之節文者也。故夏、殷、周之禮所因損益可知者，謂不相復也。臣願頗采古禮與秦儀雜就之。」夫禮之作，所以齊一人心，非故為繁縟也。時世不同，人情有異，聖人必因時而立制，因事而立儀，不可固守前代之遺文，亦不可一切焚棄之也。</p><p><strong>所出</strong>：《史記 · 卷099》 — https://zh.wikisource.org/wiki/史記/卷099</p></article></main></div></div>
