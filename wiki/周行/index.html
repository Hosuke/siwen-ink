    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 周行</nav></header><main><article><h1>周行</h1><p>大道也。</p><p>周行，大道之名也。行音航。《卷耳》云「寘彼周行」，言將所懷之人置於大道之上也。采卷耳不盈頃筐，心有所思而行者道遠，后妃望其人早歸大路也。亦可解為詩人置卷耳於道旁而行，以起下三章登山之思。</p><p><strong>所出</strong>：《詩經 · 卷耳》 — https://zh.wikisource.org/wiki/詩經/卷耳</p></article></main></div></div>
