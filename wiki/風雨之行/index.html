    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 風雨之行</nav></header><main><article><h1>風雨之行</h1><p>風雨之行，速也。兵速則能行千里而不疲。</p><p>風雨之行，喻兵行之速，如風之疾、雨之至，不遠道里。</p><p>其文曰：「風雨之行者，速也。」「有風雨之行，故能不遠道里矣。」</p><p>兵貴神速，遲則機泄，速則敵不及防，如風雨倏忽而至，故能威絕域之民，不[[遠水不救近火|遠道里而威]]加於遠也。</p><p><strong>所出</strong>：《管子 · 選陳》 — https://zh.wikisource.org/wiki/管子/七法/選陳</p></article></main></div></div>
