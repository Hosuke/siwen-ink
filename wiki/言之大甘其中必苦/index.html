    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 言之大甘其中必苦</nav></header><main><article><h1>言之大甘其中必苦</h1><p>甘言之中必含苦味，不可輕信。</p><p>申生言於狐突曰：「君之使我，非歡也，抑欲測吾心也。是故賜我奇服，而告我權。又有甘言焉。言之大甘，其中必苦。譖在中矣，君故生心。雖蝎譖，焉避之？」</p><p><strong>所出</strong>：《國語 · 卷07》 — https://zh.wikisource.org/wiki/國語/卷07</p></article></main></div></div>
