    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 歲于社考延年壽</nav></header><main><article><h1>歲于社考延年壽</h1><p>古代吉日祭社，所以祈求長壽；若無鬼神，豈能延年。</p><p>於古曰：吉日丁卯，周代祝社方，歲于社考，以延年壽。</p><p>若無鬼神，彼豈有所延年壽哉？</p><p><strong>所出</strong>：《墨子 · 明鬼下》 — https://zh.wikisource.org/wiki/墨子/明鬼下</p></article></main></div></div>
