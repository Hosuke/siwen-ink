    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 刑用於將過</nav></header><main><article><h1>刑用於將過</h1><p>王者刑用於將過則大邪不生，賞施於告姦則細過不失</p><p>治國刑多而賞少，亂國賞多而刑少。故王者刑九而賞一。過有厚薄則刑有輕重，善有大小則賞有多少。刑加於罪所終則姦不去，賞施於民所義則過不止。刑不能去姦而賞不能止過者，必亂。</p><p>故王者刑用於將過，則大邪不生；賞施於告姦，則細過不失。治民能使大邪不生、細過不失，則國治，國治必彊。</p><p><strong>所出</strong>：《商君書 · 卷二》 — https://zh.wikisource.org/wiki/商君書/卷二</p></article></main></div></div>
