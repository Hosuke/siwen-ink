    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 失刑則刑失死則死</nav></header><main><article><h1>失刑則刑失死則死</h1><p>法官失於刑罰亦當受刑，失於死罪亦當受死</p><p>李離之言曰：「理有法，失刑則刑，失死則死。」言司法之官，審理有失，誤輕則受輕刑，誤重則受重刑，皆不可以下吏有過而推諉也。</p><p><strong>所出</strong>：《史記 · 卷119》 — https://zh.wikisource.org/wiki/史記/卷119</p></article></main></div></div>
