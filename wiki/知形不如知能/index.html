    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 知形不如知能，知能不如知意</nav></header><main><article><h1>知形不如知能，知能不如知意</h1><p>兵家認知有層次，知外形不如知才能，知才能不如知意向。</p><p>人之衆寡，士之精麤，器之功苦，盡知之，此乃知形者也。知形不如知能，知能不如知意。</p><p>知形，但觀其外耳；知能，乃窺其才之所任；知意，則得其心之所向。外而內，淺而深，序不可紊也。[[主明、相知、將能|主明相知將能]]之參具，正所以兼此三者而無遺。</p><p><strong>所出</strong>：《管子 · 第27篇地圖》 — https://zh.wikisource.org/wiki/管子/第27篇地圖</p></article></main></div></div>
