    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 莊助發兵會稽</nav></header><main><article><h1>莊助發兵會稽</h1><p>莊助奉節發會稽兵救東甌，太守欲距不為發兵，助乃斬司馬以徇，遂發兵浮海。</p><p>建元三年，東甌告急。天子遣莊助以節發兵會稽。會稽太守欲距不為發兵，助乃斬一司馬，諭意指，遂發兵浮海救東甌。未至，閩越引兵而去。東甌請舉國徙中國，乃悉舉眾來，處江淮之間。太守之欲距者，豈非以郡國遠天子之命、畏邊事之勞邪？莊助以一司馬之頭示信，而兵遂以出，是知奉命者不可以不果，而守土者不可以不奉令也。</p><p><strong>所出</strong>：《史記 · 卷114》 — https://zh.wikisource.org/wiki/史記/卷114</p></article></main></div></div>
