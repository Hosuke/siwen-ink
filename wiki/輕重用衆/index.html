    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 輕重用衆</nav></header><main><article><h1>輕重用衆</h1><p>輕用民力則民力竭，民力竭則令不行。</p><p>地博而國貧者，野不辟也；民衆而兵弱者，民無取也。末產不禁則野不辟，賞罰不信則民無取。地辟而國貧者，舟輿飾、臺榭廣也。賞罰信而兵弱者，輕用衆，使民勞也。舟車臺榭廣，則賦斂厚矣；輕用衆，使民勞，則民力竭矣。賦斂厚則下怨上矣，民力竭則令不行矣。欲爲其民者，必重盡其民力。無以畜之，則往而不可止也；無以牧之，則處而不可使也。</p><p><strong>所出</strong>：《管子 · 第03篇權脩》 — https://zh.wikisource.org/wiki/管子/第03篇權脩</p></article></main></div></div>
