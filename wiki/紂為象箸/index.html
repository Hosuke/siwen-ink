    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 紂為象箸</nav></header><main><article><h1>紂為象箸</h1><p>紂王造象牙箸，箕子因而悲歎，言由微至著，國必漸亡。</p><p>紂為象箸而箕子怖，以為象箸必不加於土鉶，必將犀玉之杯；象箸玉杯必不羹菽藿，必旄、象、豹胎；旄、象、豹胎必不衣短褐而食於茅屋之下，則錦衣九重，廣室高臺。吾畏其卒，故怖其始。居五年，紂為肉圃，設炮烙，登糟丘，臨酒池，紂遂以亡。故箕子見象箸以知天下之禍，老子曰：「見小曰明。」</p><p>  <strong>所出</strong>：《韓非子 · 喻老》 — https://zh.wikisource.org/wiki/韓非子/喻老</p></article></main></div></div>
