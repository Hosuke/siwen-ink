    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖經</nav></header><main><article><h1>聖經</h1><p>聖人之善辭決事，治之樞機也</p><p>[[聖經]]者，拘校上古、中古、下古[[聖人]]之善辭決事，以類相從而成者也。</p><p>其法：取[[道書]]之一善字、一善決事，記書出之；十卷得十，百卷得百，積而至於億善，善字善決事無復脫遺。眾賢共記書聚一善處，合校之以類相從，去其復重，則成[[聖經]]。</p><p>[[太平經]]以[[帝王]]案用[[聖經]]為治要，賢明共安而次之。聖人善辭決事，治之樞機，不可闕也。</p><p><strong>所出</strong>：《太平經 · 09》 — https://zh.wikisource.org/wiki/太平經/09</p></article></main></div></div>
