    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 平丘之會</nav></header><main><article><h1>平丘之會</h1><p>晉會諸侯于平丘，魯君不與盟，晉人執季孫隱如。</p><p>昭公十三年秋，公會劉子、晉侯、齊侯、宋公、衛侯、鄭伯、曹伯、莒子、邾婁子、滕子、薛伯、杞伯、小邾婁子于平丘。八月甲戌，同盟于平丘；公不與盟，晉人執季孫隱如以歸。公至自會。</p><p><strong>所出</strong>：《春秋公羊傳 · 昭公》 — https://zh.wikisource.org/wiki/春秋公羊傳/昭公</p></article></main></div></div>
