    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 尹思</nav></header><main><article><h1>尹思</h1><p>晉人，正月望夜占月，知兵亂之兆。</p><p>尹思，晉人。正月十五夜，坐室中，遣兒視月中有異物否。兒曰：「今年當水，月中有人披簑帶劍。」思出視之，曰：「非水也，將有兵亂，月中人帶甲仗矛爾。」</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 34》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/34</p></article></main></div></div>
