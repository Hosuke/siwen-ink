    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 吐納英華莫非情性</nav></header><main><article><h1>吐納英華莫非情性</h1><p>文章精華，皆出乎作者情性之稟賦。</p><p>氣以實志，志以定言，吐納英華，莫非情性。蓋人之才力稟於血氣，志有所持，故吐辭命意莫非其性之所凝。賈生俊發而文潔體清，長卿傲誕而理侈辭溢，子雲沈寂而志隱味深，各因其情性而文異。是故觀文辭者，可以知其人之志趣也。</p><p><strong>所出</strong>：《文心雕龍 · 體性》 — https://zh.wikisource.org/wiki/文心雕龍/體性</p></article></main></div></div>
