    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 果而勿矜</nav></header><main><article><h1>果而勿矜</h1><p>已成大功，勿自矜夸。</p><p>果而勿矜。矜，夸也。剋敵已定，勿自矜大也。</p><p><strong>所出</strong>：《老子河上公章句 · 儉武》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p><hr><p>既已成事，勿自矜伐。矜者自滿，伐者人怨，皆非善全之道也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 三十章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
