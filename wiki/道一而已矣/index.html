    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 道一而已矣</nav></header><main><article><h1>道一而已矣</h1><p>道無二致，聖人之道一以貫之</p><p>孟子曰「夫道一而已矣」，言聖人之道，無有歧路。成覸以丈夫自尊，顏淵以有為自期，公明儀以文王為法，皆一道也。聖凡之別，在信與行之間耳。</p><p><strong>所出</strong>：《孟子 · 滕文公上》 — https://zh.wikisource.org/wiki/孟子/滕文公上</p></article></main></div></div>
