    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 百凶</nav></header><main><article><h1>百凶</h1><p>極言凶災之繁多</p><p>「百凶」見於[[兔爰]]末章「逢此百凶」。凶者，災也。詩人自言我生之初尚[[尚寐無吪|無庸]]，無所造作、無所用事，及其生也，遭逢百般凶災。「百」極言其多，「凶」兼括天災人禍而言之。三章之辭由[[百罹]]而[[百憂]]而[[百凶]]，遞進而至於極，詩人悲世之情亦隨之而愈烈也。</p><p><strong>所出</strong>：《詩經 · 兔爰》 — https://zh.wikisource.org/wiki/詩經/兔爰</p></article></main></div></div>
