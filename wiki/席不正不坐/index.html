    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 席不正不坐</nav></header><main><article><h1>席不正不坐</h1><p>席必正方可坐，居敬以嚴威儀。</p><p>席不正不坐。[[孔子]]之於居處，席位必正，苟有不正，寧闕其坐。此非拘於形骸，乃居敬之實也。《鄉黨》一篇，終以此章，聖人威儀之密，蓋終身行之而不已。</p><p><strong>所出</strong>：《論語 · 鄉黨第十》 — https://zh.wikisource.org/wiki/論語/鄉黨第十</p></article></main></div></div>
