    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 孝文皇帝增諸神祠</nav></header><main><article><h1>孝文皇帝增諸神祠</h1><p>記文帝十三年下詔增雍五畤及河、湫、漢水之祠，命祝官歸福於朕。</p><p>是歲，制曰：「朕即位十三年于今，賴宗廟之靈，社稷之福，方內艾安，民人靡疾。閒者比年登，朕之不德，何以饗此？皆上帝諸神之賜也。蓋聞古者饗其德必報其功，欲有增諸神祠。有司議增雍五畤路車各一乘，駕被具；西畤畦畤禺車各一乘，禺馬四匹，駕被具；其河、湫、漢水加玉各二；及諸祠，各增廣壇場，珪幣俎豆以差加之。而祝祕者歸福於朕，百姓不與焉。自今祝致敬，毋有所祈。」</p><p><strong>所出</strong>：《史記 · 卷028》 — https://zh.wikisource.org/wiki/史記/卷028</p></article></main></div></div>
