    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 属引</nav></header><main><article><h1>属引</h1><p>以引繩屬附于柩車以下棺。</p><p>屬引。主人袒。眾主人西面北上，妇人東面，皆不哭。乃窆。屬，附也；引，轤引也。所以引柩車以下于壙。商祝飾柩，一池，紐前赬後縒，齊三采，設披，屬引。</p><p><strong>所出</strong>：《儀禮 · 既夕禮》 — https://zh.wikisource.org/wiki/儀禮/既夕禮</p></article></main></div></div>
