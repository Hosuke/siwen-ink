    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 寒耕暑耘力歸於上</nav></header><main><article><h1>寒耕暑耘力歸於上</h1><p>農夫苦作以奉上，女工紡織以實府</p><p>善為國者，使農夫寒耕暑耘，力歸於上；女勤於纖微，而織歸於府。非怨民心、傷民意，乃高下之筴不得不行之理也。上下各安其分，則國用足而民不怨。</p><p><strong>所出</strong>：《管子 · 第68篇巨乘馬》 — https://zh.wikisource.org/wiki/管子/第68篇巨乘馬</p></article></main></div></div>
