    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 朋黨相和</nav></header><main><article><h1>朋黨相和</h1><p>朋黨則君孤</p><p>朋黨相和，臣下得欲，則人主孤；羣臣公舉，下不相和，則人主明。</p><p>朋黨相與，則臣下得遂其欲，而人主孤立。若羣臣公舉而不相和，則人主明察。此治道之辨也。</p><p><strong>所出</strong>：《韓非子 · 外儲說左下》 — https://zh.wikisource.org/wiki/韓非子/外儲說左下
