    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 燕爵不知禍將及</nav></header><main><article><h1>燕爵不知禍將及</h1><p>以燕爵喻臣子不知禍難之將至。</p><p>孔子曰：「燕爵爭善處於一屋之下，母子相哺也，區區焉相樂也，自以為安矣。灶突決，上棟焚，燕爵顏色不變，是何也？不知禍之將及之也，不亦愚乎！為人臣而免於燕爵之智者寡矣。」</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十六》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十六</p></article></main></div></div>
