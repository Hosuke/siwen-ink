    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 古之人無斁</nav></header><main><article><h1>古之人無斁</h1><p>古人行道不倦，無有厭斁之時，育人之心恒久不息。</p><p>《思齊》卒章云「古之人無斁，譽髦斯士」。無斁者，不厭不倦之謂也。言古人行道，終食之間不敢廢弛，無有懈怠之時。</p><p>此贊古聖先王之德：行道之心無時或斁，教人之心無有已時也。</p><p><strong>所出</strong>：《詩經 · 思齊》 — https://zh.wikisource.org/wiki/詩經/思齊</p></article></main></div></div>
