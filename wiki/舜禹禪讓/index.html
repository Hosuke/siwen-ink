    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 舜禹禪讓</nav></header><main><article><h1>舜禹禪讓</h1><p>舜子商均不肖，舜豫荐禹於天，崩後禹踐天子位。</p><p>舜子商均亦不肖，舜乃豫荐之於天。二十八年而堯崩。三年之喪畢，舜讓辟堯之子丹硃。商均皆有疆土，以奉先祀。服其服，禮樂如之。舜以客見天子，天子弗臣，示不敢專也。</p><p><strong>所出</strong>：《史記 · 卷001》 — https://zh.wikisource.org/wiki/史記/卷001</p></article></main></div></div>
