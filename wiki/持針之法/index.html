    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 持針之法</nav></header><main><article><h1>持針之法</h1><p>臨淵握虎，靜志觀人，端下正神，以令氣易行。</p><p>如臨深淵者，不敢墮也；手如握虎者，欲其壯也；神無營於眾物者，靜志觀病人無左右視也；義無邪下者，欲端以正也；必正其神者，欲瞻病人目制其神，令氣易行也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第十四卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十四卷</p></article></main></div></div>
