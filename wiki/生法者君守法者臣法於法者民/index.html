    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 生法者君，守法者臣，法於法者民</nav></header><main><article><h1>生法者君，守法者臣，法於法者民</h1><p>君立法，臣執法，民守法，三者皆從於法，是為大治。</p><p>聖君明其法而固守之，羣臣修通輻湊，以事其主；百姓輯睦聽令，道法以從其事。故曰：有生法，有守法，有法於法。夫生法者君也，守法者臣也，法於法者民也。君臣上下貴賤皆從法，此謂為大治。</p><p><strong>所出</strong>：《管子 · 第45篇任法》 — https://zh.wikisource.org/wiki/管子/第45篇任法</p></article></main></div></div>
