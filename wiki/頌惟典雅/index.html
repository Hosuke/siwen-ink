    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 頌惟典雅</nav></header><main><article><h1>頌惟典雅</h1><p>頌之文辭當清鑠典雅，不入華侈，不涉規戒</p><p>原夫頌惟典雅，辭必清鑠，敷寫似賦，而不入華侈之區；敬慎如銘，而異乎規戒之域；揄揚以發藻，汪洋以樹義，雖纖曲巧致，與情而變，其大體所底，如斯而已。</p><p><strong>所出</strong>：《文心雕龍 · 頌讚》 — https://zh.wikisource.org/wiki/文心雕龍/頌讚</p></article></main></div></div>
