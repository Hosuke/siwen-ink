    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 載營魄抱一</nav></header><main><article><h1>載營魄抱一</h1><p>修身治國之要，在乎魂魄相抱而不離。</p><p>載營魄者，魂魄也。抱一者，守專也。言人載其魂魄，循行一身，當守專於至一道，不敢散離而之他也。魂營形魄，主御精神。所以制之者，貴在一心焉。修身者載之，治國者亦載之。魂魄不離，則精神內守；精神內守，則無妄動之患。是以聖人治人事天，其道一也。</p><p><strong>所出</strong>：《老子河上公章句 · 能為》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
