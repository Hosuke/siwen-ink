    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 富人爭奢侈</nav></header><main><article><h1>富人爭奢侈</h1><p>富人爭奢侈，而任氏折節為儉，力田畜，此治生之異者也。</p><p>富人爭奢侈，而任氏折節為儉，力田畜。田畜人爭取賤賈，任氏獨取貴善。富者數世。然任公家約，非田畜所出弗衣食，公事不畢則身不得飲酒食肉。以此為閭里率，故富而主上重之。</p><p><strong>所出</strong>：《史記 · 卷129》 — https://zh.wikisource.org/wiki/史記/卷129</p></article></main></div></div>
