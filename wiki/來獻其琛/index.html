    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 來獻其琛</nav></header><main><article><h1>來獻其琛</h1><p>淮夷受化，致其方物以朝也。</p><p>[[來獻其琛]]，出自《詩經·泮水》。詩言「[[翩彼飛鴞]]，集于泮林。食我桑黮，懷我好音。[[憬彼淮夷]]，[[來獻其琛]]」，言淮夷本狼戾，若[[翩彼飛鴞]]之惡聲，然受魯之德化，猶食桑而變好音，遂[[來獻其琛]]以為貢。琛，寶也。[[來獻其琛]]與「[[元龜象齒]]」「[[大賂南金]]」並言，皆淮夷之方物。詩人以物產之盛，見德化之遠，[[思樂泮水]]而脩泮宮，其效至此。</p><p><strong>所出</strong>：《詩經 · 泮水》 — https://zh.wikisource.org/wiki/詩經/泮水</p></article></main></div></div>
