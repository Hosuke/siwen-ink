    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 儒生尋案</nav></header><main><article><h1>儒生尋案</h1><p>譏儒生考索古禮，沈溺章句，卒無所得。</p><p>抱朴子譏當時之儒曰：「今五禮混撓，雜飾紛錯，枝分葉散，重出互見，更相貫涉。舊儒尋案，猶多所滯，駁難漸廣異同無已，殊理兼說，歲增月長，自非至精，莫不惑悶。躌躇岐路之衢，悉勞群疑之藪，煎神瀝思，考校判例，嘗有窮年，竟不豁了。治之勤苦，決嫌無地，呻吟尋析，憔悴決角，修之華首不立，妨費日月，廢棄他業，悉困後生。」</p><p>蓋古禮既繁，傳註日滋，尋索者用力愈多而得之愈寡，誠學者之大患也。</p><p><strong>所出</strong>：《抱朴子 · 卷31》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷31</p></article></main></div></div>
