    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 日者述贊</nav></header><main><article><h1>日者述贊</h1><p>索隱述贊，概括日者之傳</p><p>索隱述贊曰：「日者之名，有自來矣。吉凶占候，著於墨子。齊楚異法，書亡罕紀。後人斯繼，季主獨美。取免暴秦，此焉終否。」</p><p>言日者之術，其來久遠，吉凶占候之書始著於墨翟。齊楚卜法不同，典籍散亡，記事者少。及至季主，獨為美談，以其道術超群，免於暴秦之亂云。</p><p><strong>所出</strong>：《史記 · 卷127》 — https://zh.wikisource.org/wiki/史記/卷127</p></article></main></div></div>
