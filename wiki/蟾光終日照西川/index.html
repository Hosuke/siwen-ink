    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蟾光終日照西川</nav></header><main><article><h1>蟾光終日照西川</h1><p>真知在彼家如月光西照，修丹者當引歸我家。</p><p>真知具有先天真一之氣，又取象為水中金、月中光，皆陰中有陽之義。真知未經複還，猶在他家，不為我有，故曰蟾光終日照西川。月中有金蟾，蟾光即月光，喻真知外暗而內明。終日照西而不照東，分明光耀在彼矣。學人果能知此真知下落，即可照東，與靈知相會矣。</p><p><strong>所出</strong>：《悟真直指 · 卷二》 — https://zh.wikisource.org/wiki/悟真直指/卷二</p></article></main></div></div>
