    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 至柔馳騁</nav></header><main><article><h1>至柔馳騁</h1><p>天下至柔之物，能馳騁於天下至堅之中。</p><p>天下之至柔，馳騁乎天下之至堅。柔弱勝剛強，此道家之要旨也。水之於石、風之於木，皆至柔馳騁至堅之驗。聖人法之，以柔處世，以弱勝強，不爭而天下莫能與之爭。世人每以剛強為尚，不知至柔之為物，乃天道具象。是以聖人抱柔守雌，無為而無不為。</p><p><strong>所出</strong>：《老子 (帛書本) · 章四十三》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
