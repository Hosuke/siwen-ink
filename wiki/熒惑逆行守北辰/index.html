    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 熒惑逆行守北辰</nav></header><main><article><h1>熒惑逆行守北辰</h1><p>天象示警，熒惑逆行守北辰，歲星逆行天廷，以象人事之變。</p><p>七政分布，而熒惑之星尤為凶測之星。熒惑逆行守北辰，則天道失序，人間必有兵革之變。此占與聖人受制、賢人蒙難相應，天象之變應之人事。</p><p>  <strong>所出</strong>：《史記 · 卷027》 — https://zh.wikisource.org/wiki/史記/卷027</p></article></main></div></div>
