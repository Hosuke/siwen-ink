    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 良醫之門多病人</nav></header><main><article><h1>良醫之門多病人</h1><p>有教無類，故門庭蕪雜，實乃盛德之象。</p><p>南郭惠子問於子貢曰：「夫子之門，何其雜也？」</p><p>子貢曰：「君子正身以俟，欲來者不距，欲去者不止。且夫良醫之門多病人，檃栝之側多枉木，是以雜也。」</p><p>蓋君子以道化人，不棄草木，不辭病者，門庭之雜，正見其容量之廣、澤被之深也。</p><p><strong>所出</strong>：《荀子 · 法行篇》 — https://zh.wikisource.org/wiki/荀子/法行篇</p></article></main></div></div>
