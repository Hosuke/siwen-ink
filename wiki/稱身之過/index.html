    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 稱身之過</nav></header><main><article><h1>稱身之過</h1><p>稱身之過者强，治身之節者惠，不以不善歸人者仁。</p><p>[[善罪身]] 之義。管子云：「稱身之過者，强也。治身之節者，惠也。不以不善歸人者，仁也。」三者皆修身之要，而稱身之過為先。己有過而能自稱之，是之謂强；不强則民將罪之。</p><p><strong>所出</strong>：《管子 · 第32篇小稱》 — https://zh.wikisource.org/wiki/管子/第32篇小稱</p></article></main></div></div>
