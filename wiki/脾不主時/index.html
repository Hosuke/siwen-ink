    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 脾不主時</nav></header><main><article><h1>脾不主時</h1><p>脾寄治於四時之末各十八日，不得獨主一時，而長養四臟。</p><p>此說出[[太陰陽明論]]，明脾土寄旺之義。</p><p>篇中云：「脾者土也，治中央，常以四時長四藏，各十八日寄治，不得獨主於時也。脾藏者，常著胃土之精也，土者，生萬物而法天地，故上下至頭足，不得主時也。」</p><p>土之於天，無時不生，寄旺於四季之末各十八日，而後養四臟，是脾土長養之功，遍及四時，非如心肝肺腎各主一時也。此說與後世脾旺四季之說相發明。</p><p><strong>所出</strong>：《黃帝內經 · 素問第八卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第八卷</p></article></main></div></div>
