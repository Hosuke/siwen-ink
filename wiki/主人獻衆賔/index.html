    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 主人獻衆賔</nav></header><main><article><h1>主人獻衆賔</h1><p>主人降洗，升酌于西階以獻於衆賔之禮。</p><p>主人復闒階，揖降，介降立于賔南。主人西南面三拜衆賔，衆賔皆答一拜。</p><p>主人揖升，坐取爵于西楹下；降洗，升實爵，于西階上獻衆賔。</p><p>衆賔之長升拜受者三人，主人拜送。坐祭，立飲，不拜既爵；授主人爵，降復位。衆賔獻，則不拜受爵，坐祭，立飲。每一人獻，則薦諸其席。衆賔辯有脯醢。</p><p>主人以爵降，奠于篚。</p><p><strong>所出</strong>：《儀禮 · 鄉飲酒禮》 — https://zh.wikisource.org/wiki/儀禮/鄉飲酒禮</p></article></main></div></div>
