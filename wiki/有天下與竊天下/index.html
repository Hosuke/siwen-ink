    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 有天下與竊天下</nav></header><main><article><h1>有天下與竊天下</h1><p>天下不可以小道竊，聖人乃能有其天下</p><p>荀子辨國與天下之異，以為可以奪人國而不可以奪人天下，可以竊國而不可以竊天下。</p><p>國者，小具也，可以小人有也，可以小道得也，可以小力持也。天下者，大具也，不可以小人有也，不可以小道得也，不可以小力持也。國者，小人可以有之，然而未必不亡也；天下者至大也，非聖人莫之能有也。</p><p>故可以有奪人國，不可以有奪人天下。可以竊國，而不可以竊天下也。</p><p><strong>所出</strong>：《荀子 · 正論篇》 — https://zh.wikisource.org/wiki/荀子/正論篇</p></article></main></div></div>
