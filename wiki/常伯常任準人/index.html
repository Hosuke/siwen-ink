    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 常伯、常任、準人</nav></header><main><article><h1>常伯、常任、準人</h1><p>王左右之大臣，治教禮刑之職也。</p><p>常伯、常任、準人，皆王左右之大臣也。「常伯」掌，常以伯道治民，猶今之行政首長。「常任」掌，常以任道任事，猶今之政務官。「準人」掌，常以準道議法，猶今之司法之官。三者各有所司，而總聽於王，為王之樞機。</p><p><strong>所出</strong>：《尚書 · 立政》 — https://zh.wikisource.org/wiki/尚書/立政</p></article></main></div></div>
