    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 張季之言長者守法不阿意</nav></header><main><article><h1>張季之言長者守法不阿意</h1><p>司馬遷贊張釋之守法不阿意，馮唐論將率有味，稱二人可比古之大臣。</p><p>太史公曰：張季之言長者，守法不阿意；馮公之論將率，有味哉！有味哉！語曰「不知其人，視其友」。二君之所稱誦，可著廊廟。書曰「不偏不黨，王道蕩蕩；不黨不偏，王道便便」。張季、馮公近之矣。</p><p><strong>所出</strong>：《史記 · 卷102》 — https://zh.wikisource.org/wiki/史記/卷102</p></article></main></div></div>
