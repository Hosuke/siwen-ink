    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 容保民無疆</nav></header><main><article><h1>容保民無疆</h1><p>容量民心，保守兆民，無有邊際。</p><p>[[澤上有地臨]]，地之廣厚能容，君子法之，以容保民無疆為任。容者，[[君者民之原]]，[[民之父母]]之心也；保者，[[守土]]之責、養民之義也。疆者，邊際之限；無疆者，無有限極之謂。</p><p>能容則民不怨，能保則民不散。[[愛民而安好士而榮]]，此之謂也。</p><p><strong>所出</strong>：《周易 · 臨》 — https://zh.wikisource.org/wiki/周易/臨</p></article></main></div></div>
