    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 魚鱗狎鬛</nav></header><main><article><h1>魚鱗狎鬛</h1><p>漏刻未半而魚鱗狎鬛起，喻丹爐火盛之象。</p><p>漏刻未過半兮，魚鱗狎鬛起。</p><p>漏刻者，天度之分；魚鱗狎鬛，喻水沸之狀。言火候方半，而鼎中之象已呈變化，如魚龍之遊戲，水火激薄，而丹功將成之兆也。</p><p><strong>所出</strong>：《周易參同契 · 32章》 — https://zh.wikisource.org/wiki/周易參同契/32章</p></article></main></div></div>
