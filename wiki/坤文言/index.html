    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 坤文言</nav></header><main><article><h1>坤文言</h1><p></p><p>「坤文言」者，十翼之一，專釋坤卦之義。</p><p>  坤文言首段曰：「坤至柔而動也剛，至靜而德方。後得主而有常，含萬物而化光。坤道其順乎！承天而時行。」</p><p>  此總釋坤德之要：坤至柔而動則剛，至靜而德則方。地道无成而代有終，此坤之常也。</p><p>  其下分釋六爻，皆聖人之微言，後世修身、處世之要道也。</p><p>  <strong>所出</strong>：《周易 · 坤》 — https://zh.wikisource.org/wiki/周易/坤</p></article></main></div></div>
