    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 內史匍匐</nav></header><main><article><h1>內史匍匐</h1><p>貴人入門，當以卑下自處。</p><p>萬石君徙居陵里。內史[[石慶]]醉歸，入外門不下車。萬石君聞之，不食。[[慶]]恐，肉袒請罪，不許。舉宗及兄建肉袒，萬石君讓曰：「內史貴人，入閭里，[[匍匐|里中長老皆走匿]]，而內史坐車中自如，固當！」</p><p>[[太史公]]論此，以「郎中數馬，內史匍匐」並稱，言[[萬石君]]家法之肅，上下之分明如此。</p><p><strong>所出</strong>：《史記 · 卷103》 — https://zh.wikisource.org/wiki/史記/卷103</p></article></main></div></div>
