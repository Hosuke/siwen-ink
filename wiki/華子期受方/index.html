    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 華子期受方</nav></header><main><article><h1>華子期受方</h1><p>華子期師角裏先生，受山隱靈寶方，服之還少行疾，力舉千斤。</p><p>華子期者，淮南人也。師角裏先生，受山隱靈寶方，一曰伊洛飛龜秩，二曰白禹正機，三曰平衡按，合服之，日以還少，一日行五百里，能舉千斤，一歲十易皮。後得仙去，所居名子期山，今屬建寧府。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 5》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/5</p></article></main></div></div>
