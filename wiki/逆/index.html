    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 逆</nav></header><main><article><h1>逆</h1><p>上下失常、生產失序、賞罰失當，皆為逆。</p><p>菽粟不足，末生不禁，民必有飢餓之色，而工以雕文刻鏤相稺也，謂之逆。</p><p>布帛不足，衣服毋度，民必有凍寒之傷，而女以美衣錦繡綦組相稺也，謂之逆。</p><p>萬乘藏兵之國，卒不能野戰應敵，社稷必有危亡之患，而士以毋分役相稺也，謂之逆。</p><p>爵人不論能，祿人不論功，則士無爲行制死節，而羣臣必通外請謁，取權道行，事便辟，以貴富爲榮華以相稺也，謂之逆。</p><p><strong>所出</strong>：《管子 · 第15篇重令》 — https://zh.wikisource.org/wiki/管子/第15篇重令</p></article></main></div></div>
