    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 賞賢罰暴</nav></header><main><article><h1>賞賢罰暴</h1><p>鬼神能賞賢而罰暴，此治天下之正道。</p><p>今天下之王公大人士君子，實將欲求興天下之利，除天下之害，故當鬼神之有與無之別，以爲將不可不明察此者也。</p><p>嘗若鬼神之能賞賢如罰暴也，蓋本施之國家，施之萬民，實所以治國家、利萬民之道也。</p><p>是故子墨子曰：今天下之王公大人士君子，中實將欲求興天下之利，除天下之害，當若鬼神之有也，將不可不尊明也，聖王之道也。</p><p><strong>所出</strong>：《墨子 · 明鬼下》 — https://zh.wikisource.org/wiki/墨子/明鬼下</p></article></main></div></div>
