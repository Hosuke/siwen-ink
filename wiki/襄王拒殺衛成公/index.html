    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 襄王拒殺衛成公</nav></header><main><article><h1>襄王拒殺衛成公</h1><p>晉人執衛成公，請殺之，襄王以政自上下、君臣無獄之理拒之。</p><p>溫之會，晉人執衛成公歸之於周。晉侯請殺之，王曰：不可。夫政自上下者也，上作政而行之下不逆，故上下無怨。今叔父作政而不行，無乃不可乎？夫君臣無獄，今元咺雖直，不可聽也。君臣皆獄，父子將獄，是無上下也。而叔父聽之，一逆矣。又為臣殺其君，其安庸刑？布刑而不庸，再逆矣。一合諸侯而有再逆政，余懼其無後。不然，余何私於衛侯？晉人乃歸衛侯。</p><p><strong>所出</strong>：《國語 · 卷02》 — https://zh.wikisource.org/wiki/國語/卷02</p></article></main></div></div>
