    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 群而無分則爭</nav></header><main><article><h1>群而無分則爭</h1><p>人生不能無群，群而無分則爭，爭則亂，亂則離，離則弱。</p><p>故人生不能無群，群而無分則爭，爭則亂，亂則離，離則弱，弱則不能勝物；故宮室不可得而居也，不可少頃舍禮義之謂也。能以事親謂之孝，能以事兄謂之弟，能以事上謂之順，能以使下謂之君。</p><p><strong>所出</strong>：《荀子 · 王制篇》 — https://zh.wikisource.org/wiki/荀子/王制篇</p></article></main></div></div>
