    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 子事父母舅姑</nav></header><main><article><h1>子事父母舅姑</h1><p>子與婦晨起供奉父母舅姑之禮</p><p>子事父母，雞初鳴，咸盥漱，櫛繋笄總，拂髦冠緌纓，端韠紳，搢笏。左右佩用，左佩紛帨、刀、礪、小觿、金燧，右佩玦、捍、管、遰、大觿、木燧。</p><p>婦事舅姑，如事父母。雞初鳴，咸盥漱，櫛繋，笄總，衣紳。左佩箴、管、線、纊，施縏帙，皆如之。</p><p>及所，下氣怡聲，問衣燠寒，疾痛苛癢，而敬抑搔之。出入，則或先或後，而敬扶持之。進盥，少者奉盤，長者奉水，請沃盥，盥卒授巾。問所欲而敬進之，柔色以溫之。[[父母嘗之而後退]]。</p><p><strong>所出</strong>：《禮記 · 內則》 — https://zh.wikisource.org/wiki/禮記/內則</p></article></main></div></div>
