    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 博塞之文</nav></header><main><article><h1>博塞之文</h1><p>劉勰以博塞喻文，借巧�倖來，前驅有功而後援難繼。</p><p>博塞者，陸博塞棋之戲，以邀遇�倖得為戲者也。劉勰借以喻文之無術者。</p><p>博塞之文，借巧儻來，雖前驅有功，而後援難繼。少既無以相接，多亦不知所刪。多少之惑，何妍之能制！</p><p>夫善弈之文，按部整伍，以待情會；博塞之文，則不然。術任心而弗循法度，其為文也，僥倖於一時，而無以為繼。劉勰以是為戒，欲學者知術之不可以不研也。</p><p><strong>所出</strong>：《文心雕龍 · 總術》 — https://zh.wikisource.org/wiki/文心雕龍/總術</p></article></main></div></div>
