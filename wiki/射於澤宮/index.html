    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 射於澤宮</nav></header><main><article><h1>射於澤宮</h1><p>天子將祭，先習射於澤以擇士，而後射於射宮，決定能否與祭。</p><p>天子將祭，必先習射於澤。澤者，所以擇士也。已射於澤，而後射於射宮。射中者得與於祭，不中者不得與於祭。不得與於祭者有讓，削以地；得與於祭者有慶，益以地。進爵絀地是也。</p><p><strong>所出</strong>：《禮記 · 射義》 — https://zh.wikisource.org/wiki/禮記/射義</p></article></main></div></div>
