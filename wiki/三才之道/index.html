    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三才之道</nav></header><main><article><h1>三才之道</h1><p>兼天道、人道、地道而兩之，是為六爻。</p><p>《易傳》明三才之義。《易》之為書也，廣大悉備，有天道焉，有人道焉，有地道焉，兼三材而兩之，故六。六爻者，非他也，乃三才之道也。上爻象天，下爻象地，中四爻象人。天地人相需而成一貫之道，此《易》之所以為廣大也。聖人觀象以知天，觀辭以知人，觀變以知地，三才一貫，而天下之變備矣。</p><p><strong>所出</strong>：《周易 · 繫辭下》 — https://zh.wikisource.org/wiki/易傳/繫辭下</p></article></main></div></div>
