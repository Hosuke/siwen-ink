    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 惠公改葬共世子</nav></header><main><article><h1>惠公改葬共世子</h1><p>改葬以為榮而惡益章，失道之兆也</p><p>惠公即位，出共世子而改葬之，臭達於外。國人誦之曰：「貞之無報也。孰是人斯，而有是臭也？貞為不聽，信為不誠。國斯無刑，偷居倖生。」又稱美公子重耳，謂「若狄公子，吾是之依」。</p><p>郭偃占之，以為「十四年，君之冢嗣其替乎」，重耳必入而伯諸侯，光耿於民。</p><p><strong>所出</strong>：《國語 · 卷09》 — https://zh.wikisource.org/wiki/國語/卷09</p></article></main></div></div>
