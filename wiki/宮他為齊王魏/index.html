    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 宮他爲齊王魏</nav></header><main><article><h1>宮他爲齊王魏</h1><p>借人之資，不可示之無；隱己之有，方可以取。</p><p>周趮謂宫他曰：「爲我謂齊王曰：以齊資我於魏，請以魏事王。」宫他曰：「不可，是示之無魏也。齊王必不資於無魏者，而以怨有魏者。公不如曰：『以王之所欲，臣請以魏聽王。』齊王必以公爲有魏也，必因公。是公有齊也，因以有齊、魏矣。」</p><p><strong>所出</strong>：《韓非子 · 說林下》 — https://zh.wikisource.org/wiki/韓非子/說林下</p></article></main></div></div>
