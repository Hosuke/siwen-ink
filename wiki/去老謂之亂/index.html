    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 去老謂之亂</nav></header><main><article><h1>去老謂之亂</h1><p>田無宇譏晏子有老妻，晏子以為去老納少為逆倫，不可以有亂淫之行。</p><p>田無宇見晏子獨立於閨內，有夫人出於室者，髮斑白，衣緇布之衣，而無裡裘。田無宇譏之曰：「出於室何為者也？」晏子曰：「嬰之家也。」無宇曰：「位為中卿，食田七十萬，何以老妻為？」對曰：「嬰聞之，去老者謂之亂，納少者謂之淫。且夫見色而忘義，處富貴而失倫，謂之逆道。嬰可以有亂淫之行，不顧於倫，逆古之道乎？」</p><p><strong>所出</strong>：《晏子春秋 · 卷八》 — https://zh.wikisource.org/wiki/晏子春秋/卷八</p></article></main></div></div>
