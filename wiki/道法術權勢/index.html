    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 道法術權勢</nav></header><main><article><h1>道法術權勢</h1><p>治世之具，循道、法、術、權、勢以漸進</p><p>道不足以治，則用法；法不足以治，則用術；術不足以治，則用權；權不足以治，則用勢。勢用，則反權；權用，則反術；術用，則反法；法用，則反道；道用，則無為而自治。故窮則徼終，徼終則反始，始終相襲，無窮極也。</p><p><strong>所出</strong>：《尹文子 · 大道上》 — https://zh.wikisource.org/wiki/尹文子/大道上</p></article></main></div></div>
