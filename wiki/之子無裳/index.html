    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 之子無裳</nav></header><main><article><h1>之子無裳</h1><p>鰥夫困乏，無以為昏禮之備也。</p><p>「之子無裳」「之子無帶」「之子無服」，言衞之男子困於凶荒，衣裳不備，無以為昏姻之具也。古者昏禮，男子親迎必具玄冕、玄端之服，今無裳無帶無服，是困悴至甚，終不得偶之象也。《有狐》之詩言此，以見男女失時之悲。</p><p><strong>所出</strong>：《詩經 · 有狐》 — https://zh.wikisource.org/wiki/詩經/有狐</p></article></main></div></div>
