    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 求以得有罪以免</nav></header><main><article><h1>求以得有罪以免</h1><p>求則得之，有罪可赦，道之貴也。</p><p>求以得，有罪以免邪。言道之功用二：其一，人能[[求道]]，[[求厥章|道]]即應之，是[[求則得之|求則得]]；其二，[[有罪]]之人蒙道以化，[[赦過宥罪|罪戾可免]]。[[道寓|道]]非徒[[為而不恃|有為]]之具，[[無為之益|無為]]而萬化成，[[無益無損|無損]]而[[有罪以免|有罪者]]賴以自新。此[[古之所以貴此道者]]之至意。</p><p><strong>所出</strong>：《道德經 (王弼本) · 六十二章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
