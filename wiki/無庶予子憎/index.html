    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無庶予子憎</nav></header><main><article><h1>無庶予子憎</h1><p>戒後世之譏嫌，寓諷諫於利害者也。</p><p>「蟲飛薨薨，甘與子同夢。會且歸矣，無庶予子憎」，詩末章之辭也。妃言蟲聲薨薨，猶可與子共眠；而朝會既散，官員將歸，若猶晏起，則臣民之憎怨及之，是令後世譏予之不能警戒也。</p><p>「無庶」云者，庶幾無此也。「予子憎」，猶言「貽譏於後」也。妃之警戒，婉而成章：不言君之荒淫，但言己之被憎；不言政之必亂，但言後世之譏。利害切於身心，警戒迫於言辭，此「警戒相成」之實也。</p><p>後世有「貽譏萬代」之語，義本於此。</p><p><strong>所出</strong>：《詩經 · 雞鳴》 — https://zh.wikisource.org/wiki/詩經/雞鳴</p></article></main></div></div>
