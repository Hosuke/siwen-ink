    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 紫虛華存宴群真</nav></header><main><article><h1>紫虛華存宴群真</h1><p>魏華存設神肴奏鈞樂，群仙畢集，王母起舞，馮夫人歌道。</p><p>晉永和五年己酉，上清高真會於小有清虛上宮絳房之內。</p><p>紫虛元君魏華存為地主，設以神肴，奏以鈞樂，九靈合節，八音玲瓏。西王母起舞，乃擊節而歌。歌畢，三元馮夫人自彈雲敖而答歌，其辭述玉清之境、萬真之集，末云「回我大椿羅，長謝朝生世」，蓋修道者歸根復命之意也。</p><p><strong>所出</strong>：《墉城集仙錄 · 卷02》 — https://zh.wikisource.org/wiki/墉城集仙錄/卷02</p></article></main></div></div>
