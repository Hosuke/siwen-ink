    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 全生之說勝</nav></header><main><article><h1>全生之說勝</h1><p>尚全生則羣臣但求滋味聲色，禮義廉恥不立。</p><p>人君好全生，則羣臣皆全其生而生又養生。養何也？滋味也，聲色也。然則從欲妄行，男女無別，反於禽獸。禮義廉恥不立，人君無以自守。故「全生之說」一行，則廉恥不立，而國隨以亂。</p><p><strong>所出</strong>：《管子 · 第65篇立政九敗解》 — https://zh.wikisource.org/wiki/管子/第65篇立政九敗解</p></article></main></div></div>
