    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 七善</nav></header><main><article><h1>七善</h1><p>水有七善，聖人法之以近道。</p><p>居善地，心善淵，與善仁，言善信，正善治，事善能，動善時。</p><p>水之性，無適而非善。觀其所處，則就下而有常，此居之善也；其流不可以窺測，此心之善淵也；滋潤百昌不以為恩，此與之善仁也；潮汐有期不爽毫末，此言之善信也；方圜曲直因其自然，此正之善治也；盈科而進放乎四海，此事之善能也；夏漲冬涸各得其時，此動之善時也。水無一善之或闕，故聖人取之以為法。七者一源，水之所以為善，亦聖人之所以幾於道也。</p><p><strong>所出</strong>：《老子河上公章句 · 易性》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
