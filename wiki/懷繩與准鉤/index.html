    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 懷繩與准鉤</nav></header><main><article><h1>懷繩與准鉤</h1><p>聖人治國，如執繩准以正平，取直去枉，無所遺也。</p><p>「懷繩與准鉤，多備規軸，減溜大成，是唯時德之節。」夫繩扶撥以為正，准壞險以為平，鉤入枉而出直。此言聖君賢佐之制舉也，博而不失，因以備能而無遺。國猶是國也，民猶是民也，桀、紂以亂亡，湯、武以治昌。章道以教，明法以期，民之興善也如此，湯、武之功是也。多備規軸者，成軸也。夫成軸之多也，其處大也不究，其入小也不塞，猶迹求履之憲也，夫焉有不適善？</p><p><strong>所出</strong>：《管子 · 第11篇宙合》 — https://zh.wikisource.org/wiki/管子/第11篇宙合</p></article></main></div></div>
