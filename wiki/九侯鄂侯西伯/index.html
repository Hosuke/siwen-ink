    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 九侯鄂侯西伯</nav></header><main><article><h1>九侯鄂侯西伯</h1><p>紂用炮格之刑，醢九侯，脯鄂侯，囚西伯。</p><p>百姓怨望而諸侯有畔者，於是紂乃重刑辟，有炮格之法。以西伯昌、九侯、鄂侯為三公。九侯有好女，入之紂。九侯女不憙淫，紂怒，殺之，而醢九侯。鄂侯爭之彊，辨之疾，并脯鄂侯。西伯昌聞之，竊嘆。崇侯虎知之，以告紂，紂囚西伯羑里。西伯之臣閎夭之徒，求美女奇物善馬以獻紂，紂乃赦西伯。西伯出而獻洛西之地，以請除炮格之刑。紂乃許之，賜弓矢斧鉞，使得征伐，為西伯。</p><p><strong>所出</strong>：《史記 · 卷003》 — https://zh.wikisource.org/wiki/史記/卷003</p></article></main></div></div>
