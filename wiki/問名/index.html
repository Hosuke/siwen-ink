    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 問名</nav></header><main><article><h1>問名</h1><p>六禮之二，遣使請問女子之名，以便歸卜吉凶。</p><p>擯者出請。賓執鴈，請問名，主人許。賓入，授如初禮。</p><p>問名者，納采之後，遣使者執鴈，請問女子之名與姓也。《禮記 · 昏義》雲：「納采、問名、納吉、納徵、請期、親迎，昏禮之六禮也。」</p><p>問名之義，非僅知其名姓而已，亦以便歸而卜之于龜，占其吉凶，以定姻事。</p><p>記雲：「問名。主人受鴈，還，西面對。賓受命乃降。」</p><p><strong>所出</strong>：《儀禮 · 士昬禮》 — https://zh.wikisource.org/wiki/儀禮/士昬禮</p></article></main></div></div>
