    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 世變風移</nav></header><main><article><h1>世變風移</h1><p>歷世既久，風俗移變。</p><p>王言殷頑「既歷三紀，世變風移」。三紀之後，風俗移易，頑民化為善良，可見治化之功也。</p><p><strong>所出</strong>：《尚書 · 畢命》 — https://zh.wikisource.org/wiki/尚書/畢命</p></article></main></div></div>
