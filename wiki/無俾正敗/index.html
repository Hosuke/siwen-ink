    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無俾正敗</nav></header><main><article><h1>無俾正敗</h1><p>勿使正道敗壞也。</p><p>「正」者，政治之正也。「正敗」者，正道之不行也。姦宄不去，寇虐不止，則民不安，正道之敗可知矣。是以去姦止暴，非僅安民也，乃所以全正道也。</p><p><strong>所出</strong>：《詩經 · 民勞》 — https://zh.wikisource.org/wiki/詩經/民勞</p></article></main></div></div>
