    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不知道妄意卜</nav></header><main><article><h1>不知道妄意卜</h1><p>妄意卜筮，不知本源，恰如射覆，高下皆非。</p><p>不知道妄意卜者，如射覆盂。高之，存金存玉；中之，存角存羽；卑之，存瓦存石。是乎，非是乎，惟置物者知之。</p><p><strong>所出</strong>：《關尹子 · 1》 — https://zh.wikisource.org/wiki/關尹子/1</p></article></main></div></div>
