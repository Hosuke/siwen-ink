    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 黃雀之戒</nav></header><main><article><h1>黃雀之戒</h1><p>疑人者為人所疑，防人者為人所防；君子行道無憂無害。</p><p>黃雀之為物也，日遊於庭，日親於人而常畏人，而人常撓之。玄鳥之為物也，時遊於戶，時親於人而不畏人，而人不撓之。彼行促促，此行佯佯；彼鳴啾啾，此鳴鏘鏘；彼視雙雙，此視汪汪；彼心戚戚，此心堂堂。是故疑人者為人所疑，防人者為人所防。君子之道，仁興義、中興正，何憂何害！</p><p><strong>所出</strong>：《化書 · 卷三》 — https://zh.wikisource.org/wiki/化書/卷三</p></article></main></div></div>
