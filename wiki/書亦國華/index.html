    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 書亦國華</nav></header><main><article><h1>書亦國華</h1><p>文章為一國之精華，與蘭香相埒。</p><p>蘭為國香，服媚彌芬；書亦國華，翫之彌美。知音君子，其垂意焉。</p><p>[[見異唯知音耳]]。書之為物，與蘭並美，非知音不足以翫其美、知其妙。夫唯深識鑒奧，必歡然內懌，譬春臺之熙衆人，樂餌之止過客，深識之樂，非淺觀者所知也。</p><p><strong>所出</strong>：《文心雕龍 · 知音》 — https://zh.wikisource.org/wiki/文心雕龍/知音</p></article></main></div></div>
