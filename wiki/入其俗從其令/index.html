    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 入其俗從其令</nav></header><main><article><h1>入其俗從其令</h1><p>君子遊於異地，當從其俗、循其令，不以己意加之。</p><p>莊周遊於雕陵，異鵲感其顙而集於栗林，周欲取之，忘其身，虞人逐而誶之。三日不庭。弟子藺且問其故，周曰：「守形而忘身，觀於濁水而迷於清淵。且吾聞諸夫子曰：『入其俗，從其令。』今吾遊於雕陵而忘吾身，異鵲感吾顙，遊於栗林而忘真，栗林虞人以吾為戮，吾所以不庭也。」</p><p>是故君子遊於異方，當隨俗而行，不以一身犯眾忌，此全身遠害之道也。</p><p><strong>所出</strong>：《莊子 · 山木》 — https://zh.wikisource.org/wiki/莊子/山木</p></article></main></div></div>
