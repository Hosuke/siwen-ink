    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 丘之禱久矣</nav></header><main><article><h1>丘之禱久矣</h1><p>聖人存心於平素。</p><p>[[孔子]]疾病，[[子路]]請禱。[[孔子]]曰有諸，子路言有之，誄曰禱爾于上下神祇。[[孔子]]曰[[丘之禱久矣]]。[[聖人]]平日[[慎齊戰疾]]，素行合於神明，[[禱]]之於已然之先，非[[祈福]]於疾病之時也。</p><p><strong>所出</strong>：《論語 · 述而第七》 — https://zh.wikisource.org/wiki/論語/述而第七</p></article></main></div></div>
