    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五百年必有王者興</nav></header><main><article><h1>五百年必有王者興</h1><p>天命五百年間必有聖王及名世者出，己身適逢其時，當仁不讓。</p><p>孟子去齊，充虞問其何以有憂色。孟子引「君子不怨天，不尤人」之義，復自明其志，以為由周而來已七百餘歲，以數則過，以時則可，天未欲平治天下耳。如欲平治天下，舍我其誰。此言五百年間必有王者興，其間必有名世者，孟子自任其時，不以去齊而自貶，志在天下而非在一國也。</p><p><strong>所出</strong>：《孟子 · 公孫丑下》 — https://zh.wikisource.org/wiki/孟子/公孫丑下</p></article></main></div></div>
