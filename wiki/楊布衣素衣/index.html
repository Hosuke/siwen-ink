    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 楊布衣素衣</nav></header><main><article><h1>楊布衣素衣</h1><p>物變則疑，苟知其故，怪不為怪。</p><p>楊朱之弟楊布衣素衣而出。天雨，解素衣，衣緇衣而反，其狗不知而吠之。楊布怒，將擊之。楊朱曰：「子毋擊也，子亦猶是。曩者使女狗白而往，黑而來，子豈能毋怪哉？」</p><p><strong>所出</strong>：《韓非子 · 說林下》 — https://zh.wikisource.org/wiki/韓非子/說林下</p></article></main></div></div>
