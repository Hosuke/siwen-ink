    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 韓西華</nav></header><main><article><h1>韓西華</h1><p>慈愛於物，常行陰功，學道得仙，居嵩山洞天。</p><p>韓西華者，不知何許人也。慈愛於物，常行陰功，至於蛸翹微命，皆愛而護之。學道得仙，今在嵩山洞天之中。</p><p><strong>所出</strong>：《墉城集仙錄 · 卷07》 — https://zh.wikisource.org/wiki/墉城集仙錄/卷07</p></article></main></div></div>
