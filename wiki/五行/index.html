    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五行</nav></header><main><article><h1>五行</h1><p>水、火、木、金、土五行，各有特性，潤下炎上曲直從革稼穡，味鹹苦酸辛甘。</p><p>五行之名，一曰水，二曰火，三曰木，四曰金，五曰土。其性：水曰潤下，火曰炎上，木曰曲直，金曰從革，土曰稼穡。其味：潤下作鹹，炎上作苦，曲直作酸，從革作辛，稼穡作甘。[[洪範九疇]]之一也。</p><p><strong>所出</strong>：《史記·卷038》 — https://zh.wikisource.org/wiki/史記/卷038</p></article></main></div></div>
