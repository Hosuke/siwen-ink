    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 銜華佩實</nav></header><main><article><h1>銜華佩實</h1><p>聖人之文，兼華美與充實，外內相副也。</p><p>《征聖》論聖人之文曰「雅麗」。「雅」者，正也；「麗」者，美也。雅而不麗，則質木無文；麗而不雅，則淫哇失正。唯聖人之文，雅麗合體，固銜華而佩實者也。「銜華」者，含其美於中也；「佩實」者，據其德於內也。華而不實則虛，實而不華則野；聖人兼之，故為百世之宗。顏闔譏仲尼飾羽而畫，徒事華辭——殊不知聖人之華，乃自然之華，非刻意之飾也。</p><p><strong>所出</strong>：《文心雕龍 · 征聖》 — https://zh.wikisource.org/wiki/文心雕龍/徵聖</p></article></main></div></div>
