    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 傳檄而定</nav></header><main><article><h1>傳檄而定</h1><p>不假兵戈，傳檄而千里定，蒯通說降范陽之策也。</p><p>蒯通說范陽令曰：「今范陽令宜整頓士卒以守戰，怯而畏死，貪而重富貴，故欲先天下降，又畏君以爲秦所置吏，誅殺如前十城。然范陽少年亦方殺其令，自以城距君。君何不齎臣侯印，拜范陽令？令范陽令乘朱輪華轂，使驅馳燕、趙郊，燕、趙見之，皆曰此范陽令先下者也，即喜，城可毋戰而降也。此臣之所謂傳檄而千里定者也。」武信君從其計，因使蒯通賜范陽令侯印。趙地聞之，不戰以城下者三十餘城。</p><p><strong>所出</strong>：《史記 · 卷089》 — https://zh.wikisource.org/wiki/史記/卷089</p></article></main></div></div>
