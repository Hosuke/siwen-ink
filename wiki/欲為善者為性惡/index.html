    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 凡人之欲為善者，為性惡也</nav></header><main><article><h1>凡人之欲為善者，為性惡也</h1><p>人之欲善，正由性惡而然。</p><p>凡人欲為善者，為性惡也。夫薄願厚，惡願美，狹願廣，貧願富，賤願貴，苟無之中者，必求於外。今人之性，固無禮義，故彊學而求有之；性不知禮義，故思慮而求知之。然則性而已，則人無禮義、不知禮義。人無禮義則亂，不知禮義則悖。[[人之欲為善者]]，由性惡而生求善之心，正見性之當化也。</p><p><strong>所出</strong>：《荀子 · 性惡篇》 — https://zh.wikisource.org/wiki/荀子/性惡篇</p></article></main></div></div>
