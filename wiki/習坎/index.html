    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 習坎</nav></header><main><article><h1>習坎</h1><p>重坎疊險，心懷誠信乃可通達。</p><p>習坎者，卦之名，義為重險。上坎下坎相疊，水流不已而盈於窪陷，危莫甚焉。</p><p>卦辭曰「習坎：有孚，維心亨。行有尚。」言處險難之中，唯誠信存於心者乃能亨通；有所行為，必見崇尚。</p><p><strong>所出</strong>：《周易 · 坎》 — https://zh.wikisource.org/wiki/周易/坎</p></article></main></div></div>
