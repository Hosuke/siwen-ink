    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 北山</nav></header><main><article><h1>北山</h1><p>怨大夫役使不均，己勤於王事而不得終養父母。</p><p>《北山》，[[詩經]] 小雅之什也。刺幽王之時，大夫遣役不均。詩人言己攀登北山、采拾枸杞，終日從事王事，不得奉養父母。其卒章六以對比為辭：或安逸燕居，或盡瘁事國；或息偃在牀，或奔走不停；或湛樂饮酒，或畏罪慘慘；或清談風議，或無所不為。凡此皆歎苦樂不均，賢者獨勞，而無以終養其親也。</p><p><strong>所出</strong>：《詩經 · 北山》 — https://zh.wikisource.org/wiki/詩經/北山</p></article></main></div></div>
