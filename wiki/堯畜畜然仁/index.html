    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 堯畜畜然仁</nav></header><main><article><h1>堯畜畜然仁</h1><p>堯以仁聞天下，後世恐人與人相食；賢人利天下亦賊天下，唯外乎賢者知之。</p><p>齧缺遇許由，曰：「子將奚之？」曰：「將逃堯。」曰：「奚謂邪？」曰：「夫堯，畜畜然仁，吾恐其為天下笑。後世其人與人相食與！夫民，不難聚也；愛之則親，利之則至，譽之則勸，致其所惡則散。愛利出乎仁義，捐仁義者寡，利仁義者衆。夫仁義之行，唯且無誠，且假乎禽貪者器。是以一人之斷制利天下，譬之猶一覕也。夫堯知賢人之利天下也，而不知其賊天下也，夫唯外乎賢者知之矣。」</p><p><strong>所出</strong>：《莊子 · 徐無鬼》 — https://zh.wikisource.org/wiki/莊子/徐無鬼</p></article></main></div></div>
