    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 吉凶有時</nav></header><main><article><h1>吉凶有時</h1><p>吉凶有時不可犯，動静有適不可過；犯時之忌罪不在大，失所適過不在深。</p><p>吉凶有時，不可犯也；動静有適，不可過也。犯時之忌罪不在大，失其所適過不在深。動天下滅君主而不可危，侮妻子用顔色而不可易。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷10》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷10</p></article></main></div></div>
