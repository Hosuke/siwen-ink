    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 泥龍</nav></header><main><article><h1>泥龍</h1><p>飾繪之美，終不堪用。</p><p>泥龍雖藻繪炳蔚，而不堪慶雲之招。</p><p>夫龍之所以為神者，非以其形，乃以其能翔雲吐風、鼓雷駕電也。苟失其能，雖極丹青之工、備五采之飾，終不得召風雨、致雲霖。泥龍之設，貌則似矣，神則亡矣；可以奉祭祀於廟堂，不可以乘之以升降。猶之乎飾治之術，莫良乎學；用非其器，雖工弗就。故修名不立者，不可以冒天爵；浮偽不實者，不可以當大任。是以至人貴其實，不貴其華；取其神，不取其貌。</p><p><strong>所出</strong>：《抱朴子 · 卷39》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷39</p></article></main></div></div>
