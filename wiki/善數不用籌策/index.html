    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 善數不用籌策</nav></header><main><article><h1>善數不用籌策</h1><p>善數者不用籌策之具，天理自足，不待外求。</p><p>善數者不用籌策。言善於計算籌度者，不恃籌策之具而能知其數。蓋天理具於一心，無待於外物。《老子》假此以明天道之自然：善行者不恃路，善言者不恃辯，善數者不恃策，善閉者不恃鍵，善結者不恃繩。五者皆以不用為用，以無為為功。此聖人輔物之自然而物自備、佐物之自然而物自成之意也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章二十七》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
