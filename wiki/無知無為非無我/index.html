    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無知無為非無我</nav></header><main><article><h1>無知無為非無我</h1><p>人不可誤以無知無為者為無我，雖有知有為不害其為無我，譬如火躁動不停未嘗有我。</p><p>人無以無知無為者為無我。雖有知有為，不害其為無我。譬如火也，躁動不停，未嘗有我。</p><p><strong>所出</strong>：《關尹子 · 6》 — https://zh.wikisource.org/wiki/關尹子/6</p></article></main></div></div>
