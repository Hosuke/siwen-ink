    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 仇由亡</nav></header><main><article><h1>仇由亡</h1><p>以大遺小，卒必隨之；小國受大國之饋，必有其患。</p><p>知伯將伐仇由而道難不通，乃鑄大鐘遺仇由之君。仇由之君大說，除道將内之。赤章曼枝曰：「不可。此小之所以事大也，而今也大以來，卒必隨之，不可内也。」仇由之君不聽，遂内之。赤章曼枝因斷轂而驅，至於齊，七月而仇由亡矣。</p><p><strong>所出</strong>：《韓非子 · 說林下》 — https://zh.wikisource.org/wiki/韓非子/說林下</p></article></main></div></div>
