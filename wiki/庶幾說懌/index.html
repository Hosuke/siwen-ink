    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 庶幾說懌</nav></header><main><article><h1>庶幾說懌</h1><p>幸得相見，庶幾喜悅。</p><p>[[未見君子]]之時，[[憂心弈弈]]；[[既見君子]]，則[[庶幾說懌]]。詩人先言[[死喪無日]][[無幾相見]]之懼，乃以相見之樂反襯其憂。懌者，喜悅也。</p><p><strong>所出</strong>：《詩經 · 頍弁》 — https://zh.wikisource.org/wiki/詩經/頍弁</p></article></main></div></div>
