    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 經</nav></header><main><article><h1>經</h1><p>經臣、經俗、經產，國之綱紀所係。</p><p>朝有經臣，國有經俗，民有經產。</p><p>何謂朝之經臣？察身能而受官，不誣於上，謹於法令以治，不阿黨，竭能盡力而不尚得，犯難離患而不辭死，受祿不過其功，服位不侈其能，不以毋實虛受者，朝之經臣也。</p><p>何謂國之經俗？所好惡不違於上，所貴賤不逆於令，毋上拂之事，毋下比之說，毋侈泰之養，毋躐等之服，謹於鄉里之行，而不逆於本朝之事者，國之經俗也。</p><p>何謂民之經產？畜長樹蓺，務時殖穀，力農墾草，禁止末事者，民之經產也。</p><p><strong>所出</strong>：《管子 · 第15篇重令》 — https://zh.wikisource.org/wiki/管子/第15篇重令</p></article></main></div></div>
