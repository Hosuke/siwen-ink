    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 羽籙</nav></header><main><article><h1>羽籙</h1><p>世書之仙名，入籙者為上清真人。</p><p>羽籙者，世書之仙名也。高上神霄玉清王祝驗云「世書靈羽籙名，紫籙內宣」，言兆得上昇，身映日月，命與天連，世世書名於[[羽籙]]，紫籙內宣，則乘景三素、北宴高元，號曰仙王、上清真人。</p><p>[[羽籙]]與[[紫籙]]相表裏，總為仙人昇仙之名籍。</p><p><strong>所出</strong>：《上清大洞真經 · 36章》 — https://zh.wikisource.org/wiki/上清大洞真經/36章</p></article></main></div></div>
