    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 脩智之士不事左右</nav></header><main><article><h1>脩智之士不事左右</h1><p>脩士以精絜固身，智士以治辯進業，不能以貨賂事人。</p><p>人臣之欲得官者，其脩士且以精絜固身，其智士且以治辯進業。其脩士不能以貨賂事人，恃其精潔而更不能以枉法爲治，則脩智之士不事左右、不聽請謁矣。</p><p>人主之左右，行非伯夷也，求索不得，貨賂不至，則精辯之功息，而毁誣之言起矣。</p><p><strong>所出</strong>：《韓非子 · 孤憤》 — https://zh.wikisource.org/wiki/韓非子/孤憤</p></article></main></div></div>
