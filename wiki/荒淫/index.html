    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 荒淫</nav></header><main><article><h1>荒淫</h1><p>世俗人多欲，聖人寡欲。</p><p>荒淫，世俗人荒亂，欲進學為文。眾人熙熙，放淫多情欲。</p><p>荒者，蕩也。淫者，過也。世俗馳名逐利，淫佚放情，熙熙然若春，若有所欣，不知止足。聖人泊淡若遺，視此熙攘若將馳而過之，漠然不動其中。河上公以荒淫為世俗浮華之病，宜澄心窒欲以反本根。</p><p><strong>所出</strong>：《老子河上公章句 · 異俗》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
