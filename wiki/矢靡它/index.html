    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 矢靡它</nav></header><main><article><h1>矢靡它</h1><p>誓死靡他，至死不渝之謂。</p><p>汎彼柏舟，在彼中河。髧彼兩髦，實維我儀。彼男子者，吾心所屬；吾之於彼，如舟之於水，不可離也。父母見逼，勢欲奪志，吾唯誓之曰：之死矢靡它。言至死而已，無有他也。柏舟在中，志不可奪，況父母之命乎？</p><p><strong>所出</strong>：《詩經 · 柏舟》 — https://zh.wikisource.org/wiki/詩經/柏舟</p></article></main></div></div>
