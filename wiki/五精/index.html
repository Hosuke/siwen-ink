    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五精</nav></header><main><article><h1>五精</h1><p>水火木金土，各有常性，變化不可勝數。</p><p>水潛，故蘊為五精；火飛，故達為五臭；木茂，故華為五色；金堅，故實為五聲；土和，故滋為五味。其常五，其變不可計，其物五，其雜不可計。然則萬物在天地間，不可執謂之萬，不可執謂之五，不可執謂之一，不可執謂之非萬，不可執謂之非五，不可執謂之非一。或合之，或離之，以此必形，以此必數，以此必氣，徒自勞爾。物不知我，我不知物。</p><p><strong>所出</strong>：《關尹子 · 8》 — https://zh.wikisource.org/wiki/關尹子/8</p></article></main></div></div>
