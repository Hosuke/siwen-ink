    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 仙道在於篤信</nav></header><main><article><h1>仙道在於篤信</h1><p>仙道不在才高，唯在篤信至誠。</p><p>抱朴子云：「至於仙者，唯須篤志至信，勤而不怠，能恬能靜，便可得之，不待多才也。有入俗之高真，乃為道者之重累也。」</p><p>又引《仙經》云：「諸得仙者，皆其受命偶值神仙之氣，自然所稟。故胞胎之中，已含通道之性，及其有識，則心好其事，必遭明師而得其法，不然，則不信不求，求亦不得也。」</p><p>是故仙道貴乎稟賦與師授，而不在乎治世之才智明矣。</p><p><strong>所出</strong>：《抱朴子 · 卷12》 — https://zh.wikisource.org/wiki/抱朴子/卷12</p></article></main></div></div>
