    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 堂谿公</nav></header><main><article><h1>堂谿公</h1><p>堂谿公以全遂之術戒韓非，韓非以仁智之行自誓。</p><p>堂谿公謂韓子曰：「臣竊以為危於身而殆於軀。」引[[二子之言已當]]之事，戒以舍乎全遂之道而肆乎危殆之行。</p><p>韓子答曰：「先生有幸臣之意，然有大傷臣之實。」言堂谿公之心雖善，然阻礙法術之行，是大傷臣下之志也。[[立法術]]之業，未可以全身遠害而廢之。</p><p><strong>所出</strong>：《韓非子 · 問田》 — https://zh.wikisource.org/wiki/韓非子/問田</p></article></main></div></div>
