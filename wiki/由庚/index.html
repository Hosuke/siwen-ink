    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 由庚</nav></header><main><article><h1>由庚</h1><p>詩有小雅其義存而辭亡</p><p>《由庚》，《詩經·小雅·南有嘉魚之什》中篇也。毛詩序云：「《由庚》，萬物得由其道也。」然其詩正文止存「有其義而亡其辭」五字而已，是三百篇中亡詩之例。</p><p>考之《詩經》，小雅自有亡詩之例，所存者唯篇名及序說，《由庚》與《華黍》《由儀》皆是。序以為「萬物得由其道」，言陰陽和、萬物遂其性也。然辭既不傳，義亦難詳徵。後世說詩者或引之以論天道自然之理，要之無正文可考。</p><p><strong>所出</strong>：《詩經 · 由庚》 — https://zh.wikisource.org/wiki/詩經/由庚</p></article></main></div></div>
