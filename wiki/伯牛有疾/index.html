    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 伯牛有疾</nav></header><main><article><h1>伯牛有疾</h1><p>聖人痛惜賢才之歿</p><p>冉伯牛有疾，孔子問之，自牖執其手，曰：「亡之，命矣夫！斯人也，而有斯疾也！斯人也，而有斯疾也！」聖人痛賢者之不得其命也。</p><p><strong>所出</strong>：《論語 · 雍也第六》 — https://zh.wikisource.org/wiki/論語/雍也第六</p></article></main></div></div>
