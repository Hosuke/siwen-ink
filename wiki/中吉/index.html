    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 中吉</nav></header><main><article><h1>中吉</h1><p>守中而止乃獲吉祥</p><p>中吉者，[[訴訟]]之中道也。讼之時，危疑交迫，能守中道，知止而止，惕然自省，則吉。彖辭有「中吉」之文，蓋戒人於讼之際，不可過焉者也。過於讼則事日滋，過於退則人得而陵之。唯守其中，窒而能惕，惕而能止，故得吉也。中者，不偏之謂；吉者，善處之效。中道非怯懦，乃審時度勢之智焉。</p><p><strong>所出</strong>：《周易 · 訴訟》 — https://zh.wikisource.org/wiki/周易/訴訟</p></article></main></div></div>
