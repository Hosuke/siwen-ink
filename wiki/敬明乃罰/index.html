    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 敬明乃罰</nav></header><main><article><h1>敬明乃罰</h1><p>行罰必本敬心，務在明察，不可輕率。</p><p>《康誥》反覆丁寧於行罰之道，以為「敬明乃罰」。敬者，敬天罰、敬民命之心也；明者，明察情實、分辨黑白之智也。二者闕一，則刑罰失當。敬而不明，則優柔寡斷，姦宄縱弛；明而不敬，則慘刻深刻，冤抑繁多。必敬且明，然後刑罰稱其平，民心服其威。《康誥》所言「惟吊茲，于人未能有所丕則」，正此義也。</p><p><strong>所出</strong>：《尚書 · 康誥》 — https://zh.wikisource.org/wiki/尚書/康誥</p></article></main></div></div>
