    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 布衣之俠</nav></header><main><article><h1>布衣之俠</h1><p>閭巷布衣，重然諾，輕生死，為俠於世而不求聞達。</p><p>古布衣之俠，靡得而聞已。近世延陵、孟嘗、春申、平原、信陵之徒，皆因王者親屬，藉於有土卿相之富厚，招天下賢者，顯名諸侯，不可謂不賢者矣。然而順風而呼，聲非加疾，其埶激也。至如閭巷之俠，脩行砥名，聲施於天下，莫不稱賢，是為難耳。</p><p>布衣之徒，設取予然諾，千里誦義，為死不顧世，此亦有所長，非苟而已也。故士窮窘而得委命，此豈非人之所謂賢豪間者邪？</p><p><strong>所出</strong>：《史記 · 卷124》 — https://zh.wikisource.org/wiki/史記/卷124</p></article></main></div></div>
