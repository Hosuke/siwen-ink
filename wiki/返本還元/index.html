    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 返本還元</nav></header><main><article><h1>返本還元</h1><p>取生身受氣之初，反歸其本，乃為真正大藥。</p><p>[[悟真篇]]云：「勸君窮取生身處，返本還元是藥王。」生身受氣之初，即父母未生之前，此際一點元炁，乃萬化之原，養生之藥王。世人不知返求諸此，而外求草木金石，惑之甚矣。</p><p><strong>所出</strong>：《悟真篇》 — https://zh.wikisource.org/wiki/悟真篇</p></article></main></div></div>
