    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 先王之游</nav></header><main><article><h1>先王之游</h1><p>遊有正邪之分，春補農事、秋濟不足為正，師行掠民、縱樂忘返為邪。</p><p>先王之游，別乎邪正。春出，原農事之不本者，謂之游。秋出，補人之不足者，謂之夕。夫師行而糧食其民者，謂之亡。從樂而不反者，謂之荒。先王有游夕之業於人，無荒亡之行於身。</p><p><strong>所出</strong>：《管子 · 第26篇戒》 — https://zh.wikisource.org/wiki/管子/第26篇戒</p></article></main></div></div>
