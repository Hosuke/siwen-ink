    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 善始善成</nav></header><main><article><h1>善始善成</h1><p>道善於起始，亦善於完成，以明道之全功。</p><p>夫唯道，善始且善成。言[[道者萬物之所然]]，物之所以生之所以成，皆由於道。[[萬物恃道]]而不出，成始成終，[[道法自然]]之妙用也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第三章 聞道》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
