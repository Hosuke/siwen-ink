    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 屯以子申蒙用寅戌</nav></header><main><article><h1>屯以子申蒙用寅戌</h1><p>屯蒙二卦各有所值之支，明六十卦日辰配合之理。</p><p>屯以子申，蒙用寅戌。</p><p>[[屯]]為震下坎上，陽氣始萌之卦；[[蒙]]為坎下艮上，物始生之象。子、申、寅、戌，皆地支也。屯卦值子申之辰，蒙卦值寅戌之日。餘六十卦亦各有配日。[[按歷法令]]之義，於是乎見。聖人設卦繫辭，所以象天時而成人事者，其在斯乎。</p><p><strong>所出</strong>：《周易參同契 · 17章》 — https://zh.wikisource.org/wiki/周易參同契/17章</p></article></main></div></div>
