    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 西王母</nav></header><main><article><h1>西王母</h1><p>西王母居流沙之瀕</p><p>西王母宮者，大洞玉經所言仙境也。經云：「西元崑崙山九靈炁，金丹流雲宮王母宮名。」是西王母所居之宮，在崑崙之上，九靈真炁凝聚，金丹流雲覆被。</p><p>誦玉經者，當存思此宮，以太帝皇為宗，[[玄一]]老子、三老素牢為佑，左把符籍，右攜理神，同登琳龍闕，稽首玉清房，拔棄死滅之根，養形[[三五]]之中，七祖解尸結，受福[[明朱方]]。</p><p><strong>所出</strong>：《上清大洞真經 · 39章》 — https://zh.wikisource.org/wiki/上清大洞真經/39章</p></article></main></div></div>
