    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 月帝</nav></header><main><article><h1>月帝</h1><p>結津所成三神之一，黃袞冕如月帝</p><p>月帝，乃存思咽津結作三神之一也。狀如月帝，黃袞冕，居虛中。二神黃衣侍立。下入絳宮，昇至腰間，合為圓月。</p><p><strong>所出</strong>：《上清大洞真經 · 10章》 — https://zh.wikisource.org/wiki/上清大洞真經/10章</p></article></main></div></div>
