    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 知者樂水</nav></header><main><article><h1>知者樂水</h1><p>智者動而樂，仁者靜而壽</p><p>孔子曰：「知者樂水，仁者樂山。知者動，仁者靜。知者樂，仁者壽。」水之流而不滯，知者似之；山之定而不移，仁者似之。動而樂，靜而壽，各有所取也。</p><p><strong>所出</strong>：《論語 · 雍也第六》 — https://zh.wikisource.org/wiki/論語/雍也第六</p></article></main></div></div>
