    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 戎馬生於郊</nav></header><main><article><h1>戎馬生於郊</h1><p>無道之世，戰事不息，母馬產駒於戰地</p><p>天下無道，征伐不休，戰馬馳騁於原野，母馬竟至產駒於郊坰之上。言其亟於兵事，民事荒廢，馬亦不得其所也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第九章 知足》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
