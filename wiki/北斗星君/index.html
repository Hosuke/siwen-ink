    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 北斗星君</nav></header><main><article><h1>北斗星君</h1><p>斗爲天車，臨制八表，宰延生注死之籍，司福善禍淫之權。</p><p>北斗星君者，九皇列星之號也。斗爲天車，運於中央，臨制八表，爕理陰陽。建四時，和五行，定諸紀，移節度，均係於斗。一爲天樞主陽德；二爲天璇主陰刑，三爲天璣主福善，四爲天權主禍惡，五爲玉衡主生殺，六爲開陽主百榖，七爲摇光主六師。八居開陽之左，曰輔星；九居摇光之右，曰弼星，皆所以佐斗成功者也。名號燦著，掌延生注死之籍，司福善禍淫之權。天子諸侯，公卿士庶，一切生命，均屬斗宫。</p><p><strong>所出</strong>：《張三丰先生全集 · 卷7》 — https://zh.wikisource.org/wiki/張三丰先生全集/卷7</p></article></main></div></div>
