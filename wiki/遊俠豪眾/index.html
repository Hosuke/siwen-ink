    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 遊俠豪眾</nav></header><main><article><h1>遊俠豪眾</h1><p>自郭解之後，為俠者極眾，然皆敖而無足數者。</p><p>自是之後，為俠者極眾，敖而無足數者。然關中長安樊仲子、槐里趙王孫、長陵高公子、西河郭公仲、太原鹵公孺、臨淮兒長卿、東陽田君孺，雖為俠而逡逡有退讓君子之風。</p><p><strong>所出</strong>：《史記 · 卷124》 — https://zh.wikisource.org/wiki/史記/卷124</p></article></main></div></div>
