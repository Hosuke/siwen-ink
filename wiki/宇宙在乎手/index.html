    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 宇宙在乎手</nav></header><main><article><h1>宇宙在乎手</h1><p>手為三關之要，握宇宙之玄妙者在是焉。</p><p>「宇宙在乎手」，此《陰符》立言之妙也。</p><p>手為三關之要，學道者當知所先矣。《黃庭經》曰：「口為心關，精神機；足為命關，生地扉；手為人關，把盛衰。」得非以手者，能按天象方隅，推五運六氣，握固以養和，彈指以攝化，診視以知陰陽之候，決目以通鬼神之靈，无一而不在手也。</p><p>宇宙六合，廣大無際，苟得玄妙，其猶示諸掌乎？《參同契序》曰：「運六十四卦之陰符，天關在掌」，正此之謂。</p><p><strong>所出</strong>：《黃帝陰符經講義》 — https://zh.wikisource.org/wiki/黃帝陰符經講義</p></article></main></div></div>
