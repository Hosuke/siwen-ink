    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 春秋譏宋之亂</nav></header><main><article><h1>春秋譏宋之亂</h1><p>孔子稱《春秋》譏宋之亂，自宣公廢太子立弟，國以不寧者十世。</p><p>[[司馬遷評]]引孔子之言：「《春秋》譏宋之亂，自宣公廢太子而立弟，國以不寧者十世。」宋宣公廢太子與夷而立其弟和，是為穆公；穆公卒，復立宣公子與夷，是為殤公。其後宋國內亂不已，華督弒殤公，諸公子迭起爭立，國運多艱。[[宋宣公讓國]]之舉，本欲成義，然卒開[[春秋譏宋之亂]]之漸，誠可嘆也。</p><p><strong>所出</strong>：《史記·卷038》 — https://zh.wikisource.org/wiki/史記/卷038</p></article></main></div></div>
