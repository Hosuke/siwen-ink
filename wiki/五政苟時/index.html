    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五政苟時</nav></header><main><article><h1>五政苟時</h1><p>春夏秋冬各發五政，苟得其時，則歲功成焉。</p><p>春三月，以甲乙之日發五政。五政苟時，春雨乃來。夏三月，以丙丁之日發五政。五政苟時，夏雨乃至也。秋三月，以庚辛之日發五政。五政苟時，五穀皆入。冬三月，以壬癸之日發五政。五政苟時，冬事不過。</p><p><strong>所出</strong>：《管子 · 第40篇四時》 — https://zh.wikisource.org/wiki/管子/第40篇四時</p></article></main></div></div>
