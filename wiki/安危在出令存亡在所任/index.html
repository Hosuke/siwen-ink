    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 安危在出令，存亡在所任</nav></header><main><article><h1>安危在出令，存亡在所任</h1><p>安危決於號令之得失，存亡繫於用人之當否。任賢則興，任姦則亡。</p><p>太史公論楚、趙之亡，以為使戊能用申公之言，趙能用防與先生，豈有兵敗國亡之禍。乃嘆曰：「甚矣，『安危在出令，存亡在所任』，誠哉是言也！」</p><p><strong>所出</strong>：《史記 · 卷050》 — https://zh.wikisource.org/wiki/史記/卷050</p></article></main></div></div>
