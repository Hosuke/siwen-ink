    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 嚴東註度人經</nav></header><main><article><h1>嚴東註度人經</h1><p>嚴東衣弊履穿惟資一瓢，一日註《靈寶度人經》辭不停翰窮日而終。</p><p>道士嚴東，不知何許人。年四十餘，齊高帝建元中詣晉陵，依道士李景遊。嘗自悔若愚，衣弊履穿，惟資一瓢，亦無經書。及與之談論，所造深微，而聲音清徹，聽者駭異。其為笑傲歌謠，和光混邇，時人皆知非常，而欽尚之。</p><p>在晉陵五六年，一日將別，援筆註《靈寶度人經》。辭不停翰，窮日而終。乃入溧陽飯山中，後亦不知所在。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 28》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/28</p></article></main></div></div>
