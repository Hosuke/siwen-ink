    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 贋疝</nav></header><main><article><h1>贋疝</h1><p>厥陰之邪，三月在中，陰盛脈脹不通。</p><p>贋疝之病，厥陰者辰也，三月陽中之陰邪在中，故曰贋疝少腹腫。陰亦盛而脈脹不通，故曰贋癃疝也。甚則陰陽相薄而熱，嗌乾也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第十三卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十三卷</p></article></main></div></div>
