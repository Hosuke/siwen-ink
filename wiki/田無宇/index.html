    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 田無宇</nav></header><main><article><h1>田無宇</h1><p>晏子預言田無宇之後將有齊國，以其公量小私量大，用財無藏，與士交厚故也。</p><p>晏子言：「田無宇之後為幾。」公問故，晏子對曰：「公量小，私量大，以施於民。其與士交也，用財無筐篋之藏，國人負攜其子而歸之，若水之流下也。夫先與人利，而後辭其難，不亦寡乎。若苟勿辭也，從而撫之，不亦幾乎。」</p><p><strong>所出</strong>：《晏子春秋 · 卷三》 — https://zh.wikisource.org/wiki/晏子春秋/卷三</p></article></main></div></div>
