    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 煬己</nav></header><main><article><h1>煬己</h1><p>賢者煬君，猶一人煬竈，非加知而使煬己則危。</p><p>或曰：侏儒善假於夢以見主道矣，然靈公不知侏儒之言也。去雍鉏，退彌子瑕，而用司空狗者，是去所愛而用所賢也。鄭子都賢慶建而壅焉，燕子噲賢子之而壅焉。夫去所愛而用所賢，未免使一人煬己也。不肖者煬主，不足以害明；今不加知而使賢者煬己，則必危矣。</p><p>[[兼術]]</p><p><strong>所出</strong>：《韓非子 · 難四》 — https://zh.wikisource.org/wiki/韓非子/難四</p></article></main></div></div>
