    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 民愚知王世知力王</nav></header><main><article><h1>民愚知王世知力王</h1><p>民愚則知可以王，世知則力可以王</p><p>民愚則知可以王，世知則力可以王。民愚則力有餘而知不足，世知則巧有餘而力不足。民之性，不知則學，力盡而服。故神農教耕而王天下，師其知也；湯武致彊而征諸侯，服其力也。</p><p><strong>所出</strong>：《商君書 · 卷二》 — https://zh.wikisource.org/wiki/商君書/卷二</p></article></main></div></div>
