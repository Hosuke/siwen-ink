    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 富者必用奇勝</nav></header><main><article><h1>富者必用奇勝</h1><p>夫纖嗇筋力，治生之正道，而富者必用奇勝。</p><p>夫纖嗇筋力，治生之正道也，而富者必用奇勝。田農，掘業，而秦揚以蓋一州。掘冢，姦事也，而田叔以起。博戲，惡業也，而桓發用富。行賈，丈夫賤行也，而雍樂成以饒。販脂，辱處也，而雍伯千金。賣漿，小業也，而張氏千萬。灑削，薄技也，而郅氏鼎食。</p><p><strong>所出</strong>：《史記 · 卷129》 — https://zh.wikisource.org/wiki/史記/卷129</p></article></main></div></div>
