    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 燕王策</nav></header><main><article><h1>燕王策</h1><p>皇帝使御史大夫湯廟立皇子旦為燕王，以玄社授土，戒以無作怨無脩德，備邊勿怠。</p><p>維六年四月乙巳，皇帝使御史大夫湯廟立子旦為燕王。曰：</p><p>「於戲，小子旦，受茲玄社！朕承祖考，維稽古，建爾國家，封于北土，世為漢藩輔。於戲！葷粥氏虐老獸心，侵犯寇盜，加以姦巧邊萌。於戲！朕命將率徂征厥罪，萬夫長，千夫長，三十有二君皆來，降期奔師。葷粥徙域，北州以綏。悉爾心，毋作怨，毋俷德，毋乃廢備。非教士不得從徵。於戲，保國艾民，可不敬與！王其戒之。」</p><p>右燕王策。</p><p><strong>所出</strong>：《史記 · 卷060》 — https://zh.wikisource.org/wiki/史記/卷060</p></article></main></div></div>
