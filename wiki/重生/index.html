    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 重生</nav></header><main><article><h1>重生</h1><p>身在江海而心居魏闕，當先重生，重生則利輕。</p><p>中山公子牟謂詹子曰：「身在江海之上，心居乎魏闕之下，柰何？」詹子曰：「重生。重生則利輕。」中山公子牟曰：「雖知之，未能自勝也。」詹子曰：「不能自勝則從，神無惡乎？不能自勝而強不從者，此之謂重傷。重傷之人，無壽類矣！」魏牟，萬乘之公子也，其隱巖穴也，難為於布衣之士；雖未至乎道，可謂有其意矣。</p><p><strong>所出</strong>：《莊子 · 讓王》 — https://zh.wikisource.org/wiki/莊子/讓王</p></article></main></div></div>
