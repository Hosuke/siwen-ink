    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 離</nav></header><main><article><h1>離</h1><p>火得麗而明，人得中正而亨。</p><p>離，利貞。亨。畜牝牛，吉。</p><p>離為火，象明麗之德。卦之所以利於守正者，以其剛在中而柔在外，陰陽相麗，明以正也。畜養牝牛者，取其柔順溫厚之德以配離之明，故吉。</p><p>初九履錯然，敬之无咎。六二黃離，元吉。九三日昃之離，不鼓缶而歌，則大耋之嗟，凶。九四突如其來如，焚如，死如，棄如。六五出涕沱若，戚嗟若，吉。上九王用出征，有嘉折首，獲匪其醜，无咎。</p><p><strong>所出</strong>：《周易 · 離》 — https://zh.wikisource.org/wiki/周易/離</p></article></main></div></div>
