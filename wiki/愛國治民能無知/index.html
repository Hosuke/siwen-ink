    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 愛國治民能無知</nav></header><main><article><h1>愛國治民能無知</h1><p>治國用智，不若無智而化成。</p><p>治民治國，貴乎無智。有智則有作，有作則民擾。聖人抱素守樸，愛國治民而不以智巧加之，使民自化、自正、自富、自樸，則天下平矣。</p><p><strong>所出</strong>：《道德經 (王弼本) · 十章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
