    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 君民</nav></header><main><article><h1>君民</h1><p>君民異名同愛，而珠玉滋味，人嗜之亦嗜；積薪聚米易金換玉，皆由奢以致困。</p><p>君之於民，異名而同愛。君樂馳騁，民亦樂之；君喜聲色，民亦喜之；君好珠玉，民亦好之；君嗜滋味，民亦嗜之。其名則異，其愛則同。所以服布素者，愛士之簪組；服士之簪組者，愛公卿之劍佩；服公卿之劍佩者，愛王者之旒冕，是故王者居兆民所愛之地，不得不慮也。況金根玉輅奪其貨，高臺崇榭奪其力，是賈民之怨，是教民之愛。所以積薪聚米，一歲之計，而易金換玉，一日之費，不得不困，不得不儉。</p><p><strong>所出</strong>：《化書 · 卷六》 — https://zh.wikisource.org/wiki/化書/卷六</p></article></main></div></div>
