    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 神龜曳尾</nav></header><main><article><h1>神龜曳尾</h1><p>楚王欲以相位累莊子，莊子以神龜為喻，寧生而曳尾塗中，不願死而留骨廟堂。喻軒冕祿位不如自然之樂。</p><p>莊子釣於濮水，楚王使大夫二人往先焉，曰：「願以境內累矣！」莊子持竿不顧，曰：「吾聞楚有神龜，死已三千歲矣，王巾笥而藏之廟堂之上。此龜者，寧其死為留骨而貴乎？寧其生而曳尾於塗中乎？」二大夫曰：「寧生而曳尾塗中。」莊子曰：「往矣！吾將曳尾於塗中。」</p><p><strong>所出</strong>：《莊子 · 秋水》 — https://zh.wikisource.org/wiki/莊子/秋水</p></article></main></div></div>
