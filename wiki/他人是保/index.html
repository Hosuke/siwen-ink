    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 他人是保</nav></header><main><article><h1>他人是保</h1><p>己不保則他人保之，物終歸人。</p><p>子有廷內，弗洒弗埽。子有鐘鼓，弗鼓弗考。宛其死矣，他人是保。</p><p>保，守也，取也。言己有鐘鼓而不考擊以自樂，有廷內而不洒掃以居，一旦死焉，他人將取而保守之。與「他是愉」「他人入室」同意，反覆見意。</p><p><strong>所出</strong>：《詩經 · 山有樞》 — https://zh.wikisource.org/wiki/詩經/山有樞</p></article></main></div></div>
