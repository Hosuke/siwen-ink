    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 魏晉辨頌</nav></header><main><article><h1>魏晉辨頌</h1><p>魏晉之世，辨頌之作鮮有出軌，陳思皇子、陸機功臣最顯，然褒貶雜居，已成末代訛體</p><p>及魏晉辨頌，鮮有出轍。陳思所綴，以《皇子》為標；陸機積篇，惟《功臣》最顯；其褒貶雜居，固末代之訛體也。</p><p><strong>所出</strong>：《文心雕龍 · 頌讚》 — https://zh.wikisource.org/wiki/文心雕龍/頌讚</p></article></main></div></div>
