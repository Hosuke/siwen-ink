    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 水旱相伐</nav></header><main><article><h1>水旱相伐</h1><p>水旱交相侵陵，由四時失序、陰陽乖錯所致。</p><p>水旱相伐，風雨不節，蝗虫涌沸，群異旁出。天見其怪，山崩地裂。</p><p>天災之來，非偶然也。[[二至改度]]而乖錯生，[[隆冬大暑]]而寒暑易，陰陽之序亂矣。序亂則水旱失其節，風雨乖其時，蝗虫以之孳生，群異以之旁出，山崩地裂，無非咎徵。[[五行守界]]，則水潤下、火炎上、金從革、木曲直、土稼穡，各守其界，而不相侵犯矣。</p><p><strong>所出</strong>：《周易參同契 · 17章》 — https://zh.wikisource.org/wiki/周易參同契/17章</p></article></main></div></div>
