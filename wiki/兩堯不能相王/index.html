    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 兩堯不能相王</nav></header><main><article><h1>兩堯不能相王</h1><p>同道者相成，異道者相傾</p><p>今人主有大患：使賢者為之，則與不肖者規之；使知者慮之，則與愚者論之；使脩士行之，則與汙邪之人疑之，雖欲成功，得乎哉！譬之，是猶立直木而恐其景之枉也，惑莫大焉！</p><p>故有社稷者，莫不欲彊，俄則弱矣；莫不欲安，俄則危矣；莫不欲存，俄則亡矣。</p><p><strong>所出</strong>：《荀子 · 君道篇》 — https://zh.wikisource.org/wiki/荀子/君道篇</p></article></main></div></div>
