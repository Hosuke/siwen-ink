    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 夙夜在公</nav></header><main><article><h1>夙夜在公</h1><p>朝夕皆在公家，言奉公之勤。</p><p>[[夙夜在公]]，言早起夜臥皆在公門也。</p><p>《小星》首章云「肅肅宵征，夙夜在公」，言此人之勤於王事，晝夜不暇。夙，早也；夜，暮也。皆在公所，不遑寧處。</p><p>後世以「夙夜在公」為勤於職事之美稱，蓋本源於此。</p><p><strong>所出</strong>：《詩經 · 小星》 — https://zh.wikisource.org/wiki/詩經/小星</p></article></main></div></div>
