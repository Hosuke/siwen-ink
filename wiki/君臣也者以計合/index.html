    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 君臣也者以計合</nav></header><main><article><h1>君臣也者以計合</h1><p></p><p>本篇闡發君臣之際：「明主在上，則人臣去私心行公義；亂主在上，則人臣去公義行私心。」又云：「君臣也者，以計合者也。至夫臨難必死，盡智竭力，為法為之。」臣之情，害身無利；君之情，害國無親。害身而利國者臣弗為，害國而利臣者君不行。先王明賞以勸之，嚴刑以威之，賞刑明則民盡死，兵強主尊。此君臣以法相維之道也。</p><p>  <strong>所出</strong>：《韓非子 · 飾邪》 — https://zh.wikisource.org/wiki/韓非子/飾邪</p></article></main></div></div>
