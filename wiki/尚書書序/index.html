    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 尚書書序</nav></header><main><article><h1>尚書書序</h1><p>尚書各篇之序，記其作者與作意，述上起堯舜、下訖秦穆之史。</p><p>《尚書書序》者，百篇之序也。其文撮述尚書各篇之所以作，詳記作者之事跡與作意。</p><p>昔堯禪舜，湯伐桀，武王伐紂，周公相成王，一一有其制作。書序歷述其事，明乎聖王因時而立言、觀政而命篇之旨。</p><p>其序上起帝堯讓位，下終秦穆公殽之戰，述歷代興衰之跡，立言垂戒之意可知也。</p><p><strong>所出</strong>：《尚書 · 書序》 — https://zh.wikisource.org/wiki/尚書/書序</p></article></main></div></div>
