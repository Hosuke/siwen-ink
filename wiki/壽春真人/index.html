    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 壽春真人</nav></header><main><article><h1>壽春真人</h1><p>宋神宗、高宗迭封梅福為壽春真人、壽春吏隱真人。</p><p>宋神宗元豐五年七月敕：梅福在漢之際，以孤遠極言天下之事，其志壯哉。晚而家居，讀書養性，卒於遺化高蹈，世傳為仙。今大江之西，實存廟像，禱祠輒應。封壽春真人。</p><p>高宗紹興二年閒四月敕：洪州豐城縣大江北岸梅福昇仙壇。壽春真人，正諫不用，高名獨存，憫漢室之不綱，去昊市而莫返。茲特益以美稱，可封壽春吏隱真人。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 14》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/14</p></article></main></div></div>
