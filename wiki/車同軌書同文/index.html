    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 車同軌書同文</nav></header><main><article><h1>車同軌書同文</h1><p>秦始皇并天下，定一法度，車同軌，書同文字。</p><p>分天下以為三十六郡。一法度衡石丈尺。車同軌。書同文字。地東至海暨朝鮮，西至臨洮、羌中，南至北向戶，北據河為塞，并陰山至遼東。</p><p><strong>所出</strong>：《史記 · 卷006》 — https://zh.wikisource.org/wiki/史記/卷006</p><hr><p>齊桓公霸諸侯，一匡天下。此周道之行，車同軌書同文之漸也。蓋天下统一，則軌文同制，雖未及秦世，而其端已兆於齊桓之霸也。</p><p>  <strong>所出</strong>：《史記 · 卷032》 — https://zh.wikisource.org/wiki/史記/卷032</p></article></main></div></div>
