    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 震驚百里</nav></header><main><article><h1>震驚百里</h1><p>威嚴一震，遐邇咸服。</p><p>震驚百里，言電威所及，遠近莫不震動也。</p><p>彖曰：「震驚百里，驚遠而懼邇也。出可以守宗廟社稷，以為祭主也。」電之威動百里，近者聞而懼，遠者聽而畏。唯聖人在上，雖震百里而不喪匕鬯，乃能主祭宗廟，守保社稷，此震之所以亨也。</p><p><strong>所出</strong>：《周易 · 震》 — https://zh.wikisource.org/wiki/周易/震</p></article></main></div></div>
