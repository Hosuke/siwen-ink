    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 人臣三者</nav></header><main><article><h1>人臣三者</h1><p>人臣竊權之三資，曰名譽請謁、背法專制、假忠信。</p><p>人臣者，非名譽請謁無以進取，非背法專制無以為威，非假於忠信無以不禁。三者，惛主壞法之資也。韓非以為，人臣之所以能侵權者，恃此三者而已。名譽所以飾賢，請謁所以通達，背法所以擅權，假忠信所以欺世。君主任此三者而不察，則法度廢而姦臣行。</p><p><strong>所出</strong>：《韓非子 · 南面》 — https://zh.wikisource.org/wiki/韓非子/南面</p></article></main></div></div>
