    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 亨人</nav></header><main><article><h1>亨人</h1><p>下士四人，掌共鼎鑊水火之齊</p><p>亨人，下士四人；府一人，史二人，胥五人，徒五十人。</p><p>掌共鼎鑊，以給水火之齊。職外、內饔之爨亨煮，辨膳羞之物。</p><p>祭祀，共大羹、铏羹；賓客亦如之。</p><p><strong>所出</strong>：《周禮 · 天官冢宰》 — https://zh.wikisource.org/wiki/周禮/天官冢宰</p></article></main></div></div>
