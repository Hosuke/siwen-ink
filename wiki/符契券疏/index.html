    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 符契券疏</nav></header><main><article><h1>符契券疏</h1><p>符契券疏，書記之一體，掌朝市徵信之書。</p><p>書記廣大，朝市徵信，則有[[符契券疏]]。</p><p>符者，孚也。徵召防偽，事資中孚。三代玉瑞，漢世金竹，末代從省，易以書翰矣。契者，結也。上古純質，結繩執契，今羌胡徵數，負販記緡，其遺風歟！券者，束也。明白約束，以備情偽，字形半分，故周稱判書。古有鐵券，以堅信誓，[[王褒髯奴]]，則券之楷也。疏者，布也。布置物類，撮題近意，故小券短書，號為疏也。</p><p><strong>所出</strong>：《文心雕龍 · 書記》 — https://zh.wikisource.org/wiki/文心雕龍/書記</p></article></main></div></div>
