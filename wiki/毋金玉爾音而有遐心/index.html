    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 毋金玉爾音而有遐心</nav></header><main><article><h1>毋金玉爾音而有遐心</h1><p>戒賢者勿以音訊為貴而懷疏遠之心。</p><p>「毋金玉爾音，而有遐心」，詩《白駒》末章句。言賢者將去，主人戒之：汝之音書勿自矜貴，亦勿懷疏遠之心而去也。蓋留賢不得，則望其音問常通，勿以金玉難得而自珍惜，是詩人戀賢之至也。</p><p><strong>所出</strong>：《詩經 · 白駒》 — https://zh.wikisource.org/wiki/詩經/白駒</p></article></main></div></div>
