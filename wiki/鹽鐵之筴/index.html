    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鹽鐵之筴</nav></header><main><article><h1>鹽鐵之筴</h1><p>以鹽鐵之利立軌官，不斂於民而國用足。</p><p>桓公欲立軌官，管子以鹽鐵之筴對之。布黃金以貲金，準貧富以布幣，龍夏之地出金，周岐至崢丘、梁渭陽瑣之牛馬，皆可市易。鹽鐵撫軌，穀一廩十，君常操九，而民衣食以繇，此管子理財之要術也。</p><p><strong>所出</strong>：《管子 · 第74篇山國軌》 — https://zh.wikisource.org/wiki/管子/第74篇山國軌</p></article></main></div></div>
