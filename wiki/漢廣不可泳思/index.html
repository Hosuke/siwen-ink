    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 漢廣不可泳思</nav></header><main><article><h1>漢廣不可泳思</h1><p>江漢之廣，非人之所泳，言德化之遍及，而私欲之不可遂。</p><p>漢之廣矣，不可泳以渡；江之永矣，不可方以濟。[[滔滔江漢]]以為溝，喻文王之道被於南國，美化行乎江漢之域。然而人情所欲，非[[德教者黼黻之祭服]]之所能強，故終不可以犯禮而求。[[韓詩敘]]云「說人也」，蓋說此求而不可得之情耳。</p><p><strong>所出</strong>：《詩經 · 漢廣》 — https://zh.wikisource.org/wiki/詩經/漢廣</p></article></main></div></div>
