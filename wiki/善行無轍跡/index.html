    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 善行無轍跡</nav></header><main><article><h1>善行無轍跡</h1><p>善行者不知所行之迹，蓋自然而然，功成不居。</p><p>善行者無轍跡。言善行者之行為天然而然，不加作為，及其成事，功不居而迹不見。《老子》此章假五事以明道之用：行者無迹，言者無瑕，數者不用策，閉者無鍵，結者無繩。夫無迹者，非故意滅迹也，自然而然，不見可欲，萬物自遂者也。唯其無迹，是以不可執迹而求之；唯其不言，是以無瑕可指；唯其不用，是以物自備。此聖人之道所以輔萬物之自成而不宰之也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章二十七》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
