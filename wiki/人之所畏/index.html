    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 人之所畏不可不畏</nav></header><main><article><h1>人之所畏不可不畏</h1><p>世人所畏者，人亦當畏之。</p><p>人之所畏，不可不畏。畏天道、畏刑法、畏死亡者，人情之所同也。聖人與俗人同情，故其所畏者亦不敢忽。是以履薄冰、臨深淵，常存戒懼，此非怯懦，乃知天命之可畏、人事之當慎也。</p><p><strong>所出</strong>：《老子河上公章句 · 異俗》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
