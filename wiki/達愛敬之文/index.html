    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 達愛敬之文</nav></header><main><article><h1>達愛敬之文</h1><p>禮達乎愛敬之美，乃所以成行義之善。</p><p>禮者、斷長續短，損有餘，益不足，達愛敬之文，而滋成行義之美者也。</p><p><strong>所出</strong>：《荀子 · 禮論篇》 — https://zh.wikisource.org/wiki/荀子/禮論篇</p></article></main></div></div>
