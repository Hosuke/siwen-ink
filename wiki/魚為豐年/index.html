    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 魚為豐年</nav></header><main><article><h1>魚為豐年</h1><p>夢見魚象，古人占之以為年歲豐熟之兆。</p><p>夢魚為祥，古之占辭也。《無羊》云「眾維魚矣，實維豐年」，言夢見魚多，乃歲豐之象。蓋魚者，水族蕃殖，餘饒之兆；歲收豐稔，則民有餘魚。《詩經》鄭玄箋云：「魚者，庶人之所以養也，夢得魚則歲孰也。」是夢魚象歲熟，非偶然也。</p><p><strong>所出</strong>：《詩經 · 無羊》 — https://zh.wikisource.org/wiki/詩經/無羊</p></article></main></div></div>
