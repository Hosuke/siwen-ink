    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 毋教猱升木</nav></header><main><article><h1>毋教猱升木</h1><p>不善之人，不待教而自為姦。</p><p>猱之性本善升木，不待教而自能為之。若小人本無善良之質者，亦不待教而能作姦犯科，乃復教之，是益其能以資其惡也。是以君子務去其本惡，而不當授之以術。</p><p><strong>所出</strong>：《詩經 · 角弓》 — https://zh.wikisource.org/wiki/詩經/角弓</p></article></main></div></div>
