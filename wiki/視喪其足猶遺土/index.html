    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 視喪其足猶遺土</nav></header><main><article><h1>視喪其足猶遺土</h1><p>王駘忘其兀足，如遺土塊然，不以形損累心。</p><p>仲尼論王駘之用心曰：「物視其所一而不見其所喪，視喪其足，猶遺土也。」言王駘忘其兀足，若視土塊之遺，漠然不以為意。</p><p><strong>所出</strong>：《莊子 · 德充符》 — https://zh.wikisource.org/wiki/莊子/德充符</p></article></main></div></div>
