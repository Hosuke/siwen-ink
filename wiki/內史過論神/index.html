    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 內史過論神</nav></header><main><article><h1>內史過論神</h1><p>國家將興則神降以福，將亡則神降以禍</p><p>內史過述神降之義以對惠王，曰：「國之將興，其君齊明、衷正、精潔、惠和，其德足以昭其馨香，其惠足以同其民人，神饗而民聽；國之將亡，其君貪冒、辟邪、淫佚、荒怠、麤穢、暴虐，其政腥臊，馨香不登，百姓攜貳，民神怨痛，明神亦往而降之禍。」又言神壹不遠徙遷，若由是觀之，丹朱之神也。末戒以精意享祀之禮，兼及不親於民而求用者必為民違之理。</p><p><strong>所出</strong>：《國語 · 卷01》 — https://zh.wikisource.org/wiki/國語/卷01</p></article></main></div></div>
