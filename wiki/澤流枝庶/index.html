    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 澤流枝庶</nav></header><main><article><h1>澤流枝庶</h1><p>功德澤及子孫，恩蔭廣被。</p><p>太史公讀列封至便侯，歎曰：長沙王者，著令甲，稱其忠焉。昔高祖定天下，功臣非同姓而王者八國。至孝惠時，唯獨長江全，禪五世，以無嗣絕。然其澤流枝庶，毋功而侯者數人。蓋言功德之行，能及其後嗣；恩澤所潤，下及旁支也。</p><p><strong>所出</strong>：《史記 · 惠景閒矦者年表》 — https://zh.wikisource.org/wiki/史記/惠景閒矦者年表</p></article></main></div></div>
