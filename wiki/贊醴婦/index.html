    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 贊醴婦</nav></header><main><article><h1>贊醴婦</h1><p>昏禮既見舅姑，贊者醴婦，婦祭脯醢以成禮。</p><p>質明，贊見婦於舅姑。婦執笲、棗、栗、段脩以見。贊醴婦，婦祭脯醢；祭醴，成婦禮也。</p><p><strong>所出</strong>：《禮記 · 昏義》 — https://zh.wikisource.org/wiki/禮記/昏義</p></article></main></div></div>
