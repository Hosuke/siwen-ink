    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 辭達而已矣</nav></header><main><article><h1>辭達而已矣</h1><p>謂文辭以達意為極，不貴繁縟。</p><p>子曰：「辭，達而已矣！」</p><p>辭之為用，達意而已。意既達矣，繁與簡皆非所論也。聖人抑末飾之文，歸諸質實，其辭令之要乎。</p><p><strong>所出</strong>：《論語 · 衞靈公第十五》 — https://zh.wikisource.org/wiki/論語/衞靈公第十五</p></article></main></div></div>
