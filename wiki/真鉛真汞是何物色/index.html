    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 真鉛真汞是何物色</nav></header><main><article><h1>真鉛真汞是何物色</h1><p>丹經皆言日魂月魄，而不直說真鉛真汞是何物色，學者當悟。</p><p>[[悟真篇]]序言：「惟金丹一法，閱盡羣經及諸家歌詩論契，皆云日魂月魄、庚虎甲龍、水銀朱砂、白金黑錫、坎男離女，能成金液還丹，終不言真鉛真汞是何物色，不說火候法度、溫養指歸。」僕得真傳後，乃直指其物，云：「時人要識真鉛汞，不是凡砂及水銀。」</p><p><strong>所出</strong>：《悟真篇》 — https://zh.wikisource.org/wiki/悟真篇</p></article></main></div></div>
