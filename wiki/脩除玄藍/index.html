    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 脩除玄藍</nav></header><main><article><h1>脩除玄藍</h1><p>滌除心鏡，無纖毫之瑕。</p><p>脩除玄藍者，洗心之謂也。帛書本云：「脩除玄藍能毋有疵乎。」言人能脩治玄妙之心鏡，滌除一切染污，使無纖毫之瑕疵，則心體清明，與道合一。通行本作「修除玄覽」，義同。藍、覽、監，三字古通，皆指心鏡。疵者，瑕也。玄藍者，心之玄微，如鏡之照物，待其明澈，乃能觀道。此言脩煉之士，必先掃滌心地，無一毫人欲之蔽，方可入道。</p><p><strong>所出</strong>：《老子 (帛書本) · 章十》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
