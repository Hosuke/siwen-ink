    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 早服</nav></header><main><article><h1>早服</h1><p>行嗇宜早，早則積德深厚而無不剋也。</p><p>夫為嗇，是謂早服。</p><p>河上公注云：「早，先也。服，得也。言為嗇者，先自得，得無極也。」又云：「言先嗇為德，嗇之為，己有德而無所不剋。」</p><p>早服者，未亂即備，未弱即養，不待勢窮力竭而始圖之。譬如根未枯而先培，蒂未搖而先固。此聖人之所以全其國、固其民者也。與[[見微知萌]]義相發明。</p><p><strong>所出</strong>：《老子河上公章句 · 守道》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
