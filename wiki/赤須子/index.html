    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 赤須子</nav></header><main><article><h1>赤須子</h1><p>秦穆公主魚吏，數言災害水旱，張君房從受業，長好食松實天門冬石脂，齒落更生髮白還黑。</p><p>赤須子者，鄧中傳世見之，雲秦穆公主魚吏也。數言鄧界災害水旱，十不失一。張君房迎面師之，從受業。以長好食松實、天門冬、石脂，齒落更生，髮白還黑，服霞絕粒。</p><p>後住昊山下十餘年，莫知所之。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 3》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/3</p></article></main></div></div>
