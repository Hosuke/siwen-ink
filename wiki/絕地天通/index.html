    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 絕地天通</nav></header><main><article><h1>絕地天通</h1><p>舜令禹征有苗，修文教以來遠人，不以武力為先。</p><p>舜時，有苗弗率，舜乃脩文教，敷文德，班瑞，前徒乃攻。舜執有苗之罪，弗加殺而流之，放之象祠。天下咸畏有苗之誅。</p><p><strong>所出</strong>：《史記 · 卷002》 — https://zh.wikisource.org/wiki/史記/卷002</p></article></main></div></div>
