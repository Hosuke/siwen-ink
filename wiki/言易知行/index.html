    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 言易知行</nav></header><main><article><h1>言易知行</h1><p>至言至易知亦至易行，人弗能知行之耳。</p><p>吾所言者，無他高遠也。甚易知，甚易行。而天下莫之能知，莫之能行。</p><p>道之出口，淡乎無味，而理之在人，易知易從。聖人患天下之民不能知不能行，非道之不易知不易行也。夫物之迷者，必眩於物；民之蔽者，必惑於名。故至言不加，而民彌疑；至道不顯，而世彌遠。</p><p>是以聖人云：吾言甚易知，甚易行。而人莫之能知，莫之能行，非言與行則然，人之無知使然也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第三十五章 懷玉》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
