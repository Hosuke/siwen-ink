    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 寶玉題之以石</nav></header><main><article><h1>寶玉題之以石</h1><p>眞實之寶被誤指為頑石，比賢才被誣為誑惑。</p><p>和氏抱其璞而哭於楚山之下，三日三夜，淚盡而繼之以血。王聞之，使人問其故，曰：「天下之刖者多矣，子奚哭之悲也？」和曰：「吾非悲刖也，悲夫寶玉而題之以石，貞士而名之以誑，此吾所以悲也。」</p><p>寶玉題之以石者，謂眞美之物被誤認醜惡也；貞士名之以誑者，謂忠信之人被誣為欺誕也。和氏之泣，非為刖足，為道之不行也。珠玉人主之所急，猶且見疑若是，況法術之士以其道干時君乎？此忠臣之所以無辜而被罪也。</p><p><strong>所出</strong>：《韓非子 · 和氏》 — https://zh.wikisource.org/wiki/韓非子/和氏</p></article></main></div></div>
