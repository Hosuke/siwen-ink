    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 偃月鑪</nav></header><main><article><h1>偃月鑪</h1><p>偃月鑪，丹房要器，取太陰之象，以煉真汞。</p><p>[[悟真篇]]有《偃月鑪圖》，圖說云：「鑪面周圍約一尺二寸，明心，橫有一尺，立唇，環匝二寸，唇厚二寸。鑪口偃開鍋釜，又如仰月狀，故名偃月鑪也。張隨注云：又名威光鼎也。」詩云：「休泥丹竈費工夫，煉藥須尋偃月鑪。自有天然真火育，何須柴炭及吹噓。」</p><p><strong>所出</strong>：《悟真篇》 — https://zh.wikisource.org/wiki/悟真篇</p></article></main></div></div>
