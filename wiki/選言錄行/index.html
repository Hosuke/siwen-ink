    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 選言錄行</nav></header><main><article><h1>選言錄行</h1><p>誄之體制，選取美言，紀錄德行，兼取傳記之敘與頌美之辭。</p><p>詳夫誄之為制，蓋選言錄行，傳體而頌文，榮始而哀終。論其人也，曖乎若可覿；道其哀也，淒焉如可傷。此其旨也。</p><p>潘岳構意，專師孝山，巧於序悲，易入新切，所以隔代相望，能徵厥聲者也。</p><p><strong>所出</strong>：《文心雕龍 · 誄碑》 — https://zh.wikisource.org/wiki/文心雕龍/誄碑</p></article></main></div></div>
