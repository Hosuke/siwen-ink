    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 搏攫之獸用齒角爪牙</nav></header><main><article><h1>搏攫之獸用齒角爪牙</h1><p>搏攫之獸用齒角爪牙，必託於卑微隱蔽，乃所以成勝。</p><p>諸搏攫抵噬之獸，其用齒角爪牙也，必託於卑微隱蔽，此所以成勝。</p><p><strong>所出</strong>：《呂氏春秋 · 卷八》 — https://zh.wikisource.org/wiki/呂氏春秋/卷八</p></article></main></div></div>
