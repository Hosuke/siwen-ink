    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 中國日、卑國月、夷狄時</nav></header><main><article><h1>中國日、卑國月、夷狄時</h1><p>記時之辭，因邦之尊卑而異。</p><p>莒人滅繒。非滅也。中國日，卑國月，夷狄時。繒、中國也，而時，非滅也。</p><p>《春秋》記事，記日者謹之，記時者略之。中國諸侯，禮義所繫，故大事必謹其日；附庸小國，視之稍殺，故惟謹其月；若夷狄猾夏，則直以時書之而已，蓋不足記其日與月也。此亦《春秋》華夷之辨，內諸夏而外夷狄者也。</p><p><strong>所出</strong>：《春秋穀梁傳 · 襄公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/襄公</p></article></main></div></div>
