    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 輕則失本躁則失君</nav></header><main><article><h1>輕則失本躁則失君</h1><p>輕躁者失其根本與主宰</p><p>此章之結語也。上文既言重為輕根、靜為躁君，終以「輕則失本，躁則失君」二句，示人以輕躁之害。輕與躁，非一事也，而其失均歸於喪其所本與其所君。夫輕者本之所搖，躁者君之所失，萬乘之主不以身輕天下則本固，不以躁妄動則君安。一輕一躁，本與君皆失之，治亂之機在是矣。</p><p><strong>所出</strong>：《道德經 (王弼本) · 二十六章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
