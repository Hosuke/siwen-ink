    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 四民之業</nav></header><main><article><h1>四民之業</h1><p>農虞工商，四者並興，此寧有政教發徵期會哉？人各任其能竭其力。</p><p>夫山西饒材、竹、穀、纑、旄、玉石；山東多魚、鹽、漆、絲、聲色；江南出枏、梓、薑、桂、金、錫、連、丹沙、犀、瑁、珠璣、齒革；龍門、碣石北多馬、牛、羊、旃裘、筋角；銅、鐵則千里往往山出棋置。此其大較也，皆中國人民所喜好謠俗被服飲食奉生送死之具也。故待農而食之，虞而出之，工而成之，商而通之。此寧有政教發徵期會哉？人各任其能，竭其力，以得所欲。</p><p><strong>所出</strong>：《史記 · 卷129》 — https://zh.wikisource.org/wiki/史記/卷129</p></article></main></div></div>
