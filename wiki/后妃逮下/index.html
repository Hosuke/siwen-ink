    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 后妃逮下</nav></header><main><article><h1>后妃逮下</h1><p>后妃逮下，言能逮下而無嫉妒之心焉。</p><p>后妃逮下者，〈詩序〉所以釋〈樛木〉之旨也。言后妃之德，能下逮於眾妾而無嫉妒之心。</p><p>夫木之上竦者高，下垂者逮。葛藟以纍、荒、縈而附之，因其下垂而得庇焉。喻君子在下者有德，而上之人不以勢位加嫉，逮之使附，扶之使成。</p><p>綏以安之，將以扶之，成以全之。福履之來，自逮下者始也。</p><p><strong>所出</strong>：《詩經 · 樛木》 — https://zh.wikisource.org/wiki/詩經/樛木</p></article></main></div></div>
