    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 朝夕納誨</nav></header><main><article><h1>朝夕納誨</h1><p>臣朝夕進諫，以正其君之德。</p><p>王命傅說「朝夕納誨，以輔臺德」。朝夕者，無時不然之謂。納誨者，納其善言于君。言臣之事君，不可以暫而不可以久，必[[啟沃朕心|朝夕]]相繼，諫而行之，乃可以輔其德。此[[臣作股肱耳目]]之旨，而所以盡臣道于[[若金舟楫霖雨|若金舟楫霖雨]]之外者也。</p><p><strong>所出</strong>：《尚書 · 說命上》 — https://zh.wikisource.org/wiki/尚書/說命上
===終::</p></article></main></div></div>
