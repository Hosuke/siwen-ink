    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 虎牢之要塞</nav></header><main><article><h1>虎牢之要塞</h1><p>晉城虎牢以偪鄭，鄭人乃成。</p><p>元年。晉伐鄭。鄭成公疾。子駟請息肩於晉。公曰。楚君以鄭故。親集矢於其目。非異人任。寡人也。若背之。是棄力與言。其誰暱我。</p><p>二年。晉師侵鄭。孟獻子請城虎牢以偪鄭。知武子善之。冬。復會于戚。遂城虎牢。鄭人乃成。</p><p>夫虎牢者。鄭之襟要。晉城之而鄭服。此孙子所謂「知彼知己」者與。城成而鄭不敢輕犯晉。諸侯之師賴是以安。君子謂知武子能用善謀。以一城之役。收不戰之功。可謂知所輕重矣。</p><p><strong>所出</strong>：《春秋左氏傳 · 襄公》 — https://zh.wikisource.org/wiki/春秋左氏傳/襄公</p></article></main></div></div>
