    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不以智累心，不以私累己</nav></header><main><article><h1>不以智累心，不以私累己</h1><p>聖人治世，去私智，用法度，使心無結怨，口無煩言。</p><p>不以智累心，不以私累己。</p><p>智心累則術不行，私欲盛則法必壞。[[不吹毛而求小疵]]，不洗垢而察難知；不引繩之外，不推繩之內；不急法之外，不緩法之內。守成理，因自然。</p><p>去智去私，乃能寄治亂於法術，託是非於賞罰。[[虛無恬淡]]者，養心之本也。</p><p><strong>所出</strong>：《韓非子 · 大體》 — https://zh.wikisource.org/wiki/韓非子/大體</p></article></main></div></div>
