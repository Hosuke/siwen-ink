    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 高山仰止</nav></header><main><article><h1>高山仰止</h1><p></p><p>《車舝》第四章-{zh-hant:「陟彼高岡，析其柞薪。析其柞薪，其葉湑兮。鮮我覯爾，我心寫兮。」}-，第五章-{zh-hant:「高山仰止，景行行止。四牡騑騑，六轡如琴。覯爾新昏，以慰我心。」}-。-{zh-hant:「高山仰止」}-，仰望高山也；-{zh-hant:「景行行止」}-，景行，大道也，行於正道而不越也。後人合用二語，以喻慕德嚮善、仰之彌高之意。</p><p>  <strong>所出</strong>：《詩經 · 車舝》 — https://zh.wikisource.org/wiki/詩經/車舝</p></article></main></div></div>
