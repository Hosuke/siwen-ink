    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 滇王離難降漢</nav></header><main><article><h1>滇王離難降漢</h1><p>述漢發巴蜀兵擊滅勞浸靡莫，滇王舉國降，置益州郡，賜王印之事</p><p>上使王然于以越破及誅南夷兵威風喻滇王入朝。滇王者，其眾數萬人，其旁東北有勞寢、靡莫，皆同姓相扶，未肯聽。勞寢、靡莫數侵犯使者吏卒。</p><p>元封二年，天子發巴蜀兵擊滅勞寢、靡莫，以兵臨滇。滇王始首善，以故弗誅。滇王離難西南夷，舉國降，請置吏入朝。於是以為益州郡，賜滇王王印，復長其民。</p><p>西南夷君長以百數，獨夜郎、滇受王印。滇小邑，最寵焉。</p><p><strong>所出</strong>：《史記 · 卷116》 — https://zh.wikisource.org/wiki/史記/卷116</p></article></main></div></div>
