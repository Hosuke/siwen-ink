    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 前後相隨</nav></header><main><article><h1>前後相隨</h1><p>前與後相隨而行，先後不可定。</p><p>前與後相隨而不離，有前而後見，有後而前形。先後之名未定，而相隨以成。此萬物之序，自然之節，聖人觀此而處[[無為之事]]，不先物而動也。</p><p><strong>所出</strong>：《老子河上公章句 · 養身》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
