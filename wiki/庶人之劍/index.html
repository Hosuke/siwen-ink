    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 庶人之劍</nav></header><main><article><h1>庶人之劍</h1><p>匹夫之勇，上斬頸領，下決肝肺，無益國事。</p><p>莊子論第三等之劍為庶人之劍。</p><p>蓬頭突鬢垂冠，曼胡之纓，短後之衣，瞋目而語難；相擊於前，上斬頸領，下決肝肺。此劍無異於鬥雞，一旦命已絕矣，無所用於國事。</p><p>莊子以此諷趙文王好劍之失，云：「大王有天子之位而好庶人之劍，臣竊為大王薄之。」以匹夫之勇與治天下之道對言，明人主當尚德化而賤血氣之私。</p><p><strong>所出</strong>：《莊子 · 說劍》 — https://zh.wikisource.org/wiki/莊子/說劍</p></article></main></div></div>
