    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 仲冬冰</nav></header><main><article><h1>仲冬冰</h1><p>鼎中形似仲冬之冰，瓓玕吐鐘乳，喻凝結之象。</p><p>形似仲冬冰兮，瓓玕吐鐘乳。崔嵬而雜廁兮，交積相支柱。</p><p>瓓玕、鐘乳，皆石之凝結者，喻鼎中藥物精氣之交融凝聚。崔嵬雜廁，交相支拄，喻四象五行各安其位，凝而不散之象也。</p><p><strong>所出</strong>：《周易參同契 · 32章》 — https://zh.wikisource.org/wiki/周易參同契/32章</p></article></main></div></div>
