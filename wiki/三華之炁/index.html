    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三華之炁</nav></header><main><article><h1>三華之炁</h1><p>三華之精華，充罩兆頂，結作一神。</p><p>三華之炁者，三華精華之氣也。上清大洞第二十五章行道，真思[[日中司命接生君]]真炁，三華之色，罩於頂上，乃默呪。[[清齋]]既致，次思此炁從兆[[泥丸中]]入，口吸神雲，咽津三過，結作一神，狀如太陽星。[[玉華保真]]，[[四大正明]]充布，皆此炁充布之功也。[[玉符]]佩之，炁乃凝結。</p><p><strong>所出</strong>：《上清大洞真經 · 25章》 — https://zh.wikisource.org/wiki/上清大洞真經/25章</p></article></main></div></div>
