    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 衣服無常</nav></header><main><article><h1>衣服無常</h1><p>古者衣服有常所以齊民，傷今不然</p><p>周人刺衣服無常也。</p><p>語出《詩經·小雅·都人士》毛詩序。古者長民，衣服不貳，從容有常，以齊其民，則民德歸壹。</p><p>蓋上古之世，衣服所以辨尊卑、定民志，非為美觀而已。貴賤有等，衣冠有別，民知其所從事，不敢僭越，故風俗純一，民德歸於一致。周衰之際，衣服屢變，尊卑混淆，詩人傷之，以為治道之失本於此也。</p><p><strong>所出</strong>：《詩經 · 都人士》 — https://zh.wikisource.org/wiki/詩經/都人士</p></article></main></div></div>
