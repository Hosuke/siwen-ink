    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天人合發</nav></header><main><article><h1>天人合發</h1><p>天時人事合而後萬變有基。</p><p>天地合德之機，在於亥末子初。太陽正躐北方，人身之氣到尾閭關，內外相感，陰陽交會。此時天根月窟，往來無朕；一陽來複，造化流行。神仙於此際而採藥，則內真外應，若合符節，是為天人合發之機。陳泥丸云：「每當天地交合時，盜取陰陽造化機。」陰符經云：「食其時，百骸埋；盜其機，萬化安。」人若知此，當中夜靜坐，凝神聚氣，收視返聽，閉塞其兌，一念不生。天地之陽至，則急採之；未至，則虛以待之，不敢為之先。</p><p><strong>所出</strong>：《性命圭旨 · 利集》 — https://zh.wikisource.org/wiki/性命圭旨/利集</p></article></main></div></div>
