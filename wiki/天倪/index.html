    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天倪</nav></header><main><article><h1>天倪</h1><p>天然之分際，言與不言皆齊於道也。</p><p>長梧子曰：「何謂和之以天倪？曰：是不是，然不然。」</p><p>天倪者，自然之分際、造化之均衡也。世人以成心分別是非，而是非迭興，無有已時；和之以天倪者，順物之自然而無容心焉。是不是，然不然——是者視之為非可也，然者視之為不然可也。化聲之相待，若其不相待，和以天倪，因以曼衍，所以窮年也。忘年忘義，振於无竟，故寓諸无竟。[[天均]]者，天倪之實也；[[天府]]者，天倪之所存也。</p><p><strong>所出</strong>：《莊子 · 齊物論》 — https://zh.wikisource.org/wiki/莊子/齊物論</p></article></main></div></div>
