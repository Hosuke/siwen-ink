    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 之子于歸言秣其馬</nav></header><main><article><h1>之子于歸言秣其馬</h1><p>刈薪秣馬以待其歸，喻慕悅之切而終不可得。</p><p>[[昏禮者禮之本]]而[[男女之別國之大節]]，昏姻之禮不可犯。然此詩男子見[[漢有遊女不可求]]之遊女，心悅之，切於迎致，故[[薪刈其楚]]以[[之子于歸]]，言秣其馬，言秣其駒，以待其來嫁。[[韓詩敘]]所謂「說人也」，情欲慕悅之辭，而[[無犯]]之義即寓其中。</p><p><strong>所出</strong>：《詩經 · 漢廣》 — https://zh.wikisource.org/wiki/詩經/漢廣</p></article></main></div></div>
