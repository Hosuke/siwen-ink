    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 四帝行七月服</nav></header><main><article><h1>四帝行七月服</h1><p>晉宣景文武四帝行七月之喪服，以破二十五月之舊制，率天下以儉。</p><p>抱朴子論晉之宣帝、景帝、文帝、武帝四帝居親喪皆毀瘠逾制，不用王氏二十五月之禮而行七月之服。於時天下遭重哀者，咸以此四帝為法。抱朴子譏世人不知此高行之可慕，反虛誣以為不然，是為惑也。七月的服，儉於古禮，而毀瘠之情則過之，蓋哀出於心，不在日數之多寡云。</p><p><strong>所出</strong>：《抱朴子 · 卷26》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷26</p></article></main></div></div>
