    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 帝禹受命</nav></header><main><article><h1>帝禹受命</h1><p>禹受堯禪攝政十七年，平水土，功成受天錫玄圭，遂即天子位，國號夏。</p><p>堯崩，舜避堯之子於南河之南。天下諸侯朝覲者不之堯之子而之舜，皆以德稱之。舜崩，三年喪畢，禹辭辟舜之子商均於陽城，天下諸侯皆去而朝禹，禹遂即天子位，南面朝天下，國號曰夏，姓姒氏。</p><p><strong>所出</strong>：《史記 · 卷002》 — https://zh.wikisource.org/wiki/史記/卷002</p></article></main></div></div>
