    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 引事之謬</nav></header><main><article><h1>引事之謬</h1><p>引古失實，反成文章之瑕</p><p>引事之弊，在乎失實。陳思曹植《報孔璋書》稱葛天氏之樂千人唱萬人和，聽者因以蔑《韶夏》。按葛天之歌，唱和僅三人而已。相如《上林》推三成萬，乃賦妄書，致斯謬也。</p><p>陸機《園葵詩》云「庇足同一智，生理合異端」。夫葵能衛足，事譏鮑莊；葛藟庇根，辭自樂豫；若譬葛為葵，則引事為謬；若謂庇勝衛，則改事失真。斯又不精之患。</p><p>曹仁之謬高唐，亦此類也。子建明練，士衡沈密，而不免於謬，又曷足以嘲哉！</p><p><strong>所出</strong>：《文心雕龍 · 事類》 — https://zh.wikisource.org/wiki/文心雕龍/事類</p></article></main></div></div>
