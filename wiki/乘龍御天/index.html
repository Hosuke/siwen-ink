    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 乘龍御天</nav></header><main><article><h1>乘龍御天</h1><p>聖人乘六龍之健，御天道之變，時行則行，時止則止。</p><p>彖曰：時乘六龍以御天。</p><p>上文已述大明終始之義。六龍者，六爻也，皆陽爻，皆以龍象之。初之潛，二之見，三之惕，四之躍，五之飛，上之亢，是為六龍。聖人者，乘此六龍，體天之道，御天之變，與時偕行而不失其正者也。天有六位，而聖人乘之，天道有變化，而聖人御之，其道一也。</p><p><strong>所出</strong>：《周易 · 乾》 — https://zh.wikisource.org/wiki/周易/乾</p></article></main></div></div>
