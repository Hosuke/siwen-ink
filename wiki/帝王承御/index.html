    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 帝王承御</nav></header><main><article><h1>帝王承御</h1><p>帝王承天之道以御四海者，千載常存。</p><p>[[帝王之道]]之論，他籍多有。此經以消息之理論之，云「帝王承御，千載常存」。</p><p>[[消息盈虛與百姓詘信]]之道，明於上此文曰：明王法[[消息盈虛與百姓詘信]]，察[[消息盈虛與百姓詘信]]之機，乘四時之運，循[[消息盈虛與百姓詘信]]之序，則可以和陰陽、調寒暑、育萬物，而天下永定。非[[消息盈虛與百姓詘信]]之外別有長存之術也。</p><p><strong>所出</strong>：《周易參同契 · 19章》 — https://zh.wikisource.org/wiki/周易參同契/19章</p></article></main></div></div>
