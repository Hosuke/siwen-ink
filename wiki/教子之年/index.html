    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 教子之年</nav></header><main><article><h1>教子之年</h1><p>因年施教，由自能食至冠，循序漸進</p><p>子能食食，教以右手。能言，男唯女俞。男鞶革，女鞶絲。</p><p>六年教之數與方名。七年男女不同席，不共食。八年出入門戶及即席飲食，必後長者，始教之讓。九年教之數日。</p><p>十年出就外傅，居宿於外，學書計，衣不帛襦褲，禮帥初，朝夕學幼儀，請肄簡諒。</p><p>十有三年學樂，誦《詩》，舞《勺》，成童舞《象》，學射御。</p><p>二十而冠，始學禮，可以衣裘帛，舞《大夏》，惇行孝弟，博學不教，內而不出。</p><p>三十而有室，始理男事。</p><p><strong>所出</strong>：《禮記 · 內則》 — https://zh.wikisource.org/wiki/禮記/內則</p></article></main></div></div>
