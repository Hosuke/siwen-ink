    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 清且漣猗</nav></header><main><article><h1>清且漣猗</h1><p>河水清澈，波紋自如，以喻君子之行當如水之清白。</p><p>清且漣猗，[[伐檀]]之首章句也。河水清泚，波紋呈現，言伐檀者置木河干，見流水之清澈自若。詩人以此起興，映襯在位者之不清。君子居高位，當如水之清，不雜濁污，不受浸潤，方為稱職。</p><p>三章各有遞進：清且漣、清且直、清且淪。漣者，波紋也；直者，水平如鏡也；淪者，細微波也。皆以水之德喻君子之行，示清白無瑕之意。</p><p><strong>所出</strong>：《詩經 · 伐檀》 — https://zh.wikisource.org/wiki/詩經/伐檀</p></article></main></div></div>
