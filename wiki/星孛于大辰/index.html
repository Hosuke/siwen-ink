    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 星孛于大辰</nav></header><main><article><h1>星孛于大辰</h1><p>孛星見于大辰，天象示異。</p><p>昭公十七年，冬，有星孛于大辰。</p><p>  傳曰：「一有一亡曰有。于大辰者，濫于大辰也。」星孛于大辰，天象之異，聖人謹而書之，以警人君也。</p><p>  <strong>所出</strong>：《春秋穀梁傳 · 昭公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/昭公</p></article></main></div></div>
