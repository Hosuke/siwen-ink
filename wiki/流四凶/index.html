    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 流四凶</nav></header><main><article><h1>流四凶</h1><p>舜賓四門，流四凶族於四裔，以御螭魅。</p><p>昔帝鴻氏有不才子，掩義隱賊，好行凶慝，天下謂之渾敦。少皞氏有不才子，毀信惡忠，崇飾惡言，天下謂之窮奇。顓頊氏有不才子，不可教訓，不知話言，天下謂之檮杌。此三族世憂之。至于堯世，未能去。緗雲氏有不才子，貪于飲食，冒于貨賄，天下謂之饕餮。天下惡之，比之三凶。堯賓於四門，乃流四凶族，遷于四裔，以御螭魅，於是四門辟，言毋凶人也。</p><p><strong>所出</strong>：《史記 · 卷001》 — https://zh.wikisource.org/wiki/史記/卷001</p></article></main></div></div>
