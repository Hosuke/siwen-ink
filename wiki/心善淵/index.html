    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 心善淵</nav></header><main><article><h1>心善淵</h1><p>上善之心若淵之湛，虛靜深藏而不可測也。</p><p>「心善淵」者，言上善之人用心若淵，湛默淵深，而無所不容也。水之在淵，靜而不擾，深而難測。聖人之心亦猶是焉，虛而能受，靜而能應，若虛舟之觸物，漠然無所忤。</p><p><strong>所出</strong>：《老子 (帛書本) · 章八》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
