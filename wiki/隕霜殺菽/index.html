    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 隕霜殺菽</nav></header><main><article><h1>隕霜殺菽</h1><p>隕霜殺菽不可以殺書，而以所殺之物為輕重之準。</p><p>定公元年冬十月，隕霜殺菽。穀梁子釋曰：「未可以殺而殺，舉重；可殺而不殺，舉輕。」其曰菽，舉重也。菽者百穀之一，隕霜殺之，是天災及民食也，然猶未若殺人為重，故以菽為重而書之。</p><p><strong>所出</strong>：《春秋穀梁傳 · 定公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/定公</p></article></main></div></div>
