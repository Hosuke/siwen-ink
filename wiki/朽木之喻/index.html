    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 朽木之喻</nav></header><main><article><h1>朽木之喻</h1><p>身中氣血根源已喪，譬如燼木，煙葉非不有而生气已亡。</p><p>如此，則不得上藥，不能救也。凡為道而不成，營生而得死者，其人非不有氣血也。然身中之所以為氣為血者，根源已喪，但餘其枝流也。譬猶入水之燼，火滅而煙不即息；既斷之木，柯葉猶生。二者非不有煙，非不有葉，而其所以為煙為葉者，已先亡矣。</p><p><strong>所出</strong>：《抱朴子 · 卷13》 — https://zh.wikisource.org/wiki/抱朴子/卷13</p></article></main></div></div>
