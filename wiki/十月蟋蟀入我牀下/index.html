    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 十月蟋蟀入我牀下</nav></header><main><article><h1>十月蟋蟀入我牀下</h1><p>歲暮天寒，蟋蟀入室，民事之艱也。</p><p>[[六月莎雞振羽]]，[[七月在野]]，[[八月在宇]]，[[九月在戶]]，[[十月蟋蟀入我牀下]]。由野而宇而戶而牀下，昆蟲之移避寒，亦以見民事之艱也。詩以[[穹窒熏鼠]]終之。</p><p><strong>所出</strong>：《詩經 · 七月》 — https://zh.wikisource.org/wiki/詩經/七月</p></article></main></div></div>
