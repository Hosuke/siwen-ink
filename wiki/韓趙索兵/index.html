    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 韓趙索兵</nav></header><main><article><h1>韓趙索兵</h1><p>兄弟之國不相從，怒而反；知者構怨而兩傷，待其自悟。</p><p>韓、趙相與爲難。韓子索兵於魏曰：「願借師以伐趙。」魏文侯曰：「寡人與趙兄弟，不可以從。」趙又索兵以攻韓，文侯曰：「寡人與韓兄弟，不敢從。」二國不得兵，怒而反。已及知文侯以構於己，乃皆朝魏。</p><p><strong>所出</strong>：《韓非子 · 說林下》 — https://zh.wikisource.org/wiki/韓非子/說林下</p></article></main></div></div>
