    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 拘繫之徒桎梏淺隘</nav></header><main><article><h1>拘繫之徒桎梏淺隘</h1><p>拘繫之徒輕奇賤異，不識文章之大用。</p><p>抱朴子痛論漢魏以來學風之蔽云：「漢魏以來，群言彌繁，然時無聖人，目其口藻，故不得騁驊騄之跡於千里之途，編近世之道於三坟之末也。拘繫之徒，桎梏淺隘之中，挈瓶訓詁之間，輕奇賤異，謂為不急。或雲小道不足觀，或雲廣博亂人思，而不識合錙銖可齊重於山陵，聚百十可以致數於億兆。」</p><p><strong>所出</strong>：《抱朴子 · 卷32》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷32</p></article></main></div></div>
