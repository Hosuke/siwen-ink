    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 戒卿士</nav></header><main><article><h1>戒卿士</h1><p>王戒卿士敬爾有官、亂爾有政，以佑乃辟</p><p>嗚呼！凡我有官君子，欽乃攸司，慎乃出令，令出惟行，弗惟反。其爾典常作之師，無以利口亂厥官。</p><p>嗚呼！三事暨大夫，敬爾有官，亂爾有政。以佑乃辟，永康兆民，萬邦惟無斁。</p><p><strong>所出</strong>：《尚書 · 周官》 — https://zh.wikisource.org/wiki/尚書/周官</p></article></main></div></div>
