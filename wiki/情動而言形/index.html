    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 情動而言形，理髮而文見</nav></header><main><article><h1>情動而言形，理髮而文見</h1><p>情志動則言辭生，義理髮則文章成，此內外相符之道。</p><p>夫情動而言形，理髮而文見，蓋沿隱以至顯、因內而符外者也。情志在內為隱，言辭在外為顯；義理蓄於中為隱，文章形於外為顯。由隱至顯，因內符外，此文章所以生也。然情動而後有言，言有庸俊之分；理髮而後成文，文有深淺之別。何也？才有庸俊，氣有剛柔，學有淺深，習有雅鄭，並情性所鑠，陶染所凝，是以筆區雲譎，文苑波詭，風格萬殊不可窮盡。</p><p><strong>所出</strong>：《文心雕龍 · 體性》 — https://zh.wikisource.org/wiki/文心雕龍/體性</p></article></main></div></div>
