    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 中央司命丈人君</nav></header><main><article><h1>中央司命丈人君</h1><p>主心房死戶之神仙，主命定年。</p><p>中央司命丈人君者，上清大洞三元紫精君道經第六所存思之要神也。名理明初，字玄度卿，常守兆絳宮心房之中、血孔之戶、死炁之門。口吐紫雲之炁，洞溢五藏之內，使兆心中得神真之炁，絳宮生五色之華。修奉之者，可度名南宮，福延七祖，禍散玄生，長生靈柯，七祖解脫。</p><p><strong>所出</strong>：《上清大洞真經 · 6章》 — https://zh.wikisource.org/wiki/上清大洞真經/6章</p></article></main></div></div>
