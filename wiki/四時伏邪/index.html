    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 四時伏邪</nav></header><main><article><h1>四時伏邪</h1><p>冬傷於寒，春必溫病；春傷於風，夏生飧泄；夏傷於暑，秋必痎瘧；秋傷於濕，冬生欬嗽。</p><p>語出 [[陰陽應象大論]]。此論四時不正之氣，伏藏體內，逾時而發之病機。</p><p>冬傷於寒，春必溫病；春傷於風，夏生飧泄；夏傷於暑，秋必痎瘧；秋傷於濕，冬生欬嗽。</p><p>蓋寒濕暑風，皆能伏藏人身之中，當令不發，過時乃作。是以養生者，必使四時之氣各得其正，不使伏邪有可乘之隙也。又言「重陰必陽，重陽必陰」，明陰陽消長之理，伏邪之說，由是而立。</p><p><strong>所出</strong>：《黃帝內經 · 素問第二卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第二卷</p></article></main></div></div>
