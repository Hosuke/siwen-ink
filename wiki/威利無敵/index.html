    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 威利無敵</nav></header><main><article><h1>威利無敵</h1><p>王者之威利必無敵，乃可以禁暴勸功。</p><p>[[王者之所藉以成也何？藉其威與其利。]]非強大則其威不威，其利不利。其威不威則不足以禁也，其利不利則不足以勸也，故賢主必使其威利無敵，故以禁則必止，以勸則必為。威利敵，而憂苦民、行可知者王；威利無敵，而以行不知者亡。小弱而不可知，則強大疑之矣。人之情不能愛其所疑，小弱而大不愛則無以存。故[[不可知之道，王者行之廢，強大行之危，小弱行之滅。]]</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十二》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十二</p></article></main></div></div>
