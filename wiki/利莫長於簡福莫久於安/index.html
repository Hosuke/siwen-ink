    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 利莫長於簡，福莫久於安</nav></header><main><article><h1>利莫長於簡，福莫久於安</h1><p>治國莫善於簡，致福莫久於安；法如朝露，純樸不散，則至治可期。</p><p>利莫長於簡，福莫久於安。</p><p>使匠石以千歲之壽操鈎，視規矩，舉繩墨，而正太山；使賁、育帶干將而齊萬民，雖盡力於巧，極盛於壽，太山不正，民不能齊。故曰：古之牧天下者，不使匠石極巧以敗太山之體，不使賁、育盡威以傷萬民之性。</p><p>至安之世，法如朝露，純樸不散，心無結怨，口無煩言。[[清靜為治|清靜之治，乃天下之至安也]]。[[約法可久|約法可久]]，此之謂與。</p><p><strong>所出</strong>：《韓非子 · 大體》 — https://zh.wikisource.org/wiki/韓非子/大體</p></article></main></div></div>
