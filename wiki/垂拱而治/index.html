    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 垂拱而治</nav></header><main><article><h1>垂拱而治</h1><p>聖君用法，守道不擾，身佚而天下治。</p><p>聖君守道要，處佚樂，馳騁弋獵，鍾鼓竽瑟，宮中之樂，無禁圉也。不思不慮，不憂不圖，利身體，便形軀，養壽命，垂拱而天下治。是故人主有能用其道者，不事心，不勞意，不動力，而土地自辟，囷倉自實。</p><p><strong>所出</strong>：《管子 · 第45篇任法》 — https://zh.wikisource.org/wiki/管子/第45篇任法</p></article></main></div></div>
