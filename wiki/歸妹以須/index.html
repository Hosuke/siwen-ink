    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 歸妹以須，反歸以娣</nav></header><main><article><h1>歸妹以須，反歸以娣</h1><p>以妾為正室而不當，反更以娣歸，是未當之甚。</p><p>六三：「歸妹以須，反歸以娣。」須者，待也；又為妾之賤者。欲居正室而不果，反以娣之卑下者出嫁。歸妹以須，未當也。位不中正，僭越之象。</p><p><strong>所出</strong>：《周易 · 歸妹》 — https://zh.wikisource.org/wiki/周易/歸妹</p></article></main></div></div>
