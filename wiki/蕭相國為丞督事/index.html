    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蕭相國為丞督事</nav></header><main><article><h1>蕭相國為丞督事</h1><p>沛公起兵，蕭何為丞，常督其事。</p><p>及高祖起為沛公，何常為丞督事。沛公至咸陽，諸將皆爭走金帛財物之府分之，何獨先入收秦丞相御史律令圖書藏之。夫他人趨利，蕭何則收圖書，此其志不在區區金帛也。漢王所以具知天下阸塞、戶口多少、彊弱之處、民所疾苦者，以何具得秦圖書也。</p><p><strong>所出</strong>：《史記 · 卷053》 — https://zh.wikisource.org/wiki/史記/卷053</p></article></main></div></div>
