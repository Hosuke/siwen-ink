    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 相壤定籍而民不移</nav></header><main><article><h1>相壤定籍而民不移</h1><p>辨地之上下以定賦稅，民乃安居不徙。</p><p>郡縣之壤有上、閒、下之別，相壤定籍而民不移。夫地有肥磽，則賦有重輕；上壤滿則補下壤之虛，章四時，守諸開闔。此均地之力、定民之方也。民視土地為根基，安土重遷，故必使之各安其分，乃可上下相保。</p><p><strong>所出</strong>：《管子 · 第69篇乘馬數》 — https://zh.wikisource.org/wiki/管子/第69篇乘馬數</p></article></main></div></div>
