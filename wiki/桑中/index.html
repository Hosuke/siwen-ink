    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 桑中</nav></header><main><article><h1>桑中</h1><p>詠密會之情，託采唐、麥、葑之地以思美人也。</p><p>《桑中》出於《詩經·衞風》。其詩以「采唐」「采麥」「采葑」起興，言所思之美人-{zh-cn:（孟姜、孟弋、孟庸）}-，期我乎桑中，要我乎上宮，送我乎淇之上矣。三章反覆，情辭宛轉，蓋寫世族淫亂、私相奔誘之風，以為刺焉。</p><p>詩序云：「衞之公室淫亂，男女相奔，至于世族在位，相竊妻妾，期於幽遠，政散民流，而不可止。」是詩之旨，正在諷衞俗之澆薄、禮法之廢弛也。</p><p><strong>所出</strong>：《詩經 · 桑中》 — https://zh.wikisource.org/wiki/詩經/桑中</p></article></main></div></div>
