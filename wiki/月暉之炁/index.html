    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 月暉之炁</nav></header><main><article><h1>月暉之炁</h1><p>月之精光，修真者存思以通神。</p><p>修真者思月暉之炁自泥丸中入，是為月之精光凝於上宮。乃口吸神雲，咽津三過，結作一神，狀如太陰星，下布絳官，入右膀，入玉莖中，入尾閭穴，上入第一椎，穿泥丸，入右目，頰腮內，入肩，入臂髓內，過入右手通真之戶。</p><p>月暉之炁者，月之光氣也。其色黃白清涼，罩於頂上，與日暉相對。修真者守此，則四運通明，三神固精，萬炁保鎮，與神長寧。</p><p><strong>所出</strong>：《上清大洞真經 · 26章》 — https://zh.wikisource.org/wiki/上清大洞真經/26章</p></article></main></div></div>
