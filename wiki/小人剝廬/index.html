    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 小人剝廬</nav></header><main><article><h1>小人剝廬</h1><p>小人剝盡上九一陽，則無所覆庇，終不可用。</p><p>《剝》上九：「小人剝廬。」</p><p>上九一陽為剝卦碩果，君子得之為輿以載民，小人則剝而去之也。廬者，舍也；無廬則無以庇風雨。</p><p>夫小人之於君子也，嫉其能而剝其德，去其人而奪其位。然而剝盡君子之後，小人自相魚肉，無以自立。剝廬者，非獨剝君子之廬，乃自剝其廬也。</p><p>象曰：「小人剝廬，終不可用也。」言小人不仁，剝人而自剝，終無所成，不可任用也。</p><p><strong>所出</strong>：《周易 · 剝》 — https://zh.wikisource.org/wiki/周易/剝</p></article></main></div></div>
