    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 真人在己莫問鄰</nav></header><main><article><h1>真人在己莫問鄰</h1><p>真人在己身中，無假外求。</p><p>真人者，真我之稱也。此心即道，此神即真，勿庸遠訪他人、旁求外物也。[[神仙不死]]之旨，亦云在我自有，何必問諸隣里哉。</p><p><strong>所出</strong>：《黃庭內景經 · 治生章第二十三》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/治生章第二十三</p></article></main></div></div>
