    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 貞吝悔亡</nav></header><main><article><h1>貞吝悔亡</h1><p>无咎本皆有咎防得其道故得无咎；吉无咎由吉故免，悔亡先悔而後亡。</p><p>凡言无咎者，本皆有咎者也，防得其道故得无咎。吉无咎者，本亦有咎由吉故得免。无咎吉者，先免於咎而後吉從之也。或亦處得其時，吉不待功，不犯於咎則吉也。或有罪自巳招无所怨咎亦曰无咎。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷10》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷10</p></article></main></div></div>
