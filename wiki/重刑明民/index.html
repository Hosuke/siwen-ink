    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 重刑明民</nav></header><main><article><h1>重刑明民</h1><p>重刑以明法制，則民知所趨而上得其利。</p><p>重刑明民，大制使人，則上利。法度昭明，輕重有等，則民曉然而知所避就，上操賞罰之柄而不失也。</p><p><strong>所出</strong>：《韓非子 · 飭令》 — https://zh.wikisource.org/wiki/韓非子/飭令</p></article></main></div></div>
