    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 漕渠</nav></header><main><article><h1>漕渠</h1><p>關東漕粟從渭上，迂遠艱難，乃穿渠以便漕運，兼得溉田之利。</p><p>漕渠者，鄭當時所言穿之渠也。鄭當時為大農，言曰：「異時關東漕粟從渭中上，度六月而罷，而漕水道九百餘里，時有難處。引渭穿渠起長安，并南山下，至河三百餘里，徑，易漕，度可令三月罷；而渠下民田萬餘頃，又可得以溉田：此損漕省卒，而益肥關中之地，得穀。」天子以為然，令徐伯表，悉發卒數萬人穿漕渠，三歲而通。通，以漕，大便利。其後漕稍多，而渠下之民頗得以溉田矣。</p><p><strong>所出</strong>：《史記 · 卷029》 — https://zh.wikisource.org/wiki/史記/卷029</p></article></main></div></div>
