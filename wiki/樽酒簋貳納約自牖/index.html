    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 樽酒簋貳納約自牖</nav></header><main><article><h1>樽酒簋貳納約自牖</h1><p>質薄之享而誠信自通，比喻六四以柔承陽，處險知節。</p><p>六四曰「樽酒簋貳，用缶，納約自牖，終无咎」。</p><p>言祭享之禮，器用樸素，一樽之酒、二簋之食，取瓦缶以代玉觴，質薄甚矣。然以誠信納約，自牖以通於君，心意相得，終得无咎。象曰「剛柔济也」，剛者九五，柔者六四，相濟以誠，故可以全身遠害。</p><p><strong>所出</strong>：《周易 · 坎》 — https://zh.wikisource.org/wiki/周易/坎</p></article></main></div></div>
