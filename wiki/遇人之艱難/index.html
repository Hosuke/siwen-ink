    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 遇人之艱難</nav></header><main><article><h1>遇人之艱難</h1><p>嫁非其人而值時艱也</p><p>遇人之艱難，[[詩經·中谷有蓷]]首章之辭也。</p><p>言有女仳離，嘅然而歎，歎之所以者何？蓋「遇人之艱難」也。遇人，謂嫁得之夫也；艱難，謂世道危蹙、民生困悴之時也。</p><p>值凶年饑饉之世，夫不能保其妻，妻不能有其家，詩人深傷之，以為非獨夫之不良，亦時運使然也。《毛詩正義》云：「夫婦日以衰薄，凶年饑饉，室家相棄。」</p><p>後世以「遇人不淑」別出一義，言夫之行義有虧；而「遇人之艱難」則兼言時命之蹙，義尤深廣。</p><p><strong>所出</strong>：《詩經 · 中谷有蓷》 — https://zh.wikisource.org/wiki/詩經/中谷有蓷</p></article></main></div></div>
