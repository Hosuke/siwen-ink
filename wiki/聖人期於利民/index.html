    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖人期於利民而止</nav></header><main><article><h1>聖人期於利民而止</h1><p>聖人治民，唯在利民，不慕古亦不留今。</p><p>聖人者，明於治亂之道、習於人事終始者也。其治人民也，期於利民而止，故其位齊。不慕古，不留今，與時變，與俗化。是故其設賞有薄有厚、立禁有輕有重，跡行不必同，非故相反，皆隨時而變、因俗而動者也。</p><p><strong>所出</strong>：《管子 · 第47篇正世》 — https://zh.wikisource.org/wiki/管子/第47篇正世</p></article></main></div></div>
