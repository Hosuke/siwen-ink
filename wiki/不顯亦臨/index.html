    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不顯亦臨</nav></header><main><article><h1>不顯亦臨</h1><p>不見知之時亦若臨在上，言君子慎獨之功，無時不然。</p><p>《思齊》三章云「不顯亦臨，無射亦保」。不顯者，幽隱不見知之時也。言人當不見知之際，亦若神明之鑒臨在上，不敢稍渝其敬。</p><p>無射者，人不厭射也。言雖無人之見射，亦常保守其德不失。此皆慎獨之義：君子之敬，不以人知與否而有增減也。</p><p><strong>所出</strong>：《詩經 · 思齊》 — https://zh.wikisource.org/wiki/詩經/思齊</p></article></main></div></div>
