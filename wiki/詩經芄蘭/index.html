    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 詩經芄蘭</nav></header><main><article><h1>詩經芄蘭</h1><p>衛大夫刺惠公驕慢無禮之詩，以童子佩觿為喻。</p><p>《芄蘭》，衛風之一也。毛詩序云：「《芄蘭》，刺惠公也。驕而無禮，大夫刺之。」</p><p>詩凡二章，章六句。首章言「芄蘭之支，童子佩觿」，以芄蘭之藤蔓有枝，比童子漸長而佩觿；然童子徒佩其飾，未能深知禮義，且矜誇容儀，垂帶顫動，無大臣之度。次章言「芄蘭之葉，童子佩韘」，言佩韘而驕，亦與首章同意。詩人刺惠公年既幼稚，驟加冠服，而德不稱位，驕矜自恣，故大夫作詩以刺之。</p><p><strong>所出</strong>：《詩經 · 芄蘭》 — https://zh.wikisource.org/wiki/詩經/芄蘭</p></article></main></div></div>
