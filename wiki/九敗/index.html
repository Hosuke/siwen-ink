    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 九敗</nav></header><main><article><h1>九敗</h1><p>亂國之九說，君主不可從。</p><p>寢兵之說勝，則險阻不守。兼愛之說勝，則士卒不戰。全生之說勝，則廉恥不立。私議自貴之說勝，則上令不行。羣徒比周之說勝，則賢不肖不分。金玉貨財之說勝，則爵服下流。觀樂玩好之說勝，則姦民在上位。請謁任舉之說勝，則繩墨不正。諂諛飾過之說勝，則巧佞者用。</p><p><strong>所出</strong>：《管子 · 第04篇立政》 — https://zh.wikisource.org/wiki/管子/第04篇立政</p></article></main></div></div>
