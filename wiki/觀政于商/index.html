    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 觀政于商</nav></header><main><article><h1>觀政于商</h1><p>武王帥友邦冢君，觀商之善惡，以定伐罪之師。</p><p>肆予小子發，以爾友邦冢君，觀政于商。</p><p>此言武王帥諸侯會于孟津，蓋欲觀商之善惡也。商政善則已，商政不善，則天吏不可久怠，故曰「大勳未集」，而伐商之志于是乎決。</p><p><strong>所出</strong>：《尚書 · 泰誓上》 — https://zh.wikisource.org/wiki/尚書/泰誓上</p></article></main></div></div>
