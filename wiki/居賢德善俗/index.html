    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 居賢德善俗</nav></header><main><article><h1>居賢德善俗</h1><p>君子居賢德以化民俗</p><p>象曰：「山上有木，漸；君子以居賢德，善俗。」</p><p>山上有木，木之漸高，由萌芽而至-{于}-拱把，由拱把而至-{于}-蔽牛，非一朝一夕之功也。君子法之，居賢德以善民俗，亦若是而已矣。德者，身之所修；俗者，民之所成。修德于己，化俗于外，其漸亦猶木之-{于}-山乎？</p><p><strong>所出</strong>：《周易 · 漸》 — https://zh.wikisource.org/wiki/周易/漸</p></article></main></div></div>
