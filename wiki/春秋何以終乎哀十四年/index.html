    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 《春秋》何以終乎哀十四年</nav></header><main><article><h1>《春秋》何以終乎哀十四年</h1><p>《春秋》備矣，君子據以撥亂反正。</p><p>何以終乎哀十四年？曰：備矣。《春秋》記二百四十二年之事，至此而筆削成書。君子何為作《春秋》？撥亂世，反諸正，莫近諸《春秋》。聖人制義以待後聖，以君子之為，亦有樂乎此也。則未知其為是與？其諸君子樂道堯舜之道與？末不亦樂乎堯舜之知君子也。</p><p><strong>所出</strong>：《春秋公羊傳 · 哀公》 — https://zh.wikisource.org/wiki/春秋公羊傳/哀公</p></article></main></div></div>
