    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天時不如地利</nav></header><main><article><h1>天時不如地利</h1><p>天時地形之便，皆不及人心之和合。</p><p>孟子論征戰之要，以為攻城者雖有天時之利，環而攻之，終不能勝，此天時不如地利也；守城者城高池深、兵革精利、米粟充盈，而竟委而去之，此地利不如人和也。人和者，上下相得，死生以之，雖無天時地形之便，終不可以力屈。此篇以人和為三者之極，歸宿於心之同欲焉。</p><p><strong>所出</strong>：《孟子 · 公孫丑下》 — https://zh.wikisource.org/wiki/孟子/公孫丑下</p></article></main></div></div>
