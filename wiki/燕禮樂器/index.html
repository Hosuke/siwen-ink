    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 燕禮樂器</nav></header><main><article><h1>燕禮樂器</h1><p>樂器與射器</p><p>燕禮之樂器，[[縣]]中，[[笙]]入三成，奏《南陔》、《白華》、《華黍》。[[正歌]]既備，[[大師]]告于[[樂正]]，升歌《鹿鳴》，下管《新宮》。若舞則《勺》。</p><p>射器：[[矢]]，[[笴]]一物；[[弓]]，[[決]]，[[拾]]，[[長勺]]。</p><p><strong>所出</strong>：《儀禮 · 燕禮》 — https://zh.wikisource.org/wiki/儀禮/燕禮</p></article></main></div></div>
