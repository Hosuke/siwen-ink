    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 影外微陰</nav></header><main><article><h1>影外微陰</h1><p>影待形而立，陰待日而在，皆有待而然也。</p><p>眾[[罔兩]]問於景曰：「若向也俯而今也仰，向也括撮而今也被髮，向也坐而今也起，向也行而今也止，何也？」景曰：「搜搜也，奚稍問也！予有而不知其所以。予，蜩甲也，蛇蛻也，似之而非也。火與日，吾屯也；陰與夜，吾代也。彼吾所以有待邪？而況乎以有待者乎！彼來則我與之來，彼往則我與之往，彼強陽則我與之強陽。」言影之待形，[[罔兩]]之待影，皆有待而起，然其本無所待，強陽者不自知也。</p><p><strong>所出</strong>：《莊子 · 寓言》 — https://zh.wikisource.org/wiki/莊子/寓言</p></article></main></div></div>
