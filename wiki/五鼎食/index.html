    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五鼎食</nav></header><main><article><h1>五鼎食</h1><p>主父偃自言大丈夫生享五鼎之食，死受五鼎之烹。借食器以喻榮辱，生死不渝其志也。</p><p>主父偃盛言朔方之便，上竟用主父計，立朔方郡。尊立衞皇后，及發燕王定國陰事，蓋偃有功焉。大臣皆畏其口，賂遺累千金。人或說偃曰：「太橫矣。」主父曰：「臣結髮游學四十餘年，身不得遂，親不以為子，昆弟不收，賓客棄我，我阸日久矣。且丈夫生不五鼎食，死即五鼎烹耳。吾日暮途遠，故倒行暴施之。」</p><p><strong>所出</strong>：《史記 · 卷112》 — https://zh.wikisource.org/wiki/史記/卷112</p></article></main></div></div>
