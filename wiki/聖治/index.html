    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖治</nav></header><main><article><h1>聖治</h1><p>聖人治世，官施拔舉各當其能，行言自爲而天下化。</p><p>諄芒將東之大壑，適遇苑風於東海之濱。</p><p>苑風曰：「子將奚之？」曰：「將之大壑。」曰：「奚爲焉？」曰：「夫大壑之爲物也，注焉而不滿，酌焉而不竭，吾將遊焉。」</p><p>苑風曰：「夫子无意於橫目之民乎？願聞聖治。」</p><p>諄芒曰：「聖治乎？官施而不失其宜，拔舉而不失其能，畢見其情事而行其所爲，行言自爲而天下化；手撓頤指，四方之民莫不俱至，此之謂聖治。」</p><p><strong>所出</strong>：《莊子 · 天地》 — https://zh.wikisource.org/wiki/莊子/天地</p></article></main></div></div>
