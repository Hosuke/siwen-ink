    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 小過小者過而亨</nav></header><main><article><h1>小過小者過而亨</h1><p>彖辭。小有過越，因時而行，乃得亨通。</p><p>彖曰：「小過，小者過而亨也。過以利貞，與時行也。」小者過，非大過也，過越小事乃亨。過以利貞者，因時而過，適宜則利，與時行焉。柔得中，是以小事吉；剛失位而不中，是以不可大事。有飛鳥之象焉，飛鳥遺之音，不宜上宜下，大吉；上逆而下順也。逆上則凶，順下則吉。</p><p><strong>所出</strong>：《周易 · 小過》 — https://zh.wikisource.org/wiki/周易/小過</p></article></main></div></div>
