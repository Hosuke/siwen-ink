    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 醉言舞</nav></header><main><article><h1>醉言舞</h1><p>臣事其君，既醉亦舞</p><p>「醉言舞」者，[[夙夜在公|勤於王事]]之餘，君臣相與燕飲，既醉而起舞，以示其樂也。[[鼓咽咽]]之鼓聲作，則[[振振鷺]]之舞容興，此非荒湛之宴，乃[[于胥樂兮|上下情浹]]之象也。昔[[文公迎王定周|晉文迎王]]，魯僖[[于胥樂兮|與臣共醉]]，其歡洽如此。夫能致[[歲其有|豐年之祥]]者，必先有[[和樂且孺|和樂之心]]，然後可以 [[詒孫子|貽福於後嗣]]矣。</p><p><strong>所出</strong>：《詩經 · 有駜》 — https://zh.wikisource.org/wiki/詩經/有駜</p></article></main></div></div>
