    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 明衣裳用幕布</nav></header><main><article><h1>明衣裳用幕布</h1><p>死者明衣以幕布為之。</p><p>明衣裳者，明衣也。用布，幕之。鬠用組，乃笄，設明衣裳。主人入，即位。衣裳所以明死者之身，俾終事有儀也。布巾，環幅，不鑿。掩，練帛廣終幅，長五尺，析其末。瑱，用白纊。幎目，用緇，方尺二寸，䞓裏，著，組繋。握手，用玄，纁裏，長尺二寸，廣五寸，牢中旁寸，著，組繋。決，用正王𣗥，若檡𣗥，組繋，纊極二。冒，緇質，長與手齊，䞓殺，掩足。爵弁服、純衣、皮弁服、褖衣、緇帶、韎韐、竹笏。夏葛屨，冬白屨，皆繶緇絇純，組綦繋於踵。</p><p><strong>所出</strong>：《儀禮 · 士喪禮》 — https://zh.wikisource.org/wiki/儀禮/士喪禮</p></article></main></div></div>
