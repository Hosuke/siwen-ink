    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 先令者殺後令者斬</nav></header><main><article><h1>先令者殺後令者斬</h1><p>令行禁止，先後皆誅；唯貴如令，無問遲速。</p><p>昔者舜使吏決鴻水，先令有功而舜殺之；禹朝諸侯之君會稽之上，防風之君後至而禹斬之。以此觀之，先令者殺，後令者斬，則古者先貴如令矣。</p><p>故鏡清而無事，美惡從而比焉；衡正而無事，輕重從而載焉。</p><p><strong>所出</strong>：《韓非子 · 飾邪》 — https://zh.wikisource.org/wiki/韓非子/飾邪</p></article></main></div></div>
