    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 相師之道</nav></header><main><article><h1>相師之道</h1><p>謂導客之禮，當隨處指示，以盡地主之谊。</p><p>師冕見。及階，子曰：「階也。」及席，子曰：「席也。」皆坐，子吿之曰：「某在斯，某在斯。」師冕出，子張問曰：「與師言之道與？」子曰：「然，固相師之道也。」</p><p>師冕，瞽者。孔子見之，升降階席，一一指示；坐定，又遍告在坐之人，俾知所在。此聖人待殘疾之盡禮，無所不用其極也。子張疑之，孔子然其問，謂相師之道固當如此。言上下相接，當具惄心，不以其瞽而簡之。</p><p><strong>所出</strong>：《論語 · 衞靈公第十五》 — https://zh.wikisource.org/wiki/論語/衞靈公第十五</p></article></main></div></div>
