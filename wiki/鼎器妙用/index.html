    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鼎器妙用</nav></header><main><article><h1>鼎器妙用</h1><p>述[[金丹]]鼎器之尺度規制，以象陰陽[[坎離]]之妙用。</p><p>文述「鼎器」之尺度：「圓三五，寸一分，口四八，兩寸唇，長尺二，厚薄均。」又云「腹齊三，坐垂溫。」此以數象[[坎離匡廓]]之義，實[[金丹]][[龍虎]]會合之器也。「陰在上，陽下奔」者，[[陽往則陰來]]之理；「首尾武，中間文」者，循時循度之節序焉。</p><p><strong>所出</strong>：《周易參同契 · 33章》 — https://zh.wikisource.org/wiki/周易參同契/33章</p></article></main></div></div>
