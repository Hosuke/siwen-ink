    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 伐崇墉</nav></header><main><article><h1>伐崇墉</h1><p>文王伐崇國之城，滅之以定天下也。</p><p>伐崇墉，言文王帥師伐崇國之城也。《皇矣》帝謂文王：「以爾鉤援，與爾臨衝，以伐崇墉。」崇，國名，在豐鎬之間。墉者，城也。崇為密邇之國，阻兵不服，文王赫怒，整旅以伐，取其城而定其國。伐崇之事，見文王之兵出有名，攻城有法，一戰而滅之，四方無敢侮慢也。伐崇之役，文王統一天下之大業也。</p><p><strong>所出</strong>：《詩經 · 皇矣》 — https://zh.wikisource.org/wiki/詩經/皇矣</p></article></main></div></div>
