    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 連珠七辭</nav></header><main><article><h1>連珠七辭</h1><p>連珠七辭之體，以巧艷為工。</p><p>連珠七辭，則從事於巧艷。</p><p>連珠之體，起於漢章帝時，假借事物以達微言，辭若連珠而不絕。七辭則模擬楚辭之體。此類文體，皆以巧麗艷逸為工，循其體而自成其勢也。</p><p><strong>所出</strong>：《文心雕龍 · 定勢》 — https://zh.wikisource.org/wiki/文心雕龍/定勢</p></article></main></div></div>
