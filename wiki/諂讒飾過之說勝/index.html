    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 諂讒飾過之說勝</nav></header><main><article><h1>諂讒飾過之說勝</h1><p>尚飾過則主惑不知，謀臣死而諂臣尊。</p><p>人君聽諂諛飾過之言則敗。諂臣者，常使其主不悔其過、不更其失，使主惑而不自知也。如是則謀臣死而諂臣尊。故「諂讒飾過之說」一行，則巧佞者用，而國隨以覆。</p><p><strong>所出</strong>：《管子 · 第65篇立政九敗解》 — https://zh.wikisource.org/wiki/管子/第65篇立政九敗解</p></article></main></div></div>
