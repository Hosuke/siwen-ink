    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 屬碑之體資乎史才</nav></header><main><article><h1>屬碑之體資乎史才</h1><p>碑文之體，有賴史才，序如傳記，文如銘詞。</p><p>夫屬碑之體，資乎史才，其序則傳，其文則銘。標序盛德，必見清風之華；昭紀鴻懿，必見峻偉之烈；此碑之制也。</p><p><strong>所出</strong>：《文心雕龍 · 誄碑》 — https://zh.wikisource.org/wiki/文心雕龍/誄碑</p></article></main></div></div>
