    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 隨</nav></header><main><article><h1>隨</h1><p>震下兌上，動而悅，物隨而歸，貞則无咎。</p><p>《隨》卦，第十七，震下兌上。象曰「澤中有雷」，雷蟄澤中，隨時而動。卦辭云「元亨利貞，无咎」，以剛下柔，動而悅也。天下之於隨時，其義大矣。</p><p>初九「官有渝」，官守有變，出門以正交則有功。六二、六三「係小子」「係丈夫」，明取舍之分，弗可兼與。九四「隨有獲」而「貞凶」，要在有孚在道以明，則何咎之有。九五「孚于嘉」，居中得正，吉莫大焉。上六「拘係之，乃從維之」，王用亨於西山，示羈絆之際，當以誠信維繫，終得上遂。</p><p><strong>所出</strong>：《周易 · 隨》 — https://zh.wikisource.org/wiki/周易/隨</p></article></main></div></div>
