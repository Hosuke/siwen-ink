    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鑿冰沖沖</nav></header><main><article><h1>鑿冰沖沖</h1><p>仲冬鑿冰於河，納之凌陰，以供祭享也。</p><p>[[授衣]]之候既及，[[為此春酒]]祈眉壽，而[[躋彼公堂]]稱萬壽無疆。[[二之日鑿冰沖沖]]，三之日納於凌陰，四之日其蚤，獻羔祭韭，以供宗廟者也。</p><p><strong>所出</strong>：《詩經 · 七月》 — https://zh.wikisource.org/wiki/詩經/七月</p></article></main></div></div>
