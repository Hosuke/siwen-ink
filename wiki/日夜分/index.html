    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 日夜分</nav></header><main><article><h1>日夜分</h1><p>仲春、仲秋陰陽相半，昼夜均停，當同度量、正權衡。</p><p>仲春之月，日夜分。雷乃發聲，始電，蟄蟲咸動，啟戶始出。先雷三日，奮木鐸以令兆民曰：「雷將發聲，有不戒其容止者，生子不備，必有凶災。」日夜分，則同度量，鈞衡石，角斗甬，正權概。仲秋亦如之。</p><p><strong>所出</strong>：《禮記 · 月令》 — https://zh.wikisource.org/wiki/禮記/月令</p></article></main></div></div>
