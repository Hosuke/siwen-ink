    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 製鍊百神</nav></header><main><article><h1>製鍊百神</h1><p>以一炁統攝百神之使</p><p>制鍊百神者，以一炁馭百神，使之歸一之義也。[[太微小童]]章默呪云「制鍊百神一炁全」，[[大洞玉經]]亦云「制鍊百神一炁全」，皆言修煉之要，在乎一炁遍行，身中[[泥丸百神方位|百神]]皆稟此炁，則死源永塞，生根長存。此與[[守一]]之道相終始焉。</p><p><strong>所出</strong>：《上清大洞真經 · 1章》 — https://zh.wikisource.org/wiki/上清大洞真經/1章</p></article></main></div></div>
