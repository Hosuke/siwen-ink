    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 神與形化</nav></header><main><article><h1>神與形化</h1><p>形變則神亦隨之，二者迭更而無定主</p><p>神與形化，方其為虎，不知其嘗為人；方其為人，不知其且為虎。二者迭更舛馳，各樂其成形，而狡猾鈍惛、是非之端莫之能知。神者形之主，形者神之舍，一者既變，一者亦隨之而化，豈有常主哉！</p><p><strong>所出</strong>：《淮南子 · 俶真訓》 — https://zh.wikisource.org/wiki/淮南子/俶真訓</p></article></main></div></div>
