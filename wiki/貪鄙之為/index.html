    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 貪鄙之為</nav></header><main><article><h1>貪鄙之為</h1><p>避患自全、不見民萌之資利者，貪鄙之徒也。</p><p>韓子非堂谿公之戒，乃正言以對曰：「憚亂主闇上之患禍，而避乎死亡之害，知明夫身而不見民萌之資利者，貪鄙之為也。臣不忍嚮貪鄙之爲，不敢傷仁智之行。」</p><p>言能蹈患難、 [[利民萌、便眾庶]] 者，是[[仁智之行]]；避死亡之害而忘民之利者，是貪鄙之徒。二者之別，在於見民萌與見一身之間。[[二子之言已當]]所引吳起、商鞅，正是知此義而蹈危者。</p><p><strong>所出</strong>：《韓非子 · 問田》 — https://zh.wikisource.org/wiki/韓非子/問田</p></article></main></div></div>
