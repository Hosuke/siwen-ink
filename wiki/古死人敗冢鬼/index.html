    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 古死人敗冢鬼</nav></header><main><article><h1>古死人敗冢鬼</h1><p>古死人敗冢及巫師不正道士之鬼</p><p>[[女青鬼律]]所記古死人敗冢鬼有二名：古凶鬼謹忠世、逆鬼弄耳。經云：「右二鬼是古死人敗冢，或巫師、不正道士之鬼。鬼害人百行，子知其名，鬼自伏住，不敢動。」</p><p>此鬼乃古死人敗冢，或巫師、不正道士所化。知其名，鬼自伏住不敢動。</p><p>是皆知鬼名鬼自伏之義，與 [[知鬼名鬼自伏]] 條相發明。</p><p><strong>所出</strong>：《女青鬼律 · 卷4》 — https://zh.wikisource.org/wiki/女青鬼律/卷4</p></article></main></div></div>
