    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 桑扈</nav></header><main><article><h1>桑扈</h1><p>頌君子之德，祈萬邦綏寧之詩。</p><p>《桑扈》，[[詩經]]《小雅》篇名，四章，章四句。</p><p>首章以桑扈起興，言雀之羽文采煥然，以喻君子之德。君子樂善，則受天之福。二章言桑扈之領有文，以興君子為萬邦之屏障。</p><p>三章承上，言君子之德可為法度，諸侯皆取則焉。惟能不戢自斂、不難自慎者，受福乃多。四章以酒禮言君子之風：觥籌交錯之間，酒旨而性和，匪敖萬福來集。</p><p>朱熹《詩集傳》曰：「此天子之詩，而燕諸侯言之。」蓋天子燕饗諸侯，頌其能為屏藩，而戒其勿敖也。</p><p><strong>所出</strong>：《詩經 · 桑扈》 — https://zh.wikisource.org/wiki/詩經/桑扈</p></article></main></div></div>
