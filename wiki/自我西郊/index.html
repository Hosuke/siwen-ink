    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 自我西郊</nav></header><main><article><h1>自我西郊</h1><p>施澤未行之義。</p><p>自我西郊，小畜卦辭也。密雲聚於西郊而不雨，恩澤未施於下。象傳曰「自我西郊，施未行也」。言施化之事，自我而起於西郊，尚未通行也。</p><p><strong>所出</strong>：《周易 · 小畜》 — https://zh.wikisource.org/wiki/周易/小畜</p></article></main></div></div>
