    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 伏戲駕辯</nav></header><main><article><h1>伏戲駕辯</h1><p>伏羲之曲，駕辯之名，古樂之濫觴。</p><p>伏戲駕辯，楚勞商只。</p><p>伏戲者，伏羲也。駕辯，曲名。相傳伏羲作此曲，以興樂教。楚有〈勞商〉之歌，皆古樂之遺。文以二樂並舉，見楚聲淵源之遠，非俗樂可比也。</p><p><strong>所出</strong>：《楚辭 · 大招》 — https://zh.wikisource.org/wiki/楚辭/大招</p></article></main></div></div>
