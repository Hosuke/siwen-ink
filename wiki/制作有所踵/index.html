    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 制作有所踵</nav></header><main><article><h1>制作有所踵</h1><p>聖人制作皆有承繼，因前人之跡而推度，分銖不差。</p><p>製作有所踵，推度審分銖。有形易忖量，無兆難慮謀。作事令可法，為世定詩書。</p><p>制作有所踵者，聖人制作皆有所因循，非憑空而立也。踵前聖之跡，推度其源流，審乎分銖之數，使有形可忖、無兆可謀，而詩書之教垂於後世。[[三聖]]迭興，正以此也。</p><p><strong>所出</strong>：《周易參同契 · 13章》 — https://zh.wikisource.org/wiki/周易參同契/13章</p></article></main></div></div>
