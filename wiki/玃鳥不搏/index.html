    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 玃鳥不搏</nav></header><main><article><h1>玃鳥不搏</h1><p>道德純厚者，蟲獸鳥類皆不能加害。</p><p>含德之厚者，比於赤子。毒蟲不螫，猛獸不據，玃鳥不搏。蓋含德既深，與物無忤，蟲獸自不犯之。</p><p><strong>所出</strong>：《老子河上公章句 · 玄符》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
