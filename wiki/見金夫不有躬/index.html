    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 見金夫不有躬</nav></header><main><article><h1>見金夫不有躬</h1><p>見利而忘義，不能守身。</p><p>六三：勿用取女，見金夫，不有躬，無攸利。象曰：「勿用取女，行不順也。」</p><p>見金夫而不有其躬，言見人之金而悅之，忘其身之有也。夫為女子而見金夫則失身，取之無益也。行不順者，言其行有悖於正道也。此爻戒人之不可以利動也。</p><p><strong>所出</strong>：《周易 · 蒙》 — https://zh.wikisource.org/wiki/周易/蒙</p></article></main></div></div>
