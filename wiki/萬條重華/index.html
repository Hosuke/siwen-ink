    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 萬條重華</nav></header><main><article><h1>萬條重華</h1><p>父寧母精之功，萬世受恩。</p><p>萬條重華，上清大洞[[父寧在帝一]]與[[母精延帝一字]]之功化也。父寧母精，世世為仙，萬條重華，皆受帝恩。修者至此，[[景中伯]]與爾[[登玉晨]]，[[高上神霄玉清王]]之德被乎無盡，是道成之驗也。</p><p><strong>所出</strong>：《上清大洞真經 · 18章》 — https://zh.wikisource.org/wiki/上清大洞真經/18章</p></article></main></div></div>
