    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 澄潧渟</nav></header><main><article><h1>澄潧渟</h1><p>日中白帝之帝名，與黑帝俱濟三滅之關。</p><p>[[澄潧渟]]為日中白帝之帝名。經云「號為受逸阜，亦曰澄潧渟」，與日中黑帝同居日宮。 [[澄潧渟]] 與黑帝俱濟三滅之關，令修行者啟籍登太明，保其仙真，七祖皆登玉虛之境。</p><p>此帝名載於大洞玉清三元王祝中，屬上清七真玄陽君章之要義。</p><p><strong>所出</strong>：《上清大洞真經 · 13章》 — https://zh.wikisource.org/wiki/上清大洞真經/13章</p></article></main></div></div>
