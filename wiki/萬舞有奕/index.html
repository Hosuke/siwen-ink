    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 萬舞有奕</nav></header><main><article><h1>萬舞有奕</h1><p>萬舞之容，秩序分明也</p><p>萬舞有奕者，奕者，次序也。言萬舞之容，秩序分明，盛大可觀也。商家祭祀，樂與舞備，而[[庸鼓有斁]]言音聲之盛。</p><p><strong>所出</strong>：《詩經 · 那》 — https://zh.wikisource.org/wiki/詩經/那</p></article></main></div></div>
