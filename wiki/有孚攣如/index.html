    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 有孚攣如</nav></header><main><article><h1>有孚攣如</h1><p>誠信相結，固而不解，上下相孚。</p><p>九五爻辭「有孚攣如，无咎」。孚者，誠也。攣如者，固結不解之貌。上下以信相維，堅固如此，何咎之有。象傳云「位正當也」，言九五居尊履正，與二相應，孚義充實也。</p><p><strong>所出</strong>：《周易 · 中孚》 — https://zh.wikisource.org/wiki/周易/中孚</p></article></main></div></div>
