    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 八鸞</nav></header><main><article><h1>八鸞</h1><p>車懸八鸞，鸝鳴和協，以象天子威儀。</p><p>「八鸞」出自《商頌·烈祖》，言祭祀所用車輿之上懸八鸞鈴也。</p><p>詩云「約軝錯衡，八鸞鶬鶬」，鸞者，車鈴也，衡軛之上各懸一鸞，四馬故有八鸞；「鶬」者，鸞鳴之聲也。鸞聲和鳴，與下「假以享」之肅敬相映，見天子祭祀之儀盛且美矣。</p><p>考之《詩》中，《采芑》有「鸞聲將將」，《蓼蕭》有「鸞聲嘒嘒」，皆詠車鸞之聲。「八鸞」之數尤見其盛，蓋祭祖之禮，天子諸侯盛其車馬，所以致敬於祖考也。</p><p><strong>所出</strong>：《詩經 · 烈祖》 — https://zh.wikisource.org/wiki/詩經/烈祖</p></article></main></div></div>
