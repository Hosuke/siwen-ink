    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 詩為樂心，聲為樂體</nav></header><main><article><h1>詩為樂心，聲為樂體</h1><p>詩為音樂之內心，聲為音樂之形體，二者相資而不可偏廢。</p><p>故知詩為樂心，聲為樂體。樂體在聲，瞽師務調其器；樂心在詩，君子宜正其文。好樂無荒，晉風所以稱遠；伊其相謔，鄭國所以-{云}-亡。辭繁難節，則陳思稱李延年增損古辭，多者宜減，明貴約也。是故聲來被辭，辭必協律，而詩聲俱正，方為得之。</p><p><strong>所出</strong>：《文心雕龍 · 樂府》 — https://zh.wikisource.org/wiki/文心雕龍/樂府</p></article></main></div></div>
