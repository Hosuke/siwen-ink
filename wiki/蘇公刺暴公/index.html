    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蘇公刺暴公</nav></header><main><article><h1>蘇公刺暴公</h1><p>卿士暴公譖害蘇公，蘇公作詩絕交。</p><p>序曰：「蘇公刺暴公也。暴公為卿士而譖蘇公焉，故蘇公作是詩以絕之。」暴公與蘇公皆周之世臣，暴公既為卿士，譖毀蘇公，蘇公於是賦詩以刺。其詩言「彼何人斯」，深探暴公之心；言「不入我門」「不入唁我」，明其無恤之意；終言「為鬼為蜮」，以鬼蜮比暴公之姦；末言「以極反側」，明此詩之旨，在窮治其反覆無常之行也。古者朋友以義合，譖而行毀者，義絕而詩作。蘇公之刺暴公，後世以為辭絕友朋之始焉。</p><p><strong>所出</strong>：《詩經 · 何人斯》 — https://zh.wikisource.org/wiki/詩經/何人斯</p></article></main></div></div>
