    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 驕常自至</nav></header><main><article><h1>驕常自至</h1><p>富貴之門，率多不期驕而驕至；謙虛下士，則附者眾而身安。</p><p>生乎世貴之門，居乎熱烈之勢，率多不與驕期而驕自來矣。非夫超群之器，不辯於免盈溢之過也。蓋勞謙虛己，則附之者眾；驕慢倨傲，則去之者多；附之者眾，則安之徽也；去之者多，則危之診也。存亡之機，於是乎在。輕而為之，不亦蔽哉！</p><p><strong>所出</strong>：《抱朴子 · 卷27》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷27</p></article></main></div></div>
