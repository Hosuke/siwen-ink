    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 上為逆下為從</nav></header><main><article><h1>上為逆下為從</h1><p>色見於上者病逆，見於下者病從，陰陽逆從以斷吉凶。</p><p>上為逆、下為從，出[[玉板論要]]。</p><p>岐伯言：「色見上下左右，各在其要。上為逆，下為從。女子右為逆，左為從；男子左為逆，右為從。易重陽死，重陰死。」</p><p>色者，臟腑之外映也。見於上者，病情上行，是為逆；見於下者，病情下行，是為從。男女左右之別，又陰陽老少之辨也。重陽重陰者，陰陽偏盛，皆死。此以色之部位斷病之逆從，以決生死也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第四卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第四卷</p></article></main></div></div>
