    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 讒人罔極</nav></header><main><article><h1>讒人罔極</h1><p>讒人無中正之準，言其肆無忌憚。</p><p>「讒人罔極」，《青蠅》之二、三章句也。</p><p>罔極，無中也，無準也。言讒人之所以得行者，以其中無所持守，而肆言無忌，無有極止。[[詩有六義|變雅]]刺詩之例，往往指斥其臣之無極，以為[[讒言致罪|致罪之由]]。讒人無極，則言之者日甚一日，受之者不知所禦，而四方交亂，二人搆怨矣。</p><p><strong>所出</strong>：《詩經 · 青蠅》 — https://zh.wikisource.org/wiki/詩經/青蠅</p></article></main></div></div>
