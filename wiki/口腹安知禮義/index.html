    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 口腹安知禮義</nav></header><main><article><h1>口腹安知禮義</h1><p>人無師法，口腹之欲蔽之，猶芻豢稻粱之於未嘗睹者。</p><p>今是人之口腹，安知禮義？安知辭讓？安知廉恥隅積？亦呥呥而噍，鄉鄉而飽已矣。</p><p><strong>所出</strong>：《荀子 · 榮辱篇》 — https://zh.wikisource.org/wiki/荀子/榮辱篇</p></article></main></div></div>
