    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 癸度獻策</nav></header><main><article><h1>癸度獻策</h1><p>金珠玉與粟相權，上中下三幣迭用，天下可足。</p><p>癸度對武王曰：「吾國者，衢處之國也。苟入吾國之粟，因吾國之幣，然後載黃金而出。君請重重而衡輕輕，運物而相因，則國筴可成。」</p><p>武王問行事奈何。癸度曰：「金出於汝、漢之右衢，珠出於赤野之末光，玉出於禺氏之旁山，此皆距周七千八百餘里，其涂遠，其至阨，故先王度用於其重，因以珠玉為上幣，黃金為中幣，刀布為下幣。故先王善高下中幣，制下上之用，而天下足矣。」</p><p><strong>所出</strong>：《管子 · 第81篇輕重乙》 — https://zh.wikisource.org/wiki/管子/第81篇輕重乙</p></article></main></div></div>
