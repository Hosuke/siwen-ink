    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 南史氏執簡以往</nav></header><main><article><h1>南史氏執簡以往</h1><p>南史氏聞大史盡死，執簡以往，聞既書乃還。</p><p>崔杼弒君，大史書之，崔子殺之。其弟嗣書，而死者二人。其弟又書，乃舍之。南史氏聞大史盡死，執簡以往，聞既書矣，乃還。</p><p><strong>所出</strong>：《春秋左氏傳 · 廿五年》 — https://zh.wikisource.org/wiki/春秋左氏傳/襄公/廿五年</p></article></main></div></div>
