    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 當途者不必賢</nav></header><main><article><h1>當途者不必賢</h1><p>當途之臣未必賢能，人主用之則賢者不用。</p><p>其當途者不必賢，人主之於人或有所賢而禮之，入因與當途者論其行，聽其言而不用賢，是與不肖論賢也。</p><p><strong>所出</strong>：《韓非子 · 人主》 — https://zh.wikisource.org/wiki/韓非子/人主</p></article></main></div></div>
