    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天曰虛地曰靜</nav></header><main><article><h1>天曰虛地曰靜</h1><p>天道虛而無屈，地道靜而不變，此聖人治世之象。</p><p>天之道，虛其無形。虛則不屈，無形則無所位𧺴，故徧流萬物而不變。地之道，靜。靜則不變，不變則無過，故曰不伐。天曰虛，地曰靜，乃不伐。[[天之道虛]]，[[地之道靜]]，虛則不屈，靜則不變，此[[聖人守此萬物化]]之象也。</p><p><strong>所出</strong>：《管子 · 第36篇心術上》 — https://zh.wikisource.org/wiki/管子/第36篇心術上</p></article></main></div></div>
