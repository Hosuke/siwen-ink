    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 使騶盡粟以食</nav></header><main><article><h1>使騶盡粟以食</h1><p>名實相符勿自欺</p><p>韓宣子曰：「吾馬菽粟多矣，甚臞，何也？寡人患之。」周市對曰：「使騶盡粟以食，雖無肥，不可得也。名爲多與之，其實少，雖無臞，亦不可得也。主不審其情實，坐而患之，馬猶不肥也。」</p><p>周市以馬不肥爲喻，謂名實不相符，雖云多與，實則無益。當審情實，不可自欺也。</p><p><strong>所出</strong>：《韓非子 · 外儲說左下》 — https://zh.wikisource.org/wiki/韓非子/外儲說左下</p></article></main></div></div>
