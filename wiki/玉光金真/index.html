    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 玉光金真</nav></header><main><article><h1>玉光金真</h1><p>養光煉形之炁，由泥丸布五官。</p><p>玉光金真之炁，乃存思脾中五真時所用之元炁。行者思此炁從泥丸中入，口吸神雲咽津五過，結作五神，狀如土星，下入絳宮，分左右入膀胱，穿尾閭、夾脊而上，達泥丸，布於兩極根之戶。其法循時吐納，以養光華、固魂魄，蓋[[存神]]之要術也。</p><p><strong>所出</strong>：《上清大洞真經 · 15章》 — https://zh.wikisource.org/wiki/上清大洞真經/15章</p></article></main></div></div>
