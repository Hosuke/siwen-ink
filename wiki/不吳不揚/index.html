    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不吳不揚</nav></header><main><article><h1>不吳不揚</h1><p>不喧譁，不矜張，征伐以義而不以暴。</p><p>[[不吳不揚]]，第六章之句也。詩言「烝烝皇皇，不吳不揚」，言伐淮之師，盛大而不自矜，未嘗喧譁，未嘗張大。吳者，譁也；揚者，矜張也。征伐之事，能不矜不伐、不暴不躁，斯為義師。美魯師之有節也。</p><p><strong>所出</strong>：《詩經 · 泮水》 — https://zh.wikisource.org/wiki/詩經/泮水</p></article></main></div></div>
