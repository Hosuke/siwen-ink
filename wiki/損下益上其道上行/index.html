    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 損下益上其道上行</nav></header><main><article><h1>損下益上其道上行</h1><p>損之為卦，損下以益上，其道上遂。</p><p>《彖傳》曰：「損，損下益上，其道上行。」此述《損》卦之義。夫損者，非徒減損也，損剛益柔、損盈補虛，務使上下相成、剛柔相濟。《象傳》又言「山下有澤，損」，澤浸潤乎山，山以是成其高，故君子觀此象，當懲忿窒欲，以損其過盛之情欲，而益其德義之修為。</p><p><strong>所出</strong>：《周易 · 損》 — https://zh.wikisource.org/wiki/周易/損</p></article></main></div></div>
