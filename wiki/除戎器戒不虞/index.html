    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 除戎器戒不虞</nav></header><main><article><h1>除戎器戒不虞</h1><p>君子治萃之世，修武備以防患亂</p><p>「澤上于地，萃；君子以除戎器，戒不虞。」萃聚之時，不可忘武備，故修治兵戎器械，以防不測之患。</p><p><strong>所出</strong>：《周易 · 萃》 — https://zh.wikisource.org/wiki/周易/萃</p></article></main></div></div>
