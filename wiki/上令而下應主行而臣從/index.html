    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 上令而下應，主行而臣從</nav></header><main><article><h1>上令而下應，主行而臣從</h1><p>君臣各正其位，上令下應，此治道之正也。</p><p>夫君臣者，天地之位也；民者，衆物之象也，各立其所職以待君令。羣臣百姓安得各用其心而立私乎？故遵主令而行之，雖有傷敗，無罰。非主令而行之，雖有功利，罪死。然故下之事上也，如響之應聲也；臣之事主也，如影之從形也。故上令而下應，主行而臣從，此治之道也。</p><p><strong>所出</strong>：《管子 · 第45篇任法》 — https://zh.wikisource.org/wiki/管子/第45篇任法</p></article></main></div></div>
