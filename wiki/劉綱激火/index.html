    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 劉綱激火</nav></header><main><article><h1>劉綱激火</h1><p>與夫人鬬術</p><p>綱與夫人樊氏俱坐林上，綱作火燒屋從東起，夫人作雨從西上，火即滅。庭中兩株桃，各咒一株，使之相鬪，綱咒者不勝，數走出籬外。綱唾盤成鯽魚，夫人唾成獺。</p><p><strong>所出</strong>：《神仙傳 · 卷六》 — https://zh.wikisource/wiki/神仙傳/卷六</p></article></main></div></div>
