    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 主有術兩用不為患</nav></header><main><article><h1>主有術兩用不為患</h1><p>主有術，兩用不爲患；無術，兩用則争事而外市，一則專制而劫弑。</p><p>「或曰」難樛留之說曰：昔者齊桓公兩用管仲、鮑叔，成湯兩用伊尹、仲虺。夫兩用臣者國之憂，則是桓公不霸，成湯不王也。湣王一用淖齒，而身死乎東廟；主父一用李兌，減食而死。</p><p>主有術，兩用不爲患；無術，兩用則争事而外市，一則專制而劫弑。今留無術以規上，使其主去兩用一，是不有西河、鄢、郢之憂，則必有身死减食之患，是樛留未有善以知言也。</p><p><strong>所出</strong>：《韓非子 · 難一》 — https://zh.wikisource.org/wiki/韓非子/難一</p></article></main></div></div>
