    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 探賾索隱</nav></header><main><article><h1>探賾索隱</h1><p>聖人觀象設卦，探賾索隱，鉤深致遠，以定吉凶。</p><p>法象莫大乎天地；變通莫大乎四時；縣象著明莫大乎日月；崇高莫大乎富貴；備物致用，立成器以為天下利，莫大乎聖人；探賾索隱，鉤深致遠，以定天下之吉凶，成天下之亹亹者，莫大乎蓍龜。是故天生神物，聖人則之；天地變化，聖人效之；天垂象見吉凶，聖人象之；河出圖，洛出書，聖人則之。易有四象，所以示也；繫辭焉，所以告也；定之以吉凶，所以斷也。</p><p><strong>所出</strong>：《周易 · 繫辭上》 — https://zh.wikisource.org/wiki/易傳/繫辭上</p></article></main></div></div>
