    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 小臣戒與</nav></header><main><article><h1>小臣戒與</h1><p>小臣戒與者，具官饌，設樂縣，備燕席</p><p>小臣之職，掌戒與者、具[[官饌]]于[[寢]]東。[[樂人]]縣，設洗、篚于[[阼階]]東南，當[[東霤]]。[[罍水]]在東，篚在洗西，南肆。設[[膳篚]]在其北，西面。司宮尊于[[東楹]]之西，兩方[[壺]]，左[[玄酒]]，南上。公尊[[瓦大]]兩，有[[丰]]，冪用[[綌若錫]]，在尊南，南上。尊士旅食于門西，兩[[圜壺]]。司宮筵[[賔]]于[[戶西]]，東上，無加席也。</p><p><strong>所出</strong>：《儀禮 · 燕禮》 — https://zh.wikisource.org/wiki/儀禮/燕禮</p></article></main></div></div>
