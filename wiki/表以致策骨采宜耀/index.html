    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 表以致策，骨采宜耀</nav></header><main><article><h1>表以致策，骨采宜耀</h1><p>表文之用在乎陳策，其骨力文采皆當煥耀。</p><p>章以造闕，風矩應明；表以致策，骨采宜耀。循名課實，以章為本者也。蓋章之體在明，在炳賁典謨；表之體在策，在骨力文采之兼備也。</p><p><strong>所出</strong>：《文心雕龍 · 章表》 — https://zh.wikisource.org/wiki/文心雕龍/章表</p></article></main></div></div>
