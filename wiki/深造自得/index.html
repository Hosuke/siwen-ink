    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 深造自得</nav></header><main><article><h1>深造自得</h1><p>君子深造之以道者，欲其自得之也。</p><p>孟子云：「君子深造之以道，欲其自得之也。自得之則居之安，居之安則資之深，資之深則取之左右逢其原。」深造者，非由外鑠，乃步步深入，優游浸潤，久則自有所得。既得之，則居之安固；居之安，則資之益深；資深矣，則取之左右無往而不自得，如掘井及泉，左右逢源也。</p><p><strong>所出</strong>：《孟子 · 離婁下》 — https://zh.wikisource.org/wiki/孟子/離婁下</p></article></main></div></div>
