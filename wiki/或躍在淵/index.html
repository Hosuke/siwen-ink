    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 或躍在淵</nav></header><main><article><h1>或躍在淵</h1><p>君子進德脩業，欲及時而自試，進退無常，非有邪也。</p><p>九四：或躍在淵，無咎。</p><p>上下無常，非為邪也。進退無恒，非離群也。君子進德脩業，欲及時也。故無咎。</p><p>象曰：或躍在淵，進無咎也。
文言曰：「或躍在淵」，自試也。又曰：乾道乃革。</p><p>乾道乃革者，時當變革，君子上下進退，或躍或淵，皆所以自試，非躁妄也。重剛而不中，上不在天，下不在田，故或之。或之者，疑之也，故無咎。疑者，審度之義，非猶豫也。</p><p><strong>所出</strong>：《周易 · 乾》 — https://zh.wikisource.org/wiki/周易/乾</p></article></main></div></div>
