    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 道徳仁義禮五者一體</nav></header><main><article><h1>道徳仁義禮五者一體</h1><p>道、德、仁、義、禮五者為一體，不可缺一。</p><p>道、德、仁、義、禮，五者壹體也。</p><p>道者，人之所蹈；德者，人之所得；仁者，人之所親；義者，人之所宜；禮者，人之所體。不可無壹焉。</p><p>故夙興夜寐，禮之制也；討賊報仇，義之決也；惻隱之心，仁之發也；得己得人，德之路也；使人均平，不失其所，道之化也。</p><p><strong>所出</strong>：《三略》 — https://zh.wikisource.org/wiki/三略</p></article></main></div></div>
