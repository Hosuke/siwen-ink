    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 母精延帝一字</nav></header><main><article><h1>母精延帝一字</h1><p>金門右之高賢，景中伯之一。</p><p>母精延帝一字，上清大洞[[高上神霄玉清王]]金門右之高賢也。與[[父寧在帝一]]相對，兆能知之，乃開金門，左右忽見此二高賢。父寧母精，世世為仙，萬條重華，皆受帝恩。修至此境，則三元紫房之道備矣。</p><p><strong>所出</strong>：《上清大洞真經 · 18章》 — https://zh.wikisource/wiki/上清大洞真經/18章</p></article></main></div></div>
