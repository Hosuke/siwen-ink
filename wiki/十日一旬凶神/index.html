    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 十日一旬凶神</nav></header><main><article><h1>十日一旬凶神</h1><p>述六甲各旬凶神姓，名。</p><p>甲子十日一旬凶神姓玄名玉衡。甲戌十日一旬凶神姓恒名捧。甲申十日一旬凶神姓既名�之𡧯。甲午十日一旬凶神姓本名滿。甲辰十日一旬凶神姓恒名堅子。甲寅十日一旬凶神姓蘇名造。蓋六甲各主一旬，有凶神糾察世人，知之可辟。</p><p><strong>所出</strong>：《女青鬼律 · 卷1》 — https://zh.wikisource.org/wiki/女青鬼律/卷1</p></article></main></div></div>
