    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 七郡</nav></header><main><article><h1>七郡</h1><p>述西南夷所置七郡之名</p><p>南越破後，誅且蘭、邛君，并殺筰侯，冉駹亦請臣置吏。漢乃以邛都為越巂郡，筰都為沈犁郡，冉駹為汶山郡，廣漢西白馬為武都郡。又平南夷為牂柯郡，置益州郡，凡七郡。</p><p><strong>所出</strong>：《史記 · 卷116》 — https://zh.wikisource.org/wiki/史記/卷116</p></article></main></div></div>
