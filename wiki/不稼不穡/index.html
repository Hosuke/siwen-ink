    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不稼不穡</nav></header><main><article><h1>不稼不穡</h1><p>不事耕作而取禾粟萬斛，以刺在位者剝削之非。</p><p>不稼不穡，胡取禾三百廛兮。稼者，播種也；穡者，收割也。言在下者播種耕耘，終歲勤苦，而在上者不事農業，坐取禾粟多至三百廛、三百億、三百囷，是剝削民力以自肥也。</p><p>後世以「不稼不穡」指斥尸位素餐之輩，謂居官食祿者當知民之所出，不可妄取。</p><p><strong>所出</strong>：《詩經 · 伐檀》 — https://zh.wikisource.org/wiki/詩經/伐檀</p></article></main></div></div>
