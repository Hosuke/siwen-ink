    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 求賢智期適民皆亂之端</nav></header><main><article><h1>求賢智期適民皆亂之端</h1><p>選拔賢智以悅民心，皆亂國之始。</p><p>昔禹決江濬河，而民聚瓦石；子産開畝樹桑，鄭人謗訾。禹利天下，子産存鄭人，皆以受謗，夫民智之不足用亦明矣。故舉士而求賢智，為政而期適民，皆亂之端，未可與為治也。</p><p><strong>所出</strong>：《韓非子 · 顯學》 — https://zh.wikisource.org/wiki/韓非子/顯學</p></article></main></div></div>
