    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 室虛人居</nav></header><main><article><h1>室虛人居</h1><p>戶牖空而人出入，室空而人得居。</p><p>鑿戶牖以為室者，窓戶通明以居人也。戶牖空虛，人得出入觀視；室中空虛，人得安居。然室中有神，人存屋破之懼，腹中有形，形亡神去之畏。慎勿使有所充實，乃可長保。</p><p><strong>所出</strong>：《老子河上公章句 · 無用》 — https://zh.wikisource/wiki/老子河上公章句/上</p></article></main></div></div>
