    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 力地動時</nav></header><main><article><h1>力地動時</h1><p>致力於地而順時而動，則國必富。</p><p>管子對桓公言富國之道曰：「力地而動於時，則國必富矣。」致力於農事，順天時而行之，此富國之本也。</p><p><strong>所出</strong>：《管子 · 第51篇小問》 — https://zh.wikisource.org/wiki/管子/第51篇小問</p></article></main></div></div>
