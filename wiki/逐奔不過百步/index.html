    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 逐奔不過百步</nav></header><main><article><h1>逐奔不過百步</h1><p>古者追敗師不越百步，示師以禮而不困之。</p><p>古者逐奔不過百步，縱綏不過三舍，是以明其禮也。不窮不能而哀憐傷病，是以明其義也。成列而皷，是以明其信也。爭義不爭利，是以明其義也。又能舍服，是以明其勇也。知終知始，是以明其智也。六德以時合教，以為民紀之道也。</p><p><strong>所出</strong>：《司馬法》 — https://zh.wikisource.org/wiki/司馬法</p></article></main></div></div>
