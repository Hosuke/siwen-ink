    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 太玄太和俠侍端</nav></header><main><article><h1>太玄太和俠侍端</h1><p>太初元始之氣，拱侍道君，不敢少懈。</p><p>太玄太和者，道之初始、氣之根本也。</p><p>太玄喻道之深遠難測，太和喻陰陽交會、沖氣以為和。俠侍端者，拱侍之義，喻修煉之時，神氣端正，一念不雜，如侍君側。此承上章太上大道君而言之——道君非孤起也，實以元始之氣為其根本。</p><p>修煉者凝神入氣，氣化為神，神氣混成，即是太玄太和之全體。</p><p><strong>所出</strong>：《黃庭內景經 · 紫清章第二十九》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/紫清章第二十九</p></article></main></div></div>
