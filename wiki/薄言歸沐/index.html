    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 薄言歸沐</nav></header><main><article><h1>薄言歸沐</h1><p>亟望君子之歸，先自整飭以迎之。</p><p>歸沐者，急於歸而沐浴更衣也。予髮曲局，薄言歸沐。蓋念之切，恐君子之驟歸見己之容衰，故亟亟乎治其容飾也。薄言，急詞。言其歸心之迫，不暇自逸，必整飭以迎之。夫婦之情，於此見焉。</p><p><strong>所出</strong>：《詩經 · 采綠》 — https://zh.wikisource.org/wiki/詩經/采綠</p></article></main></div></div>
