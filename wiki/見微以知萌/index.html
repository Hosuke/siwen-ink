    <meta property="og:description" content="紂爲象箸而箕子怖，以爲象箸必不盛羹於土鉶，則必犀玉之杯；玉柸象箸必不盛菽藿，則必旄象豹胎；旄象豹胎必不衣短褐而舍茅茨之下，則必錦衣九重、高臺廣室。稱此以求，則天下不足矣。聖人見微以知萌，見端以知末，故見象箸而怖，知天下之不足也。 所出：《韓非子 · 說林上》 — https://zh.wikisou…" />

    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 見微以知萌</nav></header><main><article><h1>見微以知萌</h1><p></p><p>紂爲象箸而箕子怖，以爲象箸必不盛羹於土鉶，則必犀玉之杯；玉柸象箸必不盛菽藿，則必旄象豹胎；旄象豹胎必不衣短褐而舍茅茨之下，則必錦衣九重、高臺廣室。稱此以求，則天下不足矣。聖人見微以知萌，見端以知末，故見象箸而怖，知天下之不足也。</p><p>  <strong>所出</strong>：《韓非子 · 說林上》 — https://zh.wikisource.org/wiki/韓非子/說林上</p></article></main></div></div>
