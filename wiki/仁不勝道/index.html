    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 仁不勝道</nav></header><main><article><h1>仁不勝道</h1><p>仁義不足以奪道之正，齊侯專封不可以稱仁。</p><p>二年春，王正月，城楚丘。楚丘者何？衛邑也。國而曰城；此邑也，其曰城，何也？封衛也。則其不言城衛，何也？衛未遷也。其不言衛之遷焉，何也？不與齊侯專封也。其言城之者，專辭也。故非天子不得專封諸侯，諸侯不得專封諸侯。雖通其仁，以義而不與也。故曰：仁不勝道。</p><p>《穀梁》明封國之禮：封衛者，天子之事也；齊侯城之，是專封也。雖見其救衛之仁，然不可加以封國之義，故曰「仁不勝道」，以義裁之也。</p><p><strong>所出</strong>：《春秋穀梁傳 · 僖公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/僖公</p></article></main></div></div>
