    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無教逸欲有邦</nav></header><main><article><h1>無教逸欲有邦</h1><p>治邦者勿使安逸縱欲，兢兢業業乃可長久。</p><p>「無教逸欲有邦」，戒治邦者勿耽安逸、縱嗜欲也。逸欲一生，則怠荒乘之，政事日隳，邦以是亡。是以聖王兢兢業業、一日二日萬幾，不敢有須臾之懈。逸欲之戒，萬世治邦者之所當先務也。</p><p><strong>所出</strong>：《尚書 · 皐陶謨》 — https://zh.wikisource.org/wiki/尚書/皐陶謨</p></article></main></div></div>
