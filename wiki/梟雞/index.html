    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 梟雞</nav></header><main><article><h1>梟雞</h1><p>梟雞晝夜異狀，能齊昏明者其唯大人乎。</p><p>梟夜明而晝昏，雞晝明而夜昏，其異同也如是。或謂梟為異，則謂雞為同；或謂雞為異，則謂梟為同。孰梟雞之異晝夜乎？晝夜之異梟雞乎？梟雞之同晝夜乎？夫耳中磬，我自聞；目中花，我自見。我之晝夜，彼之晝夜，則是晝不得謂之明，夜不得謂之昏。能齊昏明者，其唯大人乎！</p><p><strong>所出</strong>：《化書 · 卷一》 — https://zh.wikisource.org/wiki/化書/卷一</p></article></main></div></div>
