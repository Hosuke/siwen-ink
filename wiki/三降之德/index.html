    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三降之德</nav></header><main><article><h1>三降之德</h1><p>舜持中不懈，上應天心，降於堯而成王業</p><p>《保訓》述舜之事云：「舜既得中，言不易實變名，身茲備，惟允，翼翼不懈，用作三降之德。帝堯嘉之，用受厥緒。」</p><p>「三降」之義，注家異說。孔穎達疏以為「三降」者，降，下也。言舜以中道治身，其德下及於民。厥後堯嘉其德，禪以天下。</p><p>要之，「三降」言舜持中之德周普，上應天心，下洽民心，故能受堯之緒。《保訓》以為持中不懈之驗，欲太子法之。</p><p><strong>所出</strong>：《尚書 · 保訓》 — https://zh.wikisource.org/wiki/尚書/保訓</p></article></main></div></div>
