    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 合巹而酳</nav></header><main><article><h1>合巹而酳</h1><p>昏禮中夫婦共用一瓠瓜剖分之酒杯飲酒的儀式，象徵合為一體。</p><p>合巹而酳，乃昏禮之終儀。昏禮既成，新人共飲一器。所用之器，乃瓠瓜剖而為之者也。《禮記·昏義》云：「共牢而食，合巹而酳；所以合體同尊卑以親之也。」言其所以合二姓之好者，必於此時成之。瓠瓜同蒂而生，至熟則剖，是故以喻夫婦之義——陰陽相配，判而為二，合乃成一也。共牢者，同食一牲；合巹者，同飲一器。食以成恩，酳以定分。恩既成，分既定，則夫婦之道立矣。是禮也，非特為燕飲之私，乃所以正夫婦之始，使知合體同尊卑之義也。</p></article></main></div></div>
