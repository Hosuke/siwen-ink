    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 非以明民</nav></header><main><article><h1>非以明民</h1><p>善為道者不以智巧教民，而以道德樸愚。</p><p>古之善以道治身及治國者，不以道教民明智巧詐，而以道德教民，使質樸不欺-{zh|偽}-。明者，機智也；愚者，樸厚也。[[聖人之道去智與巧]]</p><p>夫[[名與身孰親|民之多智]]，則機心起而姦偽生，故難治。聖人欲治，反其本焉。</p><p><strong>所出</strong>：《老子河上公章句 · 淳德》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
