    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鎮星行宿</nav></header><main><article><h1>鎮星行宿</h1><p>鎮星以甲寅元始建斗，歲鎮行一宿，二十八歲而周。</p><p>鎮星以甲寅元始建斗，歲鎮行一宿，當居而弗居，其國亡土；未當居而居之，其國益地，歲熟。日行二十八分度之一，歲行十三度百一十二分度之五，二十八歲而周。</p><p><strong>所出</strong>：《淮南子 · 天文訓》 — https://zh.wikisource.org/wiki/淮南子/天文訓</p></article></main></div></div>
