    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 西方之人</nav></header><main><article><h1>西方之人</h1><p>西方之人形性與地宜</p><p>西方高土，川穀出焉，日月入焉。其人面末僂，修頸卬行，竅通於鼻，皮革屬焉，白色主肺，勇敢不仁。其地宜黍，多旄犀。</p><p><strong>所出</strong>：《淮南子 · 墜形訓》 — https://zh.wikisource.org/wiki/淮南子/墜形訓</p></article></main></div></div>
