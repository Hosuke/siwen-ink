    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 非時不出，非禮不動</nav></header><main><article><h1>非時不出，非禮不動</h1><p>君子守時待命，不合於禮義者則不出仕。</p><p>抱朴子述隱者之操曰：「非時不出，非禮不動。結褐嚼蔬，而不悒悒也。」</p><p><strong>所出</strong>：《抱朴子 · 卷20》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷20</p></article></main></div></div>
