    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 殺禮多昏</nav></header><main><article><h1>殺禮多昏</h1><p>凶荒之年弛禮制以促昏姻，育人民也。</p><p>古者國家遇凶荒之歲，則殺減禮儀而多行昏姻，會合男女之無夫家者，所以生育人民、延續國脈也。《詩》有《有狐》之篇，序云：「衞之男女失時，喪其妃耦焉，古者國有凶荒，則殺禮而多昏，會男女之無夫家者，所以育人民也。」蓋以昏禮為存亡之機，荒政所當急也。</p><p><strong>所出</strong>：《詩經 · 有狐》 — https://zh.wikisource.org/wiki/詩經/有狐</p></article></main></div></div>
