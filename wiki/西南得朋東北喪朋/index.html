    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 西南得朋，東北喪朋</nav></header><main><article><h1>西南得朋，東北喪朋</h1><p>坤之利西南則得朋，東北則喪朋，以柔道與類同行也。</p><p>坤辭曰：「利西南得朋，東北喪朋。安貞，吉。」</p><p>彖辭申之曰：「西南得朋，乃與類行；東北喪朋，乃終有慶。安貞之吉，應地无疆。」</p><p>言坤之為道，柔順以從類。西南陰方，故得朋；東北陽方，故喪朋。然喪朋者，陰不與陽爭，乃終有慶。以安貞為吉，應地无疆之德也。</p><p><strong>所出</strong>：《周易 · 坤》 — https://zh.wikisource.org/wiki/周易/坤</p></article></main></div></div>
