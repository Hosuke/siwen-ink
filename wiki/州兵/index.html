    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 州兵</nav></header><main><article><h1>州兵</h1><p>征繕以輔孺子之作法</p><p>呂甥告眾，以韓之病兵甲盡，若征繕以輔孺子以為君援，雖四鄰之聞之，喪君有君，群臣輯睦，兵甲益多。眾皆說，焉作州兵。</p><p><strong>所出</strong>：《國語 · 卷09》 — https://zh.wikisource.org/wiki/國語/卷09</p></article></main></div></div>
