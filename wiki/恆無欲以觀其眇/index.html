    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 恆無欲以觀其眇</nav></header><main><article><h1>恆無欲以觀其眇</h1><p>常守無欲，則能見道之微妙。</p><p>恆無欲也，以觀其眇。欲者，心之累也；無欲者，道之門也。欲未起，心乃虛，虛則明，明則可以觀道之妙。眇者，微也、妙也、精微之極也。欲生則蔽，蔽則無以見道；唯無欲者，虛心以待，萬理自呈，此觀道之要也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章一》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
