    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 賞無功而不誅過</nav></header><main><article><h1>賞無功而不誅過</h1><p>賞賜無功則民偷幸，不誅過錯則民易為非，亂之所由生也。</p><p>[[管仲雪桓公之恥]]，發倉囷賜貧窮，論囹圄出薄罪，三日而民歌之。或曰：管仲以雪恥為義，然賞無功，不誅過，適足以亂國。</p><p>夫賞無功則民偷幸而望於上；不誅過則民不懲而易為非。此亂之本也，安可以雪恥哉？賞罰者，治之大柄也。賞當其功則人勸，罰當其罪則人懼。賞及无功，是濫施恩澤而失信於民；罰不及過，是弛於法令而長奸宄之心。二者有一焉，已足以敗國，況兼之乎？</p><p><strong>所出</strong>：《韓非子 · 難二》 — https://zh.wikisource.org/wiki/韓非子/難二</p></article></main></div></div>
