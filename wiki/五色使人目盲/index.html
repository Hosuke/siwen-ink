    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五色使人目盲</nav></header><main><article><h1>五色使人目盲</h1><p>耽於美色則目失其明。</p><p>五色絢麗，令人目眩而盲。聖人鑒此，故絕飾采、捐文繡，不以悅目之物擾其心也。老子以目盲喻逐境之害，見色而悅，悅而貪，貪而爭，爭而亂。是故去彼目之悅，取腹之實焉。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第五十六章 為腹》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
