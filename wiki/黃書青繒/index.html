    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 黃書青繒</nav></header><main><article><h1>黃書青繒</h1><p>書符之材，黃繒為地青書為字</p><p>黃書青繒，大洞消魔玉符所用書符之材也。</p><p>經云「當黃書青繒，佩之」，言書大洞紫素左元君消魔玉符，當以黃色為地，青色為字，書於青繒之上，佩之於身，以鎮頭面之境。</p><p><strong>所出</strong>：《上清大洞真經 · 22章》 — https://zh.wikisource.org/wiki/上清大洞真經/22章</p></article></main></div></div>
