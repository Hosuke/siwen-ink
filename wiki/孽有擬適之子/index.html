    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 孽有擬適之子</nav></header><main><article><h1>孽有擬適之子</h1><p>孽擬嫡，配擬妻，廷有擬相，臣有擬主，此四者國之所危。</p><p>故曰：孽有擬適之子，配有擬妻之妾，廷有擬相之臣，臣有擬主之寵，此四者，國之所危也。</p><p><strong>所出</strong>：《韓非子 · 說疑》 — https://zh.wikisource.org/wiki/韓非子/說疑</p></article></main></div></div>
