    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 碩人之軸</nav></header><main><article><h1>碩人之軸</h1><p>賢者居陸，心地軸旋自得。</p><p>「碩人之軸」者，[[考磐]]末章言[[碩人]]居陸而心地軸旋有餘，自得其所也。軸者，事物之紐，轉而不已，言其心常自適，無往而不樂也。與首章[[碩人之寬]]、次章[[碩人之薖]]並言，而義各有當。</p><p><strong>所出</strong>：《詩經 · 考磐》 — https://zh.wikisource.org/wiki/詩經/考磐</p></article></main></div></div>
