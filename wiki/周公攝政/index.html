    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 周公攝政</nav></header><main><article><h1>周公攝政</h1><p>懼天下畔周，周公踐阼代成王攝行政當國。</p><p>周公懼天下聞武王崩而畔。周公乃踐阼代成王攝行政當國。管叔及其群弟流言於國曰：「周公將不利於成王。」周公乃告太公望、召公奭曰：「我之所以弗辟而攝行政者，恐天下畔周，無以告我先王太王、王季、文王。三王之憂勞天下久矣，於今而后成。武王蚤終，成王少，將以成周，我所以爲之若此。」</p><p><strong>所出</strong>：《史記 · 魯周公世家》 — https://zh.wikisource.org/wiki/史記/魯周公世家</p></article></main></div></div>
