    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 人彘</nav></header><main><article><h1>人彘</h1><p>呂后斷戚夫人手足，去眼煇耳，飲瘖藥，使居廁中，命曰「人彘」。</p><p>孝惠帝元年十二月，呂后怨戚夫人及其子趙王如意，乃斷戚夫人手足，去眼，煇耳，飲瘖藥，使居廁中，命曰「人彘」。居數日，乃召孝惠帝觀之。帝見而大哭，因病，歲餘不能起。</p><p><strong>所出</strong>：《史記 · 卷009》 — https://zh.wikisource.org/wiki/史記/卷009</p></article></main></div></div>
