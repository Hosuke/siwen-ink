    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 陳軫</nav></header><main><article><h1>陳軫</h1><p>陳軫諫止楚懷王絕齊之謀，料商於之地不可得、齊秦必合而患至。</p><p>楚懷王許張儀商於之地六百里，群臣皆賀，陳軫獨弔之，曰：「商於之地不可得而齊秦合，齊秦合則患必至矣。」懷王不聽，卒閉關絕約於齊。張儀至秦，詳失綏墮車不朝三月，及齊秦之交合，乃言臣有奉邑六里，非六百里。懷王大怒，興兵伐秦，大敗，割兩城以平。軫之料事，可謂審矣。</p><p><strong>所出</strong>：《史記 · 卷070》 — https://zh.wikisource.org/wiki/史記/卷070</p></article></main></div></div>
