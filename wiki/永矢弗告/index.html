    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 永矢弗告</nav></header><main><article><h1>永矢弗告</h1><p>誓不傳於人，終秘此志。</p><p>「永矢弗告」，誓辭也。言誓不以此隱居之事告語於人。</p><p>[[永矢弗告]]與[[永矢弗諼]]、[[永矢弗過]]皆出《[[考槃]]》詩。告者，語人也。弗告者，明賢者沈晦自守，不求人知，亦不炫世。三誓之中，此最幽深，蓋出處之節至此而極。</p><p><strong>所出</strong>：《詩經 · 考磐》 — https://zh.wikisource.org/wiki/詩經/考槃</p></article></main></div></div>
