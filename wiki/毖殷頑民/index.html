    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 毖殷頑民</nav></header><main><article><h1>毖殷頑民</h1><p>慎治殷之頑民，遷于洛邑。</p><p>王言「惟周公左右先王，綏定厥家，毖殷頑民，遷于洛邑」。周公所以綏安周室者，在乎毖慎治殷之頑民，遷之洛邑，密邇王室，使其漸染王化也。</p><p><strong>所出</strong>：《尚書 · 畢命》 — https://zh.wikisource.org/wiki/尚書/畢命</p></article></main></div></div>
