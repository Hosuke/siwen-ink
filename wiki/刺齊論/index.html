    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 刺齊論</nav></header><main><article><h1>刺齊論</h1><p>針刺淺深各有分限，當各止於所當止之處。</p><p>刺骨者無傷筋，刺筋者無傷肉，刺肉者無傷脈，刺脈者無傷皮，刺皮者無傷肉，刺肉者無傷筋，刺筋者無傷骨。</p><p>刺骨無傷筋者，針至筋而去，不及骨也；刺筋無傷肉者，至肉而去，不及筋也；刺肉無傷脈者，至脈而去，不及肉也；刺脈無傷皮者，至皮而去，不及脈也。所謂刺皮無傷肉者，病在皮中，針入皮中，無傷肉也；刺肉無傷筋者，過肉中筋也；刺筋無傷骨者，過筋中骨也。此之謂反也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第十四卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十四卷</p></article></main></div></div>
