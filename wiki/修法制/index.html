    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 修法制</nav></header><main><article><h1>修法制</h1><p>孟秋之月，命有司修法制，繕囹圄，禁姦邪，務搏執。</p><p>孟秋之月，命有司脩法制，繕囹圄，具桎梏，禁止姦，慎罪邪，務搏執。命理瞻傷、察創、視折、審決。斷獄訴訟，必端平。戮有罪，嚴斷刑。天地始肅，不可以贏。</p><p><strong>所出</strong>：《禮記 · 月令》 — https://zh.wikisource.org/wiki/禮記/月令</p></article></main></div></div>
