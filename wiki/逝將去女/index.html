    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 逝將去女</nav></header><main><article><h1>逝將去女</h1><p>民不堪暴政而決意離去也</p><p>詩言「逝將去女，適彼樂土」。逝者，往也。去女者，離此而去也。民被碩鼠耗剝三歲，上無惠顧之恩，下無養恤之政，故決然而去，不復留戀。蓋暴政之下，民無所恃，唯求遠害全身。其言「逝將」，見去志之決；其言「適彼」，見求生之切。此民不堪虐而求避之常情，亦見於[[樂郊]]之辭也。</p><p><strong>所出</strong>：《詩經 · 碩鼠》 — https://zh.wikisource.org/wiki/詩經/碩鼠</p></article></main></div></div>
