    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 刀筆吏不可以為公卿</nav></header><main><article><h1>刀筆吏不可以為公卿</h1><p>刀筆之吏專務深文，不可任以公卿之位。</p><p>張湯方以更定律令為廷尉，黯數質責湯於上前，曰：「公為正卿，上不能褒先帝之功業，下不能抑天下之邪心，安國富民，使囹圄空虛，二者無一焉。非苦就行，放析就功，何乃取斑皇帝約束紛更之為？公以此無種矣。」黯時與湯論議，湯辯常在文深小苛，黯伉厲守高不能屈，忿發罵曰：「天下謂刀筆吏不可以為公卿，果然。必湯也，令天下重足而立，側目而視矣！」</p><p><strong>所出</strong>：《史記 · 卷120》 — https://zh.wikisource.org/wiki/史記/卷120</p></article></main></div></div>
