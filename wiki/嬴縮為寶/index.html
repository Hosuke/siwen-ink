    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 嬴縮為寶</nav></header><main><article><h1>嬴縮為寶</h1><p>進退屈伸，合於時宜，此成功之道所寶貴者也。</p><p>成功之道，嬴縮為寶。毋亡天極，究數而止。事若未成，毋改其刑，毋失其始。靜民觀時，待令而起。</p><p><strong>所出</strong>：《管子 · 勢》 — https://zh.wikisource.org/wiki/管子/勢</p></article></main></div></div>
