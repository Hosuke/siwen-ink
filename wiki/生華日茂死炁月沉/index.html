    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 生華日茂死炁月沉</nav></header><main><article><h1>生華日茂死炁月沉</h1><p>生髮之華日日茂盛，死炁月月沉降。</p><p>生華日茂死炁月沉者，書五符、刊玉刻金之功，使生髮之華日日茂盛，而死炁則月月沉降消失。經云「脾神養光，肺神梁南，書我五符，刊玉刻金，生華日茂，死炁月沉」，言脾肺二神協力以成此效。</p><p><strong>所出</strong>：《上清大洞真經 · 31章》 — https://zh.wikisource.org/wiki/上清大洞真經/31章</p></article></main></div></div>
