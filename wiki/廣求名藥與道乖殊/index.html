    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 廣求名藥與道乖殊</nav></header><main><article><h1>廣求名藥與道乖殊</h1><p>戒不得其理而妄求外藥。</p><p>不得其理，難以妄言。竭殫家產，妻子飢貧，自古及今，好者億人，汽不諧遇，希有能成。廣求名藥，與道乖殊。</p><p>不得丹道之理，不可妄言。耗竭家產而至妻子飢貧者，代有其人。好之者億萬，而終無成就。皆因廣求外物之名藥，不知金丹之道在自己身，反與正理乖違。伯陽戒之以反求諸己，不可外求也。</p><p><strong>所出</strong>：《周易參同契 · 24章》 — https://zh.wikisource.org/wiki/周易參同契/24章</p></article></main></div></div>
