    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 乞火不若取燧</nav></header><main><article><h1>乞火不若取燧</h1><p>求法於人不如反求諸己，喻道在自立。</p><p>羿請不死之藥於西王母，姮娥竊以奔月，悵然有喪，無以續之。何則？不知不死之藥所由生也。是故[[乞火不若取燧]]，寄汲不若[[掘井|鑿井]]。申、韓、商鞅之治，[[鑿五刑]]，為[[刻削]]，乃背[[道德]]之本而爭於錐刀之末。譬如抱薪而救火，[[鑿竇而出水]]，未得其術之正也。</p><p><strong>所出</strong>：《淮南子 · 覽冥訓》 — https://zh.wikisource.org/wiki/淮南子/覽冥訓</p></article></main></div></div>
