    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 法所以制事</nav></header><main><article><h1>法所以制事</h1><p>法以制事，事以成名，難與害常相生，取其利多者為之。</p><p>法所以制事，事所以名功也。法有立而有難，權其難而事成，則立之；事成而有害，權其害而功多，則爲之。無難之法，無害之功，天下無有也。是以拔千丈之都，敗十萬之衆，死傷者軍之乘，甲兵折挫，士卒死傷，而賀戰勝得地者，出其小害、計其大利也。</p><p><strong>所出</strong>：《韓非子 · 八說》 — https://zh.wikisource.org/wiki/韓非子/八說</p></article></main></div></div>
