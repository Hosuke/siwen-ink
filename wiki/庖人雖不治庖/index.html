    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 庖人雖不治庖</nav></header><main><article><h1>庖人雖不治庖</h1><p>各安其分，尸祝不越俎而代庖人。</p><p>許由曰：「子治天下，天下既已治也。而我猶代子，吾將為名乎？名者，實之賓也，吾將為賓乎？鷦鷯巢於深林，不過一枝；偃鼠飲河，不過滿腹。歸休乎君，予無所用天下為！庖人雖不治庖，尸祝不越樽俎而代之矣。」</p><p>天下已治，則堯之功成；堯以天下讓許由，是不明分際也。名實之辨，各有其分；庖人不治，尸祝不越，此安分之義也。</p><p><strong>所出</strong>：《莊子 · 逍遙遊》 — https://zh.wikisource.org/wiki/莊子/逍遙遊</p></article></main></div></div>
