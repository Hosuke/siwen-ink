    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 知音其難哉</nav></header><main><article><h1>知音其難哉</h1><p>知音難逢，古今所歎，賤古賤今之病，作者讀者咸有之。</p><p>知音其難哉，音實難知，知實難逢，逢其知音，千載其一乎。</p><p>夫古來知音，多賤同而思古，日進前而不御，遙聞聲而相思。[[賤有以亡卑]]之病，作者有之，讀者亦有之。文章之鑒賞，作者之情與讀者之意相遇，實千古之所難也。</p><p><strong>所出</strong>：《文心雕龍 · 知音》 — https://zh.wikisource.org/wiki/文心雕龍/知音</p></article></main></div></div>
