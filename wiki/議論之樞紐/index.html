    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 議論之樞紐</nav></header><main><article><h1>議論之樞紐</h1><p>劉勰論議對之綱要以經典為本，採故實、通變、理不謬、字不妄為要。</p><p>夫動先擬議，明用稽疑，所以敬慎群務，弛張治術。故其大體所資，必樞紐經典：採故實於前代，觀通變於當今；理不謬搖其枝，字不妄舒其藻。又郊祀必洞於禮，戎事必練於兵，田穀先曉於農，斷獄務精於律。然後標以顯義，約以正辭。</p><p>文以辨潔為能，不以繁縟為巧；事以明覈為美，不以深隱為奇，此綱領之大要也。</p><p><strong>所出</strong>：《文心雕龍 · 議對》 — https://zh.wikisource.org/wiki/文心雕龍/議對</p></article></main></div></div>
