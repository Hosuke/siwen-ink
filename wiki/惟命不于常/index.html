    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 惟命不于常</nav></header><main><article><h1>惟命不于常</h1><p>天命無常，惟敬德者可以永保。</p><p>「惟命不于常」，此周公歸政成王時所作之誥辭也。天命靡常，非一成不變者；王者若能敬德，則天命眷顧；苟或不德，天命亦將移而去之。文王有明德，故能受天命以造區夏；紂無道，則天命殄之而降禍於殷。此理也，天道之正，人事之樞機。敬德則天命在我，不敬則天命去之；為人上者，可不戒哉！</p><p><strong>所出</strong>：《尚書 · 康誥》 — https://zh.wikisource.org/wiki/尚書/康誥</p></article></main></div></div>
