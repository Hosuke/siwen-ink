    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 處無為之事</nav></header><main><article><h1>處無為之事</h1><p>聖人行無為之治，不以名象動天下。</p><p>聖人處無為之事，以無名之朴化天下，不以有為擾之。[[無為之治]]非無所事事也，順自然之勢，因萬物之性，不先物而動，不先事而為，故天下自然而治。此為下文[[行不言之教]]之本。</p><p><strong>所出</strong>：《老子河上公章句 · 養身》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
