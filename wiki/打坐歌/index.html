    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 打坐歌</nav></header><main><article><h1>打坐歌</h1><p>述坐禪之法，性命雙修之要</p><p>初打坐、學參禪，消息全在玄關。秘秘綿綿調呼吸，一陰一陽鼎內煎。性要悟，命要傳，閉目觀心守本命，清淨無爲是根源。百日內，見應驗，坎中一點往上翻。黃婆其間爲媒妁，嬰兒姹女兩團圓。水火旣濟眞鉛汞，心要死，命要堅，神光照耀遍三千。子午卯酉不斷夜，早拜明師結成丹。三年九載功成就，煉成一粒紫金丹。</p><p><strong>所出</strong>：《張三丰先生全集 · 卷4》 — https://zh.wikisource.org/wiki/張三丰先生全集/卷4</p></article></main></div></div>
