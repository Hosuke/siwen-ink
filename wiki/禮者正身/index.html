    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 禮者正身</nav></header><main><article><h1>禮者正身</h1><p>禮所以正身，師所以正禮；非禮非法，非師無師。</p><p>禮者，所以正身也；師者，所以正禮也。無禮何以正身？無師，吾安知禮之爲是也？禮然而然，則是情安禮也；師云而云，則是知若師也。情安禮，知若師，則是聖人也。故非禮，是無法也；非師，是無師也。不是師法而好自用，譬之是猶以盲辨色，以聾辨聲也，舍亂妄無爲也。故學也者，禮法也。夫師，以身爲正儀而貴自安者也。</p><p><strong>所出</strong>：《荀子 · 修身篇》 — https://zh.wikisource.org/wiki/荀子/修身篇</p></article></main></div></div>
