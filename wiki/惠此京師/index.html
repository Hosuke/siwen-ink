    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 惠此京師</nav></header><main><article><h1>惠此京師</h1><p>施惠於京師也。</p><p>京師者，王之所都也。惠此京師，以綏四國——言京師者，四國之本也。本正則末正，本安則末安。京師惠則百姓安，百姓安則四方附，此王道之序也。</p><p><strong>所出</strong>：《詩經 · 民勞》 — https://zh.wikisource.org/wiki/詩經/民勞</p></article></main></div></div>
