    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天生烝民</nav></header><main><article><h1>天生烝民</h1><p>天生眾民，各具彝性，厥德本善。</p><p>天生烝民，有物有則。民之秉彝，好是懿德。</p><p>天育萬民，使之各有彝性。彝者，常也，常然之理也。秉執此彝，故人皆好善德。天監有周，昭假于下，保茲天子，生仲山甫。</p><p><strong>所出</strong>：《詩經 · 烝民》 — https://zh.wikisource.org/wiki/詩經/烝民</p></article></main></div></div>
