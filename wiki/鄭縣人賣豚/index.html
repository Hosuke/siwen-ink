    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鄭縣人賣豚</nav></header><main><article><h1>鄭縣人賣豚</h1><p>道遠日暮無暇言</p><p>鄭縣人賣豚，人問其價。曰：「道遠日暮，安暇語汝。」</p><p>鄭縣人賣豚，以道遠日暮無暇言。其言雖簡，蓋[[言各有宜]]之意，亦[[道而弗牽]]之旨也。</p><p><strong>所出</strong>：《韓非子 · 外儲說左下》 — https://zh.wikisource.org/wiki/韓非子/外儲說左下
===孫叔敖===</p></article></main></div></div>
