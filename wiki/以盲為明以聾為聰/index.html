    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以盲為明，以聾為聰，以危為安，以吉為凶</nav></header><main><article><h1>以盲為明，以聾為聰，以危為安，以吉為凶</h1><p>刺世之言，謂世道混淆，是非顛倒。</p><p>世之失道也，視聽混淆，無所分辨。美者不知佩，醜者以為喜。琁、玉、瑤、珠，與襍布、帛相雜，閭娵、子奢，莫之媒也；嫫母、力父，是之喜也。舉天下皆倒置其實，故智者無以用其察，愚者得以竊其名。末以「嗚呼上天，曷維其同」結之，蓋疾時之辭至於呼天而求也。</p><p><strong>所出</strong>：《荀子 · 賦篇》 — https://zh.wikisource.org/wiki/荀子/賦篇</p></article></main></div></div>
