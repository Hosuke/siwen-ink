    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鳴豫</nav></header><main><article><h1>鳴豫</h1><p>自鳴得意，沉溺逸樂，凶之道也。</p><p>初六居豫之始，陰柔小人，上应九四，溺於豫樂而自鳴得意。《象》曰「鳴豫，志窮凶也」——志已極則凶將至，溺於逸樂者，未有不敗者也。</p><p><strong>所出</strong>：《周易 · 豫》 — https://zh.wikisource.org/wiki/周易/豫</p></article></main></div></div>
