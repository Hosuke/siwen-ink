    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鸞鳳日遠</nav></header><main><article><h1>鸞鳳日遠</h1><p>鸞皇孔鳳日以遠去，喻賢者見疏。</p><p>鸞鳳日遠，出於《七諫 · 謬諫》。原文云：「鸞皇孔鳳日以遠兮，畜鳧鴐鵝。」夫鸞鳳者，瑞鳥也，翔翔清虛，乘雲馭風，乃賢士之象也。鳧鴐鵝者，俗禽也，畜之於堂，遊之於池，乃佞臣之象也。當堯舜之世，賢俊在位，鳳皇鳴於岐山；及衰世之朝，佞諛盈朝，鳳皇遠逝而不返。是以明主務在親賢，昏主好在近習；親賢則國治，近習則國亡，理之常也。原夫子胥諫而死，比干剖心，箕子佯狂，賢者日遠，則邦國之覆，可立而待也已。</p><p><strong>所出</strong>：《楚辭 · 七諫》 — https://zh.wikisource.org/wiki/楚辭/七諫</p></article></main></div></div>
