    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 風雅頌之辨</nav></header><main><article><h1>風雅頌之辨</h1><p>風正四方，雅化偃一國，頌容告神明，義各不同</p><p>化偃一國謂之風，風正四方謂之雅，容告神明謂之頌。風雅序人，事兼變正；頌主告神，義必純美。魯國以公旦次編，商人以前王追錄，斯乃宗廟之正歌，非讌饗之常詠。此三者體用各異，不可混也。</p><p><strong>所出</strong>：《文心雕龍 · 頌讚》 — https://zh.wikisource.org/wiki/文心雕龍/頌讚</p></article></main></div></div>
