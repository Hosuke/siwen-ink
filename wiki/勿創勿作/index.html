    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 勿創勿作</nav></header><main><article><h1>勿創勿作</h1><p>為政在順時施化，不以私意妄作。</p><p>管子對桓公問治道，曰：「勿創勿作，時至而隨。」言聖人之為政，不以私意創作法度，但順天時之自然，及其至焉。黃帝、堯、舜、禹、湯、武王之所以有而勿失者，皆循此道。創作者，違時而強為也；勿作者，因其固有而不變也。時至而隨，則事半而功倍。此聖帝明王持守基業之要術也。</p><p><strong>所出</strong>：《管子 · 第56篇桓公問》 — https://zh.wikisource.org/wiki/管子/第56篇桓公問</p></article></main></div></div>
