    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 光曜問无有</nav></header><main><article><h1>光曜問无有</h1><p>光曜能得无有，而未能无无，况无有者乎。</p><p>光曜問乎无有曰：「夫子有乎？其无有乎？」光曜不得問，而孰視其狀貌，窅然空然，終日視之而不見，聽之而不聞，搏之而不得也。</p><p>光曜曰：「至矣，其孰能至此乎！予能有无矣，而未能无无也。及為无有矣，何從至此哉！」</p><p>有无之辨，至於无无，則非光曜之所能至也。道之極致，在於視不見、聽不聞、搏不得之无有。</p><p><strong>所出</strong>：《莊子 · 知北遊》 — https://zh.wikisource.org/wiki/莊子/知北遊</p></article></main></div></div>
