    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 物或行或隨</nav></header><main><article><h1>物或行或隨</h1><p>萬物之動自然而然，有行有隨，有強有羸，皆其自然之對，非人之所能強致也。</p><p>天下之物，其性不齊。或先行而或隨後，或炅而或吹，或強而或䂳，或培而或橢。行者非必是，隨者非必非；炅者有時而善，吹者有時而利；強者不必全吉，弱者不必無功；培之者或得其正，橢之者或失其常。聖人觀此，知道之在天下，萬物各遂其性，自然而成，不假人為之增損。是以去甚、去大、去楮三者之過，歸於自然之域，無為而治也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第七十三章 自然》 — https://zh.wikisource.org/wiki/老子_(帛書校勘版)</p></article></main></div></div>
