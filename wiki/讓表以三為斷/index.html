    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 讓表以三為斷</nav></header><main><article><h1>讓表以三為斷</h1><p>辭讓之表，以三為限，不可過四。</p><p>昔晉文受冊，三辭從命，是以漢末讓表，以三為斷。曹公稱表不止三讓，又勿得浮華。蓋讓表之體，以三為節，三辭而後命從，禮之正也。逾三是為不恭，故魏武禁之。</p><p><strong>所出</strong>：《文心雕龍 · 章表》 — https://zh.wikisource.org/wiki/文心雕龍/章表</p></article></main></div></div>
