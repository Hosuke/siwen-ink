    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 洪少孤</nav></header><main><article><h1>洪少孤</h1><p>抱朴子自述年十三失父，躬耕讀書，卒遭兵火，先人典籍蕩盡。</p><p>洪生晚，為二親所嬌饒，不早見督以書史。年十有三，而慈父見背。夙失庭訓，飢寒困瘁，躬執耕穡，承星履草。又累遭兵火，先人典籍蕩盡。</p><p>農隙之暇無所讀，乃負笈徒步行借。又卒於一家，少得全部之書，益破功日伐薪以給紙筆，就營田園處，以柴火寫書。坐此之故，不得早涉藝文。</p><p>年十六，始讀《教經》、《論語》、《詩》、《易》。貧乏無以遠尋師友，孤陋寡聞，常乏紙，每所寫反覆有字，人鮮能讀也。</p><p><strong>所出</strong>：《抱朴子 · 卷52》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷52</p></article></main></div></div>
