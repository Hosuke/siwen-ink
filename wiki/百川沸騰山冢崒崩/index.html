    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 百川沸騰山冢崒崩</nav></header><main><article><h1>百川沸騰山冢崒崩</h1><p>詩言亂世之象，川沸山崩，喻禮法不行而災異並作。</p><p>《詩》云「百川沸騰，山冢崒崩；高岸為谷，深谷為陵。哀今之人，胡憯莫懲！」此傷亂世之詩也。川沸山崩，陰陽失序之象；高岸為谷，深谷為陵，升降無常之驗。詩人哀之，欲令當世之人知所戒懼而止其非，然終莫之懲，此所以為亂世也。</p><p><strong>所出</strong>：《荀子 · 君子篇》 — https://zh.wikisource.org/wiki/荀子/君子篇</p></article></main></div></div>
