    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 張三丰全集總目</nav></header><main><article><h1>張三丰全集總目</h1><p>全書八卷分目，序、傳、大道、詩文、丹經各有歸屬。</p><p>全書凡八卷：</p><p>一卷：序、誥、傳、仙派、正訛、顯蹟</p><p>二卷：古文、隱鑑</p><p>三卷：[[大道論]]、玄機直講、道言淺近</p><p>四卷：[[玄要篇]]上、玄要篇下、補遺</p><p>五卷：[[雲水前集]]、雲水後集、雲水三集</p><p>六卷：天口篇、訓世文</p><p>七卷：九皇經、三教經、度人經、菩提經、鐘偈</p><p>八卷：水石閒談、古今題贈、隱鏡、彙記</p><p><strong>所出</strong>：《張三丰先生全集 · 卷1》 — https://zh.wikisource.org/wiki/張三丰先生全集/卷1</p></article></main></div></div>
