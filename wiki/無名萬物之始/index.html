    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無名萬物之始</nav></header><main><article><h1>無名萬物之始</h1><p>無名者，天地萬物之根本。</p><p>無名，萬物之始也。萬物之生，必始於無名之地。未有天地之先，渾沌茫昧，無以名之，強名曰道。是故無名者，萬物之祖、天地之根。以其無名，故能生萬物；以其無名，故能成萬物。及其有名，萬物已兆，則無名之德隱矣。</p><p><strong>所出</strong>：《老子 (帛書本) · 章一》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
