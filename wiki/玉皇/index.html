    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 玉皇</nav></header><main><article><h1>玉皇</h1><p>泥丸真帝，列圖玉皇</p><p>玉皇，大洞經所言泥丸真帝也。</p><p>高上玉清王祝云「列圖玉皇」，言學者存思玄凝天真，泥丸靜寂，則玉皇之象列於兆身，是為泥丸真帝之號。</p><p><strong>所出</strong>：《上清大洞真經 · 22章》 — https://zh.wikisource.org/wiki/上清大洞真經/22章</p></article></main></div></div>
