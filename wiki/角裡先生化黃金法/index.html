    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 角裡先生化黃金法</nav></header><main><article><h1>角裡先生化黃金法</h1><p>以礬水石與汞成白銀，再加丹砂水曾青水雄黃水，可得上色紫磨金。</p><p>角裡先生從稷丘子所授化黃金法：</p><p>先以礬水石二分，內鐵器中，加炭火令沸，乃內汞多少自在，攪令相得，六七沸，注地上成白銀。乃取丹砂水曾青水各一分，雄黃水二分，於钅曆中加微火上令沸，數攪之，令相得，複加炭火上令沸，以此白銀內其中，多少自在，可六七沸，注地上凝，則成上色紫磨金也。</p><p><strong>所出</strong>：《抱朴子 · 卷16》 — https://zh.wikisource.org/wiki/抱朴子/卷16</p></article></main></div></div>
