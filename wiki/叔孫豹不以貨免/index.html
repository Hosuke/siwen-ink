    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 叔孫豹不以貨免</nav></header><main><article><h1>叔孫豹不以貨免</h1><p>諸侯之會衛社稷，以貨免則魯受師，寧受禍不願以私財敗公義。</p><p>樂桓子相趙文子，求貨於叔孫而為之請，使請帶焉，弗與。梁其躒曰：「貨以藩身，子何愛焉。」叔孫曰：「諸侯之會，衛社稷也。我以貨免，魯必受師。是禍之也，何衛之為？人之有牆以蔽惡也，牆之隙壞，誰之咎也？」乃裂裳帛而與使者，曰：「帶其褊矣。」趙孟聞之，曰：「臨患不忘國，忠也；思難不越官，信也；圖國忘死，貞也；謀主三者，義也。有是四者，又可戮乎？」乃請諸楚，免叔孫。</p><p><strong>所出</strong>：《春秋左氏傳 · 昭公》 — https://zh.wikisource.org/wiki/春秋左氏傳/昭公</p></article></main></div></div>
