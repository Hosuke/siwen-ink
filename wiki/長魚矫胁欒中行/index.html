    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 長魚矫胁欒中行</nav></header><main><article><h1>長魚矫胁欒中行</h1><p>長魚矫既殺三郤，復脅欒中行，言於公，欲並去之；公以尸三卿為不可，矫乃奔狄。</p><p>長魚矫既殺三郤，乃脅欒、中行而言於公曰：「不殺此二子者，憂必及君。」公曰：「一旦而尸三卿，不可益也。」對曰：「臣聞之，亂在內為宄，在外為姦，御宄以德，禦姦以刑。今治政而內亂，不可謂德。除鯁而避彊，不可謂刑。德刑不立，姦宄並至，臣脆弱，不能忍俟也。」乃奔狄。三月，厲公弒。</p><p><strong>所出</strong>：《國語 · 卷12》 — https://zh.wikisource.org/wiki/國語/卷12</p></article></main></div></div>
