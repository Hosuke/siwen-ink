    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 弛張相隨</nav></header><main><article><h1>弛張相隨</h1><p>說之樞要，在於張弛有度，相機而動。</p><p>夫說貴撫會，弛張相隨，不專緩頰，亦在刀筆。[[說]]之樞要，必使時利而義貞；進有契於成務，退無阻於榮身。弛者，放緩以伺機；張者，振起以達意。[[批逆鱗]]而功成計合，此上書之善說也。說之妙，在剛柔並濟，時機合宜。</p><p><strong>所出</strong>：《文心雕龍 · 論說》 — https://zh.wikisource.org/wiki/文心雕龍/論說</p></article></main></div></div>
