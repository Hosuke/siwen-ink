    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蒼狗為菑</nav></header><main><article><h1>蒼狗為菑</h1><p>高后見物如蒼犬據掖，卜云趙王如意為祟。</p><p>三月中，呂后祓，還過軹道，見物如蒼犬，據高后掖，忽弗復見。卜之，云趙王如意為祟。高后遂病掖傷。</p><p>【索隐述赞】有「蒼狗為菑」之句。</p><p><strong>所出</strong>：《史記 · 卷009》 — https://zh.wikisource.org/wiki/史記/卷009</p></article></main></div></div>
