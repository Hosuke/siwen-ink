    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 公食大夫禮</nav></header><main><article><h1>公食大夫禮</h1><p>記諸侯以食禮享大夫之儀節也</p><p>公食大夫之禮，諸侯饗客之盛大儀典也。其禮也，主人戒告，賓從大門入，至于廟堂；陳鼎設俎，羹定羞備；公迎于門內，大夫納賓，三揖三讓，升降酬酢。及其設食也，先羹次醢，次黍稷，次梁稻，羞羞以進，至於再三飯而禮成。又有記文，以別上下大夫之數，遠邦不親食者以幣致之義。蓋食禮與饗禮異，殺其儀而隆其敬者也。</p><p><strong>所出</strong>：《儀禮 · 公食大夫禮》 — https://zh.wikisource.org/wiki/儀禮/公食大夫禮</p></article></main></div></div>
