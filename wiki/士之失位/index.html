    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 士之失位</nav></header><main><article><h1>士之失位</h1><p>士失其位，猶諸侯失國家，皆惶惶不可終日。</p><p>周霄問曰：「古之君子仕乎？」孟子曰：「仕。傳曰：『孔子三月無君，則皇皇如也。出疆必載質。』公明儀曰：『古之人三月無君則弔。』」士之失位也，猶諸侯之失國家也。《禮》曰：「惟士無田，則亦不祭。」牲殺器皿衣服不備，不敢以祭，則不敢以宴，亦不足弔乎？古之人未嘗不欲仕也，又惡不由其道。</p><p><strong>所出</strong>：《孟子 · 滕文公下》 — https://zh.wikisource.org/wiki/孟子/滕文公下</p></article></main></div></div>
