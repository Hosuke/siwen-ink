    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 中央之人</nav></header><main><article><h1>中央之人</h1><p>中央之人形性與地宜</p><p>為人上者制羣臣百姓，通中央之人和。是以中央之人，臣主之參，制令之布於民也，必由中央之人。中央之人，以緩為急，急可以取威；以急為緩，緩可以惠民。威惠遷於下，則為人上者危矣。賢不肖之知於上，必由中央之人；財力之貢於上，必由中央之人。能易賢不肖，而可威黨於下。有能以民之財力，上陷其主，而可以勞於下。兼上下以環其私，爵制而不可加，則為人上者危矣。</p><p><strong>所出</strong>：《管子 · 第31篇君臣下》 — https://zh.wikisource.org/wiki/管子/第31篇君臣下</p></article></main></div></div>
