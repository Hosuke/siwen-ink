    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 褒姒之生</nav></header><main><article><h1>褒姒之生</h1><p>龍漦化黿，童妾孕而生褒姒，天所以亡周也。</p><p>史伯述褒姒之所從來，云：夏之衰也，褒人之神化為二龍，吐漦於王庭。卜請其漦藏之，吉。及厲王之末，漦流於庭，化為玄黿，入於王府。府之童妾未既齓而遭之，既笄而孕，當宣王時而生，不夫而育，懼而棄之。為弧服者見戮，夫婦哀而收之，逃於褒。褒人褒姁有獄，以女入於王，是為褒姒，後生伯服。史伯曰：「天之生此久矣，其為毒也大矣。」周之亡，實自此始。</p><p><strong>所出</strong>：《國語 · 卷16》 — https://zh.wikisource.org/wiki/國語/卷16</p></article></main></div></div>
