    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 振兵澤旅</nav></header><main><article><h1>振兵澤旅</h1><p>古者先振兵澤旅，然後封禪，孝武遂北巡勒兵而還祭黃帝冢。</p><p>其來年冬，上議曰：「古者先振兵澤旅，然後封禪。」乃遂北巡朔方，勒兵十餘萬，還祭黃帝冢橋山，澤兵須如。上曰：「吾聞黃帝不死，今有冢，何也？」或對曰：「黃帝已僊上天，群臣葬其衣冠。」即至甘泉，為且用事[[泰山]]，先類祠[[泰一]]。</p><p><strong>所出</strong>：《史記 · 卷012》 — https://zh.wikisource.org/wiki/史記/卷012</p></article></main></div></div>
