    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 非我族類其心必異</nav></header><main><article><h1>非我族類其心必異</h1><p>異族之心必異，雖大非吾族，豈能字我。</p><p>公欲求成于楚而叛晉，季文子曰：「不可。晉雖無道，未可叛也。國大臣睦，而邇於我，諸侯聽焉，未可以貳。史佚之志有之曰：『非我族類，其心必異。』楚雖大，非吾族也，其肯字我乎。」公乃止。</p><p><strong>所出</strong>：《春秋左氏傳 · 成公》 — https://zh.wikisource.org/wiki/春秋左氏傳/成公</p></article></main></div></div>
