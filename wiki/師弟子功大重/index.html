    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 師弟子功大重</nav></header><main><article><h1>師弟子功大重</h1><p>師弟之恩，重於父母生子之恩</p><p>[[父母生子]]之恩大矣，而師弟之功尤重。</p><p>[[父母未生子之時，愚者或但投其施於野，便著土而生草木，亦不自知當為人也。洞洞之施，亦安能言哉？遂成草木]]。</p><p>[[及乃得陰陽相合，生得成人，何於成草木乎哉]]？</p><p>[[夫人既得生，自易不事善師，反事惡下愚之師，乃教人以惡，學入邪中，或使人死滅]]。</p><p>[[身尚有余罪過，並盡其家也]]。</p><p>故[[善師學人]]者，功侔天地[[元氣]]，[[寧可謝不乎]]？</p><p><strong>所出</strong>：《太平經 · 08》 — https://zh.wikisource.org/wiki/太平經/08</p></article></main></div></div>
