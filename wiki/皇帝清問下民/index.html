    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 皇帝清問下民</nav></header><main><article><h1>皇帝清問下民</h1><p>天子當清心聽察下民之情。</p><p>皇帝清心無私，問民疾苦，雖鰥寡亦得伸其辭。惟虛心以聽，則刑罰無濫。</p><p><strong>所出</strong>：《尚書 · 呂刑》 — https://zh.wikisource.org/wiki/尚書/呂刑</p></article></main></div></div>
