    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 桂父</nav></header><main><article><h1>桂父</h1><p>象林人，時黑時白時黃時赤，常服桂及葵，以龜腦和之千丸。</p><p>桂父者，象林人也。時黑而時白，時黃而時赤，南海人見而尊事之。常服桂及葵，以龜腦和之千丸，用十斤桂。累世見之，今荊州之南尚有桂丸焉。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 3》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/3</p></article></main></div></div>
