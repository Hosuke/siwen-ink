    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鄭景世</nav></header><main><article><h1>鄭景世</h1><p>潛山人，晉初受仙人孟德然口傳入山守五臟含日法，兼服胡麻玄丹，晉永和元年北玄老太一迎以雲轎昇天。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 17》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/17</p></article></main></div></div>
