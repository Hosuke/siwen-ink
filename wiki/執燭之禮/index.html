    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 執燭之禮</nav></header><main><article><h1>執燭之禮</h1><p>昏時燃燭執事，錯總遠近以承火，右手秉燭，左手正櫛，交坐毋倍尊者。</p><p>昏將舉火之時，弟子執燭隅坐。錯總之法，橫於坐所，以為燭柄之度。櫛之遠近，乃承厥火，使燭明不絕。居句如矩，蒸間容蒸，火焰然者處下，捧椀以為緒，無令傾墮。</p><p>右手執燭，左手正櫛，不敢以左手障火而怠於正容。有墮代燭之交坐者，交相更代，毋倍尊者，恒使燭火明亮，以待師教。</p><p>乃取厥櫛，逐一傳遞，遂出是去，不留火燭於室中。</p><p><strong>所出</strong>：《管子 · 第59篇弟子職》 — https://zh.wikisource.org/wiki/管子/第59篇弟子職</p></article></main></div></div>
