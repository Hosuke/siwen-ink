    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 其樂只且</nav></header><main><article><h1>其樂只且</h1><p>疊言其樂，感歎之辭</p><p>「其樂只且」，句末語辭，疊言「只且」以見樂之至也。舊說「只且」，語助詞，猶今言「之甚」。《詩經》屢用此辭，如《衛風·頍弁》「樂酒今夕君子維宴」之屬。此詩言「其樂只且」，看似樂甚，實寓悲焉，蓋亂世全身之樂，非真樂也。</p><p><strong>所出</strong>：《詩經 · 君子陽陽》 — https://zh.wikisource.org/wiki/詩經/君子陽陽</p></article></main></div></div>
