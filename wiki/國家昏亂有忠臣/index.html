    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 國家昏亂有忠臣</nav></header><main><article><h1>國家昏亂有忠臣</h1><p>國有昏亂而後忠臣之節見</p><p>國家昏亂，有忠臣。當夫[[六親不和有孝慈]]之時，是為家道之衰；及其至於[[智慧出有大偽]]、姦邪得志、綱紀廢弛，則[[大道廢有仁義]]之道不行，而亂亡之患起矣。亂亡之世，乃有仗節死義之臣，以扶社稷、衛君親，非平日之所貴，乃亂世之所見也。忠臣之名，生於昏亂之時，非人臣之常然也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 十八章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
