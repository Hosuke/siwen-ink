    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 饁彼南畝</nav></header><main><article><h1>饁彼南畝</h1><p>農忙之時，送食至田</p><p>以其婦子，饁彼南畝。言曾孫之君親往省耕，率其妻子以送食於南畝也。[[籍田禮]]云「王親耕」，《月令》「天子帥三公九卿以躬耕」，皆此意。詩人美其君民同力。</p><p><strong>所出</strong>：《詩經 · 大田》 — https://zh.wikisource.org/wiki/詩經/大田</p></article></main></div></div>
