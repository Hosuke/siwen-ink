    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 姦臣譎主</nav></header><main><article><h1>姦臣譎主</h1><p>姦臣以譎術欺弄人主以便其私。</p><p>故當世之重臣，主變勢而得固寵者，十無二三。是其故何也？人臣之罪大也。臣有大罪者，其行欺主也，其罪當死亡也。</p><p>大臣挾愚汙之人，上與之欺主，下與之收利侵漁，朋黨比周，相與一口，惑主敗法，以亂士民，使國家危削，主上勞辱，此大罪也。</p><p><strong>所出</strong>：《韓非子 · 孤憤》 — https://zh.wikisource.org/wiki/韓非子/孤憤</p></article></main></div></div>
