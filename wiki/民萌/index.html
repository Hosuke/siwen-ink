    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 民萌</nav></header><main><article><h1>民萌</h1><p>散公財悅百姓以塞主之術</p><p>姦臣成姦之一術。散公財以悅民人，行小惠以取百姓，使朝廷市井皆勸譽己，以塞其主而成其所欲。[[八姦]]之五，[[養殃]]之流也。</p><p><strong>所出</strong>：《韓非子 · 八奸》 — https://zh.wikisource.org/wiki/韓非子/八奸</p><hr><p>猾民愈眾，奸邪滿側。故曰：毋富人而貸焉。</p><p><strong>所出</strong>：《韓非子 · 揚榷》 — https://zh.wikisource.org/wiki/韓非子/揚榷</p></article></main></div></div>
