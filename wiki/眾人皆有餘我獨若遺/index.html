    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 眾人皆有餘而我獨若遺</nav></header><main><article><h1>眾人皆有餘而我獨若遺</h1><p>俗有餘而道若匱，聖人以此自守。</p><p>眾人皆有餘，而我獨若遺。遺者，失也，匱也。世俗之人，貪多務得，積財粟以自盈；聖人則泊然若不足者然。不以有餘自矜，故能長保其無餘之得；眾人之有餘，正其所以不能常保者也。</p><p><strong>所出</strong>：《老子河上公章句 · 異俗》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
