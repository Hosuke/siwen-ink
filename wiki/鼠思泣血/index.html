    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鼠思泣血</nav></header><main><article><h1>鼠思泣血</h1><p>悲痛之甚，如鼠之憂，如泣血之哀也。</p><p>「鼠思泣血，無言不疾。」鼠思者，憂思也，蟲之憂惙。泣血者，悲痛之極也。詩人追念昔日大夫離居王都之事，言我中心之思，如鼠之忡忡，泣盡而血隨之出也。疾，病也。時人之言，我聞之無一不病，言被讒之深、受害之酷也。</p><p><strong>所出</strong>：《詩經 · 雨無正》 — https://zh.wikisource.org/wiki/詩經/雨無正</p></article></main></div></div>
