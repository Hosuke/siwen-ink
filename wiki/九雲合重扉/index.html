    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 九雲合重扉</nav></header><main><article><h1>九雲合重扉</h1><p>九雲合沓，重重門扉，帝君所居。</p><p>九雲合重扉者，彭室帝君之丹室也。經云「霞中有彭室帝君室，九雲合重扉」，言九色之雲交合，重重門扉之內，帝君幽密而處焉。</p><p><strong>所出</strong>：《上清大洞真經 · 31章》 — https://zh.wikisource.org/wiki/上清大洞真經/31章</p></article></main></div></div>
