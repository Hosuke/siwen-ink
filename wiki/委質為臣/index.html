    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 委質為臣</nav></header><main><article><h1>委質為臣</h1><p>稱人臣委質事君，有道、無道之臣由此而分。</p><p>管子論有道之臣曰「委質為臣，不賓事左右」；論無道之臣亦曰「委質為臣，賓事左右」。同一委質，而賢姦分焉。不賓事左右者，以道義為準；賓事左右者，以私好呢為歸。委質之義同，而所以委者異，其終遂判有道、無道之臣矣。</p><p><strong>所出</strong>：《管子 · 第33篇四稱》 — https://zh.wikisource.org/wiki/管子/第33篇四稱</p></article></main></div></div>
