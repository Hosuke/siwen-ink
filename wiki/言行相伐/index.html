    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 言行相伐</nav></header><main><article><h1>言行相伐</h1><p>口稱靜退而心希榮利，言行相反，士行之弊也。</p><p>《抱朴子》論郭林宗，斥其「言行相伐」之弊。言林宗者，口稱靜退，心希榮利；自謂棲神巖岫，優遊卒歲，而實則周旋京邑，交關貴遊，席不暇溫，欲慕孔墨棲棲之事。自炫自媒，求名而不退讓，是士女之所醜，而亦林宗之所以蔽於自量也。抱朴子以為，自炫自媒，士女之醜事；知其不可而尤效尤師，烏足以言道哉！</p><p><strong>所出</strong>：《抱朴子 · 卷46》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷46</p></article></main></div></div>
