    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 動無非法</nav></header><main><article><h1>動無非法</h1><p>動無非法者，所以禁過而外私</p><p>治國使眾莫如法，禁淫止暴莫如刑。百官之事，案之以法，則姦不生；暴慢之人，誅之以刑，則禍不起。禁姦之法，先立法度，賞罰必信。
<strong>所出</strong>：《管子 · 第67篇明法解》 — https://zh.wikisource.org/wiki/管子/第67篇明法解</p></article></main></div></div>
