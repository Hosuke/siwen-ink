    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 內皇</nav></header><main><article><h1>內皇</h1><p>身中之皇，居內以馭萬神。</p><p>子存內皇與我遊，言存守身中之皇，皇者心神也，與我相與遨遊。修真者心存一神，內照黃庭，皇神居中為主，則萬神皆從，内外渾融矣。</p><p><strong>所出</strong>：《黃庭內景經 · 上睹章第十六》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/上睹章第十六</p></article></main></div></div>
