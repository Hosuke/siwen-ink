    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 西人之子，粲粲衣服</nav></header><main><article><h1>西人之子，粲粲衣服</h1><p>西人之子衣著華美</p><p>粲粲，鮮明之美也。西人之子，與東人相對而言，蓋周京之子弟也。粲粲衣服，言其衣著之美華，與東人杼柚其空者，適成一怨。</p><p><strong>所出</strong>：《詩經 · 大東》 — https://zh.wikisource.org/wiki/詩經/大東</p></article></main></div></div>
