    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 安貞之吉</nav></header><main><article><h1>安貞之吉</h1><p>安於正固，則吉。坤德柔順，應地无疆。</p><p>坤辭曰：「安貞，吉。」</p><p>彖辭曰：「安貞之吉，應地无疆。」</p><p>言坤之為道，柔順而安於正固，則得其吉。此德合乎地，無疆界之限量也。</p><p><strong>所出</strong>：《周易 · 坤》 — https://zh.wikisource.org/wiki/周易/坤</p></article></main></div></div>
