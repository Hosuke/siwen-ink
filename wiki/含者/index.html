    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 含者</nav></header><main><article><h1>含者</h1><p></p><p><strong>含者</strong>，古禮中執璧以含於亡者之官，與襚者、赗者並為喪禮之重要儀式官。《禮記 · 雜記上》詳載其儀節。</p><p>  含者入，升堂，致命云：「寡君使某含。」再拜稽顙。含者坐委於殯東南，有葦席；既葬，蒲席。降，出，反位。</p><p>  含禮起源甚古，《周禮 · 天官》載「典瑞」掌玉器之藏，大喪共飯玉、含玉。含玉者，飯含之物，以玉為之，納於死者口中。古人重含，以為魂魄之所依。</p><p>  宰朝服，即喪屨，升自西階，西面，坐取璧，降自西階以東。此言含後，宰人收璧之儀。璧為含之媒介，含後則歸於宰府。</p></article></main></div></div>
