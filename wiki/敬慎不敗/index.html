    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 敬慎不敗</nav></header><main><article><h1>敬慎不敗</h1><p>敬慎以處患難，終可不敗。</p><p>九三「需于泥，致寇至」，象曰「自我致寇，敬慎不敗」。寇非外至，乃自招也。以剛強之質，躁動於危地，逼近於寇，故致寇至。然聖人察此，明致寇之由於我，而救敗之方亦在於我。敬慎者，心存敬畏，動皆審諦，不敢輕忽也。使我敬慎有加，小心翼翼，則雖處危難之境，終可不至於敗。需之道，在乾健而不輕進，坎險而能敬守，故曰敬慎不敗。</p><p><strong>所出</strong>：《周易 · 需》 — https://zh.wikisource.org/wiki/周易/需</p></article></main></div></div>
