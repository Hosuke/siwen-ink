    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 宗經</nav></header><main><article><h1>宗經</h1><p>尊崇六經，以為文章之本</p><p>宗經者，劉勰論文之本旨也。夫經也者，恆久之至道，不刊之鴻教也。三極彝訓，其書曰經。象天地，效鬼神，忝物序，制人紀，洞性靈之奧區，極文章之骨髓者也。自夫子刊述，而大寶咸耀。《易》張《十翼》，《書》標七觀，《詩》列四始，《禮》正五經，《春秋》五例，義極乎性情，辭匠於文理，故能開學養正，昭明有融。辭約而旨豐，事近而喻遠，往者雖舊，餘味日新。是以論文者，必稟經以製式，酌雅以富言。山有土壤，不匱江河；經有本源，不竭文思也。</p><p><strong>所出</strong>：《文心雕龍 · 宗經》 — https://zh.wikisource.org/wiki/文心雕龍/宗經</p></article></main></div></div>
