    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 克庸祗德</nav></header><main><article><h1>克庸祗德</h1><p>蔡仲能用敬德，周公任之以卿士。</p><p>惟周公位冢宰，正百工。群叔流言，乃致辟管叔于商，囚蔡叔于郭鄰，以車七乘；降霍叔于庶人，三年不齒；蔡仲克庸祗德，周公以為卿士。叔卒，乃命諸王邦之蔡。</p><p>蔡仲能敬慎其德，周公因而用之，以為卿士。此[[明德慎罰]]之遺意也。</p><p><strong>所出</strong>：《尚書 · 蔡仲之命》 — https://zh.wikisource.org/wiki/尚書/蔡仲之命</p></article></main></div></div>
