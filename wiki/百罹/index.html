    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 百罹</nav></header><main><article><h1>百罹</h1><p>極言祸患之繁多</p><p>「百罹」見於[[兔爰]]首章「逢此百罹」。罹，遭也。詩人自言我生之初，天下尚[[尚寐無吪|無為]]，及我生之後，值此百般患難。「百」者，虛數，言其多也；「罹」者，憂患交集之名。《詩》言「百罹」，狀亂世加諸君子之祸患至繁且重也。</p><p><strong>所出</strong>：《詩經 · 兔爰》 — https://zh.wikisource.org/wiki/詩經/兔爰</p></article></main></div></div>
