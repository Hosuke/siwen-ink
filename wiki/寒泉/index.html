    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 寒泉</nav></header><main><article><h1>寒泉</h1><p>寒泉在浚之下，以興母氏勞苦而子不得慰。</p><p>「爰有寒泉，在浚之下，有子七人，母氏勞苦。」</p><p>爰，發語詞。一說指何處。寒泉在浚之下，清冽無已，以興母氏之勞苦無盡。浚者，衞國地名。詩以寒泉之冽，比母氏之苦；泉能解暑，而子無以解母之勞，是七子所以自責也。</p><p><strong>所出</strong>：《詩經 · 凱風》 — https://zh.wikisource.org/wiki/詩經/凱風</p></article></main></div></div>
