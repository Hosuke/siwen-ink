    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大贏如炳</nav></header><main><article><h1>大贏如炳</h1><p>至盈若闕，至贏若絀，反盈虛之道也</p><p>大盈若缺，大贏若炳，與大成若缺、大盈若沖、大直如詘、大巧如拙相類，皆明聖人德盛而不自矜，反以闕陋示人。</p><p>「贏」者，有餘也；「炳」者，光明也。「大贏如炳」，言至盈者若昭昭然有餘，而其用在若闇昧不足。此與「滿招損謙受益」之旨相通，而辭異而義一。聖人富有天下而若無能，功參造化而若不足，此道之所以為大也。</p><p>帛書本「炳」字，通行本或作「紬」，義皆言其闇然而不外見也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章四十五》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
