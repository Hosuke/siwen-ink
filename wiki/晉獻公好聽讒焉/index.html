    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 晉獻公好聽讒焉</nav></header><main><article><h1>晉獻公好聽讒焉</h1><p>刺人主信讒之辭，詩《采苓》之意也。</p><p>晉獻公好聽讒焉一言，乃《采苓》之序說，揭明詩旨所在。獻公，晉武公之子，名詭諸，在位二十六年，兼並十七國，拓地甚廣，然好用讒言，卒致驪姬之亂，太子申生蒙冤，公子重耳、夷吾出奔，晉國大亂。</p><p>詩人刺之，作《采苓》，以戒聽讒。意謂人主苟好聽人之言，而不察其真偽，則偽言日至，賢者日退，國將危亡。獻公之事，後世之鑒也。</p><p><strong>所出</strong>：《詩經 · 采苓》 — https://zh.wikisource.org/wiki/詩經/采苓</p></article></main></div></div>
