    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以文學非之，以私行矫之</nav></header><main><article><h1>以文學非之，以私行矫之</h1><p>亂世之民以文學非毀國令，以私意變更國法。</p><p>亂世則不然：主有令，而民以文學非之；官府有法，而民以私行矫之。主有令當奉行也，而以文學非毀之，是不从令也；官府有法當遵守也，而以私行變更之，是不服法也。上之所以令者益不行，下之所以守法者益壞，則其國從可知矣。</p><p><strong>所出</strong>：《韓非子 · 問辯》 — https://zh.wikisource.org/wiki/韓非子/問辯</p></article></main></div></div>
