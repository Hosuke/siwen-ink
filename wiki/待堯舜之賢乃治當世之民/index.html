    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 待堯舜之賢乃治當世之民</nav></header><main><article><h1>待堯舜之賢乃治當世之民</h1><p>待粱肉救餓，與待堯舜治民，同一迂闊。</p><p>百日不食以待粱肉，餓者不活；今待堯舜之賢乃治當世之民，是猶待粱肉而救餓也。</p><p>夫待越人之善海遊者以救中國之溺人，越人善遊矣，而溺者不濟矣。此理之必然也。</p><p>故[[良馬固車臧獲御之]]之喻，善御非必待王良，五十里而一置，中手御之，追速致遠，可日致千里，何必[[待古之王良]]乎？</p><p><strong>所出</strong>：《韓非子 · 難勢》 — https://zh.wikisource.org/wiki/韓非子/難勢</p></article></main></div></div>
