    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 仁者講功</nav></header><main><article><h1>仁者講功</h1><p>仁者評人之功，智者辨物之理；無功而祀，非仁也。</p><p>展禽論祀「爰居」非政之宜，曰：「夫仁者講功，而智者處物。無功而祀之，非仁也；不知而不能問，非智也。今茲海其有災乎？夫廣川之鳥獸，恆知避其災也。」</p><p><strong>所出</strong>：《國語 · 卷04》 — https://zh.wikisource.org/wiki/國語/卷04</p></article></main></div></div>
