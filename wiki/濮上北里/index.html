    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 濮上北里</nav></header><main><article><h1>濮上北里</h1><p>批判淫聲艷色日夕不休，流連羽觴，沈淪弦節。</p><p>淫音噪而惑耳，羅袂揮而亂目，濮上北裏，叠奏叠起；或號或呼，俾晝作夜。流連於羽觴之間，沈淪乎弦節之側。</p><p><strong>所出</strong>：《抱朴子 · 卷04》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷04</p></article></main></div></div>
