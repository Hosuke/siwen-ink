    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 誄者累也</nav></header><main><article><h1>誄者累也</h1><p>誄者，累列德行，以旌其人，期於不朽。</p><p>誄者，累也。累其德行，旌之不朽也。周世盛德，有銘誄之文。大夫之材，臨喪能誄。又賤不誄貴，幼不誄長，在萬乘則稱天以誄之。讀誄定謚，其節文大矣。</p><p>詳夫誄之為制，蓋選言錄行，傳體而頌文，榮始而哀終。論其人也，曖乎若可覿；道其哀也，淒焉如可傷。此其旨也。</p><p><strong>所出</strong>：《文心雕龍 · 誄碑》 — https://zh.wikisource.org/wiki/文心雕龍/誄碑</p></article></main></div></div>
