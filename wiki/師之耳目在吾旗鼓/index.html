    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 師之耳目在吾旗鼓</nav></header><main><article><h1>師之耳目在吾旗鼓</h1><p>將帥以旗鼓為節，師之耳目所繫，不可因病而廢。</p><p>鞍之戰，郤克傷於矢，血流及屨，未絕鼓音，曰：「余病矣。」張侯曰：「自始合，而矢貫余手及肘，余折以御，左輪朱殷，豈敢言病。吾子忍之。」緩曰：「自始合，苟有險，余必下推車，子豈識之。然子病矣。」張侯曰：「師之耳目，在吾旗鼓，進退從之。此車，一人殿之，可以集事。若之何其以病敗君之大事也。擐甲執兵，固即死也。病未及死，吾子勉之。」</p><p><strong>所出</strong>：《春秋左氏傳 · 成公》 — https://zh.wikisource.org/wiki/春秋左氏傳/成公</p></article></main></div></div>
