    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 菁菁者莪</nav></header><main><article><h1>菁菁者莪</h1><p>賢才蒙君子化育，詩人遇之而喜，心遂休焉</p><p>菁菁者莪，在彼中阿。既見君子，樂且有儀。
菁菁者莪，在彼中沚。既見君子，我心則喜。
菁菁者莪，在彼中陵。既見君子，錫我百朋。
汎彼柏舟，載沈載浮。既見君子，我心則休。</p><p>此詩以菁菁之莪蒿起興，言其在阿、在沚、在陵，無所不宜，以喻賢才得所養育也。遇君子則喜而心休，蓋以君子之德足以安定人心也。末章以舟之沈浮喻才士之浮沈，益顯君子庇蔭之恩。</p><p><strong>所出</strong>：《詩經 · 菁菁者莪》 — https://zh.wikisource.org/wiki/詩經/菁菁者莪</p></article></main></div></div>
