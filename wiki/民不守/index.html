    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 民不守</nav></header><main><article><h1>民不守</h1><p>賞罰之利出於十空，則民無所適從，國之紀綱盡壞。</p><p>韓非言賞罰利出一空無敵、二空兵半用，又言「利出十空者，民不守」。十空者，言其多也。賞罰之柄散於多方，姦者得利而無罰，勇者受賞而無定，則民不知所趨，國不知所令。上下皆無所恃，而亂將至矣。是故賞罰必專必一，乃可以守國也。</p><p><strong>所出</strong>：《韓非子 · 飭令》 — https://zh.wikisource.org/wiki/韓非子/飭令</p></article></main></div></div>
