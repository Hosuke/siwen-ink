    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 四時周反始</nav></header><main><article><h1>四時周反始</h1><p>四時迭運，終則返始，迭迭循之無已。</p><p>四時者，春夏秋冬也。迭而為歲，終則返始，迭迭循之，是天地之大法。</p><p>文云「比若四時周反始」，言師法之傳，如四時之迭運，有始有終，終則復始，
迭迭相傳而無已時也。四時者，陽之升降、氣之消息，皆循此道。
聖人體此以施教化，故能無終無始，與天地同其功焉。</p><p><strong>所出</strong>：《太平經 · 06》 — https://zh.wikisource.org/wiki/太平經/06</p></article></main></div></div>
