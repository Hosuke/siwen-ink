    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 民不心服體從</nav></header><main><article><h1>民不心服體從</h1><p>民心不服形體不從，則禮義之文教不可得而行。</p><p>[[聖人期於利民]]者，非徒施政令而已。夫民不心服體從，則不可以禮義之文教也。民躁而行僻，則賞不可以不厚、禁不可以不重。[[賞足以使威足以勝]]，然後下從。故[[聖人守此萬物化]]之要在於此。</p><p><strong>所出</strong>：《管子 · 第47篇正世》 — https://zh.wikisource.org/wiki/管子/第47篇正世</p></article></main></div></div>
