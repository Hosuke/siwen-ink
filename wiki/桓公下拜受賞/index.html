    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 桓公下拜受賞</nav></header><main><article><h1>桓公下拜受賞</h1><p>葵丘之會，天子致胙，辭以毋下拜，桓公終下拜受賞，守臣節。</p><p>葵丘之會，天子使大夫宰孔致胙於桓公，曰：「余一人之命，有事於文武，使宰孔致胙。」且有後命曰：「以爾自卑勞，實謂爾伯舅，毋下拜。」桓公召管仲而謀，對曰：「為君不君，為臣不臣，亂之本也。」桓公懼，出見宰孔曰：「天威不違顏咫尺，小白承天子之命而毋下拜，恐顛蹶於下，以為天子羞。」遂下拜，登受賞。服大路，龍旗九游，渠門赤旂。天子致胙而桓公不受，天下諸侯稱順焉。</p><p><strong>所出</strong>：《管子 · 第20篇小匡》 — https://zh.wikisource.org/wiki/管子/第20篇小匡</p></article></main></div></div>
