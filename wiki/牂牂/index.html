    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 牂牂</nav></header><main><article><h1>牂牂</h1><p>楊葉盛貌</p><p>牂牂，《說文》：「牂，牂牂也。」狀物之盛也。《東門之楊》云「其葉牂牂」，言楊樹之葉盛密也。《說文》段注以為「木盛皃」，即林木蔥茂之貌。</p><p>牂牂與「肺肺」義近，皆疊字聯綿，以狀葉之繁多。二章迭詠，正見其時節之移而楊葉未改，唯候者之心愈切耳。</p><p><strong>所出</strong>：《詩經 · 東門之楊》 — https://zh.wikisource.org/wiki/詩經/東門之楊</p></article></main></div></div>
