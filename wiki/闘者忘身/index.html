    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 闘者忘身</nav></header><main><article><h1>闘者忘身</h1><p>闘毆之人，忘身、忘親、忘君，其行連犬豕不如。</p><p>闘者，忘其身者也，忘其親者也，忘其君者也。行其少頃之怒而喪終身之軀，然且為之，是忘其身也；家室立殘，親戚不免乎刑戮，然且為之，是忘其親也；君上之所惡也，刑法之所大禁也，然且為之，是忘其君也。憂忘其身，內忘其親，上忘其君，是刑法之所不舍也，聖王之所不畜也。</p><p><strong>所出</strong>：《荀子 · 榮辱篇》 — https://zh.wikisource.org/wiki/荀子/榮辱篇</p></article></main></div></div>
