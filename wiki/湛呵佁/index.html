    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 湛呵佁</nav></header><main><article><h1>湛呵佁</h1><p>道隱而若存，不可以形名求。</p><p>湛呵佁或存。道之在人，若湛若昧，若存若亡，不可得而名之。以其體隱而難測，故曰佁或存也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章四》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
