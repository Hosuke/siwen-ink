    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 明主治事必行</nav></header><main><article><h1>明主治事必行</h1><p>明主知治而必行，雖拂民心，亦立其治。</p><p>人主者，明能知治，嚴必行之，故雖拂於民，必立其治。</p><p><strong>所出</strong>：《韓非子 · 南面》 — https://zh.wikisource.org/wiki/韓非子/南面</p></article></main></div></div>
