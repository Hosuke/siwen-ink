    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 上大夫庶羞</nav></header><main><article><h1>上大夫庶羞</h1><p>食禮隆殺之等，上大夫羞多於下大夫也</p><p>記文明上下大夫食禮之別。上大夫八豆、八簋、六铏、九俎，下大夫則若七若九；魚腊皆二俎。上大夫庶羞二十品，加於下大夫，以雉、兔、鹑、鴽為品物之別。羞之東西毋過四列，皆有大小之蓋。所以嚴尊卑之分、明隆殺之等者也。</p><p><strong>所出</strong>：《儀禮 · 公食大夫禮》 — https://zh.wikisource.org/wiki/儀禮/公食大夫禮</p></article></main></div></div>
