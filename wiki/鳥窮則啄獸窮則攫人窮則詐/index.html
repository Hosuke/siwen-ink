    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鳥窮則啄，獸窮則攫，人窮則詐</nav></header><main><article><h1>鳥窮則啄，獸窮則攫，人窮則詐</h1><p>物極必反，人迫於困則生奸欺。</p><p>顏淵論東野畢之馭曰：「臣聞之：鳥窮則啄，獸窮則攫，人窮則詐。自古及今，未有窮其下而能無危者也。」言人主若迫民至極，則民必生奸欺以應之，未有能免於危亡者。</p><p><strong>所出</strong>：《荀子 · 哀公篇》 — https://zh.wikisource.org/wiki/荀子/哀公篇</p></article></main></div></div>
