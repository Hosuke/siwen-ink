    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 碩人</nav></header><main><article><h1>碩人</h1><p>碩大之德之人，隱居者是也。</p><p>[[碩人]]者，德碩道大之稱。[[考磐]]詩三章皆言[[碩人]]之居之樂。首章言「[[碩人之寬]]」，次章言「[[碩人之薖]]」，末章言「[[碩人之軸]]」。是人也，退而窮處，不累於世，而自得於山水之間焉。毛詩序云「使賢者退而窮處」，則[[碩人]]即所指刺莊公而退之賢者。</p><p><strong>所出</strong>：《詩經 · 考磐》 — https://zh.wikisource.org/wiki/詩經/考磐</p></article></main></div></div>
