    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 公子慶父出奔莒</nav></header><main><article><h1>公子慶父出奔莒</h1><p>慶父弒君之賊，懼誅而出奔。</p><p>閔公二年九月，「公子慶父出奔莒」。慶父者，魯莊公之庶弟，閔公之庶叔也。閔公遇弒，夫人姜氏出奔，而慶父以弒君之罪，懼魯人之誅，乃出奔於莒。《公羊》書「出奔」，著其奔亡以避刑罰，為天下後世戒。慶父之亂，魯之大患，《春秋》正名其罪，以為人臣之戒。</p><p><strong>所出</strong>：《春秋公羊傳 · 閔公》 — https://zh.wikisource.org/wiki/春秋公羊傳/閔公</p></article></main></div></div>
