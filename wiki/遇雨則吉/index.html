    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 遇雨則吉</nav></header><main><article><h1>遇雨則吉</h1><p>睽孤見豕載鬼，先張弧後說弧，往遇雨則吉，群疑亡也。</p><p>「遇雨則吉」者，睽卦上九之辭也。上九以陽處睽極，睽孤之甚，見豕負涂、載鬼一車，疑心大起，先張弧而欲射，後說弧而始悟。《象》曰「遇雨之吉，群疑亡也」，蓋睽之極則疑生，疑生於不明；雨者，陰陽和暢之象，往遇之則群疑盡消，而吉斯至矣。</p><p><strong>所出</strong>：《周易 · 睽》 — https://zh.wikisource.org/wiki/周易/睽</p></article></main></div></div>
