    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 正而後行</nav></header><main><article><h1>正而後行</h1><p>治外者有為之治，正己者無為之治也。</p><p>接輿謂肩吾曰：「聖人之治也，治外乎？正而後行，確乎能其事者而已矣。」又以鳥高飛避繒弋、鼷鼠深穴避熏鑿為喻，謂世人連蟲鼠之智亦無，烏足以言治？</p><p>夫正而後行者，先正己而後施化也。己不正而欲正人，未之有也。治外者，以法度繩天下，是涉海鑿河也；正己者，以德化風天下，是游泳自如也。正己之極，化及鳥獸，況於人乎？</p><p><strong>所出</strong>：《莊子 · 應帝王》 — https://zh.wikisource.org/wiki/莊子/應帝王</p></article></main></div></div>
