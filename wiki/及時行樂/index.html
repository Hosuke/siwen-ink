    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 及時行樂</nav></header><main><article><h1>及時行樂</h1><p>當及時行樂，勿失良辰。</p><p>及時行樂，[[詩經·車鄰]]之旨也。詩云：「今者不樂，逝者其耋」「今者不樂，逝者其亡。」言光陰荏苒，年華易逝，若不及時行樂，則老大傷悲，後悔無及。其義與[[汔可小安]]相近，而辭意更切，蓋死生之大，言之深也。詩人欲人及時宴樂，勿失良辰。</p><p><strong>所出</strong>：《詩經 · 車鄰》 — https://zh.wikisource.org/wiki/詩經/車鄰</p></article></main></div></div>
