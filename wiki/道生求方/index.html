    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 道生求方</nav></header><main><article><h1>道生求方</h1><p></p><p>道生感父遺言，遂不肯仕，周行天下求解此方。到江夏遇博澤先生。先生曰：「此乃非神丹金玉，可使人得數百年而已。」具為說解其方意所用物真名。道生合藥，服之，得壽三百七十歲，入雞頭山，不知竟得道不。同時卓元成、張子仁、吳士耳、蔡子盛、魏仲明、張元達服之，或得三百歲，或得五百歲，皆至死不病，不傴，面不皺理，齒不落，發不白。</p><p><strong>所出</strong>：《神仙傳 · 卷六》 — https://zh.wikisource.org/wiki神仙傳/卷六</p></article></main></div></div>
