    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 與人不求備</nav></header><main><article><h1>與人不求備</h1><p>取人之善，寬以待之。</p><p>伊尹述先王之德，曰：「與人不求備，檢身若不及。」言聖王之待人也，取其善而不責其全；檢己之身，常若有闕，惟恐不能進於善德。此成湯所以得人者也。蓋[[赦過宥罪]]之謂與？亦[[德者核理而普至]]之義。</p><p><strong>所出</strong>：《尚書 · 伊飼》 — https://zh.wikisource.org/wiki/尚書/伊訓</p></article></main></div></div>
