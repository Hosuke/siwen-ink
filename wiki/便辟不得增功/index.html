    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 便辟不得增功</nav></header><main><article><h1>便辟不得增功</h1><p>近習便辟之臣，不得因其親昵而妄加其功。</p><p>便辟、左右、大族、尊貴、大臣，不得增其功焉。疏遠、卑賤、隱不知之人，不忘其勞。故有罪者不怨上，愛賞者無貪心，則列陳之士，皆輕其死而安難，以要上事，本兵之極也。</p><p><strong>所出</strong>：《管子 · 四傷百匿》 — https://zh.wikisource.org/wiki/管子/七法/四傷百匿</p></article></main></div></div>
