    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 至日閉關</nav></header><main><article><h1>至日閉關</h1><p>冬至之日閉關謝客，商旅不行，後不省方，以順天時。</p><p>雷在地中，復。先王以至日閉關，商旅不行，后不省方。</p><p>冬至陽氣始萌，陽主生，故先王順其時而閉關。商旅不行，後不省方者，斂藏以待生機也。[[雷在地中]]，象陽氣潛萌於地中。</p><p><strong>所出</strong>：《周易 · 復》 — https://zh.wikisource.org/wiki/周易/復</p></article></main></div></div>
