    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以蕩陵德實悖天道</nav></header><main><article><h1>以蕩陵德實悖天道</h1><p>恃貴而陵轢有德，悖天之道，必致敗亡。</p><p>王引古語「世祿之家，鮮克由禮，以蕩陵德，實悖天道」。世有祿者，恃其富有，不知蹈循禮義，陵轢有德；如此，是悖天之正道，未有能久者也。</p><p><strong>所出</strong>：《尚書 · 畢命》 — https://zh.wikisource.org/wiki/尚書/畢命</p></article></main></div></div>
