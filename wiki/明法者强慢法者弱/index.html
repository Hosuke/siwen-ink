    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 明法者强慢法者弱</nav></header><main><article><h1>明法者强慢法者弱</h1><p>严明法治使国家强盛，怠慢法律</p><p>本篇又以魏、趙、燕三國為徵。魏方明《立辟》、從憲令之時，有功必賞，有罪必誅，強匡天下，威行四隣；及法慢妄予，國日削。趙方明《國律》、從大軍之時，人眾兵強，辟地齊燕；及《國律》慢，用者弱，國日削。燕方明《奉法》、審官斷之時，東縣齊國，南盡中山；及《奉法》亡，官断不用，左右交爭，兵弱地削，國制於隣敵。故曰：「明法者強，慢法者弱。」又云：「家有常業，雖饑不餓；國有常法，雖危不亡。」</p><p>  <strong>所出</strong>：《韓非子 · 飾邪》 — https://zh.wikisource.org/wiki/韓非子/飾邪</p></article></main></div></div>
