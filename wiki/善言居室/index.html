    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 善言居室</nav></header><main><article><h1>善言居室</h1><p>善言發乎至誠，雖遠必應；枉道而言之，雖近亦離。</p><p>善言居室，則靡遠不應；枉直不中，則無近不離。抱朴子此論，言乎感應之道也。凡所言苟得其理，雖言之室中，而千里之外必有應者；苟乖乎理，雖近在咫尺，亦若胡越之隔。是以宋野退舍，而熒惑為之西移；殷朝有外奔之昵屬，則近臣離心。反是而言之，則四還自少廣之表而至，鹿馬變於蕭牆之內。感應之機，捷於影響，其端甚微，而所及者大，此君子貴乎言有物而行有恆也。</p><p><strong>所出</strong>：《抱朴子 · 卷38》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷38</p></article></main></div></div>
