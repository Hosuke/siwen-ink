    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鑿龜數筴</nav></header><main><article><h1>鑿龜數筴</h1><p>卜筮之祥不足恃，國之存亡在法不在兆。</p><p>趙、燕交伐，各以龜筴卜之，兆皆曰「大吉」。然趙攻燕而秦出兵，燕師敗績；燕伐趙而秦拔地，兵至大梁而上黨已失。同一龜兆，趙以之則地削兵辱，燕以之則闢地救燕。龜無遠見，秦龜非神而欺，趙龜非愚而妄，兆同而效異，其故何哉？法不明，令不信，雖得吉卜，適足速亡耳。</p><p>魏東鄉攻陶、衛，數年西鄉失國；非歲星在東、熒惑在西也，亦非豐隆、五行、太一之數也。龜筴鬼神不足舉勝，左右背鄉不足以專戰。然而恃之，愚莫大焉。</p><p><strong>所出</strong>：《韓非子 · 飾邪》 — https://zh.wikisource.org/wiki/韓非子/飾邪</p></article></main></div></div>
