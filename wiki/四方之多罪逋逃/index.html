    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 四方之多罪逋逃</nav></header><main><article><h1>四方之多罪逋逃</h1><p>天子崇姦長惡，則亡徵見矣。</p><p>「乃惟四方之多罪逋逃，是崇是長，是信是使，是以爲大夫卿士。」言[[惟婦言是用]]之主，崇獎亡命，信任匪人，使[[暴虐無親]]之大夫卿士充斥於位，而[[商罪貫盈]]之禍成矣。</p><p><strong>所出</strong>：《尚書 · 牧誓》 — https://zh.wikisource.org/wiki/尚書/牧誓</p></article></main></div></div>
