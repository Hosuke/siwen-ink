    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 知天命</nav></header><main><article><h1>知天命</h1><p>五十而知天命，謂知天道之流行、事物之必然。</p><p>《論語》載孔子自述云：「五十而知天命。」言人生五十，則知天道之運行、事物之必然，理無疑惑也。天命者，天之所予人者是也。非人力之可強求，亦非智力之可逆料。知之則安之，不怨不尤，此聖人進德之功也。</p><p><strong>所出</strong>：《論語 · 爲政第二》 — https://zh.wikisource.org/wiki/論語/爲政第二</p></article></main></div></div>
