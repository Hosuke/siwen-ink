    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 成湯</nav></header><main><article><h1>成湯</h1><p>成汤承天命，宽政治国，诛除邪虐，功垂后世。</p><p>此命述成湯功德，曰：「乃祖成湯，克齊聖廣淵；皇天眷佑，誕受厥命；撫民以寬，除其邪虐；功加于時，德垂後裔。」言湯聖德廣大，受天命以寬治民，誅邪虐、施功德於當世，恩澤流傳後嗣也。</p><p>  <strong>所出</strong>：《尚書 · 微子之命》 — https://zh.wikisource.org/wiki/尚書/微子之命</p></article></main></div></div>
