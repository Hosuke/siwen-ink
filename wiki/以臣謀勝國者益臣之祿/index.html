    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以臣謀勝國者益臣之祿</nav></header><main><article><h1>以臣謀勝國者益臣之祿</h1><p>晏子言以臣謀勝國者當益其祿，以民力勝國者當益民之利。</p><p>晏子言：「臣聞之，以臣謀勝國者，益臣之祿；以民力勝國者，益民之利。故上有羨獲，下有加利，君上享其名，臣下利其實。故用智者不偷業，用力者不傷苦，此古之善伐者也。」</p><p><strong>所出</strong>：《晏子春秋 · 卷三》 — https://zh.wikisource.org/wiki/晏子春秋/卷三</p></article></main></div></div>
