    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 得敵</nav></header><main><article><h1>得敵</h1><p>遇敵而情不一，或勇或怯，位不當故。</p><p>六三爻辭「得敵，或鼓或罷，或泣或歌」。得敵者，遇上九之敵應也。情志不一，或鼓而進，或罷而退，或泣而悲，或歌而喜，位不當故。象傳云「位不當也」。</p><p><strong>所出</strong>：《周易 · 中孚》 — https://zh.wikisource.org/wiki/周易/中孚</p></article></main></div></div>
