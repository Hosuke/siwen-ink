    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 物固有以不用而為有用</nav></header><main><article><h1>物固有以不用而為有用</h1><p>物之無用者，有時而為大用；不用乃其所以為用也。</p><p>鼎錯日用而不足貴，周鼎不爨而不可賤，物固有以不用而為有用者。地平則水不流，亦其一理也。</p><p>有用無用，相待而成。鼎錯日用於廚，人視以為常，故不足貴；周鼎陳於宗廟，人尊以為寶，故不可賤。然其為鼎則一也。聖人處無用之地，則天下莫能用之；居有用之地，而人得而賤之。是故大匠不斫，良玉不剖，貴其無用而後能用之於無窮也。</p><p><strong>所出</strong>：《淮南子 · 說山訓》 — https://zh.wikisource.org/wiki/淮南子/說山訓</p></article></main></div></div>
