    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 弗辱</nav></header><main><article><h1>弗辱</h1><p>不辱先祖，式救後嗣</p><p>無忝皇祖，式救爾後。「忝」訓為辱。詩人以此為詩之結辭，告於皇天，冀勿辱沒先祖之德，當救其后嗣於危難。蓋詩人目擊幽王之亂，深懼國將覆亡，唯祈天命耳。</p><p><strong>所出</strong>：《詩經 · 瞻卬》 — https://zh.wikisource.org/wiki/詩經/瞻卬</p></article></main></div></div>
