    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 周鄭交質</nav></header><main><article><h1>周鄭交質</h1><p>信不由中，質無益也</p><p>鄭武公、莊公為平王卿士。王貳于虢，鄭伯怨王。王曰：「無之。」故周、鄭交質。王子狐為質於鄭，鄭公子忽為質於周。</p><p>王崩，周人將畀虢公政。四月，鄭祭足帥師取溫之麥。秋，又取成周之禾。周、鄭交惡。</p><p>君子曰：「信不由中，質無益也。明恕而行，要之以禮，雖無有質，誰能間之？苟有明信，澗谿沼沚之毛，蘋蘩蘊藻之菜，筐筥錡釜之器，潢汙行潦之水，可荐於鬼神，可羞於王公，而況君子結二國之信。行之以禮，又焉用質？」</p><p><strong>所出</strong>：《春秋左氏傳 · 隱公》 — https://zh.wikisource.org/wiki/春秋左氏傳/隱公</p></article></main></div></div>
