    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 有容德乃大</nav></header><main><article><h1>有容德乃大</h1><p>必有忍乃能有濟能有容德乃能大</p><p>王誡君陳以寬政，曰：「必有忍，其乃有濟；有容，德乃大。」夫小不忍則亂大謀，匹夫之勇不可以有成事，此「忍」之義也。若乃弘毅溫厚，無所不容，則其德盛大而無涯涘。德之大小，視其容量之廣狹以為準。</p><p><strong>所出</strong>：《尚書 · 君陳》 — https://zh.wikisource.org/wiki/尚書/君陳</p></article></main></div></div>
