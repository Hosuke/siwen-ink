    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 明珠變滯貨</nav></header><main><article><h1>明珠變滯貨</h1><p>抱朴子言美玉良材若不遇識者，反成滯貨無用之物。</p><p>明珠必於淵藪。</p><p>然耀靈光夜之珍，不為莫求而虧其質，以茍且於賤賈；洪鍾周鼎，不為委淪而輕其體，取見舉於侏儒；嶧陽雲和，不為不禦而息唱，以競顯於淫哇；冠群之德，不以沈抑而履徑，而剸節於流俗。是以和璧變為滯貨，柔木廢於勿用，赤刀之礦，不得經歐冶之爐；元凱之疇，終不值四門之闢也。</p><p><strong>所出</strong>：《抱朴子 · 卷18》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷18</p></article></main></div></div>
