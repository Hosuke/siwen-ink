    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 反商政政由舊</nav></header><main><article><h1>反商政政由舊</h1><p>伐紂既勝，反商之苛政，率由舊章。</p><p>武王伐商，師次牧野，一戎衣而定天下。及反商政，率由舊典。蓋商紂虐政既除，禮樂刑政，悉遵先王之舊，非以己意紛更之也。</p><p><strong>所出</strong>：《尚書 · 武成》 — https://zh.wikisource.org/wiki/尚書/武成</p></article></main></div></div>
