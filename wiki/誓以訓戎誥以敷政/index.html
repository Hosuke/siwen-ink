    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 誓以訓戎誥以敷政</nav></header><main><article><h1>誓以訓戎誥以敷政</h1><p>謂誓誥之別：誓所以誓眾戒戎，誥所以布政施教。</p><p>其在三代，事兼誥誓。誓以訓戎，誥以敷政，命喻自天，故授官錫允。</p><p><strong>所出</strong>：《文心雕龍 · 詔策》 — https://zh.wikisource.org/wiki/文心雕龍/詔策</p></article></main></div></div>
