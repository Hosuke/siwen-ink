    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大成若缺</nav></header><main><article><h1>大成若缺</h1><p>德充於內者，其用不弊；事成於外者，若有闕然。</p><p>大成若缺，其用不幣。大盈若沖，其用不窮。大直如詘，大巧如拙，大贏如㶧。</p><p>極大之成就者，外視若有所缺損，然而其功用無所匱乏。極大之充盈者，外視若空虛，然而其功用無有窮盡。極大之正直者，外視若枉屈。極大之精巧者，外視若樸拙。極大之贏餘者，外視若不足。此皆[[大成若缺]]之旨——至道之境界，其表象往往與實質相反，不可拘於形名以求之也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第八章 請靚》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
