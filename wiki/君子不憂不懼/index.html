    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 君子不憂不懼</nav></header><main><article><h1>君子不憂不懼</h1><p>君子內省無疚，故無憂懼。</p><p>司馬牛問君子。子曰：「君子不憂不懼。」</p><p>內省不疚，夫何憂何懼。无忧無懼，非無世事可憂可懼，乃心有主宰，外患不能奪也。</p><p><strong>所出</strong>：《論語 · 顏淵第十二》 — https://zh.wikisource.org/wiki/論語/顏淵第十二</p></article></main></div></div>
