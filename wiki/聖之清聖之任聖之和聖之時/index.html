    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖之清者、聖之任者、聖之和者、聖之時者</nav></header><main><article><h1>聖之清者、聖之任者、聖之和者、聖之時者</h1><p>孟子以清、任、和、時四端，論古聖賢處世之道各有異宜。</p><p>孟子分别古聖四人各異其道：伯夷，[[聖之清者]]，目不視惡色，耳不聽惡聲，治則進，亂則退；伊尹，[[聖之任者]]，治亦進，亂亦進，自任以天下之重；柳下惠，[[聖之和者]]，不羞污君，不辭小官，與鄉人處由由然不忍去；孔子，[[聖之時者]]，可以速而速，可以久而久，可以處而處，可以仕而仕。孟子以為，孔子兼四者之長，時中之道也。</p><p><strong>所出</strong>：《孟子 · 萬章下》 — https://zh.wikisource.org/wiki/孟子/萬章下</p></article></main></div></div>
