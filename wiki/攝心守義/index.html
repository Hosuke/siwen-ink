    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 攝心守義</nav></header><main><article><h1>攝心守義</h1><p>攝取其心、守其大義</p><p>攝心者，謂逄好學伎術者，則為之稱遠，方驗之，驚以奇異，人係其心於己。效之於驗，驗去亂其前，吾歸誠於己。</p><p>遭淫色酒者，為之術音樂，動之以為必死，生日少之憂。喜以自所不見之事，終可以觀漫瀾之命，使有後會。</p><p>守義者，謂以人探其在內以合也。探心深得其主也。從外制內，事有繫曲而隨也。</p><p><strong>所出</strong>：《鬼谷子 · 卷03》 — https://zh.wikisource.org/wiki/鬼谷子/卷03</p></article></main></div></div>
