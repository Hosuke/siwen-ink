    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 道左老人</nav></header><main><article><h1>道左老人</h1><p>授裴沆血鶴之術，杏酪延年，示以道隱。</p><p>司馬裴沆自洛中往鄭州，道左見病鶴垂翅，老人白衣曳杖至，謂非人血不可飛，三世是人之血方中。洛中唯有胡蘆生三世人耳，可求之。裴馳至洛，得石合如兩指，刺臂血滴其中。及鶴所，老人以為可信，令盡血塗鶴。引裴至其所，竹落草舍，指土罌中有杏核漿，色白如杏酪，舉之飲，不復飢渴。乃授一朴大如碗，戒勿竊開。後發之，四角赤蛇出頭。附書至叔處，開視如乾大麥飯升餘。叔後遊王屋山，不知所終。裴壽至九十七。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 44》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/44</p></article></main></div></div>
