    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 用人如用草木</nav></header><main><article><h1>用人如用草木</h1><p>用人要如用草木，各盡其材，不棄其一。</p><p>治人如治水潦，養人如養六畜，用人如用草木。言用人者在隨其所能而使之，如用草木然，各隨其性分而已。</p><p><strong>所出</strong>：《管子 · 四傷百匿》 — https://zh.wikisource.org/wiki/管子/七法/四傷百匿</p></article></main></div></div>
