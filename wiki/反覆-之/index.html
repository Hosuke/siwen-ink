    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 反覆-之</nav></header><main><article><h1>反覆-之</h1><p></p><p>又有「反應」之術，反以觀往，覆以驗來。反以知古，覆以知今。反以知彼，覆以知此。己反往，彼覆來，言有象比，因而定基。重之襲之，反之覆之，萬事不失其辭。</p><p>  <strong>所出</strong>：《鬼谷子 · 卷01》 — https://zh.wikisource.org/wiki/鬼谷子/卷01</p></article></main></div></div>
