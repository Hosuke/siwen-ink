    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 石碏誅州吁</nav></header><main><article><h1>石碏誅州吁</h1><p>州吁弒桓公自立，石碏設計使陳侯誅之於濮，迎立晉，是為宣公。</p><p>州吁收聚衞亡人以襲殺桓公，自立為衞君。為鄭伯弟段欲伐鄭，請宋、陳、蔡與俱，三國皆許州吁。州吁新立，好兵，弒桓公，衞人皆不愛。石碏乃因桓公母家於陳，詳為善州吁。至鄭郊，石碏與陳侯共謀，使右宰醜進食，因殺州吁於濮，而迎桓公弟晉於邢而立之，是為宣公。</p><p><strong>所出</strong>：《史記 · 卷037》 — https://zh.wikisource.org/wiki/史記/卷037</p></article></main></div></div>
