    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 辭約而旨豐，事近而喻遠</nav></header><main><article><h1>辭約而旨豐，事近而喻遠</h1><p>經典之文言簡而義廣</p><p>經典之文，辭約而旨豐，事近而喻遠。夫根柢槃深，枝葉峻茂，故往者雖舊，餘味日新，後進追取而非晚，前脩文用而未先。是以泰山之雨，不偏一處，而河潤千里。</p><p><strong>所出</strong>：《文心雕龍 · 宗經》 — https://zh.wikisource.org/wiki/文心雕龍/宗經</p></article></main></div></div>
