    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 四海之內皆兄弟</nav></header><main><article><h1>四海之內皆兄弟</h1><p>君子敬恭有禮，則天下皆可比於兄弟。</p><p>司馬牛憂曰：「人皆有兄弟，我獨亡！」子夏曰：「商聞之矣：『死生有命，富貴在天』，君子敬而無失，與人恭而有禮，四海之內，皆兄弟也，君子何患乎無兄弟也！」</p><p>敬而無失，恭而有禮，則天下之廣，莫非[[善人]]之倫類矣。[[死生有命富貴在天]]之語，亦見此章。</p><p><strong>所出</strong>：《論語 · 顏淵第十二》 — https://zh.wikisource.org/wiki/論語/顏淵第十二</p></article></main></div></div>
