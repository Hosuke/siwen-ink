    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 人之迷</nav></header><main><article><h1>人之迷</h1><p>人之迷惑失正道，由來已久，非一旦也。</p><p>[[不知我者之|迷惑]]者，[[不言之教|由來固久]]。《老子》言「人之迷，其日固久」，[[去甚去奢去泰|積習之蔽]]，[[不知病|非一旦]]也。
<strong>所出</strong>：《老子河上公章句 · 順化》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
