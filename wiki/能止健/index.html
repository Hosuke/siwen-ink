    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 能止健</nav></header><main><article><h1>能止健</h1><p>以止止健，畜德之正道。</p><p>彖辭言「能止健，大正也」，止者，艮之德也；健者，乾之德也。以止止健，非徒遏抑，乃畜而化之，使之歸於正道，是之謂大正。大畜之義，不在禁遏而在涵育，聖人畜德之功如此。</p><p><strong>所出</strong>：《周易 · 大畜》 — https://zh.wikisource.org/wiki/周易/大畜</p></article></main></div></div>
