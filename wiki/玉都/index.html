    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 玉都</nav></header><main><article><h1>玉都</h1><p>玉都者，身之別名，諸神所宅。</p><p>隱藏章云「閉塞命門保玉都」。命門為精氣之關鍵，塞之所以守之；玉都則身之別稱也。言人身為神明所都，如玉之貴，如都之廣。</p><p>《抱朴子·內篇》云：「以身為國，以心為君。」玉都之喻，正此意也。修身者塞其情欲之竅，保其形神之宅，是謂長生久視之基。</p><p><strong>所出</strong>：《黃庭內景經 · 隱藏章第三十五》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/隱藏章第三十五</p></article></main></div></div>
