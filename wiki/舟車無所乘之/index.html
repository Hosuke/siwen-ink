    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 舟車無所乘之</nav></header><main><article><h1>舟車無所乘之</h1><p>民不遠行，則代步之具闕</p><p>舟車無所乘之者，國小民寡，舟輿之具在而弗設也。夫車可以代步，舟可以涉川，然民安土重遷，足不行遠，則舟車之具陳而無所用。不遠徙故不待馳騁，不涉江海故不假舟楫，此無為之效也。</p><p><strong>所出</strong>：《老子河上公章句 · 獨立》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
