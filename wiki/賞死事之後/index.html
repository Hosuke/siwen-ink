    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 賞死事之後</nav></header><main><article><h1>賞死事之後</h1><p>賞賜死事者之後以激勵士氣之謂</p><p>桓公欲賞死事之後，憂無財以予之。管子對曰：君請縞素而就士室，朝功臣世家，遷封食邑，積餘藏羨跱蓄之家，與之定券契之齒。困窮之民聞而糴之，釜鏂無止，遠通不推，國粟之賈坐長而四十倍。君出四十倍之粟，以振孤寡，牧貧病，視獨老窮而無子者，則士爭前戰爲顏行，不偷而爲用。</p><p>此以經濟之策濟賞功之費，非直接的賦於民，而間接取之於商賈也。</p><p><strong>所出</strong>：《管子 · 第80篇輕重甲》 — https://zh.wikisource.org/wiki/管子/第80篇輕重甲</p></article></main></div></div>
