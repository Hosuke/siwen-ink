    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 執本執要</nav></header><main><article><h1>執本執要</h1><p>君執本、相執要、大夫執法、羣臣竭力，以治其上</p><p>有道之君者執本，相執要，大夫執法，以牧其羣臣。羣臣盡智竭力，以役其上。四守者，得則治，易則亂，故不可不明設而守固。昔者，聖王本厚民生，審知禍福之所生，是故慎小事微，違非索辯以根之。然則躁作姦邪偽詐之人，不敢試也。此禮正民之道也。</p><p><strong>所出</strong>：《管子 · 第31篇君臣下》 — https://zh.wikisource.org/wiki/管子/第31篇君臣下</p></article></main></div></div>
