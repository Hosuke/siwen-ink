    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 莒人滅繒非滅</nav></header><main><article><h1>莒人滅繒非滅</h1><p>滅人之國，必有內應而立異姓以奉其祀；若但恃力兼幷，非滅也。</p><p>莒人滅繒。非滅也。中國日，卑國月，夷狄時。繒、中國也，而時，非滅也。家有既亡，國有既滅，滅而不自知，由別之而不別也。莒人滅繒，非滅也。非立異姓以蒞祭祀，滅亡之道也。</p><p>滅人國者，非徒取其地、虜其民也，必立異姓以奉其祭祀，使前王之祀絕焉，是之謂滅。若莒人之於繒，特恃力兼幷，虜其地而未改其政令，則繒之宗廟血食猶或未絕焉，不得謂之滅也。《春秋》明大分之辨，義例之嚴如此。</p><p><strong>所出</strong>：《春秋穀梁傳 · 襄公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/襄公</p></article></main></div></div>
