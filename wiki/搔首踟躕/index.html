    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 搔首踟躕</nav></header><main><article><h1>搔首踟躕</h1><p>求之不得，心動而形躁也。</p><p>靜女俟我於城隅，愛而不見，男子乃搔首踟躕。搔首者，以手撓首也；踟躕者，躊躇不前也。情急而不知所為，故形諸舉止如此。</p><p>男子初疑靜女之爽約，既而悟其有意藏匿，然情思抑塞，不得暢遂，是以搔首而躊躇。此情詩中狀寫男子心事之妙筆也。</p><p>與[[俟我於城隅]]相承，男子已至而不得遇，遂有此情狀。</p><p><strong>所出</strong>：《詩經 · 靜女》 — https://zh.wikisource.org/wiki/詩經/靜女</p></article></main></div></div>
