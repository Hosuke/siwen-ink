    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 順以動</nav></header><main><article><h1>順以動</h1><p>順天理而動，此聖人之豫道。</p><p>《彖》曰「豫，順以動」。坤下以順，震上以動，順理而動，合乎天地之常。天地順動，故日月不忒，四時不差；聖人順動，則賞罰清而民服。此豫之正道，治天下之要術也。</p><p><strong>所出</strong>：《周易 · 豫》 — https://zh.wikisource.org/wiki/周易/豫</p></article></main></div></div>
