    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 焚咸丘</nav></header><main><article><h1>焚咸丘</h1><p>焚燒咸丘，內諱弗道，其義在禁。</p><p>桓公七年，「七年春，二月己亥，焚咸丘。」</p><p>咸丘者，魯地。火焚其丘，內辭也。公羊傳以為諱焚，弗道其故，然書之以戒後世。焚者何？用火焚也。</p><p><strong>所出</strong>：《春秋公羊傳 · 桓公》 — https://zh.wikisource.org/wiki/春秋公羊傳/桓公</p></article></main></div></div>
