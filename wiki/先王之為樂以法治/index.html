    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 先王之為樂以法治</nav></header><main><article><h1>先王之為樂以法治</h1><p>先王為樂以法治，善則行象德；酒禮一獻百拜所以備酒禍。</p><p>天地之道，寒暑不時則疾，風雨不節則饑。教者，民之寒暑也，教不時則傷世。事者，民之風雨也，事不節則無功。然則先王之為樂也，以法治也，善則行象德矣。夫豢豕為酒，非以為禍也；而獄諮益繁，則酒之流生禍也。是故先王因為酒禮，一獻之禮，賓主百拜，終日飲酒而不得醉焉，此先王之所以備酒禍也。故酒食者，所以合歡也。</p><p><strong>所出</strong>：《史記 · 卷024》 — https://zh.wikisource.org/wiki/史記/卷024</p></article></main></div></div>
