    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 譽重則蠻貊歸懷</nav></header><main><article><h1>譽重則蠻貊歸懷</h1><p>名譽既著，則四方響化；毀積既多，則離心難挽。</p><p>凡譽重則蠻貊歸懷，而不可以虛索也；毀積即華夏離心，而不可以言救也。是以小善雖無大益，而不可不為；細惡雖無近禍，而不可不去也。</p><p><strong>所出</strong>：《抱朴子 · 卷05》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷05</p></article></main></div></div>
