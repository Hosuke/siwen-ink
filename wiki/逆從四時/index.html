    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 逆從四時</nav></header><main><article><h1>逆從四時</h1><p>脈從四時者為可治，脈逆四時者為不可治。</p><p>形氣相得謂之可治，色澤以浮謂之易已，脈從四時謂之可治，脈弱以滑是有胃氣者易治。</p><p>形氣相失謂之難治，色夭不澤謂之難已，脈實以堅謂之益甚，脈逆四時為不可治。</p><p>逆四時者：春得肺脈，夏得腎脈，秋得心脈，冬得脾脈，其至皆懸絕沈濇。
又有：春夏脈沈濇，秋冬脈浮大，亦名逆四時。</p><p>病熱脈靜、泄而脈大、脫血而脈實、病在中脈實堅、病在外脈不實堅者，皆難治。</p><p><strong>所出</strong>：《黃帝內經 · 素問第六卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第六卷</p></article></main></div></div>
