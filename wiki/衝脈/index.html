    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 衝脈</nav></header><main><article><h1>衝脈</h1><p>衝脈起於氣街，並少陰俠臍上行，為血海，其病逆氣裏急。</p><p>衝脈者，奇經八脈之一也。其循行云起於氣街，並少陰之經，俠臍上行，至胸中而散。</p><p>衝脈為病，逆氣裏急。蓋衝者，要衝也，為十二經之海，亦稱血海，主滲諸絡而溫肌肉，其氣上逆則腹裏急痛也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第十六卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十六卷</p></article></main></div></div>
