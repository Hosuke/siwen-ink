    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 賢能之臣</nav></header><main><article><h1>賢能之臣</h1><p>晏子言任賢官能為治國之本，賢者在位，能者在職。</p><p>晏子言：「蒞國治民，善為國家者何如？」對曰：「舉賢以臨國，官能以敕民，則其道也。舉賢官能，則民與君矣。」</p><p>又言：「賢而隱，則庸為賢乎？吾君亦不務乎是，故不知也。」</p><p>又言：「夫上士，難進而易退也；其次，易進而易退也；其下，易進而難退也。以此數物者取人，其可乎？」</p><p><strong>所出</strong>：《晏子春秋 · 卷三》 — https://zh.wikisource.org/wiki/晏子春秋/卷三</p></article></main></div></div>
