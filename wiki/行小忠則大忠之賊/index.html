    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 行小忠則大忠之賊</nav></header><main><article><h1>行小忠則大忠之賊</h1><p>私人之忠小慧，反害公忠大義。</p><p>行小忠者，[[大忠]]之賊也。昔者楚共王與晉厲公戰於鄢陵，楚師敗，共王傷目。酣戰之時，[[司馬子反]]渴求飲，豎穀陽以酒進之。子反嗜酒，不能絕口，遂醉。戰罷，共王欲復戰，召子反。子反辭以心疾。共王親往，入其幄中，聞酒臭而還，曰：「司馬又醉，是亡楚國而不恤吾衆也。不穀無復戰矣。」遂還師，斬子反以徇。夫穀陽之進酒，非讎子反也，其心忠愛之而適足以殺之。是故小忠非忠，乃大忠之賊也。</p><p><strong>所出</strong>：《韓非子 · 十過》 — https://zh.wikisource.org/wiki/韓非子/十過</p></article></main></div></div>
