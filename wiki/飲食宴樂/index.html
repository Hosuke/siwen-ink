    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 飲食宴樂</nav></header><main><article><h1>飲食宴樂</h1><p>需待之時，君子以安和為樂。</p><p>象曰「雲上於天，需；君子以飲食宴樂」。需之為義，待也，須也。坎水在天，雲氣方升，將雨而未雨，此需待之象也。君子觀此，知時未可動，而陽氣未充，不宜躁進，但當順時安處，以飲食充其形，以宴樂和其心，非徒口腹之奉，乃寬裕自得之意也。需待之際，進取之志未伸，則收斂身心，涵養德性，俟命而已。飲食宴樂，示君子樂天知命、不以進退縈懷之意焉。</p><p><strong>所出</strong>：《周易 · 需》 — https://zh.wikisource.org/wiki/周易/需</p></article></main></div></div>
