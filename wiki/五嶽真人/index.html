    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五嶽真人</nav></header><main><article><h1>五嶽真人</h1><p>五嶽之神，稟受上清之炁，主奠地土，與神仙真人相往來。</p><p>五嶽真人，上清之屬神也。主奠地土，與神仙真人往來。祝誦既畢，復爐之時，所請之仙靈仙官、金童使者、五帝、五嶽神仙真人、三天正神、左右龍虎君、天仙地仙、五靈香官、侍經威神，皆集而監臨焉。</p><p><strong>所出</strong>：《上清大洞真經 · 結尾》 — https://zh.wikisource.org/wiki/上清大洞真經/結尾</p></article></main></div></div>
