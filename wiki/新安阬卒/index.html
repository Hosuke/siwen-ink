    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 新安阬卒</nav></header><main><article><h1>新安阬卒</h1><p>項羽坑殺降秦士卒二十餘萬於新安城南。</p><p>諸侯吏卒異時故繇使屯戍過秦中，秦中吏卒遇之多無狀。及秦軍降諸侯，諸侯吏卒乘勝多奴虜使之，輕折辱秦吏卒。秦吏卒多竊言曰：「章將軍等詐吾屬降諸侯，今能入關破秦，大善；即不能，諸侯虜吾屬而東，秦必盡誅吾父母妻子。」諸侯微聞其計，以告項羽。項羽乃召黥布、蒲將軍計曰：「秦吏卒尚眾，其心不服，至關中不聽，事必危，不如擊殺之，而獨與章邯、長史欣、都尉翳入秦。」於是楚軍夜擊阬秦卒二十餘萬人新安城南。</p><p><strong>所出</strong>：《史記 · 卷007》 — https://zh.wikisource.org/wiki/史記/卷007</p></article></main></div></div>
