    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 使事不相干</nav></header><main><article><h1>使事不相干</h1><p>令臣下各守其職，不相侵越，則爭端自息，技藝自長。</p><p>明君使事不相干，故莫讼；使士不兼官，故技長；使人不同功，故莫爭。爭讼止，技長立，則彊弱不觳力，冰炭不合形，天下莫得相傷，治之至也。</p><p>使事不相干者，事各有主，不相侵越也；使士不兼官者，一人一職，各盡其才也；使人不同功者，功歸其人，不容冒竊也。[[知人之難]]，而在知所任；任之專，則技自長；功之分明，則爭自息。三者相成，皆去私之一道也。</p><p><strong>所出</strong>：《韓非子 · 用人》 — https://zh.wikisource.org/wiki/韓非子/用人</p></article></main></div></div>
