    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聽大國為救亡</nav></header><main><article><h1>聽大國為救亡</h1><p>亡國之君不聽諫而自速其亡</p><p>亡君之必然也。聽大國為救亡，而亡亟於不聽。群臣知不聽，則不外諸侯；諸侯知不聽，則不受臣之誣其君矣。外不足恃，內不足以信，[[四方]]之姦所以乘之也。</p><p><strong>所出</strong>：《韓非子 · 八奸》 — https://zh.wikisource.org/wiki/韓非子/八奸</p></article></main></div></div>
