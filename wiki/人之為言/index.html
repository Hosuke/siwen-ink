    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 人之為言</nav></header><main><article><h1>人之為言</h1><p>偽言、讒言也。詩人戒人勿信浮言。</p><p>人之為言，即虛偽之言、讒諂之辭也。《采苓》三章皆以「人之為言」發端，反覆申誡，以見其義。</p><p>首章云「人之為言，苟亦無信」，戒勿輕信；二章云「苟亦無與」，戒勿附和；三章云「苟亦無從」，戒勿盲從。辭雖有三「苟」之異，而其指歸則一——凡偽言浮辭，必審察而後信之，不可為其所惑也。</p><p>詩人借采苓、采苦、采葑於首陽之山，以起興作喻，示人游息山澤之間，若聞人言，苟云云者，慎勿信之。</p><p><strong>所出</strong>：《詩經 · 采苓》 — https://zh.wikisource.org/wiki/詩經/采苓</p></article></main></div></div>
