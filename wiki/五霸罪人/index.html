    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五霸罪人</nav></header><main><article><h1>五霸罪人</h1><p></p><p>五霸者，三王之罪人也。今之諸侯，五霸之罪人也。今之大夫，今之諸侯之罪人也。</p><p>孟子此言，立三層之罪：五霸挾諸侯以伐諸侯，葵丘之會束牲載書而立五禁，是罪一也；今之諸侯皆犯五禁，是罪二也；今之大夫皆逢君之惡，是罪三也。又分罪之大小：長君之惡，其罪小；逢君之惡，其罪大。</p><p>此非僅論罪，乃明王道衰而霸術興，霸術衰而功利遍，愈降愈下，終至仁義不行、天下大亂之勢也。</p><p><strong>所出</strong>：《孟子 · 告子下》 — https://zh.wikisource.org/wiki/孟子/告子下</p></article></main></div></div>
