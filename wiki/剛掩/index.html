    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 剛掩</nav></header><main><article><h1>剛掩</h1><p>陽剛被陰柔所掩，九五之中道不行</p><p>彖傳曰：「困，剛掩也。」</p><p>「掩」者，遮覆之謂。九五陽剛居尊，本當有為，而六三、上六陰柔在上，掩覆其剛，使中正之道不得行，此困之本義也。陽被陰困，剛為柔掩，猶賢者在下，小人在上，君子道消之時。</p><p><strong>所出</strong>：《周易 · 困》 — https://zh.wikisource.org/wiki/周易/困</p></article></main></div></div>
