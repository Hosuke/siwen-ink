    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 六極</nav></header><main><article><h1>六極</h1><p>凶短折、疾、憂、貧、惡、弱，天所以威不德者也。</p><p>六極：一曰凶短折，二曰疾，三曰憂，四曰貧，五曰惡，六曰弱。與五福相反，天所以賞善罰惡，使民知所勸戒也。</p><p><strong>所出</strong>：《尚書 · 洪範》 — https://zh.wikisource.org/wiki/尚書/洪範</p></article></main></div></div>
