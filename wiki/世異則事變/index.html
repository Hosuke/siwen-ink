    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 世異則事變</nav></header><main><article><h1>世異則事變</h1><p>世道不同則法度當異，聖人論世而立隨時之法，不可以拘於故常。</p><p>世異則事變，時移則俗易。故聖人論世而立法，隨時而舉事。尚古之王，封於泰山，禪於梁父，七十餘聖，法度不同，非務相反也，時世異也。是故不法其已成之法，而法其所以為法。所以為法者，與化推移者也。夫能與化推移為人者，至貴在焉爾。</p><p><strong>所出</strong>：《淮南子 · 齊俗訓》 — https://zh.wikisource.org/wiki/淮南子/齊俗訓</p></article></main></div></div>
