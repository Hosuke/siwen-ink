    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 丹元家</nav></header><main><article><h1>丹元家</h1><p>心神丹元，居心部之宮。</p><p>丹元，心神之別號也。丹者，赤也，元者，本也始也。丹元居心部之宮，即心內所藏之元神。</p><p>心部之宮蓮含華，下有童子丹元家——童子指丹元而言，以其純陽未破，若嬰兒然。丹元為心君之別稱，主一身之宰輔，其德在乎含華虛明，其用在能調血理命、吐玉華於口舌。修煉之士存心，當存此丹元，令其常靈常明，不使昏蔽耗散，則神全氣足而命可延矣。</p><p><strong>所出</strong>：《黃庭內景經 · 心部章第十》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/心部章第十</p></article></main></div></div>
