    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三虱食豕</nav></header><main><article><h1>三虱食豕</h1><p>利害當前，小者聚而吮之，不暇遠慮。</p><p>三虱相與諍，一虱過之，曰：「諍者奚說？」三虱曰：「爭肥饒之地。」一虱曰：「若亦不患臘之至而茅之燥耳，若又奚患於是？」乃相與聚嘬其母而食之。彘臞，人乃弗殺。</p><p><strong>所出</strong>：《韓非子 · 說林下》 — https://zh.wikisource.org/wiki/韓非子/說林下</p></article></main></div></div>
