    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 贊能</nav></header><main><article><h1>贊能</h1><p>進賢者功最高，功無大乎進賢。</p><p>孫叔敖、沈尹莖相與友。叔敖遊於郢三年，聲問不知，修行不聞。沈尹莖謂孫叔敖曰：「說義以聽，方術信行，能令人主上至於王，下至於霸，我不若子也。子何以不歸耕乎？吾將為子游。」</p><p>沈尹莖遊於郢五年，荊王欲以為令尹，沈尹莖辭曰：「期思之鄙人有孫叔敖者，聖人也。王必用之，臣不若也。」荊王使人以王輿迎叔敖以為令尹，十二年而莊王霸，此沈尹莖之力也。功無大乎進賢。</p><p>[[賢能之臣]]以[[進賢]]為功，斯最著之明驗也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十四》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十四</p></article></main></div></div>
