    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 綢繆束薪</nav></header><main><article><h1>綢繆束薪</h1><p>以絹束薪，喻夫婦相親。</p><p>《詩》曰「綢繆束薪」。綢繆，糾纏縝密之貌；束薪，薪之束也。毛《傳》以為興辭，喻夫婦相親如束薪之固。後世因以「綢繆」喻夫妻之情，如「綢繆束楚」亦此義。</p><p><strong>所出</strong>：《詩經 · 綢繆》 — https://zh.wikisource.org/wiki/詩經/綢繆</p></article></main></div></div>
