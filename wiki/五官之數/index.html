    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五官之數</nav></header><main><article><h1>五官之數</h1><p>輕重之術不行，則五官之數不籍於民</p><p>「五官之數」者，言五官之職掌在人君操輕重之術以制之也。[[管子]]云：「動左右以重相因，二十，國之筴也。鹽鐵二十，國之筴也。錫金二十，國之筴也。五官之數，不籍於民。」</p><p>五官者，司馬掌兵，司空掌工，司徒掌土，司寇掌刑，司事掌積也。人君善操輕重之數，則五官聽令，萬事皆治；若輕重之術不行，則五官失馭，百工懈怠，財用不足。是以五官之數，必在人君操之以制，而不以橫賦暴斂於民。此治道之要義也。</p><p><strong>所出</strong>：《管子 · 第78篇揆度》 — https://zh.wikisource.org/wiki/管子/第78篇揆度</p></article></main></div></div>
