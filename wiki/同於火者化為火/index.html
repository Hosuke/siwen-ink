    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 同於火者化為火</nav></header><main><article><h1>同於火者化為火</h1><p>達虛含虛、神含神之理，則情可通、形可同，以大人無所不同無所不化</p><p>虛含虛，神含神，氣含氣，明含明，物含物。達此理者，情可以通，形可以同。同於火者化為火，同於水者化為水，同於日月者化為日，同於金石者化為金石。唯大人無所不同，無所不化，足可以興虛皇並駕。</p><p><strong>所出</strong>：《化書 · 卷二》 — https://zh.wikisource.org/wiki/化書/卷二</p></article></main></div></div>
