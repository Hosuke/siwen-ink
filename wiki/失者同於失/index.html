    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 失者同於失</nav></header><main><article><h1>失者同於失</h1><p>失道失德者與失合同。</p><p>失者同於失，任己而失人者，與失同道。失之於人，亦自失之。河上公云：「與失同者，失亦失之也。」物類相歸，同聲相應，不善之類亦相率而趨於失，理之常也。</p><p><strong>所出</strong>：《老子河上公章句 · 虛無》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
