    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 殖盈不如止</nav></header><main><article><h1>殖盈不如止</h1><p>物盛當止，持滿難久。</p><p>殖而盈之，不若其已。言物聚有時，過盈必溢，與其持滿致溢，孰若及時而止。[[不欲盈]]之謂也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章九》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
