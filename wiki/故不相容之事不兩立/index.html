    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 故不相容之事不兩立</nav></header><main><article><h1>故不相容之事不兩立</h1><p>法度與文學、賞功與譽賢、崇儉與貴文、務農與尚儒，不可並存，必去其一。</p><p>故不相容之事，不兩立也。斬敵者受賞，而高慈惠之行；拔城者受爵禄，而信廉愛之說；堅甲厲兵以備難，而美薦紳之飾；富國以農，距敵恃卒，而貴文學之士；廢敬上畏法之民，而養遊俠私劒之屬。舉行如此，治强不可得也。國平養儒俠，難至用介士，所利非所用，所用非所利。是故服事者簡其業，而游學者日衆，是世之所以亂也。</p><p><strong>所出</strong>：《韓非子 · 五蠹》 — https://zh.wikisource.org/wiki/韓非子/五蠹</p></article></main></div></div>
