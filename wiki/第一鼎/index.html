    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 第一鼎</nav></header><main><article><h1>第一鼎</h1><p>丹道以第一鼎為極則，其食如大黍米，自然所為，非有邪偽。</p><p>名曰第一鼎兮，食如大黍米。自然之所為兮，非有邪偽道。</p><p>丹成一粒，名曰聖胎、大丹，形如黍米，居於鼎中。此乃陰陽之至精、造化之真種，非人為造作之所能成，唯自然所為而已。是為丹道究竟之象。</p><p><strong>所出</strong>：《周易參同契 · 32章》 — https://zh.wikisource.org/wiki/周易參同契/32章</p></article></main></div></div>
