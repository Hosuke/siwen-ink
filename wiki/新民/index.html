    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 新民</nav></header><main><article><h1>新民</h1><p>使民革故鼎新，同趨於善</p><p>大學之道，在新民。湯之盤銘曰「苟日新，日日新，又日新」，康誥曰「作新民」，詩云「周雖舊邦，其命惟新」，是故君子無所不用其極。</p><p>新民者，非威刑以驅之，乃以明明德之光照被乎民，使人各去其舊染之污，而日新又新，以復其本善之性也。自天子以至於庶人，未有外此而能治者。</p><p><strong>所出</strong>：《大學》 — https://zh.wikisource.org/wiki/大學</p></article></main></div></div>
