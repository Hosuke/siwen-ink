    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 皇父孔聖，作都于向</nav></header><main><article><h1>皇父孔聖，作都于向</h1><p>皇父斥逐賢臣、自營私邑，以孔聖自居而行不義</p><p>詩云「皇父孔聖，作都于向。擇三有事，亶侯多藏。不憖遺一老，俾守我王」，言皇父斥逐賢臣，不留一老以輔翼國君，乃自營都邑、斂聚財貨。詩人深譏其以聖自名而行悖德之事，又斥其不忠于王事。此[[幽王之失德]]之驗，亦[[天命不徹]]之象也。</p><p><strong>所出</strong>：《詩經 · 十月之交》 — https://zh.wikisource.org/wiki/詩經/十月之交</p></article></main></div></div>
