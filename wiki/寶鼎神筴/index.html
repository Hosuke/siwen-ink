    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 寶鼎神筴</nav></header><main><article><h1>寶鼎神筴</h1><p>黃帝得寶鼎神筴，迎日推筴，終而復始，皇帝敬拜見焉。</p><p>公孫卿得申功札書，述黃帝迎日推筴之事，云：「帝得寶鼎神筴，是歲己酉朔旦冬至，得天之紀，終而復始。」孝武效之，郊拜[[泰一]]，贊饗言天以寶鼎神筴授皇帝，朔而又朔，終而復始。</p><p><strong>所出</strong>：《史記 · 卷012》 — https://zh.wikisource.org/wiki/史記/卷012</p></article></main></div></div>
