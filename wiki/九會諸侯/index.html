    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 九會諸侯</nav></header><main><article><h1>九會諸侯</h1><p>會諸侯者九，其令各異，治之大法也。</p><p>會諸侯者凡九：其一，戒師役之命；其二，養孤老、收孤寡；其三，薄賦斂、省力役；其四，修道路、一度量；其五，脩四時祭祀之禮；其六，共祀上帝；其七，流無禮之臣；其八，立四義於玄官；其九，封內財物為幣。會之既畢，大命乃出。千里之外，諸侯三年一朝；千里之內，二千里之外，五年一會；又外者，世一至而已。會之疏數，視地之遠近；令之輕重，視事之緩急。為政者明於此，則諸侯服從而天下定矣。</p><p><strong>所出</strong>：《管子 · 第09篇幼官圖》 — https://zh.wikisource.org/wiki/管子/第09篇幼官圖</p></article></main></div></div>
