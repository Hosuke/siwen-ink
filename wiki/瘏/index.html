    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 瘏</nav></header><main><article><h1>瘏</h1><p>馬疲病也。</p><p>瘏，馬疲累而病也。音圖。《卷耳》云「我馬瘏矣」，與上文虺隤、玄黃皆言馬之困病。瘏、痡義同，皆疲病之名，詩人反覆言之，以見行役之甚苦，而知臣下之勤勞也。</p><p><strong>所出</strong>：《詩經 · 卷耳》 — https://zh.wikisource.org/wiki/詩經/卷耳</p></article></main></div></div>
