    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 兼畜人</nav></header><main><article><h1>兼畜人</h1><p>大國之志在容養天下，非以陵人也。</p><p>大國謙德所存，不在兼併，而在兼畜。畜者，養也。取小國者非力取之也，取其心也。使人自來，視之如[[畜臣與治國之別]]，則天下無不服。此[[德廣所及]]之道，而非以威陵人之術也。</p><p><strong>所出</strong>：《老子河上公章句 · 謙德》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p><hr><p>帛書云：「大邦者，不過欲兼畜人。」與王弼本「不過欲兼畜人」義同，可以互參。</p><p>  <strong>所出</strong>：《老子 (帛書校勘版) · 第二十四章 處下》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
