    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 歸無極</nav></header><main><article><h1>歸無極</h1><p>返於道體無所窮極。</p><p>復歸於無極。無極者道之本體，沖虛廣大，無所不包，無所不容，非有窮極可指也。凡物之成，必有其毁；惟道無始無終，不可以數量限之。歸無極者，非徒無形也已，乃與道合真，泯是非、一彼我，無往而非道也。</p><p><strong>所出</strong>：《老子河上公章句 · 反朴》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
