    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 飛鳥以凶</nav></header><main><article><h1>飛鳥以凶</h1><p>初六爻辭。鳥自飛以上，凶之道也。</p><p>初六陰柔，處小過之初。居位不當，上而不下，如飛鳥之妄飛，是取凶之道也。不可如何者，言其自取，無可救止。</p><p><strong>所出</strong>：《周易 · 小過》 — https://zh.wikisource.org/wiki/周易/小過</p></article></main></div></div>
