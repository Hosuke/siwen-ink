    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 白圭辭中山</nav></header><main><article><h1>白圭辭中山</h1><p>白圭知中山、齊將亡，辭而去之。</p><p>白圭之中山，中山之王欲留之，白圭固辭，乘輿而去；又之齊，齊王欲留之仕，又辭而去。人問其故。曰：「之二國者皆將亡。」中山、齊皆當此[[五盡]]。若使中山之王與齊王，聞五盡而更之，則必不亡矣。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十六》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十六</p></article></main></div></div>
