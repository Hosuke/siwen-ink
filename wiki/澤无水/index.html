    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 澤无水</nav></header><main><article><h1>澤无水</h1><p>澤下缺水，君子以困為戒，致命以遂其志</p><p>象曰：「澤无水，困；君子以致命遂志。」</p><p>澤以有水為潤，今泽无水，則萬物枯竭，此困之象也。君子觀此象，知時之困厄，乃修身俟命之時。當是時也，無財富祿位之可乐，唯有一義可守，是以致命遂志，不以困辱而易其操也。</p><p><strong>所出</strong>：《周易 · 困》 — https://zh.wikisource.org/wiki/周易/困</p></article></main></div></div>
