    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 我无為而民自化-之</nav></header><main><article><h1>我无為而民自化-之</h1><p>本文阐释老子「我无为而民自化」之义，认为君主若能不妄为、顺其自然，百姓便会自发自正、向善化行，此为圣人治</p><p>老子云「我无為而民自化」，自化者，自正於善也。人主无事於上，則民各遂其性而化於善，無待教令之煩。與[[我好靜而民自正]][[我无事而民自富]][[我欲不欲而民自樸]]皆聖人治邦之四綱，總歸无為清靜之一塗。</p><p>  <strong>所出</strong>：《老子 (帛書校勘版) · 第二十章 治邦》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
