    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 思其始而成其終</nav></header><main><article><h1>思其始而成其終</h1><p>子產論為政當如農功，日夜思之，行無越思。</p><p>鄭子產善然明，問為政焉。對曰：「視民如子，見不仁者誅之，如鷹鸇之逐鳥雀也。」子大叔問政於子產，子產曰：「政如農功，日夜思之，思其始而成其終，朝夕而行之，行無越思，如農之有畔，其過鮮矣。」</p><p><strong>所出</strong>：《春秋左氏傳 · 廿五年》 — https://zh.wikisource.org/wiki/春秋左氏傳/襄公/廿五年</p></article></main></div></div>
