    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五不勝</nav></header><main><article><h1>五不勝</h1><p>法術之士所處之五種不利形勢。</p><p>夫以䟽遠與近愛信爭，其數不勝也；以新旅與習故爭，其數不勝也；以反主意與同好惡爭，其數不勝也；以輕賤與貴重爭，其數不勝也；以一口與一國爭，其數不勝也。</p><p>法術之士操五不勝之勢，以歲數而又不得見，當塗之人乘五勝之資，而旦暮獨說於前。故法術之士奚道得進，而人主奚時得悟乎？故資必不勝而勢不兩存，法術之士焉得不危？</p><p><strong>所出</strong>：《韓非子 · 孤憤》 — https://zh.wikisource.org/wiki/韓非子/孤憤</p></article></main></div></div>
