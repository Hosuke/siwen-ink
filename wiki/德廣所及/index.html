    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 德廣所及</nav></header><main><article><h1>德廣所及</h1><p>德化之廣，無遠弗屆，被及南國。</p><p>[[毛詩序]]云：「《漢廣》，德廣所及也。」言文王之道被於南國，美化行乎江漢之域，無思犯禮，風行水上，德之所及，若江漢之廣。[[維天有漢]]以監四方，文王之德廣被亦若是。</p><p><strong>所出</strong>：《詩經 · 漢廣》 — https://zh.wikisource.org/wiki/詩經/漢廣
===終::</p></article></main></div></div>
