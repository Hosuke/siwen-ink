    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 國語外傳</nav></header><main><article><h1>國語外傳</h1><p>《國語》文不主經，故號外傳，與經藝竝陳。</p><p>《國語》之文不主於經，故號曰「《外傳》」。所以包羅天地，探測禍福，發起幽微，章表善惡者，昭然甚明，實與經藝竝陳，非特諸子之倫也。</p><p><strong>所出</strong>：《國語 · 國語解敘》 — https://zh.wikisource.org/wiki/國語/國語解敘</p></article></main></div></div>
