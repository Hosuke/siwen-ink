    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 威重於爵祿</nav></header><main><article><h1>威重於爵祿</h1><p>威嚴之於爵祿為重，不可以祿分威。</p><p>不為重爵祿分其威，故曰「威重於爵祿」。威嚴者君之筋力，爵祿者賞之名器，分威於爵祿，是倒置本末也。</p><p><strong>所出</strong>：《管子 · 四傷百匿》 — https://zh.wikisource.org/wiki/管子/七法/四傷百匿</p></article></main></div></div>
