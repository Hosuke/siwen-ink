    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 奈何萬乘之主</nav></header><main><article><h1>奈何萬乘之主</h1><p>萬乘之君不可以身輕天下，重身所以重國。</p><p>奈何萬乘之主而以身輕天下者，傷時主之輕躁也。萬乘之國，其任至重；天下之寄，其責至大。主輕其身，則慢其臣；慢其臣，則下不以誠應上；上不以誠接下，而國事去矣。夫[[靜為躁君]]，[[聖人行不離輜重]]，所以防此患者也。奈何當世之君，乃反是道而不自知悟，可不哀哉！</p><p><strong>所出</strong>：《老子河上公章句 · 重德》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
