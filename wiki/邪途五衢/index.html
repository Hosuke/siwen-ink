    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 邪途五衢</nav></header><main><article><h1>邪途五衢</h1><p>令一出而示民邪途五衢，姦巧之人各循私途，國必危亡。</p><p>故令一出，示民邪途五衢，而求上之毋危，下之毋亂，不可得也。</p><p>巧佞之人，將以此成私為交；比周之人，將以此阿黨取與；貪利之人，將以此收貨聚財；懦弱之人，將以此阿貴事富；便辟伐矜之人，將以此買譽成名。</p><p><strong>所出</strong>：《管子 · 第15篇重令》 — https://zh.wikisource.org/wiki/管子/第15篇重令</p></article></main></div></div>
