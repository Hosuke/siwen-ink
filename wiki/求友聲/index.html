    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 求友聲</nav></header><main><article><h1>求友聲</h1><p>賢者聞聲而思友，鳥亦知類，矧於人乎。</p><p>友誼之義，起於天性。[[詩經]]之《伐木》，以鳥鳴興友聲。伐木丁丁，鳥鳴嚶嚶。詩人聞木聲而懷故舊，聽鳥嚶而思友生。夫鳥之嚶鳴，非他也，求其友聲爾。人之於友，亦若是矣。鳥且知求友，況於人類乎？</p><p>古之君子，重友朋而謹交遊。《伐木》之詩，所以發明朋友之倫也。</p><p><strong>所出</strong>：《詩經 · 伐木》 — https://zh.wikisource.org/wiki/詩經/伐木</p></article></main></div></div>
