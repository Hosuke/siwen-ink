    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 甯莊子言於衛君</nav></header><main><article><h1>甯莊子言於衛君</h1><p>甯莊子告衛文公當禮重耳，晉將昌。</p><p>衛文公有邢、狄之虞，不能禮焉。甯莊子言於公曰：「夫禮，國之紀也；親，民之結也；善，德之建也。今君棄之，無乃不可乎！晉公子善人也，而衛親也。康叔，文之昭也；唐叔，武之穆也。周之大功在武，天祚將在武族。唯晉實昌，晉胤公子實德。若復而修德，必獲諸侯，以討無禮。君弗蚤圖，衛而在討。」公弗聽。</p><p><strong>所出</strong>：《國語 · 卷10》 — https://zh.wikisource.org/wiki/國語/卷10</p></article></main></div></div>
