    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 遣慾澄心</nav></header><main><article><h1>遣慾澄心</h1><p>遣去嗜慾，澄靜其心，則神自清而六慾不生</p><p>夫人神好清，而心擾之；人心好靜，而慾牽之。常能遣其慾而心自靜，澄其心而神自清。自然六慾不生，三毒消滅。</p><p>所以不能者，為心未澄，慾未遣也。遣慾澄心，乃入道之要門。</p><p><strong>所出</strong>：《太上老君說常清靜經》 — https://zh.wikisource.org/wiki/太上老君說常清靜經</p></article></main></div></div>
