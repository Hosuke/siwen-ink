    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 觀德</nav></header><main><article><h1>觀德</h1><p>以己之身觀身之德，以家、鄉、國、天下遞觀，而知治道之得失。</p><p>故以身觀身，以家觀家，以鄉觀鄉，以國觀國，以天下觀天下。</p><p>觀人之道，觀己可以知人，觀家可以知家，觀鄉可以知鄉，觀國可以知國，觀天下可以知天下之治亂。以小觀大，由近稽遠，其理一也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 五十四章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
