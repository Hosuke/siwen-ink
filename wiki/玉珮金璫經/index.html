    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 玉珮金璫經</nav></header><main><article><h1>玉珮金璫經</h1><p>上清玉晨之書，授茅氏昆季。</p><p>《玉珮金璫經》，上清玉晨之書，侍女李方明出丹瓊之函、披雲珠之笈以授之，與《太霄隱書經》、《洞飛二景內書》同出，授茅固、茅衷及司命君。</p><p><strong>所出</strong>：《墉城集仙錄 · 卷02》 — https://zh.wikisource.org/wiki/墉城集仙錄/卷02</p></article></main></div></div>
