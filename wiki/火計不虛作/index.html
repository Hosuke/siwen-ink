    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 火計不虛作</nav></header><main><article><h1>火計不虛作</h1><p>丹火之計非虛設，乃演易象以明丹法之實。</p><p>火計者，丹法之火候計度也。丹家用火有候、有節、有度，非虛妄之說。</p><p>「不虛作」者，正言此火候之數有本有據，非憑空臆造，乃[[演易]]以明之。《易》之六十四卦、三百八十四爻，陰陽消長之理與丹法火候進退之機一一相符。[[偃月法爐鼎]]之象，[[龍虎兩弦]]之數，無不本諸《易》象而來。此魏伯陽作《參同契》之本意也。</p><p><strong>所出</strong>：《周易參同契 · 09章》 — https://zh.wikisource.org/wiki/周易參同契/09章</p></article></main></div></div>
