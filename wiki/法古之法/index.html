    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 法古之法</nav></header><main><article><h1>法古之法</h1><p>立法當法古，率由舊章，畫一而行。</p><p>《周書》曰：國法法不一，則有國者不祥。民不道法則不祥。國更立法以典民則祥。羣臣不用禮義教訓則不祥。百官伏事者離法而治則不祥。故曰：法者，不可恆也。存亡治亂之所從出，聖君所以為天下大儀也。君臣上下貴賤皆發焉。故曰：法古之法也。</p><p><strong>所出</strong>：《管子 · 第45篇任法》 — https://zh.wikisource.org/wiki/管子/第45篇任法</p></article></main></div></div>
