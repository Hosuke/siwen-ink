    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 夢中為君</nav></header><main><article><h1>夢中為君</h1><p>役夫晝夜苦逸懸隔，夜夢為君，樂無比；役人之心，冀慕富貴者也。</p><p>周之尹氏有老役夫，筋力竭而使之彌勤。晝則呻呼即事，夜則昏憊熟寐，精神荒散，昔昔夢為國君，居人民之上，總一國之事，遊燕宮觀，恣意所欲，其樂無比；覺則復役如故。人有慰之者，役夫曰：「人生百年，晝夜各分。吾晝為僕虜，苦則苦矣；夜為人君，其樂無比，何所怨哉？」</p><p>夫役者知夢樂之不足恃，而不以求為苦，達觀者也。然其欲慕富貴之心，隱見於夢寐之間，不可掩也。</p><p><strong>所出</strong>：《列子 · 周穆王篇》 — https://zh.wikisource.org/wiki/列子/周穆王篇</p></article></main></div></div>
