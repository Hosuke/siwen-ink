    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 心術者無為而制竅者</nav></header><main><article><h1>心術者無為而制竅者</h1><p>心以無為制馭九竅，猶君以無為制馭臣下。</p><p>心術者，無為而制竅者也。心而無與視聽之事，則官得守其分。夫心有欲者，物過而目不見，聲至而耳不聞。九竅者，視聽之官也。心不先物動，搖者不定，趮者不靜。靜乃自得，陰則能制陽，靜則能制動。此[[心之在體君之位]]之義，而[[靜因之道]]之樞機也。</p><p><strong>所出</strong>：《管子 · 第36篇心術上》 — https://zh.wikisource.org/wiki/管子/第36篇心術上</p></article></main></div></div>
