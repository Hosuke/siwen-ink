    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 見龍在田</nav></header><main><article><h1>見龍在田</h1><p>龍德正中，見於田野，君子之德已成，可以利見大人。</p><p>九二：見龍在田，利見大人。</p><p>龍德而正中者也。庸言之信，庸行之謹；閑邪存其誠，善世而不伐，德博而化。易曰：「見龍在田，利見大人。」君德也。</p><p>象曰：見龍在田，德施普也。
文言曰：「見龍在田」，時舍也。又曰：天下文明。</p><p>君子學以聚之，問以辯之，寬以居之，仁以行之。見龍在田者，非隱而在下，時乃見之也。天下文明，君子道長之初兆焉。</p><p><strong>所出</strong>：《周易 · 乾》 — https://zh.wikisource.org/wiki/周易/乾</p></article></main></div></div>
