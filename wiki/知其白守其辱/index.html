    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 知其白守其辱</nav></header><main><article><h1>知其白守其辱</h1><p>守黑含垢，恆德乃足，復歸於樸。</p><p>知其白、守其辱，爲天下浴。爲天下浴，恆德乃足。德乃足，復歸於樸。</p><p>白者皎然外炫，辱者闇然內含。聖人知炫耀之非美，而甘受垢辱以自居。如浴以滌汙，德以自卑而足。復歸於樸者，返其太初之質，不雕不琢也。</p><p>此與 [[歸樸反本]] [[見素抱樸]] 義相通，皆主返樸全真之意。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第七十二章 恆德》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
