    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 河間王女</nav></header><main><article><h1>河間王女</h1><p>河間王女歸玄俗，同居入山。</p><p>河間王女者，乃玄俗之妻也。玄俗得神仙之道，來往河間已數百年，鄉人言常見之，日中無影，唯餌巴豆雲母，亦賣之於都市，七丸二錢，可愈百病。河間王有病，買服之下蛇十餘頭，問其病意，答言：「王之所病，乃六世余殃所致，非王所招也。王昔嘗放乳鹿，即麒麟母也，仁心感天，固當遇我耳。」王家老舍人雲常見父母雲玄俗日中無影。王召而視之，果驗。王女幼絕葷血，清靜好道，王以女妻之。居數年，與女俱入常山中，時有見者。</p><p><strong>所出</strong>：《墉城集仙錄 · 卷06》 — https://zh.wikisource.org/wiki/墉城集仙錄/卷06</p></article></main></div></div>
