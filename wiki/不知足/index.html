    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不知足</nav></header><main><article><h1>不知足</h1><p>禍莫大於不知足。</p><p>「不知足」者，有之而不以為足，求之而不以其分也。外物之來無常，而欲心之起無已。以無常之物，供無已之欲，則雖多亦以為寡，雖厚亦以為薄。取之不以道，爭之不以義，而爭端起矣，兵革興矣。故[[知足之足]]言其福，不知足言其禍。[[足欲則亡]]言其失，此言其漸也。</p><p><strong>所出</strong>：《老子河上公章句 · 儉欲》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
