    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 周亞夫將兵</nav></header><main><article><h1>周亞夫將兵</h1><p>太尉周亞夫受命帥師平定七國之亂，為景朝功之首。</p><p>七國之亂起，天子遣大將軍竇嬰、太尉周亞夫將兵誅之。亞夫帥師東出，定梁楚，破吳楚，以功封條侯，後拜丞相。</p><p>太史公論之，以亞夫之功比之條侯，而惜其卒下獄不得善終。</p><p><strong>所出</strong>：《史記 · 卷011》 — https://zh.wikisource.org/wiki/史記/卷011</p></article></main></div></div>
