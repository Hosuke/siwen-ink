    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鄭棄其師</nav></header><main><article><h1>鄭棄其師</h1><p>鄭伯惡其師長，兼不反其眾，是為棄師。</p><p>閔公二年，「鄭棄其師」。</p><p>穀梁子曰：「惡其長也，兼不反其眾，則是棄其師也。」</p><p>鄭伯之師將有內變，師長以眾叛去，鄭伯不能馭其下，惡其師長之專，兼不收還其眾，使眾散而不反，是棄其師也。《春秋》書「鄭棄其師」，以譏鄭伯馭下無恩，不能保全其眾也。</p><p><strong>所出</strong>：《春秋穀梁傳 · 閔公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/閔公</p></article></main></div></div>
