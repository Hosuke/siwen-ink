    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 散勢法鷙鳥</nav></header><main><article><h1>散勢法鷙鳥</h1><p>乘間行威，使勢散而用之之術。</p><p>散勢者，神之使也。用之，必循間而動。威肅內盛，推間而行之，則勢散。夫散勢者，心虛志溢；意衰威失，精神不專，其言外而多變。故觀其志意，為度數，乃以揣說圖事，盡圓方，齊短長。無間則不散勢者，待間而動，動而勢分矣。</p><p>故善思間者，必內精五氣，外視虛實，動而不失分散之實。動則隨其志意，知其計謀。勢者，利害之決，權變之威。勢敗者，不可神肅察也。</p><p><strong>所出</strong>：《鬼谷子》 — https://zh.wikisource.org/wiki/本经阴符七术</p></article></main></div></div>
