    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 閔雨</nav></header><main><article><h1>閔雨</h1><p>閔雨者，有志乎民者也。</p><p>三年春，王正月，不雨。不雨者，勤雨也。</p><p>夏，四月，不雨。一時言不雨者，閔雨也。閔雨者，有志乎民者也。</p><p>六月，雨。雨云者，喜雨也。喜雨者，有志乎民者也。</p><p>《穀梁》以「勤雨」「閔雨」「喜雨」三義，分釋經文「不雨」「不雨」及「雨」之義。閔雨者，以民之苦旱為憂也；喜雨者，以民之得雨為樂也。皆有志乎民之義。《穀梁》以此見為政者當以民之憂樂為憂樂也。</p><p><strong>所出</strong>：《春秋穀梁傳 · 僖公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/僖公</p></article></main></div></div>
