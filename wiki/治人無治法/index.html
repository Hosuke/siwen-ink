    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 治人無治法</nav></header><main><article><h1>治人無治法</h1><p>國之治亂在人而不在法</p><p>有亂君，無亂國；有治人，無治法。羿之法非亡也，而羿不世中；禹之法猶存，而夏不世王。故法不能獨立，類不能自行；得其人則存，失其人則亡。法者、治之端也；君子者、法之原也。故有君子，則法雖省，足以遍矣；無君子，則法雖具，失先後之施，不能應事之變，足以亂矣。不知法之義，而正法之數者，雖博臨事必亂。</p><p><strong>所出</strong>：《荀子 · 君道篇》 — https://zh.wikisource.org/wiki/荀子/君道篇</p></article></main></div></div>
