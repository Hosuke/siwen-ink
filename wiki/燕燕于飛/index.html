    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 燕燕于飛</nav></header><main><article><h1>燕燕于飛</h1><p>燕子雙飛，羽翼不齊，以興送別之情。</p><p>「燕燕于飛，差池其羽。」燕，燕子也。雙燕飛翔，羽翼長短不齊。詩人見燕之雙飛，而興送別之感。首章以「差池其羽」起興，次章言「頡之頏之」，三章言「下上其音」，反覆詠歎，以言送別之遠、瞻望之切、離情之苦。</p><p><strong>所出</strong>：《詩經 · 燕燕》 — https://zh.wikisource.org/wiki/詩經/燕燕</p></article></main></div></div>
