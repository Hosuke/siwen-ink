    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 道終不可得</nav></header><main><article><h1>道終不可得</h1><p>可得者名德不名道，可行者名行不名道；聖人以可得行者善生，以不可得不可行者善死。</p><p>道終不可得，彼可得者，名德不名道。道終不可行，彼可行者，名行不名道。聖人以可得可行者，所以善吾生；以不可得不可行者，所以善吾死。</p><p><strong>所出</strong>：《關尹子 · 1》 — https://zh.wikisource.org/wiki/關尹子/1</p></article></main></div></div>
