    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 投桃報李</nav></header><main><article><h1>投桃報李</h1><p>禮尚往來，恩德相報。</p><p>「投我以桃，報之以李」，言人有恩施於我，我當以恩報之，禮尚往來之義也。此以果實相遺喻人情饋答當相稱也。</p><p><strong>所出</strong>：《詩經 · 振鷺》 — https://zh.wikisource.org/wiki/詩經/振鷺</p></article></main></div></div>
