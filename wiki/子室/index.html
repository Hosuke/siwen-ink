    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 子室</nav></header><main><article><h1>子室</h1><p>子水所居之丹田，精氣所藏之室也。</p><p>子室者，[[子水]]所居之丹田也。[[精氣神]]三者入於此室，而[[三光]]以為之煥照。子水配[[腎]]，腎為[[藏精]]之府，三光入此，則[[坎]]宮明而[[離]]宮朗，[[陰陽]][[水火]]相交，[[煉丹]]之功成焉。</p><p><strong>所出</strong>：《黃庭內景經 · 五行章第二十五》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/五行章第二十五</p></article></main></div></div>
