    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 經營四方</nav></header><main><article><h1>經營四方</h1><p>言為國奔走，往來於四方。</p><p>《江漢》亦云：「江漢湯湯，武夫洸洸。經營四方，告成于王。」言師旅既定，乃遍歷四方，治理其事，成功而歸告於王也。與《六月》[[六月興師]]之事相類，而此則平淮夷之後，[[四方既平]]之功也。</p><p>  <strong>所出</strong>：《詩經 · 江漢》 — https://zh.wikisource.org/wiki/詩經/江漢</p></article></main></div></div>
