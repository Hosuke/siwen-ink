    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 口起戎出好</nav></header><main><article><h1>口起戎出好</h1><p>口之所出，戎與好判焉</p><p>說之戒武丁也，以口與干戈並言：「且惟口起戎出好，惟干戈作疾，惟衣載病，惟眚厥身。」戎，兵也；好，善也。口之出言也善，則有干戈之應；出言也惡，則干戈自此而起。干戈非戎之器乎？故言不可以不慎也。干戈之設，本以衛國，而「作疾」者，以暴伐無辜故也。衣之蔽體，乃名譽所寄；而「載病」者，以失德取辱故也。眚，過也；「厥身」者，殃及其身也。口也、戈也、衣也、眚也，皆致殃之端，而其原皆出於心之一念，故當敬戒於心焉。</p><p><strong>所出</strong>：《尚書 · 傅說之命中》 — https://zh.wikisource.org/wiki/尚書/傅說之命中</p></article></main></div></div>
