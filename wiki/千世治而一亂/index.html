    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 千世治而一亂</nav></header><main><article><h1>千世治而一亂</h1><p>抱法處勢則治千而亂一；廢法待堯舜則治一而亂千。</p><p>世之治者不絕於中，吾所以言勢者，取其中也。中者，上不及堯舜，下不為桀紂。</p><p>抱法處勢而待桀紂，桀紂至乃亂，是千世治而一亂也；廢勢背法而待堯舜，堯舜至乃治，是千世亂而一治也。[[堯舜不可兩譽]]，然[[堯舜湯武而是烈士天下之亂術]]之說，非通論也。</p><p>治千而亂一，與治一而亂千，猶乘驥駬而分馳，相去遠矣。</p><p><strong>所出</strong>：《韓非子 · 難勢》 — https://zh.wikisource.org/wiki/韓非子/難勢</p></article></main></div></div>
