    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天師自罰身中神鬼要法</nav></header><main><article><h1>天師自罰身中神鬼要法</h1><p>天師罰身中神鬼之要法</p><p>[[女青鬼律]]所記天師自罰身中神鬼要法云：「飛符連天，一元三靈，此天師自罰身中神鬼要法。遠兵士，太王主元一九三氣，丈人九氣，父母太一，使我收煞，汝急出來。良久，俯三叱，叱二十四，暗暗。」</p><p>此天師役使神鬼之要法。以太王主元一九三氣，丈人九氣，父母太一，使收煞身中神鬼。俯三叱，叱二十四，則神鬼皆伏。</p><p><strong>所出</strong>：《女青鬼律 · 卷4》 — https://zh.wikisource.org/wiki/女青鬼律/卷4</p></article></main></div></div>
