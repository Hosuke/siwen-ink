    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五勝三至</nav></header><main><article><h1>五勝三至</h1><p>鄒衍所言辯者之得失，辭至為下，辯當別殊類、序異端，而非務相迷。</p><p>鄒衍論辯有言：「天下之辯有五勝三至，而辭至為下。」又云：「辯者，別殊類，使不相害；序異端，使不相亂。抒意通指，明其所謂，使人與知焉，不務相迷也。故勝者不失其所守，不勝者得其所求，若是，故辨可為也。及至煩文以相假，飾辭以相惇，巧譬以相移，引人聲使不得及其意，如此害大道。」</p><p><strong>所出</strong>：《公孫龍子 · 原序》 — https://zh.wikisource.org/wiki/公孫龍子/原序</p></article></main></div></div>
