    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蹟之所出而蹟豈蹟哉</nav></header><main><article><h1>蹟之所出而蹟豈蹟哉</h1><p>老子以蹟與履為喻，謂六經為先王之陳蹟，非道之本原。</p><p>老子曰：「夫六經，先王之陳蹟也，豈其所以蹟哉！今子之所言，猶蹟也。夫蹟，履之所出，而蹟豈履哉！」</p><p><strong>所出</strong>：《莊子 · 天運》 — https://zh.wikisource.org/wiki/莊子/天運</p></article></main></div></div>
