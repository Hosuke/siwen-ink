    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 忯忯戚醮</nav></header><main><article><h1>忯忯戚醮</h1><p>貪財積貨而不能舍，中心戚戚，憂慮交積。</p><p>財積而無用，服膺而不舍，滿心忯忯戚醮，求益而不止，可謂憂矣。</p><p>忯忯戚醮，言人心懷財貨，戚戚然而不能安，醮醮然而無已時也。</p><p><strong>所出</strong>：《莊子 · 盜跖》 — https://zh.wikisource.org/wiki/莊子/盜跖</p></article></main></div></div>
