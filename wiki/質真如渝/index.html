    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 質真如渝</nav></header><main><article><h1>質真如渝</h1><p>質性至真，反若變渝，以明返本之義。</p><p>質真如渝，言質樸純真之物，反若渝變然。[[復歸於樸]]，真者若無所別於俗流，乃[[見素抱樸]]之旨。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第三章 聞道》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p><hr><p>老子又言「大方無隅，大器晚成，大音希聲，大象無形」凡此皆[[反者道之動]]之義也。明乎此，則知道之顯隱、遲速、虛實，皆相反而相成。</p><p>  <strong>所出</strong>：《道德經 (王弼本) · 四十一章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
