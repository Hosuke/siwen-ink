    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 忠臣不危其君，孝子不非其親</nav></header><main><article><h1>忠臣不危其君，孝子不非其親</h1><p>忠臣不危其君，孝子不非其親，此為臣子之分。</p><p>所謂忠臣者，不危其君；所謂孝子者，不非其親。今舜以賢取君之國，湯武以義放弒其君，皆以賢而危主者也，而天下賢之。夫以賢為名而危其君，豈忠臣之謂乎？</p><p>孝子之事父，非競取父之家也；忠臣之事君，非競取君之國也。不危其君，不非其親，各安其分，是謂盡忠盡孝。若挾賢智以取之，是[[誹謗其親者不孝誹謗其君者天下賢之]]之類，實為大亂之道。</p><p><strong>所出</strong>：《韓非子 · 忠考》 — https://zh.wikisource.org/wiki/韓非子/忠考</p></article></main></div></div>
