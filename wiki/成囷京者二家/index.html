    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 成囷京者二家</nav></header><main><article><h1>成囷京者二家</h1><p>式璧聘新建囷京者，以勸萬民之藏。</p><p>桓公患糴賤、穀歸諸侯，欲為百姓萬民藏之。管子令就近聘有新成囷京之二家，桓公式璧而聘之。行令半歲，萬民聞之，舍其作業，爭為囷京以藏菽粟五穀者過半。蓋成囷京者受聘，則國人皆知上之所重在是。民上無功顯之名，下則實其囷京以給上，一舉而名實俱得，故爭相效之。此以區區二家，誘發萬民儲備之心者也。</p><p><strong>所出</strong>：《管子 · 第83篇輕重丁》 — https://zh.wikisource.org/wiki/管子/第83篇輕重丁</p></article></main></div></div>
