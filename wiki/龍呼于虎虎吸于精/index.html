    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 龍呼于虎虎吸于精</nav></header><main><article><h1>龍呼于虎虎吸于精</h1><p>言龍虎相感，吐納相從。</p><p>龍呼于虎，虎吸于精，兩相飲食，具相貪便，遂相銜咽，咀嚼相吞。</p><p>龍者心液之神，虎者腎氣之精。龍呼則虎應，虎吸則精隨，二者相感，如飲食相養，貪便無厭。遂至銜咽咀嚼，融為一體。此象陰陽交媾、龍虎會合之功，乃丹道最要之關捩也。</p><p><strong>所出</strong>：《周易參同契 · 24章》 — https://zh.wikisource.org/wiki/周易參同契/24章</p></article></main></div></div>
