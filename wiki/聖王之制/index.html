    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖王之制</nav></header><main><article><h1>聖王之制</h1><p>聖王之制，取之以時，用之以節，草木榮華滋碩之時斧斤不入山林，魚鱉孕別之時罔罟毒藥不入澤。</p><p>聖王之制也：草木榮華滋碩之時，則斧斤不入山林，不夭其生，不絕其長也。黿鼉魚鱉鰍鱣孕別之時，罔罟毒藥不入澤，不夭其生，不絕其長也。春耕、夏耘、秋收、冬藏，四者不失時，故五穀不絕，而百姓有餘食也。汙池淵沼川澤，謹其時禁，故魚鱉優多，而百姓有餘用也。斬伐養長不失其時，故山林不童，而百姓有餘材也。</p><p><strong>所出</strong>：《荀子 · 王制篇》 — https://zh.wikisource.org/wiki/荀子/王制篇</p></article></main></div></div>
