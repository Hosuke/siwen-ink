    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 俠者足多</nav></header><main><article><h1>俠者足多</h1><p>游俠振人死亡，不矜其能，羞伐其德，蓋亦有足多者焉。</p><p>今遊俠，其行雖不軌於正義，然其言必信，其行必果，已諾必誠，不愛其軀，赴士之阨困，既已存亡死生矣，而不矜其能，羞伐其德，蓋亦有足多者焉。</p><p><strong>所出</strong>：《史記 · 卷124》 — https://zh.wikisource.org/wiki/史記/卷124</p></article></main></div></div>
