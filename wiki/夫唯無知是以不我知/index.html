    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 夫唯無知是以不我知</nav></header><main><article><h1>夫唯無知是以不我知</h1><p>人不知我，以其無知，非道之患。</p><p>夫唯無知也，是以不我知。</p><p>[[老子]]歎世之莫我知也。非道之不高，命之不遇；以世人無知，故不得知我。知之者希，則我貴矣，此聖人所以甘處幽獨也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章七十》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
