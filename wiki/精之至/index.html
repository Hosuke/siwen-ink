    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 精之至</nav></header><main><article><h1>精之至</h1><p>精全則自然充溢，不假作為。</p><p>赤子未知牝牡之合，而朘怒焉。河上公注云「朘，陰童子」，《說文》「朘，赤子陰也」。</p><p>此言嬰兒精氣完足，不待情欲之動，而陽物自舉，是真精充盈之驗。聖人返觀赤子，見其精之至者無所勉強，自然而然，故知修真之道，在於全精而不泄。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第十八章 含德》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
