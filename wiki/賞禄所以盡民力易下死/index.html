    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 賞禄所以盡民力易下死</nav></header><main><article><h1>賞禄所以盡民力易下死</h1><p>賞禄者，為使民竭力和赴死也。</p><p>賞禄，所以盡民力、易下死也，今戰勝攻取之士勞而賞不霑，而卜筮、視手理、狐蠱為順辭於前者日賜。</p><p>上握度量，所以擅生殺之柄也，今守度奉量之士欲以忠嬰上而不得見，巧言利辭行姦軌以倖偷世者數御。</p><p>據法直言，名刑相當，循-{䋲}-墨，誅姦人，所以為上治也，而愈疏遠，諂施順意從欲以危世者近習。</p><p>賞利一從上出，所以善制下也，而戰介之士不得職，而間居之士尊顯。上以此為教，名安得無卑，位安得無危？</p><p><strong>所出</strong>：《韓非子 · 詭使》 — https://zh.wikisource.org/wiki/韓非子/詭使</p></article></main></div></div>
