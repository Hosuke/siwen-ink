    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 竹破竹補</nav></header><main><article><h1>竹破竹補</h1><p>以類求類，異類徒勞，真鉛乃聖人之種。</p><p>竹破竹補，抱雞用卵，以類求也。《三相類》曰：「同類易施功，非類難為巧。」若非其類，不是真種，萬般作用徒勞力耳。金丹大道者聖人之事也，欲學聖人須求聖人之種，即真鉛之真知。以此真知修持大道，未有不合聖人之機者。聖人之機渾然天理而已，真知而無一不知，無一不真，能以複天理，故云合聖機。</p><p><strong>所出</strong>：《悟真直指 · 卷二》 — https://zh.wikisource.org/wiki/悟真直指/卷二</p></article></main></div></div>
