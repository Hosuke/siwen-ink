    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 爾不我畜</nav></header><main><article><h1>爾不我畜</h1><p>詩人指斥其夫不畜養己，以寓被弃之怨也。</p><p>畜者，養也。[[爾不我畜]]者，詩人責夫之辭，言爾不畜養我也。昏姻之合，本以相親相養；今夫不我畜，是絕義也。詩人因此歸復邦家，猶[[復我邦家]]之義。</p><p><strong>所出</strong>：《詩經 · 我行其野》 — https://zh.wikisource.org/wiki/詩經/我行其野</p></article></main></div></div>
