    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 知進退存亡而不失其正</nav></header><main><article><h1>知進退存亡而不失其正</h1><p>聖人知進之不可過，知退之為得，不失正道。</p><p>文言曰：亢之為言也，知進而不知退，知存而不知亡，知得而不知喪；其唯聖人乎？知進退存亡而不失其正者，其唯聖人乎！</p><p>亢者，過甚之辭也。凡人知進而不知退，故有悔；知存而不知亡，故有殆；知得而不知喪，故有失。唯聖人知止，知足，知損。亢龍之悔，盈不可久也。聖人與時偕極，故能與時偕行，知進退存亡之機，而不失其正者，時中也。</p><p><strong>所出</strong>：《周易 · 乾》 — https://zh.wikisource.org/wiki/周易/乾</p></article></main></div></div>
