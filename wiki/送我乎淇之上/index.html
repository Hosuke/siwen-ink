    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 送我乎淇之上</nav></header><main><article><h1>送我乎淇之上</h1><p>別時送我於淇水之上，以寓眷戀不捨之意。</p><p>「送我乎淇之上」，言美人送我至淇水之上而別也。淇水在衞，詩人迭詠此事於三章之末，以見情好綢繆、臨歧繾綣之意。密期於桑中，相要於上宮，告別於淇上，情事宛然，辭氣連屬，蓋《桑中》之卒章以水寓情者也。</p><p><strong>所出</strong>：《詩經 · 桑中》 — https://zh.wikisource.org/wiki/詩經/桑中</p></article></main></div></div>
