    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 反胎更生</nav></header><main><article><h1>反胎更生</h1><p>承三元君之德，七世父母解宿罪而受生新世、返胎更化之道也。</p><p>反胎更生，上清大洞真經第八章所言解脫承負、返胎更生之法也。</p><p>經云：「七世父母，反胎更生。累葉積罪，罪泄福生。」七世祖先如有宿罪累積，由是符鎮護之功，三元之炁下臨，死炁化而生炁興，罪垢蕩除，返受更生之福。</p><p>此以見上清道經之旨：一人脩道，惠及七祖，不獨一身之解脫，亦祖先之津梁也。</p><p><strong>所出</strong>：《上清大洞真經 · 8章》 — https://zh.wikisource.org/wiki/上清大洞真經/8章</p></article></main></div></div>
