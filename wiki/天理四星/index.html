    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天理四星</nav></header><main><article><h1>天理四星</h1><p>斗魁中四星，貴人牢名，掌理刑罰之象。</p><p>天理四星在斗魁中，貴人牢名曰天理。在魁中，貴人牢。樂汁圖云「天理理貴人牢」。宋均曰「以理牢獄」。</p><p>占以明為吉，星明則貴人得其理；不明則刑罰失中，貴人有難。</p><p><strong>所出</strong>：《史記 · 卷027》 — https://zh.wikisource.org/wiki/史記/卷027</p><hr><p>又《詩》詠嫁娶之夕云「三星在天」，蓋心宿也。</p><p>  <strong>所出</strong>：《詩經 · 綢繆》 — https://zh.wikisource.org/wiki/詩經/綢繆</p></article></main></div></div>
