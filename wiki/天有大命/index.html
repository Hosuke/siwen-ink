    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天有大命</nav></header><main><article><h1>天有大命</h1><p>天命與人命並重，聖人當順天應人</p><p>天所以有大命，人所以有大命也。夫香美脆味，厚酒肥肉，甘口而疾形；曼理皓齒，說情而捐精。故去甚去泰，身乃無害。聖人者，知天命之不可違，而審人事之當為也。</p><p><strong>所出</strong>：《韓非子 · 揚榷》 — https://zh.wikisource.org/wiki/韓非子/揚榷</p></article></main></div></div>
