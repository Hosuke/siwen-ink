    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 雕籠</nav></header><main><article><h1>雕籠</h1><p>強為者失其自然，返樸儉約則民力、民財、民時有餘。</p><p>懸雕籠、事玉粒養黃雀，黃雀終不樂。垂禮樂、設賞罰教生民，生民終不泰。夫心不可安而自安之，道不可守而自守之，民不可化而自化之。所以儉於臺榭則民力有餘，儉於寶貨則民財有餘，儉於戰伐則民時有餘。不與之由與之也，不取之由取之也。海伯亡魚，不出於海；國君亡馬，不出於國。</p><p><strong>所出</strong>：《化書 · 卷六》 — https://zh.wikisource.org/wiki/化書/卷六</p></article></main></div></div>
