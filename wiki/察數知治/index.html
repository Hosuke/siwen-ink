    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 察數知治</nav></header><main><article><h1>察數知治</h1><p>察數而知治，審器而識勝，明謀而適勝，通德而天下定。</p><p>察數而知治，審器而識勝，明謀而適勝，通德而天下定。定宗廟，育男女，官四分，則可以立威行德，制法儀，出號令。此為兵之至善，非以地求罰人是君也。</p><p><strong>所出</strong>：《管子 · 第08篇幼官》 — https://zh.wikisource.org/wiki/管子/第08篇幼官</p></article></main></div></div>
