    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 自知明</nav></header><main><article><h1>自知明</h1><p>明於自知，不眩於知人。</p><p>知人者智也，自知者明也。人之蔽也，莫蔽於知人而莫明於自知。觀人之得失易，察己之是非難。故聖人內省而不疚，闇然而日章。，是以自知者，超越知人之智，而為明達之極致也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章三十三》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
