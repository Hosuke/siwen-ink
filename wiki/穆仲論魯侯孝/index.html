    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 穆仲論魯侯孝</nav></header><main><article><h1>穆仲論魯侯孝</h1><p>穆仲以肅敬神明、諮詢故實為孝</p><p>宣王欲得能導訓諸侯之人，穆仲對曰：「魯侯孝。」王問何以知之，對曰：「肅恭明神而敬事耇老；賦事行刑，必問於遺訓而咨於故實；不干所問，不犯所咨。」言孝者非徒奉親，亦在敬祖法、循遺訓也。王以為然，遂命魯孝公於夷宮。</p><p><strong>所出</strong>：《國語 · 卷01》 — https://zh.wikisource.org/wiki/國語/卷01</p></article></main></div></div>
