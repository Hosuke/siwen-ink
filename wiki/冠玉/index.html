    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 冠玉</nav></header><main><article><h1>冠玉</h1><p></p><p>陳平為人美丈夫色，狀貌冠玉。周勃等將咸譖之曰：「雖美丈夫，如冠玉耳，其中未必有也。臣聞居家時，盜其嫂；事不容，亡歸；歸不中，又亡歸。」言其容止可觀而中無實學也。</p><p>  <strong>所出</strong>：《史記 · 卷056》 — https://zh.wikisource.org/wiki/史記/卷056</p></article></main></div></div>
