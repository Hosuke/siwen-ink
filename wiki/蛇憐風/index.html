    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蛇憐風</nav></header><main><article><h1>蛇憐風</h1><p>蛇行有足似，風動無形無有，然大風能折木蜚屋。喻小不勝之中有大勝在。</p><p>蛇謂風曰：「予動吾脊脅而行，則有似也。今子蓬蓬然起於北海，蓬蓬然入於南海，而似無有，何也？」風曰：「然，予蓬蓬然起北海入南海，然而指我則勝我，鰌我亦勝我。雖然，夫折大木，蜚大屋者，唯我能也。故以衆小不勝為大勝也。為大勝者，唯聖人能之。」</p><p><strong>所出</strong>：《莊子 · 秋水》 — https://zh.wikisource.org/wiki/莊子/秋水</p></article></main></div></div>
