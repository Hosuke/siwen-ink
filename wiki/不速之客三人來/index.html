    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不速之客三人來</nav></header><main><article><h1>不速之客三人來</h1><p>不召而至之客，以敬待之，終得其助。</p><p>上六云「入于穴，有不速之客三人來，敬之終吉」。不速者，不召而自至也。當需卦之極，陷於穴中，乃有不速之客三人忽然而來。其人非敵而似敵，其來非期而忽至。處此者惟當敬慎以對，不敢慢易，則終獲吉祥，轉危為安。象曰「敬之終吉，雖不當位，未大失也」，明敬慎之道足以補位之不正，化寇而為客，化凶而為吉矣。</p><p><strong>所出</strong>：《周易 · 需》 — https://zh.wikisource.org/wiki/周易/需</p></article></main></div></div>
