    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 有人之形無人之情</nav></header><main><article><h1>有人之形無人之情</h1><p>聖人有生人之形，而無世俗之情，是乃近乎天。</p><p>莊子曰：「有人之形，無人之情。有人之形，故羣於人；無人之情，故是非不得於身。眇乎小哉，所以屬於人也；謷乎大哉，獨成其天！」言聖人有生人之形骸，而無世俗之好惡情偽；如此，則是非不入於身，超然獨與天為一。</p><p><strong>所出</strong>：《莊子 · 德充符》 — https://zh.wikisource.org/wiki/莊子/德充符</p></article></main></div></div>
