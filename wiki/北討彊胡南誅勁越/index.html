    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 北討彊胡南誅勁越</nav></header><main><article><h1>北討彊胡南誅勁越</h1><p>漢室北伐匈奴、南平百越，將帥士卒依次受封。</p><p>太史公論述征伐之義，以為大一統之世，天子不可晏然不為邊境征伐，自是之後，遂出師北討彊胡，南誅勁越，將卒以次封矣。北討者，擊匈奴也；南誅者，平閩越、東甌及南越也。於是功臣武將，或取朔方，或逐單于，或定東越，或破番禺，皆因功得侯焉。</p><p><strong>所出</strong>：《史記 · 卷020》 — https://zh.wikisource.org/wiki/史記/卷020</p></article></main></div></div>
