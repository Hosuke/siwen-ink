    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 慎獨</nav></header><main><article><h1>慎獨</h1><p>君子於幽隱微獨之處不敢忽也。</p><p>莫見乎隱，莫顯乎微，故君子慎其獨也。言幽暗之中，細微之事，跡未著而意已動，人所不知而己獨知之，是以君子既戒懼乎其所不睹，而又謹嚴乎其所不聞，於此無所不謹，然後能盡乎修身之道。</p><p><strong>所出</strong>：《中庸 · 中庸章句》 — https://zh.wikisource.org/wiki/四書章句集註/中庸章句</p></article></main></div></div>
