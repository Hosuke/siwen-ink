    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五石六鷁</nav></header><main><article><h1>五石六鷁</h1><p>《春秋》詳備成文之一例</p><p>《春秋》辨理，一字見義，五石六鷁，以詳備成文；雉門兩觀，以先後顯旨，其婉章志晦，諒以邃矣。《春秋》記隕石於宋、六鷁退飛於鄭，事無巨細，皆備書之，以見聖人屬辭比事之精詳也。</p><p><strong>所出</strong>：《文心雕龍 · 宗經》 — https://zh.wikisource.org/wiki/文心雕龍/宗經</p></article></main></div></div>
