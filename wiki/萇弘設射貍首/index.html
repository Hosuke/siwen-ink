    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 萇弘設射貍首</nav></header><main><article><h1>萇弘設射貍首</h1><p>記萇弘以方事周靈王，欲以致諸侯，設射貍首，諸侯不從，晉人執殺萇弘。</p><p>是時萇弘以方事周靈王，諸侯莫朝周，周力少，萇弘乃明鬼神事，設射貍首。貍首者，諸侯之不來者。依物怪欲以致諸侯。諸侯不從，而晉人執殺萇弘。周人之言方怪者自萇弘。</p><p><strong>所出</strong>：《史記 · 卷028》 — https://zh.wikisource.org/wiki/史記/卷028</p></article></main></div></div>
