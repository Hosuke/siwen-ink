    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 背公之俗</nav></header><main><article><h1>背公之俗</h1><p>公道不行，私門大開</p><p>吳之所以亡，在乎背公之俗日甚，正直之道遂壞。主昏於上，臣欺於下，不黨不得，不競不進。秉維之佐，牧民之吏，非母後之親，則阿諂之人也。[[背公之俗彌劇]]，[[姦臣竊柄賢者陸沉]]，而莫愧屍祿之刺，莫畏致戎之禍。以毀譽為蠶織，以威福代稼穡。內崇[[陶侃文信之訾]]，實有安昌董鄧之汙。[[賞罰以信]]之道不行，而[[公道達而私門塞]]之義遂絕。此亂國之俗，後世所當深戒者也。</p><p><strong>所出</strong>：《抱朴子 · 卷34》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷34</p></article></main></div></div>
