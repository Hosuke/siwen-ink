    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 明並懸象</nav></header><main><article><h1>明並懸象</h1><p>抱朴子言明鑒者如日月並懸，能洞察幽微，辨別賢愚。</p><p>自匪明並懸象，玄鑒表微者，焉能披泥抽淪玉，澄川掇沈珠哉！</p><p><strong>所出</strong>：《抱朴子 · 卷18》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷18</p></article></main></div></div>
