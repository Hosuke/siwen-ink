    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 露臺百金</nav></header><main><article><h1>露臺百金</h1><p>孝文欲作露臺，計直百金，以為中民十家之產，遂罷不作。</p><p>帝嘗欲作露臺，召匠計之，直百金。上曰：「百金中民十家之產，吾奉先帝宮室，常恐羞之，何以臺為！」上常衣綈衣，所幸慎夫人，令衣不得曳地，幃帳不得文繡，以示敦樸，為天下先。</p><p><strong>所出</strong>：《史記 · 卷010》 — https://zh.wikisource.org/wiki/史記/卷010</p></article></main></div></div>
