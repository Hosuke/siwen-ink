    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 威下分</nav></header><main><article><h1>威下分</h1><p>令之可否決於在下，則威權下移於民，國不可保。</p><p>為上者不明，令出雖自上，而論可與不可者在下。夫倍上令以為威，則行恣於己以為私，百吏奚不喜之有？且夫令出雖自上，而論可與不可者在下，是威下繫於民也。威下繫於民，而求上之毋危，不可得也。</p><p>令出而留者無罪，則是教民不敬也。令出而不行者毋罪，行之者有罪，是皆教民不聽也。令出而論可與不可者在官，是威下分也。</p><p><strong>所出</strong>：《管子 · 第15篇重令》 — https://zh.wikisource.org/wiki/管子/第15篇重令</p></article></main></div></div>
