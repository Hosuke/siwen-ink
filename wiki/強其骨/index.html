    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 強其骨</nav></header><main><article><h1>強其骨</h1><p>聖人治民強其筋骨使體充力壯</p><p>聖人治民，虛其心，實其腹，弱其志，強其骨。</p><p>心虛則嗜欲不入，腹實則飢寒不迫；志弱則不貪，骨強則有力。河上公章句云：「骨強無骨，筋弱則骨苦。」又云：「骨無所憂，志無所求，則骨強也。」蓋體充力壯，骨髓堅實，則筋脈柔和，肌肤充盈，此身之正也。志者意也，志弱則不妄求，骨強則體不病，二者並行，乃聖人之治也。</p><p><strong>所出</strong>：《老子河上公章句 · 安民》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
