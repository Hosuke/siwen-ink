    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 受業通者七十有七人</nav></header><main><article><h1>受業通者七十有七人</h1><p>記孔子受業通達之弟子凡七十七人，別為四科。</p><p>《史記》述仲尼弟子，云受業身通者七十有七人，皆異能之士也。</p><p>因其所長，分為四科：
德行科者，顏淵、閔子騫、冉伯牛、仲弓是也；
政事科者，冉有、子路是也；
言語科者，宰我、子貢是也；
文學科者，子游、子夏是也。</p><p>兼總其性行各異：子路之辟，冉求之魯，宰予之辯，子貢之億，子游之文，子夏之敏。顏淵而下，屢空乏資，而能不汲汲於富貴。</p><p>是知聖人之門，材性各殊，而教之所成廣矣。</p><p><strong>所出</strong>：《史記 · 卷六七》 — https://zh.wikisource.org/wiki/史記/卷067</p></article></main></div></div>
