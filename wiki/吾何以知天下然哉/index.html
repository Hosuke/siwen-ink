    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 吾何以知天下然哉</nav></header><main><article><h1>吾何以知天下然哉</h1><p>觀道循序，由身及天下，故知天下然。</p><p>吾何以知天下然哉？以此。</p><p>觀身以知身，觀家以知家，觀鄉、國、天下皆然。循脩德之序，遞相觀省，故知天下之所以然。觀道之要，不出乎此。</p><p><strong>所出</strong>：《道德經 (王弼本) · 五十四章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
