    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鄭伯治與于雍糾之亂者</nav></header><main><article><h1>鄭伯治與于雍糾之亂者</h1><p>鄭厲公既入，追究往日之亂，殺公子閽，刖強鉏，罪不及共叔，君子以強鉏不能衛其足。</p><p>鄭伯治與于雍糾之亂者。九月，殺公子閽，刖強鉏。公父定叔出奔衞。三年而複之，曰：「不可使共叔無後於鄭。」使以十月入，曰：「良月也，就盈數焉。」</p><p>君子謂：「強鉏不能衛其足。」</p><p><strong>所出</strong>：《春秋左氏傳 · 莊公》 — https://zh.wikisource.org/wiki/春秋左氏傳/莊公</p></article></main></div></div>
