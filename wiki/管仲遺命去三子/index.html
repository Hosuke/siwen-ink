    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 管仲遺命去三子</nav></header><main><article><h1>管仲遺命去三子</h1><p>管仲病，戒桓公去竪刁、易牙、遠開方，以其不愛其身，不能愛君。</p><p>管仲有病，桓公往問之，曰：「仲父病，不幸卒於大命，將奚以告寡人？」管仲曰：「願君去竪刁，除易牙，遠衛公子開方。易牙烝其子首以進君，夫人情莫不愛其子，今弗愛其子，安能愛君？竪刁自宫以治内，人情莫不愛其身，身且不愛，安能愛君？開方弃其母久宦不歸，其母不愛，安能愛君？臣聞之：『矜僞不長，蓋虚不久。』願君去此三子者也。」管仲卒死，桓公弗行。及桓公死，蟲出户不葬。</p><p><strong>所出</strong>：《韓非子 · 難一》 — https://zh.wikisource.org/wiki/韓非子/難一</p></article></main></div></div>
