    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大成子</nav></header><main><article><h1>大成子</h1><p>神農時降濟陰，授地皇內文，教人以好生之道，俾播殖穀果代烹殺、和合方藥救疾養性。</p><p>大成子，一號傳豫子，在神農之時降於濟陰，授以《地皇內文》，教人以好生之道，俾播殖穀果以代烹殺，和合方藥救疾養性。一云作《太一元精經》三十六卷。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 2》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/2</p></article></main></div></div>
