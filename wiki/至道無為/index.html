    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 至道無為</nav></header><main><article><h1>至道無為</h1><p>至道者一龍一蛇，與時變化，外從其風而內守其性</p><p>至道無為，一龍一蛇，盈縮卷舒，與時變化。外從其風，內守其性，耳目不燿，思慮不營。道者無為，而無不為也。夫舉事而順於道者，非道之所為也，道之所施也。是故聖人法道無為，因時應物，與時屈伸，與化盈縮，若龍之潛若蛇之蛻，各得其宜焉。</p><p><strong>所出</strong>：《淮南子 · 俶真訓》 — https://zh.wikisource.org/wiki/淮南子/俶真訓</p></article></main></div></div>
