    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 厲公讓原</nav></header><main><article><h1>厲公讓原</h1><p>厲公責伯父原不迎己，原以事君無二心自殺</p><p>厲公入而讓其伯父原曰：「我亡國外居，伯父無意入我，亦甚矣。」原曰：「事君無二心，人臣之職也。原知罪矣。」遂自殺。</p><p><strong>所出</strong>：《史記 · 卷042》 — https://zh.wikisource.org/wiki/史記/卷042</p></article></main></div></div>
