    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 四者亂</nav></header><main><article><h1>四者亂</h1><p>宮中亂、兄弟亂、大臣亂、中民亂、小民亂</p><p>國之所以亂者四：內有疑妻之妾，此宮亂也；庶有疑適之子，此兄弟亂也；朝有疑相之臣，此大臣亂也；任官無能，此中民亂也；小人之亂，財匱也。五者一作，則為人上者危矣。宮中亂曰妬紛，兄弟亂曰黨偏，大臣亂曰稱述，中民亂曰讋諄，小民亂曰財匱。財匱生薄，讋諄生慢，稱述、黨偏、妬紛生變。</p><p><strong>所出</strong>：《管子 · 第31篇君臣下》 — https://zh.wikisource.org/wiki/管子/第31篇君臣下</p></article></main></div></div>
