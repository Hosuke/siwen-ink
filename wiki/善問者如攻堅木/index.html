    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 善問者如攻堅木</nav></header><main><article><h1>善問者如攻堅木</h1><p>善問之方，先易後難，及其久則自然通解。</p><p>善問者如攻堅木，先其易者，後其節目，及其久也，相說以解。不善問者反此。</p><p>攻木之道，必先其柔而易伐者，及其久則堅硬者亦將迎刃而解。問學之道，亦若是也。先就淺近者以叩之，及其漸通，乃及於深邃之處，則疑問冰釋，左右逢源矣。若不問可否，不度淺深，率然妄問，非徒無益，而且有害也。</p><p><strong>所出</strong>：《禮記 · 學記》 — https://zh.wikisource.org/wiki/禮記/學記</p></article></main></div></div>
