    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五腸之口</nav></header><main><article><h1>五腸之口</h1><p>五腸之口為死炁之門，二真守之則香潔。</p><p>五腸之口，太倉之腑所屬，死炁之門也。[[二真堅玉君]]守兆太倉之腑五腸之口，則死炁之門永塞，黃庭香潔，三尸滅絕。修者以[[真思]]碧炁從泥丸入，結作二神下布五腸之口，神面相向立，[[順時吐息]]，此[[守一]]之要義也。</p><p><strong>所出</strong>：《上清大洞真經 · 18章》 — https://zh.wikisource.org/wiki/上清大洞真經/18章</p></article></main></div></div>
