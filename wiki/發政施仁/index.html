    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 發政施仁</nav></header><main><article><h1>發政施仁</h1><p>行仁政於天下，則天下仕者耕者商賈行旅皆歸之</p><p>孟子告齊宣王，，欲王天下，當發政施仁，使天下仕者皆欲立於王之朝，耕者皆欲耕於王之野，商賈皆欲藏於王之市，行旅皆欲出於王之途，天下之欲疾其君者皆欲赴愬於王。其若是，孰能禦之？[[緣木求魚]]不如反本，[[保民而王]]在於此也。</p><p><strong>所出</strong>：《孟子 · 梁惠王上》 — https://zh.wikisource.org/wiki/孟子/梁惠王上</p></article></main></div></div>
