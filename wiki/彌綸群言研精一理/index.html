    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 彌綸群言，研精一理</nav></header><main><article><h1>彌綸群言，研精一理</h1><p>論之義用，在貫通眾說，而專精一理。</p><p>論也者，彌綸群言，而研精一理者也。[[八名區分]]之中，[[議]]宜言，[[說]]貴說語，[[傳]]者轉師，[[注]]者主解，[[贊]]者明意，[[評]]者平理，[[序]]者次事，[[引]]者胤辭；八名各異，而其宗皆在於論。故論者，匯納百家之言，歸於一理之明，此論體之本質也。</p><p><strong>所出</strong>：《文心雕龍 · 論說》 — https://zh.wikisource.org/wiki/文心雕龍/論說</p></article></main></div></div>
