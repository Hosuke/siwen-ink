    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 純嘏爾常</nav></header><main><article><h1>純嘏爾常</h1><p>大福常在，君子保有。</p><p>爾受命長矣，茀祿爾康矣，俾爾彌爾性，純嘏爾常矣。言君子稟受天命，福祿安康，天之大福，常在其身，此皆由德所積也。</p><p><strong>所出</strong>：《詩經 · 卷阿》 — https://zh.wikisource.org/wiki/詩經/卷阿</p></article></main></div></div>
