    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 取人以己</nav></header><main><article><h1>取人以己</h1><p>用人當反求諸己，以己度人。</p><p>取人以己，成事以質。言用人之道，當以己之心度人之心。己之所欲，知人之所欲；己之所惡，知人之所惡。以此取之，則無失矣。[[取人以己]]，反身之謂也；[[成事以質]]，務實之謂也。二者相須，以成治道。</p><p><strong>所出</strong>：《管子 · 第07篇版法》 — https://zh.wikisource.org/wiki/管子/第07篇版法</p></article></main></div></div>
