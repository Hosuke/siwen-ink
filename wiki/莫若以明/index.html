    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 莫若以明</nav></header><main><article><h1>莫若以明</h1><p>斥去成心，以虛照物，返其自然之分。</p><p>《齊物論》言：「欲是其所非而非其所是，則莫若以明。」又曰：「是以聖人不由，而照之于天，亦因是也。」</p><p>「莫若以明」者，非以我見明之，乃虛其心以照事物之本然也。彼是橫生者，以成心分之也；成心既忘，則彼自彼，是自是，而有不齊者亦齊矣。是以聖人不由乎是非之途，而照之於天——天者，自然之分際也。返乎天則滑疑之耀可以去，而物無不齊者矣。</p><p><strong>所出</strong>：《莊子 · 齊物論》 — https://zh.wikisource.org/wiki/莊子/齊物論</p></article></main></div></div>
