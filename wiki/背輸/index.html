    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 背輸</nav></header><main><article><h1>背輸</h1><p>背俞者，五臟六腑之氣所輸也，灸之可，刺之則禁也。</p><p>背俞皆挾脊相去三寸。胸中大俞在杼骨之端。肺俞在三焦之間，心俞在五焦之間，膈俞在七焦之間，肝俞在九焦之間，脾俞在十一焦之間，腎俞在十四焦之間。驗之之法，按其處應在中而痛解，乃其俞也。</p><p>灸之則可，刺之則不可。氣盛則瀉之，虛則補之。以火補者，毋吹其火，須自滅也；以火瀉者，疾吹其火，傳其艾，須其火滅也。</p><p><strong>所出</strong>：《黃帝內經 · 靈樞第八卷》 — https://zh.wikisource.org/wiki/黃帝內經/靈樞第八卷</p></article></main></div></div>
