    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 顧小利則大利之殘</nav></header><main><article><h1>顧小利則大利之殘</h1><p>貪近利者，必失遠益。</p><p>[[唇亡則齒寒]]之事，固已著明。然又有[[宮之奇知虞將亡]]之跡，可以互證。晉獻公欲假道於虞以伐虢，荀息建議以垂棘之璧、屈產之乘賂虞公。虞公貪利，許之。宮之奇諫以輔車相依之勢，虞公弗聽。晉既滅虢，還兵伐虞，克之。夫虞公之兵殆而地削者，何也？愛小利而不慮其害。故曰：顧小利，則大利之殘也。</p><p><strong>所出</strong>：《韓非子 · 十過》 — https://zh.wikisource.org/wiki/韓非子/十過</p></article></main></div></div>
