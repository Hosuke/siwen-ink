    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無宿治</nav></header><main><article><h1>無宿治</h1><p>政事不可留宿，當日即決</p><p>無宿治，則邪官不及為私利於民，而百官之情不相稽。百官之情不相稽，則農有餘日；邪官不及為私利，則農不敝。農不敝而有餘日，則草必墾矣。政事速決，則姦邪無隙可乘，農力得保，墾闢可興。</p><p><strong>所出</strong>：《商君書 · 卷一》 — https://zh.wikisource.org/wiki/商君書/卷一</p></article></main></div></div>
