    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大生章</nav></header><main><article><h1>大生章</h1><p>彌劫連、反老童合誦之大呪。</p><p>大生章，上清大洞二真章之總呪也。天上內音曰[[彌劫連]]，地上外音曰[[反老童受年祿]]，合而言之是為大生章。修者誦之，則與天地合其音，生炁彌漫，長生久視之基在是。</p><p><strong>所出</strong>：《上清大洞真經 · 18章》 — https://zh.wikisource.org/wiki/上清大洞真經/18章</p></article></main></div></div>
