    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 明堂之制</nav></header><main><article><h1>明堂之制</h1><p>古者明堂之制，下之潤濕弗能及，上之霧露弗能入，四方之風弗能襲，儉而不奢。</p><p>古者明堂之制，下之潤濕弗能及，上之霧露弗能入，四方之風弗能襲；土事不文，木工不斫，金器不鏤；衣無隅差之削，冠無觚蠃之理；堂大足以周旋理文，靜潔足以享上帝、禮鬼神，以示民知儉節。</p><p><strong>所出</strong>：《淮南子 · 本經訓》 — https://zh.wikisource.org/wiki/淮南子/本經訓</p></article></main></div></div>
