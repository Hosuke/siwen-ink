    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖人之道本無首末</nav></header><main><article><h1>聖人之道本無首末</h1><p>聖人道如水，無源無歸，故應物不窮。</p><p>以盆為沼，以石為島，魚環遊之，不知其幾千萬里而不窮也。夫何故？水無源無歸。聖人之道，本無首，末無尾，所以應物不窮。</p><p><strong>所出</strong>：《關尹子 · 1》 — https://zh.wikisource.org/wiki/關尹子/1</p></article></main></div></div>
