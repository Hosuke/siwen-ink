    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以天為蓋以地為輿</nav></header><main><article><h1>以天為蓋以地為輿</h1><p></p><p>以天為蓋，則無不覆也；以地為輿，則無不載也；四時為馬，則無不使也；陰陽為御，則無不備也。是故疾而不搖，遠而不勞，四支不動，聰明不損，而知八紘九野之形埒者，何也？執道要之柄，而游於無窮之地。大丈夫恬然無思，澹然無慮，以天為蓋，以地為輿，乘雲陵霄，與造化者俱。</p><p>  <strong>所出</strong>：《淮南子 · 原道訓》 — https://zh.wikisource.org/wiki/淮南子/原道訓</p></article></main></div></div>
