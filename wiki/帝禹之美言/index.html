    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 帝禹之美言</nav></header><main><article><h1>帝禹之美言</h1><p>禹自述治水艱辛，言鴻水滔天，下民皆服於水，己陸行、水行、泥行、山行，決九川致四海，終使萬國為治。</p><p>帝堯美禹之功，禹拜曰：「-{於}-，予何言！予思日孳孳。」堯難曰：「何謂孳孳？」禹曰：「鴻水滔天，浩浩懷山襄陵，下民皆服於水。予陸行乘車，水行乘舟，泥行乘橇，山行乘檋，行山刊木。與予衆庶稻鮮食。以決九川致四海，浚畎澮致之川。與予衆庶難得之食。食少，調有餘補不足，徙居。衆民乃定，萬國爲治。」帝曰：「然，此禹而美也。」</p><p><strong>所出</strong>：《史記 · 卷002》 — https://zh.wikisource.org/wiki/史記/卷002</p></article></main></div></div>
