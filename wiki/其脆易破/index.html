    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 其脆易破</nav></header><main><article><h1>其脆易破</h1><p>物之脆弱者，易於破碎。患之未著時，易於防範。</p><p>其脆易破，其微易散。言物之脆弱者易於破碎，微小者易於散亡。聖人治世，貴防患於微芒之時。《[[見微知萌]]》云「見微以知萌」，[[為之於未有]]云「為之於未有」，皆貴防之於早之義也。</p><p><strong>所出</strong>：《老子河上公章句 · 守微》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
