    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 躬行君子，則吾未之有得</nav></header><main><article><h1>躬行君子，則吾未之有得</h1><p>聖人自謙之辭。</p><p>[[孔子]]言[[文莫吾猶人也]]，[[躬行君子]]則吾未之有得。[[聖人]][[述而不作]]，自謙言[[文]]之功與人等，至於[[躬行]]君子之道，猶未敢以自足也。此見[[聖人]][[學而不厭]]、[[誨人不倦]]之實。</p><p><strong>所出</strong>：《論語 · 述而第七》 — https://zh.wikisource.org/wiki/論語/述而第七</p></article></main></div></div>
