    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鬼谷子不可毀</nav></header><main><article><h1>鬼谷子不可毀</h1><p>書雖邪術，存之足以助人主察姦故不可毀。</p><p>盧文弨謂《鬼谷子》乃「小人之書」，其術專為闇君設，以捭闔、飛箝之說要結人主，使膠固不可離。然繼云：「如此則是書何以不毀？」答曰：「姦邪之情狀畢見於斯。為人主者，不可不反覆畱意，庶幾遇若人也，洞見其肺肝然。彼欲以其術嘗我，而我得以逆折之。是助上知人之明也，何可毀也？」</p><p><strong>所出</strong>：《鬼谷子 · 跋》 — https://zh.wikisource.org/wiki/鬼谷子/跋</p><hr><p>《金樓子》又云：「秦始皇聞鬼谷先生言，因遣徐福入海求金菜玉蔬。」言秦皇亦聞鬼谷先生之名而信從之。</p></article></main></div></div>
