    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 法定任慧則法失</nav></header><main><article><h1>法定任慧則法失</h1><p>法立而任慧者用法，賞罰亂而邦道差誤。</p><p>法定而任慧也。釋法而任慧者，則受事者安得其務？務不與事相得，則法安得無失，而刑安得無煩？是以賞罰擾亂，邦道差誤，刑賞之不分白也。</p><p>法已制定，宜遵守而行。若釋法度而任一己之智慧，則辦事者無所遵循，賞罰失其常準。賞罰不明，則姦者僥倖、賢者抑屈，賞罰之實廢，而邦家之道乖矣。</p><p><strong>所出</strong>：《韓非子 · 制分》 — https://zh.wikisource.org/wiki/韓非子/制分</p></article></main></div></div>
