    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 死而不亡者壽</nav></header><main><article><h1>死而不亡者壽</h1><p>形骸有盡，名德不朽，是真長壽。</p><p>死而不亡者壽也。人之壽有三：有形骸之壽，有聲名之壽，有道德之壽。形骸之壽，彭祖不能延；聲名之壽，湮滅者過半；唯道德之壽，與天地同流而無疆。是以死而不亡者，非鬼神不死之謂，乃其人雖死，而其道不亡於天下後世也。顏淵夭而後學宗之，盜蹠暴而後世戒之，皆死而不亡之壽也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章三十三》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
