    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大勝者積衆勝而無非義者</nav></header><main><article><h1>大勝者積衆勝而無非義者</h1><p>勝之大者，非取之多也，積衆勝而莫非義焉。</p><p>兵革之事，數戰則士疲，數勝則君驕。驕君使疲民，未有不危國者也。故至善之兵，不待交戰而服人；其次一之，以一伐敵；大勝者，無他焉，積衆勝而無非義者耳。義者，衆之所服也；非義而勝，雖得之而不久。唯有道之主，義以制兵，仁以牧民，則所向無敵，而天下莫能與之爭矣。</p><p><strong>所出</strong>：《管子 · 第09篇幼官圖》 — https://zh.wikisource.org/wiki/管子/第09篇幼官圖</p></article></main></div></div>
