    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 山精諸名</nav></header><main><article><h1>山精諸名</h1><p>記山精之異名，呼其名則不敢為害。</p><p>抱朴子曰：「山中山精之形，如小兒而獨足，走向後，喜來犯人。人入山，若夜聞人音聲大語，其名曰蚑，知而呼之，即不敢犯人也。一名熱內，亦可兼呼之。又有山精，如鼓赤色，亦一足，其名曰暉。又或如人，長九尺，衣裘戴笠，名曰金累。或如龍而五色赤角，名曰飛飛，見之皆以名呼之，即不敢為害也。」</p><p><strong>所出</strong>：《抱朴子 · 卷17》 — https://zh.wikisource.org/wiki/抱朴子/卷17</p></article></main></div></div>
