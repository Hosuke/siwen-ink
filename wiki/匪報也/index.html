    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 匪報也</nav></header><main><article><h1>匪報也</h1><p>厚施非為報答，實欲申永好之情也</p><p>《木瓜》三章，每章疊句皆云「匪報也」，明詩人之旨趣也。</p><p>木瓜之微，受之無幾；瓊琚之重，回之十百。以微物而獲重璧，誰不知其不相直邪？然而行之者，以為區區物質之酬，非詩人之意也。詩人所以厚報之者，非不知瓊琚之貴，實欲借此以達長久相親之心耳。</p><p>毛傳云：「匪，非也。」非報云者，非所以為報答也，乃所以寓永好之誠也。此與世俗市道之交異矣。</p><p><strong>所出</strong>：《詩經 · 木瓜》 — https://zh.wikisource.org/wiki/詩經/木瓜</p></article></main></div></div>
