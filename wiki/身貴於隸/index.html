    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 身貴於隸</nav></header><main><article><h1>身貴於隸</h1><p>身者我之本，爵祿者外之隸，不可同日而語。</p><p>孫叔敖三為令尹而不榮華，三去之而無憂色。其來不可卻，其去不可止，得失之非我也。仲尼聞之曰：「古之真人，知者不得說，美人不得濫，盜人不得劫，伏戲黃帝不得友。死生亦大矣，而無變乎己，況爵祿乎！若然者，其神經乎大山而無介，入乎淵泉而不濡，處卑細而不憊，充滿天地，既以與人，己愈有。」又言：「棄隸者若棄泥塗，知身貴於隸也。」</p><p><strong>所出</strong>：《莊子 · 田子方》 — https://zh.wikisource.org/wiki/莊子/田子方</p></article></main></div></div>
