    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 求福不回</nav></header><main><article><h1>求福不回</h1><p>依循正道而求福，不以邪曲之道。</p><p>莫莫葛藟，施于條枚。豈弟君子，求福不回。回，違背也。君子求福，依循先王之正道，不以詭道，不以枉行。[[葛藟施于條枚]]以況依附正道之心，正道即先王之法度、干祿之正道。福之降也，由德不由僥倖；求之正也，在道不在權謀。此與「干祿豈弟」首章相應，君子以德干祿，正道求福，故福自攸降。</p><p><strong>所出</strong>：《詩經 · 旱麓》 — https://zh.wikisource.org/wiki/詩經/旱麓</p></article></main></div></div>
