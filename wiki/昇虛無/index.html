    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 昇虛無</nav></header><main><article><h1>昇虛無</h1><p>神真一旦輕舉，上昇太無之域。</p><p>一至不久昇虛無，言修真功成，神真輕舉，一旦而昇太無之境，不待久遠也。虛無者道之境，超越形骸，神遊無極，與道合真矣。</p><p><strong>所出</strong>：《黃庭內景經 · 上睹章第十六》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/上睹章第十六</p></article></main></div></div>
