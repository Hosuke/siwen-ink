    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不若德不聽罪</nav></header><main><article><h1>不若德不聽罪</h1><p>不循德義、不納罪咎者，必致殃咎。</p><p>若，順也。民有行不順於德、不聽納其罪者，天鑒下民，必將[[天既孚命正厥德]]以責之。若民不應天戒，則[[民中絕命]]之殃至矣。是以古之聖王，必先[[惟先格王，正厥事]]，正己以正民，使德行歸於義、罪咎無所匿。此[[天監下民，典厥義]]之旨也。</p><p><strong>所出</strong>：《尚書 · 高宗肜日》 — https://zh.wikisource.org/wiki/尚書/高宗肜日</p></article></main></div></div>
