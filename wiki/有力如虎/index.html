    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 有力如虎</nav></header><main><article><h1>有力如虎</h1><p>狀人之勇猛如虎也。</p><p>《詩》云「有力如虎」，出於《簡兮》之篇。言舞者之力，狀以猛虎，以見其威勇也。後世引之，以喻人之壯猛有力。</p><p><strong>所出</strong>：《詩經 · 簡兮》 — https://zh.wikisource.org/wiki/詩經/簡兮</p></article></main></div></div>
