    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 祈奚論赦</nav></header><main><article><h1>祈奚論赦</h1><p>賞淫人寧有過，刑君子寧有過。</p><p>叔嚮之弟羊舌虎善欒盈，欒盈有罪，晉誅羊舌虎，叔嚮為之奴而朡。祈奚聞之，往見范宣子而說，曰：「聞善為國者，賞不過而刑不慢。賞過則懼及淫人，刑慢則懼及君子。與其不幸而過，寧過而賞淫人，毋過而刑君子。」堯之刑也殛鯀，周之刑也戮管蔡，皆不慢刑也。宣子乃命吏出叔嚮。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十一》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十一</p></article></main></div></div>
