    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 萬乘之國兵不可以無主</nav></header><main><article><h1>萬乘之國兵不可以無主</h1><p>言大國必有主帥，無主則兵散地削。</p><p>萬乘之國，兵不可以無主。土地博大，野不可以無吏。百姓殷衆，官不可以無長。操民之命，朝不可以無政。</p><p>地博而國貧者，野不辟也；民衆而兵弱者，民無取也。故末產不禁則野不辟，賞罰不信則民無取。野不辟，民無取，外不可以應敵，內不可以固守。</p><p>有萬乘之號而無千乘之用，而求權之無輕，不可得也。</p><p><strong>所出</strong>：《管子 · 第03篇權修》 — https://zh.wikisource.org/wiki/管子/第03篇權修</p></article></main></div></div>
