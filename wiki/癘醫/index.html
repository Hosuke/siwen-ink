    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 癘醫</nav></header><main><article><h1>癘醫</h1><p>下士八人，掌腫瘤潰疡金疡折疡之祝藥劀殺</p><p>癘醫，下士八人。</p><p>掌腫瘤、潰疡、金疡、折疡之祝藥劀殺之齊。</p><p>凡療癘，以五毒攻之，以五氣養之，以五藥療之，以五味節之。</p><p>凡藥，以酸養骨，以辛養筋，以咸養脈，以苦養氣，以甘養肉，以滑養竅。凡有癘者，受其藥焉。</p><p>**所出</p></article></main></div></div>
