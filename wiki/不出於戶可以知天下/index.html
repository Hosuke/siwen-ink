    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不出於戶可以知天下</nav></header><main><article><h1>不出於戶可以知天下</h1><p>神明不離其實，心有所主，則戶牖之隔不能蔽之。</p><p>空竅者，神明之戶牖也。耳目竭於聲色，精神竭於外貌，故中無主。中無主，則禍福雖如丘山，無從識之。故老子曰：「不出於戶，可以知天下；不窺於牖，可以知天道。」此言神明之不離其實也。</p><p><strong>所出</strong>：《韓非子 · 喻老》 — https://zh.wikisource.org/wiki/韓非子/喻老</p></article></main></div></div>
