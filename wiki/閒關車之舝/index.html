    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 閒關車之舝</nav></header><main><article><h1>閒關車之舝</h1><p>車軸轉動之聲，興迎親之行。</p><p>《車舝》首句-{zh-hant:「閒關車之舝兮，思孌季女逝兮」}-。閒關，軸轉之聲也；-{zh-hant:「舝」}-，車軸之鍵。軸動輪轉，車馬乃行。詩人以-{zh-hant:「閒關車之舝」}-起興，-{zh-hant:「思孌季女逝」}-，馳而迎賢女以成昏禮，蓋車行而親迎之象也。</p><p><strong>所出</strong>：《詩經 · 車舝》 — https://zh.wikisource.org/wiki/詩經/車舝</p></article></main></div></div>
