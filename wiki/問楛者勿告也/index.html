    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 問楛者勿告也</nav></header><main><article><h1>問楛者勿告也</h1><p>非其道不告，不觀氣色而言；慎其身者，君子之操也。</p><p>問楛者勿告也，告楛者勿問也，說楛者勿聽也，有爭氣者勿與辯也。故必由其道至，然後接之，非其道則避之。故禮恭而後可與言道之方，辭順而後可與言道之理，色從而後可與言道之致。故未可與言而言之謂之傲，可與言而不言謂之隱，不觀氣色而言之謂之瞽。故君子不傲，不隱，不瞽，謹順其身。《詩》曰：「匪交匪舒，天子所予。」此之謂也。</p><p><strong>所出</strong>：《荀子 · 勸學篇》 — https://zh.wikisource.org/wiki/荀子/勸學篇</p></article></main></div></div>
