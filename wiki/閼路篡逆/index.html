    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 閼路篡逆</nav></header><main><article><h1>閼路篡逆</h1><p>杞湣公弟閼路弒君自立，杞國篡弒之禍。</p><p>湣公十五年，楚惠王滅陳。十六年，湣公弟閼路弒湣公代立，是為哀公。哀公立十年卒，湣公子敕立，是為出公。出公十二年卒，子簡公春立。立一年，楚惠王之四十四年，滅杞。</p><p><strong>所出</strong>：《史記 · 卷036》 — https://zh.wikisource.org/wiki/史記/卷036</p></article></main></div></div>
