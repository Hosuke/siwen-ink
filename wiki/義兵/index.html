    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 義兵</nav></header><main><article><h1>義兵</h1><p>誅暴君、振苦民之師，正義之兵也。</p><p>兵誠義，以誅暴君而振苦民，民之說之也，若孝子之見慈親也，若饑者之見美食也；民之號呼而走之，若彊弩之射於深谿也，若積大水而失其壅隄也。中主猶若不能有其民，而況於暴君乎？</p><p>義兵之為天下良藥也亦大矣。</p><p><strong>所出</strong>：《呂氏春秋 · 卷七》 — https://zh.wikisource.org/wiki/呂氏春秋/卷七</p></article></main></div></div>
