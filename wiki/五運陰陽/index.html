    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五運陰陽</nav></header><main><article><h1>五運陰陽</h1><p>天地之道，萬物之綱紀，生殺之本始。</p><p>五運陰陽者，天地之道也，萬物之綱紀，變化之父母，生殺之本始，神明之府也。</p><p>物生謂之化，物極謂之變。陰陽不測謂之神，神用無方謂之聖。</p><p>變化之為用也，在天為玄，在人為道，在地為化，化生五味，道生智，玄生神。</p><p>神在天為風，在地為木；在天為熱，在地為火；在天為濕，在地為土；在天為燥，在地為金；在天為寒，在地為水。在天為氣，在地成形，形氣相感而化生萬物。</p><p><strong>所出</strong>：《黃帝內經 · 素問第十九卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十九卷</p></article></main></div></div>
