    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 弗雍天之嘏命</nav></header><main><article><h1>弗雍天之嘏命</h1><p>當廣施天福於民，不可私壅。</p><p>王述大戊謙德，稱其「式惟三德賜我，吾乃敷之于百姓。余惟弗雍天之嘏命」。言天降福嘏，人君當分布於百姓，不可壅塞其命。施德布福，順天之事也。</p><p><strong>所出</strong>：《尚書 · 傅說之命下》 — https://zh.wikisource.org/wiki/尚書/傅說之命下</p></article></main></div></div>
