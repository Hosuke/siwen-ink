    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 往喜民來懼身</nav></header><main><article><h1>往喜民來懼身</h1><p>有善歸之於民則民喜，有過反之於身則身懼；往喜民，來懼身，此明王所以治民。</p><p>[[善罪身]]之義。[[有善反身]]之義反是。明王有善而[[有善反身]]，則身懼而不敢驕；有過而[[稱身之過]]，則民歸而功自成。[[往喜民來懼身]]者，乃治亂興衰之大分也。</p><p><strong>所出</strong>：《管子 · 第32篇小稱》 — https://zh.wikisource.org/wiki/管子/第32篇小稱</p></article></main></div></div>
