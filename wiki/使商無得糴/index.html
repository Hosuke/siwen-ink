    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 使商無得糴</nav></header><main><article><h1>使商無得糴</h1><p>禁商收購，使商不得糴而農不得糶</p><p>使商無得糴，農無得糶。農無得糶，則窳惰之農勉疾；商無得糴，則多歲不加樂，饑歲無裕利，無裕利則商怯，商怯則欲農。商不糴則無從牟利，農不糶則不得不勉於耕作，二者皆歸於農，則墾闢可期。</p><p><strong>所出</strong>：《商君書 · 卷一》 — https://zh.wikisource.org/wiki/商君書/卷一</p></article></main></div></div>
