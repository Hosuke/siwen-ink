    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五藏百結</nav></header><main><article><h1>五藏百結</h1><p>五藏百結生眾疾，玄一林虛老子開關解之</p><p>又肺為五藏之一，其神童子名素明，字無映，主制魄而禁邪，常守肺部之下、五關死炁之門。修真者存思素明真炁，華雲罩頂，萬魔不入，百神受靈。</p><p>  <strong>所出</strong>：《上清大洞真經 · 29章》 — https://zh.wikisource.org/wiki/上清大洞真經/29章</p></article></main></div></div>
