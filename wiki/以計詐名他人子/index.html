    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以計詐名他人子</nav></header><main><article><h1>以計詐名他人子</h1><p>呂后取美人子名之，殺其母，立所名子為太子。</p><p>宣平侯女為孝惠皇后時，無子，詳為有身，取美人子名之，殺其母，立所名子為太子。孝惠崩，太子立為帝。帝壯，或聞其母死，非真皇后子，乃出言不遜。太后聞而患之，乃幽之永巷中，言帝病甚。太后欲廢之，群臣頓首奉詔。帝廢位，太后幽殺之。</p><p><strong>所出</strong>：《史記 · 卷009》 — https://zh.wikisource.org/wiki/史記/卷009</p></article></main></div></div>
