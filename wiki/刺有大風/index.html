    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 刺有大風</nav></header><main><article><h1>刺有大風</h1><p>大風病，骨節重，眉墮，先刺肌肉汗出百日，次刺骨髓汗出百日，凡二百日眉生止針。</p><p>病大風，骨節重，鬚眉墮，名曰大風，刺肌肉為故，汗出百日，刺骨髓，汗出百日，凡二百日，鬚眉生而止針。</p><p><strong>所出</strong>：《黃帝內經 · 素問第十四卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十四卷</p></article></main></div></div>
