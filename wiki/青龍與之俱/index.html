    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 青龍與之俱</nav></header><main><article><h1>青龍與之俱</h1><p>青龍之氣與汞日流珠相隨，共成丹功。</p><p>青龍者，木之精、魂之象、東方之神也。丹法之中，青龍之氣與[[汞日流珠]]相將而行，蓋汞無制則散，青龍為之制；龍無汞則孤，汞為之附。</p><p>[[魂魄自相拘]]之義，正此之謂。魂拘魄而魄斂魂，二者相須不可離，方成[[兩弦合其精]]之功。若青龍獨行則[[白虎熬樞]]之斂散無所施，故必相與俱也。</p><p><strong>所出</strong>：《周易參同契 · 09章》 — https://zh.wikisource.org/wiki/周易參同契/09章</p></article></main></div></div>
