    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 師友當取寒素</nav></header><main><article><h1>師友當取寒素</h1><p>朋友師傅，宜選寒素德行之士，清苦自立即可。</p><p>朋友師傅，尤宜精簡。必取寒素德行之士，以清苦自立，以不群見憚者。其經術如仲舒桓榮者，強直若龔遂王吉者，能朝夕講論忠孝之至道，正色證存亡之軌跡，以洗濯垢涅，閑邪矯枉，宜必抑情遵憲法，入德訓者矣。</p><p><strong>所出</strong>：《抱朴子 · 卷04》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷04</p></article></main></div></div>
