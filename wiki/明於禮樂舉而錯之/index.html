    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 明於禮樂舉而錯之</nav></header><main><article><h1>明於禮樂舉而錯之</h1><p>君子明於禮樂，舉而錯之，則天下太平。</p><p>子張問政，子曰：「師乎！前，吾語女乎？君子明於禮樂，舉而錯之而已。」又云：「禮之所興，眾之所治也；禮之所廢，眾之所亂也。目巧之室，則有奧阼。」</p><p><strong>所出</strong>：《禮記 · 仲尼燕居》 — https://zh.wikisource.org/wiki/禮記/仲尼燕居</p></article></main></div></div>
