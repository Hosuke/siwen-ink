    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 靡有孑遺</nav></header><main><article><h1>靡有孑遺</h1><p>皆盡而無遺，狀災厄之慘。</p><p>詩言「周餘黎民，靡有孑遺」，孑，單也；遺，留也。言周之遺民，無一孤獨得留存者，極狀旱災饑饉之慘。</p><p><strong>所出</strong>：《詩經 · 雲漢》 — https://zh.wikisource.org/wiki/詩經/雲漢</p></article></main></div></div>
