    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 坤文言　積善之家</nav></header><main><article><h1>坤文言　積善之家</h1><p>善惡之積，漸以成殃。</p><p>坤文言解初六「履霜」曰：「積善之家，必有餘慶；積不善之家，必有餘殃。臣弒其君，子弒其父，非一朝一夕之故，其所由來者漸矣。由辨之不早辨也。」</p><p>此言善惡之報，皆由漸積而成，非偶然也。</p><p><strong>所出</strong>：《周易 · 坤》 — https://zh.wikisource.org/wiki/周易/坤</p></article></main></div></div>
