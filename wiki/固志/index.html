    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 固志</nav></header><main><article><h1>固志</h1><p>志意堅固則外物不能奪</p><p>《象》曰：「執用黃牛，固志也。」</p><p>六二以柔中得位，上應九五之尊，而能執用黃牛之革，確乎不可拔。革之為物，堅韌難解，以象志之固守。六二居中得正，中正則志定，定志則外物不能動、威勢不能移。《易》以「固志」許之，見志之不可搖，乃君子之操也。</p><p><strong>所出</strong>：《周易 · 遯》 — https://zh.wikisource.org/wiki/周易/遯</p></article></main></div></div>
