    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 雲龍風虎</nav></header><main><article><h1>雲龍風虎</h1><p>以神召氣、以母召子，則無所不至</p><p>雲龍風虎，得神氣之道者也。神由母也，氣由子也，以神召氣，以母召子，孰敢不至也？夫蕩穢者，必召五帝之氣，茍召不至，穢何以蕩？伏虺者，必役五星之精，茍役不至，虺何以伏？小人由是知陰陽可以作，風雲可以會，山陵可以拔，江海可以覆。然召之於外，不如守之於內，然後用之於外，則無所不可。</p><p><strong>所出</strong>：《化書 · 卷二》 — https://zh.wikisource.org/wiki/化書/卷二</p></article></main></div></div>
