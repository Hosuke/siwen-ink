    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖人之情，見乎辭矣</nav></header><main><article><h1>聖人之情，見乎辭矣</h1><p>聖人真情發為言辭，可得而聞也。</p><p>《征聖》云：「聖人之情，見乎辭矣。」聖人者，志存玄德，情合天道，其喜怒哀樂皆中節，其言辭進退皆合宜。然聖人非無情也，特情正而辭達耳。夫子文章可得而聞，正以其情發諸辭，而辭能曲盡其情也。苟情不見辭，則聖人之意何以傳？苟辭不本情，則言說之美何以成？情與辭合，而後聖人之心大白於天下。</p><p><strong>所出</strong>：《文心雕龍 · 征聖》 — https://zh.wikisource.org/wiki/文心雕龍/徵聖</p></article></main></div></div>
