    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蹈舞</nav></header><main><article><h1>蹈舞</h1><p>蹈舞非蹈舞，禱祝非禱祝，表象皆虛，其本一也。</p><p>術有降萬物之蘊毒者，則交臂鉤指，象之為符。是故若夭嬌之勢者鱗之符，若飛騰之勢者羽之符，若偃蹇之勢者毛之符，若拳跼之勢者介之符，所以知拱折者人之符。夫拱手者，人必拱之；折腰者，人必折之，禮之本也。而疏之為萬象，別之為萬態。教之蹈舞，非蹈舞也；使之禱祝，禱祝也，我既寡實，彼亦多虛。而責人之無情，固無情也；而罪禮之無驗，固無驗也。</p><p><strong>所出</strong>：《化書 · 卷四》 — https://zh.wikisource.org/wiki/化書/卷四</p></article></main></div></div>
