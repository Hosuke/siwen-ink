    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蹞步不休</nav></header><main><article><h1>蹞步不休</h1><p>積微不止，終成千里；持續不懈，跛鼈可至。</p><p>夫驥一日而千里，駑馬十駕則亦及之矣。將以窮無窮，逐無極與？其折骨絶筋，終身不可以相及也。將有所止之，則千里雖遠，亦或遲或速、或先或後，胡爲乎其不可以相及也？故蹞步而不休，跛鼈千里；累土而不輟，丘山崇成；厭其源，開其瀆，江河可竭；一進一退，一左一右，六驥不致。彼人之才性之相縣也，豈若跛鼈之與六驥足哉？然而跛鼈致之，六驥不致，是無它故焉，或爲之，或不爲爾。</p><p><strong>所出</strong>：《荀子 · 修身篇》 — https://zh.wikisource.org/wiki/荀子/修身篇</p></article></main></div></div>
