    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 朱虛侯耕田歌</nav></header><main><article><h1>朱虛侯耕田歌</h1><p>劉章以耕田歌諷刺呂氏，意在除去異種。</p><p>朱虛侯年二十，有氣力，忿劉氏不得職。嘗入侍高后燕飲，自請以軍法行酒。酒酣，章進飲歌舞，已而請為太后言耕田歌。高后笑曰：「若生而為王子，安知田乎？」章曰：「臣知之。」太后令試言，章乃曰：「深耕穊種，立苗欲疏，非其種者，鉏而去之。」呂后默然。頃之，諸呂有一人醉亡酒，章追而拔劍斬之，還報太后。太后左右皆大驚，然已許軍法，無以罪也。自是之後，諸呂憚朱虛侯，劉氏為益彊。</p><p><strong>所出</strong>：《史記 · 卷052》 — https://zh.wikisource.org/wiki/史記/卷052</p></article></main></div></div>
