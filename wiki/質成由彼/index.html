    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 質成由彼</nav></header><main><article><h1>質成由彼</h1><p>材成於己，而必資乎師友切磋。</p><p>《抱朴子》論學之要，曰：「故質雖在我，而成之由彼也。」又曰：「欲見無外而不下堂，必由之乎載籍；欲測淵微而不役神，必得之乎明師。」</p><p>夫丹青不治，則純鉤之勁不就；火則不鉆不生，不扇不熾。材之美惡，待人之雕琢而成。猶斫削刻畫之薄伎，射御騎乘之易事，猶須慣習，況乎道德之遠、陰陽之變、鬼神之情乎？</p><p>故[[明師之恩]]，所以[[朱綠所以改素絲]]，[[披玄雲而揚大明]]，使萬物無所隱其狀，天地無所藏其情也。</p><p><strong>所出</strong>：《抱朴子 · 卷03》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷03</p></article></main></div></div>
