    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 終窶且貧</nav></header><main><article><h1>終窶且貧</h1><p>賢士居位而陷於貧，時也，非愆也。</p><p>或問《北門》之詩何以云「終窶且貧」？曰：此言居於尊位者，乃亦未免於困窶之患。夫有其德有其才，而不能庇其一身，豈非命也？時際板蕩，祿不足以代耕，而憂心殷殷，莫知我艱。終窶者，非怠而致也；且貧者，非拙而然也。時命不齊，賢者在位而困，乃天道之常，而非人之愆也。</p><p><strong>所出</strong>：《詩經 · 北門》 — https://zh.wikisource.org/wiki/詩經/北門</p></article></main></div></div>
