    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 行不由徑</nav></header><main><article><h1>行不由徑</h1><p>澹臺滅明之正</p><p>子游為武城宰，孔子問「女得人焉耳乎」，子游對有澹臺滅明者，「行不由徑；非公事，未嘗至於偃之室也」。行不由徑，見其人之方正不苟合矣。</p><p><strong>所出</strong>：《論語 · 雍也第六》 — https://zh.wikisource.org/wiki/論語/雍也第六</p></article></main></div></div>
