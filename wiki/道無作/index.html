    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 道無作</nav></header><main><article><h1>道無作</h1><p>道無作無方，聖人不能出道以示人。</p><p>道無作，以道應世者，是事非道。道無方，以道寓物者，是物非道。聖人竟不能出道以示人。</p><p>如鐘鐘然，如鐘鼓然，聖人之言則然。如車車然，如車舟然，聖人之行則然。惟莫能名，所以退天下之言；惟莫能知，所以奪天下之智。</p><p><strong>所出</strong>：《關尹子 · 3》 — https://zh.wikisource.org/wiki/關尹子/3</p></article></main></div></div>
