    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 帝堯試鯀治水</nav></header><main><article><h1>帝堯試鯀治水</h1><p>堯以鯀治水，九載功用不成。</p><p>堯曰：「嗚！四嶽：湯湯洪水滔天，浩浩懷山襄陵，下民其憂，有能使治者？」皆曰：「鮌可。」堯曰：「負命毀族，不可。」嶽曰：「异哉，試不可用而已。」堯於是聽嶽用鯀。九載，功用不成。</p><p><strong>所出</strong>：《史記 · 卷001》 — https://zh.wikisource.org/wiki/史記/卷001</p></article></main></div></div>
