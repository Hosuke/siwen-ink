    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 明辨晰也</nav></header><main><article><h1>明辨晰也</h1><p>智光照朗，善惡分明。</p><p>九四「匪其彭」，《象》傳以「明辨晰也」釋之。言九四以陽居陰，位近六五之尊，能知彭盛之不可長，退而不進，辨之明也。晰者，分明之貌。君子居高位而不驕，知止而不盈，其智光照朗，灼見是非之幾，是以无咎也。</p><p><strong>所出</strong>：《周易 · 大有》 — https://zh.wikisource.org/wiki/周易/大有</p></article></main></div></div>
