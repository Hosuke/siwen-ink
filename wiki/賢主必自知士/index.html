    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 賢主必自知士</nav></header><main><article><h1>賢主必自知士</h1><p>賢主自知其士，故士盡力竭智。</p><p>賢主必自知士，故士盡力竭智，直言交爭，而不辭其患。[[士節]]之義明，則賢主之職盡矣。</p><p>湯、武，千乘也，而士皆歸之。桀、紂，天子也，而士皆去之。孔、墨，布衣之士也；萬乘之主，千乘之君，不能與之爭士也。自此觀之，尊貴富大不足以來士矣，必自知之然後可。</p><p>是故得地百里則喜者，世俗之君也；得士則不喜、不通乎輕重者，未知士之貴也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十二》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十二</p></article></main></div></div>
