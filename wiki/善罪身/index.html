    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 善罪身</nav></header><main><article><h1>善罪身</h1><p>善罪身者民不得罪；稱身之過者强，治身之節者惠，不以不善歸人者仁。</p><p>管子言：「善罪身者，民不得罪也。不能罪身者，民罪之。」稱身之過者，强也；治身之節者，惠也；不以不善歸人者，仁也。明王有過反之於身，有善歸之於民。有過反身則身懼，有善歸民則民喜。往喜民，來懼身，此明王之所以治民也。</p><p><strong>所出</strong>：《管子 · 第32篇小稱》 — https://zh.wikisource.org/wiki/管子/第32篇小稱</p></article></main></div></div>
