    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大樗</nav></header><main><article><h1>大樗</h1><p>大樹無用，不夭斤斧，逍遙寢臥其下，乃無用之用。</p><p>惠子又謂莊子曰：「吾有大樹，人謂之樗。其大本擁腫而不中繩墨，其小枝卷曲而不中規矩，立之塗，匠者不顧。今子之言，大而無用，眾所同去也。」</p><p>莊子曰：「子獨不見狸狌乎？卑身而伏，以候敖者；東西跳梁，不避高下；中於機辟，死於罔罟。今夫牛，其大若垂天之雲。此能為大矣，而不能執鼠。今子有大樹，患其無用，何不樹之於无何有之鄉，廣莫之野，彷徨乎无為其側，逍遥乎寢臥其下？不夭斤斧，物無害者，無所可用，安所困苦哉！」</p><p><strong>所出</strong>：《莊子 · 逍遙遊》 — https://zh.wikisource.org/wiki/莊子/逍遙遊</p></article></main></div></div>
