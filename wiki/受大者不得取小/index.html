    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 受大者不得取小</nav></header><main><article><h1>受大者不得取小</h1><p>食祿者不得與民爭利</p><p>公儀休爲魯相，奉法循理，無所變更。其言曰：「使食祿者不得與下民爭利，受大者不得取小。」言居上位者，既享厚祿，則不當復取小利以奪民資。此廉吏之要義也。</p><p><strong>所出</strong>：《史記 · 卷119》 — https://zh.wikisource.org/wiki/史記/卷119</p></article></main></div></div>
