    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 權輿樹根基</nav></header><main><article><h1>權輿樹根基</h1><p>萬物之始，先立根基，此生化之本原也。</p><p>權輿者，萬物之始也。混沌交接，權輿樹根基。根者，本也；基者，始也。生化之功，先立其本。</p><p><strong>所出</strong>：《周易參同契 · 03章》 — https://zh.wikisource.org/wiki/周易參同契/03章</p></article></main></div></div>
