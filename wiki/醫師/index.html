    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 醫師</nav></header><main><article><h1>醫師</h1><p>上士二人，掌醫之政令聚毒藥以共醫事</p><p>醫師，上士二人，下士四人；府二人，史二人，徒二十人。</p><p>掌醫之政令，聚毒藥以共醫事。凡邦之有疾病者、疕癤者造焉，則使醫分而治之。</p><p>歲終，則稽其醫事，以制其食：十全為上，十失一次之，十失二次之，十失三次之，十失四為下。</p><p><strong>所出</strong>：《周禮 · 天官冢宰》 — https://zh.wikisource.org/wiki/周禮/天官冢宰</p></article></main></div></div>
