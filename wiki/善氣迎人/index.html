    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 善氣迎人</nav></header><main><article><h1>善氣迎人</h1><p>善氣迎人，親如弟兄；氣者身之充，美則心得。</p><p>善氣迎人，親如弟兄；惡氣迎人，害於戈兵。</p><p>夫充乎身中之氣，其善也溫然而和，人感之則如弟兄之親；其惡也慘然而厲，人受之則如戈兵之害。充之美者，其心充而且樂，無私意之累也；充之不美者，其心戾而且怨，有欲念之蔽也。</p><p>聖人知其然，養之以正，持之以和，使充之美常充於內，則善氣自形於外，不言而化，不令而從。此身脩而德畜之驗也。</p><p><strong>所出</strong>：《管子 · 第37篇心術下》 — https://zh.wikisource.org/wiki/管子/第37篇心術下</p></article></main></div></div>
