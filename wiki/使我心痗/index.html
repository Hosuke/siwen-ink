    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 使我心痗</nav></header><main><article><h1>使我心痗</h1><p>思而成病，心為之病也。</p><p>詩云「心之憂矣，願言思伯，使心痗」，《園有桃》之卒章也。毛《傳》以為「痗，病也」。言我心思念此賢伯，竟成疾病。</p><p>  前乎此者，《詩經》之什已見「使我心痗」一語，其義則同。然《園有桃》之「思伯」，解者或以為思賢，或以為思人，要之皆言懷思之深而至於成病。《集傳》云「痗，病也」，是也。</p><p>  憂之甚者思之深，思之深者病之至，此物理之常，故詩人言之。後世屈原「離騷」云「長太息以掩涕兮，哀民生之多艱」，亦此意也。</p><p>  <strong>所出</strong>：《詩經 · 園有桃》 — https://zh.wikisource.org/wiki/詩經/園有桃</p></article></main></div></div>
