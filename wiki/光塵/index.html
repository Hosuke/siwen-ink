    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 光塵</nav></header><main><article><h1>光塵</h1><p>和光同塵，聖人無偏。</p><p>挫其銳，
解其紛，
和其光，
同其塵。</p><p>聖人治身治世，挫其鋒銳，不與物競；解其紛亂，不立崖岸。及其光也，和之而不炫；及其塵也，同之而不異。光與塵一，無往而非道也。</p><p><strong>所出</strong>：《老子河上公章句 · 無源》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
