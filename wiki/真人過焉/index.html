    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 真人未嘗過焉</nav></header><main><article><h1>真人未嘗過焉</h1><p>真人清虛，不以言行干預世事；聖人動天下，真人未嘗親歷。</p><p>老子曰：「聖人者以目視，以耳聽，以口言，以足行。真人者，不視而明，不聽而聰，不行而從，不言而公。」又云：「聖人之所以動天下者，真人未嘗過焉；賢人所以俠世俗者，聖人未嘗觀焉。」</p><p>言聖人尚有為有作，真人則廓然無際，不以形迹累世。故真人清虛寂漠，超然物表，非聖人之所能及，亦非聖人之所可測也。</p><p><strong>所出</strong>：《文子 · 卷七》 — https://zh.wikisource.org/wiki/文子/卷七</p></article></main></div></div>
