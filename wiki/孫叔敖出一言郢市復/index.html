    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 孫叔敖出一言郢市復</nav></header><main><article><h1>孫叔敖出一言郢市復</h1><p>孫叔敖一言而市肆復舊，喻善政之效速</p><p>太史公贊循吏五人，而以孫叔敖爲首。云孫叔敖出一言，郢市復。言不待威嚴而民從化，市肆紊亂，敖言一出，即復如故。是以知治道在循理，不在刑罰也。</p><p><strong>所出</strong>：《史記 · 卷119》 — https://zh.wikisource.org/wiki/史記/卷119</p></article></main></div></div>
