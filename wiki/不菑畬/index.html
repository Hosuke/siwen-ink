    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不菑畬</nav></header><main><article><h1>不菑畬</h1><p>農事順時，不圖倖獲。</p><p>不菑畬者，述農事之道也。菑者，殺草以始耕；畬者，熟田之稱。言不躬耕而望其獲，不豫治而希其成，凡斯之念，皆妄也。聖人觀无妄之象，知生財有道，取之有時，不以區區倖致，而忘夫播植之本。此聖人茂對時育之一端也。</p><p><strong>所出</strong>：《周易 · 无妄》 — https://zh.wikisource.org/wiki/周易/无妄</p></article></main></div></div>
