    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 舍拔則獲</nav></header><main><article><h1>舍拔則獲</h1><p>言射者放弦即得禽獸。</p><p>公曰左之，舍拔則獲。舍，放也；拔，弓弦也。《詩經·駟驖》：「公曰左之，舍拔則獲。」言秦襄公命禦者向左以包抄禽獸，射者放弦施箭，旋即得獲也。毛傳：「拔，矢也。」《說文》引作「豻」，以為弦也。舍拔言其疾，則獲言其效。田狩之要，在於車輿之利、弓矢之精、配合之妙也。
<strong>所出</strong>：《詩經 · 駟驖》 — https://zh.wikisource.org/wiki/詩經/駟驖</p></article></main></div></div>
