    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 愛憎好惡古今不均</nav></header><main><article><h1>愛憎好惡古今不均</h1><p>抱朴子言世風時變，愛憎好惡古今不同，物價貴賤亦隨時異。</p><p>此條論古今愛憎之殊、物價貴賤之異，以明世變風移之理。</p><p>且夫愛憎好惡，古今不均，時移俗易，物同價異。譬之夏後之璜，曩直連城，鬻之於今，賤於銅鐵。故昔以隱居求誌為高士，今以山林之儒為不肖。故聖世之良榦，乃闇俗之罪人也；往者之介潔，乃末葉之羸劣也。</p><p><strong>所出</strong>：《抱朴子 · 卷18》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷18</p></article></main></div></div>
