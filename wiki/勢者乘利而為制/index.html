    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 勢者，乘利而為制</nav></header><main><article><h1>勢者，乘利而為制</h1><p>勢之成也，乘事物之利自然而制。</p><p>勢者，乘利而為制也。如機發矢直，澗曲湍回，自然之趣也。</p><p>機括既發，矢自直行；澗流遇石，自然迴折。此非有意為之，乃乘其利而勢自成焉。圓者規體，其勢也自轉；方者矩形，其勢也自安；文章體勢，如斯而已。模經者入典雅，效騷者歸豔逸，綜淺切者乏醞藉，斷辨約者乖繁縟，譬如激水不漪，槁木無陰，皆自然之勢也。</p><p><strong>所出</strong>：《文心雕龍 · 定勢》 — https://zh.wikisource.org/wiki/文心雕龍/定勢</p></article></main></div></div>
