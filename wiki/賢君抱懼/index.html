    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 賢君抱懼</nav></header><main><article><h1>賢君抱懼</h1><p>賢君常懷危懼，故能終保其治。</p><p>賢君抱懼不足，而改過恐有余。謀當計得，猶思危而弗休焉；戰勝地廣，猶戒盈而夕惕焉。</p><p><strong>所出</strong>：《抱朴子 · 卷05》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷05</p></article></main></div></div>
