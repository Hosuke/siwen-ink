    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 終身不勤</nav></header><main><article><h1>終身不勤</h1><p>塞兌閉門者，終身不勞。</p><p>勤者，有所作為之謂也。塞其兌、閉其門，則外不接物，內不生知，[[無為]]而自治。《[[道德經]]》以為：「為道日損，損之又損，以至於無為。」既無為矣，則何勤之有？終身悠然，不勤而自治也。</p><p><strong>所出</strong>：《老子河上公章句 · 歸元》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
