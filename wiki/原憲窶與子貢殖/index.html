    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 原憲窶與子貢殖</nav></header><main><article><h1>原憲窶與子貢殖</h1><p>原憲窶而損生，子貢殖而累身；楊朱以為窶亦不可殖亦不可，其可者在樂生、逸身。</p><p>楊朱曰：「原憲窶於魯，子貢殖於衛。原憲之窶損生，子貢之殖累身。」「然則窶亦不可，殖亦不可，其可焉在？」曰：「可在樂生，可在逸身。故善樂生者不窶，善逸身者不殖。」</p><p><strong>所出</strong>：《列子 · 楊朱篇》 — https://zh.wikisource.org/wiki/列子/楊朱篇</p></article></main></div></div>
