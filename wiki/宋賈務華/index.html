    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 宋賈務華</nav></header><main><article><h1>宋賈務華</h1><p>宋忠使匈奴、賈誼為梁傅，皆務名華而不慎終</p><p>季主既斥二大夫，二大夫行洋退出門，不能出氣。居三日，宋忠見賈誼於殿門外，乃相引屏語相謂自歎，悟道高安、勢高危之理。既而言及二子之終：「久之，宋忠使匈奴，不至而還，抵罪。而賈誼為梁懷王傅，王墮馬薨，誼不食，毒恨而死。此務華絶根者也。」</p><p>言宋忠使匈奴不當，賈誼傅梁王而王薨，皆不得其死。二人皆務外華之名而昧持身之要，故有此禍。與季主所言「得不為喜，去不為恨」者正相反也。</p><p><strong>所出</strong>：《史記 · 卷127》 — https://zh.wikisource.org/wiki/史記/卷127</p></article></main></div></div>
