    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 錫衰</nav></header><main><article><h1>錫衰</h1><p></p><p>《禮記·服問》云：</p><p>「公為卿大夫錫衰以居，出亦如之。當事則弁絰。大夫相為，亦然。為其妻，往則服之，出則否。」</p><p>此段論錫衰之服制。錫衰者，以錫布所為衰也。諸侯為卿大夫服錫衰，居處之間皆服之，出亦如之。若當大斂、小斂、殯葬之事，則加以弁絰。</p><p>大夫相為亦然，皆用錫衰。唯為其妻則異：往日時服之，出門則否。此所以別親疏、辨往反也。</p><p>錫衰之制，蓋次於齊衰，而重於緦衰。卿大夫之喪，諸侯服錫衰；大夫之喪，大夫相為亦服錫衰。其在大夫之妻，則往日服之，出則不服，以其恩義有殺也。</p></article></main></div></div>
