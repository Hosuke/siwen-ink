    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖人渾之</nav></header><main><article><h1>聖人渾之</h1><p>聖人渾然無辨利害賢愚是非美醜之心。</p><p>利害心愈明，則親不睦；賢愚心愈明，則友不交；是非心愈明，則事不成，好醜心愈明，則物不契。是以聖人渾之。</p><p>世之愚拙者妄援，聖人之愚拙自解。殊不知聖人時愚時明，時拙時巧。</p><p><strong>所出</strong>：《關尹子 · 3》 — https://zh.wikisource.org/wiki/關尹子/3</p></article></main></div></div>
