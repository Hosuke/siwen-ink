    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 富貴者驕人乎</nav></header><main><article><h1>富貴者驕人乎</h1><p>貧賤者宜傲，諸侯驕人則失國。</p><p>田子方嘗告魏太子撃曰：「富貴者驕人乎？且貧賤者驕人乎？」子方曰：「亦貧賤者驕人耳。夫諸侯而驕人則失其國，大夫而驕人則失其家。貧賤者，行不合，言不用，則去之楚、越，若脱屣然，柰何其同之哉！」</p><p>此言貧賤者無所係戀，故可以驕人；富貴者有所恃怙，驕則取禍也。</p><p><strong>所出</strong>：《史記 · 魏世家》 — https://zh.wikisource.org/wiki/史記/魏世家</p></article></main></div></div>
