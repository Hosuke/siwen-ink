    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 自今及古</nav></header><main><article><h1>自今及古</h1><p>道名之存，貫通古今</p><p>（自今及古，亓名不去，以順眾父。）</p><p>道之為名，自今日以溯於古昔，未嘗有須臾之離。名者，道之稱也；稱之不亡，則道之恒存可知已。</p><p>夫名之不去，非徒文字之謂也，乃道之真際歷萬古而如一。聖人因其名之不去，可以奉順乎眾父。父者，本也；眾父者，萬物之本源也。循名以索道，緣道以返本，此古聖所以通幽明、一上下者歟。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第六十五章 從道》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
