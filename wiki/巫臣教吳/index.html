    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 巫臣教吳</nav></header><main><article><h1>巫臣教吳</h1><p>申公巫臣奔晉，教吳用兵乘車，吳始通於中國</p><p>王壽夢二年，楚之亡大夫申公巫臣怨楚將子反而奔晉，自晉使吳，教吳用兵乘車，令其子為吳行人，吳於是始通於中國。吳伐楚。十六年，楚共王伐吳，至衡山。</p><p><strong>所出</strong>：《史記 · 卷031》 — https://zh.wikisource.org/wiki/史記/卷031</p></article></main></div></div>
