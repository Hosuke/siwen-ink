    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 守株待兔</nav></header><main><article><h1>守株待兔</h1><p>泥古法以治今民，譬如守株而冀復得兔，徒爲天下笑。</p><p>宋人有耕田者，田中有株，兔走觸株，折頸而死，因釋其耒而守株，冀復得兔，兔不可復得，而身爲宋國笑。今欲以先王之政，治當世之民，皆守株之類也。</p><p><strong>所出</strong>：《韓非子 · 五蠹》 — https://zh.wikisource.org/wiki/韓非子/五蠹</p></article></main></div></div>
