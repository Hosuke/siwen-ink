    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 愛刑一本</nav></header><main><article><h1>愛刑一本</h1><p>刑乃愛之本，非怨民之具；法者王之本，刑者愛之自。</p><p>聖人之治民，度於本，不從其欲，期於利民而已。故其與之刑，非所以惡民，愛之本也。</p><p>故法者，王之本也；刑者，愛之自也。</p><p><strong>所出</strong>：《韓非子 · 心度》 — https://zh.wikisource.org/wiki/韓非子/心度</p></article></main></div></div>
