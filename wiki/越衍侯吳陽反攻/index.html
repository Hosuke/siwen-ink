    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 越衍侯吳陽反攻</nav></header><main><article><h1>越衍侯吳陽反攻</h1><p>故越衍侯吳陽前在漢，漢使歸曉馀善弗聽，乃以邑七百人反，攻馀善軍於漢陽。</p><p>元封元年冬，漢兵咸入東越。東越素發兵距險，使徇北將軍守武林，雖有小捷，終不敵漢師之眾。時故越衍侯吳陽前在漢，漢使歸曉馀善，馀善弗聽。吳陽乃以其邑七百人反，攻越軍於漢陽，從建成侯敖，與其率，及繇王居股共謀，說以大義。吳陽首倡反正之師，越人聞風而應，內外合勢，卒與諸將共殺馀善，以其眾降。陽之歸義，可謂能知順逆者矣。</p><p><strong>所出</strong>：《史記 · 卷114》 — https://zh.wikisource.org/wiki/史記/卷114</p></article></main></div></div>
