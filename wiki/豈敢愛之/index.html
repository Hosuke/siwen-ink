    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 豈敢愛之</nav></header><main><article><h1>豈敢愛之</h1><p>不以一己之欲而易所愛，畏親言而自抑，是為克己之心。</p><p>「豈敢愛之」，反言以見義也，非真不愛也，正以愛之深，故不敢以私害禮。</p><p>詩人每言「豈敢愛之」者，皆承上「畏我父母」「畏我諸兄」「畏人之多言」而言。己之私愛，不若親兄之言、眾人之議為重也。此心一起，則逾牆折木之念為之止矣。</p><p>克己之義，於此見之。不以情廢禮，不以愛忽義，斯之謂也。</p><p><strong>所出</strong>：《詩經 · 將仲子》 — https://zh.wikisource.org/wiki/詩經/將仲子</p></article></main></div></div>
