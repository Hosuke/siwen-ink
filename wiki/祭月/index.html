    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 祭月</nav></header><main><article><h1>祭月</h1><p>天子於秋分祭月，以時行刑。</p><p>以秋日至始，數九十二日，謂之秋至，秋至而禾熟。天子祀於太惢，西出其國百三十八里而壇，服白而絻白，搢玉揔，帶錫監，吹塤箎之風鑿，動金石之音，朝諸侯卿大夫列士，循於百姓，號曰祭月，犧牲以彘。</p><p>言天子於秋至之節，行[[天子四時之令|祭月之禮]]。西出百三十八里，隂道之義也；服白尚金；樂用金石，所以象肅殺之氣也；犧牲以彘，彘之為物，逆時而肥，取其成物之義也。</p><p><strong>所出</strong>：《管子 · 第85篇輕重己》 — https://zh.wikisource.org/wiki/管子/第85篇輕重己</p></article></main></div></div>
