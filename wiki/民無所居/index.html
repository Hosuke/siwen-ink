    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 民無所居</nav></header><main><article><h1>民無所居</h1><p>魏國削小，民不得安居，詩刺之本旨。</p><p>民無所居，毛詩序刺魏之旨也。序云：「《十畝之間》，刺時也。言其國削小，民無所居焉。」魏地褊迫，恃力薄斂，政令急迫，民不得遂其生。詩人見桑者之閒泄，欲還欲逝，實隱民無所樂、無所居之意焉。桑田之樂，反見居國之迫，故以歸逝為辭，刺時之心深矣。</p><p><strong>所出</strong>：《詩經 · 十畝之間》 — https://zh.wikisource.org/wiki/詩經/十畝之間</p></article></main></div></div>
