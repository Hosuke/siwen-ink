    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖人不病</nav></header><main><article><h1>聖人不病</h1><p>聖人自知之明，無自病之患。</p><p>聖人之所以不病者，非無病害之加於身，乃無自病之心也。自知其不知，則虛心納物，無強不知以為知之患。</p><p>[[聖人恆無心]]，[[聖人無常心]]，不自矜其知，不自是其見，[[知其雄守其雌]]，以此自處，故能[[百病不侵]]而無[[病能]]之累。[[以其病病是以不病]]，知病之所在而不為病所困，此聖人所以[[病能]]而常安也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章七十一》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
