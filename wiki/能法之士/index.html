    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 能法之士</nav></header><main><article><h1>能法之士</h1><p>强毅勁直、能以法-{矫}-姦之臣。</p><p>智術之士，必遠見而明察，不明察，不能燭私；能法之士，必强毅而勁直，不勁直，不能-{矫}-姦。</p><p>能法之士勁直，聽用，且-{矫}-重人之姦行。能法之士與智術之士並用，則貴重之臣必在繩之外矣。然法術之士操五不勝之勢，以歲數而又不得見，當塗之人乘五勝之資，而旦暮獨說於前。故法術之士奚道得進，而人主奚時得悟乎？</p><p><strong>所出</strong>：《韓非子 · 孤憤》 — https://zh.wikisource.org/wiki/韓非子/孤憤</p></article></main></div></div>
