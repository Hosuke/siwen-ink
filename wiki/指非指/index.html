    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 指非指</nav></header><main><article><h1>指非指</h1><p>指能指物，而指自非所指之指。</p><p>指也者，天下之所無也；物也者，天下之所有也。</p><p>指非指，[[物莫非指]] 之對也。「指」為能指之名，「所指」為所指之實。能指者不可以自指，此其別也。[[指與物非指]]言之矣，指與物合而言之，則非指也。</p><p><strong>所出</strong>：《公孫龍子 · 3》 — https://zh.wikisource.org/wiki/公孫龍子/3</p></article></main></div></div>
