    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 梓匠山積</nav></header><main><article><h1>梓匠山積</h1><p>材料雖富，必待良匠而成器；書籍雖多，必資英才以取精。</p><p>八音形器異而鍾律同，黼黻文物殊而五色均。徒閑澀有主賓，妍媸有步驟。是則總章無常曲，大庖無定味。夫梓豫山積，非班匠不能成機巧；眾書無限，非英才不能收膏腴。何必尋木千里，乃構大廈；鬼神之言，乃著篇章乎！言材料之富，非無所用；然無良匠，終不成器。猶書卷之廣，非英才不能取其精華也。[[才有清濁思有修短]]，才之高下殊途；而無[[梓匠規矩]]之工，雖有好材，亦無所用矣。</p><p><strong>所出</strong>：《抱朴子 · 卷40》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷40</p></article></main></div></div>
