    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 其德靡悔</nav></header><main><article><h1>其德靡悔</h1><p>德行完美，無可悔恨也。</p><p>其德靡悔，言王季及其子文王之德，完美無瑕，無可悔恨也。《皇矣》曰：「比于文王，其德靡悔，既受帝祉，施于孫子。」靡悔者，無遺憾也。言文王之德，比於王季，無有悔吝，既受天福，又遺被子孫也。詩人美二聖之德，以見周之王業，上承天命，下有厚德，故能奄有四方也。</p><p><strong>所出</strong>：《詩經 · 皇矣》 — https://zh.wikisource.org/wiki/詩經/皇矣</p></article></main></div></div>
