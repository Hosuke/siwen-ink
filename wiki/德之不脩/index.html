    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 德之不脩，學之不講</nav></header><main><article><h1>德之不脩，學之不講</h1><p>德行不修、學問不講為聖人之憂。</p><p>孔子以四者為憂：德不脩、學不講、聞義不能徙、不善不能改。蓋脩德、進學、徙義、改過，乃君子日新之功。若怠惰自畫，則無以入聖賢之域。此[[聖人之憂]]也，聖人非憂一身，實憂斯道之不行於世。</p><p><strong>所出</strong>：《論語 · 述而第七》 — https://zh.wikisource.org/wiki/論語/述而第七</p></article></main></div></div>
