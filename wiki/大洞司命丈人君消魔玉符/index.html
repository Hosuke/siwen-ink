    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大洞司命丈人君消魔玉符</nav></header><main><article><h1>大洞司命丈人君消魔玉符</h1><p>朱書黃繒佩之，可保神固命之符。</p><p>是符以朱書於黃繒佩之。存呼丈人內諱名字，鎮我絳官心中，五色結絡，紫炁生華，保神固命，長生靈柯，七祖解脫，去離九河。乃叩齒九通，咽液三過。</p><p><strong>所出</strong>：《上清大洞真經 · 6章》 — https://zh.wikisource.org/wiki/上清大洞真經/6章</p></article></main></div></div>
