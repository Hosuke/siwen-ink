    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 新劍以詐刻加價</nav></header><main><article><h1>新劍以詐刻加價</h1><p>世人貴遠賤近，如新劍之詐刻以加值，弊物偽題而見珍；古書質樸而見輕，今文金玉而見棄。</p><p>抱朴子借物而喻曰：新劍以詐刻加價，弊方以偽題見寶。是以古書雖質樸，而俗儒謂之墮於天也；今文雖金玉，而常人同之於瓦礫也。人心蔽於近習，不亦悲乎！</p><p><strong>所出</strong>：《抱朴子 · 卷30》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷30</p></article></main></div></div>
