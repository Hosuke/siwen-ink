    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 取天下恆无事</nav></header><main><article><h1>取天下恆无事</h1><p>聖人無為而天下歸。</p><p>聖人取天下，不以有為、不以有事。天下之器也，恆以无事臨之。蓋有事則民擾，民擾則上下失常，上下失常則天下不可得而取也。是以聖人抱一无為之術，以虛靜觀萬物之自化，不先物而動，不先事而為，故天下歸心而莫之能禦。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第十一章 无為》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
