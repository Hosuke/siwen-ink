    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 知貴不能以教歌</nav></header><main><article><h1>知貴不能以教歌</h1><p>吳起休妻、文公斬顛頡，皆違其情而能使人彈疽。</p><p>[[知]]貴、不能，以教歌之法先揆之。[[吳起]]之出愛妻，[[文公]]之斬[[顛頡]]，皆違其情者也。故能使人彈疽者，必其忍痛者也。</p><p><strong>所出</strong>：《韓非子 · 外儲說右上》 — https://zh.wikisource.org/wiki/韓非子/外儲說右上</p></article></main></div></div>
