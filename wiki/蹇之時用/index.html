    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蹇之時用</nav></header><main><article><h1>蹇之時用</h1><p>聖人因蹇以成德，其用至大。</p><p>蹇之彖辭，末云：「蹇之時用大矣哉。」</p><p>夫蹇之為時，固非美也，然而聖人因之，則可以成德。見險能止，智也；反身修德，仁也；利見大人，勇也。艱難之際，正君子磨鍊之時。是以蹇之時用，至大至廣，不可忽也。</p><p><strong>所出</strong>：《周易 · 蹇》 — https://zh.wikisource.org/wiki/周易/蹇</p></article></main></div></div>
