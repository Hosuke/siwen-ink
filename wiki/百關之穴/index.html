    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 百關之穴</nav></header><main><article><h1>百關之穴</h1><p>人身百節之總名，血中赤炁君所守之門戶也。</p><p>百關之穴者，人身百節、九竅之總名也。上清大洞真經以百關為生死之門、絕節之下死炁之戶，以其為[[血中赤炁君]]及[[混離子]]所共守之要地。</p><p>修上清存思之法者，當以此穴為存神之所，吐納赤雲，結津咽液，務使死炁之門塞絕不通、靈液盈充不竭。《經》云「共守兆百關之穴，絕節之下死炁之門」，此之謂也。</p><p><strong>所出</strong>：《上清大洞真經 · 34章》 — https://zh.wikisource.org/wiki/上清大洞真經/34章</p></article></main></div></div>
