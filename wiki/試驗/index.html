    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 試驗</nav></header><main><article><h1>試驗</h1><p>行之驗之，事成乃為是。</p><p>[[真券]]之意：試而即應，事有成功，其有結疾病者解除，悉是也；試其事而不應，行之無成功，其有結疾者不解除，悉非也。言雖少，斯可解億萬事。欲知吾書，悉取信效[[證驗]]於是。</p><p><strong>所出</strong>：《太平經 · 07》 — https://zh.wikisource.org/wiki/太平經/07</p></article></main></div></div>
