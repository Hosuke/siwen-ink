    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 峻法不失賢才</nav></header><main><article><h1>峻法不失賢才</h1><p>明君恃法之峻，不恃人之不欺；峻制既立，賢才自出。</p><p>[[抱朴子]]-{云}-：「夫明君恃己之不可欺，不恃人之不欺己也。亦何恥於峻為斯制乎？」又-{云}-：「若試經法立，則天下可以不立學官，而人自勤樂矣。」蓋立法嚴明，則人知所勸戒，不待賞罰之加，而賢才自涌於下。是以[[以法去法者強]]，[[賞罰以信]]，乃治安之要術也。</p><p><strong>所出</strong>：《抱朴子 · 卷15》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷15</p></article></main></div></div>
