    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 竇犨謂君子哀無人是</nav></header><main><article><h1>竇犨謂君子哀無人是</h1><p>君子哀無德不哀無人，范中行氏子孫淪為耕作乃人之化</p><p>趙簡子歎曰：「雀入于海為蛤，雉入于淮為蜃。黿鼉魚鱉，莫不能化，唯人不能。哀夫！」竇犨侍，曰：「臣聞之：君子哀無人，不哀無賄；哀無德，不哀無寵；哀名之不令，不哀年之不登。夫范、中行氏不恤庶難，欲擅晉國，今其子孫將耕於齊，宗廟之犧為畎畝之勤，人之化也，何日之有！」</p><p><strong>所出</strong>：《國語 · 卷15》 — https://zh.wikisource.org/wiki/國語/卷15</p></article></main></div></div>
