    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 筮日</nav></header><main><article><h1>筮日</h1><p>祭祀之前，以蓍草卜筮求吉日之禮。</p><p>筮日者，祭祀前之占卜禮儀也。篇首所記，主人朝服立於廟門之東，史左執筮、右取上韇，受命於主人，主人祝曰「孝孫某，來日丁亥，用薦歲事于皇祖伯某，以某妃配某氏」。史西面述命，辭曰「假爾大筮有常」，乃釋韇立筮。卦者以木書卦，退而占之。吉則史告曰「占曰從」，乃官戒備祭；不吉則及遠日，更筮如初。卜筮之儀，先秦祭祀所重，故《表記》曰「卜筮不相襲」。</p><p><strong>所出</strong>：《儀禮 · 少牢饋食禮》 — https://zh.wikisource.org/wiki/儀禮/少牢饋食禮</p></article></main></div></div>
