    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 茴香道人</nav></header><main><article><h1>茴香道人</h1><p>林靈素會中一道人，能以茴香種於艮嶽，蔚然成叢。</p><p>宋徽宗政和末，林靈素講於寶籙宮，道俗會者數千人，皆擎腓致敬，獨一道人瞋目在前立。林訝其不拜，叱曰汝有何能？答曰無所能。林曰既無所能，何以在此？復答曰君無所不能，亦何以在此？</p><p>徽宗時在幕中聽，竊異之，宣問實有何能。對曰臣能生養萬物。即命下道院取可以布種者，得茴香一掬以付之，俾二衛卒監視，種於艮嶽之趾，仍護宿於院中。及三鼓，失所在。明日視茴香，蔚然成叢。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 52》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/52</p></article></main></div></div>
