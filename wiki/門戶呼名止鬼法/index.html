    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 門戶呼名止鬼法</nav></header><main><article><h1>門戶呼名止鬼法</h1><p>人定時呼門伯戶丞名三掌手，鬼即止不敢作害</p><p>[[女青鬼律]]所記止鬼之法，專用於門伯戶丞。經云：「人定時於門戶左右呼其名，三掌手，反首持兩三過，此鬼即止，不敢作害。」</p><p>人定時者，夜深之時也。於門戶左右呼天載、蔑嚮之名，三掌手，反首持兩三過，鬼即止。</p><p>此法簡易，而應驗甚速，以其知鬼名也。</p><p><strong>所出</strong>：《女青鬼律 · 卷4》 — https://zh.wikisource.org/wiki/女青鬼律/卷4</p></article></main></div></div>
