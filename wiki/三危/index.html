    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三危</nav></header><main><article><h1>三危</h1><p>人臣三者皆危，示居寵高位者之戒。</p><p>天下有三危：少德而多寵，一危也；才下而位高，二危也；身無大功而受厚祿，三危也。故物或損之而益，或益之而損。</p><p><strong>所出</strong>：《淮南子 · 人間訓》 — https://zh.wikisource.org/wiki/淮南子/人間訓</p></article></main></div></div>
