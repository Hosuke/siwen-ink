    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 竇霍之福禍</nav></header><main><article><h1>竇霍之福禍</h1><p>竇氏蒙遺教而受福，霍氏恣意妄為而招禍，前事不忘，可為鑒戒。</p><p>昔諸竇蒙遺教之福，霍禹受率意之禍，中山東平以好古而安，燕剌由面牆而危。前事不忘，今之良鑒也。</p><p><strong>所出</strong>：《抱朴子 · 卷04》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷04</p></article></main></div></div>
