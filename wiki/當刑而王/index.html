    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 當刑而王</nav></header><main><article><h1>當刑而王</h1><p>相者言英布當受刑而終為王者，預言驗矣。</p><p>英布者，六縣人也，秦時為布衣。少年，有客相之曰：「當刑而王。」及壯，坐法黥。布欣然笑曰：「人相我當刑而王，幾是乎？」人有聞者，共俳笑之。布已論輸麗山，麗山之徒數十萬人，布皆與其徒長豪桀交通，乃率其曹偶，亡之江中為群盜。後竟據九江之地，立為諸侯王。</p><p><strong>所出</strong>：《史記 · 卷091》 — https://zh.wikisource.org/wiki/史記/卷091</p></article></main></div></div>
