    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 地得一以寧</nav></header><main><article><h1>地得一以寧</h1><p>地恃道一以安，失一則震發不寧，天地之理無二致。</p><p>帛書本言：「地得一以寧，謂地毋已寧將恐<strong>發</strong>。」</p><p>地之所以<strong>寧</strong>者，以其得<strong>一</strong>也。得一則靜而安，毋已寧者，守寧而遺一，是失道之寧，非地之正也。寧而不一，<strong>發</strong>必隨之，猶物盈而溢、器滿而傾之理。</p><p>[[天毋已清將恐裂]]與此文互明，皆示萬物失一之害。見[[昔之得一]]。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第二章 得一》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
