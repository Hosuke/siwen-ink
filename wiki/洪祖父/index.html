    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 洪祖父</nav></header><main><article><h1>洪祖父</h1><p>抱朴子述其祖父學無不涉，曆官至輔吳將軍，封吳壽縣侯，有經國之才。</p><p>洪祖父學無不涉，究測精微，文藝之高，一時莫倫。有經國之才，仁愛吳地。</p><p>曆宰海鹽、臨安、山陰三縣。入為吏部侍郎，禦史中丞，廬陵太守，吏部尚書，太子少傅，中書令，大鴻臚，侍中，光祿勳，輔吳將軍，封吳壽縣侯。</p><p><strong>所出</strong>：《抱朴子 · 卷52》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷52</p></article></main></div></div>
