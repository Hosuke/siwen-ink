    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 其從如水</nav></header><main><article><h1>其從如水</h1><p>從者之眾，喻文姜之行止擾亂魯政</p><p>《敝笱》三章，皆以「其從」為言：首章云「其從如雲」，次章云「其從如雨」，卒章云「其從如水」。雲者盛，雨者多，水者流而不止也。三疊遞進，言其從者愈聚愈盛，愈出愈多，漫無節制。</p><p>夫諸侯夫人行止有儀，從者有度。今文姜之從若是，是失其儀度也。從者如雲、若雨、若水，彌漫無際，若無堤防之水然，其害可知。</p><p><strong>所出</strong>：《詩經 · 敝笱》 — https://zh.wikisource.org/wiki/詩經/敝笱</p></article></main></div></div>
