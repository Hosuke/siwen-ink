    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 召信之符</nav></header><main><article><h1>召信之符</h1><p>效驗乃信之符，勿疑。</p><p>[[真券]]以事之成敗為驗。效驗者，即[[召信之符]]也。欲效是非，悉皆案此為法，可勿懷狐疑。</p><p><strong>所出</strong>：《太平經 · 07》 — https://zh.wikisource.org/wiki/太平經/07</p></article></main></div></div>
