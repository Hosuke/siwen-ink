    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 華陽君</nav></header><main><article><h1>華陽君</h1><p>羋戎，宣太后同母弟，封於華陽，與穰侯同為昭王外戚。</p><p>宣太后二弟：其異父長弟曰穰侯，姓魏氏，名冉；同父弟曰羋戎，為華陽君。而昭王同母弟曰高陵君、涇陽君。</p><p>范睢言宣太后專制，穰侯擅權於諸侯，涇陽君、高陵君之屬太侈，富於王室。涇陽君、高陵君即華陽君之屬。</p><p><strong>所出</strong>：《史記 · 卷072》 — https://zh.wikisource.org/wiki/史記/卷072</p></article></main></div></div>
