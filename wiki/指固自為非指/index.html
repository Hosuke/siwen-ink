    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 指固自為非指</nav></header><main><article><h1>指固自為非指</h1><p>指之為名，天然自悖，不待外物而成。</p><p>且夫指固自為非指，奚待于物而乃與為指？</p><p>此篇之終論也。指之為名，天然自相乖反。指既能指物，則指不能自指其為指；指若自指，則失其能指之用。是以指之自性，即為非指，非待外物而後成此矛盾也。</p><p><strong>所出</strong>：《公孫龍子 · 3》 — https://zh.wikisource.org/wiki/公孫龍子/3</p></article></main></div></div>
