    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 道有升降</nav></header><main><article><h1>道有升降</h1><p>世道有盛衰上下，政亦隨之。</p><p>王言「道有升降，政由俗革」。世道之升降，治政之污隆，皆理之固然也。</p><p><strong>所出</strong>：《尚書 · 畢命》 — https://zh.wikisource.org/wiki/尚書/畢命</p></article></main></div></div>
