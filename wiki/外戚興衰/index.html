    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 外戚興衰</nav></header><main><article><h1>外戚興衰</h1><p>帝王之興，非獨內德，亦賴外戚之助；然外戚用事，亦能覆邦。</p><p>自古受命帝王及繼體守文之君，非獨內德茂也，蓋亦有外戚之助焉。夏之興也以涂山，而桀之放也以末喜。殷之興也以有娀，紂之殺也嬖妲己。周之興也以姜原及大任，而幽王之禽也淫於褒姒。夫婦之際，人道之大倫也。禮之用，唯婚姻為兢兢。太史公論外戚之禍福，以為明主當察焉。</p><p><strong>所出</strong>：《史記 · 卷049》 — https://zh.wikisource.org/wiki/史記/卷049</p></article></main></div></div>
