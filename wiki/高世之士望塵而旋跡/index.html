    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 高世之士望塵而旋跡</nav></header><main><article><h1>高世之士望塵而旋跡</h1><p>德行高尚者見世風敗壞，避世而去。</p><p>是以高世之士，望塵而旋跡；輕薄之徒，響赴而影集。謀事無智者之助，居危無切磋之益。良史懸筆，無可書之善；談者含音，無足傳之美。令聞不著，醜聲宣流，沒有余敗，貽譏將來，始無可法，終無可紀，斯亦誌士之恥也。</p><p>夫君子之出處，視時世之汙隆。當禮教頹靡、傲慢成俗之時，則高世之士退而隱遁，不與汙俗同流。及其終也，無善可書，無美可傳，則皆由風俗之敗壞然也。</p><p><strong>所出</strong>：《抱朴子 · 卷25》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷25</p></article></main></div></div>
