    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 失得勿恤，往吉无不利</nav></header><main><article><h1>失得勿恤，往吉无不利</h1><p>六五柔中兼聽，不計得失，往則无不利</p><p>六五以柔居尊，大君之位也。悔亡者，往昔之悔已消也。失得勿恤，言不恤其失，不計其得，無所系累於心也。象曰：「失得勿恤，往有慶也。」言其往而前行，必有福慶，无往而不利也。</p><p><strong>所出</strong>：《周易 · 晉》 — https://zh.wikisource.org/wiki/周易/晉</p></article></main></div></div>
