    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 觀行不以公用為之的彀</nav></header><main><article><h1>觀行不以公用為之的彀</h1><p>聽言觀行，當以公用心量其功用；不此之圖，雖察雖堅，悉妄發之說。</p><p>今聽言觀行，不以公用為之的彀，言雖至察，行雖至堅，則妄發之說也。是以亂世之聽言也，以難知為察，以博文為辯；其觀行也，以離群為賢，以犯上為抗。皆非以功用為準，而以詭異為貴，故其說皆妄發之類，而非真善射者也。</p><p><strong>所出</strong>：《韓非子 · 問辯》 — https://zh.wikisource.org/wiki/韓非子/問辯</p></article></main></div></div>
