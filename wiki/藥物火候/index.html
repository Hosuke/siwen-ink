    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 藥物火候</nav></header><main><article><h1>藥物火候</h1><p>藥物易知，火候最難，差毫失釐，天地懸隔</p><p>藥物易知，火候最難。火候者，修煉之法程也。上德者，以道全其形，純陽未破；下德者，以術延其命，坎離已成。以下德者，必須假法追攝，方能返本還原。火候之妙，有先後急緩，若不知先後急緩之妙用，縱能識得藥物，則顛倒難施，主賓不定，其害可勝言哉。</p><p><strong>所出</strong>：《悟真直指 · 卷一》 — https://zh.wikisource.org/wiki/悟真直指/卷一</p></article></main></div></div>
