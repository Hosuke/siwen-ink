    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 白頭如新</nav></header><main><article><h1>白頭如新</h1><p>久交而不知，終同陌路。</p><p>鄒陽引諺以喻相知之理：「有白頭如新，傾蓋如故。」白頭如新者，相交一生而至白首，猶如新識，不知其心意也。言人情相與，或久處而心隔，不能相知；或乍交而意合，傾蓋如故。此諺戒人交友當察其心，不可以相處之久暫論親疏也。</p><p><strong>所出</strong>：《史記 · 卷083》 — https://zh.wikisource.org/wiki/史記/卷083</p></article></main></div></div>
