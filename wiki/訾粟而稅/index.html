    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 訾粟而稅</nav></header><main><article><h1>訾粟而稅</h1><p>按粟之數課稅，務使公平</p><p>訾粟而稅，則上壹而民平。上壹則信，信則官不敢為邪。民平則慎，慎則難變。上信而官不敢為邪，民慎而難變，則下不非上，中不苦官。下不非上，中不苦官，則壯民疾農不變。壯民疾農不變，則少民學之不休。少民學之不休，則草必墾矣。稅以粟計，公平劃一，則民無怨，官無姦，農業興而地闢。</p><p><strong>所出</strong>：《商君書 · 卷一》 — https://zh.wikisource.org/wiki/商君書/卷一</p></article></main></div></div>
