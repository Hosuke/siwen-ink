    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 吳王淫於樂</nav></header><main><article><h1>吳王淫於樂</h1><p>吳王耽於逸樂而忘百姓，為亡國之徵</p><p>范蠡謂越王曰：「今吳王淫於樂而忘其百姓，亂民功，逆天時，信讒喜優，憎輔遠弼，聖人不出，忠臣解骨，皆曲相御，莫適相非，上下相偷。」</p><p>吳王耽於音樂，不問政事，疏遠忠賢，親近讒佞，上下相蒙，國政日非。此其亡徵已見，而越師未動。</p><p>范蠡以人事言之，吳王之行已兆其必亡，天時人事相參而後，越乃可圖。</p><p><strong>所出</strong>：《國語 · 卷21》 — https://zh.wikisource.org/wiki/國語/卷21</p></article></main></div></div>
