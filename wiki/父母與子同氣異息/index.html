    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 父母與子同氣異息</nav></header><main><article><h1>父母與子同氣異息</h1><p>父母與子，一體而兩分，同氣而異息，雖異處而相通。</p><p>父母之於子也，子之於父母也，一體而兩分，同氣而異息。若草莽之有華實也，若樹木之有根心也，雖異處而相通，隱志相及，痛疾相救，憂思相感，生則相歡，死則相哀，此之謂骨肉之親。神出於忠，而應乎心，兩精相得，豈待言哉？</p><p><strong>所出</strong>：《呂氏春秋 · 卷九》— https://zh.wikisource.org/wiki/呂氏春秋/卷九</p></article></main></div></div>
