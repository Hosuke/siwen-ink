    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 亓在道也</nav></header><main><article><h1>亓在道也</h1><p>述五病在道，喻之以餘食贅行、物之所惡。</p><p>（24）</p><p>炊者不立、自視者不彰、自見者不明、自伐者无功、自矜者不長——此五者，乘道之行也。[[其在道也]]曰：<strong>餘食贅行</strong>，[[物或惡之]]。是故[[有欲者弗居]]。</p><p>亓在道也，以其為道之餘食、道之赘行也。物且惡之，況行道之人乎。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第六十六章 弗居》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
