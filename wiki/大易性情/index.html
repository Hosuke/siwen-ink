    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大易性情</nav></header><main><article><h1>大易性情</h1><p>天地之易，其情其性，萬物各如其自然之度。</p><p>《參同契》曰：「大易性情，各如其度。」此承上篇而言易道之廣被也。天地之易，生化萬物，其情其性，秩然而不可紊，各如其稟賦之自然者然。黃老用之以究治道，爐火假之以為丹法，一皆本此性情之自然而無所拂逆。是故知大易之性情者，可以治身，可以應物，可以成丹，其道一以貫之。</p><p><strong>所出</strong>：《周易參同契 · 34章》 — https://zh.wikisource.org/wiki/周易參同契/34章</p></article></main></div></div>
