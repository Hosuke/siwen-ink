    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 趙襄子滅代</nav></header><main><article><h1>趙襄子滅代</h1><p>趙襄子以銅枓击杀代王，興兵平代地，其姊聞而摩笄自殺，代人憐之，名其山曰摩笄。</p><p>襄子姊前為代王夫人。簡子既葬，未除服，北登夏屋，請代王。使廚人操銅枓以食代王及從者，行斟，陰令宰人各以枓擊殺代王及從官，遂興兵平代地。其姊聞之，泣而呼天，摩笄自殺。代人憐之，所死地名之為摩笄之山。遂以代封伯魯子周為代成君。伯魯者，襄子兄，故太子。太子蚤死，故封其子。</p><p><strong>所出</strong>：《史記 · 卷043》 — https://zh.wikisource.org/wiki/史記/卷043</p></article></main></div></div>
