    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不素食</nav></header><main><article><h1>不素食</h1><p>君子當食其功，不當无功而食，刺尸位者也。</p><p>不素食，[[伐檀]]次章之句也。素，空也。食而不以其功，是為素食。詩人刺之曰：彼君子兮，不素食兮。言其居上位者當有所事事，方可食其祿也。</p><p>次章言伐輻以造車，末章言伐輪以成器，皆言民之所為；而在上者坐享其成，是素食之人也。三章迭言「不素餐」「不素食」「不素飧」，反覆致意，以刺當時魏國在位之臣。</p><p><strong>所出</strong>：《詩經 · 伐檀》 — https://zh.wikisource.org/wiki/詩經/伐檀</p></article></main></div></div>
