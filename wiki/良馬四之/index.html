    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 良馬四之</nav></header><main><article><h1>良馬四之</h1><p>四馬馭車以迎賢者。馬數遞加，以見敬賢之隆。</p><p>良馬四之，謂以四馬為駕以迎賢者也。《干旄》首章云「良馬四之」，次章云「良馬五之」，三章云「良馬六之」。馬數遞加，自四而五而六，以見其敬賢之心，愈往而愈摯也。</p><p>古者諸侯大夫出行，必以車馬。車以駕馬，馬以壯行。賢者之來，必以良馬迎之。馬愈多者，禮愈隆，賢者愈重也。詩人不言車而但言馬，以馬為行人之要，且以見其車之盛也。</p><p><strong>所出</strong>：《詩經 · 干旄》 — https://zh.wikisource.org/wiki/詩經/干旄</p></article></main></div></div>
