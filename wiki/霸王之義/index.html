    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 霸王之義</nav></header><main><article><h1>霸王之義</h1><p>霸王之道，以謀慮之、以策圖之，挾義而動，非以圖存，將以存亡。</p><p>霸王之道，以謀慮之，以策圖之，挾義而動，非以圖存也，將以存亡也。故聞敵國之君有暴虐其民者，即舉兵而臨其境，責以不義，刺以過行。義兵至於境，不戰而止；不義之兵，至於伏尸流血，相交以前。故為地戰者，不能成其王；為身求者，不能立其功。舉事以為人者，眾助之；以自為者，眾去之。眾之所動，雖弱必強；眾之所去，雖大必亡。</p><p><strong>所出</strong>：《文子 · 卷十一》 — https://zh.wikisource.org/wiki/文子/卷十一</p></article></main></div></div>
