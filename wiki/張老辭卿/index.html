    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 張老辭卿</nav></header><main><article><h1>張老辭卿</h1><p>張老辭卿之命，稱美魏絳之德能，悼公遂使魏絳佐新軍。</p><p>悼公使張老為卿，辭曰：「臣不如魏絳。夫絳之智能治大官，其仁可以利公室不忘，其勇不疚於刑，其學不廢其先人之職。若在卿位，外內必平。且雞丘之會，其官不犯而辭順，不可不賞也。」公五命之，固辭，乃使為司馬。使魏絳佐新軍。</p><p><strong>所出</strong>：《國語 · 卷13》 — https://zh.wikisource.org/wiki/國語/卷13</p></article></main></div></div>
