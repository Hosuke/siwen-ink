    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以善養人</nav></header><main><article><h1>以善養人</h1><p>以善服人者未能服人，以善養人者然後能服天下。</p><p>孟子曰：「以善服人者，未有能服人者也。以善養人，然後能服天下。天下不心服而王者，未之有也。」以善服人者，以善為利器，屈人之從己，是力服也，終不能使之誠服。以善養人者，以善滋潤之，涵泳之，使之自化於善，是心服也。如是而天下不服者，未之有也。</p><p><strong>所出</strong>：《孟子 · 離婁下》 — https://zh.wikisource.org/wiki/孟子/離婁下</p></article></main></div></div>
