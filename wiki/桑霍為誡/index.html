    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 桑霍為誡</nav></header><main><article><h1>桑霍為誡</h1><p>居高位者厚植黨與，必以致患，桑弘羊、霍光之事可為明戒。</p><p>桑霍為戒厚矣，範疏之鑒明矣。</p><p>桑弘羊以計算用事，終構巫蠱之禍；霍光秉政三世，族滅於宣帝。桑出於貪，霍由於專，二者異辙，同歸於亡。然其致患之由，則一也：持寵處位，終身不厭；廣樹中外，恩信已成。勢既盛而不可分，權既專而不可奪，則主側目而欲除之矣。，是以大臣具臣，功高震主者身危，權利太盛者族亡。範疏指[[範雎]]之事，亦以持盈驕泰取禍。桑霍之誡，在於知止。</p><p><strong>所出</strong>：《抱朴子 · 卷39》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷39</p></article></main></div></div>
