    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 敬孫務時敏</nav></header><main><article><h1>敬孫務時敏</h1><p>敬慎遜讓，務求及時而疾行，則學之修為乃可至。</p><p>《兌命》有云：「敬孫務時敏，厥修乃來。」</p><p>敬者，敬畏而不忽也；孫者，遜讓而不躁也；務者，致力而不怠也；時敏者，及時而疾行也。四者相需，闕一不可。敬而不孫，則矜；孫而不敬，則諂；務而不時敏，則蹶；時敏而不務，則荒。唯兼此四者，厥修乃來。</p><p>學者苟能敬以持心，孫以接物，務學之時，及時而敏，則未有不成者也。</p><p><strong>所出</strong>：《禮記 · 學記》 — https://zh.wikisource.org/wiki/禮記/學記</p></article></main></div></div>
