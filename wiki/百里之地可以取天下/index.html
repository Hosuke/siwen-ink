    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 百里之地可以取天下</nav></header><main><article><h1>百里之地可以取天下</h1><p>治道得人，雖地百里亦可取天下。</p><p>百里之地，可以取天下，其難在人主之知之。取天下者，非負其土地而從之之謂也，道足以壹人而已。彼其人苟壹，則其土地奚去我而適它？故百里之地，足以竭勢；致忠信，箸仁義，足以竭人。兩者合而天下取。</p><p><strong>所出</strong>：《荀子 · 王霸篇》 — https://zh.wikisource.org/wiki/荀子/王霸篇</p></article></main></div></div>
