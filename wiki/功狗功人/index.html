    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 功狗功人</nav></header><main><article><h1>功狗功人</h1><p>獵狗追獸，人乃指示，功有大小，本末之分。</p><p>高祖與功臣論功，嘗設問以喻之。曰：「夫獵，追殺獸兔者狗也，而發蹤指示獸處者人也。今諸君徒能得走獸耳，功狗也。至如蕭何，發蹤指示，功人也。」夫攻城掠地、執銳被堅者，功狗之事也；運籌帷幄、指引方向者，功人之事也。功有高下，賞有輕重，不可不辨。</p><p><strong>所出</strong>：《史記 · 卷053》 — https://zh.wikisource.org/wiki/史記/卷053</p></article></main></div></div>
