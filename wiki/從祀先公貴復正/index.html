    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 從祀先公</nav></header><main><article><h1>從祀先公</h1><p>定公自昭公以來久闕祖祭，至是從祀先公，貴復其正。</p><p>定公八年冬，從祀先公。穀梁子曰：「貴復正也。」</p><p>定公以昭公久喪在外，祖祭久闕，祭祀之禮失常。至是從祀先公，乃所以修復其正。</p><p><strong>所出</strong>：《春秋穀梁傳 · 定公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/定公</p></article></main></div></div>
