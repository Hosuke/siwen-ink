    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 真鉛</nav></header><main><article><h1>真鉛</h1><p>道心真知，先天真一之氣，成仙作佛之真種子。</p><p>道心真知，具有先天真一之氣，取象為鉛，乃成聖成賢、作佛成仙之真種子。若欲修煉大丹，舍此真種，再無別物。世人徒修一身有形之物，咽津納氣，皆後天滓質，安能生先天至靈至聖之丹？此鼎中無真種，猶將水火煮空鐏耳。真知未經複還，猶在他家，故曰「蟾光終日照西川」。引回我家，方能靈知不昧。</p><p><strong>所出</strong>：《悟真直指 · 卷二》 — https://zh.wikisource.org/wiki/悟真直指/卷二</p></article></main></div></div>
