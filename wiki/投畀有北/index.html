    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 投畀有北</nav></header><main><article><h1>投畀有北</h1><p>欲投譖人於極寒之地，終亦不受。</p><p>「豺虎不食，投畀有北。有北不受，投畀有昊。」</p><p>有北，北方寒荒之地；有昊，天也。言豺虎且不食此人，投之北方，北方亦不受之，復投之昊天。天網恢恢，無所逃於天地之間，極言譖人之罪深重，無往而不見棄也。</p><p><strong>所出</strong>：《詩經 · 巷伯》 — https://zh.wikisource.org/wiki/詩經/巷伯</p></article></main></div></div>
