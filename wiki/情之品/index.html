    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 情之品有三</nav></header><main><article><h1>情之品有三</h1><p>情之感於物而生，亦有品級之別。</p><p>[[情之品]]者，接於物而生也。性之品既有上中下，則情之品亦有三等。情者[[夫人有血氣心知之性]]之感於外者也。[[性之品]]對言，則情之感物而生，與[[僞]]之為功而異。[[為性惡之故]]，情亦不美，故[[堯舜之問|聖賢]]必以[[師法之化]]、[禮義之道]節之，使[[順情性則不辭讓]]之情，轉而為辭讓之[[僞]]也。</p><p><strong>所出</strong>：《荀子 · 性惡篇》 — https://zh.wikisource.org/wiki/荀子/性惡篇</p></article></main></div></div>
