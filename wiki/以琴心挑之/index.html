    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以琴心挑之</nav></header><main><article><h1>以琴心挑之</h1><p>相如以琴聲之情意挑達文君之心，遂成私情。</p><p>相如之初尚見之，後稱病，使從者謝吉，吉愈益謹肅。臨邛中多富人，而卓王孫家僮八百人，程鄭亦數百人，二人乃相謂曰：「令有貴客，為具召之。」並召令。令既至，卓氏客以百數。至日中，謁司馬長卿，長卿謝病不能往，臨邛令不敢嘗食，自往迎相如。相如不得已，彊往，一坐盡傾。酒酣，臨邛令前奏琴曰：「竊聞長卿好之，原以自娛。」相如辭謝，為鼓一再行。是時卓王孫有女文君新寡，好音，故相如繆與令相重，而以琴心挑之。</p><p><strong>所出</strong>：《史記 · 卷117》 — https://zh.wikisource.org/wiki/史記/卷117</p></article></main></div></div>
