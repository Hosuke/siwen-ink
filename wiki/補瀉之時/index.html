    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 補瀉之時</nav></header><main><article><h1>補瀉之時</h1><p>補瀉之時，與氣開闔相合；九針各有所宜，針窮其所當補瀉。</p><p>補瀉之時者，與氣開闔相合也。九針之名，各不同形者，針窮其所當補瀉也。虛實之要，九針最妙者，為其各有所宜也。</p><p>刺實須其虛者，留針陰氣隆至，乃去針也；刺虛須其實者，陽氣隆至，針下熱乃去針也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第十四卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十四卷</p></article></main></div></div>
