    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 進德脩業</nav></header><main><article><h1>進德脩業</h1><p>忠信所以進德，脩辭立誠所以居業，進而至之，終而存之。</p><p>文言曰：九三，君子進德脩業。忠信，所以進德也；脩辭立其誠，所以居業也。知至至之，可與言幾也。知終終之，可與存義也。是故居上位而不驕，在下位而不憂。</p><p>進德者，忠信以主之，心無偽也；脩業者，辭以誠之，言有物也。知至至之者，吾心之理既至，則以身履之，是幾動之微也；知終終之者，事之結果既終，則歸其義之所安，是存義之大也。斯二者，非聖人不能盡，然君子所當勉焉。</p><p><strong>所出</strong>：《周易 · 乾》 — https://zh.wikisource.org/wiki/周易/乾</p></article></main></div></div>
