    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 公義勝私欲</nav></header><main><article><h1>公義勝私欲</h1><p>君子之行，以公義勝其私欲。</p><p>君子之求利也略，其遠害也早，其避辱也懼，其行道理也勇。君子貧窮而志廣，富貴而體恭，安燕而血氣不惰，勞勌而容貌不枯，怒不過奪，喜不過予。君子貧窮而志廣，隆仁也；富貴而體恭，殺埶也；安燕而血氣不惰，柬理也；勞勌而容貌不枯，好交也。怒不過奪，喜不過予，是法勝私也。《書》曰：「無有作好，遵王之道；無有作惡，遵王之路。」此言君子之能以公義勝私欲也。</p><p><strong>所出</strong>：《荀子 · 修身篇》 — https://zh.wikisource.org/wiki/荀子/修身篇</p></article></main></div></div>
