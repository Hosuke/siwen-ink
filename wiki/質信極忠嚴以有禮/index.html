    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 質信極忠嚴以有禮</nav></header><main><article><h1>質信極忠嚴以有禮</h1><p>信則民信之，忠則民懷之，嚴則民畏之，禮則民美之。</p><p>管子言治民四行：「質信極忠，嚴以有禮。」信者民信之，忠者民懷之，嚴者民畏之，禮者民美之。澤命不渝，非所欲勿施於人，仁也；堅中外正，嚴也；質信以讓，禮也。</p><p><strong>所出</strong>：《管子 · 第51篇小問》 — https://zh.wikisource.org/wiki/管子/第51篇小問</p></article></main></div></div>
