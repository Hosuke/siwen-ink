    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 竊鉤者誅竊國者侯</nav></header><main><article><h1>竊鉤者誅竊國者侯</h1><p>盜小物者伏誅，竊大柄者封侯，世道之不平也。</p><p>竊鉤者誅，竊國者侯，侯之門仁義存，非虛言也。</p><p>鄙人有言：「何知仁義，已饗其利者為有德。」故伯夷醜周，餓死首陽山，而文武不以其故貶王；跖、蹻暴戾，其徒誦義無窮。由此觀之，善惡之辨，名實相違，竊鉤與竊國，賞罰異施，而仁義之門，為侯者據之矣。</p><p><strong>所出</strong>：《史記 · 卷124》 — https://zh.wikisource.org/wiki/史記/卷124</p></article></main></div></div>
