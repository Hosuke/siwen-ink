    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 一手獨拍</nav></header><main><article><h1>一手獨拍</h1><p>君臣相須，一人不能成事。</p><p>人主之患在莫之應，故曰：一手獨拍，雖疾無聲。人臣之憂在不得一，故曰：右手畫圓，左手畫方，不能兩成。</p><p><strong>所出</strong>：《韓非子 · 功名》 — https://zh.wikisource.org/wiki/韓非子/功名</p></article></main></div></div>
