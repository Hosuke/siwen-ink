    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天機泄漏</nav></header><main><article><h1>天機泄漏</h1><p>金丹正道乃天機所在，不敢直泄，故托數事為名。</p><p>[[悟真篇]]序言：「恐泄天機，遂托數事為名。」又詩云：「莫怪天機都泄漏，只縁學者自愚蒙。」丹經皆用隱語，假[[龍虎]][[鉛汞]][[龜蛇]]等象名言之，非真以金石為藥也。知者自悟，不知者為旁門所誤。悟真者當因言會意，不可以辭害意。</p><p><strong>所出</strong>：《悟真篇》 — https://zh.wikisource.org/wiki/悟真篇</p></article></main></div></div>
