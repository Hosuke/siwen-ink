    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 至真貴乎天然</nav></header><main><article><h1>至真貴乎天然</h1><p>文章之至者，出於自然，非人工琢磨所能致。</p><p>乾坤方圓，非規定之功；三辰摛景，非瑩磨之力；春華粲煥，非漸染之辨；茝蕙芬馥，非容氣所假。知夫至真，貴乎天然也。義以罕覿為異，辭以不常為美。而古今屬文之家，鮮能挺逸麗於毫端，多斟酌於前言。[[梓匠規矩]]者，非無其具也；[[清苦稱高]]者，亦有其人。然至道之文，出於天機，非人力所強致也。</p><p><strong>所出</strong>：《抱朴子 · 卷40》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷40</p></article></main></div></div>
