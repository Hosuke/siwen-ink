    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 瘨弧箕服</nav></header><main><article><h1>瘨弧箕服</h1><p>童謠之驗，周亡之兆。</p><p>宣王之時有童謠曰：「瘨弧箕服，實亡周國。」瘨弧，山桑之名；箕服，箕木所為盛矢器也。王聞之，使執鬻是器之夫婦而戮之。府之小妾生女而非王子，懼而棄之，是人也，收以奔褒。及褒姒入宮，生伯服，幽王果以是亡周。童謠之驗，昭昭不爽。</p><p><strong>所出</strong>：《國語 · 卷16》 — https://zh.wikisource.org/wiki/國語/卷16</p></article></main></div></div>
