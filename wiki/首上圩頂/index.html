    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 首上圩頂</nav></header><main><article><h1>首上圩頂</h1><p>描述孔子頭頂中央凹陷的異相。</p><p>孔子生而首上圩頂，正面觀之，若鼎之有缺，蓋頂門凹陷，因名曰丘。此說所以狀聖人之異於常人也。</p><p><strong>所出</strong>：《史記 · 卷047》 — https://zh.wikisource.org/wiki/史記/卷047</p></article></main></div></div>
