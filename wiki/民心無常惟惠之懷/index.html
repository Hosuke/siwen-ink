    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 民心無常惟惠之懷</nav></header><main><article><h1>民心無常惟惠之懷</h1><p>民無常心，唯惠是依。</p><p>皇天無親，惟德是輔。民心無常，惟惠之懷。</p><p>民之心如水之就下無常定，唯在上者施惠則歸之。此[[民惟邦本]]之義，而[[得眾動天]]所由來也。</p><p><strong>所出</strong>：《尚書 · 蔡仲之命》 — https://zh.wikisource.org/wiki/尚書/蔡仲之命</p></article></main></div></div>
