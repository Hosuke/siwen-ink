    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 子貢殖</nav></header><main><article><h1>子貢殖</h1><p>子貢結駟連騎，束帛之幣以聘享諸侯，使孔子名布揚於天下。</p><p>子貢既學於仲尼，退而仕於衛，廢著鬻財於曹、魯之閒，七十子之徒，賜最為饒益。原憲不厭糟糠，匿於窮巷。子貢結駟連騎，束帛之幣以聘享諸侯，所至，國君無不分庭與之抗禮。夫使孔子名布揚於天下者，子貢先後之也。此所謂得埶而益彰者乎？</p><p><strong>所出</strong>：《史記 · 卷129》 — https://zh.wikisource.org/wiki/史記/卷129</p></article></main></div></div>
