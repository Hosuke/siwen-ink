    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 澤上于天</nav></header><main><article><h1>澤上于天</h1><p>澤氣蒸騰上升以達於天，象陽亢陰消、決而去之象也。</p><p>《象》曰：「澤上於天，夬。」王弼注云：「誰能決雲雨之上者，然後乃有雨也。」夫澤之為物，以下潤為德，今乃居天之上，是陽氣亢盛、陰氣將決之時也。澤之在天，將降為雨，此剛決柔之象，君子觀之，知小人不可久障，當決而去之，以成天下之治。</p><p><strong>所出</strong>：《周易 · 夬》 — https://zh.wikisource.org/wiki/周易/夬</p></article></main></div></div>
