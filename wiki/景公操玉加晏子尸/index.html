    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 景公操玉加晏子尸</nav></header><main><article><h1>景公操玉加晏子尸</h1><p>景公哭晏子而不聽諫，以嘗與夫子同遊，今失之則亡。</p><p>晏子死，景公操玉加于晏子屍上而哭之，涕沾襟。章子諫曰：「非禮也。」公曰：「安用禮乎！昔者吾與夫子遊于公阜之上，一日而三不聽寡人，今其孰能然乎！吾失夫子則亡，何禮之有？」免而哭，哀盡而去。</p><p><strong>所出</strong>：《晏子春秋 · 卷八》 — https://zh.wikisource.org/wiki/晏子春秋/卷八</p></article></main></div></div>
