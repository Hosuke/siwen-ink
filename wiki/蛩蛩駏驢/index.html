    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蛩蛩駏驢</nav></header><main><article><h1>蛩蛩駏驢</h1><p>以所能託所不能，獸亦有義</p><p>北方有獸曰蹶，鼠前而兔後，趨則頓，走則顛，常為蛩蛩駏驢取甘草以與之。蹶有患害，蛩蛩駏驢必負而走。此以其能，託其所不能。</p><p><strong>所出</strong>：《淮南子 · 道應訓》 — https://zh.wikisource.org/wiki/淮南子/道應訓</p></article></main></div></div>
