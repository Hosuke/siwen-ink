    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 利成</nav></header><main><article><h1>利成</h1><p>祭祀畢，祝告利成，尸起，主人送之。</p><p>利成者，祭祀禮畢之辭也。祝告利成者，利，安也；成，畢也。謂祭祀之禮已安且畢。祭至將終，主人出立於阼階上西面，祝出立於西階上東面。祝告曰「利成」，祝入，尸謖。主人降立於阼階東西面。祝先，尸從，遂出於廟門外。祝反，復位於室中。祝命佐食徹肵俎降設堂下，乃四人共馂以終祭事。</p><p><strong>所出</strong>：《儀禮 · 少牢饋食禮》 — https://zh.wikisource.org/wiki/儀禮/少牢饋食禮</p></article></main></div></div>
