    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 黻衣繡裳</nav></header><main><article><h1>黻衣繡裳</h1><p>卿大夫朝祭之服，文章之盛。</p><p>黻衣繡裳，君子至止所服也。黻者，蔽膝也，以繡為之；裳者，下衣，亦繡以五彩。言其衣文章之美、禮服之盛也。《詩》以此見君子之威儀，又見其德位兼隆。服美則德美，故詩人美之。</p><p><strong>所出</strong>：《詩經 · 終南》 — https://zh.wikisource.org/wiki/詩經/終南</p></article></main></div></div>
