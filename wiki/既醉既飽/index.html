    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 既醉既飽</nav></header><main><article><h1>既醉既飽</h1><p>祭享以酒食，神人皆足</p><p>言祭享之時，神明降格，醉以酒，飽以食。《說文》：「醉，卒也。卒其度量，不至於亂也。」既醉既飽，乃祭末神人交暢之象。[[燕禮]]之義，亦取神人相樂之意。學者引之以言祭祀之成，錫福之始也。</p><p><strong>所出</strong>：《詩經 · 執競》 — https://zh.wikisource.org/wiki/詩經/執競</p></article></main></div></div>
