    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 思古君子官賢人</nav></header><main><article><h1>思古君子官賢人</h1><p>魯詩說此詩之旨，在思古之君子能官任賢人。</p><p>魯詩說云：「思古君子官賢人，置之列位也。」此解《卷耳》之義，謂詩人思慕古昔君子，能任賢使能，置之列位，各當其才也。與毛詩序后妃輔佐君子求賢審官之義相表裏，皆尚賢之旨也。</p><p><strong>所出</strong>：《詩經 · 卷耳》 — https://zh.wikisource.org/wiki/詩經/卷耳</p></article></main></div></div>
