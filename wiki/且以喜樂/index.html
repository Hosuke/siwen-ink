    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 且以喜樂</nav></header><main><article><h1>且以喜樂</h1><p>勸人及時行樂，不可虛度光陰。</p><p>子有酒食，何不日鼓瑟？且以喜樂，且以永日。</p><p>言有酒食則當鼓瑟以娛，有物則當及時用之，不可坐失良辰。永日，謂長日以為樂，不使虛度也。詩序云「晉昭公也不能脩道以正其國」，故詩人反覆言「弗」者欲其一悟。</p><p><strong>所出</strong>：《詩經 · 山有樞》 — https://zh.wikisource.org/wiki/詩經/山有樞</p></article></main></div></div>
