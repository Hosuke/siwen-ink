    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 皁飾司直</nav></header><main><article><h1>皁飾司直</h1><p>御史皁衣之飾，職在直諫肅禁。</p><p>皁飾司直，肅清風禁。言御史之職，當以皁衣為飾，專司直諫，肅清風紀禁令。此 [[封事]] 之官，守《詩》刺讒人之旨也。</p><p><strong>所出</strong>：《文心雕龍 · 奏啟》 — https://zh.wikisource.org/wiki/文心雕龍/奏啟</p></article></main></div></div>
