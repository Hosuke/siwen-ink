    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 二十五子</nav></header><main><article><h1>二十五子</h1><p>黃帝有子二十五人，其得姓者十四人。</p><p>黃帝二十五子，其得姓者十四人。</p><p>黃帝居軒轅之丘，而娶於西陵之女，是爲嫘祖。嫘祖爲黃帝正妃，生二子，其後皆有天下：其一曰玄囂，是爲青陽，青陽降居江水；其二曰昌意，降居若水。昌意娶蜀山氏女，曰昌僕，生高陽，高陽有聖惪焉。黃帝崩，葬橋山。其孫昌意之子高陽立，是爲帝顓頊也。</p><p><strong>所出</strong>：《史記 · 卷001》 — https://zh.wikisource.org/wiki/史記/卷001</p></article></main></div></div>
