    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 韓非悲說難</nav></header><main><article><h1>韓非悲說難</h1><p>韓非深悲說之之難，身死秦國而不能自脫。</p><p>非見韓之削弱，數以書諫韓王，韓王不能用。於是韓非疾治國不務脩明其法制，乃作[[說之難]]、《孤憤》、《五蠹》、《內外儲》、《說林》、《說難》十餘萬言。</p><p>然韓非知說之難，為《說難》書甚具，終死於秦，不能自脫。及秦王悔之，使人赦之，非已死矣。</p><p>太史公曰：「余獨悲韓子為說難而不能自脫耳。」</p><p><strong>所出</strong>：《史記 · 卷063》 — https://zh.wikisource.org/wiki/史記/卷063</p></article></main></div></div>
