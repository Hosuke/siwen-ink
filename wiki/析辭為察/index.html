    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 析辭為察</nav></header><main><article><h1>析辭為察</h1><p>析辭為察、言物為辨，君子賤之。</p><p>若夫非分是非，非治曲直，非辨治亂，非治人道，雖能之無益於人，不能無損於人；案直將治怪說，玩奇辭，以相撓滑也；案彊鉗而利口，厚顏而忍詬，無正而恣孳，妄辨而幾利；不好辭讓，不敬禮節，而好相推擠：此亂世姦人之說也，則天下之治說者，方多然矣。</p><p>傳曰：「析辭而為察，言物而為辨，君子賤之。博聞彊志，不合王制，君子賤之。」此之謂也。</p><p><strong>所出</strong>：《荀子 · 解蔽篇》 — https://zh.wikisource.org/wiki/荀子/解蔽篇</p></article></main></div></div>
