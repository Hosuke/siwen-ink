    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鄭莊行千里不齎粮</nav></header><main><article><h1>鄭莊行千里不齎粮</h1><p>鄭莊輕財好義，行者無待裹粮。</p><p>鄭莊使視決河，自請治行五日。上曰：「吾聞『鄭莊行，千里不齎粮』，請治行者何也？」</p><p><strong>所出</strong>：《史記 · 卷120》 — https://zh.wikisource.org/wiki/史記/卷120</p></article></main></div></div>
