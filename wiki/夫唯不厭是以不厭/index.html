    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 夫唯不厭是以不厭</nav></header><main><article><h1>夫唯不厭是以不厭</h1><p>惟不厭斁於己，是以人亦不厭斁之。</p><p>惟人君不以威力厭斁迫脅於民，則民亦不厭斁其上。上下相保，各厭其分，此治世之要也。</p><p><strong>所出</strong>：《老子河上公章句 · 愛己》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p><hr><p>《文心雕龍·程器》云：「子夏無虧於名儒，濬沖不塵乎竹林者，名崇而譏減也。」言人既有高名，則瑕累為世所恕，況道德素著乎！</p><p>  <strong>所出</strong>：《文心雕龍 · 程器》 — https://zh.wikisource.org/wiki/文心雕龍/程器</p></article></main></div></div>
