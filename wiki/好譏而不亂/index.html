    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 好譏而不亂</nav></header><main><article><h1>好譏而不亂</h1><p>善察人情而不失其序，順應世變而不渝其本也。</p><p>管子論治世之要，在於「好譏而不亂，前變而不變」。譏者，察也，察人情之向背也。亂者，紛更無度也。好譏而不亂者，好察民心之向背，而不敢輕為更張也。前變而不變者，因時之變而變之，而不失其常道也。</p><p>五家之術之所以殊用，而皆可取者，正以時異故也。因時而立儀，是之謂前變；兼用而勿盡，是之謂不亂。是以聖人觀時之變，順而通之，則可以為善政；若昧時之宜，而膠柱鼓瑟，則非所以為治也。</p><p><strong>所出</strong>：《管子 · 第79篇國准》 — https://zh.wikisource.org/wiki/管子/第79篇國准</p></article></main></div></div>
