    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 發彼小豝，殪此大兕</nav></header><main><article><h1>發彼小豝，殪此大兕</h1><p>射中小豕，斃彼大兕，言田獵之獲。</p><p>「發」者，射也。「小豝」，小母豕也。「殪」，斃也。「大兕」，大野牛也。《詩經》田獵之詩，多言射獲，而此詩尤言所獲之盛，小者大者皆得之。言小豝、大兕對舉，見獵事之豐，毛傳以為「發彼小豝，殪此大兕，以御賓客，且以酌醴」，其義一也。</p><p><strong>所出</strong>：《詩經 · 吉日》 — https://zh.wikisource.org/wiki/詩經/吉日</p></article></main></div></div>
