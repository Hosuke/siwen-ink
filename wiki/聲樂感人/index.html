    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聲樂感人</nav></header><main><article><h1>聲樂感人</h1><p>音樂入人心深，化人亦速，故先王謹為之文。</p><p>夫聲樂之入人也深，其化人也速。聲樂感人，逆氣應之則姦邪之象生，治世之音感之則順氣成而善政起。先王立樂之方，以雅頌之聲感動人之善心，邪汙之氣無由得接。聲樂之象如此，而王道之易易者，觀之於鄉可知矣。</p><p><strong>所出</strong>：《荀子 · 樂論篇》 — https://zh.wikisource.org/wiki/荀子/樂論篇</p></article></main></div></div>
