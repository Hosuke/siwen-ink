    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 盡瘁事國</nav></header><main><article><h1>盡瘁事國</h1><p>言鞠躬盡瘁、死而後已之忠。</p><p>盡瘁以仕，寧莫我有。</p><p>「盡瘁」，竭盡心力以至於病也。「以仕」，以之任事也。詩人自言竭智彈精、身心俱瘁以任職事，而國人竟莫之親善。蓋言忠勤而不見知，效命而反獲罪，世路之艱至此極矣。「盡瘁事國」遂為鞠躬盡瘁、死而後已之典。</p><p><strong>所出</strong>：《詩經 · 四月》 — https://zh.wikisource.org/wiki/詩經/四月</p></article></main></div></div>
