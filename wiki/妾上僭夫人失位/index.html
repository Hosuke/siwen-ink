    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 妾上僭夫人失位</nav></header><main><article><h1>妾上僭夫人失位</h1><p>嫡妾失序，詩人所以刺也。</p><p>妾上僭者，賤妾越居尊位也；夫人失位者，正嫡反遭貶斥也。《[[詩經/綠衣]]》之詩，毛詩序以為衛莊姜傷己而作。莊姜，美而不見答於莊公，其卒也，莊公納州吁之母，是妾上僭也。綠衣黃裏、綠衣黃裳，間色之綠居外而侵陵，正色之黃居內而受迫，嫡妾之位如是倒置，此詩人之所以悲也。詩人[[心之憂矣]]而思[[我思古人|古昔聖賢]]之正道，欲以正[[俾無訧|俾無訧]]者，正此失序之弊也。</p><p><strong>所出</strong>：《詩經 · 綠衣》 — https://zh.wikisource.org/wiki/詩經/綠衣</p></article></main></div></div>
