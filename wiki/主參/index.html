    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 主參</nav></header><main><article><h1>主參</h1><p>長目飛耳樹明以參驗是非</p><p>一曰長目，二曰飛耳，三曰樹明。明知千里之外，隱微之中，曰動姦。姦動則變更矣。[[耳目心智股肱助]]者，目欲其遠，耳欲其通，心欲其明。三者既備，則[[見微知萌]]而姦無所藏矣。</p><p><strong>所出</strong>：《管子 · 第55篇九守》 — https://zh.wikisource.org/wiki/管子/第55篇九守</p></article></main></div></div>
