    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 逖矣西土之人</nav></header><main><article><h1>逖矣西土之人</h1><p>王師遠來，撫慰西土從征之眾。</p><p>王左杖黃鉞，右秉白旄以麾，曰：「逖矣西土之人。」言師行遠役，西土之人效力勤王，王撫慰之，使知伐商之義，非[[好戰必亡]]，乃[[恭行天罰]]也。</p><p><strong>所出</strong>：《書書 · 牧誓》 — https://zh.wikisource.org/wiki/尚書/牧誓</p></article></main></div></div>
