    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 官人以順志為賢</nav></header><main><article><h1>官人以順志為賢</h1><p>用人專取諂媚者，必至敗亡。</p><p>官人則以順志者為賢，擢才則以近習者為前。上宰鼎列，委之母後之族；專斷顧問，決之阿諂之徒。</p><p><strong>所出</strong>：《抱朴子 · 卷05》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷05</p></article></main></div></div>
