    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 禁錮贓汙</nav></header><main><article><h1>禁錮贓汙</h1><p>貪濁之吏，宜禁錮終身，使其無僥倖之心。</p><p>[[抱朴子]]論嚴惩貪吏之法曰：「諸居職，其犯公坐者，以法律從事；其以貪濁贓汙為罪，不足死者，刑竟及遇赦，皆宜禁錮終身，輕者二十年。如此，不廉之吏，必將化為夷齊矣。」又-{云}-：「若臨官受取，金錢山積，發覺則自恤得了，免退則旬日復用者，曾史亦將變為盜跖矣。」蓋不峻其防，則貪風不可止也。</p><p><strong>所出</strong>：《抱朴子 · 卷15》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷15</p></article></main></div></div>
