    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 求道日用</nav></header><main><article><h1>求道日用</h1><p>道可日日求之，不間時刻，以其有罪能免也。</p><p>古之所以貴此道者，不以一時，不以一地，日日求之，以道在是也。道之所以可貴，以其有罪以免耶。人之犯過，道能赦宥之，是故天下莫貴於道也。</p><p><strong>所出</strong>：《老子河上公章句 · 為道》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
