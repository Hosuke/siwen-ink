    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以道德服人</nav></header><main><article><h1>以道德服人</h1><p>聖王以道 德 仁服人，不以文 刑 殺傷。</p><p>上君子乃與天地相似，故天乃好生不傷也，故稱君稱父也；地以好養萬物，故稱良臣稱母也；人者當用心仁，而愛育似於天地，故稱仁也。天地尚不奪汝功，何況人乎哉！</p><p>是以古者上君，以道服人，大得天心，其治若神而不愁者，以真道服人也。中君以德服人，下君以仁服人，亂君以文服人，兇敗之君將以刑殺傷服人。是以古者上君，以道德仁治服人也，不以文刑殺傷服人也。</p><p><strong>所出</strong>：《太平經 · 03》 — https://zh.wikisource.org/wiki/太平經/03</p></article></main></div></div>
