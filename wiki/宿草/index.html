    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 朋友之墓有宿草而不哭</nav></header><main><article><h1>朋友之墓有宿草而不哭</h1><p>朋友之喪，宿草既陳，哀當已矣</p><p>曾子曰：「朋友之墓，有宿草而不哭焉。」</p><p>宿草者，經歲之草也。朋友身亡，逾期年而草生於墓，則哭禮止矣。蓋交道以情，情有時而盡；哀容以久而衰，衰則反於常。常者，不哭之謂也。</p><p>此亦禮緣情而立、節之以時之意爾。</p><p><strong>所出</strong>：《禮記 · 檀弓上》 — https://zh.wikisource.org/wiki/禮記/檀弓上</p></article></main></div></div>
