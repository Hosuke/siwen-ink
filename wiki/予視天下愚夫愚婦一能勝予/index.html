    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 予視天下愚夫愚婦一能勝予</nav></header><main><article><h1>予視天下愚夫愚婦一能勝予</h1><p>愚夫愚婦，亦有勝己之能，人君不可不敬。</p><p>一人之智有限，雖愚夫愚婦，亦有一能勝己者。是以人君馭民，當如朽索馭六馬，凜然戒懼，不可自恃其智。此[[五子之歌]]所述，以戒人主勿輕天下之人也。</p><p>其一末云：「予視天下。愚夫愚婦，一能勝予。」</p><p><strong>所出</strong>：《尚書 · 五子之歌》 — https://zh.wikisource.org/wiki/尚書/五子之歌</p></article></main></div></div>
