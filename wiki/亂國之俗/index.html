    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 亂國之俗</nav></header><main><article><h1>亂國之俗</h1><p>亂國有五俗：學者稱仁義、言談者設詐、劒俠犯禁、患御者賄賂、商工牟利。</p><p>是故亂國之俗，其學者，則稱先王之道以籍仁義，盛容服而飾辯說，以疑當世之法，而貳人主之心。其言談者，爲設詐稱，借於外力，以成其私，而遺社稷之利。其帶劒者，聚徒屬，立節操，以顯其名，而犯五官之禁。其患御者，積於私門，盡貨賂，而用重人之謁，退汗馬之勞。其商工之民，脩治苦窳之器，聚弗靡之財，蓄積待時，而侔農夫之利。此五者，邦之蠹也。</p><p><strong>所出</strong>：《韓非子 · 五蠹》 — https://zh.wikisource.org/wiki/韓非子/五蠹</p></article></main></div></div>
