    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖人之治虛心實腹</nav></header><main><article><h1>聖人之治虛心實腹</h1><p>虛其心以守道，實其腹以全生。</p><p>心懷智而腹懷食，虛有智而實無知。心虛則志弱，腹實則形全。</p><p><strong>所出</strong>：《道德經 (王弼本) · 三章》 — https://zh.wikisource.org/wiki/道德經 (王弼本》</p></article></main></div></div>
