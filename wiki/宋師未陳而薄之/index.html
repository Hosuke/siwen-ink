    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 宋師未陳而薄之</nav></header><main><article><h1>宋師未陳而薄之</h1><p>敵未成列而急擊之，兵法所謂「不卜而與之戰」也。</p><p>夏六月，齊師、宋師次於郎。公子偃曰：「宋師不整，可敗也。宋敗，齊必還，請擊之。」公弗許。自雩門竊出，蒙皋比而先犯之。公從之。大敗宋師於乘丘。齊師乃還。</p><p>十一年夏，宋爲乘丘之役故侵我。公禦之，宋師未陳而薄之，敗諸鄑。</p><p>凡師，敵未陳曰敗某師，皆陳曰戰，大崩曰敗績，得人雋曰克，覆而敗之曰取某師，京師敗曰王師敗績于某。</p><p><strong>所出</strong>：《春秋左氏傳 · 莊公》 — https://zh.wikisource.org/wiki/春秋左氏傳/莊公</p></article></main></div></div>
