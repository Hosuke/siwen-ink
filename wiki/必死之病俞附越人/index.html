    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 必死之病俞附越人</nav></header><main><article><h1>必死之病俞附越人</h1><p>才高而性惡，雖古之名醫不能治。</p><p>抱朴子論禰衡之才而不能自全曰：於此不安，已可知矣。猶必死之病，俞附越人，所無如何。朽木鉛鋌，班輸歐冶所不能匠也。而復走投荊楚間，終陷極害，此乃衡懵蔽之效也。蓋欲之而不能得，非能得而弗用者矣。</p><p><strong>所出</strong>：《抱朴子 · 卷47》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷47</p></article></main></div></div>
