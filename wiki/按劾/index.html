    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 按劾</nav></header><main><article><h1>按劾</h1><p>彈劾糾察之奏，所以明憲清國。</p><p>若乃按劾之奏，所以明憲清國。昔周之太僕，繩愆糾謬；秦之御史，職主文法；漢置中丞，總司按劾；故位在鷙擊，砥礪其氣，必使筆端振風，簡上凝霜者也。按劾之文，當明憲清國，辨析疏通，強志成務。</p><p><strong>所出</strong>：《文心雕龍 · 奏啟》 — https://zh.wikisource.org/wiki/文心雕龍/奏啟</p></article></main></div></div>
