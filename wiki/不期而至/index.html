    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不期而至</nav></header><main><article><h1>不期而至</h1><p>遠國不期而至，以見諸侯皆來至也。</p><p>秋，九月，齊侯、宋公、江人、黃人盟于貫。貫之盟，不期而至者，江人、黃人也。江人、黃人者，遠國之辭也。中國稱齊、宋，遠國稱江、黃，以為諸侯皆來至也。</p><p>《穀梁》別中國與遠國之稱：齊、宋為中國，江、黃為遠國。遠國不約而至，是見桓公威德遠播，諸侯皆來歸之也。</p><p><strong>所出</strong>：《春秋穀梁傳 · 僖公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/僖公</p></article></main></div></div>
