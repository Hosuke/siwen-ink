    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 奉秦王之歡心</nav></header><main><article><h1>奉秦王之歡心</h1><p>李斯自言來韓以奉秦王歡心，願效便計，冀得面見韓王陳說。</p><p>斯之來使，以奉秦王之歡心，願效便計，豈陛下所以逆賤臣者邪？臣斯願得一見，前進道愚計，退就葅戮，願陛下有意焉。秦王飲食不甘，遊觀不樂，意專在圖趙，使臣斯來言，願得身見，因急與陛下有計也。</p><p><strong>所出</strong>：《韓非子 · 存韓》 — https://zh.wikisource.org/wiki/韓非子/存韓</p></article></main></div></div>
