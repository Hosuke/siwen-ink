    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 德畢刑畢</nav></header><main><article><h1>德畢刑畢</h1><p>季夏德畢，季冬刑畢。春夏以德養物，秋冬以刑肅殺。</p><p>[[六合]]之義，以德與刑分配四時。</p><p>德在春夏，刑在秋冬。季夏德畢，季冬刑畢。</p><p>是故，[[失政]]行夏令於孟冬，則陽氣不勝，麥乃不熟；行冬令於孟夏，則苦雨數來，五穀不滋。</p><p>德失而刑先至，[[禁母作]]之所以重也。</p><p><strong>所出</strong>：《淮南子 · 時則訓》 — https://zh.wikisource.org/wiki/淮南子/時則訓
===終::</p></article></main></div></div>
