    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 疑戰而曰敗</nav></header><main><article><h1>疑戰而曰敗</h1><p>疑戰而書敗，以見內中國之義。</p><p>九月，公敗邾師于偃。不日，疑戰也。疑戰而曰敗，勝內也。</p><p>《穀梁》解書法之微意：公與邾師相遇，不日其日，是「疑戰」也；然經書「敗」，以明內國之師敗外寇也。疑戰而書敗，所以見內中國之義也。</p><p><strong>所出</strong>：《春秋穀梁傳 · 僖公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/僖公</p></article></main></div></div>
