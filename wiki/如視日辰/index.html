    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 如視日辰</nav></header><main><article><h1>如視日辰</h1><p>治事當如瞻日月，敬慎而不懈。</p><p>王戒傅說：「汝晝汝夜，時罔非乃載，敬之哉。若賈，汝毋非貨如（土戠）石。」有學者以「女」字應釋為「汝」。茲從其說。言傅說當敬慎如視日星，無時不然，不可懈怠。治事之道，惟敬為本也。</p><p><strong>所出</strong>：《尚書 · 傅說之命下》 — https://zh.wikisource.org/wiki/尚書/傅說之命下</p></article></main></div></div>
