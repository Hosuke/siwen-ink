    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 可貞无咎</nav></header><main><article><h1>可貞无咎</h1><p>守正自持，可保無過。</p><p>可貞无咎者，九四居大臣之位，以陽剛而承剛健之世，所患者妄動耳。能以正道自持，則可以无咎。《象》曰「可貞无咎，固有之也」，言此貞非外假，乃本心所自有，守之則得，舍之則失，故曰固有之也。君子之於无妄，其要在是矣。</p><p><strong>所出</strong>：《周易 · 无妄》 — https://zh.wikisource.org/wiki/周易/无妄</p></article></main></div></div>
