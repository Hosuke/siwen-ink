    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 句芒錫壽</nav></header><main><article><h1>句芒錫壽</h1><p>鄭穆公於廟中見句芒神，神許以明德，錫壽十九年，國家蕃昌。</p><p>昔者鄭穆公當晝日中處乎廟，有神入門而左，鳥身，素服三絕，面狀正方。鄭穆公見之，乃恐懼，奔。</p><p>神曰：「無奔，帝享女明德，使予錫女壽十年有九，使若國家蕃昌，子孫茂，毋失。」</p><p>鄭穆公再拜稽首，曰：「敢問神名。」曰：「予爲句芒。」</p><p><strong>所出</strong>：《墨子 · 明鬼下》 — https://zh.wikisource.org/wiki/墨子/明鬼下</p></article></main></div></div>
