    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 壹民</nav></header><main><article><h1>壹民</h1><p>用兵之本在於團結民心。</p><p>孫卿子云：「凡用兵攻戰之本，在乎壹民。」弓矢調而羿能中微，六馬和而造父能致遠，士民親附而湯武能必勝。善附民者，善用兵者也。[[湯武誅暴]]。</p><p><strong>所出</strong>：《荀子 · 議兵篇》 — https://zh.wikisource.org/wiki/荀子/議兵篇</p></article></main></div></div>
