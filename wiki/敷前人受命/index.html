    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 敷前人受命</nav></header><main><article><h1>敷前人受命</h1><p>承續先王受命之大功，不敢廢忘。</p><p>朕承文王之命，敷布前人受命之緒，不敢忘其大功。</p><p>「敷賁，敷前人受命，茲不忘（亡）大功，予不敢閉于天降威。」</p><p>言朕敷布文王所受之命，不敢忘其大功，亦不敢閉塞天威之至。</p><p><strong>所出</strong>：《尚書 · 大誥》 — https://zh.wikisource.org/wiki/尚書/大誥</p></article></main></div></div>
