    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無越厥命以自覆</nav></header><main><article><h1>無越厥命以自覆</h1><p>勿越天命以取滅亡也。</p><p>伊尹戒太甲，以先王昧爽丕顯、旁求俊彥之勤，告誡嗣王「無越厥命以自覆」。言天命有常，人主不可以己意妄干也。先王小心翼翼，寅畏天命，故能撫綏萬方，奄有天下。嗣王若縱欲妄行，越厥命而不知戒，則覆轍自取，喪亡隨之。此千古之明鑒也。</p><p><strong>所出</strong>：《尚書 · 太甲上》 — https://zh.wikisource.org/wiki/尚書/太甲上</p></article></main></div></div>
