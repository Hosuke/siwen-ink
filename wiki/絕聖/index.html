    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 絕聖</nav></header><main><article><h1>絕聖</h1><p>廢除聖智之名，返於素樸之治。</p><p>絕聖者，絕去智慧聖知之名也。河上公以此為還淳之要，聖智既絕，巧偽無由而生，民乃得自然之利。</p><p><strong>所出</strong>：《老子河上公章句 · 還淳》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
