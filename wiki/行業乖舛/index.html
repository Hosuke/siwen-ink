    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 行業乖舛</nav></header><main><article><h1>行業乖舛</h1><p>志向與操業相違，聖賢與俗夫之別，正在於此。</p><p>潛居先生云：「行業乖舛，意何可得。」言人之志趣與所操之業相背馳，則心意拂逆，無所成就。鶴鵬戾赤霄而高翔，鹡鸰傲蓬林以鼓翼，洿隆殊途，亦飛之極。蜉蝣忽忽於寸陰，野馬六月而後息，鯈鮒泛濫以暴鱗，靈虬勿用乎不測。物各有宜，人亦然。故一人之業，不可苟也。</p><p><strong>所出</strong>：《抱朴子 · 卷35》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷35</p></article></main></div></div>
