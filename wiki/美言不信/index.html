    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 美言不信</nav></header><main><article><h1>美言不信</h1><p>悅耳之辭不足以取信。</p><p>美言者，辭采芬芳、足以動人聽聽，而其中空空無有也。[[信言不美]] 言之於此，詞雖不美，而其實有可驗。彼飾智要譽者，終不如拙誠之見信於人。老氏傷之，故云美言不信。</p><p><strong>所出</strong>：《道德經 (王弼本) · 八十一章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
