    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 君子易知而難狎</nav></header><main><article><h1>君子易知而難狎</h1><p>君子易於知之，難以狎近。</p><p>君子易知而難狎，易懼而難脇，畏患而不避義死，欲利而不爲所非，交親而不比，言辯而不辭。蕩蕩乎，其有以殊於世也。</p><p><strong>所出</strong>：《荀子 · 不苟篇》 — https://zh.wikisource.org/wiki/荀子/不苟篇</p></article></main></div></div>
