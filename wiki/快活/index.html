    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 快活</nav></header><main><article><h1>快活</h1><p>快活在循分守操，不在榮華。</p><p>快活之道，在循吾分、守吾操、養吾浩、全吾高，保太和以淡世慮，滅爭競以少氣淘，耐清寒以增學養，忘嗜慾以住林臯。出為好官無罪戾，入為達士免牢騷，[[訓兒孫]]戒淫賭，教[[婦女]]肅門戶。耕不歉官租，學不荒德圃。[[與鄉老談格言]]，招後輩講功過。與之對比者：兩道愁眉，一腔死血，好貪好爭，好穿好吃，與[[塵市同磨]]，看夕陽轉滅，是無快活者也。</p><p><strong>所出</strong>：《張三丰先生全集 · 卷6》 — https://zh.wikisource.org/wiki/張三丰先生全集/卷6</p></article></main></div></div>
