    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 客主勝復</nav></header><main><article><h1>客主勝復</h1><p>客主之氣，勝而無復；主勝逆，客勝從，此天道之常也。</p><p>帝問客主之勝復，歧伯云：「客主之氣，勝而無復也。」客主相加，但有勝氣而無復氣，此與六氣自勝自復之理不同。</p><p>其逆從奈何？歧伯明言：「主勝逆，客勝從，天之道也。」主氣為地之常氣，客氣為天之加臨，主氣勝則病情深重而難愈，是為逆；客氣勝則病情輕淺而易去，是為從。</p><p>客主加臨之病候，各有不同，如厥陰司天，客勝則耳鳴掉眩，甚則咳，主勝則胸脅痛、舌難以言，餘皆準此。</p><p><strong>所出</strong>：《黃帝內經 · 素問第二十二卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第二十二卷</p></article></main></div></div>
