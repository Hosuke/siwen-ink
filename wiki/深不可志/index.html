    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 深不可志</nav></header><main><article><h1>深不可志</h1><p>道之廣大精微，不可以尋常之志窺測也。</p><p>古之仙為道者，深不可志。</p><p>夫道廣大精微，超乎象數之外，非尋常意識所能把握。志者，心之所向也；以尋常之心志求之，愈求愈遠，愈探愈深，終不可以形名得之。此言道體之無窮，亦見古之修真者洞徹玄微、體道之深也。</p><p>故[[聖人守此萬物化]]，而[[道不盈]]，皆此理也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章十五》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
