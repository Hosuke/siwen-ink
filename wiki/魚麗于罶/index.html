    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 魚麗于罶</nav></header><main><article><h1>魚麗于罶</h1><p>魚入於罶，生物之盛也。</p><p>魚麗于罶，鱨鯊。君子有酒，旨且多。
魚麗于罶，魴鱧。君子有酒，多且旨。
魚麗于罶，鰋鯉。君子有酒，旨且有。</p><p>魚入於罶，隨其先後而至，此見物產之盛，非一非偶也。首章言鱨鯊，次章言魴鱧，末章言鰋鯉，魚類繁夥，源源不竭；君子之酒亦旨且多、旨且有，美物備而旨味彰。此詩人所以美萬物盛多，可以告於神明者也。</p><p><strong>所出</strong>：《詩經 · 魚麗》 — https://zh.wikisource.org/wiki/詩經/魚麗</p></article></main></div></div>
