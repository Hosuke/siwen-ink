    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 露才揚己</nav></header><main><article><h1>露才揚己</h1><p>班固譏屈原露才揚己，忿懟沉江，非明哲之論。</p><p>班固以為露才揚己，忿懟沉江；羿澆二姚，與左氏不合；崐侖懸圃，非《經》義所載；然其文辭麗雅，為詞賦之宗，雖非明哲，可謂妙才。</p><p><strong>所出</strong>：《文心雕龍 · 辨騷》 — https://zh.wikisource.org/wiki/文心雕龍/辨騷</p></article></main></div></div>
