    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 柔弱以靜</nav></header><main><article><h1>柔弱以靜</h1><p>柔弱而能安靜，乃道者之德。</p><p>柔弱以靜，舒安以定。言道者之德，不以剛強為尚，而以柔弱安靜為本。柔者無所不容，弱者無所不勝；靜者澄然若水，安者泊然而無營。以此修身，則心不妄動；以此事天，則與道合真。唯柔弱以靜者，能藏於不敢，行於不能，動不失時，與萬物周旋而不爭。</p><p><strong>所出</strong>：《淮南子 · 原道訓》 — https://zh.wikisource.org/wiki/淮南子/原道訓</p></article></main></div></div>
