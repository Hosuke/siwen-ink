    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 冬陰夏陽死期</nav></header><main><article><h1>冬陰夏陽死期</h1><p>九候之脈以陰陽辨死期：沈細懸絕者夜半死，盛躁喘數者日中死，寒熱者平旦死，熱病者日中死，風病者日夕死，水病者夜半死。</p><p>九候之脈皆沈細懸絕者為陰，主冬，故以夜半死。
盛躁喘數者為陽，主夏，故以日中死。
寒熱病者，以平旦死。
熱中及熱病者，以日中死。
病風者，以日夕死。
病水者，以夜半死。
其脈乍疏乍數乍遲乍疾者，日乘四季死。
形肉巳脫，九候雖調，猶死。</p><p>足太陽氣絕者，其足不可屈伸，死必戴眼。</p><p><strong>所出</strong>：《黃帝內經 · 素問第六卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第六卷</p></article></main></div></div>
