    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 魏成子</nav></header><main><article><h1>魏成子</h1><p>魏成子祿九在外，師友三者，終相位。</p><p>翟璜問李克：「今者聞君召先生而卜相，果誰爲之？」李克曰：「魏成子爲相矣。」</p><p>翟璜忿然，以己功自列，而李克申前說，以五法定之。又言：「魏成子以食祿千鍾，什九在外，什一在内，是以東得卜子夏、田子方、段干木。此三人者，君皆師之。子之所進五人者，君皆臣之。子惡得與魏成子比也？」</p><p>蓋言延賢千里，與近用私人，其相遠矣。</p><p><strong>所出</strong>：《史記 · 魏世家》 — https://zh.wikisource.org/wiki/史記/魏世家</p></article></main></div></div>
