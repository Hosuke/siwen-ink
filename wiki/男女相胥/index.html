    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 男女相胥</nav></header><main><article><h1>男女相胥</h1><p>陰陽男女相須相成，不可偏廢。</p><p>男女相胥者，言坎男離女相待而成功也。月受日化，金化為水，火化為土，雌雄錯雜，以類相求，迭施迭藏，盈虛相濟。此道家內丹之要義，以人身上下言之，則心火腎水、日魂月魄，相須以為用，相拘以成真。苟男女不相胥，則孤陽不生，獨陰不成，災眚自此而生矣。</p><p><strong>所出</strong>：《周易參同契 · 27章》 — https://zh.wikisource.org/wiki/周易參同契/27章</p></article></main></div></div>
