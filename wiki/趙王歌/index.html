    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 趙王歌</nav></header><main><article><h1>趙王歌</h1><p>趙王友被幽餓死，作歌以明志。</p><p>趙王友以諸呂女為后，不愛而愛他姬，諸呂女讒之於太后。太后怒，召趙王，置邸不見，圍守弗與食。趙王餓，乃歌曰：「諸呂用事兮劉氏危，迫脅王侯兮彊授我妃。我妃既妒兮誣我以惡，讒女亂國兮上曾不寤。我無忠臣兮何故棄國？自決中野兮蒼天舉直！于嗟不可悔兮寧蚤自財。為王而餓死兮誰者憐之！呂氏絕理兮讬天報仇。」丁丑，趙王幽死。</p><p><strong>所出</strong>：《史記 · 卷009》 — https://zh.wikisource.org/wiki/史記/卷009</p></article></main></div></div>
