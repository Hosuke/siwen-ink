    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 取天下常以无事</nav></header><main><article><h1>取天下常以无事</h1><p>取天下者，以無為无事為常道。</p><p>取天下者，非有國之謂也，乃得天下之心、順天下之勢也。惟无事者，萬物自遂，百姓自安，天下莫之争赴。若有事焉，以政、以令、以欲、以兵，則民擾而心離，不足以取天下矣。</p><p><strong>所出</strong>：《道德經 (王弼本) · 四十八章》 — https://zh.wikisource/wiki/道德經 (王弼本)</p><hr><p>取，治也。治天下常以無亊，不當以勞煩。與[[有事不足以取天下]]互為一理之正負。</p><p><strong>所出</strong>：《老子河上公章句 · 忘知》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
