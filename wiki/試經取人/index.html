    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 試經取人</nav></header><main><article><h1>試經取人</h1><p>欲得真才，必試之於經術，較之於對策，不可僅以虛譽取之。</p><p>[[抱朴子]]之答客難曰：「古者猶以射擇人，況經術乎？如其舍旃，則未見余法之賢乎此也。」又申之-{云}-：「夫豐草不秀瘠土，巨魚不生小水，格言不吐庸人之口，高文不墮頑夫之筆。」是以[[堯舜禹湯之舉賢]]之道，必試之以經術，問之以對策，方能得其真也。若不限以考試，則貢舉之濫，終無已時。</p><p><strong>所出</strong>：《抱朴子 · 卷15》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷15</p></article></main></div></div>
