    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 各正性命</nav></header><main><article><h1>各正性命</h1><p>天道變化，萬物各稟其性命之正，保合大和。</p><p>彖曰：乾道變化，各正性命，保合大和，乃利貞。</p><p>上文已述乾道變化之義。性命云者，天命之在人者為性，人物所受以生者為命。乾道變化之初，萬物稟受各有分劑，不可移易，是之謂正。不正則有夭札，不壽不遂，不得其天年焉。唯保合大和者，陰陽之氣不失其和，是以能長久而利貞也。</p><p><strong>所出</strong>：《周易 · 乾》 — https://zh.wikisource.org/wiki/周易/乾</p></article></main></div></div>
