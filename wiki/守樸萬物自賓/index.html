    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 守樸萬物自賓</nav></header><main><article><h1>守樸萬物自賓</h1><p>侯王守道則萬物自歸</p><p>侯王若能守之，萬物將自賓。言侯王若能守道之樸，無為而治，則天下萬物自然賓服，無所用其智巧也。</p><p><strong>所出</strong>：《老子河上公章句 · 聖德》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
