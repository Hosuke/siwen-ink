    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天紀帝魂</nav></header><main><article><h1>天紀帝魂</h1><p>天紀帝魂照無阿，字廣神，主天紀之魂。</p><p>天紀帝魂者，七神之一也。照無阿，字廣神，主天紀之魂。</p><p>經云：「天紀帝魂照無阿，字廣神。」位在七神第七，與天帝九關魂同主魂魄之事。誦者存想七神布於心下臍上，念至其名而咽津，七過俱畢，則胞胎開解，長生可期。</p><p><strong>所出</strong>：《上清大洞真經 · 35章》 — https://zh.wikisource.org/wiki/上清大洞真經/35章</p></article></main></div></div>
