    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 至于圹</nav></header><main><article><h1>至于圹</h1><p>柩車至墓，陳器下棺以窆。</p><p>至于圹。陳器于道東西，北上。茵先入。屬引。主人袒。眾主人西面北上，妇人東面，皆不哭。乃窆。主人哭，踊無算。襲，贈用制幣，玄纁束，拜稽顙，踊如初。卒，袒，拜賓。主婦亦拜賓，即位拾踊三，襲。</p><p><strong>所出</strong>：《儀禮 · 既夕禮》 — https://zh.wikisource.org/wiki/儀禮/既夕禮</p></article></main></div></div>
