    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 高為其居危顛莫之救</nav></header><main><article><h1>高為其居危顛莫之救</h1><p>主盛處賢而自予雄者，必至於危亡而不可救。</p><p>「高為其居，危顛莫之救」，此言尊高滿大，而好矜人以麗，主盛處賢而自予雄也。故盛必失而雄必敗。夫上既主盛處賢以操士民，國家煩亂，萬民心怨，此其必亡也。猶自萬仞之山，播而入深淵，其死而不振也必矣。</p><p><strong>所出</strong>：《管子 · 第11篇宙合》 — https://zh.wikisource.org/wiki/管子/第11篇宙合</p></article></main></div></div>
