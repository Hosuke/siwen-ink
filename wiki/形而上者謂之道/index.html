    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 形而上者謂之道，形而下者謂之器</nav></header><main><article><h1>形而上者謂之道，形而下者謂之器</h1><p>道超乎形體，器寓乎形質，變通推行為事業。</p><p>形而上者謂之道，形而下者謂之器。化而裁之謂之變，推而行之謂之通，舉而措之天下之民謂之事業。是故道也者，超越形體，無方無體，萬物之所由生也；器也者，寓於形質，有形有為，百官之所分掌也。變通者，化裁推行之謂也；事業者，措之於民之謂也。聖人本此而立教，成天下之亹亹者，皆由此出焉。</p><p><strong>所出</strong>：《周易 · 繫辭上》 — https://zh.wikisource.org/wiki 易傳/繫辭上</p></article></main></div></div>
