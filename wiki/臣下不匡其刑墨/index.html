    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 臣下不匡，其刑墨</nav></header><main><article><h1>臣下不匡，其刑墨</h1><p>臣不諫君，墨刑隨之。</p><p>伊尹定官刑之制，列三風十愆之戒，而終之以臣下不匡之罰。言臣子之於君上，有糾正之責。見君有過而不諫，為臣不忠，當施墨刑以恥之。且具訓于蒙士，俾知典法，不敢依阿緘默。此[[臣作股肱耳目]]之義，臣道之重也。</p><p><strong>所出</strong>：《尚書 · 伊訓》 — https://zh.wikisource.org/wiki/尚書/伊訓</p></article></main></div></div>
