    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 文子出亡過嗇夫</nav></header><main><article><h1>文子出亡過嗇夫</h1><p>好音而受琴，好珮而受環，皆振己過以干譽；干譽者不可恃。</p><p>晉中行文子出亡，過於縣邑。從者曰：「此嗇夫，公之故人。公奚不休舍，且待後車？」文子曰：「吾嘗好音，此人遺我鳴琴；吾好珮，此人遺我玉環：是振我過者也。以求容於我者，吾恐其以我求容於人也。」乃去之。果收文子後車二乘而献之其君矣。</p><p><strong>所出</strong>：《韓非子 · 說林下》 — https://zh.wikisource.org/wiki/韓非子/說林下</p></article></main></div></div>
