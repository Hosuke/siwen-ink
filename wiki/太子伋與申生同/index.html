    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 太子伋與申生同</nav></header><main><article><h1>太子伋與申生同</h1><p>宣公太子以婦見誅，弟壽爭死，與晉太子申生不敢明驪姬之過同，俱傷父志而死。</p><p>太史公曰：余讀世家言，至於宣公之太子以婦見誅，弟壽爭死以相讓，此與晉太子申生不敢明驪姬之過同，俱惡傷父之志。然卒死亡，何其悲也！</p><p><strong>所出</strong>：《史記 · 卷037》 — https://zh.wikisource.org/wiki/史記/卷037</p></article></main></div></div>
