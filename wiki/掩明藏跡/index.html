    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 掩明藏跡</nav></header><main><article><h1>掩明藏跡</h1><p>聖人掩其明，不形於外；藏其跡，歸於無為。</p><p>聖人不為名屍，不為謀府，不為事任，不為智主。藏無形，行無跡，遊無朕，不為福先，不為禍始，保於虛無，動於不得已。故聖人掩明于不形，藏跡于無為。</p><p><strong>所出</strong>：《淮南子 · 詮言訓》 — https://zh.wikisource.org/wiki/淮南子/詮言訓</p></article></main></div></div>
