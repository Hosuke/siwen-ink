    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 去甚去大去楮</nav></header><main><article><h1>去甚去大去楮</h1><p>聖人去泰甚、去泰大、制泰楮，歸於自然。</p><p>甚者，過其節也；大者，逾其量也；楮者，奢其用也。三者皆失其自然之度，故聖人去之。去甚則不為過甚之事；去大則不為過大之求；去楮則不為過楮之用。天下神器，非可為者，聖人知之，故以自然為宗，順物之性而不加之以人力也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第七十三章 自然》 — https://zh.wikisource.org/wiki/老子_(帛書校勘版)</p></article></main></div></div>
