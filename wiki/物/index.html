    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 物</nav></header><main><article><h1>物</h1><p>天地與其所產，萬物之總名。</p><p>天地與其所產焉，物也。物以物其所物而不過焉，實也。實以實其所實而不曠焉，位也。出其所位非位，而位其所位焉，正也。</p><p>物者，天地所生之萬有也。物有其實，實有其位，位得其正，則物各當其分，而天下治矣。</p><p><strong>所出</strong>：《公孫龍子 · 6》 — https://zh.wikisource.org/wiki/公孫龍子/6</p></article></main></div></div>
