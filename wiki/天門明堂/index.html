    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天門明堂</nav></header><main><article><h1>天門明堂</h1><p>天門在面，明堂在鼻，二者為神氣出入之要津。</p><p>隱藏章云「上合天門入明堂」。天門者，面之兩眉間，入於髮際，一名「上丹田」，為上神之門戶；明堂者，鼻也，氣息所由出納。</p><p>《抱朴子·內篇》以眉間上寸為守一目，是神氣之關津。修煉者守其門，則三光不入，諸邪可避。</p><p><strong>所出</strong>：《黃庭內景經 · 隱藏章第三十五》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/隱藏章第三十五</p></article></main></div></div>
