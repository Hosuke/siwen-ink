    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 遜志時敏</nav></header><main><article><h1>遜志時敏</h1><p>學當謙遜，收斂心志；修行貴在及時，不容怠惰。</p><p>說曰：「惟學遜志，務時敏，厥修乃來。」言夫學者，必遜抑其志，不自矜伐，然後可以受教。務及時而敏行之，則其所修未有不得者也。蓋學貴謙受而行貴敏速，二者相須不可以偏廢。[[學不可以已]]云「終乎乃善」，茲其近之矣。</p><p><strong>所出</strong>：《尚書 · 說命下》 — https://zh.wikisource.org/wiki/尚書/說命下</p></article></main></div></div>
