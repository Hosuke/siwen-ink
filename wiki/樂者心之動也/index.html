    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 樂者心之動也</nav></header><main><article><h1>樂者心之動也</h1><p>樂者心之動，聲者樂之象，文采節奏聲之飾；先鼓以警戒，三步以見方。</p><p>樂者，心之動也；聲者，樂之象也；文采節奏，聲之飾也。君子動其本，樂其象，然後治其飾。是故先鼓以警戒，三步以見方，再始以著往，復亂以飭歸，奮疾而不拔，極幽而不隱。獨樂其志，不厭其道；備舉其道，不私其欲。是以情見而義立，樂終而德尊；君子以好善，小人以息過：故曰「生民之道，樂為大焉」。</p><p><strong>所出</strong>：《史記 · 卷024》 — https://zh.wikisource.org/wiki/史記/卷024</p></article></main></div></div>
