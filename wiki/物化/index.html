    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 物化</nav></header><main><article><h1>物化</h1><p>萬物流轉，物我無分，生死如夢。</p><p>庄周夢為蝴蝶，俄然覺，則蘧蘧然周也。周與蝴蝶，則必有分矣，此之謂物化。</p><p>物化者，萬物遷化之說也。天地一指也，萬物一馬也——指與非指，馬與非馬，循道以觀，無非彼、無非是也。庄周與蝴蝶，夢覺之間，彼是迭更，而不知其分之所在。然庄周固庄周，蝴蝶固蝴蝶，未嘗混也——唯其所以分之故，非名言所及，故曰「物化」。化而不自知，與化而兩忘，其致一也。</p><p><strong>所出</strong>：《莊子 · 齊物論》 — https://zh.wikisource.org/wiki/莊子/齊物論</p></article></main></div></div>
