    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 永矢</nav></header><main><article><h1>永矢</h1><p>誓之至也，至死不改。</p><p>「永矢」者，永遠誓之之辭。[[考磐]]三章皆用「永矢」起句，後接[[弗諼]]、弗過、弗告，合成[[永矢弗諼]]、[[永矢弗過]]、[[永矢弗告]]之誓辭。永者，永久也；矢者，誓也。言此志之誓，終身不渝也。</p><p><strong>所出</strong>：《詩經 · 考磐》 — https://zh.wikisource.org/wiki/詩經/考磐</p></article></main></div></div>
