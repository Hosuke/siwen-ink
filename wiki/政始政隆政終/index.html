    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 政之始、隆、終</nav></header><main><article><h1>政之始、隆、終</h1><p>臨民以義，寬容以敬，斷於賞罰。始則寬裕，隆則察斷，終則誅賞。</p><p>臨事接民而以義，變應寬裕而多容，恭敬以先之，政之始也；然後中和察斷以輔之，政之隆也；然後進退誅賞之，政之終也。故一年與之始，三年與之終。用其終為始，則政令不行而上下怨疾，亂所以自作也。《書》曰：「義刑義殺，勿庸以即，女惟曰『未有順事』。」言先教也。</p><p><strong>所出</strong>：《荀子 · 致士篇》 — https://zh.wikisource.org/wiki/荀子/致士篇</p></article></main></div></div>
