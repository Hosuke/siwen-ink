    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 交際何心</nav></header><main><article><h1>交際何心</h1><p>萬章問交際之道，孟子以恭為本，而不受不義之賜。</p><p>萬章問「交際何心」，孟子答以恭。蓋尊者賜之，若問其所取義與不義而後受之，是為不恭，故弗卻也。然其交也以道，其接也以禮，斯[[孔子]]受之矣。若[[御人於國門之外者]]，其交以道，其饋以禮，亦不可受，以其取之於民不義故耳。是以[[不受不義之賜]]，乃恭之大者。</p><p><strong>所出</strong>：《孟子 · 萬章下》 — https://zh.wikisource.org/wiki/孟子/萬章下</p></article></main></div></div>
