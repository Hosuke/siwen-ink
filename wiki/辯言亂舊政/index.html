    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 辯言亂舊政</nav></header><main><article><h1>辯言亂舊政</h1><p>辯慧之言，足以傾覆祖宗成法。</p><p>尹戒王：君罔以辯言亂舊政。辯言者，飾辭游說、動人以言者也。舊政成法，先王所建，久而相安；一旦以辯言搖之，則臣工無所守，而邦本搖矣。是以明主必先固吾法，而後可以應天下之言。</p><p><strong>所出</strong>：《尚書 · 太甲下》 — https://zh.wikisource.org/wiki/尚書/太甲下</p></article></main></div></div>
