    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 尊賢不退不肖</nav></header><main><article><h1>尊賢不退不肖</h1><p>君子大義，富貴不傲物，貧窮不易行，尊賢而不退不肖。</p><p>叔向問君子之大義，晏子對以和調而不緣、溪盎而不苛、莊敬而不狡、和柔而不銓、刻廉而不劌、行精而不以明汙、齊尚而不以遺罷。富貴不傲物，貧窮不易行，尊賢而不退不肖。</p><p>尊賢，人之美德也；不退不肖，乃君子之義也。賢者尚矣，而不肖者亦有其用。聖人無棄人，故君子無棄才。富貴而傲物，則物離矣；貧窮而易行，則行渝矣。尊賢而又不退不肖，此所以為大義也。</p><p><strong>所出</strong>：《晏子春秋 · 卷四》 — https://zh.wikisource.org/wiki/晏子春秋/卷四</p></article></main></div></div>
