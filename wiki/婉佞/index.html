    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 婉佞</nav></header><main><article><h1>婉佞</h1><p>以柔媚取媚上位，無材能而徒以婉順得幸</p><p>籍孺、閎孺者，漢初佞幸也。「非有材能，徒以婉佞貴幸，與上臥起，公卿皆因關說」。孝惠之世，郎侍中皆冠鵕䴊，貝帶，傅脂粉，化二人之屬。婉佞者，以柔言媚色投上之所好，不以才德聞，而以婉順獲進，故《說文》云「佞，巧讇高材也」，茲得其實。</p><p><strong>所出</strong>：《史記 · 卷125》 — https://zh.wikisource.org/wiki/史記/卷125</p></article></main></div></div>
