    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 月離于畢</nav></header><main><article><h1>月離于畢</h1><p>月行近畢宿，古以為大雨之象。</p><p>「月離于畢」者，古占星之辭也。離，附麗之義。畢，星名，二十八宿之一，其形如畢罩。詩言「月離于畢，俾滂沱矣」，蓋古驗：月行附麗於畢宿，則有大雨之兆。毛傳云：「月離于畢，則滂沱矣。」</p><p>畢宿主雨，《詩經》中《小星》亦有「維參與昴」之語，皆以星象占候也。此詩引天象以證人事，見征途之險，不僅山高水長，兼有暴雨相侵，東征之苦加甚矣。</p><p><strong>所出</strong>：《詩經 · 漸漸之石》 — https://zh.wikisource.org/wiki/詩經/漸漸之石</p></article></main></div></div>
