    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 日食晝晦</nav></header><main><article><h1>日食晝晦</h1><p>己丑日食，晝晦，太后惡之，以為為我也。</p><p>己丑，日食，晝晦。太后惡之，心不樂，乃謂左右曰：「此為我也。」</p><p><strong>所出</strong>：《史記 · 卷009》 — https://zh.wikisource.org/wiki/史記/卷009</p></article></main></div></div>
