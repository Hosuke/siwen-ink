    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 易地皆然</nav></header><main><article><h1>易地皆然</h1><p>君子同道，雖易地而準則一也。</p><p>孟子贊禹、稷、顏回同道。禹、稷當平世，三過其門不入；顏子當亂世，居陋巷不改其樂。二人所遇之世不同，所居之位各異，而其所守之道則一也。遂斷之曰：「禹、稷、顏子易地則皆然。」處盛世者急於濟民，處亂世者安於守道，位可易也，道不可易，是之謂易地皆然。</p><p><strong>所出</strong>：《孟子 · 離婁下》 — https://zh.wikisource.org/wiki/孟子/離婁下</p></article></main></div></div>
