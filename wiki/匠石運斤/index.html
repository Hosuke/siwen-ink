    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 匠石運斤</nav></header><main><article><h1>匠石運斤</h1><p>巧匠運斤成風，無堊則無所用其巧；知己既亡，巧無所施。</p><p>莊子送葬，過惠子之墓，顧謂從者曰：「郢人堊慢其鼻端若蠅翼，使匠人斲之。匠石運斤成風，聽而斲之，盡堊而鼻不傷，郢人立不失容。宋元君聞之，召匠石曰：『嘗試為寡人為之。』匠石曰：『臣則嘗能斲之。雖然，臣之質死久矣。』自夫子之死也，吾無以為質矣，吾無與言之矣。」</p><p><strong>所出</strong>：《莊子 · 徐無鬼》 — https://zh.wikisource.org/wiki/莊子/徐無鬼</p></article></main></div></div>
