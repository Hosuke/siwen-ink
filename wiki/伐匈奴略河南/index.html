    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 伐匈奴略河南</nav></header><main><article><h1>伐匈奴略河南</h1><p>秦始皇使蒙恬帥師三十萬北擊胡，略取河南地。</p><p>燕人盧生使入海還，以鬼神事，因奏錄圖書，曰「亡秦者胡也」。始皇乃使將軍蒙恬發兵三十萬人北擊胡，略取河南地。</p><p>三十三年，發諸嘗逋亡人、贅婿、賈人略取陸梁地，為桂林、象郡、南海，以適遣戍。西北斥逐匈奴。自榆中并河以東，屬之陰山，以為三十四縣，城河上為塞。又使蒙恬渡河取高闕、陽山、北假中，筑亭障以逐戎人。徙謫，實之初縣。</p><p><strong>所出</strong>：《史記 · 卷006》 — https://zh.wikisource.org/wiki/史記/卷006</p></article></main></div></div>
