    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 並驅從禽</nav></header><main><article><h1>並驅從禽</h1><p>獵者並馬馳逐，共逐禽獵。</p><p>《還》之詩，三章皆言獵者相遇於峱山，並轡馳逐，共逐禽獸者也。首章云「並驅從兩肩」，次章云「並驅從兩牡」，卒章云「並驅從兩狼」。肩者，三歲獸之名；牡者，雄畜也；狼則野獸之猛者。獵者相逢，各自矜夸其技，而亦相揖而譽之，或稱其儇，或稱其好，或稱其臧，蓋以馳逐之能相許也。此詩以獵場相遇之辭，見齊地尚武之風，亦寓刺於頌云。</p><p><strong>所出</strong>：《詩經 · 還》 — https://zh.wikisource.org/wiki/詩經/還</p></article></main></div></div>
