    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無私成私</nav></header><main><article><h1>無私成私</h1><p>無私則能成其私，此聖人之道</p><p>非以其無私邪？故能成其私。聖人無私心、無私利，而天下歸之，是以其私亦成。蓋公與私對立而相成者，忘己者反能全己，後身者反能先身，外身者反能存身，此聖人無為之效也。</p><p><strong>所出</strong>：《老子河上公章句 · 韜光》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
