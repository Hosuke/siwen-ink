    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 伐許</nav></header><main><article><h1>伐許</h1><p>鄭伯伐許，取其旗而先登</p><p>夏，公會鄭伯于郲，謀伐許也。鄭伯將伐許，五月甲辰，授兵于大宮。</p><p>秋七月，公會齊侯、鄭伯伐許。庚辰，傅于許。潁考叔取鄭伯之旗蝥弧以先登。子都自下射之，顛。瑕叔盈又以蝥弧登，周麾而呼曰：「君登矣！」鄭師畢登。壬午，遂入許。許莊公奔衛。</p><p><strong>所出</strong>：《春秋左氏傳 · 隱公》 — https://zh.wikisource.org/wiki/春秋左氏傳/隱公</p></article></main></div></div>
