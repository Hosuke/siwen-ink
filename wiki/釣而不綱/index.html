    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 釣而不綱，弋而不射宿</nav></header><main><article><h1>釣而不綱，弋而不射宿</h1><p>聖人仁民愛物。</p><p>[[孔子]][[釣而不綱]]，不用大網；[[弋而不射宿]]，不射棲宿之鳥。[[聖人]]取物以時，用物有節，[[仁者愛人]]，亦[[愛物]]也。[[聖人之道]]，在於取之有制，不欲盡物之力也。</p><p><strong>所出</strong>：《論語 · 述而第七》 — https://zh.wikisource.org/wiki/論語/述而第七</p></article></main></div></div>
