    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 樂官教胄子</nav></header><main><article><h1>樂官教胄子</h1><p>樂以象德，教胄子以直溫寬栗剛無虐簡無傲。</p><p>帝舜命夔典樂，教胄子。直而溫，寬而栗，剛而無虐，簡而無傲。詩言志，歌詠言，聲依詠，律和聲。八音克諧，無相奪倫，神人以和。</p><p><strong>所出</strong>：《尚書 · 堯典》 — https://zh.wikisource.org/wiki/尚書/堯典</p></article></main></div></div>
