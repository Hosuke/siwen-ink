    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 人始生先成精</nav></header><main><article><h1>人始生先成精</h1><p>人生之始，由精而成，精成而後漸有腦髓、骨脈、筋肉、皮肤、毛髮。</p><p>黃帝曰：「人始生，先成精，精成而腦髓生，骨為幹，脈為營，筋為剛，肉為牆，皮膚堅而毛髮長，穀入於胃，脈道以通，血氣乃行。」此論人形體生成之序，精為本，穀為養，經脈通而血氣行，人以成形。</p><p><strong>所出</strong>：《黃帝內經 · 靈樞第三卷》 — https://zh.wikisource.org/wiki/黃帝內經/靈樞第三卷</p></article></main></div></div>
