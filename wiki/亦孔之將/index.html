    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 亦孔之將</nav></header><main><article><h1>亦孔之將</h1><p>嘉美征功之辭，言恩德之盛大也。</p><p>「亦孔之將」，《破斧》之首句也。孔，甚也。將，大也。言周公東征之恩，盛大如是。</p><p>詩人憐征夫之苦，更美征功之大——「哀」與「將」相映，所哀者己之苦，所美者公之功也。</p><p>後世用「將」字為盛大之意者，實本於此。[[哀我人斯]]</p><p><strong>所出</strong>：《詩經 · 破斧》 — https://zh.wikisource.org/wiki/詩經/破斧</p></article></main></div></div>
