    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 明庶以功</nav></header><main><article><h1>明庶以功</h1><p>考核驗實，以功為準。</p><p>帝命禹曰：「敷納以言，明庶以功，車服以庸。誰敢不讓，敢不敬應？帝不時敷，同，日奏，罔功。」言聽人之敷納，當考其實功。功之著者，庸之以車服，使天下知勸。若帝不時，則臣工日奏而無功，治道以隳矣。[[敷納以言]]而加以功驗，賞罰明而賢愚別，此為治之要也。</p><p>  <strong>所出</strong>：《尚書 · 益稷》 — https://zh.wikisource.org/wiki/尚書/益稷</p></article></main></div></div>
