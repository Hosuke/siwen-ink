    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 管子能因</nav></header><main><article><h1>管子能因</h1><p>管子恐魯止而殺己，欲速至齊，乃唱而人和，因勢利導。</p><p>管子得於魯，魯束縛而檻之，使役人載而送之齊，其謳歌而引。管子恐魯之止而殺己也，欲速至齊，因謂役人曰：「我為汝唱，汝為我和。」其所唱適宜走，役人不倦，而取道甚速，管子可謂能因矣。役人得其所欲，己亦得其所欲。以此術也，是用萬乘之國，其霸猶少，桓公則難與往也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十五》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十五</p></article></main></div></div>
