    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 說以先民，民忘其勞</nav></header><main><article><h1>說以先民，民忘其勞</h1><p>君以悅道率民在前，則民樂於效力，忘其勤苦。</p><p>語出彖傳。夫以悅道先民者，非强民以勞苦，乃以身先之，使民樂從。民既悅之，則雖躬冒矢石，不以為勞。此聖王以身帥人之道，不以威力而以德悅也。</p><p><strong>所出</strong>：《周易 · 兌》 — https://zh.wikisource.org/wiki/周易/兌</p></article></main></div></div>
