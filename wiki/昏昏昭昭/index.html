    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 昏昏昭昭</nav></header><main><article><h1>昏昏昭昭</h1><p>修道者斂藏內照，與世人精明外逐之別。</p><p>昏昏者，斂藏內照、不以外逐之貌；昭昭者，精明顯察、機心外馳之謂。帛書本云「俗人昭昭我獨若昏」「鬻人蔡蔡我獨昏昏」，[[俗人昭昭我獨若昏]]之義而加詳。世人昭昭精明，馳逐不已；修道者獨保昏昏混沌之心，斂藏內照，不眩於外。[[我愚人之心也哉]]之義，此昏昏之德也。世人以昭昭為智，修道者以昏昏為歸，智與愚之辨，於此分矣。</p><p><strong>所出</strong>：《老子 (帛書本) · 章二十》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
