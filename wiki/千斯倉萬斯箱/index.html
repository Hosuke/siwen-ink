    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 千斯倉萬斯箱</nav></header><main><article><h1>千斯倉萬斯箱</h1><p>形容收成豐盛，需建大量倉箱以儲藏</p><p>「乃求千斯倉，乃求萬斯箱，黍稷稻粱。」《甫田》第四章言曾孫之稼堆積如茨如梁，詩人遂言：收成既盛至此，乃需建造千數之倉、萬數之箱，方足以容黍稷稻粱。此形容豐年之象，粮儲之充盈也。詩人借此以見豐歲之慶，而隱含有道之君治世之期盼。夫倉稟充實，乃國富之徵，詩人喜而頌之，以見其致太平之願望焉。</p><p><strong>所出</strong>：《詩經 · 甫田》 — https://zh.wikisource.org/wiki/詩經/甫田</p></article></main></div></div>
