    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蒙厚賜喻以威德</nav></header><main><article><h1>蒙厚賜喻以威德</h1><p>述唐蒙入夜郎、厚賜、曉以威德、約為置吏之事</p><p>蒙乃上書說上許之。乃拜蒙為郎中將，將千人，食重萬餘人，從巴蜀筰關入，遂見夜郎侯多同。蒙厚賜，喻以威德，約為置吏，使其子為令。夜郎旁小邑皆貪漢繒帛，以為漢道險，終不能有也，乃且聽蒙約。還報，乃以為犍為郡。發巴蜀卒治道，自僰道指牂柯江。</p><p>蜀人司馬相如亦言西夷邛、筰可置郡。使相如以郎中將往喻，皆如南夷，為置一都尉，十餘縣，屬蜀。</p><p><strong>所出</strong>：《史記 · 卷116》 — https://zh.wikisource.org/wiki/史記/卷116</p></article></main></div></div>
