    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 刺舉三河</nav></header><main><article><h1>刺舉三河</h1><p>郡守多為姦利，河南、河內、河東三河太守倚權勢而肆惡，必正之以警天下姦吏。</p><p>田仁數上書言：「天下郡太守多為姦利，三河尤甚，臣請先刺舉三河。三河太守皆內倚中貴人，與三公有親屬，無所畏憚，宜先正三河以警天下姦吏。」是時河南、河內太守皆御史大夫杜父兄子弟，河東太守石丞相子孫。田仁數上書言之。杜大夫及石氏使人謝，謂田少卿曰：「吾非敢有語言也，願少卿無相誣汙也。」仁已刺三河，三河太守皆下吏誅死。</p><p><strong>所出</strong>：《史記 · 卷104》 — https://zh.wikisource.org/wiki/史記/卷104</p></article></main></div></div>
