    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無名之樸夫亦將無欲</nav></header><main><article><h1>無名之樸夫亦將無欲</h1><p>歸於道樸，嗜欲自寡，天下清靜而自定。</p><p>無名之樸者，道之質也。物得此樸，嗜欲不作，躁競之心息矣。夫亦將無欲，不欲以靜，萬物各安其分，無所紛競。天下將自定，定者，安也，無復紛擾也。</p><p>故聖人治天下，不以智治，不以力勝，返百姓於無欲之樸，使自定焉。譬如水之歸下，物莫能逆也。</p><p><strong>所出</strong>：《老子河上公章句 · 為政》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
