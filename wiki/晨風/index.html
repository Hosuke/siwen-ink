    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 晨風</nav></header><main><article><h1>晨風</h1><p>賢臣被棄、憂心難釋之詩。</p><p>《晨風》，[[詩經]]之篇，屬[[秦風]]。</p><p>首章以鴥彼晨風起興，言鳥疾飛北林，不見君子；憂心欽欽，歎其忘我實多。次章、三章復疊其辭，以山有苞櫟、隰有六駮、山有苞棣、隰有樹檖起興，君子不見，憂心由欽欽而靡樂、由靡樂而如醉，反覆詠歎「如何如何，忘我實多」，以見其憂之深、棄之甚。</p><p>詩前有小序，稱此詩刺康公忘穆公之業而棄賢臣焉。</p><p>《晨風》三章，章六句。</p><p><strong>所出</strong>：《詩經 · 晨風》 — https://zh.wikisource.org/wiki/詩經/晨風</p></article></main></div></div>
