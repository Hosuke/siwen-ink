    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 狐埋之而狐搰之</nav></header><main><article><h1>狐埋之而狐搰之</h1><p>以狐埋狐搰喻吳王封殖越國而又欲殄滅之，終無成功。</p><p>吳王既許越成，諸稽郢辭別之際，又借諺語以諷之曰：「狐埋之而狐搰之，是以無成功。」言吳王既封植越國，以明聞於天下矣，而又欲刈亡之，是前後乖違，適足自弊。譬如狐也，埋物惟恐不深，既埋矣，又从而搰出之，終於無成。</p><p>郢繼言曰：「今天王既封植越國，以明聞於天下，而又刈亡之，是天王之無成勞也。雖四方之諸侯，則何實以事吳？」言吳之失信於諸侯如此，將何以取重於天下哉。</p><p><strong>所出</strong>：《國語 · 卷19》 — https://zh.wikisource.org/wiki/國語/卷19</p></article></main></div></div>
