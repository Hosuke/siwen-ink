    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 詠之萬遍昇三天</nav></header><main><article><h1>詠之萬遍昇三天</h1><p>持誦《黃庭經》萬遍，可昇三清之天。</p><p>《黃庭》之經，詠之萬遍，則可昇三清之天。蓋持誦之久，神炁凝純，脫胎換骨，與道合真，不待他術而自昇矣。</p><p><strong>所出</strong>：《黃庭內景經 · 上清章第一》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/上清章第一</p></article></main></div></div>
