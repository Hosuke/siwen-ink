    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 有母之尸饔</nav></header><main><article><h1>有母之尸饔</h1><p>孝子以服役不得奉養其母之歎。</p><p>「有母之尸饔」，《祈父》之卒章句也。言己身為王之爪士，迭被轉徙於遠方之恤地，不能歸養其母。母在堂而子服役，是孝道與王事相左也。</p><p>「尸」者，主也；「饔」者，飯食也。子當侍奉父母，居則溫衾之問，出則省問不絕。今也兵役羈身，有母而不得尸其饔，豈人情之所堪哉？</p><p>後世以「有母之尸饔」為服役與孝道相妨之典。</p><p><strong>所出</strong>：《詩經 · 祈父》 — https://zh.wikisource.org/wiki/詩經/祈父</p></article></main></div></div>
