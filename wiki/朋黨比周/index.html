    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 朋黨比周</nav></header><main><article><h1>朋黨比周</h1><p></p><p>朋黨比周以弊主，言曲以便私者，必信於重人矣。</p><p>  大臣挾愚汙之人，上與之欺主，下與之收利侵漁，朋黨比周，相與一口，惑主敗法，以亂士民，使國家危削，主上勞辱，此大罪也。</p><p>  <strong>所出</strong>：《韓非子 · 孤憤》 — https://zh.wikisource.org/wiki/韓非子/孤憤</p><hr><p>至如朋黨宗彊比周，設財役貧，豪暴侵淩孤弱，恣欲自快，游俠亦醜之。余悲世俗不察其意，而猥以朱家、郭解等令與暴豪之徒同類而共笑之也。</p><p><strong>所出</strong>：《史記 · 卷124》 — https://zh.wikisource.org/wiki/史記/卷124</p></article></main></div></div>
