    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 藏分之術</nav></header><main><article><h1>藏分之術</h1><p>大豐藏分，阨亦藏分，盈虛相救，以阨守豐。</p><p>桓公問守三權之數，管子對曰：「大豐則藏分，阨亦藏分。」豐年則粟多，當分之而藏之；歉歲則粟少，亦分之而藏之。隘則易益，一可以爲十，十可以爲百。以阨守豐，阨之准數一上十，豐之筴數十去九，則吾九爲餘。以此馭粟，盈虛相救，三權皆在君，此之謂國權。</p><p><strong>所出</strong>：《管子 · 第75篇山權數》 — https://zh.wikisource.org/wiki/管子/第75篇山權數</p></article></main></div></div>
