    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 去智而有明</nav></header><main><article><h1>去智而有明</h1><p>君去智巧而臣自明</p><p>有智而不以慮，使萬物知其處；有賢而不以行，觀臣下之所因；有勇而不以怒，使羣臣盡其武。是故去智而有明，去賢而有功，去勇而有强。</p><p><strong>所出</strong>：《韓非子 · 主道》 — https://zh.wikisource.org/wiki/韓非子/主道</p></article></main></div></div>
