    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 神弓</nav></header><main><article><h1>神弓</h1><p>能罪己者斯罪人，不報怨者斯報怨，神弓鬼矢不張而發不註而中。</p><p>譽人者人之譽，謗人者人謗之，是以君子能罪己，斯罪人也；不報怨，斯報怨也。所謂神弓鬼矢，不張而發，不註而中。天得之以假人，人得之以假天下。</p><p><strong>所出</strong>：《化書 · 卷四》 — https://zh.wikisource.org/wiki/化書/卷四</p></article></main></div></div>
