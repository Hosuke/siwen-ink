    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 灼灼其華</nav></header><main><article><h1>灼灼其華</h1><p>華之盛而明，灼然可見。</p><p>灼灼，魯詩云「華之盛」，明也，盛也。華即花字。</p><p>《桃夭》一章云「桃之夭夭，灼灼其華」，桃花盛開之時，其色灼然照眼。詩人以桃華之盛興嫁者之色美，亦興嫁娶之及時。華盛則子孫必旺，詩人以為室家之祥。</p><p>後世用「灼灼」狀光采之盛華之美，皆本此詩。</p><p><strong>所出</strong>：《詩經 · 桃夭》 — https://zh.wikisource.org/wiki/詩經/桃夭</p></article></main></div></div>
