    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 貫魚以宮人寵</nav></header><main><article><h1>貫魚以宮人寵</h1><p>六五率陰以承陽，如貫魚然，寵愛有序，無不利也。</p><p>《剝》六五：「貫魚，以宮人寵，无不利。」</p><p>魚，陰物也；貫魚者，貫而取之。宮人，侍御之賤者也。寵者，寵愛之也。六五居尊，以一身率五陰，如貫魚然，待之如宮人，寵愛有序，非褻瀆也。</p><p>六五以柔居尊，下乘五陰，上承上九之陽，柔而能承者也。象曰：「終无尤也。」言率陰事陽，以柔為寵，終無過尤也。</p><p>以是觀之，柔能承陽，陰能從陽，則无不利。剝之時，五陰非不可用，要在順陽以行耳。</p><p><strong>所出</strong>：《周易 · 剝》 — https://zh.wikisource.org/wiki/周易/剝</p></article></main></div></div>
