    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 童子佩韘</nav></header><main><article><h1>童子佩韘</h1><p>童子佩射韘以象武事，喻年幼而習武飾。</p><p>「芄蘭之葉，童子佩韘。」</p><p>韘，射時著於右手大指以鉤弦者，一名玦，一名抉。說文云：「韘，射決也，所以鉤弦。」古人男子十五學射，既冠則佩韘。詩人承首章「佩觿」而言「佩韘」，皆以童子行成人禮為喻。惠公年幼即位，大夫刺之，言其不過如童子之佩飾，而無大人之德義也。</p><p><strong>所出</strong>：《詩經 · 芄蘭》 — https://zh.wikisource.org/wiki/詩經/芄蘭</p></article></main></div></div>
