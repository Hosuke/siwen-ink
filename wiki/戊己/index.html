    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 戊己</nav></header><main><article><h1>戊己</h1><p>戊己為脾土，誠意立信之功，陰陽四象之主宰。</p><p>戊為陽土、元的，發而為信；己為陰土、意念，發而為欲。坎納戊，在道心為信；離納己，在人心為意。欲正其心，先誠其意，意誠則己土定而人心靜；欲行其道，先立其信，信立則戊土現而道心彰。若道心無信，人心不誠，雖有仁義禮智，各不相顧，何能結至靈至聖之神丹乎？戊己之功大矣。</p><p><strong>所出</strong>：《悟真直指 · 卷二》 — https://zh.wikisource.org/wiki/悟真直指/卷二</p></article></main></div></div>
