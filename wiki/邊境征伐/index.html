    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 邊境征伐之義</nav></header><main><article><h1>邊境征伐之義</h1><p>大一統之世，天子當席捲四海，征伐邊境，不可晏然自守。</p><p>太史公之論，以為匈奴絕和親而攻當路塞，閩越擅伐而東甌請降，二夷交侵，正當盛漢之隆，功臣受封侔於祖考矣。何者？自[[詩書]]稱三代「戎狄是膺，荊荼是徵」，齊桓越燕伐山戎，武靈王以區區趙服單于，秦繆用百里霸西戎，吳楚之君以諸侯役百越。況乃以中國一統，明天子在上，兼文武，席卷四海，內輯億萬之眾，豈以晏然不為邊境征伐哉！自是後，遂出師北討彊胡，南誅勁越，將卒以次封矣。</p><p><strong>所出</strong>：《史記 · 卷020》 — https://zh.wikisource.org/wiki/史記/卷020</p></article></main></div></div>
