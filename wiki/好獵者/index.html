    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 好獵者</nav></header><main><article><h1>好獵者</h1><p>獵者疾耕以致富，致富而後得良狗，治國者備賢亦然。</p><p>君有好獵者，曠日持久而不得獸，入則媿其家室，出則媿其知友州里。惟其所以不得之故，則狗惡也。欲得良狗，則家貧無以。於是還疾耕，疾耕則家富，家富則有以求良狗，狗良則數得獸矣，田獵之獲常過人矣。</p><p>非獨獵也，百事也盡然。霸王有不先耕而成霸王者，古今無有。此賢者不肖之所以殊也。</p><p>[[一年之計莫如樹穀]]，未有根基不立而枝葉繁茂者也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十四》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十四</p></article></main></div></div>
