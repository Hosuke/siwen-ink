    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 睢睢盱盱</nav></header><main><article><h1>睢睢盱盱</h1><p>傲然自視之貌，驕人而人不敢與居也。</p><p>老子戒[[陽子居]]曰：「而睢睢盱盱，而誰與居？」睢睢者，仰目視人之貌；盱盱者，張目倨視之容。言驕傲若此，則人莫之與居。必也大白若辱，盛德若不足，乃可以容於世。</p><p><strong>所出</strong>：《莊子 · 寓言》 — https://zh.wikisource.org/wiki/莊子/寓言</p></article></main></div></div>
