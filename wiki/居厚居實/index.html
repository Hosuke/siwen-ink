    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 居厚居實</nav></header><main><article><h1>居厚居實</h1><p>大丈夫當居敦厚充實，不居浮華薄泊。</p><p>（續大丈夫之義）</p><p>末章云：「大丈夫居亓厚而不居亓泊，居亓實而不居亓華，故去彼取此。」厚與實對泊與華言。道的本末，厚者，德之基也；泊者，禮之薄也。實者，德之充也；華者，智之末也。大丈夫抱道而不渝，敦本而不逐末，去華言之行，取厚實之功，斯聖人之學也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第一章 論德》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
