    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天子之夏禁</nav></header><main><article><h1>天子之夏禁</h1><p>夏禁尚靜，天子戒大興以防害。</p><p>以春日至始，數四十六日，春盡而夏始。天子服黃而靜處，朝諸侯卿大夫列士，循於百姓，發號出令曰：「毋聚大衆，毋行大火，毋斷大木，誅大臣，毋斬大山，毋戮大衍。滅三大而國有害也。」</p><p>言夏禁之要，在於戒躁。天子於夏始之際，行[[天子四時之令|夏令之禮]]，服色尚黃，主靜不擾。發令禁聚衆以防暴亂，禁大火以防火災，禁斷大木、誅大臣、斬大山、戮大衍，以避傷和害民之事。皆所以戒大興大動也。</p><p><strong>所出</strong>：《管子 · 第85篇輕重己》 — https://zh.wikisource.org/wiki/管子/第85篇輕重己</p></article></main></div></div>
