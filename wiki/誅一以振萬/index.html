    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 誅一以振萬，損少以成多</nav></header><main><article><h1>誅一以振萬，損少以成多</h1><p>刑罰之效在於威懾，不必多殺</p><p>誅一以振萬，損少以成多，方之櫛發，則所利者眾；比於割疽，則所全者大。是以灸刺慘痛而不可止者，以痊病也；刑法兇醜而不可罷者，以救弊也。</p><p><strong>所出</strong>：《抱朴子 · 卷14》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷14</p></article></main></div></div>
