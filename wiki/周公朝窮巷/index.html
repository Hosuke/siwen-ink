    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 周公朝窮巷</nav></header><main><article><h1>周公朝窮巷</h1><p>周公旦所朝於窮巷之中、甕牖之下者七十人。</p><p>周公旦，文王之子也，武王之弟也，成王之叔父也，所朝於窮巷之中、甕牖之下者七十人。文王造之而未遂，武王遂之而未成，周公旦抱少主而成之，故曰成王，不唯以身下士邪。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十五》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十五</p></article></main></div></div>
