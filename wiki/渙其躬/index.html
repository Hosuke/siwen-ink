    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 渙其躬</nav></header><main><article><h1>渙其躬</h1><p>渙散己私，忘身徇義无悔</p><p>「六三：渙其躬，无悔」。</p><p>六三陰居陽位，不中不正，然上承上九之陽，有應於上。躬者己身也，渙其躬者，渙己之私，不以身累義。志在於外者，取援於上也。以陰附陽，因應得宜，故无悔。</p><p><strong>所出</strong>：《周易 · 渙》 — https://zh.wikisource.org/wiki/周易/渙</p></article></main></div></div>
