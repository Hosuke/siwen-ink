    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 扶晨始暉生</nav></header><main><article><h1>扶晨始暉生</h1><p>扶晨光暉始生，煥洞圓光之象。</p><p>扶晨始暉生，紫雲映玄阿，煥洞圓光蔚日名，晃朗濯耀羅日名。上清大和王之祝語，狀扶晨之光暉始生、萬物受照之象。紫雲映於玄阿，煥洞之洞舒而圓光蔚茂，晃然而朗，濯然而耀。斯皆玄阿之化、扶晨之暉也。學者誦此，宜想見扶晨光暉始生之景，而默會乎天真下降之義矣。</p><p><strong>所出</strong>：《上清大洞真經 · 2章》 — https://zh.wikisource.org/wiki/上清大洞真經/2章</p></article></main></div></div>
