    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 見險而能止</nav></header><main><article><h1>見險而能止</h1><p>遇難而審幾，不輕犯險，斯之謂智。</p><p>蹇之象曰：「見險而能止，知矣哉。」夫險在前，人所易知乎？見之而不止，斯已下愚。見之而能止，不為冒險之行，斯之謂智也已。</p><p>《易》以坎為險，艮為止。蹋乎坎陷之中，見其險而不輕進者，非懦怯也，智也。是以聖人貴審幾觀變，不以迫險為勇也。</p><p><strong>所出</strong>：《周易 · 蹇》 — https://zh.wikisource.org/wiki/周易/蹇</p></article></main></div></div>
