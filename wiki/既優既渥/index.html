    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 既優既渥</nav></header><main><article><h1>既優既渥</h1><p>雨澤充洽，滋潤及物，歲以有年</p><p>益之以霢霂，既優既渥。</p><p>優，寬裕也；渥，沾濡也。雨之始降，纖微霢霂以潤之；及其既成，則優裕渥洽，無不遍及。田土既沾既足，百穀生之。此[[上天同雲]]之應，而歲功之所以成也。雨之於農，備則成，缺則害，故君子重之。</p><p><strong>所出</strong>：《詩經 · 信南山》 — https://zh.wikisource.org/wiki/詩經/信南山</p></article></main></div></div>
