    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 肇十有二州</nav></header><main><article><h1>肇十有二州</h1><p>禹別九州，定為十二，疆理天下。</p><p>肇始也。肇十有二州，封十有二山，濬川。疆理既定，兆民有所安居焉。</p><p><strong>所出</strong>：《尚書 · 堯典》 — https://zh.wikisource.org/wiki/尚書/堯典</p></article></main></div></div>
