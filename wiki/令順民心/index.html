    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 令順民心</nav></header><main><article><h1>令順民心</h1><p>法令之發布，當以民心之好惡為本。</p><p>政之所興，在順民心；政之所廢，在逆民心。民惡憂勞，我佚樂之；民惡貧賤，我富貴之；民惡危墜，我存安之；民惡滅絶，我生育之。</p><p><strong>所出</strong>：《管子 · 第01篇牧民》 — https://zh.wikisource.org/wiki/管子/第01篇牧民</p></article></main></div></div>
