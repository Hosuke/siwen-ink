    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 父兄百官皆不欲</nav></header><main><article><h1>父兄百官皆不欲</h1><p>世子欲行三年之喪，父兄百官皆不悅，以為非先祖之制</p><p>滕世子欲行三年之喪，父兄百官皆不欲，曰：「吾宗國魯先君莫之行，吾先君亦莫之行也；至於子之身而反之，不可。且《志》曰喪祭從先祖，吾有所受之也。」蓋習俗移人，雖知其是而不能從也。</p><p><strong>所出</strong>：《孟子 · 滕文公上》 — https://zh.wikisource.org/wiki/孟子/滕文公上</p></article></main></div></div>
