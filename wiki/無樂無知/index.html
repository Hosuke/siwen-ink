    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無樂無知</nav></header><main><article><h1>無樂無知</h1><p>絕去喜怒嗜欲，復歸本性之真樂真知</p><p>[[孔子]]既言樂天知命有憂之大，乃曰：「吾得之矣。夫樂而知者，非古人之所謂樂知也。無樂無知，是真樂真知，故無所不樂，無所不知，無所不憂，無所不爲。《詩》《書》、禮樂，何棄之有？革之何爲？」言至樂不在於有樂，至知不在於有知，唯無樂無知，乃得真樂真知，而無所遺也。</p><p><strong>所出</strong>：《列子 · 仲尼篇》 — https://zh.wikisource.org/wiki/列子/仲尼篇</p></article></main></div></div>
