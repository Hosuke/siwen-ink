    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 耀德不觀兵</nav></header><main><article><h1>耀德不觀兵</h1><p>先王治世以德為光、以兵為戒之旨</p><p>祭公謀父諫穆王之辭，其要曰：「不可。先王耀德不觀兵。夫兵戢而時動，動則威，觀則玩，玩則無震。」言先王之世，以道德昭明於上，而不輕示武力於外。兵以戢藏為貴，時動方顯威嚴；若時時觀示，則人將輕玩，而兵威失其震懾之效矣。又引《周頌》「載戢干戈，載櫜弓矢。我求懿德，肆于時夏，允王保之」，以為先王本懷在德而不在武也。</p><p><strong>所出</strong>：《國語 · 卷01》 — https://zh.wikisource.org/wiki/國語/卷01</p></article></main></div></div>
