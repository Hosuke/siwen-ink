    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 使民養生喪死無憾</nav></header><main><article><h1>使民養生喪死無憾</h1><p>養生送死無憾，乃王道之始</p><p>孟子以為，不違農時，穀不可勝食也；數罟不入洿池，魚鼈不可勝食也；斧斤以時入山林，材木不可勝用也。穀與魚鼈不可勝食，材木不可勝用，是使民養生喪死無憾也。養生喪死無憾，王道之始也。</p><p><strong>所出</strong>：《孟子 · 梁惠王上》 — https://zh.wikisource.org/wiki/孟子/梁惠王上</p></article></main></div></div>
