    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 狐假虎威</nav></header><main><article><h1>狐假虎威</h1><p>狐借虎威以令百獸，百獸畏狐而非畏虎，威不在己明矣。</p><p>虎求百獸而食之，得狐。狐曰：「子無食我也！天帝令我長百獸，今子食我是逆天帝命也。子以我言不信，吾為子先行，子隨我後，觀百獸之見我不走乎。」虎以為然，遂與之行。獸見之皆是，虎不知獸之畏己而走，以為畏狐也。</p><p><strong>所出</strong>：《尹文子 · 佚文》 — https://zh.wikisource.org/wiki/尹文子/佚文</p></article></main></div></div>
