    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 火牛陣</nav></header><main><article><h1>火牛陣</h1><p>田單以火牛破燕軍之奇策。</p><p>田單乃收城中得千餘牛，為絳繒衣，畫以五彩龍文，束兵刃於其角，而灌脂束葦於尾，燒其端。鑿城數十穴，夜縱牛，壯士五千人隨其後。牛尾熱，怒而奔燕軍，燕軍夜大驚。牛尾炬火光明炫燿，燕軍視之皆龍文，所觸盡死傷。五千人因銜枚擊之，而城中鼓譟從之，老弱皆擊銅器為聲，聲動天地。燕軍大駭，敗走。齊人遂夷殺其將騎劫。燕軍擾亂奔走，齊人追亡逐北，所過城邑皆畔燕而歸田單，兵日益多，乘勝，燕日敗亡，卒至河上，而齊七十餘城皆復為齊。</p><p><strong>所出</strong>：《史記 · 卷082》 — https://zh.wikisource.org/wiki/史記/卷082</p></article></main></div></div>
