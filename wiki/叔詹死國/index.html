    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 叔詹死國</nav></header><main><article><h1>叔詹死國</h1><p>晉文公欲得叔詹，詹自言死以赦鄭國</p><p>晉文公與秦穆公共圍鄭，討其助楚攻晉者。晉欲得叔詹為僇。鄭文公恐，不敢謂詹言。詹聞，言於鄭君曰：「臣謂君，君不聽臣，晉卒為患。然晉所以圍鄭，以詹，詹死而赦鄭國，詹之願也。」乃自殺。鄭人以詹尸與晉。</p><p><strong>所出</strong>：《史記 · 卷042》 — https://zh.wikisource.org/wiki/史記/卷042</p></article></main></div></div>
