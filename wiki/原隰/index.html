    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 原隰</nav></header><main><article><h1>原隰</h1><p>高平之地與下濕之區，泛言原野。</p><p>「于彼原隰」，見於《詩·小雅·皇皇者華》。</p><p>「原」者，高平之地；《爾雅》「廣平曰原」。「隰」者，下濕之區；《說文》「隰，阪下濕也」。詩言「皇皇者華，于彼原隰」，以華之生於原隰，比使者馳驅之地之廣遠，無往而不至。</p><p>後世稱田原之地，多以「原隰」連言，泛指原野而言。</p><p><strong>所出</strong>：《詩經 · 皇皇者華》 — https://zh.wikisource.org/wiki/詩經/皇皇者華</p></article></main></div></div>
