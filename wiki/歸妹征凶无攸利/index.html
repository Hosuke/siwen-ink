    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 歸妹：征凶，无攸利</nav></header><main><article><h1>歸妹：征凶，无攸利</h1><p>歸妹之卦，征進有凶，無有所利，以柔乘剛、位不當故。</p><p>歸妹之卦，辭曰「征凶，无攸利」。征凶者，位不當也；无攸利者，柔乘剛也。說以動，所歸妹也。動而無節，故有凶焉。</p><p><strong>所出</strong>：《周易 · 歸妹》 — https://zh.wikisource.org/wiki/周易/歸妹</p></article></main></div></div>
