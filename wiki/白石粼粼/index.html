    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 白石粼粼</nav></header><main><article><h1>白石粼粼</h1><p>激流映帶白石，水清石顯，以興君子相見之欣然。</p><p>「揚之水，白石粼粼」「白石皓皓」「白石鑿鑿」。唐風《揚之水》疊用三詞：粼粼者，水清石見之貌；皓皓者，石白而明；鑿鑿者，石峙立貌。皆狀激流映帶白石之景，以興君子相見於沃、於鵠，素衣朱襮，欣然相樂之情。</p><p><strong>所出</strong>：《詩經 · 揚之水》 — https://zh.wikisource.org/wiki/詩經/揚之水</p></article></main></div></div>
