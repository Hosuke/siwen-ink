    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 往蹇來碩</nav></header><main><article><h1>往蹇來碩</h1><p>往則無功，來則碩大之吉。</p><p>上六曰：「往蹇來碩，吉；利見大人。」</p><p>往則蹇而已，無益於事。來則得九五之大人，依而有成，碩大之功可致也。志在內者，應乎九五，親比之義也。利見大人者，上六柔而能順，附從九五之尊，同心濟蹇，吉之道也。</p><p><strong>所出</strong>：《周易 · 蹇》 — https://zh.wikisource.org/wiki/周易/蹇</p></article></main></div></div>
