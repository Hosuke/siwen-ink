    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 桀紂非有天下</nav></header><main><article><h1>桀紂非有天下</h1><p>天下不在桀紂，天下去之則亡</p><p>世俗之說者曰「桀紂有天下，湯武篡而奪之」，荀子以為不然。</p><p>以桀紂為常有天下之籍則然，親有天下之籍則不然，天下謂在桀紂則不然。聖王之子也，有天下之後也，勢籍之所在也，天下之宗室也，然而不材不中，內則百姓疾之，外則諸侯叛之，近者境內不一，遙者諸侯不聽，甚者諸侯侵削之、攻伐之。若是則雖未亡，吾謂之無天下矣。</p><p>故桀紂無天下，湯武不弒君，由此效之也。</p><p><strong>所出</strong>：《荀子 · 正論篇》 — https://zh.wikisource.org/wiki/荀子/正論篇</p></article></main></div></div>
