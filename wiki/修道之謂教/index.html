    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 修道之謂教</nav></header><main><article><h1>修道之謂教</h1><p>聖人品節乎道以為法於天下也。</p><p>修，品節之也。性道雖同，而氣稟或異，故不能無過不及之差，聖人因人物之所當行者而品節之，以為法於天下，則謂之教，若禮、樂、刑、政之屬是也。</p><p><strong>所出</strong>：《中庸 · 中庸章句》 — https://zh.wikisource.org/wiki/四書章句集註/中庸章句</p></article></main></div></div>
