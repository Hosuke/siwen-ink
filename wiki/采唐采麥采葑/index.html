    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 采唐采麥采葑</nav></header><main><article><h1>采唐采麥采葑</h1><p>以采-{zh-cn:（唐、麥、葑）}-起興，寓相思之情於草木之中。</p><p>《桑中》以「采唐」「采麥」「采葑」分起三章。-{zh-cn:（唐，菟絲；葑，蔓菁）}-。采者，躬自取之；所思者，非物乃人也。以采擷之事起興，而寄其思慕之私，所謂「興」者也。章首-{zh-cn:（異）}-物，章末-{zh-cn:（同）}-情，首尾呼應，宛轉相成焉。</p><p><strong>所出</strong>：《詩經 · 桑中》 — https://zh.wikisource.org/wiki/詩經/桑中</p></article></main></div></div>
