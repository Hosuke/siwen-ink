    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 修之天下亓德乃博</nav></header><main><article><h1>修之天下亓德乃博</h1><p>德修天下，博厚無疆，覆載萬物。</p><p>由邦而天下，達之四海。[[修之邦亓德乃豐|修之邦]]之德豐，推之天下，則德施彌遠，無物不被，其德乃博。此修身以達於天下之序也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第十七章 善觀》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
