    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 伯壎仲篪</nav></header><main><article><h1>伯壎仲篪</h1><p>兄弟異器而和，喻朋友同心或兄弟和睦。</p><p>伯氏吹壎，仲氏吹篪，各異其器，各發其聲，而和同諧美。此詩之所以美蘇公與暴公昔日之交也。壎土器，篪竹器，質異而聲諧，以喻同氣相求之友。惜乎其後暴公為卿士而譖蘇公，交情遂絕。故詩人於美中含刺，念昔之和，正傷今之叛。後世以「壎篪」喻兄弟之情，亦以喻朋友同心者，實本於此。</p><p><strong>所出</strong>：《詩經 · 何人斯》 — https://zh.wikisource.org/wiki/詩經/何人斯</p></article></main></div></div>
