    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 郭解入關</nav></header><main><article><h1>郭解入關</h1><p>郭解入關，關中賢豪爭交驩解，而楊季主竟被殺，解遂亡。</p><p>解入關，關中賢豪知與不知，聞其聲，爭交驩解。解為人短小，不飲酒，出未嘗有騎。已又殺楊季主。楊季主家上書，人又殺之闕下。上聞，乃下吏捕解。解亡，置其母家室夏陽，身至臨晉。</p><p><strong>所出</strong>：《史記 · 卷124》 — https://zh.wikisource.org/wiki/史記/卷124</p></article></main></div></div>
