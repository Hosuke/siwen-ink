    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 頻復厲无咎</nav></header><main><article><h1>頻復厲无咎</h1><p>頻數失復而有危，知戒自止，義可无咎。</p><p>六三：頻復，厲无咎。</p><p>象曰：頻復之厲，義无咎也。</p><p>頻，數也。數次失復而有危厲，然能知戒而止，則義理上亦得无咎。蓋屢失屢復，雖危而有悔，亦可免於大過。</p><p><strong>所出</strong>：《周易 · 復》 — https://zh.wikisource.org/wiki/周易/復</p></article></main></div></div>
