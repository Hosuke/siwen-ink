    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 辨正然否</nav></header><main><article><h1>辨正然否</h1><p>論之為體，以辨別是非對錯為宗旨。</p><p>原夫論之為體，所以辨正然否。窮于有數，追于無形，迹堅求通，鉤深取極；乃百慮之筌蹄，萬事之權衡也。[[義貴圓通]]，辭忌枝碎，必使心與理合，彌縫莫見其隙；辭共心密，敵人不知所乘。論之要義，在辨別是非善惡，以成一家之言。</p><p><strong>所出</strong>：《文心雕龍 · 論說》 — https://zh.wikisource.org/wiki/文心雕龍/論說</p></article></main></div></div>
