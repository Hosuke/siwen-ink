    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 其生不長其死必不終</nav></header><main><article><h1>其生不長其死必不終</h1><p>務為不久，蓋虛不長；其生不長者，其死必不終。</p><p>管仲論易牙、豎刁、公子開方，云：「務為不久，蓋虛不長。其生不長者，其死必不終。」言其人為人不誠，專以媚悅取寵，聲名虛假，無根柢之學。其所積者薄，所成者速，故其敗也亦速。桓公不能聽，是以[[桓公慚死]]。</p><p><strong>所出</strong>：《管子 · 第32篇小稱》 — https://zh.wikisource.org/wiki/管子/第32篇小稱</p></article></main></div></div>
