    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 汾王之甥</nav></header><main><article><h1>汾王之甥</h1><p>蹶父之女為汾王外甥，韓侯娶之，姻婭皆貴。</p><p>「韓侯取妻，汾王之甥，蹶父之子。」言所娶者貴為王室外甥女，兼蹶父素以武力聞，其相攸莫如韓樂，非偶然也。</p><p><strong>所出</strong>：《詩經 · 韓奕》 — https://zh.wikisource.org/wiki/詩經/韓奕</p></article></main></div></div>
