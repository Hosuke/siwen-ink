    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不犯天時不亂民功</nav></header><main><article><h1>不犯天時不亂民功</h1><p>循天時而不妄作，順民心而不擾事，此治世之紀也。</p><p>故不犯天時，不亂民功，秉時養人。先德後刑，順於天，微度人。</p><p><strong>所出</strong>：《管子 · 勢》 — https://zh.wikisource.org/wiki/管子/勢</p></article></main></div></div>
