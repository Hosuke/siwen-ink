    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 射見敵急，非在數十歩之內</nav></header><main><article><h1>射見敵急，非在數十歩之內</h1><p>廣射必度中而發，未有不中。</p><p>廣之射，見敵急，非在數十歩之內，度不中不發，發即應弦而倒。用此，其將兵數困辱，其射猛獸亦為所傷。</p><p><strong>所出</strong>：《史記 · 卷109》 — https://zh.wikisource.org/wiki/史記/卷109</p></article></main></div></div>
