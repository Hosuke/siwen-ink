    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 勢治</nav></header><main><article><h1>勢治</h1><p>堯舜生而在上位雖有桀紂不能亂者，勢治也；桀紂生而在上位雖有堯舜不能治者，勢亂也。</p><p>[[韓非]]辨[[自然之勢]]與人之所設之勢。勢治者，堯舜生而在上位，雖有十桀紂不能亂也；勢亂者，桀紂生而在上位，雖有十堯舜而亦不能治也。此自然之勢也，非人之所得設也。[[抱法處勢]]者，人之所得設，堯舜何事焉？故勢治則不可亂，勢亂則不可治，此一定之理也。</p><p><strong>所出</strong>：《韓非子 · 難勢》 — https://zh.wikisource.org/wiki/韓非子/難勢</p></article></main></div></div>
