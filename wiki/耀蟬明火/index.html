    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 耀蟬者務在明其火</nav></header><main><article><h1>耀蟬者務在明其火</h1><p>燭火不明，振樹無益；明主不耀，賢者不歸。</p><p>夫耀蟬者務在明其火、振其樹而已，火不明，雖振其樹，無益也。今人主有能明其德者，則天下歸之，若蟬之歸明火也。[[明主招賢]]、 [[天下歸之]]，此之喻也。</p><p><strong>所出</strong>：《荀子 · 致士篇》 — https://zh.wikisource.org/wiki/荀子/致士篇</p></article></main></div></div>
