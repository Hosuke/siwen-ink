    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 百姓足君孰與不足</nav></header><main><article><h1>百姓足君孰與不足</h1><p>百姓富則君自足，藏富於民之義。</p><p>哀公問於有若曰：「年饑，用不足，如之何？」有若對曰：「盍徹乎？」曰：「二，吾猶不足，如之何其徹也？」對曰：「百姓足，君孰與不足？百姓不足，君孰與足！」</p><p>藏富於民，民先足而君後足。徹法什一之稅，與夫二而去之，其義一也，皆本乎[[愛民]]之心。</p><p><strong>所出</strong>：《論語 · 顏淵第十二》 — https://zh.wikisource.org/wiki/論語/顏淵第十二</p></article></main></div></div>
