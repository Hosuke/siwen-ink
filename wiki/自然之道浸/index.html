    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天地之道浸</nav></header><main><article><h1>天地之道浸</h1><p>天地之道浸微，陰陽相推，聖人因而制之。</p><p>自然之道靜，故天地萬物生。天地之道浸，故陰陽勝。陰陽相推，而變化順矣。</p><p>天地之道浸，微而推勝之。聖人見之為自然，英哲見之為制，愚者見之為化。</p><p>知自然之道，萬物不能違，故利而行之。天地之至靜，律歷所不能契，鳥獸至淨，律歷所不能契，從而機之。</p><p><strong>所出</strong>：《陰符經》 — https://zh.wikisource.org/wiki/七注陰符經</p></article></main></div></div>
