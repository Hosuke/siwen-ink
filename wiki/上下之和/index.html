    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 上下之和</nav></header><main><article><h1>上下之和</h1><p>上下不和，令乃不行；君不君則臣不臣。</p><p>君不君則臣不臣，父不父則子不子。上失其位則下踰其節，上下不和，令乃不行。衣冠不正則賓者不肅，進退無儀則政令不行。且懷且威則君道備矣。夫上和而下應，下肅而上悅，此上下相得之道也。反是，則君自失其尊，臣自忘其義，政令皆壅而不通。邪氣襲內，正色乃衰；朝忘其事，夕失其功。是以明主之於上也，必正其衣冠、慎其威儀；之於下也，必和其心志、通其情意。懷德以親之，示威以畏之，二者備而君道成矣。</p><p><strong>所出</strong>：《管子 · 第02篇形勢》 — https://zh.wikisource.org/wiki/管子/第02篇形勢</p></article></main></div></div>
