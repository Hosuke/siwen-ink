    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 扶蘇</nav></header><main><article><h1>扶蘇</h1><p>山木之名，詩人以喻高山之美，與隰荷相對成文。</p><p>扶蘇，木名，生於山者。[[山有扶蘇]]首句云「山有扶蘇」，與「隰有荷華」相對：山之扶蘇，高而上也；隰之荷華，低而下也。一高一下，一山一隰，各得其宜，以興美之各有所在也。詩人以此起興，言彼山隰之間，草木尚得其地，而己之所見，則不得其人也。</p><p><strong>所出</strong>：《詩經 · 山有扶蘇》 — https://zh.wikisource.org/wiki/詩經/山有扶蘇</p></article></main></div></div>
