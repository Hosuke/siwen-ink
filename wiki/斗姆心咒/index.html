    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 斗姆心咒</nav></header><main><article><h1>斗姆心咒</h1><p>斗姆梵音心咒，藏經所載，𥳑切靈應。</p><p>斗姆心咒者，斗姆元尊所示梵音也。純陽帝君云：「斗姆梵音，有數十餘條，不能使人遍持。茲將藏經所載，𥳑切靈應者，與諸善士一宣揚之。」其咒以「曩謨囉怛曩，多囉夜野」起始，摠攝摩利支天威德之力，持之者感格斗姆，萬靈守衛。</p><p><strong>所出</strong>：《張三丰先生全集 · 卷7》 — https://zh.wikisource.org/wiki/張三丰先生全集/卷7</p></article></main></div></div>
