    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 一言得而天下服</nav></header><main><article><h1>一言得而天下服</h1><p>治心在中，正形攝德，則一言可以定天下。</p><p>文：定心在中，耳目聰明，正形攝德，天仁地義，則一言得而天下服，一言定而天下聽。一言者，心之發也；心以藏心，心之中又有心焉。彼心之心，音以先言，音然後形，形然後言，言然後使，使然後治。不治必亂，亂乃死。是故治天下者，先治其心；心治則天下治矣。</p><p><strong>所出</strong>：《管子 · 第49篇內業》 — https://zh.wikisource.org/wiki/管子/第49篇內業</p></article></main></div></div>
