    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 承天統傳地統</nav></header><main><article><h1>承天統傳地統</h1><p>男承天統，女承地統，斷絕地統則滅人類。</p><p>男者乃承天統，女者承地統，今乃斷絕地統，令使不得復相傳生，其後多出，絕滅無後世，其罪何重也！此皆當相生傳類，今乃絕地統，滅人類，故天久久，絕其世類也。</p><p><strong>所出</strong>：《太平經 · 03》 — https://zh.wikisource.org/wiki/太平經/03</p></article></main></div></div>
