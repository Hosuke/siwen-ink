    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 保民而王</nav></header><main><article><h1>保民而王</h1><p>安護民命，乃霸王之道</p><p>齊宣王問何以王天下，孟子對曰：「保民而王，莫之能禦也。」言君主治民以仁，使之各安其生，則天下歸往，孰能敵之？王天下之道無他，愛護其民而已矣。</p><p><strong>所出</strong>：《孟子 · 梁惠王上》 — https://zh.wikisource.org/wiki/孟子/梁惠王上</p></article></main></div></div>
