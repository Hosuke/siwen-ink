    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 申公巫臣</nav></header><main><article><h1>申公巫臣</h1><p></p><p>[[蔡聲子論楚材晉用]]述申公巫臣之事：恭王使巫臣聘於齊，以夏姬行，遂奔晉。晉人用之，寔通吳、晉，使其子狐庸為行人於吳，而教之射御，導之伐楚，於今為患。詳見[[蔡聲子論楚材晉用]]。</p><p>  <strong>所出</strong>：《國語 · 卷17》 — https://zh.wikisource.org/wiki/國語/卷17</p></article></main></div></div>
