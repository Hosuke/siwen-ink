    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 法已定矣不以善言害法</nav></header><main><article><h1>法已定矣不以善言害法</h1><p>法度既定，不以動聽之言動搖之。</p><p>法已定矣，不以善言害法。法令既布，便當信守，不可以悅耳之言改易之也。</p><p><strong>所出</strong>：《韓非子 · 飭令》 — https://zh.wikisource.org/wiki/韓非子/飭令</p></article></main></div></div>
