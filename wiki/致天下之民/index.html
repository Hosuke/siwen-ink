    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 致天下之民</nav></header><main><article><h1>致天下之民</h1><p>施惠於民使歸如流之謂</p><p>桓公問何以致天下之民，管子對曰：請使州有一掌，里有積五窌。民無以與正籍者予之長假，死而不葬者予之長度。飢者得食，寒者得衣，死者得葬，不𠸆者得振，則天下之歸我者若流水。此之謂致天下之民。</p><p>管子言致民在於實惠，而非空言。州掌、里積，以備乏絕；長假、長度，以紓正負；食之、衣之、葬之、振之，以濟其急。民無遠慮，必趨近利，故惠及所欲，則如水之就下矣。</p><p><strong>所出</strong>：《管子 · 第80篇輕重甲》 — https://zh.wikisource.org/wiki/管子/第80篇輕重甲</p></article></main></div></div>
