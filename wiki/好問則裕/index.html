    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 好問則裕</nav></header><main><article><h1>好問則裕</h1><p>好學而問則德日充，剛愎自用則德日損。</p><p>問者，德之門也。仲虺述湯之德，以「好問」與「自用」對舉：好問者，因人之心以成己之德，其道裕如也；自用者，專己之智而拒不納，其道隘矣。夫聖人非無所不知，乃無所不問。故曰「好問則裕，自用則小」。虛己下問，雖愚必明；執一自是，雖智亦闇。</p><p><strong>所出</strong>：《尚書 · 仲虺之誥》 — https://zh.wikisource.org/wiki/尚書/仲虺之誥</p></article></main></div></div>
