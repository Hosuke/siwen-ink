    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 受天之祜</nav></header><main><article><h1>受天之祜</h1><p>君子樂善，天錫福祉。</p><p>[[受天之祜]]出自《桑扈》。言君子樂從善道，則天降之福。</p><p>詩云：「君子樂胥，受天之祜。」箋曰：「胥，皆也。祜，福也。」言君子樂善，則天與之福也。</p><p><strong>所出</strong>：《詩經 · 桑扈》 — https://zh.wikisource.org/wiki/詩經/桑扈</p></article></main></div></div>
