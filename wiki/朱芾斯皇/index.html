    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 朱芾斯皇</nav></header><main><article><h1>朱芾斯皇</h1><p>朱蔽煌煌，諸侯之盛。</p><p>[[朱芾斯皇]]者，言朱色之芾，光皇美盛也。芾，蔽膝也，天子諸侯之服飾。朱為正色，斯皇，言其光美也。其泣喤喤，朱芾斯皇，言小兒啼聲之洪亮，日後必能著朱芾為諸侯，光耀門閭。</p><p><strong>所出</strong>：《詩經 · 斯干》 — https://zh.wikisource.org/wiki/詩經/斯干</p></article></main></div></div>
