    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 孟欽符融</nav></header><main><article><h1>孟欽符融</h1><p>孟欽有左慈、劉根之術，符堅召誅之，化旋風飛去。</p><p>孟欽，洛陽人。有左慈、劉根之術，百姓慕而趨之。符堅召詣長安，惡其惑眾，命符融誅之。俄而欽至，融留之，遂大燕官僚。酒酣，目左右收欽。欽化為旋風，飛出第外。頃之，有告在城東者，融遣騎追之，垂及，已遠。或有兵眾拒戰，或前有溪澗，騎不得過，遂不知所在。堅末，復見於青州。符朗尋之，入於海島。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 28》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/28</p></article></main></div></div>
