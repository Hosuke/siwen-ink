    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 始於憂勤，終於逸樂</nav></header><main><article><h1>始於憂勤，終於逸樂</h1><p>聖人之政，艱難而逸豫。</p><p>文武以天保以上治內，《采薇》以下治外；始於憂勤，終於逸樂，故美萬物盛多，可以告於神明矣。</p><p>言文王、武王之治天下也，其道有內外之序：內治者本諸己，以憂勤行之；外治者施諸人，以警戒行之。始也以憂勤感發人心，終也以逸樂與民休息。內外相成，本末兼備，故能萬物盛多，美可告神也。蓋凡事未有不由憂勤而得逸樂者，理之自然，治之道也。</p><p><strong>所出</strong>：《詩經 · 魚麗》 — https://zh.wikisource.org/wiki/詩經/魚麗</p></article></main></div></div>
