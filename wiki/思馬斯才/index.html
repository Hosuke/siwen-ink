    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 思馬斯才</nav></header><main><article><h1>思馬斯才</h1><p>詠馬之能。言所思之馬材力強健，可任馳驅也。</p><p>《詩經·駉》次章云「思無期，思馬斯才」。</p><p>才者，材也。馬之才，在於能任重致遠、驅馳疆場、挽車以行。此馬非徒健於形，抑且充於力，是以車伾伾而無倦。詩人之所以思者，思其才之無極也。良馬之才，有若賢才之德——充實光大，無有匱竭之時。</p><p><strong>所出</strong>：《詩經 · 駉》 — https://zh.wikisource.org/wiki/詩經/駉</p></article></main></div></div>
