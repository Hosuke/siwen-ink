    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 菀濁困滯，皆法度不亡</nav></header><main><article><h1>菀濁困滯，皆法度不亡</h1><p>天下有菀濁困滯之弊，正由法度不行。</p><p>[[管仲]]言[[為天下]]之道：「菀濁困滯，皆法度不亡，往行不來，而民游世矣。」蓋法度昭明，則菀者可振，濁者可清，困者達，滯者通。</p><p><strong>所出</strong>：《管子 · 第19篇中匡》 — https://zh.wikisource.org/wiki/管子/第19篇中匡</p></article></main></div></div>
