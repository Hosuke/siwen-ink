    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 輕辭天子難去今之縣令</nav></header><main><article><h1>輕辭天子難去今之縣令</h1><p>古之天子可輕辭，今之縣令難去除，非人情有異，實因厚薄之勢異也。</p><p>堯之王天下也，茅茨不翦，采椽不斵；糲粢之食，䔧藿之羹；冬日麑裘，夏日葛衣，雖監門之服養，不虧於此矣。禹之王天下也，身執耒臿以爲民先，股無胈，脛不生毛，雖臣虜之勞，不苦於此矣。以是言之，夫古之讓天子者，是去監門之養而離臣虜之勞也，古傳天下而不足多也。今之縣令，一日身死，子孫累世絜駕，故人重之。是以人之於讓也，輕辭古之天子，難去今之縣令者，薄厚之實異也。</p><p><strong>所出</strong>：《韓非子 · 五蠹》 — https://zh.wikisource.org/wiki/韓非子/五蠹</p></article></main></div></div>
