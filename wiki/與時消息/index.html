    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 與時消息</nav></header><main><article><h1>與時消息</h1><p>萬物盈虛消長，隨時而變，理固然也。</p><p>彖傳以為，天地盈虛，與時消息。盈者息，虛者消；往而屈者息，來而信者消。聖人觀此，知進退存亡之宜，不失其正也。</p><p><strong>所出</strong>：《周易 · 豐》 — https://zh.wikisource.org/wiki/周易/豐</p></article></main></div></div>
