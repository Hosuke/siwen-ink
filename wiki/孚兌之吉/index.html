    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 孚兌之吉</nav></header><main><article><h1>孚兌之吉</h1><p>以誠信相悅，悔恨消亡而致吉。</p><p>九二「孚兌，吉，悔亡」。象曰：「孚兌之吉，信志也。」陽居陰位，上比六三，有乖比之嫌；然以孚信相悅，動皆循理，故吉而悔亡。信志者，志在於信，不為私悅所搖也。</p><p><strong>所出</strong>：《周易 · 兌》 — https://zh.wikisource.org/wiki/周易/兌</p></article></main></div></div>
