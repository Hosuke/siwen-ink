    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無思不服</nav></header><main><article><h1>無思不服</h1><p>以德感人，人自悅服，不待威迫。</p><p>「無思不服」者，言人心悅服，不待勉強也。詩云「鎬京辟廱，自西自東。自南自北，無思不服」。武王營鎬京，設辟廱以興教化，文德武功昭被四海。四方之人，自西自東、自南自北，咸知周德之盛，無有思慮而不能服者。夫德之所被，遠邇一心；化之所及，頑廉懦立。此聖王之治，所以能致天下之歸往者也。</p><p><strong>所出</strong>：《詩經 · 文王有聲》 — https://zh.wikisource.org/wiki/詩經/文王有聲</p></article></main></div></div>
