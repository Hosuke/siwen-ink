    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 行城法</nav></header><main><article><h1>行城法</h1><p>為行城以禦攻之術。</p><p>行城者，加於本城之臨時禦攻工事也。</p><p>其法：高城二十尺，上加堞，廣十尺，左右出巨各二十尺，高廣如行城之法。為爵穴、煇穴，施荅其外。置機、衝、錢、城，廣與隊等。雜其閒以鎸、劍，持衝十人，執劍五人，皆以有力者。</p><p>守者又為行堞，堞高六尺而一等，施劍其面，以機發之，衝至則去之，不至則施之。爵穴三尺而一。</p><p>城希裾門而直桀，以為内外相應。</p><p><strong>所出</strong>：《墨子 · 備梯》 — https://zh.wikisource.org/wiki/墨子/備梯</p></article></main></div></div>
