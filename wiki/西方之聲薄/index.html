    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 西方之聲薄</nav></header><main><article><h1>西方之聲薄</h1><p>師開以宮商之音測室之夕，晏子以建國尊周釋西方之義。</p><p>景公新成柏寢之室，使師開鼓琴。師開左撫宮，右彈商，曰：「室夕。」公問何以知之，師開對曰：「東方之聲薄，西方之聲揚。」明日，晏子朝，公問先君太公以營丘之封立城，曷為夕。晏子對曰：「古之立國者，南望南斗，北戴樞星，彼安有朝夕哉？然而以今之夕者，周之建國，國之西方，以尊周也。」公蹴然曰：「古之臣乎！」</p><p>西之為言，夕也，非偏西之夕，乃尊周之夕也。晏子援古義以釋時制，可謂通達。</p><p><strong>所出</strong>：《晏子春秋 · 卷六》 — https://zh.wikisource.org/wiki/晏子春秋/卷六</p></article></main></div></div>
