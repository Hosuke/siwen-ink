    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 膠東王</nav></header><main><article><h1>膠東王</h1><p>孝景四年，皇子為膠東王；七年，立為太子；十六年即位，是為孝武皇帝。</p><p>孝武皇帝者，孝景中子也。母曰王太后。孝景四年，以皇子為膠東王。孝景七年，栗太子廢為臨江王，以膠東王為太子。孝景十六年崩，太子即位，為孝武皇帝。</p><p><strong>所出</strong>：《史記 · 卷012》 — https://zh.wikisource.org/wiki/史記/卷012</p><hr><p>膠東王雄渠，齊悼惠王子也，以白石侯文帝十六年為膠東王。十一年，與吳楚反，漢擊破，殺雄渠，地入于漢，為膠東郡。</p><p>  <strong>所出</strong>：《史記 · 卷052》 — https://zh.wikisource.org/wiki/史記/卷052</p></article></main></div></div>
