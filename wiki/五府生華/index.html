    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五府生華</nav></header><main><article><h1>五府生華</h1><p>五臟真炁化生光華</p><p>五府生華，大洞祝詞所言五臟真炁敷榮之象也。</p><p>高上玉清王祝云「五府生華，六液龍源」，言存思天真，五臟之府各生光華，六腑之液如龍之淵源源不竭，是津液充溢之象。</p><p><strong>所出</strong>：《上清大洞真經 · 22章》 — https://zh.wikisource.org/wiki/上清大洞真經/22章</p></article></main></div></div>
