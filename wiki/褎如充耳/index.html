    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 褎如充耳</nav></header><main><article><h1>褎如充耳</h1><p>言衞臣聞責而笑，充耳不聞</p><p>「褎如充耳」者，《詩·旄丘》末章之辭也。</p><p>《旄丘》四章：「瑣兮尾兮，流離之子，叔兮伯兮，褎如充耳。」毛傳：「褎，笑貌也。充耳，塞耳也。言衞人笑，掛耳於瑣事。」鄭玄箋：「不聽百姓之言，是為褎如充耳。」</p><p>「褎如」，笑貌也。「充耳」，塞耳不聽也。言黎人流離困苦，而衞之大夫聞其責讓之言，但知笑而不聽，如以物充塞其耳然。此刺衞臣之頑固無禮，袖手旁觀而無惻隱之心也。</p><p>後世以「充耳不聞」言不聽人言。</p><p><strong>所出</strong>：《詩經 · 旄丘》 — https://zh.wikisource.org/wiki/詩經/旄丘</p></article></main></div></div>
