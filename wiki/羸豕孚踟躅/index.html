    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 羸豕孚踟躅</nav></header><main><article><h1>羸豕孚踟躅</h1><p>初六爻辭，羸弱之豕躁動不安，喻小人浸長不可縱也。</p><p>「羸豕孚踟躅。」</p><p>羸豕者，瘦弱之豕也。孚者，浮躁也。踟躅，不安之狀。陰柔小人，譬如羸豕，志在躁動，其心浮而不安也。聖人戒觀象者，察此微意，防之於早，不可使其浸長也。</p><p><strong>所出</strong>：《周易 · 姤》 — https://zh.wikisource.org/wiki/周易/姤</p></article></main></div></div>
