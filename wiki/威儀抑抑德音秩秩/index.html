    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 威儀抑抑，德音秩秩</nav></header><main><article><h1>威儀抑抑，德音秩秩</h1><p>威儀美盛則德音自然明正，有位之臣皆稟其化。</p><p>「威儀抑抑，德音秩秩」，語出《假樂》，言威儀之美與德教之明也。</p><p>抑抑，密也，美也。秩秩，有序也。威儀抑抑，則儀容莊美；德音秩秩，則辭令明暢。是以在上者威儀既美，則在下之臣無怨無惡，率由羣匹，歸心於上，受福無疆，而四方以之為綱。此以一人之德，化天下之心者也。</p><p><strong>所出</strong>：《詩經 · 假樂》 — https://zh.wikisource.org/wiki/詩經/假樂</p></article></main></div></div>
