    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 行賢而去自賢之行</nav></header><main><article><h1>行賢而去自賢之行</h1><p>行善而不自矜其善，則天下無所不容。</p><p>陽子聞逆旅小子之言，告弟子曰：「行賢而去自賢之行，安往而不愛哉！」賢德之行，本乎自然；若心存矜伐，則德亦失其純。唯去自賢之念，行善而不以善自居，斯為真賢矣。</p><p><strong>所出</strong>：《莊子 · 山木》 — https://zh.wikisource.org/wiki/莊子/山木</p></article></main></div></div>
