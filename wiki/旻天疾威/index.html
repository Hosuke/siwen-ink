    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 旻天疾威</nav></header><main><article><h1>旻天疾威</h1><p>天降威虐，饑饉並臻，萬民流亡，邊圉荒蕪。</p><p>[[旻天疾威]]，天篤降喪。瘨我饑饉，民卒流亡。我居圉卒荒。</p><p>天之威虐，疾速而降，以饑饉死喪加於天下。饑饉並臻，民不得食，流徙於外；邊陲之地，亦無人居，荒廢而莫之收也。</p><p>詩言此者，刺幽王之世，天譴沓至，而王不知戒也。居上位者，其威宜加於有德，不宜施於暴虐。天威無親，災祥之應，實人事有以召之。</p><p>夫天象之變，與人間之政相應。威虐降而民無所措，此詩所以譏王之失道，而念賢者之不可復見也。</p><p><strong>所出</strong>：《詩經 · 召旻》 — https://zh.wikisource.org/wiki/詩經/召旻</p></article></main></div></div>
