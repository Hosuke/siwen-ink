    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 心若不生法自滅</nav></header><main><article><h1>心若不生法自滅</h1><p>心不生則法皆空，定慧圓明，內外皎然。</p><p>[[心若不生]]，萬法皆空。心若不生[[法]]自滅，此[[采珠歌]]之要旨也。心生則[[真空之性]]暗，不生則明；心滅則法身現，不滅則迷。[[真心常住]]，量同天地，包羅萬有，不思善、不思惡、不造罪、不求福，功德罪過皆所不計。[[性珠常朗]]，定慧圓明，內外皎然，泡體空花，何足戀之？[[真空之性]]既朗，浮雲之障自無，[[真空之性的]]朗明，無絲毫障礙。</p><p><strong>所出</strong>：《悟真直指 · 卷四》 — https://zh.wikisource.org/wiki/悟真直指/卷四</p></article></main></div></div>
