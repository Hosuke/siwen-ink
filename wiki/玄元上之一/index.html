    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 玄元上之一</nav></header><main><article><h1>玄元上之一</h1><p>魂魄雙修乃成真仙</p><p>魂魄為人之根本，修真者當煉之使合。玄元上一者，魂與魄也，相煉以歸於道。</p><p>魂魄者，一之兩面也。魂主神而魄主形，二者相須而後能成真人。修煉之要在於使魂魄合而不散、合而不離，乃可返於本真。</p><p>修煉之法，在於避死氣、遠諸穢賤。死氣者，死敗之氣也；諸穢賤者，污濁不潔之物也。此二者皆能賊害魂魄，故修真者必絕之。</p><p>六神合集於虛中者，魂魄既煉，則六神自會於虛無之中。六神者，魂與魄合而言之也。</p><p><strong>所出</strong>：：《黃庭內景經 · 玄元章第二十七》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/玄元章第二十七</p></article></main></div></div>
