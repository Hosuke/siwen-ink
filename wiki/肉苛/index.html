    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 肉苛</nav></header><main><article><h1>肉苛</h1><p>榮衛俱虛，肌肉不仁且不用。</p><p>人之肉苛者，雖近衣絮，猶尚苛也。榮氣虛則不仁，衛氣虛則不用，榮衛俱虛，則不仁且不用，肉如故也，人身與志不相有，曰死。</p><p><strong>所出</strong>：《黃帝內經 · 素問第九卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第九卷</p></article></main></div></div>
