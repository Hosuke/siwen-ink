    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 封禪之刻</nav></header><main><article><h1>封禪之刻</h1><p>秦始皇東行郡縣，上嶧山、泰山，立石封禪，刻石頌德。</p><p>二十八年，始皇東行郡縣，上鄒嶧山。立石，與魯諸儒生議，刻石頌秦德，議封禪望祭山川之事。乃遂上泰山，立石，封，祠祀。下，風雨暴至，休於樹下，因封其樹為五大夫。禪梁父。刻所立石，其辭曰：</p><p>皇帝臨位，作制明法，臣下修飭。二十有六年，初并天下，罔不賓服。親巡遠方黎民，登茲泰山，周覽東極。從臣思跡，本原事業，祗誦功德。治道運行，諸產得宜，皆有法式。大義休明，垂于後世，順承勿革。</p><p><strong>所出</strong>：《史記 · 卷006》 — https://zh.wikisource.org/wiki/史記/卷006</p></article></main></div></div>
