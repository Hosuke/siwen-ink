    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 比顯而興隱</nav></header><main><article><h1>比顯而興隱</h1><p>比之為義顯白，興之為義隱微，學者觀注而後明也。</p><p>《關雎》有別，-{后}-妃方德；《尸鳩》貞一，夫人象義。義取其貞，無從於夷禽；德貴其別，不嫌於鷙鳥。興之託諭，婉而成章，稱名也小，取類也大。然興之義明而未融，故發注而後見也。</p><p>蓋比以斥言為直，興以環譬為婉。直則易曉，婉則耐尋。此比顯而興隱之分，詩人之志所以有二也。</p><p><strong>所出</strong>：《文心雕龍 · 比興》 — https://zh.wikisource.org/wiki/文心雕龍/比興</p></article></main></div></div>
