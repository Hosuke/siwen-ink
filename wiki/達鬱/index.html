    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 達鬱</nav></header><main><article><h1>達鬱</h1><p>國亦有鬱，主德不通，民欲不達，此國之鬱也。</p><p>凡人三百六十節，九竅五藏六府。肌膚欲其比也，血脈欲其通也，筋骨欲其固也，心志欲其和也，精氣欲其行也，若此則病無所居而惡無由生矣。病之留、惡之生也，精氣鬱也。故水鬱則為污，樹鬱則為蠹，草鬱則為蕢。國亦有鬱。主德不通，民欲不達，此國之鬱也。國鬱處久，則百惡並起，而萬災叢至矣。上下之相忍也，由此出矣。故聖王之貴豪士與忠臣也，為其敢直言而決鬱塞也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十</p></article></main></div></div>
