    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 自矜者不長</nav></header><main><article><h1>自矜者不長</h1><p>自矜者不能長久，以其在道為餘食贅行也。</p><p>（24）</p><p>[[自矜不長]]之異文也。帛書作「自矜者不長」，文義則一。</p><p>[[亓在道也]]，自矜者無以長。[[餘食赘行]]，[[物或惡之]]，[[有欲者弗居]]焉。</p><p>矜者，自貴自大之謂也。矜則道之赘，行之餘，物之所惡，而人不可居之。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第六十六章 弗居》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
