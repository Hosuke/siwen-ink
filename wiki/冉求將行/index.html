    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 冉求將行</nav></header><main><article><h1>冉求將行</h1><p>冉求被召，孔子言魯人必大用之。</p><p>後數日，桓子卒，康子代立。已葬，欲召仲尼。公之魚曰：「昔吾先君用之不終，終為諸侯笑。今又用之，不能終，是再為諸侯笑。」康子曰：「則誰召而可？」曰：「必召冉求。」於是使使召冉求。冉求將行，孔子曰：「魯人召求，非小用之，將大用之也。」此孔子論冉求之將被重用也。</p><p><strong>所出</strong>：《史記 · 卷047》 — https://zh.wikisource.org/wiki/史記/卷047</p></article></main></div></div>
