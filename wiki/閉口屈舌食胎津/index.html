    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 閉口屈舌食胎津</nav></header><main><article><h1>閉口屈舌食胎津</h1><p>閉塞嗜欲食玄元之精</p><p>閉口者，塞其嗜欲之門也。屈舌者，不以言傷氣也。食胎津者，吞食先天之精華也。</p><p>修真者絕諸嗜欲，口不言非禮之言，舌不伸是非之地，然後可以食太和之氣以自養。</p><p><strong>所出</strong>：《黃庭內景經 · 玄元章第二十七》 — https://zh.wikisource/wiki/太上黃庭內景玉經/玄元章第二十七</p></article></main></div></div>
