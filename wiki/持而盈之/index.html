    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 持而盈之</nav></header><main><article><h1>持而盈之</h1><p>物盈則溢，持滿則傾；知止不殆，莫若已而勿盈。</p><p>持而盈之，不如其已。</p><p>盈者，滿也。持而不已，必至於溢；滿而不止，勢必至傾。《道德經》曰：「保此道者不欲盈。」又曰：「，物或損之而益，或益之而損。」盈則招損，持滿不如止退。老氏之意，以持盈為戒。物方盈，則已之；事方成，則退之。是故知止之謂知足，已之之謂不盈。聖人虛其心，實其腹，絕巧棄利，不積不藏，是以無盈之可持而無傾之可虞也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 九章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
