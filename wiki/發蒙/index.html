    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 發蒙</nav></header><main><article><h1>發蒙</h1><p>開發蒙昧，俾知所趨。</p><p>初六：發蒙。</p><p>發者，啟也。蒙者，幼稚蒙昧之謂。發蒙者，開發其蒙昧之心，俾知所趨向也。夫童蒙之時，其心未開，必有待於聖人之發之，而後可以入道也。</p><p><strong>所出</strong>：《周易 · 蒙》 — https://zh.wikisource.org/wiki/周易/蒙</p></article></main></div></div>
