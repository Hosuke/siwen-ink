    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鴻飛</nav></header><main><article><h1>鴻飛</h1><p>鴻雁高翔，以況君子之去。</p><p>鴻者，雁之大者。[[鴻飛遵渚]]，則循水中小洲而行；[[鴻飛遵陸]]，則循高平之地而行。渚者水淺可依，陸者道廣而去遠。詩人以此二者況君子之去，留之不得，歸而不返。《九罭》之詩，美[[袞衣繡裳]]之君子，欲[[信處信宿]]以留之，而鴻飛已遠，[[心悲]]之情遂起。</p><p><strong>所出</strong>：《詩經 · 九罭》 — https://zh.wikisource.org/wiki/詩經/九罭</p></article></main></div></div>
