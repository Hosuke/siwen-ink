    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無土不王</nav></header><main><article><h1>無土不王</h1><p>世俗以無土不能王，太史公以為賢者不必有土。</p><p>太史公曰：「故憤發其所為天下雄，安在無土不王。」世俗相傳以為「無土不王」，意謂無尺寸之地則不能為王。然漢高起於亭長，五年而踐帝祚，是賢者固不以無土而不王也。此說破世俗之見，而歸功於天意與人事。</p><p><strong>所出</strong>：《史記 · 卷016》 — https://zh.wikisource.org/wiki/史記/卷016</p></article></main></div></div>
