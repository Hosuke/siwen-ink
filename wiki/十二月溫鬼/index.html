    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 十二月溫鬼</nav></header><main><article><h1>十二月溫鬼</h1><p>述十二月溫鬼之名，各隨其月，放逸天下，傷害群生。</p><p>正月溫鬼名惟，二月溫鬼名腫，三月溫鬼名劉，四月溫鬼名存，五月溫鬼名壘，六月溫鬼名●，七月溫鬼名半，八月溫鬼名懷，九月溫鬼名農，十月溫鬼名卑，十一月溫鬼名贏，十二月溫鬼名堅。</p><p>右十二月溫鬼，各隨其月，放逸天下，傷害群生。</p><p><strong>所出</strong>：《女青鬼律 · 卷6》 — https://zh.wikisource.org/wiki/女青鬼律/卷6</p></article></main></div></div>
