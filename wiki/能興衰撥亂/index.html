    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 能興衰撥亂</nav></header><main><article><h1>能興衰撥亂</h1><p>尹吉甫美宣王之辭，謂能興起衰微、扭轉危亂。</p><p>《江漢》首章前有序云：「尹吉甫美宣王也。能興衰撥亂，命召公平淮夷。」言宣王之世，周室中興，能興起衰微之運，扭轉禍亂之局，遂命大將召伯虎帥師征討淮夷，而致四方平定、王國安定也。此與[[周公東征]]之功相類，皆[[撥亂反正]]之事，而宣王之賢於是見焉。[[文武吉甫]]之詩，與此篇互相發明。</p><p><strong>所出</strong>：《詩經 · 江漢》 — https://zh.wikisource.org/wiki/詩經/江漢</p></article></main></div></div>
