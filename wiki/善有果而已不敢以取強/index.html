    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 善有果而已不敢以取強</nav></header><main><article><h1>善有果而已不敢以取強</h1><p>善於濟難者，果於救急而已，不敢以取強於人。</p><p>善有果而已，不敢以取強。果，救急也。善濟急難，但欲安濟而已，不敢以取強於天下也。</p><p><strong>所出</strong>：《老子河上公章句 · 儉武》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
