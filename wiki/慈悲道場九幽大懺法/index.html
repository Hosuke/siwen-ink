    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 慈悲道場九幽大懺法</nav></header><main><article><h1>慈悲道場九幽大懺法</h1><p>仙公撮上清靈寶撮要所成之懺法也。</p><p>仙公念群生得遂人身，恣情縱慾，不修正道，罪愆既積，業報難酬。惟靈寶三乘秘典，可以開導眾生，懺悔罪尤，拔濟苦爽，俾悟正真。</p><p>遂總括上清、靈寶諸部真經，撮其樞要，集為《慈悲道場九幽大懺法》一部十卷，流傳天下善信男女。</p><p>或有宅舍生災，眷親亡歿，廣建道場，嚴陳真像，禮誦九幽大懺，當得見存獲慶，過去超生，宿業新愆，盡皆消滅。寒庭罷對，苦爽沾恩。此懺法流傳四海，惠利無邊。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 23》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/23</p></article></main></div></div>
