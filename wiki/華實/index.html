    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 華實</nav></header><main><article><h1>華實</h1><p>辭藻與本質，文人當兼重。</p><p>《文心雕龍·程器》云：「近代辭人，務華棄實。」言魏晉以下，文士競趨辭藻之華，而遺根本之實也。劉勰援引《周書》梓材之論，謂士之於世，當如匠之於木，既有器用之美，復兼文采之工。</p><p>又云：「彼揚、馬之徒，有文無質，所以終乎下位也。」言揚雄、司馬相如之倫，文辭雖美，質性不立，終究位不稱才。是故華實相濟，乃得為完人。</p><p><strong>所出</strong>：《文心雕龍 · 程器》 — https://zh.wikisource.org/wiki/文心雕龍/程器</p></article></main></div></div>
