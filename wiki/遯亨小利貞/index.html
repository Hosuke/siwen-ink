    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 遯亨小利貞</nav></header><main><article><h1>遯亨小利貞</h1><p>遯而亨，審時知退，不厲乃吉，小人浸長則宜靜。</p><p>遯亨，遯而亨也。剛當位而應，與時行也。小利貞，浸而長也。遯之時義大矣哉。</p><p>遯者，見幾而退，不失其正也。剛當位而應，與時偕行，知止而不失其亨也。小人浸長，君子道消，小利貞者，靜以待時而已。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷04》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷04</p></article></main></div></div>
