    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 作壹</nav></header><main><article><h1>作壹</h1><p>專心農戰，歸於一途</p><p>國作壹一歲者，十歲彊；作壹十歲者，百歲彊；作壹百歲者，千歲彊，千歲彊者王。威以一取十，以聲取實，故能為威者王。壹者，專也，合也。令民皆從壹空而得官爵，則民不偷淫，多力而國彊。民之於農，專而不散，則地闢國富，王道可成。</p><p><strong>所出</strong>：《商君書 · 卷一》 — https://zh.wikisource.org/wiki/商君書/卷一</p></article></main></div></div>
