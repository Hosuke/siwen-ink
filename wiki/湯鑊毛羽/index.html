    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 湯鑊毛羽</nav></header><main><article><h1>湯鑊毛羽</h1><p>嬰兒慕母，顛倒就湯鑊，以喻神炁被制而失其初。</p><p>白虎導唱前兮，蒼液和于後。朱雀翱翔戲兮，飛揚色五彩；遭遇羅網施兮，壓之不得舉；嗷嗷聲甚悲兮，嬰兒之慕母；顛倒就湯鑊兮，摧折傷毛羽。</p><p>朱雀被羅網而不得舉，嬰兒就湯鑊而傷毛羽，皆喻神炁失所依附，不得自主，而有傾折之患。學者觀此，當知所戒慎也。</p><p><strong>所出</strong>：《周易參同契 · 32章》 — https://zh.wikisource.org/wiki/周易參同契/32章</p></article></main></div></div>
