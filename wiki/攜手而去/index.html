    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 攜手而去</nav></header><main><article><h1>攜手而去</h1><p>暴政之下，志同道合者相攜出奔，共赴他邦。</p><p>「惠而好我，攜手同行」，又曰「同歸」「同車」，皆言暴虐之世，志士非獨善其身，乃與同志之人相攜而遠去也。同行、同歸、同車，次第言之：由徒行而至於歸宿，由孤身而至於同舟。患難相扶持，道義相與謀，此仁人之所以不得已而後去也。</p><p><strong>所出</strong>：《詩經 · 北風》 — https://zh.wikisource.org/wiki/詩經/北風</p></article></main></div></div>
