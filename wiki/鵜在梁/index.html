    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鵜在梁</nav></header><main><article><h1>鵜在梁</h1><p>以鵜止梁而不濡水，喻小人在位尸餐而不稱其服。</p><p>鵜，水鳥之大者，善捕魚而棲於魚梁。梁者，水中堰也。</p><p>《候人》二章云「維鵜在梁，不濡其翼」，三章云「維鵜在梁，不濡其咮」。鵜本在水而濡者，乃今在梁而得不濡，以興小人不當得祿而反得之也。翼所以飛，咮所以啄，皆其本能；不濡者，非其功，乃幸也。以喻在位者之无功而受祿，與候人、何戈與祋之勤苦相形，刺意明矣。</p><p><strong>所出</strong>：《詩經 · 候人》 — https://zh.wikisource.org/wiki/詩經/候人</p></article></main></div></div>
