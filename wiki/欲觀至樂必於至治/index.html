    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 欲觀至樂必於至治</nav></header><main><article><h1>欲觀至樂必於至治</h1><p>至治之世，其樂必至；觀樂之至否，可驗世之治亂。</p><p>欲觀至樂，必於至治。其治厚者其樂治厚，其治薄者其樂治薄，亂世則慢以樂矣。今室閉戶牖，動天地，一室也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷六》 — https://zh.wikisource.org/wiki/呂氏春秋/卷六</p></article></main></div></div>
