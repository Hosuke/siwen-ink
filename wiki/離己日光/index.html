    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 離己日光</nav></header><main><article><h1>離己日光</h1><p>離配己，日之精華，光耀無疆。</p><p>離己日光。離火之卦，配天干之己；己屬土，而離象日，故離己合德，日光煥耀。</p><p>離象南方之火，配十天干之己；己土得火而生光，日光之精華在焉。</p><p><strong>所出</strong>：《周易參同契 · 02章》 — https://zh.wikisource.org/wiki/周易參同契/02章</p></article></main></div></div>
