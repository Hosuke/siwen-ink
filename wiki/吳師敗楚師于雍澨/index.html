    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 吳師敗楚師于雍澨</nav></header><main><article><h1>吳師敗楚師于雍澨</h1><p>吳師追敗楚師，數戰至郢。</p><p>吳從楚師，及清發，將擊之。夫概王曰：「困獸猶鬥，況人乎。若知不免，而致死，必敗我。若使先濟者知免，後者慕之，蔑有鬥心矣。半濟而後可擊也。」從之，又敗之。楚人為食，吳人及之，奔食而從之。敗諸雍澨，五戰及郢。己卯，楚子取其妹季芊，畀我，以出。涉睢。鍾建負季芊以從。由于徐蘇而從。</p><p><strong>所出</strong>：《春秋左氏傳 · 定公》 — https://zh.wikisource.org/wiki/春秋左氏傳/定公</p></article></main></div></div>
