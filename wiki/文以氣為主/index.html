    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 文以氣為主</nav></header><main><article><h1>文以氣為主</h1><p>文章以氣為主，氣之清濁有體，不可力強而致。</p><p>魏文稱文以氣為主，氣之清濁有體，不可力強而致。其論孔融，則-{云}-體氣高妙；論徐幹，則-{云}-時有齊氣；論劉楨，則-{云}-有逸氣。公幹亦-{云}-，孔氏卓卓，信含異氣，筆墨之性，殆不可勝，並重氣之旨也。夫翬翟備色而翾翥百步，肌豐而力沈；鷹隼乏采而翰飛戾天，骨勁而氣猛；文章才力，有似于此。氣者，文之情志所寄，清則峻爽，濁則沉滯，不可強求，唯養而後得。</p><p><strong>所出</strong>：《文心雕龍 · 風骨》 — https://zh.wikisource.org/wiki/文心雕龍/風骨</p></article></main></div></div>
