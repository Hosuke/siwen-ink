    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 嘉遯貞吉</nav></header><main><article><h1>嘉遯貞吉</h1><p>善退以正其志，則得其吉</p><p>《象》曰：「嘉遯貞吉，以正志也。」</p><p>九五陽剛中正，下應六二之柔，內外交暢，乃嘉美之遯也。《象》以「正志」釋之。夫遯非徒退藏而已，必退而有以正吾志之所向，則在我者無邪曲之私，在人者有觀感之益。志正則行無不宜，吉乃自致。若志既不正，雖退奚益？</p><p><strong>所出</strong>：《周易 · 遯》 — https://zh.wikisource.org/wiki/周易/遯</p></article></main></div></div>
