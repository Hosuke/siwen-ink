    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 遐覽</nav></header><main><article><h1>遐覽</h1><p>廣索異書之名目，以待好道者知所求。</p><p>抱朴子此卷廣列道書符圖之名目，以便好道者求索，故篇名「遐覽」。</p><p>其序云：「遐覽者，欲令好道者知異書之名目也。」全卷述鄭君之事蹟德行，並詳列其所見之道書三百餘卷、符圖之屬，以見仙道之淵博廣大。</p><p>書末附記鄭君晚年之事：「太安元年，知季世之亂，江南將鼎沸，乃負笈持仙藥之扑，將入室弟子，東投霍山，莫知所在。」</p><p><strong>所出</strong>：《抱朴子 · 卷19》 — https://zh.wikisource.org/wiki/抱朴子/卷19</p></article></main></div></div>
