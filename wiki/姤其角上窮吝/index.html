    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 姤其角上窮吝</nav></header><main><article><h1>姤其角上窮吝</h1><p>象傳語，上九遇於角上，以其上窮而有吝，戒無故而遇也。</p><p>「姤其角，上窮吝也。」</p><p>上九以陽居上，窮極而無所遇，僅及其角而已，無復可遇之人。是以有吝然而未至於凶也。象傳以「上窮」釋之，見其遇非其時，遇非其人也。</p><p><strong>所出</strong>：《周易 · 姤》 — https://zh.wikisource.org/wiki/周易/姤</p></article></main></div></div>
