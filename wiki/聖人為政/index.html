    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖人為政</nav></header><main><article><h1>聖人為政</h1><p>聖人治國，因其本國，去無用之物，利可倍增，以實用為政之要。</p><p><strong>聖人為政</strong>者，《節用上》之要旨也。墨子以為，聖人治一國，一國可倍；聖人治天下，天下可倍。其倍之之道，非向外取地，乃在「因其國家，去其無用」。</p><p>所謂無用者，非僅指財物之奢靡也。凡事之不加實用者，皆在去除之列。衣裳之於溫凊，宮室之於避風雨，甲盾五兵之於禦寇亂，舟車之於通四方，皆以實用為準繩。聖人發令興事，用財行事，無不加用而為。財用不費，民德不勞，興利多矣。</p><p>此為政之道，以[[節用]]為基，以實用為衡，去無用之務而行聖王之道者也。</p></article></main></div></div>
