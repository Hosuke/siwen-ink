    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 晉殺其大夫郤锜郤州郤至</nav></header><main><article><h1>晉殺其大夫郤锜郤州郤至</h1><p>郤氏三大夫同日被殺，郤氏族滅。</p><p>成公十七年冬，晉殺其大夫郤锜、郤州、郤至。</p><p>郤氏世為晉大夫，至是族滅。郤锜、郤州、郤至皆晉之重臣，同日見殺，蓋由爭權構怨，終致族殄。</p><p><strong>所出</strong>：《春秋公羊傳 · 成公》 — https://zh.wikisource.org/wiki/春秋公羊傳/成公</p></article></main></div></div>
