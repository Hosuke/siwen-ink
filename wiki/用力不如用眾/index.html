    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 用力不如用眾</nav></header><main><article><h1>用力不如用眾</h1><p>集眾力則無不可舉，聚群智則事無不成。</p><p>抱樸子曰：南溟引朝宗以成不測之深，玄圃崇本石以致極天之峻，大夏淩霄，賴群橑之積。輪曲轅直，無可闕之物。惟天下之事亦然。</p><p>眾力並，則萬鈞不足舉也；群智用，則庶績不足康也。故繁足者死而不弊，多士者亂而不亡。</p><p>是故元凱之佐登，而格天之化洽；折衝之才周，則逐鹿之姦寢。舜禹所以有天下而不與，衛靈所以雖驕恣而不危者，皆能用眾故也。</p><p><strong>所出</strong>：《抱朴子 · 卷10》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷10</p></article></main></div></div>
