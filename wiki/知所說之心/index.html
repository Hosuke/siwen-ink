    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 知所說之心</nav></header><main><article><h1>知所說之心</h1><p>說之難，在知說主之心而投其所好。</p><p>說之難，在知所說之心，可以吾說當之。苟不知其心而強言之，鮮有不敗者矣。</p><p><strong>所出</strong>：《韓非子 · 說難》 — https://zh.wikisource.org/wiki/韓非子/說難</p></article></main></div></div>
