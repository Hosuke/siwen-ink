    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 知常明</nav></header><main><article><h1>知常明</h1><p>知曉恆常之理，則通達無蔽。</p><p>知常明，不知常則㤢㤢作兇。知常者容，容乃公，公乃王，王乃天，天乃道，道乃久，沒身不殆。</p><p>知常者，明於道者也。恆常之理，即萬物變化之則。不知此理，則妄作取凶；知之則容，容則公，公則王，王則天，天則道，道久而無危矣。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第六十章 歸根》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
