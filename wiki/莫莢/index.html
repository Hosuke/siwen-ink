    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 莫莢</nav></header><main><article><h1>莫莢</h1><p>異草生於庭，一日生一葉至十五日，又日落至三十日落盡，以明於月。</p><p>又有異草生於庭，月一日生一葉，至十五日生十五葉，至十六日一葉落，至三十日落盡。若小月，即一葉厭而不落，謂之莫莢，以明於月也，亦曰曆莢。帝因鑄鏡以象之，為十五面神鏡，寶鏡也。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 1》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/1</p></article></main></div></div>
