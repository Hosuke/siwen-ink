    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 破琴剿弦</nav></header><main><article><h1>破琴剿弦</h1><p>古之破琴剿弦者，諒有以而然。</p><p>抱朴子論世俗貴古賤今之蔽末，云「昔之破琴剿弦者，諒有以而然乎」，言古賢之舉皆有深意，非偶然也。</p><p><strong>所出</strong>：《抱朴子 · 卷32》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷32</p></article></main></div></div>
