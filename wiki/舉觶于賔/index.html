    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 舉觶于賔</nav></header><main><article><h1>舉觶于賔</h1><p>一人洗觶，升，實觶以獻于賔之禮。</p><p>揖讓升，賔厭介升，介厭衆賔升，衆賔序升，即席。</p><p>一人洗，升，舉觶于賔。實觶，西階上坐奠觶，遂拜，執觶興，賔席末答拜；坐祭，遂飲，卒觶，興，坐奠觶，遂拜，執觶興，賔答拜。</p><p>降洗，升，實觶，立于西階上俟賔拜；進坐奠觶于薦西，賔辭，坐受以興。舉觶者西階上拜送，賔坐奠觶于其所。舉觶者降。</p><p><strong>所出</strong>：《儀禮 · 鄉飲酒禮》 — https://zh.wikisource.org/wiki/儀禮/鄉飲酒禮</p></article></main></div></div>
