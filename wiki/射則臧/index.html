    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 射則臧</nav></header><main><article><h1>射則臧</h1><p>射藝之美，發無不中，無愧於臧也。</p><p>「射則臧」者，射而善之稱也。臧者，善也。觀人之道，觀其所長；觀人之才，觀其所試。魯莊公射於射宮，巧趨蹌蹌，發則必中，其技臧矣。然射之善止於一藝，未足盡人倫之善。詩人首章言其射藝之美，正見夫區區一技之長，不足以掩其他之失也。</p><p><strong>所出</strong>：《詩經 · 猗嗟》 — https://zh.wikisource.org/wiki/詩經/猗嗟</p></article></main></div></div>
