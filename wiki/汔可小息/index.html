    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 汔可小息</nav></header><main><article><h1>汔可小息</h1><p>庶幾可得小止息也。</p><p>「息」與「休」義相近，而小異。「休」者，止勞也；「息」者，止迫也。民之迫於寇虐、姦宄者，庶幾可息肩焉。京師者，四國之所觀瞻也；京師安，則四方有望矣。</p><p><strong>所出</strong>：《詩經 · 民勞》 — https://zh.wikisource.org/wiki/詩經/民勞</p></article></main></div></div>
