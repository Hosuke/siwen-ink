    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 狗彘食人食</nav></header><main><article><h1>狗彘食人食</h1><p>畜肥於廄而民有饑色，是率獸而食人</p><p>梁惠王肥甘不足於口與？抑為采色不足視目？聲音不足聽耳？便嬖不足使令？皆非也。王之大欲，乃在闢土地、朝秦楚。然行不以仁，是猶[[率獸食人]]也。孟子嘗責梁惠王：狗彘食人食而不知檢，塗有餓莩而不知發，此率獸食人之實也。</p><p><strong>所出</strong>：《孟子 · 梁惠王上》 — https://zh.wikisource.org/wiki/孟子/梁惠王上</p></article></main></div></div>
