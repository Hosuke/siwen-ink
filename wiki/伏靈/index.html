    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 伏靈</nav></header><main><article><h1>伏靈</h1><p>伏靈者，兔絲下千歲松根，食之不死，卜筮者求之以為神藥。</p><p>傳曰：「下有伏靈，上有兔絲；上有擣蓍，下有神龜。」所謂伏靈者，在兔絲之下，狀似飛鳥之形。新雨已，天清靜無風，以夜捎兔絲去之，既以篝燭此地燭之，火滅，即記其處，以新布四丈環置之，明即掘取之，入四尺至七尺，得矣，過七尺不可得。伏靈者，千歲松根也，食之不死。</p><p>聞蓍生滿百莖者，其下必有神龜守之，其上常有青雲覆之。</p><p><strong>所出</strong>：《史記 · 卷128》 — https://zh.wikisource.org/wiki/史記/卷128</p></article></main></div></div>
