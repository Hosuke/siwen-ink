    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大臣不得籍威城市</nav></header><main><article><h1>大臣不得籍威城市</h1><p>大臣不得恃祿以威城市，不得廣黨以臣士卒。</p><p>是故大臣之禄雖大，不得藉威城市；黨與雖衆，不得臣士卒。故人臣處國無私朝，居軍無私交，其府庫不得私貸於家。此明君之所以禁其邪。</p><p><strong>所出</strong>：《韓非子 · 愛臣》 — https://zh.wikisource.org/wiki/韓非子/愛臣</p></article></main></div></div>
