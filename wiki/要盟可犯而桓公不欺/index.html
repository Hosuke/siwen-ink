    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 要盟可犯而桓公不欺</nav></header><main><article><h1>要盟可犯而桓公不欺</h1><p>曹沫劫盟，桓公不欺，終致天下信之。</p><p>齊侯與魯侯會于柯。曹子進曰：「城壞壓竟，君不圖與？」管子問所欲，曹子請汶陽之田。桓公許諾。曹子請盟，桓公下與之盟。已盟，曹子摽劍而去之。</p><p>要盟可犯，而桓公不欺；曹子可讎，而桓公不怨。桓公之信著乎天下，自柯之盟始焉。</p><p><strong>所出</strong>：《春秋公羊傳 · 莊公》 — https://zh.wikisource.org/wiki/春秋公羊傳/莊公</p></article></main></div></div>
