    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 師氏</nav></header><main><article><h1>師氏</h1><p>教導貴族女子之官，后妃當尊敬之。</p><p>言告師氏。師氏者，學官也，掌教育輔導貴族子女之官。后妃當尊敬師氏，以廣見聞、修德行。</p><p><strong>所出</strong>：《詩經 · 葛覃》 — https://zh.wikisource.org/wiki/詩經/葛覃</p></article></main></div></div>
