    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖人吾不得而見之矣</nav></header><main><article><h1>聖人吾不得而見之矣</h1><p>聖人傷道之不行。</p><p>[[孔子]]言[[聖人]]吾不得而見之矣，得見[[君子]]者斯可矣；[[善人]]吾不得而見之矣，得見有恒者斯可矣。[[亡而為有]]，[[虛而為盈]]，[[約而為泰]]，難乎有恒矣。[[聖人]]傷時之辭，見[[斯文]]之衰薄，[[有恒]]之難得也。</p><p><strong>所出</strong>：《論語 · 述而第七》 — https://zh.wikisource.org/wiki/論語/述而第七</p></article></main></div></div>
