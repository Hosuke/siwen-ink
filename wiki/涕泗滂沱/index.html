    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 涕泗滂沱</nav></header><main><article><h1>涕泗滂沱</h1><p>淚流盛多，若水之驟至也。</p><p>涕，目液也；泗，鼻液也。滂沱，言其流之盛若雨之驟下。詩人思人而不得，涕泗交頤，勢若決渠。蓋悲極則液溢，情深則聲竭，此詩所以狀哀之甚也。</p><p><strong>所出</strong>：《詩經 · 澤陂》 — https://zh.wikisource.org/wiki/詩經/澤陂</p></article></main></div></div>
