    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 往有事也</nav></header><main><article><h1>往有事也</h1><p>利涉大川者，往則有事。</p><p>彖傳曰：「利涉大川，往有事也。」涉川貴於果決，卦辭言利涉者，非坐待可成，乃勇往以成事也。</p><p><strong>所出</strong>：《周易 · 蠱》 — https://zh.wikisource.org/wiki/周易/蠱</p></article></main></div></div>
