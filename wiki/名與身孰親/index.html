    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 名與身孰親</nav></header><main><article><h1>名與身孰親</h1><p>教人以身為重、名貨為輕，知止知足乃可長久。</p><p>河上公釋此章之意，教人權量輕重，勿以浮名虛譽加之於身也。</p><p>夫人之於名，若與身較之，孰親？身與貨較之，孰多？得與亡較之，孰病？名者，身之外物；貨者，身外之財。甚愛其名者，必大費精神；多藏其貨者，必厚亡其身。惟知足者不辱於利禄，知止者不殆於進取，如是可以長久矣。</p><p>是故聖人知止足之分，守要不爭之節，名為天下式而不自矜，貨為天下溪而不自積。此聖人所以全身遠害、與道長久也。</p><p><strong>所出</strong>：《老子河上公章句 · 立戒》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
