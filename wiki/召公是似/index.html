    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 召公是似</nav></header><main><article><h1>召公是似</h1><p>稱美召虎能繼承其祖召公之德業。</p><p>虎拜稽首，對揚王休。[[明明天子令聞不已]]，而下臣之感德，莫過於追念祖烈，以章厥功。</p><p>「無曰予小子，召公是似。」召虎自言：勿謂己之小子無似，蓋我所為，皆倣傚我祖召公之遺烈也。「肇敏戎公，用錫爾祉」，言虎起大役之事而成之，天子遂以福祿報之。此[[似續妣祖]]之義也。</p><p><strong>所出</strong>：《詩經 · 江漢》 — https://zh.wikisource.org/wiki/詩經/江漢</p></article></main></div></div>
