    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 宋衛陳鄭災</nav></header><main><article><h1>宋衛陳鄭災</h1><p>四國同日有災，記異也。</p><p>昭公十八年，夏五月壬午，宋、衛、陳、鄭災。</p><p>  傳曰：「其志，以同日也；其日，亦以同日也。」四國同日而災，天變亟行，聖人書之以為戒也。</p><p>  <strong>所出</strong>：《春秋穀梁傳 · 昭公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/昭公</p></article></main></div></div>
