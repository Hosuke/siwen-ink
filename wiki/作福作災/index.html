    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 作福作災</nav></header><main><article><h1>作福作災</h1><p>祖考在天，賞罰由德。</p><p>茲予大享于先王，爾祖其從與享之。作福作災，予亦不敢動用非德。</p><p>盤庚言大享先王時，[[爾祖其從與享之]]。言祖考在天，監觀在位，其[[作福作災]]，一循乎德；王亦不敢以[[非德]]施賞罰，致干祖考之怒也。此[[尚書]]所述敬祖奉先之義。</p><p><strong>所出</strong>：《尚書 · 盤庚上》 — https://zh.wikisource.org/wiki/尚書/盤庚上</p></article></main></div></div>
