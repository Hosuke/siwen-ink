    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 瓊室</nav></header><main><article><h1>瓊室</h1><p>身中精室，玉光凝結，魂神所宅。</p><p>瓊室者，精室之異名也。道家內視之學，謂人身中有玉光凝結之室，魂神居焉。八素集於此，猶珠玉之聚於櫝匱。脩真者守其一，則萬神安宅。</p><p><strong>所出</strong>：《黃庭內景經 · 瓊室章第二十一》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/瓊室章第二十一</p></article></main></div></div>
