    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 有兔爰爰</nav></header><main><article><h1>有兔爰爰</h1><p>喻君子以狡兔之脫網，傷野雉之入羅</p><p>[[兔爰]]首章言「有兔爰爰，雉離于羅」，以兔之逸豫興雉之困躓。兔性狡善走，故-{云}-「爰爰」，舒緩自得之貌；雉則為羅網所擒，「離」者，附著於網羅之謂也。詩人遭逢衰世，見君子不能如狡兔之遠害，徒若野雉之就擒，故借二物以起興，抒其生逢乱世、祸难相寻之悲也。</p><p><strong>所出</strong>：《詩經 · 兔爰》 — https://zh.wikisource.org/wiki/詩經/兔爰</p></article></main></div></div>
