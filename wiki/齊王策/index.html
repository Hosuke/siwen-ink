    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 齊王策</nav></header><main><article><h1>齊王策</h1><p>皇帝使御史大夫湯廟立皇子閎為齊王，以青社授土，戒以敬德保民。</p><p>維六年四月乙巳，皇帝使御史大夫湯廟立子閎為齊王。曰：</p><p>「於戲，小子閎，受茲青社！朕承祖考，維稽古建爾國家，封于東土，世為漢藩輔。於戲念哉！抱朕之詔，惟命不于常。人之好德，克明顯光。義之不圖，俾君子怠。悉爾心，允執其中，天祿永終。厥有愆不臧，乃凶于而國，害于爾躬。於戲，保國艾民，可不敬與！王其戒之。」</p><p>右齊王策。</p><p><strong>所出</strong>：《史記 · 卷060》 — https://zh.wikisource.org/wiki/史記/卷060</p></article></main></div></div>
