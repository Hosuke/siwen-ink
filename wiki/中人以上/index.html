    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 中人以上</nav></header><main><article><h1>中人以上</h1><p>教當因材而施</p><p>孔子曰：「中人以上，可以語上也；中人以下，不可以語上也。」教道貴乎因材，中人以上可與上達，以下者未足以語此也。</p><p><strong>所出</strong>：《論語 · 雍也第六》 — https://zh.wikisource.org/wiki/論語/雍也第六</p></article></main></div></div>
