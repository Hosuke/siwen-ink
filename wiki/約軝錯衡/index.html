    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 約軝錯衡</nav></header><main><article><h1>約軝錯衡</h1><p>車轂以皮束之，車衡加以文采，以示祭儀之盛。</p><p>「約軝錯衡」出自《商頌·烈祖》，言祭祀之車以皮革約束車轂，以彩色裝飾車衡也。</p><p>詩云「約軝錯衡，八鸞鶬鶬」，「約」者，約束也；「軝」者，車轂也，以皮約之使固；「錯」者，交錯成文也；「衡」者，車前橫木也，加以采飾。</p><p>《毛傳》云「軝，長轂之軝也，錯衡，金飾也」，正義以皮約轂而衡加以金，是天子諸侯祭祖之盛飾也。車馬既盛，聲鸞又和，故下云「以假以享」，車至廟而行饗禮焉。</p><p><strong>所出</strong>：《詩經 · 烈祖》 — https://zh.wikisource.org/wiki/詩經/烈祖</p></article></main></div></div>
