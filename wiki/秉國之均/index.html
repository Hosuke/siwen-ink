    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 秉國之均</nav></header><main><article><h1>秉國之均</h1><p>執掌國柄者當維持四方之平衡</p><p>尹氏大師，秉周之氐，位居執政。詩云「秉國之均，四方是維」，言其執掌國政，如持衡之器，當使四方之勢均而相維。天子賴以為輔，民賴以不迷，是以其任至重。秉均者言持其鈞衡，使無偏頗也。</p><p><strong>所出</strong>：《詩經 · 節南山》 — https://zh.wikisource.org/wiki/詩經/節南山</p></article></main></div></div>
