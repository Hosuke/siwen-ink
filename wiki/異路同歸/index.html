    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 異路同歸</nav></header><main><article><h1>異路同歸</h1><p>殊途同歸，異行皆可以存國利民。</p><p>夫墨子跌蹄而趨千里，以存楚、宋；段干木闔門不出，以安秦、魏。夫行與止也，其勢相反，而皆可以存國，此所謂異路而同歸者也。今夫救火者，汲水而趨之，或以甕瓴，或以盆盂，其方員銳橢不同，盛水各異，其於滅火鈞也。故秦、楚、燕、魏之歌也，異轉而皆樂；九夷八狄之哭也，殊聲而皆悲；一也。夫歌者，樂之徵也；哭者，悲之效也。憤于中則應於外，故在所以感。夫聖人之心，日夜不忘於欲利人，其澤之所及者，效亦大矣。</p><p><strong>所出</strong>：《淮南子 · 脩務訓》 — https://zh.wikisource.org/wiki/淮南子/脩務訓</p></article></main></div></div>
