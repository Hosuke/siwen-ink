    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 厚葬愚謬</nav></header><main><article><h1>厚葬愚謬</h1><p>厚葬之人如惑者，謂塚中多有珠玉，可因以致富，實未有不亡之國、無不抇之墓。</p><p>今有人於此，為石銘置之壟上，曰：「此其中之物，具珠玉玩好財物寶器甚多，不可不抇，抇之必大富，世世乘車食肉。」人必相與笑之，以為大惑。</p><p>世之厚葬也有似於此。自古及今，未有不亡之國也；無不亡之國者，是無不抇之墓也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十</p></article></main></div></div>
