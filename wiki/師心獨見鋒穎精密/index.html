    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 師心獨見，鋒穎精密</nav></header><main><article><h1>師心獨見，鋒穎精密</h1><p>魏晉名理之論，以獨到之見、精密之思為尚。</p><p>蘭石之《才性》，仲宣之《去伐》，叔夜之《辨聲》，太初之《本元》，輔嗣之《兩例》，平叔之《二論》，並師心獨見，鋒穎精密，蓋人倫之英也。[[彌綸群言研精一理]]，莫尚乎此。[[辨正然否]]之道，貴在[[師心獨見]]，而後能[[鋒穎精密]]。</p><p><strong>所出</strong>：《文心雕龍 · 論說》 — https://zh.wikisource.org/wiki/文心雕龍/論說</p></article></main></div></div>
