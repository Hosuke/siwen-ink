    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以其所積者食之</nav></header><main><article><h1>以其所積者食之</h1><p>治民者賞罰當視其功積之多寡為準。</p><p>地之不辟者，非吾地也；民之不牧者，非吾民也。凡牧民者，以其所積者食之，不可不審也。</p><p>其積多者其食多，其積寡者其食寡，無積者不食。或有積而不食者，則民離上；有積多而食寡者，則民不力；有積寡而食多者，則民多詐；有無積而徒食者，則民偷幸。</p><p>故離上、不力、多詐、偷幸，舉事不成，應敵不用。</p><p>故曰：察能授官，班祿賜予，使民之機也。</p><p><strong>所出</strong>：《管子 · 第03篇權修》 — https://zh.wikisource.org/wiki/管子/第03篇權修</p></article></main></div></div>
