    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 塞翁失馬</nav></header><main><article><h1>塞翁失馬</h1><p>福倚於禍，禍伏於福，變化難測，聖人知其環。</p><p>近塞上之人有善術者，馬無故亡而入胡，人皆弔之。其父曰：「此何遽不為福乎！」居數月，其馬將胡駿馬而歸，人皆賀之。其父曰：「此何遽不能為禍乎！」家富良馬，其子好騎，墮而折其髀，人皆弔之。其父曰：「此何遽不為福乎！」居一年，胡人大入塞，丁壯者引弦而戰，近塞之人，死者十九，此獨以跛之故，父子相保。</p><p>故福之為禍，禍之為福，化不可極，深不可測也。</p><p><strong>所出</strong>：《淮南子 · 人間訓》 — https://zh.wikisource.org/wiki/淮南子/人間訓</p></article></main></div></div>
