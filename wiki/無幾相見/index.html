    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無幾相見</nav></header><main><article><h1>無幾相見</h1><p>能相見之機甚少，時日無多。</p><p>[[死喪無日]]，故[[無幾相見]]。詩人陳兄弟聚散之苦：[[孤危將亡]]之世，相見之期既稀，唯今夕可以共宴。此與[[如彼雨雪先集維霰]]之喻相承，以雨雪之霰兆大雪，以死亡之迫促團聚。</p><p><strong>所出</strong>：《詩經 · 頍弁》 — https://zh.wikisource.org/wiki/詩經/頍弁</p></article></main></div></div>
