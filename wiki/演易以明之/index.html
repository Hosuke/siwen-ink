    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 演易以明之</nav></header><main><article><h1>演易以明之</h1><p>以易象演繹丹法，使火候之理粲然明白。</p><p>丹道之奧，難以直陳，故借《易》象以發明之。《易》之卦氣消息、納甲甲子，皆丹法火候之權輿。</p><p>[[火計不虛作]]者，以《易》演之乃能不虛作也。[[偃月法]]法月象，[[上弦兌數八下弦艮亦八]]法易數，[[乾坤體乃成]]法乾坤之象，無一而非《易》。魏伯陽以《易》、[[道寓]]之說、黃老之言三者相參，合為一書，故能道盡火候之實，非虛言也。</p><p><strong>所出</strong>：《周易參同契 · 09章》 — https://zh.wikisource.org/wiki/周易參同契/09章</p></article></main></div></div>
