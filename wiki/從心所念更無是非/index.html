    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 從心所念更無是非</nav></header><main><article><h1>從心所念更無是非</h1><p>修道之深境界，心念自然合道</p><p>子列子學道，三年之後，心不敢念是非，口不敢言利害。五年之後，心更念是非，口更言利害，而老商始一解顏而笑。七年之後，從心之所念，更無是非；從口之所言，更無利害，夫子始一引吾並席而坐。九年之後，横心之所念，横口之所言，亦不知我之是非利害，亦不知彼之是非利害，而後眼如耳，耳如鼻，鼻如口，口無不同，心凝形釋，骨肉都融。</p><p><strong>所出</strong>：《列子 · 仲尼篇》 — https://zh.wikisource.org/wiki/列子/仲尼篇</p></article></main></div></div>
