    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 其新孔嘉其舊如之何</nav></header><main><article><h1>其新孔嘉其舊如之何</h1><p>久別之夫婦重逢，其情是否如新婚之時美好。</p><p>「其新孔嘉，其舊如之何」，言新婚之時甚美，今別離既久，重逢之後，其情亦能如是之美乎？此歸人之心疑也。九十字者，言婚禮儀節之繁，非必枚舉之數。親結其縭，言母為女結佩巾。九十其儀，言禮文之盛。歸人於室家之樂，既切望之，又微有疑焉，其情深而曲也。</p><p><strong>所出</strong>：《詩經 · 東山》 — https://zh.wikisource.org/wiki/詩經/東山</p></article></main></div></div>
