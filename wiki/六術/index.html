    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 六術</nav></header><main><article><h1>六術</h1><p>將者當知之六事。</p><p>孫卿子云：「制號政令欲嚴以威，慶賞刑罰欲必以信，處舍收藏欲周以固，徙舉進退欲安以重欲疾以速；窺敵觀變欲潛以深，欲伍以參；遇敵決戰必道吾所明，無道吾所疑。」夫是之謂六術。</p><p><strong>所出</strong>：《荀子 · 議兵篇》 — https://zh.wikisource.org/wiki/荀子/議兵篇</p></article></main></div></div>
