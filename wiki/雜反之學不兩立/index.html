    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 雜反之學不兩立</nav></header><main><article><h1>雜反之學不兩立</h1><p>矛盾雜亂之學說，不可並用於治國。</p><p>冰炭不同器而久，寒暑不兼時而至，雜反之學不兩立而治。今兼聽雜學繆行同異之辭，安得無亂乎？</p><p><strong>所出</strong>：《韓非子 · 顯學》 — https://zh.wikisource.org/wiki/韓非子/顯學</p></article></main></div></div>
