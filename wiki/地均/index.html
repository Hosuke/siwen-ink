    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 地均</nav></header><main><article><h1>地均</h1><p>土地折算之法，因地之宜而立均平之數。</p><p>地之不可食者，山之無木者，百而當一。涸澤，百而當一。地之無草木者，百而當一。樊棘雜處，民不得入焉，百而當一。藪，鎌纆得入焉，九而當一。蔓山，其木可以爲材，可以爲軸，斤斧得入焉，九而當一。汎山，其木可以爲棺，可以爲車，斤斧得入焉，十而當一。流水，網罟得入焉，五而當一。林，其木可以爲棺，可以爲車，斤斧得入焉，五而當一。澤，網罟得入焉，五而當一。命之曰地均，以實數。</p><p><strong>所出</strong>：《管子 · 第05篇乘馬》 — https://zh.wikisource.org/wiki/管子/第05篇乘馬</p></article></main></div></div>
