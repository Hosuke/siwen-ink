    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 報惡晚</nav></header><main><article><h1>報惡晚</h1><p>君知姦而不及時誅之，及其禍作，報惡已晚。</p><p>或曰：昭公之及於難者，報惡晚也。然則高伯之晚於死者，報惡甚也。明君不懸怒，懸怒，則罪臣輕舉以行計，則人主危。故靈臺之飲，衛侯怒而不誅，故褚師作難；食黿之羹，鄭君怒而不誅，故子公殺君。君子之舉「知所惡」，非甚之也，曰：知之若是其明也，而不行誅焉，以及於死。故「知所惡」，以見其無權也。</p><p>[[過而不聽於忠臣]]</p><p><strong>所出</strong>：《韓非子 · 難四》 — https://zh.wikisource.org/wiki/韓非子/難四</p></article></main></div></div>
