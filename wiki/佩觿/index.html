    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 佩觿</nav></header><main><article><h1>佩觿</h1><p>童子佩象骨之器以代解結，古代成人禮之飾物。</p><p>「童子佩觿」。</p><p>觿，解結之器，以象骨為之。鄭玄箋云：「觿，所以解結也。」古者男子幼穉，髮猶總角；年至十五，則去其幼名而加冠，佩觿以示其能治事解難也。詩言「童子佩觿」，明童子年已及冠，可以成人；然「雖則佩觿，能不我知」，則譏其有飾物而無其德，徒具形式而已。</p><p><strong>所出</strong>：《詩經 · 芄蘭》 — https://zh.wikisource.org/wiki/詩經/芄蘭</p></article></main></div></div>
