    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 如可贖兮，人百其身</nav></header><main><article><h1>如可贖兮，人百其身</h1><p>欲以百人之命贖一良士，傷賢才之無辜。</p><p>彼蒼者天，殲我良人！如可贖兮，人百其身。</p><p>詩人悲子車三良無辜見殲，乃仰天而歎：若可以贖回其一命，雖以百人之身代死，亦所不惜。言至痛也。黃鳥三章，此句皆同，可見哀情之摯。區區良士，竟不得脫於殉葬之俗，詩人之傷，溢於言表。</p><p><strong>所出</strong>：《詩經·黃鳥》 — https://zh.wikisource.org/wiki/詩經/黃鳥</p></article></main></div></div>
