    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 投畀豺虎</nav></header><main><article><h1>投畀豺虎</h1><p>疾惡譖人，欲投諸猛獸以快其誅。</p><p>「取彼譖人，投畀豺虎。」</p><p>投、畀，皆予也。言取彼譖人，則當投諸豺虎使之食之。言其疾之甚，恨不誅之也。</p><p><strong>所出</strong>：《詩經 · 巷伯》 — https://zh.wikisource.org/wiki/詩經/巷伯</p></article></main></div></div>
