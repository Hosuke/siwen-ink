    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 太醫之道</nav></header><main><article><h1>太醫之道</h1><p>天下之理一也；觀其國知其臣，觀其臣知其君，觀其君知其興亡。</p><p>太醫之道，脈和而實者為君子，生之道也；撓而浮者為小人，死之道也。太卜之道，策平而慢者為君子，吉之道也；曲而利者為小人，兇之道也。以是論之，天下之理一也，是故觀其國，則知其臣；觀其臣，則知其君；觀其君，則知其興亡。臣可以擇君而仕，君可以擇臣而任。夫揖讓可作而躁靜不可作，衣冠可詐而形器不可詐，言語可文而聲音不可文。</p><p><strong>所出</strong>：《化書 · 卷三》 — https://zh.wikisource.org/wiki/化書/卷三</p></article></main></div></div>
