    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鳴謙志未得</nav></header><main><article><h1>鳴謙志未得</h1><p>謙德顯聞而志未大行，可用師旅。</p><p>上六「鳴謙，利用行師，征邑國。」言謙德聲聞在上，而志未大行於天下，可用師旅以征邑國。</p><p>《象》曰「鳴謙，志未得也。可用行師，征邑國也」，言志未得行，故用師以濟之。</p><p><strong>所出</strong>：《周易 · 謙》 — https://zh.wikisource.org/wiki/周易/謙</p></article></main></div></div>
