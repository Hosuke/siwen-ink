    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 庸蜀羌髳微盧彭濮</nav></header><main><article><h1>庸蜀羌髳微盧彭濮</h1><p>誓師所會西土及南方八種之戎狄。</p><p>誓辭列庸、蜀、羌、髳、微、盧、彭、濮八種，咸在[[友邦冢君]]之列。皆西方及南方夷狄之長，從[[武王牧野之誓]]而[[恭行天罰]]者也。</p><p><strong>所出</strong>：《尚書 · 牧誓》 — https://zh.wikisource.org/wiki/尚書/牧誓</p></article></main></div></div>
