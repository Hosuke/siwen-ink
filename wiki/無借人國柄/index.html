    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無借人國柄</nav></header><main><article><h1>無借人國柄</h1><p>國柄不可假人，假人則君失其威而國危。</p><p>太公告文王守土之要，首戒「無借人國柄」。曰：「無借人國柄，借人國柄，則失其威。」又申之曰：「無借人利器，借人利器，則為人所害而不終於世。」</p><p>蓋國柄者，生殺予奪之權；利器者，強國勝敵之具。君主以柄權威令馭下，假人而威權旁落，則姦邪得志，國事不可收拾矣。此亦[[六守]]之義所由來也。</p><p><strong>所出</strong>：《六韜》 — https://zh.wikisource.org/wiki/六韜</p></article></main></div></div>
