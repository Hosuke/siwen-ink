    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 長存體</nav></header><main><article><h1>長存體</h1><p>地上外音，長存體去害子。</p><p>地上外音，長存體，去害子。此地上之外音呪也。學者誦之，冀長存其形體，而去病害之根，去害子者，去除身中諸害之子孫也。內音則[[珠鬱羅]]以召真，外音則長存體以固形，內外交暢，死根永絕，華蓋常安焉。</p><p><strong>所出</strong>：《上清大洞真經 · 2章》 — https://zh.wikisource.org/wiki/上清大洞真經/2章</p></article></main></div></div>
