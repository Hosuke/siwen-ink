    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 民監</nav></header><main><article><h1>民監</h1><p>以民之視聽為鏡鑒，觀民情以知得失。</p><p>民監者，以民為監、以民為鏡之義也。原文云：「古人有言曰：『人無於水監，當於民監。』」言古之聖賢有云：人之觀視，不當徒取法於水之鑒影，尤當以民之視聽為鏡也。水止鑒形，而民則可以監得失、知政令之臧否焉。水監者知醜美，民監者知治亂。此明王所以兢兢戒懼，務使政無闕失焉。</p><p><strong>所出</strong>：《尚書 · 酒誥》 — https://zh.wikisource.org/wiki/尚書/酒誥</p></article></main></div></div>
