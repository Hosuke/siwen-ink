    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 溫克</nav></header><main><article><h1>溫克</h1><p>醉酒仍能溫恭自持之德。</p><p>溫克，謂醉而能溫恭自持、不失儀度也。《小宛》以「人之齊聖，飲酒溫克」對言，以溫克別於昏昧者之壹醉日富。蓋聖人稟賦既正，雖飫酒亦能以禮自節，溫然有度；若彼昏不知者，則沈湎自放，無復檢束。此溫克之德，所以為君子所貴也。</p><p><strong>所出</strong>：《詩經 · 小宛》 — https://zh.wikisource.org/wiki/詩經/小宛</p></article></main></div></div>
