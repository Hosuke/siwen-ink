    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 一流之才</nav></header><main><article><h1>一流之才</h1><p>論才能有等差，而遇合之殊異。</p><p>一流之才者，才之殊等也。而或窮或達，其故何哉？抱朴子曰：「夫器業不異，而有抑有揚者，無知己也。故否泰時也，通塞命也。」蓋才之不遇，非才之罪，時與命使之然也。</p><p><strong>所出</strong>：《抱朴子 · 卷50》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷50</p></article></main></div></div>
