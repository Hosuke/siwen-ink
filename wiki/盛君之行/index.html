    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 盛君之行</nav></header><main><article><h1>盛君之行</h1><p>晏子言盛君之行在薄身厚民、約身廣世、明政行教、均貧富、誅賞公正。</p><p>晏子言：「薄于身而厚於民，約於身而廣於世。其處上也，足以明政行教，不以威天下。其取財也。權有無，均貧富，不以養嗜欲。誅不避貴，賞不遺賤，不淫于樂，不遁於哀，盡智導民而不伐焉，勞力事民而不責焉。」</p><p>又言：「政尚相利，故下不以相害為行；教尚相愛，故民不以相惡為名。刑罰中於法，廢置順於民，是以賢者處上而不華，不肖者處下而不怨。四海之內，社稷之中，粒食之民，一意同欲。」</p><p><strong>所出</strong>：《晏子春秋 · 卷三》 — https://zh.wikisource.org/wiki/晏子春秋/卷三</p></article></main></div></div>
