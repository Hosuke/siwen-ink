    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 難得之貨使人行妨</nav></header><main><article><h1>難得之貨使人行妨</h1><p>難得之貨鈎人心，妨礙其德行。</p><p>難得之貨，非必需的珍異之物也。爭之、求之、秘之、守之，則德行受其妨礙，心為物役，失其自然之性。</p><p><strong>所出</strong>：《老子 (帛書本) · 章十二》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p><hr><p>是說亦見《道德經》十二章，云：「難得之貨令人行妨。」行妨者，妨礙其行也。貪夫逐利，則傷廉而害義，其所行無復可觀者矣。</p><p>  <strong>所出</strong>：《道德經 (王弼本) · 十二章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
