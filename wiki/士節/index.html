    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 士節</nav></header><main><article><h1>士節</h1><p>士之為人，義不避難，遺生行義，視死如歸。</p><p>士之為人，當理不避其難，臨患忘利，遺生行義，視死如歸。有如此者，國君不得而友，天子不得而臣。大者定天下，其次定一國，必由如此人者也。</p><p>賢主勞於求人，而佚於治事。欲大立功名者，不可不務求此人也。</p><p>[[以貴富有人]]難，而此節之所以為貴。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十二》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十二</p></article></main></div></div>
