    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 新甫</nav></header><main><article><h1>新甫</h1><p>泰山以東之山，魯人取材以建宮廟。</p><p>詩云「徂來之松，新甫之柏。是斷是度，是尋是尺」，又云「松桷有舄，路寢孔碩，新廟奕奕」。</p><p>新甫者，山名也，在泰山以東。徂來亦山名。魯人伐徂來之松、新甫之柏，以構造宮廟，棟楹碩大，廟宇翼翼。新甫之柏質地堅美，宜為楝梁，故詩人頌之。</p><p><strong>所出</strong>：《詩經 · 閟宮》 — https://zh.wikisource.org/wiki/詩經/閟宮</p></article></main></div></div>
