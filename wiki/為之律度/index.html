    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 為之律度</nav></header><main><article><h1>為之律度</h1><p>趙盾為國政，制事典、正法罪、辟刑獄，申訂舊章，定為常法。</p><p>宣子於是乎始為國政，制事典、正法罪、辟刑獄、董逋逃、由質要、治舊洿、本秩禮、續常職、出滯淹。既成，以授大傅陽子，與大師賈佗，使行諸晉國，以為常法。</p><p><strong>所出</strong>：《春秋左氏傳 · 文公》 — https://zh.wikisource.org/wiki/春秋左氏傳/文公</p></article></main></div></div>
