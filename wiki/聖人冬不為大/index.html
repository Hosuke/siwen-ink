    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖人冬不為大</nav></header><main><article><h1>聖人冬不為大</h1><p>聖人謙</p><p>帛書本作「聖人冬不為大故能成大」，王弼本作「聖人終不為大故能成其大」。言聖人不自居其大，不矜不伐，謙下為務，故能成就大功。冬不為大者，終不自大之義，與[[聖人猶難之]]相發，以明聖人之所以成大功者，在其不欲大、不輕易、不自足也。</p><p>  <strong>所出</strong>：《老子 (帛書本) · 章六十三》 — https://zh.wikisource.org/wiki/老子_(帛書本)</p></article></main></div></div>
