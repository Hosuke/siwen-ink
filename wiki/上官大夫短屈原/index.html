    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 上官大夫短屈原</nav></header><main><article><h1>上官大夫短屈原</h1><p>上官大夫因爭寵而害屈平之能，讒言於懷王，王怒疏之。</p><p>上官大夫與之同列，爭寵而心害其能。懷王使屈原造為憲令，屈平屬草槁未定。上官大夫見而欲奪之，屈平不與。因讒之曰：「王使屈平為令，眾莫不知，每一令出，平伐其功，以為『非我莫能為』也。」王怒而疏屈平。</p><p>令尹子蘭聞之大怒，卒使上官大夫短屈原於頃襄王，頃襄王怒而遷之。</p><p><strong>所出</strong>：《史記 · 卷084》 — https://zh.wikisource.org/wiki/史記/卷084</p></article></main></div></div>
