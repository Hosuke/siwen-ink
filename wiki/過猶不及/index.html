    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 過猶不及</nav></header><main><article><h1>過猶不及</h1><p>過與不及，其失相同；中道者，善之美也。</p><p>子貢問：「師與商也孰賢？」子曰：「師也過，商也不及。」曰：「然則師愈與？」子曰：「過猶不及。」</p><p>子張過，子夏不及。子貢以為過者愈於不及，夫子以為過與不及，其失均也。唯中道為貴，此[[中庸-概論]]之義也。</p><p><strong>所出</strong>：《論語 · 先進第十一》 — https://zh.wikisource.org/wiki/論語/先進第十一</p></article></main></div></div>
