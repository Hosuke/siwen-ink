    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 棄仇讎而得石交</nav></header><main><article><h1>棄仇讎而得石交</h1><p>舍棄舊怨，得堅固之交。</p><p>蘇秦說齊王還燕十城，以為「棄仇讎而得石交」，言燕、秦皆親附，霸王可成。</p><p><strong>所出</strong>：《史記 · 卷069》 — https://zh.wikisource.org/wiki/史記/卷069</p></article></main></div></div>
