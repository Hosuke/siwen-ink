    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 真券</nav></header><main><article><h1>真券</h1><p>以事試驗，觀其所成。</p><p>天下事何者為是，何者為非？試而即應，事有成功，其有結疾病者解除，悉是也；試其事而不應，行之無成功，其有結疾者不解除，悉非也。夫凡事信不信，何須必當考問之也。[[試驗]]於事而效之，則是非自見矣。古者聖賢但觀人所行[[證驗]]，取信效於是。欲知吾書，悉取信效以為券，不可忘也。</p><p><strong>所出</strong>：《太平經 · 07》 — https://zh.wikisource.org/wiki/太平經/07</p></article></main></div></div>
