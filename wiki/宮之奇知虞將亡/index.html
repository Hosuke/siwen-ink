    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 宮之奇知虞將亡</nav></header><main><article><h1>宮之奇知虞將亡</h1><p>宮之奇知晉借道伐虢必及於虞，遂以其孥適西山，虞果亡。</p><p>伐虢之役，師出於虞。宮之奇諫而不聽，出，謂其子曰：「虞將亡矣！唯忠信者能留外寇而不害。除闇以應外謂之忠，定身以行事謂之信。今君施其所惡於人，闇不除矣；以賄滅親，身不定矣。夫國非忠不立，非信不固。既不忠信，而留外寇，寇知其釁而歸圖焉。已自拔其本矣，何以能久？吾不去，懼及焉。」以其孥適西山，三月，虞乃亡。</p><p><strong>所出</strong>：《國語 · 卷08》 — https://zh.wikisource.org/wiki/國語/卷08</p></article></main></div></div>
