    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 金輦正位從玉輿</nav></header><main><article><h1>金輦正位從玉輿</h1><p>金輿居正，玉車從之，陰陽相承之象。</p><p>金輦正位從玉輿。</p><p>金輦者，陽道之貴；玉輿者，坤輿之從。言仙人馭金車以行，而玉輿從之，如日月之代明，[[陰陽相求]]而不可離也。隱道之用，亦猶是矣。</p><p><strong>所出</strong>：《黃庭內景經 · 隱景章第二十四》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/隱景章第二十四</p></article></main></div></div>
