    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 馬榮白鹿車</nav></header><main><article><h1>馬榮白鹿車</h1><p>馬榮兩眼赤爛而能明察洞視，乘白鹿車日赴數十處請。</p><p>馬榮者，住樑國轂城中。兩眼赤爛，瞳子不見物，而能明察洞視。北方多病癩，鄉里不容者輒來投榮。榮為治之，悉差。榮云患腳，常乘白鹿車，行無遠近，不見人手推引，而車自至。或一日赴數十處請，而各有一榮。凡與人語，自稱「厄子」。作牽車三詩，類乎讖緯。</p><p>宋武帝孝建二年三月初，作書與兩國人別，至十六日中時果化。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 28》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/28</p></article></main></div></div>
