    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 視之不足見，聽之不足聞，用之不可既</nav></header><main><article><h1>視之不足見，聽之不足聞，用之不可既</h1><p>道無形無名，不可見聞，而其用無盡。</p><p>道之出言，淡呵其無味；視之不足見，聽之不足聞，用之不可既。視聽不足以感知，而運用之效無有窮盡。此言[[道]]無形無名，不可方物，然其功用弘大，不可測度。循[[道之出言淡無味]]之旨，道雖無味無象，而功用無極。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第七十九章 大象》 — https://zh.wikisource.org/wiki/老子_(帛書校勘版)</p></article></main></div></div>
