    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 千變萬化</nav></header><main><article><h1>千變萬化</h1><p>萬物新故迭更，循環不息，無有終極</p><p>夫萬物之變，千變萬化而未始有極也。弊而復新，其為樂也，可勝計邪！物小大優游，倏忽遷革，秋豪之末淪於無間而復歸於大，蘆苻之厚通於無㙬而復反於敦龐。若然則有所受之矣，而非所授者所生。</p><p><strong>所出</strong>：《淮南子 · 俶真訓》 — https://zh.wikisource.org/wiki/淮南子/俶真訓</p></article></main></div></div>
