    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以力攻者出一取十</nav></header><main><article><h1>以力攻者出一取十</h1><p>務力之國出少得多，務言之國出多失少。</p><p>以力攻者，出一取十；以言攻者，出十喪百。國好力，此謂以難攻；國好言，此謂以易攻。好力者務實功，賞罰信於己而威名加於人，故攻則得而守則固。好言者務空辯，智術馳於外而根本虛於内，故師出無功而民心易搖。</p><p><strong>所出</strong>：《韓非子 · 飭令》 — https://zh.wikisource.org/wiki/韓非子/飭令</p></article></main></div></div>
