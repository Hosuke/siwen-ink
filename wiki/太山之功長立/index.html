    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 太山之功長立</nav></header><main><article><h1>太山之功長立</h1><p>功名兼備如太山之功、日月之光，功德永著於天地。</p><p>如此，故太山之功長立於國家，而日月之名久著於天地。</p><p><strong>所出</strong>：《韓非子 · 功名》 — https://zh.wikisource.org/wiki/韓非子/功名</p></article></main></div></div>
