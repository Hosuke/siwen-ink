    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 仰道者跂</nav></header><main><article><h1>仰道者跂</h1><p>仰道者跂，如道者駸，皆知道之事，不知道之道。</p><p>仰道者跂，如道者駸，皆知道之事，不知道之道。是以聖人不望道而歉，不恃道而豊，不借道於聖，不賈道於愚。</p><p><strong>所出</strong>：《關尹子 · 1》 — https://zh.wikisource.org/wiki/關尹子/1</p></article></main></div></div>
