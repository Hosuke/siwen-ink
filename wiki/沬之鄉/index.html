    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 沬之鄉</nav></header><main><article><h1>沬之鄉</h1><p>衞地名，詩人采唐所在，亦桑中密期之地也。</p><p>「沬之鄉」，-{zh-cn:（或作「沫之鄉」）}-，地名，在衞之境。《桑中》首章云「爰采唐矣，沬之鄉矣」，言我往沬之鄉采唐，以興思美人孟姜也。沬與桑中、上宮、淇上，皆詩中地理之可考者，正見其約會之地遍於衞境焉。</p><p><strong>所出</strong>：《詩經 · 桑中》 — https://zh.wikisource.org/wiki/詩經/桑中</p></article></main></div></div>
