    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 仙可學致</nav></header><main><article><h1>仙可學致</h1><p>仙道可學而致，如播種然，不耕不獲</p><p>仙之可學致，如黍稷之可播種得，甚炳然耳。然未有不耕而獲嘉禾，未有不勤而獲長生度世也。世閒自有姦偽圖錢之子，竊道士之號者，不可勝數，然皆粗開頭角，或妄沽名，加之以伏邪飾偽。又有好事者，誠欲為道，而不肯謙下於堪師者，直爾蹴迮，從求至要，寧可得乎？或聞有曉消五雲、飛八石、轉九丹、冶黃白者，則多而毀之曰：「此法獨有赤松王喬知之，今世之人而雲知之者，皆虛妄耳。」淺見之家不覺此言有詐偽而作，便息遠求之意。悲夫！</p><p><strong>所出</strong>：《抱朴子 · 卷14》 — https://zh.wikisource.org/wiki/抱朴子/卷14</p></article></main></div></div>
