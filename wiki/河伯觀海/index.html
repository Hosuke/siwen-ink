    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 河伯觀海</nav></header><main><article><h1>河伯觀海</h1><p>河伯自喜涇流之大，及見北海，乃知己之渺小，因望洋而歎。</p><p>秋水時至，百川灌河，涇流之大，兩涘渚崖之間不辯牛馬。河伯欣然自喜，以天下之美盡在己。順流而東至北海，東面而視不見水端。始旋其面目，望洋向若而歎曰：「野語有之：『聞道百以為莫己若』，我之謂也。且夫我嘗聞少仲尼之聞而輕伯夷之義，始吾弗信；今我睹子之難窮也，吾非至於子之門則殆矣，吾長見笑於大方之家。」</p><p><strong>所出</strong>：《莊子 · 秋水》 — https://zh.wikisource.org/wiki/莊子/秋水</p></article></main></div></div>
