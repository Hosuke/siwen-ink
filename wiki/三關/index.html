    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三關</nav></header><main><article><h1>三關</h1><p>口手足之關，精氣深藏</p><p>三關者，口、手、足之關也，精氣深藏於此。</p><p>經云：「三關之中精氣深」，守此三關，則精不妄泄，氣不妄散，修真之要務也。</p><p><strong>所出</strong>：《黃庭外景經》 — https://zh.wikisource.org/wiki/黃庭外景經</p><hr><p>大洞經云「帝立三關上，八風舞神兵」。[[三關]]者，尾閭、夾脊、玉枕也。神炁循此三關上行，乃能招真下流，灌我玉霜。</p><p>  <strong>所出</strong>：《上清大洞真經 · 14章》 — https://zh.wikisource.org/wiki/上清大洞真經/14章</p></article></main></div></div>
