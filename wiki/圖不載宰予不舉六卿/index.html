    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 圖不載宰予，不舉六卿</nav></header><main><article><h1>圖不載宰予，不舉六卿</h1><p>法制既行，則姦邪自止，不待非常之人。</p><p>堯明於不失姦，故天下無邪；羿巧於不失發，故千金不亡。邪人不壽而盜跖止。如此，故圖不載宰予，不舉六卿；書不著子胥，不明夫差。孫、吳之略廢，盜跖之心伏。夫治有常道，則姦宄消弭，不資賢智之才也。</p><p><strong>所出</strong>：《韓非子 · 守道》 — https://zh.wikisource.org/wiki/韓非子/守道</p></article></main></div></div>
