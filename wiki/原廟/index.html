    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 原廟</nav></header><main><article><h1>原廟</h1><p>正廟之外，別立別殿，以存祖跡。</p><p>孝惠帝為東朝長樂宮，及閒往，數蹕煩人，乃作複道，方筑武庫南。叔孫生奏事，因請閒曰：「陛下何自筑複道高寑，衣冠月出游高廟？高廟，漢太祖，柰何令後世子孫乘宗廟道上行哉？」孝惠帝大懼，曰：「急壞之。」叔孫生曰：「人主無過舉。今已作，百姓皆知之，今壞此，則示有過舉。願陛下原廟渭北，衣冠月出游之，益廣多宗廟，大孝之本也。」上乃詔有司立原廟。原廟者，正廟之外，別立別殿，以存祖跡也。</p><p><strong>所出</strong>：《史記 · 卷099》 — https://zh.wikisource.org/wiki/史記/卷099</p></article></main></div></div>
