    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 祠此無益</nav></header><main><article><h1>祠此無益</h1><p>天旱而祠神求雨，晏子以為無益，當恤民隱。</p><p>齊大旱，景公欲祠靈山及河伯以祈雨。晏子進曰：「不可。祠此無益也。夫靈山固以石為身，以草木為髮，天久不雨，髮將焦，身將熱，彼獨不欲雨乎？祠之何益？河伯以水為國，以魚鱉為民，天久不雨，水泉將下，百川將竭，國將亡，民將滅矣，彼獨不欲雨乎？祠之何益？」晏子以為，當避宮殿暴露，與靈山河伯共憂，其幸而雨乎。景公從之，出野暴露三日，大果大雨。晏子曰：「維有德。」言天災之弭，在有德以臨民，不在祭祀以媚神也。</p><p><strong>所出</strong>：《晏子春秋 · 卷一》 — https://zh.wikisource.org/wiki/晏子春秋/卷一</p></article></main></div></div>
