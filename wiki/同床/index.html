    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 同床</nav></header><main><article><h1>同床</h1><p>姦臣借貴寵之人在側，以美色金玉惑主求欲，謂之同床。</p><p>凡人臣之所道成姦者有八術：一曰在同床。何謂同床？曰：貴夫人，愛孺子，便僻好色，此人主之所惑也。托於燕處之虞，乘醉飽之時，而求其所欲，此必聽之術也。為人臣者內事之以金玉，使惑其主，此之謂「同床」。</p><p>同床者，以君側所親近之寵人為媒介，而行其竊權之術也。貴妃、愛子、便媚好色之人，皆人主所易惑者。姦臣厚結其人，因其燕安之際，乘醉飽之時，為之請乞所欲，主必聽之。一術既行，則政令之權潛移矣。</p><p><strong>所出</strong>：《韓非子 · 八奸》 — https://zh.wikisource.org/wiki/韓非子/八奸</p></article></main></div></div>
