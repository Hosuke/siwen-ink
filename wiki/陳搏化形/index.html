    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 陳搏化形</nav></header><main><article><h1>陳搏化形</h1><p>陳搏預知化期，遣人鑿石室，端坐而化，享年一百一十八歲。</p><p>端拱元年，搏語門人曰：「吾來歲中元後，當遊峨眉。」明年遣門人鑿石室於張超谷。既成，搏往造之，曰：「斯石太華，斯谷猶為勝處，吾其歸於此乎。」即草遺表，云：「臣大數有期，聖朝難戀，已於今年十月二十二日化形於蓮華峰下張超谷中。」</p><p>初欲示化，使盡夜然燈燭於石室中。至期，以左手支頤而終。逮七日，容色不變，肢體尚溫。有五色雲蔽谷口，彌月不散。享年一百一十八歲。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 47》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/47</p></article></main></div></div>
