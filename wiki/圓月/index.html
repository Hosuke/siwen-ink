    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 圓月</nav></header><main><article><h1>圓月</h1><p>虛中元王與二神合為圓月，映了身形</p><p>圓月，乃二神各負半月，倒上合於虛中元王，上充腰間車軸之戶，所成之光象也。月形無窮，映了身形，順時吐息，乃存思要功。</p><p><strong>所出</strong>：《上清大洞真經 · 10章》 — https://zh.wikisource.org/wiki/上清大洞真經/10章</p></article></main></div></div>
