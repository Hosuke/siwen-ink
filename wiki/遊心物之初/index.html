    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 遊心於物之初</nav></header><main><article><h1>遊心於物之初</h1><p>心遊於萬物之本始，則得至美至樂之境。</p><p>孔子見老子，老子新沐，被髮而干，慹然似非人，形體掘若槁木。孔子問：「遊是。」老子曰：「心困焉而不能知，口辟焉而不能言，嘗為汝議乎其將。」言陰陽交通成和而物生，莫見其形。消息滿虛，日改月化，莫見其功。生有所萌，死有所歸，始終相反乎無端，莫知乎其所窮。得是，至美至樂；得至美而遊乎至樂，謂之至人。</p><p><strong>所出</strong>：《莊子 · 田子方》 — https://zh.wikisource.org/wiki/莊子/田子方</p></article></main></div></div>
