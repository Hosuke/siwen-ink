    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 輕綺麗靡</nav></header><main><article><h1>輕綺麗靡</h1><p>晉世詩風趨於輕靡綺麗之弊也。</p><p>「晉世群才，稍入輕綺，張潘左陸，比肩詩衢。采縟於正始，力柔於建安，或㭊文以為妙，或流靡以自妍。」潘岳、左思、陸機、張協，詩采繁縟而氣力已弱，漸失建安之豪健矣。</p><p><strong>所出</strong>：《文心雕龍 · 明詩》 — https://zh.wikisource.org/wiki/文心雕龍/明詩</p></article></main></div></div>
