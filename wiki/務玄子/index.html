    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 務玄子</nav></header><main><article><h1>務玄子</h1><p>胎中白氣君之字，育上生之義。</p><p>務玄子，乃[[胎中白炁君]]之名也。字育上生，取胞胎之中白氣主於生育長養之義。與太一精魂玄歸子共守五藏，結精育胞，化生其身。</p><p><strong>所出</strong>：《上清大洞真經 · 30章》 — https://zh.wikisource.org/wiki/上清大洞真經/30章</p></article></main></div></div>
