    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 雄狐綏綏</nav></header><main><article><h1>雄狐綏綏</h1><p>以雄狐自得之態喻人之淫佚非禮</p><p>《南山》首章以雄狐綏綏起興。崔崔者，山高大貌；綏綏者，狐求匹之自得也。詩人借是以諷襄公鳥獸之行，既與其妹淫，又徘徊魯道而不能自制，故以雄狐之尾隨而行況之。言外見人之所以異於禽獸者，以其有禮以節之，若狐然綏綏自得而無愧，是禽獸不如也。</p><p><strong>所出</strong>：《詩經 · 南山》 — https://zh.wikisource.org/wiki/詩經/南山</p></article></main></div></div>
