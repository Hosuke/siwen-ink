    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 立不易方</nav></header><main><article><h1>立不易方</h1><p>君子立身，當恆守其道，不易其志。</p><p>《象》曰：「雷風，恆；君子以立不易方。」</p><p>雷風相與，動而能恆，此天地之恆象也。君子法之，立身處世，恆守其道，不易其方。方者，道之所在，志之所向也。世變萬端，君子之心如如不動，揔守恆德，不以得失而變，不以成毀而易，此所以為恆也。</p><p><strong>所出</strong>：《周易 · 恒》 — https://zh.wikisource.org/wiki/周易/恒</p></article></main></div></div>
