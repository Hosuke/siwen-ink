    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 魂兮歸來</nav></header><main><article><h1>魂兮歸來</h1><p>招魂者號召遊魂歸返故居之語</p><p>「魂兮歸來」四字，反覆見於篇中凡四：初招以戒四方危險，終招以勸歸故居。其辭曰「魂兮歸來！去君之恆幹，何為四方些？舍君之樂處，而離彼不祥些。」又曰「魂兮歸來，反故居些」。反覆丁寜，欲使魂魄得所安宅，不至流散於外也。</p><p><strong>所出</strong>：《楚辭 · 招䰟》 — https://zh.wikisource.org/wiki/楚辭/招䰟</p></article></main></div></div>
