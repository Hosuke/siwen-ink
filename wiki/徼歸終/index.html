    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 徼歸終</nav></header><main><article><h1>徼歸終</h1><p>徼者事物歸終之處，觀徼所以見物之終</p><p>常有欲以觀其[[徼歸終]]。</p><p>[[王弼]]注：「徼，歸終也。凡有之為利，必以無為用。欲之所本，適道而後濟。故常有欲，可以觀其終物之徼。」有欲者，執著名用之利。徼者，事之邊際、歸終之處。觀徼者，見利之終；知終乃識所循之路。</p></article></main></div></div>
