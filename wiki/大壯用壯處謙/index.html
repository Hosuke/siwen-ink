    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大壯用壯處謙</nav></header><main><article><h1>大壯用壯處謙</h1><p>大壯未有違謙越禮能全其壯，陽爻皆以處隂位為美。</p><p>大壯未有違謙越禮能全其壯者也，故陽爻皆以處隂位為美。用壯處謙壯乃全，用壯處壯則觸藩矣。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷10》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷10</p></article></main></div></div>
