    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 刑主伏殺</nav></header><main><article><h1>刑主伏殺</h1><p>言刑象陰，主伏藏肅殺之功。</p><p>刑主伏殺。</p><p>刑者陰之事，其德在伏藏肅殺。陰氣斂斂潛隱，待時而動，故主伏；萬物成而凋落，故主殺。與德之「生起」相對為用也。</p><p><strong>所出</strong>：《周易參同契 · 29章》 — https://zh.wikisource.org/wiki/周易參同契/29章</p></article></main></div></div>
