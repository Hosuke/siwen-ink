    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 爪發不痛手足不思亦我也</nav></header><main><article><h1>爪發不痛手足不思亦我也</h1><p>爪發不感痛，手足不有思，然皆是我之所有，不可因無思痛而異之。</p><p>爪發不痛，手足不思，亦我也，豈可以思痛異之。</p><p><strong>所出</strong>：《關尹子 · 6》 — https://zh.wikisource.org/wiki/關尹子/6</p></article></main></div></div>
