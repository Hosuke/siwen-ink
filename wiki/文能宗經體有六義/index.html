    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 文能宗經體有六義</nav></header><main><article><h1>文能宗經體有六義</h1><p>宗經之文有此六美</p><p>文能宗經，體有六義：一則情深而不詭，二則風清而不雜，三則事信而不誕，四則義直而不回，五則體約而不蕪，六則文麗而不淫。夫情深者言摯，風清者氣正，事信者辭實，義直者理端，體約者法簡，文麗者采華。六義既備，斯為至文。揚子雲比雕玉以作器，謂五經之含文也。</p><p><strong>所出</strong>：《文心雕龍 · 宗經》 — https://zh.wikisource.org/wiki/文心雕龍/宗經</p></article></main></div></div>
