    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 禪旨</nav></header><main><article><h1>禪旨</h1><p>牟尼清淨，大士普度，不執不壞，是大清淨。</p><p>釋者，去萬緣之意；佛者，覺悟眾生之意。牟尼主離世，大士主醒世，合數百藏，無非警醒沉迷。牟尼清淨，大士普度，非有所執，非有所壞，是大清淨。般若非可執之物，得般若者，是名[[般若]]，亦無般若可名。能[[誦經持咒]]，必得清淨心、般若心。是故[[釋老莊之意]]，正法眼藏，三者同也。</p><p><strong>所出</strong>：《張三丰先生全集 · 卷6》 — https://zh.wikisource.org/wiki/張三丰先生全集/卷6</p></article></main></div></div>
