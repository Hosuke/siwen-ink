    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 百齡影徂，千載心在</nav></header><main><article><h1>百齡影徂，千載心在</h1><p>聖人雖往，而其文章精神，千載如生也。</p><p>《征聖》贊語有云「百齡影徂，千載心在」。「百齡」者，聖人之年壽也；「影徂」者，形體逝去也。聖人與凡人同受形體之拘，同有生死之變，然其精神心術寄諸文章者，豐富如海，高明如山。歲月往而愈新，年代遠而彌顯。「千載心在」者，言聖人之心不死也。文章者，聖人之不死之心也。百齡之身雖朽，千載之心常存，此文章之大用，而聖人所以垂範於後世者歟。</p><p><strong>所出</strong>：《文心雕龍 · 征聖》 — https://zh.wikisource.org/wiki/文心雕龍/徵聖</p></article></main></div></div>
