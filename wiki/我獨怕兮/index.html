    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 我獨怕兮其未兆</nav></header><main><article><h1>我獨怕兮其未兆</h1><p>聖人淡然無欲，未見可欲之朕。</p><p>我獨怕兮其未兆。怕者，安靜不動之貌；未兆者，未有朕兆之先也。聖人淡然無欲，不見可欲之事，故泊然無所感，若嬰兒之未有情識然。俗人感物而動，聖人寂然而靜，其趣固殊矣。</p><p><strong>所出</strong>：《老子河上公章句 · 異俗》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
