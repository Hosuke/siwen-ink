    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 萬壽在乃政</nav></header><main><article><h1>萬壽在乃政</h1><p>惟施政清明，乃可致民長久康寧。</p><p>王戒傅說曰：「汝惟有萬壽在乃政。」言卿相之長壽福慶，皆由輔政清明而來。政得其理，則民安而祿遠矣。</p><p><strong>所出</strong>：《尚書 · 傅說之命下》 — https://zh.wikisource.org/wiki/尚書/傅說之命下</p></article></main></div></div>
