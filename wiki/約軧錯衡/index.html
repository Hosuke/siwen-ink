    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 約軧錯衡</nav></header><main><article><h1>約軧錯衡</h1><p>車轂裝飾錯落，戰車華盛之貌。</p><p>約，纏束也；軧，車轂也；錯，交錯也；衡，車軝之橫木也。約軧錯衡，謂以皮革約束車轂，又以錯金為飾於衡上也。《采芑》二章言：「方叔率止，約軧錯衡，八鸞瑲瑲。」言方叔帥師，車飾之美如此，八鸞和鳴，見其威儀之盛、軍容之肅也。</p><p><strong>所出</strong>：《詩經 · 采芑》 — https://zh.wikisource.org/wiki/詩經/采芑</p></article></main></div></div>
