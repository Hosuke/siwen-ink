    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大賂南金</nav></header><main><article><h1>大賂南金</h1><p>南方之金，淮夷所貢，以見德化之遠被。</p><p>[[大賂南金]]，第八章之句也。南金者，南方荊揚之金也。賂者，遣人以物送之之謂。淮夷居江海之南，其貢以金為重。詩末言「大賂南金」，以見[[來獻其琛]]之中，此為最重，見淮夷之輸誠，魯德之遠被也。</p><p><strong>所出</strong>：《詩經 · 泮水》 — https://zh.wikisource.org/wiki/詩經/泮水</p></article></main></div></div>
