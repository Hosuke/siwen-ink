    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 朋來无咎</nav></header><main><article><h1>朋來无咎</h1><p>同志之人相從而至，同心協力，則無過咎。</p><p>復：亨。出入无疾，朋來无咎。</p><p>朋者，志同道合之友。[[復]]之時，陽氣初生，剛正之道已明。同志相從，故朋來无咎。蓋君子修身以俟時，則善類自附。</p><p><strong>所出</strong>：《周易 · 復》 — https://zh.wikisource.org/wiki/周易/復</p></article></main></div></div>
