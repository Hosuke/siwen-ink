    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 惠篤敘</nav></header><main><article><h1>惠篤敘</h1><p>周公戒成王以厚德相傳，勿使間斷。</p><p>周公受成王之享，戒之曰「惠篤敘」。惠，愛也；篤，厚也；敘，緒也。言以厚德相傳授，勿使中斷。周之命曆，積文王、武王、周公三世之德而成，成王小子不可以不慎。惠而不惠，則德薄；篤而不敘，則緒斷。此周公望成王善繼善述之切辭也。</p><p><strong>所出</strong>：《尚書 · 洛誥》 — https://zh.wikisource.org/wiki/尚書/洛誥</p></article></main></div></div>
