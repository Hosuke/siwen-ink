    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 建除</nav></header><main><article><h1>建除</h1><p>寅為建，卯為除，辰為滿，巳為平，主生；午為定，未為執，主陷；申為破，主衡；酉為危，主杓；戌為成，主開；亥為收，主藏；子為閉，主死。</p><p>寅爲建，卯爲除，辰爲滿，巳爲平，主生；午爲定，未爲執，主陷；申爲破，主衡；酉爲危，主杓；戌爲成，主開；亥爲收，主藏；子爲閉，主死。</p><p><strong>所出</strong>：《淮南子 · 天文訓》 — https://zh.wikisource.org/wiki/淮南子/天文訓</p></article></main></div></div>
