    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 自度稍侵</nav></header><main><article><h1>自度稍侵</h1><p>恐罪將及，度己日蹙，不能自安。</p><p>秦王十年十月，免相國呂不韋。歲餘，諸侯賓客使者相望於道，請文信侯。秦王恐其為變，乃賜書譴責，徙蜀。呂不韋自度稍侵，恐誅，乃飲酖而死。</p><p>「自度稍侵」四字，寫不韋之心至矣。免相以來，度日如年，侵尋消磨，自知不能見容。茅焦之說，秦王之怒，終不能解。一死謝之，聊以自全其軀耳。</p><p><strong>所出</strong>：《史記 · 卷085》 — https://zh.wikisource.org/wiki/史記/卷085</p></article></main></div></div>
