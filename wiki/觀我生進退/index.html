    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 觀我生進退</nav></header><main><article><h1>觀我生進退</h1><p>觀己所為以定趨舍，未失道也。</p><p>六三觀我生進退，未失道也。觀我之所為，度時之可否，以定進退。觀人而觀己，審其所以，未失道者也。
