    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 亢害承製</nav></header><main><article><h1>亢害承製</h1><p>亢極則害，承之乃能製，製則生化，不製則敗亂大病。</p><p>君火之右，退行一步，相火治之。相火之下，水氣承之；水位之下，土氣承之；土位之下，風氣承之；風位之下，金氣承之；金位之下，火氣承之；君火之下，陰精承之。</p><p>亢則害，承迺製，製則生化，外列盛衰，害則敗亂，生化大病。</p><p><strong>所出</strong>：《黃帝內經 · 素問第十九卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十九卷</p></article></main></div></div>
