    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 萬邦以貞</nav></header><main><article><h1>萬邦以貞</h1><p>君有元善，萬國皆正。</p><p>上文[[一人元良]]之義。君有大善，萬邦取正。《易》曰「正萬邦」，《詩》詠四方取法。此[[風行草偃]]之理，言一人之德可以正天下也。</p><p><strong>所出</strong>：《尚書 · 太甲下》 — https://zh.wikisource.org/wiki/尚書/太甲下</p></article></main></div></div>
