    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 緜蠻</nav></header><main><article><h1>緜蠻</h1><p>微禽翔止，旅人弗克從事，喻臣力之不足而義不可已也。</p><p>《緜蠻》，小雅之什也。詩以小鳥翔止於丘隅，比人之區區；旅人欲師事君子，而力有不逮。然以為人之服務於上，義不可廢，故雖不能至，終不敢懈。首章云「緜蠻黃鳥，止于丘隅」，以鳥之有所止喻人當知止；「豈敢憚行，畏我不能躋」，言非畏塗路之艱，畏己之不能上達也。二章、三章復陳此義，終以「飶」與「桀」之詞，反覆言不能趣走、不能止舍，皆狀力竭而義不可以已之辭。蓋賢者之事其上也，固有不可以不能為解者。</p><p><strong>所出</strong>：《詩經 · 緜蠻》 — https://zh.wikisource.org/wiki/詩經/緜蠻</p></article></main></div></div>
