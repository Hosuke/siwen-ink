    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 黎庶困毒而離判</nav></header><main><article><h1>黎庶困毒而離判</h1><p>民困則散，散則為盜</p><p>如此，黎庶亦安得不困毒而離判！離判者眾，則不得屯聚而為群盜矣。</p><p>百姓不堪，起為寇賊，釁咎發聞，寘於叢棘，虧君上之明，益刑書之煩，而民之荼毒，亦已深矣！</p><p><strong>所出</strong>：《抱朴子 · 卷28》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷28</p></article></main></div></div>
