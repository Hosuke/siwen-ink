    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天之降罔</nav></header><main><article><h1>天之降罔</h1><p>天網難逃，賢人云亡</p><p>天之降罔，維其優矣。人之云亡，心之憂矣。天之降罔，維其幾矣。人之云亡，心之悲矣。朱熹《詩集傳》云：「罔，羅網也。優，密也。幾，近也。」上天降羅網以加於人，君子知天網之不可脫；賢人日亡，詩人之心為之悲憂。疊詠「優」與「幾」，狀羅網之由密而漸疏，然終無倖免之理。</p><p><strong>所出</strong>：《詩經 · 瞻卬》 — https://zh.wikisource.org/wiki/詩經/瞻卬</p></article></main></div></div>
