    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 藏舟壑澤</nav></header><main><article><h1>藏舟壑澤</h1><p>藏物者以為固，然有力者夜半負之而走，莫之能守。</p><p>夫藏舟於壑，藏山於澤，謂之固矣，然而夜半有力者負之而走，昧者不知也。藏小大有宜，猶有所遯。若夫藏天下於天下而不得所遯，是恆物之大情也。</p><p><strong>所出</strong>：《莊子 · 大宗師》 — https://zh.wikisource.org/wiki/莊子/大宗師</p></article></main></div></div>
