    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蒲可伐乎</nav></header><main><article><h1>蒲可伐乎</h1><p>孔子答衞靈公蒲地可伐。</p><p>衞靈公聞孔子來，喜，郊迎。問曰：「蒲可伐乎？」對曰：「可。」靈公曰：「吾大夫以為不可。今蒲，衞之所以待晉楚也，以衞伐之，無乃不可乎？」孔子曰：「其男子有死之志，婦人有保西河之志。吾所伐者不過四五人。」靈公曰：「善。」然不伐蒲。</p><p><strong>所出</strong>：《史記 · 卷047》 — https://zh.wikisource.org/wiki/史記/卷047</p></article></main></div></div>
