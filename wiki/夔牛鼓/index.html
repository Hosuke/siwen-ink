    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 夔牛鼓</nav></header><main><article><h1>夔牛鼓</h1><p>黃帝殺夔牛以皮冒鼓，聲聞五百里。</p><p>帝於東海流波山得奇獸，狀如牛，蒼身元角一足，能出入水，吐水則生風，兩目光如日月，其音如雷，名曰夔牛。帝令殺之，以其皮冒之而為鼓，擊之聲聞五百里。世本雲：殷巫咸始作鼓，則非也。帝令軍人吹角為龍嗚，此鼓角之始也。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 1》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/1</p></article></main></div></div>
