    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 秉璧戴珪</nav></header><main><article><h1>秉璧戴珪</h1><p>周公立於南壇，手持璧玉，首戴珪璋，以行祭事。</p><p>周公為三壇[[三壇同墠|同墠]]，爲一壇於南方，周公立焉。[[秉璧戴珪]]，史乃冊，祝告先王。</p><p>爾元孫發，遘害虐疾，爾毋乃有服子之責在上。惟元孫發，不若旦，是佞若巧能，多才多藝，能事鬼神。命於帝庭，溥有四方，以定爾子孫於下地。</p><p><strong>所出</strong>：《尚書 · 周武王有疾周公所自以代王之志》 — https://zh.wikisource.org/wiki/尚書/周武王有疾周公所自以代王之志</p></article></main></div></div>
