    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 飽食終日無所用心</nav></header><main><article><h1>飽食終日無所用心</h1><p>終日無所用心者，難以有成；博弈之事，猶賢於已。</p><p>孔子曰：「飽食終日，無所用心，難矣哉！不有博弈者乎？為之，猶賢乎已！」</p><p>夫人不可以無用心也。終日飲食而無所用心，則心馳於外欲而無所歸宿，其害甚矣。博弈之戲，猶可寓智於其間，賢於塊然而無所事事者也。聖人言此，豈謂博弈之足貴哉？欲人知用心之不可已也。</p><p><strong>所出</strong>：《論語 · 陽貨第十七》 — https://zh.wikisource.org/wiki/論語/陽貨第十七</p></article></main></div></div>
