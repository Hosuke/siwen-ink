    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 庸隸不可以不拊循</nav></header><main><article><h1>庸隸不可以不拊循</h1><p>庸隸之卒猶不可以不撫循，況賢才乎。</p><p>夫庸隸猶不可以不拊循而卒盡其力，安可以無素而暴得其用哉！</p><p>夫以卒伍之賤，猶待拊循而後肯盡其力；況輔弼之重，論思之切者乎？君欲得其死力，必先養之以惠；臣欲得其忠心，必先待之以禮。推心置腹，則仇敵亦可以為腹心；暴虐以驅，則爪牙亦將為盜賊。</p><p>是以古之明主治天下者，必先正其心誠其意，以感格乎臣庶之心。不以其勢陵人，不以其威加人，則人樂為之用，而功無不成矣。</p><p><strong>所出</strong>：《抱朴子 · 卷11》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷11</p></article></main></div></div>
