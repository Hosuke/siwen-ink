    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 緹縈上書-之</nav></header><main><article><h1>緹縈上書-之</h1><p></p><p>緹縈上書之事，亦見於孝文二年。其少女緹縈自傷泣，乃隨其父至長安，上書曰：「妾父為吏，齊中皆稱其廉平，今坐法當刑。妾傷夫死者不可復生，刑者不可復屬，雖復欲改過自新，其道無由也。妾願沒入為官婢，贖父刑罪，使得自新。」書奏天子，天子憐悲其意，乃下詔除肉刑。</p><p>  <strong>所出</strong>：《史記 · 卷010》 — https://zh.wikisource.org/wiki/史記/卷010</p></article></main></div></div>
