    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天下不患無臣</nav></header><main><article><h1>天下不患無臣</h1><p>患無君以使之，不患無財，患無人以分之。</p><p>天下不患無臣，患無君以使之。天下不患無財，患無人以分之。故知時者可立以為長，無私者可置以為政。審於時而察於用而能備官者，可奉以為君也。緩者後於事，𠫤於財者失所親，信小人者失士。</p><p><strong>所出</strong>：《管子 · 第01篇牧民》 — https://zh.wikisource.org/wiki/管子/第01篇牧民</p></article></main></div></div>
