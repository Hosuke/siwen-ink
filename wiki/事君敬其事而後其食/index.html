    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 事君敬其事而後其食</nav></header><main><article><h1>事君敬其事而後其食</h1><p>謂臣之事君，當先敬其職事，而後計其祿食。</p><p>子曰：「事君，敬其事而後其食。」</p><p>食者，祿也。臣之事君，當以敬職為先，不可以利祿為心。蓋先敬其事，則食其自然而至；若先意求食，則非所以事君矣。</p><p><strong>所出</strong>：《論語 · 衞靈公第十五》 — https://zh.wikisource.org/wiki/論語/衞靈公第十五</p></article></main></div></div>
