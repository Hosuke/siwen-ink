    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 高渠彌弒昭公</nav></header><main><article><h1>高渠彌弒昭公</h1><p>昭公與高渠彌出獵，渠彌射殺昭公</p><p>莊公欲以高渠彌為卿，太子忽惡之，莊公弗聽，卒用渠彌為卿。及昭公即位，懼其殺己，冬十月辛卯，渠彌與昭公出獵，射殺昭公於野。祭仲與渠彌不敢入厲公，乃更立昭公弟子亹為君。</p><p><strong>所出</strong>：《史記 · 卷042》 — https://zh.wikisource.org/wiki/史記/卷042</p></article></main></div></div>
