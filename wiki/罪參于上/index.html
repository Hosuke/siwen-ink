    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 罪參于上</nav></header><main><article><h1>罪參于上</h1><p>罪惡累積于上，乃能責望天命。言王者不可恃天命而肆無忌憚。</p><p>「乃罪多參在上，乃能責命于天。」言王之罪惡累累，堆疊于上，卻猶責望天命之眷佑，可乎？祖伊以此斥紂之恃命而怙惡。</p><p><strong>所出</strong>：《尚書 · 西伯戡黎》 — https://zh.wikisource.org/wiki/尚書/西伯戡黎</p></article></main></div></div>
