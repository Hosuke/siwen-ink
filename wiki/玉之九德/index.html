    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 玉之九德</nav></header><main><article><h1>玉之九德</h1><p>玉有溫潤、知、義、行、絜、勇、精、容、辭九德，水集於玉而生九德。</p><p>夫玉之所貴者，九德出焉。夫玉溫潤以澤，仁也；鄰以理者，知也；堅而不蹙，義也；廉而不劌，行也；鮮而不垢，絜也；折而不撓，勇也；瑕適皆見，精也；茂華光澤，並通而不相陵，容也。叩之，其音清搏徹遠，純而不殺，辭也。</p><p>是以人主貴之，藏以為寶，剖以為符瑞，九德出焉。</p><p>水集於玉而九德出焉。凝蹇而為人，而九竅五慮出焉。</p><p><strong>所出</strong>：《管子 · 第39篇水地》 — https://zh.wikisource.org/wiki/管子/第39篇水地</p></article></main></div></div>
