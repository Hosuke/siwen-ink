    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 已焉哉天實為之</nav></header><main><article><h1>已焉哉天實為之</h1><p>事既無可奈何，乃歸之於天，聽其自然。</p><p>《北門》之詩凡三章，章終皆云「已焉哉，天實為之，謂之何哉」。此詩人自知其命，無如之何，乃推之於天者也。夫人之處逆境，或由己之不敏，或由人之不察，然亦有明知其然而不能免者。於此之時，既不可以力爭，又不可以言免，唯有一切歸之於天已然之命，曰「已焉哉」以自解。天實為之，人將如之何？此非自暴自棄，乃知命而不尤也。</p><p><strong>所出</strong>：《詩經 · 北門》 — https://zh.wikisource.org/wiki/詩經/北門</p></article></main></div></div>
