    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不芸之害</nav></header><main><article><h1>不芸之害</h1><p>宜芸而不芸，百草存則民危。</p><p>宜芸而不芸，百草皆存，民以僅存，不芸之害也。</p><p>言農時之不可失也。芸，除草也。春耕而後，苗已發育，若不及時芸草，則百草與苗爭肥，禾稼日耗，民將僅以存活。故不芸之害，在於耗損民食也。</p><p><strong>所出</strong>：《管子 · 第85篇輕重己》 — https://zh.wikisource.org/wiki/管子/第85篇輕重己</p></article></main></div></div>
