    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 赫赫厥聲濯濯厥靈</nav></header><main><article><h1>赫赫厥聲濯濯厥靈</h1><p>盛美之名聲，光明之靈威。</p><p>赫赫厥聲，濯濯厥靈。</p><p>赫赫者，盛明煊赫之貌；厥聲，其名聲也。濯濯，光明清朗之貌；厥靈，其威靈也。言高宗武丁之德業，其聲名赫奕而光顯，其威靈昭明而煊著。</p><p>此[[殷武]]頌美商王之辭。赫赫狀其功烈之盛，濯濯狀其威靈之清。二義相承，先言聲名播於遠邇，繼言威靈著於幽明，皆盛美之辭也。</p><p><strong>所出</strong>：《詩經 · 殷武》 — https://zh.wikisource.org/wiki/詩經/殷武</p></article></main></div></div>
