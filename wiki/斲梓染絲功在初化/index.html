    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 斲梓染絲，功在初化</nav></header><main><article><h1>斲梓染絲，功在初化</h1><p>治材染色之事，成於初始；人才學風亦然，奠基之初最關緊要。</p><p>夫才由天資，學慎始習。斲梓染絲，功在初化，成則難可翻移。故童子雕琢，必先雅製。蓋木材未斲、絲帛未染之時，易於塑造；一旦成綵定形，則不可改易。學者之初，薰習最要先定雅正，若初始失正，則後來難返。故宜沿根討葉，使思轉自圓，庶幾得之。</p><p><strong>所出</strong>：《文心雕龍 · 體性》 — https://zh.wikisource.org/wiki/文心雕龍/體性</p></article></main></div></div>
