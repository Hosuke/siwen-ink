    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 予有臣三千，惟一心</nav></header><main><article><h1>予有臣三千，惟一心</h1><p>周之臣少而心一，故能以寡敵眾。</p><p>予有臣三千，惟一心。</p><p>周之臣不多，而心同德協，故能以三千之眾敵億萬之師也。言德義之可行，不在徒多也。</p><p><strong>所出</strong>：《尚書 · 泰誓上》 — https://zh.wikisource.org/wiki/尚書/泰誓上</p></article></main></div></div>
