    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天馬</nav></header><main><article><h1>天馬</h1><p>烏孫大宛之良馬，漢天子甚重之</p><p>初，天子發書易，云「神馬當從西北來」。得烏孫馬好，名曰「天馬」。及得大宛汗血馬，益壯，更名烏孫馬曰「西極」，名大宛馬曰「天馬」云。</p><p>宛以西，皆自以遠，尚驕恣晏然。俗嗜酒，馬嗜[[蒲陶|苜蓿]]。漢使取其實來，於是天子始種苜蓿、蒲陶肥饒地。及天馬多，外國使來眾，則離宮別觀旁盡種蒲萄、苜蓿極望。</p><p><strong>所出</strong>：《史記 · 卷123》 — https://zh.wikisource.org/wiki/史記/卷123</p></article></main></div></div>
