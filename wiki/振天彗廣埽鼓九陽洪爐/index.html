    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 振天彗廣埽鼓九陽洪爐</nav></header><main><article><h1>振天彗廣埽鼓九陽洪爐</h1><p>中興之世，當廣施教化，陶冶庶類，致太平之治。</p><p>《抱朴子》論中興之治：「振天彗以廣埽，鼓九陽之洪爐，運大鈞乎皇極，開玄模以軌物。陶冶庶類，匠成翹秀，蕩汰積埃，革邪反正。戢幹戈，橐弓矢，興辟雍之庠序，集國子，修文德，發金聲，振玉音。」</p><p>如此則[[寒暑代謝否終則泰|否終則泰]]，玄流沾於九垓，惠風被乎無外，[[五刑厝而頌聲作]]，[[和氣洽而嘉禾遂生]]，不亦休哉！</p><p><strong>所出</strong>：《抱朴子 · 卷03》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷03</p></article></main></div></div>
