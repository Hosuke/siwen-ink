    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 玉華保真</nav></header><main><article><h1>玉華保真</h1><p>玉華精華，守護真氣，不為魔侵。</p><p>玉華保真者，玉華之精保祐真氣之功也。上清大洞第二十五章行道之效，曰「玉華保真，魔炁滅絕」。[[四大正明]]充布之，使玉華之精充護真氣，不為魔侵，[[七祖解脫]]，[[日中司命接生君]]守之於[[左手通真之戶死炁之門]]也。[[清齋]]致一，然後玉華敷榮，真氣乃全。</p><p><strong>所出</strong>：《上清大洞真經 · 25章》 — https://zh.wikisource.org/wiki/上清大洞真經/25章</p></article></main></div></div>
