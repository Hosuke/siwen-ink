    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 孝子仁人之掩其親</nav></header><main><article><h1>孝子仁人之掩其親</h1><p>葬親出於本性，非學而能，孝子掩親必有道</p><p>孟子言上世嘗有不葬其親者，其親死委之壑壑，他日過之，狐貍食之，蠅蚋姑嘬之，其顙有泚，睨而不視。蓋歸反虆梩而掩之，掩之誠是也。孝子仁人之掩其親，亦必有道矣，非夷子之所能易也。</p><p><strong>所出</strong>：《孟子 · 滕文公上》 — https://zh.wikisource.org/wiki/孟子/滕文公上</p></article></main></div></div>
