    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 口銜日光手執月明</nav></header><main><article><h1>口銜日光手執月明</h1><p>太一尊神口銜日光、手執月明，照兆死戶，使兆長生。</p><p>口銜日光手執月明者，太一尊神之所以照兆死戶者也。</p><p>經云：「太一尊神備守致真，口銜日光，手執月明，照兆死戶，使兆長生。」蓋日光者陽，月明者陰，太一尊神兼之，故能照死戶為生門。</p><p>經又云「我體自在」，謂誦者既得七神守護，則形神自在，長生可冀。</p><p><strong>所出</strong>：《上清大洞真經 · 35章》 — https://zh.wikisource.org/wiki/上清大洞真經/35章</p></article></main></div></div>
