    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 子囊</nav></header><main><article><h1>子囊</h1><p></p><p>荊人與吳人將戰，荊師寡，吳師眾，荊將軍子囊曰：「我與吳人戰，必敗。敗王師，辱王名，虧壤土，忠臣不忍為也。」不復於王而遁。至於郊，使人復於王曰：「臣請死。」王曰：「將軍之遁也，以其為利也。今誠利，將軍何死？」子囊曰：「遁者無罪，則後世之為王將者，皆依不利之名而效臣遁。若是則荊國終為天下撓。」遂伏劍而死。王曰：「請成將軍之義。」乃為之桐棺三寸，加斧鑕其上。子囊之節，非獨厲一世之人臣也。</p><p>  <strong>所出</strong>：《呂氏春秋 · 卷十九》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十九</p></article></main></div></div>
