    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 飛生上英</nav></header><main><article><h1>飛生上英</h1><p>心中一真天精液君之字，上清守心之神名。</p><p>飛生上英，心中一真天精液君之字也。主胸中四極之口、死炁之門，能令五藏生華光、四關受真炁、紫液流滿胸中。行道者存呼其名，可使神安宅、死炁消魔、百神寧和焉。</p><p><strong>所出</strong>：《上清大洞真經 · 19章》 — https://zh.wikisource.org/wiki/上清大洞真經/19章</p></article></main></div></div>
