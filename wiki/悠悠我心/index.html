    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 悠悠我心</nav></header><main><article><h1>悠悠我心</h1><p>思念深遠，綿綿不絕之謂。</p><p>「悠悠我心」，心念悠遠而不能已之貌。曹操〈短歌行〉援引此句以喩求賢之切，然《子衿》本義乃女子對所懷之人深切的思念。悠悠者，時間之漫長與思緒之縈迴兼而有之。</p><p><strong>所出</strong>：《詩經 · 子衿》 — https://zh.wikisource.org/wiki/詩經/子衿</p></article></main></div></div>
