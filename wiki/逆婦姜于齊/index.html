    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 逆婦姜于齊</nav></header><main><article><h1>逆婦姜于齊</h1><p>逆，迎也。魯文公自晉迎婦姜於齊。</p><p>「逆婦姜于齊」，逆者，迎也。魯文公之妃姜氏，自齊國來嫁，迎之於境上也。《春秋》書「逆」，所以明昏禮之始，正婚姻之始。</p><p>昏禮者，禮之本也。納采、問名、納吉、納徵、請期、親迎，皆所以重夫婦之義也。迎而不書，非所以正其始矣。</p><p><strong>所出</strong>：《春秋公羊傳 · 文公》 — https://zh.wikisource.org/wiki/春秋公羊傳/文公</p></article></main></div></div>
