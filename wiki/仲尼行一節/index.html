    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 仲尼行一節</nav></header><main><article><h1>仲尼行一節</h1><p>晏子言仲尼處君子中不及舜，以其行一節故。</p><p>景公出田，顧而問晏子曰：「若人之眾，則有孔子焉乎？」晏子對曰：「有孔子焉則無有，若舜焉則嬰不識。」公曰：「孔子之不逮舜為間矣，曷為有孔子焉則無有，若舜焉則嬰不識？」晏子對曰：「是乃孔子之所以不逮舜。孔子行一節者也。處民之中，其過之識，況處君子之中乎！舜者處民之中，則自齊乎士；處君子之中，則齊乎君子；上與聖人，則固聖人之林也。此乃孔子之所以不逮舜也。」</p><p><strong>所出</strong>：《晏子春秋 · 卷八》 — https://zh.wikisource.org/wiki/晏子春秋/卷八</p></article></main></div></div>
