    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 道而弗牽</nav></header><main><article><h1>道而弗牽</h1><p>教人當引導之而不強拽之，使學者樂於趨道。</p><p>君子之教，喻也。道而弗牽，強而弗抑，開而弗達。</p><p>道而弗牽，則和。導之使趨於道，而不強拽以使之，若牛之就牧而順，非繩索之所能拘也。學者樂之而不苦，則心悅而誠服，其進也速。</p><p>若夫牽之太甚，則學者苦之而厭之，雖勉於一時，終必去之也。故道之云者，示以塗徑，使自趣焉，非驅之使不得不往也。</p><p><strong>所出</strong>：《禮記 · 學記》 — https://zh.wikisource.org/wiki/禮記/學記</p></article></main></div></div>
