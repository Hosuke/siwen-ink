    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 哀之發於容體</nav></header><main><article><h1>哀之發於容體</h1><p>居喪之容，隨喪服之差而異。</p><p>居喪之容，視喪服輕重以為節。斬衰之貌若苴，齊衰若枲，大功若止，小功緦麻則容貌可也。苴者，惡貌，乃麻之有蕁者，其色蒼黑，所以象孝子內心之愁痛而見諸外也。枲者，藍之屬，其色蒼白，次于苴。止者，言其容止安靜，不若苴之甚也。此五服之差，哀之發於容體者然也。</p><p><strong>所出</strong>：《禮記 · 間傳》 — https://zh.wikisource.org/wiki/禮記/間傳</p></article></main></div></div>
