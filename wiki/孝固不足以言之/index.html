    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 孝固不足以言之</nav></header><main><article><h1>孝固不足以言之</h1><p>至仁之境，尚矣，孝不足以言。</p><p>大宰曰：「蕩聞之，無親則不愛，不愛則不孝。謂至仁不孝，可乎？」莊子曰：「不然，夫至仁尚矣，孝固不足以言之。」</p><p><strong>所出</strong>：《莊子 · 天運》 — https://zh.wikisource.org/wiki/莊子/天運</p></article></main></div></div>
