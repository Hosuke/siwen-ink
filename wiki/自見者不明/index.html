    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 自見者不明</nav></header><main><article><h1>自見者不明</h1><p>自見者不能明亮，以其在道為餘食贅行也。</p><p>（24）</p><p>[[自見不明]]之異文也。帛書作「自見者不明」。</p><p>[[亓在道也]]，自見者不明於道，[[餘食赘行]]，[[物或惡之]]。[[有欲者弗居]]焉。</p><p>自見者，獨守己見、自眩其所知也。夫如是，則物我不能照見，道不能大明。故物與道皆惡之。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第六十六章 弗居》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
