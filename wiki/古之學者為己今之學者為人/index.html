    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 古之學者為己，今之學者為人</nav></header><main><article><h1>古之學者為己，今之學者為人</h1><p>古之學為己，內美其身；今之學為人，外夸於世。</p><p>古之學者為己，今之學者為人。君子之學也，以美其身；小人之學也，以為禽犢。故不問而告謂之傲，問一而告二謂之囋。傲，非也；囋，非也；君子如嚮矣。</p><p><strong>所出</strong>：《荀子 · 勸學篇》 — https://zh.wikisource.org/wiki/荀子/勸學篇</p></article></main></div></div>
