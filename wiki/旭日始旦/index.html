    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 旭日始旦</nav></header><main><article><h1>旭日始旦</h1><p>朝日初升，黎明之時，以喻明時當有文明之化。</p><p>「旭日始旦」，《匏有苦葉》句也。旭日，旦明之象。黎明之際，光明初見，萬物將作。詩言昏禮宜及氷泮，正月令昏姻之期，猶旭日之始，時不可失也。</p><p><strong>所出</strong>：《詩經 · 匏有苦葉》 — https://zh.wikisource.org/wiki/詩經/匏有苦葉</p></article></main></div></div>
