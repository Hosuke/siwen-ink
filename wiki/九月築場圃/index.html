    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 九月築場圃</nav></header><main><article><h1>九月築場圃</h1><p>九月斂穀，築場以納禾稼也。</p><p>[[六月食鬱及薁]]，[[七月亨葵及菽]]，[[八月剝棗]]，[[十月隕蘀]]，歲事將成。[[九月築場圃]]，[[十月納禾稼]]，[[授衣]]既竟，而後場圃功畢也。</p><p><strong>所出</strong>：《詩經 · 七月》 — https://zh.wikisource.org/wiki/詩經/七月</p></article></main></div></div>
