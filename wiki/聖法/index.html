    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖法</nav></header><main><article><h1>聖法</h1><p>聖人治出於己，聖法治出於理；聖人獨治，不如聖法無不治。</p><p>田子讀書，曰：「堯時太平。」宋子曰：「聖人之治以致此乎？」彭蒙越次答曰：「聖法之治以至此，非聖人之治也。」宋子曰：「聖人與聖法，何以異？」彭蒙曰：「子之亂名，甚矣！聖人者，自己出也。聖法者，自理出也。理出於己，己非理也；己能出理，理非己也。故聖人之治，獨治者也；聖法之治，則無不治矣！此萬物之利，唯聖人能該之。」</p><p><strong>所出</strong>：《尹文子 · 大道下》 — https://zh.wikisource.org/wiki/尹文子/大道下</p></article></main></div></div>
