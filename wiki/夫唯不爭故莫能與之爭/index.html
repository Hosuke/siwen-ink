    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 夫唯不爭故莫能與之爭</nav></header><main><article><h1>夫唯不爭故莫能與之爭</h1><p>不與人爭者，人亦莫能與之爭。</p><p>夫唯不爭，故莫能與之爭。爭者起於有私，不爭者本乎無我。聖人執一無為，無可爭之端，故天下莫能與之爭。此天道之謙、聖人之讓，而萬物莫能抗之也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第六十七章 執一》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
