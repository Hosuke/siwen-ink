    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無益無損</nav></header><main><article><h1>無益無損</h1><p>因應之道，無所增減，乃聖人與物相接之法。</p><p>無益無損，此因之術也。因者，因其能者，言所用也。[[因其能者言所用]]，以其形，因為之名，因之術也。[[舍己而以物為法]]，感而後應，非所設也；緣理而動，非所取也。因也者，[[淵囿]]深廣，物至則應，過則舍矣。舍矣者，言復所於虛也。</p><p><strong>所出</strong>：《管子 · 第36篇心術上》 — https://zh.wikisource.org/wiki/管子/第36篇心術上</p></article></main></div></div>
