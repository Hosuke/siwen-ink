    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 有道之君</nav></header><main><article><h1>有道之君</h1><p>述有道之君敬天福民、內外均和之治象。</p><p>有道之君，敬其山川、宗廟、社稷，及至先故之大臣，收聚以忠而大富之。固其武臣，宣用其力。聖人在前，貞廉在側，競稱於義，上下皆飾。形正明察，四時不貸，民亦不憂，五穀蕃殖。外內均和，諸侯臣伏，國家安寧，不用兵革。受其幣帛，以懷其德；昭受其令，以為法式。</p><p>此所謂有道之君也。</p><p><strong>所出</strong>：《管子 · 第33篇四稱》 — https://zh.wikisource.org/wiki/管子/第33篇四稱</p></article></main></div></div>
