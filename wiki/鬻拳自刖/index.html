    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鬻拳自刖</nav></header><main><article><h1>鬻拳自刖</h1><p>鬻拳強諫楚子，楚子弗從，臨之以兵，懼而自刖，君子以爲愛君。</p><p>十九年春，楚子禦之，大敗於津。還，鬻拳弗納。遂伐黃，敗黃師於碏陵。還，及湫，有疾。夏六月庚申卒，鬻拳葬諸夕室，亦自殺也，而葬於絰皇。</p><p>初，鬻拳強諫楚子，楚子弗從，臨之以兵，懼而從之。鬻拳曰：「吾懼君以兵，罪莫大焉。」遂自刖也。楚人以爲大閽，謂之大伯，使其後掌之。君子曰：「鬻拳可謂愛君矣，諫以自納于刑，刑猶不忘納君於善。」</p><p><strong>所出</strong>：《春秋左氏傳 · 莊公》 — https://zh.wikisource.org/wiki/春秋左氏傳/莊公</p></article></main></div></div>
