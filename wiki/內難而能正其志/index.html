    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 內難而能正其志</nav></header><main><article><h1>內難而能正其志</h1><p>身處其難而心不失正，箕子之明夷也。</p><p>「內難而能正其志，箕子以之。」明夷之世，或傷於外，或困於內。內難者，骨肉之間有患難也；正其志者，不以患難而渝其心也。箕子佯狂以全身，終守其正而不變，故易辭以明夷歸之，以見艱貞之極也。</p><p><strong>所出</strong>：《周易 · 明夷》 — https://zh.wikisource.org/wiki/周易/明夷</p></article></main></div></div>
