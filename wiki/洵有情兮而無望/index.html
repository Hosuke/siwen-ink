    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 洵有情兮而無望兮</nav></header><main><article><h1>洵有情兮而無望兮</h1><p>情有所鍾而勢無可望，以刺陳侯之淫而不可止。</p><p>情者，人之所不能已也；望者，期以待之也。《宛丘》首章云「子之湯兮，宛丘之上兮，洵有情兮，而無望兮」，情與望對舉，而見其心之戚戚焉。</p><p>「洵」，信也。情則誠有之，然陳侯荒淫昏亂，無可企望，故「無望」。望字從月，疑借為「忘」，言其放蕩忘返也；或以為「無望」即無復希望，見其溺情之深而不可拔。詩人以此矛盾之言，寫陳侯之迷戀宛丘不能自己，而歸於淫荒昏亂，序詩者所以刺之也。</p><p><strong>所出</strong>：《詩經 · 宛丘》 — https://zh.wikisource.org/wiki/詩經/宛丘</p></article></main></div></div>
