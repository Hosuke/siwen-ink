    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 千里之足困於鹽車</nav></header><main><article><h1>千里之足困於鹽車</h1><p>良馬困於運鹽之役，良刀不入工匠之門，以喻賢才困於卑位。</p><p>所謂千里之足，困於鹽車之下；赤刀之礦，不經歐冶之門者也。</p><p><strong>所出</strong>：《抱朴子 · 卷04》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷04</p></article></main></div></div>
