    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以禮分施</nav></header><main><article><h1>以禮分施</h1><p>為君以禮分施無偏，為臣以禮侍君忠順</p><p>請問為人君？曰：以禮分施，均遍而不偏。請問為人臣？曰：以禮侍君，忠順而不懈。請問為人父？曰：寬惠而有禮。請問為人子？曰：敬愛而致文。請問為人兄？曰：慈愛而見友。請問為人弟？曰：敬詘而不苟。請問為人夫？曰：致功而不流，致臨而有辨。請問為人妻？曰：夫有禮則柔從聽侍，夫無禮則恐懼而自竦也。此道也，偏立而亂，俱立而治，其足以稽矣。</p><p><strong>所出</strong>：《荀子 · 君道篇》 — https://zh.wikisource.org/wiki/荀子/君道篇</p></article></main></div></div>
