    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 先順民心</nav></header><main><article><h1>先順民心</h1><p>聖王治天下，必先順民之所欲，功名自成。</p><p>先王先順民心，故功名成。夫以德得民心以立大功名者，上世多有之矣。失民心而立功名者，未之曾有也。得民必有道，萬乘之國，百戶之邑，民無有不說。取民之所說而民取矣，民之所說豈眾哉？此取民之要也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷九》— https://zh.wikisource.org/wiki/呂氏春秋/卷九</p></article></main></div></div>
