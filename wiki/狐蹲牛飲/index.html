    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 狐蹲牛飲</nav></header><main><article><h1>狐蹲牛飲</h1><p>宴飲無狀，如狐之蹲、牛之飲，失禮甚矣。</p><p>及好會，則狐蹲牛飲，爭食競割。掣撥渺摺，無復廉恥，以同此者為泰，以不爾者為劣。終日無及義之言，徹夜無箴規之益。</p><p>夫飲食之禮，聖人重之。及其失礼，則如禽獸之無別。[[宴禮]]之設，所以明尊卑、序長幼、定上下也。今也不然，徒以酣飲為樂，以爭食為常，豈非禮之亡乎！</p><p><strong>所出</strong>：《抱朴子 · 卷25》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷25</p></article></main></div></div>
