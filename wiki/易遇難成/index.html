    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 易遇難成</nav></header><main><article><h1>易遇難成</h1><p>旁門小法易遇而難成，金丹大道難遇而易成。</p><p>[[悟真篇]]序明辨二途，云：「如鍊五芽之氣，服七耀之光，注想按摩，納清吐濁，念經持呪，噀水叱符，叩齒集神，休妻絶粒，存神閉息，運眉問之思補腦還精，習房中之術以至服鍊金石草木之類，皆易遇而難成。」惟金丹一法，難遇而易成，「成道者皆因鍊金丹而得」焉。</p><p><strong>所出</strong>：《悟真篇》 — https://zh.wikisource.org/wiki/悟真篇</p></article></main></div></div>
