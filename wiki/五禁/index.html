    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五禁</nav></header><main><article><h1>五禁</h1><p>刺有五禁，據日干以禁刺部位。</p><p>甲乙日自乘，無刺頭，無發矇於耳內。丙丁日自乘，無振埃於肩喉廉泉。戊己日自乘四季，無刺腹去爪寫水。庚辛日自乘，無刺關節於股膝，壬癸日自乘，無刺足脛，是謂五禁。</p><p><strong>所出</strong>：《黃帝內經 · 靈樞第九卷》 — https://zh.wikisource.org/wiki/黃帝內經/靈樞第九卷</p></article></main></div></div>
