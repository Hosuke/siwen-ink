    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 孝子用心感動皇極</nav></header><main><article><h1>孝子用心感動皇極</h1><p>孝子以誠心感動上天，其言近出己口而流布殊域，吉凶之來由乎胸臆。</p><p>孝子用心，感動皇極。近出己口，遠流殊域。或以召禍，或以至福，或造太平，或造兵革。</p><p>心者，身之主也；言者，心之發也。孝子之心至誠，故能感動[[皇極]]，[[天佑下民作之君師]]之義也。近出己口，言不足以遠播；而遠流殊域者，心感之也。心之於言，猶根之於枝，心正而言善，福自至焉；心邪而言惡，禍自隨焉。[[四者之來，由乎胸臆]]，此之謂也。</p><p><strong>所出</strong>：《周易參同契 · 17章》 — https://zh.wikisource.org/wiki/周易參同契/17章</p></article></main></div></div>
