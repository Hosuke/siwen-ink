    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 有厲利已</nav></header><main><article><h1>有厲利已</h1><p>躁進有危，止而不前則利。</p><p>初九「有厲利已」，言陽爻居賤位，時方畜之初，躁進則危，知止乃利。已，止也。聖人戒之於早，審時度勢，不妄動也。</p><p><strong>所出</strong>：《周易 · 大畜》 — https://zh.wikisource.org/wiki/周易/大畜</p></article></main></div></div>
