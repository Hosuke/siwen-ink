    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 城成周三旬而畢</nav></header><main><article><h1>城成周三旬而畢</h1><p>魏舒合諸侯大夫城成周三旬而畢。</p><p>元年春，王正月，辛巳，晉魏舒合諸侯之大夫于狄泉，將以城成周。魏子蒞政。衛彪傒曰：「將建天子，而易位以令，非義也。大事奸義，必有大咎。晉不失諸侯，魏子其難免乎。」孟懿子會城成周，庚寅，栽。宋仲幾不受功。士彌牟為之調度，三月，歸諸京師。城三旬而畢，乃歸諸侯之戌。</p><p><strong>所出</strong>：《春秋左氏傳 · 定公》 — https://zh.wikisource.org/wiki/春秋左氏傳/定公</p></article></main></div></div>
