    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 人最天下貴</nav></header><main><article><h1>人最天下貴</h1><p>人有氣、有生、有知，亦且有義，故最為天下貴。</p><p>水火有氣而無生，草木有生而無知，禽獸有知而無義，人有氣、有生、有知，亦且有義，故最為天下貴也。力不若牛，走不若馬，而牛馬為用，何也？曰：人能群，彼不能群也。人何以能群？曰：分。分何以能行？曰：義。故義以分則和，和則一，一則多力，多力則彊，彊則勝物；故宮室可得而居也。故序四時，裁萬物，兼利天下，無它故焉，得之分義也。</p><p><strong>所出</strong>：《荀子 · 王制篇》 — https://zh.wikisource.org/wiki/荀子/王制篇</p></article></main></div></div>
