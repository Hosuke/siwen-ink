    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 祁祁</nav></header><main><article><h1>祁祁</h1><p>舒遲之貌，祭祀既畢，從容歸還。</p><p>《采蘩》云「被之祁祁」。祁祁，與「徐徐」同義，舒緩之貌。與「僮僮」之盛高相對，祁祁言舒遲也。</p><p>祭祀既畢，夫人乃得歸家，其容舒緩，不似初時之盛飾急赴。此詩人敘事先後之序也。</p><p><strong>所出</strong>：《詩經 · 采蘩》 — https://zh.wikisource.org/wiki/詩經/采蘩</p></article></main></div></div>
