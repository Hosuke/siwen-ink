    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 何斯違斯</nav></header><main><article><h1>何斯違斯</h1><p>何此人離此而去也</p><p>「何斯違斯」，怨辭也。斯，此也。違，去也。言何為此人之故而離此而去也。「何斯」指君子，「違斯」指其所別之地。一問而情見，室家之怨慕備矣。</p><p>下章「莫敢或遑」「莫敢遑息」「莫或遑處」，迭言不敢暇豫，見其勤於王事而無日止也。</p><p><strong>所出</strong>：《詩經 · 殷其靁》 — https://zh.wikisource.org/wiki/詩經/殷其靁</p></article></main></div></div>
