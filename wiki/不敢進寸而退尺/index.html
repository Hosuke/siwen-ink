    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不敢進寸而退尺</nav></header><main><article><h1>不敢進寸而退尺</h1><p>退讓者守，取者亡。</p><p>「不敢進寸而退尺」，言師出無名、輕犯天理者，必至於敗也。</p><p>用兵之害，啟於輕敵；輕敵之原，生於貪進。寸有所長，尺有所短，進寸者不知止，退尺者善保身。《孫子》曰「知彼知己」，又曰「百戰百勝，非善之善者也；不戰而屈人之兵，善之善者也」，與此義合。</p><p>河上公以「不敢」二字為全篇眼目，主客之辨、進退之分，皆本於不敢。不敢則能守，能守則無失。</p><p><strong>所出</strong>：《老子河上公章句 · 玄用》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
