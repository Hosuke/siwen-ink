    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 誠全而歸之</nav></header><main><article><h1>誠全而歸之</h1><p>行曲從者實其身，歸之父母，無有傷害。</p><p>誠，實也。能行曲從者，實其肌體，歸之於父母，無有傷害也。</p><p>[[誠全而歸之]]，[[古之所謂曲則全者]]之驗也。曲己以從親，曲己以從兄，曲己以從長，不[[自見]]不[[自是]]不[[自伐]]，全其身以全其親，此[[孝治]]之本與。</p><p><strong>所出</strong>：《老子河上公章句 · 益謙》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
