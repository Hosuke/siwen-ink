    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 敷德</nav></header><main><article><h1>敷德</h1><p>敷布大德於天下。</p><p>王言「惟文王、武王，敷大德于天下，用克受殷命」。言文、武二王敷布其大德於天下，天下歸心，故天命歸周，受殷之命也。</p><p><strong>所出</strong>：《尚書 · 畢命》 — https://zh.wikisource.org/wiki/尚書/畢命</p></article></main></div></div>
