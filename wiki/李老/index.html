    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 李老</nav></header><main><article><h1>李老</h1><p></p><p>李老世業醫，善鼓琴，自言得嵇康之妙。因醉誤墜枯井，行至洞門，題曰玄都洞。見道士使鼓琴，奏廣陵散操，道士曰：「爾所製也，叔夜即爾前身。」命酌石髓飲之，又抽架上素書，乃療治三十六種風白丸子方。道士曰：「將歸配合，遍療世人，功滿此來。」令閉目，乃在青州北門外。到家，妻子已除服矣。乃唐僖宗乾符三年，遂合藥治病無不愈。後數年不喜食，乃斷穀。因訪枯井，一旦不歸，疑得路而仙去矣。</p><p>  <strong>所出</strong>：《歷世真仙體道通鑑 · 44》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/44</p></article></main></div></div>
