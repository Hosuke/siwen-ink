    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 秩秩大猷</nav></header><main><article><h1>秩秩大猷</h1><p>聖人制治之大法</p><p>秩秩大猷，聖人莫之。</p><p>秩秩者，次序分明也；大猷者，治國之大經大法也。言祖宗舊章、聖人大法，秩然有序，聖人猶當謹守而莫之敢易也。與[[奕奕寢廟]]一章相承，皆言先王之制作不可輕動。《大學》引「無側俊」，亦同此意。治道貴有常，紀綱貴不紊，此之謂也。</p><p><strong>所出</strong>：《詩經 · 巧言》 — https://zh.wikisource.org/wiki/詩經/巧言</p></article></main></div></div>
