    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 納采用鴈</nav></header><main><article><h1>納采用鴈</h1><p>納采之禮，以鴈為摯，取其不失節、不改嫁之義。</p><p>納采，用鴈。</p><p>鴈者，陰陽之鳥，嫁娶所執，以象禮焉。《白虎通義》雲：「取鴈者，取其隨時而南北，不失節也。又取其嫁娶以鴈為禮者，示嫁娶須媒氏，無自專之道。」</p><p>納采之時，使者執鴈，以為摯物。主人受之，昏禮于是定矣。</p><p><strong>所出</strong>：《儀禮 · 士昬禮》 — https://zh.wikisource.org/wiki/儀禮/士昬禮</p></article></main></div></div>
