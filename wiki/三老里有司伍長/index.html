    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三老里有司伍長</nav></header><main><article><h1>三老里有司伍長</h1><p>城鄉各有什伍之制，三老里有司伍長相統率，以行教化、備水器。</p><p>管仲論置水官及備水之器曰：「水官亦以甲士當被兵之數，與三老里有司伍長行里，因父母案行閱具備水之器。」又云：「常以冬日，順三老里有司伍長，以冬賞罰，使各應其賞而服其罰，五者不可害，則君之法犯矣。」言基層組織什伍相保，三老里有司伍長導民以行水事、備水器，賞罰以率之，此[[令民為什伍]]之意也。</p><p><strong>所出</strong>：《管子 · 第57篇度地》 — https://zh.wikisource.org/wiki/管子/第57篇度地</p></article></main></div></div>
