    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖王以人性惡而起治道</nav></header><main><article><h1>聖王以人性惡而起治道</h1><p>性惡故需聖王之化、禮義之教、刑罰之禁。</p><p>古者聖王以人性惡，以為偏險而不正，悖亂而不治，是以為之起禮義、制法度，以[[禮與法表裏|飾]]人之情性而正之，以[[澡身浴德|擾化]]人之情性而導之也。若使去君上之埶，無禮義之化，去法正之治，無刑罰之禁，倚而觀天下民人之相與，則彊者害弱而奪之，衆者暴寡而譁之，天下悖亂而相亡不待頃矣。[[霸王之器]]，正為治此性惡之民也。</p><p><strong>所出</strong>：《荀子 · 性惡篇》 — https://zh.wikisource.org/wiki/荀子/性惡篇</p></article></main></div></div>
