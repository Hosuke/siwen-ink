    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 閶闔風</nav></header><main><article><h1>閶闔風</h1><p>閶闔風居西方，陽氣收藏，九月律中無射。</p><p>閶闔風居西方。閶者，倡也；闔者，藏也。言陽氣道萬物，闔黃泉也。其於十母為庚辛。庚者，言陰氣庚萬物，故曰庚；辛者，言萬物之辛生，故曰辛。北至於胃。胃者，言陽氣就藏，皆胃胃也。北至於婁。婁者，呼萬物且內之也。北至於奎。奎者，主毒螫殺萬物也，奎而藏之。九月也，律中無射。</p><p>閶闔之義，開而復闔。陽氣至此而入於黃泉，萬物收殺，以待來歲。庚之言更，辛之言新，陽氣更代而新生之機伏焉。</p><p><strong>所出</strong>：《史記 · 卷025》 — https://zh.wikisource.org/wiki/史記/卷025</p></article></main></div></div>
