    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 承天而行</nav></header><main><article><h1>承天而行</h1><p>五運承天而行，無妄動，無不應；卒然而動，乃氣之交變，則不應焉。</p><p>承天而行之，故無妄動，無不應也。卒然而動者，氣之交變也，其不應焉。故曰：「應常不應卒。」</p><p>五星之行，以道留久，逆守而小，是謂省下；以道而去，去而速來，曲而過之，是謂省遺過也；久留而環，或離或附，是謂議災與其德也。應近則小，應遠則大。</p><p><strong>所出</strong>：《黃帝內經 · 素問第二十卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第二十卷</p></article></main></div></div>
