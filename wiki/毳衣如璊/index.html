    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 毳衣如璊</nav></header><main><article><h1>毳衣如璊</h1><p>細毛之衣色如赤玉，見男子之情摯。</p><p>「毳衣如璊」，璊，赤玉也。[[毳衣如菼]]言其色青白，此言其色赤，衣之有色可見，而情之有義可知。[[畏子不敢]]者，女子欲奔而不敢；[[畏子不奔]]者，欲奔而竟不奔也。一「不敢」、一「不奔」，[[死則同穴]]之誓愈深，則可知其情愈摯矣。</p><p><strong>所出</strong>：《詩經 · 大車》 — https://zh.wikisource.org/wiki/詩經/大車</p></article></main></div></div>
