    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鄭武公伐胡</nav></header><main><article><h1>鄭武公伐胡</h1><p>鄭武公以女妻胡君以娛其意，乃問群臣伐胡，大夫關其思言可伐，武公戮之，胡遂不備，鄭人襲取之。</p><p>昔者鄭武公欲伐胡，故先以其女妻胡君以娛其意。因問於群臣：「吾欲用兵，誰可伐者？」大夫關其思對曰：「胡可伐。」武公怒而戮之，曰：「胡，兄弟之國也。子言伐之，何也？」胡君聞之，以鄭為親己，遂不備鄭。鄭人襲胡，取之。</p><p><strong>所出</strong>：《韓非子 · 說難》 — https://zh.wikisource.org/wiki/韓非子/說難</p></article></main></div></div>
