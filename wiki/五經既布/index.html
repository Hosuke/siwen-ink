    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五經既布</nav></header><main><article><h1>五經既布</h1><p>德、義、禮、法、權五者既行，繼以逐姧民、詰詐僞、屏讒慝、禁淫辭。</p><p>故曰：五經既布，然後逐姧民，詰詐僞，屏讒慝，而毋聽淫辭，毋作淫巧。</p><p>若民有淫行邪性，樹爲淫辭，作爲淫巧，以上諂君上，而下惑百姓，移國動衆，以害民務者，其刑死流。</p><p>故曰：凡人君之所以內失百姓，外失諸侯，兵挫而地削，名卑而國虧，社稷滅覆，身體危殆，非生於諂淫者，未之嘗聞也。</p><p><strong>所出</strong>：《管子 · 第10篇五輔》 — https://zh.wikisource.org/wiki/管子/第10篇五輔</p></article></main></div></div>
