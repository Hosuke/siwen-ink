    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 被</nav></header><main><article><h1>被</h1><p>祭祀時佩戴之假髮。</p><p>《采蘩》云「被之僮僮」。按《周禮》，此「被」指髲鬄，音必剃，乃假髮之謂。祭祀之時，婦女所佩戴之假髮飾也。</p><p>被之於首，以象髮之盛。祭祀大事，衣冠必整，故夫人被髮以飾威儀。</p><p><strong>所出</strong>：《詩經 · 采蘩》 — https://zh.wikisource.org/wiki/詩經/采蘩</p></article></main></div></div>
