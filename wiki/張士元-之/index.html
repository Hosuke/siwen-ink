    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 張士元-之</nav></header><main><article><h1>張士元-之</h1><p></p><p>真人張士元字仲良，[[張順]]之長子。少博習群書，年四十餘始學道。習夜坐，久之能通臂上下，出入如飛。以符法傳人治病，能種桃李頃刻而實。時君聞其有道，屢以美官徵之，固辭不起。終於家，年九十二。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 19》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/19</p></article></main></div></div>
