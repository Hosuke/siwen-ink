    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 在中饋</nav></header><main><article><h1>在中饋</h1><p>主中饋者，柔順持家，無私遂己意，守正以吉。</p><p>在中饋，[[周易 · 家人]]六二爻辭也。</p><p>六二陰爻陰位，居下卦之中，上應九五，有柔順承陽之德。「無攸遂」，言無私遂己意也；「在中饋」，言居中饋食以奉祭祀也。柔順以從夫，不專遂其志，而以中正持家，祭祀以時，飲食以禮，是為貞吉。</p><p>六二之吉，順以巽也。順者，柔而下之；巽者，入而申之。居中得正，柔而能行，此女子之正道焉。</p><p><strong>所出</strong>：《周易 · 家人》 — https://zh.wikisource.org/wiki/周易/家人</p></article></main></div></div>
