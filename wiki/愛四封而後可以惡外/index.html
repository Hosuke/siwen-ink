    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 愛四封之內而後可以惡竟外之不善者</nav></header><main><article><h1>愛四封之內而後可以惡竟外之不善者</h1><p>治國當先安內，而後可以攘外。</p><p>[[桓公]]欲誅大國之不道者，[[管仲]]對曰：「愛四封之內，而后可以惡竟外之不善者。安卿大夫之家，而后可以危救敵之國。賜小國地，而后可以誅大國之不道者。舉賢良，而后可以廢慢法鄙賤之民。」此言先內後外、先近後遠之序。</p><p><strong>所出</strong>：《管子 · 第19篇中匡》 — https://zh.wikisource.org/wiki/管子/第19篇中匡</p></article></main></div></div>
