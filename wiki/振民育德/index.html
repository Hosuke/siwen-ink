    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 振民育德</nav></header><main><article><h1>振民育德</h1><p>君子觀風象以振民、育德。</p><p>君子觀山下有風之象，知風以動之，乃振起民心、涵養德行。風行於山下发舒振迅，猶教化之鼓動萬民也。</p><p><strong>所出</strong>：《周易 · 蠱》 — https://zh.wikisource.org/wiki/周易/蠱</p><hr><p>雷出地奮豫，先王以作樂崇德，殷荐之上帝以配祖考。振起其民，涵育其德，樂之化也。
<strong>所出</strong>：《周易註 (王弼) · 卷02》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷02</p></article></main></div></div>
