    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 解其芬</nav></header><main><article><h1>解其芬</h1><p>道能解人之分爭。</p><p>解亓芬。道之於物，能解其芬撗。芬者，擕攘紛爭之貌。人有是非之辨，則有怨結；道以無為化之，使各遂其性，不相奪競，故曰解芬。</p><p><strong>所出</strong>：《老子 (帛書本) · 章四》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
