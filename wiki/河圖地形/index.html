    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 河圖地形</nav></header><main><article><h1>河圖地形</h1><p>上觀河圖以察天符之文，下序地形以明萬物之序。</p><p>河圖洛書，或有神文書自然而出，或有神鳥狩持而來，吐文積累甚眾。[[太平經]]以為：[[天文]][[聖書]]賢人辭雖多，皆由聖賢各長一事，無能盡知洞極之道，故天出河圖洛書以為之備，使後世有以大全。</p><p>  河圖洛書，乃天運聖賢之闕，後世拘校之根原也。</p><p>  <strong>所出</strong>：《太平經 · 09》 — https://zh.wikisource.org/wiki/太平經/09</p></article></main></div></div>
