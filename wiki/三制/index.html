    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三制</nav></header><main><article><h1>三制</h1><p>天下之國，有制人者，有為人所制者，有不能相制者。</p><p>凡國有三制。有制人者，有為人之所制者，有不能制人、人亦不能制者。</p><p>何以知其然？德盛義尊而不好加名於人，人衆兵强而不以其國造難生患，天下有大事而好以其國後，如此者，制人者也。德不盛，義不尊，而好加名於人；人不衆，兵不强，而好以其國造難生患；恃與國，幸名利，如此者，人之所制也。人進亦進，人退亦退，人勞亦勞，人佚亦佚，進退勞佚，與人相胥，如此者，不能制人，人亦不能制也。</p><p><strong>所出</strong>：《管子 · 第12篇樞言》 — https://zh.wikisource.org/wiki/管子/第12篇樞言</p></article></main></div></div>
