    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 沙虱</nav></header><main><article><h1>沙虱</h1><p>沙虱入皮鑽骨，雨後晨暮踐之，治以針挑及諸藥。</p><p>抱朴子曰：「又有沙虱，水陸皆有，其新雨後及晨暮前，跋涉必著人，唯烈日草燥時，差稀耳。其大如毛髮之端，初著人，便入其皮裡，其所在如芒刺之狀，小犯大痛，可以針挑取之，正赤如丹，著爪上行動也。若不挑之，蟲鑽至骨，便周行走入身，其與射工相似，皆煞人。」</p><p><strong>所出</strong>：《抱朴子 · 卷17》 — https://zh.wikisource.org/wiki/抱朴子/卷17</p></article></main></div></div>
