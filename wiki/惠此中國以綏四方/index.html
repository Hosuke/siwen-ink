    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 惠此中國以綏四方</nav></header><main><article><h1>惠此中國以綏四方</h1><p>德澤加於京師，則四方綏安。</p><p>禮及身而行修，義及國而政明，能以禮挾而貴名白，天下願，令行禁止，王者之事畢矣。《詩》曰：「惠此中國，以綏四方。」[[天下歸之]]、 [[四方攸同]] 之義也。</p><p><strong>所出</strong>：《荀子 · 致士篇》 — https://zh.wikisource.org/wiki/荀子/致士篇</p></article></main></div></div>
