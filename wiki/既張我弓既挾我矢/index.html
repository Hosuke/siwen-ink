    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 既張我弓，既挾我矢</nav></header><main><article><h1>既張我弓，既挾我矢</h1><p>射獵之事，弓矢既備，蓄勢而發。</p><p>「張弓」者，開弓也。「挾矢」者，持矢於指間也。此言射獵之器已具，蓄勢待發。《儀禮·鄉射》有「挾三矢」之儀，是挾矢為射前必有之動作。詩人言「既張」「既挾」，見其從容整備，而不躁急也。</p><p><strong>所出</strong>：《詩經 · 吉日》 — https://zh.wikisource.org/wiki/詩經/吉日</p></article></main></div></div>
