    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鱉人</nav></header><main><article><h1>鱉人</h1><p>下士四人，掌取互物簎魚鱉龜蜃</p><p>鱉人，下士四人；府二人，史二人，徒十有六人。</p><p>掌取互物。以時簎魚、鱉、龜、蜃，凡貍物。</p><p>春獻鱉、蜃，秋獻龜、魚。祭祀，共螷、蠃、蚳，以授醢人。</p><p><strong>所出</strong>：《周禮 · 天官冢宰》 — https://zh.wikisource.org/wiki/周禮/天官冢宰</p></article></main></div></div>
