    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 窮達</nav></header><main><article><h1>窮達</h1><p>達者無窮愁，隱顯自由。</p><p>達之人無窮愁，愁之人少德修。榮枯兩途，一春一秋，吾亦兩居，[[隱顯自由]]。人命忙忙，達何足懽，窮何足歎！境可縛非英雄，命可安且[[閒玩]]。讀書養道，浩氣猶龍，[[顏淵]]點瑟，[[荷蕢]]丈人，皆同道也。抑或無心仕進，雲之出為霖雨，流之退訪松喬，何必自苦。</p><p><strong>所出</strong>：《張三丰先生全集 · 卷6》 — https://zh.wikisource.org/wiki/張三丰先生全集/卷6</p></article></main></div></div>
