    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 彈事</nav></header><main><article><h1>彈事</h1><p>魏晉以下，按劾之文別名。</p><p>後之彈事，迭相斟酌，惟新日用，而舊準弗差。然函人欲全，矢人欲傷，術在糾惡，勢必深峭。若能闢禮門以懸規，標義路以植矩，不必躁言醜句、詬病為切。當使理有典刑，辭有風軌，總法家之式，秉儒家之文，不畏彊禦，氣流墨中，乃稱絕席之雄、直方之舉。</p><p><strong>所出</strong>：《文心雕龍 · 奏啟》 — https://zh.wikisource.org/wiki/文心雕龍/奏啟</p></article></main></div></div>
