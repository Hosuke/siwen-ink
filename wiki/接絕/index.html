    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 接絕</nav></header><main><article><h1>接絕</h1><p>祠死事者之知識故人，使其名不絕也。</p><p>士民死上事、死戰事，當祠其人、慰其友。凡士民死於國事者，使其知識故人受資於上而祠之。掌祠者以時享祭，使為國死者有祠、死亡者不絕其祀。此之謂接絕，蓋為國捐軀者，當使其名聲存於後世、以勵來者也。</p><p><strong>所出</strong>：《管子 · 第54篇入國》 — https://zh.wikisource.org/wiki/管子/第54篇入國</p></article></main></div></div>
