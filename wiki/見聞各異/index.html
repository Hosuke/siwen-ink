    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 見聞各異</nav></header><main><article><h1>見聞各異</h1><p>人之好惡隨其見聞，環境異則心異。</p><p>室中有常見聞矣，既而之門之鄰之裡之黨，既而之郊之山之川，見聞各異，好惡隨之，和競從之，得失成之，是以聖人動止有戒。</p><p>譬如大海，變化億萬蛟魚，水一而已。我之與物，蓊然蔚然，在大化中，性一而已。知夫性一者，無人了無死無生。</p><p><strong>所出</strong>：《關尹子 · 7》 — https://zh.wikisource.org/wiki/關尹子/7</p></article></main></div></div>
