    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 地中生木</nav></header><main><article><h1>地中生木</h1><p>木生於地，由微而著，喻君子積德以成高大。</p><p>地中生木，升之象也。</p><p>《易》升卦象曰：「地中生木，升；君子以順德，積小以高大。」王弼注云：「先天而德著，猶木生地中，漸而升之，以至於高。」</p><p>蓋木之生也，萌芽纖悉，養之以時，則柯莖條達，可以梁棟。君子之德亦猶是，修小善以至大業，積素行以成令名，所謂積跬步以至千里，積細流以成江海者也。</p><p>[[根深末盛]]之義相近，而此以生木為喻，言由內而外之漸長也。</p><p><strong>所出</strong>：《周易 · 升》 — https://zh.wikisource.org/wiki/周易/升</p></article></main></div></div>
