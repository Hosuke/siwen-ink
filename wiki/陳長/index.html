    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 陳長</nav></header><main><article><h1>陳長</h1><p>纷屿山仙人，辟穀不食，有祭水治病之術。</p><p>陳長在纷屿山上，已六百餘歲。山中人為架屋，四時烹殺以祭之，長亦不飲食，顏色如六十歲人。諸奉事者有病，即以器詣長乞祭水飲之，皆愈。</p><p>纷屿山在東海中，吳中周詳者誤到其上，留三年乃得還。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 21》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/21</p></article></main></div></div>
