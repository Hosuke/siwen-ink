    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 心憶忘饑</nav></header><main><article><h1>心憶忘饑</h1><p>心憶者忘饑，心忿者忘寒，心養者忘病，心激者忘痛。</p><p>心憶者猶忘饑，心忿者猶忘寒，心養者猶忘病，心激者猶忘痛。苟吸氣以養其和，孰能饑之；存神以滋其暖，孰能寒之；養五藏以五行，則無傷也，孰能病之；歸五藏於五行，則無知也，孰則痛之。</p><p><strong>所出</strong>：《關尹子 · 6》 — https://zh.wikisource.org/wiki/關尹子/6</p></article></main></div></div>
