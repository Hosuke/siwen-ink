    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 宓賤治單父</nav></header><main><article><h1>宓賤治單父</h1><p>喻有術者逸而治，無術者勞而無功</p><p>宓賤治單父。有若見之曰：「子何臞也？」宓子曰：「君不知賤不肖，使治單父，官事急，心憂之，故臞也。」有若曰：「昔者{{舜}}鼓五絃、歌《南風》之詩而天下治。今以單父之細也，治之而憂，治天下將奈何乎？故有術而御之，身坐於廟堂之上，有處女子之色，無害於治；無術而御之，身雖瘁臞，猶未有益。」</p><p><strong>所出</strong>：《韓非子 · 外儲說左上》 — https://zh.wikisource.org/wiki/韓非子/外儲說左上</p></article></main></div></div>
