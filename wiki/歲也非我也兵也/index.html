    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 歲也，非我也，兵也</nav></header><main><article><h1>歲也，非我也，兵也</h1><p>委過於歲月，不知自反，與刺人而殺之委過於兵無異</p><p>孟子責梁惠王之委政於歲：狗彘食人食而不知檢，塗有餓莩而不知發。人死，則曰「非我也，歲也」，是何異於刺人而殺之，曰「非我也，兵也」？王無罪歲，斯天下之民至焉。言為政者當反求諸己，不可諉過於時命。</p><p><strong>所出</strong>：《孟子 · 梁惠王上》 — https://zh.wikisource.org/wiki/孟子/梁惠王上</p></article></main></div></div>
