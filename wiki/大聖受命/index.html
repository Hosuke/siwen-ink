    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大聖受命</nav></header><main><article><h1>大聖受命</h1><p>聖人受命為帝，非大聖不足以當之。</p><p>太史公論秦亡漢興，以為高祖之興，實天意也。曰：「此乃傳之所謂大聖乎？豈非天哉，豈非天哉！非大聖孰能當此受命而帝者乎？」蓋言帝王之興，必有大聖應運而出，天意人心之所歸，非偶然也。</p><p><strong>所出</strong>：《史記 · 卷016》 — https://zh.wikisource.org/wiki/史記/卷016</p></article></main></div></div>
