    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 玄洲太真</nav></header><main><article><h1>玄洲太真</h1><p>玄洲之洲，太極四真王之師黃老君居焉，太上丈人處仙都之府。</p><p>王褒將君觀玄洲，四面大海，懸濤千丈。洲上宮闕樓觀瓊室瑤房，不可勝記。</p><p>西城真人曰：此仙都之府，太上丈人處之。紫桂宮見丈人，著流霞羽袍，冠芙蓉冠，腰帶神光，手把火鈴，侍女數百，龍虎衛階。</p><p>太上丈人會二十九真人皆玄洲太真公。第一真人主仙道君命侍女出瓊笈，出上清隱書、龍文八靈真經以授褒。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 14》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/14</p></article></main></div></div>
