    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 火行御</nav></header><main><article><h1>火行御</h1><p>火行之令，循丙子而行，天子當修外交，通天下。</p><p>睹丙子，火行御。天子出令，命行人內御，令掘溝澮，津舊塗，發臧任君賜賞。君子修游馳以發地氣，出皮幣，命行人修春秋之禮於天下諸侯，通天下，遇者兼和。然則天無疾風，草木發奮，鬱氣息，民不疾而榮華蕃。七十二日而畢。</p><p>睹丙子，火行御。天子敬行急政，旱札苗死，民厲。七十二日而畢。</p><p><strong>所出</strong>：《管子 · 第41篇五行》 — https://zh.wikisource.org/wiki/管子/第41篇五行</p></article></main></div></div>
