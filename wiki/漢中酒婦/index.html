    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 漢中酒婦</nav></header><main><article><h1>漢中酒婦</h1><p>酒媼從呼子先騎茅狗化龍昇天。</p><p>漢中關下酒婦者，不知何許人也，亦不知姓氏。忽遇卜師呼子先者，不知何許人也，年可五十餘，雲已數百歲。酒婦異之，每加禮敬。忽一旦來謂婦曰：「急裝束與汝共應中陵王去。」是夜，果有二人來持二茅狗，一與子先，一與酒婦，俱令騎之，乃龍也。相隨上華陰山上，常大呼雲：「子先酒母在此。」比日題有仙聖之道矣。</p><p><strong>所出</strong>：《墉城集仙錄 · 卷06》 — https://zh.wikisource.org/wiki/墉城集仙錄/卷06</p></article></main></div></div>
