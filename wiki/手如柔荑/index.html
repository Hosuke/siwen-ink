    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 手如柔荑</nav></header><main><article><h1>手如柔荑</h1><p>喻女子手指柔嫩纖白，如初生之白茅。</p><p>「手如柔荑」，《詩經·衞風·碩人》之句也。荑者，白茅之嫩芽，色白而柔軟。詩以白茅初生之芽，喻女子手指之柔嫩纖白。</p><p>全句云：「手如柔荑，膚如凝脂，領如蝤蠐，齒如瓠犀。」以五物比美人五處，同一章中迭用博喻，極狀莊姜之美。後世形容女子雙手柔美，多引此語。</p><p><strong>所出</strong>：《詩經 · 碩人》 — https://zh.wikisource.org/wiki/詩經/碩人</p></article></main></div></div>
