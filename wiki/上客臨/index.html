    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 上客臨</nav></header><main><article><h1>上客臨</h1><p>孤降阼階拜之，升堂哭，與客拾踴三者，恩禮之至也。</p><p>上客臨曰「寡君有宗廟之事，不得承事，使一介老某相執綍」。相者反命曰「孤某須矣」。臨者入門右，介者皆從之，立於其左，東上。宗人納賓，升，受命於君；降曰「孤敢辭吾子之辱，請吾子之復位」。客對辭者三，宗人皆反命，客卒不敢視賓客，於是敬從。客立門西，孤降自阼階拜之，升堂哭，與客拾踴三。客出，送於門外，拜稽顙。</p><p><strong>所出</strong>：《禮記 · 雜記上》 — https://zh.wikisource.org/wiki/禮記/雜記上</p></article></main></div></div>
