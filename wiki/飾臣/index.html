    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 飾臣</nav></header><main><article><h1>飾臣</h1><p>以飾為名，克親貴以干祿，無實不御。</p><p>飾臣者，克親貴以為名，恬爵祿以為高。好名則無實，為高則不御。記曰：「無實則無勢，失轡則馬焉制？」是輩也，外飾其名，內無實功，高自位置，不稟於上，猶無轡之馬，不可控馭也。</p><p><strong>所出</strong>：《管子 · 第52篇七主七臣》 — https://zh.wikisource.org/wiki/管子/第52篇七主七臣</p></article></main></div></div>
