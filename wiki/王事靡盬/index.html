    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 王事靡盬</nav></header><main><article><h1>王事靡盬</h1><p>王之征役無有止息，無暇治私事。</p><p>「王事靡盬」，[[詩經]]屢見之語，見於〈[[鴇羽]]〉、〈[[北山]]〉、〈[[采薇]]〉等篇。靡盬者，不定、不息之意，猶言王之使命無有完畢之時。</p><p>在〈鴇羽〉中，此語為全詩之骨。征人因王事不息，無暇播藝稷黍稻粱，以至父母失養。三章迭用此語，加強其無奈之情。與「王事靡盬，亦靡將」「王事靡盬，我心傷悲」同義，皆狀國事繁重、私情莫遂之苦。</p><p><strong>所出</strong>：《詩經 · 鴇羽》 — https://zh.wikisource.org/wiki/詩經/鴇羽</p></article></main></div></div>
