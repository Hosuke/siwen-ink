    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 厀漸其法令而尊學者之智行</nav></header><main><article><h1>厀漸其法令而尊學者之智行</h1><p>在上者浸潤於法令而自失尊嚴，反以學者之智巧為可貴。</p><p>人主厀漸其法令而尊學者之智行，此世之所以多文學也。厀漸者，浸潤而漸摩之也。主欲有令而民以文學非之，主不加罪而反自疑；主欲有法而民以私行矫之，主不加誅而反自屈。如是，則在上者日卑，在下者日尊，法令日壞，而文學日盛矣。</p><p><strong>所出</strong>：《韓非子 · 問辯》 — https://zh.wikisource.org/wiki/韓非子/問辯</p></article></main></div></div>
