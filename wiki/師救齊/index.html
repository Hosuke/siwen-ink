    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 師救齊</nav></header><main><article><h1>師救齊</h1><p>師救齊、狄救齊，皆善之。</p><p>夏，師救齊。善救齊也。</p><p>狄救齊。善救齊也。</p><p>《穀梁》於救齊之師皆書「善」：師救之，見[[善救]]之義；狄救之，亦善之，見救災恤隣，不問夷夏也。</p><p><strong>所出</strong>：《春秋穀梁傳 · 僖公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/僖公</p></article></main></div></div>
