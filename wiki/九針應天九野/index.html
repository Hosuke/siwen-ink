    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 九針應天九野</nav></header><main><article><h1>九針應天九野</h1><p>九針之形與用，配人形身形，以應天地四時陰陽。</p><p>夫一天二地三人四時五音六律七星八風九野，身形亦應之，針各有所宜，故曰九針。</p><p>人皮應天，人肉應地，人脈應人，人筋應時，人聲應音，人陰陽合氣應律，人齒面目應星，人出入氣應風，人九竅三百六十五絡應野。故一針皮，二針肉，三針脈，四針筋，五針骨，六針調陰陽，七針益精，八針除風，九針通九竅，除三百六十五節氣，此之謂各有所主也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第十四卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十四卷</p></article></main></div></div>
