    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 一本二本</nav></header><main><article><h1>一本二本</h1><p>天之生物使之一本，愛親為本，愛人為末</p><p>夷之信愛無差等，孟子非之，謂天之生物也使之一本，人之愛親兄之子，猶愛鄰人之赤子，非情之正也。愛親者本，愛人者末，若混而為一，是二本矣。葬親之事，孝子仁人各有其道，非墨者所能易也。</p><p><strong>所出</strong>：《孟子 · 滕文公上》 — https://zh.wikisource.org/wiki/孟子/滕文公上</p></article></main></div></div>
