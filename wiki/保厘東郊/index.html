    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 保厘東郊</nav></header><main><article><h1>保厘東郊</h1><p>命大臣安定東土，保守治理也。</p><p>王以成周之眾，命畢公「保厘東郊」。畢公受王命，總司成周之政，安定殷民，保守疆界，俾東土乂安，不違王化也。</p><p><strong>所出</strong>：《尚書 · 畢命》 — https://zh.wikisource.org/wiki/尚書/畢命</p></article></main></div></div>
