    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 八家皆私百畝</nav></header><main><article><h1>八家皆私百畝</h1><p>井田之制，八家各私百畝，同養公田</p><p>孟子述井田之制，方里而井，井九百畝，其中為公田。八家皆私百畝，同養公田。公事畢，然後敢治私事。死徙無出鄉，鄉田同井，出入相友，守望相助，疾病相扶持。此井田之大略，而潤澤之则在君與子矣。</p><p><strong>所出</strong>：《孟子 · 滕文公上》 — https://zh.wikisource.org/wiki/孟子/滕文公上</p></article></main></div></div>
