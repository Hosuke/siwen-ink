    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五運相合</nav></header><main><article><h1>五運相合</h1><p>五運與三陰三陽相合，以干支定歲氣。</p><p>子午之歲，上見少陰；丑未之歲，上見太陰；寅申之歲，上見少陽；卯酉之歲，上見陽明；辰戌之歲，上見太陽；己亥之歲，上見厥陰。</p><p>少陰，所謂標也；厥陰，所謂終也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第十九卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十九卷</p></article></main></div></div>
