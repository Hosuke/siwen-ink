    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 盧令令</nav></header><main><article><h1>盧令令</h1><p>詠獵犬頸環作聲，以起興也。</p><p>《盧令》首章云「盧令令」，毛傳以為「盧，令令」，皆犬頸環聲也。詩以獵犬頸環丁當之聲起興，引出獵者之美德，蓋聲與德之間自有感發之效焉。</p><p><strong>所出</strong>：《詩經 · 盧令》 — https://zh.wikisource.org/wiki/詩經/盧令</p></article></main></div></div>
