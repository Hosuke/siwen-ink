    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 車軸之戶</nav></header><main><article><h1>車軸之戶</h1><p>命門下胯間要戶，元王所守之死炁之門</p><p>車軸之戶，乃命門下胯間要戶之名，與「死炁之門」同義。元王始明精常守于此，使百血凝結、神炁不散，修之者可拔出地戶、超度八難。</p><p><strong>所出</strong>：《上清大洞真經 · 10章》 — https://zh.wikisource.org/wiki/上清大洞真經/10章</p></article></main></div></div>
