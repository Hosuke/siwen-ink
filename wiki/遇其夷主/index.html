    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 遇其夷主</nav></header><main><article><h1>遇其夷主</h1><p>遇同德之主，行而獲吉，以其能相濟也。</p><p>九四：「豐其蔀，日中見斗，遇其夷主，吉。」</p><p>九四以陽居陰，位不當而有所蔽。然下與初九相應，上與九三相比，皆陽剛同德之人。遇其夷主，吉；象曰「行也」，言同行則相得也。</p><p><strong>所出</strong>：《周易 · 豐》 — https://zh.wikisource.org/wiki/周易/豐</p></article></main></div></div>
