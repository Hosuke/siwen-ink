    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 衞人嫁其子而教之私積聚</nav></header><main><article><h1>衞人嫁其子而教之私積聚</h1><p>教子以利，雖得反而害義</p><p>衞人嫁其子而教之曰：「必私積聚。爲人婦而出，常也；其成居，幸也。」其子因私積聚，其姑以爲多私而出之。其子所以反者，倍其所以嫁。其父不自罪於教子非也，而自知其益富。今人臣之處官者，皆是類也。</p><p><strong>所出</strong>：《韓非子 · 說林上》 — https://zh.wikisource.org/wiki/韓非子/說林上</p></article></main></div></div>
