    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不知我無我逐道者亦然</nav></header><main><article><h1>不知我無我逐道者亦然</h1><p>逐道不知無我，猶遊魚不識水性。</p><p>重雲蔽天，江湖黯然，遊魚茫然，忽望波明食動，幸賜於天，即而就之，漁釣斃焉。不知我無我而逐道者亦然。</p><p><strong>所出</strong>：《關尹子 · 1》 — https://zh.wikisource.org/wiki/關尹子/1</p></article></main></div></div>
