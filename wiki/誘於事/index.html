    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 誘於事</nav></header><main><article><h1>誘於事</h1><p>人主惑於事功，易為臣下所欺。</p><p>人主有誘於事者。易言事之臣，少索資，以事誣主，言少費而多功。主誘而不察，因而多之，則臣反以事制主。其進言也少，其退費也多，事既無功而言者有罪，是以羣臣不敢飾言以惛主。韓非以為，此人臣之以事術劫其主者。</p><p><strong>所出</strong>：《韓非子 · 南面》 — https://zh.wikisource.org/wiki/韓非子/南面</p></article></main></div></div>
