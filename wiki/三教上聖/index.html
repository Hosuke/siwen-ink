    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三教上聖</nav></header><main><article><h1>三教上聖</h1><p>太上、釋迦、宣尼，三教之聖，浩浩刼刼皆知名。</p><p>三教上聖者，太上道君、釋迦牟尼、宣尼素王之通稱也。經言三教古聖人出世成道之後，受享萬代明禋。東周尼山素王生，冬月望日臨昌平；西方悉達牟尼身，四月八日臨衞城；十方三界太上君，二月十五降威靈。幾千百載轉鴻鈞，元炁足兮鍾聖英。天上地上此三尊，浩浩刼刼皆知名。經文以三聖比象金丹之道，示人敬禮聖人，誠求金丹。蓋眞經即眞金，祖師明說也。</p><p><strong>所出</strong>：《張三丰先生全集 · 卷7》 — https://zh.wikisource.org/wiki/張三丰先生全集/卷7</p></article></main></div></div>
