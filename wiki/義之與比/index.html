    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 義之與比</nav></header><main><article><h1>義之與比</h1><p>君子於天下，義以為比，無可無不可。</p><p>君子之於天下也，無適也，無莫也，義之與比。適者有所必為，莫者有所不為，君子皆無之。唯義之與比，義以為準則，可則行之，不可則止之，無固執，無貪慕，此君子之達權也。</p><p><strong>所出</strong>：《論語 · 里仁第四》 — https://zh.wikisource.org/wiki/論語/里仁第四</p></article></main></div></div>
