    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 善敹乃甲胄</nav></header><main><article><h1>善敹乃甲胄</h1><p>丁寧軍士治兵之要</p><p>公曰：「嗟！人無嘩，聽命。徂兹淮夷、徐戎并興，善敹乃甲胄，敿乃干，無敢不弔。備乃弓矢，鍛乃戈矛，礪乃鋒刃，無敢不善。」</p><p>「敹」與「選」通，選簡盔甲也。「敿」與「絞」通，約束盾牌之繩也。「吊」讀為「淑」，善也。言淮夷、徐戎並起為亂，當精選盔甲、絞固盾牌，皆當致善。又當儲弓矢、鍛戈矛、礪鋒刃，無一不善。此治兵之要，器械不精，不可稱勇也。</p><p><strong>所出</strong>：《尚書 · 費誓》 — https://zh.wikisource.org/wiki/尚書/費誓</p></article></main></div></div>
