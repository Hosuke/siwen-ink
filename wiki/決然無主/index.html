    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 決然無主</nav></header><main><article><h1>決然無主</h1><p>去除主見，聽任物理也。</p><p>公而不當，易而无私，<strong>決然無主</strong>，趣物而不兩，不顧於慮，不謀於知，於物無擇，與之俱往，古之道術有在於是者。</p><p>是故慎到棄知去己而緣不得已，泠汰於物以為道理。</p><p><strong>所出</strong>：《莊子 · 天下》 — https://zh.wikisource.org/wiki/莊子/天下</p></article></main></div></div>
