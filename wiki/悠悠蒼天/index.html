    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 悠悠蒼天</nav></header><main><article><h1>悠悠蒼天</h1><p>仰天而呼，怨極之辭。</p><p>「悠悠蒼天」，詩人怨極仰天之辭也。見於〈[[鴇羽]]〉「悠悠蒼天，曷其有所」，亦見於〈[[黍離]]〉「悠悠蒼天，此何人哉」，〈[[宛丘]]〉「坎其擊鼓，宛丘之下。無冬無夏，值其鷺羽」一章之首亦有「坎其」之嘆，然大義略同。</p><p>悠悠者，遠大無際之貌。蒼天者，高不可問之上帝。征人仰見天穹之蒼茫，而問之無答，愈見其困悴無告之懷。後世用此語者，皆本怨嘆之意。</p><p><strong>所出</strong>：《詩經 · 鴇羽》 — https://zh.wikisource.org/wiki/詩經/鴇羽</p></article></main></div></div>
