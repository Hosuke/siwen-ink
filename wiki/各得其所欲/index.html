    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 各得其所欲</nav></header><main><article><h1>各得其所欲</h1><p>兼畜人、入事人，各如其分，大小各得其所欲。</p><p>大國兼畜人而畜人亦欲得所畜，小國入事人而事人亦欲得所事。兩者各如其分，大小各欲得其所，是[[互利]]之道。《[[易]]曰「水流濕，火就燥」，此之類也。非相害，乃相成。</p><p><strong>所出</strong>：《老子河上公章句 · 謙德》 — https://zh.wikisource/wiki/老子河上公章句/德經</p></article></main></div></div>
