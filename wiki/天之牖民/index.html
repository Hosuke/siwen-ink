    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天之牖民</nav></header><main><article><h1>天之牖民</h1><p>天道啟民，如壎篪相和，取攜從便</p><p>詩云「天之牖民，如壎如篪。如璋如圭，如取如攜。攜無曰益，牖民孔易」，言天之教民，如以壎篪之和，取圭璋之合，隨手而應，不待用力。</p><p>蓋天不言而成，[[地道无成]]而[[萬物皆備於我]]，皆此理也。民之多辟者，非民性本邪，乃上無以牖之耳。牖之孔易，在上者能敬天順民，則民化矣。</p><p><strong>所出</strong>：《詩經 · 板》 — https://zh.wikisource.org/wiki/詩經/板</p></article></main></div></div>
