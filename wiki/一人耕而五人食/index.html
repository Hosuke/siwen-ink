    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 一人耕而五人食</nav></header><main><article><h1>一人耕而五人食</h1><p>農功視人力多寡，此田筴相員之效。</p><p>有一人耕而五人食者，有一人耕而四人食者，有一人耕而三人食者，有一人耕而二人食者。此齊力而功地，田筴相員者也。夫耕者之功有等差，食者之數有多寡。必有法以相準，使功與食相當，則國用可足，此[[國筴之時守]]也。</p><p><strong>所出</strong>：《管子 · 第69篇乘馬數》 — https://zh.wikisource.org/wiki/管子/第69篇乘馬數</p></article></main></div></div>
