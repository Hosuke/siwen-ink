    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 仁從中出義從外作</nav></header><main><article><h1>仁從中出義從外作</h1><p>仁由中出，義自外作：仁者不代王，義者七十致政。</p><p>仁從中出，義從外作。仁，故不以天下為利。義，故不以天下為名。仁，故不代王。義，故七十而致政。</p><p><strong>所出</strong>：《管子 · 第26篇戒》 — https://zh.wikisource.org/wiki/管子/第26篇戒</p></article></main></div></div>
