    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 得時失時</nav></header><main><article><h1>得時失時</h1><p>述農時得失之辨。</p><p>凡禾之患，不俱生而俱死。是以先生者美米，後生者為秕。是故其耨也，長其兄而去其弟。樹肥無使扶疏，樹墝不欲專生而族居。肥而扶疏則多秕，墝而專居則多死。不知稼者：其耨也去其兄而養其弟，不收其粟而收其秕，上下不安，則禾多死，厚土則孽不通，薄土則蕃轓而不發。壚埴冥色，剛土柔種，免耕殺匿，使農事得。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十六》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十六</p></article></main></div></div>
