    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 井收勿幕</nav></header><main><article><h1>井收勿幕</h1><p>井成則勿覆其口，有孚而元吉，君子養民之功大成也。</p><p>上六之辭曰：「井收勿幕，有孚元吉。」收者，井功已成，汲者盈而去也。勿幕者，不覆其口，使人人得而汲之也。井以養人為功，成而不私，廣被而不吝，此所以有孚而元吉也。《象》曰「元吉在上，大成也」，言井道之成，在於上六。上九居井之極，井道大成，養民之功無間焉。此亦[[井養而不窮]]之終義也。</p><p><strong>所出</strong>：《周易 · 井》 — https://zh.wikisource.org/wiki/周易/井</p></article></main></div></div>
