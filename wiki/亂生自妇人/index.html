    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 亂生自妇人</nav></header><main><article><h1>亂生自妇人</h1><p>國亂非天降，實由女戎</p><p>亂匪降自天，生自妇人。匪教匪誨，時維婦寺。詩人明言祸亂之來，非天所降，實生於妇人。毛傳云：「寺，近也。」鄭箋云：「言arani妇寺之言相近也。」此刺幽王寵褒姒，聽其干政，以至朝綱大壞，所謂「女戎」之害也。</p><p><strong>所出</strong>：《詩經 · 瞻卬》 — https://zh.wikisource.org/wiki/詩經/瞻卬</p></article></main></div></div>
