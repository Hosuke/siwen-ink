    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 法術之士與當途之臣不相容</nav></header><main><article><h1>法術之士與當途之臣不相容</h1><p>法術之士與當途之臣利害相反，不能兩立。</p><p>且法術之士與當途之臣，不相容也。何以明之？主有術士，則大臣不得制斷，近習不敢賣重；大臣、左右權勢息，則人主之道明矣。今則不然，其當途之臣得勢擅事以環其私，左右近習朋黨比周以制䟽遠，則法術之士奚時得進用，人主奚時得論裁？故有術不必用，而勢不兩立，法術之士焉得無危？</p><p><strong>所出</strong>：《韓非子 · 人主》 — https://zh.wikisource.org/wiki/韓非子/人主</p></article></main></div></div>
