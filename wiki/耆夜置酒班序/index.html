    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 耆夜置酒班序</nav></header><main><article><h1>耆夜置酒班序</h1><p>飲至之宴，席位各有定分，主客分明。</p><p>飲至之夕，太室置酒，班序昭然。畢公高為客，召公保奭為夾，周公叔旦為主，辛公甲為位，作策逸為東堂之客，呂尚父命為司正，監爵以終。</p><p><strong>所出</strong>：《尚書 · 耆夜》 — https://zh.wikisource.org/wiki/尚書/耆夜</p></article></main></div></div>
