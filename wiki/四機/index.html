    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 四機</nav></header><main><article><h1>四機</h1><p>兵之得失係於四機，審之明之，則無敵於天下。</p><p>四機者，兵家之要也。一曰必得文威武，二曰官習勝務，三曰時因勝之終，四曰無方勝之幾。凡舉機誠要則敵不量，用利至誠則敵不校，明名章實則士死節，奇舉發不意則士歡用。動慎十號，明審九章，飾習十器，善習五官，則兵出而不困，深入而不危。</p><p><strong>所出</strong>：《管子 · 第08篇幼官》 — https://zh.wikisource.org/wiki/管子/第08篇幼官</p></article></main></div></div>
