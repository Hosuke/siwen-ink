    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不隕獲於貧賤不充詘於富貴</nav></header><main><article><h1>不隕獲於貧賤不充詘於富貴</h1><p>儒者於貧賤不失其守，於富貴不增其傲，終始一節。</p><p>儒有不隕獲於貧賤，不充詘於富貴；不慁君王，不累長上，不閔有司；故曰儒。今衆人之命儒也妄，常以儒相詬病。</p><p>隕獲者，隕墜而有所失也；充詘者，驕盈而失其正也。貧賤則易於自棄，富貴則易於自驕，儒者於此二端皆不動其心。不以貧賤而隕志，不以富貴而詘身；不以王命而致其勞，不以上官而增其累，不以有司而改其操。内外如一，終始不易，此儒之所以為儒也。</p><p><strong>所出</strong>：《禮記 · 儒行》 — https://zh.wikisource.org/wiki/禮記/儒行</p></article></main></div></div>
