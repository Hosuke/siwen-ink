    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 躬自悼矣</nav></header><main><article><h1>躬自悼矣</h1><p>兄弟不知，夫家暴棄，唯有自傷自悼而已。</p><p>「靜言思之，躬自悼矣」，語出《詩經·衞風·氓》第五章。言靜而思之，唯有躬身自傷而已，無可告訴也。</p><p>女子被棄歸寧，兄弟咥其笑矣；欲言於夫，夫已暴虐以待。靜而思之，無一人可以訴其情者。左側無父母可恃，右無兄弟見憐；孑然一身，唯自悼耳。此三歲為婦、靡室勞苦、夙興夜寐之所得者，乃暴棄而已。躬自悼者，無可告訴之辭也，亦萬古棄婦之同悲也已。</p><p><strong>所出</strong>：《詩經 · 氓》 — https://zh.wikisource.org/wiki/詩經/氓</p></article></main></div></div>
