    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 公叔痤遺言</nav></header><main><article><h1>公叔痤遺言</h1><p>公叔痤病中以鞅國事托惠王，惠王不以為然，卒失賢才。</p><p>魏公叔痤疾，惠王往問之曰：「公叔之疾，嗟！疾甚矣！將奈社稷何？」公叔對曰：「臣之御庶子鞅，願王以國聽之也。為不能聽，勿使出境。」</p><p>王不應，出而謂左右曰：「豈不悲哉？以公叔之賢，而今謂寡人必以國聽鞅，悖也夫！」</p><p>公叔死，公孫鞅西游秦，秦孝公聽之，秦果用彊，魏果用弱。非公叔痤之悖也，魏王則悖也。夫悖者之患，固以不悖為悖。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十一》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十一</p></article></main></div></div>
