    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 自是不彰</nav></header><main><article><h1>自是不彰</h1><p>自以為是者，其名不顯。</p><p>自是者，以己為是而拒不納人言也。夫道貴虛己而聽於無聲，乃能光大而令聞彰顯。若執己之是，拒絕善道，則名不彰於世。[[自是不彰]]者，正與[[自伐無功]]相承，皆示矜伐之害。</p><p><strong>所出</strong>：《道德經 (王弼本) · 二十四章》 — https://zh.wikisource.org/wiki/道德經_(王弼本)</p></article></main></div></div>
