    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 譚子奔莒</nav></header><main><article><h1>譚子奔莒</h1><p>譚國以不禮於出亡之齊侯，及齊師滅譚，譚子奔莒，同盟之義也。</p><p>齊侯之出也，過譚，譚不禮焉。及其入也，諸侯皆賀，譚又不至。冬，齊師滅譚，譚無禮也。譚子奔莒，同盟故也。</p><p><strong>所出</strong>：《春秋左氏傳 · 莊公》 — https://zh.wikisource.org/wiki/春秋左氏傳/莊公</p></article></main></div></div>
