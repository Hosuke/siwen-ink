    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 山附地上</nav></header><main><article><h1>山附地上</h1><p>剝卦之象，山體附地，頹剝之甚，君子當厚下以安民。</p><p>《剝》之象曰：「山附地上，剝。」</p><p>山之於地，本在下者也；今附著於地而不動，是山體剝落，傾頹及地之象也。夫山高聳而覆物，今山將崩，無以為覆，是剝之甚也。</p><p>坤下艮上，山體本高，今居地上而無以自振，剝之象也。象辭曰：「上以厚下，安宅。」上位之人厚待下民，乃能安其居也。厚下者，厚加於下；下厚則上安，不厚則無以相承，而宅覆矣。</p><p><strong>所出</strong>：《周易 · 剝》 — https://zh.wikisource.org/wiki/周易/剝</p></article></main></div></div>
