    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 呼吸元氣以求僊</nav></header><main><article><h1>呼吸元氣以求僊</h1><p>呼吸天地元氣以臻神仙之境。</p><p>呼吸元氣以通達天人，使形神長存，終臻仙道。此為內丹功法之要，納天地之氣以為己用，煉化形骸而超乎凡質。</p><p><strong>所出</strong>：《黃庭內景經 · 呼吸章第二十》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/呼吸章第二十</p></article></main></div></div>
