    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 淫樂</nav></header><main><article><h1>淫樂</h1><p>沉溺聲色，不節之以禮義</p><p>夏桀、殷紂作為<strong>淫樂</strong>，大鼓鐘磬管簫之音，以鉅為美，以眾為觀，俶詭殊瑰，耳所未嘗聞，目所未嘗見，務以相過，不用度量。宋之衰也，作為千鍾；齊之衰也，作為大呂；楚之衰也，作為巫音。淫則淫矣，自有道者觀之，則失樂之情。失樂之情，其樂不樂。樂不樂者，其民必怨，其生必傷。其生之與樂也，若冰之於炭，反以自兵。此生乎不知樂之情，而以淫為務故也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷五》 — https://zh.wikisource.org/wiki/呂氏春秋/卷五</p></article></main></div></div>
