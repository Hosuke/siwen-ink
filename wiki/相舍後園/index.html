    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 相舍後園</nav></header><main><article><h1>相舍後園</h1><p>參聽吏舍歌舞，不與相國府事比。</p><p>相舍後園近吏舍，吏舍日飲歌呼。從吏惡之，請參游園中，欲相國召按之。參乃反取酒張坐飲，亦歌呼與相應和。夫後園之縱酒，吏之過也；相國之不按，臣之道也。蓋相國日親萬幾，而此屬細事，聽之則吏自安，激之則事愈張，此清靜之治所不廢也。</p><p><strong>所出</strong>：《史記 · 卷054》 — https://zh.wikisource.org/wiki/史記/卷054</p></article></main></div></div>
