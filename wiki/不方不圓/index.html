    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不方不圓</nav></header><main><article><h1>不方不圓</h1><p>道體沖虛，非方非圓，無可形狀。</p><p>不方不圓閉牖窗，言道之體冲虛，非方非圓，無可形名，猶閉塞窗牖以杜外物之擾也。修真者心契無為之境，萬念俱寂，內無所營，外無所接，窗牖既閉，靈光自全。</p><p><strong>所出</strong>：《黃庭內景經 · 上睹章第十六》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/上睹章第十六</p></article></main></div></div>
