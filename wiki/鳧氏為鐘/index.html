    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鳧氏為鐘</nav></header><main><article><h1>鳧氏為鐘</h1><p>鐘有甬有衡，枚篆以為飾，聲之清濁在厚薄廣狹之間。</p><p>鳧氏為鐘。兩欒謂之銑，銑間謂之于，于上謂之鼓，鼓上謂之鉦，鉦上謂之舞，舞上謂之甬，甬上謂之衡。鐘縣謂之旋，旋蟲謂之斡。鐘帶謂之篆，篆間謂之枚，枚謂之景。</p><p>薄厚之所震動，清濁之所由出，侈弇之所由興，有說。鐘已厚則石，已薄則播，侈則柞，弇則郁，長甬則震。是故大鐘十分其鼓間，以其一為之厚；小鐘十分其鉦間，以其一為之厚。鐘大而短，則其聲疾而短聞；鐘小而長，則其聲舒而遠聞。</p><p><strong>所出</strong>：《周禮 · 冬官考工記》 — https://zh.wikisource.org/wiki/周禮/冬官考工記</p></article></main></div></div>
