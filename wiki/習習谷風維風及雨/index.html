    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 習習谷風，維風及雨</nav></header><main><article><h1>習習谷風，維風及雨</h1><p>風雨相隨，以喻時運之艱也。</p><p>「習習谷風，維風及雨」，言山谷之風，習習而來，又有風又有雨也。谷風者，山谷中之風，幽而不暢，其來也厲；雨者，天澤之施，陰以成物。詩人以谷風陰雨興人事之艱難，謂世路多歧，與時浮沉，風雨之至不可以預期也。《小雅·谷風》以此起興，言君子與朋友交，亦有風雨之患難，患難之中然後見人心也。<strong>所出</strong>：《詩經 · 谷風》 — https://zh.wikisource.org/wiki/詩經/谷風</p></article></main></div></div>
