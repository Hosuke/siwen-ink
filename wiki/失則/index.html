    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 失則</nav></header><main><article><h1>失則</h1><p>後入于地，失其法則，明夷之終。</p><p>「後入于地，失則也。」上六居明夷之極，坤體之成者也。明之既入，則坤之暗成。初登而後入，明而忽晦，無復法則。象辭言「失則」，明上六之所以終於暗者，以失其明之則也。前明而後暗，先升而後躋，理之常也。</p><p><strong>所出</strong>：《周易 · 明夷》 — https://zh.wikisource.org/wiki/周易/明夷</p></article></main></div></div>
