    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 肇祀</nav></header><main><article><h1>肇祀</h1><p>后稷始創祭祀，以報本反始。</p><p>后稷肇創祭祀之禮，春祈秋報，奉牲粢盛，羞於神明。上帝居歆，降福簡簡，民用和睦，以永享其祀。詩-{云}-「后稷肇祀，庶無罪悔，以迄于今」，言其后稷之祀，垂於萬世者也。</p><p><strong>所出</strong>：《詩經 · 生民》 — https://zh.wikisource.org/wiki/詩經/生民</p></article></main></div></div>
