    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 君道無智無能無為</nav></header><main><article><h1>君道無智無能無為</h1><p>君執無智、無能、無為，乃能使眾智、眾能、眾為。</p><p>先王用非其有，如己有之，通乎君道者也。夫君也者，處虛素服而無智，故能使眾智也；智反無能，故能使眾能也；能執無為，故能使眾為也。無智、無能、無為，此君之所執也。人主之所惑者則不然，以其智彊智，以其能彊能，以其為彊為，此處人臣之職也。處人臣之職而欲無壅塞，雖舜不能為。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十五》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十五</p></article></main></div></div>
