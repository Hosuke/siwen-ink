    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 簞食瓢飲</nav></header><main><article><h1>簞食瓢飲</h1><p>顏回樂道之賢</p><p>孔子稱顏回曰：「賢哉回也！一簞食，一瓢飮，在陋巷，人不堪其憂，回也不改其樂。賢哉回也！」簞瓢之陋，不改其樂，此賢之所以為賢者也。</p><p><strong>所出</strong>：《論語 · 雍也第六》 — https://zh.wikisource.org/wiki/論語/雍也第六</p></article></main></div></div>
