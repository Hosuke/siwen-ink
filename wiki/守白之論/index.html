    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 守白之論</nav></header><main><article><h1>守白之論</h1><p>公孫龍以「守白」之論正名實、化天下。</p><p>公孫龍又以「不定所白」與「定所白」別白之真偽：「白者不定所白，忘之而可也」，此通性之白也，無所限定；「白馬者言白，定所白也，定所白者非白也」，此特定之白矣，既定於白馬，則非通論萬物之白。故馬之所以無色之限制，以其名本虛也；白馬之所以有色之去取，以其名加白於馬也。以此推之，「有去取於色」者不可以應無去取之名，「無去取」者非有去取，乃無所限之謂也。是以白馬之非馬，定矣。</p><p>  <strong>所出</strong>：《公孫龍子 · 2》 — https://zh.wikisource.org/wiki/公孫龍子/2</p></article></main></div></div>
