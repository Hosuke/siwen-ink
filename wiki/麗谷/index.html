    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 麗谷</nav></header><main><article><h1>麗谷</h1><p>狂吟而死，棺空尸解。</p><p>麗穀累舉進士，後忽如狂，市中樞吟曰：「一問茅屋，尚自修治，任狂風吹，連簷破碎，枓拱斜歌，看著倒也。牆壁作散土一堆，主人翁永不來歸。」後病死。及葬，發視但空棺耳。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 44》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/44</p></article></main></div></div>
