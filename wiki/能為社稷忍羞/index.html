    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 能為社稷忍羞</nav></header><main><article><h1>能為社稷忍羞</h1><p>賢臣能為社稷忍受一時之辱</p><p>趙簡子立襄子為後，曰：「是為人也，能為社稷忍羞。」後知伯批襄子之首，大夫請殺之，襄子引父命以報之，卒破知伯。忍小辱而成大功，此之謂也。</p><p><strong>所出</strong>：《淮南子 · 道應訓》 — https://zh.wikisource.org/wiki/淮南子/道應訓</p></article></main></div></div>
