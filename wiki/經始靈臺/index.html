    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 經始靈臺</nav></header><main><article><h1>經始靈臺</h1><p>文王受命，庶民踴躍，經之營之，不日而成。</p><p>文王受命而有天下，其德化及於鳥獸昆蟲，庶民樂其有靈德，是以經始靈臺焉。</p><p>經者，測度之也；始者，創端之也。經之營之，規劃布置，以起高臺也。庶民攻之者，羣趨赴事，協力以成之也。不日成之，言其速也。王心未嘗督責，而民自致力，忘其勞焉。</p><p>是詩見文王之得民心也如此。[[庶民子來]]，不待賞勸而事集，此王道之成，民樂其君之驗也。</p><p><strong>所出</strong>：《詩經 · 靈臺》 — https://zh.wikisource.org/wiki/詩經/靈臺</p></article></main></div></div>
