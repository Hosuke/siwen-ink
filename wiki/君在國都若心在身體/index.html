    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 君在國都若心在身體</nav></header><main><article><h1>君在國都若心在身體</h1><p>君猶心，民猶體，心正則體健，道定則民化</p><p>君之在國都也，若心之在身體也。道德定於上，則百姓化於下矣；戒心形於內，則容貌動於外矣。正也者，所以明其德。[[君者民之原]]</p><p><strong>所出</strong>：《管子 · 第31篇君臣下》 — https://zh.wikisource.org/wiki/管子/第31篇君臣下</p></article></main></div></div>
