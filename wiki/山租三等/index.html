    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 山租三等</nav></header><main><article><h1>山租三等</h1><p>因山林物宜而立三等之租，柴楂、室奉、棺槨之奉是也。</p><p>君立三等之租於山，曰：握以下者爲柴楂，把以上者爲室奉，三圍以上爲棺槨之奉。各因其物之高下而定其租，則山林之利皆歸於上，而下無濫取。鹽鐵撫軌，穀一廩十，去其田賦，以租其山，此公私兩便之制也。</p><p><strong>所出</strong>：《管子 · 第74篇山國軌》 — https://zh.wikisource.org/wiki/管子/第74篇山國軌</p></article></main></div></div>
