    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 肅肅兔罝-之</nav></header><main><article><h1>肅肅兔罝-之</h1><p></p><p>肅肅，敬也，戰戰兢兢之貌。罝，音居，捕兔之網。肅肅兔罝，言兔罝之布，肅然整飭。</p><p>  椓之丁丁，言擊木設網之聲。肅肅以形容其敬，丁丁以象其聲。此皆言武夫未遇之時，猶能从容布置如此。一旦為公侯所得，則赳赳可用矣。</p><p>  <strong>所出</strong>：《詩經 · 兔罝》 — https://zh.wikisource.org/wiki/詩經/兔罝</p></article></main></div></div>
