    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天下之交</nav></header><main><article><h1>天下之交</h1><p>天下百川歸附之地</p><p>天下之交，猶百川之赴海也。水之流，必歸於壑；聖人之治，必歸於下。大國居下，則天下之交從之。天下之交者，非人力之所能致，水之性自然歸之也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 六十一章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
