    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 賢人之政降人以體</nav></header><main><article><h1>賢人之政降人以體</h1><p>賢人之政以體降人，聖人之政以心降人；體降可以圖始，心降可以保終。</p><p>賢人之政，降人以體；聖人之政，降人以心。體降可以圖始，心降可以保終。降體以禮，降心以樂。</p><p>所謂樂者，非金石絲竹也：謂人樂其家，謂人樂其族，謂人樂其業，謂人樂其都邑，謂人樂其政令，謂人樂其道德。如此，君人者乃作樂以節之，使不失其和。故有德之君，以樂樂人；無德之君，以樂樂身。樂人者，久而長；樂身者，不久而亡。</p><p><strong>所出</strong>：《三略》 — https://zh.wikisource.org/wiki/三略</p></article></main></div></div>
