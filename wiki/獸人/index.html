    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 獸人</nav></header><main><article><h1>獸人</h1><p>中士四人，掌罟田獸辨其名物</p><p>獸人，中士四人，下士八人；府二人，史四人，胥四人，徒四十人。</p><p>掌罟田獸，辨其名物。冬獻狼，夏獻麋，春秋獻獸物。時田，則守罟。及弊田，令禽注于虞中。</p><p>凡祭祀、喪紀、賓客，共其死獸生獸。凡獸入于臘人，皮毛筋角入于玉府。</p><p><strong>所出</strong>：《周禮 · 天官冢宰》 — https://zh.wikisource.org/wiki/周禮/天官冢宰</p></article></main></div></div>
