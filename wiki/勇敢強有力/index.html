    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 勇敢強有力</nav></header><main><article><h1>勇敢強有力</h1><p>勇敢強有力者，天下无事則用之於禮義，有事則用之於戰勝</p><p>勇敢強有力者，天下无事，則用之於禮義；天下有事，則用之於戰勝。用之於戰勝則無敵，用之於禮義則順治。外無敵，內順治，此之謂盛德。故聖王之貴勇敢強有力如此也。</p><p>勇敢之所以可貴，貴其能以立義；立義之所以可貴，貴其有行；有行之所以可貴，貴其行禮；行禮之所以可貴，貴其敢行禮義。</p><p>若勇敢強有力而不用之於禮義戰勝，而用之於爭闘，則謂之亂人。刑罰行於國，所誅者亂人也。如此則民順治而國安。</p><p><strong>所出</strong>：《禮記 · 聘義》 — https://zh.wikisource.org/wiki/禮記/聘義</p></article></main></div></div>
