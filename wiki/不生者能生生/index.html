    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不生者能生生</nav></header><main><article><h1>不生者能生生</h1><p>有生不生，不生者能生生，不化者能化化，常生常化。</p><p>子列子居鄭圃，弟子問學，列子笑曰：「壺子何言哉？雖然，夫子嘗語伯昏瞀人。吾側聞之，試以告女。其言曰：有生不生，有化不化。不生者能生生，不化者能化化。生者不能不生，化者不能不化。故常生常化。常生常化者，無時不生，無時不化。陰陽爾，四時爾，不生者疑獨，不化者往復。往復，其際不可終；疑獨，其道不可窮。」</p><p><strong>所出</strong>：《列子 · 天瑞篇》 — https://zh.wikisource.org/wiki/列子/天瑞篇</p></article></main></div></div>
