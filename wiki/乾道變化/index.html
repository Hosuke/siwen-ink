    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 乾道變化</nav></header><main><article><h1>乾道變化</h1><p>天道變化，萬物各正性命，保合大和，乃利乃貞。</p><p>彖曰：時乘六龍以御天，乾道變化，各正性命，保合大和，乃利貞。</p><p>乾元者，萬物資始，統天者也。雲行雨施，品物流形，大明終始，六位時成。夫乾道者，天之道也。變化者，生成之迭運也。萬物稟天之氣以生，稟天之理以成，性命於是乎正焉。大和者，陰陽會合，沖和之氣也。保合之者，不散不失，恒久而不已也。此天之利貞，萬物之所以遂其生而得其正者也。</p><p><strong>所出</strong>：《周易 · 乾》 — https://zh.wikisource.org/wiki/周易/乾</p></article></main></div></div>
