    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 弗與戰</nav></header><main><article><h1>弗與戰</h1><p>吳師挑戰，越王欲許，范蠡以天道節數止之</p><p>越王興師伐吳，至於五湖。吳人聞之，出而挑戰，一日五反。越王弗忍，欲許之。</p><p>范蠡進諫曰：「夫謀之廊廟，失之中原，其可乎？王姑勿許也。」又曰：「天節固然，唯謀不遷。」越王聽之，弗許。</p><p>范蠡復進言用兵之法：彼來從我，固守勿與；若將與之，必因天地之災，又觀其民之饑飽勞逸以參之。盡其陽節、盈吾陰節而奪之。其法後則用陰，先則用陽，設右以為牝，益左以為牡。</p><p>王曰「諾」，遂弗與吳戰。居軍三年，吳師自潰。</p><p><strong>所出</strong>：《國語 · 卷21》 — https://zh.wikisource.org/wiki/國語/卷21</p></article></main></div></div>
