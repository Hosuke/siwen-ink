    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 度數陰陽</nav></header><main><article><h1>度數陰陽</h1><p>孔子求道於度數五年、陰陽十二年而未得，老子言道不可傳。</p><p>孔子行年五十有一而不聞道，乃南之沛見老聃。老聃曰：「子來乎？吾聞子，北方之賢者也！子亦得道乎？」孔子曰：「未得也。」老子曰：「子惡乎求之哉？」曰：「吾求之於度數，五年而未得也。」老子曰：「子又惡乎求之哉？」曰：「吾求之於陰陽，十有二年而未得也。」</p><p><strong>所出</strong>：《莊子 · 天運》 — https://zh.wikisource.org/wiki/莊子/天運</p></article></main></div></div>
