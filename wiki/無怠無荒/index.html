    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無怠無荒，四夷來王</nav></header><main><article><h1>無怠無荒，四夷來王</h1><p>為政者不懈於心、不荒於事，則四夷自來臣服。</p><p>益之戒禹也，末言「無怠無荒，四夷來王」。[[無怠無荒]]者，言人君不可以怠荒失德也。</p><p>為政者心不懈則事不荒，事不荒則政治修明。政治修明，則德澤所被，雖四夷之遠，亦莫不來王。非以威力迫之，乃以德化懷之也。</p><p>是以明主必修德勤政，不敢少有怠荒。此[[無怠無荒]]之旨，所以為萬世法也。</p><p><strong>所出</strong>：《尚書 · 大禹謨》 — https://zh.wikisource.org/wiki/尚書/大禹謨</p></article></main></div></div>
