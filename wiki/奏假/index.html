    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 奏假</nav></header><main><article><h1>奏假</h1><p>祭時告神以徹俎豆也</p><p>湯孫奏假，綏我思成。奏假者，祭時升歌以告神也。商家子孫奏假以祭，安定先祖而致其來享也。[[來假來饗]]義近。</p><p><strong>所出</strong>：《詩經 · 那》 — https://zh.wikisource.org/wiki/詩經/那</p></article></main></div></div>
