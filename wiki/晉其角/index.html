    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 晉其角，維用伐邑</nav></header><main><article><h1>晉其角，維用伐邑</h1><p>上九窮極之進，征伐邑國，危而得吉</p><p>上九居晉之極，剛進不止，有角之象。晉其角者，進至於極也。維用伐邑，厲吉无咎，言窮則當思變，征伐其內邑以自強，可以轉危為吉。然貞吝者，終有嗇吝也。象曰：「維用伐邑，道未光也。」言以征伐為事，非光明之道，雖能免咎，終非至善。</p><p><strong>所出</strong>：《周易 · 晉》 — https://zh.wikisource.org/wiki/周易/晉</p></article></main></div></div>
