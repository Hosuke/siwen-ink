    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鄭人築壞牆</nav></header><main><article><h1>鄭人築壞牆</h1><p>善防其家者，不聽人言以為盜，而自敗其事。</p><p>鄭人有一子，將宦，謂其家曰：「必築壞牆，是不善，人將竊。」其巷人亦云。不時築，而人果竊之。以其子為智，以巷人告者為盜。</p><p><strong>所出</strong>：《韓非子 · 說林下》 — https://zh.wikisource.org/wiki/韓非子/說林下</p></article></main></div></div>
