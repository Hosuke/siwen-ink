    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 先其君以善者侵賞奪威</nav></header><main><article><h1>先其君以善者侵賞奪威</h1><p>姦臣先干君譽以侵賞，先干君刑以奪威</p><p>先其君以善者，侵其賞而奪之實者也。先其君以惡者，侵其刑而奪之威者也。訛言於外者，脅其君者也。鬱令而不出者，幽其君者也。四者一作，而上下不知也，則國之危可坐而待。</p><p><strong>所出</strong>：《管子 · 第31篇君臣下》 — https://zh.wikisource.org/wiki/管子/第31篇君臣下</p></article></main></div></div>
