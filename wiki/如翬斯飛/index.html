    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 如翬斯飛</nav></header><main><article><h1>如翬斯飛</h1><p>簷阿之美，如翟羽炫。</p><p>[[如翬斯飛]]者，狀簷阿之美也。翬，野雞也，其羽五彩。屋脊簷阿之勢，如雉雞展五彩之羽，翩翩欲飛。此言宮室之美，彩飾炫耀，如羽之麗。</p><p><strong>所出</strong>：《詩經 · 斯干》 — https://zh.wikisource.org/wiki/詩經/斯干</p></article></main></div></div>
