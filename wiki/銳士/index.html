    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 銳士</nav></header><main><article><h1>銳士</h1><p>秦人以嚴刑賞驅民而為兵，眾強長久。</p><p>秦人生民郏阨，使民酷烈，劫之以埶，隱之以阨，忸之以慶賞，酋之以刑罰，使天下之民要利於上者非鬥無由。功賞相長，五甲首而隸五家，最為眾彊長久，多地以正，故四世有勝，非幸也，數也。</p><p><strong>所出</strong>：《荀子 · 議兵篇》 — https://zh.wikisource.org/wiki/荀子/議兵篇</p></article></main></div></div>
