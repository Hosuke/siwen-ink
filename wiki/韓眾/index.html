    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 韓眾</nav></header><main><article><h1>韓眾</h1><p>漢州德陽人，受天真皇人金書玉字，乘紫煙白日昇天。</p><p>韓眾，漢州德陽縣秦中化學道，天真皇人授以金書玉字，行住得駕紫煙，白日昇天。楚辭離騷經云：奇傳說之託星辰，為羨韓衆之得一形，穆穆以寢遠兮，離葦人而退逸。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 4》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/4</p></article></main></div></div>
