    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 復即命渝</nav></header><main><article><h1>復即命渝</h1><p>聽命而變乃獲貞吉</p><p>復即命渝，[[訴訟]]九四之辭也。渝者，變也。九四以陽居陰，不克與之争，歸而就命，變而從正焉。「不克讼」而上九之象也，變而安守，則吉。《象》曰：「復即命渝，安貞，不失也。」歸而就命者，非屈於力也，乃知命之正；渝而安貞者，非懦於節也，乃識時之變。能變者不失其守，知止者不失其正，是以吉也。</p><p><strong>所出</strong>：《周易 · 訴訟》 — https://zh.wikisource.org/wiki/周易/訴訟</p></article></main></div></div>
