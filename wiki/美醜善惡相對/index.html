    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 美醜善惡相對</nav></header><main><article><h1>美醜善惡相對</h1><p>天下知美則醜生，知善則不善起，美醜善惡相待而立，非絕對之分。</p><p>天下皆知美之為美，醜已焉；皆知善之為善，不善已起。此言美與醜、善與不善，相待而立，非真有定分也。世人徒見美之為美，不知美之為美，則醜者隨之；見善之為善，則不善者從而訾之。是故美醜、善不善，相對而生，非絕對之標準，乃世俗之分別耳。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第四十六章 觀徼》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
