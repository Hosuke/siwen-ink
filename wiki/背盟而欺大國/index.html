    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 背盟而欺大國</nav></header><main><article><h1>背盟而欺大國</h1><p>背盟欺大國，必取敗亡，神人不佑。</p><p>晉侯使瑕嘉平戎于王，單襄公如晉拜成。劉康公徼戎，將遂伐之。叔服曰：「背盟而欺大國，此必敗。背盟不祥，欺大國不義，神人弗助，將何以勝。」不聽，遂伐茅戎。三月癸未，敗績于徐吾氏。</p><p><strong>所出</strong>：《春秋左氏傳 · 成公》 — https://zh.wikisource.org/wiki/春秋左氏傳/成公</p></article></main></div></div>
