    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖人成大</nav></header><main><article><h1>聖人成大</h1><p>聖人法道不宰，故能成其大。</p><p>道廣大而無不容，功成而不居。萬物歸焉而弗為主，是謂無欲之小；聖人成大，亦以其不為大也。不自見故明，不自是故彰，不自伐故有功，不自矜故能長。[[後其身而身先]]，[[外其身而身存]]，此之謂也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第七十八章 成大》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
