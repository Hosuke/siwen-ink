    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 足少陰腎脈動</nav></header><main><article><h1>足少陰腎脈動</h1><p>衝脈與少陰大絡，起於腎下，出於氣街，循陰股內廉，溫足脛，此脈之常動者也。</p><p>衝脈者，十二經之海也，與少陰之大絡，起於腎下，出於氣街，循陰股內廉，邪入膕中，循脛股內廉，並少陰之經，下入內踝之後。入足下。其別者，邪入踝，出屬跗上，入大指之間，注諸絡，以溫足脛，此脈之常動者也。</p><p><strong>所出</strong>：《黃帝內經 · 靈樞第九卷》 — https://zh.wikisource.org/wiki/黃帝內經/靈樞第九卷</p></article></main></div></div>
