    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 桀宋</nav></header><main><article><h1>桀宋</h1><p>宋君偃淫佚無道，諸侯皆曰「桀宋」，遂為齊、魏、楚所滅。</p><p>宋君偃立十一年，自立為王。東敗齊，取五城；南敗楚，取地三百里；西敗魏軍，乃與齊、魏為敵國。盛血以韋囊，縣而射之，命曰「射天」。淫於酒、妇人。群臣諫者輒射之。於是諸侯皆曰「桀宋」。「宋其復為紂所為，不可不誅。」告齊伐宋。王偃立四十七年，齊湣王與魏、楚伐宋，殺王偃，遂滅宋而三分其地。夫以暴易暴，而宋以亡。</p><p><strong>所出</strong>：《史記·卷038》 — https://zh.wikisource.org/wiki/史記/卷038</p></article></main></div></div>
