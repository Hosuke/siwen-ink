    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 射策</nav></header><main><article><h1>射策</h1><p>探事獻說之考試文體，抽簽取題而作答也。</p><p>對策者，應詔而陳政也；射策者，探事而獻說也。言中理準，譬射侯中的，二名雖殊，即議之別體也。漢文中年，始舉賢良，晁錯對策，蔚為舉首。及孝武益明，旁求俊乂，對策者以第一登庸，射策者以甲科入仕，斯固選賢要術也。</p><p><strong>所出</strong>：《文心雕龍 · 議對》 — https://zh.wikisource.org/wiki/文心雕龍/議對</p></article></main></div></div>
