    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 言之責</nav></header><main><article><h1>言之責</h1><p>臣無端末之辯而妄言者，當負言責。</p><p>主道者，使人臣必有言之責，又有不言之責。言無端末辯無所驗者，此言之責也。</p><p><strong>所出</strong>：《韓非子 · 南面》 — https://zh.wikisource.org/wiki/韓非子/南面</p></article></main></div></div>
