    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 結髮與匈奴大小七十餘戰</nav></header><main><article><h1>結髮與匈奴大小七十餘戰</h1><p>廣自謂終身征戰，功名不遂。</p><p>廣至幕府，謂其麾下曰：「結髮與匈奴大小七十餘戰，今幸從大將軍出接單-{于}-兵，而大將軍又徙部行回遠，而又迷失道，豈非天哉！且年六十餘矣，終不能復對刀筆之吏。」遂引刀自剄。</p><p><strong>所出</strong>：《史記 · 卷109》 — https://zh.wikisource.org/wiki/史記/卷109</p></article></main></div></div>
