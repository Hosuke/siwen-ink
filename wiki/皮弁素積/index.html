    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 皮弁素積</nav></header><main><article><h1>皮弁素積</h1><p>三王共服之禮服，白鹿皮為弁，素帛疊積以為裳。</p><p>皮弁素積者，三王共服之禮也。皮弁以白鹿皮為之，形如覆杯，前高廣，後卑銳。素積，又謂素蹌，素者，白色無紋；積者，謂下裳以素帛疊積數幅以成之。上衣下裳皆以素帛為之，無他采色之飾。[[三加]]之中，再加皮弁，即服此衣。加皮弁時，祝辭有「敬爾威儀」之語，蓋皮弁為視朝聽事之服，表公卿之德。周之大夫視朝及朔日皆服此，故[[三加]]以皮弁為再加之服也。</p><p><strong>所出</strong>：《儀禮 · 士冠禮》 — https://zh.wikisource.org/wiki/儀禮/士冠禮</p></article></main></div></div>
