    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 居是邑不非其大夫</nav></header><main><article><h1>居是邑不非其大夫</h1><p>禮，居是邑不非其大夫。夫子不知，非不知，乃知而不言。</p><p>子路問魯大夫練而牀，孔子曰「吾不知也」。子貢問之，孔子曰「非禮也」。子路以為夫子無所不知，殊不知禮，居是邑，不非其大夫。</p><p>孔子非不知也，禮有所不言爾。居人之邑，尊其賢大夫，不議其失。子貢能悟此義，故夫子許之。此與[[審其所以從之之謂孝]]之義同：知與言之間，又有義焉。</p><p><strong>所出</strong>：《荀子 · 子道篇》 — https://zh.wikisource.org/wiki/荀子/子道篇</p></article></main></div></div>
