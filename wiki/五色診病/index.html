    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五色診病</nav></header><main><article><h1>五色診病</h1><p>倉公受黃帝、扁鵲脈書，知人死生決嫌疑定可治，皆以五色觀面部以為據。</p><p>陽慶年七十餘，無子，使意盡去其故方，更悉以禁方予之，傳黃帝、扁鵲之脈書，五色診病，知人死生，決嫌疑，定可治，及藥論，甚精。受之三年，為人治病，決死生多驗。</p><p>臣意即避席再拜謁，受其脈書上下經、五色診、奇咳術、揆度陰陽外變、藥論、石神、接陰陽禁書，受讀解驗之，可一年所。</p><p><strong>所出</strong>：《史記 · 卷105》 — https://zh.wikisource.org/wiki/史記/卷105</p></article></main></div></div>
