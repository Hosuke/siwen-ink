    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天之道不爭而善勝</nav></header><main><article><h1>天之道不爭而善勝</h1><p>天道不爭而無往不勝，自然之理也。</p><p>天之道，不與物爭，而萬物莫能與之爭。不言而善應，感而遂通也；不召而自來，誠之至也；繟然而善謀，悠然而無不中也。為而不宰，成而不居，其至矣乎。</p><p><strong>所出</strong>：《老子河上公章句 · 任為》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
