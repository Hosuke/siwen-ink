    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 艮其背</nav></header><main><article><h1>艮其背</h1><p>止於所不見，不獲其身</p><p>艮其背，不獲其身，行其庭，不見其人，無咎：此艮卦之卦辭也。背者，不見之處；身者，已之類也。止於背，則不見其身；行於庭，則不見其人。止於不見之處，無所迎合，道在是焉，故無咎。</p><p><strong>所出</strong>：《周易 · 艮》 — https://zh.wikisource.org/wiki/周易/艮</p></article></main></div></div>
