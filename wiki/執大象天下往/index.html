    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 執大象天下往</nav></header><main><article><h1>執大象天下往</h1><p>聖人執道，民歸無害，天下安平。</p><p>聖人執道，則天下之民皆往歸之。往歸而無所賊害，故其國安、其政平、其德化大被於天下也。夫道之出於口，則淡乎無味，不若樂與餌之可娛嗜欲、悅人情也。視之不足以見其色，聽之不足以聞其聲，用之不足以究其極。此聖人之德之所以不可名言，而天下之所以自化者也。</p><p><strong>所出</strong>：《老子河上公章句 · 仁德》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
