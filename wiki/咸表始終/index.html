    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 咸表始終</nav></header><main><article><h1>咸表始終</h1><p>封爵之表，備載始終，以見功過。</p><p>太史公所述此表，封者九十有餘，咸表始終。每一侯也，詳載其始封之功及國除之由，使後世得考見其始終功過。此史氏之筆法，所以勸善而戒後也。</p><p><strong>所出</strong>：《史記 · 惠景閒矦者年表》 — https://zh.wikisource.org/wiki/史記/惠景閒矦者年表</p></article></main></div></div>
