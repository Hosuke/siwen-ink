    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 獨視獨聽獨断</nav></header><main><article><h1>獨視獨聽獨断</h1><p>明主能獨視獨聽，故可以為天下主。</p><p>[[申子]]曰：「獨視者謂明，獨聽者謂聰。能獨断者，故可以為天下主。」</p><p><strong>所出</strong>：《韓非子 · 外儲說右上》 — https://zh.wikisource.org/wiki/韓非子/外儲說右上</p></article></main></div></div>
