    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 兵者，尊主安國之經</nav></header><main><article><h1>兵者，尊主安國之經</h1><p>誅暴禁邪，莫要於兵。</p><p>君之所以卑尊，國之所以安危者，莫要於兵。故誅暴國必以兵，禁辟民必以刑。然則兵者，外以誅暴，內以禁邪。故兵者，尊主安國之經也，不可廢也。</p><p>若夫世主則不然。外不以兵而欲誅暴，則地必虧矣。內不以刑而欲禁邪，則國必亂矣。</p><p>兵之於國，猶筋骨之於形體，不可或闕。廢兵則威不行，暴國無以誅，奸邪無以禁。</p><p><strong>所出</strong>：《管子 · 第28篇參患》 — https://zh.wikisource.org/wiki/管子/第28篇參患</p></article></main></div></div>
