    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 中道而廢</nav></header><main><article><h1>中道而廢</h1><p>力不足者半途而止，非畫地自限</p><p>冉求曰：「非不說子之道，力不足也。」孔子曰：「力不足者，中道而廢；今女畫。」蓋中道而廢，勢竭力盡之謂也；若自畫而不前，非力不足，乃志不果耳。</p><p><strong>所出</strong>：《論語 · 雍也第六》 — https://zh.wikisource.org/wiki/論語/雍也第六</p></article></main></div></div>
