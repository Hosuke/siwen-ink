    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 先惡于民</nav></header><main><article><h1>先惡于民</h1><p>身先為不善，民乃奉其恫。</p><p>乃既先惡于民，乃奉其恫，汝悔身何及！</p><p>盤庚戒臣民之先自敗壞者。言茍[[先惡于民]]，不率厥德，則民奉其痛苦而怨叛之；及其至也，欲[[悔身何及]]！此[[尚書]]所述先自正而後正人之義。[[予若觀火]]，在下者可不戒乎！</p><p><strong>所出</strong>：《尚書 · 盤庚上》 — https://zh.wikisource.org/wiki/尚書/盤庚上</p></article></main></div></div>
