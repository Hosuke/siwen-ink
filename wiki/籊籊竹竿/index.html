    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 籊籊竹竿</nav></header><main><article><h1>籊籊竹竿</h1><p>竹竿修長之貌，興懷歸而不得也</p><p>籊籊竹竿，以釣于淇。言竹竿脩長之貌。衞女昔在故土，以竹竿垂釣於淇水之上，此記憶中之事也。今身在異國，睹竹竿之象而思[[以寫我憂|故鄉之樂]]，然[[遠莫致之|道遠莫歸]]，是以前二句引起思歸之意。</p><p><strong>所出</strong>：《詩經 · 竹竿》 — https://zh.wikisource.org/wiki/詩經/竹竿</p></article></main></div></div>
