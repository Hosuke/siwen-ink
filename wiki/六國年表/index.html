    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 六國年表</nav></header><main><article><h1>六國年表</h1><p></p><p>《史記·六國年表》序見於[[六國年表]]。其論秦之興，以為「非必險固便形勢利也，蓋若天所助焉」；論後王之法，以為近己俗變，議卑易行。又言六國之盛，自三家分晉、田和滅齊始；秦既一天下，焚詩書，諸侯史記皆亡。末云因秦記起周元王，訖二世二百七十年，著興壞之端。</p><p>  <strong>所出</strong>：《史記 · 卷015》 — https://zh.wikisource.org/wiki/史記/卷015</p></article></main></div></div>
