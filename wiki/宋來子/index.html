    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 宋來子</nav></header><main><article><h1>宋來子</h1><p>楚莊公時市长，師乞食公，得中仙之道，居中嶽。</p><p>宋來子，楚莊公時市长。宋來子常灑掃一市，久之，時有乞食公，入市經日，乞歌曰：天庭發雙華，山源彰陰邪，清晨按天馬，來詣太真家。常歌此句乞食，一市人無解歌者，獨來子忽悟，疑是仙人，然未能解其歌耳。遂乃師此乞食公，棄官追逐積十三年，此公遂授以中仙之道。來子今在中嶽。乞食公者，西嶽真人馮延壽，周宣王時史官也。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 4》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/4</p></article></main></div></div>
