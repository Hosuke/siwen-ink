    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 混齏</nav></header><main><article><h1>混齏</h1><p>天地混沌、人物糜潰之象</p><p>混齏者，天地[[陽侯之波|陽九百六]]之會，周則大壞之時，天地混同，無復高下，人物糜潰，莫可分辨也。[[種民]]。</p><p>三統轉輪，有去有來。堯水之後、湯火為災，小小水火，罪重隨招。若[[陽侯之波|陽九]][[陽侯之波|百六]]之中，必有大小甲申。[[種民]]之善人得存，兇民則皆蕩盡而成混齏焉。</p><p><strong>所出</strong>：《太平經 · 01》 — https://zh.wikisource.org/wiki/太平經/01</p></article></main></div></div>
