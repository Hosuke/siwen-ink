    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 后稷配天</nav></header><main><article><h1>后稷配天</h1><p>后稷配享昊天，為周人祭天之祖。</p><p>后稷佐禹治水，教民播植，功侔造化。死後配天而祀，與天同尊。后稷配天，乃周人郊天之祭，后稷主配。后稷之德合於天，故得配天享用祀典。</p><p><strong>所出</strong>：《詩經 · 思文》 — https://zh.wikisource.org/wiki/詩經/思文</p></article></main></div></div>
