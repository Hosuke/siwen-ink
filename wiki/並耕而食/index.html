    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 並耕而食</nav></header><main><article><h1>並耕而食</h1><p>許行主君民同耕而食，無待於百工</p><p>許行自楚之滕，願受一廛而為氓，欲與滕君並耕而食，饔飧而治。孟子詰之，許子必種粟而後食，必織布而後衣，釜甑爨、鐵耕皆以粟易之，是未嘗不與百工交易也。百工之事固不可耕且為，況治天下乎。</p><p><strong>所出</strong>：《孟子 · 滕文公上》 — https://zh.wikisource.org/wiki/孟子/滕文公上</p></article></main></div></div>
