    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鳥焚其巢旅人先笑后號咷</nav></header><main><article><h1>鳥焚其巢旅人先笑后號咷</h1><p>高亢躁動，覆亡隨之，先喜後悲。</p><p>鳥焚其巢，旅人先笑后號咷。喪牛-{于}-易，凶。象曰：「以旅在上，其義焚也。喪牛-{于}-易，終莫之聞也。」上九以剛居上，在旅之極，高亢躁動，故有鳥焚巢之災。先笑後號，悲樂相循。易，狄國也。喪牛於易，莫有聞之者，凶之甚也。</p><p><strong>所出</strong>：《周易 · 旅》 — https://zh.wikisource.org/wiki/周易/旅</p></article></main></div></div>
