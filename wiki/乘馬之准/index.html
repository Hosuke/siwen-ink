    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 乘馬之准</nav></header><main><article><h1>乘馬之准</h1><p>物價齊同於天下，乃治國之標準。</p><p>乘馬之准，與天下齊准。彼物輕則泄，重則射，此[[鬥國相泄，輕重之家相奪]]之患也。王國則不然，持流而止。[[持流]]者，準之令、用地用人之筴，內修其政，外和鄰國，使物價不為[[輕重]]之家所操縱，則國用足而民不匱。</p><p><strong>所出</strong>：《管子 · 第69篇乘馬數》 — https://zh.wikisource.org/wiki/管子/第69篇乘馬數</p></article></main></div></div>
