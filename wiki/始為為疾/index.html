    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 始為為疾</nav></header><main><article><h1>始為為疾</h1><p>人以覺病之日始作為疾，猶以氣絕之日為身喪之候。</p><p>世人以覺病之日始作為疾，猶以氣絕之日為身喪之候也。唯怨風冷與暑濕，不知風冷暑濕，不能傷壯實之人也，徒患體虛氣少者，不能堪之，故為所中耳。</p><p><strong>所出</strong>：《抱朴子 · 卷13》 — https://zh.wikisource.org/wiki/抱朴子/卷13</p></article></main></div></div>
