    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以數治</nav></header><main><article><h1>以數治</h1><p>以功次授官，以法行賞，不以私言干之，則治道成。</p><p>韓非云「廷雖有辟言，不得以相干也，是謂以數治」。辟言者，邪僻之言也；數治者，以功次為次第而治之也。朝廷有事，小者不以毀言之間而廢功賞；官爵之授，必以功而以法，不以私言干之。如是則賞罰明，而姦邪無所倖矣。</p><p><strong>所出</strong>：《韓非子 · 飭令》 — https://zh.wikisource.org/wiki/韓非子/飭令</p></article></main></div></div>
