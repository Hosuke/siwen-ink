    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 行役夙夜</nav></header><main><article><h1>行役夙夜</h1><p>言遠行服役，朝夕不遑安息也。</p><p>「行役夙夜無已」「行役夙夜無寐」「行役夙夜必偕」，三章之辭也。夙夜，猶言早晚；無已，無休息也；無寐，不能安眠也；必偕，必與同伍共處也。</p><p>言行役之事，朝夕勤苦，無有止息。行者之勞，至於無已、無寐，是役使之然也。詩人述父母兄長之口，道其子在塗之苦，愈見骨肉離散之悲已。</p><p><strong>所出</strong>：《詩經 · 陟岵》 — https://zh.wikisource.org/wiki/詩經/陟岵</p></article></main></div></div>
