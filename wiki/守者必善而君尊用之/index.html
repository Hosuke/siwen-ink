    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 守者必善而君尊用之</nav></header><main><article><h1>守者必善而君尊用之</h1><p>守城之道，在守者善守、君能尊用，二者皆備，乃可言守。</p><p>子墨子云：「若君用之，守者又必能乎？守者不能，而君用之，則猶若不可以守也。然則守者必善，而君尊用之，然後可以守也。」</p><p>是故守城之法，非徒守者之責，亦在君上之信任委任。守者有其能，君能用其能，上下相親相通，乃可持久。</p><p><strong>所出</strong>：《墨子 · 備城門》 — https://zh.wikisource.org/wiki/墨子/備城門</p></article></main></div></div>
