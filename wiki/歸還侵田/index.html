    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 歸還侵田</nav></header><main><article><h1>歸還侵田</h1><p>齊國歸還所侵魯之鄆、汶陽、龜陰之田。</p><p>景公懼而動，知義不若，歸而大恐，告其群臣曰：「魯以君子之道輔其君，而子獨以夷狄之道敎寡人，使得罪於魯君，為之奈何？」有司進對曰：「君子有過則謝以質，小人有過則謝以文。君若悼之，則謝以質。」於是齊侯乃歸所侵魯之鄆、汶陽、龜陰之田以謝過。此夾谷之會後齊國歸田於魯也。</p><p><strong>所出</strong>：《史記 · 卷047》 — https://zh.wikisource.org/wiki/史記/卷047</p></article></main></div></div>
