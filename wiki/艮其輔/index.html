    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 艮其輔</nav></header><main><article><h1>艮其輔</h1><p>止言於輔，言有序則悔亡</p><p>艮其輔，言有序，悔亡：六五之爻辭也。輔者，口輔也。<strong>象曰</strong>「艮其輔，以中正也」。言者行之發，止於言而不妄發，發而有序，故悔亡。</p><p><strong>所出</strong>：《周易 · 艮》 — https://zh.wikisource.org/wiki/周易/艮</p></article></main></div></div>
