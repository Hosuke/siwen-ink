    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鯈魚出游從容</nav></header><main><article><h1>鯈魚出游從容</h1><p>莊周與惠子濠梁之辯，「子非魚」之問，「請循其本」之答。喻認知相對，而樂在會心。</p><p>莊子與惠子遊於濠梁之上。莊子曰：「鯈魚出游從容，是魚之樂也。」惠子曰：「子非魚，安知魚之樂？」莊子曰：「子非我，安知我不知魚之樂？」惠子曰：「我非子，固不知子矣；子固非魚也，子之不知魚之樂，全矣！」莊子曰：「請循其本。子曰『汝安知魚樂』-{云}-者，既已知吾知之而問我，我知之濠上也。」</p><p><strong>所出</strong>：《莊子 · 秋水》 — https://zh.wikisource.org/wiki/莊子/秋水</p></article></main></div></div>
