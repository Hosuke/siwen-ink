    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 南北斗</nav></header><main><article><h1>南北斗</h1><p>南斗六星為天廟，丞相宰輔之位；北斗七星為帝車，運天綱。</p><p>北斗七星，春秋運斗樞云「斗，第一天樞，第二旋，第三璣，第四權，第五衡，第六開陽，第七搖光。第一至第四為魁，第五至第七為標，合而為斗」。文耀鉤云「斗者，天之喉舌」。</p><p>南斗六星為天廟，丞相、大宰之位，主荐賢良授爵祿，又主兵，一曰天機。南二星魁、天粱；中央一星天相；北二星天府庭也。占：斗星盛明，王道和平，爵祿行；不然反是。</p><p><strong>所出</strong>：《史記 · 卷027》 — https://zh.wikisource.org/wiki/史記/卷027</p></article></main></div></div>
