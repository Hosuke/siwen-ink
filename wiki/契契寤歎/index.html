    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 契契寤歎，哀我憚人</nav></header><main><article><h1>契契寤歎，哀我憚人</h1><p>愁苦夜歎，哀憚病之人</p><p>契契，窘迫之貌。憚人，疲病之人也。言愁苦而寤歎，深夜不寐，哀我憚病之人不得息也。詩人自言其愁，亦以見東土之民役使不息，無有已時。</p><p><strong>所出</strong>：《詩經 · 大東》 — https://zh.wikisource.org/wiki/詩經/大東</p></article></main></div></div>
