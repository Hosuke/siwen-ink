    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 節儉風諫</nav></header><main><article><h1>節儉風諫</h1><p>上林之賦卒章歸之節儉，以諷諫天子勿淫樂奢侈。</p><p>相如以「子虛」，虛言也，為楚稱；「烏有先生」者，烏有此事也，為齊難；「無是公」者，無是人也，明天子之義。故空藉此三人為辭，以推天子諸侯之苑囿。其卒章歸之於節儉，因以風諫。</p><p><strong>所出</strong>：《史記 · 卷117》 — https://zh.wikisource.org/wiki/史記/卷117</p></article></main></div></div>
