    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 木上有水</nav></header><main><article><h1>木上有水</h1><p>井之象也，木上有水，君子法之以養民。</p><p>《象》曰：「木上有水，井。」木者，巽之象；水者，坎之象；木上有水，桔橰汲引之象也。君子觀此象，知水在井下而在上汲，知民之在下而待上之養也。《大象》又言：「君子以[[勞民勸相]]。」言君子法井之象，勤於民事，勸民相救相養，使民各有以自給。此[[井之常道]]，[[井養而不窮]]之義也。</p><p><strong>所出</strong>：《周易 · 井》 — https://zh.wikisource.org/wiki/周易/井</p></article></main></div></div>
