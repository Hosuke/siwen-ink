    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 七世之廟可以觀德</nav></header><main><article><h1>七世之廟可以觀德</h1><p>祖宗之德，觀於七廟；諸侯之政，觀於長民之官。</p><p>七廟之制，所以象先王之德也。七世之德修於上，則萬民安於下；七世之德亡，則天下之亂隨之。是故觀七廟之制，而先王之德可知；觀萬夫之長，而一國之政可察也。</p><p>嗚呼！七世之廟，可以觀德。萬夫之長，可以觀政。</p><p><strong>所出</strong>：《尚書 · 咸有一德》 — https://zh.wikisource.org/wiki/尚書/咸有一德</p></article></main></div></div>
