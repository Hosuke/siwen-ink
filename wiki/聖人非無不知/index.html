    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖人非無不知</nav></header><main><article><h1>聖人非無不知</h1><p>聖人有所不知、有所不照、有所不聞，非仙也。</p><p>夫吐故納新者，因氣以長氣，而氣大衰者則難長也。服食藥物者，因血以益血，而血垂竭者則難益也。夫賓士而喘逆，或欬或滿，用力役體，汲汲短乏者，氣損之候也。面無光色，皮膚枯臘，唇焦脈白，腠理萎瘁者，血減之證也。二證既衰於外，則靈根亦凋於中矣。如此，則不得上藥，不能救也。</p><p><strong>所出</strong>：《抱朴子 · 卷13》 — https://zh.wikisource.org/wiki/抱朴子/卷13</p></article></main></div></div>
