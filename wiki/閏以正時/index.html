    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 閏以正時</nav></header><main><article><h1>閏以正時</h1><p>閏月當告朔，乃所以正時、作事、厚民之道；不告則棄時政。</p><p>閏月不告朔，非禮也。閏以正時，時以作事，事以厚生，生民之道，於是乎在矣。不告閏朔，棄時政也，何以為民？</p><p><strong>所出</strong>：《春秋左氏傳 · 文公》 — https://zh.wikisource.org/wiki/春秋左氏傳/文公</p></article></main></div></div>
