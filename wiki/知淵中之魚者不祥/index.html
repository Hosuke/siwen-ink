    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 知淵中之魚者不祥</nav></header><main><article><h1>知淵中之魚者不祥</h1><p>窺知人之隱，危身之道</p><p>田成子與隰斯彌登臺四望，南望，隰子家之樹蔽之。田成子不言。隰子歸，使人伐之，斧創而止。相室問故，隰子曰：「知淵中之魚者不祥。田子將有大事，我示之知微，必危矣。不伐樹，未有罪也；知人之所不言，其罪大矣。」乃不伐。</p><p><strong>所出</strong>：《韓非子 · 說林上》 — https://zh.wikisource.org/wiki/韓非子/說林上</p></article></main></div></div>
