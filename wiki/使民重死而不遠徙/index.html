    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 使民重死而不遠徙</nav></header><main><article><h1>使民重死而不遠徙</h1><p>民知自足，不事遠涉</p><p>使民重死而不遠徙者，治道尚清靜，使民知自足而不輕遷徙也。重死者，貴生樂活，不輕死傷；不遠徙者，安土重遷，不事遠涉。夫生於是，死於是，老死不徙，則心無外慕，性自充實，此小國寡民之要也。</p><p><strong>所出</strong>：《老子河上公章句 · 獨立》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
