    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 視垣一方</nav></header><main><article><h1>視垣一方</h1><p>扁鵲飲上池之水三十日後，所獲透視之能，可以視見牆垣另一方之人。</p><p>扁鵲以其言飲藥三十日，視見垣一方人。以此視病，盡見五藏癥結，特以診脈為名耳。</p><p><strong>所出</strong>：《史記 · 卷105》 — https://zh.wikisource.org/wiki/史記/卷105</p></article></main></div></div>
