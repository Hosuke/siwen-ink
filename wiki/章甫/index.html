    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 章甫</nav></header><main><article><h1>章甫</h1><p>殷道之冠，章甫是也，殷士所服。</p><p>章甫，殷道之冠也。《記》曰「章甫，殷道也」，言殷之大夫士行冠禮，所加之冠名曰章甫。章者，文章之義；甫者，男子美稱之通名。殷人尚質，故以章甫為冠，表其文德之華。[[委貌]]為周道，[[母追]]為夏后氏之道，章甫則殷道之冠，三代異制，而皆以之加於[[三加]]之首也。</p><p><strong>所出</strong>：《儀禮 · 士冠禮》 — https://zh.wikisource.org/wiki/儀禮/士冠禮</p></article></main></div></div>
