    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 言道而不言事</nav></header><main><article><h1>言道而不言事</h1><p>論道當與論事相須，不可偏廢</p><p>論道而不論事，則無以與世浮沉；論事而不論道，則無以與化遊息。二者相須，闕一不可。</p><p>《要略》曰：「故言道而不言事，則無以與世浮沉；言事而不言道，則無以與化遊息。」</p><p>夫道者，萬物之宗、治亂之本也；事者，當世之務、吉凶之實也。[[通變|通變]]之道，在乎兼備。是以聖人之言，言之文，行之遠，內可以修己，外可以應物。</p><p><strong>所出</strong>：《淮南子 · 要略》 — https://zh.wikisource.org/wiki/淮南子/要略</p></article></main></div></div>
