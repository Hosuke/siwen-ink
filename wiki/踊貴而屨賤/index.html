    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 踊貴而屨賤</nav></header><main><article><h1>踊貴而屨賤</h1><p>刑罰繁苛則踊貴而常履賤，以見濫刑之弊。</p><p>晏子使齊，景公欲徙其居。晏子辭以家貧待市食。公問：「子家習市，識物價乎？」時景公繁於刑。晏子對曰：「踊貴而屨賤。」公詰其故，對曰：「刑多也。」公造然變色，遂損刑五。</p><p>或曰：[[晏子之貴踊非其誠也欲便辭以止多刑也此不察治之患也]]。夫刑當無多，不當無少。無以不當聞，而以太多說，[[無術之患也]]。刑之於治，猶權衡之於輕重，貴在適當，不在繁多。濫刑不止，則民無所措手足，而跛者之履反貴於完人之鞋矣。</p><p><strong>所出</strong>：《韓非子 · 難二》 — https://zh.wikisource.org/wiki/韓非子/難二</p></article></main></div></div>
