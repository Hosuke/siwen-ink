    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 小臣楔齒角柶</nav></header><main><article><h1>小臣楔齒角柶</h1><p>始死，楔齒用角柶，綴足用燕几，所以正尸以待飯含。</p><p>始死，遷尸於床，幠用斂衾，去死衣，小臣楔齒用角柶，綴足用燕几，君大夫士一也。</p><p><strong>所出</strong>：《禮記 · 喪大記》 — https://zh.wikisource.org/wiki/禮記/喪大記</p></article></main></div></div>
