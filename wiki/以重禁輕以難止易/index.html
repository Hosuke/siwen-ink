    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以重禁輕，以難止易</nav></header><main><article><h1>以重禁輕，以難止易</h1><p>禁人之所重，止人之所難，則廉貪皆正。</p><p>古之善守者，以其所重禁其所輕，以其所難止其所易，故君子與小人俱正，盜跖與曾、史俱廉。夫貪者畏重禁，懦者憚難止，故法之所加，暴者守愿，邪者反正，大勇愿，巨盜貞，而天下公平，齊民之情正矣。</p><p><strong>所出</strong>：《韓非子 · 守道》 — https://zh.wikisource.org/wiki/韓非子/守道</p></article></main></div></div>
