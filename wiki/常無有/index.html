    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 常無有</nav></header><main><article><h1>常無有</h1><p>常無與常有名同道異也。</p><p>以本為精，以物為粗，以有積為不足，澹然獨與神明居。古之道術有在於是者，關尹老耼聞其風而悅之。<strong>建之以常無有</strong>，主之以太一，以濡弱謙下為表，以空虛不毀萬物為實。</p><p><strong>所出</strong>：《莊子 · 天下》 — https://zh.wikisource.org/wiki/莊子/天下</p></article></main></div></div>
