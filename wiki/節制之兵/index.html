    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 節制之兵</nav></header><main><article><h1>節制之兵</h1><p>桓文之節制，齊之善用兵者，然猶未及王者之仁義。</p><p>齊之技擊不可以遇魏氏之武卒，魏氏之武卒不可以遇秦之銳士，秦之銳士不可以當桓文之節制，桓文之節制不可以敵[[湯武]]之仁義。齊桓、晉文、楚莊、吳闔閭、越勾踐是皆和齊之兵也，可謂入其域矣，然而未有本統也，故可以霸而不可以王。</p><p><strong>所出</strong>：《荀子 · 議兵篇》 — https://zh.wikisource.org/wiki/荀子/議兵篇</p></article></main></div></div>
