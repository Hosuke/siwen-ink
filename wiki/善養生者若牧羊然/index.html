    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 善養生者若牧羊然</nav></header><main><article><h1>善養生者若牧羊然</h1><p>善養生者視其後者而鞭之，不使偏廢一端。</p><p>田開之見周威公，威公曰：「吾聞祝腎學生，吾子與祝腎游，亦何聞焉？」田開之曰：「聞之夫子曰：『善養生者，若牧羊然，視其後者而鞭之。』」</p><p><strong>所出</strong>：《莊子 · 達生》 — https://zh.wikisource.org/wiki/莊子/達生</p></article></main></div></div>
