    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 止水能止眾止</nav></header><main><article><h1>止水能止眾止</h1><p>唯止則眾止，水止而後可鑑；人亦猶是，心止而後物歸。</p><p>仲尼語常季曰：「人莫鑑於流水而鑑於止水。唯止，能止眾止。」言流水不可鑑形，唯止水澄明，可以照見；人亦如是，心止而不動，物自然歸之。</p><p><strong>所出</strong>：《莊子 · 德充符》 — https://zh.wikisource.org/wiki/莊子/德充符</p></article></main></div></div>
