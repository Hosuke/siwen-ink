    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 飛鉗</nav></header><main><article><h1>飛鉗</h1><p>縱橫家之術，以言辞制服人之術也。</p><p>《轉丸》騁其巧辭，《飛鉗》伏其精術。[[從橫參謀長短角勢]]之中，《飛鉗》為要術之一。[[披肝膽以濟辭]]之外，復有權謀機變之道。贊曰：「說爾飛鉗，呼吸沮勸。」</p><p><strong>所出</strong>：《文心雕龍 · 論說》 — https://zh.wikisource.org/wiki/文心雕龍/論說</p></article></main></div></div>
