    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 緘連以待賈者</nav></header><main><article><h1>緘連以待賈者</h1><p>珍物封存待價而沽，以喻賢才隱伏而不遇。</p><p>抱朴子以貨財為喻：「方之貨也，則緘連以待賈者，唯至珍而難售；鳴鼓以徇之者，雖凡蔽而易盡。」又以材木為喻：「結根於嵩岱者，雖竦蓋千仞，垂蔭萬畝，而莫之知也；插株途要者，雖鉤曲戾細而速朽，而猶見用也。」</p><p><strong>所出</strong>：《抱朴子 · 卷20》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷20</p></article></main></div></div>
