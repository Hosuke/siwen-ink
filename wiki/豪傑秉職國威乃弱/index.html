    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 豪傑秉職國威乃弱</nav></header><main><article><h1>豪傑秉職國威乃弱</h1><p>豪傑專殺生之權則國威弱，唯殺生歸君乃可久安。</p><p>豪傑秉職，國威乃弱；殺生在豪傑，國勢乃竭；豪傑低首，國乃可久；殺生在君，國乃可安；四民用靈，國乃無儲；四民用足，國乃安樂。</p><p>賢臣內，則邪臣外；邪臣內，則賢臣斃。內外失宜，禍亂傳世。大臣疑主，眾奸集聚。臣當君尊，上下乃昏；君當臣處，上下失序。</p><p><strong>所出</strong>：《三略》 — https://zh.wikisource.org/wiki/三略</p></article></main></div></div>
