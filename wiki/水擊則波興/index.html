    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 水擊則波興</nav></header><main><article><h1>水擊則波興</h1><p>水擊興波，氣亂智昏；波水不平，智昏不可以為政。</p><p>水擊則波興，氣亂則智昏。智昏不可以為政，波水不可以為平。故聖王執一而勿失，萬物之情既矣，四夷九州服矣。夫一者至貴，無適於天下。聖人託於無適，故民命繋矣。</p><p><strong>所出</strong>：《淮南子 · 齊俗訓》 — https://zh.wikisource.org/wiki/淮南子/齊俗訓</p></article></main></div></div>
