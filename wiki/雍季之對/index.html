    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 雍季之對</nav></header><main><article><h1>雍季之對</h1><p>以焚林而田喻以詐遇民，偷取一時，後必無復。</p><p>雍季對文公問戰，曰：「焚林而田，偷取多獸，後必無獸；以詐遇民，偷取一時，後必無復。」文公善之，辭雍季，以舅犯之謀與楚人戰。</p><p>然「或曰」云：雍季之對，不當文公之問。凡對問者，有因問小大緩急而對，所問高大而對以卑狹，則明主弗受。文公問「以少遇衆」，而對曰「後必無復」，非所以應也。且戰而勝，國安兵強，雖有後復，莫大於此，萬世之利奚患不至？</p><p><strong>所出</strong>：《韓非子 · 難一》 — https://zh.wikisource.org/wiki/韓非子/難一</p></article></main></div></div>
