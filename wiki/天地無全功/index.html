    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天地無全功</nav></header><main><article><h1>天地無全功</h1><p>天職生覆，地職形載，聖職教化，物職所宜，各有短長。</p><p>子列子曰：「天地無全功，聖人無全能，萬物無全用。故天職生覆，地職形載，聖職教化，物職所宜。然則天有所短，地有所長，聖有所否，物有所通。何則？生覆者不能形載，形載者不能教化，教化者不能違所宜，宜定者不出所位。故天地之道，非陰則陽；聖人之教，非仁則義；萬物之宜，非柔則剛：此皆隨所宜而不能出所位者也。」</p><p><strong>所出</strong>：《列子 · 天瑞篇》 — https://zh.wikisource.org/wiki/列子/天瑞篇</p></article></main></div></div>
