    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 知道易勿言難</nav></header><main><article><h1>知道易勿言難</h1><p>知而慎言，乃合天道</p><p>莊子曰：「知道易，勿言難。」</p><p>[[知而不言，所以之天也；知而言之，所以之人也。古之人，天而不人。]]</p><p>夫道可貴在契合天真，非以言辭炫於世也。世之人所知既淺，又好為夸談，自眩其能，是乃離道日遠矣。知之而不言，非不能言，乃知言之所以害也。</p><p><strong>所出</strong>：《莊子 · 列禦寇》 — https://zh.wikisource.org/wiki/莊子/列禦寇</p></article></main></div></div>
