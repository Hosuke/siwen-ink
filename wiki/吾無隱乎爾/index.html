    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 吾無行而不與二三子者</nav></header><main><article><h1>吾無行而不與二三子者</h1><p>聖人教人無隱。</p><p>[[孔子]]言二三子以我為隱乎，吾無隱乎爾。[[聖人]]之行，無一不與二三子共之。丘者，[[聖人]]自稱；無行不與者，言[[教誨]]之坦蕩，無一毫之隱秘也。此[[聖人]][[誨人不倦]]之實，亦見師生相孚之義。</p><p><strong>所出</strong>：《論語 · 述而第七》 — https://zh.wikisource.org/wiki/論語/述而第七</p></article></main></div></div>
