    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 起自布衣</nav></header><main><article><h1>起自布衣</h1><p>出身平民而為王侯，兄弟三人相繼稱王。</p><p>高帝葬田橫畢，為之流涕，歎曰：「嗟乎，有以也夫！起自布衣，兄弟三人更王，豈不賢乎哉！」</p><p>田橫與其兄田儋、田榮，皆起自齊之布衣，宗族豪強。陳涉起兵後，儋殺狄令自立為齊王，榮後亦自立為齊王，橫後復立田廣為齊王而相之。兄弟更王，皆起於微賤，故高帝歎其賢。</p><p><strong>所出</strong>：《史記 · 卷094》 — https://zh.wikisource.org/wiki/史記/卷094</p></article></main></div></div>
