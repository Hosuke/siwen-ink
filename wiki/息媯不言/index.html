    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 息媯不言</nav></header><main><article><h1>息媯不言</h1><p>息媯歸楚，生堵敖及成王，未嘗言以其一婦人事二夫，終遂滅息。</p><p>蔡哀侯爲莘故，繩息媯以語楚子。楚子如息，以食入享，遂滅息。以息媯歸，生堵敖及成王焉，未言。楚子問之，對曰：「吾一妇人而事二夫，縱弗能死，其又奚言？」楚子以蔡侯滅息，遂伐蔡。秋七月，楚入蔡。</p><p>君子曰：「《商書》所謂『惡之易也，如火之燎于原，不可鄉邇，其猶可撲滅』者，其如蔡哀侯乎。」</p><p><strong>所出</strong>：《春秋左氏傳 · 莊公》 — https://zh.wikisource.org/wiki/春秋左氏傳/莊公</p></article></main></div></div>
