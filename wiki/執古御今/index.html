    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 執古御今</nav></header><main><article><h1>執古御今</h1><p>執守古道，以御今之所有。</p><p>道本無形，超越視聽，非耳目所能及，非搏執所能得。然其為物也，混然至一，無上下之可分，無始終之可窺。其體則無狀可名，其象則無物可似，恍惚而不可方物。是故聖人執守此古昔之道，以駕馭乎今世之所有。蓋道無古今之異，體道者能用古以治今，通古今而為一者也。</p><p><strong>所出</strong>：《老子河上公章句 · 贊玄》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
