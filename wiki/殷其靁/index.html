    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 殷其靁</nav></header><main><article><h1>殷其靁</h1><p>室家閔遠行君子之詩</p><p>《殷其靁》，召南之詩也。毛詩序云：「《殷其靁》，勸以義也。召南之大夫遠行從政，不遑寧處。其室家能閔其勤勞，勸以義也。」</p><p>詩凡三章，章六句。首章云：「殷其靁，在南山之陽，何斯違斯，莫敢或遑，振振君子，歸哉歸哉。」以雷聲起興，言君子遠役於南山之陽，不敢暇豫，室家望其歸也。餘二章辭意略同，唯「南山之側」「南山之下」「莫敢遑息」「莫或遑處」互見其異，迭言君子之勤、室家之望而已。</p><p>疊句「歸哉歸哉」，閔其勞而望其歸，反覆不能已也。</p><p><strong>所出</strong>：《詩經 · 殷其靁》 — https://zh.wikisource.org/wiki/詩經/殷其靁</p></article></main></div></div>
