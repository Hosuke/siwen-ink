    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蓋公治道</nav></header><main><article><h1>蓋公治道</h1><p>蓋公言治道貴清靜，參用之以治齊。</p><p>參之相齊，聞膠西有蓋公，善治黃老言，使人厚幣請之。既見蓋公，蓋公為言治道貴清靜而民自定，推此類具言之。參於是避正堂，舍蓋公焉。其治要用黃老術，故相齊九年，齊國安集。夫清靜之治，非專言無為也，要在因民心之自然，去政治之苛擾，使民各遂其生也。</p><p><strong>所出</strong>：《史記 · 卷054》 — https://zh.wikisource.org/wiki/史記/卷054</p></article></main></div></div>
