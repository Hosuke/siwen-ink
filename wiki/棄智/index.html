    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 棄智</nav></header><main><article><h1>棄智</h1><p>捐棄機心智巧，使民返於無知。</p><p>棄智者，捐棄心知智巧之私也。智巧既去，民不尚機心，上下渾然，淳風可復。</p><p><strong>所出</strong>：《老子河上公章句 · 還淳》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
