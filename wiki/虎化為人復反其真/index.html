    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 虎化為人復反其真</nav></header><main><article><h1>虎化為人復反其真</h1><p>姦臣雖似服法，終將變化為人，乃復反其虎之本性。</p><p>主施其法，大虎將怯；主施其刑，大虎自寧。法刑苟信，虎化為人，復反其真。姦臣之性，猶虎也。威刑之下，假作恭順，若化為人；及其威稍弛，則復為虎，噬主之心如故。此明主治姦之所以貴刑罰之必信也。信則姦萌早絕，不信則虎終為患。法苟不行，虎終不化；法苟有信，虎乃化而不敢復反。</p><p><strong>所出</strong>：《韓非子 · 揚權》 — https://zh.wikisource.org/wiki/韓非子/揚權</p></article></main></div></div>
