    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以身濟大海</nav></header><main><article><h1>以身濟大海</h1><p>善治本富者，隨天下之高低而為之高下。</p><p>管子戒桓公曰：「夫善用本者，若以身濟於大海，觀風之所起，天下高則高，天下下則下。天高我下，則財利稅於天下矣。」本富者，固守而不通移，則必為天下所奪。善治者如水之就下，隨物以為低昂，此治本之要道也。</p><p><strong>所出</strong>：《管子 · 第77篇地數》 — https://zh.wikisource.org/wiki/管子/第77篇地數</p></article></main></div></div>
