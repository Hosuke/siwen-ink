    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鏡清衡正</nav></header><main><article><h1>鏡清衡正</h1><p>鏡清則美惡比焉，衡正則輕重載焉；法亦如是，不可搖動。</p><p>鏡清而無事，則美惡從而比焉；衡正而無事，則輕重從而載焉。夫搖鏡則不得為明，搖衡則不得為正，法之謂也。</p><p>語曰：「家有常業，雖飢不餓；國有常法，雖危不亡。」舍常法而從私意，則臣下飾於智能；臣下飾於智能，則法禁不立矣。是妄意之道行，治國之道廢也。</p><p>故先王以道為常，以法為本。本治者名尊，本亂者名絶。凡智能明通，有以則行，無以則止。故智能單道，不可傳於人；而道法萬全，智能多失。</p><p><strong>所出</strong>：《韓非子 · 飾邪》 — https://zh.wikisource.org/wiki/韓非子/飾邪</p></article></main></div></div>
