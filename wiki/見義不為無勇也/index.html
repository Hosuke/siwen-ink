    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 見義不為無勇也</nav></header><main><article><h1>見義不為無勇也</h1><p>見義不勇爲，是無勇之人也。</p><p>《論語》載孔子之言曰：「見義不爲，無勇也。」言仁義之道人所當行，見之而不能勇於作爲，是怯懦之人也。勇之於仁義，如足之於行，不可闕也。</p><p><strong>所出</strong>：《論語 · 爲政第二》 — https://zh.wikisource.org/wiki/論語/爲政第二</p></article></main></div></div>
