    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 河南之戰</nav></header><main><article><h1>河南之戰</h1><p>衞青出雲中至高闕，略河南地至于隴西，捕虜數千，畜數十萬，遂以河南地為朔方郡。</p><p>遂略河南地，至于隴西，捕首虜數千，畜數十萬，走白羊、樓煩王。遂以河南地為朔方郡。</p><p><strong>所出</strong>：《史記 · 卷111》 — https://zh.wikisource.org/wiki/史記/卷111</p></article></main></div></div>
