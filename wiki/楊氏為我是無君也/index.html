    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 楊氏為我是無君也</nav></header><main><article><h1>楊氏為我是無君也</h1><p>楊朱之學務為我，是廢君臣之義，孟子深斥之。</p><p>聖王不作，諸侯放恣，處士橫議。楊朱、墨翟之言盈天下。天下之言，不歸楊則歸墨。楊氏為我，是無君也；墨氏兼愛，是無父也。無父無君，是禽獸也。楊墨之道不息，孔子之道不著，是邪說誣民、充塞仁義也。</p><p><strong>所出</strong>：《孟子 · 滕文公下》 — https://zh.wikisource.org/wiki/孟子/滕文公下</p></article></main></div></div>
