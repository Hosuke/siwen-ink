    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 薪刈其楚</nav></header><main><article><h1>薪刈其楚</h1><p>刈薪為秣，以迎其歸，喻男子傾慕之切而卒不可得。</p><p>刈取薪柴，言刈其楚，言刈其蔞，以秣其馬、以秣其駒，以待迎嫁。蓋悅之深而思所以迎致之，然遊女終不可求，徒以薪柴秣馬而已。喻人情慕悅之切，終不可以犯禮而得也。</p><p><strong>所出</strong>：《詩經 · 漢廣》 — https://zh.wikisource.org/wiki/詩經/漢廣</p></article></main></div></div>
