    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 居上不重</nav></header><main><article><h1>居上不重</h1><p>聖人處上位而不以尊貴虐下，民戴之不以為重。</p><p>聖人在民上為主，不以尊貴虐下，故民戴之而不以為重。</p><p><strong>所出</strong>：《老子河上公章句 · 後己》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
