    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 悔過責己</nav></header><main><article><h1>悔過責己</h1><p>遭禍能悔、修道行善，則禍去福來也。</p><p>悔過者，人遭禍而能[[修身|悔過責己]]，[[善救人故無棄人|修道行善]]，則[[福倚禍伏|禍去福來]]。《老子》云「禍兮福之所倚」是也。
<strong>所出</strong>：《老子河上公章句 · 順化》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
