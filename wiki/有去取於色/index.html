    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 有去取於色</nav></header><main><article><h1>有去取於色</h1><p>馬無去取於色，故黃黑皆可應；白馬有去取於色，唯白者乃應。</p><p>「馬者，無去取於色，故黃、黑馬皆所以應。」馬之名，於色無所取，亦無所去，凡馬之色皆可應此名。</p><p>「白馬者，有去取於色，黃、黑馬皆以所色去，故唯白馬獨可以應耳。」白馬之名，則有色之取捨矣。唯白色乃可應，非白色則不得稱焉。是故馬名寬而白馬名窄，二者不可以混同也。</p><p>「無去者，非有去也。故曰白馬非馬。」無去取者，非有所去，乃無所限制之謂也。白馬之色既有所取，則不得比況於無取之馬名矣。</p><p><strong>所出</strong>：《公孫龍子 · 2》 — https://zh.wikisource.org/wiki/公孫龍子/2</p></article></main></div></div>
