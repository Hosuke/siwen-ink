    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 太甲</nav></header><main><article><h1>太甲</h1><p></p><p>太甲，成湯適長孫也。帝太甲元年，伊尹作伊訓，作肆命，作徂后。</p><p>  帝太甲既立三年，不明，暴虐，不遵湯法，亂德，於是伊尹放之於桐宮。三年，伊尹攝行政當國，以朝諸侯。</p><p>  帝太甲居桐宮三年，悔過自責，反善，於是伊尹迺迎帝太甲而授之政。帝太甲修德，諸侯咸歸殷，百姓以寧。伊尹嘉之，迺作太甲訓三篇，襃帝太甲，稱太宗。</p><p>  <strong>所出</strong>：《史記 · 卷003》 — https://zh.wikisource.org/wiki/史記/卷003</p></article></main></div></div>
