    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 順情性則不辭讓，辭讓則悖於情性</nav></header><main><article><h1>順情性則不辭讓，辭讓則悖於情性</h1><p>辭讓非情性所固有，乃反性而行之。</p><p>今人見長而不敢先食者，將有所讓也；勞而不敢求息者，將有所代也。夫子之讓乎父，弟之讓乎兄，子之代乎父，弟之代乎兄，此二行者，皆反於性而悖於情也。然而孝子之道，禮義之文理也。故順情性則不辭讓矣，辭讓則悖於情性矣。用此觀之，人之性惡明矣。[[辭讓]]非性固有，乃[[禮義積僞]]之功，[[聖人化性起僞]]之效也。</p><p><strong>所出</strong>：《荀子 · 性惡篇》 — https://zh.wikisource.org/wiki/荀子/性惡篇</p></article></main></div></div>
