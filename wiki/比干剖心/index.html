    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 比干剖心</nav></header><main><article><h1>比干剖心</h1><p>比干強諫，紂怒剖其心，箕子懼而詳狂。</p><p>西伯歸，乃陰修德行善，諸侯多叛紂而往歸西伯。西伯滋大，紂由是稍失權重。王子[[比干]]諫，弗聽。[[商容]]賢者，百姓愛之，紂廢之。及西伯伐飢國，滅之，紂之臣[[祖伊]]聞之而咎周，恐，奔告紂。紂愈淫亂不止。微子數諫不聽，乃與大師、少師謀，遂去。比干曰：「為人臣者，不得不以死爭。」迺強諫紂。紂怒曰：「吾聞聖人心有七竅。」剖比干，觀其心。箕子懼，乃詳狂為奴，紂又囚之。殷之大師、少師乃持其祭樂器奔周。</p><p><strong>所出</strong>：《史記 · 卷003》 — https://zh.wikisource.org/wiki/史記/卷003</p></article></main></div></div>
