    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蜩甲蛇蛻</nav></header><main><article><h1>蜩甲蛇蛻</h1><p>影之似之而非，恰若蟬殼蛇蛻，似生而實非生也。</p><p>景答[[罔兩]]之問曰：「予，蜩甲也，蛇蛻也，似之而非也。」言影之於形，如蟬之於甲、蛇之於蛻，似之而實非。火與日，吾屯也；陰與夜，吾代也。此言影待形而立，非自所有者也。</p><p><strong>所出</strong>：《莊子 · 寓言》 — https://zh.wikisource.org/wiki/莊子/寓言</p></article></main></div></div>
