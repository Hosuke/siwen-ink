    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 柔得中小事吉</nav></header><main><article><h1>柔得中小事吉</h1><p>彖辭。柔得中位，故小事吉。剛失位而不中，故不可大事。</p><p>柔得中，是以小事吉，柔而中道，過不失中也；剛失位而不中，是以不可大事，剛不當位，過而失正也。此以二五爻明小過之義，小事可為，大事難舉也。</p><p><strong>所出</strong>：《周易 · 小過》 — https://zh.wikisource.org/wiki/周易/小過</p></article></main></div></div>
