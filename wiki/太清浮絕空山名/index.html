    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 太清浮絕空山名</nav></header><main><article><h1>太清浮絕空山名</h1><p>太清天真自述其居，捧籍登明，受籙金華。</p><p>大洞玉經云「太清浮絕空山名」，此太清天真自述其居止。云「三天寶神符」以為信，「日中開五暉」以照明，「青帝圓常無」主春生，「捧籍登太明，受籙金華樓」以登真，五藏植玉根，魂魄凝和，百神會合，固身守關。誦此可[[長生久視]]，超[[八難]]，[[胞胎]]不干，[[長生]]可冀。</p><p><strong>所出</strong>：《上清大洞真經 · 15章》 — https://zh.wikisource.org/wiki/上清大洞真經/15章</p></article></main></div></div>
