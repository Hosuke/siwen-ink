    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 少少賤賤</nav></header><main><article><h1>少少賤賤</h1><p>賤不可賤，少不可少，吳干之童能入軍門，秦百里傒飯牛而霸。</p><p>婢子解甯戚「浩浩」之意曰：「公其毋少少，毋賤賤。昔者吳干戰，未齔不得入軍門，國子擿其齒遂入為干國多；百里傒，秦之飯牛者也，穆公舉而相之遂霸諸侯。」賤豈可賤，少豈可少哉。</p><p><strong>所出</strong>：《管子 · 第51篇小問》 — https://zh.wikisource.org/wiki/管子/第51篇小問</p></article></main></div></div>
