    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三德</nav></header><main><article><h1>三德</h1><p>正直、剛克、柔克三者，治世之德也。</p><p>三德：一曰正直，二曰剛克，三曰柔克。平康正直，彊不友剛克，內友柔克，沈漸剛克，高明柔克。維辟作福，維辟作威，維辟玉食。臣無有作福作威玉食；臣有作福作威玉食，其害于而家，凶于而國。此[[洪範九疇]]之六，論剛柔之義以輔皇極也。</p><p><strong>所出</strong>：《史記·卷038》 — https://zh.wikisource.org/wiki/史記/卷038</p></article></main></div></div>
