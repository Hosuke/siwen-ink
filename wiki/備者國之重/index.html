    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 備者國之重也</nav></header><main><article><h1>備者國之重也</h1><p>備乃治國之要，無備則亡。</p><p>子墨子曰：「備者，國之重也。」</p><p>食者，國之寶也；兵者，國之爪也；城者，所以自守也。此三者，國之具也。故倉無備粟，不可以待凶饑；庫無備兵，雖有義不能征無義；城郭不備完，不可以自守；心無備慮，不可以應卒。</p><p>夫桀無待湯之備，故放；紂無待武王之備，故殺。桀紂貴為天子，富有天下，然而皆滅亡於百里之君者，何也？有富貴而不為備也。</p><p>故欲 [[國無三年之食]]，必先務積蓄；欲無凍餓之民，必 [[時年歲善]] 務農力田。</p><p><strong>所出</strong>：《墨子 · 七患》 — https://zh.wikisource.org/wiki/墨子/七患</p></article></main></div></div>
