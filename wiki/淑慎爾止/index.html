    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 淑慎爾止</nav></header><main><article><h1>淑慎爾止</h1><p>當善慎其容止威儀，不失法度。</p><p>「淑慎爾止，不愆于儀」，言當善謹其容止，無有過失於威儀也。止者，容止也；儀者，威儀也。此戒臣下當謹飭其身，不失法度焉。</p><p><strong>所出</strong>：《詩經 · 振鷺》 — https://zh.wikisource.org/wiki/詩經/振鷺</p></article></main></div></div>
