    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 禮之三本</nav></header><main><article><h1>禮之三本</h1><p>禮有天地、先祖、君師三本，此禮之根本義也。</p><p>天地者，生之本也；先祖者，類之本也；君師者，治之本也。無天地惡生？無先祖惡出？無君師惡治？三者偏亡，則無安人。故禮，上事天，下事地，尊先祖而隆君師，是禮之三本也。</p><p><strong>所出</strong>：《史記 · 卷023》 — https://zh.wikisource.org/wiki/史記/卷023</p></article></main></div></div>
