    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 逆煞之鬼流布人間</nav></header><main><article><h1>逆煞之鬼流布人間</h1><p>述逆煞之鬼散布人間為病之狀。</p><p>逆煞之鬼流布人間，誑作百病。五逆疾炁，寒熱頭痛，或腹內結堅，吐逆短炁，五內脹滿，目視顛倒，口唵手足臠縮，不自知慮，命在日夕，凶鬼來守。蓋世人不信道法，致有此厲鬼為病害人，知鬼名者可辟之也。</p><p><strong>所出</strong>：《女青鬼律 · 卷1》 — https://zh.wikisource.org/wiki/女青鬼律/卷1</p></article></main></div></div>
