    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 彊禦</nav></header><main><article><h1>彊禦</h1><p>恃強凌弱之徒，仁者不畏。</p><p>不畏彊禦。</p><p>彊禦，恃強凌弱之暴人也。仲山甫秉柔嘉之德，而能不畏強暴，此仁者之勇也。</p><p><strong>所出</strong>：《詩經 · 烝民》 — https://zh.wikisource.org/wiki/詩經/烝民</p></article></main></div></div>
