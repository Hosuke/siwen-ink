    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 赤芾</nav></header><main><article><h1>赤芾</h1><p>諸侯卿大夫之命服，以赤皮為蔽膝，示尊貴之儀。</p><p>赤芾者，天子至諸侯、卿大夫之祭服也。以熟皮為之，赤色，加於膝前，故曰「芾」。</p><p>《詩·候人》云「彼其之子，三百赤芾」，以諷在位者之多且濫。芾者禮之所寓，三百言其眾盛；賢者在下而勤苦，不肖者在上位而被赤芾，服之不稱，莫此為甚。後世言居高位而不稱其德者，多引此義。</p><p><strong>所出</strong>：《詩經 · 候人》 — https://zh.wikisource.org/wiki/詩經/候人</p></article></main></div></div>
