    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 視四方俯視地</nav></header><main><article><h1>視四方俯視地</h1><p>觀遠知近，察物自知</p><p>說戒武丁以「汝克視四方，乃俯視地」。言人當遠矚四方之勢，近察方寸之地也。視四方者，觀乎遠大；俯視地者，省乎近小。外則視之以知時務，內則省之以返諸心。心毀惟備，毀者，傾敗也；言心既自省，則毀敗之患可以防備。先俯視地而心有所毀，乃可漸致四方之功也。</p><p><strong>所出</strong>：《尚書 · 傅說之命中》 — https://zh.wikisource.org/wiki/尚書/傅說之命中</p></article></main></div></div>
