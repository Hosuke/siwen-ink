    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 太白出沒</nav></header><main><article><h1>太白出沒</h1><p>太白晨出東方二百四十日而入，夕出西方二百四十日而入。</p><p>太白元始以正月建寅，與熒惑晨出東方，二百四十日而入，入百二十日而夕出西方，二百四十日而入，入三十五日而復出東方。出以辰戌，入以丑未。當出而不出，未當入而入，天下偃兵；當入而不入，當出而不出，天下興兵。</p><p><strong>所出</strong>：《淮南子 · 天文訓》 — https://zh.wikisource.org/wiki/淮南子/天文訓</p></article></main></div></div>
