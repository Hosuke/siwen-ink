    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 將欲毀之必重累之</nav></header><main><article><h1>將欲毀之必重累之</h1><p>將欲毀之必重累之，將欲踣之必高舉之，累矣而不毀、舉矣而不踣，其唯有道者乎。</p><p>《詩》曰：「將欲毀之，必重累之；將欲踣之，必高舉之」，其此之謂乎？累矣而不毀，舉矣而不踣，其唯有道者乎！</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十</p></article></main></div></div>
