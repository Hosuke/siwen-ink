    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 於嗟乎</nav></header><main><article><h1>於嗟乎</h1><p>感歎之辭，美之也。</p><p>[[詩經]]《[[詩經·騶虞|騶虞]]》卒章云「壹發五豝，于嗟乎騶虞」，又「壹發五豵，于嗟乎騶虞」。「於嗟乎」，感歎之辭也。《[[詩經·騶虞|騶虞]]》之「註解」明言其為「感嘆詞」。詩人行文至此，屢疊「壹發」之語，迭言獵獲之有節，而以「於嗟乎」發之，聲情搖漾，倍見其讚歎之美。觀《[[詩經·騶虞|詩經]]》全書，「於」「吁」「盱」諸字多相通，皆歎美之聲。於此詩，則歎美天子之仁、蒐田之禮、騶虞官之盡職也。</p><p><strong>所出</strong>：《詩經 · 騶虞》 — https://zh.wikisource.org/wiki/詩經/騶虞</p></article></main></div></div>
