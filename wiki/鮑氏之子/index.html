    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鮑氏之子</nav></header><main><article><h1>鮑氏之子</h1><p>天地萬物與我並生，類也；非相爲而生，人取可食者食之。</p><p>[[齊]][[田氏]]祖於庭，食客千人，中坐有獻魚雁者。田氏視之，乃歎曰：「天之於民厚矣！殖五穀、生魚鳥以爲之用。」衆客和之如響。[[鮑氏之子]]年十二，預於次，進曰：「不如君言。天地萬物與我並生，類也。類無貴賤，徒以小大智力而相制，迭相食，非相爲而生之。人取可食者而食之，豈天本爲人生之？且蚊蚋噆膚，虎狼食肉，非天本爲蚊蚋生人、虎狼生肉者哉？」</p><p><strong>所出</strong>：《列子 · 說符篇》 — https://zh.wikisource.org/wiki/列子/說符篇</p></article></main></div></div>
