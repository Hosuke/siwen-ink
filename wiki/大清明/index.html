    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大清明</nav></header><main><article><h1>大清明</h1><p>虛壹而靜，萬物莫不見，莫不論，得其正。</p><p>虛壹而靜，謂之大清明。萬物莫形而不見，莫見而不論，莫論而失位。坐於室而見四海，處於今而論久遠。疏觀萬物而知其情，參稽治亂而通其度，經緯天地而材官萬物，制割大理而宇宙理矣。恢恢廣廣，孰知其極？睪睪廣廣，孰知其德？涫涫紛紛，孰知其形？明參日月，大滿八極，夫是之謂大人。夫惡有蔽矣哉！</p><p><strong>所出</strong>：《荀子 · 解蔽篇》 — https://zh.wikisource.org/wiki/荀子/解蔽篇</p></article></main></div></div>
