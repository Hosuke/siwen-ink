    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 癰疽膿血</nav></header><main><article><h1>癰疽膿血</h1><p>陰陽不通，兩熱相搏，化而為膿。膿已成，十死一生，唯砭石鈹鋒之所取。</p><p>陰陽不通，兩熱相搏，乃化為膿，小鈃能取之乎。歧伯曰：膿已成，十死一生，故聖人勿使已成，而明為良方，著之竹帛。黃帝曰：其已有膿血而後遭乎。歧伯曰：以小治小者，其功小，以大治大者，多害，故其已成膿血者，其唯砭石鈹鋒之所取也。</p><p><strong>所出</strong>：《黃帝內經 · 靈樞第九卷》 — https://zh.wikisource.org/wiki/黃帝內經/靈樞第九卷</p></article></main></div></div>
