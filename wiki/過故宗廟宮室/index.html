    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 過故宗廟宮室</nav></header><main><article><h1>過故宗廟宮室</h1><p>詩人過宗周故都，見宗廟宮室皆已化為田疇。</p><p>「過故宗廟宮室，盡為禾黍」，此十字寫盡亡國之痛。宗廟者，祖先之所奉；宮室者，先王之所居。皆曾是周家禮制文明之象徵。一旦覆亡，戎馬踐踏，鞠為茂草，詩人過之，黍離離而稷苗生，惄然傷之，以為宗周之亡，莫此為甚。</p><p><strong>所出</strong>：《詩經 · 黍離》 — https://zh.wikisource.org/wiki/詩經/黍離</p></article></main></div></div>
