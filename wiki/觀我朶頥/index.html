    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 觀我朶頥</nav></header><main><article><h1>觀我朶頥</h1><p>觀望口頥之欲動，乃凶之明兆。</p><p>初九舍爾靈觀我朶頥，凶之明兆也。夫朶頥者，口腹之欲動焉。羡我朶頥而躁求，離其致養之至道；闚我寵祿而競進，凶莫甚焉。內不養神而逐外物，則凶自至矣。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷03》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷03</p></article></main></div></div>
