    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 良賈深藏若虛</nav></header><main><article><h1>良賈深藏若虛</h1><p>老子戒孔子：良賈深藏若虛，君子盛德容貌若愚。</p><p>老子告孔子曰：「且君子得其時則駕，不得其時則蓬累而行。吾聞之，良賈深藏若虛，君子盛德容貌若愚。去子之驕氣與多欲，態色與淫志，是皆無益於子之身。」</p><p>後世用「深藏若虛」喻藏才斂德、不露鋒芒。</p><p><strong>所出</strong>：《史記 · 卷063》 — https://zh.wikisource.org/wiki/史記/卷063</p></article></main></div></div>
