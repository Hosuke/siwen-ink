    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 龍不能食</nav></header><main><article><h1>龍不能食</h1><p>記孔甲時天降龍而不能食之事</p><p>孔甲之時，好方鬼神，事淫亂。德衰，諸侯畔之。天降龍二，有雌雄，不能食，未得豢龍氏。既衰，其后有劉累，學擾龍于豢龍氏，以事孔甲。孔甲賜之姓曰御龍，受豕韋之后。龍一雌死，以食夏后。使求之，懼而遷去。</p><p><strong>所出</strong>：《史記 · 卷002》 — https://zh.wikisource.org/wiki/史記/卷002</p></article></main></div></div>
