    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三魂七魄</nav></header><main><article><h1>三魂七魄</h1><p>魂魄與邪相干，清齋誦經可以制鍊。</p><p>使調和三魂，制鍊七魄，除去三尸，安和六府。魂魄既安，則邪無所干，而百病不能傷。</p><p><strong>所出</strong>：《黃庭內景經 · 序》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/序</p></article></main></div></div>
