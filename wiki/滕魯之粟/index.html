    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 滕魯之粟</nav></header><main><article><h1>滕魯之粟</h1><p>操輕重之術於粟價，使敵國之粟四流歸我。</p><p>管子曰：「滕、魯之粟釜百，則使吾國之粟釜千。滕、魯之粟四流而歸我，若下深谷者，非歲凶而民飢也。辟之以號令，引之以徐疾，施平其歸我若流水。」</p><p>夫粟者，民之司命也。黃金刀布者，民之通貨也。先王善制其通貨，以御其司命，故民力可盡也。</p><p><strong>所出</strong>：《管子 · 第81篇輕重乙》 — https://zh.wikisource.org/wiki/管子/第81篇輕重乙</p></article></main></div></div>
