    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 正者正也其心以為不然者</nav></header><main><article><h1>正者正也其心以為不然者</h1><p>老子以為正者正也，心以為不然者，天門弗開。</p><p>老子曰：「正者，正也。其心以為不然者，天門弗開矣。」</p><p><strong>所出</strong>：《莊子 · 天運》 — https://zh.wikisource.org/wiki/莊子/天運</p></article></main></div></div>
