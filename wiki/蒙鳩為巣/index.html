    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蒙鳩為巣</nav></header><main><article><h1>蒙鳩為巣</h1><p>蒙鳩以羽為巣，編髮繫之葦苕，風至則折。猶人不知學問，所置身危而卵破子死也。</p><p>南方有鳥焉，名曰蒙鳩，以羽為巣而編之以髮，繫之葦苕，風至苕折，卵破子死。巣非不完也，所繫者然也。</p><p><strong>所出</strong>：《荀子 · 勸學篇》 — https://zh.wikisource.org/wiki/荀子/勸學篇</p></article></main></div></div>
