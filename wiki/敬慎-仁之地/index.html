    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 敬慎-仁之地</nav></header><main><article><h1>敬慎-仁之地</h1><p></p><p>敬慎者仁之地，[[溫溫恭人]]之義也。《小宛》以溫溫恭人、惴惴小心、戰戰兢兢、如履薄冰為戒，是敬慎之實也。仁者心存恭敬，無一事不謹，無一念不敬，則德行自此而立。敬慎非畏葸，乃心存敬畏、不敢慢易之謂。[[敬慎者仁之地]]之義，於《小宛》見之矣。</p><p>  <strong>所出</strong>：《詩經 · 小宛》 — https://zh.wikisource.org/wiki/詩經/小宛</p></article></main></div></div>
