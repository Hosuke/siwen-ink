    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 石尚歸脤</nav></header><main><article><h1>石尚歸脤</h1><p>天子使士歸肉於魯，欲使魯復行禮於天下。</p><p>定公十四年，天王使石尚來歸脤。脤者，祭肉也；生曰脤，熟曰膰。</p><p>石尚，士也。天子之大夫不名，石尚欲書《春秋》，乃諫曰：「久矣周之不行禮於魯也！請行脤，貴復正也。」</p><p>歸脤之舉，非僅餽遺之儀，乃天王欲借魯以重振周禮之天下秩序也。</p><p><strong>所出</strong>：《春秋穀梁傳 · 定公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/定公</p></article></main></div></div>
