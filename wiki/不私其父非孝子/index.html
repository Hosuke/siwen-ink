    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不私其父非孝子</nav></header><main><article><h1>不私其父非孝子</h1><p>枉法徇私則非孝</p><p>石奢之言曰：「不私其父，非孝子也；不奉主法，非忠臣也。」言爲人子者，當以正道教誨其父，不當以私情庇護其罪。若枉法以徇私，是不能教其父，非孝子也。</p><p><strong>所出</strong>：《史記 · 卷119》 — https://zh.wikisource.org/wiki/史記/卷119</p></article></main></div></div>
