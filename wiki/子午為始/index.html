    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 子午為始</nav></header><main><article><h1>子午為始</h1><p>子午者陰陽初分之機，丹道之樞紐。</p><p>子午為始。</p><p>子一陽生，午一陰長。[[肝青為父|五臟分屬]]既定，萬化所起，必有端始。子午者，[[四象會中|四象]]之根株，[[龍虎]]出入之門戶。以子午為始者，明丹道之火候，必本乎陰陽初分之機也。</p><p><strong>所出</strong>：《周易參同契 · 28章》 — https://zh.wikisource.org/wiki/周易參同契/28章</p></article></main></div></div>
