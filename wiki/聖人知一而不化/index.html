    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖人知一而不化</nav></header><main><article><h1>聖人知一而不化</h1><p>萬化雖變而氣一，聖人知一，故無化。</p><p>青鸞子千歲而千歲化，桃子五仕而心五化。聖人賓事去物，豈不欲建立於世哉。有形數者懼化之不可知也。</p><p>萬物變遷，雖互隱見，氣一而已，惟聖人知一而不化。</p><p>爪之生，發之長，榮衛之行，無頃刻止。眾人皆見之於著，不能見之於微，賢人見之於微，而不能任化。聖人任化，所以無化。</p><p><strong>所出</strong>：《關尹子 · 7》 — https://zh.wikisource.org/wiki/關尹子/7</p></article></main></div></div>
