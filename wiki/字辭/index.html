    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 字辭</nav></header><main><article><h1>字辭</h1><p>冠者加冠畢，賔為命字之祝辭，以伯某甫為式。</p><p>字辭者，[[三加]]既畢，賔於西階東南面為冠者命字之辭也。辭曰：「禮儀既備，令月吉日，昭告爾字。爰字孔嘉，髦士攸宜。冝之于假，永受保之，曰伯某甫。」伯者，長也；某者，冠者之名也；甫者，男子之美稱也。[[冠而字之，敬其名也]]，故字之為言，尊其名也。仲、叔、季，唯其所當。命字之後，冠者遂有字以通於人士，故[[天下無生而貴者]]，唯賴此禮成人。</p><p><strong>所出</strong>：《儀禮 · 士冠禮》 — https://zh.wikisource.org/wiki/儀禮/士冠禮</p></article></main></div></div>
