    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 展如之人兮，邦之媛也</nav></header><main><article><h1>展如之人兮，邦之媛也</h1><p>嘆此人之美為邦國之淑女</p><p>「展如之人兮，邦之媛也」，見于《詩經·君子偕老》。呂氏注曰：「三章之末云『展如之人兮，邦之媛也』，惜之也。」言如此之人，實為邦國之美女也。展，如也。媛，美女之稱。詩人惜其有美色而無令德，故言「惜之」也。</p><p><strong>所出</strong>：《詩經 · 君子偕老》 — https://zh.wikisource.org/wiki/詩經/君子偕老</p></article></main></div></div>
