    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 淳漆</nav></header><main><article><h1>淳漆</h1><p>淳漆不沾者服之令人通神長生。</p><p>淳漆不沾者，服之令人通神長生，餌之法，或以大無腸公子，或雲大蟹，十枚投其中，或以雲母水，或以玉水合服之，九蟲悉下，惡血從鼻去，一年六甲行廚至也。</p><p><strong>所出</strong>：《抱朴子 · 卷11》 — https://zh.wikisource.org/wiki/抱朴子/卷11</p></article></main></div></div>
