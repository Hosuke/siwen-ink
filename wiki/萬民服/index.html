    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 萬民服</nav></header><main><article><h1>萬民服</h1><p>萬民皆服從有功而謙之君子。</p><p>《象》曰「勞謙君子，萬民服也」，言九三有功勞而能謙，故天下萬民皆心悅誠服。功高而不矜，位隆而自抑，此所以得眾也。</p><p><strong>所出</strong>：《周易 · 謙》 — https://zh.wikisource.org/wiki/周易/謙</p></article></main></div></div>
