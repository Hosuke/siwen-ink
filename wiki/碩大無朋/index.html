    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 碩大無朋</nav></header><main><article><h1>碩大無朋</h1><p>形體碩大，無可與比。</p><p>碩，大也；朋，匹也。碩大無朋，言其形體碩大而無可與匹也。《詩》云：「彼其之子，碩大無朋。」</p><p>無朋者，非特言形貌之碩大而已，實言其德業之盛，無復可比者焉。譬如椒聊之實蕃衍盈升，彼其所美之子，亦碩大而無朋，兩美相映，信乎其盛也。</p><p>舊說以為美沃之盛彊，能脩其政，則其人碩大無朋，德盛至此，宜其有晉國焉。</p><p><strong>所出</strong>：《詩經 · 椒聊》 — https://zh.wikisource.org/wiki/詩經/椒聊</p></article></main></div></div>
