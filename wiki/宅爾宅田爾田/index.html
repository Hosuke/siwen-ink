    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 宅爾宅田爾田</nav></header><main><article><h1>宅爾宅田爾田</h1><p>周已宅爾居、畋爾田，爾尚惠王熙天之命。</p><p>爾乃迪屢不靜，爾心未愛；爾乃屑播天命。迨今則不然。今爾尚宅爾宅，畋爾田；爾曷不惠王熙天之命？言天之命周，固已厚之矣。爾宅爾居，給爾田疇，無待兵戎也。天之於民，既已安居而厚給之，爾尚當順應王德，以奉天道可也。不然，是自絕於天耳。</p><p><strong>所出</strong>：《尚書 · 多方》 — https://zh.wikisource.org/wiki/尚書/多方</p></article></main></div></div>
