    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 配合未連</nav></header><main><article><h1>配合未連</h1><p>陰陽未合則剛柔離分</p><p>配合未連，三五不交，剛柔離分。言[[雌雄交媾]]之未成，則[[火動炎上]][[水流潤下]]之性不能相濟，而丹道不成。是[[牝雞自卵]]之弊也。</p><p><strong>所出</strong>：《周易參同契 · 26章》 — https://zh.wikisource.org/wiki/周易參同契/26章</p></article></main></div></div>
