    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 龍虎四象</nav></header><main><article><h1>龍虎四象</h1><p>青龍、白虎、朱雀、玄武，分主四象，配四方四時，乃丹道之樞要。</p><p>青龍處房六兮，春花震東卯。白虎在昴七兮，秋芒兌西酉。朱雀在張二兮，正陽雜南午。三者具來朝兮，家屬為親侶。</p><p>青龍配東方蒼龍七宿之房宿，居卯位，主春；白虎配西方白虎七宿之昴宿，居酉位，主秋；朱雀配南方朱鳥七宿之張宿，居午位，主夏。三者朝宗而會，丹法以之為火候之象、四象會中之根也。</p><p><strong>所出</strong>：《周易參同契 · 32章》 — https://zh.wikisource.org/wiki/周易參同契/32章</p></article></main></div></div>
