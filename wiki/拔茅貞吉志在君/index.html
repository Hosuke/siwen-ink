    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 拔茅貞吉志在君</nav></header><main><article><h1>拔茅貞吉志在君</h1><p>君子連類以正，志在匡君，非為私黨</p><p>拔茅貞吉，志在君也。</p><p>初六爻辭「拔茅茹以其彙，貞吉」，象辭以為：君子連類以正，非為私黨，乃在致君於正道。志在於君，不在於身，是所以為吉也。</p><p><strong>所出</strong>：《周易 · 否》 — https://zh.wikisource.org/wiki/周易/否</p></article></main></div></div>
