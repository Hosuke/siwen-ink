    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 事聖君有聽從，無諫爭；事中君有諫諍，無謟諛；事暴君有補削，無憮拂</nav></header><main><article><h1>事聖君有聽從，無諫爭；事中君有諫諍，無謟諛；事暴君有補削，無憮拂</h1><p>《鬼谷子》以君之賢否為進說之道，三等之君各有所宜。</p><p>《太平御覽》引《鬼谷子》云：「事聖君有聽從，無諫爭；事中君有諫諍，無謟諛；事暴君有補削，無憮拂。」又曰：「君得名則群臣恃之。」此以人君之高下，分進說之術：聖主明達，不待爭諫，但當聽從；中主昏昧，可諫則諫，不可諂媚；暴君剛愎，但當隨事補救，無可正言以忤之也。</p><p><strong>所出</strong>：《鬼谷子 · 鬼谷子附録》 — https://zh.wikisource.org/wiki/鬼谷子/鬼谷子附録</p></article></main></div></div>
