    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 令本不出</nav></header><main><article><h1>令本不出</h1><p>令本不出，則國非其國</p><p>為主而不得行其令，廢法而恣羣臣，威嚴已廢，權勢已奪，令不得出，羣臣弗為用，百姓弗為使，境內之眾不制，則國非其國，而民非其民。
<strong>所出</strong>：《管子 · 第67篇明法解》 — https://zh.wikisource.org/wiki/管子/第67篇明法解</p></article></main></div></div>
