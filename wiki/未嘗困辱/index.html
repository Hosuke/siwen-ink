    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 未嘗困辱</nav></header><main><article><h1>未嘗困辱</h1><p>高爵功臣破軍降城以十數，未嘗困辱，此天授也。</p><p>陽陵侯傅寬、信武侯靳歙皆高爵，從高祖起山東，攻項籍，誅殺名將，破軍降城以十數，未嘗困辱，此亦天授也。</p><p><strong>所出</strong>：《史記 · 卷098》 — https://zh.wikisource.org/wiki/史記/卷098</p></article></main></div></div>
