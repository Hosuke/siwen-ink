    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 兵大齊則制天下</nav></header><main><article><h1>兵大齊則制天下</h1><p>兵能大齊則可制服天下，小齊則僅治鄰敵。</p><p>孫卿子云：「故兵大齊則制天下，小齊則治鄰敵。」若夫招近募選，隆埶詐，尚功利之兵，則勝不勝無常，代翕代張，代存代亡，相為雌雄耳矣。</p><p><strong>所出</strong>：《荀子 · 議兵篇》 — https://zh.wikisource.org/wiki/荀子/議兵篇</p></article></main></div></div>
