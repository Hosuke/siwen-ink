    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 慎終若始</nav></header><main><article><h1>慎終若始</h1><p>慎終如始，則無敗事</p><p>，老子以為人之從事，常於將成而敗。若能慎終若始，則無敗事矣。[[慎終追遠]]之義，亓在此與。</p><p><strong>所出</strong>：《老子 (帛書本) · 章六十四》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
