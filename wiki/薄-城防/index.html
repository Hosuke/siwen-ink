    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 薄</nav></header><main><article><h1>薄</h1><p></p><p><strong>薄</strong>者，墨子所述城外木柵防守之法也。《備蛾傅》篇云：「凡殺蛾傅而攻者之法，置薄城外，去城十尺，薄厚十尺。伐薄之法，大小盡木斷之，以十尺爲斷，離而深貍堅築之，毋使可拔。」</p><p>其制：薄置城外，去城十尺，厚亦十尺。伐木之法，大小之材皆斬斷之，以十尺為度，交錯深埋，堅實築之，使其不可拔。</p><p>二十步一殺，有𡑾，厚十尺，殺有兩門，門廣五步。薄門以板為梯，埋置之，勿築，令易拔。城上之人俯瞰薄門，置楬以望敵。</p><p>此城外之防，使敵先薄而遇殺，殺而遇城，三重之備也。</p></article></main></div></div>
