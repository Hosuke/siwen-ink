    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 積習則忘鮑肆之臭</nav></header><main><article><h1>積習則忘鮑肆之臭</h1><p>久處一境，則習而不察，雖醜不自知。</p><p>《抱朴子》曰：積習則忘鮑肆之臭，裸鄉不覺呈形之醜。</p><p>夫久處於惡境者，日與之習，漸忘其穢；久處於醜者，視以為常，不自知其醜也。是以聖賢孜孜勉行，若防溺水；淺近之人喬喬忽之，若遺敝履。此無他，習與不習之異也。</p><p>聖人自知遁世無悶，齊物通塞，故能去近易而就遠大。若夫中人以下，積習漸染，鮮有不移其心者矣。可不戒哉！</p><p><strong>所出</strong>：《抱朴子 · 卷41》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷41</p></article></main></div></div>
