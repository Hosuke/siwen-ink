    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 茅山上清宗壇</nav></header><main><article><h1>茅山上清宗壇</h1><p>大洞真經歷代單傳之地，千餘年間才三十八人。</p><p>茅山上清宗壇，歷代傳授大洞真經。千餘歲間，裁三十八人得之。蓋其發天地未形之蘊，析父母媾精之妙，宜隱秘不輕卑傳。故雖茅山宗壇，亦不敢輕泄也。</p><p><strong>所出</strong>：《上清大洞真經 · 結尾》 — https://zh.wikisource.org/wiki/上清大洞真經/結尾</p></article></main></div></div>
