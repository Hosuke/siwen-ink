    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 意怠</nav></header><main><article><h1>意怠</h1><p>鳥以无能自全，處群而不先，故得免於患。</p><p>莊子所述東海之鳥，其名意怠。翔而似无能，引援而飛，迫脅而棲；進不敢為前，退不敢為後；食不敢先嘗，必取其緒。是故其行列不斥，而外人卒不得害，是以免於患。</p><p>大公任以此喻孔子，謂直木先伐、甘井先竭；飾知以驚愚、修身以明汙者，猶揭日月而行，必不能免於患。意怠之鳥，無才可用，無技可矜，與眾同行而不爭先，故能全其身於亂世。</p><p><strong>所出</strong>：《莊子 · 山木》 — https://zh.wikisource.org/wiki/莊子/山木</p></article></main></div></div>
