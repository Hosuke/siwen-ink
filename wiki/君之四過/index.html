    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 君之四過</nav></header><main><article><h1>君之四過</h1><p>君有二過：以民所惡制之，一過也；民非其民而不布其務，二過也</p><p>夫君人者有大過，臣人者有大罪。國所有也，民所君也，有國君民，而使民所惡制之，此一過也。民有三務不布，其民非其民也；民非其民，則不可以守戰。此君人者二過也。夫臣人者，受君高爵重祿，治大官，倍其官，遺其事，穆君之色，從其欲，阿而勝之，此臣人之大罪也。君有過而不改謂之倒，臣當罪而不誅謂之亂。君為倒君，臣為亂臣，國家之衰也，可坐而待之。</p><p><strong>所出</strong>：《管子 · 第31篇君臣下》 — https://zh.wikisource.org/wiki/管子/第31篇君臣下</p></article></main></div></div>
