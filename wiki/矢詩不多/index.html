    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 矢詩不多</nav></header><main><article><h1>矢詩不多</h1><p>詩辭不多，誠意則盛。</p><p>尹吉甫美宣王[[能興衰撥亂命召公平淮夷]]，故作《江漢》之詩。[[矢詩不多]]，言我有善詩，不敢多作，正[[吉甫燕喜]]所以[[文武吉甫]]之義也。</p><p>  <strong>所出</strong>：《詩經 · 江漢》 — https://zh.wikisource.org/wiki/詩經/江漢</p></article></main></div></div>
