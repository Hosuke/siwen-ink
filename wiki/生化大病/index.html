    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 生化大病</nav></header><main><article><h1>生化大病</h1><p>氣有太過不及，相得則病微，不相得則病甚，位當則正，位不當則邪。</p><p>五氣更立，各有所先，非其位則邪，當其位則正。</p><p>氣相得則微，不相得則甚。</p><p>非其位則邪，當其位則正，邪則變甚，正則微。</p><p>氣有餘，則製己所勝而侮所不勝；其不及，則己所不勝侮而乘之，己所勝輕而侮之。侮反受邪，侮而受邪，寡於畏也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第十九卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十九卷</p></article></main></div></div>
