    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 桓公葬而後舉謚</nav></header><main><article><h1>桓公葬而後舉謚</h1><p>記桓公葬而後加謚，以明謚所以成德，於卒事乎加之。</p><p>桓公薨于齊，葬我君桓公。穀梁子曰：「葬我君，接上下也。君弒，賊不討不書葬，此其言葬，何也？不責逾國而討于是也。」</p><p>又曰：「桓公葬而後舉謚，謚所以成德也，於卒事乎加之矣。」</p><p>葬而後謚者，以其身死事畢，方可論定其德而立名。生前之功過，葬前未暇論也；必至卒事，乃加之焉。此穀梁之義，以謚為勸善戒惡之具，非泛然賞罰可比。</p><p><strong>所出</strong>：《春秋穀梁傳 · 桓公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/桓公</p></article></main></div></div>
