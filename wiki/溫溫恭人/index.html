    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 溫溫恭人</nav></header><main><article><h1>溫溫恭人</h1><p>溫柔和順、恭敬自持之人。</p><p>溫溫恭人，謂人之稟性溫柔、容止恭遜者也。《小宛》以溫溫恭人起興，繼之以如集于木、惴惴小心、如臨于谷、戰戰兢兢、如履薄冰，極言戒懼之至。溫溫者，德之和也；恭人者，禮之謹也。詩人以此為修身之要，使人知所警惕，不敢妄肆也。</p><p><strong>所出</strong>：《詩經 · 小宛》 — https://zh.wikisource.org/wiki/詩經/小宛</p></article></main></div></div>
