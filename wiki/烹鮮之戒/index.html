    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 烹鮮之戒，不欲其煩</nav></header><main><article><h1>烹鮮之戒，不欲其煩</h1><p>反對者引老子烹鮮之說，謂治道貴簡</p><p>或人云：「刑辟之興，蓋存叔世。立人之道，唯仁與義。我清靜而民自正，我無欲而民自樸，烹鮮之戒，不欲其煩。寬以愛人則得眾，悅以使人則下附。」</p><p><strong>所出</strong>：《抱朴子 · 卷14》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷14</p></article></main></div></div>
