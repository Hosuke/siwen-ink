    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 材有所施</nav></header><main><article><h1>材有所施</h1><p>物各有宜，材各有施，各當其位則上下無為</p><p>夫物者有所宜，材者有所施，各處其宜，故上下無為。使雞司夜，令狸執鼠，皆用其能，上乃无事。上有所長，事乃不方；矜而好能，下之所欺；辯惠好生，下因其材。上下易用，國故不治。</p><p><strong>所出</strong>：《韓非子 · 揚榷》 — https://zh.wikisource.org/wiki/韓非子/揚榷</p></article></main></div></div>
