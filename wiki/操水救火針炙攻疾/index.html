    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 操水救火針炙攻疾</nav></header><main><article><h1>操水救火針炙攻疾</h1><p>操水者器異而救火同，針炙者術殊而攻疾均。</p><p>抱朴子以喻明百家殊途同歸之理：「譬如操水者，器雖異而救火同焉；猶針炙者，術雖殊而攻疾均焉。」</p><p><strong>所出</strong>：《抱朴子 · 卷32》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷32</p></article></main></div></div>
