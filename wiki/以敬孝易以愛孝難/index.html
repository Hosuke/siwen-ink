    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以敬孝易以愛孝難</nav></header><main><article><h1>以敬孝易以愛孝難</h1><p>孝有高下層次，由敬及忘，漸進於道。</p><p>莊子曰：「以敬孝易，以愛孝難；以愛孝易，以忘親難；忘親易，使親忘我難；使親忘我易，兼忘天下難；兼忘天下易，使天下兼忘我難。」</p><p><strong>所出</strong>：《莊子 · 天運》 — https://zh.wikisource.org/wiki/莊子/天運</p></article></main></div></div>
