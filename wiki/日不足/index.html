    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 日不足</nav></header><main><article><h1>日不足</h1><p>天命有時，人當汲汲傳道，不可怠忽</p><p>《保訓》篇末云：「日不足，唯宿不羕。」</p><p>言時日不足，不可蹉跎。「宿」疑讀為「夙」。「羕」者，善也。言日不足則當夙夜求善，不可稍怠。文王疾甚，故以此戒太子。歲月有限，而傳道之責無涯，此所以汲汲於言也。</p><p>《保訓》通篇以「恐弗念終」為憂，以「日不足」為戒，蓋深感天命靡常，人當及時傳道耳。</p><p><strong>所出</strong>：《尚書 · 保訓》 — https://zh.wikisource.org/wiki/尚書/保訓</p></article></main></div></div>
