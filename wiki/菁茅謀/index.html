    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 菁茅謀</nav></header><main><article><h1>菁茅謀</h1><p>封菁茅以制入朝之資，挾天子以令諸侯。</p><p>桓公欲朝天子而賀獻不足，管子請封江淮所產之菁茅，使諸侯朝廟必獻此物。遂挾天子之令，使天下諸侯非得菁茅一束不得從封禪之禮。諸侯爭載黃金珠玉赴周，菁茅坐長十倍，一束百金。周天子七年不求賀獻，財貨四流歸周。此以區區一茅，制諸侯於千里之外者也。</p><p><strong>所出</strong>：《管子 · 第83篇輕重丁》 — https://zh.wikisource.org/wiki/管子/第83篇輕重丁</p></article></main></div></div>
