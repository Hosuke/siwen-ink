    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 百卉具腓</nav></header><main><article><h1>百卉具腓</h1><p>秋季百草凋零，以喻世亂之象。</p><p>秋日淒淒，百卉具腓。</p><p>「腓」，枯也、萎也。秋風一起，百草盡皆枯黃凋零。詩人以時令之變，喻天下擾攘、亂離相尋之世態。後世用「百卉具腓」狀秋日蕭條之景，亦借以慨歎時局艱危。</p><p><strong>所出</strong>：《詩經 · 四月》 — https://zh.wikisource.org/wiki/詩經/四月</p></article></main></div></div>
