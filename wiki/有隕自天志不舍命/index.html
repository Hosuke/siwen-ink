    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 有隕自天志不舍命</nav></header><main><article><h1>有隕自天志不舍命</h1><p>象傳語，九五有福自天而降，以其志不違天命也。</p><p>「有隕自天，志不舍命也。」</p><p>九五之所以有福自天而降者，以其志不違天命也。天命不可違，而九五能順之，故天佑之而福自至。聖人言命，非徒言宿命，乃謂天理之正，人當順而行之也。</p><p><strong>所出</strong>：《周易 · 姤》 — https://zh.wikisource.org/wiki/周易/姤</p></article></main></div></div>
