    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 澤上有地臨</nav></header><main><article><h1>澤上有地臨</h1><p>澤卑地高，居高以臨，君子觀象以教思容保。</p><p>澤居下地居上，水之潤下、地之厚重，相得而為臨。[[澤无水]]之象反之，可見其義。</p><p>君子觀此象，知水之潤澤無有窮已、地之含弘無有邊疆，乃以教思無窮、容保民無疆為己任。教者，誨人不倦也；思者，心存民瘼也。容者，廣納無棄也；保者，護持不怠也。合而言之，治國之道無他，教思容保而已。</p><p><strong>所出</strong>：《周易 · 臨》 — https://zh.wikisource.org/wiki/周易/臨</p></article></main></div></div>
