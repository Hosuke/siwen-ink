    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 丞簿責幕府</nav></header><main><article><h1>丞簿責幕府</h1><p>廣使長史責幕府對簿，自承失道之罪。</p><p>大將軍使長史持糒醪遺廣，因問廣、失道狀，欲上書報天子軍曲折。廣未對。大將軍使長史急責之幕府對簿。廣曰：「諸校尉無罪，乃我自失道。吾今自上簿。」</p><p><strong>所出</strong>：《史記 · 卷109》 — https://zh.wikisource.org/wiki/史記/卷109</p></article></main></div></div>
