    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五藏者身之強</nav></header><main><article><h1>五藏者身之強</h1><p>五臟為身之根本，觀頭、背、腰、膝、骨之象，可知臟腑強弱，以決生死。</p><p>「夫五藏者，身之強也。」頭者精明之府，頭頃視深，精神將奪矣；背者胸中之府，背曲肩隨，府將壞矣；腰者腎之府，轉搖不能，腎將憊矣；膝者筋之府，屈伸不能行則僂附，筋將憊矣；骨者髓之府，不能久立行則振掉，骨將憊矣。得強則生，失強則死。</p><p><strong>所出</strong>：《黃帝內經 · 素問第五卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第五卷</p></article></main></div></div>
