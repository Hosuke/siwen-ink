    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 善為國者壤辟舉</nav></header><main><article><h1>善為國者壤辟舉</h1><p>善治國者，先闢土地、厚蓄積，使民留處、倉廩實。</p><p>此篇總括管仲之論，云「善為國者」之要義：壤辟舉則民留處，倉廩實則知禮節。必先有事乎此，而後可以定內持天下。外攘之策，末也；內治之道，本也。[[定內持天下]]然後可以圖霸王之業。</p><p><strong>所出</strong>：《管子 · 第71篇事語》 — https://zh.wikisource.org/wiki/管子/第71篇事語</p></article></main></div></div>
