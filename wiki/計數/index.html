    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 計數</nav></header><main><article><h1>計數</h1><p>剛柔輕重大小虛實遠近多少之度量，成事之要也。</p><p>計數者，剛柔也、輕重也、大小也、實虛也、遠近也、多少也，謂之計數。</p><p>《管子》以為，不明於計數而欲舉大事，猶無舟楫而欲經於水險。欲濟大川而無舟楫，其可得乎？舉事必成，不知計數不可。</p><p><strong>所出</strong>：《管子 · 七法》 — https://zh.wikisource.org/wiki/管子/七法/七法</p></article></main></div></div>
