    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 婦降自阼階</nav></header><main><article><h1>婦降自阼階</h1><p>昏禮成後，舅姑降自西階，婦降自阼階，以著代終事舅姑之義。</p><p>厥明，舅姑共饗婦以一獻之禮。奠酬，舅姑先降自西階；婦降自阼階，以著代也。</p><p><strong>所出</strong>：《禮記 · 昏義》 — https://zh.wikisource.org/wiki/禮記/昏義</p></article></main></div></div>
