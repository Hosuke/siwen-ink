    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 禮之中流</nav></header><main><article><h1>禮之中流</h1><p>禮之文貌與情欲，相為表裏，並行而不悖，此禮之中道也。</p><p>以財物為用，以貴賤為文，以多少為異，以隆殺為要。文貌繁，情欲省，禮之隆也；文貌省，情欲繁，禮之殺也；文貌情欲相為內外表裏，並行而雜，禮之中流也。君子上致其隆，下盡其殺，而中處其中。步驟馳騁廣騖不外，是以君子之性守宮庭也。人域是域，士君子也；外是，民也。於是中焉，房皇周浹，曲直得其次序，聖人也。故厚者，禮之積也；大者，禮之廣也；高者，禮之隆也；明者，禮之盡也。</p><p><strong>所出</strong>：《史記 · 卷023》 — https://zh.wikisource.org/wiki/史記/卷023</p></article></main></div></div>
