    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 二炁感化</nav></header><main><article><h1>二炁感化</h1><p>陰陽二炁玄遠相通，人身近取諸此，心胸之間感化之理亦然。</p><p>二炁，陰陽之炁也。玄且遠者，喻陰陽之氣彌綸天地，無所不在。感化尚相通者，天地之間，陰陽二炁雖玄遠廣大，而感應之理相通也。況近存身？切在于心胸者，人身之中，陰陽之炁備焉，一念心動，陰陽隨感，與天地之理同一樞機也。故內修者當知此理，近取諸身，契合天地，方可以成感化之功。</p><p><strong>所出</strong>：《周易參同契 · 21章》 — https://zh.wikisource.org/wiki/周易參同契/21章</p></article></main></div></div>
