    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 彭老之道</nav></header><main><article><h1>彭老之道</h1><p></p><p>「彭老之道」者，修煉長生之法，取法乎彭祖與老子之遺蹤也。葛洪於《抱朴子》中駁時人之疑——或謂彭祖之長壽乃天賦使然，不可學而得之。洪折之曰：「且夫松柏枝葉，與眾木則別。龜鶴體貌，與眾蟲則殊。至於彭老猶是人耳，非異類而壽獨長者，由於得道，非自然也。」</p><p>洪之意：以彭祖本凡人，其所以壽者，以其得道故也。既云得道，則道可學而得之明矣。故曰「眾木不能法松柏，諸蟲不能學龜鶴，是以短折耳。人有明哲，能修彭老之道，則可與之同功矣。」</p><p>此說破宿命之論，立修仙之根據。洪又雲：「自無超世之志，強力之才，不能守之。」是知彭老之道，非徒在法術，亦貴乎心志之堅定也。</p></article></main></div></div>
