    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蜡八之義</nav></header><main><article><h1>蜡八之義</h1><p>歲十二月，合聚萬物而索饗之，仁義之至也。</p><p>蜡祭者，伊耆氏始為之。歲十二月，天子大蜡八，合聚萬物而索饗之焉。主先嗇而祭司嗇，祭百種以報嗇。又有迎猫、迎虎之祭，仁之至、義之盡也。黃衣黃冠而祭，息田夫之野服焉。蜡之祭，所以報本反始，念終始典學者也。</p><p><strong>所出</strong>：《禮記 · 郊特牲》 — https://zh.wikisource.org/wiki/禮記/郊特牲</p></article></main></div></div>
