    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 美且鬈</nav></header><main><article><h1>美且鬈</h1><p>美貌與壯美兼備，稱人之盛也。</p><p>「其人美且鬈」，《說文》云「鬈，發好也」，或通「蜷」，壯美之意。詩言獵者容貌俊美，體態雄健，内美與外儀兼具也。較之首章[[美且仁]]，則德之外又有形神之盛。</p><p><strong>所出</strong>：《詩經 · 盧令》 — https://zh.wikisource.org/wiki/詩經/盧令</p></article></main></div></div>
