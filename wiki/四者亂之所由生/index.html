    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 四者亂之所由生</nav></header><main><article><h1>四者亂之所由生</h1><p>獨賢、獨能、出群、絕眾，四者致亂</p><p>今世之人，行欲獨賢，事欲獨能，辨欲出群，勇欲絕眾。獨行之賢，不足以成化；獨能之事，不足以周務；出群之辨，不可為戶說；絕眾之勇，不可與征陣。凡此四者，亂之所由生。是以，聖人任道以夷其險，立法以理其差，使賢愚不相棄，能鄙不相遺。能鄙不相遺，則能鄙齊功；賢愚不相棄，則賢愚等慮，此至治之術也。</p><p><strong>所出</strong>：《尹文子 · 大道上》 — https://zh.wikisource.org/wiki/尹文子/大道上</p></article></main></div></div>
