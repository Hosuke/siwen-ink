    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 知我者希則我者貴</nav></header><main><article><h1>知我者希則我者貴</h1><p>知者既希，取法者彌貴。</p><p>呂嵓詩云：「三入岳陽人不識，朗吟飛過洞庭湖。」道一曰：「呂嵓棄利斥名，逍遙物外，神示道化，疏絕塵凡。觀其詩云云，聞其風者悅之。《道德經》曰：『知我者希，則我者貴。』真呂嵓之謂也。」夫道高則世莫能知，知音者希，此真人之所以貴也。世人求知於時，而真人以不知於世為貴，其旨一也。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 45》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/45</p></article></main></div></div>
