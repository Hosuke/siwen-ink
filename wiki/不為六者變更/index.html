    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不為六者變更</nav></header><main><article><h1>不為六者變更</h1><p>不因六攻而變更號令、疑錯斧鉞、益損祿賞，則遠近一心，戰必勝守必固。</p><p>然則先王將若之何？曰：不為六者變更於號令，不為六者疑錯於斧鉞，不為六者益損於祿賞。若此則遠近一心，遠近一心則衆寡同力，衆寡同力則戰可以必勝，而守可以必固。</p><p>非以幷兼攘奪也，以為天下政治也。此正天下之道也。</p><p><strong>所出</strong>：《管子 · 第15篇重令》 — https://zh.wikisource.org/wiki/管子/第15篇重令</p></article></main></div></div>
