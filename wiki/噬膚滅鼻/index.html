    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 噬膚滅鼻</nav></header><main><article><h1>噬膚滅鼻</h1><p>噬柔之物而沒其鼻，乘剛之象，刑無過也</p><p>六二之爻，噬膚滅鼻，无咎。膚者，皮肉之柔者；滅鼻者，深入以噬，沒及於鼻也。</p><p>六二以陰居陰，柔而得位，然上乘初九之剛，是乘剛而噬也。乘剛者，以柔陵剛，以下犯上，乃大逆也。然噬者何？為國除害，非私意也。噬而深入，沒及於鼻，刑無過焉，故无咎也。</p><p><strong>所出</strong>：《周易 · 噬嗑》 — https://zh.wikisource.org/wiki/周易/噬嗑</p></article></main></div></div>
