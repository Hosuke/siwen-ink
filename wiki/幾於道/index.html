    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 幾於道</nav></header><main><article><h1>幾於道</h1><p>居眾人之所惡，則近乎道矣。</p><p>水善利萬物而不爭，處眾人之所惡，故幾於道。</p><p>眾人趨上而爭高，水獨就下；眾人惡卑而辭垢，水樂居之。夫爭者道之散，不爭者道之全。水之不爭，正以其無心於爭，故萬物資焉而不知其所出。聖人知眾人之所惡者，下辱之地也，而水居之；眾人之所好者，高貴之名也，而聖人讓之。讓者不爭之實，不爭者幾道之近。故曰幾於道，非水之自幾，乃聖人觀水而知所法也。</p><p><strong>所出</strong>：《老子河上公章句 · 易性》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
