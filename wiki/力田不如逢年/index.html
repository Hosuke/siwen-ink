    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 力田不如逢年，善仕不如遇合</nav></header><main><article><h1>力田不如逢年，善仕不如遇合</h1><p>力農不如逢豐歲，求官不如遇知己，時遇之重於勤勉也</p><p>諺曰「力田不如逢年，善仕不如遇合」，此司馬遷述佞幸之旨，以為非獨女以色媚，士宦亦有之。言天道有時，人事有遇，雖才高學富，苟無遭遇，終不得進；而巧佞之人，逢時遇主，則富貴立至。此亦《論衡》「賢不遇」之先聲也。</p><p><strong>所出</strong>：《史記 · 卷125》 — https://zh.wikisource.org/wiki/史記/卷125</p></article></main></div></div>
