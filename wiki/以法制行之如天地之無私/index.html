    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以法制行之，如天地之無私</nav></header><main><article><h1>以法制行之，如天地之無私</h1><p>賞罰一斷於法，如天地無私覆，地無私載。</p><p>治世則不然。不知親疏遠近貴賤美惡，以度量斷之，其殺戮人者不怨也，其賞賜人不德也。以法制行之，如天地之無私也，是以官無私論，士無私議，民無私說，皆虛其匈以聽其上。上以公正論，以法制斷，故任天下而不重也。</p><p><strong>所出</strong>：《管子 · 第45篇任法》 — https://zh.wikisource.org/wiki/管子/第45篇任法</p></article></main></div></div>
