    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 百年壽之大齊</nav></header><main><article><h1>百年壽之大齊</h1><p>楊朱言人生百年難得，縱得之，其間逸樂之時亦復無幾。</p><p>楊朱論人之生年，以百年為齊。得百年者千無一焉。假有一人，自孩抱逮於昏老，晝夜相半；夜眠晝覺，又居其半；痛疾哀苦，憂懼怖畏，又居其半。十年之中，逌然自得亡介焉之慮者，亦亡一時之中爾。是以美厚厭足、聲色翫聞，皆不可常；而刑賞禁勸、名法進退，又從而桎梏之。楊朱以為：太古之人知生之暫來、死之暫往，故從心而動，不違自然所好；當身之娛非所去也，故不為名所勸。此其逍遙之本也。</p><p><strong>所出</strong>：《列子 · 楊朱篇》 — https://zh.wikisource.org/wiki/列子/楊朱篇</p></article></main></div></div>
