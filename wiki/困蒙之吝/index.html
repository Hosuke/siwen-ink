    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 困蒙之吝</nav></header><main><article><h1>困蒙之吝</h1><p>困於蒙昧而不能自拔，則有吝也。</p><p>六四：困蒙，吝。象曰：「困蒙之吝，獨遠實也。」</p><p>困蒙者，困於蒙昧而不能自振也。夫蒙而不能求教，困而不能自達，是其心已蔽塞已甚，無由以通也。獨遠實者，言其去聖人既遠，無由得正言之益也。</p><p><strong>所出</strong>：《周易 · 蒙》 — https://zh.wikisource.org/wiki/周易/蒙</p></article></main></div></div>
