    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 常善救物故無棄物</nav></header><main><article><h1>常善救物故無棄物</h1><p>聖人善利於物，物無可棄。</p><p>常善救物，故無棄物，是謂襲明者，聖人與物同體，無物不救，無物可棄，於物無所拂逆，是謂襲明。明者，道之照明，襲者，承也。承道之明，則物我皆備，善救萬物，無一物之見遺也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 二十七章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p><hr><p>[[聖人善救人物]] 之意歟。</p><p><strong>所出</strong>：《老子河上公章句 · 巧用》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
