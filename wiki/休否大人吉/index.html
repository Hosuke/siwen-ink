    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 休否大人吉</nav></header><main><article><h1>休否大人吉</h1><p>閉塞稍息，君子得位而吉，然當戒慎恐懼</p><p>九五，休否，大人吉。其亡其亡，繫于苞桑。</p><p>否卦至此，閉塞稍止，大人得位而吉。然猶當戒慎其亡，如《詩》所云「其亡其亡」，心常危懼，如繫於苞桑之固，庶幾可保其位也。</p><p><strong>所出</strong>：《周易 · 否》 — https://zh.wikisource.org/wiki/周易/否</p></article></main></div></div>
