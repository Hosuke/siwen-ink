    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 禁勝於身</nav></header><main><article><h1>禁勝於身</h1><p>禁戒先制己身，令乃暢行。</p><p>禁勝於身，則令行於民；禁不勝於身，則令不行於民。</p><p>法之不行，上之所犯也。令而不行，則令不法也。法而不行，則脩令者不審也。賞罰輕，賞罰不信，人君不以身先之，則令不行。故明君必先自治，而後能治人；必先自勝，而後能勝人。禁茍能制己，則令無不行；禁茲不能制己，雖有賞罰，無所用之。</p><p>是故禁者，上之所自治也；令者，下之所執行也。上先自治，則下莫敢不服；上不自勝，則令自我廢。令自我廢，則姦邪起而亂賊作矣。</p><p><strong>所出</strong>：《管子 · 第16篇法法》 — https://zh.wikisource.org/wiki/管子/第16篇法法</p></article></main></div></div>
