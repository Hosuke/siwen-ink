    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 維南有箕，載翕其舌</nav></header><main><article><h1>維南有箕，載翕其舌</h1><p>箕星之舌欲吸萬物，以喻剝削</p><p>維南有箕，固不可以簸揚，而又載翕其舌，言其舌翕然而吸納，欲有所取也。詩人以星象言之，箕不可以簸米，而乃欲吸食萬物，喻在上者之取盈無已也。</p><p><strong>所出</strong>：《詩經 · 大東》 — https://zh.wikisource.org/wiki/詩經/大東</p></article></main></div></div>
