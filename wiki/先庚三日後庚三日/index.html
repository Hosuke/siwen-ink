    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 先庚三日後庚三日</nav></header><main><article><h1>先庚三日後庚三日</h1><p>變更之際，先後三日以申戒也。</p><p>九五之爻曰「无初有終，先庚三日，后庚三日」。庚者，更也。事之將更，先後三日以申戒焉。庚前三日為丁，庚後三日為癸，取丁癸之間，示有事變更而孚允之義。《象》闕而《彖》稱之，以明九五之吉，在乎有終也。</p><p><strong>所出</strong>：《周易 · 巽》 — https://zh.wikisource.org/wiki/周易/巽</p></article></main></div></div>
