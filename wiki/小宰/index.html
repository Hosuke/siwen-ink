    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 小宰</nav></header><main><article><h1>小宰</h1><p>中大夫二人，副大宰掌宮刑與六典八法之貳</p><p>小宰，中大夫二人。</p><p>掌建邦之宮刑，以治王宮之政令，凡宮之糾禁。掌邦之六典、八法、八則之貳，以逆邦國、都鄙、官府之治。執邦之九貢、九賦、九式之貳，以均財節邦用。</p><p>以官府之六敘正群吏，六屬舉邦治，六職辨邦治，六聯合邦治，八成經邦治。</p><p>以聽官府之六計弊群吏之治：一曰廉善，二曰廉能，三曰廉敬，四曰廉正，五曰廉法，六曰廉辨。</p><p><strong>所出</strong>：《周禮 · 天官冢宰》 — https://zh.wikisource.org/wiki/周禮/天官冢宰</p></article></main></div></div>
