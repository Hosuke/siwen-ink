    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 翟黃乘軒騎駕</nav></header><main><article><h1>翟黃乘軒騎駕</h1><p>寵之以位當稱其功</p><p>田子方從齊之魏，望翟黃乘軒騎駕出，方以爲文侯也，移車異路而避之，則徒翟黃也。方問曰：「子奚乘是車也？」曰：「君謀欲伐中山，臣推薦翟角而謀得果；且伐之，臣推薦樂羊而中山拔；得中山，憂欲治之，臣推薦李克而中山治，是以君賜此車。」方曰：「寵之稱功尚薄。」</p><p>夫翟黃因推薦賢才而有功，魏文侯賜以軒車。然田子方以爲寵之稱功尚薄，蓋賞不足以報功也。</p><p><strong>所出</strong>：《韓非子 · 外儲說左下》 — https://zh.wikisource.org/wiki/韓非子/外儲說左下</p></article></main></div></div>
