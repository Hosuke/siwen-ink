    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 循天順人而明賞罰</nav></header><main><article><h1>循天順人而明賞罰</h1><p>治國當順天時、合人情、明賞罰，三者並行乃可定分。</p><p>聞古之善用人者，必循天順人而明賞罰。循天，則用力寡而功立；順人，則刑罰省而令行；明賞罰，則伯夷、盜跖不亂。如此，則白黑分矣。</p><p>循天者，因時之自然，不逆時而行；順人者，隨民心之所向，不拂人情而強之；明賞罰者，賞當功、罰當罪，不混淆於期間。韓非子以為，三者備則治國之要盡矣。循天故功成不勞，順人故令行不擾，明賞罰故賢否自分。賢者見賞則勸，不肖者畏罰則不敢犯。此治之至術也。</p><p><strong>所出</strong>：《韓非子 · 用人》 — https://zh.wikisource.org/wiki/韓非子/用人</p></article></main></div></div>
