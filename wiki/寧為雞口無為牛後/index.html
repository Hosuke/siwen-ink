    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 寧為雞口無為牛後</nav></header><main><article><h1>寧為雞口無為牛後</h1><p>寧為小而自主，不為大而從屬。</p><p>蘇秦說韓宣王，曰：「臣竊聞大王之卒，强弓勁弩皆從韓出，軍勢强盛。若西面事秦，則交臂而臣，羞社稷。臣諫以為寧為雞口，無為牛後。」韓王勃然作色，終從蘇秦之計。</p><p><strong>所出</strong>：《史記 · 卷069》 — https://zh.wikisource.org/wiki/史記/卷069</p></article></main></div></div>
