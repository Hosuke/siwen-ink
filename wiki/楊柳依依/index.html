    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 楊柳依依</nav></header><main><article><h1>楊柳依依</h1><p></p><p>「[[昔我往矣]]，楊柳依依」，[[采薇]]末章起興之辭也。依依，狀柳枝輕柔隨風之態。[[雨雪霏霏]]對舉，春柳冬雪，今昔殊候，以寫征戍之久、思歸之切。《經解》以為詩教之温柔敦厚，正在言近旨遠：以眼前之景，寓萬里之思；《采薇》末章尤為後世詩家所祖。</p><p>  <strong>所出</strong>：《詩經 · 采薇》 — https://zh.wikisource.org/wiki/詩經/采薇</p></article></main></div></div>
