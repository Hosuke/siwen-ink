    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 止旅乃密</nav></header><main><article><h1>止旅乃密</h1><p>公劉理其基址，定民止居，使疆理廣密也。</p><p>公劉，于豳斯館，涉渭為亂，取厲取鍛，止基迺理。爰眾爰有，夾其皇澗。遡其過澗，止旅乃密，芮鞫之即。</p><p>公劉館於豳地，渡渭水而東，取厲石取鍛材，居室之具既備。止基迺理，定其基址，修其疆界也。爰眾爰有，居人日聚也。夾其皇澗，皇澗夾岸而居也。遡其過澗，逆流而上，定居過澗之民也。止旅乃密，定其止居，人物於是乎密也。芮鞫之即，水邊之人亦就水土之利而定居焉。</p><p>止旅乃密，猶言止居既定，而民物殷繁，疆理廣被也。</p><p><strong>所出</strong>：《詩經 · 公劉》 — https://zh.wikisource.org/wiki/詩經/公劉</p></article></main></div></div>
