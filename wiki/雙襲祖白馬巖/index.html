    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 雙襲祖白馬巖</nav></header><main><article><h1>雙襲祖白馬巖</h1><p>雙襲祖字仲遠，居南嶽白馬巖，七日蟬蛻，遺仙被於木杪。</p><p>道士雙襲祖字仲遠，樑時昊人也。始居南嶽，後遷九疑山。潛心於道，以求度世。嘗謂誠素所至，高真必通，遂刻志誦《黃庭》《玉篇》。因作《黃庭觀》，使弟子居之，自棲於白馬巖。</p><p>一日，歸觀沐浴，閉室而坐，凡七日不出。弟子驚異，開視之，忽然輕舉，遺仙被於木杪。時唐太宗貞觀元年夏四月也。巖中臥席，後百餘年皆不壞。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 28》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/28</p></article></main></div></div>
