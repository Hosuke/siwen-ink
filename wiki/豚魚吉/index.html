    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 豚魚吉</nav></header><main><article><h1>豚魚吉</h1><p>信及豚魚，至誠動物，無往不利。</p><p>卦辭曰「豚魚吉」，言信德之至，雖豚魚之微亦能被化，吉之道也。彖傳申之曰「信及豚魚」。</p><p><strong>所出</strong>：《周易 · 中孚》 — https://zh.wikisource.org/wiki/周易/中孚</p></article></main></div></div>
