    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 人道反天</nav></header><main><article><h1>人道反天</h1><p>人道與天道相反</p><p>[[人道]]與[[天道]]異乎？曰：反之。云何反？天道[[損有餘補不足]]，[[人道]]則損不足以奉有餘。貧者益困，富有者益盈；弱肉而強食，[[柔弱勝剛強]]之理，於是乎反。世俗之人，取人之不足以益己之有餘；[[上士無爭]]，則不若是也。[[上德無為]]者奚自見哉？[[天之道利而不害]]，而[[人之道]]則[[不平]]之甚焉。此亦[[爭不若無爭]]之義也。</p><p><strong>所出</strong>：《老子河上公章句 · 天道》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
