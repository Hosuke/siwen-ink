    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 見善而怠</nav></header><main><article><h1>見善而怠</h1><p>道之止者三：見善而怠、時至而疑、知非而處。</p><p>太公告文王以先聖之道，有道之止三事：「見善而怠，時至而疑，知非而處，此三者，道之所止也。」</p><p>見善而怠者，知善之當行而不勇於行也；时至而疑者，機遇之來而不決也；知非而處者，明知其非而安於處之也。三者皆足以敗德害事，故道止於此。聖人戒之。</p><p><strong>所出</strong>：《六韜》 — https://zh.wikisource.org/wiki/六韜</p></article></main></div></div>
