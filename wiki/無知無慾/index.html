    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無知無慾</nav></header><main><article><h1>無知無慾</h1><p>常使民無知無慾則天下自治</p><p>常使民無知無慾。</p><p>知者，機智也；慾者，嗜欲也。民有知則有機巧之心，有慾則有貪求之念；機巧生則相傾，貪求熾則相爭。是以聖人常使民返乎朴素，無知則不巧，無慾則不爭，天下乃大定矣。河上公章句云：「返朴，無所歸也。」又云：「上之化下，下之效上，抱道無為，天下自正也。」蓋知去則巧心滅，慾去則貪念消。此 [[不爭]] 與 [[不盜]] 之本也。</p><p><strong>所出</strong>：《老子河上公章句 · 安民》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
