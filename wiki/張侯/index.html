    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 張侯</nav></header><main><article><h1>張侯</h1><p>設射侯之布，結下綱以為的也。</p><p>乃張侯，下綱不及地武。不繫左下綱，中掩束之。乏參侯道，居侯黨之一，西五步。司射去扑，倚于西階之西，升請射于賔。司馬命張侯，弟子說束，遂繫左下綱。司馬又命獲者「倚旌于侯中」，獲者由西方，坐取旌，倚于侯中，乃退。射畢，司馬命弟子說侯之左下綱而釋之。</p><p><strong>所出</strong>：《儀禮 · 鄉射禮》 — https://zh.wikisource.org/wiki/儀禮/鄉射禮</p></article></main></div></div>
