    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 山下有雷</nav></header><main><article><h1>山下有雷</h1><p>頤之象，雷在山下，君子取以慎言節食。</p><p>《象》曰：「山下有雷，頤。」震雷動於山下，萬物收聲而待養，是頤之象也。君子法之，慎言語以養德，節飲食以養身，此聖人取象之妙也。</p><p><strong>所出</strong>：《周易 · 頤》 — https://zh.wikisource.org/wiki/周易/頤</p></article></main></div></div>
