    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 人間臭如帑</nav></header><main><article><h1>人間臭如帑</h1><p>人間繁華，如帑帛之腐，不足戀也。</p><p>人間紛紛臭如帑。</p><p>帑者，錢帛也，世間之財也。言[[富貴者驕人乎|富貴]]之輩，區區於[[金玉盈室]]之間，而不知其[[糞土微於肌膚|糞土不如]]。惟真人觀之，若[[糞土]]之臭，不足[[物至而能神應|動其心]]也。</p><p><strong>所出</strong>：《黃庭內景經 · 隱景章第二十四》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/隱景章第二十四</p></article></main></div></div>
