    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 用田賦</nav></header><main><article><h1>用田賦</h1><p>哀公用田畝之稅，軍賦之法變也。</p><p>哀公十二年春，用田賦。田賦者，按田畝之數而斂之以供軍需也。魯舊有丘賦之制，至是改用田賦，則稅入益廣，而民力愈困矣。《春秋》書之，記制度之變也。</p><p><strong>所出</strong>：《春秋公羊傳 · 哀公》 — https://zh.wikisource.org/wiki/春秋公羊傳/哀公</p></article></main></div></div>
