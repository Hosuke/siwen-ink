    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 從事於德者同於德</nav></header><main><article><h1>從事於德者同於德</h1><p>趨事有德者與德合同。</p><p>德者同於德，好德之人與德同道，則德亦與之合同。河上公云：「與德同者，德亦樂得之也。」物類相歸，同聲相應，與德者之所以合德者，亦自然之道爾。</p><p><strong>所出</strong>：《老子河上公章句 · 虛無》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
