    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 招魂</nav></header><main><article><h1>招魂</h1><p>巫陽受命為客魂作歸鄉之辭</p><p>帝告巫陽曰：「有人在下，我欲輔之。魂𩲸離散，汝筮予之。」巫陽對曰：「掌㝱。」上帝其難從。帝遂命巫陽下招，辭曰「魂兮歸來」，歷述四方之害、幽都之怖，以故居之美樂反襯，終以歸返故室為旨。蓋祭祀之儀，祝史之辭也。</p><p><strong>所出</strong>：《楚辭 · 招䰟》 — https://zh.wikisource.org/wiki/楚辭/招䰟</p></article></main></div></div>
