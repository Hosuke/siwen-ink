    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不善人者善人之資</nav></header><main><article><h1>不善人者善人之資</h1><p>不善者為善者之資，借以成德。</p><p>不善人者，善人之資者，資者，取也用也。善人之德成，亦資不善者以為鑒戒，不善者之失，善人觀之以自正，不善者之逆，善人化之以自明。是故善人資不善人，亦善人之所不忘也。師與資相待而成，不可偏廢也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 二十七章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
