    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大哉王言，一哉王心</nav></header><main><article><h1>大哉王言，一哉王心</h1><p>王者之言天下以為法，王者之心天下以為歸。</p><p>王言一出，萬姓咸曰大哉；王心既定，萬姓咸曰一哉。言大者，非辭之盛也，在出於一德也；心一者，非意之執也，在終始不易也。惟言出於一德，故天下以為法而不疑；惟心終始不易，故天下以為歸而不散。此王道之所以成，而德化之所以洽也。</p><p>俾萬姓咸曰大哉王言。又曰一哉王心。克綏先王之祿，永底烝民之生。</p><p><strong>所出</strong>：《尚書 · 咸有一德》 — https://zh.wikisource.org/wiki/尚書/咸有一德</p></article></main></div></div>
