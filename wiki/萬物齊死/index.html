    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 萬物齊死</nav></header><main><article><h1>萬物齊死</h1><p>楊朱以為賢愚貴賤之人，生雖異而死則同，腐骨一矣，莫若趣及當生。</p><p>楊朱曰：「萬物所異者生也，所同者死也。生則有賢愚、貴賤，是所異也；死則有臭腐、消滅，是所同也。賢愚、貴賤非所能也，臭腐、消滅亦非所能也。故生非所生，死非所死；賢非所賢，愚非所愚；貴非所貴，賤非所賤。然而萬物齊生齊死，齊賢齊愚，齊貴齊賤。十年亦死，百年亦死；仁聖亦死，凶愚亦死。生則堯舜，死則腐骨；生則桀紂，死則腐骨。腐骨一矣，孰知其異？且趣當生，奚遑死後？」</p><p><strong>所出</strong>：《列子 · 楊朱篇》 — https://zh.wikisource.org/wiki/列子/楊朱篇</p></article></main></div></div>
