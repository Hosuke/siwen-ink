    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 尼父卒哀公作誄</nav></header><main><article><h1>尼父卒哀公作誄</h1><p>孔子既卒，魯哀公作誄，其文有古式存焉。</p><p>逮尼父卒，哀公作誄。觀其憗遺之切，嗚呼之歎，雖非叡作，古式存焉。</p><p><strong>所出</strong>：《文心雕龍 · 誄碑》 — https://zh.wikisource.org/wiki/文心雕龍/誄碑</p></article></main></div></div>
