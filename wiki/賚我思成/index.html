    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 賚我思成</nav></header><main><article><h1>賚我思成</h1><p>神靈錫予心想事成之福。</p><p>「賚我思成」出自《商頌·烈祖》，言神靈先祖錫予祭祀者心想事成之驗福也。</p><p>詩云「既載清酤，賚我思成」，言以清酒祭祖，祖考嘉予以遂心之應，使凡有所念皆得成就。此與「來假來饗，降福無疆」相承，先以祭品奉享，次蒙神貺成遂，神人相接之感通昭然可見。</p><p>「思成」之義，鄭玄箋云「使之皆得安寧」，朱熹集傳云「錫之福使我思之而成」。合而言之，乃蒙先祖遺澤，凡心所願皆獲佑助而底於成也。</p><p><strong>所出</strong>：《詩經 · 烈祖》 — https://zh.wikisource.org/wiki/詩經/烈祖</p></article></main></div></div>
