    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 南有樛木</nav></header><main><article><h1>南有樛木</h1><p>喻君子逮下，葛藟因得依附而蔭庇。</p><p>「南有樛木」者，興也。樛木下垂，故葛藟得而纍之、荒之、縈之。</p><p>南方之木，非不高也；木而曰樛，言其下垂。唯下垂，故葛藟之在下者可以附之而起。此〈詩〉之所以取興也。</p><p>葛藟依木以生，因下而得上蔭；君子逮下而無嫉，故下之人蒙上之福。先逮後福，報之有序也。</p><p><strong>所出</strong>：《詩經 · 樛木》 — https://zh.wikisource.org/wiki/詩經/樛木</p></article></main></div></div>
