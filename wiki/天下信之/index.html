    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天下信之</nav></header><main><article><h1>天下信之</h1><p>國君之信，在於民愛之、鄰國親之、天下信之。</p><p>[[桓公]]問國君之信，[[管仲]]對曰：「民愛之，鄰國親之，天下信之，此國君之信也。」信之要，在三者兼備。</p><p><strong>所出</strong>：《管子 · 第19篇中匡》 — https://zh.wikisource.org/wiki/管子/第19篇中匡</p></article></main></div></div>
