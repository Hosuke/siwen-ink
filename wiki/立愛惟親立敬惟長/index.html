    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 立愛惟親，立敬惟長</nav></header><main><article><h1>立愛惟親，立敬惟長</h1><p>治道始於孝悌，推及天下。</p><p>伊尹訓王曰：「今王嗣厥德，罔不在初。立愛惟親，立敬惟長，始于家邦，終于四海。」言為治者當自孝悌始。愛自親始，敬自長始，及其充也，可以治國平天下。孟子所謂「堯舜之道孝悌而已」，與此義合。</p><p><strong>所出</strong>：《尚書 · 伊訓》 — https://zh.wikisource.org/wiki/尚書/伊訓</p></article></main></div></div>
