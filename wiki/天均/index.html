    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天均</nav></header><main><article><h1>天均</h1><p>萬物如環無端，自然平等之理也。</p><p>《齊物論》：「是以聖人和之以是非而休乎天均，是之謂兩行。」</p><p>天均者，天道自然之平衡也。休乎天均者，不以人為之是非易天然之分際也。世人各是其是、各非其非，而滑疑之耀亂之；唯聖人知通為一，和之使無過不及。兩行者，是亦一無窮、非亦一無窮，順其自然而不加以可否之分也。是故至人之治，非以是易非、以非易是，乃順物之情，俾萬物各安其自然之序而已。</p><p><strong>所出</strong>：《莊子 · 齊物論》 — https://zh.wikisource.org/wiki/莊子/齊物論</p></article></main></div></div>
