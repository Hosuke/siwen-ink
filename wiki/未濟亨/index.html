    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 未濟亨</nav></header><main><article><h1>未濟亨</h1><p>事未成而得通達</p><p>未濟，亨。卦辭以「未濟」名卦，而繼之以「亨」，明事物未成之時，亦有通達之理。蓋亨者，天地之氣流通無滯，未成非終，塞而能通，匪以成敗論吉凶也。[[知進退存亡而不失其正]]云者，正此之謂。事未竟而心亨，逆境之中自有可通之路焉。</p><p><strong>所出</strong>：《周易 · 未濟》 — https://zh.wikisource.org/wiki/周易/未濟</p></article></main></div></div>
