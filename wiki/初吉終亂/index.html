    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 初吉終亂</nav></header><main><article><h1>初吉終亂</h1><p>既濟卦辭，示初始吉祥而終至危亂，戒居安思危、持盈保泰。</p><p>既濟之辭曰「初吉終亂」。蓋萬事既成之時，人心易生怠佚，始焉恭慎，終焉荒怠，亂由是生。《彖傳》云「終止則亂，其道窮也」，言盛極必衰，天之道也。君子觀此，當思患而豫防之，不可恃其成而忽其敗。[[思患豫防]]之義，即以此也。</p><p><strong>所出</strong>：《周易 · 既濟》 — https://zh.wikisource.org/wiki/周易/既濟</p></article></main></div></div>
