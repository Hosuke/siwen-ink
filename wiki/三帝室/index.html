    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三帝室</nav></header><main><article><h1>三帝室</h1><p>三帝所居，混合三帝之室。</p><p>三帝者，天、地、水之三元帝君。「策龍駕紫烟，混合三帝室」者，[[上清大洞真經]]脾中五真呪，混合三元帝君之室，以[[保我萬劫年]]，是[[長生]]之要道。</p><p><strong>所出</strong>：《上清大洞真經 · 15章》 — https://zh.wikisource.org/wiki/上清大洞真經/15章</p></article></main></div></div>
