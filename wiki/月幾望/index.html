    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 月幾望</nav></header><main><article><h1>月幾望</h1><p>月近滿盈則陰犯陽之象。</p><p>月幾望，小畜上九爻辭也。言月將近滿，陰道已盛。陰盛則犯陽，君子征行必凶。象曰「有所疑也」，言陰盛可疑，君子不可輕動。蓋小畜上九為陰之極，月幾望者，陰之將盛也。</p><p><strong>所出</strong>：《周易 · 小畜》 — https://zh.wikisource.org/wiki/周易/小畜</p><hr><p>六五爻辭云「月幾望」。「月幾望」者，陰道將盈而未盈，喻人守中不自滿也。以柔居中履正，不陵於陽，故吉。《歸妹》六五以月幾望取象，帝乙歸妹之德也。</p><p><strong>所出</strong>：《周易 · 歸妹》 — https://zh.wikisource.org/wiki/周易/歸妹</p></article></main></div></div>
