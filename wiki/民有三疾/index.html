    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 民有三疾</nav></header><main><article><h1>民有三疾</h1><p>古之民有狂、矜、愚三疾，今之民不然，乃益增其蔽。</p><p>孔子曰：「古者民有三疾，今也或是之亡也。古之狂也肆，今之狂也蕩；古之矜也廉，今之矜也忿戾；古之愚也直，今之愚也詐而已矣。」</p><p>三疾者，狂、矜、愚也，古昔之人有是疾而猶有可取者，狂則肆而不匿，矜則廉而不屈，愚則直而不邪。其病雖在，質猶近善也。及其後世，則變本加厲，狂成放蕩，矜成忿戾，愚成詐欺。聖人傷時之降俗之偷，嘆古今人心之異也。</p><p><strong>所出</strong>：《論語 · 陽貨第十七》 — https://zh.wikisource.org/wiki/論語/陽貨第十七</p></article></main></div></div>
