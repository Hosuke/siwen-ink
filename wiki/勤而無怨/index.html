    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 勤而無怨</nav></header><main><article><h1>勤而無怨</h1><p>為人盡力而不以為怨，斯之謂厚德。</p><p>《毛詩序》述《江有汜》之旨曰：「勤而無怨。」</p><p>媵之於嫡，執婢妾之事，備妾御之數，其勤也宜矣。及其被遣，猶不怨焉。此非畏懼強抑，乃其性分之厚，足以勝怨而不動於心者也。</p><p>後世解詩者或以「無怨」為消極之隱忍，不知其本於性情之自然發見。觀《江有汜》全詩，雖有「其後也悔」之預言、「其嘯也歌」之悲吟，終無一怨字加於人者，斯之謂「勤而無怨」之實。</p><p><strong>所出</strong>：《詩經 · 江有汜》 — https://zh.wikisource.org/wiki/詩經/江有汜</p></article></main></div></div>
