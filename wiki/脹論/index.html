    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 脹論</nav></header><main><article><h1>脹論</h1><p>脹者皆在藏府之外，排藏府而郭胸腹，審其腧穴而刺之。</p><p>脈大堅以濇者，脹也。陰為藏，陽為府，脹之舍在藏府之外、排藏府而郭胸腹、脹皮膚。</p><p>五藏六府各有脹形：心脹者煩心短氣臥不安，肺脹者虛滿而喘欬，肝脹者脇下滿痛引小腹，脾脹者善噦四肢煩悗體重不能勝衣，腎脹者腹滿引背央央然腰髀痛。六府亦各有脹狀。</p><p>治脹之法，三里而寫，近者一下，遠者三下，審其腧，當寫則寫，當補則補，如鼓應桴。衛氣並脈循分為膚脹，陷於肉盲而中氣穴者，氣下乃止，不下復始。</p><p><strong>所出</strong>：《黃帝內經 · 靈樞第六卷》 — https://zh.wikisource.org/wiki/黃帝內經/靈樞第六卷</p></article></main></div></div>
