    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 歲星行宿</nav></header><main><article><h1>歲星行宿</h1><p>歲星行三宿或二宿，十二歲而周天。</p><p>太陰在四仲，則歲星行三宿；太陰在四鉤，則歲星行二宿。二八十六，三四十二，故十二歲而行二十八宿。日行十二分度之，歲行三十度十六分度之七，十二歲而周。</p><p><strong>所出</strong>：《淮南子 · 天文訓》 — https://zh.wikisource.org/wiki/淮南子/天文訓</p></article></main></div></div>
