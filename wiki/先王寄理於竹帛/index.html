    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 先王寄理於竹帛</nav></header><main><article><h1>先王寄理於竹帛</h1><p>先王以法度寄於典籍，使後世循而行之。</p><p>先王以治道寄之於竹帛，其道甚順，故後世信服。[[賞罰隨是非]]， [[死生隨法度]]， [[有信而無詐]]，皆先王所立之制也。使人去饑寒，雖[[賞罰以信|賞罰以信]]而不行；廢自然之理，雖順道而不立。[[法所以為國]]者，先王之遺也；[[號令者國之舟車]]者，先王之具也。</p><p><strong>所出</strong>：《韓非子 · 安危》 — https://zh.wikisource.org/wiki/韓非子/安危</p></article></main></div></div>
