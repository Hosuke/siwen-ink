    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 實僞之辨</nav></header><main><article><h1>實僞之辨</h1><p>楊朱以管仲、田氏之事，明實名貧而僞名富，堯舜讓天下乃僞，伯夷孤竹乃實，實反亡國，僞反享國。</p><p>楊朱答孟氏問名，以為管仲相齊，君淫亦淫，君奢亦奢，而身後管氏而已。田氏之相齊，君盈則己降，君歛則己施，民皆歸之，子孫享之至今不絕。楊朱遂斷之曰：「若實名貧，僞名富。」又申之曰：「實無名，名無實。名者，僞而已矣。昔者堯舜僞以天下讓許由、善卷，而不失天下，享祚百年。伯夷、叔齊實以孤竹君讓，而終亡其國，餓死於首陽之山。實、僞之辯，如此其省也。」</p><p><strong>所出</strong>：《列子 · 楊朱篇》 — https://zh.wikisource.org/wiki/列子/楊朱篇</p></article></main></div></div>
