    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 求遭喪之禮</nav></header><main><article><h1>求遭喪之禮</h1><p>季文子將聘晉，求遭喪之禮以行，蓋備豫不虞，古之善教。</p><p>秋，季文子將聘於晉，使求遭喪之禮以行。其人曰：「將焉用之？」文子曰：「備豫不虞，古之善教也。求而無之，實難。過求何害？」</p><p><strong>所出</strong>：《春秋左氏傳 · 文公》 — https://zh.wikisource.org/wiki/春秋左氏傳/文公</p></article></main></div></div>
