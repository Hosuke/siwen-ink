    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 晦朔合符</nav></header><main><article><h1>晦朔合符</h1><p>陰陽交會於晦朔，符契相合，乃丹道之樞機。</p><p>晦朔之際，陰陽二炁交會於无形之境。[[混沌鴻蒙]]，牝牡相從，[[滋液潤澤]]，施化流通。天地神明，不可度量。[[利用安身]]，隱形而藏。此合符之功，乃萬化之根、丹道之始也。魏伯陽演《參同契》，以月之晦朔喻身中陰陽二炁之會合，符契者，炁候之不爽三期，動靜之相對待者也。晦為月終，朔為月始，晦而復朔，陽炁始生，此天地之符，亦人身之符。修煉者當以此時為起手，火候之根宗，不可失其時會。</p><p><strong>所出</strong>：《周易參同契 · 18章》 — https://zh.wikisource.org/wiki/周易參同契/18章</p></article></main></div></div>
