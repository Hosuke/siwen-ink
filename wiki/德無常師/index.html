    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 德無常師</nav></header><main><article><h1>德無常師</h1><p>德之師法不以一人為拘，善者皆可師之。</p><p>學不可以拘一師，德不可以限一道。天下之善皆可為師，不必其人之貴賤年世也。主善為師，則無適而非學；善無常主，則無往而非益。協於一德者，兼取眾善而歸於一途，苟協於克一，則天下之善皆備於我矣。</p><p>德無常師，主善為師。善無常主，協于克一。</p><p><strong>所出</strong>：《尚書 · 咸有一德》 — https://zh.wikisource.org/wiki/尚書/咸有一德</p></article></main></div></div>
