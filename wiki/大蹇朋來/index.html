    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大蹇朋來</nav></header><main><article><h1>大蹇朋來</h1><p>居尊濟蹇，朋友相助。</p><p>九五曰：「大蹇朋來。」</p><p>九五陽剛中正，居尊位而遇大蹇，然德足以及人，故朋類自來相助。以中節者，來者有道，非濫交也。蓋君子之濟蹇，非一手一足之烈，必得同心之友以成之。</p><p><strong>所出</strong>：《周易 · 蹇》 — https://zh.wikisource.org/wiki/周易/蹇</p></article></main></div></div>
