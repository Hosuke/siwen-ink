    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 左袒右袒</nav></header><main><article><h1>左袒右袒</h1><p>為呂氏右袒，為劉氏左袒。</p><p>太尉將之入軍門，行令軍中曰：「為呂氏右袒，為劉氏左袒。」軍中皆左袒為劉氏。太尉行至，將軍呂祿亦已解上將印去，太尉遂將北軍。</p><p><strong>所出</strong>：《史記 · 卷009》 — https://zh.wikisource.org/wiki/史記/卷009</p></article></main></div></div>
