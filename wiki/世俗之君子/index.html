    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 世俗之君子</nav></header><main><article><h1>世俗之君子</h1><p></p><p>墨子論世俗君子之乖謬：彼輩貧而謂之富則怒，無義而謂之有義則喜。墨子以為此豈不悖哉！</p><p>此論揭示墨子對道德偽善之深刻批判。世人之[[義-儒學-之|汲汲於名]]者，令墨子深感憂慮。真正的君子當以求[[明善誠身]]為務，而非喜悅於空洞之名號。此與上文[[天下之良寶]]之義相表裏，皆明真正的義行當以利民為準，非以博取虛名為歸。</p></article></main></div></div>
