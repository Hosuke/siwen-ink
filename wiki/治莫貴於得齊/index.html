    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 治莫貴於得齊</nav></header><main><article><h1>治莫貴於得齊</h1><p>治民以得其齊為貴，過急過緩皆失其當。</p><p>事莫急於當務，治莫貴於得齊。制民，急則民迫，民迫則窘，窘則民失其所葆；緩則縱，縱則淫，淫則行私，行私則離公，離公則難用。故治之所以不立者，齊不得也；齊不得，則治難行。[[治民之齊]]不可不察也。夫[[制民急緩]]之說，正所以明齊之義。</p><p><strong>所出</strong>：《管子 · 第47篇正世》 — https://zh.wikisource.org/wiki/管子/第47篇正世</p></article></main></div></div>
