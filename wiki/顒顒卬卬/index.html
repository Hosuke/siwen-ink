    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 顒顒卬卬</nav></header><main><article><h1>顒顒卬卬</h1><p>儀容端嚴，氣象軒昂。</p><p>顒顒卬卬，形容君子之儀表，端莊而軒昂。如圭如璋，喻其德行純粹可愛；令聞令望，言其聲譽昭著，四方以為準的。</p><p><strong>所出</strong>：《詩經 · 卷阿》 — https://zh.wikisource.org/wiki/詩經/卷阿</p></article></main></div></div>
