    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三名</nav></header><main><article><h1>三名</h1><p>名生於生死之際，達乎形神之間也。</p><p>三名者，[[名]]之生於[[生死]]之際也。生死之際，[[形]]與[[神]]始判之時，名遂生焉。一名[[玄真]]，二者[[精神]]，三名萬物之稱。知三名之起，則知[[道]]之所以名，知名之所以虛，而契乎[[無名]]之原矣。</p><p><strong>所出</strong>：《黃庭內景經 · 五行章第二十五》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/五行章第二十五</p></article></main></div></div>
