    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 子惠困窮</nav></header><main><article><h1>子惠困窮</h1><p>君恩如春，惠及困窮，民自服命。</p><p>先王子惠困窮，民服厥命，罔有不悅。君王如天之父，惠臨困窮之民。民受惠若子之於父母，則自然悅服而從命。[[愛民樂民]]之義，實本於此。</p><p><strong>所出</strong>：《尚書 · 太甲中》 — https://zh.wikisource.org/wiki/尚書/太甲中</p></article></main></div></div>
