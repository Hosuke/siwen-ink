    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 月水之精鬼</nav></header><main><article><h1>月水之精鬼</h1><p>女人月水之精，鬼常貪陰陽血味</p><p>[[女青鬼律]]所記月水之精鬼有二名：桑華載、辟氣途付。經云：「右二鬼是女人月水之精，鬼常貪陰陽血味，女子月水來，日夕存之，呼名，鬼不敢害人。鬼長三尺，上下青衣。」</p><p>此鬼長三尺，青衣，附於女人月水。知其名，日夕存之，鬼不敢害人。以其鬼之性貪陰陽血味，故呼名以制之。</p><p><strong>所出</strong>：《女青鬼律 · 卷4》 — https://zh.wikisource.org/wiki/女青鬼律/卷4</p></article></main></div></div>
