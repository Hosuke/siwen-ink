    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 問者抑然</nav></header><main><article><h1>問者抑然</h1><p>詰難者啞口無言，終悟立言者不以產業汙和。</p><p>問者聞潛居先生之言，「抑然，良久口張而不能嗑，首俯而不能仰」，終乃悟「立不朽之言者，不以產業汨和，追下帷之績者，不以窺園涓目」。抱樸子譏之曰：「子以臭雛之甘呼鴛鳳，擘蟹之計要猛虎，豈不陋乎！」</p><p><strong>所出</strong>：《抱朴子 · 卷35》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷35</p></article></main></div></div>
