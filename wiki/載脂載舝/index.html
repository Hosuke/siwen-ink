    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 載脂載舝</nav></header><main><article><h1>載脂載舝</h1><p>油脂其車，裝置其轄，整備行道也。</p><p>載脂載舝，還車言邁。脂，脂車輪也；舝，車軸之鍵，今作轄。言備車以行也。將還車而行，必先脂其軸、固其舝。此出宿飲餞之後，整駕將邁之象。</p><p><strong>所出</strong>：《詩經 · 泉水》 — https://zh.wikisource.org/wiki/詩經/泉水</p></article></main></div></div>
