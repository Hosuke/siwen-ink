    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 公孫弘</nav></header><main><article><h1>公孫弘</h1><p>竇太后崩後，上徵文學之士公孫弘等。</p><p>又見於[[太史公本表]]，為平津侯。以丞相詔所褒侯。元朔五年十一月乙丑，獻侯公孫弘元年。四年後，侯慶元年。六年，侯慶坐為山陽太守有罪，國除。</p><p>  <strong>所出</strong>：《史記 · 卷020》 — https://zh.wikisource.org/wiki/史記/卷020</p><hr><p>公孫弘斷髪而爲越王騎，公孫喜使人絶之，曰：「吾不與子爲昆弟矣。」公孫弘曰：「我斷髪，子斷頸而爲人用兵，我將謂子何？」周南之戰，公孫喜死焉。</p><p><strong>所出</strong>：《韓非子 · 說林下》 — https://zh.wikisource.org/wiki/韓非子/說林下</p></article></main></div></div>
