    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 形氣脈色</nav></header><main><article><h1>形氣脈色</h1><p>治病當察形氣色澤脈之盛衰新故，據形氣相得與相失，以決可治與難治。</p><p>凡治病，察其形氣色澤，脈之盛衰，病之新故，乃治之無後其時。</p><p>形氣相得，謂之可治；色澤以浮，謂之易已；脈從四時，謂之可治；脈弱以滑，是有胃氣，命曰易治，取之以時。</p><p>形氣相失，謂之難治；色夭不澤，謂之難已；脈實以堅，謂之益甚；脈逆四時，為不可治。必察四難而明告之。</p><p><strong>所出</strong>：《黃帝內經 · 素問第六卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第六卷</p></article></main></div></div>
