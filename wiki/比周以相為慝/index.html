    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 比周以相為慝</nav></header><main><article><h1>比周以相為慝</h1><p>比周相為慝，則忘主死黨以進其譽</p><p>姦臣之敗其主也，積漸積微，使主迷惑而不自知。上則相為候望，下則買譽於民，譽其黨而使主尊之，毀不譽者而使主廢之。羣臣皆忘主而趨私黨。
<strong>所出</strong>：《管子 · 第67篇明法解》 — https://zh.wikisource.org/wiki/管子/第67篇明法解</p></article></main></div></div>
