    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 市者貨之準</nav></header><main><article><h1>市者貨之準</h1><p>市集定物價，百事治則百用節。</p><p>市者，貨之準也。是故百貨賤則百利不得，百利不得則百事治，百事治則百用節矣。是故事者生於慮，成於務，失於傲。不慮則不生，不務則不成，不傲則不失。故曰：市者可以知治亂，可以知多寡，而不能爲多寡。爲之有道。</p><p><strong>所出</strong>：《管子 · 第05篇乘馬》 — https://zh.wikisource.org/wiki/管子/第05篇乘馬</p></article></main></div></div>
