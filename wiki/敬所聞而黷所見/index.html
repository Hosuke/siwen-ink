    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 敬所聞而黷所見</nav></header><main><article><h1>敬所聞而黷所見</h1><p>世俗貴古賤今，敬所聞而黷所見，同時之駿不如伯樂之所禦。</p><p>世俗率貴古昔而賤當今，敬所聞而黷所見。同時雖有[[追風絕景之駿]]，猶謂不及伯樂之所禦也；雖有[[和氏之璧|宵良兼城之璞]]，猶謂不及楚和之所泣也；雖有斷馬指雕之劍，猶謂不及[[歐冶子|歐冶之所鑄]]也；雖有生枯起朽之藥，猶謂不及[[和扁|和鵲之所合]]也；雖有冠群獨行之士，猶謂不及於古人也。此與[[世俗貴古賤今]]義相發明，並存可也。</p><p><strong>所出</strong>：《抱朴子 · 卷45》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷45</p></article></main></div></div>
