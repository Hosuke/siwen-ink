    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 循法度</nav></header><main><article><h1>循法度</h1><p>遵行禮法制度</p><p>循法度者，遵行禮法制度也。</p><p>《采蘋》毛詩序云：「大夫妻能循法度也。能循法度，則可以承先祖共祭祀矣。」蓋言大夫妻恪守昏禮之儀軌，依礼度以事舅姑、奉祭祀，乃為有德。</p><p>法度者，禮制之通稱。昏禮既定，男率女從，各循其分，不敢逾越。循之，則祭祀得以降神，子孫得以承嗣；悖之，則上下失序，祭祀廢弛。</p><p><strong>所出</strong>：《詩經 · 采蘋》 — https://zh.wikisource.org/wiki/詩經/采蘋</p></article></main></div></div>
