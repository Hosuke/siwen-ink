    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天籟</nav></header><main><article><h1>天籟</h1><p>萬竅怒呺，咸其自取，天道自然而然之聲。</p><p>子綦之分別三籟也：人籟者，比竹之所為也；地籟者，衆竅之所鳴也；至於天籟，則夫吹萬不同，而使其自己也，咸其自取，怒者其誰邪！</p><p>天籟之要，不在能吹之者，而在所吹之器自取其鳴。風之吹萬竅也，大小、長短、燥濕、剛柔，萬竅萬形，而風未嘗私焉。一受其成形，不亡以待盡，而虛空中自有其自然之分際。物各依其本然以鳴，不待主宰，是謂天籟。知此則知是非之辨，亦萬竅之鳴耳，無所待而自鳴者也。</p><p><strong>所出</strong>：《莊子 · 齊物論》 — https://zh.wikisource.org/wiki/莊子/齊物論</p></article></main></div></div>
