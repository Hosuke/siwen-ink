    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 同人于郊</nav></header><main><article><h1>同人于郊</h1><p>止於郊近，不及於野</p><p>「同人于郊」者，[[同人]]上九之爻辭也。</p><p>上九居卦之極，無位之賢，遠於九五之尊，無所應援。郊者，近於野而不及野，遠於門而不若門，猶有同人之心而無其時也。</p><p>象曰「同人于郊，志未得也」，言其志在同人，而時位不副，所遇既狹，未能達於天下，然亦無悔。[[易]]貴時中，此其時之不可强者與。</p><p><strong>所出</strong>：《周易 · 同人》 — https://zh.wikisource.org/wiki/周易/同人</p></article></main></div></div>
