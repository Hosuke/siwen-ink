    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 周文揲蓍</nav></header><main><article><h1>周文揲蓍</h1><p>周文王善用揲蓍占卜</p><p>周文王揲蓍以占象，孔子演易以窮神，扁鵲操針以治病，巫咸叩鼓以祈福，皆一時之聖智。然遇野葛、巴豆之毒，四者安能令蘇、復起馳走耶？此言邪毒之害甚於卜筮針砭，道術之妙在於防患未然，非區區卜祝所能救也。</p><p><strong>所出</strong>：《周易參同契 · 25章》 — https://zh.wikisource.org/wiki/周易參同契/25章</p></article></main></div></div>
