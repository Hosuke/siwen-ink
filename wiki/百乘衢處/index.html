    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 百乘衢處</nav></header><main><article><h1>百乘衢處</h1><p>四面受敵之小國，實無尺壤之用。</p><p>以百乘衢處，謂之託食之君。千乘衢處，壤削少半；萬乘衢處，壤削太半。是特名羅於為君耳，無壤之有。號有百乘之守，而實無尺壤之用，故謂託食之君。</p><p>然則大國內款，小國用盡，何以及此！曰：「百乘之國，官賦軌符。乘四時之朝夕，御之以輕重之准，然後百乘可及也。」</p><p><strong>所出</strong>：《管子 · 第73篇國蓄》 — https://zh.wikisource.org/wiki/管子/第73篇國蓄</p></article></main></div></div>
