    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 奪其食即已</nav></header><main><article><h1>奪其食即已</h1><p>食入於陰長氣於陽，奪食則陽明氣抑，狂疾自已。</p><p>陽厥之治，奪其食即已。夫食入於陰，長氣於陽，故奪其食即已。使其服生鐵洛為飲，生鐵洛者，下氣疾也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第十三卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十三卷</p></article></main></div></div>
