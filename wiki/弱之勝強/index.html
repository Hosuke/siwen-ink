    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 弱之勝強</nav></header><main><article><h1>弱之勝強</h1><p>柔弱之物能勝剛強，以柔克剛之理也。</p><p>天下莫柔弱於水，而攻堅強者莫之能勝。水性至柔，無形無狀，萬物莫之能禦，而攻剛克強，水獨擅其功。此柔弱之道，所以勝剛強之勢也。聖人法水之性，知弱之勝強、柔之勝剛，而天下莫不知莫能行。蓋世人多好剛強而惡柔弱，不知天道之運，每以柔弱為不足觀。是以聖人云「受國之垢，是謂社稷主；受國不祥，是為天下王」，正言若反，皆此理也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 七十八章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
