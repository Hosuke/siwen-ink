    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 行時異政</nav></header><main><article><h1>行時異政</h1><p>春夏秋冬當行其令，若行失序，則生災異。</p><p>春行冬政則雕，行秋政則霜，行夏政則欲。夏行春政則風，行秋政則水，行冬政則落。秋行春政則榮，行夏政則水，行冬政則耗。冬行春政則泄，行夏政則靁，行秋政則旱。</p><p><strong>所出</strong>：《管子 · 第40篇四時》 — https://zh.wikisource.org/wiki/管子/第40篇四時</p></article></main></div></div>
