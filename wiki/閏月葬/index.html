    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 閏月葬</nav></header><main><article><h1>閏月葬</h1><p>閏月行事不正，以其非正之月也。</p><p>齊景公薨，魯閔之。穀梁子書「閏月，葬齊景公」，而釋之曰：「不正其閏也。」蓋閏月者，本非正行之月，乃以補正歲之餘分而設。葬事重大，當用正時正月；閏月行之，則失其正矣。此與郊祀不時之義相通，皆明行事必順天時之正，不可摻以私意也。</p><p><strong>所出</strong>：《春秋穀梁傳 · 哀公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/哀公</p></article></main></div></div>
