    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 子産治鄭二十六年而死丁壯號哭老人兒啼</nav></header><main><article><h1>子産治鄭二十六年而死丁壯號哭老人兒啼</h1><p>子産死而民哀，號哭者丁壯，兒啼者老人</p><p>子産治鄭二十六年而死，丁壯號哭，老人兒啼，曰：「子産去我死乎！民將安歸？」言其德政感人，上下悲慟如此。</p><p><strong>所出</strong>：《史記 · 卷119》 — https://zh.wikisource.org/wiki/史記/卷119</p></article></main></div></div>
