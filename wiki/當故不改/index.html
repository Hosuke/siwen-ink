    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 當故不改</nav></header><main><article><h1>當故不改</h1><p>法者，因時而立，持之不改。</p><p>如四時之不貣，如星辰之不變，如宵如晝，如陰如陽，如日月之明，曰法。</p><p><strong>所出</strong>：《管子 · 第43篇正》 — https://zh.wikisource.org/wiki/管子/第43篇正</p></article></main></div></div>
