    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 盛服見孔子</nav></header><main><article><h1>盛服見孔子</h1><p>子路盛服見孔子，孔子以江流為喻，戒其衣服盛則天下孰肯諫。</p><p>子路盛服而見孔子，孔子曰：「由，是裾裾何也？昔者江出於㟭山，其始出也，其源可以濫觴，及其至江之津也，不放舟、不避風則不可涉也，非維下流水多邪？今女衣服既盛，顏色充盈，天下且孰肯諫女矣？」</p><p>衣服盛裝者，非獨蔽體，兼以自高。孔子以江流為喻：源流既微，猶可濫觴；及其盛大，則非方舟避風不可以涉。人之服飾既盛，顏色既充，則人不肯以直言相諫。此戒學者：矜飾愈甚，則聞過愈難。</p><p><strong>所出</strong>：《荀子 · 子道篇》 — https://zh.wikisource.org/wiki/荀子/子道篇</p></article></main></div></div>
