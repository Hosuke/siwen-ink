    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 博見約取</nav></header><main><article><h1>博見約取</h1><p>綜學在博，取事貴約；校練務精，捃理須覈</p><p>綜學在博，取事貴約，校練務精，捃理須覈，眾美輻輳，表裏發揮。</p><p>劉劭《趙都賦》用事如斯，可稱理得而義要矣。故事得其要，雖小成績，譬寸轄制輪，尺樞運關也。</p><p>若微言美事置於閒散，是綴金翠於足脛，靚粉黛於胸臆也。凡用舊合機，不啻自其口出；引事乖謬，雖千載而為瑕。</p><p><strong>所出</strong>：《文心雕龍 · 事類》 — https://zh.wikisource.org/wiki/文心雕龍/事類</p></article></main></div></div>
