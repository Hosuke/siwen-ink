    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 巧言亂德</nav></header><main><article><h1>巧言亂德</h1><p>謂花言巧語足以敗壞德行。</p><p>子曰：「巧言亂德，小不忍，則亂大謀。」</p><p>言工於辨說者，足以撓敗己德。又言：細小不能忍耐，便將擾亂大局。此聖人戒人之辭，欲人慎言忍事也。</p><p><strong>所出</strong>：《論語 · 衞靈公第十五》 — https://zh.wikisource.org/wiki/論語/衞靈公第十五</p></article></main></div></div>
