    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 如匪行邁謀</nav></header><main><article><h1>如匪行邁謀</h1><p>行道之人不與謀，而漫問之，非策之善者也。</p><p>如匪行邁謀，是用不得于道。匪，非也。言有人行於道塗，而不與熟悉路徑之人相商，反問諸邂逅之行者，則其計議奚由得當。詩人以此諷在位者，謀及卿士則群言雜沓，議論盈庭，莫適為主。發言者多，而肯任咎者鮮；務廣而無所歸，卒鮮成效。《小旻》刺王之謀猷回邪，不能斷之以義也。</p><p><strong>所出</strong>：《詩經 · 小旻》 — https://zh.wikisource.org/wiki/詩經/小旻</p></article></main></div></div>
