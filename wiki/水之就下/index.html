    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 水之就下</nav></header><main><article><h1>水之就下</h1><p>民歸仁政，如水之就下，不可遏禦</p><p>孟子告梁襄王，以禾苗為喻：七八月旱則苗槁，天油然作雲、沛然下雨，則苗浡然興之。其如是，孰能禦之？今夫天下之人牧，未有不嗜殺人者也。如有不嗜殺人者，則天下之民皆引領而望之矣。誠如是也，民歸之，由水之就下，沛然誰能禦之？言民心之向背，如水之趨下，不可阻遏。</p><p><strong>所出</strong>：《孟子 · 梁惠王上》 — https://zh.wikisource.org/wiki/孟子/梁惠王上</p></article></main></div></div>
