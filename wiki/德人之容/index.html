    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 德人之容</nav></header><main><article><h1>德人之容</h1><p>德人無思無慮，不藏是非，四海共利共給，財用有餘而不知其所從來。</p><p>苑風曰：「願聞德人。」</p><p>曰：「德人者，居无思，行无慮，不藏是非美惡；四海之內，共利之之爲悅，共給之之爲安；怊乎若嬰兒之失其母也，儻乎若行而失其道也；財用有餘而不知其所自來，飲食取足而不知其所從，此謂德人之容。」</p><p><strong>所出</strong>：《莊子 · 天地》 — https://zh.wikisource.org/wiki/莊子/天地</p></article></main></div></div>
