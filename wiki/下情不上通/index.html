    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 下情不上通</nav></header><main><article><h1>下情不上通</h1><p>下情不上通，謂之塞</p><p>姦臣乘而為姦者，擅主也。臣有擅主者，則主令不得行，而下情不上通。人臣之力，能隔君臣之間，而使美惡之情不揚聞，禍福之事不通徹，主迷惑而無從悟。此塞主之道也。
<strong>所出</strong>：《管子 · 第67篇明法解》 — https://zh.wikisource.org/wiki/管子/第67篇明法解</p></article></main></div></div>
