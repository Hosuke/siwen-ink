    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五言古詩</nav></header><main><article><h1>五言古詩</h1><p>古詩之五言體式，辭達意深，為五言之冠冕也。</p><p>古詩之五言，「佳麗」可觀。枚叔之作，傅毅之詞，「觀其結體散文，直而不野，婉轉附物，怊悵切情，實五言之冠冕也」。溯其淵源，「《召南·行露》始肇半章」，孺子滄浪、暇豫優歌、《邪徑》童謠，皆有其端倪，「閱時取證，則五言久矣」。又有張衡《怨篇》，「清典可味」；仙詩緩歌，「雅有新聲」。李陵、班婕妤之五言，「見疑於後代」，然亦見五言之流傳。</p><p><strong>所出</strong>：《文心雕龍 · 明詩》 — https://zh.wikisource.org/wiki/文心雕龍/明詩</p></article></main></div></div>
