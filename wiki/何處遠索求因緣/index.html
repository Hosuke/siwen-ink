    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 何處遠索求因緣</nav></header><main><article><h1>何處遠索求因緣</h1><p>因緣在己，無待遠索。</p><p>經言「真人在己」，則因緣亦在己身，又何必馳求遠索乎。世人不知自足，馳逐外境，如[[逐物之欲]]，終無所得。修真者貴反求諸己，不緣外境也。</p><p><strong>所出</strong>：《黃庭內景經 · 治生章第二十三》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/治生章第二十三</p></article></main></div></div>
