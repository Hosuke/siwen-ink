    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 晏子禁新樂</nav></header><main><article><h1>晏子禁新樂</h1><p>晏子以新樂淫君，主張拘虞而禁淫聲，以正邦政。</p><p>景公欲聽新樂，梁丘據入歌人虞以變齊音。晏子退朝，命宗祝修禮而拘虞。公怒問故，晏子曰：「以新樂淫君。」公曰：「酒醴之味，金石之聲，願夫子無與焉。夫樂，何必夫故哉？」晏子對曰：「夫樂亡而禮從之，禮亡而政從之，政亡而國從之。國衰，臣懼君之逆政之行。」又引紂作北裡、幽厲之聲以為戒。公遂從之。此晏子所以正[[淫樂廢政]]之弊也。</p><p><strong>所出</strong>：《晏子春秋 · 卷一》 — https://zh.wikisource.org/wiki/晏子春秋/卷一</p></article></main></div></div>
