    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 建中于民</nav></header><main><article><h1>建中于民</h1><p>立中道於天下，以正民心。</p><p>王者代天牧民，必有所以正之者，非威刑之所能強也。仲虺告湯，言「建中于民」，非遺外之空言，乃以義制事、以禮制心，表裏交正，而民之视听一歸於中也。中也者，不偏不倚，無過不及之名。民稟此中則正，王建此中則天下定矣。</p><p><strong>所出</strong>：《尚書 · 仲虺之誥》 — https://zh.wikisource.org/wiki/尚書/仲虺之誥
===終::</p></article></main></div></div>
