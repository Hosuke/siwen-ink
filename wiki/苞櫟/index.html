    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 苞櫟</nav></header><main><article><h1>苞櫟</h1><p>叢生之櫟，以興賢者在野。</p><p>山有苞櫟。</p><p>苞櫟，叢生之櫟也。苞，叢生之意；櫟，喬木名。</p><p>詩以山有此木，反興君子之在野而不得用。賢者如苞櫟之生於山，無所施於庭宇也。</p><p><strong>所出</strong>：《詩經 · 晨風》 — https://zh.wikisource.org/wiki/詩經/晨風</p></article></main></div></div>
