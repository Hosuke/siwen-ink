    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 損之又損以至於無為</nav></header><main><article><h1>損之又損以至於無為</h1><p>損而至極，歸於無為，此為道之極功也。</p><p>損之又損者，非徒去其有也，去之至於無可去，則無為矣。無為，非無所作為也，乃不為妄為、不為有為。及乎損無可損，浑然太虛，萬化自遂，此之謂以至於無為也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 四十八章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p><hr><p>損情欲也。又損之，所以漸去。當恬淡如嬰兒，無所造為，期於[[無為而無不為]]之境。</p><p><strong>所出</strong>：《老子河上公章句 · 忘知》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
