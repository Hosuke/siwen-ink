    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 至安之世</nav></header><main><article><h1>至安之世</h1><p>至治之世，法令清明，萬民不犯於寇戎，社會安定無爭。</p><p>至安之世，法如朝露，純樸不散，心無結怨，口無煩言。車馬不疲弊於遠路，旌旗不亂於大澤，萬民不失命於寇戎，雄駿不創壽於旗幢，豪傑不著名於圖書，不錄功於盤盂，記年之牘空虛。利莫長於簡，福莫久於安。</p><p><strong>所出</strong>：《韓非子 · 大體》 — https://zh.wikisource.org/wiki/韓非子/大體</p></article></main></div></div>
