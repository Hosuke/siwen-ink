    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 刺傷五臟</nav></header><main><article><h1>刺傷五臟</h1><p>誤刺五臟各有死期，徵候依臟而異。</p><p>刺五臟者，其死有期：中心一日死，其動為噫；中肝五日死，其動為語；中肺三日死，其動為咳；中腎六日死，其動為嚏欠；中脾十日死，其動為吞。刺傷人五臟必死，其動則依其臟之所變候，知其死也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第十八卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十八卷</p></article></main></div></div>
