    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 皐華泉混混</nav></header><main><article><h1>皐華泉混混</h1><p>富人馮氣自矜，不知取與之道，反以有餘為樂而招害。</p><p>富人耳營鐘鼓莞籥之聲，口嗛於芻豢醪醴之味，以感其意，遺忘其業，可謂亂矣；侅溺於馮氣，若負重行而上阪，可謂苦矣，貪財而取慰，貪權而取竭，靜居則溺，體澤則馮，可謂疾矣。</p><p>膏溺於馮氣，言富人驕泰自矜，若沈溺於膏脂、馮恃客氣之中，不知節制也。</p><p><strong>所出</strong>：《莊子 · 盜跖》 — https://zh.wikisource.org/wiki/莊子/盜跖</p></article></main></div></div>
