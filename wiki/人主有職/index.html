    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 人主有職</nav></header><main><article><h1>人主有職</h1><p>君有其職，不可躬親百事。</p><p>人主者，以官人為能者也；匹夫者，以自能為能者也。治國有道，人主有職。貫日而治詳，一日而曲列之，是所使夫百吏官人為也，不足以是傷游玩安燕之樂。若夫論一相以兼率之，使臣下百吏莫不宿道鄉方而務，是夫人主之職也。</p><p><strong>所出</strong>：《荀子 · 王霸篇》 — https://zh.wikisource.org/wiki/荀子/王霸篇</p></article></main></div></div>
