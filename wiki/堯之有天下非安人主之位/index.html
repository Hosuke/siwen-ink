    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 堯之有天下非安人主之位</nav></header><main><article><h1>堯之有天下非安人主之位</h1><p>聖主不以天下奉己，而以百姓力征為患，故躬行節儉以和輯萬民。</p><p>堯之有天下也，非貪萬民之富而安人主之位也，以為百姓力征，強淩弱，眾暴寡，於是堯乃身服節儉之行，而明相愛之仁，以和輯之。是故茅茨不翦，采椽不斷，大路不畫，越席不緣，大羹不和，粢食不毀。巡狩行教，勤勞天下，周流五嶽。豈其奉養不足樂哉！舉天下而以為社稷，非有利焉。</p><p><strong>所出</strong>：《淮南子 · 主術訓》 — https://zh.wikisource.org/wiki/淮南子/主術訓</p></article></main></div></div>
