    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 博文能一</nav></header><main><article><h1>博文能一</h1><p>為文之道，在博覽廣積以濟胸臆，又能貫通歸一以成機軸。</p><p>劉勰以「博見為饋貧之糧，貫一為拯亂之藥」對舉而言。博見者，多聞廣識，如資糧之於饑者；貫一者，總攝歸宗，如良藥之於亂疾。二者相濟而不可偏廢，故云「博而能一，亦助乎心力」。蓋徒博而無統攝，則散漫而無所歸；徒一而無根柢，則空疏而不能運。唯博文以蓄其材，能一以定其的，方為得之。</p><p><strong>所出</strong>：《文心雕龍 · 神思》 — https://zh.wikisource.org/wiki/文心雕龍/神思</p></article></main></div></div>
