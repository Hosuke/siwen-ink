    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 馬為人用鹿不為人用</nav></header><main><article><h1>馬為人用鹿不為人用</h1><p>能為人用者貴，不能用人者賤。</p><p>[[如耳]]說[[衛嗣公]]，[[衛嗣公]]說而太息。左右曰：「公何為不相也？」公曰：「夫馬似鹿者而題之千金，然而有千金之馬而無一金之鹿者，馬為人用而鹿不為人用也。今如耳，萬乘之相也，外有大國之意，其心不在衛，雖辨智，亦不為寡人用，吾是以不相也。」</p><p><strong>所出</strong>：《韓非子 · 外儲說右上》 — https://zh.wikisource.org/wiki/韓非子/外儲說右上</p></article></main></div></div>
