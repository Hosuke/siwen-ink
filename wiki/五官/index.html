    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五官</nav></header><main><article><h1>五官</h1><p>東方田、南方司馬、西方理、北方司空、中央都，各有所司。</p><p>管子設五官之技以輔治：詩者，所以記物也；時者，所以記歲也；春秋者，所以記成敗也；行者，道民之利害也；易者，所以守凶吉成敗也；卜者，卜凶吉利害也。民之能此者，皆一馬之田，一金之衣。謹聽其言而藏之官，使師旅之事無所與，此國筴之要也。六家即見其時，使豫先蚤間之日受之，則君無失時，無失筴，萬物興豐無失利。</p><p><strong>所出</strong>：《管子 · 第75篇山權數》 — https://zh.wikisource.org/wiki/管子/第75篇山權數</p></article></main></div></div>
