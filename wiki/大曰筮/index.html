    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大曰筮</nav></header><main><article><h1>大曰筮</h1><p>道之廣大，周流無滯，往而復返。</p><p>老子言大之德曰：「大曰筮，筮曰遠，遠曰反。」筮者，流布無極之謂；遠者，彌綸六合之謂；反者，終歸其根之謂。言道充滿宇宙，往無不之，終不出戶知天下，蓋周行不殆之義，亦[[大曰逝逝曰遠遠曰反]]之意。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第六十九章 昆成》 — https://zh.wikisource.org/wiki/老子_(帛書校勘版)</p></article></main></div></div>
