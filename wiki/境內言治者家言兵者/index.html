    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 境內言治者家言兵者</nav></header><main><article><h1>境內言治者家言兵者</h1><p>境内皆言治而愈貧，皆言兵而愈弱；空言無益於國，必用其力而禁其浮說。</p><p>今境内之民皆言治，藏商、管之法者家有之，而國愈貧，言耕者衆，執耒者寡也；境内皆言兵，藏孫、吳之書者家有之，而兵愈弱，言戰者多，被甲者少也。故明主用其力，不聽其言；賞其功，必禁無用。故民盡死力以從其上。</p><p><strong>所出</strong>：《韓非子 · 五蠹》 — https://zh.wikisource.org/wiki/韓非子/五蠹</p></article></main></div></div>
