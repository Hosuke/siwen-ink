    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 醴禮</nav></header><main><article><h1>醴禮</h1><p>冠禮成後，主人設醴饗賔，以甘醴嘉薦定冠者之祥。</p><p>醴禮者，士冠禮之終儀也。三加既畢，賛者洗於房中，側酌醴，加柶覆之。賔揖冠者就筵，授醴於戶東。冠者筵西拜受觶，賔東面答拜。乃祭脯醢，祭醴三，啐醴，奠觶而降。既奠脯於東壁以見母，乃北面拜母。冠者遂出見兄弟、姑姊，入見鄉大夫、鄉先生。主人乃以壹獻之禮醴賔，酬以束帛、儷皮。[[醴辭]]曰：「甘醴惟厚，嘉薦令芳。拜受祭之，以定爾祥。承天之休，壽考不忘。」此禮以醴不用酒，辭亦尚質，故與[[醮禮]]異也。</p><p><strong>所出</strong>：《儀禮 · 士冠禮》 — https://zh.wikisource.org/wiki/儀禮/士冠禮</p></article></main></div></div>
