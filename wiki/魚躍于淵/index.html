    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 魚躍于淵</nav></header><main><article><h1>魚躍于淵</h1><p>魚遊深淵，各遂其性，以興君子化下，民用自遂。</p><p>鳶飛戾天，魚躍于淵。鳶摶扶搖而上，魚潛深淵而躍，上下之物各遂其性。詩以天淵之廣興人材之盛，喻君子在上，不施干預而民自化成。《禮記》有云「魚水之歡」，此則以魚之自躍況民之自化，聖人之治，若無為而功自成也。亦與[[鳶飛戾天]]相表裏，[[翰飛戾天]]亦見此義。</p><p><strong>所出</strong>：《詩經 · 旱麓》 — https://zh.wikisource.org/wiki/詩經/旱麓</p></article></main></div></div>
