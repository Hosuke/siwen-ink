    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 初筮告再三瀆</nav></header><main><article><h1>初筮告再三瀆</h1><p>初次卜問則告之，反覆數瀆則不告。</p><p>初筮告，再三瀆，瀆則不告。</p><p>蒙之時，童蒙有疑而問於師。初次卜問，是其心志未定，猶有敬信，故告之。若再三而問，是慢天褻聖，不敬之甚也，如此而猶告之，是益其瀆慢之心，故不告也。言所以戒學者之不敬也。</p><p><strong>所出</strong>：《周易 · 蒙》 — https://zh.wikisource.org/wiki/周易/蒙</p></article></main></div></div>
