    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 程公端</nav></header><main><article><h1>程公端</h1><p>嗣法道士，咸淳壬申刊刻大洞真經於茅山。</p><p>嗣法程公端，咸淳壬申上元日，焚香敬書《上清大洞真經後序》。先是玉海沖妙宗師來游九華，因訪道室，語及大洞經傳授事，懼將泯絕，欲廣其傳。公端蒙師指教，感恩莫酬，敬命厥工，用鋟諸梓，以承其志。咸淳八年，即宋度宗八年，距宋亡僅十餘年耳。</p><p><strong>所出</strong>：《上清大洞真經 · 結尾》 — https://zh.wikisource/wiki/上清大洞真經/結尾</p></article></main></div></div>
