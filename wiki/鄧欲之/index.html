    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鄧欲之</nav></header><main><article><h1>鄧欲之</h1><p>隱南嶽洞臺，誦大洞經，魏夫人降告，青烏既來，遂解化。</p><p>鄧欲之字彥達，隱於南嶽洞臺。夜誦大洞經，上感魏夫人降告之曰：「君有仙分，特來相訪。」</p><p>一日忽見三青烏如鶴，鼓舞飛嗚，移時方去。欲之謂弟子曰：「青烏既來，期會至矣。」遂解化。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 33》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/33</p></article></main></div></div>
