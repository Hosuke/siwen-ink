    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天鬼之罰</nav></header><main><article><h1>天鬼之罰</h1><p>本文援引《仲虺之告》《太誓》等古籍，阐明天鬼赏罚基于人的道德行为，是对善恶的因果报应，而非盲目的</p><p>《墨子·非命下》又引《仲虺之告》以明天鬼賞罰之義。仲虺戒湯曰：「我聞有夏人矯天命于下，帝式是增，用爽厥師。」墨子注云：「彼用無為有，故謂之神。若有而謂有，夫豈謂神哉？」此言桀以虛無為有，妄稱天命以誑民，故帝將加之以咎。</p><p>  又引《太誓》之言云：「上帝不常，九有以亡；上帝不順，祝降其喪。」此明上天之賞罰，非盲目之命運，乃鑒察人行為之報應。墨子以為，此皆天鬼賞賢罰暴之明證，非命定之說所能否認者。</p></article></main></div></div>
