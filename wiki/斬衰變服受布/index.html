    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 斬衰變服受布</nav></header><main><article><h1>斬衰變服受布</h1><p>斬衰變服，受布之節，男子除首帶、婦女除帶之異。</p><p>斬衰三升，既虞卒哭，受以成布六升，冠七升。為母疏衰四升，受以成布七升冠八升。去麻服葛，葛帶三重。期而小祥，練冠縓緣，要絰不除。男子除乎首，婦女除乎帶。男子重首，婦女重帶。除服者先重者，易服者易輕者。又期而大祥，素縞麻衣。中月而禫，禫而纖，無所不佩。</p><p><strong>所出</strong>：《禮記 · 間傳》 — https://zh.wikisource.org/wiki/禮記/間傳</p></article></main></div></div>
