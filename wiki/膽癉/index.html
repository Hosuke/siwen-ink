    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 膽癉</nav></header><main><article><h1>膽癉</h1><p>數謀不決，膽虛氣溢，口苦之病。</p><p>膽癉之病，口苦為候。肝者中之將，取決於膽，咽為之使。此人者數謀慮不決，故膽虛氣上溢，而口為之苦。治之以膽募俞，治在陰陽十二官相使中。</p><p><strong>所出</strong>：《黃帝內經 · 素問第十三卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十三卷</p></article></main></div></div>
