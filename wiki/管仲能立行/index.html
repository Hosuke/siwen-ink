    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 管仲能立行</nav></header><main><article><h1>管仲能立行</h1><p>管仲以厚於味者薄於德諫桓公，力行以正桓公。</p><p>管仲觴桓公。日暮矣，桓公樂之而徵燭。管仲曰：「臣卜其晝，未卜其夜。君可以出矣。」公不說，曰：「仲父年老矣，寡人與仲父為樂將幾之？請夜之。」管仲曰：「君過矣。夫厚於味者薄於德，沈於樂者反於憂；壯而怠則失時，老而解則無名。臣乃今將為君勉之，若何其沈於酒也？」管仲可謂能立行矣。凡行之墮也於樂，今樂而益飭；行之壞也於貴，今主欲留而不許。伸志行理，貴樂弗為變，以事其主，此桓公之所以霸也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十</p></article></main></div></div>
