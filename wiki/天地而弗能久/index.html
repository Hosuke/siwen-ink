    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天地而弗能久</nav></header><main><article><h1>天地而弗能久</h1><p>暴風驟雨，天地亦不能久，況於人乎。</p><p>孰為此？天地而弗能久，又況於人乎？</p><p>風雨之作，天地為之，然亦不能持久。人之從事，豈可違其自然之理而強之哉？天地且然，況於人乎。言多言者之不可以有為也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第六十八章 同道》 — https://zh.wikisource.org/wiki/老子_(帛書校勘版)</p></article></main></div></div>
