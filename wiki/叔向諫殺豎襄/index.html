    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 叔向諫殺豎襄</nav></header><main><article><h1>叔向諫殺豎襄</h1><p>逆言激君，反令赦之。</p><p>又有叔向者，論三姦同罪之事。士景伯如楚，叔魚為贊理。邢侯與雍子爭田，雍子納其女於叔魚以求直。及斷獄之日，叔魚抑邢侯，邢侯殺叔魚與雍子於朝。韓宣子患之，叔向曰：「三姦同罪，請殺其生者而戮其死者。」宣子曰：「若何？」對曰：「鮒也鬻獄，雍子賈之以其子，邢侯非其官也而干之。夫以回鬻國之中，與絕親以買直，與非司寇而擅殺，其罪一也。」邢侯聞之，逃。遂施邢侯氏，而尸叔魚與雍子於市。</p><p>  <strong>所出</strong>：《國語 · 卷15》 — https://zh.wikisource.org/wiki/國語/卷15</p></article></main></div></div>
