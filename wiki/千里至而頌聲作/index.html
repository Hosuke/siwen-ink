    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 千里至而頌聲作</nav></header><main><article><h1>千里至而頌聲作</h1><p>賢臣得遇聖君，方建功業、播聲歌。</p><p>抱樸子以千里馬喻賢臣，以造父喻聖君。馬之良也，必待善御者而後馳千里；臣之賢也，必遇聖明之主而後序百揆。千里馬一日千里，造父禦之則馳騁無礙；禹稷之賢，遭唐虞之主而功成。是故聖主治世，則賢才效用，揖讓之風興，頌美之聲作。君臣相得，如魚得水，治道隆而教化成矣。</p><p><strong>所出</strong>：《抱朴子 · 卷09》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷09</p></article></main></div></div>
