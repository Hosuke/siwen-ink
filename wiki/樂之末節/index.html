    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 樂之末節</nav></header><main><article><h1>樂之末節</h1><p>樂之末節在黃鐘干戚，禮之末節在布筵陳俎；德成而上，藝成而下。</p><p>樂者，非謂黃鐘大呂弦歌干揚也，樂之末節也，故童者舞之；布筵席，陳樽俎，列籩豆，以升降為禮者，禮之末節也，故有司掌之。樂師辯乎聲詩，故北面而弦；宗祝辯乎宗廟之禮，故後尸；商祝辯乎喪禮，故後主人。是故德成而上，藝成而下；行成而先，事成而後。是故先王有上有下，有先有後，然後可以有制於天下也。</p><p><strong>所出</strong>：《史記 · 卷024》 — https://zh.wikisource.org/wiki/史記/卷024</p></article></main></div></div>
