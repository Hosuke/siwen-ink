    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 刑德易節</nav></header><main><article><h1>刑德易節</h1><p>刑德失序則賊氣至，國多菑殃。</p><p>春凋、秋榮、冬雷、夏有霜雪，此皆氣之賊也。刑德易節，失次則賊氣遬至，賊氣遬至則國多菑殃。</p><p><strong>所出</strong>：《管子 · 第40篇四時》 — https://zh.wikisource.org/wiki/管子/第40篇四時</p></article></main></div></div>
