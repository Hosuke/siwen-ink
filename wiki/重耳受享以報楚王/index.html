    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 重耳受享以報楚王</nav></header><main><article><h1>重耳受享以報楚王</h1><p>楚成王享重耳九獻，重耳許以避舍三舍。</p><p>楚成王以周禮享重耳，九獻，庭實旅百。子犯曰：「天命也，君其饗之。」既饗，楚子問何以報我。公子對曰：「子女玉帛，則君有之。若以君之靈得復晉國，晉、楚治兵，會于中原，其避君三舍。若不獲命，其左執鞭弭，右屬櫜鞬，以與君周旋。」</p><p><strong>所出</strong>：《國語 · 卷10》 — https://zh.wikisource.org/wiki/國語/卷10</p></article></main></div></div>
