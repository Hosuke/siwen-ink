    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 中和行無為</nav></header><main><article><h1>中和行無為</h1><p>聖人處中正之德行無為之治</p><p>[[中和行無為]]者，聖人之德治也。河上公以為：去甚、去奢、去泰，則可以處中和；處中和，則可以行無為；行無為，則天下自化。此自然之序也。中者，正也；和者，諧也。正諧則無為，無為則天下化成。</p><p><strong>所出</strong>：《老子河上公章句 · 無為》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
