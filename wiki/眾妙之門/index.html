    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 眾妙之門</nav></header><main><article><h1>眾妙之門</h1><p>玄乃眾妙所從出之門。</p><p>玄之又玄，眾妙之門。</p><p>[[玄之又玄]]，言道之幽深也。深而至於不可測，則萬物之妙皆自此出，是之謂眾妙之門。門者，妙之所由以出也；妙者，道之發見於萬物者也。玄者，萬妙之本；妙者，萬物之顯；門者，介乎玄妙之間以通之者也。體玄而入，則萬妙森然，觸處皆道；昧玄而出，則妙在眼前而莫之能窺。是故修道之要，在乎知乎玄之深而得其門；得其門，則萬妙自我出，而道在是矣。</p><p><strong>所出</strong>：《道德經 (王弼本) · 一章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
