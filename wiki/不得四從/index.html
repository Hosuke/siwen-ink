    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不得四從</nav></header><main><article><h1>不得四從</h1><p>明君禁臣下四從之儀，載兵革者罪死不赦，以備不虞。</p><p>是故不得四從，不載奇兵；非傳非遽，載奇兵革，罪死不赦。此明君之所以備不虞者也。</p><p><strong>所出</strong>：《韓非子 · 愛臣》 — https://zh.wikisource.org/wiki/韓非子/愛臣</p></article></main></div></div>
