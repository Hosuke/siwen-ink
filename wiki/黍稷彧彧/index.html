    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 黍稷彧彧</nav></header><main><article><h1>黍稷彧彧</h1><p>黍稷盛美，以供酒食，獻尸享祖</p><p>黍稷彧彧，曾孫之穡，以為酒食。</p><p>彧彧，文章美貌也。黍稷[[彧彧]]，言其長育蕃盛，有可收取之象。曾孫之穡，斂之以為酒食，所以奉祭祀、養賓客也。歲功既成，先事神而後及人，此王者之所以為治本焉。</p><p><strong>所出</strong>：《詩經 · 信南山》 — https://zh.wikisource.org/wiki/詩經/信南山</p></article></main></div></div>
