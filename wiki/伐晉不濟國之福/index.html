    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 伐晉不濟國之福</nav></header><main><article><h1>伐晉不濟國之福</h1><p>晏子言伐晉若不濟乃國之福，以其不德而有功，憂必及君。</p><p>晏子言：「不可。君得合而欲多，養欲而意驕。得合而欲多者危，養欲而意驕者困。今君任勇力之士，以伐明主，若不濟，國之福也。不德而有功，憂必及君。」</p><p><strong>所出</strong>：《晏子春秋 · 卷三》 — https://zh.wikisource.org/wiki/晏子春秋/卷三</p></article></main></div></div>
