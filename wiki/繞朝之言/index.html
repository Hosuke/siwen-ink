    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 繞朝之言</nav></header><main><article><h1>繞朝之言</h1><p>繞朝之言當矣，見尊於晉而見戮於秦，智同而遇殊。</p><p>故繞朝之言當矣，其為聖人於晉，而為戮於秦也，此不可不察。</p><p><strong>所出</strong>：《韓非子 · 說難》 — https://zh.wikisource.org/wiki/韓非子/說難</p></article></main></div></div>
