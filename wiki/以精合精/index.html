    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以精合精</nav></header><main><article><h1>以精合精</h1><p>以我之精合天地萬物之精，譬如萬水可合為一水。</p><p>惟以我之精合天地萬物之精，譬如萬水可合為一水；以我之神合天地萬物之神，譬如萬火可合為一火；以我之魄合天地萬物之魄，譬如金之為物可合異金而鎔之為一金；以我之魂合天地萬物之魂，譬如木之為物可接異木而生之為一木。</p><p>則天地萬物皆吾精吾神吾魄吾魂，何者死，何者生？</p><p>既能渾天地萬物以為魂，斯能渾天地萬物以為魄。凡造化所妙皆吾魂，凡造化所有皆吾魄，則無有一物可役我者。</p><p><strong>所出</strong>：《關尹子 · 4》 — https://zh.wikisource.org/wiki/關尹子/4</p></article></main></div></div>
