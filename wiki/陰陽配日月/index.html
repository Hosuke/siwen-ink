    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 陰陽配日月</nav></header><main><article><h1>陰陽配日月</h1><p>陰陽配乎日月，水火為之效徵，明感應之理在天人無二。</p><p>陰陽配日月者，天之日月，即人之水火也。日為陽之精，月為陰之精；水為陰之凝，火為陽之發。水火為效徵者，天之日月有光熱清寒之徵，人之水火亦有升降浮沉之效。陽燧之火取於日，方諸之水得於月，修真者法象天地，以身中之水火，配陰陽之日月，感應相通，而丹道成焉。此以天道驗之人道，天人一理，感化之機在是。</p><p><strong>所出</strong>：《周易參同契 · 21章》 — https://zh.wikisource.org/wiki/周易參同契/21章</p></article></main></div></div>
