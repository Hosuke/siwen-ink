    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 自視者不彰</nav></header><main><article><h1>自視者不彰</h1><p>自見者不能章明，以其在道為餘食贅行也。</p><p>（24）</p><p>[[自視不章]]之異文也。帛書作「自視者不彰」。</p><p>炊者不立、自視者不彰、自見者不明、自伐者无功、自矜者不長——[[亓在道也]]，[[餘食赘行]]，[[物或惡之]]。</p><p>自視者，以己視己，而非以道觀物也。斯人也，其視不明，其德不彰，以其病在道中，[[有欲者弗居]]焉。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第六十六章 弗居》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
