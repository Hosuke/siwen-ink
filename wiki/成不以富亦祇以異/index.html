    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 成不以富亦祇以異</nav></header><main><article><h1>成不以富亦祇以異</h1><p>詩人言夫之變心，非因利也，特以情異耳。</p><p>言爾之所以成其事，不以富也，亦祇以異耳。詩人深惜之，以為夫之別求新特，非為利也，乃情志之異也。[[成不以富亦祇以異]]，言外別無可怨之因，唯心之變異為可歎也。</p><p><strong>所出</strong>：《詩經 · 我行其野》 — https://zh.wikisource.org/wiki/詩經/我行其野</p></article></main></div></div>
