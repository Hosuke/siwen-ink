    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 澡身而浴德</nav></header><main><article><h1>澡身而浴德</h1><p>儒者以清水沐浴身體，以道義沐浴心德，滌除尘垢，以待清明。</p><p>儒有澡身而浴德，陳言而伏，靜而正之；上弗知也，麤而翹之，又不急為也。不臨深而為高，不加少而為多。世治不輕，世亂不沮。同弗與，異弗非也。其特立獨行有如此者。</p><p>澡身者，潔其外也；浴德者，滌其内也。内外兼修，方為完人。陳言而伏，靜而正之，言不輕發，發必有中也。上弗知則翹之，見義必陳，然不急迫以待時。治世不輕自菲薄，亂世不沮喪灰心。同者不濫與，異者不妄非，此皆澡身浴德之驗也。</p><p><strong>所出</strong>：《禮記 · 儒行》 — https://zh.wikisource.org/wiki/禮記/儒行</p></article></main></div></div>
