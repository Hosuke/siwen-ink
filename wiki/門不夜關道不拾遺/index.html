    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 門不夜關道不拾遺</nav></header><main><article><h1>門不夜關道不拾遺</h1><p>子産治鄭二年，市不豫賈；三年，門不夜關，道不拾遺</p><p>子産相鄭，一年而民化，二年而市不豫賈，三年而門不夜關，道不拾遺。言治化大行，盜賊不作，夜不閉戶，路不拾金。此循吏之效也。</p><p><strong>所出</strong>：《史記 · 卷119》 — https://zh.wikisource.org/wiki/史記/卷119</p></article></main></div></div>
