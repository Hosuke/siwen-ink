    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 國无人</nav></header><main><article><h1>國无人</h1><p>臣不尊君，但務相益；官不任國，但持祿養交。</p><p>十至私人之門，不一至於庭，百慮其家，不一圖國，屬數雖衆，非以尊君也；百官雖具，非以任國也。此之謂國无人。國无人者，非朝臣之衰也，家與家務於相益，不務尊君也。大臣務相貴而不任國，小臣持祿養交、不以官為事，故官失其能。</p><p><strong>所出</strong>：《管子 · 第46篇明法》 — https://zh.wikisource.org/wiki/管子/第46篇明法</p></article></main></div></div>
