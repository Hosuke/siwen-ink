    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 小司寇</nav></header><main><article><h1>小司寇</h1><p>佐大司寇，外朝詢萬民以斷獄</p><p>小司寇，中大夫二人，佐大司寇掌外朝之政。致萬民而詢焉：一曰詢國危，二曰詢國遷，三曰詢立君。以五刑聽萬民之獄讼，以五聲求民情，以八辟麗邦法，以三刺斷庶民獄讼之中。歲終令群士計獄弊讼，登中于天府。孟冬祀司民，獻民數於王。</p><p><strong>所出</strong>：《周禮 · 秋官司寇》 — https://zh.wikisource.org/wiki/周禮/秋官司寇</p></article></main></div></div>
