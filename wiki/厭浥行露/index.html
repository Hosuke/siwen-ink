    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 厭浥行露</nav></header><main><article><h1>厭浥行露</h1><p>以道塗露水濡濕為喻，言涉世之難，君子慎行之義。</p><p>「厭浥行露」，《詩經·行露》首章之首句也。[[厭浥]]，潮濕之意，[[行露]]，道途之露水也。以露之濡濕而喻世途之艱，人所當慎。</p><p>[[豈不夙夜]]者，言非不欲早行也；[[謂行多露]]者，言懼夫露之濡身爾。此與[[如履薄冰]]之義相近，皆言君子涉世當謹慎也。</p><p>後世釋此句者，或以為涉世之喻，或以為守身之戒。要之，皆見君子信道之堅，不以艱險而渝其志。</p><p><strong>所出</strong>：《詩經 · 行露》 — https://zh.wikisource.org/wiki/詩經/行露</p></article></main></div></div>
