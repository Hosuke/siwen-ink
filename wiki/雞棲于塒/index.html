    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 雞棲于塒</nav></header><main><article><h1>雞棲于塒</h1><p>暮雞返塒，以興行人不及歸。</p><p>「雞棲于塒，日之夕矣。」雞之棲塒，日之夕，蓋物之有常節者也。君子行役無期，反不如物之得其所止。是以大夫見暮景而動離懷，傷君子役久不返也。</p><p><strong>所出</strong>：《詩經 · 君子于役》 — https://zh.wikisource.org/wiki/詩經/君子于役</p></article></main></div></div>
