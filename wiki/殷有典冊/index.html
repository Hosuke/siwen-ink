    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 殷有典冊</nav></header><main><article><h1>殷有典冊</h1><p>殷有冊書記載夏革之事，周因之以興，後王當以殷史為鑒。</p><p>周公引殷先人有冊有典之實，以詰殷士之疑。言殷之先人嘗有冊書，詳記夏革命之事，殷人知之而未嘗以是自警，遂至於亡。今殷士以夏迪簡在王庭為言，周公則曰：湯之世亦嘗簡夏臣于王朝，終不能延夏之命，殷之先人亦能如此，然而殷代夏者非以其能用夏之臣，乃天之革夏命于殷也。冊典之設非徒記事，其義在使後人有所戒，殷士既已知之而又不能用之，是其所以取咎也。</p><p><strong>所出</strong>：《尚書 · 多士》 — https://zh.wikisource.org/wiki/尚書/多士</p></article></main></div></div>
