    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 昌容</nav></header><main><article><h1>昌容</h1><p>商王女，修道常山，顏如二十許。</p><p>昌容者，商王之女也，修道於常山，食蓬蔂根二百余年，顏如二十許。能致紫草，賣與染家，得之者色加倍好，得錢以救貧病者。往來城市，世世見之，遠近之人奉事者千余家，竟不知其所修之道。常行日中，不見其影。或雲昌容能煉其形者也，忽乃沖天而去。</p><p><strong>所出</strong>：《墉城集仙錄 · 卷06》 — https://zh.wikisource.org/wiki/墉城集仙錄/卷06</p></article></main></div></div>
