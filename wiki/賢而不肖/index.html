    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 賢而不肖</nav></header><main><article><h1>賢而不肖</h1><p>賢者詘於不肖者，權輕位卑故也；不肖服於賢者，權重位尊故也。</p><p>慎子以為，賢人而詘於不肖，非賢者之過，乃權輕位卑所致；不肖而能服於賢者，亦非不肖者之賢，乃權重位尊之故。堯匹夫不能治三人，桀天子能亂天下，正以其位殊耳。故[[勢位之足恃]]，非賢智之不足慕也。</p><p><strong>所出</strong>：《韓非子 · 難勢》 — https://zh.wikisource.org/wiki/韓非子/難勢</p></article></main></div></div>
