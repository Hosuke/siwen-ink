    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不顯不承</nav></header><main><article><h1>不顯不承</h1><p>文王之德光顯昭融，萬民承奉無厭也。</p><p>「不顯不承，無射於人斯」，[[詩經]]之句也。不顯，豈不顯乎？言文王之德光顯昭融，萬民承奉之，終古無厭射也。[[清廟]]末章以此作結，見文王之德感人至深，萬世之下猶受其福也。</p><p><strong>所出</strong>：《詩經 · 清廟》 — https://zh.wikisource.org/wiki/詩經/清廟</p></article></main></div></div>
