    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 熱氣腹痛</nav></header><main><article><h1>熱氣腹痛</h1><p>言熱氣留於小腸，腸中痛、堅乾閉不通之證。</p><p>歧伯論痛而閉不通之因：「熱氣留於小腸，腸中痛，癉熱焦渴，則堅乾不得出，故痛而閉不通矣。」與寒痛相對，示人腹痛有寒熱虛實之別。</p><p><strong>所出</strong>：《黃帝內經 · 素問第十一卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十一卷</p></article></main></div></div>
