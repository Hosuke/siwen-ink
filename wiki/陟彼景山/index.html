    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 陟彼景山</nav></header><main><article><h1>陟彼景山</h1><p>登山伐木，以建寢廟。</p><p>陟彼景山，松柏丸丸。是斷是遷，方斵是虔。松桷有梴，旅楹有閑，寢成孔安。</p><p>景山，大山也；丸丸，端直也；虔，敬也；梴，木長也。言登景山而伐松柏，端直者斷之，遷而至於工匠之所，敬以斫削；松材之桷長而可用，楹柱排列整齊，寢廟既成，先祖之神安然而享。</p><p>[[殷武]]末章詳述修建寢廟之事，取松柏之材，斫而虔恭，終成廟堂。先祖安則子孫寧，此[[壽考且寧]]之義所由來也。</p><p><strong>所出</strong>：《詩經 · 殷武》 — https://zh.wikisource.org/wiki/詩經/殷武</p></article></main></div></div>
