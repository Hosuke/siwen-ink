    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 太一含真氣</nav></header><main><article><h1>太一含真氣</h1><p>十月溫養，三家相見，胎嬰成象，乃太一含真氣之功。</p><p>[[悟真篇]]云：「三五一都三箇字，古今明者實然稀。東三南二同成五，北一西方四共之。戊己自歸生數五，三家相見結嬰兒。是知太一含真炁，十月胎圓入聖基。」三家者，金木水也；太一含真炁者，[[聖胎]]凝成之象，必溫養十月，方脫胎而出，神化無方。</p><p><strong>所出</strong>：《悟真篇》 — https://zh.wikisource.org/wiki/悟真篇</p></article></main></div></div>
