    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 吳子治兵</nav></header><main><article><h1>吳子治兵</h1><p>四輕二重一信，教戒為先。</p><p>吳子答武侯用兵何先之問，曰：「先明四輕、二重、一信。」</p><p>四輕者：「使地輕馬，馬輕車，車輕人，人輕戰。」明知險易，則地輕馬；芻秣以時，則馬輕車；膏鐧有餘，則車輕人；鋒銳甲堅，則人輕戰。</p><p>二重者：賞必重，刑必重也。</p><p>一信者：行之以信也。</p><p>又言用兵以治為勝，不在眾多。若法令不明，賞罰不信，金之不止，鼓之不進，雖有百萬，何益於用？</p><p><strong>所出</strong>：《吳子》 — https://zh.wikisource.org/wiki/吳子</p></article></main></div></div>
