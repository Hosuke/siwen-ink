    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 瓊琚瓊瑤瓊玖</nav></header><main><article><h1>瓊琚瓊瑤瓊玖</h1><p>瓊玉之美，詩人所以表厚意也</p><p>瓊琚、瓊瑤、瓊玖，皆瓊玉之美名也。</p><p>琚，佩玉之名。瓊琚，赤玉所做之珮飾也。
瑀，美玉也。瓊瑤，精美之玉石也。
玖，石之次玉黑色者。瓊玖，黑玉也。</p><p>詩人序木瓜、木桃、木李之物，而以瓊琚、瓊瑤、瓊玖報之。物之輕重，不可以道里計，而詩人毅然厚報之者，以見其心之誠、意之摯也。三章遞言瓊琚、瓊瑤、瓊玖，辭異而玉美之義同，反覆詠歎，以暢投報之情耳。</p><p><strong>所出</strong>：《詩經 · 木瓜》 — https://zh.wikisource.org/wiki/詩經/木瓜</p></article></main></div></div>
