    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 慈幼</nav></header><main><article><h1>慈幼</h1><p>惠及童稚，恤其贏弱者也。</p><p>國有幼子，當慈育之。凡國都皆有掌幼之官。士民有子，子有幼弱不勝養者為累，有三幼者無婦征，四幼者盡家無征，五幼又予之葆，受二人之食，能事而後止。此之謂慈幼，國家資之，以減其奉養之負，使幼者皆得長育也。</p><p><strong>所出</strong>：《管子 · 第54篇入國》 — https://zh.wikisource.org/wiki/管子/第54篇入國</p></article></main></div></div>
