    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五緯錯順</nav></header><main><article><h1>五緯錯順</h1><p>五星各有常度，應時感動，則天下承平。</p><p>五緯錯順，應時感動。</p><p>五星者，五行之精，錯行而各有其序。[[四七乖戾]]則凶咎生，[[五緯錯順]]則治世應。[[爻象內動]]而[[五緯錯順]]，天人相感，治忽之幾所由分也。</p><p><strong>所出</strong>：《周易參同契 · 05章》 — https://zh.wikisource.org/wiki/周易參同契/05章</p></article></main></div></div>
