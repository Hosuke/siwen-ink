    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 安危在是非，不在於強弱</nav></header><main><article><h1>安危在是非，不在於強弱</h1><p>國家安危決於是非之辨，不決於國力之強弱。</p><p>安危在是非，不在於強弱；存亡在虛實，不在於衆寡。[[賞罰隨是非]]，則是非明而安可保；賞罰悖[[是非]]，則善惡淆而危將至。齊，萬乘之國，而名實不稱，上空虛於國、内不充於名實，故臣得奪主；[[賞罰隨是非]]者，強之本也。[[法所以為國]]者，正是非之具也。</p><p><strong>所出</strong>：《韓非子 · 安危》 — https://zh.wikisource.org/wiki/韓非子/安危</p></article></main></div></div>
