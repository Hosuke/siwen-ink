    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 海王之國</nav></header><main><article><h1>海王之國</h1><p>恃海鹽之利以王天下。</p><p>管子言「海王之國，謹正鹽筴」，蓋齊地瀕海，鹽利最饒。以鹽為天下之利源，國家掌其策以取贏，是謂海王。</p><p>海王者，非以兵威加海上也，乃恃海鹽之利以充國用，百姓無缺而王業成。管子之術，不取於民而用自足，故能九合諸侯，一匡天下，葵丘之會，衣裳之會，兵車之會，無不得志者。桓公之霸，鹽筴之功也。</p><p><strong>所出</strong>：《管子 · 第72篇海王》 — https://zh.wikisource.org/wiki/管子/第72篇海王</p></article></main></div></div>
