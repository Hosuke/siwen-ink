    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 輕千乘之國</nav></header><main><article><h1>輕千乘之國</h1><p>蹈道輕國讓位，視千乘之國為輕。</p><p>《穀梁子》論隱公之讓曰：若隱者，可謂輕千乘之國。蹈道，則未也。蓋隱公能輕千乘之國而讓位，似近於道；然己探先君之邪志以遂讓，是成父之惡，非真蹈道者也。道貴正，隱公之行名讓而實順邪，故不得稱蹈道。</p><p><strong>所出</strong>：《春秋穀梁傳 · 隱公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/隱公</p></article></main></div></div>
