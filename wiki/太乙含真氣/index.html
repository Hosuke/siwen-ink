    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 太乙含真氣</nav></header><main><article><h1>太乙含真氣</h1><p>太乙者，真陰真陽渾然合一之象，一粒金丹之別名也。</p><p>[[真人]]出現，乃真陰真陽交合其中，一點生機出現，即[[聖胎]]，非十月胎完身外有身之出現。太乙取象[[太一]]，太一含有真氣，真陰真陽，渾然合一，喻之為一粒[[金丹]]。人道天道，只在順逆之間。修丹者，逆此[[道心]]之氣，使歸[[玄關一竅]]，凝成一粒黍珠，是名太乙含真氣，即真人一粒之義也。仙翁象此以為一首詩，若人問[[真人]]出現之義，即太乙含真氣也。</p><p><strong>所出</strong>：《悟真直指 · 卷三》 — https://zh.wikisource.org/wiki/悟真直指/卷三</p></article></main></div></div>
