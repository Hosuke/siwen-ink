    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 生不遘時</nav></header><main><article><h1>生不遘時</h1><p>志士感嘆己之生不逢其時，不及古人之盛世。</p><p>生不遘時者，有志之士傷己之生不逢辰、不得其時也。屈子作[[哀時命]]，首言「哀時命之不及古人兮，夫何予生之不遘時」，傷己之生也晚，不得與古聖同世。又言「往者不可扳援兮，倈者不可與期」，往事已矣，來者無望，明其生時之不偶也。</p><p><strong>所出</strong>：《楚辭 · 哀時命》 — https://zh.wikisource.org/wiki/楚辭/哀時命</p></article></main></div></div>
