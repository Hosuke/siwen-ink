    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 答永樂皇帝</nav></header><main><article><h1>答永樂皇帝</h1><p>長生之诀，在道充德盛</p><p>天機不肯輕輕洩，千磨萬難費辛勤。皇帝尋我問金丹，祖師留下長生歇。長生之歇歇何如？道充德盛卽良圖。節慾澄心澹神慮，神仙那有異功夫。</p><p><strong>所出</strong>：《張三丰先生全集 · 卷4》 — https://zh.wikisource.org/wiki/張三丰先生全集/卷4</p></article></main></div></div>
