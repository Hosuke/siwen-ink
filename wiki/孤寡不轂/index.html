    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 孤寡不轂</nav></header><main><article><h1>孤寡不轂</h1><p>王公下人以求自輔</p><p>孤、寡、不轂，皆人之所惡而賤者也。然王公以是為稱號者，非欲為人賤，乃以謙下為本、以賤為本之意也。聖人守道，貴以賤為本，高以下為基，故稱孤寡不轂以自損，損之而益。</p><p><strong>所出</strong>：《老子河上公章句 · 道化》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
