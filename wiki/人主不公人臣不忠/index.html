    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 人主不公人臣不忠</nav></header><main><article><h1>人主不公人臣不忠</h1><p>君不公則臣不忠，治亂之機在君。</p><p>欲是之主，並肩而存；能建是之士，不世絕；千歲而不合，何也？曰：人主不公，人臣不忠也。人主則外賢而偏舉，人臣則爭職而妒賢，是其所以不合之故也。人主胡不廣焉，無卹親疏，無偏貴賤，惟誠能之求？</p><p><strong>所出</strong>：《荀子 · 王霸篇》 — https://zh.wikisource.org/wiki/荀子/王霸篇</p></article></main></div></div>
