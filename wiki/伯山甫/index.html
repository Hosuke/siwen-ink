    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 伯山甫</nav></header><main><article><h1>伯山甫</h1><p>洞悉三世</p><p>伯山甫者，雍州人。華山精思服餌，時還鄉省親，二百餘年不老。知人家先世善惡功過，有如臨見，又知未來吉凶，言無不效。見外生女年老多病，與之藥，女服時年七十，稍稍還少，色如桃花。漢使者過西河城東，有女子笞老翁，翁受杖。使者怪問，女曰：「妾兒也。舅氏伯山甫以神方教妾，妾不肯服，至令衰老。」使者問年，女云：「妾二百三十，兒七十。」後女入華山仙去。</p><p><strong>所出</strong>：《神仙傳 · 卷三》 — https://zh.wikisource.org/wiki/神仙傳/卷三</p></article></main></div></div>
