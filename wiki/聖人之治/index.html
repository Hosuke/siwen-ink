    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖人之治</nav></header><main><article><h1>聖人之治</h1><p>聖人靜觀事物之至，因名而自治。</p><p>是以聖人之治也，靜身以待之，物至而名自治之。正名自治之，奇身名廢，名正法備，則聖人无事。不可常居也，不可廢舍也，隨變斷事也，知時以爲度。</p><p><strong>所出</strong>：《管子 · 第38篇白心》 — https://zh.wikisource.org/wiki/管子/第38篇白心</p></article></main></div></div>
