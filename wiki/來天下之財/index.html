    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 來天下之財</nav></header><main><article><h1>來天下之財</h1><p>以奇策致四方財貨之謂</p><p>桓公問何以來天下之財，管子對曰：昔者桀之時，女樂三萬人，端譟晨樂聞於三衢。是時無不服文繡衣裳者。伊尹以薄之游女工文繡篡組，一純得粟百鍾於桀之國。夫桀之國者，天子之國也。桀無天下憂，飾婦女鍾鼓之樂，故伊尹得其粟而奪之流。此之謂來天下之財。</p><p>管子以桀之失財反證湯之得財，歸結於「聖人善用非其有，使非其人」，非恃正賦而恃詭道也。</p><p><strong>所出</strong>：《管子 · 第80篇輕重甲》 — https://zh.wikisource.org/wiki/管子/第80篇輕重甲</p></article></main></div></div>
