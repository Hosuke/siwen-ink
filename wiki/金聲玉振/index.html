    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 金聲而玉振之</nav></header><main><article><h1>金聲而玉振之</h1><p>孟子以鐘聲始終、玉磬收韻，比喻聖智兼備之功。</p><p>孟子論孔子之集大成曰：「金聲而玉振之也。金聲也者，始條理也；玉振之也者，終條理也。始條理者，智之事也；終條理者，聖之事也。」言奏樂之時，鐘聲以發其始，玉磬以收其終，智則有始而能條理，聖則有終而成條理。智譬則巧，聖譬則力，猶射者之至與中，[[百發失一不足謂善射]]，力能至之，而中與否則非力之所及也。</p><p><strong>所出</strong>：《孟子 · 萬章下》 — https://zh.wikisource.org/wiki/孟子/萬章下</p></article></main></div></div>
