    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 甫假迎厲公</nav></header><main><article><h1>甫假迎厲公</h1><p>甫假殺鄭子，迎厲公突自櫟入鄭</p><p>鄭亡厲公突在櫟者使人誘劫鄭大夫甫假，要以求入。假曰：「捨我，我為君殺鄭子而入君。」厲公與盟，乃捨之。六月甲子，假殺鄭子及其二子而迎厲公突，突自櫟復入即位。</p><p><strong>所出</strong>：《史記 · 卷042》 — https://zh.wikisource.org/wiki/史記/卷042</p></article></main></div></div>
