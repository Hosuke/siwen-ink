    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 窮神以知化</nav></header><main><article><h1>窮神以知化</h1><p>極神思之深，則知陰陽變化之理。</p><p>神者，化之原；化者神之跡。窮神者，極思慮之深；知化者，明變遷之理。唯神能知化，唯化乃見神。幽明死生，皆神化之所為。</p><p><strong>所出</strong>：《周易參同契 · 03章》 — https://zh.wikisource.org/wiki/周易參同契/03章</p></article></main></div></div>
