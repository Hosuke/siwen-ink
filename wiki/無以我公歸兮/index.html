    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無以我公歸兮</nav></header><main><article><h1>無以我公歸兮</h1><p>勿使公歸，以寓留賢之義。</p><p>「是以有袞衣兮，無以我公歸兮」。有袞衣者，[[袞衣繡裳]]之君子在也；無以公歸者，勿令其去也。[[公歸不復]]，則朝廷無賢；[[公歸無所]]，則賢者無棲。詩刺朝廷不知賢、不留賢，故民庶思得君子而留之。《[[九罭之魚]]》之義，於此見矣。</p><p><strong>所出</strong>：《詩經 · 九罭》 — https://zh.wikisource.org/wiki/詩經/九罭</p></article></main></div></div>
