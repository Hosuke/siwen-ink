    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 仲嬰齊</nav></header><main><article><h1>仲嬰齊</h1><p>公孫嬰齊以兄後而立嗣，故稱仲嬰齊。</p><p>成公十五年三月乙巳，仲嬰齊卒。</p><p>仲嬰齊者何？公孫嬰齊也。公孫嬰齊，則曷為謂之仲嬰齊？為兄後也。為人後者為之子也。孫以王父字為氏，然則嬰齊孰後？後歸父也。</p><p>歸父使于晉而未反，何以後之？昔公子遂弒子赤而立宣公，宣公死，成公幼，臧宣叔相之。君死不哭，聚諸大夫而問，僑如乃遣歸父之家然後哭君。歸父使乎晉，至檉，聞君薨家遣，踦閭哭踊，反命於介。魯人傷歸父之無後，使嬰齊後之，因以仲嬰齊為稱。</p><p><strong>所出</strong>：《春秋公羊傳 · 成公》 — https://zh.wikisource.org/wiki/春秋公羊傳/成公</p></article></main></div></div>
