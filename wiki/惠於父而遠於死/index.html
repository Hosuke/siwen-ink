    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 惠於父而遠於死，惠於眾而利社稷</nav></header><main><article><h1>惠於父而遠於死，惠於眾而利社稷</h1><p>申生以為，若能惠君以福、免死於狄，乃可言圖。</p><p>狐突言於申生曰：「若惠於父而遠於死，惠於眾而利社稷，其可以圖之乎？況其危身於狄以起讒於內也？」申生曰：「不若戰也。不戰而反，我罪滋厚；我戰死，猶有令名焉。」果敗狄於稷桑而反。</p><p><strong>所出</strong>：《國語 · 卷07》 — https://zh.wikisource.org/wiki/國語/卷07</p></article></main></div></div>
