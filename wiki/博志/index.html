    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 博志</nav></header><main><article><h1>博志</h1><p>精於一藝乃可有成，博而不精者無遂功。</p><p>孔、墨、甯越，皆布衣之士也，慮於天下，以為無若先王之術者，故日夜學之。有便於學者，無不為也；有不便於學者，無肯為也。蓋聞孔丘、墨翟，晝日諷誦習業，夜親見文王、周公旦而問焉。用志如此其精也，何事而不達？何為而不成？故曰精而熟之，鬼將告之。</p><p>今有寶劍良馬於此，玩之不厭，視之無倦。寶行良道，一而弗復，欲身之安也，名之章也，不亦難乎？</p><p>[[學不可以已]]，然貴精不貴雜，[[用心一也]]。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十四》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十四</p></article></main></div></div>
