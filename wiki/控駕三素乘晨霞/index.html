    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 控駕三素乘晨霞</nav></header><main><article><h1>控駕三素乘晨霞</h1><p>控馭三素，乘朝霞而遊。</p><p>控駕三素乘晨霞。</p><p>三素者，三素之雲也。晨霞者，朝霞也。仙人駕馭三素之雲，[[御白鶴駕龍鱗|乘之以遊]]，日出之際，往來天人之域。</p><p><strong>所出</strong>：《黃庭內景經 · 隱景章第二十四》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/隱景章第二十四</p></article></main></div></div>
