    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 巵言</nav></header><main><article><h1>巵言</h1><p>自然流出之言，日新而和以天倪者也。</p><p>巵言者，溢出之言，不思而得者也。日出之和，曼衍以窮年。不言則齊，齊與言不齊，言與齊不齊，故曰無言。言無言，終身言，未嘗不言；終身不言，未嘗不言。物固有所然，物固有所可，无物不然，无物不可。此所以得天倪而能久也。</p><p><strong>所出</strong>：《莊子 · 寓言》 — https://zh.wikisource.org/wiki/莊子/寓言</p></article></main></div></div>
