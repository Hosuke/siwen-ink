    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 稱制</nav></header><main><article><h1>稱制</h1><p>太后臨朝，代行天子之政令，號令一出太后。</p><p>孝惠帝崩，太子立為帝。帝壯，或聞其母非真皇后子，帝出言不遜。太后幽殺之，乃立常山王義為帝，更名曰弘，不稱元年，以太后制天下事也。太后稱制，議欲立諸呂為王。元年，號令一出太后。</p><p><strong>所出</strong>：《史記 · 卷009》 — https://zh.wikisource.org/wiki/史記/卷009</p></article></main></div></div>
