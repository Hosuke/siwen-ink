    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 陳胡公滿</nav></header><main><article><h1>陳胡公滿</h1><p>舜裔封陳，奉帝舜祀，以媯為姓。</p><p>陳胡公滿者，虞帝舜之後也。昔舜為庶人時，堯妻之二女，居于媯汭，其後因為氏姓，姓媯氏。舜已崩，傳禹天下，而舜子商均為封國。夏后之時，或失或續。至于周武王克殷紂，乃復求舜後，得媯滿，封之於陳，以奉帝舜祀，是為胡公。</p><p><strong>所出</strong>：《史記 · 卷036》 — https://zh.wikisource.org/wiki/史記/卷036</p></article></main></div></div>
