    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 谷神不死</nav></header><main><article><h1>谷神不死</h1><p>黃帝書之言，以谷神喻道，示玄牝為天地之根。</p><p>谷者，虛也。神者，妙用之謂。谷中央無谷，無形無影，無逆無違，處卑不動，守靜不衰，谷以之成而不見其形，此至物也。言道體虛豁如谷，神用不測，生物之功未嘗已。[[緜緜若存]]，萬物以之而生，無物不成，用而不勞。此[[玄牝之門]]所以為[[天地之根]]。</p><p><strong>所出</strong>：《道德經 (王弼本) · 六章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
