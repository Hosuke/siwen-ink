    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 糟丘生乎象箸</nav></header><main><article><h1>糟丘生乎象箸</h1><p>奢侈之漸始於微細，由箸而糟丘，終至覆亡；聖人見微知著，豫防於始。</p><p>故糟丘生乎象箸，炮烙生乎熱斗。聖人之見終始微言！</p><p><strong>所出</strong>：《淮南子 · 齊俗訓》 — https://zh.wikisource.org/wiki/淮南子/齊俗訓</p></article></main></div></div>
