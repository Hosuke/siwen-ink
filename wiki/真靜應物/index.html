    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 真靜應物</nav></header><main><article><h1>真靜應物</h1><p>慾既不生即是真靜，真常應物而常得性，常應常靜</p><p>慾既不生，即是真靜。真常應物，真常得性；常應常靜，常清靜矣。如此清靜，漸入真道；既入真道，名謂得道。</p><p>真靜者，非枯木死灰之靜，乃應物而不滯於物之靜。常應萬物而心常清靜，此之謂與道合真。</p><p><strong>所出</strong>：《太上老君說常清靜經》 — https://zh.wikisource.org/wiki/太上老君說常清靜經</p></article></main></div></div>
