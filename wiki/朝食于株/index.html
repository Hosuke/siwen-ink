    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 朝食于株</nav></header><main><article><h1>朝食于株</h1><p>言靈公朝夕馳驅，往株林而朝食，以刺其淫也</p><p>《株林》末句云「乘我乘駒，朝食于株」。言陳靈公乘馬而行，旦夕馳驅，往株林而朝食。株，即株林也。詩人敘其車馬之盛、往來之勤，實刺其淫慝無度，日夜不息，以明靈公荒廢國政、專於夏姬之醜也。</p><p><strong>所出</strong>：《詩經 · 株林》 — https://zh.wikisource.org/wiki/詩經/株林</p></article></main></div></div>
