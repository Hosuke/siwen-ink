    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 滅塞侵壅</nav></header><main><article><h1>滅塞侵壅</h1><p>滅塞侵壅皆生於法之不立</p><p>姦邪之所以生，亂亡之所以起，皆由法度不明、法令不行。法令逆而賞罰不當，則羣臣立私而壅塞之，朋黨而劫殺之。
