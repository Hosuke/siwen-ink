    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 李斯進諫二世</nav></header><main><article><h1>李斯進諫二世</h1><p>李斯進諫二世戒聲色，趙高謂樂各世殊，二世然之。</p><p>秦二世尤以為娛。丞相李斯進諫曰：「放棄詩書，極意聲色，祖伊所以懼也；輕積細過，恣心長夜，紂所以亡也。」趙高曰：「五帝、三王樂各殊名，示不相襲。上自朝廷，下至人民，得以接歡喜，合殷勤，非此和說不通，解澤不流，亦各一世之化，度時之樂，何必華山之騄耳而後行遠乎？」二世然之。</p><p><strong>所出</strong>：《史記 · 卷024》 — https://zh.wikisource.org/wiki/史記/卷024</p></article></main></div></div>
