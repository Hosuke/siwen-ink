    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天子始裘</nav></header><main><article><h1>天子始裘</h1><p>孟冬之月，天氣上騰、地氣下降，天子始裘以禦寒。</p><p>孟冬之月，天子始裘。命有司曰：「天氣上騰，地氣下降，天地不通，閉塞而成冬。」命百官謹蓋藏，命司徒循行積聚，無有不斂。坏城郭，戒門閭，修鍵閉，慎管籥，固封疆，備邊竟，完要塞，謹關梁，塞徯徑。</p><p><strong>所出</strong>：《禮記 · 月令》 — https://zh.wikisource.org/wiki/禮記/月令</p></article></main></div></div>
