    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 官不及私昵惟其能</nav></header><main><article><h1>官不及私昵惟其能</h1><p>授官任能，勿以私昵。</p><p>官者，國之棟樑也。官之授也，不可以私昵昵之。昵於其所親，則賢否不分；惟以其能，則官得其人。</p><p><strong>所出</strong>：《尚書 · 說命中》 — https://zh.wikisource.org/wiki/尚書/說命中</p></article></main></div></div>
