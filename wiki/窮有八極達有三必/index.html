    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 窮有八極達有三必</nav></header><main><article><h1>窮有八極達有三必</h1><p>材美者困於八極，通達者賴乎三者</p><p>窮有八極，達有三必，形有六府。</p><p>美髯長大壯麗勇敢，八者俱過人也，因以是窮。緣循、偃佒、困畏不若人，三者俱通達。</p><p>[[知慧外通，勇動多怨，仁義多責，達生之性者傀，達於知者肖；達大命者隨，達小命者遭。]]</p><p>世人以材美自矜者，反為材所累而致困厄；惟緣循、偃佒、困畏不若人者，不敢先物，而天機自通。此窮達之理，非偶然也。</p><p><strong>所出</strong>：《莊子 · 列禦寇》 — https://zh.wikisource.org/wiki/莊子/列禦寇</p></article></main></div></div>
