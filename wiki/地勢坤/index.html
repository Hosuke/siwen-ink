    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 地勢坤</nav></header><main><article><h1>地勢坤</h1><p>地之勢厚而能載，君子法之以厚德載物。</p><p>《坤》之象曰「地勢坤」，言地之形勢，厚實廣大，承載萬物而無遺。君子觀此象，當法地之厚，以深厚之德容載眾物。《文言》曰：「君子以厚德載物。」正承此義也。</p><p>地之為德，在乎靜而能承，廣而能載。萬物生於地，長於地，終歸於地，而地未嘗以為功。其德之所以厚者，以其順也。順則能載，能載則物各得其所。聖人法之，則為政以德，容民畜眾，天下無不可受之人。此與[[天行健]]之義相配，剛柔並建，以成君子之全德。</p><p><strong>所出</strong>：《周易 · 大象》 — https://zh.wikisource.org/wiki/周易/大象</p></article></main></div></div>
