    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 夢與五臟</nav></header><main><article><h1>夢與五臟</h1><p>五臟氣虛，則夢見與該臟相關之象，據夢可以測氣之虛實。</p><p>帝論夢與五臟之關係：</p><p>肺氣虛，則夢見白物，見人斬血借借；得其時，則夢見兵戰。
腎氣虛，則夢見舟船溺人；得其時，則夢伏水中，若有畏恐。
肝氣虛，則夢見菌香生草；得其時，則夢伏樹下不敢起。
心氣虛，則夢救火陽物；得其時，則夢燔灼。
脾氣虛，則夢飲食不足；得其時，則夢築垣蓋屋。</p><p>此皆五臟氣虛、陽氣有餘、陰氣不足所致，合之五診，可以調陰陽而在經脈也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第二十四卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第二十四卷</p></article></main></div></div>
