    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 反掖之寇</nav></header><main><article><h1>反掖之寇</h1><p>弃城而敗軍，則反側之寇必乘虛襲城。</p><p>夫弃城而敗軍，則反掖之寇必襲城矣。城盡則聚散，聚散則無軍矣。</p><p><strong>所出</strong>：《韓非子 · 存韓》 — https://zh.wikisource.org/wiki/韓非子/存韓</p></article></main></div></div>
