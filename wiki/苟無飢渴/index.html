    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 苟無飢渴</nav></header><main><article><h1>苟無飢渴</h1><p>祝行人保嗇，無飢渴以終歸。</p><p>「君子于役，苟無飢渴。」役人久淹于外，飢渴之患為急。大夫之念君子，不唯思其歸，更祝其在途無有匱乏。苟者，庶幾之辭；無飢渴，則保嗇其身，以待全師而還也。此念之深切，非止問訊而已。</p><p><strong>所出</strong>：《詩經 · 君子于役》 — https://zh.wikisource.org/wiki/詩經/君子于役</p></article></main></div></div>
