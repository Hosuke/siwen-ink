    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 甲子昧爽</nav></header><main><article><h1>甲子昧爽</h1><p>師行之候，昧爽而郊誓。</p><p>「時甲子昧爽，王朝至于商郊牧野，乃誓。」言[[商人郊迎武王]]之晨，昧爽之時，師次商郊，[[湯武誅暴]]之誓已發。此[[昧旦]]之候，[[恭行天罰]]之師，於是乎起。</p><p><strong>所出</strong>：《尚書 · 牧誓》 — https://zh.wikisource.org/wiki/尚書/牧誓</p></article></main></div></div>
