    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大亨以正天之道</nav></header><main><article><h1>大亨以正天之道</h1><p>盛大亨通而歸於正道，乃天之常道。</p><p>[[說而順]]、剛中而應，此[[臨]]之所以亨也。剛浸而長，陰消陽息，陽剛日盛而正道得行。君子法之，以大正為歸。</p><p>天之道不過乎正。天地之序由於正，天地之塞由於正，聖人之治亦由於正。一不正則凶隨之，至八月有凶者，正道消亡之兆也。</p><p>[[天行有常]]，不為堯存，不為桀亡。正者，天之道也，亦君子所當執也。</p><p><strong>所出</strong>：《周易 · 臨》 — https://zh.wikisource.org/wiki/周易/臨</p></article></main></div></div>
