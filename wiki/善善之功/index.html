    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 善善之功</nav></header><main><article><h1>善善之功</h1><p>善善者，見賢而善之也。言詩之美德，所以明勸善之道。</p><p>善善，猶言好善也。《緇衣》序云「故美其德，以明有國善善之功焉」。[[善善之功]]者，見人之善而稱美之，使天下皆知所勸也。</p><p>夫詩之作，所以風天下而正人心。今《緇衣》之美武公，非徒美其人也，實以明為國者之善善有其功焉。好賢者，國之所以興也；蔽賢者，國之所以亡也。此詩人立言之旨，而序《詩》者得之矣。</p><p><strong>所出</strong>：《詩經 · 緇衣》 — https://zh.wikisource.org/wiki/詩經/緇衣</p></article></main></div></div>
