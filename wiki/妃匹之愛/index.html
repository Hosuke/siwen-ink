    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 妃匹之愛</nav></header><main><article><h1>妃匹之愛</h1><p>妃匹之愛，雖君父不能強，人之遇合，各有命焉。</p><p>甚哉，妃匹之愛，君不能得之於臣，父不能得之於子，況卑下乎！既驩合矣，或不能成子姓；能成子姓矣，或不能要其終：豈非命也哉？孔子罕稱命，蓋難言之也。非通幽明之變，惡能識乎性命哉？人能弘道，無如命何。</p><p><strong>所出</strong>：《史記 · 卷049》 — https://zh.wikisource.org/wiki/史記/卷049</p></article></main></div></div>
