    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三劫</nav></header><main><article><h1>三劫</h1><p>姦臣篡國之三途：明劫、事劫、刑劫。</p><p>劫者，奪也。姦臣竊國之柄，劫持其君，謂之劫。劫有三者：</p><p>一曰明劫。羣臣持祿養交，行私道而不效公忠，是為明劫。此輩竊祿自肥，國事無補，而君莫能察。</p><p>二曰事劫。姦臣操弄禍福之說，以阿主之好惡；事敗則與主分責，事成則臣獨受賞，是為事劫。</p><p>三曰刑劫。姦臣擅守囹圄、執行刑罰，自行賞罰而不稟命於君，是為刑劫。</p><p>三守不完，則三劫並起；三守完固，則三劫自止。三劫既塞，王道可成。</p><p><strong>所出</strong>：《韓非子 · 三守》 — https://zh.wikisource.org/wiki/韓非子/三守</p></article></main></div></div>
