    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 隂陽顛倒</nav></header><main><article><h1>隂陽顛倒</h1><p>水火旣濟、地天交泰，是為隂陽顛倒之法。</p><p>却用隂陽顛倒之法，水火旣濟之道，乃行地天交泰。使陽居下，火必照上；令隂在上，水能潤下。只要苦行忍辱，身心不動，已之性若往，彼之氣自回。</p><p><strong>所出</strong>：《張三丰先生全集 · 卷3》 — https://zh.wikisource.org/wiki/張三丰先生全集/卷3</p></article></main></div></div>
