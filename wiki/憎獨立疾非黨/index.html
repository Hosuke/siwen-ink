    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 憎獨立，疾非黨</nav></header><main><article><h1>憎獨立，疾非黨</h1><p>闇主嫉賢妒能，憎人之卓立，疾人之不阿附。</p><p>「又況於胸中率有憎獨立，疾非黨，忌勝己，忽寒素者乎？」言闇主胸中素來憎惡卓然自立之人，嫉怨不阿附朋黨者，忌憚才能勝己者，輕忽寒門素士。此所以賢才不能自進，而佞諂者得志也。</p><p><strong>所出</strong>：《抱朴子 · 卷50》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷50</p></article></main></div></div>
