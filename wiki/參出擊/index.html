    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 參出擊</nav></header><main><article><h1>參出擊</h1><p>參聞蕭何卒，告舍人趣治行將入相。</p><p>惠帝二年，蕭何卒。參聞之，告舍人趣治行，曰：「吾將入相。」居無何，使者果召參。趣治行者，急治行裝也。參未事先帝而預知為相，非有異術，知國不可一日無相，帝王倚相以安天下也。</p><p><strong>所出</strong>：《史記 · 卷054》 — https://zh.wikisource.org/wiki/史記/卷054</p></article></main></div></div>
