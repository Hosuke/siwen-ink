    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 參禮如來宣賜佛號並讚</nav></header><main><article><h1>參禮如來宣賜佛號並讚</h1><p>張三丰兼受佛號，稱邋遢靜光佛。</p><p>神光熙照，性海澄淸。在塵出塵，隱世度世。現醫身而扶危拔困，偈㐄眾而闡道傳經。果證大羅金仙，道比達磨尊者。</p><p>大仁大願大慈大悲[[三丰]]眞師救難天尊[[邋遢]]靜光佛菩薩摩訶薩。</p><p><strong>所出</strong>：《張三丰先生全集 · 卷1》 — https://zh.wikisource.org/wiki/張三丰先生全集/卷1</p></article></main></div></div>
