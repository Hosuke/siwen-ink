    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 恭儉莊敬而不煩</nav></header><main><article><h1>恭儉莊敬而不煩</h1><p>深於《禮》者，兼恭敬儉約與莊肅而不流於繁瑣。</p><p>《禮》之教使人恭儉莊敬，然過於拘泥則失之煩。唯恭儉莊敬而不煩者，乃為深於《禮》者也。</p><p><strong>所出</strong>：《禮記 · 經解》 — https://zh.wikisource.org/wiki/禮記/經解</p></article></main></div></div>
