    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 魂靈</nav></header><main><article><h1>魂靈</h1><p>魂者神之主，靈者神之用，二者相合以成生命。</p><p>上有魂靈者，魂為陽神，靈為陰魄，二者合而為人之神機。黃庭之學，以存思魂靈為入道之首務。魂靈不散，則神炁長存；魂靈散去，則形骸枯槁。《上清黃庭內景經》以魂靈為上身之主宰，與下元之關元相應，構成精炁神之三元體系焉。</p><p><strong>所出</strong>：《黃庭內景經 · 上有章第二》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/上有章第二</p></article></main></div></div>
