    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖人神神</nav></header><main><article><h1>聖人神神</h1><p>聖人超乎神怪，不為鬼役，寂然應物，而與天地本原合。</p><p>惟聖人能神神而不神於神，役萬物而執其機，可以會之，可以散之，可以禦之，日應萬物，其心寂然。</p><p>火千年俄可滅，識千年俄可去。聖人之所以為聖，正以其心無時無方，不為一物所拘，不為一識所縛。故黃帝曰：「道無鬼神，獨往獨來。」</p><p>我之思慮日變，有使之者，非我也，命也。苟知惟命，外不見我，內不見心，則其心寂然，與太虛同體，奚神怪之有？</p><p><strong>所出</strong>：《關尹子 · 5》 — https://zh.wikisource.org/wiki/關尹子/5</p></article></main></div></div>
