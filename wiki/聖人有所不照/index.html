    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖人有所不照</nav></header><main><article><h1>聖人有所不照</h1><p>日月有所不照，聖人有所不知，不可執此以疑仙道。</p><p>周孔自偶，不信仙道。然日月有所不照，聖人有所不知，豈可以聖人所不為，便云天下無仙？</p><p>是責三光不照覆盆之內也。</p><p><strong>所出</strong>：《抱朴子 · 卷12》 — https://zh.wikisource.org/wiki/抱朴子/卷12</p></article></main></div></div>
