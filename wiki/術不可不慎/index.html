    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 術不可不慎</nav></header><main><article><h1>術不可不慎</h1><p>矢人函人之殊，在於術之慎不慎。里仁為美，擇不處仁，不得為智。</p><p>孟子曰：「矢人豈不仁於函人哉？矢人惟恐不傷人，函人惟恐傷人。巫匠亦然。故術不可不慎也。孔子曰：『里仁為美。擇不處仁，焉得智？』夫仁，天之尊爵也，人之安宅也。」</p><p><strong>所出</strong>：《孟子 · 公孫丑上》 — https://zh.wikisource.org/wiki/孟子/公孫丑上</p></article></main></div></div>
