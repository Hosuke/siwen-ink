    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 億萬之心</nav></header><main><article><h1>億萬之心</h1><p>民心不壹，雖衆猶亡；君心專一，雖寡猶存。</p><p>《泰誓》曰：「紂有臣億萬人，亦有億萬之心。武王有臣三千而一心。」故紂以億萬之心亡，武王以一心存。故有國之君，苟不能同人心，一國威，齊士義，通上之治，以為下法，則雖有廣地衆民，猶不能以為安也。</p><p><strong>所出</strong>：《管子 · 第14篇法禁》 — https://zh.wikisource.org/wiki/管子/第14篇法禁</p></article></main></div></div>
