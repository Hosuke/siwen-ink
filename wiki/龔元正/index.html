    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 龔元正</nav></header><main><article><h1>龔元正</h1><p>武陵道士，創建萬壽宮大殿，手植松杉數十萬株，坐化。</p><p>龔元正字端本，武陵人，家貧好學，帶經而鋤，後去為道士，天性淳態，向道精專。</p><p>創建新宮大殿，巍樓傑閣，廣廈重廊，金碧輝映。手植松杉數十萬株。宮成，賜額萬壽，賜號沖逸大師。住持四十年，未嘗背衆一食。一日召其徒曰不出五日，吾逝矣。四日端坐，誦老子《道德經》，遲明儼然而化，時宋徽宗宣和年。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 52》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/52</p></article></main></div></div>
