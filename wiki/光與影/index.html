    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 光與影之說</nav></header><main><article><h1>光與影之說</h1><p></p><p>《墨子·經說下》之光學思想，論述光影形成之理，蓋以幾何原則為基。光之行也，直若射然，故光之人煦若射，下者之人也高，高者之人也下。足蔽下光，故成景於上；首蔽上光，故成景於下。此論閾明了光以直線傳播之本質。</p><p>論影之數：有「景」與「光」之別。景者，影也。光至則景亡，若光在，則盡古息。當一光之時，影單；光夾則影雙。鏡鑒之分：平鑒（平面鏡）與凹鑒（凹面鏡）之別。中之內者，凹面鏡近焦則所鑒大；中之外者，則遠焦所鑒小，而必易其正反。</p><p>光與影之說，為古代光學之重要論述，其幾何分析之精密，足見墨家之科學精神。</p></article></main></div></div>
