    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 敷奏明試</nav></header><main><article><h1>敷奏明試</h1><p>巡守之制，諸侯述職，天子考核。</p><p>五載一巡守，群后四朝。敷奏以言，明試以功，車服以庸。敷者，布也；奏者，進也；明試者，驗其功也；庸者，用也。述職而無功，黜之；述職而有功，陟之。賞罰之公，莫大於此。</p><p><strong>所出</strong>：《尚書 · 舜典》 — https://zh.wikisource.org/wiki/尚書/舜典</p></article></main></div></div>
