    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 一息得道</nav></header><main><article><h1>一息得道</h1><p>生之長短非死之遲速，死者動止昭智者亦止名為生，惟契道者為真生。</p><p>人生在世，有生一日死者，有生十年死者，有生百年死者。一日死者，如一息得道；十年百年死者，如歷久得道。彼未死者，雖動作昭智，止名為生，不名為死。彼未契道者，雖動作昭智，止名為事，不名為道。</p><p><strong>所出</strong>：《關尹子 · 1》 — https://zh.wikisource.org/wiki/關尹子/1</p></article></main></div></div>
