    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 曹窋</nav></header><main><article><h1>曹窋</h1><p>參之子，惠帝時為中大夫。</p><p>參子窋為中大夫。惠帝怪相國不治事，使窋私問參以政。窋歸諫參，參怒笞之二百。窋入侍惠帝，帝讓參，參免冠謝，仍以守職對。窋後嗣平陽侯，高后時為御史大夫。夫父子之間，國家之事不可私語，趣入侍者，正君臣之義也。</p><p><strong>所出</strong>：《史記 · 卷054》 — https://zh.wikisource.org/wiki/史記/卷054</p></article></main></div></div>
