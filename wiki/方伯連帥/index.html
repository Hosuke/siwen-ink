    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 方伯連帥</nav></header><main><article><h1>方伯連帥</h1><p>千里之外，設官分職，以方伯連帥統御諸侯。</p><p>千里之外，設方伯。五國以為屬，屬有長；十國以為連，連有帥；三十國以為卒，卒有正；二百一十國以為州，州有伯。八州八伯，五十六正，百六十八帥，三百三十六長。八伯各以其屬屬於天子之老二人，分天下以為左右，曰二伯。</p><p>千里之內曰甸，千里之外曰采，曰流。</p><p><strong>所出</strong>：《禮記 · 王制》 — https://zh.wikisource.org/wiki/禮記/王制</p></article></main></div></div>
