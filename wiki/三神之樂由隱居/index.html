    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三神之樂由隱居</nav></header><main><article><h1>三神之樂由隱居</h1><p>三神歡悅，由於隱居修道。</p><p>三神之樂由隱居。</p><p>三神者，精、氣、神也。言人之所以能使三神安和者，以其隱居山林、恬淡無欲也。世人擾擾於名利，則三神耗散而病生。惟隱居者守真[[含德之厚|含德]]，故三神常樂。</p><p><strong>所出</strong>：《黃庭內景經 · 隱景章第二十四》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/隱景章第二十四</p></article></main></div></div>
