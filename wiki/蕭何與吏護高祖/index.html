    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蕭何與吏護高祖</nav></header><main><article><h1>蕭何與吏護高祖</h1><p>高祖微時，蕭何數以吏事護之，送錢獨厚。</p><p>高祖為布衣時，何數以吏事護高祖。高祖為亭長，常左右之。高祖以吏繇咸陽，吏皆送奉錢三，何獨以五。秦御史監郡者與從事，常辨之。何乃給泗水卒史事，第一。秦御史欲入言徵何，何固請，得毋行。</p><p><strong>所出</strong>：《史記 · 卷053》 — https://zh.wikisource.org/wiki/史記/卷053</p></article></main></div></div>
