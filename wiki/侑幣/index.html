    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 侑幣</nav></header><main><article><h1>侑幣</h1><p>佐食之幣，所以勸客加食也</p><p>侑幣者，助也、勸也。公食大夫禮末，公受宰夫束帛以侑，西鄉立。言「侑」者，勸客加食也；言「幣」者，束帛以表意也。公既親設梁稻，恐賓未足，故以幣侑勸之。賓降筵北面，辭幣，升聽命，降拜；公辭，賓升，再拜稽首，受幣當東楹。上下交際之義，於茲備矣。</p><p><strong>所出</strong>：《儀禮 · 公食大夫禮》 — https://zh.wikisource.org/wiki/儀禮/公食大夫禮</p></article></main></div></div>
