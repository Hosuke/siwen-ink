    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 莊蹻王滇</nav></header><main><article><h1>莊蹻王滇</h1><p>述楚將莊蹻循江略地至滇，因道塞而王滇之事</p><p>始楚威王時，使將軍莊蹻將兵循江上，略巴、黔中以西。莊蹻者，故楚莊王苗裔也。蹻至滇池，地方三百里，旁平地，肥饒數千里，以兵威定屬楚。欲歸報，會秦擊奪楚巴、黔中郡，道塞不通，因還，以其眾王滇，變服，從其俗，以長之。</p><p>秦時常頞略通五尺道，諸此國頗置吏焉。十餘歲，秦滅。漢興，皆棄此國而開蜀故徼。巴蜀民或竊出商賈，取筰馬、僰僮、髦牛，以此巴蜀殷富。</p><p><strong>所出</strong>：《史記 · 卷116》 — https://zh.wikisource.org/wiki/史記/卷116</p></article></main></div></div>
