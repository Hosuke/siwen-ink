    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 靈沼</nav></header><main><article><h1>靈沼</h1><p>靈沼魚躍，聖德及物之驗也。</p><p>「王在靈沼，於牣魚躍。」</p><p>沼者，池也。靈沼者，美稱之也。牣者，充滿也。言王遊於靈沼之上，魚充滿乎其間，踴躍而出，見物之蕃盛也。</p><p>[[川淵深而魚鱉歸之|水之深者魚鱉歸之]]，物之繁者[[民之洽矣|民心洽]]之驗也。王德之盛，不止及於人，並及乎魚[[魚鱉黿鼉|鱉鳥獸]]，[[聖人守此萬物化|萬物皆化焉]]。</p><p>[[使民養生送死無憾|聖王之政]]，民物各得其所，此[[靈囿]]所以名靈，[[靈沼]]所以見祥者也。</p><p><strong>所出</strong>：《詩經 · 靈臺》 — https://zh.wikisource.org/wiki/詩經/靈臺</p></article></main></div></div>
