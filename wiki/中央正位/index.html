    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 中央正位</nav></header><main><article><h1>中央正位</h1><p>龍虎交會歸中，聖胎凝結之處</p><p>中央正位者，土釜之位，聖胎凝結之處也。龍虎交會，性情相投，合而為一，入於中央，先天之氣自虛無中來，凝而為一粒黍珠，聖胎有象。聖胎凝結，雖要無為，尚有防危慮險之功，不可不知也。</p><p><strong>所出</strong>：《悟真直指 · 卷一》 — https://zh.wikisource.org/wiki/悟真直指/卷一</p></article></main></div></div>
