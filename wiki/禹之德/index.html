    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 禹之德</nav></header><main><article><h1>禹之德</h1><p>述禹治水勤民之德</p><p>禹之德，見於《史記 · 五帝本紀》。其治水也，傷先人父鯀功之不成受誅，乃勞身焦思，居外十三年，過家門不敢入。薄衣食，致孝于鬼神；卑宮室，致費於溝淢。陸行乘車，水行乘船，泥行乘橇，山行乘檋。左準繩，右規矩，載四時，以開九州，通九道，陂九澤，度九山。食少，調有餘相給，以均諸侯。又其德曰：「爲人敏給克勤；其惪不違，其仁可親，其言可信；聲爲律，身爲度，稱以出；亹亹穆穆，爲綱爲紀。」天下皆以舜之誅爲是。</p><p><strong>所出</strong>：《史記 · 卷002》 — https://zh.wikisource.org/wiki/史記/卷002</p></article></main></div></div>
