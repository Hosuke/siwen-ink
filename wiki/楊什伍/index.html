    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 楊什伍</nav></header><main><article><h1>楊什伍</h1><p>廣漢術士，受南極王君法，檄召鬼神，無不立應</p><p>楊什伍者，本名什伍，廣漢什郁人。幼遇道士教以檄召之術，受三皇天文，役命鬼神，無不立應。驅毒厲，剪氛邪，禳水旱，致風雨，是法皆能之。性木訥疏傲，不拘俗。</p><p>唐玄宗問所受，曰：「臣師乃南極王君青城真人，昔於後城山中教以召命之術，輔贊太平之君，方得飛昇之道。」戒以護氣希言，目不妄視。後不知所終。</p><p><strong>所出</strong>：歷世真仙體道通鑑 · 43 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/43</p></article></main></div></div>
