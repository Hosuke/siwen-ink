    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 恭儉偋五兵</nav></header><main><article><h1>恭儉偋五兵</h1><p>恭謹節儉之德，勝於戈矛之利。</p><p>憍泄者，人之殃也。恭儉者，偋五兵也。雖有戈矛之刺，不如恭儉之利也。</p><p><strong>所出</strong>：《荀子 · 榮辱篇》 — https://zh.wikisource.org/wiki/荀子/榮辱篇</p></article></main></div></div>
