    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不以其無私輿故能成其私</nav></header><main><article><h1>不以其無私輿故能成其私</h1><p>聖人無私求，故能成其私願。退身外身，以無私成有私。</p><p>不以其無私輿，故能成其私。聖人無私求，不以私心干物，而天下之利自成焉。退身、外身者，皆不以其身為私，而身先、身存之效見矣。效見而私願從之，是無私而私願成也。</p><p>通行本「與」字，帛書本異文作「輿」，義可通。</p><p><strong>所出</strong>：《老子 (帛書本) · 章七》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
