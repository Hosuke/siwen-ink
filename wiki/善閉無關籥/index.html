    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 善閉無關籥</nav></header><main><article><h1>善閉無關籥</h1><p>善閉者無可啟之鍵，鍵出於己，則人莫能奪。</p><p>善閉者無關籥而不可啟也。言善於關閉者，非恃門鍵之固，乃無形之關鍵立於心，使外欲不得入、内密不得出，故不可啟也。《老子》以此明天道之要：夫有鍵則有可奪之機，有啟則有可窺之隙；唯無鍵，是以不可啟；唯不恃物，是以物莫能加之。此[[善行無轍跡]]之旨而異用同歸者也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章二十七》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
