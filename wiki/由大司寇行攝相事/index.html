    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 由大司寇行攝相事</nav></header><main><article><h1>由大司寇行攝相事</h1><p>孔子為大司寇攝行相事，有喜色。</p><p>定公十四年，孔子年五十六，由大司寇行攝相事，有喜色。門人曰：「聞君子禍至不懼，福至不喜。」孔子曰：「有是言也。不曰『樂其以貴下人』乎？」此孔子為魯司寇攝相之時也。</p><p><strong>所出</strong>：《史記 · 卷047》 — https://zh.wikisource.org/wiki/史記/卷047</p></article></main></div></div>
