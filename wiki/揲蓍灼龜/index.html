    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 揲蓍灼龜</nav></header><main><article><h1>揲蓍灼龜</h1><p>古之善卜者，能以一端示萬象。</p><p>古之善揲蓍灼龜者，能於今中示古，古中示今，高中示下，下中示高，小中示大，大中示小，一中示多，多中示一，人中示物，物中示人，我中示彼，彼中示我。</p><p><strong>所出</strong>：《關尹子 · 8》 — https://zh.wikisource.org/wiki/關尹子/8</p></article></main></div></div>
