    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 重耳出亡</nav></header><main><article><h1>重耳出亡</h1><p>晉獻公諸子出奔，重耳奔翟，夷吾奔屈。</p><p>晉獻公之世，驪姬既譖殺申生，諸公子皆不自安。公子重耳奔蒲，夷吾奔屈。及獻公沒，里克、㔻鄭欲納文公，故以三公子之徒作亂。夷吾許賂秦以求入，秦伯納之，是為惠公。重耳後卒頼秦穆公之力，歸國而立，是為晉文公。夫二公子之奔，一出一歸，而晉之霸業基焉。非重耳之賢足以懷諸侯，則惠公之窄量不足以圖霸也。</p><p><strong>所出</strong>：《春秋左氏傳 · 僖公》 — https://zh.wikisource.org/wiki/春秋左氏傳/僖公</p></article></main></div></div>
