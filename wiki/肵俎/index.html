    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 肵俎</nav></header><main><article><h1>肵俎</h1><p>祭祀專用之俎，載心舌以祭。</p><p>肵俎者，祭祀專用之祭器也。禮之初，佐食遷肵俎于阼階西，西縮，陳於羊俎之北。主人羞肵俎，升自阼階，置於膚北。上利升牢心舌，載於肵俎。心皆安下切上，午割勿沒；舌皆切本末，亦午割勿沒；其載於俎，橫之。末在上。又升羊右胖、豕右胖，載於俎，各有定制。肵俎之設，所以進食於尸，而尸授之於佐食以祭，蓋表主人致享之誠敬也。</p><p><strong>所出</strong>：《儀禮 · 少牢饋食禮》 — https://zh.wikisource.org/wiki/儀禮/少牢饋食禮</p></article></main></div></div>
