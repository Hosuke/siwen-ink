    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 後王之成名</nav></header><main><article><h1>後王之成名</h1><p>後王循三代之名而定法制，使民知所從。</p><p>後王之成名，乃循三代之舊名而立當世之名實也。[[刑名從商]]，[[爵名從周]]，[[文名從禮]]，散名加於萬物者，則從諸夏之成俗曲期；遠方異俗之鄉，則因之而為通。此[[三名之樞要]]之首務也。</p><p>王者之制名，名定而實辨，道行而志通，則慎率民而一焉。析辭擅作名以亂正名者，其罪猶為符節度量之罪也。聖王沒，名守慢，奇辭起，名實亂，是非之形不明。若有王者起，必將有循於舊名，有作於新名。</p><p><strong>所出</strong>：《荀子 · 正名篇》 — https://zh.wikisource.org/wiki/荀子/正名篇</p></article></main></div></div>
