    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 下玄玄母</nav></header><main><article><h1>下玄玄母</h1><p>下玄玄母叔火王，字右回光，七神之一，主陰神之往來。</p><p>下玄玄母者，七神之一也。叔火王，字右回光，主陰神往來之門。</p><p>經云七神守兆本命之根，而玄母與上玄元父相對為陰陽之父母。存想其形，與元父同列，侍立六人。誦此章者，口吸蓮華神雲咽津，先念元父，次玄母，各咽一過。蓋元父主陽，玄母主陰，陰陽和合，胞胎乃開。</p><p><strong>所出</strong>：《上清大洞真經 · 35章》 — https://zh.wikisource.org/wiki/上清大洞真經/35章</p></article></main></div></div>
