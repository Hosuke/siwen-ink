    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 孔子不言舜冠</nav></header><main><article><h1>孔子不言舜冠</h1><p>孔子不言舜冠，以古王者務德好生，不尚冠冕之末。</p><p>哀公問舜冠於孔子，孔子三問不對。哀公問何以不言，孔子答曰：「古之王者，有務而拘領者矣，其政好生而惡殺焉，是以鳳在列樹，麟在郊野，烏鵲之巢可附而窺也。君不此問而問舜冠，所以不對也。」言古聖王之治在德不在飾。</p><p><strong>所出</strong>：《荀子 · 哀公篇》 — https://zh.wikisource.org/wiki/荀子/哀公篇</p></article></main></div></div>
