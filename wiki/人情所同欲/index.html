    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 人情所同欲</nav></header><main><article><h1>人情所同欲</h1><p>富貴人情之所同欲也，先王制禮義以分之，使各得其宜。</p><p>夫貴為天子，富有天下，是人情之所同欲也。然則從人之欲則埶不能容，物不能贍也。故先王案為之制禮義以分之，使有貴賤之等，長幼之差，知愚能不能之分，皆使人載其事而各得其宜，然後使慤禄多少厚薄之稱，是夫羣居和一之道也。</p><p><strong>所出</strong>：《荀子 · 榮辱篇》 — https://zh.wikisource.org/wiki/荀子/榮辱篇</p></article></main></div></div>
