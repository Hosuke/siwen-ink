    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 成婦禮，明婦順</nav></header><main><article><h1>成婦禮，明婦順</h1><p>昏禮成婦之後，順於舅姑、和於室人，以成絲麻布帛之事、審守委積蓋藏。</p><p>成婦禮，明婦順；又申之以著代，所以重責婦順焉也。婦順者：順於舅姑，和於室人；而後當於夫，以成絲麻布帛之事，以審守委積蓋藏。是故婦順備，而後內和理；內和理，而後家可長久也。故聖王重之。</p><p><strong>所出</strong>：《禮記 · 昏義》 — https://zh.wikisource.org/wiki/禮記/昏義</p></article></main></div></div>
