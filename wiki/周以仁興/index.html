    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 周以仁興，秦以嚴亡；周得之不純仁，秦失之不純嚴</nav></header><main><article><h1>周以仁興，秦以嚴亡；周得之不純仁，秦失之不純嚴</h1><p>駁俗儒僅歸功過於仁與嚴之一端</p><p>俗儒徒聞周以仁興，秦以嚴亡，而未覺周所以得之不純仁，而秦所以失之不獨嚴也。昔周用肉刑，刖足劓鼻。盟津之令，後至者斬，畢力賞罰，誓有孥戮。考其所為，未盡仁也。及其叔世，罔法玩文，人主苛虐，號令不出宇宙，禮樂征伐，不復由己。群下力競，還為長蛇。伐本塞源，毀冠裂冕，或沈之於漢，或流之一彘。失柄之敗，由於不嚴也。</p><p><strong>所出</strong>：《抱朴子 · 卷14》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷14</p></article></main></div></div>
