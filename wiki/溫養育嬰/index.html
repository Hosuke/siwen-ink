    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 溫養育嬰</nav></header><main><article><h1>溫養育嬰</h1><p>聖胎既成，溫養保顧，如龍養珠、如母育子，不可頃刻暫忘。</p><p>聖胎既圓，須藏以玄玄，守以默默。始則藉坤母黃芽以育之，繼則聚天地生意以哺之。</p><p>鐘離翁曰：「孩兒幼小未成人，須藉坤娘養育恩。」「已證無為自在心，更須溫養保全真。」</p><p>溫養之際，當密守關元，無令外緣六塵魔賊所侵，內結煩惱姧臣所亂。若坐若臥，常施瑩淨之功；時止時行，廣運修持之力。遂得六門不漏、一道常通，真體如如永固丹基。</p><p>如龍養珠，如母育子，不可頃刻暫忘，刹那失照。</p><p><strong>所出</strong>：《性命圭旨 · 貞集》 — https://zh.wikisource.org/wiki/性命圭旨/貞集</p></article></main></div></div>
