    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 敬敷五教</nav></header><main><article><h1>敬敷五教</h1><p>契敷五教于天下，父子有親，君臣有義，夫婦有別，長幼有序，朋友有信。</p><p>舜命[[司徒]]：「百姓不親，五品不遜。汝作司徒，敬敷五教，在寬。」五教者，父義、母慈、兄友、弟恭、子孝也。敬敷者，不迫疾也；在寬者，容民之過也。教以德化，非以刑驅也。</p><p><strong>所出</strong>：《尚書 · 舜典》 — https://zh.wikisource.org/wiki/尚書/舜典</p></article></main></div></div>
