    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 九皇</nav></header><main><article><h1>九皇</h1><p>天皇九子，號九皇，瓊林玉蕊，亭亭森森。</p><p>九皇者，斗姆元尊所生聖嗣九頭也。母居西洲天竺，持書戊已之宮，實養金胎之室，一團神氣，三次超脫，爲生聖嗣九頭。長曰天英，是爲人皇，後陞玉眞仙靈。二曰天任，三曰天柱，四曰天心，五曰天禽，六曰天輔，七曰天冲，八曰天芮，九曰天蓬。瓊林玉蕊，亭亭森森，是爲九子，是號九皇。人皇與羣季分治九州，稱居方氏，仁風灝蕩，普惠羣生。九皇昇舉，子母同居。斗姆視之，鸿鈞在手，掌握斗樞。奉持其法，可離死生，可悉玄因。</p><p><strong>所出</strong>：《張三丰先生全集 · 卷7》 — https://zh.wikisource.org/wiki/張三丰先生全集/卷7</p></article></main></div></div>
