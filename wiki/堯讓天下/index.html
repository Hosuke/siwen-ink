    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 堯讓天下</nav></header><main><article><h1>堯讓天下</h1><p>堯讓天下於許由，許由逃之；湯讓天下於務光，務光怒之。</p><p>堯與許由天下，許由逃之；湯與務光，務光怒之；紀他聞之，帥弟子而踆於窾水，諸侯吊之，三年，申徒狄因以踣河。</p><p>天下之尊，人所共趨也。而許由不受，務光不取，[[申徒狄]] 聞風而立行，皆不以軒冕為貴。此[[大宗師]] 所謂「若狐不偕、務光所居」之意，皆至人[[乘物以游心]] 之象也。天下之重器，非大知大德者不能承；而至人之志，在乎自得，非區區天下之利所能動。</p><p><strong>所出</strong>：《莊子 · 外物》 — https://zh.wikisource.org/wiki/莊子/外物</p></article></main></div></div>
