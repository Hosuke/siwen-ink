    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 爾雅</nav></header><main><article><h1>爾雅</h1><p>孔徒所纂，詩書之襟帶，義訓古今之典。</p><p>《爾雅》者，孔徒之所纂，而《詩》《書》之襟帶也。《雅》以淵源誥訓，該舊而知新，亦可以屬文。《倉頡》者，李斯之所輯，而鳥籀之遺體也。《頡》以苑囿奇文，異體相資，如左右肩股。</p><p><strong>所出</strong>：《文心雕龍 · 練字》 — https://zh.wikisource.org/wiki/文心雕龍/練字</p></article></main></div></div>
