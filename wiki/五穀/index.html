    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五穀為民食所仰</nav></header><main><article><h1>五穀為民食所仰</h1><p>食為民天，農為國本。</p><p>子墨子曰：「凡五穀者，民之所仰也，君之所以為養也。故民無仰則君無養，民無食則不可事。」</p><p>五穀盡收，則五味盡御於主；不盡收，則不盡御。一穀不收謂之饉，二穀不收謂之旱，三穀不收謂之凶，四穀不收謂之餽，五穀不收謂之饑。</p><p>歲凶饑之際，畜種菽粟不足以食之，大臣不足以事之，賞賜不能喜，誅罰不能威。此 [[七患]] 之末也。</p><p>故治國者當 [[財不足則反之時]]，務使 [[國無三年之食]]，乃可備 [[歲饉]]。</p><p><strong>所出</strong>：《墨子 · 七患》 — https://zh.wikisource.org/wiki/墨子/七患</p></article></main></div></div>
