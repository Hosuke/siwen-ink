    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 小善必為細惡必去</nav></header><main><article><h1>小善必為細惡必去</h1><p>善惡虽微，不可不謹。</p><p>是以小善雖無大益，而不可不為；細惡雖無近禍，而不可不去也。</p><p><strong>所出</strong>：《抱朴子 · 卷05》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷05</p></article></main></div></div>
