    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 萬物恃道</nav></header><main><article><h1>萬物恃道</h1><p>萬物皆賴道而生，道不辭讓</p><p>萬物恃道而生，道不辭其功；事成而不名其有。衣養萬物，化育群生，不以為主，常無私欲。功成不名有者，非不能有其功也，不自有之也。是為玄德，生物而不有，成物而不居，萬物皆得其用而莫知其所自來。</p><p><strong>所出</strong>：《道德經 (王弼本) · 三十四章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
