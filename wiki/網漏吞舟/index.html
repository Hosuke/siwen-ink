    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 網漏呑舟</nav></header><main><article><h1>網漏呑舟</h1><p>網法疏闊，大姦得脫。喻治尚寬簡。</p><p>太史公述漢初破觚為圜、斲雕為樸，-{云}-「網漏-{於}-呑舟之魚」。呑舟之大魚，謂大姦巨惡也。言漢初法令疏闊，而吏治烝烝，黎民艾安；治道之要，在彼不在此也。</p><p><strong>所出</strong>：《史記 · 卷122》 — https://zh.wikisource.org/wiki/史記/卷122</p></article></main></div></div>
