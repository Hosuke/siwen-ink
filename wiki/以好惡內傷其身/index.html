    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以好惡內傷其身</nav></header><main><article><h1>以好惡內傷其身</h1><p>情起於好惡，好惡妄作，則內傷其身。</p><p>莊子與惠子辯無情，惠子問：「人而無情，何以謂之人？」莊子曰：「是非吾所謂情也。吾所謂無情者，言人之不以好惡內傷其身，常因自然而不益生也。」</p><p><strong>所出</strong>：《莊子 · 德充符》 — https://zh.wikisource.org/wiki/莊子/德充符</p></article></main></div></div>
