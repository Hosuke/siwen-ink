    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 靈星</nav></header><main><article><h1>靈星</h1><p>主司農事之星神</p><p>《詩經·絲衣》毛亨傳云：「靈星之尸也。」靈星者，天田之星，主歲成功之事。天子祭靈星，所以祈農事、報秋成，示崇本務農之義也。</p><p><strong>所出</strong>：《詩經 · 絲衣》 — https://zh.wikisource.org/wiki/詩經/絲衣</p></article></main></div></div>
