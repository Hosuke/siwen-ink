    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 人之所以異於禽獸者幾希</nav></header><main><article><h1>人之所以異於禽獸者幾希</h1><p>人禽之別，在於仁義，其分也微。</p><p>孟子曰：「人之所以異於禽獸者幾希，庶民去之，君子存之。舜明於庶物，察於人倫，由仁義行，非行仁義也。」人與禽獸之異，僅在於此幾希之間。庶民日遠之，君子日存之。存之如何？非刻意行仁義，乃由仁義之本性自然而行，如舜之所以為舜也。</p><p><strong>所出</strong>：《孟子 · 離婁下》 — https://zh.wikisource.org/wiki/孟子/離婁下</p></article></main></div></div>
