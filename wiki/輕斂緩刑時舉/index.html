    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 輕斂緩刑時舉</nav></header><main><article><h1>輕斂緩刑時舉</h1><p>輕斂則人知所養，緩刑則人免於死，時舉則人不傷勞。</p><p>管子明言三者之弊：「人甚憂飢，而稅斂重。人甚懼死，而刑政險。人甚傷勞，而上舉事不時。」遂以輕斂對飢、緩刑對死、時舉對傷勞，三者皆本乎愛民之心。桓公用之，令百官削方墨筆，翌日朝於太廟，定令百吏，使稅者百一鍾，孤幼不刑，澤梁時縱，關譏而不征，市書而不賦，近者示之以忠信，遠者示之以禮義。行之數年，民歸之如流水。</p><p><strong>所出</strong>：《管子 · 第22篇霸形》 — https://zh.wikisource.org/wiki/管子/第22篇霸形</p></article></main></div></div>
