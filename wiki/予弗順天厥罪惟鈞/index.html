    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 予弗順天，厥罪惟鈞</nav></header><main><article><h1>予弗順天，厥罪惟鈞</h1><p>不順天而行誅，罪與紂均。</p><p>予弗順天，厥罪惟鈞。</p><p>鈞，等也。我若不順天而伐商，是與紂同罪也。言恭行天罰，乃順天之事，不敢後也。</p><p><strong>所出</strong>：《尚書 · 泰誓上》 — https://zh.wikisource.org/wiki/尚書/泰誓上</p></article></main></div></div>
