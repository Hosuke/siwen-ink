    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 爾酒既旨爾殽既嘉</nav></header><main><article><h1>爾酒既旨爾殽既嘉</h1><p>酒旨殽嘉，言燕享之物豐美，以興親親之意。</p><p>爾酒既旨、爾殽既嘉，又言既時、既阜，遞進其盛。此燕享之具，乃所以合[[兄弟匪他]]之情也。[[豈伊異人]]？[[兄弟甥舅]]耳。酒殽之美非以待外人，正以親同姓也。</p><p><strong>所出</strong>：《詩經 · 頍弁》 — https://zh.wikisource.org/wiki/詩經/頍弁</p></article></main></div></div>
