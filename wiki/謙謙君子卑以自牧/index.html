    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 謙謙君子卑以自牧</nav></header><main><article><h1>謙謙君子卑以自牧</h1><p>謙卦初六以卑下自養，君子之始也。</p><p>初六謙謙君子，用涉大川吉。謙謙者，卑以下人，謙而又謙。卑以自牧，養其德而不矜。
<strong>所出</strong>：《周易註 (王弼) · 卷02》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷02</p></article></main></div></div>
