    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天無愛惡</nav></header><main><article><h1>天無愛惡</h1><p>天無私覆，生殺皆自然，無愛憎厚薄。</p><p>天無不覆，有生有殺，而天無愛惡。日無不照，有妍有醜，而日無厚薄。</p><p><strong>所出</strong>：《關尹子 · 3》 — https://zh.wikisource.org/wiki/關尹子/3</p></article></main></div></div>
