    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 朱家脫季布</nav></header><main><article><h1>朱家脫季布</h1><p>朱家匿季布於轘轅東，成功則去，終身不見，其義高矣。</p><p>朱家者，與高祖同時。魯人皆以儒教，而朱家用俠聞。所藏活豪士以百數，其餘庸人不可勝言。然終不伐其能，歆其德，諸所嘗施，唯恐見之。既陰脫季布將軍之阸，及布尊貴，終身不見也。</p><p><strong>所出</strong>：《史記 · 卷124》 — https://zh.wikisource.org/wiki/史記/卷124</p></article></main></div></div>
