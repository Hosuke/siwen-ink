    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 陸賈遊漢廷</nav></header><main><article><h1>陸賈遊漢廷</h1><p>陸賈以智謀獲陳平厚遺，往來公卿間，名聲大著。</p><p>及誅諸呂，立孝文帝，陸生頗有力焉。孝文帝欲使人之上林。陳丞相等言陸生為太中大夫，往使尉他。</p><p>而陳平以奴婢百人，車馬五十乘，錢五百萬，遺陸生為飲食費。陸生以此游漢廷公卿閒，名聲藉甚。竟以壽終。</p><p><strong>所出</strong>：《史記 · 卷097》 — https://zh.wikisource.org/wiki/史記/卷097</p></article></main></div></div>
