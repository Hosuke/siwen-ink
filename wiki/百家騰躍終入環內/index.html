    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 百家騰躍，終入環內</nav></header><main><article><h1>百家騰躍，終入環內</h1><p>諸子百家馳騁文苑，終不出六經之範圍</p><p>論說辭序，《易》統其首；詔策章奏，《書》發其源；賦頌歌讚，《詩》立其本；銘誄箴祝，《禮》總其端；紀傳盟檄，《春秋》為根；並窮高以樹表，極遠以啟疆。所以百家騰躍，終入環內。稟經以製式，酌雅以富言，是即山而鑄銅，煮海而為鹽也。</p><p><strong>所出</strong>：《文心雕龍 · 宗經》 — https://zh.wikisource.org/wiki/文心雕龍/宗經</p></article></main></div></div>
