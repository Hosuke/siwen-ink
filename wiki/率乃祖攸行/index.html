    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 率乃祖攸行</nav></header><main><article><h1>率乃祖攸行</h1><p>遵循祖道，依前王之所行以為法也。</p><p>伊尹告太甲以正事之道，曰「率乃祖攸行」。言為嗣王者，當遵守先王之軌跡，不敢逾越也。先王宅師，貽厥孫謀，基緒之承，在乎率由。祖道既正，則天命可享，萬邦以寧；祖道若違，則覆轍在前，殃咎隨至。此古之聖王所以垂範後嗣者也。</p><p><strong>所出</strong>：《尚書 · 太甲上》 — https://zh.wikisource.org/wiki/尚書/太甲上</p></article></main></div></div>
