    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 請</nav></header><main><article><h1>請</h1><p>道之真情，誠實不妄。</p><p>[[請]]，[[老子 (帛書本)]] 用字。[[老子 (帛書本) · 章二十一]] 云：「幽呵鳴呵，中有請也，其請甚真，其中有信。」</p><p>[[請]]者，情之借字，謂道之情狀真實不妄也。其[[信]]亦在是焉。自古及今，道之理不易，故[[其名不去]]。</p><p>通行本此字作「情」，[[老子 (帛書本)]] 作「請」，文異而義同。</p><p><strong>所出</strong>：《老子 (帛書本) · 章二十一》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
