    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 山上有水</nav></header><main><article><h1>山上有水</h1><p>水蓄山上，不能流通，蹇之象也。</p><p>蹇之象曰「山上有水，蹇」。水性流下，今在山上，則停蓄而不通，此蹇之所以得名也。君子觀之，悟處艱難之時，當靜以待之，不可躁進。</p><p>《易》中又有「水洊至」「水在火上」之象，義各不同，不可不辨也。</p><p><strong>所出</strong>：《周易 · 蹇》 — https://zh.wikisource.org/wiki/周易/蹇</p></article></main></div></div>
