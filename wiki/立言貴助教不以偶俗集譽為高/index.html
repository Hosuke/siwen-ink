    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 立言者貴於助教不以偶俗集譽為高</nav></header><main><article><h1>立言者貴於助教不以偶俗集譽為高</h1><p>立言之本在助教，不在媚俗求名</p><p>抱朴子明立言之旨曰：夫制器者珍於周急，立言者貴於助教。[[阿順諂諛]]虛美隱惡者，豈[[匡失弼違]][[醒迷補過]]者哉？余「不忍違情曲筆錯濫真偽」，欲令心口相契。若夫[[否泰有命通塞聽天]]，何必[[書行言用]][[榮及當年]]乎？</p><p><strong>所出</strong>：《抱朴子 · 卷42》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷42</p></article></main></div></div>
