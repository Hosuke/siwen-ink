    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 荷蓧丈人</nav></header><main><article><h1>荷蓧丈人</h1><p>孔子遇荷蓧丈人，丈人譏孔子不勤四體。</p><p>他日，子路行，遇荷蓧丈人，曰：「子見夫子乎？」丈人曰：「四體不勤，五穀不分，孰為夫子！」植其杖而芸。子路以告孔子，孔子曰：「隱者也。」復往，則亡。此荷蓧丈人譏孔子之事也。</p><p><strong>所出</strong>：《史記 · 卷047》 — https://zh.wikisource.org/wiki/史記/卷047</p></article></main></div></div>
