    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 入事人</nav></header><main><article><h1>入事人</h1><p></p><p>小國不過欲入事人。</p><p>入事者，入而臣事之也。小國之欲，非屈服也，欲入而臣事大國，使有所庇也。[[大邦以下小邦則取小邦]]者，大國虛己焉；小國入事之，使上下相安也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 六十一章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
