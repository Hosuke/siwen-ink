    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 吳師居麇</nav></header><main><article><h1>吳師居麇</h1><p>吳師居麇地，楚師焚之，吳師再敗。</p><p>秦師又敗吳師。吳師居麇，子期將焚之。子西曰：「父兄親暴骨焉，不能收，又焚之，不可。」子期曰：「國亡矣。死者若有知也，可以歆舊祀，豈憚焚之。焚之而又戰，吳師敗。」又戰于公婿之谿，吳師大敗。吳子乃歸。</p><p><strong>所出</strong>：《春秋左氏傳 · 定公》 — https://zh.wikisource.org/wiki/春秋左氏傳/定公</p></article></main></div></div>
