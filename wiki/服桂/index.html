    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 服桂</nav></header><main><article><h1>服桂</h1><p>桂合蔥涕或竹瀝服之，七年能步行水上，長生不死。</p><p>桂可以蔥涕合蒸作水，可以竹瀝合餌之，亦可以先知君腦，或雲龜，和服之，七年能步行水上，長生不死也。</p><p><strong>所出</strong>：《抱朴子 · 卷11》 — https://zh.wikisource.org/wiki/抱朴子/卷11</p></article></main></div></div>
