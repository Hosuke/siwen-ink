    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 操築而不值武丁，抱竿而不遇西伯</nav></header><main><article><h1>操築而不值武丁，抱竿而不遇西伯</h1><p>賢才遇合之難，喻巧者不遇聖主。</p><p>「操築而不值武丁，抱竿而不遇西伯。」言傅說身為刑徒，操版築以為苦役，而未遇武丁之知；姜尚垂竿於渭濱，而未遇西伯之聘。皆喻賢才雖有濟世之能，苟不遇其時其主，終老無用武之地也。</p><p><strong>所出</strong>：《抱朴子 · 卷50》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷50</p></article></main></div></div>
