    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 郭解姊子被殺</nav></header><main><article><h1>郭解姊子被殺</h1><p>郭解姊子負解之勢彊灌人，人怒殺之，解竟以為公殺之固當，不罪其人。</p><p>解姊子負解之勢，與人飲，使之嚼。非其任，彊必灌之。人怒，拔刀刺殺解姊子，亡去。解姊怒曰：「以翁伯之義，人殺吾子，賊不得。」棄其尸於道，弗葬，欲以辱解。解使人微知賊處。賊窘自歸，具以實告解。解曰：「公殺之固當，吾兒不直。」遂去其賊，罪其姊子，乃收而葬之。諸公聞之，皆多解之義，益附焉。</p><p><strong>所出</strong>：《史記 · 卷124》 — https://zh.wikisource.org/wiki/史記/卷124</p></article></main></div></div>
