    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 虛空觀</nav></header><main><article><h1>虛空觀</h1><p>以心之虛空通於身、天、地、太空，虛虛相通以合太虛之法。</p><p>虛空觀者，先觀自心。心本不生，自性成就，本來空寂，光明遍照，猶如虛空瑩徹，清淨廓然，周遍圓明，皎潔成大月輪，量等虛空。</p><p>複應觀察自身：心之虛空通於身之虛空，身之虛空通於天地之虛空，天地之虛空通於太極之虛空。虛虛相通，共成一片，與太虛混而為一。</p><p>始而虛其心，既而虛其身，又既而虛天地；虛而無虛，無虛而虛，虛也不知，無虛也不知，則陽神沖虛出入無障礙矣。然後方可與天地合德、太虛同體。</p><p><strong>所出</strong>：《性命圭旨 · 貞集》 — https://zh.wikisource.org/wiki/性命圭旨/貞集</p></article></main></div></div>
