    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 刎頸之交</nav></header><main><article><h1>刎頸之交</h1><p>廉頗與藺相如和解，定為刎頸之交。</p><p>廉頗聞相如之言，肉袒負荊，因賓客至相如門謝罪，曰：「鄙賤之人，不知將軍寬之至此也。」卒相與驩，爲刎頸之交。</p><p><strong>所出</strong>：《史記 · 卷081》 — https://zh.wikisource.org/wiki/史記/卷081</p></article></main></div></div>
