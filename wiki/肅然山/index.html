    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 肅然山</nav></header><main><article><h1>肅然山</h1><p>封禪後禪於泰山下阯東北肅然山，如祭后土之禮。</p><p>封[[泰山]]下東方，明日，下陰道。丙辰，禪泰山下阯東北肅然山，如祭后土禮。天子皆親拜見，衣上黃而盡用樂焉。江淮閒一茅三脊為神藉。五色土益雜封。封禪祠，其夜若有光，晝有白雲起封中。</p><p><strong>所出</strong>：《史記 · 卷012》 — https://zh.wikisource.org/wiki/史記/卷012</p></article></main></div></div>
