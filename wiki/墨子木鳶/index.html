    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 墨子木鳶</nav></header><main><article><h1>墨子木鳶</h1><p>譏巧而不實者，貴有用賤無益</p><p>墨子為木鳶，三年而成，蜚一日而敗。弟子以為巧，墨子曰：「不如為車輗者巧也。用咫尺之木，不費一朝之事，而引三十石之任，致遠力多。今我為鳶，三年成，蜚一日而敗，是則巧而不實，無益於用也。」是以聖人貴有用賤無益，寧為輗而弗為鳶。</p><p><strong>所出</strong>：《韓非子 · 外儲說左上》 — https://zh.wikisource.org/wiki/韓非子/外儲說左上</p></article></main></div></div>
