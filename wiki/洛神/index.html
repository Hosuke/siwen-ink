    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 洛神</nav></header><main><article><h1>洛神</h1><p>洛神之賦虛用濫形，孌彼神明而非其類</p><p>孌彼洛神，既非[[罔兩]]；惟此水師，亦非[[魑魅]]。洛神本水神之正，而加以罔兩魑魅之狀，是虛用濫形，不察其類之正也。[[宓妃]]亦然，屈原作〈離騷〉以宓妃喻志，而揚雄《羽獵》乃鞭宓妃以饟屈原，乖刺甚矣。</p><p><strong>所出</strong>：《文心雕龍 · 夸飾》 — https://zh.wikisource.org/wiki/文心雕龍/夸飾</p></article></main></div></div>
