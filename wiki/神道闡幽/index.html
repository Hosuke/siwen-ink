    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 神道闡幽</nav></header><main><article><h1>神道闡幽</h1><p>神道幽微，天命因瑞應而顯，聖人則之以制經。</p><p>夫神道闡幽，天命微顯。馬龍出而大《易》興，神龜見而《洪范》燿。</p><p>河出圖，洛出書，聖人則之，聖人本是以作《易》，非緯可配經也。原夫圖籙之見，乃昊天休命，事以瑞聖，義非配經。</p><p>故河不出圖，夫子有歎，如或可造，無勞喟然。</p><p><strong>所出</strong>：《文心雕龍 · 正緯》 — https://zh.wikisource.org/wiki/文心雕龍/正緯</p></article></main></div></div>
