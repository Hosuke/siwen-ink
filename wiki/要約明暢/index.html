    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 要約明暢</nav></header><main><article><h1>要約明暢</h1><p>注釋之善，在於簡要扼要，明晰通暢。</p><p>若毛公之訓《詩》，安國之傳《書》，鄭君之釋《禮》，王弼之解《易》，要約明暢，可為式矣。[[通人惡煩羞學章句]]，故善注者貴乎[[要約明暢]]而已。</p><p><strong>所出</strong>：《文心雕龍 · 論說》 — https://zh.wikisource.org/wiki/文心雕龍/論說</p></article></main></div></div>
