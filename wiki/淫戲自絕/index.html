    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 淫戲自絕</nav></header><main><article><h1>淫戲自絕</h1><p>惟王淫戲，是自絕于先王、自絕于天。</p><p>「非先王不相我後人，惟王淫戲用自絕。」言非先王不佑助子孫，乃在位之王荒淫戲樂，自取滅亡。此為天棄之根本原因。</p><p><strong>所出</strong>：《尚書 · 西伯戡黎》 — https://zh.wikisource.org/wiki/尚書/西伯戡黎</p></article></main></div></div>
