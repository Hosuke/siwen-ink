    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 清人在彭</nav></header><main><article><h1>清人在彭</h1><p>詠清地之卒守河上而翱翔以嬉，刺高克之師久暴師旅而不罷歸。</p><p>清人，清地之卒也。鄭文公惡高克之為人，使將兵禦狄于竟，久而不召，衆散而歸，高克奔陳。此詩作焉。</p><p>首章云「清人在彭」，刺其屯師河上，無所事事，駟馬甲士赫然可觀，而翱翔自如，不圖戎事也。卒章言「左旋右抽，中軍作好」，蓋外飾其容而中無實用，以刺師旅之不整、將帥之佚遊也。</p><p>是詩以「清人在彭」發端，總言師旅屯戍河上之狀，而刺文公用人不以其道，置將于邊，久而不察，至於衆散師亡而後已。</p><p><strong>所出</strong>：《詩經 · 清人》 — https://zh.wikisource.org/wiki/詩經/清人</p></article></main></div></div>
