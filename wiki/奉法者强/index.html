    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 奉法者强</nav></header><main><article><h1>奉法者强</h1><p>法治明則國昌，棄法則國亡。</p><p>國之有度，係於奉法之明闇。奉法者强，則國强；奉法者弱，則國弱。荊莊王並國二十六，開地三千里，而荊以亡；齊桓公並國三十，啓地三千里，而齊以亡；燕襄、魏安釐亦然。皆非地之罪，在釋國法而私其外，譬如負薪而救火，亂弱甚矣。</p><p><strong>所出</strong>：《韓非子 · 有度》 — https://zh.wikisource.org/wiki/韓非子/有度</p></article></main></div></div>
