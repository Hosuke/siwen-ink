    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蒹葭</nav></header><main><article><h1>蒹葭</h1><p>蒹者無雕，葭者未秀，生於水涘，秋風白露，君子慕人之象也。</p><p>蒹，茀藜也，葉似芦而狹，葉下有毛。葭，蘆之初生者，亦細弱也。蒹葭生於水澤，秋時茂盛，白露既降，蒼蒼而黃。詩人以興「所謂伊人，在水一方」之思。蒹葭在水，望之不遠，求之卻艱，正可比君子所慕之人，宛在中央而不可即也。</p><p><strong>所出</strong>：《詩經 · 蒹葭》 — https://zh.wikisource.org/wiki/詩經/蒹葭</p></article></main></div></div>
