    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 為萬事之先</nav></header><main><article><h1>為萬事之先</h1><p>天地隂陽之道為萬事之先，是謂圓方之門戸。</p><p>此天地隂陽之道，而說人之法也，爲萬事之先，是謂圓方之門戸。</p><p><strong>所出</strong>：《鬼谷子 · 卷01》 — https://zh.wikisource.org/wiki/鬼谷子/卷01</p></article></main></div></div>
