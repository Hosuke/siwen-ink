    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 腎風</nav></header><main><article><h1>腎風</h1><p>腎虛受風，水氣內盛，面浮腫，妨礙月事。</p><p>有病腎風者，面胕痝然，壅害於言。虛不當刺，不當刺而刺，後五日其氣必至。</p><p>至必少氣時熱，時熱從胸背上至頭，汗出，手熱，口乾苦渴，小便黃，目下腫，腹中鳴，身重難以行，月事不來，煩而不能食，不能正偃，正偃則欬。邪之所湊，其氣必虛，陰虛者，陽必湊之。胞脈者屬心而絡於胞中，今氣上迫肺，心氣不得下通，故月事不來也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第九卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第九卷</p></article></main></div></div>
