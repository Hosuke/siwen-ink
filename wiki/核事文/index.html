    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 核事文</nav></header><main><article><h1>核事文</h1><p>核事異同，疑誤不失</p><p>書有三等：一曰[[神道書]]，精一不離，實守本根；二曰核事文，核事異同，疑誤不失；三曰[[浮華記]]，浮華不實，錯亂常用。</p><p>[[太平]]之經，乃神道書之正，核事文次之。</p><p><strong>所出</strong>：《太平經 · 01》 — https://zh.wikisource.org/wiki/太平經/01</p></article></main></div></div>
