    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 左不攻于左</nav></header><main><article><h1>左不攻于左</h1><p>左之將士，若不攻左，則為不恭命。</p><p>軍制有左右，行列有序。左之將士，左行而不攻，是慢軍令也。[[賞罰以信]]，令在必行。</p><p><strong>所出</strong>：《尚書 · 甘誓》 — https://zh.wikisource.org/wiki/尚書/甘誓</p></article></main></div></div>
