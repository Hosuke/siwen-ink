    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不我以</nav></header><main><article><h1>不我以</h1><p>拒而不納，決而不返。</p><p>《江有汜》首章云「江有汜，子歸，不我以」。</p><p>「不我以」者，不攜我以俱行也。子之歸也毅然，而女子之不與焉。不以者，非不能也，不肯也。</p><p>後世解詩者有「女子遭男子拋棄」「男子遭女子拋棄」二說，而「不我以」「不我與」「不我過」三句之義則一：不問其所遇者為誰，被遺棄者之哀怨則古今一轍也。</p><p><strong>所出</strong>：《詩經 · 江有汜》 — https://zh.wikisource.org/wiki/詩經/江有汜</p></article></main></div></div>
