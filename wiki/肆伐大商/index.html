    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 肆伐大商</nav></header><main><article><h1>肆伐大商</h1><p>大行誅伐，以建周邦。</p><p>長子維行，篤生武王。保右命爾，燮伐大商。</p><p>肆，急也。伐，誅也。言武王受天命，急往伐商也。保右，保育也。燮，變也，變亂之使之和順也。言天命武王，往伐大商，以拯救天下也。[[天難忱斯]]言天命之可畏，此言天命之既定；天鑒于有德，文王[[明明德]]而下歸之，武王遂以[[造舟為梁|伐商]]定天下。</p><p><strong>所出</strong>：《詩經 · 大明》 — https://zh.wikisource.org/wiki/詩經/大明</p></article></main></div></div>
