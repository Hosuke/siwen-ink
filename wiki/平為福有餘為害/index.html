    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 平為福有餘為害</nav></header><main><article><h1>平為福有餘為害</h1><p>知足則平，平則為福；有餘而不知止，反足為害。</p><p>知和曰：「平為福，有餘為害者，物莫不然，而財其甚者也。」</p><p>知和以此言對無足之論 [[膏溺於馮氣]] 也。知足則平，平則為福；不知止而取盈，則有餘反足為害。此[[虛靜恬淡]]之旨，而[[不貴其師]]者之所以失其天真歟。</p><p><strong>所出</strong>：《莊子 · 盜跖》 — https://zh.wikisource.org/wiki/莊子/盜跖</p></article></main></div></div>
