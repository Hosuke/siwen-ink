    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 威如之吉</nav></header><main><article><h1>威如之吉</h1><p>威嚴出於誠信，反躬自省，終得其吉。</p><p>威如之吉，反身之謂，[[周易 · 家人]]上九象辭也。</p><p>上九居卦之極，陽爻剛健，有威嚴之象。其辭曰「有孚威如，終吉」，言威嚴者非徒以刑罰威人也，必本於誠信焉。有孚者，誠也；威如者，敬以行之也。以誠信為之本，以威嚴為之施，上下相信，而家道成矣。</p><p>象辭云「反身之謂」，言威嚴之所以吉者，以其能反求諸己也。不責人之服，而責己之修；不求人之感，而求己之正。修己以敬，則人自威之，此所以終吉也。</p><p><strong>所出</strong>：《周易 · 家人》 — https://zh.wikisource.org/wiki/周易/家人</p></article></main></div></div>
