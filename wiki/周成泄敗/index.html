    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 周成泄敗</nav></header><main><article><h1>周成泄敗</h1><p>周成者必有泄，隱敗者必有奸，明君闇君之辨。</p><p>周而成，泄而敗，明君無之有也。宣而成，隱而敗，闇君無之有也。故人君者，周則讒言至矣，直言反矣；小人邇而君子遠矣！詩云：「墨以為明，狐狸而蒼。」此言上幽而下險也。</p><p>君人者，宣則直言至矣，而讒言反矣；君子邇而小人遠矣！詩云：「明明在下，赫赫在上。」此言上明而下化也。</p><p><strong>所出</strong>：《荀子 · 解蔽篇》 — https://zh.wikisource.org/wiki/荀子/解蔽篇</p></article></main></div></div>
