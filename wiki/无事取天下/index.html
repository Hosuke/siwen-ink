    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 无事取天下</nav></header><main><article><h1>无事取天下</h1><p>取天下者以无事，不以有事。</p><p>老子云「以无事取天下」，无事者，無擾也。取天下不以威令，而以无事，使民自歸。與「以正之邦」「以畸用兵」三者並觀，正、畸、无事，體用備矣。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第二十章 治邦》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
