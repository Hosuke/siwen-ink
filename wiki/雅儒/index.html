    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 雅儒</nav></header><main><article><h1>雅儒</h1><p>雅儒者，法後王、隆禮義，言行有大法，知之曰知之、不知曰不知，不敢怠傲者也。</p><p>雅儒之名，出《荀子 · 儒效篇》。與俗儒對待而立。俗儒繆學盲從，雅儒則不然。</p><p>雅儒之狀云：「法後王，一制度，隆禮義而殺《詩》、《書》，其言行已有大法矣，然而明不能齊法教之所不及，聞見之所未至，則知不能類也，知之曰知之，不知曰不知，內不自以誣，外不自以欺，以是尊賢畏法而不敢怠傲。」</p><p>篇末又云：「用雅儒則千乘之國安。」</p><p><strong>所出</strong>：《荀子 · 儒效篇》 — https://zh.wikisource.org/wiki/荀子/儒效篇</p></article></main></div></div>
