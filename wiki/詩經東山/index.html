    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 詩經東山</nav></header><main><article><h1>詩經東山</h1><p>周公東征歸士所作，述征人思歸及室家之情。</p><p>《東山》，《詩經·豳風》之篇也。舊說以為周公東征三年而歸，歸士自言其情而作。其詩四章，章十二句，合四十八句。詩序分章之旨：「一章言其完也」，完，歸而完其形骸也；「二章言其思也」，思，思其室家也；「三章言其室家之望女也」，望女，室中之人望其歸也；「四章樂男女之及時也」，言婚嫁之及時，則室家之道成矣。東山之義，兼征戍之苦、思歸之情、室家之望、男女之樂，蓋變雅之正聲也。</p><p><strong>所出</strong>：《詩經 · 東山》 — https://zh.wikisource.org/wiki/詩經/東山</p></article></main></div></div>
