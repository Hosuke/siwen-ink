    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蚩尤與其大夫作亂百姓</nav></header><main><article><h1>蚩尤與其大夫作亂百姓</h1><p>述蚩尤作亂，先王誅之，以為後戒。</p><p>湯言：「昔蚩尤與其大夫作亂百姓，帝乃弗予，有狀。先王言不可不勉。」言亂臣賊子，天與先王皆不容之，後世當以為戒也。</p><p><strong>所出</strong>：《尚書 · 湯誥》 — https://zh.wikisource.org/wiki/尚書/湯誥</p></article></main></div></div>
