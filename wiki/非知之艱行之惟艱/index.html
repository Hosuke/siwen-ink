    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 非知之艱行之惟艱</nav></header><main><article><h1>非知之艱行之惟艱</h1><p>知易行難，貴在力行。</p><p>天下之事，知之非艱也。言之非艱也。行之惟艱。知而不行，與不知等。故君子貴能行之。說之言曰：「非知之艱，行之惟艱。」王忱不艱，允協于先王成德。惟說不言，有厥咎。</p><p><strong>所出</strong>：《尚書 · 說命中》 — https://zh.wikisource.org/wiki/尚書/說命中</p></article></main></div></div>
