    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 服制</nav></header><main><article><h1>服制</h1><p>衣服器用皆有度，爵祿有分，不可逾越。</p><p>度爵而制服，量祿而用財。飲食有量，衣服有制，宮室有度，六畜人徒有數，舟車陳器有禁。</p><p>脩生則有軒冕、服位、穀祿、田宅之分，死則有棺槨、絞衾、壙壟之度。雖有賢身貴體，毋其爵不敢服其服；雖有富家多資，毋其祿不敢用其財。天子服文有章，而夫人不敢以燕以饗廟。將軍大夫以朝，官吏以命，士止于帶緣。散民不敢服雜采，百工商賈不得服長鬈貂，刑餘戮民不敢服絻，不敢畜連乘車。</p><p><strong>所出</strong>：《管子 · 第04篇立政》 — https://zh.wikisource.org/wiki/管子/第04篇立政</p></article></main></div></div>
