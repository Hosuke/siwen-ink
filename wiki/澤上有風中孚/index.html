    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 澤上有風，中孚</nav></header><main><article><h1>澤上有風，中孚</h1><p>風感於澤，誠動於中，萬物應之。</p><p>象傳云「澤上有風，中孚」，澤以受風，風以動澤，感應之機在中孚也。</p><p><strong>所出</strong>：《周易 · 中孚》 — https://zh.wikisource.org/wiki/周易/中孚</p></article></main></div></div>
