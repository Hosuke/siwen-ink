    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 誠意</nav></header><main><article><h1>誠意</h1><p>意念發動之時，直臻真實，不容自欺</p><p>傳之六章記曾子之言，闡發誠意之義至為深切。</p><p>其所謂誠意者，毋自欺也。如惡惡臭，如好好色，此之謂自謙。誠於中者，形於外；故君子必慎其獨。小人閒居為不善，無所不至；見君子而後厭然，掩其不善而著其善。及其「十目所視，十手所指」，隱微之間，昭昭然而不可揜也。</p><p>富潤屋，德潤身，心廣體胖——皆誠意之效驗。此與 [[誠]] 條相承，蓋誠意乃 [[至誠盡性]] 之入手處，亦《大學》功夫之樞要也。</p><p><strong>所出</strong>：《大學》 — https://zh.wikisource.org/wiki/大學</p></article></main></div></div>
