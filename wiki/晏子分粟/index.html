    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 晏子分粟</nav></header><main><article><h1>晏子分粟</h1><p>晏子聞霖雨救荒，自分家粟以濟民，而令柏巡國致能歌者。</p><p>景公時霖雨十有七日，公日夜饮酒，不恤民困。晏子請發粟於民，三請不見許。晏子聞命柏遽致能歌者，遂分家粟於氓，致任器於陌，徒步見公，以民困告。公命趣駕追晏子不及，至康內乃遇之。晏子乃返，命稟巡氓：家有布縷之本而絕食者，使有終月之委；絕本之家，使有期年之食；無委積之氓，與之薪橑，使足以畢霖雨。令柏巡氓，家室不能禦者，予之金。三日而畢，救貧氓萬七千家，用粟九十七萬鐘。晏子之救荒，於是乎周。</p><p><strong>所出</strong>：《晏子春秋 · 卷一》 — https://zh.wikisource.org/wiki/晏子春秋/卷一</p></article></main></div></div>
