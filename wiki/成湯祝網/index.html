    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 成湯祝網</nav></header><main><article><h1>成湯祝網</h1><p>湯出見野張網，祝去三面而止，是德及禽獸之始。</p><p>湯出，見野張網四面，祝曰：「自天下四方皆入吾網。」湯曰：「嘻，盡之矣！」乃去其三面，祝曰：「欲左，左；欲右，右。不用命，乃入吾網。」諸侯聞之，曰：「湯德至矣，及禽獸。」</p><p><strong>所出</strong>：《史記 · 卷003》 — https://zh.wikisource.org/wiki/史記/卷003</p></article></main></div></div>
