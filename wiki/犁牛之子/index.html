    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 犁牛之子</nav></header><main><article><h1>犁牛之子</h1><p>賢才不拘門第</p><p>孔子論仲弓曰：「犁牛之子，騂且角；雖欲勿用，山川其舍諸？」蓋賢才出乎品質，不係乎門地，牛之為牛，不累其犢之美也。</p><p><strong>所出</strong>：《論語 · 雍也第六》 — https://zh.wikisource.org/wiki/論語/雍也第六</p></article></main></div></div>
