    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 褚小者不可以懷大</nav></header><main><article><h1>褚小者不可以懷大</h1><p>器小者不可以受大，道各有所成，形各有所適，不可損益。</p><p>孔子曰：「善哉汝問！昔者管子有言，丘甚善之，曰：『褚小者不可以懷大，綆短者不可以汲深。』夫若是者，以為命有所成而形有所適也，夫不可損益。吾恐回與齊侯言堯舜黃帝之道，而重以燧人神農之言。彼將內求於己而不得，不得則惑，人惑則死。」</p><p><strong>所出</strong>：《莊子 · 至樂》 — https://zh.wikisource.org/wiki/莊子/至樂</p></article></main></div></div>
