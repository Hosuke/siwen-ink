    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 維熊維羆</nav></header><main><article><h1>維熊維羆</h1><p>熊羆入夢，男祥之徵。</p><p>[[維熊維羆]]者，夢兆之吉也。熊羆為猛獸，象陽剛之德。古人占夢，以夢熊羆為生男之祥。大人占之，維熊維羆，乃男子之祥也。詩人以此為夢之善者，預兆子孫之盛。</p><p><strong>所出</strong>：《詩經 · 斯干》 — https://zh.wikisource.org/wiki/詩經/斯干</p></article></main></div></div>
