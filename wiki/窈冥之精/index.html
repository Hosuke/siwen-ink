    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 窈冥之精</nav></header><main><article><h1>窈冥之精</h1><p>道之精微，窈冥難測，真而且信</p><p>窈兮冥兮其中有精，其精甚真其中有信。窈者，深遠幽昧也；冥者，暗昧無形也。[[道之為物]]在於怳忽，而其深處有所謂精者存焉。精者，道之至微者也，其真不偽，其信不渝，自古及今未嘗差失。[[道有情有信]]，此精之謂也。學道者舍此[[含精養神]]，則無以入其門牖。</p><p><strong>所出</strong>：《老子河上公章句 · 虛心》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
