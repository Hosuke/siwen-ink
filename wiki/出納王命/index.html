    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 出納王命</nav></header><main><article><h1>出納王命</h1><p>秉國之鈞者當慎選人才，使賢者在位</p><p>若秉國之鈞，出納王命者，審良藥之顧眄，不令跛蹇廁騏騄，冒昧苟得，暗於自量者，慮中道之顛躓，不以駑薾服鸞衡，則何患庶績之不康，何憂四兇之不退，三皇豈足四，五帝難六哉！</p><p><strong>所出</strong>：《抱朴子 · 卷28》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷28</p></article></main></div></div>
