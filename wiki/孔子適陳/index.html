    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 孔子適陳</nav></header><main><article><h1>孔子適陳</h1><p>孔子遊陳，陳湣公六年之事；後陳亡，孔子亦卒。</p><p>湣公六年，孔子適陳。吳王夫差伐陳，取三邑而去。十三年，吳復來伐陳，陳告急楚，楚昭王來救，軍於城父，吳師去。是年，楚昭王卒於城父。時孔子在陳。</p><p>二十四年，楚惠王復國，以兵北伐，殺陳湣公，遂滅陳而有之。是歲，孔子卒。</p><p><strong>所出</strong>：《史記 · 卷036》 — https://zh.wikisource.org/wiki/史記/卷036</p></article></main></div></div>
