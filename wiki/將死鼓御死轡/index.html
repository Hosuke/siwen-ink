    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 將死鼓御死轡</nav></header><main><article><h1>將死鼓御死轡</h1><p>王者之軍制，將死旗鼓，御手執轡，百官死職。</p><p>孫卿子云：「將死鼓，御死轡，百吏死職，士大夫死行列。聞鼓聲而進，聞金聲而退，順命為上，有功次之。」令不進而進，猶令不退而退也，其罪惟均。不殺老弱，不獵禾稼，服者不禽，格者不舍，奔命者不獲。</p><p><strong>所出</strong>：《荀子 · 議兵篇》 — https://zh.wikisource.org/wiki/荀子/議兵篇</p></article></main></div></div>
