    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 支離其形</nav></header><main><article><h1>支離其形</h1><p>形體支離，反得保身終年</p><p>支離疏者，頤隱於齊，肩高於頂，會撮指天，五管在上，兩髀爲脅。挫針治繲，足以餬口；鼓筴播精，足以食十人。上徵武士，則支離攘臂於其間；上有大役，則支離以有常疾不受功；上與病者粟，則受三鍾與十束薪。夫支離其形者，猶足以養其身，終其天年，又況支離其德者乎！</p><p><strong>所出</strong>：《莊子 · 人間世》 — https://zh.wikisource.org/wiki/莊子/人間世</p></article></main></div></div>
