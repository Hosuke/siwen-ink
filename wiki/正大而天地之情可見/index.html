    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 正大而天地之情可見</nav></header><main><article><h1>正大而天地之情可見</h1><p>正直而廣大，天地之道於是見焉。</p><p>大壯之彖曰：「正大而天地之情可見矣。」大者，陽剛之盛也；正者，得其理而不偏也。天地之道，無私無枉，至正至大。人能守正而行大，則與天地合德，其情可測，其理可見。蓋正則不蔽，大則不隘，合而言之，是為聖人盡天之道也。</p><p><strong>所出</strong>：《周易 · 大壯》 — https://zh.wikisource.org/wiki/周易/大壯</p></article></main></div></div>
