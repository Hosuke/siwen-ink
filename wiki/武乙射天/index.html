    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 武乙射天</nav></header><main><article><h1>武乙射天</h1><p>武乙無道，為偶人象天神而射之，暴雷震死。</p><p>帝武乙無道，為偶人，謂之天神。與之博，令人為行。天神不勝，乃僇辱之。為革囊，盛血，卬而射之，命曰「射天」。武乙獵於河渭之閒，暴雷，武乙震死。</p><p><strong>所出</strong>：《史記 · 卷003》 — https://zh.wikisource.org/wiki/史記/卷003</p></article></main></div></div>
