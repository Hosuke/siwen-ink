    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以地正國</nav></header><main><article><h1>以地正國</h1><p>叛臣以地歸還，可貴其悔過之心，然仍以無君命而入，故書叛。</p><p>定公十三年，晉趙鞅入于晉陽以叛。冬，晉荀寅、士吉射入于朝歌以叛。旋趙鞅歸于晉，穀梁子特釋之：</p><p>「此叛也，其以歸言之，何也？貴其以地反也。貴其以地反，則是大利也？非大利也，許悔過也。許悔過，則何以言叛也？以地正國也。以地正國，則何以言叛？其入無君命也。」</p><p>叛而還，許其悔過；然無命而入，終不可以不正書之。</p><p><strong>所出</strong>：《春秋穀梁傳 · 定公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/定公</p></article></main></div></div>
