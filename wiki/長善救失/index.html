    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 長善救失</nav></header><main><article><h1>長善救失</h1><p>教育之本，在於發揚人之善端，救正人之過失。</p><p>學者有四失，教者必知之：或失則多，或失則寡，或失則易，或失則止。</p><p>多者，貪多而不能消化也；寡者，狹隘而不能旁通也；易者，忽易而不肯深思也；止者，中止而不求進步也。此四者，心之莫同也。知其心，然後能救其失。</p><p>夫善者，人之所固有也；失者，人之所易犯也。教也者，長善而救其失者也。善日長，則失日消；失日救，則善日著。教學之道，無他，揚長補短而已矣。</p><p><strong>所出</strong>：《禮記 · 學記》 — https://zh.wikisource.org/wiki/禮記/學記</p></article></main></div></div>
