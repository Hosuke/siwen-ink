    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 浮鴻山</nav></header><main><article><h1>浮鴻山</h1><p>梅福得空同仙君指授，赴浮鴻山修煉千日，丹光燭天，青鸞飛昇。</p><p>梅福歷遊諸山不得成仙，後遇空同仙君降謂曰：「汝之道綠在浮鴻山也。」</p><p>福遂至浮鴻山，結庵修煉，千日功成，神遊體外，丹光燭天。服丹訖，趣裝登途，還九江。祥光射日，紫霧浮空，雲中仙樂嘹亮。金童執節，玉女持幡，力士控鸞，侍仙捧韶。梅君拜詔謝恩，乘青鸞飛昇而去。</p><p>自後浮鴻山號曰梅仙山。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 14》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/14</p></article></main></div></div>
