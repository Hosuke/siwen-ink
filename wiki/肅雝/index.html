    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 肅雝</nav></header><main><article><h1>肅雝</h1><p>敬與和也，詩詠王姬之德。</p><p>肅，敬也；-{雝}-，和也。《何彼襛矣》首章云「曷不肅-{雝}-」，以問起興，言王姬之車何其敬而且和也。毛詩序以此詩美王姬下嫁諸侯而能執婦道，成其肅敬和睦之德。蓋「肅-{雝}-」二字為王姬之德的總括，亦周代昏禮所重之要義。</p><hr><p>「肅雝顯相」，[[詩經]]之句也。肅，敬也；雝，和也。[[清廟]]之祭，助祭之諸侯容貌肅然有敬，儀節雝然以和，故得共相大禮。[[顯相]]之義，於此可見。</p><p><strong>所出</strong>：《詩經 · 清廟》 — https://zh.wikisource.org/wiki/詩經/清廟</p></article></main></div></div>
