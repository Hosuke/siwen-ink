    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 衣裳楚楚</nav></header><main><article><h1>衣裳楚楚</h1><p>喻事物之華美終難久恃。</p><p>「衣裳楚楚」，言蜉蝣之羽翼，粲然有光，整齊可觀，以喻人之衣裳明潔也。毛傳-{云}-「楚楚，鮮明貌」。然華美之物，朝生夕斃，不能久存。詩人借此興起下文「心之憂矣」——知美之難恃，則憂自生矣。後世用「楚楚」者，多取其明整之義，如 [[衣服]] 之美、容儀之莊皆是。</p><p><strong>所出</strong>：《詩經 · 蜉蝣》 — https://zh.wikisource.org/wiki/詩經/蜉蝣</p></article></main></div></div>
