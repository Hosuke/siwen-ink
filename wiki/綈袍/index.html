    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 綈袍</nav></header><main><article><h1>綈袍</h1><p>須賈贈范睢之袍，後為范睢所赦之由。</p><p>須賈使秦，見范睢衣敝，哀之，取一綈袍以賜之。後范睢相秦，令須賈跪食草豆，以辱之。范睢言曰：「然公之所以得無死者，以綈袍戀戀，有故人之意，故釋公。」綈袍之贈，竟成赦罪之因。</p><p><strong>所出</strong>：《史記 · 卷079》 — https://zh.wikisource.org/wiki/史記/卷079</p></article></main></div></div>
