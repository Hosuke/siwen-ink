    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 說之不可不知</nav></header><main><article><h1>說之不可不知</h1><p>徑省、米鹽、略陳、廣肆，皆有過患，此說之難不可不知。</p><p>徑省其說，則以為不智而拙之；米鹽博辯，則以為多而久之。略事陳意，則曰怯懦而不尽；慮事廣肆，則曰草野而倨侮。此說之難，不可不知也。</p><p><strong>所出</strong>：《韓非子 · 說難》 — https://zh.wikisource.org/wiki/韓非子/說難</p></article></main></div></div>
