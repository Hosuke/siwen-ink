    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 姦人之所以起</nav></header><main><article><h1>姦人之所以起</h1><p>姦人之所以起，以上不貴義、不敬義也。</p><p>凡姦人之所以起者，以上之不貴義，不敬義也。夫義者，所以限禁人之為惡與姦者也。今上不貴義，不敬義，如是則天下之人百姓，皆有棄義之志，而有趨姦之心矣，此姦人之所以起也。</p><p>且上者下之師也，夫下之和上，譬之猶響之應聲，影之像形也。故為人上者，不可不順也。</p><p><strong>所出</strong>：《荀子 · 彊國篇》 — https://zh.wikisource.org/wiki/荀子/彊國篇</p></article></main></div></div>
