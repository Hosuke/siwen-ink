    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 紫虛元君</nav></header><main><article><h1>紫虛元君</h1><p>主領南方下教之籍，聞女子立志則嘉其用心，躬下降授以九華之丹。</p><p>紫虛元君主領南方下教之籍，命諸眞大仙於四海之外、六合之內、名山大川，有誌慕長生、心冥眞道者必降而教之。河中薛玄同善功為地司累奏簡在紫虛之府，紫虛元君聞女子立志，尤嘉其用心，即日將親降於此。</p><p>咸通十五年七月十四日，紫虛元君與侍女群眞二十七人降於其室，示以黃庭填神存修之旨，賜九華之丹一粒，使八年後吞之，當遣玉女飈車迎上昇焉。</p><p><strong>所出</strong>：《墉城集仙錄 · 卷08》 — https://zh.wikisource.org/wiki/墉城集仙錄/卷08</p></article></main></div></div>
