    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 漢王所以具知</nav></header><main><article><h1>漢王所以具知</h1><p>蕭何收秦圖書，故漢王具知天下阸塞、戶口多少、彊弱之處。</p><p>沛公為漢王，以何為丞相。項王與諸侯屠燒咸陽而去。漢王所以具知天下阸塞、戶口多少、彊弱之處、民所疾苦者，以何具得秦圖書也。夫圖籍者，國家之命脈也。得之則治，失之則亂。蕭何之收圖書，非苟而已，實為漢家百年之計也。</p><p><strong>所出</strong>：《史記 · 卷053》 — https://zh.wikisource.org/wiki/史記/卷053</p></article></main></div></div>
