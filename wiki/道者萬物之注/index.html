    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 道者萬物之注</nav></header><main><article><h1>道者萬物之注</h1><p>道為萬物所歸，善與不善皆賴以存。</p><p>道者，萬物之注也。善人之保，不善人之所葆。</p><p>言道之為萬物所歸趨。善人賴之而得保，不善人亦賴之而得養。言道無棄物，亦無偏人也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章六十二》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
