    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 紀季姜歸于京師</nav></header><main><article><h1>紀季姜歸于京師</h1><p>紀女嫁于周，天子娶后，正人倫之始。</p><p>桓公九年，「九年春，紀季姜歸于京師。」</p><p>紀季姜者，紀國之女也。歸于京師，為周王后。公羊傳以為天子娶后，正人倫之大事，書以見其重。</p><p><strong>所出</strong>：《春秋公羊傳 · 桓公》 — https://zh.wikisource.org/wiki/春秋公羊傳/桓公</p></article></main></div></div>
