    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 姻亞膴仕</nav></header><main><article><h1>姻亞膴仕</h1><p>以姻婭關係竊據高位之譏</p><p>詩戒執政者「式夷式已，無小人殆。瑣瑣姻亞，則無膴仕。」瑣瑣姻亞者，區區之姻親也；膴仕者，高位厚祿也。言姻婭之私，不當用以占據要津。恃其戚屬之恩而躐取顯仕，非治國之正道也。</p><p><strong>所出</strong>：《詩經 · 節南山》 — https://zh.wikisource.org/wiki/詩經/節南山</p></article></main></div></div>
