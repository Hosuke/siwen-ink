    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 虞慶詘匠</nav></header><main><article><h1>虞慶詘匠</h1><p>喻空言飾辭以屈工匠，終必敗事</p><p>虞慶為屋，謂匠人曰：「屋太尊。」匠人對曰：「此新屋也，塗濡而椽生。」虞慶曰：「不然。夫濡塗重而生椽撓，以橈椽任重塗，此宜卑。更日久，則塗乾而椽燥。塗乾則輕，椽燥則直，以直椽任輕塗，此益尊。」匠人詘，為之而屋壞。范且亦然，張弓不依法，終於折弓。夫虛辭，其無用而勝；實事，其無易而窮。是以人主多無用之辯，而少無易之言，此所以亂也。</p><p><strong>所出</strong>：《韓非子 · 外儲說左上》 — https://zh.wikisource.org/wiki/韓非子/外儲說左上</p></article></main></div></div>
