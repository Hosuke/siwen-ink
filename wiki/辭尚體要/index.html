    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 辭尚體要</nav></header><main><article><h1>辭尚體要</h1><p>言辭尚在得其體要，不貴繁多奇異。</p><p>《周書》-{云}-：「辭尚體要，弗惟好異。」蓋防文濫也。然文術多門，各適所好，明者弗授，學者弗師。於是習華隨侈，流遁忘反。若能確乎正式，使文明以健，則風清骨峻，篇體光華。辭尚體要者，言文辭當以合乎體制、切於要道為尚，不可專以好奇立異為務。體要既立，則奇辭有所節制，而不至於濫。</p><p><strong>所出</strong>：《文心雕龍 · 風骨》 — https://zh.wikisource.org/wiki/文心雕龍/風骨</p></article></main></div></div>
