    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 幽都</nav></header><main><article><h1>幽都</h1><p>地下幽冥之都，其主土伯可怖</p><p>辭曰「君無下此幽都些」，言地下幽都之不可往。土伯為之都主，「九約」、「觺觺之角」、「敦脄血拇」、「駓駓之逐」、「參目虎首」、「其身若牛」，皆言其獰厲可畏。此以見故居之安，勝於幽都之危也。</p><p><strong>所出</strong>：《楚辭 · 招䰟》 — https://zh.wikisource.org/wiki/楚辭/招䰟</p></article></main></div></div>
