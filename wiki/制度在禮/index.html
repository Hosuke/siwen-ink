    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 制度在禮</nav></header><main><article><h1>制度在禮</h1><p>制度在禮，文為在禮；行之，其在人乎？</p><p>子曰：「制度在禮，文為在禮；行之，其在人乎？」子貢越席而對曰：「敢問夔其窮與？」子曰：「古之人與？古之人也。達於禮而不達於樂，謂之素；達於樂而不達於禮，謂之偏。夫夔，達於樂而不達於禮，是以傳於此名也，古之人也。」</p><p><strong>所出</strong>：《禮記 · 仲尼燕居》 — https://zh.wikisource.org/wiki/禮記/仲尼燕居</p></article></main></div></div>
