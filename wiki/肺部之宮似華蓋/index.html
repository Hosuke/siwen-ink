    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 肺部之宮似華蓋</nav></header><main><article><h1>肺部之宮似華蓋</h1><p>肺為五臟之華蓋，象天之覆護萬物。</p><p>肺居五臟之最高處，其象如華蓋覆於諸臟之上。華蓋者，帝王車輿之上覆，以喻肺居胸膈之最高，覆護臟腑之象。經云「肺部之宮似華蓋」，言肺之位象天，覆護一身，猶華蓋之蔽風雨也。</p><p><strong>所出</strong>：《黃庭內景經 · 肺部章第九》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/肺部章第九</p></article></main></div></div>
