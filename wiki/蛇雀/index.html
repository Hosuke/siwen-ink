    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蛇雀</nav></header><main><article><h1>蛇雀</h1><p>物化之速由於忘形，見塊而不見空則人自滯。</p><p>蛇化為龜，雀化為蛤。彼忽然忘曲屈之狀，而得蹣跚之質；此倏然失飛鳴之態，而得介甲之體。斫削不能加其功，繩尺不能定其象，何化之速也。且夫當空團塊，見塊而不見空；粉塊求空，見空而不見塊。形無妨而人自妨之，物無滯而人自滯之，悲哉！</p><p><strong>所出</strong>：《化書 · 卷一》 — https://zh.wikisource.org/wiki/化書/卷一</p></article></main></div></div>
