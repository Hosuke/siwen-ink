    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 名實無當</nav></header><main><article><h1>名實無當</h1><p>名實不相當，則色彩愈章而道愈喪。兩明相持，是非莫定，此名實無當之謂也。</p><p>非正舉者，名實無當，驪色章焉，故曰兩明也。兩明而道䘮，其無有以正焉。</p><p>夫名所以命實也，實之所以然者不可以名命。然名不正則實不明，實不明則名愈飾而愈離。兩明者，各自以為是，而無有以定其實，此之謂名實無當。名實無當，則雖辨之言之，而道以之䘮矣。</p><p><strong>所出</strong>：《公孫龍子 · 4》 — https://zh.wikisource.org/wiki/公孫龍子/4</p></article></main></div></div>
