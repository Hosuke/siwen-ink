    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 其人如玉</nav></header><main><article><h1>其人如玉</h1><p>稱賢者德行溫潤純美。</p><p>「其人如玉」，詩《白駒》第四章句。言賢者操行溫潤純美，如玉之德焉。詩以白駒起興，至此直稱其人如玉，蓋美賢士之貞潔溫潤也。後世以玉比君子、德行者，皆祖此義。</p><p><strong>所出</strong>：《詩經 · 白駒》 — https://zh.wikisource.org/wiki/詩經/白駒</p></article></main></div></div>
