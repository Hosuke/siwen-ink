    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蟄蟄</nav></header><main><article><h1>蟄蟄</h1><p>聚會衆多之貌。</p><p>詩云「蟄蟄兮」。音執。言聚會之盛也。與「揖揖」義相應，揖者會聚，蟄者衆多。末章以螽斯之「揖揖」興「蟄蟄」，言子孫之多，咸萃一堂，族屬盛大而不散也。</p><p>所出：《詩經 · 螽斯》 — https://zh.wikisource.org/wiki/詩經/螽斯</p></article></main></div></div>
