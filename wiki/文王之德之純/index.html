    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 文王之德之純</nav></header><main><article><h1>文王之德之純</h1><p>稱文王德行純粹無雜</p><p>「文王之德之純」，《詩經·維天之命》之辭也。「純」者，無雜之謂，言文王之德粹然一出於正。</p><p>古人釋「不顯」為「豈不顯」，狀文王功德之光耀。《詩》以「純」許文王，而《大學》引《詩》以明[[明明德]]之義，可見「德之純」與「明德」相承。[[湯孫之緒]]美商之後，此則美周之先，皆聖德相傳之義。文王之德純而至於光顯，故能[[天下三分其二歸周]]，[[受命若斯之亟]]，天命有歸。</p><p><strong>所出</strong>：《詩經 · 維天之命》 — https://zh.wikisource.org/wiki/詩經/維天之命</p></article></main></div></div>
