    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 余代其口止叔口止脊</nav></header><main><article><h1>余代其口止叔口止脊</h1><p>厭與世俗小人同世為伍，深以交道浮雜為恥。</p><p>《抱朴子》自言其心志，以為世之交道浮雜，面而不心，雖位顯名美、門齊年敵，而趨舍異規、業尚乖互者，未嘗與結。或有矜其先達而步高視遠，或遺忽陵遲之舊好，或簡棄後門之類味，或取人以官而不論德。其得之則排冰吐華，失之則當春凋悴。抱朴子代其口止叔口止脊，恥與共世。蓋以輕合易離之徒，雖能令壤蟲雲飛、斥鷃戾天，手捉刀尺、口為禍福，終非可與久處之人也。</p><p><strong>所出</strong>：《抱朴子 · 卷16》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷16</p></article></main></div></div>
