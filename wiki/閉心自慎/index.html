    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 閉心自慎</nav></header><main><article><h1>閉心自慎</h1><p>閉塞嗜欲之心，謹慎自守，庶幾終身無過。</p><p>《橘頌》述橘之德曰：「蘇世獨立，橫而不流兮。閉心自慎，不終失過兮。」言橘之性，能離濁世而保其清，橫立水中而不隨波逐流；又能閉塞嗜欲之心，謹慎自守，故能終身不失過咎。此屈原以橘自況，表其志在固守本性，不隨污俗。</p><p><strong>所出</strong>：《楚辭 · 九章》 — https://zh.wikisource.org/wiki/楚辭/九章</p></article></main></div></div>
