    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大洞白素右元君消魔玉符</nav></header><main><article><h1>大洞白素右元君消魔玉符</h1><p>佩之以鎮下關、固魂魄、散祖殃之符籙。</p><p>大洞白素右元君消魔玉符者，以青書黃繒佩之，存呼右元君內諱名字，鎮我下關之境，使三真固魂，九靈制魄，萬神總歸，安鎮室宅，七祖解散，名言仙籍。兼叩齒三通，咽液三過。其用在乎辟除外魔、清淨下元，令身中之穢濁悉化，而祖宗之殃根皆散焉。</p><p><strong>所出</strong>：《上清大洞真經 · 24章》 — https://zh.wikisource.org/wiki/上清大洞真經/24章</p></article></main></div></div>
