    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 在城闕</nav></header><main><article><h1>在城闕</h1><p>立於城門高闕之上，乃候人之所。</p><p>「在城闕」，言立於城門之闕上也。闕者，雙觀之別稱，城門之觀所以飾門。女子於城闕候人，行則踟躕不安，焦急之至。闕上乃顯敞之所，可遠矚，亦可示人，故以為候望之地。</p><p><strong>所出</strong>：《詩經 · 子衿》 — https://zh.wikisource.org/wiki/詩經/子衿</p></article></main></div></div>
