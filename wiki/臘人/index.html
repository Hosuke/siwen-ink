    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 臘人</nav></header><main><article><h1>臘人</h1><p>下士四人，掌乾肉田獸之脯臘膴之事</p><p>臘人，下士四人；府二人，史二人，徒二十人。</p><p>掌乾肉，凡田獸之脯、臘、膴、胖之事。凡祭祀，共豆脯、薦脯、膴、胖，凡臘物。</p><p>賓客、喪紀，共其脯、臘，凡乾肉之事。</p><p><strong>所出</strong>：《周禮 · 天官冢宰》 — https://zh.wikisource.org/wiki/周禮/天官冢宰</p></article></main></div></div>
