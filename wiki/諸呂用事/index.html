    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 諸呂用事</nav></header><main><article><h1>諸呂用事</h1><p>高后崩，諸呂用事擅權，欲為亂。</p><p>當是時，諸呂用事擅權，欲為亂，畏高帝故大臣絳、灌等，未敢發。朱虛侯婦，呂祿女，陰知其謀，恐見誅，乃陰使人告齊王。</p><p>又趙王歌云：「諸呂用事兮劉氏危。」</p><p><strong>所出</strong>：《史記 · 卷009》 — https://zh.wikisource.org/wiki/史記/卷009</p><hr><p>高后八年七月，高后崩。九月，大臣誅諸呂。十一月，丞相陳平、太尉周勃定謀，與宗室大臣共誅諸呂，迎代王而立之，是為孝文皇帝。</p><p>  <strong>所出</strong>：《史記 · 卷022》 — https://zh.wikisource.org/wiki/史記/卷022</p></article></main></div></div>
