    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 知北遊</nav></header><main><article><h1>知北遊</h1><p>假託北遊以論道之不可言。</p><p>「知」者，假名之人也。北遊者，往玄水之上，隱弅之丘，問道於无為謂、狂屈、黃帝三人，欲知何思何慮則知道，何處何服則安道，何從何道則得道。三人所答各異，而黃帝斷之曰：「无為謂真是也，狂屈似之，我與汝終不近也。夫知者不言，言者不知。」</p><p>蓋道本無名，不可致求。知之者不以言傳，言之者實未得道。此篇假「知」之名，以明道之玄遠，而歸於無為、貴一之旨。</p><p><strong>所出</strong>：《莊子 · 知北遊》 — https://zh.wikisource.org/wiki/莊子/知北遊</p></article></main></div></div>
