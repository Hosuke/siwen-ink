    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 德教者黼黻之祭服，刑罰者捍刃之甲胄</nav></header><main><article><h1>德教者黼黻之祭服，刑罰者捍刃之甲胄</h1><p>喻仁政與刑罰相須為用，不可偏廢</p><p>德教者，黼黻之祭服也；刑罰者，捍刃之甲胄也。若德教治狡暴，猶以黼黻禦剡鋒也；以刑罰施平世，是以甲升廟堂也。故仁者養物之器，刑者懲非之具，我欲利之，而彼欲害之，加仁無悛，非刑不止。刑為仁佐，於是可知也。</p><p><strong>所出</strong>：《抱朴子 · 卷14》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷14</p></article></main></div></div>
