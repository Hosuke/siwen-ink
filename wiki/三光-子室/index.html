    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三光</nav></header><main><article><h1>三光</h1><p>日月星之精華，照入子室以成丹也。</p><p>三光者，[[日]][[月]][[星]]之精華也。[[日]]精入[[心]]，月華入[[肺]]，星耀入[[脾]]，三光煥照，交相映發，入[[子室]]而成[[丹]]象。[[三]]者[[合]]於[[一]]，[[光]]者歸於[[明]]，光入子室而[[坎]]宮明，[[長生]]之基立焉。此[[三五合氣]]之效驗，[[內景]]修煉之要功也。</p><p><strong>所出</strong>：《黃庭內景經 · 五行章第二十五》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/五行章第二十五</p></article></main></div></div>
