    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三讓公封</nav></header><main><article><h1>三讓公封</h1><p>辭讓封爵，三辭而後受，古之義也。</p><p>昔晉文受冊，三辭從命。臣之受封，必三讓而後受，禮之恭也。張華三讓公封，理周辭要，引義比事，必得其偶，世珍其文。此皆辭讓之正道也。</p><p><strong>所出</strong>：《文心雕龍 · 章表》 — https://zh.wikisource.org/wiki/文心雕龍/章表</p></article></main></div></div>
