    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 禮道</nav></header><main><article><h1>禮道</h1><p>禮貴於盛，儉貴於不盛；禮貴於炳煥，儉貴於寂寞。夫惟儉，所以能知非常。</p><p>禮貴於盛，儉貴於不盛；禮貴於備，儉貴於不備；禮貴於簪紱，儉貴於布素；禮貴於炳煥，儉貴於寂寞。富而富之愈不樂，貴而貴之愈不美，賞而賞之愈不足，愛而愛之愈不敬。金玉者，富之常；官爵者，貴之常。渴飲則甘，饑食則香。夫惟儉，所以能知非常。</p><p><strong>所出</strong>：《化書 · 卷六》 — https://zh.wikisource.org/wiki/化書/卷六</p></article></main></div></div>
