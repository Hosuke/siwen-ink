    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 作事謀始</nav></header><main><article><h1>作事謀始</h1><p>杜爭端於未萌</p><p>作事謀始，君子觀[[訴訟]]之象而得處世之道也。天與水違行而生讼，則知讼之起，必在於始。始焉不謀，則末流之爭不可遏矣。《象》曰「作事謀始」，言凡事欲興作，必先謀度其始。始正則終無愧悔，始疏則爭端必起。君子以是为法，於親故之交、利害之際，辨之於早，謀之於先，使彼此之分定，而後事可成也。此杜爭端於未形，非柔懦也，知幾之智也。</p><p><strong>所出</strong>：《周易 · 訴訟》 — https://zh.wikisource.org/wiki/周易/訴訟</p></article></main></div></div>
