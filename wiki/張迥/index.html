    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 張迥</nav></header><main><article><h1>張迥</h1><p>幼年得道，終身香火，六時無息，治病驅邪，世人仰望。</p><p>真人張迥字彥超，[[張仲回]]之長子也。幼年得道，美豐姿，善裁鑒，日列真人諸階品錄，於爭室中嚴奉，六時香火，終身無息。治病驅邪，無不安愈，世人仰之。年九十而卒。一云齊太祖召赴闕。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 19》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/19</p></article></main></div></div>
