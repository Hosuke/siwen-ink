    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 嚴位</nav></header><main><article><h1>嚴位</h1><p>治軍之道在位嚴、政栗、力窕、氣閑、心一。</p><p>凡戰之道：位欲嚴，政欲栗，力欲窕，氣欲閑，心欲一。</p><p>凡戰之道：等道義，立卒伍，定行列，正縱橫，察名實。立進俯，坐進跪，畏則密，危則坐。</p><p>凡戰以力久，以氣勝，以固久，以危勝。本心固，新氣勝，以甲固，以兵勝。</p><p>凡人死愛，死怒，死威，死義，死利。凡戰之道：教約人輕死，道約人死正。</p><p>凡戰擊其微靜，避其強靜；擊其倦勞，避其閑窕；擊其大懼，避其小懼。</p><p><strong>所出</strong>：《司馬法》 — https://zh.wikisource.org/wiki/司馬法</p></article></main></div></div>
