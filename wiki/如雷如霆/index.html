    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 如雷如霆</nav></header><main><article><h1>如雷如霆</h1><p>如雷霆之震動，聲威赫盛。</p><p>詩言「如雷如霆，徐方震驚」。霆者，疾雷也。言王師之威，如雷之震，如霆之烈，徐方聞之而震驚。此狀天子聲威之盛，兵威所加，無堅不摧。</p><p><strong>所出</strong>：《詩經 · 常武》 — https://zh.wikisource.org/wiki/詩經/常武</p></article></main></div></div>
