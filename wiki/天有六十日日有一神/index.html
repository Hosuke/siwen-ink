    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天有六十日日有一神</nav></header><main><article><h1>天有六十日日有一神</h1><p>述天道六十日為一循環，日各有神，神有千鬼飛行，不可禁制。</p><p>天有六十日，日有一神。神直一日，日有千鬼飛行，不可禁止。大道不禁，天師不勑，放縱天下，凶凶相逐，唯任殺中民，死者千億。太上不忍見之，故下此律令。蓋以六十干支之日為經緯，日有日神司之，亦有千鬼伺隙害人，故修道者當知日辰之忌，吉凶之變也。</p><p><strong>所出</strong>：《女青鬼律 · 卷1》 — https://zh.wikisource.org/wiki/女青鬼律/卷1</p></article></main></div></div>
