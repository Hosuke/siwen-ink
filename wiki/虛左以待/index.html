    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 虛左以待</nav></header><main><article><h1>虛左以待</h1><p>迎候賢者，空其左位，以示尊賢。</p><p>公子置酒大會賓客，坐定，乃從車騎，虛左，自迎夷門侯生。侯生攝敝衣冠，直上載公子上坐，不讓，欲以觀公子。公子執轡愈恭。</p><p>侯生因謂公子曰：「今日嬴之為公子亦足矣。嬴乃夷門抱關者也，而公子親枉車騎，自迎嬴於眾人廣坐之中，不宜有所過，今公子故過之。然嬴欲就公子之名，故久立公子車騎市中，過客以觀公子，公子愈恭。市人皆以嬴為小人，而以公子為長者能下士也。」</p><p><strong>所出</strong>：《史記 · 卷077》 — https://zh.wikisource.org/wiki/史記/卷077</p></article></main></div></div>
