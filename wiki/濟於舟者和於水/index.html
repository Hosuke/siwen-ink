    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 濟於舟者，和於水</nav></header><main><article><h1>濟於舟者，和於水</h1><p>物各有所用，教存教亡，各因其宜。</p><p>發於名聲，凝於體色，此其可諭者也。不發於名聲，不凝於體色，此其不可諭者也。及至於至者，教存可也，教亡可也。故曰：濟於舟者，和於水矣；義於人者，祥其神矣。</p><p><strong>所出</strong>：《管子 · 第38篇白心》 — https://zh.wikisource.org/wiki/管子/第38篇白心</p></article></main></div></div>
