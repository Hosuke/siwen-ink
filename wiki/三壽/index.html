    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三壽</nav></header><main><article><h1>三壽</h1><p>壽有上中下，應太陽、太陰、中和之命</p><p>凡人有三壽，應三氣，太陽、太陰、中和之命也。上壽一百二十，中壽八十，下壽六十。百二十者應天，大歷一歲竟終天地界也。八十者應陰陽，分別八偶等應地，分別萬物，死者去，生者留。六十者應中和氣，得六月遁卦。遁者，逃亡也，故主死生之會也。如行善不止，過此壽謂之度世。行惡不止，不及三壽，皆夭也。</p><p><strong>所出</strong>：《太平經 · 02》 — https://zh.wikisource.org/wiki/太平經/02</p></article></main></div></div>
