    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 曳明</nav></header><main><article><h1>曳明</h1><p>聖人善救人善用物，莫有遺棄，是謂道之明</p><p>善行者无轍迹，善言者无瑕適，善數者不用檮策，善閉者无關籥而不可啟，善結者无纆約而不可解。是以聖人恆善救人，而无棄人，物无棄財，是謂曳明。</p><p>此章言聖人之善，以無為之道化導萬物。行者不以迹求，言者不以瑕責，數者不以策計，閉者不假籥而自固，結者不待約而自解。聖人之心亦若是，善救人而无遺，善利物而无弃，此道之所以明於天下也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第七十一章 曳明》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
