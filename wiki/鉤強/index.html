    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鉤強</nav></header><main><article><h1>鉤強</h1><p></p><p>《墨子·魯問》載公輸子與墨子論「鉤強」之事。公輸子為楚國造舟戰之器，鉤退者、強進者，欲以此敗越。公輸子自矜其巧，問墨子：「我舟戰有鉤強，不知子之義亦有鉤強乎？」</p><p>墨子答以「義之鉤強，賢於子舟戰之鉤強」。墨子之鉤，以愛行之；墨子之強，以恭行之。不以愛鉤則不親，不以恭強則速狎。狎而不親，則速離。故交相愛、交相恭，猶若相利。</p><p>公輸子之鉤，止人亦為人所止；其強，距人亦為人所距。交相鉤、交相強，猶若相害。此闡明墨學之要義：[[兼愛]]非徒為機械之力，乃以仁愛為鉤、恭敬為強，使天下相親相爱、相利相恭，異於以力服人、以強凌弱之術也。</p></article></main></div></div>
