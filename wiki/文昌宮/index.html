    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 文昌宮</nav></header><main><article><h1>文昌宮</h1><p>斗魁戴匡六星，天府文昌，主上將至司祿六星之職。</p><p>斗魁戴匡六星，曰文昌宮。文耀鉤曰「文昌宮為天府」。孝經援神契云「文者精所聚，昌者揚天紀」。輔拂並居，以成天象，故曰文昌。</p><p>其六星分工：一曰上將，二曰次將，三曰貴相，四曰司命，五曰司中，六曰司祿。在斗魁中，貴人之牢。樂汁圖云「天理理貴人牢」。宋均曰「以理牢獄」。占：明，及其中有星，此貴人下獄也。</p><p><strong>所出</strong>：《史記 · 卷027》 — https://zh.wikisource.org/wiki/史記/卷027</p></article></main></div></div>
