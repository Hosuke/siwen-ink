    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三毒</nav></header><main><article><h1>三毒</h1><p>貪、癡、癡為三毒，能消滅之乃可入道</p><p>[[遣慾澄心|常能遣其慾而心自靜，澄其心而神自清，自然六慾不生，三毒消滅]]。</p><p>三毒者，貪、癡、癡也（一說貪、癡、癡為三毒，或以貪、癡、癡為根本煩惱）。[[妄心驚神|妄心]]之主，亦由三毒而起。六慾不生，三毒消滅，方可漸入[[真靜應物|真道]]。</p><p><strong>所出</strong>：《太上老君說常清靜經》 — https://zh.wikisource.org/wiki/太上老君說常清靜經</p></article></main></div></div>
