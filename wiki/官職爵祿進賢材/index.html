    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 官職爵祿</nav></header><main><article><h1>官職爵祿</h1><p>明主設官分職，以爵禄進賢材、勸有功，此爲政之本。</p><p>明主之爲官職爵禄也，所以進賢材勸有功也。賢材者處厚禄，任大官；功大者有尊爵，受重賞。官賢者量其能，賦禄者稱其功。是以賢者不誣能以事其主，有功者樂進其業，故事成功立。</p><p><strong>所出</strong>：《韓非子 · 八姦》 — https://zh.wikisource.org/wiki/韓非子/八姦</p></article></main></div></div>
