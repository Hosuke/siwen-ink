    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 田橫自立</nav></header><main><article><h1>田橫自立</h1><p>敗亡之餘，猶能收兵復國，自立為王。</p><p>田橫相田廣數歲，廣為韓信所虜。橫聞齊王死，自立為齊王，還擊漢將灌嬰，敗於嬴下。</p><p>此橫敗亡之餘，猶能收散兵數萬，反擊項羽，又自立為王，以延齊祀。其志氣雄烈如此，雖敗不屈。</p><p><strong>所出</strong>：《史記 · 卷094》 — https://zh.wikisource.org/wiki/史記/卷094</p></article></main></div></div>
