    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 委委佗佗</nav></header><main><article><h1>委委佗佗</h1><p>行止端莊之貌</p><p>委委佗佗，見於《詩經·君子偕老》。毛傳云：「委委者，行可委曲蹤跡也。佗佗者，德平易也。」孔穎達疏云：「委委佗佗，雍容自得之貌。」是形容夫人之行止，端莊而不拘，雍容而有德。詩以「如山如河」並言，言其德之厚重深廣，如山之安、如河之大也。</p><p><strong>所出</strong>：《詩經 · 君子偕老》 — https://zh.wikisource.org/wiki/詩經/君子偕老</p></article></main></div></div>
