    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 子産論實沈參神</nav></header><main><article><h1>子産論實沈參神</h1><p>子産言高辛氏二子實沈為參神，后稷之裔劉氏主辰</p><p>子産朝晉，問平公疾。卜曰實沈、臺駘為祟。子産對曰：「高辛氏有二子，長曰閼伯，季曰實沈，居曠林，不相能，日操干戈以相征伐。后帝弗臧，遷閼伯於商丘，主辰，商人是因，故辰為商星。遷實沈於大夏，主參，唐人是因，故參為晉星。」又言臺駘為汾、洮神。末云：「山川之神，則水旱之菑禜之；日月星辰之神，則雪霜風雨不時禜之；若君疾，飲食哀樂女色所生也。」</p><p><strong>所出</strong>：《史記 · 卷042》 — https://zh.wikisource.org/wiki/史記/卷042</p></article></main></div></div>
