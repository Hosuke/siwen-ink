    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 義貴圓通，辭忌枝碎</nav></header><main><article><h1>義貴圓通，辭忌枝碎</h1><p>論之義理當圓融通達，文辭切忌瑣碎支離。</p><p>故其義貴圓通，辭忌枝碎，必使心與理合，彌縫莫見其隙；辭共心密，敵人不知所乘：斯其要也。[[辨正然否]]之義，既貴圓通而無滞礙，又忌辭語破碎支離。是以[[論如析薪]]，[[斤利者越理而橫斷]]，辭辨者反義而取通，皆非論之正道。</p><p><strong>所出</strong>：《文心雕龍 · 論說》 — https://zh.wikisource.org/wiki/文心雕龍/論說</p></article></main></div></div>
