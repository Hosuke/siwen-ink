    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 舜大孝</nav></header><main><article><h1>舜大孝</h1><p>大德必得其位祿名壽，天之生物必因其材而篤也。</p><p>子曰：「舜其大孝也與！德為聖人，尊為天子，富有四海之內。宗廟饗之，子孫保之。故大德必得其位，必得其祿，必得其名，必得其壽。故天之生物，必因其材而篤焉。故栽者培之，傾者覆之，《詩》曰：『嘉樂君子，憲憲令德！宜民宜人；受祿于天；保佑命之，自天申之！』故大德者必受命。」</p><p><strong>所出</strong>：《中庸 · 中庸章句》 — https://zh.wikisource.org/wiki/四書章句集註/中庸章句</p></article></main></div></div>
