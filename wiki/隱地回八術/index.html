    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 隱地回八術</nav></header><main><article><h1>隱地回八術</h1><p>隱藏形體以通神明之八種方術也。</p><p>八術者，隱地回八術也。[[八]]者，[[八方]]之數；術者，方術、隱道之謂。隱地者，潛藏形跡，不露於世；回者，返歸本源之義。八術所以隱伏[[伏牛]]之念，守持幽闕，使[[精氣神]]羅列有序，而達於神化之境也。</p><p><strong>所出</strong>：《黃庭內景經 · 五行章第二十五》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/五行章第二十五</p></article></main></div></div>
