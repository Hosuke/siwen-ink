    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 田伯鼎好士而存其君，白公好士而亂荆</nav></header><main><article><h1>田伯鼎好士而存其君，白公好士而亂荆</h1><p>同好士而善惡殊途，宜察其所以爲</p><p>田伯鼎好士而存其君，白公好士而亂荆。其好士則同，其所以爲則異。公孫友自刖而尊百里，竪刁自宮而諂桓公。其自刑則同，其所以自刑之爲則異。慧子曰：「狂者東走，逐者亦東走。其東走則同，其所以東走之爲則畢。故曰：同事之人，不可不審察也。」</p><p><strong>所出</strong>：《韓非子 · 說林上》 — https://zh.wikisource.org/wiki/韓非子/說林上</p></article></main></div></div>
