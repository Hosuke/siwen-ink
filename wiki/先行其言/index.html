    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 先行其言</nav></header><main><article><h1>先行其言</h1><p>君子先行所言，而後言之於後。</p><p>《論語》載子貢問君子，孔子答曰：「先行其言，而後從之。」言君子之於言也，先行之於前，俟其成功，而後言之於後也。言行相顧，此君子之德也。徒言而不行，則人弗信之矣。</p><p><strong>所出</strong>：《論語 · 爲政第二》 — https://zh.wikisource.org/wiki/論語/爲政第二</p></article></main></div></div>
