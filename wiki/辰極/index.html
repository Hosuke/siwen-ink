    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 辰極</nav></header><main><article><h1>辰極</h1><p>北辰居中正之位，天之樞要，人君法之。</p><p>辰極受正，優游任下。</p><p>辰極，北辰也。[[五緯]]之運，咸拱之而不敢逾。[[御政之首]]，人君法天，亦當如辰極之居中正位，主領四方而不搖。[[明堂布政]]者，[[辰極受正]]之象也。</p><p><strong>所出</strong>：《周易參同契 · 05章》 — https://zh.wikisource.org/wiki/周易參同契/05章</p></article></main></div></div>
