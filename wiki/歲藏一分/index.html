    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 歲藏一分</nav></header><main><article><h1>歲藏一分</h1><p>歲歲斂藏一分，積而至於十分</p><p>「歲藏一分」者，[[管子]]所言積儲之道也。一歲之收，斂其一以為儲，是歲藏一也。歲歲如是，十年則積十矣。民有常產，國有餘粮，上下皆足，此治世之象也。</p><p>[[歲藏三分]]、歲藏一分之法，乃輕重之術在農業之具體運用。豐年斂之，荒年散之，使粟價常平，民心常定。歲藏之制，所以備不虞、戒兵荒者也。</p><p><strong>所出</strong>：《管子 · 第78篇揆度》 — https://zh.wikisource.org/wiki/管子/第78篇揆度</p></article></main></div></div>
