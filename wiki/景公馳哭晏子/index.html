    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 景公馳哭晏子</nav></header><main><article><h1>景公馳哭晏子</h1><p>晏子卒，景公急馳往哭，自責不能納諫，致晏子早逝。</p><p>景公游于菑，聞晏子死，公乘侈輿服繁駔驅之。自以為遲，下車而趨。知不若車之速，則又乘。比至於國者，四下而趨，行哭而往，至，伏屍而號，曰：「子大夫日夜責寡人，不遺尺寸，寡人猶且淫佚而不收，怨罪重積于百姓。今天降禍于齊，不加于寡人，而加于夫子，齊國之社稷危矣，百姓將誰告夫！」</p><p><strong>所出</strong>：《晏子春秋 · 卷八》 — https://zh.wikisource.org/wiki/晏子春秋/卷八</p></article></main></div></div>
