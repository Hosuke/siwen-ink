    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 風厥</nav></header><main><article><h1>風厥</h1><p>太陽與少陰表裏同病，汗出身熱煩滿。</p><p>有病身熱汗出煩滿，煩滿不為汗解，此為風厥。巨陽主氣，故先受邪，少陰與其為表裏也，得熱則上從之，從之則厥。治之奈何？表裏刺之，飲之服湯。</p><p><strong>所出</strong>：《黃帝內經 · 素問第九卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第九卷</p></article></main></div></div>
