    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 薄言</nav></header><main><article><h1>薄言</h1><p>薄言，語氣詞，助句之用。</p><p>薄言，語氣詞也。薄、言二字皆語助，連言以成辭。《芣苢》首章「薄言采之」「薄言有之」，皆取其聲以見義，不必深求其解。詩之意在輕快之歌調，不在語義之層面。</p><p><strong>所出</strong>：《詩經 · 芣苢》 — https://zh.wikisource.org/wiki/詩經/芣苢</p></article></main></div></div>
