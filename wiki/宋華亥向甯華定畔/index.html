    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 宋華亥向甯華定畔</nav></header><main><article><h1>宋華亥向甯華定畔</h1><p>宋華亥等自宋南里以畔，入于陳，又出奔楚。</p><p>昭公二十一年秋，宋華亥、向甯、華定自陳入于宋南里以畔。二十二年春，宋華亥、向甯、華定自宋南里出奔楚。</p><p><strong>所出</strong>：《春秋公羊傳 · 昭公》 — https://zh.wikisource.org/wiki/春秋公羊傳/昭公</p></article></main></div></div>
