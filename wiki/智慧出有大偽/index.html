    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 智慧出有大偽</nav></header><main><article><h1>智慧出有大偽</h1><p>巧智張則姦偽隨生</p><p>智慧之出，乃生大偽。巧智之用既張，姦偽之術亦起，此自然之勢也。六親之所以不和，由於情意之喪失；國家之所以昏亂，由於綱紀之頹弛。人不能無為而守其素，故巧智生而大偽作焉。</p><p><strong>所出</strong>：《道德經 (王弼本) · 十八章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
