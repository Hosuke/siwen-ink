    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 同人于門</nav></header><main><article><h1>同人于門</h1><p>出門和人，無私無咎</p><p>「同人于門」者，[[同人]]初九之爻辭也。</p><p>初九陽居陽位，處卦之下，剛正而無私。出門而與人同，未及門而先見，無所偏係，故「無咎」。</p><p>象曰「出門同人，又誰咎也」，言出門之際，廣泛交接，無黨無私，人亦不得而咎之也。較之「[[同人于宗]]」之吝，出門為優。</p><p><strong>所出</strong>：《周易 · 同人》 — https://zh.wikisource.org/wiki/周易/同人</p></article></main></div></div>
