    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 德音孔膠</nav></header><main><article><h1>德音孔膠</h1><p>賢者之德音，堅固膠固，不可動搖。</p><p>「德音」者，賢者之美言善教也。「孔」言甚，「膠」言固。桑葉之幽，其色深，詩人以喻德音之益著。言君子之德行教言，浸潤人心，深固而不可解也。此讚美君子之詞，以桑起興，以見君子為樂，而德音為可寶云。</p><p><strong>所出</strong>：《詩經 · 隰桑》 — https://zh.wikisource.org/wiki/詩經/隰桑</p></article></main></div></div>
