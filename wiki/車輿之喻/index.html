    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 車輿之喻</nav></header><main><article><h1>車輿之喻</h1><p>君如輿，臣如馬；馬不和則造父不能取道，臣不和則聖人不能為治。</p><p>治人之道，其猶造父之御駟馬也。齊輯之乎轡銜，正度之乎胸膺，內得於中心，外合乎馬志，故能取道致遠。今夫權勢者，人主之車輿也；大臣者，人主之駟馬也。身不可離車輿之安，手不可失駟馬之心。故驄馬不入，造父不能以取道；君臣不和，聖人不能以為治。</p><p><strong>所出</strong>：《文子 · 卷十一》 — https://zh.wikisource.org/wiki/文子/卷十一</p></article></main></div></div>
