    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天地一險一易</nav></header><main><article><h1>天地一險一易</h1><p>天地之道，有唱必有和，若鼓之有楟；和之不差，天地之道盡矣。</p><p>「夫天地一險一易，若鼓之有楟，擿擋則擊」，言苟有唱之，必有和之，和之不差，因以盡天地之道。景不為曲物直，響不為惡聲美，是以聖人明乎物之性者，必以其類來也。故君子繩繩乎慎其所先。</p><p><strong>所出</strong>：《管子 · 第11篇宙合》 — https://zh.wikisource.org/wiki/管子/第11篇宙合</p></article></main></div></div>
