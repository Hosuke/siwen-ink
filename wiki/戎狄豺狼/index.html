    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 戎狄豺狼不可厭也</nav></header><main><article><h1>戎狄豺狼不可厭也</h1><p>管仲戒齊侯勿棄諸夏而懷戎狄，以酖毒為喻。</p><p>管仲見齊侯，言曰：「戎狄豺狼，不可厭也；諸夏親暱，不可棄也；宴安酖毒，不可懷也。」言夷狄之貪，猶豺狼之欲無饜；中國之民，本諸姬姓，宜相親睦，不可輕棄。外患既迫，當以簡書同惡相恤，不可恃宴安而忘戒備也。</p><p><strong>所出</strong>：《春秋左氏傳 · 閔公》 — https://zh.wikisource.org/wiki/春秋左氏傳/閔公</p></article></main></div></div>
