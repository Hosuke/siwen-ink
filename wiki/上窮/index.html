    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 上窮</nav></header><main><article><h1>上窮</h1><p>居卦之上而無所復入，是為上窮。</p><p>上九《象》曰「巽在牀下，上窮也」。上九居一卦之極，過而在下，無所復入，是上之窮也。窮則變，《易》之通例，茲其一端也。</p><p><strong>所出</strong>：《周易 · 巽》 — https://zh.wikisource.org/wiki/周易/巽</p></article></main></div></div>
