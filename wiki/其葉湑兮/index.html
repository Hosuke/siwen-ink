    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 其葉湑兮</nav></header><main><article><h1>其葉湑兮</h1><p>葉之茂盛光澤也。</p><p>「裳裳者華，其葉湑兮。」湑，《說文》云「湑，莢之肥也」，引申為繁密光澤之貌。華葉盛美，猶君子德行充盈於身也。以草木之盛，興德業之茂。</p><p><strong>所出</strong>：《詩經 · 裳裳者華》 — https://zh.wikisource.org/wiki/詩經/裳裳者華</p></article></main></div></div>
