    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 自勝之謂強</nav></header><main><article><h1>自勝之謂強</h1><p>志之難也不在勝人，在自勝；先王之義勝故肥。</p><p>子夏見曾子。曾子曰：「何肥也？」對曰：「戰勝，故肥也。」曾子曰：「何謂也？」子夏曰：「吾入見先王之義則榮之，出見富貴之樂又榮之，兩者戰於胷中，未知勝負，故臞。今先王之義勝，故肥。」是以志之難也，不在勝人，在自勝也。故曰：「自勝之謂強。」</p><p><strong>所出</strong>：《韓非子 · 喻老》 — https://zh.wikisource.org/wiki/韓非子/喻老</p></article></main></div></div>
