    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大宛之跡</nav></header><main><article><h1>大宛之跡</h1><p>張騫通西域之始</p><p>大宛之跡，見自[[張騫導軍|張騫]]。</p><p>騫，漢中人。建元中為郎。是時天子問匈奴降者，皆言匈奴破月氏王，以其頭為飲器，月氏遁逃而常怨仇匈奴，無與共擊之。男方欲事滅胡，聞此言，因欲通使。道必更匈奴中，乃募能使者。騫以郎應募，使月氏。</p><p><strong>所出</strong>：《史記 · 卷123》 — https://zh.wikisource.org/wiki/史記/卷123</p></article></main></div></div>
