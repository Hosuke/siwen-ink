    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 子虛過詫</nav></header><main><article><h1>子虛過詫</h1><p>子虛使齊歸，過詫烏有先生，述楚王田獵之盛。</p><p>楚使子虛使於齊，齊王悉發境內之士，備車騎之眾，與使者出田。田罷，子虛過詫烏有先生，而無是公在焉。</p><p><strong>所出</strong>：《史記 · 卷117》 — https://zh.wikisource.org/wiki/史記/卷117</p></article></main></div></div>
