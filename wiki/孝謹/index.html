    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 孝謹</nav></header><main><article><h1>孝謹</h1><p>孝於親而謹於行。</p><p>萬石君[[石奮]]之四子——建、甲、乙、慶——「皆以驯行[[孝謹]]，官皆至二千石」。[[萬石君]]家居，「子孫有過失，不譙讓，[[為便坐]]，對案不食」。子孫遵教，亦如之。[[萬石君]]家以[[孝謹]]聞乎郡國，[[太史公]]贊曰「[[萬石孝謹]]」。</p><p><strong>所出</strong>：《史記 · 卷103》 — https://zh.wikisource.org/wiki/史記/卷103</p></article></main></div></div>
