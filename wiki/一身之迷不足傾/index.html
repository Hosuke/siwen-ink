    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 一身之迷不足傾</nav></header><main><article><h1>一身之迷不足傾</h1><p>一人之迷不足害，若天下皆迷，則無由以正之。</p><p>若有欲決意任懷，自謂達識知命，不泥異端，極情肆力，不營久生者，聞此言也，雖風之過耳，電之經目，不足諭也。雖身枯於流連之中，氣絕於紈綺之閒，而甘心焉，亦安可告之以養生之事哉？不惟不納，乃謂妖訛也。而望彼信之，所謂以明鑒給矇瞽，以絲竹娛聾夫也。</p><p><strong>所出</strong>：《抱朴子 · 卷13》 — https://zh.wikisource.org/wiki/抱朴子/卷13</p></article></main></div></div>
