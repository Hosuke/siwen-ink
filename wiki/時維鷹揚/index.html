    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 時維鷹揚</nav></header><main><article><h1>時維鷹揚</h1><p>尚父之勇，如鷹之搏。</p><p>維師尚父，時維鷹揚。涼彼武王，肆伐大商。會朝清明。</p><p>鷹揚，如鷹之飛而揚也。言太師尚父，其勇如鷹之搏擊也。涼，佐也，助也。言尚父佐武王，急伐大商，一朝而天下清明也。會朝，一朝也。言[[肆伐大商]]之速，天命之歸，[[檀車煌煌|師旅之盛]]，而尚父之勇為之先也。</p><p><strong>所出</strong>：《詩經 · 大明》 — https://zh.wikisource.org/wiki/詩經/大明</p></article></main></div></div>
