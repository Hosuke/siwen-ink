    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 孔子長九尺有六寸</nav></header><main><article><h1>孔子長九尺有六寸</h1><p>記孔子身材高大，時人異之。</p><p>孔子長九尺有六寸，人皆謂之「長人」而異之。蓋聖人稟賦異常，身材高大，異於常人。</p><p><strong>所出</strong>：《史記 · 卷047》 — https://zh.wikisource.org/wiki/史記/卷047</p></article></main></div></div>
