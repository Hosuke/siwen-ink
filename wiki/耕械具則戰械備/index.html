    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 耕械具則戰械備</nav></header><main><article><h1>耕械具則戰械備</h1><p>耕具既備，戰具亦足，理農即理兵。</p><p>張耜當弩，銚耨當劍戟，擭渠當脅𩊆，蓑笠當櫓。故耕械具則戰械備矣。</p><p>言農具可以代兵器也。耜之張者如弩，銚耨之利者如劍戟，擭渠之密者如甲胄，蓑笠之蔽者如櫓盾。苟耕作者之器皆備，則兵革之事亦無闕矣。是以[[耜耒耨|耜耒耨耨]]之具，春夏必具，所以為民，亦所以為兵也。</p><p><strong>所出</strong>：《管子 · 第85篇輕重己》 — https://zh.wikisource.org/wiki/管子/第85篇輕重己</p></article></main></div></div>
