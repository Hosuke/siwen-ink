    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 奏雅樂於木梗之側</nav></header><main><article><h1>奏雅樂於木梗之側</h1><p>雅樂奏於木偶，喻以高文辭對庸夫，適增嗤笑而已。</p><p>玄泊先生譏淺近之徒云：「辯虛無之不急，爭細事以費言，論廣修堅白無用之說，誦諸子非聖過正之書，損教益惑，謂之深遠，委棄正經，競治邪學。或與暗見者較唇吻之勝負，為不識者吐清商之談對，非敵力之人，旁無賞解之客，<strong>何異奏雅樂於木梗之側，陳玄黃於土偶之前哉</strong>！」</p><p><strong>所出</strong>：《抱朴子 · 卷51》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷51</p></article></main></div></div>
