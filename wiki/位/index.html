    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 位</nav></header><main><article><h1>位</h1><p>實之所充，無有空闕。</p><p>實以實其所實而不曠焉，位也。位者，實充於其所當之處，無有闕失也。出其所位非位，位非其位，皆失正也。唯位其所位，乃為正耳。</p><p><strong>所出</strong>：《公孫龍子 · 6》 — https://zh.wikisource.org/wiki/公孫龍子/6</p></article></main></div></div>
