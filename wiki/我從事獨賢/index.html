    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 我從事獨賢</nav></header><main><article><h1>我從事獨賢</h1><p>詩人自言獨被賢用而勤於王事。</p><p>「大夫不均，我從事獨賢」，言己之見賢而被遣，獨任其勞。詩人以此刺在位者之偏，而不恤下情也。</p><p><strong>所出</strong>：《詩經 · 北山》 — https://zh.wikisource.org/wiki/詩經/北山</p></article></main></div></div>
