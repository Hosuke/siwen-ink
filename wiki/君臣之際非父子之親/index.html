    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 君臣之際非父子之親</nav></header><main><article><h1>君臣之際非父子之親</h1><p>君臣以利相合，非以情相親，計數之所出也。</p><p>或難管仲去三子之說，韓非以為「管仲所以見告桓公者，非有度者之言也」。夫臣盡死力以與君市，君垂爵禄以與臣市，則「臣有盡死力以為其主者，管仲將弗用也」，是欲君去忠臣也。</p><p>又曰：「君臣之際，非父子之親也，計數之所出也。君有道，則臣盡力而姦不生；無道，則臣上塞主明而下成私。」</p><p>故明主治天下，不可以恩結臣心，必以法齊臣行。使賞信而刑罰必，則臣不敢失禮，而君令得以下究。</p><p><strong>所出</strong>：《韓非子 · 難一》 — https://zh.wikisource.org/wiki/韓非子/難一</p></article></main></div></div>
