    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 左神公子</nav></header><main><article><h1>左神公子</h1><p>心君左側神將，主生成之氣。</p><p>左神公子者，心君左側之神將也。《經》云「左神公子發神語」，左者位居左、在陽、主生，公子者稚神之稱。蓋人身臟腑皆有神將守護，心為君主，左側神將稟命而行，發為神語以告修者。左神公子所稟者生發之氣，令心君之令暢達四體，百脈皆從其化。存思此神，則肝氣調達、生機勃發，與右之白元相輔以成身心之和。</p><p><strong>所出</strong>：《黃庭內景經 · 靈臺章第十七》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/靈臺章第十七</p></article></main></div></div>
