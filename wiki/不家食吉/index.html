    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不家食吉</nav></header><main><article><h1>不家食吉</h1><p>賢者在位，養於朝廷，不區區於私家。</p><p>卦辭曰「不家食吉」，言賢者當見用於朝，不可以食於私家為事也。國有道，則賢才出而致用，祿養於公，是謂不家食而吉。聖人在上，養賢以治天下，亦此義也。</p><p><strong>所出</strong>：《周易 · 大畜》 — https://zh.wikisource.org/wiki/周易/大畜</p></article></main></div></div>
