    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 平旦診法</nav></header><main><article><h1>平旦診法</h1><p>診法貴在平旦，陰陽未擾，氣血未亂，乃可觀有過之脈。</p><p>岐伯對黃帝曰：「診法常以平旦，陰氣未動，陽氣未散，飲食未進，經脈未盛，絡脈調勻，氣血未亂，故乃可診有過之脈。」蓋此時陰陽之氣未受外擾，臟腑之象最為真實，足以參伍脈象，決死生之分。</p><p><strong>所出</strong>：《黃帝內經 · 素問第五卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第五卷</p></article></main></div></div>
