    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 必有利而後有害</nav></header><main><article><h1>必有利而後有害</h1><p>利害相倚，無利則無害。</p><p>[[管仲]]告[[桓公]]，先王治世，必先有利而後有害。蓋不先有所置，則無從論廢；不先有所利，則無由生害。此[[必有利而後有害]]之理。</p><p><strong>所出</strong>：《管子 · 第19篇中匡》 — https://zh.wikisource.org/wiki/管子/第19篇中匡</p></article></main></div></div>
