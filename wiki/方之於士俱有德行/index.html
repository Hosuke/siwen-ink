    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 方之於士俱有德行</nav></header><main><article><h1>方之於士俱有德行</h1><p>德行與藝文不可混淆，如二人各有德行，一人偏長藝文，不可一例而論。</p><p>抱朴子曰：方之於士，並有德行，而一人偏長藝文，不可謂一例也；比之於女，俱體國色，而一人獨閑百伎，不可混為無異也。以此知古之作者與今之作者，亦各有長，未可執一端而定軒輊。</p><p><strong>所出</strong>：《抱朴子 · 卷30》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷30</p></article></main></div></div>
