    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 柔弱朕強</nav></header><main><article><h1>柔弱朕強</h1><p>柔弱勝剛強，魚不脫淵，邦利器不可以示人。</p><p>此申釋前文之旨也。言柔弱者所以朕勝剛強，魚賴深淵以自存，脫之則無所托命；邦之利器所以示威天下，示人則變生不測。老氏之意：利器者，威嚴刑賞之具也，藏之則為聖人之所以為聖，露之則為匹夫之所以招殃。故聖人內懷道德之實，外示無為之虛，使民歸化而不自知。此無名之樸所謂「微明」者，非以智力爭雄，乃以柔弱持勝者也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章三十六》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
