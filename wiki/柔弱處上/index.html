    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 柔弱處上</nav></header><main><article><h1>柔弱處上</h1><p>柔弱者反居上位，堅強者反居下位。</p><p>[[強大處下]]，柔弱處上。柔弱者木之枝條，取其上者；堅強者木之根本，處其下者。以人事言之，柔弱而謙下者反居人上，矜強而上凌者反居人下。此[[柔弱朕強]]之義，老子貴柔之旨也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 七十六章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
