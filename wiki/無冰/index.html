    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無冰</nav></header><main><article><h1>無冰</h1><p>周春無冰，時令失節，災異之象。</p><p>桓公十四年，「十四年春，正月，公會鄭伯于曹。無冰。」</p><p>周之正月，夏之十一月也。寒無冰，溫燠不節，氣序失常。公羊傳以為災異，戒在位者。</p><p><strong>所出</strong>：《春秋公羊傳 · 桓公》 — https://zh.wikisource.org/wiki/春秋公羊傳/桓公</p><hr><p>成公元年，「無冰」。終時無冰則志，此未終時而言無冰，何也？終無冰矣。加之寒之辭也。冬無冰，書以見異，示乖寒溫之常政耳。</p><p>  <strong>所出</strong>：《春秋穀梁傳 · 成公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/成公</p></article></main></div></div>
