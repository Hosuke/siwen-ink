    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 尺蠖之屈，以存伸也</nav></header><main><article><h1>尺蠖之屈，以存伸也</h1><p>屈於近者，志在遠也；尺蠖屈身，乃圖前進。</p><p>《易傳》以尺蠖為喻。尺蠖之蟲，欲行則先屈其身，屈而後能進，此物理之常也。聖人觀此，知屈信相感之理。屈者，非自弱也，乃待時而動、以屈求伸之道也。君子養晦待時，若尺蠖之屈，正所以為伸張之地。屈為伸之階，屈極則伸，理之必然者。</p><p><strong>所出</strong>：《周易 · 繫辭下》 — https://zh.wikisource.org/wiki/易傳/繫辭下</p></article></main></div></div>
