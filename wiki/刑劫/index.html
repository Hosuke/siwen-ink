    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 刑劫</nav></header><main><article><h1>刑劫</h1><p>姦臣擅執刑罰、不稟於君之姦。</p><p>刑劫者，姦臣竊國之第三途。其患最烈。姦臣守司囹圄，禁制刑罰，一出於己，不復稟命於君。</p><p>夫刑罰者，人主之器也。賞罰不明，則號令不行；刑罰失柄，則姦宄肆行。姦臣一旦握刑賞之柄，則生殺在己，予奪由人，人主之勢去矣。</p><p>[[三劫]]之一，其害最深。三守不完，姦臣遂得而行之。</p><p><strong>所出</strong>：《韓非子 · 三守》 — https://zh.wikisource.org/wiki/韓非子/三守</p></article></main></div></div>
