    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 凱風</nav></header><main><article><h1>凱風</h1><p>和風喻母愛，棘心象稚子，以慰母心為旨。</p><p>《凱風》，《詩經》篇名也。毛詩序云：「美孝子也。衞之淫風流行，雖有七子之母，猶不能安其室，故美七子能盡其孝道，以慰其母心，而成其志爾。」</p><p>詩四章，章四句。以凱風興母德，以棘心喻稚子，以棘薪喻子之成立，以寒泉、黃鳥興母之勞苦而不得慰。終章言「有子七人，莫慰母心」，子自責之辭也。</p><p>「凱風」者，和煗之風，一說南風、夏風。自南而來，喻母愛溫煦，吹拂無已。</p><p><strong>所出</strong>：《詩經 · 凱風》 — https://zh.wikisource.org/wiki/詩經/凱風</p></article></main></div></div>
