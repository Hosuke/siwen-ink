    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 正末端本</nav></header><main><article><h1>正末端本</h1><p>欲正其末，必端其本；欲輟其流，必遏其源。</p><p>潛居先生云：「故君子欲正其末，必端其本；欲輟其流，則遏其源。故道德之功建，而侈靡之門閉矣。」言治身治國，其理一貫，崇本則末自正，絕源則流自竭。先王之務德，不以力征，而天下歸之，職此故也。</p><p><strong>所出</strong>：《抱朴子 · 卷35》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷35</p></article></main></div></div>
