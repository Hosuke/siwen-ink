    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 蕭何舉宗</nav></header><main><article><h1>蕭何舉宗</h1><p>蕭何舉族相從，不以一身隨高祖，乃舉宗數十人皆從。</p><p>高祖論功，既以獵為喻，又曰：「且諸君獨以身隨我，多者兩三人。今蕭何舉宗數十人皆隨我，功不可忘也。」功臣以為蕭何未嘗有汗馬之勞，徒持文墨議論，顧反居臣等上。高祖乃以舉宗為辯，見其心懷忠藎，不以一身為私，而以宗族為國用，其功實不可與尋常戰將並論。</p><p><strong>所出</strong>：《史記 · 卷053》 — https://zh.wikisource.org/wiki/史記/卷053</p></article></main></div></div>
