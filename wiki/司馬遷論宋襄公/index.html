    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 司馬遷論宋襄公</nav></header><main><article><h1>司馬遷論宋襄公</h1><p>太史公稱宋襄公有禮讓，傷中國闕禮義而褒之。</p><p>[[司馬遷評]]論宋襄公曰：「襄公之時，修行仁義，欲為盟主。其大夫正考父美之，故追道契、湯、高宗，殷所以興，作商頌。」又曰：「襄公既敗於泓，而君子或以為多，傷中國闕禮義，褒之也，宋襄之有禮讓也。」太史公之意，謂襄公雖敗，而其不困人於阸、不鼓不成列之義，猶有可取者。[[宋襄公泓之戰]]之役，是非得失，千古難言，而太史公獨能窺見其心，蓋以傷禮義之不行於中國也。</p><p><strong>所出</strong>：《史記·卷038》 — https://zh.wikisource.org/wiki/史記/卷038</p></article></main></div></div>
