    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 溥彼韓城</nav></header><main><article><h1>溥彼韓城</h1><p>燕師完筑，韓城高大，祖宗受命，百蠻宗主。</p><p>溥彼韓城，燕師所完。以先祖受命，因時百蠻。言燕國之眾助築韓城，韓遂為北方百蠻之長，奄受北國，因以其伯也。</p><p><strong>所出</strong>：《詩經 · 韓奕》 — https://zh.wikisource.org/wiki/詩經/韓奕</p></article></main></div></div>
