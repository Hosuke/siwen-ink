    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 於穆不已</nav></header><main><article><h1>於穆不已</h1><p>讚天道深遠美善、運行不息</p><p>「於穆不已」出自《詩經·維天之命》，毛傳：「穆，美也。」鄭箋：「天之道於乎美哉！動而不息。」</p><p>言天道深遠而美善，運化無有止息。此四字總攝天行之健，與《易》所言[[天行健]]、《大學》所言[[日新其德]]相發明。天道之「不已」，正萬物生生之本，故君子法天，亦當自強不息。[[乾道變化]]亦言天之變化不已，此詩頌天而歸本文王之德，實以天道為錨。</p><p><strong>所出</strong>：《詩經 · 維天之命》 — https://zh.wikisource.org/wiki/詩經/維天之命</p></article></main></div></div>
