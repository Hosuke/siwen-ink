    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 雲中無頭壞軍死將逆惡大鬼</nav></header><main><article><h1>雲中無頭壞軍死將逆惡大鬼</h1><p>述雲中無頭壞軍死將逆惡大鬼之名號。</p><p>雲中無頭壞軍死將逆惡大鬼，姓李名三可。蓋此鬼乃將帥橫死、怨毒不散所化，居雲中，其名可畏，知之則鬼不敢干。</p><p><strong>所出</strong>：《女青鬼律 · 卷1》 — https://zh.wikisource.org/wiki/女青鬼律/卷1</p></article></main></div></div>
