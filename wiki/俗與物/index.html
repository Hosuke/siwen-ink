    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 俗與物</nav></header><main><article><h1>俗與物</h1><p>世俗所貴所用各異，所齊所飾不可不慎</p><p>世之所貴，同而貴之，謂之「俗」；世之所用，同而用之，謂之「物」。苟違於人，俗所不與；苟忮於眾，俗所共去。故心皆殊而為行若一，所好各異而資用必同，此俗之所齊、物之所飾。故所齊，不可不慎；所飾，不可不擇。</p><p><strong>所出</strong>：《尹文子 · 大道上》 — https://zh.wikisource.org/wiki/尹文子/大道上</p></article></main></div></div>
