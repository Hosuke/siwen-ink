    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大道氾兮</nav></header><main><article><h1>大道氾兮</h1><p>道覆萬物無所不容，生養萬物而不以為主</p><p>大道無形無名，而萬物恃之生。物之生者，待道以為本；道之成者，不自以為功。其生萬物也自然而然，無待於外；其成萬物也功成名遂而不名有。故聖人法之，愛養百姓如養萬物，功成不居，歸美於道，是以萬物荷其德而聖人全其道也。</p><p><strong>所出</strong>：《老子河上公章句 · 任成》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
