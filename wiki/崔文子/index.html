    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 崔文子</nav></header><main><article><h1>崔文子</h1><p>秦時泰山人，作黃散赤丸，疫氣民死者萬計，文子以散丸詢問，飲服者輒愈。</p><p>崔文子，秦時泰山人。世好黃老事，居潛山下。</p><p>後作黃散赤丸成石父祠賣藥都市，自言三百歲，後有疫氣，民死者萬計。長吏告之請救，文子擁朱嬸，繫黃散以詢民問，飲散服丸者輒愈，所愈萬計。</p><p>後去蜀賣藥。故世寶崔文赤丸黃散，近於神焉。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 3》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/3</p></article></main></div></div>
