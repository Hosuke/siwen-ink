    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 八公</nav></header><main><article><h1>八公</h1><p>八仙變童以驗道術</p><p>八公者，淮南王之師也。容狀衰老，枯槁傂僂。閽者拒之。公乃振衣整容，立成童幼之狀。時人乃知其異。</p><p>其名曰文五常、武七德、枝百英、壽千齡、葉萬椿、鳴九臯、修三田、岑一峰。各能吹噓風雨，震動雷電，傾天駭地，回日駐流，役使鬼神，鞭撻魔魅，出入水火，移易山川。</p><p><strong>所出</strong>：《神仙傳 · 卷六》 — https://zh.wikisource.org/wiki/神仙傳/卷六</p></article></main></div></div>
