    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 竊聞長卿好之</nav></header><main><article><h1>竊聞長卿好之</h1><p>臨邛令為相如奏琴，稱竊聞其好之，蓋以琴心挑文君。</p><p>酒酣，臨邛令前奏琴曰：「竊聞長卿好之，原以自娛。」相如辭謝，為鼓一再行。是時卓王孫有女文君新寡，好音，故相如繆與令相重，而以琴心挑之。</p><p><strong>所出</strong>：《史記 · 卷117》 — https://zh.wikisource.org/wiki/史記/卷117</p></article></main></div></div>
