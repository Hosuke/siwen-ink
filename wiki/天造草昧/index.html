    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天造草昧</nav></header><main><article><h1>天造草昧</h1><p>天道初創，草創冥昧之時。</p><p>屯之彖辭云：「雷雨之動滿盈，天造草昧，宜建侯而不寧。」言造物之初，乾坤始交，雷雨未止，天地、草木皆冥昧未定之時也。當此之際，萬物萌動而未亨，人當扶持建立，以成天下之功。</p><p><strong>所出</strong>：《周易 · 屯》 — https://zh.wikisource.org/wiki/周易/屯</p></article></main></div></div>
