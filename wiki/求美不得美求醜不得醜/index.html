    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 求美不得美，求醜不得醜</nav></header><main><article><h1>求美不得美，求醜不得醜</h1><p>有所求則適得其反，唯無所求，美醜皆忘，乃入玄同之境。</p><p>求美則不得美，不求美則美矣；求醜則不得醜，求不醜則有醜矣；不求美又不求醜，則無美無醜矣，是謂玄同。</p><p>此言心有企慕則窒於所欲，機尚在人為則失之巧偽。惟遣其求美之心，並遣其求醜之心，兩無所待，而後美醜之見俱忘，是非之名亦泯，所謂玄同者，與道大全，復何美醜之可言耶。</p><p><strong>所出</strong>：《淮南子 · 說山訓》 — https://zh.wikisource.org/wiki/淮南子/說山訓</p></article></main></div></div>
