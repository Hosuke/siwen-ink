    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 還丹</nav></header><main><article><h1>還丹</h1><p>陰陽合煉，返本還元</p><p>魏伯陽以還丹為修仙之究竟，云：「巨勝尚延年，還丹可入口。金性不敗朽，故為萬物寶。術士伏食之，壽命得長久。」又云：「老翁復丁壯，耆嫗成吒女。改形免世厄，號之曰真人。」蓋還丹者，以三五合一之功，煉成純陽之丹，服之則骨肉身輕，脫離世厄，是真人之所以得名者也。</p><p>  <strong>所出</strong>：《周易參同契 · 11章》 — https://zh.wikisource.org/wiki/周易參同契/11章</p></article></main></div></div>
