    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 解狐射讎</nav></header><main><article><h1>解狐射讎</h1><p>私怨不入公門</p><p>解狐推薦其讎於簡主以爲相。其讎以爲且幸釋己也，乃因往拜謝。狐乃引弓迎而射之，曰：「夫推薦汝，公也，以汝能當之也。夫讎汝，吾私怨也，不以私怨汝之故擁汝於吾君。」故私怨不入公門。</p><p>一曰：解狐舉邢伯柳爲上黨守，柳往謝之，曰：「子釋罪，敢不再拜？」曰：「舉子，公也；怨子，私也。子往矣，怨子如初也。」</p><p>解狐推荐讎人而射之，謂推薦由於公，怨由於私，私怨不可以入公門。此與[[趙武]]外舉不避讎同意。</p><p><strong>所出</strong>：《韓非子 · 外儲說左下》 — https://zh.wikisource.org/wiki/韓非子/外儲說左下
===孫叔敖===</p></article></main></div></div>
