    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 金玉盈室</nav></header><main><article><h1>金玉盈室</h1><p>金玉盈室，莫之能守；甚愛必大費，多藏必厚亡。</p><p>金玉滿堂，莫之能守。</p><p>金玉者，貨殖之餘；盈室者，貪求之極。物積既多，盜賊伺之，守之者不能保，藏之者徒自焚。《道德經》第十二章云：「難得之貨令人行妨。」是以聖人為腹不為目，去彼取此。夫甚愛大費，多藏厚亡，盈室之守不若無守之為得也。貴難得之貨，是重亡其德；藏金玉於堂，是廣納於盜。守之愈力，失之愈速，莫之能守，理固然矣。</p><p><strong>所出</strong>：《道德經 (王弼本) · 九章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
