    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 東門之墠</nav></header><main><article><h1>東門之墠</h1><p>詩人慕悅其人，因地以起興也。</p><p>東門之墠，鄭風之一也。詩人托物起興，以東門之地、茹藘之草、栗樹之家室，興其思慕之人。</p><p>東門之外，有土為墠。詩人行至其處，望彼坂上之茹藘，念其室之近而人之遠，因以寓情。復言東門之栗，有踐家室，亦以起興，言己豈不思爾，而子不我即也。</p><p>一章言地，二章言栗，皆以眼前之景，興其心中之情。蓋居處非遠，而情則疏隔，故以起怨慕之意焉。</p><p><strong>所出</strong>：《詩經 · 東門之墠》 — https://zh.wikisource.org/wiki/詩經/東門之墠</p></article></main></div></div>
