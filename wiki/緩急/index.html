    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 緩急</nav></header><main><article><h1>緩急</h1><p>緩急者，人之所時有也。賢者尚不得免，況中材乎。</p><p>且緩急，人之所時有也。太史公曰：昔者虞舜窘於井廩，伊尹負於鼎俎，傅說匿於傅險，呂尚困於棘津，夷吾桎梏，百里飯牛，仲尼畏匡，菜色陳蔡。此皆學士所謂有道仁人也，猶然遭此菑，況以中材而涉亂世之末流乎？其遇害何可勝道哉！</p><p><strong>所出</strong>：《史記 · 卷124》 — https://zh.wikisource.org/wiki/史記/卷124</p></article></main></div></div>
