    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 信人則制於人</nav></header><main><article><h1>信人則制於人</h1><p>人主信人，必受制於人，此亡國之根也。</p><p>人主之患，在於信人。信人，則制於人。人臣之於其君，非有骨肉之親也，縛於勢而不得不事也。故為人臣者，窺覘其君心也無須臾之休，而人主怠慠處其上，此世所以有劫君弒主也。</p><p><strong>所出</strong>：《韓非子 · 備內》 — https://zh.wikisource.org/wiki/韓非子/備內</p></article></main></div></div>
