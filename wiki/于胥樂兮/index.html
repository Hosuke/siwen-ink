    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 于胥樂兮</nav></header><main><article><h1>于胥樂兮</h1><p>君臣相得，舉國同樂</p><p>「于胥樂兮」，《有駜》之所以卒章也。言僖公君臣相得，無彼此之分，一堂之上，靡不欣然，樂以天下者也。[[振鷺于飛|振振之鷺]]翔於庭 [[夙夜在公|夙夜在公]]之暇，[[鼓咽咽]]而歌舞，醉而歸焉，咸得其所樂。夫惟在上者能盡公之道，故在下者亦有同樂之心。於以見治世之風，無愁苦之民，熙熙皥皥，若[[與民同樂]]云。</p><p><strong>所出</strong>：《詩經 · 有駜》 — https://zh.wikisource.org/wiki/詩經/有駜</p></article></main></div></div>
