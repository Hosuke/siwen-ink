    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 諸侯伐秦魯人以莒人先濟</nav></header><main><article><h1>諸侯伐秦魯人以莒人先濟</h1><p>諸侯伐秦至涇，叔孫穆子引《匏有苦葉》以示必涉，魯人遂使莒人先濟。</p><p>諸侯伐秦，及涇莫濟。晉叔向見叔孫穆子曰：「諸侯謂秦不恭而討之，及涇而止，於秦何益？」穆子曰：「豹之業，及《匏有苦葉》矣，不知其他。」叔向退，召舟虞與司馬，曰：「夫苦匏不材於人，共濟而已。魯叔孫賦《匏有苦葉》，必將涉矣。具舟除隧，不共有法。」是行也，魯人以莒人先濟，諸侯從之。</p><p><strong>所出</strong>：《國語 · 卷05》 — https://zh.wikisource.org/wiki/國語/卷05</p></article></main></div></div>
