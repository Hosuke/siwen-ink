    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 循名責實</nav></header><main><article><h1>循名責實</h1><p>名實相符，乃法治之要。</p><p>循名責實者，[[鬼谷子]]所言正名循理之要也。</p><p>循名而為，實安而完。名實相生，反相為情。故曰：名當則生於實，實生於理，理生於名實之德，德生於和，和生於當。</p><p>[[鬼谷子]]符言篇以為：心為九竅之治，君為五官之長。君因其所以求因與之則不勞，聖人用之故能賞之，因之循理固能久長。此循名責實之效也。</p><p><strong>所出</strong>：《鬼谷子 · 卷02》 — https://zh.wikisource.org/wiki/鬼谷子/卷02</p></article></main></div></div>
