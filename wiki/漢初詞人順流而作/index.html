    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 漢初詞人順流而作</nav></header><main><article><h1>漢初詞人順流而作</h1><p>漢賦之興與大賦之盛</p><p>秦世不文，頗有雜賦。漢初詞人，順流而作，陸賈扣其端，賈誼振其緒，枚馬同其風，王揚騁其勢，皋朔已下，品物畢圖。繁積於宣時，校閱於成世，進御之賦千有餘首，討其源流，信興楚而盛漢矣。京殿苑獵、述行序志，並體國經野，義尚光大，既履端於倡序，亦歸餘於總亂。序以建言，首引情本；亂以理篇，迭致文契。殷人輯頌，楚人理賦，斯並鴻裁之寰域，雅文之樞轄也。</p><p><strong>所出</strong>：《文心雕龍 · 詮賦》 — https://zh.wikisource.org/wiki/文心雕龍/詮賦</p></article></main></div></div>
