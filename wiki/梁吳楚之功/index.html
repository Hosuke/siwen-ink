    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 梁吳楚之功</nav></header><main><article><h1>梁吳楚之功</h1><p>梁王扞蔽西疆，功與漢中分。</p><p>其春，吳楚齊趙七國反。吳楚先擊梁棘壁，殺數萬人。梁孝王城守睢陽，而使韓安國、張羽等為大將軍，以距吳楚。吳楚以梁為限，不敢過而西，與太尉亞夫等相距三月。吳楚破，而梁所破殺虜略與漢中分。</p><p>明年，漢立太子。其後梁最親，有功，又為大國，居天下膏腴地。地北界泰山，西至高陽，四十餘城，皆多大縣。</p><p>孝王，竇太后少子也，愛之，賞賜不可勝道。</p><p><strong>所出</strong>：《史記 · 卷058》 — https://zh.wikisource.org/wiki/史記/卷058</p></article></main></div></div>
