    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 物其旨矣，維其偕矣</nav></header><main><article><h1>物其旨矣，維其偕矣</h1><p>物之美者，必有其盛。</p><p>物其旨矣，維其偕矣。</p><p>言物既精美而旨善，則其繁盛亦與之俱來也。旨而不偕，美猶孤也；偕而不旨，盛而無益也。旨與偕合，美與盛兼，聖人之治所成，品物之盛如此。</p><p><strong>所出</strong>：《詩經 · 魚麗》 — https://zh.wikisource.org/wiki/詩經/魚麗</p></article></main></div></div>
