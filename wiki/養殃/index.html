    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 養殃</nav></header><main><article><h1>養殃</h1><p>姦臣廣奉人主耳目心志之欲，耗民力以成己私，實則長養其殃。</p><p>四曰養殃。何謂養殃？曰：人主樂美宮室台池，好飾子女狗馬以娛其心，此人主之殃也。為人臣者盡民力以美宮室台池，重賦斂以飾子女狗馬，以娛其主而亂其心，從其所欲，而樹私利其間，此謂「養殃」。</p><p>養殃者，明為奉君，實則害國也。人主有好美宮室、聲色狗馬之欲，姦臣遂竭民力以奉之，重斂以充其奉，斂怨以成其私。民心耗竭，怨歸於君；私利叢積，利歸於姦。譬如養虎以噬人，殃終不止矣。</p><p><strong>所出</strong>：《韓非子 · 八姦》 — https://zh.wikisource.org/wiki/韓非子/八奸</p></article></main></div></div>
