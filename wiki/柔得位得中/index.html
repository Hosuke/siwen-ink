    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 柔得位得中</nav></header><main><article><h1>柔得位得中</h1><p>陰居陰位而履中道，上應乎乾</p><p>「柔得位得中」者，[[同人]]六二之爻位也。</p><p>六二陰居陰位，是為「得位」；又處下卦之中，是為「得中」。以柔居中，履乎正應，上應九五之乾，是為「應乎乾」。</p><p>[[彖曰]]：「同人，柔得位得中，而應乎乾，曰同人。」言六二以柔順之德，居中履正，上應乎乾之剛健，二氣感通，乃成和同之象。天下之同人，非以力，乃以德、以正、以中道也。</p><p><strong>所出</strong>：《周易 · 同人》 — https://zh.wikisource.org/wiki/周易/同人</p></article></main></div></div>
