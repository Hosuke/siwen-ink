    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 下弦</nav></header><main><article><h1>下弦</h1><p>月之晦半，陰氣漸盛，丹法喻陽中之陰</p><p>下弦者，月二十三之月，陰氣漸長，陽氣漸消之時也。在丹法，取象道心沉溺，真知陷於坎宮，靈知飛揚於離位，水火不交，陰陽隔絕，非修煉之候也。必待顛倒施為，使沉下者浮上，浮上者沉下，方成上弦之象。</p><p><strong>所出</strong>：《悟真直指 · 卷一》 — https://zh.wikisource.org/wiki/悟真直指/卷一</p></article></main></div></div>
