    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五廟</nav></header><main><article><h1>五廟</h1><p>諸侯立五廟，一壇一墠，月祭考廟、王考廟、皇考廟，享嚐乃止顯考、祖考也。</p><p>諸侯立五廟，一壇一墠。曰考廟，曰王考廟，曰皇考廟，皆月祭之；顯考廟、祖考廟，享嚐乃止。去祖為壇，去壇為墠。壇墠有禱焉祭之，無禱乃止。去墠為鬼。</p><p><strong>所出</strong>：《禮記 · 祭法》 — https://zh.wikisource.org/wiki/禮記/祭法</p></article></main></div></div>
