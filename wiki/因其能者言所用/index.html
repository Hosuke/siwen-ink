    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 因其能者言所用</nav></header><main><article><h1>因其能者言所用</h1><p>君子之治，因人之所能而用之，無為以應萬物。</p><p>道貴因，因者，因其能者，言所用也。物固有形，形固有名，名當謂之聖人。有道之君，其處也若無知，其應物也若偶之，[[靜因之道]]也。[[不言之言]]，應也。應也者，以其為之人者也。執其名，務其應，所以成之，應之道也。[[舍己而以物為法]]，感而後應，非所設也；緣理而動，非所取也。[[過在自用罪在變化]]，自用則不虛，不虛則仵於物矣。</p><p><strong>所出</strong>：《管子 · 第36篇心術上》 — https://zh.wikisource.org/wiki/管子/第36篇心術上</p></article></main></div></div>
