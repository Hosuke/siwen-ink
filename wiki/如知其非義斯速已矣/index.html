    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 如知其非義斯速已矣</nav></header><main><article><h1>如知其非義斯速已矣</h1><p>已知非義，不待来年，當即速改，不可遲疑。</p><p>今有人日攘其鄰之雞者，或告之曰：「是非君子之道。」曰：「請損之，月攘一雞；以待來年，然後已。」如知其非義，斯速已矣，何待來年？</p><p><strong>所出</strong>：《孟子 · 滕文公下》 — https://zh.wikisource.org/wiki/孟子/滕文公下</p></article></main></div></div>
