    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 詹何治身治國</nav></header><main><article><h1>詹何治身治國</h1><p>治身為本，治國為末；未有身亂而國治者。</p><p>[[楚莊王]]問[[詹何]]曰：「治國柰何？」詹何對曰：「臣明於治身而不明於治國也。」楚莊王曰：「寡人得奉宗廟社稷，願學所以守之。」詹何對曰：「臣未嘗聞身治而國亂者也，又未嘗聞身亂而國治者也。故本在身，不敢對以末。」楚王曰：「善。」</p><p><strong>所出</strong>：《列子 · 說符篇》 — https://zh.wikisource.org/wiki/列子/說符篇</p></article></main></div></div>
