    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 囊瓦求裘</nav></header><main><article><h1>囊瓦求裘</h1><p>囊瓦求美裘於蔡昭公而不予，因拘之于南郢，終致楚蔡之隙。</p><p>蔡昭公朝於楚，有美裘，正是日，囊瓦求之，昭公不與。囊瓦遂拘昭公於南郢，歷數年然後得歸。</p><p>昭公既歸，用事乎漢，曰：「茍諸侯有欲伐楚者，寡人請為前列焉！」楚人聞之而怒，興師伐蔡。蔡請救於吳，子胥贊之，吳遂伐楚。</p><p><strong>所出</strong>：《春秋穀梁傳 · 定公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/定公</p></article></main></div></div>
