    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 言來者有外魯之辭</nav></header><main><article><h1>言來者有外魯之辭</h1><p>伐而言來，明非魯所有，以外魯言之。</p><p>魯伐邾，入邾，以邾子益來。穀梁子曰：「以者，不以者也。益之名，惡也。《春秋》有臨天下之言焉，有臨一國之言焉，有臨一家之言焉。其言來者，有外魯之辭焉。」蓋「以邾子益來」，是以外魯之辭記之，示非魯所得而有之也。伐而不言伐而言來，是明此事之非義，以外辭書之，所以賤其行也。</p><p><strong>所出</strong>：《春秋穀梁傳 · 哀公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/哀公</p></article></main></div></div>
