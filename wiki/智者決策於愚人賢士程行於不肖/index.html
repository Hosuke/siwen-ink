    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 智者決策於愚人賢士程行於不肖</nav></header><main><article><h1>智者決策於愚人賢士程行於不肖</h1><p>賢智之人反為愚不肖者所制，明主道之塞。</p><p>故智者決策於愚人，賢士程行於不肖，則賢智之士奚時得用，而人主之明塞矣。</p><p><strong>所出</strong>：《韓非子 · 人主》 — https://zh.wikisource.org/wiki/韓非子/人主</p></article></main></div></div>
