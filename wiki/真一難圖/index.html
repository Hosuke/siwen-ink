    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 真一難圖</nav></header><main><article><h1>真一難圖</h1><p>道之一，其形難以描摹，分佈萬物，各自獨居。</p><p>[[道不可以合]]，[[道弘大無形]]，[[道無形無方]]，皆言道之不可形象也。《參同契》云：「道之形象，真一難圖。變而分布，各自獨居。」真一者，道之別名，道既一矣，復以真一別之者，示其不雜乎妄也。真一無形無象，不可圖之以形，然「[[類如雞子|類如雞子]]」之喻，[[抱朴自號]]之玄泊，亦欲令學者因言以會意也。</p><p><strong>所出</strong>：《周易參同契 · 20章》 — https://zh.wikisource.org/wiki/周易參同契/20章</p></article></main></div></div>
