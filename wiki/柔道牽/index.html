    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 柔道牽</nav></header><main><article><h1>柔道牽</h1><p>象傳語，柔弱者當有所牽制，不可任其妄動也。</p><p>「系于金柅，柔道牽也。」</p><p>柔者懦弱，易流於纵，若無以制之，必至妄動而取敗。金柅止車，聖人以此象柔道之當有所牽制也。防之於始，制之於微，此聖人觀象之要旨也。</p><p><strong>所出</strong>：《周易 · 姤》 — https://zh.wikisource.org/wiki/周易/姤</p></article></main></div></div>
