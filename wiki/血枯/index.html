    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 血枯</nav></header><main><article><h1>血枯</h1><p>論血枯之病，由年少脫血、醉而入房，致氣竭肝傷，月事衰少不行。</p><p>黃帝問有病胸脅支滿、妨於食、病至先聞腥臊臭、出清液、先唾血、四肢清、目眩、時時前後血者。歧伯曰：「病名血枯。此得之年少時，有所大脫血，若醉入房中，氣竭肝傷，故月事衰少不來也。」治以四烏鰂骨一藘茹二物并合之，丸以雀卵，大如小豆，以五丸為後飯，飲以鮑魚汁，利腸中及傷肝也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第十一卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十一卷</p></article></main></div></div>
