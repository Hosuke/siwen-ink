    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 有車周无所乘之</nav></header><main><article><h1>有車周无所乘之</h1><p>車乘具存而無所用，以其無遠行之志也。</p><p>車者行之器也。周遍也，無所乘之，言車乘具在而不行用也。民既重死而安土，不輕去其居，則周行天下之具無所用焉。是以車存而無用，非毀之也，無需之也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第三十章 安居》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
