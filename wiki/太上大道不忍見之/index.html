    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 太上大道不忍見之</nav></header><main><article><h1>太上大道不忍見之</h1><p>述太上道君矜念生民枉死，因下鬼律八卷以救時世。</p><p>太上大道不忍見之，二年七月七日日中時下此鬼律八卷，紀天下鬼神姓名吉凶之術，以勑天師張道陵，使勑鬼神，不得妄轉東西南北。後有道男女生，見吾祕經，知鬼姓名皆吉，萬鬼不干，千神賓伏。此言太上道君悲憫生民受鬼侵陵，故授此律法，欲令世人知鬼神名號以辟之也。</p><p><strong>所出</strong>：《女青鬼律 · 卷1》 — https://zh.wikisource.org/wiki/女青鬼律/卷1</p></article></main></div></div>
