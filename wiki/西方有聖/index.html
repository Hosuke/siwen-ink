    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 西方有聖</nav></header><main><article><h1>西方有聖</h1><p>孔子稱道西方之聖，不治而不亂</p><p>商太宰問[[孔子]]曰：「孰者爲聖？」孔子動容有間，曰：「西方之人有聖者焉，不治而不亂，不言而自信，不化而自行，蕩蕩乎民無能名焉。丘疑其爲聖，弗知真爲聖歟？真不聖歟？」商太宰嘿然心計曰：「孔丘欺我哉！」[[孔子]]之意，聖道不止於一途，亦不以名實拘也。</p><p><strong>所出</strong>：《列子 · 仲尼篇》 — https://zh.wikisource.org/wiki/列子/仲尼篇</p></article></main></div></div>
