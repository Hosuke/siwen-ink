    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 河車搬運</nav></header><main><article><h1>河車搬運</h1><p>精氣循督脈上行，過三關，達泥丸，如車之運轉，故名河車。</p><p>河車者，精氣搬運之喻也。真陽初生，斬關透路而出，必由尾閭經過。以閉塞緊密，攻擊不開，只得驅回尾閭，連空焰起入天衢，一撞三關：尾閭、夾脊、玉京，直透頂門。此時火熾水沸，推動河車，載金上升泥丸。火候有度，抽添有時，自然鉛日減、汞日添，久之鉛盡汞乾，陰盡陽純，金丹成矣。</p><p><strong>所出</strong>：《性命圭旨 · 利集》 — https://zh.wikisource.org/wiki/性命圭旨/利集</p></article></main></div></div>
