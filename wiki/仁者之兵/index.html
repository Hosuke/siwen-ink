    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 仁者之兵</nav></header><main><article><h1>仁者之兵</h1><p>仁者之兵以王者之志為本，不可詐也。</p><p>孫卿子云：「臣之所道，仁者之兵，王者之志也。」仁人之兵，不可詐也。彼可詐者，怠慢者也，路亶者也，君臣上下之間渙然有離德者也。故以[[湯武]]伐[[桀紂]]，若誅獨夫，拱挹指麾而強暴之國莫不趨使。</p><p><strong>所出</strong>：《荀子 · 議兵篇》 — https://zh.wikisource.org/wiki/荀子/議兵篇</p></article></main></div></div>
