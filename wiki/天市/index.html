    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天市</nav></header><main><article><h1>天市</h1><p>旗四星中四星，帝車旗幟之象，市樓應人間市集。</p><p>天市者，帝車旗幟之象也。兩旗者，左旗九星在河鼓左，右旗九星在河鼓右，皆天之鼓旗，所以為旌表。占欲其明大光潤，則將軍吉；不然為兵憂。</p><p>旗中四星名天市，中六星曰市樓。市中星眾者實，虛則秏。星實則物聚，星虛則財散，此天市之驗也。</p><p><strong>所出</strong>：《史記 · 卷027》 — https://zh.wikisource.org/wiki/史記/卷027</p></article></main></div></div>
