    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 孔明辭後主</nav></header><main><article><h1>孔明辭後主</h1><p>諸葛亮之表，志盡文暢，表之英也。</p><p>孔明之辭後主，志盡文暢，雖華實異旨，並表之英也。諸葛亮輔佐後主，屢上表章，言辭懇切，志在興漢，文辭暢達，《出師表》其尤著者，志與文合，表中之冠冕也。</p></article></main></div></div>
