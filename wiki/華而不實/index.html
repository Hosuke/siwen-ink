    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 華而不實</nav></header><main><article><h1>華而不實</h1><p>言之洋洋纚纚，外觀美盛而中無實用。辭采繁縟者，人以為浮華而不足貴也。</p><p>言順比滑澤，洋洋纚纚然，則見以為華而不實。</p><p><strong>所出</strong>：《韓非子 · 難言》 — https://zh.wikisource.org/wiki/韓非子/難言</p></article></main></div></div>
