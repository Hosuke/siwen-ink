    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 商兌</nav></header><main><article><h1>商兌</h1><p>商度思量以決去就，乃能去邪就正而有喜。</p><p>九四「商兌，未寧，介疾有喜」。商，商度也；介，隔也。陽居陰位，介乎上下之間，上悅六五之君，下比六三之邪；商度未寧者，方決未定也。然能辨邪正，介然守正，故疾去而有喜。象曰「有慶」者，以其能決也。</p><p><strong>所出</strong>：《周易 · 兌》 — https://zh.wikisource.org/wiki/周易/兌</p></article></main></div></div>
