    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 信始於身，中於國，成於天下</nav></header><main><article><h1>信始於身，中於國，成於天下</h1><p>信之行有三階段，由一身而至天下。</p><p>[[桓公]]問信安始，[[管仲]]對曰：「始於為身，中於為國，成於為天下。」言信之推廣，自一身而至家國，終至天下。</p><p><strong>所出</strong>：《管子 · 第19篇中匡》 — https://zh.wikisource.org/wiki/管子/第19篇中匡</p></article></main></div></div>
