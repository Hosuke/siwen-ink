    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 賁其趾舍車而徒</nav></header><main><article><h1>賁其趾舍車而徒</h1><p>飾其足，不乘車而徒步，賤而能守義也。</p><p>初九之爻曰「賁其趾，舍車而徒」。趾者，足也。飾其足而行徒步，不乘人之車，蓋安於貧賤、不貪分外之利者也。君子飾德不飾物，守義不邀寵，車馬之榮非所干焉。</p><p><strong>所出</strong>：《周易 · 賁》 — https://zh.wikisource.org/wiki/周易/賁</p></article></main></div></div>
