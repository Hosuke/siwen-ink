    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 季友酈敗莒</nav></header><main><article><h1>季友酈敗莒</h1><p>公子友帥師敗莒師于酈，獲莒拏。</p><p>冬十月，壬午，公子友帥師敗莒師于酈，獲莒拏。季友，莊公之弟也。魯大夫季子之功莫大于是役。非卿也，嘉獲之也。公賜季友汶陽之田，及費。夫季友之敗莒，非徒以力勝也，蓋以其忠義之氣，足以服人而克敵也。是以君子嘉之。</p><p><strong>所出</strong>：《春秋左氏傳 · 僖公》 — https://zh.wikisource.org/wiki/春秋左氏傳/僖公</p></article></main></div></div>
