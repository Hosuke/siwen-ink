    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 動靜有常</nav></header><main><article><h1>動靜有常</h1><p>動止有常法，奉繩墨以為準，四時循轉而不已。</p><p>動靜有常，奉其繩墨。</p><p>動與靜，皆有常度，不可妄也。[[四時順宜，與炁相得]]，而後剛柔斷，[[五行守界]]，不妄盈縮，[[易行周流]]，屈伸反覆。動無常則失序，靜無常則溺邪。聖人之心虛一而靜，應物而不動，物來則應，事已則靜，是之謂奉其繩墨。</p><p><strong>所出</strong>：《周易參同契 · 17章》 — https://zh.wikisource.org/wiki/周易參同契/17章</p></article></main></div></div>
