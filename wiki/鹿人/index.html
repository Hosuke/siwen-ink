    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鹿人</nav></header><main><article><h1>鹿人</h1><p>隋初隱者化鹿，俠還故山而死。</p><p>唐州獵人射鹿於深山，中者呼獵者曰：「我隋初隱此山，今日合死於子之手，但置我於石間。」獵者諾之，逡巡而絕。獵人旬日再往，即亡其屍矣。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 44》 — https://zh.wikisource/wiki/歷世真仙體道通鑑/44</p></article></main></div></div>
