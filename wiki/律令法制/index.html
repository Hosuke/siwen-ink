    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 律令法制</nav></header><main><article><h1>律令法制</h1><p>律令法制，書記之一體，掌法度禁令之書。</p><p>書記廣大，申憲述兵，則有[[律令法制]]。</p><p>律者，中也。黃鐘調起，五音以正；法律馭民，八刑克平。以律為名，取中正也。令者，命也。出命申禁，有若自天，[[管仲]]下命如流水，使民從也。法者，象也。兵謀無方，而奇正有象，故曰法也。制者，裁也。上行於下，如匠之制器也。</p><p><strong>所出</strong>：《文心雕龍 · 書記》 — https://zh.wikisource.org/wiki/文心雕龍/書記</p></article></main></div></div>
