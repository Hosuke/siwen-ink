    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 振恆在上</nav></header><main><article><h1>振恆在上</h1><p>居上位而妄動，則無功而有凶。</p><p>上六：「振恆，凶。」</p><p>上六居恆之極，過恆而不中，振，動也。居上位而妄動其恆，撓亂紀綱，大無功也。《象》曰：「振恆在上，大無功也。」夫恆貴適中，過則失正。居上者當安其位、靜其心，不可妄有更張。振者，動之過也；過動則凶，無功可言。</p><p><strong>所出</strong>：《周易 · 恒》 — https://zh.wikisource.org/wiki/周易/恒</p></article></main></div></div>
