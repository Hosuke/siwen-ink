    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 兩絆而項領</nav></header><main><article><h1>兩絆而項領</h1><p>賢才失所則與庸流無異，時不我用則英豪等於凡陋。</p><p>兩絆而項領，則騏騄與蹇驢同矣；失林而居檻，則猿狖與獾貉等矣；韜鋒而不擊，則龍泉與鉛刀均矣；才遠任近，則英俊與庸王肖比矣。抱朴子連設四喻，以言賢才之失所也。夫千里之足，縶維之絆之，則跬步不能馳；匠世之功，責之於碎務之賢，則無以成其大。此物理之必然，非才之罪也。是故求千里之跡於縶維之駿，責匠世之勳於劇碎之賢，謂之不惑，吾不信也。抱朴子此論，蓋為不能用賢者發焉。</p><p><strong>所出</strong>：《抱朴子 · 卷38》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷38</p></article></main></div></div>
