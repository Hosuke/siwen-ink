    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 仲山甫</nav></header><main><article><h1>仲山甫</h1><p>周宣王之賢臣，尹吉甫詩中所美者也。</p><p>仲山甫，周宣王之賢臣。尹吉甫作詩美之，稱其德行溫柔，儀容端肅，敬慎翼翼，夙夜匪解，以事一人。出納王命，為王喉舌。賦政于外，四方響應。不侮矜寡，不畏彊禦。城彼東方，式遄其歸。其德柔嘉維則，令儀令色，古訓是式。既明且哲，以保其身。</p><p><strong>所出</strong>：《詩經 · 烝民》 — https://zh.wikisource.org/wiki/詩經/烝民</p></article></main></div></div>
