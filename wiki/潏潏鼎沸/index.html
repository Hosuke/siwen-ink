    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 潏潏鼎沸</nav></header><main><article><h1>潏潏鼎沸</h1><p>鼎沸暴涌不休，暴涌者，水火相激之甚。</p><p>潏潏鼎沸馳兮，暴涌不休止。</p><p>潏潏者，水涌之貌。鼎沸而暴涌，水之得火而激者。火候之妙，在於持其平，若暴涌而不能已，則藥走而功敗，是不可以不戒也。</p><p><strong>所出</strong>：《周易參同契 · 32章》 — https://zh.wikisource.org/wiki/周易參同契/32章</p></article></main></div></div>
