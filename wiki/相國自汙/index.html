    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 相國自汙</nav></header><main><article><h1>相國自汙</h1><p>蕭何從客計，多買田地，賤貰貸以自汙，使上心乃安。</p><p>黔布反，上自將擊之，數使使問相國何為。客有說相國曰：「君滅族不久矣。夫君位為相國，功第一，可複加哉？然君初入關中，得百姓心，十餘年矣，皆附君，常複孳孳得民和。上所為數問君者，畏君傾動關中。今君胡不多買田地，賤貰貸以自汙？上心乃安。」相國從其計，上乃大說。夫功高震主，众所猜忌，則佯為貪鄙以釋其疑，此聖人明哲保身之道也。</p><p><strong>所出</strong>：《史記 · 卷053》 — https://zh.wikisource.org/wiki/史記/卷053</p></article></main></div></div>
