    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖賢孜孜，勉之若彼</nav></header><main><article><h1>聖賢孜孜，勉之若彼</h1><p>聖賢勤勉修身，不敢怠忽。</p><p>《抱朴子》曰：聖賢孜孜，勉之若彼，淺近口止喬口止喬，忽之如此。</p><p>夫聖賢之所以為聖賢，以其孜孜汲汲，不敢少懈也。日有所勉，月有所進，終身而不已。至於淺近之徒，則喬喬然而忽之，以小善為無益而不為，以微愆為無傷而不改。積而至於敗德辱身，不知覺悟。</p><p>是以聖人貴慎始慎終，小人忽始忽終。孜孜者若登天之梯，喬喬者若決堤之水，其效相去遠矣。</p><p><strong>所出</strong>：《抱朴子 · 卷41》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷41</p></article></main></div></div>
