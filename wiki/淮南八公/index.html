    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 淮南八公</nav></header><main><article><h1>淮南八公</h1><p>從淮南王安著《淮南子》之八位學士。</p><p>天下方術之士多往歸焉。於是遂與蘇飛、夜尚、左吳、田由、雷被、毛被、伍被、晉昌等八人，及諸儒大山、小山之徒，共講論道德，總統仁義，而著此書。</p><p><strong>所出</strong>：《淮南子 · 敘目》 — https://zh.wikisource.org/wiki/淮南子/敘目</p></article></main></div></div>
