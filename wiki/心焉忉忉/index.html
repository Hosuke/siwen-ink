    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 心焉忉忉</nav></header><main><article><h1>心焉忉忉</h1><p>心懷憂懼、愁思縈結之貌。</p><p>忉忉，疊韻聯緜詞，狀心中愁思縈結、憂不能已之貌。</p><p>《防有鵲巢》首章：「誰侜予美，心焉忉忉。」言讒人離間其所美，使心焉忉忉而不能安。忉忉者，憂之極也，如繩之縈，如結之解不開。[[心焉惕惕]]之戒懼不同，忉忉重在愁思之縈，《詩》之「念彼不跡」「憂心如惔」，皆此意也。</p><p><strong>所出</strong>：《詩經 · 防有鵲巢》 — https://zh.wikisource.org/wiki/詩經/防有鵲巢</p></article></main></div></div>
