    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 博學於文約之以禮</nav></header><main><article><h1>博學於文約之以禮</h1><p>君子學道貴乎博文約禮</p><p>孔子曰：「君子博學於文，約之以禮，亦可以弗畔矣夫！」博文而不約禮，則畔矣；約禮而不博文，則固矣。博文約禮，斯合於道而不畔也。</p><p><strong>所出</strong>：《論語 · 雍也第六》 — https://zh.wikisource.org/wiki/論語/雍也第六</p></article></main></div></div>
