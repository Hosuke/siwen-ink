    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 敝</nav></header><main><article><h1>敝</h1><p>壞也。衣之敗壞曰敝，引伸為凡物之敗。</p><p>敝，敗壞也。《說文》云：「敝，一曰敗衣。」引伸之，凡物之敗壞者皆曰敝。</p><p>《緇衣》云「緇衣之宜兮，敝」，言緇衣之合宜於體也，及其敝也，則又改之。二章云「敝，予又改造兮」，三章云「敝，予又改作兮」。由「改為」而「改造」而「改作」，辭遞變而意彌切。言緇衣之敝，予之所以改之者，非惜其衣，蓋以好賢之故，是用無厭倦也。</p><p><strong>所出</strong>：《詩經 · 緇衣》 — https://zh.wikisource.org/wiki/詩經/緇衣</p></article></main></div></div>
