    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 衞靈公與夫人同車</nav></header><main><article><h1>衞靈公與夫人同車</h1><p>衞靈公與夫人同車，使孔子為次乘。</p><p>居衞月餘，靈公與夫人同車，宦者雍渠參乘，出，使孔子為次乘，招搖市過之。孔子曰：「吾未見好德如好色者也。」於是醜之，去衞。此孔子見靈公好色而賤德，遂去衞也。</p><p><strong>所出</strong>：《史記 · 卷047》 — https://zh.wikisource.org/wiki/史記/卷047</p></article></main></div></div>
