    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 焦先河渚</nav></header><main><article><h1>焦先河渚</h1><p>食草飲水無衣履</p><p>焦先失家屬，竄河渚間，食草飲水，無衣履。獨竄河渚，搆牛廬，營木為床，草褥其上。天寒搆火自炙，呻吟獨語。太和青龍中，持杖南渡，河水泛漲輒云未可。</p><p><strong>所出</strong>：《神仙傳 · 卷六》 — https://zh.wikisource/wiki/神仙傳/卷六</p></article></main></div></div>
