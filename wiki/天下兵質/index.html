    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天下兵質</nav></header><main><article><h1>天下兵質</h1><p>秦若攻韓而不拔，天下將以秦為兵之質，諸侯合從而伐之。</p><p>夫趙氏聚士卒，養從徒，欲贅天下之兵。均如貴臣之計，則秦必為天下兵質矣。陛下雖以金石相弊，則兼天下之日未也。一戰而不勝，則禍搆矣。</p><p><strong>所出</strong>：《韓非子 · 存韓》 — https://zh.wikisource.org/wiki/韓非子/存韓</p></article></main></div></div>
