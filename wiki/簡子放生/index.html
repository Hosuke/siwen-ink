    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 簡子放生</nav></header><main><article><h1>簡子放生</h1><p>競捕而死，恩過不相補；欲生當禁捕。</p><p>[[邯鄲之民]]以正月之旦獻鳩於[[簡子]]，簡子大悅，厚賞之。客問其故。簡子曰：「正旦放生，示有恩也。」客曰：「民知君之欲放之，故競而捕之，死者衆矣。君如欲生之，不若禁民勿捕。捕而放之，恩過不相補矣。」簡子曰：「然。」</p><p><strong>所出</strong>：《列子 · 說符篇》 — https://zh.wikisource.org/wiki/列子/說符篇</p></article></main></div></div>
