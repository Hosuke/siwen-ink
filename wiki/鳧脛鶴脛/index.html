    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鳧脛鶴脛</nav></header><main><article><h1>鳧脛鶴脛</h1><p>鳧脛雖短，續之則憂；鶴脛雖長，斷之則悲。以喻物各有性，不可強齊。</p><p>鳧，水鳥也，脛短；鶴，澤鳥也，脛長。莊子以為，鳧脛雖短，斷之則悲；鶴脛雖長，續之則憂。蓋性長非所斷，性短非所續，各順其性，則無所去憂也。天下之常然者，曲者不以鉤，直者不以繩，圓者不以規，方者不以矩。物之長短，乃其自然，強以繩墨規矩正之，是削其性、侵其德也。</p><p><strong>所出</strong>：《莊子 · 駢拇》 — https://zh.wikisource.org/wiki/莊子/駢拇</p></article></main></div></div>
