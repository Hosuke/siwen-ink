    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 晉文公</nav></header><main><article><h1>晉文公</h1><p></p><p>[[晉文公]]伐原，與士期七日。七日而原不下，命去之。謀士言曰：「原將下矣。」師吏請待之。公曰：「信，國之寶也。得原失寶，吾不為也。」遂去之。明年復伐之，與士期必得原然後反。原人聞之乃下。[[衛]]人聞之，以文公之信為至矣，乃歸文公。故曰「攻原得衛」者，此之謂也。夫國不以利易信，信立則民歸之，信亡則民去之。是以霸王之君，守信以得天下，不以其難而渝其約也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十九》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十九</p></article></main></div></div>
