    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 問答一氣往來</nav></header><main><article><h1>問答一氣往來</h1><p>器物各有分位不相問答，而道存乎一氣往來之間。</p><p>籩不問豆，豆不答籩，瓦不問石，石不答瓦，道亦不失。問歟答歟，一氣往來，道何在。</p><p><strong>所出</strong>：《關尹子 · 1》 — https://zh.wikisource.org/wiki/關尹子/1</p></article></main></div></div>
