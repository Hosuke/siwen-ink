    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 閔宗周</nav></header><main><article><h1>閔宗周</h1><p>周大夫傷宗周覆亡而作詩。</p><p>毛詩序云：「《黍離》，閔宗周也。周大夫行役，至于宗周，過故宗廟宮室，盡為禾黍。閔周室之顛覆，彷徨不忍去而作是詩也。」宗周者，周之鎬京，周家八百年根本之地。一旦戎狄入寇，平王東遷，舊都荒廢，宗廟宮室鞠為茂草。詩人過之，見禾黍離離，不勝麥秀之悲，故為此詩。</p><p><strong>所出</strong>：《詩經 · 黍離》 — https://zh.wikisource.org/wiki/詩經/黍離</p></article></main></div></div>
