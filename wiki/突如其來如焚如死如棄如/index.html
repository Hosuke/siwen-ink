    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 突如其來如焚如死如棄如</nav></header><main><article><h1>突如其來如焚如死如棄如</h1><p>離火自進，逼近至尊，凶命不終。</p><p>九四突如其來如，焚如死如棄如。如其來如其明始，炎始盛故曰焚如，逼近至尊，履非其位，欲進其盛以炎其上，命必不終故曰死如，違離之義，無應無承，衆所不容故曰棄如。三者皆凶，所以戒迫進之失也。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷03》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷03</p></article></main></div></div>
