    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 孔氏南陽治鐵</nav></header><main><article><h1>孔氏南陽治鐵</h1><p>宛孔氏之先，梁人，用鐵冶為業，秦伐魏遷南陽，大鼓鑄，游諸侯。</p><p>宛孔氏之先，梁人也，用鐵冶為業。秦伐魏，遷孔氏南陽。大鼓鑄，規陂池，連車騎，游諸侯，因通商賈之利，有游閒公子之賜與名。然其贏得過當，愈於纖嗇，家致富數千金，故南陽行賈盡法孔氏之雍容。</p><p><strong>所出</strong>：《史記 · 卷129》 — https://zh.wikisource.org/wiki/史記/卷129</p></article></main></div></div>
