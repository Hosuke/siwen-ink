    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 淫辭</nav></header><main><article><h1>淫辭</h1><p>巧言飾辭，悖於道理，非辭無以相期，從辭則亂。</p><p>非辭無以相期，從辭則亂。亂辭之中又有辭焉，心之謂也。言不欺心，則近之矣。凡言者，以諭心也。言心相離，而上無以參之，則下多所言非所行也，所行非所言也。言行相詭，不祥莫大焉。淫辭者，巧言飾辭，悖於道理也。[[言意相離]]，淫辭之所以興也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十八》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十八</p></article></main></div></div>
