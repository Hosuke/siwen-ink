    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以殘害于爾萬姓</nav></header><main><article><h1>以殘害于爾萬姓</h1><p>宮室臺榭、陂池侈服之末，皆以殘害萬民。</p><p>惟宮室、臺榭、陂池、侈服，以殘害于爾萬姓。</p><p>商王廣修土木，厚斂以奉耳目之娛，而不知其害及萬民也。非特酒色而已，凡土木之功、遊觀之具，皆取民力以逞己欲，故曰殘害萬姓。</p><p><strong>所出</strong>：《尚書 · 泰誓上》 — https://zh.wikisource.org/wiki/尚書/泰誓上</p></article></main></div></div>
