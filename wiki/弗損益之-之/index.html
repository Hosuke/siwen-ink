    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 弗損益之-之</nav></header><main><article><h1>弗損益之-之</h1><p>《損》卦以“弗損益之”闡述剛柔迭用、</p><p>《損》卦六二與上九皆言「弗損益之」。六二以陰居中，柔得其中道，故利於貞定而征伐則凶，弗損於彼以益之。九二亦以陽居中，言弗損益之，蓋柔中能守，不妄有增損，則無往而不利。上九居損之極，弗損益之，无咎，貞吉，利有攸往，得臣无家。《象傳》總而言之曰「損剛益柔有時，損益盈虛，與時偕行」，言損之為道，剛柔迭用，盈虛相濟，務在合乎時宜，不膠於一定也。</p><p>  <strong>所出</strong>：《周易 · 損》 — https://zh.wikisource.org/wiki/周易/損</p></article></main></div></div>
