    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 正天下有分</nav></header><main><article><h1>正天下有分</h1><p>正天下必有其分義，七法是也。</p><p>《管子》明霸王之功，必本於七法。其言曰：「兵必勝敵國矣，而不明正天下之分，猶之不可。」分者，[[則]][[象]][[法]][[化]][[決塞]][[心術]][[計數]]之序也。正天下有分，然後霸王之功可成。</p><p><strong>所出</strong>：《管子 · 七法》 — https://zh.wikisource.org/wiki/管子/七法/七法</p></article></main></div></div>
