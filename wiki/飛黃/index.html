    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 飛黃</nav></header><main><article><h1>飛黃</h1><p>騰黃之獸，色黃狀如狐，背有兩角，龍翼，出日本國，壽三千歲，日行萬里。</p><p>又有騰黃之獸，其色黃，狀如狐，背上有兩角，龍翼。一名乘若，一名飛黃，或曰古黃，又曰翠黃，出日本國，壽三千歲，日行萬里。乘川令人壽二千歲，出日本國，壽二千歲。《六典》曰：宋齊樑陳皆有車府乘黃之官，今太僕寺有乘黃署，即其事也。薛綜曰：與騰黃一也，所出之國各別。葛稚川曰：騰黃之馬吉光之獸。則獸馬各異。今據吉光即馬，騰黃即獸。帝得而乘之，遂周遊六合。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 1》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/1</p></article></main></div></div>
