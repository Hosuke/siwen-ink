    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 情訛致文澆</nav></header><main><article><h1>情訛致文澆</h1><p>用詞乖舛，則情隨之而變；情既失正，文亦隨之而弊。</p><p>「字以訓正，義以理宣」，此用字之常法也。劉勰深憂晉末之文，篇章之內，依希其旨，虛言架空。所謂「賞際奇至」「撫叩酬即」，</p></article></main></div></div>
