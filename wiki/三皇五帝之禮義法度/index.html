    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三皇五帝之禮義法度</nav></header><main><article><h1>三皇五帝之禮義法度</h1><p>師金以柤梨橘柚為喻，禮義法度應時而變，不矜於同而矜於治。</p><p>師金曰：「夫三皇五帝之禮義法度，不矜於同而矜於治。故譬三皇五帝之禮義法度，其猶柤■{梨}橘柚邪！其味相反而皆可於口。故禮義法度者，應時而變者也。」</p><p><strong>所出</strong>：《莊子 · 天運》 — https://zh.wikisource.org/wiki/莊子/天運</p></article></main></div></div>
