    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 王跡起於閭巷</nav></header><main><article><h1>王跡起於閭巷</h1><p>帝王之興，本於閭巷，非必貴胄也。</p><p>太史公論秦楚之際曰：「王跡之興，起於閭巷，合從討伐，軼於三代，鄉秦之禁，適足以資賢者為驅除難耳。」秦既稱帝，患兵革不休，無尺土之封，墮壞名城，銷鋒鏑，意在杜絕後患。然聖人起於布衣，賢者不以無土而不王。此乃天意使然，非偶然也。</p><p><strong>所出</strong>：《史記 · 卷016》 — https://zh.wikisource.org/wiki/史記/卷016</p></article></main></div></div>
