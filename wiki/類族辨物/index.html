    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 類族辨物</nav></header><main><article><h1>類族辨物</h1><p>君子別其同異以成天下之同</p><p>「類族辨物」，[[同人]][[象曰]]之言，君子觀象之所為也。</p><p>類族者，別其族類之同異，使各當其分；辨物者，別其器物之差等，使物歸其性。[[同人]]之世，萬民兆姓，情志不齊，聖人因其性而導之，觀天與火之象，則知大同之中有別，別之中有同，乃能和而不流，群而不黨。</p><p>類族故能容，辨物故能公，容與公合，乃成天下之同。[[大學]][[絜矩之道]]，[[中庸]]「萬物並育而不相害」，皆此義之推也。</p><p><strong>所出</strong>：《周易 · 同人》 — https://zh.wikisource.org/wiki/周易/同人</p></article></main></div></div>
