    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 禮要</nav></header><main><article><h1>禮要</h1><p>禮失於繁惑，能師於儉者可以得其要。</p><p>夫禮者，道出於君而君由不知，事出於職而職由不明。儒者棲山林，敬師友，窮理樂，講本末。暨乎見羽葆車輅之狀，鐘鼓簫韶之作，則矍然若鹿，怡然若豕；若醉於酒，若溺於水，莫知道之本，莫窮禮旨。謂弓為弧，則民不知矣；謂馬為駟，則民莫信矣。所以數亂於多，不亂於少；禮惑於大，不惑於小。能師於儉者，可以得其要。</p><p><strong>所出</strong>：《化書 · 卷六》 — https://zh.wikisource.org/wiki/化書/卷六</p></article></main></div></div>
