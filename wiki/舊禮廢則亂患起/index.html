    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 舊禮廢則亂患起</nav></header><main><article><h1>舊禮廢則亂患起</h1><p>舊禮若廢，則如舊坊毀而水敗，必有亂患随之。</p><p>夫禮，禁亂之所由生，猶坊止水之所自來也。故以舊坊為無所用而壞之者，必有水敗；以舊禮為無所用而去之者，必有亂患。故昏姻之禮廢，則夫婦之道苦，而淫辟之罪多矣。鄉飲酒之禮廢，則長幼之序失，而爭闘之獄繁矣。喪祭之禮廢，則臣子之恩薄，而倍死忘生者眾矣。聘覲之禮廢，則君臣之位失，諸侯之行惡，而倍畔侵陵之敗起矣。</p><p><strong>所出</strong>：《禮記 · 經解》 — https://zh.wikisource.org/wiki/禮記/經解</p></article></main></div></div>
