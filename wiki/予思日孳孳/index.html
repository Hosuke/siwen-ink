    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 予思日孳孳</nav></header><main><article><h1>予思日孳孳</h1><p>記禹自述孳孳治水之志</p><p>舜命禹平水土，禹拜稽首，讓于稷、契、皋陶。舜曰：「汝其往視爾事矣。」舜問：「何謂孳孳？」禹對曰：「鴻水滔天，浩浩懷山襄陵，下民皆服於水。予陸行乘車，水行乘舟，泥行乘橇，山行乘檋，行山栞木。與予衆庶稻鮮食。以決九川致四海，浚畎澮致之川。與予衆庶難得之食。食少，調有餘補不足，徙居。衆民乃定，萬國爲治。」</p><p><strong>所出</strong>：《史記 · 卷002》 — https://zh.wikisource.org/wiki/史記/卷002</p></article></main></div></div>
