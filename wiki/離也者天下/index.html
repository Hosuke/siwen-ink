    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 離也者天下</nav></header><main><article><h1>離也者天下</h1><p>離者，天下之公理也；獨而正，萬物各趨變不相須，不假彼以成此，不持此以亂彼。</p><p>離也者天下，故獨而正。天下之物，莫不因其自然而自離。物物斯離，不相雜也；各各趨變，不相須也。不相須，故不假彼以成此；不相離，故不持此以亂彼。是以聖人卽物而冥，卽事而靜。卽事而靜，故天下安存；卽物而冥，故物皆得性。物皆得性，則彼我同親；天下安存，則名實不浮。離者，天地之常理；獨者，聖人之正行。萬物各保其性，不相陵犯，此之謂天下之正。</p><p><strong>所出</strong>：《公孫龍子 · 5》 — https://zh.wikisource.org/wiki/公孫龍子/5</p></article></main></div></div>
