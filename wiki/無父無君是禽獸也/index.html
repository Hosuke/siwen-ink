    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無父無君是禽獸也</nav></header><main><article><h1>無父無君是禽獸也</h1><p>不盡父子之親、不守君臣之義，則與禽獸無異。</p><p>楊朱、墨翟之言盈天下。天下之言，不歸楊則歸墨。楊氏為我，是無君也；墨氏兼愛，是無父也。無父無君，是禽獸也。公明儀曰：「庖有肥肉，廐有肥馬，民有饑色，野有餓莩，此率獸食人也。」楊墨之道不息，孔子之道不著，是邪說誣民、充塞仁義也。仁義充塞，則率獸食人，人將相食。</p><p><strong>所出</strong>：《孟子 · 滕文公下》 — https://zh.wikisource.org/wiki/孟子/滕文公下</p></article></main></div></div>
