    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 胞有重閬</nav></header><main><article><h1>胞有重閬</h1><p>胞有重閬，心有天遊，言人當遊於大道，不可為物所拘。</p><p>胞有重閬，心有天遊。室無空虛，則婦姑勃谿；心無天遊，則六鑿相攘，大林丘山之善於人也，亦神者不勝。</p><p>夫胞胎之間，空虛相通，此所以生也；人心之中，天遊自在，此所以神也。室不虛則家人相爭，心不遊則六鑿交攘。[[莊子]] 此言，與[[虛室生白]] 同旨，皆言虛空乃心之主宰。天遊者，無所羈繫，與[[乘物以游心]] 之義相發。</p><p><strong>所出</strong>：《莊子 · 外物》 — https://zh.wikisource.org/wiki/莊子/外物</p></article></main></div></div>
