    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 李疵視中山</nav></header><main><article><h1>李疵視中山</h1><p>喻好賢雖美，過度則害農戰</p><p>趙主父使李疵視中山可攻不也。還報曰：「中山可伐也。君不亟伐，將後齊、燕。」主父曰：「何故可攻？」疵曰：「其君見好巖穴之士，所傾蓋與車以見窮閭隘巷之士以十數，伉禮下布衣之士以百數矣。」君曰：「以子言論，是賢君也，安可攻？」疵曰：「不然。夫好顯巖穴之士而朝之，則戰士怠於行陣；上尊學者，下士居朝，則農夫惰於田。戰士怠於行陳者，則兵弱也；農夫惰於田者，則國貧也。兵弱於敵，國貧於内，而不亡者，未之有也。」</p><p><strong>所出</strong>：《韓非子 · 外儲說左上》 — https://zh.wikisource.org/wiki/韓非子/外儲說左上</p></article></main></div></div>
