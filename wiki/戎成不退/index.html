    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 戎成不退</nav></header><main><article><h1>戎成不退</h1><p>兵戎已成而未退，危亡亟也。</p><p>「戎成不退，飢成不遂。」言外寇已興，兵戎已成，而王不能用賢以退之；饑饉已成，而民無所遂生也。戎，指玁狁之患；飢，指饑饉之灾。成者，構也、積也。言內外交迫，危亡之勢已成，而莫有能解之者。下文云「曾我暬御，憯憯日瘁」，則詩人自傷其微賤，不能有所匡救也。</p><p><strong>所出</strong>：《詩經 · 雨無正》 — https://zh.wikisource.org/wiki/詩經/雨無正</p></article></main></div></div>
