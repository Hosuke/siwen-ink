    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 奚斯所作</nav></header><main><article><h1>奚斯所作</h1><p>詩末明言作者為公子奚斯，《詩經》三百篇中僅見。</p><p>詩末章云「松桷有舄，路寢孔碩，新廟奕奕。奚斯所作，孔曼且碩，萬民是若」，明言此詩乃奚斯所作。</p><p>考之《左傳》，公子魚字奚斯，為魯國大夫。詩言「新廟奕奕」，蓋閟宮之新修宗廟也。詩之作，以閟宮新廟落成而頌美之。末句「孔曼且碩，萬民是若」，贊詩辭之宏大，萬民以為法則。《詩經》諸篇多不著作者姓名，唯此篇明言「奚斯所作」，於三百篇中最為特殊。</p><p><strong>所出</strong>：《詩經 · 閟宮》 — https://zh.wikisource.org/wiki/詩經/閟宮</p></article></main></div></div>
