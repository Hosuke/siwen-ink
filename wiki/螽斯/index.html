    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 螽斯</nav></header><main><article><h1>螽斯</h1><p>詩以蝗蟲之多子喻后妃不妬、子孫繁盛之祥。</p><p>《螽斯》為《詩經·周南》篇名，凡三章。毛詩序云：「后妃子孫衆多也。言若螽斯，不妬忌，則子孫衆多也。」</p><p>螽斯者，直翅目昆蟲，蝗類之屬也。詩人取其羽翼振動之聲，以喻子孫繁多之象。全詩三章反覆詠歎，言螽斯之「詵詵」「薨薨」「揖揖」，而祝願子孫之「振振」「繩繩」「蟄蟄」，皆以蟲之多子興人之一族，以見后妃逮下、則福祉攸同之意。</p><p>所出：《詩經 · 螽斯》 — https://zh.wikisource.org/wiki/詩經/螽斯</p></article></main></div></div>
