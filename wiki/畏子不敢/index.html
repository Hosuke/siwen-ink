    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 畏子不敢</nav></header><main><article><h1>畏子不敢</h1><p>非畏其人，乃畏禮法，言世衰而情不得伸也。</p><p>「豈不爾思，畏子不敢」，[[穀則異室]]之故也。女子之心豈無所慕？特以大夫不能聽其-{zh-cn:讼}-，禮義陵遲之世，私情無由得白，是以不敢爾也。[[陳古刺今]]刺之者，正刺此時此世，使古之明禮者為大夫，必能聽斷其-{zh-cn:讼}-，則有情人得遂矣。與[[死則同穴]]之決誓相映，一生一死，情人之心大明。</p><p><strong>所出</strong>：《詩經 · 大車》 — https://zh.wikisource.org/wiki/詩經/大車</p></article></main></div></div>
