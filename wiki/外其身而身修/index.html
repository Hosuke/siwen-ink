    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 外其身而身修</nav></header><main><article><h1>外其身而身修</h1><p>身處甕外而能運甕，喻修煉當外其身而形自存。</p><p>真空煉形之法，譬如運甕。若處甕內，焉能運之？必也處於甕外。</p><p>老子曰：「外其身而身修，忘其形而形存。」薛道光曰：「若人空此幻化身，親授聖師真規則。」張全一曰：「太虛是我，先空其身。其身既空，天地亦空；天地既空，太空亦空；空無所空，乃是真空。」</p><p>清靜經云：「形無其形者，身空也；心無其心者，心空也。」如此方是形神俱妙之道。</p><p><strong>所出</strong>：《性命圭旨 · 貞集》 — https://zh.wikisource.org/wiki/性命圭旨/貞集</p></article></main></div></div>
