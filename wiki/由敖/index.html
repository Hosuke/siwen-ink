    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 由敖</nav></header><main><article><h1>由敖</h1><p>招之敖遊，燕樂之事</p><p>「右招我由敖」，敖與「遨」通，遊也。「由敖」者，相與敖遊也。與「由房」同義，皆言退居燕樂，不任世事。詩之二章，反覆詠歎，以見君子於亂世相招為樂，非進取也。</p><p><strong>所出</strong>：《詩經 · 君子陽陽》 — https://zh.wikisource.org/wiki/詩經/君子陽陽</p></article></main></div></div>
