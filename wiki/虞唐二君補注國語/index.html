    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 虞唐二君補注國語</nav></header><main><article><h1>虞唐二君補注國語</h1><p>建安、黃武間，侍御史虞君、尚書僕射唐君，因賈為主而損益《國語》。</p><p>建安、黃武之間，故侍御史會稽虞君、尚書僕射丹陽唐君，皆英才碩儒，洽聞之士也，采摭所見，因賈為主而損益之。觀其辭義，信多善者，然所理釋，猶有異同。</p><p><strong>所出</strong>：《國語 · 國語解敘》 — https://zh.wikisource.org/wiki/國語/國語解敘</p></article></main></div></div>
