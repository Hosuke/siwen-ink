    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 兼并易能唯堅凝之難</nav></header><main><article><h1>兼并易能唯堅凝之難</h1><p>兼並不難，凝結人心為難。</p><p>孫卿子云：「兼并易能也，唯堅凝之難焉。齊能并宋而不能凝也，故魏奪之；燕能并齊而不能凝也，故田單奪之。」能並之而不能凝，則必奪。不能並之又不能凝其有，則必亡。能凝之則必能並之矣。得之則凝，兼並無強。</p><p><strong>所出</strong>：《荀子 · 議兵篇》 — https://zh.wikisource.org/wiki/荀子/議兵篇</p></article></main></div></div>
