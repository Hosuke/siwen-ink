    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 用拯馬壯</nav></header><main><article><h1>用拯馬壯</h1><p>乘壯馬以拯救，避患速行則吉</p><p>「初六：用拯馬壯，吉」。</p><p>初六居渙之始，柔弱无援，當急以壯馬拯救之。馬壯則行速，拯救遲則散不可收，故速則吉也。馬象乾之健，壯馬象九二之陽剛，陰附陽而得援，故吉。</p><p><strong>所出</strong>：《周易 · 渙》 — https://zh.wikisource.org/wiki/周易/渙</p></article></main></div></div>
