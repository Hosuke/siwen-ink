    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 人一之於禮義</nav></header><main><article><h1>人一之於禮義</h1><p>人或偏於禮義，或偏於情性；偏則俱失，兼則俱得。</p><p>苟生之為見，若者必死；苟利之為見，若者必害；苟怠惰偷懦之為安，若者必危；苟情說之為樂，若者必滅。故人一之於禮義，則兩得之矣；一之於情性，則兩喪之矣。故儒者將使人兩得之者也，墨者將使人兩喪之者也，是儒墨之分也。</p><p><strong>所出</strong>：《荀子 · 禮論篇》 — https://zh.wikisource.org/wiki/荀子/禮論篇</p></article></main></div></div>
