    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無身無患</nav></header><main><article><h1>無身無患</h1><p>忘身則患去，復性之要也。</p><p>[[為吾有身也|為吾有身]]，故有大患。及吾無身，何患之有？[[老子]]以「無身」為解脫患難之方，非厭棄此身，乃忘其有身之念耳。世人執有我故有患，能悟此身本空，則患自無所施。此[[老子 (帛書本) · 章十三|帛書本]]之義，與[[老子 (王弼本) · 章十三|王弼本]]「及吾無身，吾有何患」辭異而旨同。</p><p><strong>所出</strong>：《老子 (帛書本) · 章十三》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
