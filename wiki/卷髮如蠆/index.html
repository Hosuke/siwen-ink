    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 卷髮如蠆</nav></header><main><article><h1>卷髮如蠆</h1><p>髮髮卷曲如蠆，古代女子髮式之喻</p><p>彼君子女，卷髮如蠆。</p><p>語出《詩經·小雅·都人士》。蠆，螫也。言彼君子之女，捲曲其髮，若蠆之有歧角然。此皆古者容飾之有常，非如今之衣服無常也。詩人舉彼都人士與君子之女，以見古風之善，而歎今之不然。</p><p><strong>所出</strong>：《詩經 · 都人士》 — https://zh.wikisource.org/wiki/詩經/都人士</p></article></main></div></div>
