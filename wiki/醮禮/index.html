    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 醮禮</nav></header><main><article><h1>醮禮</h1><p>不醴則醮，迭用清酒，三加行三醮，各有祝辭。</p><p>醮禮者，[[醴禮]]之變禮也。若主人不以醴，則迭用酒。尊於房戶之間，兩甒有禁，玄酒在西。始醮用脯醢，賔降取爵，辭降如初，卒洗升酌。冠者拜受，祭脯醢，祭酒，啐酒而降。再醮、三醮皆如初儀，三醮則兼用乾肉折俎。[[醮辭]]有序：始醮曰「旨酒既清，嘉薦亶時」，再醮曰「旨酒既湑，嘉薦伊脯」，三醮曰「旨酒令芳，籩豆有楚」。三醮畢，北面取脯以見於母，若殺則特豚載合升，儀物加盛焉。</p><p><strong>所出</strong>：《儀禮 · 士冠禮》 — https://zh.wikisource.org/wiki/儀禮/士冠禮</p></article></main></div></div>
