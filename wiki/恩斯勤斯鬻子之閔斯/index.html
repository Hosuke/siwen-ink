    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 恩斯勤斯鬻子之閔斯</nav></header><main><article><h1>恩斯勤斯鬻子之閔斯</h1><p>恩勤撫育，鞠子至苦，言父母養育之艱。</p><p>「恩斯勤斯，鬻子之閔斯」，出《詩經·鴟鴞》之首章。言鳥之所以恩愛、勤勞者，以其鞠育雛子，至於昏昧而不知休息也。「恩斯勤斯」者，恩義勤苦之謂；「鬻子」者，育子也；「閔斯」者，憐愛之甚也。</p><p>此句後世引申以言父母之恩勤、鞠育之艱辛，遂為言恩勤之典。</p><p><strong>所出</strong>：《詩經 · 鴟鴞》 — https://zh.wikisource.org/wiki/詩經/鴟鴞</p></article></main></div></div>
