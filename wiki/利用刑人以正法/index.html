    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 利用刑人以正法</nav></header><main><article><h1>利用刑人以正法</h1><p>發蒙之初，當用刑罰以正其法。</p><p>初六：發蒙，利用刑人，用說桎梏，以往吝。象曰：「利用刑人，以正法也。」</p><p>發蒙者，開發其蒙也。當蒙昧始發之時，非刑罰不足以正之。刑人者，刑之于人以為戒也。用說桎梏者，刑之不可以過也。苟刑之太甚，則往而吝矣。象言「利用刑人，以正法」者，正所以明刑之不可已，而非以虐人也。</p><p><strong>所出</strong>：《周易 · 蒙》 — https://zh.wikisource.org/wiki/周易/蒙</p></article></main></div></div>
