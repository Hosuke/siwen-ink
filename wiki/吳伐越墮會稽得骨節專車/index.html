    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 吳伐越墮會稽</nav></header><main><article><h1>吳伐越墮會稽</h1><p>吳國伐越毀壞會稽山得一節骨可專一車。</p><p>吳伐越，墮會稽，得骨節專車。吳使使問仲尼：「骨何者最大？」仲尼曰：「禹致羣神於會稽山，防風氏後至，禹殺而戮之，其節專車，此為大矣。」此孔子答吳客之問，論防風氏之骨也。</p><p><strong>所出</strong>：《史記 · 卷047》 — https://zh.wikisource.org/wiki/史記/卷047</p></article></main></div></div>
