    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 內輯億萬之眾</nav></header><main><article><h1>內輯億萬之眾</h1><p>中國一統，天子席捲四海之內，團聚億萬民眾之力。</p><p>太史公盛稱漢室之隆，以為明天子在上，兼文武，席卷四海，內輯億萬之眾。「席卷」言橫掃四方，無遠弗屆；「內輯」言團聚億兆民人，使歸一統。此以見大一統之世，內外兼脩，威德並施之義。</p><p><strong>所出</strong>：《史記 · 卷020》 — https://zh.wikisource.org/wiki/史記/卷020</p></article></main></div></div>
