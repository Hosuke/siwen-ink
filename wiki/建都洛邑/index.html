    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 建都洛邑</nav></header><main><article><h1>建都洛邑</h1><p>周公相宅卜地，營建東都，以配天命。</p><p>惟太保先周公相宅，越若來三月丙午朏，越三日戊申，太保朝至于洛，卜宅。厥既得卜，則經營。越三日庚戌，太保乃以庶殷攻位于洛汭，越五日甲寅，位成。</p><p>周公朝至于洛，達觀于新邑營。乃作大邑于土中，配皇天焉。</p><p>王來紹上帝，自服于土中。旦曰：「其作大邑，其自時配皇天；毖祀于上下，其自時中乂。王厥有成命，治民，今休。」</p><p>是知建都洛邑，非徒廣土而已，乃所以上承天命、下治中土也。</p><p><strong>所出</strong>：《尚書 · 召誥》 — https://zh.wikisource.org/wiki/尚書/召誥</p></article></main></div></div>
