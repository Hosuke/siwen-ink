    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鼎湖弓烏號</nav></header><main><article><h1>鼎湖弓烏號</h1><p>黃帝上天，百姓抱其弓與龍胡髯號，後世名其處曰鼎湖，其弓曰烏號。</p><p>[[公孫卿]]引申功言：「有龍垂胡髯下迎黃帝，黃帝上騎，群臣後宮從上龍七十餘人，乃上去。百姓仰望黃帝既上天，乃抱其弓與龍胡髯號。故後世因名其處曰[[鼎湖]]，其弓曰烏號。」</p><p><strong>所出</strong>：《史記 · 卷012》 — https://zh.wikisource.org/wiki/史記/卷012</p><hr><p>孝武建元元年，置茂陵。六年，孝景太后崩。</p><p>  <strong>所出</strong>：《史記 · 卷022》 — https://zh.wikisource.org/wiki/史記/卷022</p></article></main></div></div>
