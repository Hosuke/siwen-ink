    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 選陳</nav></header><main><article><h1>選陳</h1><p>善陳者不戰而勝，選陳之要在乎知己知敵、計定而後動。</p><p>陳，列陳也。選陳者，審敵我之勢，據形勢而列陣，不以力角而以智取之謂也。</p><p>其文曰：「不明於敵人之政，不能加也；不明於敵人之情，不可約也；不明於敵人之將，不先軍也；不明於敵人之士，不先陳也。」又曰：「以眾擊寡，以治擊亂，以富擊貧，以能擊不能，以教卒練士擊敺眾白徒。故十戰十勝，百戰百勝。」</p><p>由是觀之，選陳之要，在知敵而後陳之，非陳之在人而陳之在我也。[[善陳者不戰]]，善選陳者，無敵於天下。</p><p><strong>所出</strong>：《管子 · 選陳》 — https://zh.wikisource.org/wiki/管子/七法/選陳</p></article></main></div></div>
