    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 說之大，民勸矣哉</nav></header><main><article><h1>說之大，民勸矣哉</h1><p>悅民之道至大則民自相勸勉，不待驅迫。</p><p>語出彖傳「說以犯難，民忘其死；說之大，民勸矣哉」。夫悅以先民，民忘其勞；悅以犯難，民忘其死；至於說之為道大焉，則民相勸勉，樂趨上之所好，不待刑罰驅迫而自為善。此聖人之治，以悅感人，其效至於不賞而民勸也。</p><p><strong>所出</strong>：《周易 · 兌》 — https://zh.wikisource.org/wiki/周易/兌</p></article></main></div></div>
