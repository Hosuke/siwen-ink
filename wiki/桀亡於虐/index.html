    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 桀亡於虐</nav></header><main><article><h1>桀亡於虐</h1><p>桀為天子，不脩德而武傷百姓，湯伐之，桀走而死，悔不用伊尹之言。</p><p>夏桀之時，自以為天下諸侯多畔，不務德而武傷百姓，百姓弗堪。迺召湯而囚之，已而釋之。湯脩德，諸侯皆歸，遂率兵以伐桀。桀走，遂放而死。桀謂人曰：「吾悔不遂殺於有莘之俠，使至此。」乃踐天子位，代朝天下。</p><p><strong>所出</strong>：《史記 · 卷002》 — https://zh.wikisource.org/wiki/史記/卷002</p></article></main></div></div>
