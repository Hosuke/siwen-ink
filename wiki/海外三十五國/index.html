    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 海外三十五國</nav></header><main><article><h1>海外三十五國</h1><p>述海外殊方異民之狀</p><p>凡海外三十五國。自西北至西南方，有修股民、天民、肅慎民、白民、沃民、女子民、丈夫民、奇股民、一臂民、三身民。自西南至東南方，結胸民、羽民、歡頭國民、裸國民、三苗民、交股民、不死民、穿胸民、反舌民、豕喙民、鑿齒民、三頭民、修臂民。自東南至東北方，有大人國、君子國、黑齒民、玄股民、毛民、勞民。自東北至西北方，有跂踵民、句嬰民、深目民、無腸民、柔利民、一目民、無繼民。</p><p><strong>所出</strong>：《淮南子 · 墜形訓》 — https://zh.wikisource.org/wiki/淮南子/墜形訓</p></article></main></div></div>
