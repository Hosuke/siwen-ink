    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 沖氣以為和</nav></header><main><article><h1>沖氣以為和</h1><p>沖虛之氣以致萬物之和</p><p>帛書作「中氣以為和」，[[萬物負陰而抱陽|萬物負陰而抱陽，中氣以為和]]，[[萬物皆種|萬物]]稟[[道生一|道]]之[[一氣能變|一氣]]而生，[[陰陽之門|陰陽]]相薄，[[中和|中氣]]和會，是生萬物之理。</p><p>  <strong>所出</strong>：《老子 (帛書校勘版) · 第五章 中和》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
