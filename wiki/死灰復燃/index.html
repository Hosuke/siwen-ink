    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 死灰復燃</nav></header><main><article><h1>死灰復燃</h1><p>勢雖微而可復盛，喻人雖困厄終有再起之時。</p><p>韓安國嘗坐法抵罪，蒙獄吏田甲辱之。安國曰：「死灰獨不復然乎？」田甲曰：「然即溺之。」居無何，安國起大徒中，爲二千石。田甲亡走，安國曰：「甲不就官，我滅而宗。」甲因肉袒謝。安國笑曰：「可溺矣！公等足與治乎？」卒善遇之。</p><p><strong>所出</strong>：《史記 · 卷108》 — https://zh.wikisource.org/wiki/史記/卷108</p></article></main></div></div>
