    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 季友奔莒</nav></header><main><article><h1>季友奔莒</h1><p>慶父作亂，季友奉湣公弟申奔邾，因魯人之請而立之。</p><p>湣公二年，慶父與哀姜通益甚。哀姜與慶父謀殺湣公而立慶父。慶父使卜齮襲殺湣公於武闈。季友聞之，自陳與湣公弟申如邾，請魯求內之。魯人欲誅慶父。慶父恐，奔莒。於是季友奉子申入，立之，是爲僖公。</p><p><strong>所出</strong>：《史記 · 魯周公世家》 — https://zh.wikisource.org/wiki/史記/魯周公世家</p></article></main></div></div>
