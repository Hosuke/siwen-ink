    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 明庶政无敢折獄</nav></header><main><article><h1>明庶政无敢折獄</h1><p>治以明，刑以威，二者不可混淆。</p><p>賁之象，山下有火，熠耀幽隱。先王以明庶政，无敢折獄。夫政者，正民之行也；獄者，治民之末也。明乎政則民自正，無待於刑；若折獄以明，則刑濫而威失其本矣。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷03》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷03</p></article></main></div></div>
