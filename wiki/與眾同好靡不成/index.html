    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 與眾同好靡不成</nav></header><main><article><h1>與眾同好靡不成</h1><p>與眾同好則無不成，與眾同惡則無不傾。</p><p>《軍讖》曰：「與眾同好，靡不成；與眾同惡，靡不傾。」</p><p>治國安家，得人也；亡國破家，失人也。含氣之類，咸願得其志。人主能與百姓同其好惡，則天下歸心，事無不成；反是，則眾叛親離，國必傾覆。此治亂之本也。</p><p><strong>所出</strong>：《三略》 — https://zh.wikisource.org/wiki/三略</p></article></main></div></div>
