    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 賢經</nav></header><main><article><h1>賢經</h1><p>賢明之善辭，治世所資也</p><p>[[賢經]]者，拘校上古、中古、下古賢明之善辭，以類相從而成者也。</p><p>[[太平經]]云：「拘校上古、中古、下古之賢明辭，其中大善者卷記一，十卷得十，百卷得百，積而至億。」又云：「[[賢明]]共安之，去其復重，編而置之，即成賢經矣。」</p><p>[[賢經]]與[[聖經]]、 [[德經]]並行，為治世所資之大文也。</p><p><strong>所出</strong>：《太平經 · 09》 — https://zh.wikisource.org/wiki/太平經/09</p></article></main></div></div>
