    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 采芑</nav></header><main><article><h1>采芑</h1><p>詠方叔帥師南征，車馬之盛，武功之威。</p><p>《采芑》，《詩經·小雅·鴻雁之什》之一也。薄言采芑，于彼新田，于此菑畝。方叔涖止，其車三千，師干之試。言宣王南征，命方叔將兵，車眾師盛，赫然有威。詩言：「鴥彼飛隼，其飛戾天，亦集爰止。顯允方叔，伐鼓淵淵，振旅闐闐。」又言：「戎車嘽嘽，嘽嘽焞焞，如霆如雷。顯允方叔，征伐玁狁，蠻荊來威。」終以「蠢爾蠻荊，大邦為讎」，而方叔元老，克壯其猶，執訊獲醜，武功告成。四章，章十二句。</p><p><strong>所出</strong>：《詩經 · 采芑》 — https://zh.wikisource.org/wiki/詩經/采芑</p></article></main></div></div>
