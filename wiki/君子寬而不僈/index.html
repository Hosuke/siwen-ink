    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 君子寬而不僈</nav></header><main><article><h1>君子寬而不僈</h1><p>君子寬容而不怠惰，廉隅而不傷人，辯而不爭，察而不激。</p><p>君子寬而不僈，廉而不劌，辯而不争，察而不激，直立而不勝，堅彊而不曓，柔從而不流，恭敬謹慎而容，夫是之謂至文。《詩》曰：「溫溫恭人，惟德之基。」此之謂也。</p><p><strong>所出</strong>：《荀子 · 不苟篇》 — https://zh.wikisource.org/wiki/荀子/不苟篇</p></article></main></div></div>
