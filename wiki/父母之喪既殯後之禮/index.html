    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 父母之喪既殯後之禮</nav></header><main><article><h1>父母之喪既殯後之禮</h1><p>父母之喪，既殯至大祥，飲食居處之漸復。</p><p>父母之喪，既虞卒哭，疏食水飲，不食菜果。期而小祥，食菜果。又期而大祥，有醢醬。中月而禫，禫而飲醴酒。始飲酒者先飲醴酒，始食肉者先食乾肉。居處亦然，既虞卒哭，柱楣翦屏，芐翦不納。期而小祥，居堽室，寢有席。又期而大祥，居復寢。中月而禫，禫而床。此父母之喪，既殯之後，哀漸殺而禮漸復之節次也。</p><p><strong>所出</strong>：《禮記 · 間傳》 — https://zh.wikisource.org/wiki/禮記/間傳</p></article></main></div></div>
