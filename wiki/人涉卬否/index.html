    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 人涉卬否</nav></header><main><article><h1>人涉卬否</h1><p>眾人皆渡，我獨不渡，待得我友而後行。</p><p>「招招舟子，人涉卬否」，《匏有苦葉》末章句也。言舟子招招以渡，眾人皆涉，我獨不涉。卬，我也。蓋候人之意，必待其友而後濟。言非拒渡也，特有待也。以比守禮之人，不隨俗躁進，寧遲遲而有待焉。</p><p><strong>所出</strong>：《詩經 · 匏有苦葉》 — https://zh.wikisource.org/wiki/詩經/匏有苦葉</p></article></main></div></div>
