    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 疹筋</nav></header><main><article><h1>疹筋</h1><p>尺脈數甚，筋急腹急，色見白黑者病甚。</p><p>疹筋之病，尺脈數甚，筋急而見，此所謂疹筋也。是人腹必急，白色黑色見則病甚。</p><p><strong>所出</strong>：《黃帝內經 · 素問第十三卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十三卷</p></article></main></div></div>
