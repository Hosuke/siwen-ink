    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 上林廣大</nav></header><main><article><h1>上林廣大</h1><p>無是公言上林山谷水泉萬物，侈靡過實，非義理所尚，故刪取其要，歸正道而論之。</p><p>無是公言天子上林廣大，山谷水泉萬物，乃子虛言楚雲夢所有甚眾，侈靡過其實，且非義理所尚，故刪取其要，歸正道而論之。</p><p><strong>所出</strong>：《史記 · 卷117》 — https://zh.wikisource.org/wiki/史記/卷117</p></article></main></div></div>
