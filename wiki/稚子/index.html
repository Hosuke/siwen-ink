    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 稚子</nav></header><main><article><h1>稚子</h1><p>弄影不知為影所弄，化家化國化天下者不知為所化，由道而德而仁義而戰爭，其勢彌顛病彌篤。</p><p>稚子弄影，不知為影所弄；狂夫侮像，不知為像所侮。化家者不知為家所化，化國者不知為國所化，化天下者不知為天下所化。三皇，有道者也，不知其道化為五帝之德。五帝，有德者也，不知其德化為三王之仁義。三王，有仁義者也，不知其仁義化為秦漢之戰爭。醉者負醉，疥者療疥，其勢彌顛，其病彌篤，而無反者也。</p><p><strong>所出</strong>：《化書 · 卷一》 — https://zh.wikisource.org/wiki/化書/卷一</p></article></main></div></div>
