    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 亂臣十人</nav></header><main><article><h1>亂臣十人</h1><p>武王有賢臣十人，同心同德，以成撥亂之功。</p><p>[[予有亂臣十人，同心同德]]。亂，治也。亂臣者，治世之賢臣也。十人者，其數少而才全，同心同德，協力以成大事。得賢臣如此，雖少亦可謂盛。[[得人遺契]]之道，正在於此。</p><p><strong>所出</strong>：《尚書 · 泰誓》 — https://zh.wikisource.org/wiki/尚書/泰誓</p></article></main></div></div>
