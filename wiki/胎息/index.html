    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 胎息</nav></header><main><article><h1>胎息</h1><p>呼吸不用口鼻，如在胎中，是為眞槖籥。</p><p>息不用調而自調，氣不用煉而自煉。氣息旣和，自然於上中下不出不入無來無去，是為胎息，是為神息，是為眞槖籥，眞鼎爐，是為歸根。</p><p><strong>所出</strong>：《張三丰先生全集 · 卷3》 — https://zh.wikisource.org/wiki/張三丰先生全集/卷3</p><hr><p>少君見薊子訓用心專，因教令胎息住年止白之法。</p><p><strong>所出</strong>：《神仙傳 · 卷七》 — https://zh.wikisource.org/wiki神仙傳/卷七</p></article></main></div></div>
