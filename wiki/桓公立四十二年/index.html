    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 桓公立四十二年</nav></header><main><article><h1>桓公立四十二年</h1><p>桓公末年寵三臣以致亂，孝公奔宋，宋襄公立而還。</p><p>孝公犇宋，宋襄公率諸侯以伐齊，戰于甗，大敗齊師，殺公子無虧，立孝公而還。襄公立十三年，桓公立四十二年。</p><p><strong>所出</strong>：《管子 · 第26篇戒》 — https://zh.wikisource.org/wiki/管子/第26篇戒</p></article></main></div></div>
