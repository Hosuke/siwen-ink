    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五音不亂</nav></header><main><article><h1>五音不亂</h1><p>五音配五倫，亂則國亡。</p><p>宮為君，商為臣，角為民，徵為事，羽為物。五者不亂，則無怗懘之音矣。宮亂則荒，其君驕。商亂則陂，其官壞。角亂則憂，其民怨。徵亂則哀，其事勤。羽亂則危，其財匱。五者皆亂，迭相陵，謂之慢。如此，則國之滅亡無日矣。</p><p>鄭衛之音，亂世之音也，比於慢矣。桑間濮上之音，亡國之音也，其政散，其民流，誣上行私而不可止也。</p><p><strong>所出</strong>：《禮記 · 樂記》 — https://zh.wikisource.org/wiki/禮記/樂記</p></article></main></div></div>
