    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 奢僭</nav></header><main><article><h1>奢僭</h1><p>言奢僭起於不足，能均其食者天下可以治。</p><p>夫君子不肯告人以饑，恥之甚也；又不肯矜人以飽，愧之甚也。既起人之恥愧，必激人之怨咎，食之害也如是。</p><p>而金籩玉豆，食之飾也；鼓鐘戛石，食之遊也；張組設繡，食之惑也；窮禽竭獸，食之暴也；滋味厚薄，食之忿也；貴賤精粗，食之爭也。欲之愈不止，求之愈不已，貧食愈不足，富食愈不美。所以奢僭由茲而起，戰伐由茲而始。</p><p>能均其食者，天下可以治。</p><p>言食之分已定，而奢儉之情生；均食之政既行，而天下之事理矣。</p><p><strong>所出</strong>：《化書 · 卷五》 — https://zh.wikisource.org/wiki/化書/卷五</p></article></main></div></div>
