    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 公孫于齊</nav></header><main><article><h1>公孫于齊</h1><p>昭公見弒季氏不勝，出奔，公孫于齊。</p><p>昭公二十五年，秋九月乙亥，公孫于齊。</p><p>  傳曰：「孫之為言猶孫也。諱奔也。」臣子諱君出奔，故書「孫」以見遜讓之意。公失位出奔，不可直書奔，故以「孫」為文，隱其辭也。齊侯唁公于野井，吊失國曰唁，然唁公終不得入於魯。昭公在外，流離失所，終于乾侯。</p><p>  <strong>所出</strong>：《春秋穀梁傳 · 昭公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/昭公</p></article></main></div></div>
