    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大無信</nav></header><main><article><h1>大無信</h1><p>淫奔之人，背棄信義，無從一而終之操。</p><p>大無信也。奔者不以信守身，不以義自律，朝以為室，夕以改圖，是無信也。信者，五常之一，人之所以為人者。今乃蕩然無存，故詩人深刺之。[[懷昏姻]]而無信，則其心唯利是圖，其行唯欲是遂，禮義不存焉。</p><p><strong>所出</strong>：《詩經 · 蝃蝀》 — https://zh.wikisource.org/wiki/詩經/蝃蝀</p></article></main></div></div>
