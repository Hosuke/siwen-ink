    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 太伯虞仲亡荊蠻</nav></header><main><article><h1>太伯虞仲亡荊蠻</h1><p>太伯、虞仲知古公欲立季歷以傳昌，乃亡如荊蠻，文身斷髪，以讓季歷。</p><p>古公有長子曰太伯，次曰虞仲。太姜生少子季歷，季歷娶太任，皆賢妇人，生昌，有聖瑞。古公曰：「我世當有興者，其在昌乎？」長子太伯、虞仲知古公欲立季歷以傳昌，乃二人亡如荊蠻，文身斷髪，以讓季歷。</p><p><strong>所出</strong>：《史記 · 卷004》 — https://zh.wikisource.org/wiki/史記/卷004</p></article></main></div></div>
