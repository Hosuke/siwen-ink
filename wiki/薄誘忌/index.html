    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 薄誘忌</nav></header><main><article><h1>薄誘忌</h1><p>毫人薄誘忌奏祠泰一方，天子令太祝立祠長安東南郊。</p><p>毫人[[薄誘忌]]奏祠[[泰一]]方，曰：「天神貴者泰一，泰一佐曰五帝。古者天子以春秋祭泰一東南郊，用太牢具，七日，為壇開八通之鬼道。」於是天子令太祝立其祠長安東南郊，常奉祠如忌方。</p><p><strong>所出</strong>：《史記 · 卷012》 — https://zh.wikisource.org/wiki/史記/卷012</p></article></main></div></div>
