    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 琴瑟靜好</nav></header><main><article><h1>琴瑟靜好</h1><p>琴瑟和鳴，其音靜而美好。喻夫婦情好之和。</p><p>琴瑟靜好，以琴瑟之和諧喻夫婦之情好也。見於《詩經·女曰鷄鳴》：「琴瑟在御，莫不靜好。」御者，彈奏也。琴瑟在側，其音靜而美好，以興夫婦相處之和樂也。此後世以「琴瑟」喻夫婦、「靜好」喻安居之濫觴。</p><p><strong>所出</strong>：《詩經 · 女曰鷄鳴》 — https://zh.wikisource.org/wiki/詩經/女曰鷄鳴</p></article></main></div></div>
