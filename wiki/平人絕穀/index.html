    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 平人絕穀</nav></header><main><article><h1>平人絕穀</h1><p>平人不食七日而死，以水穀精氣津液皆盡故也。</p><p>平人不食，七日而死。胃納水穀三斗五升，常留二斗、水一斗五升。小腸受穀二斗四升，水六升三合；迴腸受穀一斗，水七升半；廣腸受穀九升三合。腸胃共長五丈八尺四寸，受水穀九斗二升。</p><p>平人日再後，後二升半，一日中五升，七日五七三斗五升，而留水穀盡矣。水穀精氣津液皆盡，故死。神者，水穀之精氣也，腸胃中當留穀二斗、水一斗五升，以持其氣。</p><p><strong>所出</strong>：《黃帝內經 · 靈樞第六卷》 — https://zh.wikisource.org/wiki/黃帝內經/靈樞第六卷</p></article></main></div></div>
