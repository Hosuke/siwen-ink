    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 正靜-之</nav></header><main><article><h1>正靜-之</h1><p>本文阐释《管</p><p>又《管子》云：「人能正靜者，筋肕而骨強。能戴大圓者，體乎大方。正靜不失，日新其德，昭知天下，通於四極。」</p><p>  正靜者，不偏不倚、不動不搖也。夫人心能正且靜，則形骸之筋自肕，血氣之骨自強，如是而後可以戴天之圓、體地之方，而與天地相參矣。功深日久，其德日新，光昭於天下，四極無遠弗屆。</p><p>  <strong>所出</strong>：《管子 · 第37篇心術下》 — https://zh.wikisource.org/wiki/管子/第37篇心術下</p></article></main></div></div>
