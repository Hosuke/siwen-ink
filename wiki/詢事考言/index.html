    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 詢事考言</nav></header><main><article><h1>詢事考言</h1><p>三載試人之法，言行相驗。</p><p>帝堯試舜，詢事考言，乃言厎可績，三載。詢事者，問其所任之事；考言者，驗其所言之實。三載之後，功狀明著，則陟帝位。言而不驗，不可任也；言而有驗，不可辭也。</p><p><strong>所出</strong>：《尚書 · 舜典》 — https://zh.wikisource.org/wiki/尚書/舜典</p></article></main></div></div>
