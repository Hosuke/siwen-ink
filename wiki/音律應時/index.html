    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 音律應時</nav></header><main><article><h1>音律應時</h1><p>以十二律應二十四時之變，六十音以當一歲之日。</p><p>其以為音也，一律而生五音，十二律而為六十音，因而六之，六六三十六，故三百六十音以當一歲之日。故律曆之數，天地之道也。下生者倍，以三除之；上生者四，以三除之。</p><p>日冬至，音比林鐘，浸以濁。日夏至，音比黃鐘，浸以清。以十二律應二十四時之變，甲子，仲呂之徵也；丙子，夾鐘之羽也；戊子，黃鐘之宮也；庚子，無射之商也；壬子，夷則之角也。</p><p><strong>所出</strong>：《淮南子 · 天文訓》 — https://zh.wikisource.org/wiki/淮南子/天文訓</p></article></main></div></div>
