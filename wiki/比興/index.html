    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 比興</nav></header><main><article><h1>比興</h1><p>詩之六義其二，比附事物以達意，興起情志以托諷，二者相須為用者也。</p><p>詩文弘奧，包韞六義。毛公述《傳》，獨標興體，以風通而賦同，比顯而興隱，詩人之志有二焉。</p><p>比者，附也，附理者切類以指事，畜憤以斥言，寫物以附意，颺言以切事者也。興者，起也，起情者依微以擬議，環譬以記諷，婉而成章者也。</p><p>比與興隨時而異用，而貴在相濟。《楚辭》依詩製騷，諷兼比興，可謂得之。漢世辭人夸毗，《詩》刺道喪，興義銷亡，獨比體雲構，失其全也。學者當兼通二義，不可偏廢。</p><p><strong>所出</strong>：《文心雕龍 · 比興》 — https://zh.wikisource.org/wiki/文心雕龍/比興</p></article></main></div></div>
