    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 行善慎名</nav></header><main><article><h1>行善慎名</h1><p>行善不以名，而名從之；利不與爭期，而爭及之。</p><p>[[楊朱]]曰：「行善不以爲名，而名從之；名不與利期，而利歸之；利不與爭期，而爭及之，故君子必慎爲善。」</p><p>又曰：「利出者實及，怨往者害來。發於此而應於外者唯請，是故賢者慎所出。」</p><p><strong>所出</strong>：《列子 · 說符篇》 — https://zh.wikisource.org/wiki/列子/說符篇</p></article></main></div></div>
