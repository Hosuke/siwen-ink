    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 七月流火</nav></header><main><article><h1>七月流火</h1><p>火星西逝，暑退寒將至也。</p><p>火星西流，暑退寒將至。詩以是起興，追憶先公風化、王業艱難。[[授衣]]之候至矣。</p><p><strong>所出</strong>：《詩經 · 七月》 — https://zh.wikisource.org/wiki/詩經/七月</p></article></main></div></div>
