    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 太和之鬼</nav></header><main><article><h1>太和之鬼</h1><p>無身有頭之鬼，見者呼其名碑則形自見，終鬼皆伏。</p><p>太和之鬼，無身有頭，頭長三尺，目大三寸，耳廣七寸，眉廣五寸，口廣三寸，鼻大二寸，鬚長三尺，髮長一丈，呼吸天炁，吐之成雲。子行見者其名子碑，三呼之，形自見，終鬼從者皆自伏。</p><p><strong>所出</strong>：《女青鬼律 · 卷2》 — https://zh.wikisource.org/wiki/女青鬼律/卷2</p></article></main></div></div>
