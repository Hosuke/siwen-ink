    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 殺人之眾以哀悲泣之</nav></header><main><article><h1>殺人之眾以哀悲泣之</h1><p>殺人多則哀悲泣之</p><p>殺人之眾以哀悲泣之，老子戒嗜殺之辭也。夫 [[兵者不祥之器]]，[[佳兵不祥之器]]，用之必有殺傷。[[樂殺人者不可以得志]]，[[恬淡為上]]，故聖人於殺人之眾，必以哀悲泣之，[[以喪禮處之]]，以示惻隱之心未嘗須臾忘也。[[勝而不美]]，同此意矣。</p><p><strong>所出</strong>：《道德經 (王弼本) · 三十一章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
