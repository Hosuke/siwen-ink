    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 神農之教</nav></header><main><article><h1>神農之教</h1><p>士不耕則民饑，女不績則民寒。</p><p>神農之教曰：「士有當年而不耕者，則天下或受其饑矣；女有當年而不績者，則天下或受其寒矣。」故神農親耕，妻親績，所以見致民利也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十一》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十一</p></article></main></div></div>
