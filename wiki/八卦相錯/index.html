    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 八卦相錯</nav></header><main><article><h1>八卦相錯</h1><p>乾坤震巽坎離艮兌，相摩相盪，以成天地之變化。</p><p>天地定位，山澤通氣，雷風相薄，水火不相射。八卦相錯，數往者順，知來者逆。是故[[易逆數也]]。</p><p>乾坤者，天地之定位也。乾上坤下，尊卑之象。山澤通氣，艮兌之相應也。雷風相薄，震巽之相摩也。水火不相射，坎離之相濟也。</p><p>八卦相錯者，陰陽剛柔迭相推盪也。數往者順，知來者逆，此聖人所以用[[易]]以逆知未來也。[[易逆數也]]，言聖人觀象以逆料吉凶，非徒往事之云云也。</p><p><strong>所出</strong>：《周易 · 說卦》 — https://zh.wikisource.org/wiki/易傳/說卦</p></article></main></div></div>
