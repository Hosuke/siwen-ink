    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 毋卜其居卜其鄰舍</nav></header><main><article><h1>毋卜其居卜其鄰舍</h1><p>晏子以先人之言辭景公毀鄰益宅之命。</p><p>景公為晏子毀其鄰以益其宅。晏子反，辭曰：「先人有言曰：『毋卜其居，而卜其鄰舍。』今得意於君者，慊其居則毋卜。已沒氏之先人卜與臣鄰，吉，臣可以廢沒氏之卜乎？夫大居而逆鄰歸之心，臣不願也。」卒復其舊宅。</p><p>居之美，不美於大，而在乎得鄰。晏子之辭宅，其義深矣。</p><p><strong>所出</strong>：《晏子春秋 · 卷六》 — https://zh.wikisource.org/wiki/晏子春秋/卷六</p></article></main></div></div>
