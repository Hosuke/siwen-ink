    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 經嗣世享</nav></header><main><article><h1>經嗣世享</h1><p>永循王命，傳世勿替也。</p><p>經嗣世享者，言當永循王命，傳世勿替也。</p><p>《封許之命》末章成王誡呂丁云「勿廢朕命，經嗣世享」，言汝其無廢我之命，以此法則嗣世享有之也。經，常也；嗣世，子孫相承也。封建諸侯，世守其土，遵王命者則國祚永延，故以此為戒，亦以為朂也。[[守其一則天下定]]言守一，此言守命，[[慎厥終惟其始]]言慎始，其義相成。</p><p><strong>所出</strong>：《尚書 · 封許之命》 — https://zh.wikisource.org/wiki/尚書/封許之命</p></article></main></div></div>
