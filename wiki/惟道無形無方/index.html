    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 惟道無形無方</nav></header><main><article><h1>惟道無形無方</h1><p>射、御、琴、奕皆非一息可得，惟道無形無方，故可得之於一息。</p><p>帛書乙本云「道渢呵亓可左右也」，言道浩汎無際，無所不屆。[[道渢呵]]之義，可與此條互補。[[道恆無名]]亦云「道恆無名」，皆明道之無方無執也。</p><p>  <strong>所出</strong>：《老子 (帛書本) · 章三十四》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
