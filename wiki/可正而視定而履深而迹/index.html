    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 可正而視定而履深而迹</nav></header><main><article><h1>可正而視定而履深而迹</h1><p>正視則明，定履則忠，深迹則名傳；各盡其職而不失。</p><p>「可正而視」，言察美惡，審別良苦，不可以不審。操分不雜，故政治不悔。「定而履」，言處其位，行其路，為其事，則民守其職而不亂，故葆統而好終。「深而迹」，言明墨章書，道德有常，則後世人人修理而不迷，故名聲不息。</p><p><strong>所出</strong>：《管子 · 第11篇宙合》 — https://zh.wikisource.org/wiki/管子/第11篇宙合</p></article></main></div></div>
