    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 疾醫</nav></header><main><article><h1>疾醫</h1><p>中士八人，掌養萬民之疾病</p><p>疾醫，中士八人。</p><p>掌養萬民之疾病。四時皆有癘疾：春時有痟首疾，夏時有癢疥疾，秋時有瘧寒疾，冬時有嗽、上氣疾。</p><p>以五味、五穀、五藥養其病。以五氣、五聲、五色視其死生。兩之以九竅之變，參之以九藏之動。</p><p>凡民之有疾病者，分而治之；死終，則各書其所以而入于醫師。</p><p><strong>所出</strong>：《周禮 · 天官冢宰》 — https://zh.wikisource.org/wiki/周禮/天官冢宰</p></article></main></div></div>
