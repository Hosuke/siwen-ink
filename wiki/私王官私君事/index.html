    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 私王官私君事</nav></header><main><article><h1>私王官私君事</h1><p>聖王禁退則藏祿、私王官、私君事之臣。</p><p>其身毋任於上者，聖王之禁也。進則受祿於君，退則藏祿於室，毋事治職，但力事屬，私王官，私君事，去非其人而人私行者，聖王之禁也。</p><p><strong>所出</strong>：《管子 · 第14篇法禁》 — https://zh.wikisource.org/wiki/管子/第14篇法禁</p></article></main></div></div>
