    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 欽崇天道</nav></header><main><article><h1>欽崇天道</h1><p>敬重天道，不敢渝越，乃可長保天命。</p><p>欽者，敬之至也。崇者，重之甚也。湯以伐夏而受天命，仲虺恐其忽於天命之難保也，故告以欽崇天道。蓋天道福善而降之福，禍淫而降之殃，人君苟能敬天之命，不敢荒怠，則天命可以長保。天命靡常，，惟德是輔，人主可不欽哉。</p><p><strong>所出</strong>：《尚書 · 仲虺之誥》 — https://zh.wikisource.org/wiki/尚書/仲虺之誥</p></article></main></div></div>
