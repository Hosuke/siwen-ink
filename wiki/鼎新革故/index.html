    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鼎新革故</nav></header><main><article><h1>鼎新革故</h1><p>治道之始，在於革除舊弊、煥發新機。</p><p>御政之首，鼎新革故。管括微密，開舒布寶。要道魁柄，統化綱紐。爻象內動，吉凶外起。</p><p>治道之要，在乎革去舊弊以煥新機。鼎器既新，方可納寶；舊法不去，新政不行。[[明堂布政]]之道，必先正其始也。</p><p><strong>所出</strong>：《周易參同契 · 05章》 — https://zh.wikisource.org/wiki/周易參同契/05章</p></article></main></div></div>
