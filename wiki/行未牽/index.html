    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 行未牽</nav></header><main><article><h1>行未牽</h1><p>象傳語，九三之行未受牽制，然亦未能安坐，以失位故也。</p><p>「其行次且，行未牽也。」</p><p>九三以陽居陽，過剛而不中。當柔遇剛之時，居於下體之上，非安之地也。行而次且，以其未受牽制而妄動；然亦未得所安，以失位故也。象言「行未牽」，見其縱而不知止也。</p><p><strong>所出</strong>：《周易 · 姤》 — https://zh.wikisource.org/wiki/周易/姤</p></article></main></div></div>
