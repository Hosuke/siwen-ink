    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 諸侯之劍</nav></header><main><article><h1>諸侯之劍</h1><p>以賢士為劍之部件，一震而四封賓服。</p><p>莊子繼論諸侯之劍。</p><p>以知勇士為鋒，清廉士為鍔，賢良士為脊，忠聖士為鐔，豪桀士為夾。直之亦无前，舉之亦无上，案之亦无下，運之亦无旁。上法圓天以順三光，下法方地以順四時，中和民意以安四鄉。</p><p>此劍一用，如雷霆之震，四封之內無不賓服而聽從君命。較[[天子之劍]]所異者，取法止於天地四方，未及天下；所任者賢士，而未及刑德刑政之本。</p><p><strong>所出</strong>：《莊子 · 說劍》 — https://zh.wikisource.org/wiki/莊子/說劍</p></article></main></div></div>
