    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 由生而生</nav></header><main><article><h1>由生而生</h1><p>生死皆有其道，常與不幸之別也</p><p>無所由而常生者，道也。由生而生，故雖終而不亡，常也。由生而亡，不幸也。有所由而常死者，亦道也。由死而死，故雖未終而自亡者，亦常也。由死而生，幸也。故無用而生謂之道，用道得終謂之常；有所用而死者亦謂之道，用道而得死者亦謂之常。季梁之死，楊朱望其門而歌；隨梧之死，楊朱撫其尸而哭。</p><p><strong>所出</strong>：《列子 · 仲尼篇》 — https://zh.wikisource.org/wiki/列子/仲尼篇</p></article></main></div></div>
