    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大過拯弱</nav></header><main><article><h1>大過拯弱</h1><p>大過本末皆弱，陽爻皆以居陰位為美；濟衰救危唯在同好。</p><p>大過者棟橈之世也，本末皆弱，棟巳橈矣而守其常則是危而弗扶。以陽居隂拯弱之義也，故陽爻皆以居陰位為美。濟衰救危唯在同好，則所贍褊矣。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷10》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷10</p></article></main></div></div>
