    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 博明萬事為子</nav></header><main><article><h1>博明萬事為子</h1><p>博明萬事者為子，適辨一理者為論。</p><p>博明萬事為子，適辨一理為論，彼皆蔓延雜說，故入諸子之流。蓋以《史記》多兵謀，而諸子雜詭術也。洽聞之士，宜撮綱要，覽華而食實，棄邪而採正。</p><p><strong>所出</strong>：《文心雕龍 · 諸子》 — https://zh.wikisource.org/wiki/文心雕龍/諸子</p></article></main></div></div>
