    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 王履冰朝禮</nav></header><main><article><h1>王履冰朝禮</h1><p>偶得上清寶經，秘行三十年，乘雲昇玄洲。</p><p>王履冰本未明大道，亦不知修行大丹之法。惟偶得上清寶經、太素真人億朝禮願上扶，常以每月各日其夕入靜室燒香，北面修行，祝之。祕行之三十年，得乘雲駕欽，昇入玄洲。其李仲子、趙雙成、范叔及管平阿、李順賢、延安生等，皆得此道，修勤不替，俱為真仙。或處玄洲，或昇崑崙之傍，或登三元之宮矣。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 35》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/35</p></article></main></div></div>
