    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 小知不可使謀事</nav></header><main><article><h1>小知不可使謀事</h1><p>智能有限者不可以謀大事，小知不可以任大法。</p><p>小知不可使謀事，小忠不可使主法。非智能之罪也，乃器有所不堪也。小知者局於一隅，小忠者溺於私恩，以之處大事、立大法，鮮有不敗者矣。</p><p>古者先王盡力於親民，加事於明法。彼法明，則忠臣勸；罰必，則邪臣止。忠勸邪止而地廣主尊者，秦是也；羣臣朋黨比周以隱正道、行私曲而地削主卑者，山東是也。亂弱者亡，人之性也；治强者王，古之道也。</p><p><strong>所出</strong>：《韓非子 · 飾邪》 — https://zh.wikisource.org/wiki/韓非子/飾邪</p></article></main></div></div>
