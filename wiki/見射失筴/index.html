    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 見射失筴</nav></header><main><article><h1>見射失筴</h1><p>物輕則見射，重則見泄，泄者失權，見射者失筴。</p><p>管子言鑄幣之術：彼重則見射，輕則見泄，故與天下調。泄者失權也，見射者失筴也。不備天權下相求，則備准下陰相隸，此刑罰之所起，而亂之之本也。是以善為國者，必通輕重之數，使物無過重，亦無過輕，互相節制，各得其平。</p><p><strong>所出</strong>：《管子 · 第75篇山權數》 — https://zh.wikisource.org/wiki/管子/第75篇山權數</p></article></main></div></div>
