    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 慎終于始</nav></header><main><article><h1>慎終于始</h1><p>求善終者，必謹慎於其始。</p><p>尹誥云：慎厥終于始。善始則有以成善終，慎始則無怠於厥終。凡事之成敗，皆判於初念初行之際。欲保厥終者，不可不敬慎於其始。此[[慎始]]之義，治亂興亡之樞機也。</p><p><strong>所出</strong>：《尚書 · 太甲下》 — https://zh.wikisource.org/wiki/尚書/太甲下</p></article></main></div></div>
