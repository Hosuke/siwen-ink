    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 素封</nav></header><main><article><h1>素封</h1><p>無秩祿爵邑而與之比者，命曰素封。</p><p>太史公曰：「今有無秩祿之奉，爵邑之入，而樂與之比者。命曰『素封』。封者食租稅，歲率戶二百。千戶之君則二十萬，朝覲聘享出其中。庶民農工商賈，率亦歲萬息二千，百萬之家則二十萬，而更傜租賦出其中。衣食之欲，恣所美美矣。」</p><p><strong>所出</strong>：《史記 · 卷129》 — https://zh.wikisource.org/wiki/史記/卷129</p></article></main></div></div>
