    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 吃文</nav></header><main><article><h1>吃文</h1><p>吃文者，聲律乖舛之病也，生於好詭逐異，致喉脣糺紛。</p><p>吃文之患，生於好詭，逐新趣異，故喉脣糺紛。雙聲隔字而每舛，疊韻雜句而必睽；沈則響發而斷，飛則聲颺不還，並轆轤交往，逆鱗相比，迂其際會，則往蹇來連。其為疾病，亦文家之吃也。</p><p>將欲解結，務在剛斷。左礙而尋右，末滯而討前，則辭轉於吻，玲玲如振玉；辭靡於耳，纍纍如貫珠矣。</p><p><strong>所出</strong>：《文心雕龍 · 聲律》 — https://zh.wikisource.org/wiki/文心雕龍/聲律</p></article></main></div></div>
