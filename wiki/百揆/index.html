    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 百揆</nav></header><main><article><h1>百揆</h1><p>總揆百官之職，舜命禹所居。</p><p>舜命四岳推舉能宅百揆者，僉舉伯禹，帝俞允之，命禹「平水土，惟時懋哉」。百揆者，總統庶官，協和陰陽，準天地四時之序者也。[[司空]]而下，百官皆統焉。</p><p><strong>所出</strong>：《尚書 · 舜典》 — https://zh.wikisource.org/wiki/尚書/舜典</p></article></main></div></div>
