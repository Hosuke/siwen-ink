    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 伯牙鍾子郢人之喻</nav></header><main><article><h1>伯牙鍾子郢人之喻</h1><p>伯牙永思鍾子，郢人格斤不運，蓋偏嗜酸鹹者莫能知其味。</p><p>抱朴子云：「斯伯牙所以永思鍾子，郢人所以格斤不運也。」言偏嗜酸鹹者不能知至味，猶此理也。</p><p><strong>所出</strong>：《抱朴子 · 卷32》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷32</p></article></main></div></div>
