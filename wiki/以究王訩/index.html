    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以究王訩</nav></header><main><article><h1>以究王訩</h1><p>詩人之志在究察王政之失</p><p>「家父作誦，以究王訩。」家父，周之大夫，為此詩者也。訩，譸張、昏乱也。言作此詩之誦詠，非徒自遣愁懷，乃欲深究王政之昏乱，揭示其非，使在上者知所悔悟。究者，推尋根底而明言之也。此詩人自述其志，以詩諫王，見《節南山》之所以作。</p><p><strong>所出</strong>：《詩經 · 節南山》 — https://zh.wikisource.org/wiki/詩經/節南山</p></article></main></div></div>
