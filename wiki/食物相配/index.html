    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 食物相配</nav></header><main><article><h1>食物相配</h1><p>膳羞之味，各有所宜，隨時調配</p><p>凡食齊視春時，羹齊視夏時，醬齊視秋時，飲齊視冬時。</p><p>凡和，春多酸，夏多苦，秋多辛，冬多鹹，調以滑甘。</p><p>牛宜稌，羊宜黍，豕宜稷，犬宜粱，雁宜麥，魚宜菰。</p><p>春宜羔豚膳膏薌，夏宜腒鱐膳膏臊，秋宜犢麑膳膏腥，冬宜鮮羽膳膏膻。</p><p><strong>所出</strong>：《禮記 · 內則》 — https://zh.wikisource.org/wiki/禮記/內則</p></article></main></div></div>
