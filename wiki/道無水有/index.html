    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 道無水有</nav></header><main><article><h1>道無水有</h1><p>道無形名，水有形名；道體虛，水之象實；故水幾於道。</p><p>道無水有。</p><p>王弼注：「道無水有，故曰幾也。」道無形名而水有形名，道體虛而水象實，然水之善利萬物而不爭，居眾人之所惡，幾於道矣。</p><p><strong>所出</strong>：《道德經 (王弼本) · 八章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
