    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 凝士以禮凝民以政</nav></header><main><article><h1>凝士以禮凝民以政</h1><p>凝結士人用禮，凝結民眾用政。</p><p>孫卿子云：「古者湯以薄，武王以滈，皆百里之地也，天下為一，諸侯為臣，無它故焉，能凝之也。故凝士以禮，凝民以政；禮脩而士服，政平而民安。」夫是之謂大凝。以守則固，以征則強，令行禁止，[[霸王之器]]之事畢矣。</p><p><strong>所出</strong>：《荀子 · 議兵篇》 — https://zh.wikisource.org/wiki/荀子/議兵篇</p></article></main></div></div>
