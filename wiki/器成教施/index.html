    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 器成教施</nav></header><main><article><h1>器成教施</h1><p>兵器已成，教令已施，則進退若雷電而無所疑匱。</p><p>器成教施，散之無方，聚之不可計。教器備利，進退若雷電，而無所疑匱。</p><p><strong>所出</strong>：《管子 · 第17篇兵法》 — https://zh.wikisource.org/wiki/管子/第17篇兵法</p></article></main></div></div>
