    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 兄弟甥舅</nav></header><main><article><h1>兄弟甥舅</h1><p>同姓之兄弟、異姓之外舅，皆王室所恃以為藩輔者。</p><p>詩以[[蔦與女蘿]]施於松柏，比兄弟宗族相依。又言「兄弟甥舅」，蓋兼同姓、異姓而言之：兄弟，同姓也；甥舅，異姓也。皆[[宴樂同姓]]所當親睦者，亦九族之所以輯睦也。</p><p><strong>所出</strong>：《詩經 · 頍弁》 — https://zh.wikisource.org/wiki/詩經/頍弁</p></article></main></div></div>
