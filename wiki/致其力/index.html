    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 致其力</nav></header><main><article><h1>致其力</h1><p>既得天時，則竭其力以成功，此聖人乘勢之義也。</p><p>未得天極，則隱於德。已得天極，則致其力。</p><p><strong>所出</strong>：《管子 · 勢》 — https://zh.wikisource.org/wiki/管子/勢</p></article></main></div></div>
