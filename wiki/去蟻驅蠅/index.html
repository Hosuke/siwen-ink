    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 去蟻驅蠅</nav></header><main><article><h1>去蟻驅蠅</h1><p>對症下藥勿失其宜</p><p>子綽曰：「人莫能左畫方而右畫圓也。以肉去蟻，蟻愈多；以魚驅蠅，蠅愈至。」</p><p>子綽以畫方圓、去蟻驅蠅爲喻，謂行事失宜，則適得其反。當對症下藥，不可失其宜也。</p><p><strong>所出</strong>：《韓非子 · 外儲說左下》 — https://zh.wikisource.org/wiki/韓非子/外儲說左下</p></article></main></div></div>
