    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 盜宗廟器而族之</nav></header><main><article><h1>盜宗廟器而族之</h1><p>張釋之引「罪等」之義，反對以盜宗廟器罪加族刑，以申法之正當。</p><p>有人盜高廟坐前玉環，捕得，文帝怒，下廷尉治。釋之案律盜宗廟服御物者為奏，奏當棄市。上大怒曰：「人之無道，乃盜先帝廟器，吾屬廷尉者，欲致之族，而君以法奏之，非吾所以共承宗廟意也。」釋之免冠頓首謝曰：「法如是足也。且罪等，然以逆順為差。今盜宗廟器而族之，有如萬分之一，假令愚民取長陵一抔土，陛下何以加其法乎？」久之，文帝與太后言之，乃許廷尉當。</p><p><strong>所出</strong>：《史記 · 卷102》 — https://zh.wikisource.org/wiki/史記/卷102</p></article></main></div></div>
