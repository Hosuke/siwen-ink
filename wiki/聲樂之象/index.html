    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聲樂之象</nav></header><main><article><h1>聲樂之象</h1><p>樂器形貌各有象法，舞蹈亦有四時之節。</p><p>聲樂之象：鼓大麗，鐘統實，磬廉制，竽笙簫和，筦籥發猛，塤篪翁博，瑟易良，琴婦好，歌清盡，舞意天道兼。</p><p>鼓，其樂之君邪！故鼓似天，鐘似地，磬似水，竽笙、簫和、筦籥似星辰日月，鞀、柷、拊、鞷、椌、楬似萬物。</p><p>何以知舞之意？目不自見，耳不自聞也，然而治俯仰詘信、進退遲速莫不廉制，盡筋骨之力以要鐘鼓俯會之節，而靡有悖逆者，衆積意謘謘乎！</p><p><strong>所出</strong>：《荀子 · 樂論篇》 — https://zh.wikisource.org/wiki/荀子/樂論篇</p></article></main></div></div>
