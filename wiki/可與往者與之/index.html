    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 可與往者與之</nav></header><main><article><h1>可與往者與之</h1><p>可與往者與之至於妙道，不可與往者慎勿與之，身乃無咎。</p><p>孔子請受業於漁父，漁父辭之曰：「吾聞之，可與往者與之，至於妙道；不可與往者，不知其道，慎勿與之，身乃無咎。子勉之！吾去子矣！」言道不可以強傳，必其人自有根器，方可語之。</p><p><strong>所出</strong>：《莊子 · 漁父》 — https://zh.wikisource.org/wiki/莊子/漁父</p></article></main></div></div>
