    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 赫赫明明</nav></header><main><article><h1>赫赫明明</h1><p>王命顯赫而明察之貌。</p><p>詩言「赫赫明明，王命卿士」。赫赫者，顯盛之貌；明明者，明察之貌。言宣王赫赫赫然，有明察之德，命令卿士，以布王命。詩以「赫赫明明」形容王命之威德兼備，聲威赫然而又明鏡照物也。</p><p><strong>所出</strong>：《詩經 · 常武》 — https://zh.wikisource.org/wiki/詩經/常武</p></article></main></div></div>
