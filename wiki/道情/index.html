    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 道情</nav></header><main><article><h1>道情</h1><p>以真情悟道，非等閒俗情可比</p><p>道非等閒之情可入。道情者，先將世情放下，次將道理細研精微。未煉還丹先煉性，未修大藥且修心。心修則丹信至，性清則藥材生。藥材旣生，緊加功。雷聲隱隱震虛空，電光灼處尋眞種。神光默默守洞門，如貓捕鼠兎逢鷹。此箇紅光內有春意，黃中通理，凝神以成軀，功夫至此，命功乃全。</p><p><strong>所出</strong>：《張三丰先生全集 · 卷4》 — https://zh.wikisource.org/wiki/張三丰先生全集/卷4</p></article></main></div></div>
