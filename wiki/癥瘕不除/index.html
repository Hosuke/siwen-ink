    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 癥瘕不除，而不修越人之術者，難圖老彭之壽</nav></header><main><article><h1>癥瘕不除，而不修越人之術者，難圖老彭之壽</h1><p>喻姦偽不除，雖有良法不能致治</p><p>夫癥瘕不除，而不修越人之術者，難圖老彭之壽也。奸黨實繁，而不嚴彈違之制者，未見其長世之福也。</p><p><strong>所出</strong>：《抱朴子 · 卷14》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷14</p></article></main></div></div>
