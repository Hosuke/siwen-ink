    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 王者之軍制</nav></header><main><article><h1>王者之軍制</h1><p></p><p>《荀子·議兵篇》孫卿子云：「將死鼓，御死轡，百吏死職，士大夫死行列。聞鼓聲而進，聞金聲而退，順命為上，有功次之。」不殺老弱，不獵禾稼，服者不禽，格者不舍，奔命者不獲。誅非誅其百姓，誅其亂百姓者也。誅其亂百姓者，百姓有扞其賊，則亦是賊也。[[兵不血刃]]，遠邇來服。此[[王者之軍制]]之要也。</p><p>  <strong>所出</strong>：《荀子 · 議兵篇》 — https://zh.wikisource.org/wiki/荀子/議兵篇</p></article></main></div></div>
