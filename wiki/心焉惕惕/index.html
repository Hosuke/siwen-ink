    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 心焉惕惕</nav></header><main><article><h1>心焉惕惕</h1><p>心懷戒懼、惶然不安之貌。</p><p>惕惕，疊韻聯緜詞，狀心懷戒懼、惶然不安之貌。</p><p>《防有鵲巢》次章：「誰侜予美，心焉惕惕。」言讒言日至，君子惕惕然而不敢安。[[心焉忉忉]]重在愁思之縈，惕惕重在恐懼之深。《易》曰「夕惕若厲」，《詩》曰「惴惴小心」，皆同此義。讒言之來，無由以避，故心焉惕惕，若履薄冰然。</p><p><strong>所出</strong>：《詩經 · 防有鵲巢》 — https://zh.wikisource.org/wiki/詩經/防有鵲巢</p></article></main></div></div>
