    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 虛實之要</nav></header><main><article><h1>虛實之要</h1><p>實者氣入，虛者氣出；實則熱，虛則寒；知此為工。</p><p>夫實者，氣入也；虛者，氣出也。氣實者，熱也；氣虛者，寒也。入實者，左手開針空也；入虛者，左手閉針空也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第十四卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十四卷</p></article></main></div></div>
