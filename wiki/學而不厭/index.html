    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 學而不厭，誨人不倦</nav></header><main><article><h1>學而不厭，誨人不倦</h1><p>學道務求進益，教人不知疲倦。</p><p>孔子自言默識古道，好學不厭，教人不倦。此聖人進德修業之功也。學者以不知為恥，故日有孳孳；教者以得人為樂，故無倦悶。[[學而不厭]]與[[誨人不倦]]，皆聖人自謙之辭，實則三者兼備，非孔子不能當之。</p><p><strong>所出</strong>：《論語 · 述而第七》 — https://zh.wikisource.org/wiki/論語/述而第七</p></article></main></div></div>
