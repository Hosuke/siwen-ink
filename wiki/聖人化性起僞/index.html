    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖人化性而起僞</nav></header><main><article><h1>聖人化性而起僞</h1><p>聖人之所以異於衆者，在能化其惡性而生禮義。</p><p>聖人之所以同於衆，其不異於衆者，性也；所以異而過衆者，僞也。夫陶人埏埴而為器，非故生於陶人之性；聖人生禮義而起法度，亦非故生於聖人之性。聖人積思慮、習人為，以生禮義而起法度，是化性之功也。凡聖人者，能化性、能起僞，僞起而生禮義。[[塗之人可以為禹]]，皆此理也。</p><p><strong>所出</strong>：《荀子 · 性惡篇》 — https://zh.wikisource.org/wiki/荀子/性惡篇</p></article></main></div></div>
