    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 移是</nav></header><main><article><h1>移是</h1><p>是非然否移易不定，以生為本、以知為師，因以乘是非。</p><p>有生，黬也，披然曰移是。嘗言移是，非所言也。請常言移是，是以生為本，以知為師，因以乘是非。果有名實，因以己為質。使人以為己節，因以死償節。若然者，以用為知，以不用為愚；以徹為名，以窮為辱。移是，今之人也，是蜩與學鳩同於同也。</p><p>至於世俗之移是，臘者之有膍胲，可散而不可散也；觀室者周於寢廟，又適其偃焉！為是舉移是。</p><p><strong>所出</strong>：《莊子 · 庚桑楚》 — https://zh.wikisource.org/wiki/莊子/庚桑楚</p></article></main></div></div>
