    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 荊國之法</nav></header><main><article><h1>荊國之法</h1><p>犯王尸者罪及三族。</p><p>荊國之法，麗兵於王尸者，盡加重罪，逮三族。吳起死於是法，貴人皆坐誅。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十一》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十一</p></article></main></div></div>
