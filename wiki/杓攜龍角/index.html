    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 杓攜龍角</nav></header><main><article><h1>杓攜龍角</h1><p>北斗杓連於龍角，角星為天關，黃道所經，七耀所行。</p><p>杓攜龍角。孟康曰：「杓，北斗杓也。龍角，東方宿也。攜，連也。」</p><p>角星為天關，其間天門，其內天庭，黃道所經，七耀所行。左角為理，主刑，其南為太陽道；右角為將，主兵，其北為太陰道。蓋天之三門，故其星明大則天下太平，賢人在位；不然反是。</p><p><strong>所出</strong>：《史記 · 卷027》 — https://zh.wikisource.org/wiki/史記/卷027</p></article></main></div></div>
