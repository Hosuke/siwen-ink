    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 君子能亦好，不能亦好</nav></header><main><article><h1>君子能亦好，不能亦好</h1><p>君子無論能否，皆出於善；小人無論能否，皆出於醜。</p><p>君子能亦好，不能亦好；小人能亦醜，不能亦醜。</p><p>君子能則寬容易直以開道人，不能則恭敬繜絀以畏事人；小人能則倨傲僻違以驕溢人，不能則妬嫉怨誹以傾覆人。</p><p>故曰：君子能則人榮學焉，不能則人樂告之；小人能則人賤學焉，不能則人羞告之。是君子小人之分也。</p><p><strong>所出</strong>：《荀子 · 不苟篇》 — https://zh.wikisource.org/wiki/荀子/不苟篇</p></article></main></div></div>
