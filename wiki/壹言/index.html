    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 壹言</nav></header><main><article><h1>壹言</h1><p>治國在於壹民務、摶民力、塞私門，使上下同心，國乃可強。</p><p>治國之要，在於壹務而摶力。[[農戰]]者，國之根本也。上開公利而塞私門，則民壹務；民壹則樸，樸則農，農則易勤，勤則富。富者以爵廢之，不淫；淫者以刑廢之而務農。是故明君知齊摶力與殺力二者，國必彊；不知齊者，國必削。</p><p>明王之治也，不法古，不修今，因世而為之治，度俗而為之法。慎為察務，歸心於壹而已矣。</p><p><strong>所出</strong>：《商君書 · 卷三》 — https://zh.wikisource.org/wiki/商君書/卷三</p></article></main></div></div>
