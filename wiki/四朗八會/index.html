    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 四朗八會</nav></header><main><article><h1>四朗八會</h1><p>陰陽交通、四正朗達、八會祥集之境界。</p><p>四朗八會者，道教修煉中陰陽交通之境界也。《上清大洞真經》第二十七章言左目童子使「二炁交通，四朗八會」，朗者明朗清朗之謂，會者聚會祥集之義。四正之氣朗達，八會之祥咸臻，陽生於內，清潔於外，則萬神自泰、徹見無方矣。四朗八會言二炁既通，神明煥朗，無所不照之象也。</p><p><strong>所出</strong>：《上清大洞真經 · 27章》 — https://zh.wikisource.org/wiki/上清大洞真經/27章</p></article></main></div></div>
