    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五臟要害</nav></header><main><article><h1>五臟要害</h1><p>肝生於左，肺藏於右，心部於表，腎治於裏，脾為使，胃為市，鬲肓之上有父母，七節之傍有小心。</p><p>肝生於左，肺藏於右，心部於表，腎治於裏，脾為之使，胃為之市。鬲肓之上，中有父母，七節之傍，中有小心。從之有福，逆之有咎。</p><p><strong>所出</strong>：《黃帝內經 · 素問第十四卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十四卷</p></article></main></div></div>
