    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 上經下經</nav></header><main><article><h1>上經下經</h1><p>上經言氣通天，下經言病變化。</p><p>上經者，言氣之通天也；下經者，言病之變化也。此二經者，[[黃帝內經]]之大體，醫道之樞要也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第十三卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十三卷</p></article></main></div></div>
