    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 說筑傅巖</nav></header><main><article><h1>說筑傅巖</h1><p>賢才隱於野，天子旁求而得之。</p><p>「乃審厥象，俾以形旁求于天下。說筑傅巖之野，惟肖。爰立作相，王置諸其左右。」言高宗恭默思道，夢帝賚予良弼，既得厥象，乃使人旁求之天下，得說于傅巖之野，筑居於是，故稱「說筑」。形肖厥夢，遂立以為相，置諸左右。此[[敷求哲人]]之義，而[[旁招俊乂]]之說所祖也。</p><p><strong>所出</strong>：《尚書 · 說命上》 — https://zh.wikisource.org/wiki/尚書/說命上</p></article></main></div></div>
