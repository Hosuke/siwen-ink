    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 男不群樂以妨事</nav></header><main><article><h1>男不群樂以妨事</h1><p>群樂廢事，醉酒害政，晏子以此諫景公。</p><p>晏子論古之酒禮曰：「足以通氣合好而已矣。」又云：「男不群樂以妨事，女不群樂以妨功。男女群樂者，周觴五獻，過之者誅。」以古制言之，酒以合好，非以耽樂。一日飲酒而三日寢，則國治怨乎外，左右亂乎內。以刑罰自防者，勸乎為非；以賞譽自勸者，惰乎為善。上離德行，民輕賞罰，失所以為國矣。晏子以是為諫。</p><p><strong>所出</strong>：《晏子春秋 · 卷一》 — https://zh.wikisource.org/wiki/晏子春秋/卷一</p></article></main></div></div>
