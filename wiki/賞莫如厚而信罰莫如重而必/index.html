    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 賞莫如厚而信罰莫如重而必</nav></header><main><article><h1>賞莫如厚而信罰莫如重而必</h1><p>賞當優厚且必兌現，罰當嚴厲且無赦免，如此則賢不肖皆盡力。</p><p>故民固驕於愛、聽於威矣。故十仞之城，樓季弗能躏者，峭也；千仞之山，跛牂易牧者，夷也。故明王峭其法而嚴其刑也。布帛尋常，庸人不釋；鑠金百溢，盜跖不掇。不必害則不釋尋常，必害手則不掇百溢，故明主必其誅也。是以賞莫如厚而信，使民利之；罰莫如重而必，使民畏之；法莫如一而固，使民知之。</p><p><strong>所出</strong>：《韓非子 · 五蠹》 — https://zh.wikisource.org/wiki/韓非子/五蠹</p></article></main></div></div>
