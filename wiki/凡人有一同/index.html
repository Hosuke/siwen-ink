    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 凡人有一同</nav></header><main><article><h1>凡人有一同</h1><p>凡人之所欲、所知、所為，堯舜桀跖所同也，差異在於注錯習俗。</p><p>凡人有所一同：飢而欲食，寒而欲煖，勞而欲息，好利而惡害，是人之所生而有也，是無待而然者也，是禹、桀之所同也。目辨白黑美惡，耳辨聲音清濁，口辨酸鹹甘苦，鼻辨芬芳腥臊，骨體膚理辨寒暑疾養，是又人之所常生而有也，是無待而然者也，是禹、桀之所同也。可以為堯、禹，可以為桀、跖，可以為工匠，可以為農賈，在埶注錯習俗之所積耳。</p><p><strong>所出</strong>：《荀子 · 榮辱篇》 — https://zh.wikisource.org/wiki/荀子/榮辱篇</p></article></main></div></div>
