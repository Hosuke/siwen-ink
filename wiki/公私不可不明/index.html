    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 公私不可不明</nav></header><main><article><h1>公私不可不明</h1><p>公私之别</p><p>本篇又申論公私之分：「令必行，禁必止，人主之公義也；必行其私，信於朋友，不可為賞勸，不可為罰沮，人臣之私義也。」私義行則亂，公義行則治。君臣以計合，害身而利國者臣弗為，害國而利臣者君不行。先王明賞以勸之，嚴刑以威之。賞刑明則民盡死，兵強主尊；賞刑不察則民無功而求得，有罪而幸免，兵弱主卑。故曰：「公私不可不明，法禁不可不審。」</p><p>  <strong>所出</strong>：《韓非子 · 飾邪》 — https://zh.wikisource.org/wiki/韓非子/飾邪</p></article></main></div></div>
