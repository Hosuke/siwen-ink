    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 分予文君僮百人錢百萬</nav></header><main><article><h1>分予文君僮百人錢百萬</h1><p>昆弟諸公說卓王孫，王孫不得已，分予文君僮僕錢財。</p><p>昆弟諸公更謂王孫曰：「有一男兩女，所不足者非財也。今文君已失身於司馬長卿，長卿故倦遊，雖貧，其人材足依也，且又令客，獨奈何相辱如此！」卓王孫不得已，分予文君僮百人，錢百萬，及其嫁時衣被財物。</p><p><strong>所出</strong>：《史記 · 卷117》 — https://zh.wikisource.org/wiki/史記/卷117</p></article></main></div></div>
