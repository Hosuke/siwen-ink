    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 立象盡意</nav></header><main><article><h1>立象盡意</h1><p>象生於意可尋象以觀意，言生於象可尋言以觀象；象以盡意，言以著象。</p><p>意以象盡，象以言著。故言者所以明象，得象而忘言；象者所以存意，得意而忘象。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷10》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷10</p></article></main></div></div>
