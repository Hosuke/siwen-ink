    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 愛觀水火</nav></header><main><article><h1>愛觀水火</h1><p>愛為水，觀為火，情欲思辨之根本</p><p>形者，彼之精；理者，彼之神；愛者，我之精；觀者，我之神。愛為水，觀為火。愛執而觀因之為木，觀存而愛攝之為金。</p><p>[[愛觀水火]] 愛者，情欲之精，猶水之寒潤；觀者，思辨之神，猶火之炎上。愛執而不已，則生長之機見，是為木；觀存而能攝，則肅殺之象成，是為金。言人情之根本，不過水火二者，而愛觀又水火之根也。</p><p><strong>所出</strong>：《關尹子 · 2》 — https://zh.wikisource.org/wiki/關尹子/2</p></article></main></div></div>
