    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 成是南箕</nav></header><main><article><h1>成是南箕</h1><p>喻譖人言過其實，如箕之張口。</p><p>「哆兮侈兮，成是南箕。」</p><p>哆，張口也；侈，大也。南箕，星名，主簸揚。詩人以箕之張口喻譖人言大其辭，虛而不實。言彼譖人者，口廣言張，無中生有，不可聽信也。</p><p><strong>所出</strong>：《詩經 · 巷伯》 — https://zh.wikisource.org/wiki/詩經/巷伯</p></article></main></div></div>
