    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 主人獻介</nav></header><main><article><h1>主人獻介</h1><p>主人洗爵酌酒以獻于介之禮。</p><p>主人揖降，賔降立于階西，當序，東面。主人以介揖讓升，拜如賔禮。</p><p>主人坐取爵于東序端，降洗。介降，主人辭降；介辭洗如賔禮，升，不拜洗。介西階上立。</p><p>主人實爵于介之席前，西南面獻介。介西階上北面拜，主人少退；介進，北面受爵，復位。主人介右北面拜送爵，介少退。主人立于西階東。</p><p>薦脯醢。介升席自北方，設折俎。祭如賔禮，不嚌肺，不啐酒，不告旨，自南方降席，北面坐卒爵，興，坐奠爵，遂拜，執爵興。主人介右答拜。</p><p><strong>所出</strong>：《儀禮 · 鄉飲酒禮》 — https://zh.wikisource.org/wiki/儀禮/鄉飲酒禮</p></article></main></div></div>
