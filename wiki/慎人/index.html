    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 慎人</nav></header><main><article><h1>慎人</h1><p>賢人修身俟時，天定則功名成。</p><p>功名大立，天也；為是故，因不慎其人，不可。夫舜遇堯，天也；舜耕於歷山，陶於河濱，釣於雷澤，天下說之，秀士從之，人也。夫禹遇舜，天也；禹周於天下，以求賢者，事利黔首，水潦川澤之湛滯壅塞可通者，禹盡為之，人也。夫湯遇桀，武遇紂，天也；湯武修身積善為義，以憂苦於民，人也。</p><p>故君子之於學也，隱身為樂，修身為事，俟時為期。時未可也，則深藏若虛；時既至也，則沛然而起。是故聖人之遇時，若水之就下，固然耳。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十四》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十四</p></article></main></div></div>
