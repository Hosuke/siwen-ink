    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 祈天永命</nav></header><main><article><h1>祈天永命</h1><p>以德祈天，永保天命，不可恃天命而不敬德。</p><p>王其德之，用祈天永命。其惟王勿以小民淫用非彝，亦敢殄戮，用乂民，若有功；其惟王位在德元，小民乃惟刑用于天下，越王顯。</p><p>欲王以小民受天永命。</p><p>上下勤卹，其曰：「我受天命，丕若有夏歷年，式勿替有殷歷年。」欲王以小民受天永命。</p><p>是知祈天永命，不在祀典，而在德行；不在威刑，而在保民也。</p><p><strong>所出</strong>：《尚書 · 召誥》 — https://zh.wikisource.org/wiki/尚書/召誥</p></article></main></div></div>
