    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以身觀身</nav></header><main><article><h1>以身觀身</h1><p>以己觀己，返求諸己之謂。</p><p>帛書本與王弼本異文。帛書本云「以身觀身，以家觀家，以鄉觀鄉，以邦觀邦，以天下觀天下」，王弼本「邦」作「國」。其義則同：皆明由近及遠、由小及大之理。脩德於身者，其德真；於家者，其德有餘；於鄉者，其德乃長；於邦者，其德乃夆；於天下者，其德乃博。欲知天下之然，觀其一邦可驗；欲知一邦，觀其一鄉可驗；欲知一鄉，觀其一家可驗；欲知一家，觀其一身可驗。此老子觀人之法也。</p><p>  <strong>所出</strong>：《老子 (帛書本) · 章五十四》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
