    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 羸其瓶</nav></header><main><article><h1>羸其瓶</h1><p>汲水瓶敝而覆，凶象也，功敗於垂成。</p><p>「汔至亦未繘井。羸其瓶，凶。」羸者，敗也；瓶者，汲水之器也。行者至井旁，欲取水，然汲器敝敗，覆而水盡，功不成而凶生也。《彖》曰「羸其瓶，是以凶也」，言功垂成而器敗，此所以致凶也。夫井在焉，水在焉，汲之可也，然器不備則功不成，此 [[汔至亦未繘井]] 之驗也。君子觀此，知事之成敗，在於終始之際，不可不慎也。</p><p><strong>所出</strong>：《周易 · 井》 — https://zh.wikisource.org/wiki/周易/井</p></article></main></div></div>
