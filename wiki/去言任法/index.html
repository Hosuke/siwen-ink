    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 去言任法</nav></header><main><article><h1>去言任法</h1><p>有術之國去言而任法，乃霸王之道。</p><p>有術之國去言而任法。自攻者人也，攻人者數也，故有術之國去言而任法。</p><p>數者制度之數，人者人力之數。以人力取勝者，人亡而政息；以制度取勝者，法立而國強。是以有術之國，必去浮言虛譽，專任法制，賞罰明而賞罰不分白者無所施其姦。此霸王之道，而非有術者不能行之也。</p><p><strong>所出</strong>：《韓非子 · 制分》 — https://zh.wikisource.org/wiki/韓非子/制分</p></article></main></div></div>
