    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 耕道</nav></header><main><article><h1>耕道</h1><p>述耕耘之正道在人、地、天之和。</p><p>有年瘞土，無年瘞土。無失民時，無使之治下。知貧富利器，皆時至而作，渴時而止。是以老弱之力可盡起，其用日半，其功可使倍。不知事者，時未至而逆之，時既往而慕之，當時而薄之，使其民而郤之。民既郤，乃以良時慕，此從事之下也。操事則苦，不知高下，民乃逾處。種稑禾不為稑，種重禾不為重，是以粟少而失功。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十六》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十六</p></article></main></div></div>
