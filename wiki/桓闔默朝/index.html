    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 桓闔默朝</nav></header><main><article><h1>桓闔默朝</h1><p>桓闔事陶隱居，修默朝之道，二青童一白鶴降迎之。</p><p>桓闓者，不知何許人。事陶隱居，居茅山華陽館十餘年。立性端謹，執役之外，寂寂然若無所為。</p><p>一日，有二青童一白鶴，自空而下，集於庭。隱居欣然而接，謂己當之。青童曰：「太上所召者，桓先生也。」隱居默計門人，皆無姓桓者。索之，惟得執役桓闓焉。請其所致，則曰：「常修默朝之道，親朝。」</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 28》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/28</p></article></main></div></div>
