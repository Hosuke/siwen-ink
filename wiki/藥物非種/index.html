    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 藥物非種</nav></header><main><article><h1>藥物非種</h1><p>藥物分刻參差、失其綱紀，雖聖人臨爐亦無功。</p><p>藥物非種，名類不同，分刻參差，失其綱紀，雖黃帝臨爐，太公執火，八公擣煉，淮南調合，立宇崇壇，玉為階陛，麟脯鳳脂，把籍長跪，禱祝神祇，請哀諸鬼，沐浴齋戒，冀有所望，亦猶南轅北轍，終不能致。夫金丹之道，貴乎藥物合度、陰陽交構。一有乖差，聖人不能成之，況凡俗乎。</p><p><strong>所出</strong>：《周易參同契 · 30章》 — https://zh.wikisource.org/wiki/周易參同契/30章</p></article></main></div></div>
