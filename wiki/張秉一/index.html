    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 張秉一</nav></header><main><article><h1>張秉一</h1><p>稟金龜之夢，洞徹墻外，散千金濟凶年，坐化而逝。</p><p>真人張秉一，一-{云}-名彥恭，字溫甫，[[張諶]]之長子也。母初夢金龜入腹，既寤而有孕。少年學道，能洞窺墻壁之外。嘗累千金，遇凶歲，市穀救施貧乏。年九十二歲，一日語妻曰：「吾死後地震則斂而葬之。」言訖，正坐執簡而化。七日果地震，乃斂而葬焉，體尚溫而不壞。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 19》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/19</p></article></main></div></div>
