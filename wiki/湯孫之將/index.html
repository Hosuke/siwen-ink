    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 湯孫之將</nav></header><main><article><h1>湯孫之將</h1><p>奉祀以將祭，祈求祖考之祐也</p><p>祭祀既終，顧予烝嘗，湯孫之將。將者，奉而行之也。商家子孫奉烝嘗之祭，冀祖考降福也。[[湯孫之緒]]義近。</p><p><strong>所出</strong>：《詩經 · 那》 — https://zh.wikisource.org/wiki/詩經/那</p></article></main></div></div>
