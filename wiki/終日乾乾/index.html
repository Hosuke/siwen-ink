    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 終日乾乾</nav></header><main><article><h1>終日乾乾</h1><p>君子進德修業，終日勉勉，至夕猶惕，雖危無咎。</p><p>九三：君子終日乾乾，夕惕若；厲，無咎。</p><p>君子進德脩業。忠信，所以進德也；脩辭立其誠，所以居業也。知至至之，可與言幾也。知終終之，可與存義也。是故居上位而不驕，在下位而不憂，故乾乾因其時而惕，雖危無咎矣。</p><p>象曰：終日乾乾，反復道也。
文言曰：「終日乾乾」，行事也。又曰：與時偕行。</p><p>乾乾者，健而又健之謂也。反復道者，所行皆天理之正，無有過不及。與時偕行者，天運不息，君子之進德亦若是焉。</p><p><strong>所出</strong>：《周易 · 乾》 — https://zh.wikisource.org/wiki/周易/乾</p></article></main></div></div>
