    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 丘里之言</nav></header><main><article><h1>丘里之言</h1><p>合十姓百名以為風俗，集異以為同。</p><p>少知問大公調何謂丘里之言。大公調曰：「丘里者，合十姓百名而以為風俗也，合異以為同，散同以為異。今指馬之百體而不得馬，而馬係於前者，立其百體而謂之馬也。是故丘山積卑而為高，江河合水而為大，大人合并而為公。是以自外入者，有主而不執；由中出者，有正而不距。四時殊氣，天不賜，故歲成；五官殊職，君不私，故國治；文武大人不賜，故德備；萬物殊理，道不私，故無名。」</p><p><strong>所出</strong>：《莊子 · 則陽》 — https://zh.wikisource.org/wiki/莊子/則陽</p></article></main></div></div>
