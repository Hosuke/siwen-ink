    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 宗室牖下</nav></header><main><article><h1>宗室牖下</h1><p>宗廟之內可開窗之處，設祭之地</p><p>宗室牖下者，宗廟牖內設祭之處也。</p><p>《采蘋》末章云「于以奠之？宗室牖下。」奠，按《說文》，从酋从丌，酋即酒，丌乃基座，蓋置酒於臺以祭神也。牖，音有，按黃以周《禮書通故》，指可以打開之窗。宗室牖下為宗廟之內可開窗之處，祭祀時設祭品於此。</p><p><strong>所出</strong>：《詩經 · 采蘋》 — https://zh.wikisource.org/wiki/詩經/采蘋</p></article></main></div></div>
