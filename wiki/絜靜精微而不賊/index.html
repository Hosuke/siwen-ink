    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 絜靜精微而不賊</nav></header><main><article><h1>絜靜精微而不賊</h1><p>深於《易》者，兼絜靜深邃與端正而不流於賊害。</p><p>《易》之教使人絜靜精微，然過於精微則失之賊。唯絜靜精微而不賊者，乃為深於《易》者也。</p><p><strong>所出</strong>：《禮記 · 經解》 — https://zh.wikisource.org/wiki/禮記/經解</p></article></main></div></div>
