    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 道大似不肖</nav></header><main><article><h1>道大似不肖</h1><p>道至大而無形似無可比擬惟其大故似不肖</p><p>天下皆謂我道大，似不肖。夫唯大，故似不肖。若肖，久矣其細也夫。</p><p>此言道體至大，無形無象，不可方物。世人徒見其廣漠無際，莫之能名，遂以為似於何物。殊不知肖者，像也，像之久則失其本真。故老氏自謂其道若大而無形，無物可象；若可得而肖之，是其道已狹矣。</p><p><strong>所出</strong>：《道德經 (王弼本) · 六十七章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
