    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 吾嘗終日不食</nav></header><main><article><h1>吾嘗終日不食</h1><p>謂徒思不如學。</p><p>子曰：「吾嘗終日不食，終夜不寑，以思；無益，不如學也。」</p><p>言徒然窮思，不如據道學習之有益。思而無師友之傳授，則亦何所進邪。聖人言思、學之辨，貴乎有所承傳也。</p><p><strong>所出</strong>：《論語 · 衞靈公第十五》 — https://zh.wikisource.org/wiki/論語/衞靈公第十五</p></article></main></div></div>
