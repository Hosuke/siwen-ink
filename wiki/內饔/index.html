    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 內饔</nav></header><main><article><h1>內饔</h1><p>中士四人，掌王及後世子膳羞之割亨煎和</p><p>內饔，中士四人，下士八人；府二人，史四人，胥十人，徒百人。</p><p>掌王及後、世子膳羞之割亨煎和之事，辨體名肉物，辨百品味之物。王舉，則陳其鼎俎，以牲體實之。</p><p>辨腥臊膻香之不可食者：牛夜鳴則庮，羊泠毛而毳則膻，犬赤股而躁則臊，鳥皫色而沙鳴則貍，豕盲視而交睫則腥，馬黑脊而般臂則螻。</p><p><strong>所出</strong>：《周禮 · 天官冢宰》 — https://zh.wikisource.org/wiki/周禮/天官冢宰</p></article></main></div></div>
