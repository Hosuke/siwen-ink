    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 帶執性命守虛無</nav></header><main><article><h1>帶執性命守虛無</h1><p>持守性命，歸根虛無。</p><p>帶執性命守虛無。</p><p>[[性命雙修]]者，帶執而不失，守護以全生。及其至也，返歸虛無。虛無者，道之體也。性命本乎大道，修之極致，則[[復歸於無極]]，而無復生死之累矣。</p><p><strong>所出</strong>：《黃庭內景經 · 隱景章第二十四》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/隱景章第二十四</p></article></main></div></div>
