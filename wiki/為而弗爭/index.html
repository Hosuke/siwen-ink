    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 為而弗爭</nav></header><main><article><h1>為而弗爭</h1><p>人之道施為而不競</p><p>人之道，為而弗爭。</p><p>此言人之道則不然。世人馳逐於名利，交相攘奪，以爭為能。聖人則不然，抱道守真，行其所當行，而不以爭競為事。搆怨於物者，物亦搆怨之；弗爭者，天下莫之能與爭也。老子以「弗爭」終一篇之義，明聖人无積、無私、無競，乃返乎天之道矣。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第三十一章 不積》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
