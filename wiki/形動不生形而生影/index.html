    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 形動不生形而生影</nav></header><main><article><h1>形動不生形而生影</h1><p>黃帝書之言，論形與影、聲與響、有與無之變化。</p><p>《黃帝書》曰：「形動不生形而生影，聲動不生聲而生響，無動不生無而生有。」形，必終者也；天地終乎？與我偕終。終進乎？不知也。道終乎本無始，進乎本不久。有生則復於不生，有形則復於無形。不生者，非本不生者也；無形者，非本無形者也。生者，理之必終者也。終者不得不終，亦如生者之不得不生。而欲恆其生，畫其終，惑於數也。</p><p><strong>所出</strong>：《列子 · 天瑞篇》 — https://zh.wikisource.org/wiki/列子/天瑞篇</p></article></main></div></div>
