    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 埶不在人上而羞為人下</nav></header><main><article><h1>埶不在人上而羞為人下</h1><p>人臣居下位而羞為人下，是姦人之心，志行皆姦，而求君子聖人之名，必不可得。</p><p>天下之通義，少事長、賤事貴、不肖事賢也。有人焉，埶不在人上而羞為人下，是姦人之心也。志未免乎姦心，行未免乎姦道，而求有君子聖人之名，辟之是猶伏而咶天，救經而引其足也，說必不行，俞務而俞遠。</p><p><strong>所出</strong>：《荀子 · 仲尼篇》 — https://zh.wikisource.org/wiki/荀子/仲尼篇</p></article></main></div></div>
