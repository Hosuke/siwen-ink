    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五色之錦，各以本采為地</nav></header><main><article><h1>五色之錦，各以本采為地</h1><p>文體多變，各守其本，猶錦之於地。</p><p>雖復契會相參，節文互雜，譬五色之錦，各以本采為地矣。</p><p>文章之道，體勢相參，節文互雜，然各守其本，猶五彩之錦，以本色為地，余色錯織而不亂。體之根本既立，勢之變化乃有所依歸也。</p><p><strong>所出</strong>：《文心雕龍 · 定勢》 — https://zh.wikisource.org/wiki/文心雕龍/定勢</p></article></main></div></div>
