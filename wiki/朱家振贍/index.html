    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 朱家振贍</nav></header><main><article><h1>朱家振贍</h1><p>朱家振贍貧賤，先從貧賤始，家無餘財，而趨人之急甚於己私。</p><p>振人不贍，先從貧賤始。家無餘財，衣不完采，食不重味，乘不過軥牛。專趨人之急，甚己之私。</p><p><strong>所出</strong>：《史記 · 卷124》 — https://zh.wikisource.org/wiki/史記/卷124</p></article></main></div></div>
