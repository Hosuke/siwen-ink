    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 南澗之濱</nav></header><main><article><h1>南澗之濱</h1><p>夾山溪流之涯</p><p>南澗之濱者，南山澗水之涯也。</p><p>《采蘋》首章云「于以采蘋？南澗之濱。」澗者，夾在山間之溪流也。采蘋於南澗之濱，言其得地之所宜。蘋生水中，澗濱其處，取之不遠，此祭祀備物之始也。</p><p><strong>所出</strong>：《詩經 · 采蘋》 — https://zh.wikisource.org/wiki/詩經/采蘋</p></article></main></div></div>
