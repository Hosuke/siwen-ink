    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三者既關鍵</nav></header><main><article><h1>三者既關鍵</h1><p>耳目口三者為關鍵，修真者必先固守</p><p>《參同契》云「三者既關鍵，緩體處空房」，言耳目口為修真之關鍵，既固守之，則形體緩弛，居於虛空之室，委志歸無，無念以為常。此為入道之門戶，內外二障由此而塞，真炁由此而凝也。</p><p><strong>所出</strong>：《周易參同契 · 22章》 — https://zh.wikisource.org/wiki/周易參同契/22章</p></article></main></div></div>
