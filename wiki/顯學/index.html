    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 顯學</nav></header><main><article><h1>顯學</h1><p>儒墨為世之顯學，韓非非之，歸於法治。</p><p>世之顯學，儒、墨也。儒之所至，孔丘也；墨之所至，墨翟也。自孔子之死，而儒分為八；自墨子之死，而墨離為三。取舍相反，皆自謂真孔、真墨，而莫可參驗定之。韓非論此，以為「無參驗而必之者愚」，「冰炭不同器而久」，雜反之學不兩立，而明主治國當急賞罰法度，非仁義空言所能濟。</p><p><strong>所出</strong>：《韓非子 · 顯學》 — https://zh.wikisource.org/wiki/韓非子/顯學</p></article></main></div></div>
