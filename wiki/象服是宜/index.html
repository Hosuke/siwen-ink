    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 象服是宜</nav></header><main><article><h1>象服是宜</h1><p>象骨飾之禮服宜於夫人</p><p>象服是宜，見於《詩經·君子偕老》。毛傳云：「象服，羽飾服也。」鄭玄云：「象服者，搤笄而衣之以象骨飾服，尊宜之也。」象服者，以象骨飾之禮服也。夫人宜著此服，以配君子，而詩言「子之不淑，云如之何」，正嘆其有服飾之盛而無德行之美也。</p><p><strong>所出</strong>：《詩經 · 君子偕老》 — https://zh.wikisource.org/wiki/詩經/君子偕老</p></article></main></div></div>
