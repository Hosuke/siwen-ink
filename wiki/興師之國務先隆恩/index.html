    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 興師之國務先隆恩</nav></header><main><article><h1>興師之國務先隆恩</h1><p>興師之前務先厚施恩惠，攻城之前務先休養民力。</p><p>《軍讖》曰：「興師之國，務先隆恩；攻取之國，務先養民。」</p><p>以寡勝眾者，恩也；以弱勝強者，民也。故良將之養士，不易於身；故能使三軍如一心，則其勝可全。</p><p><strong>所出</strong>：《三略》 — https://zh.wikisource.org/wiki/三略</p></article></main></div></div>
