    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 閒歌</nav></header><main><article><h1>閒歌</h1><p>歌者與吹笙者間作，歌《魚麗》則笙《由庚》，歌《南有嘉魚》則笙《崇丘》，歌《南山有臺》則笙《由儀》。</p><p>乃閒歌。歌《魚麗》，笙《由庚》；歌《南有嘉魚》，笙《崇丘》；歌《南山有臺》，笙《由儀》。</p><p>閒者，間也，歌與笙迭奏以相間也。</p><p><strong>所出</strong>：《儀禮 · 鄉飲酒禮》 — https://zh.wikisource.org/wiki/儀禮/鄉飲酒禮</p></article></main></div></div>
