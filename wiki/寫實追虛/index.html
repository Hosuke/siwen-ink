    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 寫實追虛</nav></header><main><article><h1>寫實追虛</h1><p>碑誄之義，寫事物之實，追其精神，期於不朽。</p><p>贊曰：寫實追虛，碑誄以立。銘德慕行，文采允集。觀風似面，聽辭如泣。石墨鐫華，頹影豈忒。</p><p><strong>所出</strong>：《文心雕龍 · 誄碑》 — https://zh.wikisource.org/wiki/文心雕龍/誄碑</p></article></main></div></div>
