    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三歲食貧</nav></header><main><article><h1>三歲食貧</h1><p>嫁後三歲，甘受貧苦，終以色衰見棄。</p><p>「自我徂爾，三歲食貧」，語出《詩經·衞風·氓》第四章。言自我嫁至爾家，三年之間，甘受貧乏之苦，不以為怨。</p><p>嫁時男子以抱布貿易為辭，來即其謀，誑誘女子之心。既娶之後，女子三歲為婦，靡室勞矣，夙興夜寐，靡有朝矣。躬操井臼，勤勉不息，未嘗以艱苦而有怨色。夫家之貧，女子共之而不辭；夫心之變，女子未知而不備。及乎桑黃葉隕、容顏凋零，男子遂起二心。食貧三歲，固女子之所甘受；其食貧之故，乃男子之二三其德所致。哀哉！</p><p><strong>所出</strong>：《詩經 · 氓》 — https://zh.wikisource.org/wiki/詩經/氓</p></article></main></div></div>
