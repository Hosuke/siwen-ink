    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 損不足以奉有餘</nav></header><main><article><h1>損不足以奉有餘</h1><p>人道不然，剝不足以奉有餘，反天之道也。</p><p>人之道則不然，損不足以奉有餘。</p><p>夫人之為也，與天異矣。天均萬物而無私，人則[[剝民奉君]]，取於不足者而奉於有餘，是[[損有餘補不足]]之反也。剝天下之膏血，以益一人之欲壑；斂四海之脂膏，以充私家之藏府。此所以世之多故而亂之不息也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 七十七章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
