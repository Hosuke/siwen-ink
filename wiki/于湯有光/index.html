    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 于湯有光</nav></header><main><article><h1>于湯有光</h1><p>武王之伐，功烈光輝，逾於成湯。</p><p>我伐用張，于湯有光。言武王之征伐，其功烈光明，比之成湯滅夏，實有光焉。湯放桀，武王伐紂，皆吊民誅暴。然紂之罪浮於桀，商之罪浮於夏，故武王之功亦逾於湯。此以湯之盛德比況武王，明師出之正、伐功之隆也。</p><p><strong>所出</strong>：《尚書 · 泰誓中》 — https://zh.wikisource.org/wiki/尚書/泰誓中</p></article></main></div></div>
