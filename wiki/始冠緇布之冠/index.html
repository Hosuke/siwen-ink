    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 始冠緇布之冠</nav></header><main><article><h1>始冠緇布之冠</h1><p>大古之冠以白布為之，齊則緇之，冠而敝之可也。</p><p>《記》曰「始冠，緇布之冠也」，言[[三加]]之始加所用緇布冠也。又曰「大古冠布，齊則緇之」，大古之世，冠以白布為之，唯祭祀之時乃染之使緇。其緌也，孔子曰「吾未之聞也，冠而敝之可也」，言緇布冠之有緌，聖人已不得而聞，但知冠禮既畢，即敝去之，不用以為常服。言外之意，[[三加]]之禮務在加尊，不在守一冠也。始加緇布之冠，示其不忘本始，終敝之，示其漸趨盛大焉。</p><p><strong>所出</strong>：《儀禮 · 士冠禮》 — https://zh.wikisource.org/wiki/儀禮/士冠禮</p></article></main></div></div>
