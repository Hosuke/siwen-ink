    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 臣盡死力與君市</nav></header><main><article><h1>臣盡死力與君市</h1><p>君臣之際非父子之親，計數之所出也；臣盡死力以與君市，君垂爵禄以與臣市。</p><p>「或曰」駁管仲之戒曰：臣有盡死力以爲其主者，管仲將弗用乎？是不愛其身度其不愛其君，是將以管仲之不能死公子糾度其不死桓公也，是管仲亦在所去之域矣。</p><p>明主之道不然：設民所欲以求其功，故爲爵禄以勸之；設民所惡以禁其姦，故爲刑罰以威之。慶賞信而刑罰必，故君舉功於臣而姦不用於上。夫臣盡死力以與君市，君垂爵禄以與臣市。君臣之際，非父子之親也，計數之所出也。</p><p><strong>所出</strong>：《韓非子 · 難一》 — https://zh.wikisource.org/wiki/韓非子/難一</p></article></main></div></div>
