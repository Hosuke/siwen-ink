    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 僖負羈言於曹伯</nav></header><main><article><h1>僖負羈言於曹伯</h1><p>僖負羈以禮義勸曹共公禮遇重耳，不聽。</p><p>曹共公聞重耳骿脅，欲觀其狀。僖負羈之妻言於負羈曰：「晉公子賢人也，必得晉國，而討無禮，曹其首誅也。子盍蚤自貳焉？」負羈饋飧，寘璧焉。公子受飧反璧。負羈言於曹伯曰：「臣聞之：愛親明賢，政之幹也；禮賓矜窮，禮之宗也。今君棄之，是不愛親也；晉公子生十七年而亡，卿材三人從之，是不明賢也。」曹伯弗聽。</p><p><strong>所出</strong>：《國語 · 卷10》 — https://zh.wikisource.org/wiki/國語/卷10</p></article></main></div></div>
