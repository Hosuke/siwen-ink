    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 兵強則不勝</nav></header><main><article><h1>兵強則不勝</h1><p>兵恃堅強者，必取敗亡。</p><p>兵強則不勝，木強則恆。</p><p>兵力過於剛強，必至挫衂；木之強者，亦終於折斷。老子以兵與木為喻，明堅強之不可恃也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第四十一章 柔弱》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p><hr><p>強大之兵輕戰樂殺，毒流怨結，眾弱為一強，故不勝。</p><p><strong>所出</strong>：《老子河上公章句 · 戒強》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
