    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 柔弱勝剛強</nav></header><main><article><h1>柔弱勝剛強</h1><p>柔弱者生生，剛強者滅亡。</p><p>水之性就下，然能攻堅；風之至無形，然能折大木。柔弱之氣常存，刚強之質必折。天下莫柔弱於水，而攻堅強者莫之能勝，此道之用也。聖人知之，故守柔曰強，守弱曰強，守雌曰強，守後曰強。為而不恃，功成而不居，萬物歸焉而不為主。<strong>所出</strong>：《老子河上公章句 · 微明》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
