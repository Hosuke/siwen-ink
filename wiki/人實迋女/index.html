    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 人實迋女</nav></header><main><article><h1>人實迋女</h1><p>人之讒言誠為欺誑，不可輕信。</p><p>「無信人之言，人實迋女」。鄭風《揚之水》之戒辭也。言人之言不足信，人實欺誑汝。告其二三人者，當勿輕聽浮言，以兄弟寡助之時，讒言易入，足以離間骨肉。此與「人實不信」互文見義，皆言失信之風可畏。</p><p><strong>所出</strong>：《詩經 · 揚之水》 — https://zh.wikisource.org/wiki/詩經/揚之水</p></article></main></div></div>
