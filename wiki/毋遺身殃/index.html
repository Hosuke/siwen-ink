    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 毋遺身殃</nav></header><main><article><h1>毋遺身殃</h1><p>不自取殃，是為襲常</p><p>「毋遺身殃，是謂襲常。」言守母、用光、歸明者，不以機智示人，不以光耀炫物，則吾身無殃咎之至。若用光而不知返，[[用亓光復歸亓明]]之道闕如，是自遺其殃。[[襲常]]者，因循不渝，不失其自然之則，則身無遺殃之患。此[[老子 (帛書校勘版)]]要義，與王弼本「無遺身殃，是謂襲常」文同義一。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第十五章 守母》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
