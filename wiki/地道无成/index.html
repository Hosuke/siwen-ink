    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 地道无成</nav></header><main><article><h1>地道无成</h1><p></p><p>文言釋坤卦「地道也，妻道也，臣道也」曰：「地道無成，而代有終也。」坤道至柔，承天而行，滋生萬物而不自有，化育萬類而不居功，是謂「無成」。然萬物得成，是為「代有終」——代天以成其終事也。此與[[地道]]之義互通，而闡坤德之精微。</p><p><strong>所出</strong>：《周易 · 文言》 — https://zh.wikisource.org/wiki/周易/文言</p></article></main></div></div>
