    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖人自治於未有形</nav></header><main><article><h1>聖人自治於未有形</h1><p>癰疽膿血，積微所生，聖人自治於未有形，愚者遭其已成。</p><p>夫癰疽之生，膿血之成也，不從天下，不從地出，積微之所生也。故聖人自治於未有形也，愚者遭其已成也。</p><p><strong>所出</strong>：《黃帝內經 · 靈樞第九卷》 — https://zh.wikisource.org/wiki/黃帝內經/靈樞第九卷</p></article></main></div></div>
