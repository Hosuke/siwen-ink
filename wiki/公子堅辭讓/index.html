    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 公子堅辭讓</nav></header><main><article><h1>公子堅辭讓</h1><p>去疾讓立賢者，公子堅為襄公</p><p>鄭人欲立靈公弟去疾，去疾讓曰：「必以賢，則去疾不肖；必以順，則公子堅長。」堅者，靈公庶弟，去疾之兄也。乃立子堅，是為襄公。</p><p><strong>所出</strong>：《史記 · 卷042》 — https://zh.wikisource.org/wiki/史記/卷042</p></article></main></div></div>
