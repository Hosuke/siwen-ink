    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 讓爵謝恩，亦表之別幹</nav></header><main><article><h1>讓爵謝恩，亦表之別幹</h1><p>啟之用，於謝恩讓爵，與表異途同歸。</p><p>自晉來盛啟，用兼表奏。陳政言事，既奏之異條；讓爵謝恩，亦表之別幹。必斂飭入規，促其音節，辨要輕清，文而不侈，亦啟之大略也。</p><p><strong>所出</strong>：《文心雕龍 · 奏啟》 — https://zh.wikisource.org/wiki/文心雕龍/奏啟</p></article></main></div></div>
