    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 堯禪天下</nav></header><main><article><h1>堯禪天下</h1><p>堯治天下五十年不知治亂，乃微服察謠，知民不知而禪於舜</p><p>堯以天下讓舜。鯀為諸侯，怒於堯曰：「得天之道者為帝，得地之道者為三公。今我得地之道，而不以我為三公。」以堯為失論。欲得三公。怒甚猛獸，欲以為亂。比獸之角，能以為城；舉其尾，能以為旌。召之不來，仿佯於野以患帝。舜於是殛之於羽山，副之以吳刀。禹不敢怨，而反事之，官為司空，以通水潦，顏色黎黑，步不相過，竅氣不通，以中帝心。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十</p></article></main></div></div>
