    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不續終</nav></header><main><article><h1>不續終</h1><p>事不能竟其終</p><p>濡其尾，無攸利，不續終也。彖辭以為，小狐渡水幾及彼岸，而濡其尾，不能竟渡，是不續終也。《[[汔至亦未繘井]]》之意，正與此通。事之成，貴有終；功之著，貴竟事。不能續終，雖近於成，猶未濟也。</p><p><strong>所出</strong>：《周易 · 未濟》 — https://zh.wikisource.org/wiki/周易/未濟</p></article></main></div></div>
