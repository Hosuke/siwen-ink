    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 周公吐哺握發</nav></header><main><article><h1>周公吐哺握發</h1><p>述周公以貴下賤、禮賢下士之事。</p><p>[[抱朴子]]此卷以周公與呂尚對舉，見待士之殊途。逸民曰：「夫周公大聖，以貴下賤，吐哺握發，懼於失人，從白屋之士七十人，布衣之徒親執贄所師見者十人，所友者十有二人，皆不逼以在朝也。」</p><p>又言若使呂尚居周公之地，則此等賢士皆成「市朝之暴屍，而溝澗之腐此肉矣」。以見呂尚之殘酷，與周公之仁厚，判若天壤。</p><p><strong>所出</strong>：《抱朴子 · 卷02》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷02</p></article></main></div></div>
