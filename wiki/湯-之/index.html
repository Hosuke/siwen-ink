    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 湯-之</nav></header><main><article><h1>湯-之</h1><p></p><p>湯之時，自契至湯八遷。湯始居亳，從先王居。</p><p>  湯征[[湯征|葛伯]]，作湯征。湯出，見野張網四面，乃去其三面，[[湯網|諸侯聞湯德至矣]]。</p><p>  湯伐夏桀，作[[湯誓]]，遂伐昆吾，逐伐桀，桀敗於有娀之虛，犇於鳴條。湯既勝夏，欲遷其社，不可，作夏社。還亳，作湯誥。</p><p>  湯乃改正朔，易服色，上白，朝會以晝。</p><p>  <strong>所出</strong>：《史記 · 卷003》 — https://zh.wikisource.org/wiki/史記/卷003</p></article></main></div></div>
