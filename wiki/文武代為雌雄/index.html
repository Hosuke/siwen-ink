    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 文武代為雌雄</nav></header><main><article><h1>文武代為雌雄</h1><p>文武更迭，視時而用；拘於一偏，不足以應世。</p><p>逮至暴亂已勝，海內大定，繼文之業，立武之功，履天子之圖籍，造劉氏之貌冠。當此之時，有立武者見疑。一世之間，而文武代為雌雄，有時而用也。今世之為武者則非文也，為文者則非武也，文武更相非，而不知時世之用也。此見隅曲之一指，而不知八極之廣大也。</p><p><strong>所出</strong>：《淮南子 · 氾論訓》 — https://zh.wikisource.org/wiki/淮南子/氾論訓</p></article></main></div></div>
