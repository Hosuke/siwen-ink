    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 夏鑄九牧之金鼎</nav></header><main><article><h1>夏鑄九牧之金鼎</h1><p>夏禹鑄鼎九州，以著德化之美。</p><p>夏鑄九牧之金鼎。劉勰分銘為三義：天子令德，諸侯計功，大夫稱伐。九牧之鼎，乃夏禹令德之事，刻九州之牧守所貢金屬以為鼎，所以象德化之覆被，垂範萬世也。令德之銘，不在記事，而在彰德，此其所以異於計功、稱伐者也。</p><p><strong>所出</strong>：《文心雕龍 · 銘箴》 — https://zh.wikisource.org/wiki/文心雕龍/銘箴</p></article></main></div></div>
