    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 能敝而成</nav></header><main><article><h1>能敝而成</h1><p>不欲盈，則能保守成事而不敗也。</p><p>不欲盈，是以能敝而不成。</p><p>盈者，滿也。[[持盈者與天]]，而[[滿招損謙受益]]。聖人知盈之不可久也，故[[知足之為足]]，[[不欲盈]]。[[物壯則老]]，[[物極必反]]，盈而已必傾，盈而已必缺。唯不盈，是以能[[蔽而不成]]。蔽者，保守也；不成者，不居功也。[[功成而弗居]]，是以[[能為善而無心]]，[[能為善而無以為]]，此之謂也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章十五》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
