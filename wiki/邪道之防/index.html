    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 邪道之防</nav></header><main><article><h1>邪道之防</h1><p>塞邪道、防未然，不貴自是而貴不為非，使人欲釋而公道行。</p><p>凡為道者，塞邪道，防未然，不貴其自是也，貴其不得為非也。故曰：勿使可欲，無日不求；勿使可奪，無日不爭。如此，即人欲釋，而公道行矣。有餘者止於度，不足者逮於用，故天下可一也。</p><p><strong>所出</strong>：《文子 · 卷十一》 — https://zh.wikisource.org/wiki/文子/卷十一</p></article></main></div></div>
