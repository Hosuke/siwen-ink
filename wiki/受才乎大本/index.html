    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 受才乎大本</nav></header><main><article><h1>受才乎大本</h1><p>才受於大道根本，復其靈明以生，是聖人之所以貴也。</p><p>[[莊子]]借孔子之言云：「夫受才乎大本，復靈以生。」鳴而當律，言而當法，利義陳乎前，而好惡是非直服人之口而已矣。使人乃以心服，而不敢蘁立，定天下之定。此言才與靈之本，聖人之所貴，不在口言之辯，而在心服之實也。</p><p><strong>所出</strong>：《莊子 · 寓言》 — https://zh.wikisource.org/wiki/莊子/寓言</p></article></main></div></div>
