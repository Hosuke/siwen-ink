    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 周公制作之，仲尼祖述之，荀孟賛成之</nav></header><main><article><h1>周公制作之，仲尼祖述之，荀孟賛成之</h1><p>總述聖賢傳承王道的次第，周公創制，仲尼述而不作，荀卿、孟子先後羽翼之。</p><p>蓋周公制作之，仲尼祖述之，荀、孟賛成之，所以膠固王道，至深至備，雖《春秋》之四夷交侵，戰國之三綱弛絶，斯道竟不墜矣。</p><p><strong>所出</strong>：《荀子 · 荀子序》 — https://zh.wikisource.org/wiki/荀子/荀子序</p></article></main></div></div>
