    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 世之所以不治非下之罪上失其道</nav></header><main><article><h1>世之所以不治非下之罪上失其道</h1><p>世道之亂，本在上位者失道，非下民之罪。</p><p>民之急名也，甚其求利也；如此，則士之饑餓乏絶者，焉得無巖居苦身以爭名於天下哉？故世之所以不治者，非下之罪，上失其道也。</p><p>上之所貴與其所以為治相反也。常貴其所以亂，而賤其所以治，是故下之所欲，常與上之所以為治相詭也。</p><p><strong>所出</strong>：《韓非子 · 詭使》 — https://zh.wikisource.org/wiki/韓非子/詭使</p></article></main></div></div>
