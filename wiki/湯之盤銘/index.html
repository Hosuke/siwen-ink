    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 湯之盤銘</nav></header><main><article><h1>湯之盤銘</h1><p>聖王日日自新，不已於善也。</p><p>湯之盤銘，商湯澡盆之銘也。銘曰：「苟日新，日日新，又日新。」言聖王之德，修而益修，新而益新，無有已時也。</p><p>《康誥》曰「作新民」，《詩》曰「周雖舊邦，其命惟新」，皆此義也。君子無所不用其極，勉於新是已。新者，去故就新之謂。茍能一旦澡滌其舊染，則日日皆新，無有一日不然。《大學》引此，以見聖人自明其德，亦如澡身之銘，無時不新也。</p><p>所出：《大學》 — https://zh.wikisource.org/wiki/禮記/大學</p></article></main></div></div>
