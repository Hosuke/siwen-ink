    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 車旂之制</nav></header><main><article><h1>車旂之制</h1><p>四代車路旌旗各有定制，以別尊卑。</p><p>鸞車，有虞氏之路也。鉤車，夏-{后}-氏之路也。大路，殷路也。乘路，周路也。有虞氏之旗，夏-{后}-氏之綏，殷之大白，周之大赤。夏-{后}-氏駱馬，黑鬣。殷人白馬，黑首。周人黃馬，蕃鬣。</p><p><strong>所出</strong>：《禮記 · 明堂位》 — https://zh.wikisource.org/wiki/禮記/明堂位</p></article></main></div></div>
