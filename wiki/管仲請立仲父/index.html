    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 管仲請立仲父</nav></header><main><article><h1>管仲請立仲父</h1><p>管仲以賤不可以治貴、以貧不可以治富、以疏不可以治親，故請立仲父之尊。</p><p>桓公解管仲之束縛而相之。管仲曰：「臣有寵矣，然而臣卑。」公曰：「使子立高、國之上。」管仲曰：「臣貴矣，然而臣貧。」公曰：「使子有三歸之家。」管仲曰：「臣富矣，然而臣䟽。」於是立以爲仲父。霄略曰：「管仲以賤爲不可以治貴，故請高、國之上；以貧爲不可以治富，故請三歸；以䟽爲不可以治親，故處仲父。管仲非貪，以便治也。」</p><p><strong>所出</strong>：《韓非子 · 難一》 — https://zh.wikisource.org/wiki/韓非子/難一</p></article></main></div></div>
