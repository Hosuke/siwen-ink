    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 容乃公</nav></header><main><article><h1>容乃公</h1><p>容則能公</p><p>能容則公。公者，不私於己、不偏於物之心也。[[公義勝私欲]]，[[公道達而私門塞]]，[[公乃全]]者，以其無私也。知常則不以物易己、不以利害心，故能公。公者，天之道也；私者，人之患也。[[公私之分]]，在此一念。</p><p><strong>所出</strong>：《道德經 (王弼本) · 十六章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p><hr><p>無所不包容，則公正無私，眾邪莫當。</p><p>公由容生。</p><p><strong>所出</strong>：《老子河上公章句 · 歸根》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
