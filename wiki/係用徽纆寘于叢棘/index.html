    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 係用徽纆寘于叢棘</nav></header><main><article><h1>係用徽纆寘于叢棘</h1><p>囚禁於牢獄，三歲不得出，比喻上六失道而凶。</p><p>上六曰「係用徽纆，寘于叢棘，三歲不得，凶」。</p><p>徽纆，繩索也；叢棘，牢獄也。上六以陰居坎極，失道而無應援，係縛囚禁，三年不能脫，凶之甚也。象曰「上六失道，凶三歲也」。</p><p><strong>所出</strong>：《周易 · 坎》 — https://zh.wikisource.org/wiki/周易/坎</p></article></main></div></div>
