    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 主人之史請讀賵</nav></header><main><article><h1>主人之史請讀賵</h1><p>史官請于柩東讀記所受賵之物。</p><p>主人之史請讀賵，執算從。柩東，當前束，西面。不命毋哭，哭者相止也。唯主人主婦哭。燭在右，南面。讀書，釋算則坐。卒，命哭，滅燭，書與算執之以逆出。</p><p><strong>所出</strong>：《儀禮 · 既夕禮》 — https://zh.wikisource.org/wiki/儀禮/既夕禮</p></article></main></div></div>
