    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 冥升</nav></header><main><article><h1>冥升</h1><p>昧暗而升，不知止也，戒以不息之貞。</p><p>升上六曰「冥升，利於不息之貞」。</p><p>《象》曰：「冥升在上，消不富也。」冥升者，昧於時而妄升也。居一卦之極，柔弱不能自抑，猶昏昧而行升，故曰冥升。及其消也，身且不存，況於富乎。</p><p>然《易》不棄人也，猶誨之曰「利於不息之貞」。不息者，知止而求不已也。升而不已則為亢，眩而不止則為冥。能以不息為心，則雖冥升之時，猶可以免於咎也。</p><p>與[[知進退存亡而不失其正]]之義相通。</p><p><strong>所出</strong>：《周易 · 升》 — https://zh.wikisource.org/wiki/周易/升</p></article></main></div></div>
