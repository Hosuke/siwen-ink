    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 景雲之色</nav></header><main><article><h1>景雲之色</h1><p>紫素左元君之炁象，景雲紫炁</p><p>景雲之色，紫素左元君真炁之象色也。</p><p>經云「真思紫素左元君翳鬱無刅真炁，景雲之色，罩於頂上」，言存思此神，當想景雲之紫炁覆罩其頂，是為景雲之色。</p><p><strong>所出</strong>：《上清大洞真經 · 22章》 — https://zh.wikisource.org/wiki/上清大洞真經/22章</p></article></main></div></div>
