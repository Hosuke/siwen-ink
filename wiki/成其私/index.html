    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 成其私</nav></header><main><article><h1>成其私</h1><p>聖人無私而自厚，是以成其自然之私。</p><p>故能成其私。</p><p>河上公注云：人以為私者，欲以厚己也；聖人無私而己自厚，故能成其私。</p><p>夫私之云者，非私利之私，乃成己之性，盡己之材。聖人不以私害公，而公溥焉；不以公滅私，而私正焉。為而不有，居而不辭，功成事遂而民曰自然，此聖人之私成也。百姓未嘗見其私，而其私莫之能爭；未嘗有其功，而其功莫之能加。</p><p><strong>所出</strong>：《老子河上公章句 · 韜光》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
