    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 息積</nav></header><main><article><h1>息積</h1><p>氣積脅下，久則妨食，非灸刺所宜。</p><p>息積之病，脅下滿、氣逆，二三歲不已。此不妨於食，不可灸刺。積為導引服藥，藥不能獨治也。</p><p><strong>所出</strong>：《黃帝內經 · 素問第十三卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第十三卷</p></article></main></div></div>
