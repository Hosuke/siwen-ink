    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 善陳者不戰</nav></header><main><article><h1>善陳者不戰</h1><p>善為國者不師，善師者不陳，善陳者不戰，善戰者不死，善死者不亡。</p><p>善為國者不師，善師者不陳，善陳者不戰，善戰者不死，善死者不亡。</p><p>兵事以嚴終。善陳者不戰，此之謂也。夫為國以德不以兵，修德以待天下之自服者，是為上焉。不得已而用師，師之善者，陳列整肅而不待接刃。若夫以奇計危行僥倖於一戰者，非善之善者也。推而至於死生之際，唯不失其道者為能全焉。兵凶戰危，聖人之所慎也，故以不戰為上。</p><p><strong>所出</strong>：《春秋穀梁傳 · 莊公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/莊公</p></article></main></div></div>
