    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 七王之反</nav></header><main><article><h1>七王之反</h1><p>吳楚七國連兵反，膠西、膠東、菑川、濟南皆應，齊獨守不下。</p><p>孝王十一年，吳王濞、楚王戊反，興兵西，告諸侯曰「將誅漢賊臣晁錯以安宗廟」。膠西王卬、膠東王雄渠、菑川王賢、濟南王辟光皆擅發兵應吳楚。欲與齊，齊孝王狐疑，城守不聽，三國兵共圍齊。齊王遣路中大夫求救，天子令堅守，漢兵破吳楚，圍乃解。已而聞齊初與三國通謀，漢將移兵伐齊，孝王懼而自殺。景帝以齊首善，以迫劫有謀，非其罪也，立孝王太子壽為懿王。而膠西、膠東、濟南、菑川四王咸誅滅，地入于漢。</p><p><strong>所出</strong>：《史記 · 卷052》 — https://zh.wikisource.org/wiki/史記/卷052</p></article></main></div></div>
