    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 上法而不上賢</nav></header><main><article><h1>上法而不上賢</h1><p>治國當法，不當尚賢。尚賢則亂，任法則治。</p><p>田氏取齊，戴氏取宋，皆所謂賢且智者也。然則廢常上賢則亂，舍法任智則危。故曰：上法而不上賢。賞罰者，人主之柄也；以賞禁，以刑勸，此治國用民之道也。為人臣者，當盡力守法，專心事主，不可稱堯舜之賢，譽湯武之功。此忠臣之本分，非競取君之國也。</p><p><strong>所出</strong>：《韓非子 · 忠孝》 — https://zh.wikisource.org/wiki/韓非子/忠孝</p></article></main></div></div>
