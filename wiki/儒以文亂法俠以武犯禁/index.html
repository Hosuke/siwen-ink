    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 儒以文亂法俠以武犯禁</nav></header><main><article><h1>儒以文亂法俠以武犯禁</h1><p>儒者以文學擾亂法度，俠者以武力違犯禁令，人主兼禮之，此所以亂國也。</p><p>儒以文亂法，俠以武犯禁，而人主兼禮之，此所以亂也。夫離法者罪，而諸先生以文學取；犯禁者誅，而羣俠以私劒養。故法之所非，君之所取；吏之所誅，上之所養也。</p><p><strong>所出</strong>：《韓非子 · 五蠹》 — https://zh.wikisource.org/wiki/韓非子/五蠹</p></article></main></div></div>
