    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 立國</nav></header><main><article><h1>立國</h1><p>建都立邑當因天材、就地利，務在便民。</p><p>凡立國都，非於大山之下，必於廣川之上。高毋近旱而水用足，下毋近水而溝防省。因天材，就地利，故城郭不必中規矩，道路不必中準繩。</p><p><strong>所出</strong>：《管子 · 第05篇乘馬》 — https://zh.wikisource.org/wiki/管子/第05篇乘馬</p></article></main></div></div>
