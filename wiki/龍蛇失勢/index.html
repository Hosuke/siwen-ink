    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 龍蛇失勢</nav></header><main><article><h1>龍蛇失勢</h1><p>龍蛇之靈，亦賴雲霧以騰；一旦雲散霧消，與螾螻等耳。</p><p>夫龍乘雲而升，蛇遊霧而舞，翩翩莫測其狀。及其雲斂霧收，則蜿蜒蠕動，與螾螻螞蟻何以異哉？非龍蛇之才變也，失其所乘之勢也。</p><p>由此觀之，賢智之人所以屈於不肖，非才分之不及也，權輕位卑故也。匹夫之堯，不能治三人；天子之桀，乃能亂天下。可不察與？</p><p><strong>所出</strong>：《韓非子 · 難勢》 — https://zh.wikisource.org/wiki/韓非子/難勢</p></article></main></div></div>
