    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 良馬千萬</nav></header><main><article><h1>良馬千萬</h1><p>九方皋相馬，得其精而忘其粗</p><p>穆公使伯樂求馬，伯樂告以九方皋。皋三月而反，曰：「已得馬，在沙丘，牡而黃。」使人往取之，牝而驪。穆公不說，伯樂喟然歎曰：「若皋之所觀者，天機也。得其精而忘其粗，在內而忘其外。」馬至，果千里之馬。此[[大直若屈]]之驗。</p><p><strong>所出</strong>：《淮南子 · 道應訓》 — https://zh.wikisource.org/wiki/淮南子/道應訓</p></article></main></div></div>
