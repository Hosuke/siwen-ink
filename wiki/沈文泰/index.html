    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 沈文泰</nav></header><main><article><h1>沈文泰</h1><p>得還年土符，隱居九嶷，不欲速去三尸。</p><p>沈文泰者，九嶷人也。得江神丹土符還年之道，服之有效，欲棲[[昆侖]]安息二千餘年，以傳[[李文淵]]曰：「土符不法服藥，行道無益也。」文淵遂授其秘要，後亦[[昇天]]。今以竹根汁煮丹黃土，去三尸，出此二人也。</p><p><strong>所出：</strong>《神仙傳 · 卷一》 — https://zh.wikisource.org/wiki/神仙傳/卷一</p></article></main></div></div>
