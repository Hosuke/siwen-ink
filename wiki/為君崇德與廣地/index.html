    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 為君崇德與廣地</nav></header><main><article><h1>為君崇德與廣地</h1><p>崇德者霸，廣地者滅；務廣地者非亡國之道，乃取死之途。</p><p>夫為君崇德者霸，為君廣地者滅。故千乘之國，行文德者王，湯、武是也；萬乘之國，好廣地者亡，智伯是也。</p><p>非其事者勿仞也，非其名者勿就也，無故有顯名者勿處也，無功而富貴者勿居也。夫就人之名者廢，仞人之事者敗，無功而大利者後將為害。</p><p><strong>所出</strong>：《淮南子 · 人間訓》 — https://zh.wikisource.org/wiki/淮南子/人間訓</p></article></main></div></div>
