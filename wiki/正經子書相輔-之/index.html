    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 正經子書相輔-之</nav></header><main><article><h1>正經子書相輔-之</h1><p></p><p>抱朴子又云：「仰而比之，則景星之佐三辰；俯而方之，則林薄之裨嵩嶽。」言正經與子書相須為用，不可偏廢。子書披引玄曠，總不測之源，揚無遺之流，變化不系於規矩之方圓，旁通不淪於違正之邪徑。是以才士所寄於其間者，正以其能增深正道，非異端也。</p><p>  <strong>所出</strong>：《抱朴子 · 卷44》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷44</p></article></main></div></div>
