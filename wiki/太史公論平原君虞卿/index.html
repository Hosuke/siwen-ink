    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 太史公論平原君虞卿</nav></header><main><article><h1>太史公論平原君虞卿</h1><p>太史公譏平原君利令智昏，稱虞卿料事揣情，然終困大梁。</p><p>太史公曰：平原君，翩翩濁世之佳公子也，然未睹大體。鄙語曰「利令智昏」，平原君貪馮亭邪說，使趙陷長平兵四十餘萬眾，邯鄲幾亡。虞卿料事揣情，爲趙畫策，何其工也！及不忍魏齊，卒困於大梁，庸夫且知其不可，況賢人乎？然虞卿非窮愁，亦不能著書以自見於後世云。</p><p>【索隱述贊】翩翩公子，天下奇器。笑姬從戮，義士增氣。兵解李同，盟定毛遂。虞卿躡蹻，受賞料事。及困魏齊，著書見意。</p><p><strong>所出</strong>：《史記 · 卷076》 — https://zh.wikisource.org/wiki/史記/卷076</p></article></main></div></div>
