    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 恥令其君不及堯舜</nav></header><main><article><h1>恥令其君不及堯舜</h1><p>臣之至用心，在使君為堯舜之君。</p><p>恥令其君不及唐虞，此亦達者之用心也。言人臣之志，不在炫耀己才，在使君成堯舜之德。此[[何事非君何使非民]]之義也。</p><p><strong>所出</strong>：《抱朴子 · 卷12》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷12</p></article></main></div></div>
