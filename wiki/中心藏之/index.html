    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 中心藏之</nav></header><main><article><h1>中心藏之</h1><p>愛慕之情，藏於心中，不輕以告人也。</p><p>「心乎愛矣，遐不謂矣」。愛之至而不敢言，藏之深而不輕發。桑葉幽時色深，比情之益厚。見君子而中心藏之，蓋有所不敢言者。然雖不言，其志則無日而忘。此詩之意，以桑起興，而其要在「中心藏之」四字。後世言深情不渝者，多用此語。</p><p><strong>所出</strong>：《詩經 · 隰蘭》 — https://zh.wikisource.org/wiki/詩經/隰桑</p></article></main></div></div>
