    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 寡婦清守業</nav></header><main><article><h1>寡婦清守業</h1><p>巴蜀寡婦清守丹穴之利，用財自衛，秦皇帝以為貞婦而客之。</p><p>巴蜀寡婦清，其先得丹穴，而擅其利數世，家亦不訾。清，寡婦也，能守其業，用財自衛，不見侵犯。秦皇帝以為貞婦而客之，為筑女懷清臺。夫倮鄙人牧長，清窮鄉寡婦，禮抗萬乘，名顯天下，豈非以富邪？</p><p><strong>所出</strong>：《史記 · 卷129》 — https://zh.wikisource.org/wiki/史記/卷129</p></article></main></div></div>
