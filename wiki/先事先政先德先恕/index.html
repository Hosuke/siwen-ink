    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 先事先政先德先恕</nav></header><main><article><h1>先事先政先德先恕</h1><p>牧民有時先行，有時先政，有時先德，有時先恕。</p><p>管子言牧民有先後之序：「有時先事，有時先政，有時先德，有時先恕。」年豐民富則先事以充倉廩，民疾疫則先恕以振其罷。此聖王視時而動之義。</p><p><strong>所出</strong>：《管子 · 第51篇小問》 — https://zh.wikisource.org/wiki/管子/第51篇小問</p></article></main></div></div>
