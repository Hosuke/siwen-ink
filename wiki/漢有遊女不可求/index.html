    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 漢有遊女不可求</nav></header><main><article><h1>漢有遊女不可求</h1><p>遊女不可犯禮而求，興文王之化雖廣，人欲卒不可遂。</p><p>漢水之上，有遊觀之女，男子慕之而不可犯禮以求。以興文王德化廣被南國，而無思犯禮，終不可得。此[[毛詩序]]所謂「無思犯禮，求而不可得」者也。</p><p><strong>所出</strong>：《詩經 · 漢廣》 — https://zh.wikisource.org/wiki/詩經/漢廣</p></article></main></div></div>
