    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 公田私田</nav></header><main><article><h1>公田私田</h1><p>公田先潤，私田次之</p><p>雨我公田，遂及我私。公田者，井邑之餘地，國家所取也。私田者，民所耕以自養者也。周制公卿大夫有采邑，而民亦受田以食，故雨先公而後私，詩人美之。</p><p><strong>所出</strong>：《詩經 · 大田》 — https://zh.wikisource.org/wiki/詩經/大田</p></article></main></div></div>
