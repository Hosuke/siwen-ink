    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 包有魚義不及賓</nav></header><main><article><h1>包有魚義不及賓</h1><p>象傳語，九二包有其魚，義當及於近者，不宜及於賓客。</p><p>「包有魚，義不及賓也。」</p><p>九二陽居中位，剛德得中而有含容之量。其「包有魚」者，包而制之也。物之遇己者，當先及近而後遠，故義在於不及賓。譬如魚在包中，可以及己，未可遠及於人也。</p><p>夫義者宜也，先近後遠，先親後疏，聖人之教也。</p><p><strong>所出</strong>：《周易 · 姤》 — https://zh.wikisource.org/wiki/周易/姤</p></article></main></div></div>
