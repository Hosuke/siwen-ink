    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 禍莫大於不知足</nav></header><main><article><h1>禍莫大於不知足</h1><p>富貴不能自禁，貪取召禍。</p><p>[[禍莫大於不知足]]，[[富貴不能自禁止]]也。糞田者取足於地，糞身者取足於精；不知足者取無厭，取則[[欲得人物]]，[[利且貪]]，[[咎莫大]]生焉。[[知足之足]]守真根，[[不知足]]則禍莫大。知足之足與不知足，一糞一馳，治亂分焉。</p><p><strong>所出</strong>：《老子河上公章句 · 儉欲》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
