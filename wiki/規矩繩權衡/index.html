    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 規矩繩權衡</nav></header><main><article><h1>規矩繩權衡</h1><p>深衣之製所象徵之五器，以應規、矩、繩、權、衡，取其無私、直、平之義。</p><p>衡之於輕重、繩墨之於曲直、規矩之於方圓，三者並用於治國之喻，見《禮記·經解》。</p><p>  《經解》曰：「禮之於正國也，猶衡之於輕重也，繩墨之乎曲直也，規矩之於方圓也。」衡以量輕重，繩墨以正曲直，規矩以定方圓，三者皆天下之公器也。君子審禮，則姦詐無所遁其形；衡誠縣，則輕重不可欺；繩墨誠陳，則曲直不可誣；規矩誠設，則方圓不可紊。</p><p>  故隆禮由禮，則為有方之士；不隆禮不由禮，則為無方之民。禮者，治國之衡繩墨規矩也。</p></article></main></div></div>
