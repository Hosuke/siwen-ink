    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大洞消魔玉祝</nav></header><main><article><h1>大洞消魔玉祝</h1><p>太上消魔玉清王之祝，拔死籍、盪穢幽冥、七世解結之呪。</p><p>大洞消魔玉祝，乃高上神霄玉清王所祝之辭。經云：「命門合精，六混七分，太一把籍，司命理神，帝一固形，無英守魂，大回紫房，奉符帝君，胞樹伐絕，斷滅血根，七玄更起，沉景生烟。」</p><p>此祝以命門合精為根，六混七分為用，太一主籍、司命理神、帝一固形、無英守魂、大回紫房為要，可令胞樹伐絕、血根斷滅、七玄更起、沉景生烟，兆得上昇、身映日月、命與天連。</p><p><strong>所出</strong>：《上清大洞真經 · 36章》 — https://zh.wikisource.org/wiki/上清大洞真經/36章</p></article></main></div></div>
