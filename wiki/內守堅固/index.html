    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 內守堅固</nav></header><main><article><h1>內守堅固</h1><p>守護精氣神三者，使凝結不散，是為內守之要。</p><p>內守者，守護身中三元——元精、元氣、元神——之法也。</p><p>守之云者，非執持之謂，乃勿使散失之義。精不妄泄則盈，氣不妄散則固，神不妄騖則安。三者各安其位、相守不失，則長存之基立矣。</p><p>《黃庭經》以「真之真」言之，示此守護乃煉形之要、飛昇之本，視其他工夫此為最切。</p><p><strong>所出</strong>：《黃庭內景經 · 紫清章第二十九》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/紫清章第二十九</p></article></main></div></div>
