    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 元惡大憝</nav></header><main><article><h1>元惡大憝</h1><p>悖逆之罪，莫大於不孝不友；此為眾惡之本。</p><p>《康誥》論元惡，以為「元惡大憝，矧惟不孝不友」。蓋父子之親、兄弟之誼，人倫之大者也。子弗祇服厥父事，是為不孝；弟弗念天顯，是為不友。不孝不友，則根本壞而枝葉隨之，民彝泹亂，天理斁絕；是為元惡大憝，不可赦也。文王作罰，刑茲無赦，此之謂乎。</p><p><strong>所出</strong>：《尚書 · 康誥》 — https://zh.wikisource.org/wiki/尚書/康誥</p></article></main></div></div>
