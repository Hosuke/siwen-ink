    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 舜舉八元</nav></header><main><article><h1>舜舉八元</h1><p>舜舉高辛氏才子八人，布五教於四方。</p><p>昔高辛氏有才子八人，世謂之「八元」。堯舉八元，使布五教于四方，父義，母慈，兄友，弟恭，子孝，內平外成。</p><p><strong>所出</strong>：《史記 · 卷001》 — https://zh.wikisource.org/wiki/史記/卷001</p></article></main></div></div>
