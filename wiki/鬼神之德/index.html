    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鬼神之德</nav></header><main><article><h1>鬼神之德</h1><p>鬼神視之不見聽之不聞而體物不可遺，其功至微而顯也。</p><p>子曰：「鬼神之為德，其盛矣乎！視之而弗見，聽之而弗聞，體物而不可遺。使天下之人齊明盛服，以承祭祀。洋洋乎！如在其上，如在其左右。《詩》曰：『神之格思，不可度思！矧可射思！』夫微之顯，誠之不可揜如此夫。」</p><p><strong>所出</strong>：《中庸 · 中庸章句》 — https://zh.wikisource.org/wiki/四書章句集註/中庸章句</p></article></main></div></div>
