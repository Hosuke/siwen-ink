    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 儒學</nav></header><main><article><h1>儒學</h1><p>儒家之學，以修身為本，崇禮儀而重內在工夫，與道家相對而言。</p><p>儒者，言修身之學、崇禮儀之道的學者之稱。儒學者，以修身為本，注重內外兼修之工夫。[[痀僂承蜩]]所記[[道-道家-之]]家批判[[儒-儒學-之]]家，謂世儒但知外在之禮儀，不知內在之工夫。此[[道-道家-之]]對[[儒-儒學-之]]之批判，正指出儒家之修己，未必臻於「神」之境界。修己而後言上，乃[[儒-儒學-之]]固有之義；而[[道-道家-之]]之意，則在指出其未足也。</p></article></main></div></div>
