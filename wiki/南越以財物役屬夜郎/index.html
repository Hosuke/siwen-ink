    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 南越以財物役屬夜郎</nav></header><main><article><h1>南越以財物役屬夜郎</h1><p>述南越以財物羈縻夜郎之事</p><p>蜀賈人言於唐蒙：南越以財物役屬夜郎，西至同師，然亦不能臣使也。蓋夜郎恃其道遠，聽命而不盡服者也。</p><p><strong>所出</strong>：《史記 · 卷116》 — https://zh.wikisource.org/wiki/史記/卷116</p></article></main></div></div>
