    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 屈宋逸步</nav></header><main><article><h1>屈宋逸步</h1><p>屈宋之文風超逸，後世莫能追及。</p><p>自《九懷》以下，遽躡其跡，而屈宋逸步，莫之能追。故其敘情怨，則鬱伊而易感；述離居，則愴怏而難懷；論山水，則循聲而得貌；言節候，則披文而見時。</p><p>是以枚賈追風以入麗，馬揚沿波而得奇，其衣被詞人，非一代也。故才高者菀其鴻裁。中巧者獵其豔辭，吟諷者銜其山川，童蒙者拾其香草。</p><p><strong>所出</strong>：《文心雕龍 · 辨騷》 — https://zh.wikisource.org/wiki/文心雕龍/辨騷</p></article></main></div></div>
