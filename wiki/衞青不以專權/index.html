    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 衞青不以專權</nav></header><main><article><h1>衞青不以專權</h1><p>衞青以為人臣不敢專誅，具歸天子自裁，以見不敢專權之義。</p><p>且使臣職雖當斬將，以臣之尊寵而不敢自擅專誅於境外，而具歸天子，天子自裁之，於是以見為人臣不敢專權，不亦可乎？</p><p><strong>所出</strong>：《史記 · 卷111》 — https://zh.wikisource.org/wiki/史記/卷111</p></article></main></div></div>
