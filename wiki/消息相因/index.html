    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 消息相因</nav></header><main><article><h1>消息相因</h1><p>消息者，盈虛迭運，迭相因仍，終而復始。</p><p>[[消息盈虛]]之說，見於《易》及他籍。然此經明言「變易更盛，消息相因」，謂盈之極者虛，虛之極者盈，往者屈而來者信，迭相待也。</p><p>蓋天地之運，日月之迭，寒暑之更，無非消息之象。盈而不知持，則反；虛而能守，則復。此自然之理，聖人所必察也。</p><p><strong>所出</strong>：《周易參同契 · 19章》 — https://zh.wikisource.org/wiki/周易參同契/19章</p></article></main></div></div>
