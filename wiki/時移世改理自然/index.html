    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 時移世改理自然</nav></header><main><article><h1>時移世改理自然</h1><p>世道既殊，文質代變，理所固然，不可膠柱。</p><p>抱朴子本卷又暢言古今文章不必殊異，云：「百家之言，雖有步起，皆出碩儒之思，成才士之手，方之古人，不必悉減也。或有汪濊玄曠，合契作者，內辟不測之深源，外播不匱之遠流，其所祖宗也高，其所紬繹也妙，變化不繫滯於規矩之方圓，旁通不凝閡於一途之逼促，是以偏嗜酸鹹者，莫能知其味，用思有限者，不能得其神也。」此正 [[時移世改理自然]] 之義，而益暢言其理也。</p><p>  <strong>所出</strong>：《抱朴子 · 卷32》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷32</p></article></main></div></div>
