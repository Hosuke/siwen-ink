    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 歸嬰兒</nav></header><main><article><h1>歸嬰兒</h1><p>復歸嬰兒，德性完具。</p><p>[[老子 (帛書本) · 章二十八]]云「恒德不離，復歸嬰兒」，言恒常之德不失，則返乎純樸，如嬰兒之初生，未有是非人我之累也。</p><p>帛書乙本「知其雄守其雌」下云「恒德不離」，甲本「雞」即「離」之借字，「不離」者不離恒德也。恒德不失，自然返本，故曰「復歸嬰兒」。</p><p>嬰兒無知無欲，純一不雜，此道家復性之初門也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章二十八》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
