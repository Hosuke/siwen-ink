    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 愛姬殖患</nav></header><main><article><h1>愛姬殖患</h1><p>太史公論黥布之禍，起於所幸姬與賁赫交通，妒媢生患，竟以滅國。</p><p>太史公曰：英布者，其先豈春秋所見楚滅英、六，皋陶之後哉？身被刑法，何其拔興之暴也！項氏之所阬殺人以千萬數，而布常為首虐。功冠諸侯，用此得王，亦不免於身為世大僇。禍之興自愛姬殖，妒媢生患，竟以滅國！</p><p><strong>所出</strong>：《史記 · 卷091》 — https://zh.wikisource.org/wiki/史記/卷091</p></article></main></div></div>
