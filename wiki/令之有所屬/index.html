    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 令之有所屬</nav></header><main><article><h1>令之有所屬</h1><p>導民於道，使有所歸。</p><p>故令之有所屬。</p><p>言上之所以導民者，必使之有所歸屬。歸屬者，歸於道也。令三言有所屬者，使三言有以實之，有以行之。</p><p>屬者，附也，歸也。民之情易散，必有以斂之；民之心易馳，必有以止之。令之有所屬者，使知所止，知所返，不至於流蕩失守也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第六十三章 樸素》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
