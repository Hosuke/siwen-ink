    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 禮者治辨之極</nav></header><main><article><h1>禮者治辨之極</h1><p>禮為治國之根本，非堅甲利兵、高城深池所可比。</p><p>孫卿子云：「禮者、治辨之極也，強固之本也，威行之道也，功名之總也，王公由之所以得天下也，不由所以隕社稷也。」故堅甲利兵不足以為勝，高城深池不足以為固，嚴令繁刑不足以為威。由其道則行，不由其道則廢。</p><p><strong>所出</strong>：《荀子 · 議兵篇》 — https://zh.wikisource.org/wiki/荀子/議兵篇</p></article></main></div></div>
