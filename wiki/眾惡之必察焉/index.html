    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 眾惡之必察焉</nav></header><main><article><h1>眾惡之必察焉</h1><p>謂眾人皆以為惡者，必審察之，不可輕信。</p><p>子曰：「眾惡之，必察焉；眾好之，必察焉。」</p><p>言物論之不可以偏聽也。眾人皆以為惡，我則察之；眾人皆以為好，亦必察之。善惡在是，非苟循眾也。</p><p><strong>所出</strong>：《論語 · 衞靈公第十五》 — https://zh.wikisource.org/wiki/論語/衞靈公第十五</p></article></main></div></div>
