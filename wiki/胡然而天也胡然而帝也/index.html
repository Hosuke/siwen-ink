    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 胡然而天也，胡然而帝也</nav></header><main><article><h1>胡然而天也，胡然而帝也</h1><p>問何以儼然如天帝，歎其德不稱</p><p>「胡然而天也，胡然而帝也」，見於《詩經·君子偕老》。呂氏注曰：「二章之末云『胡然而天也，胡然而帝也』，問之也。」言夫人之服飾美盛，儼然若天帝然。詩人不言其何以至此，而但以為問，辭婉而意深，蓋譏之也。</p><p><strong>所出</strong>：《詩經 · 君子偕老》 — https://zh.wikisource.org/wiki/詩經/君子偕老</p></article></main></div></div>
