    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 愛臣太親國亡</nav></header><main><article><h1>愛臣太親國亡</h1><p>諸侯博大、羣臣太富，乃亡國之階。</p><p>昔者紂之亡，周之卑，皆從諸侯之博大也；晉之分也，齊之奪也，皆以羣臣之太富也。夫燕、宋之所以弑其君者，皆此類也。故上比之殷、周，中比之燕、宋，莫不從此術也。是故明君之畜其臣也，盡之以法，質之以備。</p><p><strong>所出</strong>：《韓非子 · 愛臣》 — https://zh.wikisource.org/wiki/韓非子/愛臣</p></article></main></div></div>
