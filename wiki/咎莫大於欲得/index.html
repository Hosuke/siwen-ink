    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 咎莫大於欲得</nav></header><main><article><h1>咎莫大於欲得</h1><p>欲得人物，利且貪，咎莫大焉。</p><p>[[咎莫大於欲得]]，[[欲得人物，利且貪]]也。[[罪莫大於可欲]]、[[禍莫大於不知足]]、[[咎莫大於欲得]]，三者遞深。[[卻走馬以糞]]者糞田糞身，是[[知足之足]]；[[欲得人物]]者馳逐馳求，是[[天下無道]]之根。[[常足]]者[[無欲心]]，[[欲得]]者有[[欲心]]，[[知足之足]]與[[欲得]]，[[糞]]與[[馳]]之辨也。</p><p><strong>所出</strong>：《老子河上公章句 · 儉欲》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
