    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不自見故明</nav></header><main><article><h1>不自見故明</h1><p>不自現則明</p><p>聖人不以其目視千里之外也，乃因天下之目以視，故能明達也。</p><p>[[不自見故明]]者，[[不自見]]者，去己見也。己見去則心虛，心虛則鑒物之理徹。[[自知者明]]，亦此義。</p><p><strong>所出</strong>：《老子河上公章句 · 益謙》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
