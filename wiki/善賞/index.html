    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 善賞</nav></header><main><article><h1>善賞</h1><p>善賞者費少而勸多，善罰者刑省而禁姦；至賞不費，至刑不濫。</p><p>善賞者，費少而勸多；善罰者，刑省而禁姦；善與者，用約而為德；善取者，入多而無怨。故聖人因民之所喜以勸善，因民之所憎以禁姦。賞一人而天下趨之，罰一人而天下畏之。是以至賞不費，至刑不濫。聖人守約而治廣，此之謂也。</p><p><strong>所出</strong>：《文子 · 卷十一》 — https://zh.wikisource.org/wiki/文子/卷十一</p></article></main></div></div>
