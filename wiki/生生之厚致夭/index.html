    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 生生之厚致夭</nav></header><main><article><h1>生生之厚致夭</h1><p>夫人所以不能終其壽命而中道夭於刑戮者，以其生生之厚。</p><p>人生天地之間，壽命有定分，非人所能強致。然而世人不知止足，奉養過厚，嗜欲無節，以厚其生者反以傷其生。求生之情愈切，則動之死地愈速。是故養生貴乎中和，順自然而無所執著。若貪生太過，拂性逆理，雖欲久存，其可得乎。</p><p><strong>所出</strong>：《老子河上公章句 · 貴生》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
