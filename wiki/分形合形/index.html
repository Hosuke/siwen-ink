    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 分形合形</nav></header><main><article><h1>分形合形</h1><p>以一氣分萬物如棄髮可換，以一氣合萬物如破唇可補。</p><p>以一氣生萬物，猶棄髮可換，所以分形；以一氣合萬物，猶破唇可補，所以合形。</p><p><strong>所出</strong>：《關尹子 · 6》 — https://zh.wikisource.org/wiki/關尹子/6</p></article></main></div></div>
