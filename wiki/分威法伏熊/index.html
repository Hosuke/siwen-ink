    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 分威法伏熊</nav></header><main><article><h1>分威法伏熊</h1><p>藏神伏志，使威勢分流之術。</p><p>分威者，神之覆也。故靜意固志，神歸其舍，則威覆盛矣。威覆盛，則內實堅；內實堅，則莫當；莫當，則能以分人之威而動其勢，如其天。</p><p>以實取虛，以有取無，若以鎰稱銖。故動者必隨，唱者必和。撓其一指，觀其余次，動變見形，無能間者。審于唱和，以間見間，動變明而威可分也。</p><p>將欲動變，必先養志以視間。知其固實者，自養也。讓己者，養人也。故神存兵亡，乃為知形勢。</p><p><strong>所出</strong>：《鬼谷子》 — https://zh.wikisource.org/wiki/本经阴符七术</p></article></main></div></div>
