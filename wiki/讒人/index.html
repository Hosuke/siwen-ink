    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 讒人</nav></header><main><article><h1>讒人</h1><p>以言陷人、播弄是非之人，詩人所以刺也。</p><p>「讒人」之義，《青蠅》言之屢矣。</p><p>讒人者，離人骨肉、陷人於罪者也。讒之為言，從言從炎。言附會增益，熒惑聽聞，使上不察而下被罪者也。《青蠅》以[[青蠅|青蠅]]之止於樊棘榛比之，明其由外而浸內，由遠而及近也。二章言「讒人罔極，交亂四國」，三章言「讒人罔極，構我二人」，由四國之遠而至二人之近，其害人之心無有止極。[[詩有六義|變雅]]刺詩之義，皆以此等人為首誅也。</p><p><strong>所出</strong>：《詩經 · 青蠅》 — https://zh.wikisource.org/wiki/詩經/青蠅</p></article></main></div></div>
