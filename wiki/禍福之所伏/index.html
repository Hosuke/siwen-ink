    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 禍福之所伏</nav></header><main><article><h1>禍福之所伏</h1><p>禍福相倚，伏而不測。</p><p>禍福相倚之理，老子言之深矣。福之方來，禍根已潛伏其中；禍之既至，福機亦隱寓其內。塞翁失馬，安知非福；塞翁得馬，安知非禍。世人但知趨福避禍，而不知福未嘗無祸根、禍未嘗無福兆，終日營營，鮮克有定。老子歎曰「孰知其極」，言世人迷於耳目之近，無由窺此反覆之機者久矣。</p><p>  <strong>所出</strong>：《道德經 (王弼本) · 五十八章》 — https://zh.wikisource.org/wiki/道德經 (王弼本）</p></article></main></div></div>
