    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 求之以貌責之以妍</nav></header><main><article><h1>求之以貌責之以妍</h1><p>俗人務在皮膚，不料心誌，徒睹外形之粗簡，不能察精神之淵邈。</p><p>求之以貌，責之以妍，俗人徒睹其外形之粗簡，不能察其精神之淵邈，務在皮膚，不料心誌，雖懷英抱異，絕倫邁世，事動可以悟舉世之術，言發足以解古今之惑，含章括囊，非法不談，而茅蓬不能動萬鈞之鏗鏘，侏儒不能看重仞之弘麗，因而蚩之，謂為凡愦。</p><p><strong>所出</strong>：《抱朴子 · 卷27》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷27</p></article></main></div></div>
