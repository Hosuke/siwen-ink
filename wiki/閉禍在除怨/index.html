    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 閉禍在除怨</nav></header><main><article><h1>閉禍在除怨</h1><p>除去怨咎之根，禍亂無由生。</p><p>閉禍在除怨。非有怨乃除之，所事之地常無怨也。凡禍亂之所生，生於怨咎。怨咎所生，生於非理。</p><p>是以明君之事衆也必經，使之必道，施報必當，出言必得，刑罰必理。如此，則衆無鬱怨之心，無憾恨之意。如此，則禍亂不生，上位不殆。</p><p><strong>所出</strong>：《管子 · 第66篇版法解》 — https://zh.wikisource.org/wiki/管子/第66篇版法解</p></article></main></div></div>
