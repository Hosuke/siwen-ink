  <body>
    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 孝武皇帝郊見五畤</nav></header><main><article><h1>孝武皇帝郊見五畤</h1><p>記今上初至雍郊見五畤，後常三歲一郊。</p><p>後六年，竇太后崩。其明年，徵文學之士公孫弘等。</p><p>明年，今上初至雍，郊見五畤。後常三歲一郊。是時上求神君，捨之上林中蹄氏觀。趙綰、王臧等欲立明堂城南，朝諸侯，事未就。會竇太后不好儒術，趙綰等皆自殺，諸所興為皆廢。</p><p><strong>所出</strong>：《史記 · 卷028》 — https://zh.wikisource.org/wiki/史記/卷028</p></article></main></div></div>
