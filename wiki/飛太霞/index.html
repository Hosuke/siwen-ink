    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 飛太霞</nav></header><main><article><h1>飛太霞</h1><p>久修得道，飛昇太霞之境。</p><p>太霞，天庭之別境，仙真所居。久久行之者，言持煉之功不可以一蹴至也，必日日無間、久久不息，自然神化，脫形骸而躡太霞。</p><p>此為煉心之極功。修煉之士存心、守一、調血、理命，外應口舌，臨絕呼之，起死者於既仆，久久純熟，則心君虛明，神全氣足，脫胎換骨，乘雲駕龍，上昇太霞，與道合真矣。</p><p><strong>所出</strong>：《黃庭內景經 · 心部章第十》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/心部章第十</p></article></main></div></div>
