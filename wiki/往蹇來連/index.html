    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 往蹇來連</nav></header><main><article><h1>往蹇來連</h1><p>往則躓難，來則連類以相濟。</p><p>六四曰：「往蹇來連。」</p><p>往則益蹇，來則連乎陽剛以為助也。六四柔而得正，與九三相連，連類以圖濟，其道可通。當位而實，義在依輔以成事也。</p><p><strong>所出</strong>：《周易 · 蹇》 — https://zh.wikisource.org/wiki/周易/蹇</p></article></main></div></div>
