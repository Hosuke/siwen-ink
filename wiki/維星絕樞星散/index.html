    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 維星絕樞星散</nav></header><main><article><h1>維星絕樞星散</h1><p>晏子以天象破柏常騫延壽之妄言。</p><p>柏常騫為景公築新室、置白茅以禳梟，梟死，公以為能益壽。晏子遇常騫於塗，問焉，常騫以「得壽地且動」對。晏子曰：「昔吾見維星絕，樞星散，地其動，汝以是乎？」常騫俯有間，仰而對曰：「然。」晏子曰：「為之無益，不為無損也。汝薄斂，毋費民，且無令君知之。」</p><p>天象之變，非人力所能干。晏子援星占以破方術之妄，正人心而息迷信，其識卓矣。</p><p><strong>所出</strong>：《晏子春秋 · 卷六》 — https://zh.wikisource.org/wiki/晏子春秋/卷六</p></article></main></div></div>
