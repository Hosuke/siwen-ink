    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以貴行</nav></header><main><article><h1>以貴行</h1><p>帝乙歸妹，居中履正，以尊貴之德行之。</p><p>象傳釋六五曰：「帝乙歸妹，不如其娣之袂良也；其位在中，以貴行也。」帝乙嫁女，不以服飾相尚，反不及娣之華美。然居中履正，德貴於飾，是為以貴行。貴者，內德之貴，非徒位之尊也。</p><p><strong>所出</strong>：《周易 · 歸妹》 — https://zh.wikisource.org/wiki/周易/歸妹</p></article></main></div></div>
