    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 日中司命接生君</nav></header><main><article><h1>日中司命接生君</h1><p>日中神君，主司命接生，守兆左手之戶，脫七祖之滯。</p><p>日中司命接生君，上清大洞第二十五章所言主神也。字曰道靈，常守兆之左手通真之戶、死炁之門。兆誦是經，則魔炁滅絕，七祖解脫，魂魄更生。[[四大正明]]為之衛護，玉華保真於內，[[三華之炁]]罩於頂上也。</p><p>真思其真炁，三華之色，乃默誦其呪。[[清齋]]致一，然後行事。其要在左手一路，通真而絕死，此[[命門]]之樞機歟。</p><p><strong>所出</strong>：《上清大洞真經 · 25章》 — https://zh.wikisource.org/wiki/上清大洞真經/25章</p></article></main></div></div>
