    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 甯越苦耕</nav></header><main><article><h1>甯越苦耕</h1><p>中牟鄙人苦耕稼之勞，學十五年而為諸侯師，用志精也。</p><p>甯越，中牟之鄙人也，苦耕稼之勞，謂其友曰：「何為而可以免此苦也？」其友曰：「莫如學。學三十歲則可以達矣。」甯越曰：「請以十五歲。人將休，吾將不敢休；人將臥，吾將不敢臥。」十五歲而周威公師之。</p><p>矢之速也，而不過二里止也；步之遲也，而百舍不止也。今以甯越之材而久不止，其為諸侯師，豈不宜哉？</p><p>[[為道日損]]，然非久於學則不能有成。甯越之志，精且專矣。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十四》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十四</p></article></main></div></div>
