    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 萬物睽而事類</nav></header><main><article><h1>萬物睽而事類</h1><p>男女睽而其志同，萬物睽而其事類；睽而知其類，異而知其通。</p><p>萬物睽而其事類也，男女睽而其志同也，其唯明爻者乎。</p><p><strong>所出</strong>：《周易註 (王弼) · 卷10》 — https://zh.wikisource.org/wiki/周易註 (四庫全書本)/卷10</p></article></main></div></div>
