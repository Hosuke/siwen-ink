    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 嫁娶之法</nav></header><main><article><h1>嫁娶之法</h1><p>聖王定嫁娶之年，丈夫二十、女子十五，及時嫁娶，以繁人族。</p><p><strong>嫁娶之法</strong>者，《節用上》所言聖王之制也。墨子引聖王之法曰：「丈夫年二十，毋敢不處家。女子年十五，毋敢不事人。」此聖王所以繁人族之法也。</p><p>墨子論「人為難倍」之理：物之數可加倍，而人則難以倍增。聖王既沒，此法不行，民有早婚者二十年處家，有晚婚者四十年處家，以遲早相踐，距聖王之法十年。若純用三年而字，子生可以二三年矣，是故蚤處家可以倍也。</p><p>此法與[[節用]]相輔：去無用之費，以足生養之資；定嫁娶之時，以繁天下之民。二者並行，則國富人多，此聖王之治道也。</p></article></main></div></div>
