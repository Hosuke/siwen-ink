    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 有物混成</nav></header><main><article><h1>有物混成</h1><p>道先天地而生，渾然自成一物</p><p>道者，先天地而生，非由外鑠我也。言「有物混成」，則道之為物不可以定名、不可以定形，渾淪而莫如其端倪焉。天地之未闢、陰陽之未分，道已卓然自存矣。</p><p><strong>所出</strong>：《道德經 (王弼本) · 二十五章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
