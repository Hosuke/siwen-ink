    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 臣以卑儉爲行</nav></header><main><article><h1>臣以卑儉爲行</h1><p>爵賞不足以觀賞</p><p>臣以卑儉爲行，則爵不足以觀賞；寵光無節，則臣下侵偪。說在苗賁皇非獻伯，孔子議晏嬰。故仲尼論管仲與孫叔敖。而出入之容變，陽虎之言見其臣也。</p><p>臣以卑儉爲行，則爵賞不足以觀賞；君寵無節，則臣下侵偪。此所以[[管仲]]富而孔子非之，[[孫叔敖]]儉而聖人稱之也。</p><p><strong>所出</strong>：《韓非子 · 外儲說左下》 — https://zh.wikisource.org/wiki/韓非子/外儲說左下
===孫叔敖===</p></article></main></div></div>
