    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 同人于宗</nav></header><main><article><h1>同人于宗</h1><p>私同其宗，偏蔽之道</p><p>「同人于宗」者，[[同人]]六二之爻辭也。</p><p>六二柔中得位，上應九五，本可以成大同之功。然陰柔偏處，所應止於一隅，則情有所私，志有所蔽，故「吝」。</p><p>象曰「同人于宗，吝道也」，言同人而私於宗族，不及其餘，非君子之所以同人者也。[[禮]]云「君子貴公」，[[大學]]云「[[公義勝私欲]]」，皆與此義相發。</p><p><strong>所出</strong>：《周易 · 同人》 — https://zh.wikisource.org/wiki/周易/同人</p></article></main></div></div>
