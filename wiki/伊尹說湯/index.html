    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 伊尹說湯</nav></header><main><article><h1>伊尹說湯</h1><p>伊尹負鼎俎以滋味說湯，致于王道。</p><p>伊尹欲幹湯而無由，乃為有莘氏媵臣，負鼎俎，以滋味說湯，致于王道。或曰，伊尹處士，湯使人聘迎之，五反，然後肯往從湯，言素王及九主之事。湯舉任以國政。伊尹去湯適夏，既醜有夏，復歸于亳。入自北門，遇女鳩、女房，作[[女鳩女房]]。</p><p><strong>所出</strong>：《史記 · 卷003》 — https://zh.wikisource.org/wiki/史記/卷003</p></article></main></div></div>
