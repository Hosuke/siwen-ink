    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 九還七返</nav></header><main><article><h1>九還七返</h1><p>還返之數，九七相循，火數之終，金數之始，陰陽消長之機。</p><p>《參同契》云：「九還七返，八歸六居。」還者，返歸之義；[[返]]者，往而復來。九為[[火行御|火]]之成數，七為火之生數；還者火之退，七返者火之初動。[[九山]][[九藪]]之數，非此義也。此言修煉火候之節序，九還而[[金可作世可度|金]]成，七返而水生，[[金木水火之交]]，坎離相濟，以成還返之功。九還七返，八歸六居，各有[[度數陰陽|度數]]，非臆說也。</p><p><strong>所出</strong>：《周易參同契 · 20章》 — https://zh.wikisource.org/wiki/周易參同契/20章</p></article></main></div></div>
