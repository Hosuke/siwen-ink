    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 民非后罔克胥匡以生</nav></header><main><article><h1>民非后罔克胥匡以生</h1><p>君民相依存，闕一則不能相正。</p><p>民非后，罔克胥匡以生；后非民，罔以辟四方。君與民相依而立，闕其一則不能相正。民賴后以生，后恃民而立。此太甲中之要義，後世所謂「水能載舟亦能覆舟」者，其原蓋出於此。</p><p><strong>所出</strong>：《尚書 · 太甲中》 — https://zh.wikisource.org/wiki/尚書/太甲中</p></article></main></div></div>
