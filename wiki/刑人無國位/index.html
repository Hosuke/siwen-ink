    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 刑人無國位</nav></header><main><article><h1>刑人無國位</h1><p>刑人有列則君子下其位，戮人無官任</p><p>夫刑者所以禁邪也，而賞者所以助禁也。刑人無國位，戮人無官任。刑人有列，則君子下其位；戮人衣錦食肉，則小人冀其利。刑戮者所以止姦也，而官爵者所以勸功也。</p><p>今國立爵而民羞之，設刑而民樂之，此蓋法術之患也。君子操權一政以立術，立官貴爵以稱之，論勞舉功以任之，則上下之稱平，臣得盡其力，主得專其柄。</p><p><strong>所出</strong>：《商君書 · 卷二》 — https://zh.wikisource.org/wiki/商君書/卷二</p></article></main></div></div>
