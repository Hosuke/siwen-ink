    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 子南午北</nav></header><main><article><h1>子南午北</h1><p>言子位在南午位在北，互為綱紀以成陰陽對待之理。</p><p>子南午北，互為綱紀。</p><p>子水在南，午火在北，南北遙對，如網之有綱衣之有紀，相待而立。言陰陽二氣迭為消長，互為經緯，不可偏廢也。</p><p><strong>所出</strong>：《周易參同契 · 29章》 — https://zh.wikisource.org/wiki/周易參同契/29章</p></article></main></div></div>
