    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 精合神</nav></header><main><article><h1>精合神</h1><p>精與神合，長生久視</p><p>精合神者，精與神合，長生久視之道也。</p><p>經云：「精合神」，又云「精神還歸老復壯」，精者生之本，神者形之主，兩者相合，則形神俱妙，長生可期。</p><p><strong>所出</strong>：《黃庭外景經》 — https://zh.wikisource.org/wiki/黃庭外景經</p></article></main></div></div>
