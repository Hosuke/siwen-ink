    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以峙其粻</nav></header><main><article><h1>以峙其粻</h1><p>儲峙粻粮，以速申伯之行。</p><p>「以峙其粻，式遄其行」，言預備乾粻之物以峙儲之，使申伯行期速而不滯也。粻者，米粟之類，行道所資。王命 [[召伯]] 徹申伯土疆，又峙其粻者，先事以備，仁厚之至也。</p><p><strong>所出</strong>：《詩經 · 崧高》 — https://zh.wikisource.org/wiki/詩經/崧高</p></article></main></div></div>
