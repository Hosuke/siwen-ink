    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 車有六等之數</nav></header><main><article><h1>車有六等之數</h1><p>車制六等，以軫、戈、人、殳、戟、矛遞崇四尺，至六等而止。</p><p>車有六等之數：車軫四尺，謂之一等；戈柲六尺有六寸，既建而迤，崇於軫四尺，謂之二等；人長八尺，崇於戈四尺，謂之三等。殳長尋有四尺，崇於人四尺，謂之四等。車戟常，崇於殳四尺，謂之五等。酋矛常有四尺，崇於戟四尺，謂之六等。車謂之六等之數。</p><p><strong>所出</strong>：《周禮 · 冬官考工記》 — https://zh.wikisource.org/wiki/周禮/冬官考工記</p></article></main></div></div>
