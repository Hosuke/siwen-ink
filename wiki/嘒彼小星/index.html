    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 嘒彼小星</nav></header><main><article><h1>嘒彼小星</h1><p>星光微小之貌，以興賤者之微賤。</p><p>嘒，星光微小之貌。[[嘒彼小星]]，言小星微微閃爍也。《毛詩傳》云：「嘒，微貌。」韓詩作「暳」，解作「眾星貌」，即星辰眾多之意。王先謙以為韓詩之說為優。</p><p>古人以星象喻人事。星之微者，喻人之賤者。小星三五，寥寥在天，猶賤妾之進御於君，其命有貴賤之殊焉。</p><p><strong>所出</strong>：《詩經 · 小星》 — https://zh.wikisource.org/wiki/詩經/小星</p></article></main></div></div>
