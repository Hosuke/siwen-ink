    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 民中絕命</nav></header><main><article><h1>民中絕命</h1><p>悖德不聽罪者，自趣於夭絕。</p><p>民之不循義德、不聽罪愆者，乃自趣於中途而絕滅其命，非天夭之也。此[[降年有永有不永]]之義，民[[有不若德不聽罪]]，則[[惟先格王，正厥事]]以救之；救之不及，而[[天既孚命正厥德]]之戒亦不見聽，則民命遂無所延。此祖己言災異所以警醒王臣之深意也。</p><p><strong>所出</strong>：《尚書 · 高宗肜日》 — https://zh.wikisource.org/wiki/尚書/高宗肜日</p></article></main></div></div>
