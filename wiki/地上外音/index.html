    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 地上外音</nav></header><main><article><h1>地上外音</h1><p>地上外音「連劫生厥出天」</p><p>地上外音，乃大洞經所傳咒語之外音也。言「連劫生，厥出天」，與天上內音「望昌竭，順萬烟」相對，內外相合乃成大洞之功。</p><p><strong>所出</strong>：《上清大洞真經 · 10章》 — https://zh.wikisource.org/wiki/上清大洞真經/10章</p><hr><p>地上外音者，地上之音也。音曰「禍車滅，養無景」，言地上之車馬皆滅、養無景識也。與天上「乘元輪，入幽宗」相對，內音主入，外音主出，同為消魔之音。</p><p><strong>所出</strong>：《上清大洞真經 · 31章》 — https://zh.wikisource.org/wiki/上清大洞真經/31章</p></article></main></div></div>
