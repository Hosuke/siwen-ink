    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無此疆爾界</nav></header><main><article><h1>無此疆爾界</h1><p>后稷推廣農政，無有疆界之限。</p><p>此疆爾界，謂各邦國之封疆也。后稷推廣農政，使天下皆知農事，不復限於疆界之內。無此疆爾界，言后稷農政之廣，無邦國之分別也。</p><p><strong>所出</strong>：《詩經 · 思文》 — https://zh.wikisource.org/wiki/詩經/思文</p></article></main></div></div>
