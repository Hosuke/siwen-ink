    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天既孚命正厥德</nav></header><main><article><h1>天既孚命正厥德</h1><p>天命已施，當修德以應。</p><p>[[天既孚命]]者，天已命之而責以德也。天之命人，非徒予之而已，乃責以修德以承其命也。既命之而不正厥德，則[[惟命不于常]]，天命將轉而去之。修德者，所以答天戒、迓天休也。祖己之訓，正以此義警王。</p><p><strong>所出</strong>：《尚書 · 高宗肜日》 — https://zh.wikisource.org/wiki/尚書/高宗肜日</p></article></main></div></div>
