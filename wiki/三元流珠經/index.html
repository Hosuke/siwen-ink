    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三元流珠經</nav></header><main><article><h1>三元流珠經</h1><p>上清四部真經之一，茅氏兄弟及二君皆受此書。</p><p>《三元流珠經》，上清四部經之一。</p><p>王母命侍女宋辟妃開綠金之笈授茅固、茅衷二君，又傳司命君。其經與《丹景道精經》、《隱地八術經》、《太極錄景經》合為四部，上清之秘文也。</p><p><strong>所出</strong>：《墉城集仙錄 · 卷02》 — https://zh.wikisource.org/wiki/墉城集仙錄/卷02</p></article></main></div></div>
