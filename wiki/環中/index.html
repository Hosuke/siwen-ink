    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 環中</nav></header><main><article><h1>環中</h1><p>居彼是之外，應無窮之變。</p><p>《齊物論》曰：「彼是莫得其偶，謂之道樞。樞始得其環中，以應無窮。」</p><p>環者，彼是是非，迭相循轉，如環無端也。環中者，不在環上，不隨是非之環而轉者也。得其環中，則彼是莫得其偶——偶者，相對而立之謂也；無偶則無對，無對則道樞立矣。是以立乎環中，而四方之變、萬物之情，皆可應之而無窮。養生者以此應世，則物不能傷；觀物者以此觀彼，則是非不能亂也。</p><p><strong>所出</strong>：《莊子 · 齊物論》 — https://zh.wikisource.org/wiki/莊子/齊物論</p></article></main></div></div>
