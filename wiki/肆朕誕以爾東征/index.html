    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 肆朕誕以爾東征</nav></header><main><article><h1>肆朕誕以爾東征</h1><p>朕大率爾諸侯東征伐叛。</p><p>朕大率爾諸侯東征也。</p><p>「肆朕誕以爾東征；天命不僭，卜陳惟若茲。」</p><p>朕大率爾諸侯東征伐殷，天命不僭，卜兆如此，東征正也。</p><p><strong>所出</strong>：《尚書 · 大誥》 — https://zh.wikisource.org/wiki/尚書/大誥</p></article></main></div></div>
