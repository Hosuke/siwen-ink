    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 推讓</nav></header><main><article><h1>推讓</h1><p></p><p>誅諸呂、立文帝，功皆出太尉周勃。勃自以為功大，欲讓尊位，乃謝病相位讓陳平。陳平曰：「時稱兵不如臣，至誅諸呂，臣功亦不如君。願以右丞相讓。」帝乃以勃為右丞相，位次第一；平為左丞相，位次第二。賜勃金千斤，增封三千戸。</p><p>  <strong>所出</strong>：《史記 · 卷056》 — https://zh.wikisource.org/wiki/史記/卷056</p></article></main></div></div>
