    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 俾予靖之</nav></header><main><article><h1>俾予靖之</h1><p>任使於前而放逐於後，言人主反覆無常也。</p><p>「俾予靖之，後予極焉」，靖，安也，定也；極，放也，逐也。言王先使我安定其國，既安定之，乃從而放逐之。先任後疑，先信後棄，反覆之道也。</p><p>後章「俾予靖之，後予邁焉」，邁，行也，放也。辭異而義同，反覆言之，以見其悲也。</p><p>此與[[過而不聽忠臣獨行其意]]之事相近而辭殊。彼言忠臣以為國而不見聽，此言信臣以靖事而反見放也。</p><p><strong>所出</strong>：《詩經 · 菀柳》 — https://zh.wikisource.org/wiki/詩經/菀柳</p></article></main></div></div>
