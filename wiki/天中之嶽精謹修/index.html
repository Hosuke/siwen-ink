    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天中之嶽精謹修</nav></header><main><article><h1>天中之嶽精謹修</h1><p>修身於天中則玉帝可遊</p><p>天中者，人身之中極也。其嶽曰「嵩」，精微謹敬而脩之，則[[靈宅既清玉帝遊|靈宅既清]]，玉帝得以游於其間。夫修煉之士，必審定於此，而後道通利涉，無有終休也。</p><p><strong>所出</strong>：《黃庭內景經 · 天中章第六》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/天中章第六</p></article></main></div></div>
