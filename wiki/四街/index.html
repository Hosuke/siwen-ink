    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 四街</nav></header><main><article><h1>四街</h1><p>四街者，氣之徑路，絡絕則徑通，四末解則氣從合，相輸如環。</p><p>四街者，氣之徑路也，故絡絕則徑通，四末解則氣從合，相輸如環。</p><p><strong>所出</strong>：《黃帝內經 · 靈樞第九卷》 — https://zh.wikisource.org/wiki/黃帝內經/靈樞第九卷</p></article></main></div></div>
