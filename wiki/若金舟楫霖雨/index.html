    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 若金舟楫霖雨</nav></header><main><article><h1>若金舟楫霖雨</h1><p>賢臣輔君，隨事為用，或礪、或楫、或霖。</p><p>王命厥臣曰：「若金，用汝作礪；若濟巨川，用汝作舟楫；若歲大旱，用汝作霖雨。」言賢臣之於君也，因時而施宜。當國有艱厄，若金之在礪，則磨厲以成器；若川之待渡，則操楫以濟險；若旱之望歲，則霖雨以潤物。夫無所不用其備者，乃所以盡臣道也。</p><p><strong>所出</strong>：《尚書 · 說命上》 — https://zh.wikisource.org/wiki/尚書/說命上</p></article></main></div></div>
