    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 范文子喜直言</nav></header><main><article><h1>范文子喜直言</h1><p>直言者不爲人容</p><p>范文子喜直言，武子撃之以杖：「夫直議者不爲人所容，無所容則危身。非徒危身，又將危父。」</p><p>范文子喜直言，其父武子撃杖戒之，謂直言不爲人容，危身且危父。此父子之間切直之誡也。</p><p><strong>所出</strong>：《韓非子 · 外儲說左下》 — https://zh.wikisource.org/wiki/韓非子/外儲說左下
===孫叔敖===</p></article></main></div></div>
