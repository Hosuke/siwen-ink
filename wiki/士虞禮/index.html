    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 士虞禮</nav></header><main><article><h1>士虞禮</h1><p>士喪既葬，迎尸於廟，以安死者之魂，達於生者之饗者也。</p><p>士虞禮者，士喪三月而葬，葬日中行事，迎所祭者之尸入廟以致饗之禮也。《儀禮》第十七篇，記士祭祀其祖禰之儀。《記》曰：「死三日而殯，三月而葬，遂卒哭。」又曰：「始虞用柔日，再虞、三虞，以至卒哭。」其事以「特豕饋食」為主，陳鼎俎於廟門外，迎尸升堂，主人拜妥，佐食墮祭，尸嘗醴而卒食。祝辭有「哀子某，哀顯相」之文，以「尚饗」終焉。自虞而祥，自祥而禫，循月以漸，終以吉祭配祖。</p><p><strong>所出</strong>：《儀禮 · 士虞禮》 — https://zh.wikisource.org/wiki/儀禮/士虞禮</p></article></main></div></div>
