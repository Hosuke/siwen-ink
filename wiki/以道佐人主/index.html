    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 以道佐人主</nav></header><main><article><h1>以道佐人主</h1><p>輔君當以道，勿以兵力強天下。</p><p>輔佐人主者，當以道為之本，不以兵力強行於天下。以道佐之，則兵事不興而天下自定。此言輔君者當以德化，非以威刑也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 三十章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p><hr><p>以道佐人主者，[[以政治國以奇用兵|以道佐人]]，人主能以道自輔佐也。不以兵革，順天任德，敵人自服。夫然則德施於四海，無敵於天下。</p><p><strong>所出</strong>：《老子河上公章句 · 儉武》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
