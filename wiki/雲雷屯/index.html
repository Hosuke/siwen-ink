    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 雲雷屯</nav></header><main><article><h1>雲雷屯</h1><p>象以坎上震下，言陰陽始交而艱屯未通。</p><p>屯之象辭曰：「雲雷，屯。」坎為水為雲，震為雷。雲上於天而未成雨，雷動於下而未解旱，是天地之氣始交而未暢之象。君子觀此象，乃以經綸天下之事，猶治絲而求其理也。</p><p><strong>所出</strong>：《周易 · 屯》 — https://zh.wikisource.org/wiki/周易/屯</p></article></main></div></div>
