    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 田常弑簡公</nav></header><main><article><h1>田常弑簡公</h1><p>田常竊德行惠以收民心，卒弒其君</p><p>田常之事，[[二柄]]之戒也。</p><p>田常為齊臣，上請爵禄而行之羣臣，下大斗斛而施於百姓。夫爵禄者，人主[[賞罰|慶賞]]之柄也；斗斛者，百姓受惠之具也。田常竊之以行私，則[[刑德|德]]歸於臣而怨歸於君。[[韓非子]]以為，此簡公失[[刑德|德]]之患也。及其事成，卒弒簡公。</p><p>韓非子又合論[[子罕]]之事而歎曰：「田常徒用德而簡公弒，子罕徒用刑而宋君劫。」是故兼失[[二柄]]者，未有不危亡者。</p><p><strong>所出</strong>：《韓非子 · 二柄》 — https://zh.wikisource.org/wiki/韓非子/二柄</p></article></main></div></div>
