    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 二孔之本</nav></header><main><article><h1>二孔之本</h1><p>小腹死炁之門，胞胎之根柢也。</p><p>二孔之本者，小腹之內，死炁之門，胞胎之根本所在也。《上清大洞真經》三十三章云「共守兆小腹之內，二孔之本戶死炁之門」，是兆人修煉胞中黃炁君所鎮守之要害也。</p><p>以其居二孔之間，故能令日月之根生於二戶，五帝之炁充於極陰之宮。修真者思黃雲從泥丸入，下布小腹之內二孔以為守護，則精華盈而玉液溢，死根斷而胞胎固，上昇之階由此而達矣。</p><p><strong>所出</strong>：《上清大洞真經 · 33章》 — https://zh.wikisource.org/wiki/上清大洞真經/33章</p></article></main></div></div>
