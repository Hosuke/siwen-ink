    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 野人與君子</nav></header><main><article><h1>野人與君子</h1><p>高國撫痬如野，晏子撫痬如日，以見君子之技遠過常人。</p><p>景公病疽在背，高子國子請撫痬。公問熱何如，曰「如火」，色「如未熟李」，大小「如豆」，墮「如屨辨」。晏子後入，宰人具盥、御者具巾，刷手溫之，發席傅薦，跪請撫痬。公問熱，曰「如日」；色「如蒼玉」；大小「如璧」；墮「如珪」。晏子出，公曰：「吾不見君子，不知野人之拙也。」</p><p>同一痬也，野人之所以對者卑陋，君子之所以對者尊大。晏子之言，非獨知痬，實知治也。</p><p><strong>所出</strong>：《晏子春秋 · 卷六》 — https://zh.wikisource.org/wiki/晏子春秋/卷六</p></article></main></div></div>
