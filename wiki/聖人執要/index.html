    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 聖人執要</nav></header><main><article><h1>聖人執要</h1><p>聖人執守樞要，四方自然來效</p><p>事在四方，要在中央。聖人執要，四方來效。虛而待之，彼自以之。蓋上位者不須親力親為，但執其樞機，則萬事自能運轉也。</p><p><strong>所出</strong>：《韓非子 · 揚榷》 — https://zh.wikisource.org/wiki/韓非子/揚榷</p></article></main></div></div>
