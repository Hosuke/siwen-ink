    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 太史公讀離騷天問</nav></header><main><article><h1>太史公讀離騷天問</h1><p>太史公讀離騷、天問、招魂、哀郢，悲屈原之志；又怪其材無所遇；讀賈誼服賦，則爽然自失。</p><p>太史公曰：余讀離騷、天問、招魂、哀郢，悲其志。適長沙，觀屈原所自沈淵，未嘗不垂涕，想見其為人。及見賈生弔之，又怪屈原以彼其材，游諸侯，何國不容，而自令若是。讀服烏賦，同死生，輕去就，又爽然自失矣。</p><p>【索隱述贊】屈平行正，以事懷王。瑾瑜比潔，日月爭光。忠而見放，讒者益章。賦騷見志，懷沙自傷。百年之後，空悲弔湘。</p><p><strong>所出</strong>：《史記 · 卷084》 — https://zh.wikisource.org/wiki/史記/卷084</p></article></main></div></div>
