    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 遊雲</nav></header><main><article><h1>遊雲</h1><p>遊雲無質明鏡無瑕，故五色舍焉萬物象焉，君子常正心常儼容則可以遊泳寥廓。</p><p>遊雲無質，故五色舍焉；明鏡無瑕，故萬物象焉。謂水之含天也，必天之含水也。夫百步之外，鏡則見人，人不見影，斯為驗也。是知太虛之中無所不有，萬耀之內無所不見。則世人且知心仰寥廓，而不知跡處虛空。寥廓無所間，神明且不遠。是以君子常正其心，常儼其容。則可以遊泳於寥廓，交友於神明而無咎也。</p><p><strong>所出</strong>：《化書 · 卷一》 — https://zh.wikisource.org/wiki/化書/卷一</p></article></main></div></div>
