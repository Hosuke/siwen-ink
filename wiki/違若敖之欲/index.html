    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 違若敖之欲</nav></header><main><article><h1>違若敖之欲</h1><p></p><p>[[左史倚相儆司馬子期唯道是從]]以此事與[[屈建祭父不薦芰]]並舉，皆[[君子曰違而道]]之例。子木能違若敖之欲以之道而去芰薦，故屈建之去芰為得也。詳見[[左史倚相儆司馬子期唯道是從]]。</p><p>  <strong>所出</strong>：《國語 · 卷17》 — https://zh.wikisource.org/wiki/國語/卷17</p></article></main></div></div>
