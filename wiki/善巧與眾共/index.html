    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 善巧與眾共</nav></header><main><article><h1>善巧與眾共</h1><p>善與巧貴在與眾共行，非獨善獨巧</p><p>為善使人不能得從，此獨善也；為巧使人不能得從，此獨巧也。未盡善巧之理，為善與眾行之，為巧與眾能之，此善之善者、巧之巧者也。所貴聖人之治，不貴其獨治，貴其能與眾共治；貴工倕之巧，不貴其獨巧，貴其能與眾共巧也。</p><p><strong>所出</strong>：《尹文子 · 大道上》 — https://zh.wikisource.org/wiki/尹文子/大道上</p></article></main></div></div>
