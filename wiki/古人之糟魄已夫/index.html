    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 古人之糟魄已夫</nav></header><main><article><h1>古人之糟魄已夫</h1><p>聖人已死，其言猶糟魄；斲輪之妙不可傳，則聖人之道亦不可書傳也已。</p><p>聖人在乎？已死矣。然則君之所讀者，古人之糟魄已夫！古之人與其不可傳也死矣。斲輪之妙，得之於手而應於心，口不能言。臣不能以喻臣之子，臣之子亦不能受之於臣，是以行年七十而老斲輪。聖人之道，亦若是也已。</p><p><strong>所出</strong>：《莊子 · 天道》 — https://zh.wikisource.org/wiki/莊子/天道</p></article></main></div></div>
