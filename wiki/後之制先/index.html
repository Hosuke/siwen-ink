    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 後之制先</nav></header><main><article><h1>後之制先</h1><p>聖人執後，以靜制躁，以數勝敵，後發而先至。</p><p>三人同舍，二人相爭，爭者各自以為直，不能相聽，一人雖愚，必從旁而決之，非以智，不爭也。兩人相鬬，一羸在側，助一人則勝，救一人則免，鬬者雖強，必制一羸，非以勇也，以不鬬也。由此觀之，後之制先，靜之勝躁，數也。</p><p><strong>所出</strong>：《淮南子 · 詮言訓》 — https://zh.wikisource.org/wiki/淮南子/詮言訓</p></article></main></div></div>
