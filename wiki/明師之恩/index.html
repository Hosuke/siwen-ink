    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 明師之恩</nav></header><main><article><h1>明師之恩</h1><p>明師之恩過於天地重於父母，不可不崇求</p><p>陳安世者年十三歲，蓋灌叔本之客子耳，先得仙道。叔本年七十皓首，朝夕拜安世曰：「道尊德貴，先得道者則為師矣，吾不敢倦執弟子之禮也。」由是安世告之要方，遂複仙去矣。夫人生先受精神於天地，後稟氣血於父母，然不得明師告之以度世之道，則無由免死，鑿石有餘焰，年命已凋頹矣。由此論之，明師之恩，誠為過於天地，重於父母多矣，可不崇之乎？可不求之乎？</p><p><strong>所出</strong>：《抱朴子 · 卷14》 — https://zh.wikisource.org/wiki/抱朴子/卷14</p></article></main></div></div>
