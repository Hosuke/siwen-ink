    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 文質附乎性情</nav></header><main><article><h1>文質附乎性情</h1><p>文之繁簡、華實，皆附麗於作者之性情。性情正則文質正，性情淫侈則文過其實。</p><p>研味乎老氏，則知文質附乎性情；詳覽乎莊韓，則見華實過乎淫侈。老子疾偽而稱美言不信，然五千精妙非棄美也；莊周謂藻飾以辯雕萬物，韓非謂豔采以辯說綺麗。文辭之變，於斯極矣。然究其本，皆不離作者之性情。情性醇正，則文質相副；情性浮薄，則繁采寡情。茍能擇源於涇渭之流，按轡於邪正之路，亦可以馭文采矣。</p><p><strong>所出</strong>：《文心雕龍 · 情采》 — https://zh.wikisource.org/wiki/文心雕龍/情采</p></article></main></div></div>
