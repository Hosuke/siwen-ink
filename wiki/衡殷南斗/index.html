    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 衡殷南斗</nav></header><main><article><h1>衡殷南斗</h1><p>斗衡正當南斗，衡殷中州河濟之間，象丞相之位。</p><p>衡殷南斗。晉灼曰：「衡，斗之中央。殷，中也。」宋均云「殷，當也」。</p><p>南斗六星為天廟，丞相、大宰之位，主荐賢良、授爵祿，又主兵，一曰天機。南二星，魁、天粱；中央一星，天相；北二星，天府庭也。</p><p>衡殷中州河濟之間。衡，北斗衡也。言北斗夜半建用斗衡指寅。衡當河濟，黃道正中之地。</p><p><strong>所出</strong>：《史記 · 卷027》 — https://zh.wikisource.org/wiki/史記/卷027</p></article></main></div></div>
