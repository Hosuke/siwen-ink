    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 信者信之不信者亦信之</nav></header><main><article><h1>信者信之不信者亦信之</h1><p>聖人於可信可信者固信之，於不可信者亦一以待之，此德之信也。</p><p>信者信之，不信者亦信之，德信也。聖人之信，不以人之可信與否為輕重。凡有一言一行，聖人皆以誠實相待，無間於信與不信。此與[[善者善之不善者亦善]]相表裏，見聖人對萬民一以待之，無有分別也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章四十九》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
