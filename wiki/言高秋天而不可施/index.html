    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 言高秋天而不可施</nav></header><main><article><h1>言高秋天而不可施</h1><p>喻高遠之言不切時用</p><p>抱朴子末言：[[墨子之鵲]]雕木為雞，不如三寸車金之害；[[管青]]鑄騏驥於金象，不如駑馬之周用。夫「言高秋天而不可施」者，[[丘]]不與易也。言至美而行至拙，猶南轅而北轍，終不能致。</p><p><strong>所出</strong>：《抱朴子 · 卷42》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷42</p></article></main></div></div>
