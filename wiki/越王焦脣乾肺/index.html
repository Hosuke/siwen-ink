    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 越王焦脣乾肺</nav></header><main><article><h1>越王焦脣乾肺</h1><p>句踐恥會稽之恥，苦身勞力，焦脣乾肺，以得民心。</p><p>越王苦會稽之恥，欲深得民心，以致必死於吳。身不安枕席，口不甘厚味，目不視靡曼，耳不聽鍾鼓。三年苦身勞力，焦脣乾肺。內親群臣，下養百姓，以來其心。</p><p><strong>所出</strong>：《呂氏春秋 · 卷九》— https://zh.wikisource.org/wiki/呂氏春秋/卷九</p></article></main></div></div>
