    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 什伯之器</nav></header><main><article><h1>什伯之器</h1><p>十百人之器，謂械用繁多，聖人擯而不用。</p><p>什伯之器，謂十人百人共用之械也。器械之利，既精巧則民趨之，趨之則爭，爭則亂起。聖人知其然，故使此等器物悉皆罷置，民乃返於樸素，不以器械相尚。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第三十章 安居》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
