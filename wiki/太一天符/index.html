    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 太一天符</nav></header><main><article><h1>太一天符</h1><p>歲運與司天之氣及年支三者同氣相合，天地人之氣至盛之歲也。</p><p>歧伯述太一天符之義。陽明之政，乙卯天符、乙酉歲會、太一天符。少陰之政，戊子天符、戊午太一天符。太陰之政，己丑太一天符、己未太一天符。厥陰之政，丁巳天符、丁亥天符。</p><p>太一天符者，歲運之氣與司天之氣、年支之五行，三者同氣相合，天地人之氣至盛至旺之歲也。經云「太一天符，其運涼熱寒」，歲運與天氣地氣同化，其氣最盛，其變最速，民病之形有微甚，生死有早晏，治者當察之。</p><p><strong>所出</strong>：《黃帝內經 · 素問第二十一卷》 — https://zh.wikisource.org/wiki/黃帝內經/素問第二十一卷</p></article></main></div></div>
