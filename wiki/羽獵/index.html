    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 羽獵</nav></header><main><article><h1>羽獵</h1><p>揚雄張衡皆有羽獵之賦，夸飾之事義暌剌</p><p>[[揚雄]]有《羽獵賦》，[[張衡]]亦有《羽獵賦》。揚雄之賦，鞭[[宓妃]]以饟[[屈原]]；張衡之賦，困[[玄冥]]於朔野。皆虛用濫形，與事義乖刺，不可為法也。</p><p><strong>所出</strong>：《文心雕龍 · 夸飾》 — https://zh.wikisource.org/wiki/文心雕龍/夸飾</p></article></main></div></div>
