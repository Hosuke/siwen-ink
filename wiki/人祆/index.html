    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 人祆</nav></header><main><article><h1>人祆</h1><p>物之已至，人祆為可畏</p><p>物之已至者，人祆則可畏也。楛耕傷稼，楛耨失歲，政險失民；田薉稼惡，糴貴民飢，道路有死人：夫是之謂人祆。政令不明，舉錯不時，本事不理，勉力不時，則牛馬相生，六畜作祆：夫是之謂人祆。禮義不脩，內外無別，男女淫亂，父子相疑，上下乖離，寇難並至：夫是之謂人祆。傳曰：「萬物之怪書不說。」無用之辯，不急之察，棄而不治。若夫君臣之義，父子之親，夫婦之別，則日切瑳而不舍也。</p><p><strong>所出</strong>：《荀子 · 天論篇》 — https://zh.wikisource.org/wiki/荀子/天論篇</p></article></main></div></div>
