    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 重刑少賞</nav></header><main><article><h1>重刑少賞</h1><p>重刑少賞，乃上愛民之實；多賞輕刑，乃上不愛民之實。</p><p>重刑少賞，上愛民，民死賞；多賞輕刑，上不愛民，民不死賞。上之所重，民之所勸也；上之所輕，民之所忽也。重刑者使人畏法而不敢犯，是愛之深也；少賞者使功有所尊而名有所歸。輕刑則姦不懼，多賞則賞濫而民不珍之。</p><p><strong>所出</strong>：《韓非子 · 飭令》 — https://zh.wikisource.org/wiki/韓非子/飭令</p></article></main></div></div>
