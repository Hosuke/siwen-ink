    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 利用獄</nav></header><main><article><h1>利用獄</h1><p>噬嗑以刑罰為用，治世利在斷獄</p><p>噬嗑卦辭曰「利用獄」，明治世之利在於用刑。剛柔分而動明，雷電合而章，柔得中而上行雖不當位，利用獄也。</p><p>夫姦邪梗阻，非溫柔所能去，必以刑罰噬之乃通。然用獄不可不慎，柔得中而上行，正也；位不當，則刑罰或失其當。故聖人明罰敕法，使賞當賢、罰當罪，則刑罰行而治道成。噬嗑之世，姦惡既噬，刑罰既明，故利用獄以為治也。</p><p><strong>所出</strong>：《周易 · 噬嗑》 — https://zh.wikisource.org/wiki/周易/噬嗑</p></article></main></div></div>
