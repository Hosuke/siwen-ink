    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 筴乘馬</nav></header><main><article><h1>筴乘馬</h1><p>以穀與幣相準，國器皆資而不籍於民</p><p>筴乘馬者，國家理財之大法也。百畝之夫，資以二十七日之幣，使行春事。春種之時發幣，秋成之後以穀準幣還之。穀賤則斂之，穀貴則散之，國之櫎一切什九，而器械備足，器用皆資，無須加諸民力也。</p><p><strong>所出</strong>：《管子 · 第68篇巨乘馬》 — https://zh.wikisource.org/wiki/管子/第68篇巨乘馬</p></article></main></div></div>
