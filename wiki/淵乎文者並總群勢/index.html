    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 淵乎文者，並總群勢</nav></header><main><article><h1>淵乎文者，並總群勢</h1><p>深淵之文家，能兼通奇正剛柔，隨時適用。</p><p>然淵乎文者，並總群勢；奇正雖反，必兼解以俱通；剛柔雖殊，必隨時而適用。</p><p>若愛典而惡華，則兼通之理偏，似夏人爭弓矢，執一不可以獨射也；若雅鄭而共篇，則總一之勢離，是楚人鬻矛譽楯，兩難得而俱售也。</p><p>淵深之文家，不滯於一偏。奇與正相反，必兼通而無滯；剛與柔雖殊，必因時而適用。偏於典則失華，偏於雅則乖鄭，皆非通人之見。譬如執弓者不可兼執矢，鬻矛者不可兼譽楯，各執一端則失其全矣。</p><p><strong>所出</strong>：《文心雕龍 · 定勢》 — https://zh.wikisource.org/wiki/文心雕龍/定勢</p></article></main></div></div>
