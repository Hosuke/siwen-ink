    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 見素抱樸</nav></header><main><article><h1>見素抱樸</h1><p>見其素色，抱其樸質，返於本性。</p><p>又[[見素抱樸]]者，乃聖人所以令民有所屬之道也。</p><p>  見素則不雜，抱樸則不離。見素者，外現其素，不加文飾；抱樸者，內守其樸，不為奇巧。外不飾則民化之，內不離則性全之。此[[此文未足]]而必[[令之有所屬]]者，指歸在此也。</p><p>  <strong>所出</strong>：《老子 (帛書校勘版) · 第六十三章 樸素》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
