    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 庠序學校</nav></header><main><article><h1>庠序學校</h1><p>夏商周三代設學以教民，明人倫為本</p><p>孟子設為庠序學校以教之。庠者養也，校者教也，序者射也，夏曰校，殷曰序，周曰庠，學則三代共之。皆所以明人倫也——父子有親，君臣有義，夫婦有別，長幼有序，朋友有信。人倫明於上，小民親於下，王者起必來取法。</p><p><strong>所出</strong>：《孟子 · 滕文公上》 — https://zh.wikisource.org/wiki/孟子/滕文公上</p></article></main></div></div>
