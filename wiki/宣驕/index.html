    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 宣驕</nav></header><main><article><h1>宣驕</h1><p>以勤苦而見誣為驕慢也。</p><p>《鴻鴈》末章云：「維此哲人，謂我劬勞。維彼愚人，謂我宣驕。」蓋賢哲能知人之苦心，愚闇者則不察其勤而妄加驕慢之名。宣者，示也；宣驕者，自居功伐之意也。賢者為民服役，辛勤於野，而愚者不達，反以為矜張。此詩人所以自傷也。</p><p><strong>所出</strong>：《詩經 · 鴻鴈》 — https://zh.wikisource.org/wiki/詩經/鴻鴈</p></article></main></div></div>
