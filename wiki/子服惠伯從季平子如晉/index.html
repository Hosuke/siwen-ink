    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 子服惠伯從季平子如晉</nav></header><main><article><h1>子服惠伯從季平子如晉</h1><p>晉執季平子，子服惠伯為魯請命，以晉為盟主當主信，不可以蠻夷棄兄弟。</p><p>平丘之會，晉昭公使叔向辭昭公，弗與盟。子服惠伯曰：「晉信蠻、夷而棄兄弟，其執政貳也。貳心必失諸侯，豈唯魯然？」季平子欲使上卿從之。子服惠伯請從。晉人執平子。子服惠伯見韓宣子曰：「夫盟，信之要也。晉為盟主，是主信也。若盟而棄魯侯，信抑闕矣。」乃歷述襄公以來魯從晉之功，而終以為「棄魯而苟固諸侯」則「無乃得蠻夷而失諸侯之信乎」。宣子說，乃歸平子。</p><p><strong>所出</strong>：《國語 · 卷05》 — https://zh.wikisource.org/wiki/國語/卷05</p></article></main></div></div>
