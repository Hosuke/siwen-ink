    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 內睦而後圖外</nav></header><main><article><h1>內睦而後圖外</h1><p>為人臣者，先輯內睦，而後可以圖外；未有不睦內而能圖外者也。</p><p>范文子言於晉人，欲爭鄭而不果。子曰：「吾聞之，為人臣者，能內睦而後圖外，不睦內而圖外，必有內爭，盍姑謀睦乎！考訊其阜以出，則怨靖。」</p><p>蓋圖外必資於眾，眾不和則事不成；怨不靖則心各異。故先清本源，俾內無乖爭，而後可以有事於外。此治內而安外之道也。</p><p><strong>所出</strong>：《國語 · 卷12》 — https://zh.wikisource.org/wiki/國語/卷12</p></article></main></div></div>
