    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 輸之以財</nav></header><main><article><h1>輸之以財</h1><p>德六興之一：發利、輸積、修途、便市、慎將宿，以通財物流轉。</p><p>六興之一曰輸之以財。[[德有六興]]所屬也。發伏利，輸墆積，修道途，便關市，慎將宿。開掘地利以輸其財，修治道塗以通商旅，慎守關市以待遠客，此皆輸之以財之實也。</p><p><strong>所出</strong>：《管子 · 第10篇五輔》 — https://zh.wikisource.org/wiki/管子/第10篇五輔</p></article></main></div></div>
