    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 晦至朔旦</nav></header><main><article><h1>晦至朔旦</h1><p>晦朔之際，陽氣始萌，震動而出。</p><p>晦者，月盡之時也；朔旦者，月始之旦也。晦至朔旦，陽光潛萌，震動於下而出於上。天地之精，於此時交媾；日月之精，於此時擔持。</p><p><strong>所出</strong>：《周易參同契 · 03章》 — https://zh.wikisource.org/wiki/周易參同契/03章</p></article></main></div></div>
