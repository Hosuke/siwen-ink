    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 坎坎伐檀</nav></header><main><article><h1>坎坎伐檀</h1><p>伐木之聲，以辛勤勞作起興，與尸位者成對比。</p><p>坎坎伐檀，[[伐檀]]首句也。坎坎者，伐木持斧之聲，狀勤苦之狀。檀木堅實，非易伐之材，必坎坎累積，方能伐得。以此起興，喻在下之人終歲勤動，不得休息，與在上者之不素餐者何如也。</p><p>三章迭用「坎坎」之聲：伐檀、伐輻、伐輪，由木而車，由遠及近，皆以坎坎之聲貫之，見民功之不息也。</p><p><strong>所出</strong>：《詩經 · 伐檀》 — https://zh.wikisource.org/wiki/詩經/伐檀</p></article></main></div></div>
