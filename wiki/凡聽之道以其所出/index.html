    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 凡聽之道以其所出</nav></header><main><article><h1>凡聽之道以其所出</h1><p>聽言之道，以所言者為準，反求於所成之事。</p><p>凡聽之道，以其所出，反以為之入。聽言之道，當以其所出之言，反驗其所成之事。溶若甚醉，言聽之際，宜若酣醉而不急於可否。彼自離之，吾因以知之；是非輻湊，上不與構。虛靜無為，道之情也；參伍比物，事之形也。是以聽言者，不先入於心，不急於折辯，待其自離，吾乃因其實事以驗之，則是非黑白莫能遁矣。</p><p><strong>所出</strong>：《韓非子 · 揚權》 — https://zh.wikisource.org/wiki/韓非子/揚權</p></article></main></div></div>
