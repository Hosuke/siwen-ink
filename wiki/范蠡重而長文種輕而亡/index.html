    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 范蠡重而長文種輕而亡</nav></header><main><article><h1>范蠡重而長文種輕而亡</h1><p>同佐句踐，而一知退一不知退，運命遂異。</p><p>范蠡重而長，文種輕而亡，豈不為泄天機？天機泄者，沉三劫宜然。</p><p>范蠡與文種同事句踐，滅吳復仇之後，蠡知天機已泄，遂泛舟五湖全身遠害；種不知退，卒為句踐所殺。皆以泄天機之故。功成不退，天道忌盈，是為泄機之戒。三劫者，沉淪三世之劫也。</p><p><strong>所出</strong>：《黃帝陰符經集註》 — https://zh.wikisource.org/wiki/黃帝陰符經集註</p></article></main></div></div>
