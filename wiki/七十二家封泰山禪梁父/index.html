    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 七十二家封泰山禪梁父</nav></header><main><article><h1>七十二家封泰山禪梁父</h1><p>述古者七十二家帝王封泰山禪梁父之事</p><p>古者封泰山、禪梁父者七十二家。管仲所記者十有二焉：無懷氏封泰山禪云云，虙羲封泰山禪云云，神農封泰山禪云云，炎帝封泰山禪云云，黃帝封泰山禪亭亭，顓頊封泰山禪云云，帝俈封泰山禪云云，堯封泰山禪云云，舜封泰山禪云云，禹封泰山禪會稽，湯封泰山禪云云，周成王封泰山禪社首。皆受命然後得封禪。</p><p><strong>所出</strong>：《管子 · 第50篇封禪》 — https://zh.wikisource.org/wiki/管子/第50篇封禪</p></article></main></div></div>
