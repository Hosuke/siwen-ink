    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 義有七體</nav></header><main><article><h1>義有七體</h1><p>義有七目：孝悌慈惠、恭敬忠信、中正比宜、整齊撙詘、纖嗇省用、敦懞純固、和協輯睦。</p><p>曰：民知德矣，而未知義，然後明行以導之義。義有七體。</p><p>七體者何？曰：孝悌慈惠以養親戚，恭敬忠信以事君上，中正比宜以行禮節，整齊撙詘以辟刑僇，纖嗇省用以備飢饉，敦懞純固以備禍亂，和協輯睦以備寇戎。凡此七者，義之體也。</p><p><strong>所出</strong>：《管子 · 第10篇五輔》 — https://zh.wikisource.org/wiki/管子/第10篇五輔</p></article></main></div></div>
