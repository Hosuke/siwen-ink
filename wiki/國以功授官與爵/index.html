    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 國以功授官與爵</nav></header><main><article><h1>國以功授官與爵</h1><p>國以功授官與爵，則智謀以成，威勇以戰，其國無敵。</p><p>國以功授官與爵，此謂以成智謀，以威勇戰，其國無敵。功者，智勇之驗也。朝廷以功用人，則賢智之人竭其謀以効國，有功之將傾其勇以衛上。臣下各懷功名之心，則外無敵國之兵，内無姦宄之民矣。</p><p><strong>所出</strong>：《韓非子 · 飭令》 — https://zh.wikisource.org/wiki/韓非子/飭令</p></article></main></div></div>
