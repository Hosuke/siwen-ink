    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 歸寧</nav></header><main><article><h1>歸寧</h1><p>已嫁女子歸省父母，以安親心。</p><p>歸寧父母。歸，返回也；寧，告慰也。言后妃既能躬儉節用、服澣濯之衣、尊敬師傅，則可以歸寧父母，以安其心。此 [[歸安父母]] 之事，而辭異義同。</p><p><strong>所出</strong>：《詩經 · 葛覃》 — https://zh.wikisource.org/wiki/詩經/葛覃</p></article></main></div></div>
