    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 興甲兵危士臣</nav></header><main><article><h1>興甲兵危士臣</h1><p>以甲兵求大欲，非王者之心</p><p>孟子問齊宣王：抑王興甲兵，危士臣，構怨於諸侯，然後快於心與？王曰否。然則王之所大欲可知已。孟子以為，以若所為求若所欲，猶[[緣木求魚]]，終必有災。不如反本行仁，不戰而天下定。</p><p><strong>所出</strong>：《孟子 · 梁惠王上》 — https://zh.wikisource.org/wiki/孟子/梁惠王上</p></article></main></div></div>
