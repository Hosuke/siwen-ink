    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 銛襲為上</nav></header><main><article><h1>銛襲為上</h1><p>兵道尚速尚密，勿以殺人為美。</p><p>老子言不得已而用兵，當以銛襲為上。銛者，鋤也，取其利；襲者，乘其不備也。言兵貴速戰，貴掩襲，勿為曠日持久、暴師於外之事也。其下又言「勿美也」，用兵之時不可以殺人為美事。若美之，是樂殺人也。夫以殺人為樂者，不可以得志。是以聖人不得已而用之，亦不以殺人為美觀。此老子柔弱謙下、不以兵強天下之旨也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章三十一》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
