    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 散其黨收其餘</nav></header><main><article><h1>散其黨收其餘</h1><p>去虎賊之法在散黨閉門</p><p>散其黨，收其餘，閉其門，奪其輔，國乃無虎。大不可量，深不可測，同合刑名，審驗法式，擅爲者誅，國乃無賊。</p><p><strong>所出</strong>：《韓非子 · 主道》 — https://zh.wikisource.org/wiki/韓非子/主道</p></article></main></div></div>
