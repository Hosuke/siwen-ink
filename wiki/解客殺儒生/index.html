    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 解客殺儒生</nav></header><main><article><h1>解客殺儒生</h1><p>儒生言郭解以姦犯公法，解客竟殺之，而解實不知，殺者亦竟絕。</p><p>軹有儒生侍使者坐，客譽郭解，生曰：「郭解專以姦犯公法，何謂賢！」解客聞，殺此生，斷其舌。吏以此責解，解實不知殺者。殺者亦竟絕，莫知為誰。</p><p><strong>所出</strong>：《史記 · 卷124》 — https://zh.wikisource.org/wiki/史記/卷124</p></article></main></div></div>
