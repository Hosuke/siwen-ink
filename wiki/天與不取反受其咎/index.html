    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天與不取，反受其咎</nav></header><main><article><h1>天與不取，反受其咎</h1><p>當取而不取，必受其殃，天之道也。</p><p>項羽虜王離，鉅鹿解。張耳與陳餘相見，責讓不肯救趙。陳餘怒，解印綬推予張耳。張耳愕不受。陳餘起如廁。客有說張耳曰：「臣聞『天與不取，反受其咎』。今陳將軍與君印，君不受，反天不祥。急取之！」張耳乃佩其印，收其麾下。陳餘還，亦望張耳不讓，遂趨出。兩人遂有隙。</p><p><strong>所出</strong>：《史記 · 卷089》 — https://zh.wikisource.org/wiki/史記/卷089</p></article></main></div></div>
