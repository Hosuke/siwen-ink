    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 桑之黃隕</nav></header><main><article><h1>桑之黃隕</h1><p>以桑葉之隕，喻女子色衰而見棄。</p><p>桑之黃隕，語出《詩經·衞風·氓》第四章。言：「桑之落矣，其黃而隕。」言桑葉黃落，喻女子容顏衰老，不復昔日沃若之盛。</p><p>前章以桑葉沃若喻女子盛年之美，此章以桑黃而隕喻年華老大、色澤凋零。華落色衰，男子之心遂變。自我嫁至爾家，三歲食貧，久歷勤苦，不獲溫飽。淇水湯湯，漸車帷裳，當日涉水而歸，今日被棄而去，其苦有不堪言者。女子以草木盛衰況人情厚薄，可悲也已。</p><p><strong>所出</strong>：《詩經 · 氓》 — https://zh.wikisource.org/wiki/詩經/氓</p></article></main></div></div>
