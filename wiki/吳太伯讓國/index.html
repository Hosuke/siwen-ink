    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 吳太伯讓國</nav></header><main><article><h1>吳太伯讓國</h1><p>太伯、仲雍知季歴賢且有聖子昌，乃奔荊蠻以讓之</p><p>吳太伯者，周太王之子也。與其弟仲雍，皆周太王之子，而王季歴之兄也。季歴賢，而有聖子昌，太王欲立季歴以及昌。於是太伯、仲雍二人乃犇荊蠻，文身斷髮，示不可用，以避季歴。季歴果立，是為王季，而昌為文王。太伯之奔荊蠻，自號句吳。荊蠻義之，從而歸之千餘家，立為吳太伯。太伯卒，無子，弟仲雍立，是為吳仲雍。</p><p>太史公曰：孔子言「太伯可謂至德矣，三以天下讓，民無得而稱焉」。</p><p><strong>所出</strong>：《史記 · 卷031》 — https://zh.wikisource.org/wiki/史記/卷031</p></article></main></div></div>
