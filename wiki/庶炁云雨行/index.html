    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 庶炁云雨行</nav></header><main><article><h1>庶炁云雨行</h1><p>修之不輟，則正炁充盈，如雲雨之流行</p><p>《參同契》述修真效驗，云「修之不輟體，庶炁云雨行。淫淫若春澤，液液象解冰，從頭流達足，究竟復上升，往來洞無極」，言修之不已，則正陽之炁充溢周身，如雲之行、如雨之施，自上而下、自下而上，往來循環，無有窮極，此內丹周天之象也。</p><p><strong>所出</strong>：《周易參同契 · 22章》 — https://zh.wikisource.org/wiki/周易參同契/22章</p></article></main></div></div>
