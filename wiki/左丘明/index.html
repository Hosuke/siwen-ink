    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 左丘明</nav></header><main><article><h1>左丘明</h1><p>孔子同時之史家，據聖言而作《國語》。</p><p>昔孔子發憤於舊史，垂法於素王。左丘明因聖言以攄意，託王義以流藻，其淵原深大，沈懿雅麗，可謂命世之才，博物善作者也。其明識高遠，雅思未盡，故復采錄前世穆王以來，下訖魯悼智伯之誅，邦國成敗，嘉言善語，以為《國語》。</p><p><strong>所出</strong>：《國語 · 國語解敘》 — https://zh.wikisource.org/wiki/國語/國語解敘</p></article></main></div></div>
