    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三五不交</nav></header><main><article><h1>三五不交</h1><p>陰陽不合，神氣難凝</p><p>配合未連，三五不交。三五者，天地之數，陰陽相參之理也。言陰陽不交，則[[剛柔離分]]，無以成丹。此[[姹女黃芽]]之要義：汞無铅制，铅無汞合，皆不成丹也。</p><p><strong>所出</strong>：《周易參同契 · 26章》 — https://zh.wikisource.org/wiki/周易參同契/26章</p></article></main></div></div>
