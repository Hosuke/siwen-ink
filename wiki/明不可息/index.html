    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 明不可息</nav></header><main><article><h1>明不可息</h1><p>箕子之貞，以明為本，明不可以息。</p><p>「箕子之貞，明不可息也。」六五以柔居中，明夷之世，箕子為之。夫明不可以息者，晦之而明在，不可滅也。雖身處其難，明終不亡，故曰貞吉。象辭明此義，以見明夷之時，君子所守者，明之貞也。</p><p><strong>所出</strong>：《周易 · 明夷》 — https://zh.wikisource.org/wiki/周易/明夷</p></article></main></div></div>
