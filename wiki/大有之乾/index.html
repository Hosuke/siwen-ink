    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大有之乾同復于父</nav></header><main><article><h1>大有之乾同復于父</h1><p>卜楚丘占成季之生，得《大有》之《乾》，言其必為魯輔。</p><p>桓公使卜楚丘之父卜成季之將生也。曰：「男也。其名曰友，在公之右。間于兩社，為公室輔。季氏亡，則魯不昌。」又筮之，遇《大有》之《乾》，曰：「同復于父，敬如君所。」及生，有文在其手曰「友」，遂以命之。</p><p>「同復于父」者，言人臣事君，與子事父同，皆當敬慎也。卜者以為此子必能輔弼公室，季氏若亡，魯國不能昌盛。厥後季友子孫世執國政，而魯竟以不振，卜言驗矣。</p><p><strong>所出</strong>：《春秋左氏傳 · 閔公》 — https://zh.wikisource.org/wiki/春秋左氏傳/閔公</p></article></main></div></div>
