    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 始乎故，長乎性，成乎命</nav></header><main><article><h1>始乎故，長乎性，成乎命</h1><p>蹈水之道，生於陵而安於陵故，長於水而安於水性，不知所以然而然命。</p><p>孔子觀於呂梁，見丈夫游水，問焉，曰：「蹈水有道乎？」曰：「亡，吾无道。吾始乎故，長乎性，成乎命。與齊俱入，與汩偕出，從水之道而不為私焉。」孔子曰：「何謂始乎故，長乎性，成乎命？」曰：「吾生於陵而安於陵，故也；長於水而安於水，性也；不知吾所以然而然，命也。」</p><p><strong>所出</strong>：《莊子 · 達生》 — https://zh.wikisource.org/wiki/莊子/達生</p></article></main></div></div>
