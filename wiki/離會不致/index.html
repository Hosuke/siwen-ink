    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 離會不致</nav></header><main><article><h1>離會不致</h1><p>離會者非兩君相會，乃大夫出會，故不書至。</p><p>定公十年，夏，公會齊侯于頰谷。公至自頰谷。穀梁子別言之：「離會不致，何為致也？危之也。」</p><p>離會者，非兩君正會，乃別有情況之會也。致者，書至所以危之。蓋頰谷之會，齊人數有侵陵之志，孔子相魯公以正儀禮，折齊人之妄，故危之而致。</p><p><strong>所出</strong>：《春秋穀梁傳 · 定公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/定公</p></article></main></div></div>
