    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 好力以難攻</nav></header><main><article><h1>好力以難攻</h1><p>務力者以艱難攻敵，必興</p><p>國好力者，曰「以難攻」，以難攻者必興；好辯者，曰「以易攻」，以易攻者必危。國以難攻者，起一得十；以易攻者，出十亡百。好力者務本貴農，以實力取勝；好辯者尚虛言，終至於亡。</p><p><strong>所出</strong>：《商君書 · 卷一》 — https://zh.wikisource.org/wiki/商君書/卷一</p></article></main></div></div>
