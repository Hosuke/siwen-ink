    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 高陽魋將為室</nav></header><main><article><h1>高陽魋將為室</h1><p>直於辭而不可用，言之成理者未必可行。</p><p>高陽魋將為室，問匠人。匠人對曰：「未可也。木尚生，加塗其上，必將撓。以生材任重塗，今雖成，後必敗。」</p><p>高陽魋曰：「不然。夫木枯則益勁，塗乾則益輕。以勁材任輕塗，今雖惡，後必善。」匠人窮於辭，無以對，受令而為室。其始成，竘然善也，而後果敗。</p><p>此所謂直於辭而不可用者也。</p><p><strong>所出</strong>：《淮南子 · 人間訓》 — https://zh.wikisource.org/wiki/淮南子/人間訓</p></article></main></div></div>
