    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 全大體</nav></header><main><article><h1>全大體</h1><p>循道法自然，寄治亂於賞罰，不以私智累心，乃得全大體之道。</p><p>古之全大體者：望天地，觀江海，因山谷，日月所照，四時所行，雲布風動；不以智累心，不以私累己；寄治亂於法術，託是非於賞罰，屬輕重於權衡；不逆天理，不傷情性。</p><p>夫治國之要在法道。法者，編之於憲令，著之於官府，而布之於百姓者也。道法者，循自然而歸於一也。[[守成理因自然|守成理，因自然]]，則治道明矣。使人無離法之罪，魚無失水之禍，如此，故天下少不可。</p><p><strong>所出</strong>：《韓非子 · 大體》 — https://zh.wikisource.org/wiki/韓非子/大體</p></article></main></div></div>
