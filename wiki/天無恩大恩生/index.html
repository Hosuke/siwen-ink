    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天無恩大恩生</nav></header><main><article><h1>天無恩大恩生</h1><p>天無心而生萬物，迅雷烈風皆其大恩之象。</p><p>天之無恩而大恩生。迅雷烈風，莫不蠢然。</p><p>張良曰：「熙熙哉。」</p><p>太公曰：「誡懼致福。」</p><p>李筌曰：「天心無恩，萬物有心，歸恩於天。」</p><p>老子曰：「天地不仁，以萬物為芻狗；聖人不仁，以百姓為芻狗。是以施而不求其報，生而不有其功。及至迅雷烈風，威遠而懼邇。萬物蠢然而懷懼，天無威而懼萬物，萬物有懼而歸威於天。聖人行賞也，無恩於有功；行伐也，無威於有罪。故賞罰自立於上，威恩自行於下也。」</p><p><strong>所出</strong>：《黃帝陰符經集註》 — https://zh.wikisource.org/wiki/黃帝陰符經集註</p></article></main></div></div>
