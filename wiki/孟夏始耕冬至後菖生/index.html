    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 孟夏始耕冬至後菖生</nav></header><main><article><h1>孟夏始耕冬至後菖生</h1><p>述農時之節。</p><p>草諯大月。冬至後五旬七日，菖始生，菖者百草之先生者也，於是始耕。孟夏之昔，殺三葉而荻大麥。日至，苦菜死而資生，而樹麻與菽，此告民地寶盡死。凡草生藏日中出，狶首生而麥無葉，而從事於蓄藏，此告民究也。五時見生而樹生，見死而荻死。天下時，地生財，不與民謀。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十六》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十六</p></article></main></div></div>
