    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 僕臣正，厥后克正</nav></header><main><article><h1>僕臣正，厥后克正</h1><p>臣正則君正，臣諛則君聖</p><p>文王、武王之世，小大之臣咸懷忠良，侍御僕從罔匪正人，以旦夕承弼厥辟，是以聰明齊聖，發號施令罔有不臧。周穆王鑒及此義，乃戒伯冏曰：[[僕臣正，厥后克正；僕臣諛，厥后自聖]]。臣之賢否，與君德相為消長，正則匡弼其君使躋於善，諛則逢迎其君使溺於過。觀文、武之所以興，與後世之所以衰，其道不可以鑒乎？</p><p><strong>所出</strong>：《尚書 · 冏命》 — https://zh.wikisource.org/wiki/尚書/冏命</p></article></main></div></div>
