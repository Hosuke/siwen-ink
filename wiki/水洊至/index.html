    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 水洊至</nav></header><main><article><h1>水洊至</h1><p>水之流相繼而至，以象坎之重險。</p><p>象曰：「水洊至，習坎。」</p><p>洊，再也。水之流，一波未平一波又至，坎窪相仍而無已時。君子觀此象，乃以常德行、習教事，取水之恒久相繼，以修己教人，不可以險阻而渝其志。</p><p><strong>所出</strong>：《周易 · 坎》 — https://zh.wikisource.org/wiki/周易/坎</p></article></main></div></div>
