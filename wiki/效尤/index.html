    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 效尤</nav></header><main><article><h1>效尤</h1><p>師出無名而蹈人之過，適足招禍。</p><p>晉襄公既祥，使告于諸侯而伐衛，及南陽。先且居曰：「效尤，禍也。請君朝王，臣從師。」</p><p><strong>所出</strong>：《春秋左氏傳 · 文公》 — https://zh.wikisource.org/wiki/春秋左氏傳/文公</p></article></main></div></div>
