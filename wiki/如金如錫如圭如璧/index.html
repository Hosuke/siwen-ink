    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 如金如錫，如圭如璧</nav></header><main><article><h1>如金如錫，如圭如璧</h1><p>君子成德，如金錫之精、圭璧之溫，皆切磋琢磨之功。</p><p>君子成德，匪一朝夕之故，乃浸久磨礪以至於純粹。</p><p>《淇奧》之詩美武公之德，三章之末皆言「如金如錫，如圭如璧」。金與錫，皆金屬之美者，冶金則精，煉錫則純，合以成器，無有不善。圭與璧，皆玉之美者，圭以祀天，璧以享神，皆禮神之重器。</p><p>「如金如錫」者，言其德充實而有光輝，光輝非外加，乃內充之見於外者。「如圭如璧」者，言其德溫潤而有法度，溫潤者澤於人也。匪生而然，切磋琢磨而至於此，故能為王朝之相，入則揖讓於廟堂，出則表率於諸侯。</p></article></main></div></div>
