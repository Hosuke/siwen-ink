    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 法令滋章盜賊多有</nav></header><main><article><h1>法令滋章盜賊多有</h1><p>老氏謂法令愈繁，姦偽愈起。</p><p>老氏稱：「上德不德，是以有德；下德不失德，是以無德。法令滋章，盜賊多有。」言治以德為上，法令愈多而姦偽愈興，不可專恃也。</p><p><strong>所出</strong>：《史記 · 卷122》 — https://zh.wikisource.org/wiki/史記/卷122</p></article></main></div></div>
