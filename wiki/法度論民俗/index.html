    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 法度論民俗</nav></header><main><article><h1>法度論民俗</h1><p>法度所以齊民俗、節緩急，非一概而論。</p><p>法度者，所以論民俗而節緩急也；器械者，因時變而制宜適也。</p><p>夫聖人作法而萬物制焉，賢者立禮而不肖者拘焉。制法之民，不可與遠舉；拘禮之人，不可使應變。</p><p><strong>所出</strong>：《淮南子 · 氾論訓》 — https://zh.wikisource.org/wiki/淮南子/氾論訓</p></article></main></div></div>
