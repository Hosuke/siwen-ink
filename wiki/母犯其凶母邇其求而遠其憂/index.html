    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 母犯其凶母邇其求而遠其憂</nav></header><main><article><h1>母犯其凶母邇其求而遠其憂</h1><p>居上位者當戒貪利、遠逸樂，否則國危莫救。</p><p>「毋犯其凶」，言中正以蓄慎也；「毋邇其求」，言上之敗常貪於金玉馬女，而󠫤愛於粟米貨財也。厚藉斂于百姓，則萬民懟怨。「遠其憂」，言上之亡其國也。常邇其樂立優美，而外淫于馳騁田獵，內縱于美色淫聲，下乃解怠惰失，百吏皆失其端，則煩亂以亡其國家矣。</p><p><strong>所出</strong>：《管子 · 第11篇宙合》 — https://zh.wikisource.org/wiki/管子/第11篇宙合</p></article></main></div></div>
