    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 周于利</nav></header><main><article><h1>周于利</h1><p>蓄積厚者雖凶年不忘利，操守固者雖邪世不能亂。</p><p>孟子論世變與人守之要云：「周於利者，凶年不能殺；周於德者，邪世不能亂。」言蓄積之厚者，雖遇荒歲而不至困斃；德操之固者，雖當濁世而不為搖奪。蓋物必先有所恃，而後能抗乎外患也。</p><p><strong>所出</strong>：《孟子 · 盡心下》 — https://zh.wikisource.org/wiki/孟子/盡心下</p></article></main></div></div>
