    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 吾乃今於是乎見龍</nav></header><main><article><h1>吾乃今於是乎見龍</h1><p>孔子見老子，喻以龍德，合而成體，散而成章。</p><p>孔子見老聃歸，三日不談。弟子問曰：「夫子見老聃，亦將何規哉？」孔子曰：「吾乃今於是乎見龍！龍，合而成體，散而成章，乘雲氣而養乎陰陽。予口張而不能嗋。予又何規老聃哉？」</p><p><strong>所出</strong>：《莊子 · 天運》 — https://zh.wikisource.org/wiki/莊子/天運</p></article></main></div></div>
