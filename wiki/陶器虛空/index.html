    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 陶器虛空</nav></header><main><article><h1>陶器虛空</h1><p>器因虛而盛受，形因空而長存。</p><p>埏埴以為器者，和土以為飲食之具也。器中空虛，故有所盛受；五藏空虛，神乃歸之。物有而無，空而有，實相資以為用。</p><p><strong>所出</strong>：《老子河上公章句 · 無用》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
