    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 服天下在行</nav></header><main><article><h1>服天下在行</h1><p>晏子言威當世而服天下者在行，能愛邦內之民、重士民之死力、中聽任賢者，則能威服天下。</p><p>晏子言：「能愛邦內之民者，能服境外之不善；重士民之死力者，能禁暴國之邪逆；中聽任賢者，能威諸侯；安仁義而樂利世者，能服天下。不能愛邦內之民者，不能服境外之不善；輕士民之死力者，不能禁暴國之邪逆；愎諫傲賢者，不能威諸侯；倍仁義而貪名實者，不能服天下。威當世而服天下者，此其道也已。」</p><p><strong>所出</strong>：《晏子春秋 · 卷三》 — https://zh.wikisource.org/wiki/晏子春秋/卷三</p></article></main></div></div>
