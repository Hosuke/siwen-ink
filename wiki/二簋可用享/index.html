    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 二簋可用享</nav></header><main><article><h1>二簋可用享</h1><p>損之世，薄禮可享，惟貴有孚。</p><p>《損》卦辭曰：「曉之用？二簋可用享。」夫祭祀之禮，固有常數，而聖人處損之時，不以繁文縟節為尚。簋，食器也。二簋之祭，禮之薄者，然《彖傳》云「二簋應有時」，言祭祀之用簋，當視時之宜，以有孚為本，不必拘於豐盛。《易》之精義，在損其文而存其實，損其物而貴其心也。</p><p><strong>所出</strong>：《周易 · 損》 — https://zh.wikisource.org/wiki/周易/損</p></article></main></div></div>
