    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 坎電烹轟</nav></header><main><article><h1>坎電烹轟</h1><p>道心真知在至暗中發現為坎電，急以離火迎之而成丹。</p><p>坎電者，水中起火之象，比道心真知在至暗中發現，發現之處，正吾身中活子時也。烹轟者，恍惚不定之象。金水方者，道心真知為精一真情，具有金水二氣。昆侖在西方，萬山祖脈，真金所產之處。當道心真知在至暗中發出，如電光閃灼，忽明忽暗，恍惚不定，急用離中虛靈之火以迎之，則真知靈知性情相戀，陰陽相合，產先天靈藥，複運天然真火煆去濁氣，礦盡金純，金丹成熟，香風遍滿塵寰。</p><p><strong>所出</strong>：《悟真直指 · 卷二》 — https://zh.wikisource.org/wiki/悟真直指/卷二</p></article></main></div></div>
