    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 刑名家</nav></header><main><article><h1>刑名家</h1><p>戰國論名實、法治之學派。</p><p>刑名家者，戰國時論名實、尚法治之學派也。劉向論[[尹文子]]之學，謂其「大較刑名家」。</p><p>尹文子之書，兼言名實之辨與法治之用，與純以詭辯取勝者有別。黃老刑名相通之學，實[[尹文子]]師承之要義也。</p><p><strong>所出</strong>：《尹文子 · 序》 — https://zh.wikisource.org/wiki/尹文子/序</p></article></main></div></div>
