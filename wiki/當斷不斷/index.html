    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 當斷不斷</nav></header><main><article><h1>當斷不斷</h1><p>太史公論春申君不能用朱英之計，猶豫不決，終受其亂。</p><p>太史公論春申君曰：「初，春申君之說秦昭王，及出身遣楚太子歸，何其智之明也！後制於李園，旄矣。」</p><p>又云：「語曰：『當斷不斷，反受其亂。』春申君失朱英之謂邪？」</p><p>朱英嘗謂春申君：「世有毋望之福，又有毋望之禍。今君處毋望之世，事毋望之主，安可以無毋望之人乎？」言李園必先入殺君以滅口，請置臣郎中以待之。歇不能用，竟以不斷而亡。</p><p><strong>所出</strong>：《史記 · 卷078》 — https://zh.wikisource.org/wiki/史記/卷078</p></article></main></div></div>
