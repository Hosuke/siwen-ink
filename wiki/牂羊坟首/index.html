    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 牂羊坟首</nav></header><main><article><h1>牂羊坟首</h1><p>以畜產瘦瘠況民生凋敝</p><p>牂羊坟首，三星在罶。人可以食，鮮可以飽。</p><p>牂羊，吳羊也，本首小角短。今瘦瘠已甚，首大如坟，以形其困。此以物之憔悴況民之憔悴也。[[人可以食鮮可以飽]]，人如此，則獸亦可知；獸如此，則人益可悲矣。皆極言饑饉之甚，而歸於「鮮可以飽」，所以深傷周室之亡而不可救也。</p><p><strong>所出</strong>：《詩經 · 苕之華》 — https://zh.wikisource.org/wiki/詩經/苕之華</p></article></main></div></div>
