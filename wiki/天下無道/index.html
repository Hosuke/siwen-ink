    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天下無道</nav></header><main><article><h1>天下無道</h1><p>人主無道，戎馬生郊，兵革不息。</p><p>[[天下無道]]者，與[[天下有道]]對也。人主無道，戰伐不止，戎馬生於郊境之上，久而不還。[[戎馬生於郊]]者，戰馬產子，見兵事之亟也。糞田糞身之世尚矣，而戎馬生郊，是糞之反也。</p><p><strong>所出</strong>：《老子河上公章句 · 儉欲》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
