    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 炊者不立</nav></header><main><article><h1>炊者不立</h1><p>炊者急躁，不能中立。喻躁進者無以自立。</p><p>炊者，謂鼓炊之人，急於得食者也。急於得食，則不能中立。喻人急於有為者，亦若是也。蓋躁動而不能持重者，未有不蹉跌者矣。</p><p><strong>所出</strong>：《老子 (帛書本) · 章二十四》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
