    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天與人不相勝</nav></header><main><article><h1>天與人不相勝</h1><p>天人相忘，各自其一，非相陵壓也。</p><p>其一與天為徒，其不一與人為徒。天與人不相勝也，是之謂真人。</p><p><strong>所出</strong>：《莊子 · 大宗師》 — https://zh.wikisource.org/wiki/莊子/大宗師</p></article></main></div></div>
