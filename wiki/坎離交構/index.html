    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 坎離交構</nav></header><main><article><h1>坎離交構</h1><p>坎男離女相配，陰陽二氣會合，乃成金丹之基。</p><p>[[悟真篇]]以坎離取象人身，以離為心、以坎為腎，以心腎為人身之乾坤。詩云：「自知顛倒由離坎，誰識浮沉定主賓。」又云：「日居離位反為女，坎配蟾宮卻是男。」此言人身陰陽之顛倒，必以[[戊己]]為媒娉，使坎男離女交感會合，方成還丹。悟真者須知此顛倒之妙，方不墮旁門也。</p><p><strong>所出</strong>：《悟真篇》 — https://zh.wikisource.org/wiki/悟真篇</p></article></main></div></div>
