    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 事對</nav></header><main><article><h1>事對</h1><p>並舉人事以為驗，引經據典，辭難而意深者也。</p><p>事對者，並舉人驗者也。徵人之學，事對所以為難也。務在允當。若兩事相配，而優劣不均，是驥在左驂，駑為右服也。</p><p>[[宋玉]]《神女賦》-{云}-：「毛嬙鄣袂，不足程式，西施掩面，比之無色。」此事對之類也。</p><p><strong>所出</strong>：《文心雕龍 · 麗辭》 — https://zh.wikisource.org/wiki/文心雕龍/麗辭</p></article></main></div></div>
