    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天之道利而不害</nav></header><main><article><h1>天之道利而不害</h1><p>天道利益萬物，無加害之心。</p><p>《河上公章句》注[[天之道利而不害]]，言「[[天之道利而不害]]，聖人無為，萬物[[自然而]]生」，合前注[[功成名遂身退]]云「功成名遂身退，天之道」。又注[[高者抑之下者舉之]]，言「[[抑高舉下]]，[[損有餘補不足]]」。[[天道張弓]]之喻，[[損之而益益之而損]]之互用，亦[[物極則反]]之義也。</p><p><strong>所出</strong>：《老子河上公章句 · 天道》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
