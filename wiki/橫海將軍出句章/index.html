    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 橫海將軍出句章</nav></header><main><article><h1>橫海將軍出句章</h1><p>漢遣橫海將軍韓說出句章，浮海從東方往，以伐東越。</p><p>元封元年冬，咸入東越。東越素發兵距險，使徇北將軍守武林，敗樓船軍數校尉，殺長吏。時天子遣橫海將軍韓說出句章，浮海從東方往；樓船將軍楊仆出武林；中尉王溫舒出梅嶺；越侯為戈船、下瀨將軍，出若邪、白沙。四道並進，咸入東越。橫海一道獨從海道而出，避其險阨，乃兵家詭道之術也。東越卒以破亡，而海道之師亦與有功焉。</p><p><strong>所出</strong>：《史記 · 卷114》 — https://zh.wikisource.org/wiki/史記/卷114</p></article></main></div></div>
