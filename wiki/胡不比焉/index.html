    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 胡不比焉</nav></header><main><article><h1>胡不比焉</h1><p>詰人以助之辭，言人當相親比。</p><p>「胡不比焉」，出自《詩經·杕杜》。詩人孤行無依，乃詰問於人曰：何不相親比？比者，親近輔助之義。言人當相親比，以兄弟之道相待也。</p><p>「胡不佽焉」義相應，佽，助也。皆詩人迫切之辭，望人以兄弟之情相援也。</p><p><strong>所出</strong>：《詩經 · 杕杜》 — https://zh.wikisource.org/wiki/詩經/杕杜</p></article></main></div></div>
