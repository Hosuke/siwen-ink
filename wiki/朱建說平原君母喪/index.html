    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 朱建說平原君母喪</nav></header><main><article><h1>朱建說平原君母喪</h1><p>平原君母死，陸賈教辟陽侯厚送喪以自全。</p><p>平原君母死，家貧，未有以發喪，方假貸服具。陸生令平原君發喪。陸生往見辟陽侯，賀曰：「平原君母死。」辟陽侯曰：「平原君母死，何乃賀我乎？」</p><p>陸生曰：「前日君侯欲知平原君，平原君義不知君，以其母故。今其母死，君誠厚送喪，則彼為君死矣。」辟陽侯乃奉百金往稅。列侯貴人以辟陽侯故，往稅凡五百金。</p><p><strong>所出</strong>：《史記 · 卷097》 — https://zh.wikisource.org/wiki/史記/卷097</p></article></main></div></div>
