    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 橫津三寸</nav></header><main><article><h1>橫津三寸</h1><p>臍下氣海之津，深三寸，中池神靈所宅之虛無之境也。</p><p>橫津三寸者，《黃庭內景經》所示中池神居之位也。津者，水之渡口；橫津者，氣機橫亙之處。在臍下三寸，正丹田之中、氣海之會。修道者于此處息心內觀，神乃凝止，珠乃含光。曰三寸者，非量度之數，乃象徵深微之意。明此虛無之境，則中池之玄可以漸窺。</p><p><strong>所出</strong>：《黃庭內景經 · 中池章第五》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/中池章第五</p></article></main></div></div>
