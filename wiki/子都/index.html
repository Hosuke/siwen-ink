    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 子都</nav></header><main><article><h1>子都</h1><p>古之美男子，詩人企慕之人，以譏不見賢者而遇狂狡。</p><p>子都，古之名美男子也。[[山有扶蘇]]云「不見子都，乃見狂且」。詩人企慕子都之美，而實際所遇，乃狂狡之人。子都者，公孫閼之字，見於《左氏春秋》，以美著聞。詩人以此為美之代表，與狂且對言，見淑否之相遠也。</p><p><strong>所出</strong>：《詩經 · 山有扶蘇》 — https://zh.wikisource.org/wiki/詩經/山有扶蘇</p></article></main></div></div>
