    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 五位相得</nav></header><main><article><h1>五位相得</h1><p>天干五位陰陽相從，遞相化合以成丹道。</p><p>《參同契》列五位相得之序，曰：</p><p>乙「浮右」、丁「文火」、己物、辛「世銀」、癸「真鉛」，此一行也；甲「沉左」、丙「武火」、戊藥、庚「世金」、壬「真汞」，又一行也。</p><p>蓋十天干分居五位，陽干與陰干遞相配合。乙甲為夫婦，丙丁為夫婦，戊己為夫婦，庚辛為夫婦，壬癸為夫婦。陽之浮沉、文武、藥物、與世金銀、及真鉛真汞，錯居參伍，而各有合焉。丹家取此陰陽配合之理，以為成丹之階，故曰「相得而各有合」也。</p><p><strong>所出</strong>：《周易參同契 · 34章》 — https://zh.wikisource.org/wiki/周易參同契/34章</p></article></main></div></div>
