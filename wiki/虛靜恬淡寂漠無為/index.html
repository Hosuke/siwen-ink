    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 虛靜恬淡寂漠無為</nav></header><main><article><h1>虛靜恬淡寂漠無為</h1><p>虛靜恬淡寂漠無為，乃天地之平，道德之至，為萬物之本。</p><p>以恬養性，以漠處神，則入於天門。天門者，純粹樸素、質直皓白、未始有與雜糅之處也。所謂天者如是，所謂人者，偶䁟智故，曲巧偽詐，所以俛仰於世人而與俗交者也。循天者與道游，隨人者與俗交。聖人不以人滑天，不以欲亂情，不謀而當，不言而信，不慮而得，不為而成，精通於靈府，與造化者為人。</p><p>  <strong>所出</strong>：《淮南子 · 原道訓》 — https://zh.wikisource.org/wiki/淮南子/原道訓</p></article></main></div></div>
