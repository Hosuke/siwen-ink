    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 多文以為富</nav></header><main><article><h1>多文以為富</h1><p>儒者不求金玉之積，唯以學問文章為己之財富。</p><p>儒有委之以貨財，淹之以樂好；見利不虧其義。又云：不寶金玉，而忠信以為寶；不祈土地，立義以為土地；不祈多積，多文以為富。</p><p>金玉土地，世人以為富；儒者不然。忠信之寶，重於金玉；義以為土，廣於版圖；文以為富，充於方寸。《左傳》「言之無文，行而不遠」，多文則智廣，智廣則道行，此儒者之真富也。</p><p><strong>所出</strong>：《禮記 · 儒行》 — https://zh.wikisource.org/wiki/禮記/儒行</p></article></main></div></div>
