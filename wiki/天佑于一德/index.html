    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天佑于一德</nav></header><main><article><h1>天佑于一德</h1><p>天無私覆，不私佑一人，唯佑德之一純者。</p><p>天之道，至公而不私。天之有天下，非私於有德之一人；天之祐商，亦非以其為商。商之有天下，以其君臣咸有純一之德也。惟尹躬暨湯咸有一德，克享天心，受天明命。此非天心之有偏，乃理之必然也。</p><p>非天私我有商，惟天祐于一德。</p><p><strong>所出</strong>：《尚書 · 咸有一德》 — https://zh.wikisource.org/wiki/尚書/咸有一德</p></article></main></div></div>
