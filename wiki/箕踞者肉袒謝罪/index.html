    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 箕踞者肉袒謝罪</nav></header><main><article><h1>箕踞者肉袒謝罪</h1><p>有人見郭解獨箕踞視之，解反躬自責而脫其踐更之戍，箕踞者乃肉袒謝罪。</p><p>解出入，人皆避之。有一人獨箕倨視之，解遣人問其名姓。客欲殺之。解曰：「居邑屋至不見敬，是吾德不脩也，彼何罪！」乃陰屬尉史曰：「是人，吾所急也，至踐更時脫之。」每至踐更，數過，吏弗求。怪之，問其故，乃解使脫之。箕踞者乃肉袒謝罪。少年聞之，愈益慕解之行。</p><p><strong>所出</strong>：《史記 · 卷124》 — https://zh.wikisource.org/wiki/史記/卷124</p></article></main></div></div>
