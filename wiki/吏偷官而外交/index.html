    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 吏偷官而外交</nav></header><main><article><h1>吏偷官而外交</h1><p>賢材懈怠有功者隳之亡國風</p><p>不課賢不肖，不論功勞，用人之重，聽左右之謁，父兄大臣上請爵祿而下賣之以收財利。功勞之臣不論，官職之遷失謬。是以吏偷官而外交，棄事而親財。賢者懈怠而不勸，有功者隳而簡其業。此亡國之風也。[[政荒民散]]之漸。</p><p><strong>所出</strong>：《韓非子 · 八奸》 — https://zh.wikisource.org/wiki/韓非子/八奸</p></article></main></div></div>
