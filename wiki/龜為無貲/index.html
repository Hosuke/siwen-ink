    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 龜為無貲</nav></header><main><article><h1>龜為無貲</h1><p>得龜百里之地，立為無貲之寶，以待非常。</p><p>北郭掘闕得龜，桓公以百金易之，立寶日無貲。還四年伐孤竹，丁氏之粟足食三軍五月之師。龜中四千金，黑白之子當千金。管子以為，此立龜為無貲之寶，泰臺藏之，待非常之需而後發，霸王之資在焉。</p><p><strong>所出</strong>：《管子 · 第75篇山權數》 — https://zh.wikisource.org/wiki/管子/第75篇山權數</p></article></main></div></div>
