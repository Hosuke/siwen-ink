    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 四卜非禮</nav></header><main><article><h1>四卜非禮</h1><p>郊祭卜牲，過三則非禮，蓋數至於五則為強。</p><p>郊祭之前，必卜牲之吉凶。穀梁子曰：「郊三卜，禮也；四卜，非禮也；五卜，強也。」蓋三卜以問神，為敬；四卜則近於瀆；五卜則是強求於神，不可也。又論牛傷之辭曰：「全曰牲，傷曰牛，未牲曰牛，其牛一也；其所以為牛者異。」言牛之傷未成牲，不可以全牲視之。卜而免牲，亦有常法：「卜免牲者，吉則免之，不吉則否。」若卜之不吉，則安置之，待六月上甲始庀牲，左右之以成禮。此皆敬天順時之意，不可過也。</p><p><strong>所出</strong>：《春秋穀梁傳 · 哀公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/哀公</p></article></main></div></div>
