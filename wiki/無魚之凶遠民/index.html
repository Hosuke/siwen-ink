    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無魚之凶遠民</nav></header><main><article><h1>無魚之凶遠民</h1><p>象傳語，九四包無魚則民散而有凶，戒在上者不可遠其民。</p><p>「无魚之凶，遠民也。」</p><p>九四以陽居陰，不中不正，失其所以包魚之道，則民散而凶。夫在上者不可以遠其民，民去則凶從之矣。象傳以「遠民」釋之，正見失民之戒也。</p><p><strong>所出</strong>：《周易 · 姤》 — https://zh.wikisource.org/wiki/周易/姤</p></article></main></div></div>
