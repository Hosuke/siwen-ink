    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 四牡蹻蹻</nav></header><main><article><h1>四牡蹻蹻</h1><p>四牡雄壯，鉤膺光澤，錫予申伯以顯榮。</p><p>「四牡蹻蹻，鉤膺濯濯」，言四匹雄馬昂然壯健，馬胸之鉤飾光澤明亮，皆王之賞賜也。 [[王遣申伯]] 以路車乘馬，又錫之介圭以為國寶，厚其禮以寵異之。 [[吉甫作誦]]之美，正以見王錫之隆重。</p><p><strong>所出</strong>：《詩經 · 崧高》 — https://zh.wikisource.org/wiki/詩經/崧高</p></article></main></div></div>
