    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 桓公去三子</nav></header><main><article><h1>桓公去三子</h1><p>桓公聽管仲之戒而去易牙、竪刁、開方，既而又皆召還，卒覆其國。</p><p>桓公去易牙、豎刁、衛公子開方。五味不至，於是乎復反易牙。宮中亂，復反豎刁。利言卑辭不在側，復反衛公子開方。桓公內不量力，外不量交，而力伐四鄰。公薨，六子皆求立。易牙與衛公子，內與豎刁，因共殺羣吏而立公子無虧。故公死七日不斂，九月不葬。</p><p><strong>所出</strong>：《管子 · 第26篇戒》 — https://zh.wikisource.org/wiki/管子/第26篇戒</p></article></main></div></div>
