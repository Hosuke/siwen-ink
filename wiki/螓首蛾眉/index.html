    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 螓首蛾眉</nav></header><main><article><h1>螓首蛾眉</h1><p>喻女子額廣眉美，為古贊女子容貌之名句。</p><p>「螓首蛾眉」，《詩經·衞風·碩人》之句也。螓，蟬之大者，額廣而白；蛾眉，蠶蛾之眉，細長而美。詩以蟬之額、蛾之眉，比女子容貌之佳。</p><p>全句云：「手如柔荑，膚如凝脂，領如蝤蠐，齒如瓠犀，螓首蛾眉。」一章之中，五用博喻，形容莊姜通體之美。此四字疊用，音節鏗鏘，遂為千古形容女子之成語。</p><p><strong>所出</strong>：《詩經 · 碩人》 — https://zh.wikisource.org/wiki/詩經/碩人</p></article></main></div></div>
