    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 黃庭保固</nav></header><main><article><h1>黃庭保固</h1><p>佩符存神使黃庭堅固不死炁之侵。</p><p>黃庭保固，上清大洞修持之效也。修者佩[[消魔玉符]]，存呼[[二真堅玉君]]內諱，鎮兆太倉之腑，則黃庭保固，死炁滅絕。黃庭為人身之樞機，保固則[[三尸]]無隙可侵，中元之炁盈滿，[[帝皇之光]]充溢泥丸。與[[存神]]之義相發。</p><p><strong>所出</strong>：《上清大洞真經 · 18章》 — https://zh.wikisource.org/wiki/上清大洞真經/18章</p></article></main></div></div>
