    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 顯顯令德</nav></header><main><article><h1>顯顯令德</h1><p>君子德行昭著，光明盛大。</p><p>「顯顯令德」，語出《假樂》，言君子之德，光明而盛大也。</p><p>令德者，美德之稱。顯顯者，昭昭不息之意。君子以德服人，德行既著，則民從之，天祐之，所謂「宜民宜人，受祿于天」者，皆以此也。是故德為行道之本，令德為立身之基。</p><p><strong>所出</strong>：《詩經 · 假樂》 — https://zh.wikisource.org/wiki/詩經/假樂</p></article></main></div></div>
