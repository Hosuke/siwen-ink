    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 虎豹必不用其爪牙</nav></header><main><article><h1>虎豹必不用其爪牙</h1><p>權勢者失其勢則無所用，猶虎豹失爪牙之威。</p><p>使人不衣不食而不饑不寒，又不惡死，則无事上之意。虎豹必不用其爪牙而與鼷鼠同威，萬金之家必不用其富厚而與監門同資。有土之君，說人不能利，惡人不能害，索人欲畏重己，不可得也。</p><p><strong>所出</strong>：《韓非子 · 八說》 — https://zh.wikisource.org/wiki/韓非子/八說</p></article></main></div></div>
