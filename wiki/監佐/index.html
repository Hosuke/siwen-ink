    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 監佐</nav></header><main><article><h1>監佐</h1><p>醉酒有監、佐之官，以防淫佚。</p><p>《詩》云「既立之監，或佐之史」，言凡此飲酒，必有監以視之、佐以記之也。監者，督察之官；佐者，書史之屬。立監以防其失，設佐以謹其儀，使醉者不敢肆，未醉者知所節。此古聖人坊德之微意，故禮有監禮、佐禮之官，皆所以止其淫佚，全其令儀也。</p><p><strong>所出</strong>：《詩經 · 賓之初筵》 — https://zh.wikisource.org/wiki/詩經/賓之初筵</p></article></main></div></div>
