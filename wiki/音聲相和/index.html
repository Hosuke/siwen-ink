    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 音聲相和</nav></header><main><article><h1>音聲相和</h1><p>音與聲相和而成，諧而後應。</p><p>音與聲相和而成，聲以發之，音以和之，相須而後諧。此與[[長短相較]][[高下相傾]]相類，皆對待而成之理。聖人體此而行不言之教，以無聲化天下。</p><p><strong>所出</strong>：《老子河上公章句 · 養身》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
