    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 思馬斯作</nav></header><main><article><h1>思馬斯作</h1><p>詠馬之振。言所思之馬踴躍有為，氣力充沛也。</p><p>《詩經·駉》三章云「思無斁，思馬斯作」。</p><p>作者，起也。馬之所以作者，非徒立於坰野而已，抑且馳驟山谷之間，踴躍自強，無有懈怠。車繹繹而馬不倦，此之謂作。君子之於德，亦若是焉——日新又新，振起而不已。</p><p><strong>所出</strong>：《詩經 · 駉》 — https://zh.wikisource.org/wiki/詩經/駉</p></article></main></div></div>
