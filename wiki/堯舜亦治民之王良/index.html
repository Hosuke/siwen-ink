    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 堯舜亦治民之王良</nav></header><main><article><h1>堯舜亦治民之王良</h1><p>欲追速致遠，不知任王良；欲進利除害，不知任賢能。堯舜者，治民之王良也。</p><p>欲追速致遠，不知任王良；欲進利除害，不知任賢能，此則不知類之患也。</p><p>夫堯舜亦治民之王良也。[[良馬固車臧獲御之]]，故善御者不必恃王良，善治者亦不必專恃堯舜。抱法處勢，中人之才足以治天下。</p><p><strong>所出</strong>：《韓非子 · 難勢》 — https://zh.wikisource.org/wiki/韓非子/難勢</p></article></main></div></div>
