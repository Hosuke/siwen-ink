    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 杜宇</nav></header><main><article><h1>杜宇</h1><p>蜀主讓位鱉靈，得道昇天。</p><p>杜宇，蜀主也。蜀嘗大水，宇與居人避水於長平山，在青城味江之上，去縣八十里，築城壘居。其後鱉靈開峽治水，人得陸處。宇禪位與之，自居西山，得道昇天。鱉靈子孫世有蜀土，傳十二葉，至開明尚為秦所並，乃通中國。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 10》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/10</p></article></main></div></div>
