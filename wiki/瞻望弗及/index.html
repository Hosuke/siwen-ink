    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 瞻望弗及</nav></header><main><article><h1>瞻望弗及</h1><p>極目遠望而不可及，狀離別之情。</p><p>「遠送于野，瞻望弗及。」送之既遠，猶登高以望，望之之切，至於行人之不見，猶瞻望而不已。弗及者，非不欲及，力之所不及也。詩三章皆言「瞻望弗及」，唯遠近有差：「于野」「于南」「佇立」遞進，以見送者之愈行愈遠、望者之愈久愈悲。</p><p><strong>所出</strong>：《詩經 · 燕燕》 — https://zh.wikisource.org/wiki/詩經/燕燕</p></article></main></div></div>
