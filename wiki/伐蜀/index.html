    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 伐蜀</nav></header><main><article><h1>伐蜀</h1><p>秦併巴蜀以廣地益強，司馬錯之策勝於張儀之議。</p><p>秦惠王欲伐蜀，以道險狹難至，韓又來侵，猶豫未能決。司馬錯與張儀爭論於惠王之前，錯欲伐蜀，儀欲伐韓。錯陳兼併之利以為：「拔一國而天下不以為暴，利盡西海而天下不以為貪，是我一舉而名實附也。」儀持不如。惠王卒從錯議，起兵伐蜀，十月取之，遂定蜀，貶蜀王為侯，而使陳莊相蜀。蜀既屬秦，秦以益彊，富厚，輕諸侯。</p><p><strong>所出</strong>：《史記 · 卷070》 — https://zh.wikisource.org/wiki/史記/卷070</p></article></main></div></div>
