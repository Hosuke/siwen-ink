    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 荀卿為蘭陵令</nav></header><main><article><h1>荀卿為蘭陵令</h1><p>春申君相楚，北伐滅魯，以荀卿為蘭陵令。</p><p>春申君相楚八年，為楚北伐滅魯，以荀卿為蘭陵令。</p><p>當是時，楚復彊。考烈王以春申君為相，封淮北，後更請封於江東。春申君因城故吳墟，以自為都邑。</p><p><strong>所出</strong>：《史記 · 卷078》 — https://zh.wikisource.org/wiki/史記/卷078</p></article></main></div></div>
