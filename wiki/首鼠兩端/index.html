    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 首鼠兩端</nav></header><main><article><h1>首鼠兩端</h1><p>進退猶豫、無所適從之貌</p><p>首鼠兩端，謂瞻前顧後、遲疑不決也。語本《史記》記[[田蚡]]與[[韓安國]]廷辯[[竇嬰]]、 [[灌夫]]之事。</p><p>時[[田蚡]]責[[韓安國]]曰：「君與[[竇嬰]]共事一老禿翁，何為首鼠兩端？」蓋言[[韓安國]]之模棱也。</p><p>後世用為成語，喻人處事遲疑不決、首尾搖擺之態。</p><p><strong>所出</strong>：《史記 · 卷107》 — https://zh.wikisource.org/wiki/史記/卷107</p></article></main></div></div>
