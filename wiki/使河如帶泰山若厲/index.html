    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 使河如帶泰山若厲</nav></header><main><article><h1>使河如帶泰山若厲</h1><p>封爵誓辭，言國祚久長，河水變帶、泰山成礪而封不絕。</p><p>封爵之誓曰：「使河如帶，泰山若厲。國以永寧，爰及苗裔。」</p><p><strong>所出</strong>：《史記 · 高祖功臣侯者年表》 — https://zh.wikisource.org/wiki/史記/高祖功臣侯者年表</p></article></main></div></div>
