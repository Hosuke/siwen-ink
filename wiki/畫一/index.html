    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 畫一</nav></header><main><article><h1>畫一</h1><p>法令明白畫一，守而勿失之謂。</p><p>參之代何為漢相，一遵何約束，無所變更。百姓歌之曰：「蕭何為法，顜若畫一。」顜者，明也。畫一者，明白畫一，無參差也。言何定法令明白畫一，參守而勿失，天下因是以寧。</p><p><strong>所出</strong>：《史記 · 卷054》 — https://zh.wikisource.org/wiki/史記/卷054</p></article></main></div></div>
