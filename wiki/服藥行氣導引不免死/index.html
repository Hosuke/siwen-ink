    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 服藥行氣導引不免死</nav></header><main><article><h1>服藥行氣導引不免死</h1><p>不得金丹，單服草木、行氣導引，僅可延年遲死，終不得仙。</p><p>世有服食藥物、行氣導引，不免死者，何也？不得金丹，但服草木之藥及修小術者，可以延年遲死耳，不得仙也。或但知服草藥而不知還年之要術，則終無久生之理也。或不曉帶神符、行禁戒、思身神、守真一，則止可令內疾不起、風濕不犯耳。若卒有惡鬼強邪、山精水毒害之，則便死也。</p><p><strong>所出</strong>：《抱朴子 · 卷13》 — https://zh.wikisource.org/wiki/抱朴子/卷13</p></article></main></div></div>
