    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 陳長祭水</nav></header><main><article><h1>陳長祭水</h1><p>四時設祭水飲皆愈</p><p>陳長居苧嶼山六百年，四時設祭，亦不飲食，亦無所修。病者與祭水，飲之皆愈。</p><p><strong>所出</strong>：《神仙傳 · 卷六》 — https://zh.wikisource/wiki/神仙傳/卷六</p></article></main></div></div>
