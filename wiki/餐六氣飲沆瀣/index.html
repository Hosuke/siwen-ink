    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 餐六氣飲沆瀣</nav></header><main><article><h1>餐六氣飲沆瀣</h1><p>仙人服食吐納之術</p><p>餐六氣而飲沆瀣兮，漱正陽而含朝霞。保神明之清澄兮，精氣入而麤穢除。仙人以六氣、沆瀣、正陽、朝霞為食，滌除濁穢，保全神明。此方仙道服食之說，與[[神仙不死]]之旨相合。</p><p><strong>所出</strong>：《楚辭 · 遠遊》 — https://zh.wikisource.org/wiki/楚辭/遠遊</p></article></main></div></div>
