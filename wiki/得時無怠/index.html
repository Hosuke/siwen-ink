    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 得時無怠</nav></header><main><article><h1>得時無怠</h1><p>聖人用兵貴乘天時，時不再來，不可失之</p><p>范蠡論用兵之道，以天時為本。其言曰：「臣聞之，得時無怠，時不再來，天予不取，反為之災。」</p><p>又述古之善用兵者，以贏縮為常，四時以為紀，無過天極，究數而止。天道皇皇，日月以為常，明者以為法，微者則是行。陽至而陰，陰至而陽；日困而還，月盈而匡。</p><p>後則用陰，先則用陽；近則用柔，遠則用剛。用兵之道，因天地之常，與之俱行，不可逆天而動。</p><p><strong>所出</strong>：《國語 · 卷21》 — https://zh.wikisource.org/wiki/國語/卷21</p></article></main></div></div>
