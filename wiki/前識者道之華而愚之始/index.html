    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 前識者道之華而愚之始</nav></header><main><article><h1>前識者道之華而愚之始</h1><p>前識者，道之華也；揣摩臆度，愚之首也。</p><p>前識者，謂之華而非實也。聖人虛無因應，無所先見，故前識者華，華則離本遠矣。去本求末，以智妄測，是愚之始也。</p><p><strong>所出</strong>：《老子河上公章句 · 論德》 — https://zh.wikisource.org/wiki/老子河上公章句/德經</p></article></main></div></div>
