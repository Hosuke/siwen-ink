    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 功被天下，爲萬世文，身廢家敗</nav></header><main><article><h1>功被天下，爲萬世文，身廢家敗</h1><p>詠蠶之功與命，功在天下而身死家亡，因名與害為鄰。</p><p>蠶之於人，功被天下，爲萬世文。禮樂以成，貴賤以分，養老長幼，待之而後存。然其名號不美，與暴為鄰；功立而身廢，事成而家敗。蛹以為母，蛾以為父，三俯三起，事乃大已。蓋聖人之所以終身勤動、功在後世，而身不能自存者，其事類此。</p><p><strong>所出</strong>：《荀子 · 賦篇》 — https://zh.wikisource.org/wiki/荀子/賦篇</p></article></main></div></div>
