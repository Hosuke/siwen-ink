    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 宋景公熒惑在心</nav></header><main><article><h1>宋景公熒惑在心</h1><p>景公不嫁熒惑於人，天三賞之，延年二十一歲。</p><p>宋景公之時，熒惑在心，公懼，召子韋而問焉。子韋曰：「熒惑者天罰也，心者宋之分野，禍且當於君身。雖然，可移於宰相。」公曰不可。「可移於民。」公曰不可。「可移於歲。」公曰歲害則民饑，民饑必死，為人君而殺其民以自活，誰以我為君乎？子韋還走，北面載拜曰：「臣敢賀君。天之處高而聽卑。君有至德之言三，天必三賞君。今夕熒惑其徙三舍，君延年二十一歲。」果徙三舍。</p><p><strong>所出</strong>：《呂氏春秋 · 卷六》 — https://zh.wikisource.org/wiki/呂氏春秋/卷六</p></article></main></div></div>
