    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不皇出</nav></header><main><article><h1>不皇出</h1><p>師旅久役，無力出離困境，喻困阸難脫。</p><p>「不皇出」者，二章之辭也。首章言「不皇朝」，已苦其迫；二章言「不皇出」，則危其阸。山川悠遠，崔嵬在前，征人陷於途路之中，雖欲出脫而不可得。維其石之「卒」，卒者，高峻崔嵬之極，無路可通也。</p><p>「出」字之義，承上文「朝」字而言：晨且不暇，況欲出乎？此皆言師旅困頓，進退維谷之境也。</p><p><strong>所出</strong>：《詩經 · 漸漸之石》 — https://zh.wikisource.org/wiki/詩經/漸漸之石</p></article></main></div></div>
