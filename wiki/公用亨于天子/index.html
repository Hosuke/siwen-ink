    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 公用亨于天子</nav></header><main><article><h1>公用亨于天子</h1><p>公用亨于天子是指公侯按礼仪接受天子的赏</p><p>《小象》又申其義：「公用亨于天子，小人害也。」言公侯受賞於天子，若小人竊之，則反為害也。蓋「亨」通「享」，古者諸侯朝聘述職，奉贄以享天子，乃禮之常；唯小人竊位叨竊，則其享適足以招殃耳。</p><p>  <strong>所出</strong>：《周易 · 小象》 — https://zh.wikisource.org/wiki/周易/小象</p></article></main></div></div>
