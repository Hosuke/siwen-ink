    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 雲行雨施</nav></header><main><article><h1>雲行雨施</h1><p>天以雲雨潤澤萬物，品物流形，乾元之德也。</p><p>彖曰：雲行雨施，品物流形。</p><p>天之元氣，蒸而為雲，散而為雨，沾濡萬物，無有不到。此乾之亨也。萬物稟之以生，承之以成，形形色色，各正其性命之正，保合其大和之和，是之謂品物流形也。</p><p><strong>所出</strong>：《周易 · 乾》 — https://zh.wikisource.org/wiki/周易/乾</p></article></main></div></div>
