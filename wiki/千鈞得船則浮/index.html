    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 千鈞得船則浮</nav></header><main><article><h1>千鈞得船則浮</h1><p>物之輕重非定勢，有勢則浮，無勢則沉。</p><p>千鈞得船則浮，錙銖失船則沉，非千鈞輕錙銖重也，有勢之與無勢也。故短之臨高也以位，不肖之制賢也以勢。</p><p><strong>所出</strong>：《韓非子 · 功名》 — https://zh.wikisource.org/wiki/韓非子/功名</p></article></main></div></div>
