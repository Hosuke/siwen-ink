    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 其桓僖乎</nav></header><main><article><h1>其桓僖乎</h1><p>孔子聞火，知為桓公、僖公之廟災。</p><p>司鐸火，火逾公宮，桓僖災。救火者皆曰顧府。南宮敬叔至，命周人出御書；子服景伯至，命宰人出禮書；季桓子至，御公立于象魏之外，命藏象魏，曰：「舊章不可亡也。」孔子在陳，聞火，曰：「其桓僖乎！」</p><p><strong>所出</strong>：《春秋左氏傳 · 哀公三年》 — https://zh.wikisource.org/wiki/春秋左氏傳/哀公</p></article></main></div></div>
