    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不死之道</nav></header><main><article><h1>不死之道</h1><p>喻姦人誑世，君主不可信未驗之說</p><p>客有教燕王為不死之道者，王使人學之，所使學者未及學而客死。王大怒，誅之。王不知客之欺己，而誅學者之晩也。夫信不然之物而誅無罪之臣，不察之患也。且人所急無如其身，不能自使其無死，安能使王長生哉？此喻姦人之言不可信，未經驗而妄行，必貽後患。</p><p><strong>所出</strong>：《韓非子 · 外儲說左上》 — https://zh.wikisource.org/wiki/韓非子/外儲說左上</p></article></main></div></div>
