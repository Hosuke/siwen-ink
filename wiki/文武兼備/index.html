    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 文武兼備</nav></header><main><article><h1>文武兼備</h1><p>文事武備，不可偏廢，君子當兼通。</p><p>《文心雕龍·程器》云：「安有丈夫學文，而不達於政事哉！」又云：「文武之術，左右惟宜。」言學文者當通政務，非徒為詞章而已。</p><p>劉勰舉例以明：卻縠敦書，晉文公舉以為元帥，是好文而不礙於武也；孫武《兵經》，辭如珠玉，是習武而不闇於文也。</p><p>故知文事武備</p></article></main></div></div>
