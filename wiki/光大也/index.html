    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 光大也</nav></header><main><article><h1>光大也</h1><p>渙其群者德業光明盛大</p><p>「渙其群，元吉；光大也」。</p><p>六四渙散朋黨，非隘小之私德，乃廓然大公，故曰光大。光大者，無所不照，德業之盛也。</p><p><strong>所出</strong>：《周易 · 渙》 — https://zh.wikisource.org/wiki/周易/渙</p></article></main></div></div>
