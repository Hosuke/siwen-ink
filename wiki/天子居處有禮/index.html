    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天子居處有禮</nav></header><main><article><h1>天子居處有禮</h1><p>天子朝野居處皆有法度，百官萬事得其序。</p><p>天子在朝廷則道仁聖禮義之序，燕處則聽雅頌之音，行步則有環佩之聲，升車則有鸞和之音。居處有禮，進退有度；百官得其宜，萬事得其序。</p><p><strong>所出</strong>：《禮記 · 經解》 — https://zh.wikisource.org/wiki/禮記/經解</p></article></main></div></div>
