    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 拔才於巖岫，任才而不計</nav></header><main><article><h1>拔才於巖岫，任才而不計</h1><p>拔擢隱逸之士，用其才能，不拘資歷。</p><p>《抱朴子》曰：將救斯弊，其術無他，徒擢民於巖岫，任才而不計也。</p><p>夫山岩之上，往往有抱道懷德之士，棲神隱淪，不求聞達。當今天下之弊，在於賢才抑而不用，淺近是從。欲救此弊，莫若親詣山林，拔其才俊，任之而無所計較。計者，非徒計資歷也，亦不計名譽、不計毀譽，唯才是舉而已。</p><p>昔聖王之世，巖穴之士皆得登進，故能成天下之治。今世之衰，在於遺賢於草莽，而徒取近便之人也。</p><p><strong>所出</strong>：《抱朴子 · 卷41》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷41</p></article></main></div></div>
