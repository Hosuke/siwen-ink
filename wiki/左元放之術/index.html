    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 左元放之術</nav></header><main><article><h1>左元放之術</h1><p>述左元放變化解脫諸方。</p><p>或問魏武帝收左元放而桎梏之，得自然解脫，以何法。抱朴子答云：「吾不能正知左君所施用之事。然曆覽諸方書，有月三服薏苡子，和用三五陰丹，或以偶牙陽胞，或以七月七日東行跳脫蟲，或以五月五日石上龍子單衣，或以夏至日霹靂楔，或以天文二十一字元，或以自解去父血，或以玉子餘糧，或合山君目、河伯餘糧、浮雲滓以塗之，皆自解。」</p><p>然抱朴子明言：「左君之變化無方，未必由此也。自用六甲變化，其真形不可得執也。」</p><p><strong>所出</strong>：《抱朴子 · 卷15》 — https://zh.wikisource.org/wiki/抱朴子/卷15</p></article></main></div></div>
