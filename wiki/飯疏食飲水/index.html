    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 飯疏食，飮水，曲肱而枕之</nav></header><main><article><h1>飯疏食，飮水，曲肱而枕之</h1><p>君子樂道安貧。</p><p>[[孔子]]言[[飯疏食]][[飮水]]，[[曲肱而枕]]之，[[樂亦在其中矣]]。蔬食水湯之陋，聖人樂在其中，不以外物累心。[[不義而富且貴，於我如浮雲]]，見[[君子喻於義]]，不以非義而易其樂也。</p><p><strong>所出</strong>：《論語 · 述而第七》 — https://zh.wikisource.org/wiki/論語/述而第七</p></article></main></div></div>
