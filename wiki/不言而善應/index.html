    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 不言而善應</nav></header><main><article><h1>不言而善應</h1><p>天道不言而萬物自應，聖人法之，不言以化天下。</p><p>，天道至要不言，而萬物自然感應。帛書雲：「不言而善應，不召而自來，單而善謀。」[[希言自然]]之義，天之象義亦若是也。[[天網恢恢踈而不失]]亦言天網疏闊而無所遺漏，其不言而應者，天道之自然也。聖人法天，不以言設教，而百姓自化，故[[聖人執左契而不責於人]]者，此之謂乎？天不言而四時行、萬物生，人而不言者，亦可善應天下。此道家所謂無為之應、無聲之化也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章七十三》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
