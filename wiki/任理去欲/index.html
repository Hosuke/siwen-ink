    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 任理去欲</nav></header><main><article><h1>任理去欲</h1><p>治事當任事理而去私欲。</p><p>人主欲為事，不通其端末，而以明其欲，有為之者，其為不得利，必以害反。知此者，任理去欲。舉事有道，計其入多，其出少者，可為也。惑主不然，計其入不計其出，則名得而實亡，如是者功小而害大矣。</p><p><strong>所出</strong>：《韓非子 · 南面》 — https://zh.wikisource.org/wiki/韓非子/南面</p></article></main></div></div>
