    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 酒客</nav></header><main><article><h1>酒客</h1><p>樑市酒家人，作酒常美，日得萬錢。逐後貧窮，百餘歲來為樑丞，種芋菜，三年當大饑，果如其言。</p><p>酒客，樑市上酒家人也，作酒常美，售人，日得萬錢。有過而逐之，主人酒常醉敗貧窮。樑市中賈人多欲以女妻而迎之，或去或來。</p><p>後百餘歲，來為樑丞，使民益種芋菜，三年當大饑果果如其言，樑民不死。</p><p>後五年，解印綬去，莫知所終。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 3》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/3</p></article></main></div></div>
