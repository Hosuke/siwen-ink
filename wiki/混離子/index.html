    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 混離子</nav></header><main><article><h1>混離子</h1><p>血中赤炁君之字，主血中赤炁，守人身百關之穴。</p><p>混離子字叔寶堅，乃[[血中赤炁君]]之二神之一。與司命精魂發紐子字慶玄並守兆身百關之穴。</p><p>血中赤炁君主血中之赤色真炁，混離子為其字，司命精魂發紐子為其伴神。二神共守[[百關之穴]]，絕死炁之門，使五帝之液盈於六府、九靈之潤充於血肉。行之則七祖結散，更生南極，兆得[[玉仙]]之號。</p><p><strong>所出</strong>：《上清大洞真經 · 34章》 — https://zh.wikisource.org/wiki/上清大洞真經/34章</p></article></main></div></div>
