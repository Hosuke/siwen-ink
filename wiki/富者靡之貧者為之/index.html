    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 富者靡之，貧者為之</nav></header><main><article><h1>富者靡之，貧者為之</h1><p>奢侈消費使財富流轉以濟貧民</p><p>「富者靡之，貧者為之，此百姓之怠生，百振而食，非獨自為也，為之畜化用。」富有者揮霍消費，則財貨流轉；貧窮者為之服役，則生計有賴。百姓由此皆得生養，非各自孤立而為也。丹沙之穴不塞，則商賈不處；富者之靡，即所以畜養而化用乎貧民也。</p><p><strong>所出</strong>：《管子 · 第35篇侈靡》 — https://zh.wikisource.org/wiki/管子/第35篇侈靡</p></article></main></div></div>
