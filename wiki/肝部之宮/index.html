    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 肝部之宮</nav></header><main><article><h1>肝部之宮</h1><p>肝為青童神公子之居，佩玉鈴，外應目瞳。</p><p>肝部之宮，謂肝為諸神之宅也。經云「翠重裏」，言其位隱而尊。下有青童神公子主之，此肝神之號也。「玉鈴」者，佩飾之稱，取其清越以和魂魄。肝開竅於目，故外應日月之精，而眸子清明。修煉者存想此宮，使神氣充盈，則肝氣調暢，諸竅通利。</p><p><strong>所出</strong>：《黃庭內景經 · 肝部章第十一》 — https://zh.wikisource.org/wiki/太上黃庭內景玉經/肝部章第十一</p></article></main></div></div>
