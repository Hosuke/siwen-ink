    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 和鈴央央</nav></header><main><article><h1>和鈴央央</h1><p>車鈴之聲，和而遠聞。寫諸侯來朝車馬之盛也。</p><p>和鈴央央，車上之鈴聲相和而遠聞也。鈴在衡，和在旂。央央，音聲相續之貌。諸侯車馬至于廟門，鸞鈴之聲遠聞，可想見其車馬之盛、趨蹌之肅也。</p><p>《載見》以車馬之盛起興，而終之以純嘏之祈，見威儀與誠敬相須而行。聲音之末，亦禮文之一端也已。</p><p><strong>所出</strong>：《詩經 · 載見》 — https://zh.wikisource.org/wiki/詩經/載見</p></article></main></div></div>
