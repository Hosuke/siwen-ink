    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 思皇多祜</nav></header><main><article><h1>思皇多祜</h1><p>思念君王，願其福祉盛大。臣子祝君之辭也。</p><p>「思皇多祜」，祝君之辭也。皇，美也，指周王言之。祜，福也。言永念王之德澤，思王之多福，願其福履永保勿失也。</p><p>「思」字一篇之中再見：「永言保之，思皇多祜」，是臣工祝頌之至情。言王之所以多祜者，以其能奉先烈、綏多福，使國祚靈長，惠此兆民也。</p><p><strong>所出</strong>：《詩經 · 載見》 — https://zh.wikisource.org/wiki/詩經/載見</p></article></main></div></div>
