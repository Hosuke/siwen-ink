    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 誅暴不避強</nav></header><main><article><h1>誅暴不避強</h1><p>力之正用，在誅暴而不避強禦。</p><p>晏子曰：「輕死以行禮謂之勇，誅暴不避強謂之力。」勇者本乎義，力者用乎誅。湯武以兵而不為逆，並國而不為貪，誅暴不避強，替罪不避眾：此力之行也。反是則不然。桀之衰也，有推侈、大戲；紂之衰也，有費仲、惡來。足走千里，手裂兕虎，任之以力，淩轢天下，威戮無罪，崇尚勇力，不顧義理。終至殷夏以衰。晏子之論，正欲明力與暴之辨，力以行義則興，力以凌弱則亡。</p><p><strong>所出</strong>：《晏子春秋 · 卷一》 — https://zh.wikisource.org/wiki/晏子春秋/卷一</p></article></main></div></div>
