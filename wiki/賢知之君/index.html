    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 賢知之君</nav></header><main><article><h1>賢知之君</h1><p>賢而有知之君，必據形勢之地，方能正天下而無所畏。</p><p>賢知之君，必立於勝地，故正天下而莫之敢御也。夫有其德而無其勢者，不足以有為；據形勝之地者，乃能令行禁止，鞭笞天下。</p><p><strong>所出</strong>：《管子 · 爲兵之數》 — https://zh.wikisource.org/wiki/管子/七法/爲兵之數</p></article></main></div></div>
