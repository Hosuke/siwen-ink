    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 八禮</nav></header><main><article><h1>八禮</h1><p>聖王所飭八禮：上下有義、貴賤有分、長幼有等、貧富有度，以及由此而生之十義。</p><p>是故聖王飭此八禮，以導其民。八者各得其義，則爲人君者中正而無私，爲人臣者忠信而不黨，爲人父者慈惠以教，爲人子者孝悌以肅，爲人兄者寬裕以誨，爲人弟者比順以敬，爲人夫者敦懞以固，爲人妻者勸勉以貞。</p><p><strong>所出</strong>：《管子 · 第10篇五輔》 — https://zh.wikisource.org/wiki/管子/第10篇五輔</p></article></main></div></div>
