    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 宛丘</nav></header><main><article><h1>宛丘</h1><p>陳國祈子之祭丘，詩人諷幽公淫荒而作。</p><p>宛丘者，陳國之高丘，以望雲雨、興祭祀者也。其上常有巫覡執羽翿以舞，鼓缶坎坎，終歲不休。</p><p>《宛丘》一詩三章，章四句。詩序云「幽公也。淫荒昏亂，游蕩無度焉」，蓋刺陳侯之荒縱。詩之首章言「子之湯兮，宛丘之上兮」，狀舞者旋轉之態；次章言「坎其擊鼓，宛丘之下」，見鼓聲之不絕；三章言「坎其擊缶，宛丘之道」，聞缶音之和諧。終以「無冬無夏，值其鷺羽」「無冬無夏，值其鷺翿」，極言祭祀之勤，隱刺幽公以祭為娛，廢政事也。</p><p><strong>所出</strong>：《詩經 · 宛丘》 — https://zh.wikisource.org/wiki/詩經/宛丘</p></article></main></div></div>
