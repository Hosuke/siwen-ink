    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無羊</nav></header><main><article><h1>無羊</h1><p>宣王考牧之詩，詠牛羊繁盛、牧事有成，末章兼言占夢之祥。</p><p>《無羊》之詩，見於《詩經·小雅》，舊序云「宣王考牧也」。宣王之世，周室中興，重修牧政，故詩人因以頌美之。</p><p>全詩四章，章八句，合三十二句。首章言牛羊之盛：羊以三百為羣，牛有九十其犉，角濈濈、耳濕濕，狀其肥健。次章言牧事之勤：牛羊或降阿，或飲池，或寢或訛；牧人荷蓑負餱，物色三十以供祭祀。三章言馭畜之有法：羊羣矜矜兢兢，麾以肱而畢來既升。四章言占夢之祥：牧人夢見眾維魚、旐維旟，占者以為豐年室家之兆。</p><p><strong>所出</strong>：《詩經 · 無羊》 — https://zh.wikisource.org/wiki/詩經/無羊</p></article></main></div></div>
