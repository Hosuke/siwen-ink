    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 遠送于野</nav></header><main><article><h1>遠送于野</h1><p>送人遠至郊野，以見別情之重。</p><p>「之子于歸，遠送于野。」之子，指所送之人。歸，往也。野，城外之郊也。送至郊外，已是甚遠，而猶不止；至於二三章，則言「遠于將之」「遠送于南」，其遠彌甚焉。詩之疊言送遠，正以見別情之重，不能已也。</p><p><strong>所出</strong>：《詩經 · 燕燕》 — https://zh.wikisource.org/wiki/詩經/燕燕</p></article></main></div></div>
