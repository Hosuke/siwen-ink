    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 終南</nav></header><main><article><h1>終南</h1><p>終南之山，君子至止，以其顯服大夫美之。</p><p>終南者，秦地之鎮山也。《傳》曰：「終南，周之太山。」其山有條有梅，草木豐茂。君子至止，見其地之盛美、君之威儀，遂作詩以美之。終南何有？有條有梅，有紀有堂。此山之所以異於常山者以其物產之富、氣象之殊也。</p><p><strong>所出</strong>：《詩經 · 終南》 — https://zh.wikisource.org/wiki/詩經/終南</p></article></main></div></div>
