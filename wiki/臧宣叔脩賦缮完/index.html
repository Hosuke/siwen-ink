    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 臧宣叔脩賦缮完</nav></header><main><article><h1>臧宣叔脩賦缮完</h1><p>齊楚結好而晉楚爭盟，知難有備，乃可以逞。</p><p>冬，臧宣叔令脩賦缮完，具守備，曰：「齊楚結好，我新與晉盟。晉楚爭盟，齊師必至。雖晉人伐齊，楚必救之。是齊楚同我也。知難而有備，乃可以逞。」</p><p><strong>所出</strong>：《春秋左氏傳 · 成公》 — https://zh.wikisource.org/wiki/春秋左氏傳/成公</p></article></main></div></div>
