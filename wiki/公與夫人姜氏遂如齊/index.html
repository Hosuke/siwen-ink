    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 公與夫人姜氏遂如齊</nav></header><main><article><h1>公與夫人姜氏遂如齊</h1><p>桓公與夫人如齊，卒薨于齊，故書「遂」。</p><p>桓公十八年，「春，王正月，公會齊侯于濼。公與夫人姜氏遂如齊。」</p><p>桓公與夫人如齊，[[公薨于齊]]。書「遂」者，生事也。會齊侯既畢，乃與夫人遂往見齊侯，卒有後患。</p><p><strong>所出</strong>：《春秋公羊傳 · 桓公》 — https://zh.wikisource.org/wiki/春秋公羊傳/桓公</p></article></main></div></div>
