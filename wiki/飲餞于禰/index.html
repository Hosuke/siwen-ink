    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 飲餞于禰</nav></header><main><article><h1>飲餞于禰</h1><p>禰地餞別，女子遠行之禮也。</p><p>飲餞于禰，女子有行，遠父母兄弟。餞，送行酒也；禰，地名。衞女之嫁，離其宗族，行前有餞別之禮。古者遠行必餞，示不忘也。此與「出宿于泲」相承，皆述女子有行之始。</p><p><strong>所出</strong>：《詩經 · 泉水》 — https://zh.wikisource.org/wiki/詩經/泉水</p></article></main></div></div>
