    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 感應</nav></header><main><article><h1>感應</h1><p>陰陽相感，萬物相通之理</p><p>咸，感也。柔上而剛下，二氣感應以相與。</p><p>天地感而萬物化生，聖人感人心而天下和平。觀其所感，而天地萬物之情可見矣。</p><p>夫感者，非獨人事然也。天之感地，澤上於山；地之感天，雨潤上蒸。物之感物，情動於中。是故聖人以感道修身，以感德化天下。感而至誠者，與天地合其德。</p><p><strong>所出</strong>：《周易 · 咸》 — https://zh.wikisource.org/wiki/周易/咸</p></article></main></div></div>
