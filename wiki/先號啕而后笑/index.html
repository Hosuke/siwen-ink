    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 先號啕而后笑</nav></header><main><article><h1>先號啕而后笑</h1><p>雖遇艱屯，終得會合</p><p>「先號啕而后笑」者，[[同人]]九五之爻辭也。</p><p>九五居尊，中正得位，與六二相應，然中間有三四隔之，志不能達，故「號啕」以悲。迨大師克相遇，正應既合，則破涕為笑。</p><p>[[易]]之為辭，每以先凶後吉、先泣後笑者，明天下之事未有不經艱阻而能成者也。[[詩]]云「既有衣櫃，莫之敢侮」，亦此義也。</p><p><strong>所出</strong>：《周易 · 同人》 — https://zh.wikisource.org/wiki/周易/同人</p></article></main></div></div>
