    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 中心搖搖</nav></header><main><article><h1>中心搖搖</h1><p>心神搖盪而無所安定。</p><p>首章云「中心搖搖」。搖搖者，心神恍惘、無所依托之貌。詩人行至宗周故墟，見禾黍離離，宮室無存，其心搖搖如懸旌，不知所止。搖搖非疾痛之苦，乃家國覆亡之哀，無可告訴，故中心搖盪而不能定也。</p><p><strong>所出</strong>：《詩經 · 黍離》 — https://zh.wikisource.org/wiki/詩經/黍離</p></article></main></div></div>
