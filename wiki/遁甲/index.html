    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 遁甲</nav></header><main><article><h1>遁甲</h1><p>風後演河圖而創百八局，以推主客勝負。</p><p>帝令風後演河圖而為式，用之創百八局，名曰遁甲。周公時約為七十二局，漢張子房共向映雲：四皓口口□十八局。案神龍負圖文，遁其甲，乃名之遁口□一局揭帖是也，以推主客勝負之術。帝又著十六神曆，推太一六壬等法。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 1》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/1</p></article></main></div></div>
