    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 子不圍父</nav></header><main><article><h1>子不圍父</h1><p>齊國夏圍戚，是子圍父而不名，以其為衛事也。</p><p>齊國夏、衛石曼姑帥師圍戚。穀梁子曰：「此衛事也，其先國夏，何也？子不圍父也。不系戚於衛者，子不有父也。」蓋戚者，衛之要邑；蒯瞆失國而居于戚，蒯瞆之父也。齊國夏以人臣而帥師圍衛臣之父所居，是子圍父也，故先國夏以見義。其不系戚於衛者，明戚非衛有，乃蒯瞆之私邑也。子圍父，是悖逆人倫，故記之以示譏。</p><p><strong>所出</strong>：《春秋穀梁傳 · 哀公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/哀公</p></article></main></div></div>
