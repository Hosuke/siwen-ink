    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 浮華記</nav></header><main><article><h1>浮華記</h1><p>離本已遠，錯亂不可常用</p><p>書有三等：一曰[[神道書]]，精一不離，實守本根；二曰[[核事文]]，核事異同，疑誤不失；三曰浮華記，離本已遠，錯亂不可常用，時時可記，故名浮華。</p><p>[[太平]]之經，乃神道書之屬，非浮華記可比也。</p><p><strong>所出</strong>：《太平經 · 01》 — https://zh.wikisource.org/wiki/太平經/01</p><hr><p>浮華之記，風俗之澆漓也。</p><p><strong>所出</strong>：《文心雕龍 · 諸子》 — https://zh.wikisource.org/wiki/文心雕龍/諸子</p></article></main></div></div>
