    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 羞不正不食</nav></header><main><article><h1>羞不正不食</h1><p>食物變質有異狀者不食</p><p>牛夜鳴則庮，羊泠毛而毳、膻，狗赤股而躁、臊，鳥麃色而沙鳴、郁，豕望視而交睫、腥，馬黑脊而般臂、漏，雛尾不盈握弗食，舒雁翠，鵠鸮胖，舒鳧翠，雞肝，雁腎，鴇奧，鹿胃。</p><p>不食雛鱉，狼去腸，狗去腎，貍去正脊，兔去尻，狐去首，豚去腦，魚去乙，鱉去醜。</p><p><strong>所出</strong>：《禮記 · 內則》 — https://zh.wikisource.org/wiki/禮記/內則</p></article></main></div></div>
