    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 萬物並作</nav></header><main><article><h1>萬物並作</h1><p>萬物競生，吾觀其復。</p><p>作，生也。萬物並生，吾以觀其復。</p><p>言萬物競生之時，吾觀其無不歸其本。人當念重其本。</p><p><strong>所出</strong>：《老子河上公章句 · 歸根》 — https://zh.wikisource.org/wiki/老子河上公章句/上</p></article></main></div></div>
