    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 珠鬱羅</nav></header><main><article><h1>珠鬱羅</h1><p>天上內音，珠鬱羅三字。</p><p>天上內音，珠鬱羅，廣都靈。珠鬱羅者，天上之內音秘呪也。廣都靈者，天帝之都廣大而靈。誦此內音，當思珠玉在羅網之中，羅而不出，以喻真炁在身不外馳也。廣都則天帝之庭，靈者感通之義。合而言之，珠鬱羅廣都靈者，使真音不出羅網，而天帝靈光之感通於兆身焉。</p><p><strong>所出</strong>：《上清大洞真經 · 2章》 — https://zh.wikisource.org/wiki/上清大洞真經/2章</p></article></main></div></div>
