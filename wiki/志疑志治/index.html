    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 志疑志治</nav></header><main><article><h1>志疑志治</h1><p>進退者志之疑，武人之貞者志之治也。</p><p>初六《象》曰「進退，志疑也。利武人之貞，志治也」。初六以柔居下，進退不決，是志之疑也。然能果斷以行，如武人之正固，則疑者可以成治。疑與治之間，在能用志而已。</p><p><strong>所出</strong>：《周易 · 巽》 — https://zh.wikisource.org/wiki/周易/巽</p></article></main></div></div>
