    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 四大正明</nav></header><main><article><h1>四大正明</h1><p>四大神明，正照明晰，護兆之身，魔炁滅絕。</p><p>四大正明，上清大洞所言衛護兆身之四大神也。兆誦是經，[[日中司命接生君]]為之主，而四大正明充布其間，使玉華保真，魔炁無得侵陵。此道經所言「使四大正明」之義也。[[默呪]]行道，誦[[玉經]]，斯神自來衛。</p><p><strong>所出</strong>：《上清大洞真經 · 25章》 — https://zh.wikisource.org/wiki/上清大洞真經/25章</p></article></main></div></div>
