    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 臣兄弟不足恃</nav></header><main><article><h1>臣兄弟不足恃</h1><p>晏子答景公，臣強有若湯，兄弟強有若桀，皆不可以恃。</p><p>景公問晏子曰：「有臣而強，足恃乎？」晏子對曰：「不足恃。」「有兄弟而強，足恃乎？」晏子對曰：「不足恃。」公忿然作色曰：「吾今有恃乎？」晏子對曰：「有臣而強，無甚如湯；有兄弟而強，無甚如桀。湯有弒其君，桀有亡其兄，豈以人為足恃，可以無亡也。」</p><p><strong>所出</strong>：《晏子春秋 · 卷八》 — https://zh.wikisource.org/wiki晏子春秋/卷八</p></article></main></div></div>
