    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 使能</nav></header><main><article><h1>使能</h1><p>陽處父易中軍，以為趙盾能，乃使之佐中軍，蓋使能、國之利也。</p><p>春，晉蒐于夷，舍二軍。使狐射姑將中軍，趙盾佐之。陽處父至自溫，改蒐于董，易中軍。陽子，成季之屬也，故黨於趙氏，且謂趙盾能，曰：「使能，國之利也。」是以之上。宣子於是乎始為國政。</p><p><strong>所出</strong>：《春秋左氏傳 · 文公》 — https://zh.wikisource.org/wiki/春秋左氏傳/文公</p></article></main></div></div>
