    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 澣濯之衣</nav></header><main><article><h1>澣濯之衣</h1><p>洗濯潔淨之衣，喻后妃之躬儉。</p><p>后妃服澣濯之衣。澣，洗也；濯，滌也。言后妃身穿洗濯之衣，不著華飾，以躬儉為德。</p><p><strong>所出</strong>：《詩經 · 葛覃》 — https://zh.wikisource.org/wiki/詩經/葛覃</p></article></main></div></div>
