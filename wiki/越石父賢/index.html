    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 越石父賢</nav></header><main><article><h1>越石父賢</h1><p>知己相知在乎感寤之恩，而禮不可闕。</p><p>越石父賢，在縲紲中。晏子出，遭之涂，解左驂贖之，載歸。弗謝，入閨。久之，越石父請絕。晏子懼然，攝衣冠謝曰：「嬰雖不仁，免子於緦何子求絕之速也？」石父曰：「不然。吾聞君子詘於不知己而信於知己者。方吾在縲紲中，彼不知我也。夫子既已感寤而贖我，是知己；知己而無禮，固不如在縲紲之中。」晏子於是延入為上客。</p><p><strong>所出</strong>：《史記 · 卷062》 — https://zh.wikisource.org/wiki/史記/卷062</p></article></main></div></div>
