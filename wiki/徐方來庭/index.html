    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 徐方來庭</nav></header><main><article><h1>徐方來庭</h1><p>徐方來朝於王庭，歸化稱臣。</p><p>詩言「四方既平，徐方來庭」。來庭者，來朝於王庭也。天下四方已平，徐方終於順服，前來朝見天子。詩言征伐之效：由震驚而來歸，由來歸而入庭，徐方終為王臣。此王化大行、天下歸附之象也。</p><p><strong>所出</strong>：《詩經 · 常武》 — https://zh.wikisource.org/wiki/詩經/常武</p></article></main></div></div>
