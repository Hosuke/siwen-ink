    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 禮之所以正國</nav></header><main><article><h1>禮之所以正國</h1><p>禮如衡之於輕重、繩墨之於曲直，正國之具。</p><p>國無禮則不正。禮之所以正國也，譬之：猶衡之於輕重也，猶繩墨之於曲直也，猶規矩之於方圓也，既錯之而人莫之能誣也。</p><p><strong>所出</strong>：《荀子 · 王霸篇》 — https://zh.wikisource.org/wiki/荀子/王霸篇</p></article></main></div></div>
