    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 宋宣公讓國</nav></header><main><article><h1>宋宣公讓國</h1><p>宋宣公病讓其弟和，弟三辭而受之，創兄終弟及之義。</p><p>宋宣公有太子與夷。十九年，宣公病，讓其弟和曰：「父死子繼，兄死弟及，天下通義也。我其立和。」和亦三讓而受之。宣公卒，弟和立，是為穆公。君子聞之，曰：「宋宣公可謂知人矣，立其弟以成義，然卒其子復享之。」此[[宋]]國讓國之義舉，[[春秋譏宋之亂]]之遠源也。</p><p><strong>所出</strong>：《史記·卷038》 — https://zh.wikisource.org/wiki/史記/卷038</p></article></main></div></div>
