    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 維北有斗，不可以挹酒漿</nav></header><main><article><h1>維北有斗，不可以挹酒漿</h1><p>斗星在北，不可挹取酒漿，亦有名無實</p><p>斗，北方之星，狀如酒斗。然斗可以挹取酒漿，此天上有斗，而不可以挹酒漿。以見其有名無實也。上文言箕不可以簸，此言斗不可以挹，皆詩人所以深刺在上者之無益於民也。</p><p><strong>所出</strong>：《詩經 · 大東》 — https://zh.wikisource.org/wiki/詩經/大東</p></article></main></div></div>
