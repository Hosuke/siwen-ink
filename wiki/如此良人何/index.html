    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 如此良人何</nav></header><main><article><h1>如此良人何</h1><p>愛慕至深，不知所措。</p><p>《詩》曰「如此良人何」。鄭《箋》：「子兮子兮，如此良人何」，喜之甚而不知將如何愛之也。合卺之夜，伉儷相對，恩情繾綣，至此語而極。</p><p><strong>所出</strong>：《詩經 · 綢繆》 — https://zh.wikisource.org/wiki/詩經/綢繆</p></article></main></div></div>
