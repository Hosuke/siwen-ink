    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 心悲</nav></header><main><article><h1>心悲</h1><p>賢者之去，令人心悲。</p><p>詩末云「無使我心悲兮」。《[[公歸]]》不得留，[[鴻飛]]已遠，[[信處信宿]]不足以久留君子，是以中心悲之。[[袞衣繡裳]]之人在，則[[九罭之魚]]可享；其人一去，如鴻遵渚、遵陸，歸則不復，此心之所以悲也。</p><p><strong>所出</strong>：《詩經 · 九罭》 — https://zh.wikisource.org/wiki/詩經/九罭</p><hr><p>[[使我心痗]] 之義與[[心悲]]相通。《伯兮》言夫行役不反，妻子思之成疾，心為之痗，蓋心悲之甚也。</p><p>  <strong>所出</strong>：《詩經 · 伯兮》 — https://zh.wikisource.org/wiki/詩經/伯兮</p></article></main></div></div>
