    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 橘頌</nav></header><main><article><h1>橘頌</h1><p>屈原所作，以比類寓意，覃及細物，開小物詠頌之先河</p><p>及三閭《橘頌》，情采芬芳，比類寓意，又覃及細物矣。蓋頌之體，原以宗廟神明為宗，而屈子《橘頌》乃以小小之物寄寓深意，別開蹊徑，後世擬作，多循此途。</p><p><strong>所出</strong>：《文心雕龍 · 頌讚》 — https://zh.wikisource.org/wiki/文心雕龍/頌讚</p></article></main></div></div>
