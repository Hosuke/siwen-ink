    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 上德無為而無不為</nav></header><main><article><h1>上德無為而無不為</h1><p>上德者虛己任道，故無為而無不為。</p><p>所以貴無為無思為虛者，謂其意無所制也。夫無術者，故以無為無思為虛也。夫故以無為無思為虛者，其意常不忘虛，是制於為虛也。虛者，謂其意無所制也。今制於為虛，是不虛也。虛者之無為也，不以無為為有常。不以無為為有常則虛，虛則德盛，德盛之謂上德。故曰：「上德無為而無不為也。」</p><p><strong>所出</strong>：《韓非子 · 解老》 — https://zh.wikisource.org/wiki/韓非子/解老</p></article></main></div></div>
