    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 黃繒</nav></header><main><article><h1>黃繒</h1><p>朱書玉符之材，佩之以消魔。</p><p>黃繒，黃色絲帛，上清大洞玉符之書寫材料也。</p><p>《上清大洞真經》記玉符之制云：「當青書黃繒，佩之。」[^1] 符以青書黃繒，取青為生炁、黃為中央正色之義。佩之者，以符鎮身，使 [[拘制]] 守 [[伏晨之戶]]，聰明八達，太真保生。</p><p>符籙之學，尚矣。黃繒之選，取其柔韌不折、色黃能久，書以青硯之墨，而符之精靈始凝聚於茲帛也。修真者欲以此符衛身，先修其心，心不清則符亦徒設焉。</p><p><strong>所出</strong>：《上清大洞真經 · 20章》 — https://zh.wikisource.org/wiki/上清大洞真經/20章</p></article></main></div></div>
