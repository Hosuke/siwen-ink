    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 思庸</nav></header><main><article><h1>思庸</h1><p>思念平常之道，反求其理也。</p><p>太甲既立不明，伊尹放諸桐；三年而思庸，伊尹知其能反也，遂迎之歸亳。太甲居桐宮，困心衡慮，既闇而明，既迷而悟，於是追念昔時之所行，反思其理，而庸言之謹、庸行之謹者，皆可得而言焉。思庸者，非聖人不能以此終其德也。</p><p><strong>所出</strong>：《尚書 · 太甲上》 — https://zh.wikisource.org/wiki/尚書/太甲上</p></article></main></div></div>
