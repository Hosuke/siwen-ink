    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 稱事之大小</nav></header><main><article><h1>稱事之大小</h1><p>晏子言當稱事之大小，權利之輕重，此為治事之要。</p><p>晏子言：「事大則利厚、事小則利薄，稱事之大小，權利之輕重，國有義勞，民有加利，以此舉事者必成矣。」</p><p><strong>所出</strong>：《晏子春秋 · 卷三》 — https://zh.wikisource.org/wiki/晏子春秋/卷三</p></article></main></div></div>
