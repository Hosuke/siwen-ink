    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 使大夫各以其爵朝服以侑幣致之</nav></header><main><article><h1>使大夫各以其爵朝服以侑幣致之</h1><p>遠邦大夫不親食，則以幣致之，禮有所變通也</p><p>若上大夫不親食，則使大夫各以其爵、朝服以侑幣致之。豆實于瓮，陳于楹外；簋實于筐，陳于楹內；庶羞陳于碑內，庭實陳于碑外；牛羊豕陳于門內，西方東上。賓朝服以受，如受饔禮。明日，賓拜賜于朝，讶聽命。此所以待不能赴者之變禮也。</p><p><strong>所出</strong>：《儀禮 · 公食大夫禮》 — https://zh.wikisource.org/wiki/儀禮/公食大夫禮</p></article></main></div></div>
