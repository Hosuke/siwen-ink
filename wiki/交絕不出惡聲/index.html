    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 交絕不出惡聲</nav></header><main><article><h1>交絕不出惡聲</h1><p>君子之交，雖絕不毀；忠臣去國，不洁其名。</p><p>樂毅《報燕惠王書》曰：「臣聞古之君子，交絕不出惡聲；忠臣去國，不絜其名。臣雖不佞，數奉教於君子矣。恐侍御者之親左右之說，不察疏遠之行，故敢獻書以聞，唯君王之留意焉。」</p><p>交道既絕，不出謗毀之言；去國而去，不以穢名自白。蓋毀傷舊君，則是自辱其節；而自表清白，亦非所以報先王之恩。此樂毅所以明心跡而不辱身名也。</p><p><strong>所出</strong>：《史記 · 卷080》 — https://zh.wikisource.org/wiki/史記/卷080</p></article></main></div></div>
