    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 知德者鮮矣</nav></header><main><article><h1>知德者鮮矣</h1><p>謂通曉德行之人寡少。</p><p>子曰：「由，知德者鮮矣！」</p><p>孔子呼子路之名而言之。意謂：仲由乎，世之知德者寡矣。言乎道之難明，而知行之士不易得也。仲由剛直好勇，聞義或未能充，故孔子因時而發此歎。</p><p><strong>所出</strong>：《論語 · 衞靈公第十五》 — https://zh.wikisource.org/wiki/論語/衞靈公第十五</p></article></main></div></div>
