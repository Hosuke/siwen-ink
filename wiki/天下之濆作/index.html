    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天下之濆作</nav></header><main><article><h1>天下之濆作</h1><p>天下有急難之作，待賢者以靜德應之，此聖人待時之義也。</p><p>其所處者，柔安靜樂，行德而不爭，以待天下之濆作也。</p><p><strong>所出</strong>：《管子 · 勢》 — https://zh.wikisource.org/wiki/管子/勢</p></article></main></div></div>
