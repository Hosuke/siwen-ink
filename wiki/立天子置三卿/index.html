    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 立天子置三卿</nav></header><main><article><h1>立天子置三卿</h1><p>建天子置三卿，以為天下表儀。</p><p>故立天子，置三卿。</p><p>言故聖人為天下立天子、置三卿，使為民之表儀也。言位之設所以正天下，非私貴也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章六十二》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
