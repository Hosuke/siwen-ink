    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 所謂伊人</nav></header><main><article><h1>所謂伊人</h1><p>稱所思慕之賢士。</p><p>「所謂伊人」，詩《白駒》言賢者之稱也。伊，指彼也；人，謂賢士。主人欲縶維白駒以留之者，正此伊人。詩凡兩見，曰「於焉逍遙」，曰「於焉嘉客」，皆指此人之儀止。《鄭箋》云：「伊人，斥賢者也。」後世用以婉稱所懷之善士。</p><p><strong>所出</strong>：《詩經 · 白駒》 — https://zh.wikisource.org/wiki/詩經/白駒</p></article></main></div></div>
