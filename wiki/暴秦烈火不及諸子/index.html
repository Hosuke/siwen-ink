    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 暴秦烈火不及諸子</nav></header><main><article><h1>暴秦烈火不及諸子</h1><p>秦火之烈，不及諸子。</p><p>暨於暴秦烈火，勢炎崑岡，而煙燎之毒，不及諸子。逮漢成留思，子政讎校，《七略》芬菲，九流鱗萃，殺青所編，百有八十餘家。</p><p><strong>所出</strong>：《文心雕龍 · 諸子》 — https://zh.wikisource.org/wiki/文心雕龍/諸子</p></article></main></div></div>
