    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 君子所屆</nav></header><main><article><h1>君子所屆</h1><p>君子之來，其至有時。諸侯朝聘，以禮而至也。</p><p>《采菽》次章言「鸞聲嘒嘒，載驂載駟，君子所屆」。屆，至也。君子，指諸侯。言諸侯之來，其旂幟淠淠，鸞聲遠聞，車馬既盛，至於王庭也。《鄭箋》：「屆，極也。」言其至於天子之所，極其恭敬。此與首章「何錫予之」相承，皆言君子來朝之盛、天子錫予之隆也。</p><p><strong>所出</strong>：《詩經 · 采菽》 — https://zh.wikisource.org/wiki/詩經/采菽</p></article></main></div></div>
