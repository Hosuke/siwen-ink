    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 先民有作</nav></header><main><article><h1>先民有作</h1><p>古之聖賢有所興作，後世當法之也</p><p>自古在昔，先民有作。言古之聖賢嘗有所興作，以垂範後世。此商家所以重祭祀、崇禮樂也。[[聖人之治若父母之愛子]]言聖人澤民之旨相近。</p><p><strong>所出</strong>：《詩經 · 那》 — https://zh.wikisource.org/wiki/詩經/那</p></article></main></div></div>
