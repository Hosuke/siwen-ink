    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 郊見五畤</nav></header><main><article><h1>郊見五畤</h1><p>天子初至雍，郊見五畤，後常三歲一郊。</p><p>明年，上初至雍，郊見五畤。後常三歲一郊。是時上求神君，捨之上林中蹄氏觀。又嘗郊雍，獲一角獸，若麃然。有司曰：「陛下肅祗郊祀，上帝報享，錫一角獸，蓋麟云。」於是以薦五畤，畤加一牛以燎。賜諸侯白金，以風符應合於天地。</p><p><strong>所出</strong>：《史記 · 卷012》 — https://zh.wikisource.org/wiki/史記/卷012</p></article></main></div></div>
