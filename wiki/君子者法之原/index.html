    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 君子者法之原</nav></header><main><article><h1>君子者法之原</h1><p>法以君子為本，無君子則法失其用</p><p>法者、治之端也；君子者、法之原也。故有君子，則法雖省，足以遍矣；無君子，則法雖具，失先後之施，不能應事之變，足以亂矣。不知法之義，而正法之數者，雖博臨事必亂。故明主急得其人，而闇主急得其埶。</p><p><strong>所出</strong>：《荀子 · 君道篇》 — https://zh.wikisource.org/wiki/荀子/君道篇</p></article></main></div></div>
