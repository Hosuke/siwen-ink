    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 箴全禦過</nav></header><main><article><h1>箴全禦過</h1><p>箴以全禦過失為義，故文辭貴乎確切。</p><p>箴全禦過，故文資確切；銘兼褒讚，故體貴弘潤。劉勰明二體之辨。箴之用，在乎防範於未形，故辭不可不切；切則能感人，確則能自守。銘之用，在乎褒美於已然，故辭不妨於潤；潤則可傳遠，弘則能動物。二者取事皆必覈以辨，摛文皆必簡而深，此其大要之同者也。</p><p><strong>所出</strong>：《文心雕龍 · 銘箴》 — https://zh.wikisource.org/wiki/文心雕龍/銘箴</p></article></main></div></div>
