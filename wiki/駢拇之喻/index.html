    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 駢拇之喻</nav></header><main><article><h1>駢拇之喻</h1><p>以駢拇枝指喻仁義之屬，非本性固有，實為多餘。</p><p>駢拇者，足趾連併也；枝指者，手有六指也。莊子以為，此二者出乎本性，而世人視為多餘，蓋其侈於德故耳。推而至於仁義，亦若是焉。多方乎仁義而用之，列於五藏之情者，非道德之正，淫僻於仁義之行耳。夫連駢無用之肉，樹無用之指，多駢旁枝之道，非天下之至正也。</p><p><strong>所出</strong>：《莊子 · 駢拇》 — https://zh.wikisource.org/wiki/莊子/駢拇</p></article></main></div></div>
