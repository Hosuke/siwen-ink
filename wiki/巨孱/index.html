    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 巨與孱</nav></header><main><article><h1>巨與孱</h1><p>明君親照境內</p><p>鉅者，齊之居士；孱者，魏之居士。齊、魏之君不明，不能親照境內而聽左右之言，故二子費金璧而求入仕也。</p><p>鉅、孱皆居士，有賢才而不得見用，以君不明於親照境內也。當明君親察，不可以左右之言用人。</p><p><strong>所出</strong>：《韓非子 · 外儲說左下》 — https://zh.wikisource.org/wiki/韓非子/外儲說左下
===孫叔敖===</p></article></main></div></div>
