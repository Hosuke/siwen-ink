    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 晉厲公好讒</nav></header><main><article><h1>晉厲公好讒</h1><p>晉厲公侈淫好讒，欲盡去大臣而立左右。</p><p>晉厲公侈淫，好聽讒人，欲盡去其大臣而立其左右。胥童謂厲公曰：「必先殺三郤。族大多怨，去大族不偪。」公曰：「諾。」</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十</p></article></main></div></div>
