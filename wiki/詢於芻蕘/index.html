    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 詢於芻蕘</nav></header><main><article><h1>詢於芻蕘</h1><p>聖賢問政，不遺賤業者</p><p>詩云「先民有言，詢于芻蕘」，言古之聖賢有所諮問，不以芻蕘之賤而遺之。芻蕘，採薪芻者之賤人也。而聖人折節下問焉。</p><p>蓋[[博學詳說]]之功，兼[[善問者如攻堅木]]之旨。凡有言論，務求集思廣益，不以位之尊而忽卑言之理。芻蕘之言，雖瑣細亦有所長，況天下之務乎？</p><p><strong>所出</strong>：《詩經 · 板》 — https://zh.wikisource.org/wiki/詩經/板</p></article></main></div></div>
