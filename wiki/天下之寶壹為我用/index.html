    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天下之寶壹為我用</nav></header><main><article><h1>天下之寶壹為我用</h1><p>善為政者，能使天下珍寶皆歸己用。</p><p>管子卒章曰：「令有徐疾，物有輕重，然後天下之寶壹為我用。善者用非有，使非人。」此言治世之極功也。不貴己之所有，而能用天下之所無；不設己之所乏，而能使異國之民為我用。號令徐疾之節操，物價輕重之權度，此之謂也。</p><p><strong>所出</strong>：《管子 · 第77篇地數》 — https://zh.wikisource.org/wiki/管子/第77篇地數</p></article></main></div></div>
