    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 冒頓控弦三十萬</nav></header><main><article><h1>冒頓控弦三十萬</h1><p>冒頓自立後，控弦之士三十餘萬，南與中國為敵國。</p><p>冒頓既破東胡，西擊走月氏，南并樓煩、白羊河南王，悉復收秦所使蒙恬所奪匈奴地者。與漢關故河南塞，至朝那、膚施，遂侵燕、代。</p><p>是時漢兵與項羽相距，中原罷於兵革，以故冒頓得自彊，控弦之士三十餘萬。</p><p>自淳維以至頭曼千有餘歲，時大時小，別散分離，尚矣。然至冒頓而匈奴最彊大，盡服從北夷，而南與中國為敵國。</p><p><strong>所出</strong>：《史記 · 卷110》 — https://zh.wikisource.org/wiki/史記/卷110</p></article></main></div></div>
