    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大人與天地合德</nav></header><main><article><h1>大人與天地合德</h1><p>大人之德，與天地日月四時鬼神合其序，聖人之至也。</p><p>文言曰：夫大人者，與天地合其德，與日月合其明，與四時合其序，與鬼神合其吉凶；先天而天弗違，後天而奉天時，天且弗違，而況於人乎？況於鬼神乎？</p><p>聖人之上九，九五之大人也。飛龍在天，乃位乎天德。天德者何？至剛而至正，至純而至粹者也。夫大人之所以為大者，以其德與天合也。先天者，倡之於天之前，而天不違之；後天者，隨之於天之後，而奉天之時。此堯舜所以蕩蕩無能名者也。</p><p><strong>所出</strong>：《周易 · 乾》 — https://zh.wikisource.org/wiki/周易/乾</p></article></main></div></div>
