    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 柱者建天地</nav></header><main><article><h1>柱者建天地</h1><p>器物皆能象天地，人心亦寓天地之理</p><p>柱者，建天地也。</p><p>若碗若盂，若瓶若壺，若甕若盎，皆能建天地。兆龜數蓍，破瓦文石，皆能告吉凶。是知天地萬物成理，一物包焉，物物皆包之，各不相借。</p><p>[[物物皆包]] 萬物各有其理，而皆相互含納，不假外求。 [[成理]] 天地之理寓於萬物之中，故一器一物皆可象天地的之造化。</p><p>是以聖人觀物，見其成理，即知天地之象；兆龜破瓦之占，亦由是以通幽明之情也。</p><p><strong>所出</strong>：《關尹子 · 2》 — https://zh.wikisource.org/wiki/關尹子/2</p></article></main></div></div>
