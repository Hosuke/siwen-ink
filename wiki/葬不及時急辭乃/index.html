    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 葬不及時</nav></header><main><article><h1>葬不及時</h1><p>葬有日而不為雨止，禮也；雨甚乃急，日下稷乃克葬。</p><p>定公十五年，九月，葬我君定公。雨不克葬，葬既有日，不為雨止，禮也。雨不克葬，喪不以制也。</p><p>戊午，日下稷，乃克葬。穀梁子曰：「乃，急辭也，不足乎日之辭也。」葬既有常日，然雨甚不可以日拘，故言「乃」，明其急也。</p><p><strong>所出</strong>：《春秋穀梁傳 · 定公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/定公</p></article></main></div></div>
