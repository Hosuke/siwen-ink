    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 農服田力穡</nav></header><main><article><h1>農服田力穡</h1><p>力穡有秋，勤則有成。</p><p>若農服田力穡，乃亦（有）秋。</p><p>盤庚以農事喻民功。農夫服勤於田畝，力耕深耨，則有秋之可望。民之於王事，亦若是焉。勉力以趨上令，則事成而有功；惰農自安，則[[不服田畝]]，無以致收成。此勸戒臣民勉力從事也。</p><p><strong>所出</strong>：《尚書 · 盤庚上》 — https://zh.wikisource.org/wiki/尚書/盤庚上</p></article></main></div></div>
