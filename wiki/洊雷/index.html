    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 洊雷</nav></header><main><article><h1>洊雷</h1><p>雷聲重疊，威怒相繼。</p><p>洊雷者，疊而至也。震下震上，電訊沓作，聲威相仍，象人君之震動無已也。</p><p>象曰：「洊雷，震；君子以恐懼脩省。」雷聲既作，君子聞之，內懷戒懼，外加省察，以消未形之患也。</p><p><strong>所出</strong>：《周易 · 震》 — https://zh.wikisource.org/wiki/周易/震</p></article></main></div></div>
