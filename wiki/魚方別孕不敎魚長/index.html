    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 魚方別孕不敎魚長</nav></header><main><article><h1>魚方別孕不敎魚長</h1><p>魚方別孕之時而行網罟，是貪無藝也；當順時取物，不可竭澤。</p><p>里革斷宣公之罟而斥之曰：「古者大寒降，土蟄發，水虞講罛罶，取名魚，登川禽而嘗之寢廟。鳥獸孕，水蟲成，獸虞禁罝羅；鳥獸成，水蟲孕，水虞禁罝罜䍡。今魚方別孕，不敎魚長，又行網罟，貪無藝也。」</p><p><strong>所出</strong>：《國語 · 卷04》 — https://zh.wikisource.org/wiki/國語/卷04</p></article></main></div></div>
