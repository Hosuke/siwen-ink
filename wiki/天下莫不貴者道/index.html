    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 天下莫不貴者道</nav></header><main><article><h1>天下莫不貴者道</h1><p>天下莫不貴玉，以其為道之象</p><p>昔者君子比德於玉焉。天下莫不貴者，道也。</p><p>玉之所以為天下所貴，以其為道之象也。《詩》云：「言念君子，溫其如玉。」故君子貴之也。</p><p><strong>所出</strong>：《禮記 · 聘義》 — https://zh.wikisource.org/wiki/禮記/聘義</p></article></main></div></div>
