    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 婦歎于室</nav></header><main><article><h1>婦歎于室</h1><p>征人之妻在家歎息，言其夫久征未歸。</p><p>「鸛鳴于垤，婦歎于室」，以鸛鳴興起而為比興也。鸛之鳴於蟻塚，悅而相呼，室中之人則空自歎息。洒埽穹窒，我征聿至，言妻治室以俟夫歸，而夫之行役亦將至也。情見乎辭，而室家之思切矣。</p><p><strong>所出</strong>：《詩經 · 東山》 — https://zh.wikisource.org/wiki/詩經/東山</p></article></main></div></div>
