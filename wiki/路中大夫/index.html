    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 路中大夫</nav></header><main><article><h1>路中大夫</h1><p>齊使路中大夫馳報天子，被圍不屈，終為三國所殺。</p><p>吳楚反，三國兵圍齊。齊王使路中大夫告於天子。天子令大夫還告齊王：「善堅守，吾兵今破吳楚矣。」大夫至城下，三國兵圍之數重，無從入。三國將劫大夫盟，曰：「若反言漢已破矣，齊趣下三國，不且見屠。」大夫既許之，至城下，望見齊王，曰：「漢已發兵百萬，使太尉周亞夫擊破吳楚，方引兵救齊，齊必堅守無下！」三國將遂誅路中大夫。</p><p><strong>所出</strong>：《史記 · 卷052》 — https://zh.wikisource.org/wiki/史記/卷052</p></article></main></div></div>
