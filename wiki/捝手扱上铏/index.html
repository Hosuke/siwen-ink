    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 捝手扱上铏</nav></header><main><article><h1>捝手扱上铏</h1><p>食至再三，手法各殊，以明食禮之節也</p><p>捝手者，拭手也；扱上铏者，以柶挹取上羹也。公食大夫，賓升席，坐取韭菹以辯擩于醢，行上豆之祭；又以柶扱上铏，辯擩之，行上铏之間祭；然後祭酒。及三飯之時，宰夫執觯漿飲以進，賓捝手而興受。既食則捝手，既受則設豐，禮之先後不容紊也。</p><p><strong>所出</strong>：《儀禮 · 公食大夫禮》 — https://zh.wikisource.org/wiki/儀禮/公食大夫禮</p></article></main></div></div>
