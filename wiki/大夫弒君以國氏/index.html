    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大夫弒君以國氏</nav></header><main><article><h1>大夫弒君以國氏</h1><p>大夫弒君而以國氏者，嫌也。弒而代之，其心不可測。</p><p>大夫弒其君，以國氏者，嫌也。弒而代之也。</p><p>大夫之於其君，固有臣子之分。若弒君而立其嗣或自取之，則不可以常例言之。穀梁以「嫌」釋「以國氏」，言其跡近篡奪而心不可測也。稱國氏以記之，非褒也，正所以著其罪。若及見殺，則大夫亦有以國氏見斥者，如宋萬是也。</p><p><strong>所出</strong>：《春秋穀梁傳 · 莊公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/莊公</p></article></main></div></div>
