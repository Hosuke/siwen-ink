    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 經綸</nav></header><main><article><h1>經綸</h1><p>治絲之事，喻經理天下之政務。</p><p>屯之象辭云：「君子以經綸。」經者，理其絲之縱線；綸者，總合而整理之。君子觀屯卦雲雷未通之象，知天下初定、草昧未明，當如治絲然，次第條理，以成治功。經綸之義，後世引申為經濟天下、匡濟時艱之宏才大略。</p><p><strong>所出</strong>：《周易 · 屯》 — https://zh.wikisource.org/wiki/周易/屯</p></article></main></div></div>
