    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 生之畜之</nav></header><main><article><h1>生之畜之</h1><p>生養萬物，不有、不長、不宰，是謂玄德。</p><p>生之畜之者，長養之道也。帛書本云：「生之畜之，生而弗有，長而弗宰，是胃玄德。」言道生化萬物，天地長養群生，然生之而不以為己有，長之而不加以主宰，是乃玄妙之德也。玄德者，道之玄深功德，生而不有者，萬物皆稟道而生；長而不宰者，聖人法天，輔萬物之自化。天下之德，莫大於此，故稱玄德。侯王守之，萬物自賓也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章十》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
