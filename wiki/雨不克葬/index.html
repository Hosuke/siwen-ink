    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 雨不克葬</nav></header><main><article><h1>雨不克葬</h1><p>葬有日而不為雨止，禮也；雨不克葬，乃喪不以制</p><p>葬我小君頃熊。雨不克葬。葬既有日，不為雨止，禮也。雨不克葬，喪不以制也。</p><p>庚寅，日中而克葬。而，緩辭也，足乎日之辭也。</p><p>按例：既定葬期，不當以雨而改，此常禮也。然雨甚至不能行葬，則是倉促無制，與常禮不同。日中而葬，言其久待，以見其得禮焉。</p><p><strong>所出</strong>：《春秋穀梁傳 · 宣公》 — https://zh.wikisource.org/wiki/春秋穀梁傳/宣公</p></article></main></div></div>
