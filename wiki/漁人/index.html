    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 漁人</nav></header><main><article><h1>漁人</h1><p>中士二人，掌以時漁為梁共王膳羞</p><p>漁人，中士二人，下士四人；府二人，史四人，胥三十人，徒三百人。</p><p>掌以時漁為梁。春獻王鮪。辨魚物，為鮮槁，以共王膳羞。</p><p>凡祭祀、賓客、喪紀，共其魚之鮮槁。凡漁征入于玉府。</p><p><strong>所出</strong>：《周禮 · 天官冢宰》 — https://zh.wikisource.org/wiki/周禮/天官冢宰</p></article></main></div></div>
