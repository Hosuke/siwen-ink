    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 觀空亦空</nav></header><main><article><h1>觀空亦空</h1><p>內觀無心、外觀無形、遠觀無物，三者既悟唯見於空，觀空亦空以至無無</p><p>能遣之者，內觀於心，心無其心；外觀於形，形無其形；遠觀於物，物無其物。三者既悟，唯見於空。觀空亦空，空無所空；所空既無，無無亦無；無無既無，湛然常寂；寂無所寂，慾豈能生？</p><p>此[[遣慾澄心]]之究竟功夫，由遣慾而至無心，由無心而至無物，由無物而至見空，由空而至無空、無無，層層遣遣，終入湛然常寂之境。</p><p><strong>所出</strong>：《太上老君說常清靜經》 — https://zh.wikisource.org/wiki/太上老君說常清靜經</p></article></main></div></div>
