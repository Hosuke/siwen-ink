    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 哭踊有節</nav></header><main><article><h1>哭踊有節</h1><p></p><p>「哭踊有節」出自《禮記·檀弓上》，為喪禮中哭泣頓足之節制原則。文中記載：</p><p>「弁人有其母死而孺子泣者，孔子曰：『哀則哀矣，而難為繼也。夫禮，為可傳也，為可繼也。故哭踊有節。』」</p><p>孔子評論此事，謂：「哀痛之情雖真，然難以為繼。禮之為物，在於可傳、可繼，故哭踊必當有節。」</p><p>此乃儒家論喪禮之要義：情貴真摯，然亦需節制有度，使禮儀可持久而行。蓋三年之喪為時甚長，若哀毀過甚，則儀節無以為繼。此與《論語》所記「哀而不傷」之旨相通。[[三年之喪]]、 [[天下之達喪]] 皆依此節制之義而立。</p></article></main></div></div>
