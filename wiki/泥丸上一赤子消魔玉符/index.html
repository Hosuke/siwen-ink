    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 大洞泥丸天帝君上一赤子消魔玉符</nav></header><main><article><h1>大洞泥丸天帝君上一赤子消魔玉符</h1><p>書符佩帶以朱書黃繒，存呼赤子內諱，鎮護泥丸，令死氣沉藏、七祖昇騰之秘符也。</p><p>大洞泥丸天帝君上一赤子消魔玉符，出上清大洞真經第八章。</p><p>脩是符者，以朱書黃繒佩之。存呼赤子玄凝天之內諱名字，鎮兆泥丸九孔之戶死炁之門，令死氣沉藏，而七祖父母解脫宿罪，昇騰上宴帝堂。</p><p>脩是符者，當叩齒九通，咽液三過。符與呪相須，以固魂魄、保長生。</p><p><strong>所出</strong>：《上清大洞真經 · 8章》 — https://zh.wikisource.org/wiki/上清大洞真經/8章</p></article></main></div></div>
