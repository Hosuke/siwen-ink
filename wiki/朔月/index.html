    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 朔月童子执帚</nav></header><main><article><h1>朔月童子执帚</h1><p>月朔之日，童子執帚掃室以行奠。</p><p>朔月，童子執帚，卻之，左手奉之，從徹者而入。比奠，舉席，掃室，聚諸㝔，布席如初。燕養饋羞湯沐之饌，如他日。朔月若薦新，則不饋于下室。朔月者，月之初一也。</p><p><strong>所出</strong>：《儀禮 · 既夕禮》 — https://zh.wikisource.org/wiki/儀禮/既夕禮</p></article></main></div></div>
