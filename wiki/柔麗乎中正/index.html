    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 柔麗乎中正</nav></header><main><article><h1>柔麗乎中正</h1><p>柔者麗於中正之道，故能亨通。</p><p>柔麗乎中正，故亨。</p><p>柔者陰爻，麗者依附。中正者，兼得中道與正位之義。六五以柔居中，上下皆麗乎此，故能亨通。畜牝牛吉者，取其柔順溫厚，以配離之明德也。</p><p><strong>所出</strong>：《周易 · 離》 — https://zh.wikisource.org/wiki/周易/離</p></article></main></div></div>
