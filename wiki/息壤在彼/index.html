    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 息壤在彼</nav></header><main><article><h1>息壤在彼</h1><p>王與甘茂盟於息壤，茂引以為信，終遂拔宜陽。言約誓既定，不可自渝。</p><p>甘茂至秦，王問其故。對曰：「宜陽大縣，難以拔之。昔曾參之母，三人而疑之。今臣之賢不若曾參，王之信臣又不如曾參之母，疑臣者非止三人，臣恐大王之投杼也。」王曰：「寡人不聽也，請與子盟。」卒使丞相甘茂將兵伐宜陽。五月而不拔，樗里子、公孫奭果爭之。武王召甘茂，欲罷兵。甘茂曰：「息壤在彼。」王曰：「有之。」因大悉起兵，使甘茂擊之。斬首六萬，遂拔宜陽。</p><p><strong>所出</strong>：《史記 · 卷071》 — https://zh.wikisource.org/wiki/史記/卷071</p></article></main></div></div>
