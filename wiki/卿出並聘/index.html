    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 卿出並聘</nav></header><main><article><h1>卿出並聘</h1><p>國君初立，卿當出聘諸侯，修舊好、結外援，以衛社稷，此忠信卑讓之道。</p><p>穆伯如齊，始聘焉，禮也。凡君即位，卿出並聘，踐脩舊好，要結外援，好事鄰國，以衛社稷，忠信卑讓之道也。忠，德之正也。信，德之固也。卑讓，德之基也。</p><p><strong>所出</strong>：《春秋左氏傳 · 文公》 — https://zh.wikisource.org/wiki/春秋左氏傳/文公</p></article></main></div></div>
