    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 魚質龍文</nav></header><main><article><h1>魚質龍文</h1><p>形似而非，華而不實</p><p>[[抱朴子]]設魚龍之喻以諷世之不肖。其言曰：「夫魚質龍文，似是而非，遭水而喜，見獺即悲。雖臨之以斧鋮之威，誘之以傾城之寶，猶不能奪鉛鋒於犀兕，聘駑蹇以追風。」言人之才不副位，貌合神離，終不可以力假也。夫質未充而文已著者，猶魚之不可以為龍，卒遇水激，未有不溺者矣。世之竊祿竊位者，皆魚質龍文之徒，不可不察也。</p><p><strong>所出</strong>：《抱朴子 · 卷34》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷34</p></article></main></div></div>
