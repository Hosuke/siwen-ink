    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 禘</nav></header><main><article><h1>禘</h1><p>天子祭天於上帝，以其祖配之之祭也。</p><p>有虞氏禘黃帝而郊嚳，祖顓頊而宗堯。夏後氏禘黃帝而郊鯀，祖顓頊而宗禹。殷人禘嚳而郊冥，祖契而宗湯。周人禘嚳而郊稷，祖文王而宗武王。七代之所以更立者，禘、郊、宗、祖，其餘不變也。</p><p><strong>所出</strong>：《禮記 · 祭法》 — https://zh.wikisource.org/wiki/禮記/祭法</p></article></main></div></div>
