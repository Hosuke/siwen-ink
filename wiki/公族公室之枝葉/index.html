    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 公族公室之枝葉</nav></header><main><article><h1>公族公室之枝葉</h1><p>宋樂豫以葛藟庇本根喻公族，諫昭公勿去群公子，否則本根無所庇。</p><p>夏，四月，宋成公卒。昭公將去群公子，樂豫曰：「不可。公族，公室之枝葉也，若去之，則本根無所庇陰矣，葛藟猶能庇其本根，故君子以為比，況國君乎？」</p><p><strong>所出</strong>：《春秋左氏傳 · 文公》 — https://zh.wikisource.org/wiki/春秋左氏傳/文公</p></article></main></div></div>
