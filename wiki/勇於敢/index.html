    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 勇於敢</nav></header><main><article><h1>勇於敢</h1><p>敢於強為者致殺，敢於柔弱者獲活，天道好還之義也。</p><p>，老子以「敢」與「不敢」對舉，言勇於強為敢作，其究至於殺身。[[勇於不敢則活]]條已收於文庫，此條言敢者之害，相須而備文。帛書雲：「勇於敢則殺，勇於不敢則栝。」栝者，活也。言敢於強暴者必亡，敢於柔弱者乃存。夫強梁者不得其死，[[強梁者不得其死]]備矣。而天道不言，善應萬物；不召自來，單而善謀。是故聖人觀天之道，知敢之害、不敢之利，故不敢而為敢，卒以全生。</p><p><strong>所出</strong>：《老子 (帛書本) · 章七十三》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
