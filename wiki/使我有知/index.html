    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 使我有知</nav></header><main><article><h1>使我有知</h1><p>假令己有知，則當行大道。</p><p>使我介然有知者，若使吾真有所知，則其知將何用邪？老子以為，有知者不行大道則已，苟行大道，當知所畏者惟在「施」為。</p><p>何以言之？人之所施，政令賞罰威福皆是也。施之一念，足以覆邦亡身。是以聖人行大道之時，於施之敢為、施之放縱，深知戒懼。此無他，以其近於盜夸、非道之漸也。</p><p>若無所知而妄施，則民好徑而大道荒蕪之象生矣。</p><p><strong>所出</strong>：《道德經 (王弼本) · 五十三章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
