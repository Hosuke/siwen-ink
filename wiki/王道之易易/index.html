    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 王道之易易</nav></header><main><article><h1>王道之易易</h1><p>觀鄉里禮儀之詳備，則知王道不難行也。</p><p>吾觀於鄉，而知王道之易易也。主人親速賓及介，主人拜賓及介而衆賓皆入，是貴賤之義別矣。三揖至于階，三讓以賓升，拜至獻酬，辭讓之節繁。工入升歌，笙入，閒歌，合樂，工告樂備，二人揚觶乃立司正。行此禮者，足以知其能和樂而不流，弟長而無遺，安燕而不亂。五行者，足以正身安國，彼國安而天下安。</p><p><strong>所出</strong>：《荀子 · 樂論篇》 — https://zh.wikisource.org/wiki/荀子/樂論篇</p></article></main></div></div>
