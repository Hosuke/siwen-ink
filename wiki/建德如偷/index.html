    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 建德如偷</nav></header><main><article><h1>建德如偷</h1><p>立德之初，若竊然不昭，以明積德之義。</p><p>建德如偷，言始立其德，若[[慎終如始]]，潛滋暗長，不敢以顯也。德之建也，若偷竊然不自張大，乃能[[積善成德]]，終獲全德。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第三章 聞道》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
