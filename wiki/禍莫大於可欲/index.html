    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 禍莫大於可欲</nav></header><main><article><h1>禍莫大於可欲</h1><p>可欲誘邪心，邪心勝則事經絶，禍難生焉。</p><p>人有欲則計會亂，計會亂而有欲甚，有欲甚則邪心勝，邪心勝則事經絶，事經絶則禍難生。由是觀之，禍難生於邪心，邪心誘於可欲。可欲之類，進則教良民爲姦，退則令善人有禍；姦起則上侵弱君，禍至則民人多傷。然則可欲之類，上侵弱君而下傷人民。夫上侵弱君而下傷人民者，大罪也。故曰：「禍莫大於可欲。」是以聖人不引五色，不淫於聲樂，明君賤玩好而去淫麗。</p><p><strong>所出</strong>：《韓非子 · 解老》 — https://zh.wikisource.org/wiki/韓非子/解老</p></article></main></div></div>
