    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 養生五味</nav></header><main><article><h1>養生五味</h1><p>五味偏多各有所傷，不可不慎。</p><p>五味入口，不欲偏多，故酸多傷脾，苦多傷肺，辛多傷肝，鹹多則傷心，甘多則傷腎，此五行自然之理也。</p><p><strong>所出</strong>：《抱朴子 · 卷13》 — https://zh.wikisource.org/wiki/抱朴子/卷13</p></article></main></div></div>
