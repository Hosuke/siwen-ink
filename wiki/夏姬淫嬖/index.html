    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 夏姬淫嬖</nav></header><main><article><h1>夏姬淫嬖</h1><p>夏姬以美色煽亂陳國，致陳靈公被弒，陳遂以亡。</p><p>靈公與其大夫孔寧、儀行父皆通於夏姬，衷其衣以戲於朝。泄冶諫曰：「君臣淫亂，民何效焉？」靈公以告二子，二子請殺泄冶，公弗禁，遂殺泄冶。十五年，靈公與二子飲於夏氏。公戲二子曰：「徵舒似汝。」二子曰：「亦似公。」徵舒怒。靈公罷酒出，徵舒伏弩廏門射殺靈公。孔寧、儀行父皆奔楚，靈公太子午奔晉。徵舒自立為陳侯。徵舒，故陳大夫也。夏姬，御叔之妻，舒之母也。</p><p><strong>所出</strong>：《史記 · 卷036》 — https://zh.wikisource.org/wiki/史記/卷036</p></article></main></div></div>
