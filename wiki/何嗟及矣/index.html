    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 何嗟及矣</nav></header><main><article><h1>何嗟及矣</h1><p>悔之無及之歎也</p><p>何嗟及矣，[[詩經·中谷有蓷]]末章之辭也。</p><p>言「啜其泣矣」，泣之不已，卒章乃曰「何嗟及矣」。及，至也。言追歎已往，嗟之何及，至此之時，悔之晚矣。</p><p>三章之序：嘅其歎者，歎時之艱也；條其歗者，咎人之惡也；啜其泣者，自傷之深也。及其終也，則悔而無及矣。物先枯而後仳離，仳離而後泣，泣而後悔，章法井然。</p><p>後世以「嗟及」表示追悔莫及，皆承此義。</p><p><strong>所出</strong>：《詩經 · 中谷有蓷》 — https://zh.wikisource.org/wiki/詩經/中谷有蓷</p></article></main></div></div>
