    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 為而弗有</nav></header><main><article><h1>為而弗有</h1><p>聖人作為而不以為己有</p><p>聖人為而弗有，成功而弗居。</p><p>「弗有」者，絕不據之以為己有也。通行本作「不有」，帛書作「弗有」。「弗」者，否定之助動詞，語意較「不」更決絕，蓋言聖人自始終不以此為有，其心淡然若無。</p><p>夫聖人為政以道，化民以德，初非有心求有也。有之者，民自然而歸之；弗有者，聖人外之而不留。此無為之至也。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第四十二章 天道》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
