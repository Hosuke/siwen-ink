    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 輕重魚鹽之利</nav></header><main><article><h1>輕重魚鹽之利</h1><p></p><p>「通於侈靡，而士可戚。」又曰：「本事不得立。」本善而末事起，不侈，本事不得立。選賢舉能不可得，惡得伐不服用？國富而鄙貧，莫盡如市。市也者，勸也，勸者所以起。通魚鹽之利，達輕重之術，使商賈流通，財貨周遍，則民富而國强。</p><p><strong>所出</strong>：《管子 · 第35篇侈靡》 — https://zh.wikisource.org/wiki/管子/第35篇侈靡</p></article></main></div></div>
