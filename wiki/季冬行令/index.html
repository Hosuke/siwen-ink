    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 季冬行令</nav></header><main><article><h1>季冬行令</h1><p>季冬有令，行之則治，逆之則凶。</p><p>季冬行秋令，則白露蚤降，介蟲為妖，四鄰入保。行春令，則胎夭多傷，國多固疾，命之曰逆。行夏令，則水潦敗國，時雪不降，冰凍消釋。</p><p>行之是令，此謂一終，三旬二日。</p><p>明於天時，審於人事，斯治國之道也。[[孟春行夏令]]之變，皆此類也。</p><p><strong>所出</strong>：《呂氏春秋 · 卷十二》 — https://zh.wikisource.org/wiki/呂氏春秋/卷十二</p></article></main></div></div>
