    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 道不可有</nav></header><main><article><h1>道不可有</h1><p>道之為名，所假而行，不可執有，亦不可淪無。</p><p>大公調論道曰：「道之為名，所假而行。或使莫為，在物一曲，夫胡為於大方？言而足，則終日言而盡道；言而不足，則終日言而盡物。道物之極，言默不足以載；非言非默，議有所極。」蓋道不可得而物亦不可遺，二者相待而立，執一端以論道，皆失之偏也。</p><p><strong>所出</strong>：《莊子 · 則陽》 — https://zh.wikisource.org/wiki/莊子/則陽</p></article></main></div></div>
