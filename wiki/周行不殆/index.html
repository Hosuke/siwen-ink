    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 周行不殆</nav></header><main><article><h1>周行不殆</h1><p>道周流萬物而無已時</p><p>「周行而不殆」，言道之為物，周流六虛，遍行天下，而未嘗一息之間斷也。萬物資之以生，恃之以成，而道未嘗有所倦怠爾。</p><p><strong>所出</strong>：《道德經 (王弼本) · 二十五章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
