    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 寢兵之說勝</nav></header><main><article><h1>寢兵之說勝</h1><p>廢武備則城郭毀、邊防弛，敵至莫之守。</p><p>人君聽寢兵之說，則羣臣賓客莫敢言兵。內不知國之治亂，外不知諸侯強弱。如是則城郭毀壞，莫之築補；甲弊兵彫，莫之脩繕。守圉之備既毀，遼遠之地謀、邊竟之士脩，百姓皆無圉敵之心。故「寢兵之說」一行，則險阻不守，而國隨以危。</p><p><strong>所出</strong>：《管子 · 第65篇立政九敗解》 — https://zh.wikisource.org/wiki/管子/第65篇立政九敗解</p></article></main></div></div>
