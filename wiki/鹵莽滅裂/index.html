    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 鹵莽滅裂</nav></header><main><article><h1>鹵莽滅裂</h1><p>治民不可鹵莽，亦不可滅裂，當深耕熟耨。</p><p>長梧封人問子牢曰：「君為政焉勿鹵莽，治民焉勿滅裂。昔予為禾，耕而鹵莽之，則其實亦鹵莽而報予；芸而滅裂之，其實亦滅裂而報予。予來年變齊，深其耕而熟耰之，其禾蘩以滋，予終年厭飧。」莊子聞之曰：「今人之治其形，理其心，多有似封人之所謂，遁其天，離其性，滅其情，亡其神，以衆為。」</p><p><strong>所出</strong>：《莊子 · 則陽》 — https://zh.wikisource.org/wiki/莊子/則陽</p></article></main></div></div>
