    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 宋榮子猶然笑之</nav></header><main><article><h1>宋榮子猶然笑之</h1><p>定乎內外之分，辨乎榮辱之境，未數數然也。</p><p>故夫知效一官，行比一鄉，德合一君，而徵一國者，其自視也亦若此矣。而宋榮子猶然笑之。且舉世而譽之而不加勸，舉世而非之而不加沮，定乎內外之分，辨乎榮辱之境，斯已矣。彼其於世，未數數然也。雖然，猶有未樹也。</p><p>宋榮子能超然於毀譽之外，定內外之分，然猶未能樹立至德之境，尚未能及無待之逍遙也。</p><p><strong>所出</strong>：《莊子 · 逍遙遊》 — https://zh.wikisource.org/wiki/莊子/逍遙遊</p></article></main></div></div>
