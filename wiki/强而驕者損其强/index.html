    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 强而驕者損其强，弱而驕者亟死亡</nav></header><main><article><h1>强而驕者損其强，弱而驕者亟死亡</h1><p>强弱皆不可驕，驕則必敗。</p><p>强而驕者損其强，弱而驕者亟死亡。强而卑，義信其强。弱而卑，義免於罪。是故驕之餘卑，卑之餘驕。</p><p><strong>所出</strong>：《管子 · 第38篇白心》 — https://zh.wikisource.org/wiki/管子/第38篇白心</p></article></main></div></div>
