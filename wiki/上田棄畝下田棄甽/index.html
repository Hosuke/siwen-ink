    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 上田棄畝下田棄甽</nav></header><main><article><h1>上田棄畝下田棄甽</h1><p>述田畝之耕法。</p><p>上田棄畝，下田棄甽。五耕五耨，必審以盡。其深殖之度，陰土必得，大草不生，又無螟蜮。今茲美禾，來茲美麥。是以六尺之耜，所以成畝也；其博八寸，所以成甽也；耨柄尺，此其度也；其耨六寸，所以間稼也。地可使肥，又可使棘。人肥必以澤，使苗堅而地隙；人耨必以旱，使地肥而土緩。</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十六》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十六</p></article></main></div></div>
