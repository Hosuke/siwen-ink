    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 我欲仁，斯仁至矣</nav></header><main><article><h1>我欲仁，斯仁至矣</h1><p>仁由心作。</p><p>[[孔子]]言[[仁遠乎哉]]？我欲仁，斯仁至矣。[[仁]]不遠，在吾心耳。欲之即至，所貴[[誠意]]者也。[[聖人]]言仁者[[求之在己]]，非待外求，亦[[為仁由己]]之義也。</p><p><strong>所出</strong>：《論語 · 述而第七》 — https://zh.wikisource.org/wiki/論語/述而第七</p></article></main></div></div>
