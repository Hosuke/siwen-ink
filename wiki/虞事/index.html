    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 虞事</nav></header><main><article><h1>虞事</h1><p>葬後日中，行於祖廟，以安死者之祭也。</p><p>虞事者，士喪既葬，返虞於廟之祭也。士虞禮《記》述再虞之辭曰：「哀薦虞事。」三虞之辭亦如之，曰「哀薦虞事」。又云：「始虞用柔日。」柔日者，乙、丁、己、辛、癸也。葬後日中而行事，殺於廟門西，主人不視。陳牲北首西上，豚解，升左肩、臂、臑、肫、胳、脊、脅，離肺。設扃鼏，鼎俎皆具。迎尸入室，祝辭稱「哀子某，哀顯相」，以「尚饗」終之。此皆虞事之要義也。</p><p><strong>所出</strong>：《儀禮 · 士虞禮》 — https://zh.wikisource.org/wiki/儀禮/士虞禮</p></article></main></div></div>
