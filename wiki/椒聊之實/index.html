    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 椒聊之實</nav></header><main><article><h1>椒聊之實</h1><p>椒實蕃衍，興喻子孫昌盛。</p><p>椒，木名，生於山谷，秋時結實，蒴赤如火，芳香辛烈。一株之實，累累盈升。《詩》取以起興，言「椒聊之實，蕃衍盈升」。</p><p>盈升者，言其多也；匊亦盈匊，義同。椒聊之實如此，則其根深故也。以況君子有子孫之道焉。根深者末必盛，猶椒之實蕃衍盈升，其子亦將碩大而無朋，是以其福未有涯也。</p><p>舊說以為美沃之盛彊，知其蕃衍盛大，子孫將有晉國。蓋子孫之盛，由積德而致，積善之家，必有餘慶也。</p><p><strong>所出</strong>：《詩經 · 椒聊》 — https://zh.wikisource.org/wiki/詩經/椒聊</p></article></main></div></div>
