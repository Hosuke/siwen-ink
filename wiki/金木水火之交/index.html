    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 金木水火之交</nav></header><main><article><h1>金木水火之交</h1><p>金木乃水火之交，化生之關鍵</p><p>愛執而觀因之為木，觀存而愛攝之為金。先想乎一元之氣具乎一物，執愛之以合彼之形，冥觀之以合彼之理，則象存焉。</p><p>木之為物，鑽之得火，絞之得水。金之為物，擊之得火，鎔之得水。金木者，水火之交也。</p><p>[[金木水火之交]] 木可生火（鉆之得火），木亦可生水（絞之得水）；金可生火（擊之得火），金亦可生水（鎔之得水）。金與木皆水火相交之象，故為化生之關鍵。</p><p><strong>所出</strong>：《關尹子 · 2》 — https://zh.wikisource.org/wiki/關尹子/2</p></article></main></div></div>
