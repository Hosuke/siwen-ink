    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 秦女楚珠</nav></header><main><article><h1>秦女楚珠</h1><p>劉勰以秦女嫁晉與楚珠鬻鄭二事喻文浮於理之弊，警示形式不可勝本。</p><p>昔秦女嫁晉，從文衣之媵，晉人貴媵而賤女；楚珠鬻鄭，為薰桂之櫝，鄭人買櫝而還珠。若文浮於理，末勝其本，則秦女楚珠，復存於茲矣。</p><p><strong>所出</strong>：《文心雕龍 · 議對》 — https://zh.wikisource.org/wiki/文心雕龍/議對</p></article></main></div></div>
