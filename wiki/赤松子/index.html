    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 赤松子</nav></header><main><article><h1>赤松子</h1><p>神農時雨師，服水玉，乘煙上下，後世雨師本焉。</p><p>赤松子者，神農時雨師也。服水玉以教神農，能入火自焚。</p><p>至崑崙山，常止西王母石室中，隨風雨上下。炎帝少女追之，亦得仙俱去。</p><p>至高辛時，復為雨師。今之雨師本是焉。</p><p>《丹臺錄》云：為昆林仙伯，治南嶽山。</p><p>《抱朴子》云：赤松子以玄蠱血漬玉為水而服之，故得乘煙上下也。玉屑服之與水餌，皆令人不死。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 3》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/3</p></article></main></div></div>
