    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 才性異區，文辭繁詭</nav></header><main><article><h1>才性異區，文辭繁詭</h1><p>人之才性各有分區，故文章風格千變萬詭，不可一概而論。</p><p>才性異區，故文辭繁詭。稟賦既殊，薰習亦異，是以辭為肌膚之根，志實骨髓之主。雅麗如黼黻之飾，淫巧則朱紫不分；修學可以凝真，而成功在於漸靡。蓋才性之區既殊，則文辭之詭自出，非有他也，自然之理然耳。</p><p><strong>所出</strong>：《文心雕龍 · 體性》 — https://zh.wikisource.org/wiki/文心雕</p></article></main></div></div>
