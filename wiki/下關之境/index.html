    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 下關之境</nav></header><main><article><h1>下關之境</h1><p>人身下半部之稱，白素右元君所主治者。</p><p>下關之境者，人身小腹以下至腳底之總名也。白素右元君主之，從小腹至腳底悉其所治。凡下元之穢、地戶之鬼、三積之宿殃，皆由此境而生。修大洞第二十四章，正以清此境之濁，令明玉之液上淘極陰之宮，素金之炁逆充兩腕，髀受九靈之潤，腳生重玄之雲，是為還清下元之要途也。</p><p><strong>所出</strong>：《上清大洞真經 · 24章》 — https://zh.wikisource.org/wiki/上清大洞真經/24章</p></article></main></div></div>
