    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 一年之計莫如樹穀</nav></header><main><article><h1>一年之計莫如樹穀</h1><p>治國當遠近兼顧，以人為本。</p><p>上恃龜筴，好用巫醫，則鬼神驟祟。故功之不立，名之不章，為之患者三：有獨王者，有貧賤者，有日不足者。</p><p>一年之計，莫如樹穀；十年之計，莫如樹木；終身之計，莫如樹人。</p><p>一樹一獲者，穀也；一樹十獲者，木也；一樹百獲者，人也。</p><p>我苟種之，如神用之，舉事如神，唯王之門。</p><p><strong>所出</strong>：《管子 · 第03篇權修》 — https://zh.wikisource.org/wiki/管子/第03篇權修</p></article></main></div></div>
