    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 忠臣死於非罪</nav></header><main><article><h1>忠臣死於非罪</h1><p>忠臣死於非罪，邪臣起於非功</p><p>忠臣明法術以治天下，姦邪之臣知法術明之必治也，治則姦臣困而法術之士顯。姦邪在主之側者，不能勿惡，必候主間而日夜危之。忠臣無罪而困死，姦臣無功而富貴。
<strong>所出</strong>：《管子 · 第67篇明法解》 — https://zh.wikisource.org/wiki/管子/第67篇明法解</p></article></main></div></div>
