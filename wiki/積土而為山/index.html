    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 積土而為山</nav></header><main><article><h1>積土而為山</h1><p>積微成著，累小以高大；聖人之所以為聖人，亦由積而至。</p><p>積土成山之喻，出《荀子 · 儒效篇》。篇云：「故積土而為山，積水而為海，旦暮積謂之歲。」</p><p>又云：「彼求之而後得，為之而後成，積之而後高，盡之而後聖。故聖人也者，人之所積也。」</p><p>人之善亦然。塗之人百姓積善而全盡，謂之聖人。農夫積耨耕，工匠積斲削，商賈積反貨，君子積禮義。皆由日積月累而至，非一朝一夕之功也。</p><p><strong>所出</strong>：《荀子 · 儒效篇》 — https://zh.wikisource.org/wiki/荀子/儒效篇</p></article></main></div></div>
