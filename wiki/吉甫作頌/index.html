    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 吉甫作頌</nav></header><main><article><h1>吉甫作頌</h1><p>吉甫作詩以贈申伯，其詩孔碩，其風肆好。</p><p>「吉甫作誦，其詩孔碩。其風肆好，以贈申伯」，言 [[文武吉甫]] 作此詩以美申伯也。詩之義理廣大，故曰孔碩；詩之音律暢美，故曰肆好。吉甫之誦，專以 [[柔惠且直]] 之美德相贈，[[周邦咸喜]]，而斯頌之作焉。</p><p><strong>所出</strong>：《詩經 · 崧高》 — https://zh.wikisource.org/wiki/詩經/崧高</p></article></main></div></div>
