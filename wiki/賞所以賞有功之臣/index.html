    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 賞所以賞有功之臣</nav></header><main><article><h1>賞所以賞有功之臣</h1><p>賞有等差，義導教化者上賞，教善彊賢者次賞，拂過拂欲者末賞。</p><p>晉文公反國，賞從亡者，而陶狐不與。左右曰：「君反國家，爵祿三出，而陶狐不與。敢問其說。」文公曰：「輔我以義、導我以禮者，吾以為上賞。教我以善、彊我以賢者，吾以為次賞。拂吾所欲、數舉吾過者，吾以為末賞。三者所以賞有功之臣也。若賞唐國之勞徒，則陶狐將為首矣。」</p><p>[[賞賢罰暴]]，賞行博則多助。晉文公亡久矣，歸而因大亂之餘，猶能以霸，其由此歟？</p><p><strong>所出</strong>：《呂氏春秋 · 卷二十四》 — https://zh.wikisource.org/wiki/呂氏春秋/卷二十四</p></article></main></div></div>
