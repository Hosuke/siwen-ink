    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 才全</nav></header><main><article><h1>才全</h1><p>死生存亡不失其和，接物而生時乎心，此才之全也。</p><p>哀公問：「何謂才全？」仲尼曰：「死生存亡、窮達貧富、賢與不肖、毀譽、飢渴、寒暑，是事之變，命之行也，日夜相代乎前，而知不能規乎其始者也，故不足以滑和，不可入於靈府。使之和豫通而不失於兌，使日夜無郤而與物為春，是接而生時乎心者也，是之謂才全。」</p><p><strong>所出</strong>：《莊子 · 德充符》 — https://zh.wikisource.org/wiki/莊子/德充符</p></article></main></div></div>
