    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 極睇參差學家之壯觀</nav></header><main><article><h1>極睇參差學家之壯觀</h1><p>極睇參差，亦學家之壯觀。</p><p>洽聞之士，宜撮綱要，覽華而食實，棄邪而採正，極睇參差，亦學家之壯觀也。</p><p><strong>所出</strong>：《文心雕龍 · 諸子》 — https://zh.wikisource.org/wiki/文心雕龍/諸子</p></article></main></div></div>
