    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 心術</nav></header><main><article><h1>心術</h1><p>存心處事之法，施恕度物，發號施令之本也。</p><p>心術者，實也、誠也、厚也、施也、度也、恕也，謂之心術。</p><p>《管子》以為，不明於心術而欲行令於人，猶倍招而必拘之。言背射而求必中，拂人情而強致之，終不可得。布令必行，不知心術不可。</p><p><strong>所出</strong>：《管子 · 七法》 — https://zh.wikisource.org/wiki/管子/七法/七法</p></article></main></div></div>
