    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 知鬼名制鬼</nav></header><main><article><h1>知鬼名制鬼</h1><p>知鬼之名，則鬼不敢犯，三呼其名，鬼氣即絕。</p><p>道言鬼有姓名，人知其名，則邪不敢前。凡呼其名，鬼炁即絕，天鬼來下，地鬼並煞。子知三台鬼名，萬鬼使令。</p><p>一知鬼名，邪不敢前，三呼其鬼名，鬼炁即絕，天鬼來下、地鬼並煞。凡鬼皆有姓名，子知三台鬼名，萬鬼使令。</p><p><strong>所出</strong>：《女青鬼律 · 卷2》 — https://zh.wikisource.org/wiki/女青鬼律/卷2</p></article></main></div></div>
