    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 隨俗為變</nav></header><main><article><h1>隨俗為變</h1><p>扁鵲行醫隨地之俗，見貴則為帶下醫，見愛老人則為耳目痹醫，見愛小兒則為小兒醫。</p><p>扁鵲名聞天下。過邯鄲，聞貴婦人，即為帶下醫；過雒陽，聞周人愛老人，即為耳目痹醫；來入咸陽，聞秦人愛小兒，即為小兒醫：隨俗為變。秦太醫令李醯自知伎不如扁鵲也，使人刺殺之。</p><p><strong>所出</strong>：《史記 · 卷105》 — https://zh.wikisource.org/wiki/史記/卷105</p></article></main></div></div>
