    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 搤亢拊背</nav></header><main><article><h1>搤亢拊背</h1><p>扼其要害，擊其不備。</p><p>婁敬說高帝都關中，曰：「與人鬥，不搤其亢，拊其背，未能全其勝也。今陛下入關而都，案秦之故地，此亦搤天下之亢而拊其背也。」亢者，要害之地；背者，不備之處。言據形勢之勝者，必先扼敵之咽喉，擊其無備之地，方能全師而勝。婁敬以關中四塞之固，比之搤亢拊背，謂漢室都之，可以制馭天下矣。</p><p><strong>所出</strong>：《史記 · 卷099》 — https://zh.wikisource.org/wiki/史記/卷099</p></article></main></div></div>
