    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 右手通真之戶</nav></header><main><article><h1>右手通真之戶</h1><p>右手之戶，死炁之門對，生門也。</p><p>右手通真之戶者，人身門戶之一，與左手死炁之門相對。修真者右手通真之戶，乃生炁所出、死炁所不入之處。</p><p>月中桃君名方盈，常守兆右手通真之戶死炁之門，使兆四運通明、三神固精、保鎮萬炁。修真者存思月暉之炁，自右膀、玉莖、尾閭、脊骨、泥丸、右目、臂髓，終入右手通真之戶。</p><p>又有硃書青繒玉符佩之，存呼桃君內諱名字，叩齒三通，咽液三過，以鎮此戶。</p><p><strong>所出</strong>：《上清大洞真經 · 26章》 — https://zh.wikisource.org/wiki/上清大洞真經/26章</p></article></main></div></div>
