    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 案延昌</nav></header><main><article><h1>案延昌</h1><p>結中青炁君之姓，字合和嬰。</p><p>案延昌者，玉清上皇中極寶景王祝所言[^1]結中青炁之號也。隱存雌雄，玄洞四鄉，結中乃有此[^2]青炁凝結，號曰案延昌。號延昌者，取其延命長昌之義，與和嬰、理命永長、玄歸、胎神、慶玄血神相配合，共成[^3]玄洞之結神體系。修之則[^4]玄歸[^5]胎[^6]神名固[^7]內，慶玄[^8]血神[^9]牢張，日[^10]成真而[^11]飛仙[^12]雲京矣。</p><p>  <strong>所出</strong>：《上清大洞真經 · 4章》 — https://zh.wikisource.org/wiki/上清大洞真經/4章</p></article></main></div></div>
