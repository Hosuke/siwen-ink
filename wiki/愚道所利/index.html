    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 愚道所利</nav></header><main><article><h1>愚道所利</h1><p>愚者悅於目悅於心，有道者則避之。</p><p>老子曰：「悅於目，悅於心，愚道所利，有道者之所避。」</p><p>言愚者見可欲之物，悅目而賞心，不知其為害；惟有道者能洞察其非，審而避之，不以耳目之欲累其心矣。</p><p><strong>所出</strong>：《文子 · 卷七》 — https://zh.wikisource.org/wiki/文子/卷七</p></article></main></div></div>
