    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 刀閒用奴逐利</nav></header><main><article><h1>刀閒用奴逐利</h1><p>刀閒愛貴桀黠奴，逐漁鹽商賈之利，起富數千萬。</p><p>齊俗賤奴虜，而刀閒獨愛貴之。桀黠奴，人之所患也，唯刀閒收取，使之逐漁鹽商賈之利，或連車騎，交守相，然愈益任之。終得其力，起富數千萬。故曰「寧爵毋刀」，言其能使豪奴自饒而盡其力。</p><p><strong>所出</strong>：《史記 · 卷129》 — https://zh.wikisource.org/wiki/史記/卷129</p></article></main></div></div>
