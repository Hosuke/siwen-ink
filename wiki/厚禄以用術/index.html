    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 厚祿以用術</nav></header><main><article><h1>厚祿以用術</h1><p>厚給俸祿，乃可以馭臣下之術。</p><p>厚祿以用術。欲馭臣下之術，必先厚給俸祿，使其無後顧之憂，然後可以繩之以法、約之以功也。</p><p><strong>所出</strong>：《韓非子 · 飭令》 — https://zh.wikisource.org/wiki/韓非子/飭令</p></article></main></div></div>
