    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 元藏幾</nav></header><main><article><h1>元藏幾</h1><p>隋處士泛海至滄洲，不火而返，已越二百年。</p><p>隋處士元藏幾，為海使判官，遇風船壞，破木載至洲島。人曰：「此乃滄洲，去國數萬里。洲方千里，花木常如三二月，人多不死。產分蒂瓜，長二尺，碧棗丹慄，皆大如梨。池中有四足魚，金蓮花，妇人採為首飾，日不戴金蓮花，不得在僊家。」</p><p>藏幾忽思中國，洲人製凌風蚵送之，激水如箭，旬日達東萊。問其國，乃唐。自大業至貞元，二百年矣。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 22》 — https://zh.wikisource.org/wiki/歷世真仙體道通鑑/22</p></article></main></div></div>
