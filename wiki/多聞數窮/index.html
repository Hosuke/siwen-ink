    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 多聞數窮</nav></header><main><article><h1>多聞數窮</h1><p>多言數窮，不如守中。</p><p>多聞者，博學而炫於外也。數窮者，困塞而無所施也。多言者喪，多聞者蔽，馳騖於外則失其內，故不如守中。守中者，守虛守靜，不逐於外也。[[虛而不屈]]，虛而能用，[[動而俞出]]，此乃道之真機也。</p><p><strong>所出</strong>：《老子 (帛書本) · 章五》 — https://zh.wikisource.org/wiki/老子 (帛書本)</p></article></main></div></div>
