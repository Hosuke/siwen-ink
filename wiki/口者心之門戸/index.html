    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 口者心之門戸</nav></header><main><article><h1>口者心之門戸</h1><p>口為心之門，心為神之主，志意喜欲皆由此出入。</p><p>口者，心之門戸也；心者，神之主也。志意、喜欲、思虑、智謀，此皆由門戸出入。故闗之以捭闘，制之以出入。</p><p><strong>所出</strong>：《鬼谷子 · 卷01》 — https://zh.wikisource.org/wiki/鬼谷子/卷01</p></article></main></div></div>
