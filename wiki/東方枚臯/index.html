    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 東方枚臯</nav></header><main><article><h1>東方枚臯</h1><p>東方朔與枚臯以俳辭為賦，無益規諷，自悔見視如倡。</p><p>東方朔與枚臯者，漢世辭賦家也。二人之賦，「餔糟啜醨」，辭淺而意俚，無所匡正。枚臯自稱為賦，而亦歸之俳優之列；見視如倡，亦有悔矣。[[文心雕龍 · 諧讔]]以此二人為諧辭之流弊，其本体不雅，其辭則易流於媟慢，然以其意在微諷，猶未全失焉。</p><p><strong>所出</strong>：《文心雕龍 · 諧讔》 — https://zh.wikisource.org/wiki/文心雕龍/諧讔</p></article></main></div></div>
