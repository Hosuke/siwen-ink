    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 克終允德</nav></header><main><article><h1>克終允德</h1><p>能終究其行，信實有德也。</p><p>太甲居桐宮而能思悟，伊尹乃以「克終允德」許之。言太甲此去桐宮，居憂守禮，痛自刻責，修德不回，是能全終其始終者也。允德者，信實之德也，非虛飾之謂。惟克終而允，故天下後世無得而議之；不然，始善而卒於中道，則前功盡棄矣。伊尹之望於君者深矣。</p><p><strong>所出</strong>：《尚書 · 太甲上》 — https://zh.wikisource.org/wiki/尚書/太甲上</p></article></main></div></div>
