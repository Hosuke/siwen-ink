    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 三皇步而五常驟，霸王以來，載馳載騖</nav></header><main><article><h1>三皇步而五常驟，霸王以來，載馳載騖</h1><p>世道日下，姦偽日繁，非嚴刑不能止姦</p><p>蓋三皇步而五常驟，霸王以來，載馳載騖。當其弊也，吏欺民巧，寇盜公行，髡鉗不足以懲無恥，族誅不能以禁覬覦。重目以廣視，累耳以遠聽，抗燭以理滯事，焦心以息奸源，而猶市朝有呼嗟之音，邊鄙有不聞之枉。</p><p><strong>所出</strong>：《抱朴子 · 卷14》 — https://zh.wikisource.org/wiki/抱朴子/外篇/卷14</p></article></main></div></div>
