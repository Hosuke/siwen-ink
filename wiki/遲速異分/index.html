    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 遲速異分</nav></header><main><article><h1>遲速異分</h1><p>人之才稟不同，為文遲速亦異，不可強求一律也。</p><p>劉勰列舉前代文士，以明遲速之殊。相如含筆腐毫，揚雄輟翰驚夢，桓譚疾感，王充氣竭，張衡研京以十年，左思練都以一紀：此數子者，用心甚苦，成篇甚遲，然皆成巨構。又淮南崇朝而賦騷，枚皋應詔而成賦，子建援牘如口誦，仲宣舉筆似宿搆，阮瑀據鞍而制書，禰衡當食而草奏：此數子者，思若泉涌，落筆立就。遲速雖殊，要皆資乎博練，非學淺才疎者所能竊冒也。</p><p><strong>所出</strong>：《文心雕龍 · 神思》 — https://zh.wikisource.org/wiki/文心雕龍/神思</p></article></main></div></div>
