    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 疏廟</nav></header><main><article><h1>疏廟</h1><p>亢星為天庭聽政之所，明大則輔臣忠、天下寧。</p><p>亢為疏廟。正義云聽政之所。其占：明大，則輔臣忠，天下寧；不然，則反是也。</p><p>其南北兩大星，曰南門。南門二星在庫樓南，天之外門。占：明則氐、羌貢；暗則諸夷叛；客星守之，外兵且至也。</p><p><strong>所出</strong>：《史記 · 卷027》 — https://zh.wikisource.org/wiki/史記/卷027</p></article></main></div></div>
