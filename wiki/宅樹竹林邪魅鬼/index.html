    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 宅樹竹林邪魅鬼</nav></header><main><article><h1>宅樹竹林邪魅鬼</h1><p>宅上有樹竹林為烏鳩止之邪魅</p><p>[[女青鬼律]]所記宅樹竹林邪魅鬼有二名：斧金木、和鎧鉀粗。經云：「右二鬼是人家宅上有樹或竹林，為烏鳩止，白鷺、群烏所依，此皆有邪魅。」</p><p>此鬼依樹竹林，以烏鳩、白鷺、群烏為象，其實皆邪魅。知其名，夕夕三呼之，鬼知人不可干，不過七日、九日，鬼自死。不煞鬼者，多暗中吹之，鬼伏住不害人。</p><p>蓋宅有樹竹，本為美事，然烏鳩止而白鷺、群烏所依，則有邪魅附焉。知其名則可辟之。</p><p><strong>所出</strong>：《女青鬼律 · 卷4》 — https://zh.wikisource.org/wiki/女青鬼律/卷4</p></article></main></div></div>
