    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 守身煉形術</nav></header><main><article><h1>守身煉形術</h1><p></p><p><strong>守身煉形術</strong>，道家內丹功法，以人身為鼎器，煉精氣神而為仙丹。抱朴子稱此為先師口訣，以韻文隱語傳授，不可輕泄。</p><p>其文曰：「始青之下月與日，兩半同昇合成一。出彼玉池入金室，大如彈丸黃如橘，中有嘉味甘如蜜，子能得之謹勿失。既往不追身將滅，純白之氣至微密，昇於幽關三曲折，中丹煌煌獨無匹，立之命門形不卒，淵乎妙矣難致詰。」</p><p>此詩所言，乃陰陽交媾之理：月（日）始青之下同昇合一，出玉池入金室，丹成黃橘，味甘如蜜。純白之氣升至幽關三折，立於命門。修成此術者，不畏萬鬼五兵，蓋形神俱妙之境也。</p><p>相關概念：[[形者生之舍]]、 [[真人]]、 [[服丹守一]]。</p></article></main></div></div>
