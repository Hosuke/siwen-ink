    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 可以為而未必能</nav></header><main><article><h1>可以為而未必能</h1><p>人有知善之質，未必皆有為善之實。</p><p>塗之人可以為禹則然，塗之人能為禹則未必然也。夫工匠、農、賈，未嘗不可以相為事也，然而未嘗能相為事也。可以而不可使也。故可以為，未必能也；雖不能，無害可以為。然則能不能之與可不可，其不同遠矣，其不可以相為明矣。小人可以為君子而不肯為君子，君子可以為小人而不肯為小人。此論[[知之與能之辨]]，[[言足以遷行者]]之別也。</p><p><strong>所出</strong>：《荀子 · 性惡篇》 — https://zh.wikisource.org/wiki/荀子/性惡篇</p></article></main></div></div>
