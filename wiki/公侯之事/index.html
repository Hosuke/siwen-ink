    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 公侯之事</nav></header><main><article><h1>公侯之事</h1><p>祭祀已故公侯之禮。</p><p>《采蘩》云「于以用之，公侯之事」，此「事」字所指，按《詩三家義集疏》，乃祭祀已去世之公侯之事，非生人之事也。</p><p>是詩言采蘩之所用，非為日常生活，乃為奉事鬼神、祭祀祖先之禮。夫人采白蒿於沼沚，以供祭祀公侯之職事，此「不失職」之義也。</p><p><strong>所出</strong>：《詩經 · 采蘩》 — https://zh.wikisource.org/wiki/詩經/采蘩</p></article></main></div></div>
