    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 借賊兵而齎盜糧</nav></header><main><article><h1>借賊兵而齎盜糧</h1><p>喻資敵以自害之謀。</p><p>范睢說秦昭王，論伐齊之失。齊湣王南攻楚，破軍殺將，然諸侯見齊之罷獘，起兵而伐齊，大破之。范睢以為：「攻齊所以大破者，以其伐楚而肥韓、魏也。此所謂[[借賊兵而齎盜糧]]者也。」言齊自損兵力，適以資敵，取禍之道也。</p><p><strong>所出</strong>：《史記 · 卷079》 — https://zh.wikisource.org/wiki/史記/卷079</p></article></main></div></div>
