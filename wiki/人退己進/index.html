    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 人退己進</nav></header><main><article><h1>人退己進</h1><p>人退己進者，陰子所以窮至道；敬卒若始者，羨門所以致雲龍。</p><p>若乃人退己進，陰子所以窮至道也；敬卒若始，羨門所以致雲龍也。我志誠堅，彼何人哉？</p><p><strong>所出</strong>：《抱朴子 · 卷13》 — https://zh.wikisource.org/wiki/抱朴子/卷13</p></article></main></div></div>
