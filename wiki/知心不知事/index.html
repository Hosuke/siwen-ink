    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 知心與知事</nav></header><main><article><h1>知心與知事</h1><p>崇侯知紂之惡而不知身之死，比干知君之亡而不知己之殃；智各偏也。</p><p>崇侯、惡來知不適紂之誅也，而不見武王之滅之也。比干、子胥知其君之必亡也，而不知身之死也。故曰：「崇侯、惡來知心而不知事，比干、子胥知事而不知心。」聖人其備矣。</p><p><strong>所出</strong>：《韓非子 · 說林下》 — https://zh.wikisource.org/wiki/韓非子/說林下</p></article></main></div></div>
