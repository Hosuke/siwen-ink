    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 塵飯涂羹</nav></header><main><article><h1>塵飯涂羹</h1><p>喻稱先王仁義而不能正國，可以戲而不可以為治</p><p>夫嬰兒相與戲也，以塵為飯，以塗為羹，以木為胾，然至日晚必歸饟者，塵飯涂羹可以戲而不可食也。夫稱上古之傳頌，辯而不愨，道先王仁義而不能正國者，此亦可以戲而不可以為治也。夫慕仁義而弱亂者，三晉也；不慕而治强者，秦也，然而未帝者，治未畢也。</p><p><strong>所出</strong>：《韓非子 · 外儲說左上》 — https://zh.wikisource.org/wiki/韓非子/外儲說左上</p></article></main></div></div>
