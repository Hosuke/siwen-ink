    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 器械各便其用</nav></header><main><article><h1>器械各便其用</h1><p>聖人創制器械，因時而便民用。</p><p>古者剡耜而耕，摩蜃而耨，木鉤而樵，抱甀而汲，民勞而利薄。後世為之耒耜耰鉏，斧柯而樵，桔皋而汲，民逸而利多焉。古者大川名谷，衝絕道路，不通往來也，乃為窬木方版，以為舟航，故地勢有無，得相委輸。乃為靻蹻而超千里，肩荷負儋之勤也，而作為之楺輪建輿，駕馬服牛，民以致遠而不勞。</p><p>聖人因民之所利而利之，器械之用，非泥古也，貴在因時而易，便其民用而已。</p><p><strong>所出</strong>：《淮南子 · 氾論訓》 — https://zh.wikisource.org/wiki/淮南子/氾論訓</p></article></main></div></div>
