    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 無名天地之始</nav></header><main><article><h1>無名天地之始</h1><p>道本無名，天地由此而始。</p><p>無名，天地之始；有名，萬物之母。</p><p>道之在天地未判之前，蕩無形兆，無名可命，是之謂無名。萬物由之以生，天地資之以成，而道未嘗自有其名也。此無名者，萬有之本原，造化之樞紐，視之不見其形，聽之不聞其聲，搏之不得其朕，要之不可以言名者也。老子欲人悟此無名之始，故以「無名」表道之體；以「有名」表道之為萬物母，此二者對待而立，非二物也，乃道之全體大用爾。</p><p><strong>所出</strong>：《道德經 (王弼本) · 一章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
