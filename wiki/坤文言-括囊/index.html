    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 坤文言　括囊之義</nav></header><main><article><h1>坤文言　括囊之義</h1><p>括囊慎謹，天地閉塞之時。</p><p>坤文言解六四「括囊」曰：「天地變化，草木蕃；天地閉，賢人隱。易曰：『括囊，无咎，无譽。』蓋言謹也。」</p><p>言天地通泰則萬物盛，天地閉塞則賢人隱。括囊者，非隱匿也，慎謹以全身遠害耳。</p><p><strong>所出</strong>：《周易 · 坤》 — https://zh.wikisource.org/wiki/周易/坤</p></article></main></div></div>
