    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 丁令威</nav></header><main><article><h1>丁令威</h1><p>遼束人，少學仙道，分身變化為鶴，集郡城華表柱而歌。</p><p>丁令威者，遼束人也。少隨師學得仙道分身，任意所欲。常鏨歸化為白鶴，集郡城門華表柱，言曰：「我是丁令威，去家千載，今來歸，城郭如舊人民非，何不學仙離冢景。」遂高飛衝天而去。夫左元放為羊，令威為鶴，斯並一時變化之邇，非永為羊鶴也。遼東諸丁譜載，令威漢初學道得仙。</p><p><strong>所出</strong>：《歷世真仙體道通鑑 · 11》 — https://zh.wikisource/wiki/歷世真仙體道通鑑/11</p></article></main></div></div>
