    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 巫像</nav></header><main><article><h1>巫像</h1><p>言巫享香火則鬼附之，像受人祀則神主之。</p><p>為巫者鬼必附之，設像者神必主之，蓋樂所響也。戎羯之禮，事母而不事父；禽獸之情，隨母而不隨父；凡人之痛，呼母而不呼父，蓋乳哺之教也。</p><p>虎狼不過於嗜肉，蛟龍不過於嗜血，而人無所不嗜。所以不足則鬬，不與則判，鼓天下之怨，激烈士之忿。食之道非細也。</p><p>言物各有所嗜，因其所嗜而致之，人之於食亦然，所以為治者當順其情而不可激之也。</p><p><strong>所出</strong>：《化書 · 卷五》 — https://zh.wikisource.org/wiki/化書/卷五</p></article></main></div></div>
