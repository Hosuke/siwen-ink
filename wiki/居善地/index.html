    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 居善地</nav></header><main><article><h1>居善地</h1><p>君子居若水之處下，因物之自然而無私焉。</p><p>居善地，心善淵，與善仁，言善信，正善治，事善能，動善時。</p><p>水性就下，聖人法之，居眾人之所惡，[[水善利萬物而不爭]]。地之卑者莫若下，聖人居高而自卑，居物之下而無怨，心淵不可測，與人無私，[[言善信]]，政清如水，[[事善能]]，動合乎時。皆本於不爭，水之德也。</p><p><strong>所出</strong>：《道德經 (王弼本) · 八章》 — https://zh.wikisource.org/wiki/道德經 (王弼本)</p></article></main></div></div>
