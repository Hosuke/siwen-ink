    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 滌堊之地</nav></header><main><article><h1>滌堊之地</h1><p>器必滌而後潔，人必飾而後非寡；行身亦然，無滌堊之地則寡非。</p><p>宫有堊，器有滌，則潔矣。行身亦然，無滌堊之地則寡非矣。</p><p><strong>所出</strong>：《韓非子 · 說林下》 — https://zh.wikisource.org/wiki/韓非子/說林下</p></article></main></div></div>
