    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 論如析薪，貴能破理</nav></header><main><article><h1>論如析薪，貴能破理</h1><p>論之為文，譬如劈柴，貴在順循紋理而破之。</p><p>是以論如析薪，貴能破理。斤利者，越理而橫斷，辭辨者，反義而取通；覽文雖巧，而檢跡知妄。[[義貴圓通辭忌枝碎|義貴圓通]]，則論理當順其自然而暢達；[[辭忌枝碎]]，則行文當簡要而一貫。析薪者，依木理而劈之，則薪裂而用廣；論亦如之，必順義理之自然，而後可以折服人心。</p><p><strong>所出</strong>：《文心雕龍 · 論說》 — https://zh.wikisource.org/wiki/文心雕龍/論說</p></article></main></div></div>
