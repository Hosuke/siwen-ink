    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 生黃鐘術</nav></header><main><article><h1>生黃鐘術</h1><p>以下生上生之法定黃鐘九寸之長，聲始於宮窮於角，數始於一終於十成於三。</p><p>生黃鐘術曰：以下生者，倍其實，三其法。以上生者，四其實，三其法。上九，商八，羽七，角六，宮五，徵九。置一而九三之以為法。實如法，得長一寸。凡得九寸，命曰「黃鐘之宮」。故曰：音始於宮，窮於角；數始於一，終於十，成於三；氣始於冬至，周而復生。</p><p>三分損益，以下生上，倍實而三除之；以上生下，四實而三除之。自一寸遞加九倍，得九寸，是為黃鐘之宮。此聲音、數、氣之根本也。</p><p><strong>所出</strong>：《史記 · 卷025》 — https://zh.wikisource.org/wiki/史記/卷025</p></article></main></div></div>
