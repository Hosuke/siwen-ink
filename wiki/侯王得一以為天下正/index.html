    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 侯王得一以為天下正</nav></header><main><article><h1>侯王得一以為天下正</h1><p>侯王失一則蹶，以明為政恃道、賤為本之旨。</p><p>帛書本言：「侯王得一以為天下<strong>正</strong>，謂侯王毋已貴以高將恐<strong>蹶</strong>。」</p><p>侯王之所以為<strong>天下正</strong>者，以其得<strong>一</strong>也。正者，法也，侯王法道則天下治。毋已貴以高者，守貴而遺一，是失道之貴，非侯王之正也。貴而不一，<strong>蹶</strong>必隨之。</p><p>是以[[貴以賤為本]]，侯王自稱[[孤寡不穀]]，不敢躐居致數。貴而不驕、處下以為基，乃長守之道也。見[[昔之得一]]。</p><p><strong>所出</strong>：《老子 (帛書校勘版) · 第二章 得一》 — https://zh.wikisource.org/wiki/老子 (帛書校勘版)</p></article></main></div></div>
