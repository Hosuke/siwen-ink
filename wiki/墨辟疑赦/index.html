    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 墨辟疑赦</nav></header><main><article><h1>墨辟疑赦</h1><p>五刑有疑，皆許贖赦，以寬罪疑。</p><p>辟者，五刑之刑也。五刑皆有疑贖之制，使罪之未著者得免於刑。閱實其罪者，核其實情也。</p><p><strong>所出</strong>：《尚書 · 呂刑》 — https://zh.wikisource.org/wiki/尚書/呂刑</p></article></main></div></div>
