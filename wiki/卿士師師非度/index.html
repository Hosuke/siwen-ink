    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 卿士師師非度</nav></header><main><article><h1>卿士師師非度</h1><p>官師相循，不守法度，政刑紊亂</p><p>殷之亡也，在位之卿士皆非其人，相師師而非法度。微子曰：「卿士師師非度，凡有辜罪，乃罔恒獲。」蓋百官皆師師相效，不循法度，有罪者不得而糾之。父師亦言：「咈其耇長、舊有位人。」老成去位，讒諂並進，政由是亂。是以小民相仇，敵讎日起，殷之淪喪，無足怪也。</p><p><strong>所出</strong>：《尚書 · 微子》 — https://zh.wikisource.org/wiki/尚書/微子</p></article></main></div></div>
