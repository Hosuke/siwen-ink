    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 同仇</nav></header><main><article><h1>同仇</h1><p>敵愾同仇，義不獨生，共赴國難。</p><p>《秦風·無衣》：「王於興師，脩我戈矛，與子同仇。」</p><p>同仇者，敵王所忾之謂也。秦人聞天子之命而起師，脩治兵戈，以與同志之人共當仇敵。言外見其不待號令而自集，不待勉厲而自奮，蓋秦之俗尚武如此。然詩刺其君之好攻戰，則所刺者不在「同仇」之義，而在「王於興師」之非義也。</p><p><strong>所出</strong>：《詩經 · 無衣》 — https://zh.wikisource.org/wiki/詩經/無衣</p></article></main></div></div>
