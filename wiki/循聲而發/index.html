    <div id="root"><div data-prerender><header><nav><a href="/">斯文</a> › <a href="/wiki/">辭林</a> › 循聲而發</nav></header><main><article><h1>循聲而發</h1><p>射者循聲而發，發不失正鵠，此唯賢者能之。</p><p>孔子曰：「射者何以射？何以聽？循聲而發，發而不失正鵠者，其唯賢者乎？若夫不肖之人，則彼將安能以中？」《詩》云：「發彼有的，以祈爾爵。」祈，求也，求中以辭爵也。酒者，所以養老也，所以養病也。求中以辭爵者，辭養也。</p><p><strong>所出</strong>：《禮記 · 射義》 — https://zh.wikisource.org/wiki/禮記/射義</p></article></main></div></div>
